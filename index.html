without dropping them or spilling their contents. We incorporate this approach into an interactive robot waiter demonstration, which uses computer vision and visual servoing to steer toward a person with a raised hand to serve them.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://arxiv.org/abs/2606.10039\">Paper<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"qfsmncdh9lu\">If you’re going to make robots wear skirts or shorts or pants, you have to give them butts, or it’s just not going to work. That is all.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://techshare.co.jp/product/unitree/g1/\">TechShare<\/a> ] via [ <a href=\"https://www.youtube.com/@KazumichiMoriyama\">Kazumichi Moriyama<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"kfy7d-qiyjw\"><em>It’s Los Alamos, so of course we have robots. Some work inside gloveboxes, while others probe unexploded ordnance in the field and aid with repetitive lifting, Doc Ock–style. Legend has it there’s a fro-yo robot in the cafeteria.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.lanl.gov/media/publications/national-security-science/1224-sniffing-out-radiation\">LANL<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"8aiznj4cciu\">Here are a couple of talks from the recent Humanoids Summit in Japan, from Ali Agha of FieldAI as well as Hiroshi Ishiguro.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p class=\"shortcode-media shortcode-media-youtube\"> <span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span> <\/p><p>[ <a href=\"https://humanoidssummit.com/agenda-2\">Humanoids Summit<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div>"}, {"title": "Blattner awards Built Robotics $75M contract for physical AI to help meet energy demand", "source": "Robotics Business Review", "date": "2026-07-02", "url": "https://www.therobotreport.com/blattner-awards-built-robotics-75m-contract-meet-energy-demands/", "summary": "<p>Blattner has expanded its partnership with Built Robotics to scale autonomous systems for solar construction.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/blattner-awards-built-robotics-75m-contract-meet-energy-demands/\">Blattner awards Built Robotics $75M contract for physical AI to help meet energy demand<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Why you should combine robot dexterity with mechanical positioning for complex assembly operations", "source": "Robotics Business Review", "date": "2026-07-02", "url": "https://www.therobotreport.com/why-you-should-combine-robot-dexterity-with-mechanical-positioning-for-complex-assembly-operations/", "summary": "<p>Experts are recognizing the importance of mechanical positioning and its impact on the machine’s mobility, range and speed.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/why-you-should-combine-robot-dexterity-with-mechanical-positioning-for-complex-assembly-operations/\">Why you should combine robot dexterity with mechanical positioning for complex assembly operations<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Luxonis closes Series A round to scale physical AI perception layer", "source": "Robotics Business Review", "date": "2026-07-02", "url": "https://www.therobotreport.com/luxonis-closes-series-a-round-to-scale-physical-ai-perception-layer/", "summary": "<p>Luxonis said it plans to scale production of its OAK camera and refine its platform to support robotics and industrial automation. <\/p>\n<p>The post <a href=\"https://www.therobotreport.com/luxonis-closes-series-a-round-to-scale-physical-ai-perception-layer/\">Luxonis closes Series A round to scale physical AI perception layer<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}], "embeddedNews": [{"title": "Energizing a Vacuum Tube Flip-Flop Module of the IBM 604", "source": "Hackaday", "date": "2026-08-03", "url": "https://hackaday.com/2026/08/03/energizing-a-vacuum-tube-flip-flop-module-of-the-ibm-604/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"197\" src=\"https://hackaday.com/wp-content/uploads/2026/07/ibm-tr3-module.jpg?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>Taking a break from ogling microscopic features in Intel&#8217;s semiconductor processors, [Ken Shirriff] is back to instead poking at decidedly macroscopic pluggable modules from the 1948 IBM 604 Electronic Calculator. <a class=\"read-more\" href=\"https://hackaday.com/2026/08/03/energizing-a-vacuum-tube-flip-flop-module-of-the-ibm-604/\">&#8230;read more<\/a>"}, {"title": "Circuit Bending, But Make It MIDI", "source": "Hackaday", "date": "2026-08-03", "url": "https://hackaday.com/2026/08/03/circuit-bending-but-make-it-midi/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"450\" src=\"https://hackaday.com/wp-content/uploads/2026/08/Introducing-MIDI-To-Circuit-Bending-10-5-screenshot-1.png?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>Circuit bending is a chaotic art. At its simplest, it can just involve making connections between random points on a circuit board to create weird sounds in musical hardware. Or, <a class=\"read-more\" href=\"https://hackaday.com/2026/08/03/circuit-bending-but-make-it-midi/\">&#8230;read more<\/a>"}, {"title": "Child-Friendly Music Player Uses RFID", "source": "Hackaday", "date": "2026-08-03", "url": "https://hackaday.com/2026/08/03/child-friendly-music-player-uses-rfid/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"451\" src=\"https://hackaday.com/wp-content/uploads/2026/07/mememe_munecos.Dj2rwg9o_Z20dDLt-e1785557184513.webp?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>[David] has a young child who is clever enough to use a computer to play music, but he doesn&#8217;t quite want to hand over the mouse just yet. Thus, he <a class=\"read-more\" href=\"https://hackaday.com/2026/08/03/child-friendly-music-player-uses-rfid/\">&#8230;read more<\/a>"}, {"title": "Congratulations to the Frikkin Laser Winners!", "source": "Hackaday", "date": "2026-08-03", "url": "https://hackaday.com/2026/08/03/congratulations-to-the-frikkin-laser-winners/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"484\" src=\"https://hackaday.com/wp-content/uploads/2026/05/Lasers.jpg?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>Apparently you all love lasers just as much as we do. We put out a challenge to use, build, or otherwise abuse our favorite coherent light sources, and you responded. <a class=\"read-more\" href=\"https://hackaday.com/2026/08/03/congratulations-to-the-frikkin-laser-winners/\">&#8230;read more<\/a>"}, {"title": "New File Manager is C64’s Answer to Norton Commander", "source": "Hackaday", "date": "2026-08-03", "url": "https://hackaday.com/2026/08/03/new-file-manager-is-c64s-answer-to-norton-commander/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"413\" src=\"https://hackaday.com/wp-content/uploads/2026/07/mfcwt_feat.png?w=722\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"722\" /><\/div>Norton was always a PC company &#8212; Norton Commander, the file manager that launched a thousand clones, was only ever available for DOS, like the rest of the company&#8217;s offerings <a class=\"read-more\" href=\"https://hackaday.com/2026/08/03/new-file-manager-is-c64s-answer-to-norton-commander/\">&#8230;read more<\/a>"}, {"title": "The 16K Display that Ate Las Vegas", "source": "Hackaday", "date": "2026-08-03", "url": "https://hackaday.com/2026/08/03/the-16k-display-that-ate-las-vegas/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"484\" src=\"https://hackaday.com/wp-content/uploads/2026/07/Sphere.jpg?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>You may have a 4K television. Perhaps you have even bought an 8K screen, despite the shortage of things worth watching in 8K. A 16K display is, today, a rarity. <a class=\"read-more\" href=\"https://hackaday.com/2026/08/03/the-16k-display-that-ate-las-vegas/\">&#8230;read more<\/a>"}, {"title": "Get a Remote Terminal With One Binary, One URL, and Zero Config", "source": "Hackaday", "date": "2026-08-03", "url": "https://hackaday.com/2026/08/03/get-a-remote-terminal-with-one-binary-one-url-and-zero-config/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"450\" src=\"https://hackaday.com/wp-content/uploads/2026/07/reach-machines-behind-nat-from-a-browser-v0-banner.png?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>Launch a single static binary executable, send someone a QR code or URL (or failing that, text a numerical code or shout it across a room), and they&#8217;ll get an <a class=\"read-more\" href=\"https://hackaday.com/2026/08/03/get-a-remote-terminal-with-one-binary-one-url-and-zero-config/\">&#8230;read more<\/a>"}, {"title": "ChronoWatch X2040 – A DIY watch with off-the-shelf Raspberry Pi RP2040 round display, 3D printed case, and custom firmware", "source": "CNX Software", "date": "2026-08-03", "url": "https://www.cnx-software.com/2026/08/03/chronowatch-x2040-a-diy-watch-with-off-the-shelf-raspberry-pi-rp2040-round-display-3d-printed-case-and-custom-firmware/", "summary": "<div><img alt=\"Raspberry Pi RP2040 watch\" class=\"attachment-medium size-medium wp-post-image\" height=\"491\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/08/Raspberry-Pi-RP2040-watch-720x491.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>If you&#8217;ve ever wanted to build your own watch, the ChronoWatch X2040 DIY watch allows you to do it the easy way with a Waveshare RP2040-Touch-LCD-1.28 touch LCD board, a 3D-printed case, a 3.7V LiPo battery, a few screws, and firmware using the Pico C/C++ SDK. When Vishal Soni decided he wanted to build a watch, he initially planned to design a custom board, but since there are already several round LCD boards based on Raspberry Pi RP2040 MCU, he went with a Waveshare board, preferring to spend more time on firmware programming. ChronoWatch X2040 parts: Waveshare RP2040-Touch-LCD-1.28 with Raspberry Pi RP2040 MCU and 1.28-inch round touch display &#8211; About $23 to $29 on Amazon, AliExpress, or the Waveshare store. 3D printed case designed with Tinkercad 3.7V 950mAh Lipo battery (35 x 25 x 10 mm) M2 4mm screw M2 heat inserts 2-pin MX1.25 connector 1mm heat shrink sleeve tube [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/08/03/chronowatch-x2040-a-diy-watch-with-off-the-shelf-raspberry-pi-rp2040-round-display-3d-printed-case-and-custom-firmware/\">ChronoWatch X2040 &#8211; A DIY watch with off-the-shelf Raspberry Pi RP2040 round display, 3D printed case, and custom firmware<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "28.9M-parameter LLM runs locally on ESP32-S3 at 9 tokens/s", "source": "CNX Software", "date": "2026-08-03", "url": "https://www.cnx-software.com/2026/08/03/28-9m-parameter-llm-runs-locally-on-esp32-s3-at-9-tokens-s/", "summary": "<div><img alt=\"ESP32-S3 local LLM\" class=\"attachment-medium size-medium wp-post-image\" height=\"451\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/08/ESP32-S3-local-LLM-720x451.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Slava S. (slvDev) has optimized a 28.9M-parameter LLM running locally on an ESP32-S3 development board at around 9 tokens/s while generating text, or more exactly, telling short stories. We&#8217;ve written about LLMs and ESP32 in the past, but usually the boards are used as low-power gateways to interact with online LLMs hosted on powerful servers in data centers. Such products or projects include HiWonderLLM &#8220;smart chat module&#8221;, the ESP-Claw framework, or the ESP32 Agent Dev Kit. Slava&#8217;s &#8220;esp32-ai&#8221; project is quite different, as everything runs on the ESP32-S3 microcontroller. This won&#8217;t work on all ESP32-S3 as you&#8217;ll need enough memory and storage to store the 14.9MB (4-bit) model file, and Slava tested his demo on an ~$8 ESP32-S3 board with 512KB SRAM+8MB SPRAM and 16MB flash connected to a small I2C display to display short stories. Dave Bennett already did something similar with the ESP32-LLM project, but it only relied [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/08/03/28-9m-parameter-llm-runs-locally-on-esp32-s3-at-9-tokens-s/\">28.9M-parameter LLM runs locally on ESP32-S3 at 9 tokens/s<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "$299.99 ASUS UGen300 USB AI accelerator combines 40 TOPS Hailo-10H chip with 8GB LPDDR4", "source": "CNX Software", "date": "2026-08-03", "url": "https://www.cnx-software.com/2026/08/03/299-99-asus-ugen300-usb-ai-accelerator-hailo-10h-8gb-lpddr4/", "summary": "<div><img alt=\"ASUS UGen300 USB AI Accelerator\" class=\"attachment-medium size-medium wp-post-image\" height=\"463\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/08/ASUS-UGen300-USB-AI-Accelerator-720x463.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>ASUS UGen300 USB AI accelerator features a 40 TOPS Hailo-10H AI processor and 8GB of LPDDR4 memory to support large language models (LLMs), vision language models (VLMs), and AI vision workloads while consuming less than 2.5 Watts. In some ways, the hardware is similar to the Raspberry Pi AI HAT+ 2, but in a slim dongle form factor (105 x 50 x 18mm) and a 10 Gbps USB 3.2 Gen1 USB-C Type-C port instead of a 5 or 8 GT/s PCIe interface. ASUS UGen300 USB AI accelerator (UGen300-USB-8G) specifications: AI accelerator – Hailo Hailo-10H delivering up to 40 TOPS (INT4) or 20 TOPS (INT8) inferencing performance Memory &#8211; 8GB LPDDR4 @ 4266 MT/s Host interface &#8211; USB 3.1 Gen2 (10 Gbps) Type-C port Power Supply &#8211; 5V via USB-C port Power Consumption &#8211; 2.5 Watts (typical) Dimensions – 105 x 50 x 18 mm Weight &#8211; 145 grams ASUS says the [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/08/03/299-99-asus-ugen300-usb-ai-accelerator-hailo-10h-8gb-lpddr4/\">$299.99 ASUS UGen300 USB AI accelerator combines 40 TOPS Hailo-10H chip with 8GB LPDDR4<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Aliensense NXS is a plug-and-play GMSL 2/3 and CAN-FD sensor board for robots", "source": "CNX Software", "date": "2026-08-03", "url": "https://www.cnx-software.com/2026/08/03/aliensense-nxs-plug-and-play-gmsl-2-3-and-can-fd-sensor-board-for-robots/", "summary": "<div><img alt=\"Aliensense NXS sensor board for robots\" class=\"attachment-medium size-medium wp-post-image\" height=\"475\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/08/Aliensense-NXS-sensor-board-for-robots-720x475.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Abu Dhabi-based Aliensense has introduced NXS, a compact sensor board designed to easily connect cameras and sensors to robots, without custom wiring or driver work. The board relies on a single GMSL 2/3 cable for power, video, and sensor data over up to 15 meters, extendable to 40 meters over CAN-FD (data only, reduced baudrate). The STM32G491 board is also compatible with the 2,000+ boards in MikroElektronika&#8217;s Click ecosystem thanks to a mikroBUS connector brought out through a Shuttle add-on board. This means you can use compatible sensors (via mikroBUS) in addition to, or instead of, a camera. NXS specifications: MCU &#8211; STMicro STM32G491 Cortex-M4F microcontroller with 112KB SRAM, up to 512KB flash Camera Interface &#8211; MIPI CSI-2 input, MAX96793 GMSL2/3 serializer, power-over-coax Connectivity &#8211; GMSL2/3, CAN-FD, Cyphal/serial, I2C register map Expansion &#8211; mikroBUS socket with I2C, SPI, UART, PWM, analog, INT, RST Recovery support &#8211; Signed A/B firmware, watchdog [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/08/03/aliensense-nxs-plug-and-play-gmsl-2-3-and-can-fd-sensor-board-for-robots/\">Aliensense NXS is a plug-and-play GMSL 2/3 and CAN-FD sensor board for robots<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Before you buy that TV streaming stick", "source": "Adafruit", "date": "2026-08-03", "url": "https://blog.adafruit.com/2026/08/03/before-you-buy-that-tv-streaming-stick/", "summary": "Krebs on Security writes that security experts have been sounding the alarm for years about the risks of using generic TV boxes that promise unlimited content streaming for a one-time fee, warning that they secretly rent the user’s Internet connection out to strangers. But a groundbreaking new analysis finds these devices also routinely spoof themselves [&#8230;]"}, {"title": "The world’s first watch featuring computer functions", "source": "Adafruit", "date": "2026-08-03", "url": "https://blog.adafruit.com/2026/08/03/the-worlds-first-watch-featuring-computer-functions/", "summary": "The world&#8217;s first wrist computer system, released in 1984, consisted of a Seiko watch part and a separate “controller” console with a built-in printer. The user could input BASIC programing with a keyboard (sold separately) and enjoy playing games. It also included a memo function, a telephone directory, an address book, and a scheduling function. [&#8230;]"}, {"title": "Rooting the TP-Link TL-841N router", "source": "Adafruit", "date": "2026-08-03", "url": "https://blog.adafruit.com/2026/08/03/rooting-the-tp-link-tl-841n-router/", "summary": "A nice hands-on hardware hacking write-up making the rounds on Hacker News. The author picked up a bottom-of-the-line $10 TP-Link TL-841N (EU) off Facebook Marketplace specifically to practice the full end-to-end process of tearing into an IoT device: locating the UART, getting a root shell, and extracting firmware. The interesting part is that the firmware [&#8230;]"}, {"title": "Zephyr on Raspberry Pi Zero 2W bare metal", "source": "Adafruit", "date": "2026-08-03", "url": "https://blog.adafruit.com/2026/08/03/zephyr-on-raspberry-pi-zero-2w-bare-metal/", "summary": "Jonathan Elliot Peace has posted a Zephyr fork with board support for the Raspberry Pi Zero 2 W, a 26-file commit adding about 1,300 lines. The Zero 2 W runs a Broadcom BCM2710A1, the same silicon as the original Pi 3, packaged in an RP3A0-AU SiP with 512MB of LPDDR2. Zephyr boots it single-core with [&#8230;]"}, {"title": "BITNET – an autoregressive language model on the 6502 processor", "source": "Adafruit", "date": "2026-08-03", "url": "https://blog.adafruit.com/2026/08/03/bitnet-an-autoregressive-language-model-on-the-6502-processor/", "summary": "Matt Beton trained a tiny Mamba-based autoregressive language model and wrote an inference engine to run it on the 8-bit 6502 processor (from 1975, with 32KB RAM). The MOS 6502 is an 8-bit microprocessor released in 1975, powering the BBC Micro and the Apple II. I am lucky enough to have access to my dad&#8217;s [&#8230;]"}, {"title": "ICYMI – Adafruit IoT Monthly: Battery-Powered Sun Tracking, Mapping Data Centers, and more!", "source": "Adafruit", "date": "2026-08-03", "url": "https://blog.adafruit.com/2026/08/03/icymi-adafruit-iot-monthly-battery-powered-sun-tracking-mapping-data-centers-and-more/", "summary": "ICYMI (In case you missed it) – the IoT Monthly Newsletter from AdafruitDaily.com went out this morning! If you missed it, subscribe now! – You’ll get one newsletter each month. The next newsletter will be out in a month, and being subscribed is the best way to keep up with all things Internet of Things. There is no spam, no selling lists, and [&#8230;]"}, {"title": "MeshDiff: see exactly what changed between two 3D models", "source": "Adafruit", "date": "2026-08-03", "url": "https://blog.adafruit.com/2026/08/03/meshdiff-see-exactly-what-changed-between-two-3d-models/", "summary": "Version control for 3D models has always been awkward, since a diff of two binary STLs tells you nothing useful. Meshdiff is a free browser-based tool that does the job properly, comparing two versions of a model and showing added material, removed material, and dimensional drift using voxel and surface-heatmap diffing. It handles STL, 3MF, [&#8230;]"}, {"title": "TinyNES – A Niche NES Console", "source": "Adafruit", "date": "2026-08-03", "url": "https://blog.adafruit.com/2026/08/03/tinynes-a-niche-nes-console/", "summary": "Lon Seidman reviews the TinyNES, an open-source Nintendo Entertainment System. What sets this apart from other NES clones is how it combines original hardware and open source design. If you are looking for an authentic NES experience, the TinyNES might be for you. What it uses from the original NES are the CPU and PPU [&#8230;]"}, {"title": "Evolution of Microphones at the BBC up through 1972", "source": "Adafruit", "date": "2026-08-03", "url": "https://blog.adafruit.com/2026/08/03/evolution-of-microphones-at-the-bbc-up-through-1972/", "summary": "We really enjoyed this video from the BBC Archive about the microphones he BBC employed in the earliest broadcasts. Via BBC Archives on YouTube: Veteran BBC radio broadcaster John Snagge &#8211; who first broadcast for the BBC in 1927 &#8211; discusses how microphones evolved throughout his career. Mr Snagge recalls the bulky &#8216;meat safe&#8217; microphones [&#8230;]"}, {"title": "Audio Prank Gift Box #AdafruitLearnSystem", "source": "Adafruit", "date": "2026-08-03", "url": "https://blog.adafruit.com/2026/08/03/audio-prank-gift-box-adafruitlearnsystem/", "summary": "What&#8217;s in that gift?! Here&#8217;s a fun and easy way to creatively mislead your next gift recipient with motion-activated sound effects! Use the Adafruit Audio FX board and a vibration switch to make this simple (and reusable) circuit. Before you begin please read: Adafruit Audio FX Sound Board Adafruit Guide to Excellent Soldering The Adafruit [&#8230;]"}, {"title": "Building a palm-size ESP32 robot for a child", "source": "Adafruit", "date": "2026-08-03", "url": "https://blog.adafruit.com/2026/08/03/building-a-palm-size-esp32-robot-for-a-child/", "summary": "Carl Bugeja wanted to build a tiny robot for his son to play with. After reiterating the design, the result was the ProtoBot. Designed for anyone excited about building robots! Bring your bot to life using the build-guide, then control it with your phone, automate it, or even customize with open-source examples. This FlexPCB took [&#8230;]"}, {"title": "CheapSecurity: A self-hosted CCTV system for Linux computers", "source": "Adafruit", "date": "2026-08-03", "url": "https://blog.adafruit.com/2026/08/03/cheapsecurity-a-self-hosted-cctv-system-for-linux-computers/", "summary": "If you&#8217;ve got a spare single-board computer and a USB webcam sitting in a drawer, CheapSecurity from Giuseppe Marco Randazzo turns them into a full home surveillance setup with no cloud subscription attached. The whole premise is data sovereignty: footage stays local, on storage you control, with retention policies you set. It runs on Raspberry [&#8230;]"}, {"title": "Renesas Gen 3 MRDIMM Chipset Solutions Advance DDR5 Memory Performance to 16,000 MT/s for Next-Gen AI and HPC Applications", "source": "EE Journal", "date": "2026-08-03", "url": "https://www.eejournal.com/industry_news/renesas-gen-3-mrdimm-chipset-solutions-advance-ddr5-memory-performance-to-16000-mt-s-for-next-gen-ai-and-hpc-applications-2/", "summary": "Renesas Electronics Corporation (TSE: 6723), a premier supplier of advanced semiconductor solutions, today announced its third‑generation (Gen 3) DDR5 Multiplexed Rank Dual In‑Line Memory Module (MRDIMM) chipset solutions, delivering DDR5 server-class MRDIMM speeds up to 16,000 mega transfers per second (MT/s). The new solutions are designed to address the growing demand for higher memory bandwidth driven by artificial &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/renesas-gen-3-mrdimm-chipset-solutions-advance-ddr5-memory-performance-to-16000-mt-s-for-next-gen-ai-and-hpc-applications-2/\">Read More &#8594;<span class=\"screen-reader-text\"> \"Renesas Gen 3 MRDIMM Chipset Solutions Advance DDR5 Memory Performance to 16,000 MT/s for Next-Gen AI and HPC Applications\"<\/span><\/a>"}, {"title": "Infineon SEMPER™ NOR Flash Memory strengthens data‑center server management; qualified for ASPEED AST2700 BMCs", "source": "EE Journal", "date": "2026-08-03", "url": "https://www.eejournal.com/industry_news/infineon-semper-nor-flash-memory-strengthens-data-center-server-management-qualified-for-aspeed-ast2700-bmcs/", "summary": "Infineon Technologies AG (FSE: IFX / OTCQX: IFNNY) announced that its SEMPER™ NOR Flash Memory has been qualified for ASPEED Technology’s AST2700 Baseboard Management Controller (BMC) and is now included in the AST2700 Approved Vendor List (AVL). As firmware storage for the BMC, the SEMPER NOR Flash supports the server management infrastructure that enables resilient, &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/infineon-semper-nor-flash-memory-strengthens-data-center-server-management-qualified-for-aspeed-ast2700-bmcs/\">Read More &#8594;<span class=\"screen-reader-text\"> \"Infineon SEMPER™ NOR Flash Memory strengthens data‑center server management; qualified for ASPEED AST2700 BMCs\"<\/span><\/a>"}, {"title": "AccelerComm Powers Eclipse Space’s 5G Physical Layer for Sovereign Satellite Constellations", "source": "EE Journal", "date": "2026-08-03", "url": "https://www.eejournal.com/industry_news/accelercomm-powers-eclipse-spaces-5g-physical-layer-for-sovereign-satellite-constellations/", "summary": "AccelerComm, a leading provider of high-performance physical layer solutions for 5G non-terrestrial networks (NTN), today announced the successful completion of two engineering engagements with Eclipse Space, a sovereign satellite infrastructure company founded by veterans of the Starlink program. Across the two successive engagements, AccelerComm supported Eclipse in defining the physical-layer architecture for its next-generation spacecraft, &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/accelercomm-powers-eclipse-spaces-5g-physical-layer-for-sovereign-satellite-constellations/\">Read More &#8594;<span class=\"screen-reader-text\"> \"AccelerComm Powers Eclipse Space’s 5G Physical Layer for Sovereign Satellite Constellations\"<\/span><\/a>"}, {"title": "STMicroelectronics’ new galvanically isolated gate drivers simplify power design with advanced isolation", "source": "EE Journal", "date": "2026-08-03", "url": "https://www.eejournal.com/industry_news/stmicroelectronics-new-galvanically-isolated-gate-drivers-simplify-power-design-with-advanced-isolation/", "summary": "STMicroelectronics has extended the STGAP3S family of gate drivers that feature enhanced galvanic isolation for greater reliability, introducing an efficient and economical 3A series for circuits that need lower drive current. The new STGAP3S3S is optimized for silicon carbide (SiC) MOSFETs, while the STGAP3S3IF is suited to IGBTs. All STGAP3S drivers work with high-voltage rails up to 1200V in circuits such &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/stmicroelectronics-new-galvanically-isolated-gate-drivers-simplify-power-design-with-advanced-isolation/\">Read More &#8594;<span class=\"screen-reader-text\"> \"STMicroelectronics’ new galvanically isolated gate drivers simplify power design with advanced isolation\"<\/span><\/a>"}, {"title": "Mysterious Frequency Counter Twins from 1979", "source": "EE Journal", "date": "2026-08-03", "url": "https://www.eejournal.com/article/mysterious-frequency-counter-twins-from-1979/", "summary": "<img alt=\"\" class=\"webfeedsFeaturedVisual wp-post-image\" height=\"187\" src=\"https://www.eejournal.com/wp-content/uploads/2026/08/TR1000-eBay-Listing-Image-Small-300x187.jpg\" style=\"display: block; margin-bottom: 5px; clear: both;\" width=\"300\" />After repairing and upgrading two Heathkit IM-2420 frequency counters and two HP 5314A frequency counters, I have developed a deep obsession with these instruments. When a Trionyx TR-1000 counter appeared on eBay for $11 (plus $16 for tax and shipping), I snapped it up despite its obviously rough shape. The small form factor and industrial &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/article/mysterious-frequency-counter-twins-from-1979/\">Read More &#8594;<span class=\"screen-reader-text\"> \"Mysterious Frequency Counter Twins from 1979\"<\/span><\/a>"}, {"title": "Play games with your brain signals using Octopus 16 wireless EEG device", "source": "CNX Software", "date": "2026-08-02", "url": "https://www.cnx-software.com/2026/08/02/play-games-with-your-brain-signals-using-octopus-16-wireless-eeg-device/", "summary": "<div><img alt=\"Octopus 16 biosignal device for gaming\" class=\"attachment-medium size-medium wp-post-image\" height=\"388\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/08/Octopus-16-biosignal-device-for-gaming-720x388.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Octopus 16 is a wireless biosignal HID device for the XIAO ESP32-S3 board designed to let users play computer games using brain signals (EEG) with no hands (or implants) needed. The board packs 16 electrodes to measure biosignals, including EEG (electroencephalography), EMG (electromyography), and ECG (electrocardiography), and the coin-sized device is much more compact than other brain-computer interface (BCI) solutions, which typically require a cap kit with 8 to 16 electrodes and wires. Octopus 16 specifications: ADC &#8211; 2x Texas Instruments ADS131M08 24-bit, 8-channel, simultaneous-sampling, delta-sigma (ΔΣ) analog-to-digital converters Channels &#8211; 16x 24-bit channels (8x per ADC) Programmable gain (PGA) &#8211; x1 to x128 (set in firmware; default gain register 0x2222) Input high-pass / DC block &#8211; Integrated ADC DC-block filter enabled (≈ &#62;1 Hz) Host interface (to XIAO board) &#8211; Power + SPI via 2x 7-pin Brain interface 18x spring-loaded pogo pins 16x electrodes 1x  reference (AINREF) 1x Ground [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/08/02/play-games-with-your-brain-signals-using-octopus-16-wireless-eeg-device/\">Play games with your brain signals using Octopus 16 wireless EEG device<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Creality Falcon T1 review – A 5-in-1 modular laser engraver tested with 20W fiber and 40W diode laser modules", "source": "CNX Software", "date": "2026-08-01", "url": "https://www.cnx-software.com/2026/08/01/creality-falcon-t1-review-a-5-in-1-modular-laser-engraver-tested-with-20w-fiber-and-40w-diode-laser-modules/", "summary": "<div><img alt=\"Creality Falcon T1 5-in-1 Laser Engraver review\" class=\"attachment-medium size-medium wp-post-image\" height=\"480\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/08/Creality-Falcon-T1-5-in-1-Laser-Engraver-review-720x480.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Creality sent us a sample of the Falcon T1 5-in-1 modular laser engraver for review. The company describes it as the world’s first 5-in-1 laser engraving and cutting machine that supports five types of laser modules in a single unit: 20W diode laser 20W, 40W diode laser, 20w fiber laser, 60W MOPA laser, and 5W UV Laser 5W. The laser heads can be swapped tool-free in just 15 seconds. It works with an HD camera and AI system and can engrave and cut a wide range of materials including wood, leather, acrylic, metal, glass, crystal, and plastic. Diode laser modules are ideal for cutting and engraving wood, leather, and acrylic, the fiber laser module is better suited for marking and engraving metal, the MOPA laser module supports color marking on metals such as stainless steel and titanium, and the UV laser module uses cold processing for high-precision work on glass, [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/08/01/creality-falcon-t1-review-a-5-in-1-modular-laser-engraver-tested-with-20w-fiber-and-40w-diode-laser-modules/\">Creality Falcon T1 review &#8211; A 5-in-1 modular laser engraver tested with 20W fiber and 40W diode laser modules<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "NanoPi R28S – A tiny dual GbE Rockchip RK3528A wireless SBC and router with a USB-C console port", "source": "CNX Software", "date": "2026-07-31", "url": "https://www.cnx-software.com/2026/07/31/nanopi-r28s-a-tiny-dual-gbe-rockchip-rk3528a-wireless-sbc-and-router-with-a-usb-c-console-port/", "summary": "<div><img alt=\"NanoPi R28S Dual GbE router USB C Debug port\" class=\"attachment-medium size-medium wp-post-image\" height=\"443\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/07/NanoPi-R28S-Dual-GbE-router-USB-C-Debug-port-720x443.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>NanoPi R28S is yet another tiny dual Gigabit Ethernet single board computer or router (with a metal enclosure), and the second from FriendlyELEC to implement a USB-C console port, often requested by our readers, after the NanoPi R2S Plus launched in 2024. At just 49.5 x 49.5 x 24 mm in its metal case, the Rockchip RK3528A-powered router also features 1GB LPDDR4, a microSD card slot and an eMMC module socket for storage, WiFi 6 and Bluetooth 5.3 wireless connectivity. The USB-C ports are only used for power, eMMC firmware upgrades, and debugging, and the system doesn&#8217;t feature any USB port for data connectivity, nor any GPIO header for expansion. In other words, it&#8217;s mostly useful for networking (firewalls, soft routers), as well as IoT gateway applications. NanoPi R28S specifications: SoC – Rockchip RK3528A CPU – Quad-core ARM Cortex-A53 @ 1.8 GHz GPU – Arm Mali-450 GPU with support for [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/07/31/nanopi-r28s-a-tiny-dual-gbe-rockchip-rk3528a-wireless-sbc-and-router-with-a-usb-c-console-port/\">NanoPi R28S &#8211; A tiny dual GbE Rockchip RK3528A wireless SBC and router with a USB-C console port<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "reTerminal Sticky 3.97-inch touch ePaper display is supported by four open-source firmware projects (so far)", "source": "CNX Software", "date": "2026-07-31", "url": "https://www.cnx-software.com/2026/07/31/reterminal-sticky-3-97-inch-magnetic-touch-epaper-display-is-supported-by-four-open-source-firmware-projects/", "summary": "<div><img alt=\"reTerminal Sticky\" class=\"attachment-medium size-medium wp-post-image\" height=\"408\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/07/reTerminal-Sticky-720x408.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Seeed Studio&#8217;s reTerminal Sticky is a 3.97-inch &#8220;AI-powered&#8221; magnetic touch ePaper display powered by an ESP32-S3 microcontroller, which serves as a sticky-note alternative, an e-reader, a live dashboard, or a home automation controller. The 800 x 480 resolution display comes with 8MB PSRAM, 32MB Flash, a microSD card slot, and next/previous page buttons. It&#8217;s &#8220;AI-powered&#8221; through a microphone and an AI Voice button leveraging the ESP32-S3 Edge AI capabilities for a voice-to-note feature. It also features a temperature and humidity sensor and a 3-axis accelerometer, as well as a built-in magnet and a magnetic ring for easy mounting. reTerminal Sticky specifications: SoC &#8211; Espressif ESP32-S3R8 CPU – Dual-core Tensilica LX7 microcontroller up to 240 MHz with vector instructions for AI acceleration Memory – 8MB PSRAM Wireless – 2.4 GHz WiFi 4 and Bluetooth 5.0 LE Storage 32 MB flash MicroSD card slot (SanDisk recommended) Display 3.97-inch monochrome (B&#38;W) ePaper 4-level [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/07/31/reterminal-sticky-3-97-inch-magnetic-touch-epaper-display-is-supported-by-four-open-source-firmware-projects/\">reTerminal Sticky 3.97-inch touch ePaper display is supported by four open-source firmware projects (so far)<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Maker Go ESP32-C5-EVB board features RS-485 interface, four relays, four opto-isolated inputs", "source": "CNX Software", "date": "2026-07-31", "url": "https://www.cnx-software.com/2026/07/31/maker-go-esp32-c5-evb-board-features-rs-485-interface-four-relays-four-opto-isolated-inputs/", "summary": "<div><img alt=\"MakerGo ESP32-C5-EVB\" class=\"attachment-medium size-medium wp-post-image\" height=\"574\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/07/MakerGo-ESP32-C5-EVB-720x574.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Maker Go ESP32-C5-EVB is an ESP32-C5 board with four relays, four opto-isolated inputs, RS-485 communication, and support for Wi-Fi 6, Bluetooth Low Energy 5.0, and Thread/Zigbee connectivity. It&#8217;s a variant of the Maker Go ESP32-C6-EVB released in 2024 that replaces the ESP32-C6 module with an ESP32-C5 module and a GPIO header with a terminal block for RS-485. The Maker Go ESP32-C6-EVB was mostly a clone of the Olimex ESP32-C6-EVB, and while Olimex already released its own ESP32-C5-EVB, it has a different dual-channel relay design. Maker Go ESP32-C5-EVB specifications: Wireless module – DOIT ESPC5-32 module SoC – Espressif Systems ESP32-C5 CPU Single-core 32-bit RISC-V processor @ up to 240 MHz Low-power RISC-V core @ 40 MHz acting as the main processor for power-sensitive applications Memory – 384 KB SRAM on-chip, support for external PSRAM Storage – 320 KB ROM, support for external flash Connectivity Dual-band 802.11ax WiFi 6 in the 2.4GHz [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/07/31/maker-go-esp32-c5-evb-board-features-rs-485-interface-four-relays-four-opto-isolated-inputs/\">Maker Go ESP32-C5-EVB board features RS-485 interface, four relays, four opto-isolated inputs<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Fault-Tolerant Quantum Computers, Sustained Performance Defines the Next Phase of Edge AI, Agentic AI for EDA: Embedded Week Insights", "source": "Embedded.com", "date": "2026-07-31", "url": "https://www.embedded.com/fault-tolerant-quantum-computers-sustained-performance-defines-the-next-phase-of-edge-ai-agentic-ai-for-eda-embedded-week-insights/", "summary": "<p>Here's a roundup of this week's must-read articles. We'll look into the latest developments on fault-tolerant quantum computers, why sustained performance will define the next phase of edge AI, and a partnership on agentic AI for EDA to automate complex engineering tasks. Also, check News Archives - Embedded and Technical Articles Archives - Embedded for the complete list of [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/fault-tolerant-quantum-computers-sustained-performance-defines-the-next-phase-of-edge-ai-agentic-ai-for-eda-embedded-week-insights/\">Fault-Tolerant Quantum Computers, Sustained Performance Defines the Next Phase of Edge AI, Agentic AI for EDA: Embedded Week Insights<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "Mikroe Integrates Swift Navigation Skylark with GNSS 19 Click", "source": "Embedded.com", "date": "2026-07-31", "url": "https://www.embedded.com/mikroe-integrates-swift-navigation-skylark-with-gnss-19-click/", "summary": "<p>Mikroe has partnered with Swift Navigation to integrate the Skylark Precise Positioning Service into its GNSS 19 Click development board, providing users with a free six-month license to the cloud-based correction service. The collaboration is intended to simplify access to high-accuracy global navigation satellite system (GNSS) positioning for developers working on industrial, automotive, and IoT [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/mikroe-integrates-swift-navigation-skylark-with-gnss-19-click/\">Mikroe Integrates Swift Navigation Skylark with GNSS 19 Click<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "Innodisk Introduces DDR5 12800 MT/s MRDIMM for AI and High-Performance Computing", "source": "EE Journal", "date": "2026-07-31", "url": "https://www.eejournal.com/industry_news/innodisk-introduces-ddr5-12800-mt-s-mrdimm-for-ai-and-high-performance-computing/", "summary": "Innodisk, a leading global AI solution provider, introduces the DDR5 12800 MT/s MRDIMM to support the rapid growth of generative AI, large language models (LLMs), and robotics applications. With an industry leading data rate of 12800 MT/s, this advanced memory module delivers exceptional bandwidth efficiency and scalability to meet the growing processing demands of AI-driven &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/innodisk-introduces-ddr5-12800-mt-s-mrdimm-for-ai-and-high-performance-computing/\">Read More &#8594;<span class=\"screen-reader-text\"> \"Innodisk Introduces DDR5 12800 MT/s MRDIMM for AI and High-Performance Computing\"<\/span><\/a>"}, {"title": "New small DP12IP series current transducer from Danisense delivers ppm-class precision", "source": "EE Journal", "date": "2026-07-31", "url": "https://www.eejournal.com/industry_news/new-small-dp12ip-series-current-transducer-from-danisense-delivers-ppm-class-precision/", "summary": "Key points: DP12IP series current transducer from Danisense delivers ppm-class precisionwith maximum linearity error of just 10 ppm Compact PCB-mount package featuring a form factor of only 32mm and weighing only 250g Supports current measurement up to 18A and accommodates measurement resistors up to 100 Ω at full scale Danisense, the leader in high-accuracy current sense &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/new-small-dp12ip-series-current-transducer-from-danisense-delivers-ppm-class-precision/\">Read More &#8594;<span class=\"screen-reader-text\"> \"New small DP12IP series current transducer from Danisense delivers ppm-class precision\"<\/span><\/a>"}, {"title": "New UFS 5.0 Embedded Flash Memory Devices from KIOXIA Enable On-Device AI", "source": "EE Journal", "date": "2026-07-31", "url": "https://www.eejournal.com/industry_news/new-ufs-5-0-embedded-flash-memory-devices-from-kioxia-enable-on-device-ai/", "summary": "KIOXIA Europe GmbH today announced its UFS(1) 5.0 embedded flash memory solutions, designed to deliver the performance, efficiency and capacity required for the next generation of AI-enabled mobile and edge devices. The new solutions will be demonstrated next week at FMS: the Future of Memory and Storage and are now available as commercial samples in 1 TB and 512 &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/new-ufs-5-0-embedded-flash-memory-devices-from-kioxia-enable-on-device-ai/\">Read More &#8594;<span class=\"screen-reader-text\"> \"New UFS 5.0 Embedded Flash Memory Devices from KIOXIA Enable On-Device AI\"<\/span><\/a>"}, {"title": "IDS expands its range of rugged industrial cameras with Sony STARVIS 2 sensors", "source": "EE Journal", "date": "2026-07-31", "url": "https://www.eejournal.com/industry_news/ids-expands-its-range-of-rugged-industrial-cameras-with-sony-starvis-2-sensors/", "summary": "When production systems are cleaned using high-pressure jets, operate in dusty environments or are exposed to sub-zero temperatures, particularly robust machine vision solutions are required. The uEye FA series from IDS Imaging Development Systems GmbH has been specifically designed for such demanding environments, featuring IP69K protection. Starting in late July, the range will expand to &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/ids-expands-its-range-of-rugged-industrial-cameras-with-sony-starvis-2-sensors/\">Read More &#8594;<span class=\"screen-reader-text\"> \"IDS expands its range of rugged industrial cameras with Sony STARVIS 2 sensors\"<\/span><\/a>"}, {"title": "Math-First AI: How Kodamai Embeds Verification and Trust", "source": "EE Journal", "date": "2026-07-31", "url": "https://www.eejournal.com/fish_fry/math-first-ai-how-kodamai-embeds-verification-and-trust/", "summary": "<img alt=\"\" class=\"webfeedsFeaturedVisual wp-post-image\" height=\"300\" src=\"https://www.eejournal.com/wp-content/uploads/2026/07/ChatGPT-Image-Jul-28-2026-01_41_46-PM-300x300.png\" style=\"display: block; margin-bottom: 5px; clear: both;\" width=\"300\" />My podcast guest this week is Dr. Maha Achour, CEO and Founder of Kodamai. Maha and I chat about the shifting landscape of AI and how we can move beyond cloud and centralized data centers to a more distributed, agentic future. We discuss why governance must &#8216;travel&#8217; with AI agents, what it means for trust &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/fish_fry/math-first-ai-how-kodamai-embeds-verification-and-trust/\">Read More &#8594;<span class=\"screen-reader-text\"> \"Math-First AI: How Kodamai Embeds Verification and Trust\"<\/span><\/a>"}, {"title": "ESP-KVM – An open-source IP KVM solution based on ESP32-P4 RISC-V MCU", "source": "CNX Software", "date": "2026-07-30", "url": "https://www.cnx-software.com/2026/07/30/esp-kvm-an-open-source-ip-kvm-solution-based-on-esp32-p4-risc-v-mcu/", "summary": "<div><img alt=\"ESP-KVM ESP32-P4 IP KVM\" class=\"attachment-medium size-medium wp-post-image\" height=\"416\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/07/ESP-KVM-ESP32-P4-IP-KVM-720x416.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Earlier this month, the P4 KVM project was brought to my attention. It provides IP KVM functionality to a Waveshare ESP32-P4-WIFI6-POE-ETH board when paired with a Toshiba TC358743 HDMI-to-CSI adapter. However, it doesn&#8217;t work with the new ESP32-P4 V3.x variants featuring a proper H.264 video encoding implementation, and the developer (Jonathan Rowny) says it&#8217;s just a proof-of-concept with many bugs and no security, so I decided to skip it. The good news is that he also encouraged others to fork the project, and Evgenij Spitsyn did just that with the release of the ESP-KVM project, which supports both MJPEG and H.264 encoding and a range of other features. ESP-KVM highlights: Video capture, resolution changes, and MJPEG or H.264 encoding Keyboard, absolute and relative pointer, media keys, copy/paste Touch mode for phones and tablets (trackpad, on-screen keyboard) Multiple viewers, one in control at a time with takeover HTTPS, login, physical password [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/07/30/esp-kvm-an-open-source-ip-kvm-solution-based-on-esp32-p4-risc-v-mcu/\">ESP-KVM &#8211; An open-source IP KVM solution based on ESP32-P4 RISC-V MCU<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "NightRun UEFI application boots a local LLM on Raspberry Pi 5 and x86 PCs without an OS", "source": "CNX Software", "date": "2026-07-30", "url": "https://www.cnx-software.com/2026/07/30/nightrun-uefi-application-boots-a-local-llm-on-raspberry-pi-5-and-x86-pcs-without-an-os/", "summary": "<div><img alt=\"NightRun runs LLMs without OS\" class=\"attachment-medium size-medium wp-post-image\" height=\"480\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/07/NightRun-runs-LLMs-without-OS-720x480.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Running LLMs locally on an SBC or mini PC is a good way to keep your data private, but they typically require a conventional operating system, which uses a good portion of system memory. NightRun is an experimental open-source project that addresses this issue by booting a machine directly into a local LLM from a USB drive or microSD card, without loading a conventional OS. By removing the operating system, NightRun makes more RAM and memory bandwidth available for AI inference. The runtime is written in Rust, and during boot it loads a quantized model (1.3 GB to 2.4 GB) directly into RAM while verifying its CRC-32 checksums. After the model is loaded, storage is &#8220;sealed,&#8221; meaning any later attempt to read from the disk will trigger a hard fault. NightRun key features: Hardware support &#8211; Supports 64-bit x86_64 UEFI PCs (Secure Boot disabled) and Raspberry Pi 5 via USB [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/07/30/nightrun-uefi-application-boots-a-local-llm-on-raspberry-pi-5-and-x86-pcs-without-an-os/\">NightRun UEFI application boots a local LLM on Raspberry Pi 5 and x86 PCs without an OS<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Luxonis M8 Controller Box adds industrial I/Os, CAN Bus, and relay control to OAK4 AI vision cameras", "source": "CNX Software", "date": "2026-07-30", "url": "https://www.cnx-software.com/2026/07/30/luxonis-m8-controller-box-adds-industrial-i-os-can-bus-and-relay-control-to-oak4-ai-vision-cameras/", "summary": "<div><img alt=\"OAK4 AI camera M8 Controller Box\" class=\"attachment-medium size-medium wp-post-image\" height=\"589\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/07/OAK4-AI-camera-M8-Controller-Box-720x589.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Luxonis has introduced a prototype of the M8 Controller Box, an industrial I/O expansion module for OAK4 AI vision edge AI cameras powered by a Qualcomm DragonWing QCS8550. Connected through the camera&#8217;s M8 interface, it adds GPIO, relay, CAN, serial, and USB connectivity, allowing OAK4-based systems to interface directly with sensors, actuators, PLCs, motors, and other industrial equipment for machine vision and automation applications. The prototype module features 16 GPIOs, four 16A relays, CAN 2.0, RS232, two USB 2.0 Type-A ports, an isolated strobe output, onboard audio, three buttons, and three status LEDs. It is powered directly from the OAK4 M8 connector, and supports DIN rail and VESA mounting. Luxonis M8 Controller Box specifications: MCU – Raspberry Pi RP2040 dual-core Arm Cortex M0+ @ 133 MHz with 264KB SRAM Host interface M8 connector for connecting Luxonis OAK4 cameras (standalone mode only) M8 passthrough port Audio 3.5mm headphone/AUX jack with mic input Onboard [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/07/30/luxonis-m8-controller-box-adds-industrial-i-os-can-bus-and-relay-control-to-oak4-ai-vision-cameras/\">Luxonis M8 Controller Box adds industrial I/Os, CAN Bus, and relay control to OAK4 AI vision cameras<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Renesas Upgrades DDR5 MRDIMM Chipset", "source": "Embedded.com", "date": "2026-07-30", "url": "https://www.embedded.com/renesas-upgrades-ddr5-mrdimm-chipset/", "summary": "<p>Renesas Electronics Corp. has launched its third‑generation (Gen 3) DDR5 multiplexed rank dual in‑line memory module (MRDIMM) chipset solutions with server-class MRDIMM speeds up to 16,000 mega transfers per second (MT/s). The new devices include the RRG5013 multiplexed registering clock driver (MRCD) and RRG5103 multiplexed data buffer (MDB). Targeting increased demand for higher memory bandwidth driven by AI data centers, cloud infrastructure, and accelerated [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/renesas-upgrades-ddr5-mrdimm-chipset/\">Renesas Upgrades DDR5 MRDIMM Chipset<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "Why Sustained Performance Defines the Next Phase of Edge AI", "source": "Embedded.com", "date": "2026-07-30", "url": "https://www.embedded.com/why-sustained-performance-defines-the-next-phase-of-edge-ai/", "summary": "<p>Avnet Silica details why sustained performance, not peak compute, will define the next phase of edge AI.<\/p>\n<p>The post <a href=\"https://www.embedded.com/why-sustained-performance-defines-the-next-phase-of-edge-ai/\">Why Sustained Performance Defines the Next Phase of Edge AI<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "BrainChip Launches AKD1500 M.2 Module for Fanless Edge AI", "source": "Embedded.com", "date": "2026-07-29", "url": "https://www.embedded.com/brainchip-launches-akd1500-m-2-module-for-fanless-edge-ai/", "summary": "<p>BrainChip Inc. has introduced a new M.2 version of its AKD1500 edge AI accelerator, enabling compact, fanless, and plug-and-play deployment of neuromorphic artificial intelligence capabilities in industrial and commercial systems. Based on the Akida neuromorphic processor architecture, the module provides hardware designers with a low-power solution for adding on-device AI functionality to existing platforms without [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/brainchip-launches-akd1500-m-2-module-for-fanless-edge-ai/\">BrainChip Launches AKD1500 M.2 Module for Fanless Edge AI<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "Emerson Expands AI Capabilities Across Test Environment", "source": "Embedded.com", "date": "2026-07-29", "url": "https://www.embedded.com/emerson-expands-ai-capabilities-across-test-environment/", "summary": "<p>NI Nigel AI enhancements accelerate test productivity by up to 50 percent.<\/p>\n<p>The post <a href=\"https://www.embedded.com/emerson-expands-ai-capabilities-across-test-environment/\">Emerson Expands AI Capabilities Across Test Environment<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "TDK, LG Innotek Collaborate on Physical AI Solutions", "source": "Embedded.com", "date": "2026-07-28", "url": "https://www.embedded.com/tdk-lg-innotek-collaborate-on-physical-ai-solutions/", "summary": "<p>TDK and LG Innotek have entered into a strategic partnership to develop sensing technologies for physical AI applications, with an initial focus on next-generation vision and tactile sensing modules for humanoid robots. The collaboration combines LG Innotek's expertise in optical systems and ultra-precision module design with TDK's sensor technology portfolio to create integrated solutions that [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/tdk-lg-innotek-collaborate-on-physical-ai-solutions/\">TDK, LG Innotek Collaborate on Physical AI Solutions<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "A New Route to Fault-Tolerant Quantum Computers", "source": "Embedded.com", "date": "2026-07-28", "url": "https://www.embedded.com/a-new-route-to-fault-tolerant-quantum-computers/", "summary": "<p>After early proof-of-concept demonstrations, quantum computing (QC) and quantum sensing (QS) are quickly moving toward practical technologies. While much focus is devoted to increasing the number of qubits to make quantum processors more capable, an equally important effort is directed at improving their quality. Quantum systems are extremely sensitive to the environment they interact with, [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/a-new-route-to-fault-tolerant-quantum-computers/\">A New Route to Fault-Tolerant Quantum Computers<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "Synopsys, AMD, and Microsoft Expand Agentic AI for EDA", "source": "Embedded.com", "date": "2026-07-27", "url": "https://www.embedded.com/synopsys-amd-and-microsoft-expand-agentic-ai-for-eda/", "summary": "<p>Synopsys has expanded its agentic AI strategy for electronic design automation (EDA) by introducing autonomous chip design workflows developed in collaboration with AMD and Microsoft. The new workflows are available for evaluation on Microsoft Discovery and are designed to automate complex engineering tasks across the semiconductor design lifecycle, from design implementation through verification and debug. [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/synopsys-amd-and-microsoft-expand-agentic-ai-for-eda/\">Synopsys, AMD, and Microsoft Expand Agentic AI for EDA<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "Congatec Launches Ryzen AI-based COM-HPC Module", "source": "Embedded.com", "date": "2026-07-27", "url": "https://www.embedded.com/congatec-launches-ryzen-ai-based-com-hpc-module/", "summary": "<p>The COM-HPC module targets physical AI applications in rugged environments.<\/p>\n<p>The post <a href=\"https://www.embedded.com/congatec-launches-ryzen-ai-based-com-hpc-module/\">Congatec Launches Ryzen AI-based COM-HPC Module<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}], "papers": [{"title": "Diagnosing Compositional Generalization in Sequential Robot Tasks", "authors": ["Yixiao Wang", "Cheng-En Wu", "Lingfeng Sun", "Pengcheng Wang", "Xiang Ji", "Boyuan Liang", "Guojian Zhan", "Masayoshi Tomizuka"], "published": "2026-07-31", "summary": "Sequential robot manipulation requires policies to execute novel combinations of familiar instruction components. However, collecting demonstrations for all possible instruction tuples is combinatorially expensive, while sparsely covered datasets often fail under out-of-distribution recombination. This paper studies compositional generalization through the lens of instruction-space coverage. We decompose the generalization gap into three sources: \\textit{marginal instruction shift}, \\textit{instruction-compositional shift}, and \\textit{context--action shift}. This decomposition allows us to diagnose when sparse training coverage is sufficient, and what structure the training set must preserve for reliable action prediction. Our results show that exhaustive tuple enumeration is unnecessary: a structured subset, as small as one quarter of the full task space, can recover strong out-of-distribution performance when it covers action-relevant dependencies. We further find that sparse training often fails due to instruction steering rather than missing low-level skills; finetuning only one demonstration per task improves OOD success from \\(0.4\\%\\) to \\(54.7\\%\\). For semantically dependent tasks, effective coverage must capture relational structure rather than only factor diversity. These findings suggest that efficient robot data collection should prioritize dependency coverage in instruction space over exhaustive task expansion. More results are available in the supplementary material. Project website: https://yixiaowang7.github.io/Diagnosing_Compositional_Generalization_Robot_Page/.", "pdf_url": "https://arxiv.org/pdf/2607.29687v1"}, {"title": "Bootstrapping Self-Supervised Learning of Binary Classification Using Error Bounds: A Case Study on a Robotic Insertion Task", "authors": ["Zebin Duan", "Norbert Krüger", "Juan Heredia", "Thorbjørn Mosekjær Iversen", "Frederik Hagelskjær"], "published": "2026-07-31", "summary": "Flexible manufacturing requires rapid deployment of solutions and minimal setup time to remain competitive. An essential attribute is the ability to control error levels, as failures can range from minor performance degradation to severe equipment damage. However, conventional deployment often involves extensive setup, data collection, model training or parameter tuning, and system testing, resulting in significant delays that hinder commercial feasibility. We propose a data engine which gathers data and improves its performance while executing the task. The data engine consists of two classifiers, a fast model prediction and expensive verification. First, a model prediction is performed and based on the confidence level of the prediction, the expensive verification can be used. By adjusting the confidence level, users can control the level of tolerable error. Our method is implemented on a real-world robotic insertion task, which uses force data for the model prediction. The system applies UMAP dimensionality reduction and uses Wilson-Score to compute the confidence bounds of the prediction. Results demonstrate the ability to learn and reduce the need for expensive verifications over time, while staying within the set error-rate. The results highlight the potential of confidence bounds in self-improving models to enhance reliability in robotic classification task.", "pdf_url": "https://arxiv.org/pdf/2607.29640v1"}, {"title": "Balancing of Humanoid with Object Mass: Trade-off Analyses and Lifting Control", "authors": ["Hyunjong Song", "William Z. Peng", "Joo H. Kim"], "published": "2026-07-31", "summary": "The demand for humanoid loco-manipulation tasks with an object has recently increased, and most existing control approaches for stability in such tasks rely on heuristics or machine-learning techniques. This study rigorously analyzes and exploits the dynamic effects of the object mass on balance stability. By formulating the object mass parameters in the whole-body dynamics with distributed contact wrenches and centers of pressure at the stance contacts, their nonlinear effects on the system momenta and constraints are quantified. The dynamic models and constraints are incorporated into the construction of the balanced state basin/boundary (BSB), a partition of the center-of-mass state space for a biped system to maintain balance in its desired contacts. The implications of the BSB for prediction and control are highlighted using a humanoid robot and an analytically tractable reduced-order mechanism. The BSBs under different conditions of base of support, actuation capacity, and pose provide systematic analyses of the effects of object mass on the balancing capability of a system. In particular, the trade-off relationships between momentum regulation and limiting factors in balancing are characterized, introducing two key quantities of the object: the critical mass, at which the system's balancing capability is maximum, and the transition mass, which activates different limiting factors. In addition, sufficient conditions for imposing balanced states on a trajectory are established and implemented with BSBs as explicit threshold constraints in the whole-body trajectory optimization for stable object-lifting control of the humanoid, demonstrating the lift-and-hold and lift-and-release tasks with distinct mass properties in simulations and experiments.", "pdf_url": "https://arxiv.org/pdf/2607.29625v1"}, {"title": "RayViT: Ray-Conditioned Visual Representations for Viewpoint-Robust Imitation Learning", "authors": ["Qian Wang", "Longrui Chen", "Peiran Sun", "Aleksandar Taranovic", "Niklas Freymuth", "Ge Li", "Weiran Liao", "C. F. Maximilian Nagy", "Yucheng Tan", "Tao Chen", "Gerhard Neumann"], "published": "2026-07-31", "summary": "Visual imitation learning enables robots to acquire visuomotor skills directly from images, yet RGB observations lack explicit geometric cues, making learned policies brittle to camera perturbations. To address this, we propose \\textbf{Ray-conditioned Vision Transformer Encoder (RayViT)}, a lightweight architecture that injects camera geometry into pretrained ViT backbones. RayViT represents camera geometry as a Plücker ray map, patchifies it into ray features, and uses gated cross-attention to produce a ray-conditioned class token. These ray features are added as dense positional embeddings, while the ray class token replaces the original ViT class token to provide a geometry-aware summary representation. We combine this approach with an auxiliary cosine similarity loss to consistently improve the performance and robustness for geometry-aware tokens. Experiments on sim- and real-robot tasks demonstrate that RayViT improves robustness by approximately 13 percentage points under camera perturbations in multi-task RoboCasa benchmark and by 1.78 average completed stages in real-world multi-task success rate compared to baselines.", "pdf_url": "https://arxiv.org/pdf/2607.29622v1"}, {"title": "When Does On-Policy Interaction Help? Representational Tradeoffs in Value-Based Imitation Learning", "authors": ["Luca Viano", "Antoine Moulin", "Audrey Huang", "Volkan Cevher", "Philip Amortila", "Dylan J. Foster"], "published": "2026-07-31", "summary": "Imitation learning (IL)---training an agent to replicate expert behavior from demonstrations---underpins applications from robotics to language model training. Standard approaches such as Behavior Cloning (BC) are known to suffer from compounding errors and performance plateaus, particularly when the learner cannot perfectly represent the expert's policy (as is typical, e.g., in distillation). Two interventions are widely understood empirically to improve performance: querying the expert interactively along the learner's own trajectories, and using value function estimation en route to generating a policy rather than directly fitting the expert's full action distribution. We investigate the nature of these improvements and their potentially surprising interplay. Our main finding is that expert interaction relaxes the representational demands on the learner: one only needs a model capable of realizing the expert's value function, bypassing the (often stricter) requirement of realizing the expert's policy itself. Concretely, we introduce OVI, an interactive on-policy IL algorithm that is statistically efficient whenever the learner can represent the expert's value function and computationally efficient given access to a linear maximization oracle. We complement this with a negative result showing that interaction is necessary. Namely, without stronger assumptions beyond expert-value realizability alone, any offline IL algorithm must scale with the complexity of the expert policy class. Our findings bear out empirically. OVI outperforms offline policy-based (BC), interactive policy-based (DAgger), and offline value-based IL methods, with the largest gains when the learner network is substantially less expressive than the expert's.", "pdf_url": "https://arxiv.org/pdf/2607.29617v1"}, {"title": "WCM: A World Critic Model for Vision-Language-Action Reinforcement Learning", "authors": ["Senyu Fei", "Xiaopeng Yu", "Siyin Wang", "Xianzhong Zhao", "Jingjing Gong", "Xipeng Qiu"], "published": "2026-07-31", "summary": "Reinforcement learning (RL) post-training of Vision-Language-Action (VLA) models has shown strong promise for robotic manipulation. Among RL methods, critic-based approaches rely on a value estimator that predominantly operates on single-frame observations or single-frame VLM backbone latents, which is a fundamental mismatch with the partially observable nature of robot control. A naive approach to incorporate observation history into the critic incurs exponential complexity with high-dimensional visual space, and still fails because pure scalar-return regression provides insufficient supervision for learning cross-temporal dynamics. We identify the root cause as a state approximation problem: without an explicit world modeling objective, the critic's representation cannot capture the temporal structure needed for accurate value estimation. To address this, we propose the World Critic Model (WCM), built on a lightweight LeJEPA architecture; WCM jointly predicts future latent state and estimates values, such that the critic's representation is explicitly trained to capture temporal dynamics rather than merely regress scalar returns. WCM integrates seamlessly into both on-policy and off-policy training pipelines and is compatible with state-of-the-art VLA backbones including Pi0, Pi0.5, and OpenVLA-OFT. Extensive experiments on 149 tasks across four benchmarks demonstrate that WCM consistently achieves state-of-the-art performance in both in-distribution and out-of-distribution settings, with particularly strong generalization gains. We further validate WCM on seven real-world manipulation tasks using OpenVLA-OFT and Pi0.5 with off-policy RL, confirming stable deployment across diverse settings.", "pdf_url": "https://arxiv.org/pdf/2607.29613v1"}, {"title": "HAM-VLN: Harnessing Hierarchical Agentic Memory for Zero-Shot Vision-and-Language Navigation", "authors": ["An Liu", "Bingxi Liu", "Hongyu Ding", "Yixuan Jiang", "Yaran Chen", "Fulin Tang", "Cong Leng", "Hong Zhang", "Jian Cheng"], "published": "2026-07-31", "summary": "Vision-and-language navigation (VLN) enables robots to follow instructions in previously unseen environments. Recently, a training-free paradigm has emerged: the robot queries a multimodal LLM to understand its observations and plan the next action. However, long-horizon navigation based on either image streams or dense map inevitably introduces a growing memory and reasoning bottleneck. We present HAM-VLN, a decision-coupled, agent-authored memory that equips the robot with a persistent, depth-grounded world graph. In the same model call used to select the next action, HAM-VLN also records semantic and reflective information---including room type, objects, navigation progress, and failure notes. Recent waypoints remain verbatim within a bounded window, while older history re-enters the context only through retrieval scored by relevance, recency, and salience, together with one-hop topological expansion. This design requires no additional LLM calls beyond the per-waypoint decision. Compared to previous methods, HAM-VLN not only improves various navigation metrics but also reduces the context length by more than 65%. Specifically, HAM-VLN achieves 61.0% Success Rate (SR) on VLN-CE R2R, 52.7% SR on VLN-CE RxR, and 79.7% SR on HM3D-v2 ObjectNav without any training.", "pdf_url": "https://arxiv.org/pdf/2607.29600v1"}, {"title": "FibVLA: An Efficient Temporal Vision-Language-Action Model with Fibonacci Sampling", "authors": ["Li Lin", "Wujun Xu", "Weiwei Meng", "Kaiwen Xia", "Kang Hao Cheong", "Shuai Wang"], "published": "2026-07-31", "summary": "Vision-language-action models (VLAs), which leverage the cognition of multimodal information to infer physical-world actions, provide a generalized solution for embodied AI applications. Conventional VLAs usually concentrate on current digital cognition. While some efforts are made to enhance VLAs' reasoning capabilities by capturing temporal information, encoding the long-context history causes an efficiency-decreasing issue. To reconcile the conflict between capturing temporal information and maintaining inference efficiency in VLAs, this paper introduces FibVLA, an efficient framework featuring temporal perception of long-context history. Specifically, we leverage logarithmic hindsight sampling to both proprioceptive states and visual frames to capture long-term temporal dependencies with minimal redundancy. For the action expert, we introduce the flow matching to produce action distributions, and the Fibonacci recurrent inference strategy to generate long-range planning steps based on real-time closed-loop feedback. Experiments demonstrate that FibVLA significantly improves action smoothness and success rates without retraining large-scale visual encoders. Efficiency analysis demonstrates superior real-time responsiveness compared to video-based baselines in real-world evaluations.", "pdf_url": "https://arxiv.org/pdf/2607.29596v1"}, {"title": "Safe Vision Language Action Models via Barrier Enhanced Flow Matching", "authors": ["Kasra Sinaei", "Hung-Chieh Wu", "Donald Ebeigbe"], "published": "2026-07-31", "summary": "This article presents a modular inference framework that integrates Flow Matching generative models with formal Control Barrier Function (CBF) safety guarantees. Unlike existing methods that apply external safety filters to a model's final output, our approach modifies the Flow Matching denoising process within the model to inherently generate safe trajectories. By employing a smooth Log-Sum-Exponential aggregate barrier, we enforce safety over entire action chunks. This aggregate barrier ensures a minimal increase in computational overhead and does not alter the semantic intent of the model. We show that, within the proposed framework, the 2-Wasserstein distance between the generated distribution and the target distribution remains bounded. Our method eliminates the need for safety-specific datasets or costly model retraining, providing a versatile solution for safe inference. We validate the approach on two robotic manipulation platforms and a 2D navigation benchmark, verifying that our framework achieves reliable safety without degrading the success rate of the model.", "pdf_url": "https://arxiv.org/pdf/2607.29569v1"}, {"title": "TransGraspNet: Physically and Geometrically Consistent Manipulation of Transparent Labware", "authors": ["Hailing Hu", "Mingyi Zhu", "Yiquan An", "Yifei Tian", "Tianyou Zuo", "Lifeng Zhou"], "published": "2026-07-31", "summary": "Manipulating transparent laboratory glassware that contains liquid is inherently safety-critical: even small geometric errors can cause unstable grasps and hazardous spillage. Although recent progress has been made in transparent object perception and robotic grasping, most existing systems optimize detection, depth reconstruction, and grasp planning independently, which leads to cross-stage inconsistency imperfect boundaries induce depth bleeding, distorted surfaces corrupt normal estimation, and task agnostic grasp scoring yields tilted or off-center grasps that fail under dynamic motion. In this paper, we propose TransGraspNet, a geometry physics consistent framework that explicitly enforces consistency from perception to execution through three coupled principles: boundary consistency to produce structurally reliable object contours as downstream priors, surface consistency to preserve geometric fidelity and surface normal accuracy during depth reconstruction, and physics consistency to refine grasp selection with centroid alignment and wrench-space stability for upright and dynamically robust manipulation. We evaluate TransGraspNet on public benchmarks, a dedicated transparent glassware dataset, and a real robotic platform. The results show improved boundary quality and surface normal fidelity, and demonstrate strong task-level performance in cluttered transparent scenes. Most importantly, the proposed system achieves reliable real-world operation, including high grasp success rates in clutter and zero spillage during high speed liquid transport, highlighting the effectiveness of our method.", "pdf_url": "https://arxiv.org/pdf/2607.29567v1"}, {"title": "LEMUR: Learning to Align with Multi-Objective Reinforcement Learning from Preference Feedback", "authors": ["Manith Adikari", "Bei Peng", "Samuele Vinanzi", "Angelo Cangelosi"], "published": "2026-07-31", "summary": "Reinforcement Learning (RL) systems are typically trained using a single, well-specified scalar reward function. However, real-world decision-making tasks often involve multiple, competing objectives, such as performance versus efficiency, where ground-truth reward functions are difficult to specify or inaccessible. While Multi-Objective RL (MORL) addresses such trade-offs by modeling rewards as vectors, existing approaches typically assume access to a well-specified reward function for each objective, inheriting the same challenges faced by single-objective RL. Meanwhile, Preference-based RL (PbRL) has shown great potential in solving complex tasks without access to a pre-defined reward function through reward learning from human feedback, yet has largely been studied in single-objective settings. In this work, we bridge this gap with LEMUR: Learning to Align with Multi-Objective Reinforcement Learning with Preference feedback, a novel framework where an agent interactively learns from the preferences of multiple humans to learn optimal multi-objective policies. Our approach jointly learns policies and multiple objective-specific reward models from human feedback, enabling agents to effectively balance competing objectives during learning. We evaluate LEMUR on a variety of benchmark multi-objective tasks, and empirical results demonstrate its superior performance over baseline methods. Our method presents a promising direction for solving multi-objective decision-making tasks without pre-defined reward functions.", "pdf_url": "https://arxiv.org/pdf/2607.29559v1"}, {"title": "A Neurosymbolic Approach for Explainable Early Diagnosis of Alzheimer's Disease", "authors": ["Ranveer Singh", "Pranuthi Tenali", "Saurabh Mathur", "Ameet Soni", "Vaishali Phatak", "Karla Lynch", "Daniel Murman", "Matthew Rizzo", "Sriraam Natarajan"], "published": "2026-07-31", "summary": "Identifying reliable Alzheimer's disease (AD) markers typically requires manual, labor-intensive transcription and expert analysis, limiting its scale. We introduce an automated pipeline that extracts qualitative knowledge about potential AD progression indicators directly from audio recordings of verbal fluency tests. Our method uses pretrained foundation models to process raw audio and extract clinically relevant variables to construct a Bayesian Network (BN); this BN is used to reason about the AD progression markers and infer their qualitative relationships. Our system successfully recovers known clinical knowledge and identifies novel relationships between linguistic markers.", "pdf_url": "https://arxiv.org/pdf/2607.29530v1"}, {"title": "TerraNova: A Foundation Model for the Anthropocene", "authors": ["Carlos Rodriguez-Pardo", "Massimo Tavoni"], "published": "2026-07-31", "summary": "A defining problem of the Anthropocene is to model the physical Earth and human societies as one coupled system, yet no learned representation spans their observational breadth. We argue the obstacle is geometric: the physical Earth is measured as continuous fields that ignore political borders, whereas societies are reported for administrative units. Earth-system foundation models serve the first geometry; coupling it to the second has required lossy averaging over borders. We introduce TerraNova, a foundation model trained on 1,024 physical and societal records in their native geometries: 512 gridded Earth-system fields and 512 national indicators. Dedicated encoders represent location, country, time and task, cross-modal transformers fuse them into a shared spatiotemporal state, and a hypernetwork generates a per-query decoder whose evidential head returns a predictive distribution. Two contrastive objectives couple the representation: a population-weighted alignment between
