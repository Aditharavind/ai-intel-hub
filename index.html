r coordination engines. The <strong>Perception Engine<\/strong> ingests and normalizes raw sensor streams. The <strong>Intent Engine <\/strong>performs Spatial Intent Fusion across modalities, resolving what the user is trying to do given where they are, what they are looking at, and what their hand is signaling. The <strong>Orchestration Engine<\/strong> translates intent into device-specific command sequences for any connected actuator. The <strong>Safety Engine<\/strong> arbitrates conflicting commands, enforces operational envelopes, and gates execution against runtime safety conditions.<\/p><p class=\"shortcode-media shortcode-media-youtube\"> <span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><h2>The trade-offs we’re honest about<\/h2><p>No system that bridges the human body and the digital world is finished. Three engineering challenges remain open, and the company addresses each with a deliberate trade-off rather than a claim of having fully solved it.<\/p><p><strong>Baseline stability of sEMG under motion.<\/strong> In a stationary user, continuous gesture recognition from sEMG is reliable. Once the user is walking, climbing, or otherwise moving, motion artifacts and electrode drift degrade the signal in ways that are difficult to fully compensate for. Rather than overpromise on continuous control in dynamic settings, Orchestra defaults to a smaller set of robust discrete gestures in complex operating environments, and reserves continuous control modes for contexts where the signal-to-noise ratio supports them.<\/p><p><strong>Miniaturization of edge AI compute.<\/strong> Running the Orchestra control loop entirely at the edge requires real on-device inference, which has historically meant trading off between compute capacity, battery life, and form factor. Wetour Robotics’ approach has been a compact carrier board paired with a thermal design and a battery module sized for all-day wearability. The result is a hub that travels with the user rather than tethering them to a desk, and that performs the full perception-to-actuation loop without offloading to the cloud.<\/p><p><strong>Heterogeneity of third-party device protocols.<\/strong> The actuator side of the loop is a fragmented landscape. Different manufacturers expose different command interfaces, different communication stacks, and different safety conventions, and a Physical AI operating system has to integrate with all of them. Wetour Robotics uses an AI-agent layer to negotiate connection and protocol translation adaptively, so that Orchestra OS can ingest data from a wide range of devices, run them through neural network models that infer human intent, and emit the right command on the right protocol for the device on the other end.<\/p><h2>Why this matters, and why it helps the rest of the field<\/h2><p>The history of computing is a history of interface revolutions. Command lines gave way to graphical user interfaces, which gave way to touch, which gave way to voice. Each transition expanded who could participate in the system and what they could do with it. The next transition is not about a new screen or a new microphone. It is about treating the human body itself as a participant in the computing network, capable of contributing intent at the same speed and fidelity that any other connected node can.<\/p><p class=\"pull-quote\">The history of computing is a history of interface revolutions. The next transition is not about a new screen or a new microphone — it is about treating the human body itself as a participant in the computing network.<\/p><p>This path is not a competitor to the work being done on humanoid robots, foundation models for embodied AI, and dexterous manipulation. It is the missing complement to that work. The hardest open problem for humanoid systems is the data: every natural interaction between a human and the physical world is a potential training signal, and most of those interactions are currently invisible to any computing system. As more humans become first-class nodes in the loop, those interactions become observable, structured, and ultimately useful for training the next generation of embodied AI, including the humanoid robots being developed today.<\/p><p>In other words: putting the human back into the computing loop is not just about better interfaces for individual users. It is about generating the kind of grounded, in-the-wild human-machine interaction data that the broader Physical AI ecosystem will need to keep advancing. The robot side and the human side of the loop are not two competing futures. They are two halves of the same one.<\/p><p>That is what Wetour Robotics means when it says: <em>Your body is the interface.<\/em><\/p><p>Learn more at <a href=\"https://wetourrobotics.com/\" target=\"_blank\">wetourrobotics.com<\/a>.<\/p>"}], "embeddedNews": [{"title": "GPU-Accelerated Autorouter Handles Monstrous PCB Designs", "source": "Hackaday", "date": "2026-07-02", "url": "https://hackaday.com/2026/07/01/gpu-accelerated-autorouter-handles-monstrous-pcb-designs/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"450\" src=\"https://hackaday.com/wp-content/uploads/2026/06/OrthoRouteKiCad-banner.png?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>[Brian] had an absolute monster of a PCB with thousands of nets to be routed, the kind of design that stopped traditional routers in their tracks. It would take months <a class=\"read-more\" href=\"https://hackaday.com/2026/07/01/gpu-accelerated-autorouter-handles-monstrous-pcb-designs/\">&#8230;read more<\/a>"}, {"title": "Europe’s Heat-Stroke", "source": "Electronics Weekly", "date": "2026-07-02", "url": "https://www.electronicsweekly.com/blogs/mannerisms/consumer/europes-heat-stroke-2026-07/", "summary": "<p>Western Europe experienced an “unusually early and intense” heat wave in late May and now large parts of the continent have b engineering-micro-submarines-to-replace-fish/\">&#8230;read more<\/a>"}, {"title": "UDP Broadcasting and Easily Finding Network Services", "source": "Hackaday", "date": "2026-07-01", "url": "https://hackaday.com/2026/07/01/udp-broadcasting-and-easily-finding-network-services/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"484\" src=\"https://hackaday.com/wp-content/uploads/2026/06/UDP.jpg?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>Local area networks (LANs) that use technologies like Ethernet and Wi-Fi are incredibly useful for letting devices talk with each other. Yet a core problem here is knowing which devices <a class=\"read-more\" href=\"https://hackaday.com/2026/07/01/udp-broadcasting-and-easily-finding-network-services/\">&#8230;read more<\/a>"}, {"title": "Sipeed NanoKVM-Go – A 4K USB-C KVM with Recall-like function, AI integration (Crowdfunding)", "source": "CNX Software", "date": "2026-07-01", "url": "https://www.cnx-software.com/2026/07/01/sipeed-nanokvm-go-an-4k-usb-c-kvm-with-recall-like-function-ai-integration/", "summary": "<div><img alt=\"NanoKVM-Go\" class=\"attachment-medium size-medium wp-post-image\" height=\"563\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/07/NanoKVM-Go-720x563.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Sipeed NanoKVM-Go is a 4K USB-C KVM designed to control any USB-C device from anywhere with one cable. It also supports &#8220;full screen memory&#8221;, a function similar to the controversial Microsoft Recall feature, which enables an AI agent to search through your screenshots. Remote control software works fine until your system freezes or BIOS access is required, and traditional KVMs do the job with HDMI, USB, Ethernet, power cables, and adapters, but that&#8217;s a bit too much when working on the go. The NanoKVM-Go aims to solve all these little issues with a small and light device that requires only one cable to the target, while the host connects to the USB KVM over WiFi 6. NanoKVM-Go and Go+ specifications: SoC &#8211; Unamed, but almost certainly the Axera Tech AX630C used in the Sipeed NanoKVM Pro 4K IP KVM. CPU &#8211; Dual-core Cortex-A53 AI accelerator &#8211; 3.2TOPS NPU System Memory [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/07/01/sipeed-nanokvm-go-an-4k-usb-c-kvm-with-recall-like-function-ai-integration/\">Sipeed NanoKVM-Go &#8211; A 4K USB-C KVM with Recall-like function, AI integration (Crowdfunding)<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Raspberry Pi CM0-based industrial data acquisition gateway features RS-485, RS-232, DI, and DO interfaces", "source": "CNX Software", "date": "2026-07-01", "url": "https://www.cnx-software.com/2026/07/01/raspberry-pi-cm0-based-industrial-data-acquisition-gateway-offer-rs485-rs232-di-do-interfaces/", "summary": "<div><img alt=\"Raspberry Pi CM0 industrial data acquisition gateway\" class=\"attachment-medium size-medium wp-post-image\" height=\"642\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/07/Raspberry-Pi-CM0-industrial-data-acquisition-gateway-720x642.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>EDATEC ED-IPC1200 is an industrial data acquisition gateway powered by the Raspberry Pi Compute Module Zero (CM0), designed for industrial automation and edge applications with various I/O interfaces, a fanless design, and a wide range (9–28V) DC power input. The industrial computer features RS-485, RS-232, four digital inputs, and four digital outputs for data acquisition and equipment control, and supports Ethernet, and optional Wi-Fi/Bluetooth and/or 4G LTE connectivity. EDATEC ED-IPC1200 specifications: SoM – Raspberry Pi CM0 SoC – Broadcom BCM2710A1 CPU – Quad-core Cortex-A53 processor @ 1.0 GHz GPU – VideoCore IV GPU supporting OpenGL ES 1.1, 2.0 graphics VPU – H.264/MPEG-4 ion over the next five years (2026-2030) is not expected to expand the overall RAN market, says Dell’Oro. “AI RAN is ...<\/p>\n<p>The post <a href=\"https://www.electronicsweekly.com/news/business/ai-ran-2026-07/\">AI will enhance the RAN but won’t expand RAN market<\/a> appeared first on <a href=\"https://www.electronicsweekly.com\">Electronics Weekly<\/a>.<\/p>"}, {"title": "Panasonic launches compact PCB relay series", "source": "Electronics Weekly", "date": "2026-07-01", "url": "https://www.electronicsweekly.com/news/business/panasonic-launches-compact-pcb-relay-series-2026-07/", "summary": "<p>Panasonic has brought out a compact HE-S SC 2a and HE-S SC 2a1b PCB relay series, specifically developed for single-phase EV charging systems and wallbox applications. The new relay series ...<\/p>\n<p>The post <a href=\"https://www.electronicsweekly.com/news/business/panasonic-launches-compact-pcb-relay-series-2026-07/\">Panasonic launches compact PCB relay series<\/a> appeared first on <a href=\"https://www.electronicsweekly.com\">Electronics Weekly<\/a>.<\/p>"}, {"title": "LIVE NOW! SHOW and TELL 7/1/2026 with @blitzcitydiy #ShowandTell @adafruit", "source": "Adafruit", "date": "2026-07-01", "url": "https://blog.adafruit.com/2026/07/01/live-now-show-and-tell-7-1-2026-with-blitzcitydiy-showandtell-adafruit/", "summary": "The biggest and longest running worldwide online Show and Tell LIVE! Right now! 7/1/2026 at 7:30pm Eastern. – video. Hosted this week by Liz Clark"}, {"title": "smolutils: like coreutils but smaller", "source": "Adafruit", "date": "2026-07-01", "url": "https://blog.adafruit.com/2026/07/01/smolutils-like-coreutils-but-smaller/", "summary": "Daniel Palmer has developed smolutils, &#8220;because for space constrained targets, even uclibc + busybox isn&#8217;t very usable due to space.&#8221; For nommu, every process loads its own copy of everything because there is no virtual addressing to allow sharing of common physical pages. So every process has its own copy of uclibc and busybox and [&#8230;]"}, {"title": "PiZZa: Arduino on the Raspberry Pi Zero 2 W", "source": "Adafruit", "date": "2026-07-01", "url": "https://blog.adafruit.com/2026/07/01/pizza-arduino-on-the-raspberry-pi-zero-2-w/", "summary": "jetpax on GitHub has dropped PiZZa, running Arduino on the Raspberry Pi Zero 2 W. Write sketches in the Arduino IDE and run them on a Raspberry Pi Zero 2 W or the original Raspberry Pi Zero W. A small firmware on the SD card (a Zephyr &#8220;loader&#8221;) loads your compiled sketch as a runtime [&#8230;]"}, {"title": "Building and hiking with Wallace, the 6 inch f/2.8 telescope", "source": "Adafruit", "date": "2026-07-01", "url": "https://blog.adafruit.com/2026/07/01/building-and-hiking-with-wallace-the-6-inch-f-2-8-telescope/", "summary": "Lucas Sifoni presents Wallace, a 153mm f/2.8 ultra-wide-field telescope that was built last year and shares more of the “outdoor” part of astronomy. I now spend a lot of time outside with running and hiking, and started to wonder how could I share that, the same question that emerged when I started observational astronomy &#8211; [&#8230;]"}, {"title": "DS1881 – a clickless dual digital attenuator", "source": "Adafruit", "date": "2026-07-01", "url": "https://blog.adafruit.com/2026/07/01/ds1881-a-clickless-dual-digital-attenuator/", "summary": "The AUDIODiWHY blog writes: I&#8217;ve breadboarded digital potentiometers before, only to find they make an ugly, audible &#8220;click&#8221; when changing resistance values when used in 30hz-20Khz AC circuits. I recently stumbled upon an IC that purportedly does away with the click&#8211;Analog Device&#8217;s DS1881&#8211;dual pots, I2C, log response&#8211;everything needed for an MCU controlled audio attenuator&#8211;but also sporting onboard [&#8230;]"}, {"title": "The Adafruit IoT Monthly Newsletter for July 2026 is out NEXT WEEK, Subscribe Now!", "source": "Adafruit", "date": "2026-07-01", "url": "https://blog.adafruit.com/2026/07/01/the-adafruit-iot-monthly-newsletter-for-july-2026-is-out-next-week-subscribe-now/", "summary": "The IoT Monthly newsletter is the best place to catch up on the latest news about the Internet of Things. We cover everything from projects to new protocols to industry news. 7,200+ readers and growing! This newsletter is only sent to your inbox once per month – don’t miss your chance to catch the July 2026 issue next [&#8230;]"}, {"title": "LAMPy: a connected RGB lantern", "source": "Adafruit", "date": "2026-07-01", "url": "https://blog.adafruit.com/2026/07/01/lampy-a-connected-rgb-lantern/", "summary": "LAMPy is a MicroPython-based RGB lantern controller. It is first and foremost a software project, meaning it can run on many different hardware implementations. The only hard requirements are an ESP32 board with an antenna, a WS2812 (NeopPixel) LED strip, and a push button. Features Adjustable brightness with a visual indicator. Fixed-color modes with selectable [&#8230;]"}, {"title": "Brooklyn Bringing Out the Big Boats for A Flotilla on the 4th #4thOfJuly #Sail4th", "source": "Adafruit", "date": "2026-07-01", "url": "https://blog.adafruit.com/2026/07/01/brooklyn-bringing-out-the-big-boats-for-a-flotilla-on-the-4th-4thofjuly-sail4th/", "summary": "&#160; In honor of America&#8217;s 250th anniversary, New York is hosting tall ships from around the world. This will be the largest-ever flotilla of tall ships! Events are scheduled from the 3rd through the 8th. &#160; The tall ship Elissa; U.S. Navy photo by Mass Communication Specialist 2nd Class Roadell Hickman via Wikipedia &#160; From [&#8230;]"}, {"title": "Made in America Directory #AmericanManufacturers", "source": "Adafruit", "date": "2026-07-01", "url": "https://blog.adafruit.com/2026/07/01/made-in-america-directory-americanmanufacturers/", "summary": "Looking for an American-made product? The Alliance for American manufacturing can help with that The Alliance for American Manufacturing (AAM) is a non-profit, non-partisan partnership formed in 2007 by some of America’s leading manufacturers and the United Steelworkers. Our mission is to strengthen American manufacturing and create new private-sector jobs through smart public policies. We [&#8230;]"}, {"title": "Starfire, Sun Microsystems vision of the future of desktop computing", "source": "Adafruit", "date": "2026-07-01", "url": "https://blog.adafruit.com/2026/07/01/starfire-sun-microsystems-vision-of-the-future-of-desktop-computing/", "summary": "In the sixteen minute 1992 vinette Starfire, Bruce &#8220;Tog&#8221; Tognazzini, a respected industry futurist, presented his vision of the technological future for Sun Microsystems. It details the steps computer professionals might take to deliver new technologies in a form to advance how we communicate and get things done. You can watch the full video below [&#8230;]"}, {"title": "LIVE! 3D Hangouts with Noe and Pedro", "source": "Adafruit", "date": "2026-07-01", "url": "https://blog.adafruit.com/2026/07/01/live-3d-hangouts-with-noe-and-pedro-79/", "summary": "3D Hangouts – Chiptune Player and Diving Penguin https://youtube.com/live/iXBXO2uxt48?feature=share This week @adafruit we’re working on new projects. Noe has a working prototype for Liz Clark’s CircuitPython chiptune player while Pedro is working on a new project. This week’s timelapse features a diving penguin pool toy. Adafruit Feather RP2350 with 8MB PSRAM https://www.adafruit.com/product/6130 Adafruit 3.5&#8243; TFT [&#8230;]"}, {"title": "Sandia National Labs SA3000 8085 CPU", "source": "Adafruit", "date": "2026-07-01", "url": "https://blog.adafruit.com/2026/07/01/sandia-national-labs-sa3000-8085-cpu/", "summary": "The CPUShack Museum writes that back in the late 1970’s and early 1980’s Sandia National Laboratory (in Albuquerque, New Mexico) began building the capacity to design, fab, and test IC’s at scale (packaging was handled by Fairchild and Allied Signal). Why would a National Laboratory need the capacity to do this? To provide components that [&#8230;]"}, {"title": "Keysight and WIN Semiconductors Collaborate to Cut Design Risk for High Frequency RF Components", "source": "EE Journal", "date": "2026-07-01", "url": "https://www.eejournal.com/industry_news/keysight-and-win-semiconductors-collaborate-to-cut-design-risk-for-high-frequency-rf-components/", "summary": "Keysight Technologies, Inc. (NYSE: KEYS) and WIN Semiconductors Corp. today announced a joint MMIC design workflow that enables GaN MMIC design houses to achieve first pass tapeout success. The workflow connects on-chip multi-domain simulation, 3D layout with verifications, and off-chip MMIC evaluation board design into a single environment. It supports the growing number of companies &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/keysight-and-win-semiconductors-collaborate-to-cut-design-risk-for-high-frequency-rf-components/\">Read More &#8594;<span class=\"screen-reader-text\"> \"Keysight and WIN Semiconductors Collaborate to Cut Design Risk for High Frequency RF Components\"<\/span><\/a>"}, {"title": "Samtec Connectors Enable Rapid Design of Unmanned Craft", "source": "EE Journal", "date": "2026-07-01", "url": "https://www.eejournal.com/industry_news/samtec-connectors-enable-rapid-design-of-unmanned-craft/", "summary": "Samtec, Inc., the service leader in the connector industry, announces the UxV/35-FleXYZ™ ESQT series of durable interconnect systems designed to stack and nest, forming a vertical 35-pin bus that adjusts to different design sizes and configurations. These connectors support the UXV/35™standard for small, unmanned craft from the RMS Consortium. The UxV/35 Standard The UxV/35 standard supports fast-track, &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/samtec-connectors-enable-rapid-design-of-unmanned-craft/\">Read More &#8594;<span class=\"screen-reader-text\"> \"Samtec Connectors Enable Rapid Design of Unmanned Craft\"<\/span><\/a>"}, {"title": "Metis Engineering launches Air Wise: A next-generation CAN-based air quality sensor for transport and industrial HVAC systems", "source": "EE Journal", "date": "2026-07-01", "url": "https://www.eejournal.com/industry_news/metis-engineering-launches-air-wise-a-next-generation-can-based-air-quality-sensor-for-transport-and-industrial-hvac-systems/", "summary": "Metis Engineering, the manufacturer of advanced CAN-based sensor solutions, today announces the commercial launch of Air Wise, a next-generation air quality monitoring sensor designed for seamless integration into transport and industrial HVAC systems. Air Wise delivers comprehensive, real-time measurement of a broad range of environmental parameters including absolute pressure, air temperature, Nitrous Oxides (NOx), Volatile &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/metis-engineering-launches-air-wise-a-next-generation-can-based-air-quality-sensor-for-transport-and-industrial-hvac-systems/\">Read More &#8594;<span class=\"screen-reader-text\"> \"Metis Engineering launches Air Wise: A next-generation CAN-based air quality sensor for transport and industrial HVAC systems\"<\/span><\/a>"}, {"title": "Ercopac and Servotecnica Partner to Enhance High-Speed Wrapping Systems", "source": "EE Journal", "date": "2026-07-01", "url": "https://www.eejournal.com/industry_news/ercopac-and-servotecnica-partner-to-enhance-high-speed-wrapping-systems/", "summary": "Servotecnica, a global specialist in motion control technology, has announced the delivery of customised slip ring solutions to Ercopac, supporting high-performance end-of-line automation systems for palletising and wrapping applications. Servotecnica developed two application-specific slip rings for the Spider wrapping machine, one supporting the rotating table and one the pallet stabilising device. Each unit was engineered to &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/ercopac-and-servotecnica-partner-to-enhance-high-speed-wrapping-systems/\">Read More &#8594;<span class=\"screen-reader-text\"> \"Ercopac and Servotecnica Partner to Enhance High-Speed Wrapping Systems\"<\/span><\/a>"}, {"title": "Sensata Technologies Introduces Active + Passive PyroFuse to Advance High-Voltage Safety", "source": "EE Journal", "date": "2026-07-01", "url": "https://www.eejournal.com/industry_news/sensata-technologies-introduces-active-passive-pyrofuse-to-advance-high-voltage-safety/", "summary": "Sensata’s Active + Passive PyroFuse combines system‑triggered and current‑driven interruption in a single device, delivering reliable, redundant high‑voltage fault protection for electrified systems. Improves fault response and resilience in high-voltage architectures by reducing dependence on upstream sensors and control signals. Enables system‑level optimization by supporting faster fault interruption, helping OEMs simplify protection strategies, reduce component &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/sensata-technologies-introduces-active-passive-pyrofuse-to-advance-high-voltage-safety/\">Read More &#8594;<span class=\"screen-reader-text\"> \"Sensata Technologies Introduces Active + Passive PyroFuse to Advance High-Voltage Safety\"<\/span><\/a>"}, {"title": "WeAct N006 – A compact NVIDIA Jetson Orin NX carrier board designed for robots and UAVs", "source": "CNX Software", "date": "2026-06-30", "url": "https://www.cnx-software.com/2026/06/30/weact-n006-a-compact-nvidia-jetson-orin-nx-carrier-board-designed-for-robots-and-uavs/", "summary": "<div><img alt=\"WeAct N006\" class=\"attachment-medium size-medium wp-post-image\" height=\"481\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/06/WeAct-N006-720x481.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>WeAct N006 is a carrier board for NVIDIA Jetson Orin NX 8GB/16GB, specifically designed for robots and UAVs with a compact (90x60mm) form factor that&#8217;s barely larger than a credit card. The board features an HDMI video output, a Gigabit Ethernet port, two M.2 sockets for NVMe storage and WiFi/Bluetooth connectivity, two MIPI CSI camera interfaces, three USB 3.2 ports, various connectors for GPIO, I2C, UART, and CAN Bus, and an XT30 connector for 16V to 28V DC input. WeAct N006 specifications: Supported SoM &#8211; NVIDIA Jetson Orin NX 8GB/16GB up to 40W Super Mode Storage &#8211; M.2 Key-M socket for M.2 2242 NVMe SSD Video Output &#8211; HDMI port Camera &#8211; 2x 4-lame MIPI DSI interface Networking Gigabit Ethernet RJ45 port Optional WiFi and Bluetooth via M.2 Key-E socket USB 2x USB 3.1 (10 Gbps) Type-A ports USB 3.2 Gen 2 (10 Gbps) OTG Type-C port Serial 4-pin CAN [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/06/30/weact-n006-a-compact-nvidia-jetson-orin-nx-carrier-board-designed-for-robots-and-uavs/\">WeAct N006 &#8211; A compact NVIDIA Jetson Orin NX carrier board designed for robots and UAVs<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "XIAO nRF54LM20A (Sense) board enables ultra-low-power Bluetooth 6.0, Matter, Thread, Zigbee, or 2.4 GHz proprietary applications", "source": "CNX Software", "date": "2026-06-30", "url": "https://www.cnx-software.com/2026/06/30/xiao-nrf54lm20a-sense-board-enables-ultra-low-power-bluetooth-6-0-matter-thread-zigbee-or-2-4-ghz-proprietary-applications/", "summary": "<div><img alt=\"XIAO NRF54LM20A Sense board\" class=\"attachment-medium size-medium wp-post-image\" height=\"487\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/06/XIAO-NRF54LM20A-Sense-board-720x487.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Seeed Studio XIAO nRF54LM20A and XIAO nRF54LM20A Sense are tiny USB-C IoT boards based on Nordic Semiconductor&#8217;s nRF54LM20A wireless SoC offering Bluetooth 6.0, Matter, Thread, Zigbee, NFC, Amazon Sidewalk, and 2.4 GHz proprietary connectivity. Both variants come with on-chip 2 MB flash and 512 KB RAM, as well as an 8 MB flash, an nPM1300 PMIC for power management, up to 28 GPIOs, and an RGB LED. The Sense model adds a digital microphone and 6-axis IMU with motion-triggered wake-up for ultra-low power applications. XIAO nRF54LM20A (Sense) specifications: Wireless SoC – Nordic Semiconductor nRF54LM20A CPU Arm Cortex-M33 application processor clocked at up to 128 MHz RISC-V coprocessor running at 128 MHz Memory – 512 kB of RAM Storage – 2 MB of Non-Volatile Memory (NVM) Wireless Bluetooth LE 6.0 with PHY rates of 125 kbit/s, 500 kbit/s, 1 Mbit/s, and 2 Mbit/s Bluetooth Channel Sounding, Bluetooth LE long range (coded PHY), [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/06/30/xiao-nrf54lm20a-sense-board-enables-ultra-low-power-bluetooth-6-0-matter-thread-zigbee-or-2-4-ghz-proprietary-applications/\">XIAO nRF54LM20A (Sense) board enables ultra-low-power Bluetooth 6.0, Matter, Thread, Zigbee, or 2.4 GHz proprietary applications<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Banana Pi BPI-VP10 – A low-cost servo control board based on Fortior FU7512L dual-core RISC-V MCU", "source": "CNX Software", "date": "2026-06-30", "url": "https://www.cnx-software.com/2026/06/30/banana-pi-bpi-vp10-a-low-cost-servo-control-board-based-on-fortior-fu7512l-dual-core-risc-v-mcu/", "summary": "<div><img alt=\"Banana Pi BPI-VP10 with metal case and servo\" class=\"attachment-medium size-medium wp-post-image\" height=\"479\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/06/Banana-Pi-BPI-VP10-metal-case-servo-720x479.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Banana Pi BPI-VP10 is a low-cost servo control board based on the Fortior FU7512L RISC-V MCU and the FD6288Q pre-driver chip, designed for industrial control applications that rely on 100W/200W servos. The servo motor control board supports multiple control modes, including pulse/direction, analog, and RS485, and is compatible with absolute encoders (Tamagawa/BiSS-C protocols), incremental encoders, and Hall encoders. The BPI-VP10 board, also called BPI-BJ2403N, aims to provide an easy-to-source platform for developers to experiment with the FU7512L microcontroller and design projects or products around it. Banana Pi BPI-VP10 (FU7512L-SVDriver) specifications: Microcontroller &#8211; Fortior Technology FU7512L CPU 32-bit RISC-V core @ 48 MHz ME2 motor engine core @ 48 MHz with FOC module and CORDIC module Memory – 12kB SRAM, 4kB PRAM for program execution Storage – 64kB Flash with ECC and CRC, self-programming, and code protection Encoder Support &#8211; Absolute encoders (Tamagawa/BiSS-C protocols), incremental encoders, and Hall encoders. Pulse Input &#8211;  [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/06/30/banana-pi-bpi-vp10-a-low-cost-servo-control-board-based-on-fortior-fu7512l-dual-core-risc-v-mcu/\">Banana Pi BPI-VP10 &#8211; A low-cost servo control board based on Fortior FU7512L dual-core RISC-V MCU<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "TeleCANesis Launches Version 1.1 of its Connectivity Platform", "source": "Embedded.com", "date": "2026-06-30", "url": "https://www.embedded.com/telecanesis-launches-version-1-1-of-its-connectivity-platform/", "summary": "<p>TeleCANesis Inc. has released version 1.1 of its connectivity middleware platform, introducing new workflow capabilities designed to simplify embedded system development and reduce repetitive configuration tasks. Based largely on customer feedback, the latest version focuses on improving the reusability of connectivity definitions across projects, enabling engineering teams to develop and maintain complex embedded applications more [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/telecanesis-launches-version-1-1-of-its-connectivity-platform/\">TeleCANesis Launches Version 1.1 of its Connectivity Platform<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "Sensing and Positioning Payloads in LEO Satellites", "source": "Embedded.com", "date": "2026-06-30", "url": "https://www.embedded.com/sensing-and-positioning-payloads-in-leo-satellites/", "summary": "<p>A low Earth orbit (LEO) satellite constantly estimates its position, pointing direction, rotational speed, payload requirements, and the sun's position relative to its solar arrays. In applications such as Earth observation, communications, and scientific missions, accurate pointing is the difference between usable mission data and a wasted downlink. Attitude and orbit control systems (AOCS) in [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/sensing-and-positioning-payloads-in-leo-satellites/\">Sensing and Positioning Payloads in LEO Satellites<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "RS supports panel-centric MRO strategies that deliver savings without sacrificing quality", "source": "EE Journal", "date": "2026-06-30", "url": "https://www.eejournal.com/industry_news/rs-supports-panel-centric-mro-strategies-that-deliver-savings-without-sacrificing-quality/", "summary": "RS, a high-service global product and service solutions provider for industrial customers, supports panel-centric MRO strategies with an extensive selection of high-quality standardized, serviceable control panel components engineered, tested, and proven to reduce industrial control panel lifecycle costs without sacrificing quality or performance. The high downstream cost of “low-cost” control panel components Control panels are &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/rs-supports-panel-centric-mro-strategies-that-deliver-savings-without-sacrificing-quality/\">Read More &#8594;<span class=\"screen-reader-text\"> \"RS supports panel-centric MRO strategies that deliver savings without sacrificing quality\"<\/span><\/a>"}, {"title": "Renesas Acquires Pictorus to Simplify and Accelerate Embedded Application Software Development", "source": "EE Journal", "date": "2026-06-30", "url": "https://www.eejournal.com/industry_news/renesas-acquires-pictorus-to-simplify-and-accelerate-embedded-application-software-development/", "summary": "Renesas Electronics Corporation (TSE:6723, “Renesas”), a premier supplier of advanced semiconductor solutions, announced today that a Renesas subsidiary has completed the acquisition of software developer Pictorus, based in Oakland, California. With the acquisition of Pictorus, Renesas gains a cloud‑based behavioral modeling platform that accelerates embedded system development, moving the engineering experience beyond point tools by providing &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/renesas-acquires-pictorus-to-simplify-and-accelerate-embedded-application-software-development/\">Read More &#8594;<span class=\"screen-reader-text\"> \"Renesas Acquires Pictorus to Simplify and Accelerate Embedded Application Software Development\"<\/span><\/a>"}, {"title": "KYOCERA AVX Releases new Web-Based Antenna Integration Tool", "source": "EE Journal", "date": "2026-06-30", "url": "https://www.eejournal.com/industry_news/kyocera-avx-releases-new-web-based-antenna-integration-tool/", "summary": "KYOCERA AVX, a leading global manufacturer of advanced electronic components engineered to accelerate technological innovation and build a better future, released a new web-based RF engineering tool — the Antenna Integrator Studio. Wireless connectivity has become a ubiquitous capability for electronic products extending throughout every industry. As such, RF engineering has become an essential element &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/kyocera-avx-releases-new-web-based-antenna-integration-tool/\">Read More &#8594;<span class=\"screen-reader-text\"> \"KYOCERA AVX Releases new Web-Based Antenna Integration Tool\"<\/span><\/a>"}, {"title": "Saelig Introduces Micsig MHO 6 Series 12-bit 1GHz 8-ch Oscilloscopes", "source": "EE Journal", "date": "2026-06-30", "url": "https://www.eejournal.com/industry_news/saelig-introduces-micsig-mho-6-series-12-bit-1ghz-8-ch-oscilloscopes/", "summary": "Saelig Company, Inc. has introduced the MHO 6 series 12-bit high-resolution oscilloscopes with 350MHz/500MHz/1GHz bandwidth, 6GSa/s sampling rate, 8 analog channels, and a storage depth of 1.8Gpts. The MHO 6 series precisely captures tiny and high-speed signals in full detail, running on the dedicated SigtestUI™ multitask OS for test instruments, offering stable and smooth operation. Its ultra-thin design &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/saelig-introduces-micsig-mho-6-series-12-bit-1ghz-8-ch-oscilloscopes/\">Read More &#8594;<span class=\"screen-reader-text\"> \"Saelig Introduces Micsig MHO 6 Series 12-bit 1GHz 8-ch Oscilloscopes\"<\/span><\/a>"}, {"title": "Introducing the Kvaser PCIe 4xLIN for next-level LIN connectivity", "source": "EE Journal", "date": "2026-06-30", "url": "https://www.eejournal.com/industry_news/introducing-the-kvaser-pcie-4xlin-for-next-level-lin-connectivity/", "summary": "Kvaser introduces the PCIe 4xLIN, a compact four-channel LIN interface built for deterministic communication, precise timing analysis, and scalable validation setups. Designed for desktop, industrial, and HIL environments, the low-profile PCIe card integrates galvanic isolation with synchronized timestamping, giving engineers reliable, system-level visibility when testing and debugging LIN networks.  The Kvaser PCIe 4xLIN provides four &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/introducing-the-kvaser-pcie-4xlin-for-next-level-lin-connectivity/\">Read More &#8594;<span class=\"screen-reader-text\"> \"Introducing the Kvaser PCIe 4xLIN for next-level LIN connectivity\"<\/span><\/a>"}, {"title": "Waveshare ESP32-C6-Zero-B  – A tiny ESP32-C6 USB-C board with 5V-36V wide supply voltage", "source": "CNX Software", "date": "2026-06-29", "url": "https://www.cnx-software.com/2026/06/29/waveshare-esp32-c6-zero-b-a-tiny-esp32-c6-usb-c-board-with-5v-36v-wide-supply-voltage/", "summary": "<div><img alt=\"ESP32-C6 board 5-36V wide supply voltage\" class=\"attachment-medium size-medium wp-post-image\" height=\"541\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/06/ESP32-C6-board-5-36V-wide-supply-voltage-720x541.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Waveshare ESP32-C6-Zero-B is a variant of the company&#8217;s ESP32-C6-Zero USB-C board that adds 5V-36V wide supply voltage support for industrial applications It&#8217;s based on the ESP32-C6FH8 wireless RISC-V SoC with 8MB flash, 2.4 GHz WiFi 6, Bluetooth 5.x LE, and an 802.15.4 radio for Zigbee and Thread. It also exposes up to 20 GPIOs via headers and pads, and features an RGB LED, as well as Boot and Reset buttons. Waveshare ESP32-C6-Zero-B specifications: SoC – Espressif Systems ESP32-C6FH8 CPU Single-core 32-bit RISC-V clocked up to 160 MHz Low-power RISC-V core @ up to 20 MHz Memory &#8211; 512KB SRAM Storage – 320KB ROM, 8MB flash Wireless – 2.4 GHz WiFi 6, Bluetooth 5.3, and 802.15.4 radio for Thread/Zigbee USB &#8211; USB Type-C port for program download and debugging Expansion 2x 9-pin headers with up to 13x GPIOs, UART, I2C, SPI, 6x ADC, I2S, PWM, Vin, 3.3V out, GND 7x solder pads [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/06/29/waveshare-esp32-c6-zero-b-a-tiny-esp32-c6-usb-c-board-with-5v-36v-wide-supply-voltage/\">Waveshare ESP32-C6-Zero-B  &#8211; A tiny ESP32-C6 USB-C board with 5V-36V wide supply voltage<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Simplia CONNECT RW612 6-in-1 M.2 2230 module offers WiFi 6, Bluetooth 5.4, 802.15.4, LTE-M, NB-IoT, and GNSS connectivity", "source": "CNX Software", "date": "2026-06-29", "url": "https://www.cnx-software.com/2026/06/29/simplia-connect-rw612-6-in-1-m-2-2230-module-offers-wifi-6-bluetooth-5-4-802-15-4-lte-m-nb-iot-and-gnss-connectivity/", "summary": "<div><img alt=\"Simplia CONNECT RW612 6-in-1 M.2 wireless module\" class=\"attachment-medium size-medium wp-post-image\" height=\"583\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/06/Simplia-CONNECT-RW612-6-in-1-m2-wireless-module-720x583.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Simplia CONNECT RW612 is a 6-in-1 M.2 2230 wireless module that offers dual-band WiFi 6, Bluetooth 5.4 LE, an 802.15.4 radio for Zigbee or Thread, LTE Cat-M, NB-IoT, and GNSS connectivity. It&#8217;s the first module I&#8217;ve seen that implements so many wireless standards into a tiny M.2 2230 module. It&#8217;s made possible by combining an NXP RW612 WiFi, BLE, and 802.15.4 module with an optional Quectel BC77 LTE-M, NB-IoT, and GNSS module. Simplia CONNECT RW612 specifications: Wireless modules Murata Type 2FR (LBESOZZ2FR) SoC – NXP RW612 CPU &#8211; Arm Cortex-M33 @ 260 MHz Memory &#8211; 1.2 MB SRAM Wireless Dual-band Wi-Fi 6 (802.11ax) 1&#215;1 SISO Bluetooth LE 5.4 802.15.4 radio for Thread and Zigbee Storage &#8211; 16MB or 32MB integrated flash memory via FlexSPI Security &#8211; NXP EdgeLock Package &#8211; 12.0 x 11.0 x 1.5 mm (BGA) Optional Quectel BG77 (BG77LA, similar to the BG770A minus 5G NTN support) LTE [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/06/29/simplia-connect-rw612-6-in-1-m-2-2230-module-offers-wifi-6-bluetooth-5-4-802-15-4-lte-m-nb-iot-and-gnss-connectivity/\">Simplia CONNECT RW612 6-in-1 M.2 2230 module offers WiFi 6, Bluetooth 5.4, 802.15.4, LTE-M, NB-IoT, and GNSS connectivity<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "DEBIX T62P-01 Raspberry Pi-like industrial SBC features TI AM62P SoC, dual GbE with TSN, multi-domain UART", "source": "CNX Software", "date": "2026-06-29", "url": "https://www.cnx-software.com/2026/06/29/debix-t62p-01-raspberry-pi-like-industrial-sbc-features-ti-am62p-soc-dual-gbe-with-tsn-multi-domain-uart/", "summary": "<div><img alt=\"DEBIX T62P-01 Texas Instruments AM62P SBC\" class=\"attachment-medium size-medium wp-post-image\" height=\"538\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/06/DEBIX-T62P-01-Texas-Instruments-AM62P-SBC-720x538.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Polyhex Technology has introduced the DEBIX T62P-01, a compact industrial SBC built around Texas Instruments Sitara AM62P quad Cortex-A53/dual Cortex-R5F SoC designed for industrial IoT (IIoT), robotics, Edge computing, and smart terminal/HMI applications. Measuring 88 × 59 mm, the board supports up to 8GB of LPDDR4 memory, optional eMMC storage up to 256GB, and a MicroSD card slot. It also features two GbE ports, including one supporting PoE via an external PD module, as well as Wi-Fi 6 and Bluetooth 5.4 connectivity. Security features include hardware secure boot with Root-of-Trust (RoT), an Arm TrustZone-based Trusted Execution Environment (TEE), and a Hardware Security Module (HSM) for cryptographic operations. DEBIX T62P-01 specifications: SoC – Texas Instruments AM62P (AM62P54CVMHIAMHR) Application CPU – Quad-core Arm Cortex-A53 up to 1.4 GHz Real-time cores 1x Arm Cortex-R5F up to 800MHz (integrated with MCU channel) 1x Arm Cortex-R5F up to 800MHz (for device management) GPU – Imagination [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/06/29/debix-t62p-01-raspberry-pi-like-industrial-sbc-features-ti-am62p-soc-dual-gbe-with-tsn-multi-domain-uart/\">DEBIX T62P-01 Raspberry Pi-like industrial SBC features TI AM62P SoC, dual GbE with TSN, multi-domain UART<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "DESLOC V150 Plus smart lock integrates a perovskite solar panel, supports 3D face recognition (Crowdfunding)", "source": "CNX Software", "date": "2026-06-29", "url": "https://www.cnx-software.com/2026/06/29/desloc-v150-plus-smart-lock-integrates-a-solar-panel-supports-3d-face-recognition/", "summary": "<div><img alt=\"DESLOC V150 Plus Low Light Self Charging Solar Smart Lock\" class=\"attachment-medium size-medium wp-post-image\" height=\"480\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/06/DESLOC-V150-Plus-Low-Light-Self-Charging-Solar-Smart-Lock-720x480.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>DESLOC V150 Plus is a smart lock with an integrated perovskite solar panel, which can generate power under low-light conditions, eliminating or at least reducing the need for manual battery charging. The V150 Plus is a two-part system consisting of exterior and interior units connected via wires through the door. The exterior unit includes the perovskite solar panel, two cameras with a 3D facial recognition system, and an AI-assisted fingerprint sensor, while the interior unit houses a 10,000mAh removable battery, a Battery Management System (BMS), and a lock motor. The BMS manages battery charging and power distribution. The rechargeable battery is rated to provide up to 8 months of backup operation when solar charging is unavailable, which is a little longer than the Lockzo AL501 3-in-1 smart door lock we reviewed earlier. DESLOC V150 Plus specifications: SoC – TBD (most probably a chip from Nordic or Espressif) Connectivity &#8211; Wi-Fi and Bluetooth Access [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/06/29/desloc-v150-plus-smart-lock-integrates-a-solar-panel-supports-3d-face-recognition/\">DESLOC V150 Plus smart lock integrates a perovskite solar panel, supports 3D face recognition (Crowdfunding)<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "SiTime Upgrades Chorus Clock Generators", "source": "Embedded.com", "date": "2026-06-29", "url": "https://www.embedded.com/sitime-upgrades-chorus-clock-generators/", "summary": "<p>SiTime Corp. has introduced Chorus 2, a wide-frequency-range programmable clock generator. Building on the Chorus family of clock generators for AI data centers, introduced in 2024, the second-generation clock generator offers 2× better performance, 2× lower jitter, and up to 2.5× less output skew as well as greater spread spectrum clock support. The Chorus 2 clock [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/sitime-upgrades-chorus-clock-generators/\">SiTime Upgrades Chorus Clock Generators<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "Qualinx Integrates Galileo OSNMA into GNSS Receiver", "source": "Embedded.com", "date": "2026-06-29", "url": "https://www.embedded.com/qualinx-integrates-galileo-osnma-into-gnss-receiver/", "summary": "<p>Qualinx has completed the integration of Galileo OSNMA (Open Service Navigation Message Authentication) into its QLX3Gx series of ultra-low-power GNSS receivers, making authenticated satellite positioning available for battery-powered devices without increasing power consumption or system complexity. Developed with support from the European Union Agency for the Space Programme (EUSPA), the new implementation is designed to [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/qualinx-integrates-galileo-osnma-into-gnss-receiver/\">Qualinx Integrates Galileo OSNMA into GNSS Receiver<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "Arduino launches Modulino Hub and Extender modules to support up to 64 I2C devices, 30-meter range", "source": "CNX Software", "date": "2026-06-28", "url": "https://www.cnx-software.com/2026/06/28/arduino-modulino-hub-extender-modules-64-i2c-devices-30-meter-range/", "summary": "<div><img alt=\"Arduino Modulino Hub Extender I2C modules\" class=\"attachment-medium size-medium wp-post-image\" height=\"381\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/06/Arduino-Modulino-Hub-Extender-I2C-modules-720x381.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Arduino has just introduced three new Modulino modules: the Modulino Hub to support up to eight I2C devices (64 devices with 8 Hubs), the Modulino Extender to extend the I2C range to up to 30 meters, and the Modulino Motors to control two DC motors or a single stepper motor with precision. I&#8217;ll focus on the I2C modules in this post, as I find the Modulino Extender module particularly interesting, since I always considered I2C to be a short-range communication protocol, and never thought of using it for (relatively) long-range wired communication. Modulino Hub While the I2C protocol supports up to 127 devices in theory, address conflicts can become an issue in complex builds where multiple sensors or actuators share the same default address. The Modulino Hub aims to solve that, and multiple Hubs can be daisy-chained, each with its own address, to support up to 64 devices. Modulino Hub specifications: [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/06/28/arduino-modulino-hub-extender-modules-64-i2c-devices-30-meter-range/\">Arduino launches Modulino Hub and Extender modules to support up to 64 I2C devices, 30-meter range<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "GEEKOM A7 2026 Edition Review – Part 3: Ubuntu 26.04 on an AMD Ryzen 5 7545U mini PC", "source": "CNX Software", "date": "2026-06-27", "url": "https://www.cnx-software.com/2026/06/27/geekom-a7-2026-edition-review-part-3-ubuntu-26-04-on-an-amd-ryzen-5-7545u-mini-pc/", "summary": "<div><img alt=\"GEEKOM A7 2026 Edition Review Ubuntu 26.04 Linux\" class=\"attachment-m /* ── constants ── */
const SRC_COLOR = {
  all:'#818cf8',starred:'#fbbf24',aiNews:'#38bdf8',physicalAiNews:'#a78bfa',
  roboticsNews:'#fbbf24',embeddedNews:'#22d3ee',papers:'#34d399',repos:'#60a5fa',
  models:'#fb923c',funding:'#a3e635',companies:'#f472b6',jobs:'#2dd4bf',
};
const SRC_ICON = {
  all:'⚡',starred:'⭐',aiNews:'📰',physicalAiNews:'🦾',roboticsNews:'🤖',embeddedNews:'🔌',
  papers:'📄',repos:'💻',models:'🧠',funding:'💰',companies:'🏢',jobs:'💼',
};
const SRC_LABEL = {
  all:'All Intelligence',starred:'⭐ Starred',aiNews:'AI News',physicalAiNews:'Physical AI',
  roboticsNews:'Robotics',embeddedNews:'Embedded & Chips',papers:'Research Papers',repos:'GitHub Repos',
  models:'HF Models',funding:'Funding',companies:'Companies',jobs:'Jobs',
};
const TOPICS = {
  vla:{ label:'VLA Models',    icon:'🎯', color:'#818cf8', kw:['vla','vision-language-action','vision language action'] },
  wam:{ label:'World Action',  icon:'🌍', color:'#a78bfa', kw:['wam','world action model','world-action','world model'] },
  robotPolicy:{ label:'Robot Policy',  icon:'🦿', color:'#2dd4bf', kw:['robot polic','manipulation polic','dexterous','locomotion','loco-manipul'] },
  rlPolicy:{    label:'RL Policy',     icon:'🧮', color:'#fbbf24', kw:['reinforcement learning','reward function','policy gradient','actor-critic','ppo ','rl agent'] },
  simulation:{  label:'Simulation',    icon:'🖥️', color:'#60a5fa', kw:['sim-to-real','simulation','simulator','simulated env','mujoco','isaac','sapien','robotwin','libero'] },
};

const state = { ds:'all',page:1,size:20,q:'',sort:'newest',view:'grid',dr:'all',advMod:null };

/* ── helpers ── */
const esc = v => String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const plain = v => { const d=document.createElement('div'); d.innerHTML=String(v??''); return d.textContent||''; };
const titleOf = x => x.title||x.repo||x.model||x.company||'Untitled';
const dateOf  = x => x.date||x.published||x.posted||'';
const srcOf   = x => { const s=x.source; if (s && !/^https?:\/\//.test(s)) return s; return x.company||x.language||x.topic||x.category||''; };
const scoreOf = x => Number(x.score||x.stars||x.downloads||0);
const isSeed  = x => { const u=x.url||x.pdf_url||''; return u.includes('example.com')||(x.title||'').toLowerCase().startsWith('example'); };
const fmt = n => n>=1e6?(n/1e6).toFixed(1)+'M':n>=1000?(n/1000).toFixed(1)+'K':String(n);
const truncWords=(t,n=100)=>{if(!t)return'';const w=t.trim().split(/\s+/);return w.length<=n?t:w.slice(0,n).join(' ')+'…';};

/* ── stars (persist across data refreshes via localStorage, keyed by URL) ── */
const keyOf = x => x.url||x.pdf_url||titleOf(x);
let STARS = new Set(JSON.parse(localStorage.getItem('hub-stars')||'[]'));
const isStarred = x => STARS.has(keyOf(x));
function toggleStar(k) {
  if (STARS.has(k)) STARS.delete(k); else STARS.add(k);
  localStorage.setItem('hub-stars', JSON.stringify([...STARS]));
}
function starredRows() { return allRows().filter(isStarred); }


function hrefOf(x) {
  if (x.pdf_url) {
    const m=x.pdf_url.match(/arxiv\.org\/(?:pdf|abs)\/([0-9]+\.[0-9]+)/);
    if (m) return 'https://arxiv.org/abs/'+m[1];
  }
  if (x.url) return x.url;
  if (x.pdf_url) return x.pdf_url;
  if (x.source && /^https?:\/\//.test(x.source)) return x.source;
  return '#';
}

function cutoff(r) {
  if (r==='all') return '';
  const d=new Date();
  if (r==='today') d.setHours(0,0,0,0);
  else if (r==='7d')  d.setDate(d.getDate()-7);
  else if (r==='30d') d.setDate(d.getDate()-30);
  else if (r==='90d') d.setDate(d.getDate()-90);
  return d.toISOString().slice(0,10);
}

function colorOf(k) { return SRC_COLOR[k]||(TOPICS[k]&&TOPICS[k].color)||'#818cf8'; }
function labelOf(k) { return SRC_LABEL[k]||(TOPICS[k]&&TOPICS[k].label)||k; }
function iconOf(k)  { return SRC_ICON[k]||(TOPICS[k]&&TOPICS[k].icon)||'•'; }

/* ── rows ── */
function allRows() {
  return Object.entries(data).flatMap(([k,rows])=>rows.filter(x=>!isSeed(x)).map(x=>( {...x,_k:k} )));
}
function rowsFor(ds) {
  if (ds==='starred') return starredRows();
  if (TOPICS[ds]) {
    const t=TOPICS[ds];
    return (data.papers||[]).filter(x=>{
      if (isSeed(x)) return false;
      const txt=(x.title+' '+(x.summary||'')).toLowerCase();
      return t.kw.some(k=>txt.includes(k));
    }).map(x=>( {...x,_k:ds} ));
  }
  return ds==='all'?allRows():(data[ds]||[]).filter(x=>!isSeed(x)).map(x=>( {...x,_k:ds} ));
}
function filtered() {
  const q=state.q.trim().toLowerCase(), from=cutoff(state.dr);
  let rows=rowsFor(state.ds);
  if (q) rows=rows.filter(x=>JSON.stringify(x).toLowerCase().includes(q));
  if (from) rows=rows.filter(x=>dateOf(x)>=from);
  return rows.sort((a,b)=>{
    if (state.sort==='score') return scoreOf(b)-scoreOf(a);
    if (state.sort==='alpha') return titleOf(a).localeCompare(titleOf(b));
    return dateOf(b).localeCompare(dateOf(a));
  });
}

/* ── render nav ── */
function renderNav() {
  const mk = (k,lbl,ico,n) => `
    <button class="nav-btn${state.ds===k?' active':''}" data-k="${k}">
      <span class="nav-ico">${ico}</span>
      <span class="nav-lbl">${esc(lbl)}</span>
      <span class="nav-cnt">${n}</span>
    </button>`;
  document.getElementById('navMain').innerHTML =
    [['all',allRows().length],['starred',starredRows().length],...Object.entries(data).map(([k,r])=>[k,r.length])]
      .map(([k,n])=>mk(k,SRC_LABEL[k]||k,SRC_ICON[k]||'•',n)).join('');
  document.getElementById('navTopics').innerHTML =
    Object.entries(TOPICS).map(([k,t])=>mk(k,t.label,t.icon,rowsFor(k).length)).join('');
  document.getElementById('navAdv').innerHTML =
    mk('__adv__','ADVANCED','🚀','18 modules');
  document.querySelectorAll('.nav-btn').forEach(b=>b.addEventListener('click',()=>{
    state.ds=b.dataset.k; state.page=1; state.advMod=null; render();
  }));
}

let lastDs='';
function renderStats() {
  const rows=rowsFor(state.ds);
  const scored=rows.filter(x=>scoreOf(x)>0).length;
  const jobs=rows.filter(x=>x._k==='jobs').length;
  const latest=rows.map(dateOf).filter(Boolean).sort().pop()||'—';
  const items=[
    ['⚡','Total Signals',rows.length,'#818cf8'],
    ['🎯','Scored Items',scored,'#38bdf8'],
    ['💼','Job Postings',jobs,'#34d399'],
    ['📅','Latest',latest,'#fbbf24'],
  ];
  document.getElementById('stats').innerHTML = items.map(([ico,lbl,val,col])=>`
    <div class="stat" style="--sc:${col}">
      <span class="stat-ico">${ico}</span>
      <div class="stat-lbl">${lbl}</div>
      <div class="stat-num" data-target="${typeof val==='number'?val:''}"
           style="${String(val).length>8?'font-size:15px;margin-top:8px':''}">
        ${typeof val==='number'?'0':esc(String(val))}
      </div>
    </div>`).join('');

  /* stat hover handled by CSS lift */

  /* count-up */
  const doCount = state.ds!==lastDs;
  lastDs=state.ds;
  document.querySelectorAll('.stat-num[data-target]').forEach(el=>{
    const t=Number(el.dataset.target);
    if (!t) return;
    if (!doCount) { el.textContent=t.toLocaleString(); return; }
    const dur=1400, s=performance.now();
    const tick=now=>{
      const p=Math.min((now-s)/dur,1), ease=1-Math.pow(1-p,3);
      el.textContent=Math.round(ease*t).toLocaleString();
      if (p<1) requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  });
}

/* ── pagination ── */
function pageWin(c,t) {
  const s=Math.max(1,c-2),e=Math.min(t,c+2);
  const ps=[];
  for(let p=s;p<=e;p++) ps.push(p);
  if(!ps.includes(1)){ if(ps[0]>2) ps.unshift('…'); ps.unshift(1); }
  if(!ps.includes(t)){ if(ps[ps.length-1]<t-1) ps.push('…'); ps.push(t); }
  return ps;
}
function renderPag(tot) {
  const el=document.getElementById('pages');
  el.innerHTML=[
    `<button class="pgb" data-p="${state.page-1}" ${state.page===1?'disabled':''}>‹ Prev</button>`,
    ...pageWin(state.page,tot).map(p=>p==='…'
      ?`<button class="pgb" disabled>…</button>`
      :`<button class="pgb${p===state.page?' on':''}" data-p="${p}">${p}</button>`),
    `<button class="pgb" data-p="${state.page+1}" ${state.page===tot?'disabled':''}>Next ›</button>`,
  ].join('');
  el.querySelectorAll('.pgb:not([disabled])').forEach(b=>b.addEventListener('click',()=>{
    const p=Number(b.dataset.p);
    if(p&&p!==state.page){ state.page=p; render(); document.querySelector('.panel').scrollIntoView({behavior:'smooth',block:'start'}); }
  }));
}

/* ══════════════════════════════════════════
   NEURAL NETWORK BACKGROUND ANIMATION
══════════════════════════════════════════ */
(function() {
  const canvas=document.getElementById('bgCanvas');
  const ctx=canvas.getContext('2d');
  let W,H;
  function resize(){ W=canvas.width=window.innerWidth; H=canvas.height=window.innerHeight; }
  window.addEventListener('resize',resize); resize();

  const N=40, MAXD=150;
  const PCOLORS=['rgba(124,58,237,','rgba(99,102,241,','rgba(129,140,248,','rgba(14,165,233,'];
  const nodes=Array.from({length:N},()=>{
    const c=PCOLORS[Math.floor(Math.random()*PCOLORS.length)];
    return {
      x:Math.random()*window.innerWidth,
      y:Math.random()*window.innerHeight,
      vx:(Math.random()-.5)*.32,
      vy:(Math.random()-.5)*.32,
      r:Math.random()*1.8+.6,
      c, ph:Math.random()*Math.PI*2,
      ps:.008+Math.random()*.014,
    };
  });

  let mx=-2000,my=-2000;
  window.addEventListener('mousemove',e=>{ mx=e.clientX; my=e.clientY; });

  function frame() {
    ctx.clearRect(0,0,W,H);
    nodes.forEach(n=>{
      n.x+=n.vx; n.y+=n.vy; n.ph+=n.ps;
      if(n.x<0||n.x>W) n.vx*=-1;
      if(n.y<0||n.y>H) n.vy*=-1;
      n.x=Math.max(0,Math.min(W,n.x));
      n.y=Math.max(0,Math.min(H,n.y));
      const dx=n.x-mx,dy=n.y-my,md=Math.sqrt(dx*dx+dy*dy);
      if(md<110){ n.vx+=(dx/md)*.012; n.vy+=(dy/md)*.012; }
      n.vx=Math.max(-.7,Math.min(.7,n.vx*.997));
      n.vy=Math.max(-.7,Math.min(.7,n.vy*.997));
      const p=.35+Math.sin(n.ph)*.18;
      /* glow halo */
      const g=ctx.createRadialGradient(n.x,n.y,0,n.x,n.y,n.r*5);
      g.addColorStop(0,n.c+(p*.7)+')');
      g.addColorStop(1,n.c+'0)');
      ctx.beginPath(); ctx.arc(n.x,n.y,n.r*5,0,Math.PI*2);
      ctx.fillStyle=g; ctx.fill();
      /* core */
      ctx.beginPath(); ctx.arc(n.x,n.y,n.r,0,Math.PI*2);
      ctx.fillStyle=n.c+(p*1.4)+')'; ctx.fill();
    });
    /* connections */
    for(let i=0;i<N;i++) for(let j=i+1;j<N;j++) {
      const dx=nodes[i].x-nodes[j].x, dy=nodes[i].y-nodes[j].y;
      const d=Math.sqrt(dx*dx+dy*dy);
      if(d<MAXD) {
        const a=(1-d/MAXD)*.14;
        ctx.beginPath();
        ctx.moveTo(nodes[i].x,nodes[i].y);
        ctx.lineTo(nodes[j].x,nodes[j].y);
        ctx.strokeStyle=`rgba(129,140,248,${a})`;
        ctx.lineWidth=.7; ctx.stroke();
      }
    }
    requestAnimationFrame(frame);
  }
  frame();
})();

══════════════════════════════════════════ */
(function() {
  const SIX_H=6*60*60*1000;
  const end=Date.now()+SIX_H;
  const updEl=document.getElementById('nextUpd');
  const progEl=document.getElementById('refProg');

  function tick() {
    const left=end-Date.now();
    if(left<=0){ location.reload(); return; }
    const h=Math.floor(left/3600000);
    const m=Math.floor((left%3600000)/60000);
    const s=Math.floor((left%60000)/1000);
    if(updEl) updEl.textContent=`Refresh in ${h}h ${m}m ${s}s`;
    if(progEl) progEl.style.width=((left/SIX_H)*100).toFixed(2)+'%';
  }
  tick();
  setInterval(tick,1000);
  setTimeout(()=>location.reload(),SIX_H);
})();

function mktScore(k) {
  const kws=MKTS[k].kw;
  const has=txt=>kws.some(w=>txt.includes(w));
  const papers   =(data.papers||[]).filter(x=>!isSeed(x)&&has((x.title+' '+(x.summary||'')).toLowerCase())).length;
  const news     =[...(data.aiNews||[]),...(data.physicalAiNews||[]),...(data.roboticsNews||[]),...(data.embeddedNews||[])].filter(x=>!isSeed(x)&&has(JSON.stringify(x).toLowerCase())).length;
  const funding  =(data.funding||[]).filter(x=>!isSeed(x)&&has(JSON.stringify(x).toLowerCase())).length;
  const jobs     =(data.jobs||[]).filter(x=>!isSeed(x)&&has(JSON.stringify(x).toLowerCase())).length;
  const repos    =(data.repos||[]).filter(x=>!isSeed(x)&&has(JSON.stringify(x).toLowerCase())).length;
  const models   =(data.models||[]).filter(x=>!isSeed(x)&&has(JSON.stringify(x).toLowerCase())).length;
  const companies=(data.companies||[]).filter(x=>!isSeed(x)&&has(JSON.stringify(x).toLowerCase())).length;
  const research = papers*3+repos*2+models*2;
  const commercial= funding*5+companies*4;
  const demand = news*2+jobs*1;
  const total = research+commercial+demand;
  const momentum = Math.min(99,research*2+demand*3);
  const competition= Math.min(99,commercial*4);
  const opp = Math.min(99,Math.max(1,research*3+demand*2-competition*0.5+10));
  const gap = Math.max(0,research - commercial);
  return {papers,news,funding,jobs,repos,models,companies,research,commercial,demand,total,momentum,competition,opp,gap};
}

/* ── Module: ProblemMine ── */
function advProblemMine() {
  const MARKERS=['challenge','problem','limitation','lack of','difficult','lacking','absence of','gap in','fail to','struggle','insufficient','unable to','barrier'];
  const problems=[];
  const allSrc=[...(data.papers||[]),...(data.aiNews||[]),...(data.roboticsNews||[]),...(data.physicalAiNews||[])].filter(x=>!isSeed(x));
  allSrc.forEach(x=>{
    const text=plain(x.summary||x.description||'');
    if(!text) return;
    const sentences=text.split(/[.!?]/).map(s=>s.trim()).filter(s=>s.length>20&&s.length<200);
    sentences.forEach(s=>{
      const sl=s.toLowerCase();
      if(MARKERS.some(m=>sl.includes(m))){
        problems.push({problem:s,source:titleOf(x),url:hrefOf(x),date:dateOf(x),
          opp:50+Math.floor(Math.random()*45)});
      }
    });
  });
  const unique=problems.filter((p,i)=>problems.findIndex(q=>q.problem.slice(0,30)===p.problem.slice(0,30))===i);
  const top=unique.sort((a,b)=>b.opp-a.opp).slice(0,20);
  return `
  <div class="adv-metrics">
    <div class="adv-metric"><div class="adv-metric-n">${top.length}</div><div class="adv-metric-l">Problems Found</div></div>
    <div class="adv-metric"><div class="adv-metric-n">${top.filter(p=>p.opp>=80).length}</div><div class="adv-metric-l">High-Value</div></div>
    <div class="adv-metric"><div class="adv-metric-n">${new Set(top.map(p=>p.date.slice(0,7))).size}</div><div class="adv-metric-l">Date Ranges</div></div>
    <div class="adv-metric"><div class="adv-metric-n">Live</div><div class="adv-metric-l">Data Source</div></div>
  </div>
  <div class="adv-panel">
    <div class="adv-panel-hdr">⛏️ Real problems extracted from research papers & news</div>
    <ul class="adv-list">
      ${top.length?top.map((p,i)=>`
        <li class="adv-item">
          <div class="adv-rank">${i+1}</div>
          <div class="adv-item-body">
            <div class="adv-item-title" style="font-size:13.5px;font-weight:600;color:var(--t2)">"${esc(p.problem)}"</div>
            <div style="margin-top:6px;display:flex;gap:8px;flex-wrap:wrap;align-items:center">
              <a href="${esc(p.url)}" target="_blank" style="font-size:11.5px;color:var(--acc)">📄 ${esc(truncWords(p.source,8))}</a>
              ${p.date?`<span style="font-size:11px;color:var(--muted)">${p.date}</span>`:''}
              <span class="adv-tag adv-tag-green">Opp: ${p.opp}</span>
            </div>
          </div>
        </li>`).join('')
      :`<li class="adv-item"><div style="color:var(--muted);padding:20px">No problems extracted yet — add more papers with summaries.</div></li>`}
    </ul>
  </div>`;
}

/* ── Module: Signal Score Engine ── */
function advSignalEngine() {
  const WEIGHTS={research:3,funding:5,hiring:1,openSource:2,news:2};
  const calcSignal=(item,type)=>{
    const txt=JSON.stringify(item).toLowerCase();
    const hasMkt=k=>MKTS[k].kw.some(w=>txt.includes(w));
    const mktBonus=Object.keys(MKTS).filter(hasMkt).length*4;
    if(type==='paper') return Math.min(99,scoreOf(item)*10+mktBonus+20);
    if(type==='repo')  return Math.min(99,Math.log1p(scoreOf(item))*10+mktBonus+10);
    if(type==='model') return Math.min(99,Math.log1p(scoreOf(item))*8+mktBonus+15);
    return Math.min(99,mktBonus+25);
  };
  const allItems=[
    ...(data.papers||[]).filter(x=>!isSeed(x)).map(x=>{return{...x,_type:'paper',_sig:calcSignal(x,'paper')};}),
    ...(data.repos||[]).filter(x=>!isSeed(x)).map(x=>{return{...x,_type:'repo',_sig:calcSignal(x,'repo')};}),
    ...(data.models||[]).filter(x=>!isSeed(x)).map(x=>{return{...x,_type:'model',_sig:calcSignal(x,'model')};}),
    ...(data.funding||[]).filter(x=>!isSeed(x)).map(x=>{return{...x,_type:'funding',_sig:calcSignal(x,'funding')};}),
  ].sort((a,b)=>b._sig-a._sig).slice(0,25);
  const byType=t=>allItems.filter(x=>x._type===t).length;
  const typeIcon={paper:'📄',repo:'💻',model:'🧠',funding:'💰'};
  const typeColor={paper:'#34d399',repo:'#60a5fa',model:'#fb923c',funding:'#a3e635'};
  return `
  <div class="adv-metrics">
    <div class="adv-metric"><div class="adv-metric-n">${allItems[0]?._sig||0}</div><div class="adv-metric-l">Top Signal Score</div></div>

    <ul class="adv-list">
      ${allItems.map((x,i)=>{
        const tc=typeColor[x._type]||'#818cf8';

          <div class="adv-item-body">
            <div class="adv-item-title">
              <a href="${esc(hrefOf(x))}" target="_blank" style="color:var(--text)">${esc(truncWords(titleOf(x),12))}</a>
            </div>
            <div class="adv-scores">
              <span class="adv-tag" style="background:${tc}22;border:1px solid ${tc}44;color:${tc}">${ti} ${x._type}</span>
              ${scoreOf(x)?`<span class="adv-tag adv-tag-blue">${fmt(scoreOf(x))}</span>`:''}</div>
          </div>
          <div style="text-align:right;flex-shrink:0">
            <div style="font-size:22px;font-weight:900;color:${tc}">${x._sig}</div>
            <div style="font-size:10px;color:var(--muted)">signal</div>
          </div>
        </li>`;
      }).join('')}
    </ul>
  </div>`;
}

/* ── ADVANCED main renderer ── */
function renderAdvanced() {
  const wrap=document.getElementById('advWrap');
  if(state.advMod) {
    const mod=ADV_MODS.find(m=>m.id===state.advMod);
    let content='<div style="color:var(--muted);padding:40px;text-align:center">Module coming soon.</div>';
    if(state.advMod==='opportunity_radar') content=advOpportunityRadar();
    else if(state.advMod==='gapfinder')       content=advGapFinder();
    else if(state.advMod==='future_unicorn')  content=advFutureUnicorn();
    else if(state.advMod==='startup_ideas')   content=advStartupIdeas();
    else if(state.advMod==='startup_validator') content=advStartupValidator();
    else if(state.advMod==='builder_match')   content=advBuilderMatch();
    else if(state.advMod==='problemmine')     content=advProblemMine();
    else if(state.advMod==='market_intel')    content=advMarketIntel();
    else if(state.advMod==='research_map')    content=advResearchMap();
    else if(state.advMod==='startup_genome')  content=advStartupGenome();
    else if(state.advMod==='hidden_gems')     content=advHiddenGems();
    else if(state.advMod==='investor_mode')   content=advInvestorMode();
    else if(state.advMod==='graveyard')       content=advGraveyard();
    else if(state.advMod==='time_machine')    content=advTimeMachine();
    else if(state.advMod==='cofounder')       content=advCoFounder();
    else if(state.advMod==='cert_hub')        content=advCertHub();
    else if(state.advMod==='daily_brief')     content=advDailyBrief();
    else if(state.advMod==='signal_engine')   content=advSignalEngine();
    wrap.innerHTML=`
      <button class="adv-back" id="advBack">← Back to Advanced Hub</button>
      <div class="adv-mod-hdr">
        <div class="adv-mod-ico">${mod?.icon||'🚀'}</div>
        <div>
          <div class="adv-mod-title">${mod?.label||state.advMod}</div>
          <div class="adv-mod-sub">${mod?.desc||''}</div>
        </div>
      </div>
      ${content}`;
    document.getElementById('advBack')?.addEventListener('click',()=>{
      state.advMod=null; renderAdvanced();
    });
    /* bind interactive modules */
    if(state.advMod==='startup_validator') advStartupValidatorBind();
    else if(state.advMod==='builder_match') advBuilderMatchBind();
    else if(state.advMod==='cofounder') advCoFounderBind();
  } else {
    wrap.innerHTML=renderAdvHub();
    wrap.querySelectorAll('.adv-hcard').forEach(c=>c.addEventListener('click',()=>{
      state.advMod=c.dataset.mod; renderAdvanced();
      document.querySelector('.main').scrollTo({top:0,behavior:'smooth'});
    }));
  }
}

/* ── init ── */
syncVT();
render();
</script>
</body>
</html>
