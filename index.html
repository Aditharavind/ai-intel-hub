h infrastructure: the boards inside machines, the software that lets developers see through a robot&#8217;s cameras and the engineering required before a robot can leave a demo floor to do something useful. As a robotics software engineer who leads the team behind [&#8230;]"}, {"title": "Into the Omniverse: Three Workflows for Improving Vision AI Agent Accuracy With Synthetic Data and Fine-Tuning", "source": "NVIDIA Robotics", "date": "2026-06-30", "url": "https://blogs.nvidia.com/blog/vision-ai-agent-skills-omniverse-metropolis/", "summary": "Editor’s note: This post is part of Into the Omniverse, a series focused on how developers, 3D practitioners, and enterprises can transform their workflows using the latest advances in OpenUSD and NVIDIA Omniverse. Vision AI agents are becoming a practical way to automatically turn video data from the physical world into operational intelligence in factories, [&#8230;]"}, {"title": "X Square Robot brings its valuation to $2.8B with four consecutive funding rounds", "source": "Robotics Business Review", "date": "2026-06-30", "url": "https://www.therobotreport.com/x-square-robot-brings-valuation-2-8b-four-consecutive-funding-rounds/", "summary": "<p>X Square Robots' system combines foundation models, robotics hardware, a data pipeline system, and real-world deployments.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/x-square-robot-brings-valuation-2-8b-four-consecutive-funding-rounds/\">X Square Robot brings its valuation to $2.8B with four consecutive funding rounds<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "MBody AI expands service robotics operations to eleven states and Canada", "source": "Robotics Business Review", "date": "2026-06-29", "url": "https://www.therobotreport.com/mbody-ai-expands-service-robotics-operations-eleven-states-canada/", "summary": "<p>MBody AI has deployed its hardware-agnostic Orchestrator platform to Florida and California, with a pilot in Ontario.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/mbody-ai-expands-service-robotics-operations-eleven-states-canada/\">MBody AI expands service robotics operations to eleven states and Canada<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Advantages of hypoid gearing over worm, bevel and bevel-planetary", "source": "Robotics Business Review", "date": "2026-06-29", "url": "https://www.therobotreport.com/advantages-of-hypoid-gearing-over-worm-bevel-and-bevel-planetary/", "summary": "<p>Right-angle gearing often requires engineers to compromise between torque capacity and mechanical efficiency. Hypoid gearing offers a balance of mechanical efficiency, load-carrying capability, and single-stage ratio range.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/advantages-of-hypoid-gearing-over-worm-bevel-and-bevel-planetary/\">Advantages of hypoid gearing over worm, bevel and bevel-planetary<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "BMW Group deploys Figure 03 humanoid after tests with previous version", "source": "Robotics Business Review", "date": "2026-06-29", "url": "https://www.therobotreport.com/bmw-group-deploys-figure-03-humanoid-after-tests-previous-version/", "summary": "<p>The Figure 02 robot supported the production of more than 30,000 BMW X3 vehicles over 11 months in South Carolina.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/bmw-group-deploys-figure-03-humanoid-after-tests-previous-version/\">BMW Group deploys Figure 03 humanoid after tests with previous version<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Firefly Aerospace Operates NVIDIA Jetson in Lunar Orbit for the First Time", "source": "NVIDIA Robotics", "date": "2026-06-29", "url": "https://blogs.nvidia.com/blog/firefly-aerospace-nvidia-jetson-lunar-orbit/", "summary": ""}, {"title": "Insights behind Kinisi’s acquisition by Bear Robotics", "source": "Robotics Business Review", "date": "2026-06-29", "url": "https://www.therobotreport.com/insights-behind-kinisi-acquisition-by-bear-robotics/", "summary": "<p>Brennand Pierce, founder and CEO of Kinisi Robotics, discusses the company's approach to physical AI and its acquisition by Bear Robotics.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/insights-behind-kinisi-acquisition-by-bear-robotics/\">Insights behind Kinisi’s acquisition by Bear Robotics<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "AGIBOT produces 15,000th robot, marking a milestone in embodied AI deployment", "source": "Robotics Business Review", "date": "2026-06-28", "url": "https://www.therobotreport.com/agibot-produces-15000th-robot-marking-milestone-embodied-ai-deployment/", "summary": "<p>AGIBOT has rolled out 15,000 wheeled semi-humanoid robots as it moves from embodied AI from development and production to deployment.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/agibot-produces-15000th-robot-marking-milestone-embodied-ai-deployment/\">AGIBOT produces 15,000th robot, marking a milestone in embodied AI deployment<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "We know how to build smarter robots. Now, we need to learn smarter ways to test them", "source": "Robotics Business Review", "date": "2026-06-27", "url": "https://www.therobotreport.com/we-know-how-to-build-smarter-robots-now-we-need-to-learn-smarter-ways-to-test-them/", "summary": "<p>Atharv Kolhar, a staff test automation engineer at Figure AI, says the robotics industry needs a testing philosophy that scales alongside autonomy. <\/p>\n<p>The post <a href=\"https://www.therobotreport.com/we-know-how-to-build-smarter-robots-now-we-need-to-learn-smarter-ways-to-test-them/\">We know how to build smarter robots. Now, we need to learn smarter ways to test them<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "How compact cobot integration enhances autonomous mobile robot applications", "source": "The Robot Report", "date": "2026-06-27", "url": "https://www.therobotreport.com/how-compact-cobot-integration-enhances-autonomous-mobile-robot-applications/", "summary": "<p>Cobots are quickly shaping the future of warehousing, with their use rising 10-fold from 2018 to 2025, Kassow said.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/how-compact-cobot-integration-enhances-autonomous-mobile-robot-applications/\">How compact cobot integration enhances autonomous mobile robot applications<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Orbbec shows AI-powered vision systems at Automate 2026", "source": "Robotics Business Review", "date": "2026-06-26", "url": "https://www.therobotreport.com/orbbec-shows-ai-powered-vision-systems-automate-2026/", "summary": "<p>Orbbec presented industrial-grade 3D cameras for challenging automation scenarios, as well as AI integration for enhanced robotic perception.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/orbbec-shows-ai-powered-vision-systems-automate-2026/\">Orbbec shows AI-powered vision systems at Automate 2026<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Video Friday: Give Robots a Hand", "source": "IEEE Spectrum Robotics", "date": "2026-06-26", "url": "https://spectrum.ieee.org/video-friday-robot-grippers", "summary": "<img src=\"https://spectrum.ieee.org/media-library/three-fingered-robotic-gripper-arm-crawls-upright-on-a-white-table.gif?id=67036633&amp;width=1245&amp;height=700&amp;coordinates=0%2C0%2C0%2C0\" /><br /><br /><p><span>Video Friday is your weekly selection of awesome robotics videos, collected by your friends at <\/span><em>IEEE Spectrum<\/em><span> robotics. We also post a weekly calendar of upcoming robotics events for the next few months. Please <\/span><a href=\"mailto:automaton@ieee.org?subject=Robotics%20event%20suggestion%20for%20Video%20Friday\">send us your events<\/a><span> for inclusion.<\/span><\/p><h5><a href=\"https://roboticsconference.org/\">RSS 2026<\/a>: 13–17 July 2026, SYDNEY<\/h5><h5><a href=\"https://mrs.fel.cvut.cz/summer-school-2026/\">Summer School on Multi-Robot Systems<\/a>: 29 July–4 August 2026, PRAGUE<\/h5><h5><a href=\"https://actuate.foxglove.dev/\">Actuate 2026<\/a>: 18–19 August 2026, SAN FRANCISCO<\/h5><h5><a href=\"https://2026.ieee-iros.org/\">IROS 2026<\/a>: 27 September–1 October 2026, PITTSBURGH<\/h5><p>Enjoy today’s videos!<\/p><div class=\"horizontal-rule\"><\/div><div><span style=\"display: none;\"> <\/span><\/div><p class=\"rm-anchors\" id=\"yfjuag9w2hg\">The best way of introducing a new <a href=\"https://spectrum.ieee.org/dlr-super-robust-robot-hand\" target=\"_blank\">robot hand<\/a> is to have a disembodied one crawling across a table.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.tangentrobotics.ai/\">Tangent Robotics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"auamgssnyqm\"><em>MIT CSAIL’s Improbable AI Lab Director Pulkit Agrawal explains his “SoftMimic” approach to making robots safer around humans.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://arxiv.org/abs/2510.17792\">SoftMimic<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"uskdotwb0k4\">I now have absolutely no interest in a humanoid robot for my home unless it can do this.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.pndbotics.com/\">PNDbotics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"ueon0tm0jzs\"><em>The <a href=\"https://spectrum.ieee.org/video-friday-heavy-lift-drones\" target=\"_blank\">DARPA Lift Challenge<\/a> is open to the public August 6-9, 2026, at the National Museum of the US Air Force.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.darpa.mil/research/challenges/lift\">DARPA<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"76cusj01dn8\"><em>Getting Digit to step and shuffle around an obstacle on the floor is a real test of reactive footstep planning. Digit has to spot something small and moving, recalculate where to place each foot, and keep working—all without breaking stride or losing balance. That’s the same dynamic footwork Digit uses to navigate clutter and foot traffic on a real warehouse floor.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.agilityrobotics.com/\">Agility Robotics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"9lgujrgb_kq\">This is the most aggressive <a href=\"https://spectrum.ieee.org/firefighting-robot-snake-flies-on-jets-of-water\" target=\"_blank\">firefighting robot<\/a> I’ve ever seen.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.deeprobotics.cn/en\">DEEP Robotics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"rio7kurb53o\">Wait a sec, Dusty can print things on floors besides construction layouts? How is this not in every city, making sidewalks exciting and fun everywhere?!<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.dustyrobotics.com/\">Dusty<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"mtmyfvd4zcw\">I am the first to admit that for US $4,900, the performance of the Unitree R1 is very impressive. But what is it going to do out in the world such that it will give you some sort of return on that investment?<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.unitree.com/R1\">Unitree R1<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"ij93ftr3hqe\">Event cameras are extraordinarily powerful because they can see motion, but what if everything is moving because your camera is moving? Oh no!<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://rpg.ifi.uzh.ch/\">University of Zurich Robotics & Perception Group<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"hleaklk4ixm\"><em>Can we understand whale behavior and language? Harvard SEAS Professor Stephanie Gil explains the possibility of understanding animal language and behavior using AI-driven robots and machine learning.  With ongoing whale research and advancements in artificial intelligence, the potential for animal communication with whales could become a tangible reality.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://react.seas.harvard.edu/\">Harvard SEAS<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"upxxhr8r7-a\"><em>Rodney Brooks, founder and chief technology officer of Robust.AI, sits down with Forbes Assistant Managing Editor Kerry Dolan to discuss how he came up with the idea of the Roomba vacuum cleaner and the future of robotics.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.linkedin.com/posts/rodney-brooks-1a137517_how-ants-inspired-this-founder-to-build-a-activity-7475766254587387904-ZsL9/\">LinkedIn<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"h_dtuu5jl3g\">Here are a couple of interesting presentations from UIST 2025, including everyday objects that move around your home with a mind of their own and a project featuring teamwork between helium balloons and ground robots called Buoyancé.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p class=\"shortcode-media shortcode-media-youtube\"> <span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://programs.sigchi.org/uist/2025\">UIST 2025<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div>"}, {"title": "General Intuition raises $320M to use video game data to train robots", "source": "Robotics Business Review", "date": "2026-06-26", "url": "https://www.therobotreport.com/general-intuition-raises-320m-uses-video-game-data-train-robots/", "summary": "<p>General Intuition is using video game clips with embedded action labels to speed up AI training for robotics. <\/p>\n<p>The post <a href=\"https://www.therobotreport.com/general-intuition-raises-320m-uses-video-game-data-train-robots/\">General Intuition raises $320M to use video game data to train robots<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "ARM Institute expands RoboticsCareer.org into physical AI", "source": "Robotics Business Review", "date": "2026-06-25", "url": "https://www.therobotreport.com/arm-institute-launches-physical-ai-focused-expansion-roboticscareer-org/", "summary": "<p>RoboticsCareer.org now lists the growing job opportunities in physical AI and enables employers to connect to qualified talent.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/arm-institute-launches-physical-ai-focused-expansion-roboticscareer-org/\">ARM Institute expands RoboticsCareer.org into physical AI<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Hirebotics offers no-code, explosion-proof cobot for painting", "source": "Robotics Business Review", "date": "2026-06-25", "url": "https://www.therobotreport.com/hirebotics-offers-no-code-explosion-proof-cobot-for-painting/", "summary": "<p>Hirebotics' Cobot Painter supports stationary painting, with parts placed in a paint booth where robots perform all spraying operations.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/hirebotics-offers-no-code-explosion-proof-cobot-for-painting/\">Hirebotics offers no-code, explosion-proof cobot for painting<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Robust.AI chooses Aptiv PULSE sensor for Gen 3 Carter mobile robot", "source": "Robotics Business Review", "date": "2026-06-25", "url": "https://www.therobotreport.com/robust-ai-chooses-aptiv-pulse-sensor-for-gen-3-carter-mobile-robot/", "summary": "<p>Aptiv provides sensor fusion from radar and vision using AI to enable Robust.AI's Carter robot to move safely around people.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/robust-ai-chooses-aptiv-pulse-sensor-for-gen-3-carter-mobile-robot/\">Robust.AI chooses Aptiv PULSE sensor for Gen 3 Carter mobile robot<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Deep dive into Arm’s physical AI and robotics strategies with Drew Henry", "source": "Robotics Business Review", "date": "2026-06-24", "url": "https://www.therobotreport.com/deep-dive-into-arms-physical-ai-and-robotics-strategies-with-drew-henry/", "summary": "<p>Arm EVP Drew Henry discusses the future of physical AI, robotics, and autonomous systems built for real-world constraints.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/deep-dive-into-arms-physical-ai-and-robotics-strategies-with-drew-henry/\">Deep dive into Arm&#8217;s physical AI and robotics strategies with Drew Henry<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Humanoid maker Agility Robotics to go public through SPAC merger", "source": "Robotics Business Review", "date": "2026-06-24", "url": "https://www.therobotreport.com/humanoid-maker-agility-robotics-go-public-through-spac-merger/", "summary": "<p>Agility Robotics will merge with Churchill Capital Corp XI, raising $620 million to advance Digit v5 and fulfill growing customer orders.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/humanoid-maker-agility-robotics-go-public-through-spac-merger/\">Humanoid maker Agility Robotics to go public through SPAC merger<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Mantis Robotics launches dual-arm, fenceless robot", "source": "Robotics Business Review", "date": "2026-06-24", "url": "https://www.therobotreport.com/mantis-robotics-launches-dual-arm-fenceless-robot/", "summary": "<p>Mantis said the robot allows for new flexibility in how to configure automation in complex, real-world environments.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/mantis-robotics-launches-dual-arm-fenceless-robot/\">Mantis Robotics launches dual-arm, fenceless robot<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "FAULHABER focuses on torque, noise, and power with new GPT gearheads", "source": "Robotics Business Review", "date": "2026-06-24", "url": "https://www.therobotreport.com/faulhaber-focuses-torque-noise-power-new-gpt-gearheads/", "summary": "<p>FAULHABER says its new GPT gearheads work with motors in its standard range and provide more performance with a compact design. <\/p>\n<p>The post <a href=\"https://www.therobotreport.com/faulhaber-focuses-torque-noise-power-new-gpt-gearheads/\">FAULHABER focuses on torque, noise, and power with new GPT gearheads<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Reservoir acquires Contain to scale agtech startups", "source": "Robotics Business Review", "date": "2026-06-24", "url": "https://www.therobotreport.com/reservoir-acquires-contain-to-scale-agtech-startups/", "summary": "<p>Reservoir has acquired agriculture finance platform Contain,, naming founder Nicola Kerslake general partner to help scale AI startups.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/reservoir-acquires-contain-to-scale-agtech-startups/\">Reservoir acquires Contain to scale agtech startups<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Why physical AI 2.0 needs a reality check", "source": "Robotics Business Review", "date": "2026-06-23", "url": "https://www.therobotreport.com/why-physical-ai-2-0-needs-reality-check/", "summary": "<p>While vision and language are key parts of physical AI, physical state recovery will enable robots to interact with the world, says a columnist.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/why-physical-ai-2-0-needs-reality-check/\">Why physical AI 2.0 needs a reality check<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "CreateMe partners with Avalo and Laguna Fabrics to bring resilience to ts/\">ExRobotics launches UL-certified inspection robot for hazardous environments<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "NVIDIA releases Halos, a full-stack safety system for robotics", "source": "Robotics Business Review", "date": "2026-06-22", "url": "https://www.therobotreport.com/nvidia-releases-halos-a-full-stack-safety-system-for-robotics/", "summary": "<p>NVIDIA said Halos connects AI compute, system software, sensor data, safety applications, and inspection for robotic systems.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/nvidia-releases-halos-a-full-stack-safety-system-for-robotics/\">NVIDIA releases Halos, a full-stack safety system for robotics<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Cobot’s Proxie Gen 2 robot adds autotasking, mobile manipulation", "source": "Robotics Business Review", "date": "2026-06-22", "url": "https://www.therobotreport.com/cobots-proxie-gen-2-robot-adds-autotasking-mobile-manipulation/", "summary": "<p>Cobot founder and CEO Brad Porter said Proxie Gen 2 can determine when materials are ready to move, identify destinations, and create tasks without human intervention.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/cobots-proxie-gen-2-robot-adds-autotasking-mobile-manipulation/\">Cobot&#8217;s Proxie Gen 2 robot adds autotasking, mobile manipulation<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "How Intrinsic eliminates manual robot coding", "source": "Robotics Business Review", "date": "2026-06-22", "url": "https://www.therobotreport.com/how-intrinsic-eliminates-manual-robot-coding/", "summary": "<p>Alphabet’s Intrinsic has debuted its AI-powered \"Intelligence Cell\" to simplify factory automation and eliminate complex robot programming.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/how-intrinsic-eliminates-manual-robot-coding/\">How Intrinsic eliminates manual robot coding<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Bear Robotics acquires Kinisi Robotics to boost its physical AI capabilities", "source": "Robotics Business Review", "date": "2026-06-22", "url": "https://www.therobotreport.com/bear-robotics-acquires-kinisi-robotics-to-boost-its-physical-ai-capabilities/", "summary": "<p>Kinisi's KR1 humanoid robot, its Bristol-based engineering team, and its physical AI capabilities will be integrated into Bear Robotics.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/bear-robotics-acquires-kinisi-robotics-to-boost-its-physical-ai-capabilities/\">Bear Robotics acquires Kinisi Robotics to boost its physical AI capabilities<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Eclipse Automation launches RealitySync simulation platform", "source": "Robotics Business Review", "date": "2026-06-22", "url": "https://www.therobotreport.com/eclipse-automation-launches-realitysync-simulation-platform/", "summary": "<p>Eclipse said its new RealitySync platform allows manufacturers to step into their future factory before it’s built.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/eclipse-automation-launches-realitysync-simulation-platform/\">Eclipse Automation launches RealitySync simulation platform<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "FORT and NVIDIA launch AI-driven Outside-In Safety blueprint", "source": "Robotics Business Review", "date": "2026-06-22", "url": "https://www.therobotreport.com/fort-and-nvidia-launch-ai-driven-outside-in-safety-blueprint/", "summary": "<p>FORT Robotics and NVIDIA launch Outside-In Safety, using external sensors to improve autonomous robot productivity and worker safety.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/fort-and-nvidia-launch-ai-driven-outside-in-safety-blueprint/\">FORT and NVIDIA launch AI-driven Outside-In Safety blueprint<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Güdel to show grinding beyond stationary robots with vertical, horizontal motion at Automate 2026", "source": "Robotics Business Review", "date": "2026-06-21", "url": "https://www.therobotreport.com/gudel-to-showcase-grinding-beyond-stationary-robots-integrated-vertical-horizontal-motion-automate/", "summary": "<p>Güdel has added two degrees of freedom to heavy-duty robotic grinding applications through its TMV and TMF systems.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/gudel-to-showcase-grinding-beyond-stationary-robots-integrated-vertical-horizontal-motion-automate/\">Güdel to show grinding beyond stationary robots with vertical, horizontal motion at Automate 2026<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Defense manufacturing readiness hinges on autonomous finishing, says GrayMatter Robotics", "source": "Robotics Business Review", "date": "2026-06-20", "url": "https://www.therobotreport.com/defense-manufacturing-readiness-hinges-autonomous-surface-prep-says-graymatter/", "summary": "<p>The Navy's industrial base review identified a projected need for 174,000 new workers. GrayMatter says robotics can fill this gap.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/defense-manufacturing-readiness-hinges-autonomous-surface-prep-says-graymatter/\">Defense manufacturing readiness hinges on autonomous finishing, says GrayMatter Robotics<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "What Amazon’s Astro Taught Me About Giving Robots a Soul", "source": "IEEE Spectrum Robotics", "date": "2026-06-19", "url": "https://spectrum.ieee.org/amazon-astro-robot-sound", "summary": "<img src=\"https://spectrum.ieee.org/media-library/cute-wheeled-home-robot-with-a-tablet-face-set-against-a-blue-heart-patterned-background.jpg?id=66906422&amp;width=1245&amp;height=700&amp;coordinates=0%2C187%2C0%2C188\" /><br /><br /><p>In 2018, Amazon brought me in as the lead UX Sound Designer for <a href=\"https://spectrum.ieee.org/amazon-astro-robot\" target=\"_blank\">Astro, its first consumer home robot<\/a>. Astro used cameras and other sensors to map and navigate your <a href=\"https://spectrum.ieee.org/ai-robots\" target=\"_blank\">home and workplace<\/a>, and could proactively patrol, check up on loved ones, and transport small items using its built-in cargo bin. While there was a well-defined feature set and form factor, initially there was no character direction. In fact, even before <a href=\"https://www.amazon.com/Introducing-Amazon-Astro/dp/B078NSDFSB\" target=\"_blank\">Astro<\/a> had a name, there were two main questions—was it simply Alexa on wheels, or was it a robot with its own character?<\/p><p>The Astro team was divided. One option was to focus on Alexa, and treat the mobile robot simply as an added utility. Along with the majority of the UX team, I argued for Astro to not focus on Alexa. Our belief was that a thing that moves through your home and turns toward you with intent can never be just an appliance. People would ascribe character to it whether we wanted them to or not, and so the only question was whether we shaped that character or let it happen by accident.<\/p><p>Ultimately, <a href=\"https://www.aboutamazon.com/news/devices/meet-astro-a-home-robot-unlike-any-other\" target=\"_blank\">Astro became Astro rather than Alexa<\/a>, and user testing backed up our decision. People <em><em>didn’t<\/em><\/em> see the robot as Alexa. They saw it as its own character, and that’s what they wanted it to be. Alexa on the device felt somewhat strange and creepy, but building Astro its own voice was too slow and expensive in 2018. So, we settled on Alexa as a supporting character that handled any actual talking, while Astro was the main character, communicating as much as it could without words, through sound, motion, and facial expressions.<\/p><p>I had been brought on to the Astro team to define the robot’s sound design language and voice. But there was no one to flesh out the robot’s actual character. You cannot make a single real decision about a character without defining it first. Every choice about how Astro moved, sounded, paused, or reacted was a character choice, and those choices required all disciplines working together. As sound lead, I was weaving together sound, motion, and character, and how they played together inside each story moment. The animators, who programmed Astro’s motion and facial expressions, were extraordinary at what they did, but the emotional arc they were animating came from the sound (and therefore character) work first. So I stepped into that role, which is where my real work started. What I learned about building character for robots applies to nearly everything being built in embodied AI right now.<\/p><h2>Character Is a Design System<\/h2><p>Developing a character for Astro meant answering questions that had never been asked about a product at Amazon: What is the emotional range of this robot’s baseline state? How does this robot communicate uncertainty without eroding trust? Where is the line between being expressive and annoying? What are the vulnerabilities of this device’s character?<\/p><p>These are design questions. They have real answers, and every team working on the product has to build from them. For example, Astro’s emotional range was designed to be relatively small at first. We never wanted Astro to get too sad or too angry. It could play sad, but would snap out of it quickly and end the reaction on a high note to keep things positive.<\/p><p class=\"shortcode-media shortcode-media-youtube\"> <span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>Character leaks out of every seam and can create a disjointed experience if not defined correctly. Even if it’s just animation timing that’s slightly off, or a response that’s technically correct but contextually tone-deaf, users feel every one of these inconsistencies, even if they can’t name them. Watch what happens at the beginning and end of this Sing sequence:<\/p><p class=\"shortcode-media shortcode-media-youtube\"> <span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>Astro goes from nothing, into the emotional moment, and then lands back on nothing. No buildup, no cooldown, no sense that the feeling came from somewhere or had anywhere to go. I pushed hard for better character stitching, the transitions in and out of expressive moments that make a performance feel continuous rather than assembled, but it never got implemented. The moment itself works. But without the stitching, it reads as a clip playing on a robot rather than coming from within the robot character itself.<\/p><h2>Story and Sound at the Beginning<\/h2><p>We had decided that Astro would have no spoken dialogue, but it had something that functioned the same way: a vocabulary of sounds, tones, and rhythms that acted as its voice. This vocabulary became the leading output of the character’s personality. The robot’s motion and facial expressions were built around it.<\/p><p>Astro’s wake-up sequence is a great example. Waking wasn’t just a boot animation on the screen; it was an entire performance. Slow and humble at first, the robot oriented itself quietly, then stretched its screen, checked its wheels, and finally, with an upward gesture toward its telescoping mast, it popped it up slightly, and did a little dance of joy. Sound, motion, and eyes hit every beat<em> <\/em>together in full choreography.<\/p><p class=\"shortcode-media shortcode-media-youtube\"> <span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>The character’s output in that sequence was first written as a story. Astro is waking up in its new home for the first time. Its main aspiration is to be part of a family, so this is the moment it has been waiting for, this is its purpose. Being the responsible character that it is, it wants to make sure everything is good to go before it introduces itself and starts learning its new home.<\/p><p>This narrative came first because it drove every other decision that we made. After the story was written, sound gave that story a metaphorical voice: the excited tones, the pacing as it checked its wheels, and the bright melodic phrase as Astro looked up at its new family for the first time and introduced itself. Once the sound was laid down, the animation team did their thing with motion and facial expressions, taking cues from the emotional arc the sound had established. Motion didn’t lead—it followed the feeling of the story and the sounds, the same way an animator follows a recorded vocal take.<\/p><p>That wake-up sequence became one of the most-discussed moments in early user testing. People described it as “alive.” What they were responding to wasn’t any single element. It was all three channels (sound, motion, and facial expressions) expressing the same defined character in harmony.<\/p><h2>Context Is Where Character Becomes Real<\/h2><p>The most compelling characters are defined not by a fixed disposition but by how they respond to their environments and the people in them. They’re still recognizably themselves even as they adapt. This is what I call contextual character. A robot living in a home doesn’t occupy a single emotional state. It moves through rooms with different energy, encounters people in different moods, operates at different times of day, and responds to an endless range of social situations it was never explicitly designed for.<\/p><p>We got close to a contextual character output with Astro’s sound. When a specific piece of environmental context was fed in, the system adapted beautifully, and Astro felt completely alive. But every state like this was still a prediction we made by hand—a situation we had to imagine in advance and design a response for. A random home throws more situations at a robot than anyone can possibly predict, so there was always a longer tail of moments the system was never prepared for.<\/p><p>The difference between a product people describe as “smart” and one they describe as “aware” often comes down to this. Smartness is capability. Awareness is context. Presence is character. And character is always in reaction to the people around it, to its environment, to its own evolving state. That’s what makes it feel like something is emotionally present with you.<\/p><p>This is where AI changes the game for character design in ways that go well beyond what was possible with Astro. AI-driven adaptation doesn’t require the contextual predictions that we relied on. It learns the specific rhythms, preferences, and emotional context of the people it lives and works with. The character doesn’t just respond to context. It <em><em>grows<\/em><\/em> into it.<\/p><h2>What Industry Is Missing<\/h2><p>The character and soul of the impending wave of embodied AI products appears to almost always be an afterthought. And character defined late is character defined by default. It becomes the sum of a thousand small decisions made by different people thinking about anything but character. People project character onto devices whether you plan for it or not, especially if those devices move—a robot that moves is <em><em>already<\/em><\/em> a character. If nobody has designed this character, the result will be products that feel like nothing, or worse, feel confusing and not trustworthy. Technically impressive, but lifeless.<\/p><p>We did not get this fully right with Astro. So many things were moving in parallel that character was rarely treated as a utility, and it made sense why. When you are building a first-of-its-kind product, the things that are the loudest are the ones that break, the deadlines, the costs, the features a customer can point to on a box. Character is quieter than all of that. It’s easy to assume it can come later. On a team as large as the Amazon Astro team, it’s lucky to get any idea onto the road map when it is competing with a hundred others that all feel more urgent in the moment. None of this came from people not caring. It came from character being the kind of thing that is hard to prioritize until you see what its absence costs you.<\/p><h2>My Asks to Product Leaders<\/h2><p>If you are building a product that will share physical or conversational space with people, three things are worth considering:<\/p><p><strong>Define character before you define interactions.<\/strong> You need a defensible character with enough emotional logic to answer hard questions consistently. Find answers to character questions early, and have every discipline build from the same foundation.<\/p><p><strong>Build story and sound into the character pipeline, not the production pipeline.<\/strong> Story and sound developed alongside character definition has the chance to inform motion, expression, and interaction logic. This requires a different kind of collaboration, and a different kind of hire.<\/p><p><strong>Design for adaptation, not just consistency.<\/strong> A consistent character is necessary, but the products that will matter most in people’s lives are the ones that deepen through use. The infrastructure to support that is more and more accessible, but the design thinking to take advantage of it is still rare.<\/p><div class=\"horizontal-rule\"><\/div><p><em><em>An expanded version of this story is available on <a href=\"https://medium.com/@mikeforstmusic/what-amazons-astro-taught-me-about-giving-ai-a-soul-989fcd9c45f4\" target=\"_blank\">Medium<\/a>.<\/em><\/em><\/p>"}], "embeddedNews": [{"title": "20 FPS on E-Paper Display Without Help", "source": "Hackaday", "date": "2026-07-21", "url": "https://hackaday.com/2026/07/21/20-fps-on-e-paper-display-without-help/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"450\" src=\"https://hackaday.com/wp-content/uploads/2026/07/eink-fps-main.jpg?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>If electronic paper displays have one downside, it&#8217;s generally refresh rate. Earlier versions of the tech might only have been able to do single-digit frames per second, while modern, mid-range <a class=\"read-more\" href=\"https://hackaday.com/2026/07/21/20-fps-on-e-paper-display-without-help/\">&#8230;read more<\/a>"}, {"title": "Google Maps Killed the Restaurant Star", "source": "Hackaday", "date": "2026-07-21", "url": "https://hackaday.com/2026/07/20/google-maps-killed-the-restaurant-star/", "summary": "<div><img alt=\"Two maps of London turned into hexagonal regions heat mapped from white to peach to purple. The left map is according to: density, ratings, surprise, cuisine diversity, and independent share. The map on the right of merged data assigns the dominant hub type in a region. Purple is assigned a value of &quot;Elite&quot;, reddish orange is &quot;Strong&quot;, peach is &quot;Everyday&quot;, and white/grey is &quot;Weak.&quot; The five locations deemed to be the highest scorers were Ealing-Acton, Kingston Upon Thames, Enfield, Bromley, and Havering.\" class=\"attachment-large size-large wp-post-image\" height=\"416\" src=\"https://hackaday.com/wp-content/uploads/2026/07/London-Restaurant-Hubs-Machine-Learning.jpg?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>We all know that Google and other big players pick and choose what information people see, but we sometimes overlook it outside of the search and social media space. [Lauren <a class=\"read-more\" href=\"https://hackaday.com/2026/07/20/google-maps-killed-the-restaurant-star/\">&#8230;read more<\/a>"}, {"title": "Detection of a Four-Carbon Sugar in Interstellar Space", "source": "Hackaday", "date": "2026-07-21", "url": "https://hackaday.com/2026/07/20/detection-of-a-four-carbon-sugar-in-interstellar-space/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"420\" src=\"https://hackaday.com/wp-content/uploads/2026/07/erythrulose_interstellar_medium_jimenez-serra_et_al_nature_astronomy_2026.jpg?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>Although life tends to find a way, something first has to kickstart said lifeforms. Exactly how the first biological cells formed on Earth &#8211; and potentially on other worlds &#8211; <a class=\"read-more\" href=\"https://hackaday.com/2026/07/20/detection-of-a-four-carbon-sugar-in-interstellar-space/\">&#8230;read more<\/a>"}, {"title": "ART-Pi II development board features 600 MHz STM32H7R7 Cortex-M7 MCU with NeoChrom GPU", "source": "CNX Software", "date": "2026-07-21", "url": "https://www.cnx-software.com/2026/07/21/art-pi-ii-development-board-features-600-mhz-stm32h7r7-cortex-m7-mcu-with-neochrom-gpu/", "summary": "<div><img alt=\"STM32H7R7 development board\" class=\"attachment-medium size-medium wp-post-image\" height=\"405\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/07/STM32H7R7-development-board-720x405.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>The 600 MHz STM32H7R/S Cortex-M7 microcontroller family with an optional NeoChrom  2.5D GPU and up to 640 KB SRAM and 64 KB flash was introduced in 2024. However, apart from ST&#8217;s own development boards such as the NUCLEO-H7S3L8 and STM32H7S78-DK, we hadn&#8217;t seen any boards based on it. The ART-Pi II development board changes that.  It&#8217;s a compact board powered by an STM32H7R7L8H microcontroller paired with 32 MB HyperRAM and 64 MB HyperFlash, and featuring a microSD card slot, WiFi 4 and Bluetooth 5.1 connectivity, two USB-C ports (OTG and Debug), a 40-pin Raspberry Pi-compatible GPIO header, a 28-pin GPIO header, two Qwiic connectors, and an on-board debugger. ART-Pi II board specifications: MCU &#8211; STMicro STM32H7R7L8H CPU core &#8211; Arm Cortex-M7 @ up to 600 MHz GPU &#8211; NeoChrom 2.5D GPU Memory &#8211; 64 KB flash Storage &#8211;  620 KB SRAM Package &#8211; TFBGA225 Memory &#8211; 32 MB HyperRAM Storage [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/07/21/art-pi-ii-development-board-features-600-mhz-stm32h7r7-cortex-m7-mcu-with-neochrom-gpu/\">ART-Pi II development board features 600 MHz STM32H7R7 Cortex-M7 MCU with NeoChrom GPU<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "nRF54L Arduino Core project brings Arduino support to Nordic Semi nRF54L wireless SoCs", "source": "CNX Software", "date": "2026-07-21", "url": "https://www.cnx-software.com/2026/07/21/nrf54l-arduino-core-project-brings-arduino-support-to-nordic-semi-nrf54l-wireless-socs/", "summary": "<div><img alt=\"nRF54L Arduino Core\" class=\"attachment-medium size-medium wp-post-image\" height=\"341\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/07/nRF54L-Arduino-Core-720x341.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>nRF54L Arduino Core is an open-source project designed to bring Arduino support for Nordic Semiconductor nRF54L wireless SoCs, starting with Seeed Studio&#8217;s XIAO nRF54L15 (Sense) and XIAO nRF54LM20A (Sense) boards, as well as compatible Holyiot nRF54L15 modules. Since the launch of the nRF52840-based Arduino Nano 33 BLE  board in 2019, Nordic nRF52 wireless microcontrollers have been officially supported by the Arduino IDE. However, it&#8217;s not quite the case for the newer nRF54L Cortex-M33 microcontrollers. Lolren has decided to change that with the unofficial nRF54 Arduino core project. nRF54L Arduino Core highlights: Dual-core access &#8211; Use the 128 MHz Cortex-M33 application CPU and the VPR RISC-V coprocessor without adopting a vendor RTOS Wireless Bluetooth LE support &#8211; Peripheral, central, dual-role, GATT server/client, HID, BLE UART, PHY/DLE/MTU control, LE Secure Connections, bonding, OOB, Numeric Comparison, privacy/RPA, and CSRK signed writes Experimental support for Zigbee &#8211; Partial stack and device demonstrations; incomplete Zigbee [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/07/21/nrf54l-arduino-core-project-brings-arduino-support-to-nordic-semi-nrf54l-wireless-socs/\">nRF54L Arduino Core project brings Arduino support to Nordic Semi nRF54L wireless SoCs<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "UKDI launches Novel Autonomy and Robotics Competition", "source": "Electronics Weekly", "date": "2026-07-21", "url": "https://www.electronicsweekly.com/news/business/ukdi-launches-novel-autonomy-and-robotics-competition-2026-07/", "summary": "<p>The UKDI (UK Defence Innovation) department has launched a new &#8220;Themed Competition&#8221;: Novel Autonomy and Robotics. It is looking for ideas that may be matured to support the military use [&#8230;]<\/p>\n<p>The post <a href=\"https://www.electronicsweekly.com/news/business/ukdi-launches-novel-autonomy-and-robotics-competition-2026-07/\">UKDI launches Novel Autonomy and Robotics Competition<\/a> appeared first on <a href=\"https://www.electronicsweekly.com\">Electronics Weekly<\/a>.<\/p>"}, {"title": "Shake-up for tech ministers", "source": "Electronics Weekly", "date": "2026-07-21", "url": "https://www.electronicsweekly.com/news/business/shake-up-for-tech-ministers-2026-07/", "summary": "<p>The Department for Science, Innovation and Technology (DSIT) has been abolished with most of its functions taken over by the Department for Business, Innovation , Science and Trade (BIST). Jonathan [&#8230;]<\/p>\n<p>The post <a href=\"https://www.electronicsweekly.com/news/business/shake-up-for-tech-ministers-2026-07/\">Shake-up for tech ministers<\/a> appeared first on <a href=\"https://www.electronicsweekly.com\">Electronics Weekly<\/a>.<\/p>"}, {"title": "Cambridge startup using AI for materials research raises $450m", "source": "Electronics Weekly", "date": "2026-07-21", "url": "https://www.electronicsweekly.com/news/business/cambridge-startup-using-ai-for-materials-research-raises-450m-2026-07/", "summary": "<p>CuspAI, a two-year-old Cambridge startup using AI to discover new materials, has completed a $450 million Series B funding round at a $2.6 billion valuation.. Investors included  Kleiner Perkins, NEA. [&#8230;]<\/p>\n<p>The post <a href=\"https://www.electronicsweekly.com/news/business/cambridge-startup-using-ai-for-materials-research-raises-450m-2026-07/\">Cambridge startup using AI for materials research raises $450m<\/a> appeared first on <a href=\"https://www.electronicsweekly.com\">Electronics Weekly<\/a>.<\/p>"}, {"title": "Hidden debt for obsolescent assets", "source": "Electronics Weekly", "date": "2026-07-21", "url": "https://www.electronicsweekly.com/news/business/hidden-debt-for-obsolescent-assets-2026-07/", "summary": "<p>Concern is growing about the amount of undisclosed debt taken on-board by hyperscalers to invest in rapidly obsolescing AI datacentres. The server replacement cycle in AI datacentres is now 18-36 [&#8230;]<\/p>\n<p>The post <a href=\"https://www.electronicsweekly.com/news/business/hidden-debt-for-obsolescent-assets-2026-07/\">Hidden debt for obsolescent assets<\/a> appeared first on <a href=\"https://www.electronicsweekly.com\">Electronics Weekly<\/a>.<\/p>"}, {"title": "Siemens buys Precision Innovations", "source": "Electronics Weekly", "date": "2026-07-21", "url": "https://www.electronicsweekly.com/news/business/siemens-buys-precision-innovations-2026-07/", "summary": "<p>Siemens has bought Precision Innovations, the privately held, seven year-old, San Diego EDA specialist. Precision Innovations develops EDA software built on the open-source OpenROAD framework to help semiconductor teams evaluate [&#8230;]<\/p>\n<p>The post <a href=\"https://www.electronicsweekly.com/news/business/siemens-buys-precision-innovations-2026-07/\">Siemens buys Precision Innovations<\/a> appeared first on <a href=\"https://www.electronicsweekly.com\">Electronics Weekly<\/a>.<\/p>"}, {"title": "Anglia signs BeRex", "source": "Electronics Weekly", "date": "2026-07-21", "url": "https://www.electronicsweekly.com/news/anglia-signs-berex-2026-07/", "summary": "<p>Anglia has signed a pan-European franchise agreement with BeRex, the Korean analogue RF and microwave semiconductor specialist. BeRex’s product range includes high quality and cost effective solutions for wireless applications, [&#8230;]<\/p>\n<p>The post <a href=\"https://www.electronicsweekly.com/news/anglia-signs-berex-2026-07/\">Anglia signs BeRex<\/a> appeared first on <a href=\"https://www.electronicsweekly.com\">Electronics Weekly<\/a>.<\/p>"}, {"title": "When The UK Took On IBM", "source": "Electronics Weekly", "date": "2026-07-21", "url": "https://www.electronicsweekly.com/blogs/mannerisms/memory-lane/when-the-uk-took-on-ibm-2026-07/", "summary": "<p>When the UK had a computer company which competed with IBM, Electronics Weekly carried one of its ads in its edition of October 12th 1960: [dropcap][/dropcap] &#160;<\/p>\n<p>The post <a href=\"https://www.electronicsweekly.com/blogs/mannerisms/memory-lane/when-the-uk-took-on-ibm-2026-07/\">When The UK Took On IBM<\/a> appeared first on <a href=\"https://www.electronicsweekly.com\">Electronics Weekly<\/a>.<\/p>"}, {"title": "Sail Virtually Aboard the “Itanic” with IA-64 Emulator", "source": "Hackaday", "date": "2026-07-20", "url": "https://hackaday.com/2026/07/20/sail-virtually-aboard-the-itanic-with-ia-64-emulator/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"450\" src=\"https://hackaday.com/wp-content/uploads/2026/07/w2k3-luna-itanium-e1784483902142.png?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>Intel&#8217;s Itanium architecture was an interesting experiment, but it has gone down in history as one of the chip giant&#8217;s bigger flops, so much so that it earned the name <a class=\"read-more\" href=\"https://hackaday.com/2026/07/20/sail-virtually-aboard-the-itanic-with-ia-64-emulator/\">&#8230;read more<\/a>"}, {"title": "Echolocation for Drones", "source": "Hackaday", "date": "2026-07-20", "url": "https://hackaday.com/2026/07/20/echolocation-for-drones/", "summary": "<div><img alt=\"A quadcopter with a clear, U-shaped shield up front and red propellers navigates between a close stand of moss-covered trees.\" class=\"attachment-large size-large wp-post-image\" height=\"454\" src=\"https://hackaday.com/wp-content/uploads/2026/07/Ultrasonic-Sonar-Echolocation-Drone.webp?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>Bats are remarkable creatures, able to fly at night or inside the confines of caves without light to guide their way. A team of researchers at Worcester Polytechnic Institute (WPI) <a class=\"read-more\" href=\"https://hackaday.com/2026/07/20/echolocation-for-drones/\">&#8230;read more<\/a>"}, {"title": "A Feature-Rich Drum Machine", "source": "Hackaday", "date": "2026-07-20", "url": "https://hackaday.com/2026/07/20/a-feature-rich-drum-machine/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"450\" src=\"https://hackaday.com/wp-content/uploads/2026/07/drum-sequencer-main.png?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>A little over a month ago, we featured a project from [Igor] who built 64 bits of DRAM from scratch using discrete components. Jokes about memory pricing aside, he did <a class=\"read-more\" href=\"https://hackaday.com/2026/07/20/a-feature-rich-drum-machine/\">&#8230;read more<\/a>"}, {"title": "Hackaday Europe 2026: Project Gigapixel", "source": "Hackaday", "date": "2026-07-20", "url": "https://hackaday.com/2026/07/20/hackaday-europe-2026-project-gigapixel/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"533\" src=\"https://hackaday.com/wp-content/uploads/2026/07/2026-hackaday_europe-yannick_richter_DSCF6892_featured.png?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>There was once a race to put out cameras with ever higher numbers of megapixels to snare customers eager to take the highest quality digital photos. These days, we know <a class=\"read-more\" href=\"https://hackaday.com/2026/07/20/hackaday-europe-2026-project-gigapixel/\">&#8230;read more<\/a>"}, {"title": "Globalscale Case8 – A MediaTek Genio 520/720 cyberdeck for gaming, home automation, and education (Crowdfunding)", "source": "CNX Software", "date": "2026-07-20", "url": "https://www.cnx-software.com/2026/07/20/globalscale-case8-mediatek-genio-520-720-cyberdeck-for-gaming-home-automation-and-education/", "summary": "<div><img alt=\"Case8 Platfrom with gaming, home automation, and education variants\" class=\"attachment-medium size-medium wp-post-image\" height=\"480\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/07/Case8-Platfrom-with-gaming-home-automation-and-education-variants-720x480.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Globalscale Technologies has launched the Case8 series of open-source cyberdeck-style computing platforms based on MediaTek Genio 520 and Genio 720 processors. The platform is offered in hacker (PCBA only), gaming, home automation, and education variants. The Case8 is built around an OSM-L compute module with a MediaTek Genio 520 or Genio 720 SoC with up to eight cores, a Mali-G67 GPU, and a 10 TOPS NPU. Depending on the configuration, it comes with 4GB, 8GB, or 16GB LPDDR5 memory and 64GB or 128GB UFS storage, along with Gigabit Ethernet, Wi-Fi 6, Bluetooth 5.4, stereo speakers, microphones, and optional 4G/5G connectivity. Display options include a 5-inch panel for the gaming model and 7-inch touch or non-touch displays for the home automation and education variants, with camera configurations varying by model. Case8 cyberdeck platform specifications: OSM-L compute module (one or the other) MediaTek Genio 520 CPU – 2x Cortex-A78 up to 2.2GHz,  6x [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/07/20/globalscale-case8-mediatek-genio-520-720-cyberdeck-for-gaming-home-automation-and-education/\">Globalscale Case8 &#8211; A MediaTek Genio 520/720 cyberdeck for gaming, home automation, and education (Crowdfunding)<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Geniatech XPI-3576-CM5 – A Raspberry Pi CM5-compatible Rockchip RK3576 AI Compute Module with WiFi 6, Bluetooth 5.3", "source": "CNX Software", "date": "2026-07-20", "url": "https://www.cnx-software.com/2026/07/20/geniatech-xpi-3576-cm5-a-raspberry-pi-cm5-compatible-rockchip-rk3576-ai-compute-module-with-wifi-6-bluetooth-5-3/", "summary": "<div><img alt=\"Geniatech XPI-3576-CM5\" class=\"attachment-medium size-medium wp-post-image\" height=\"521\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/07/Geniatech-XPI-3576-CM5-720x521.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Geniatech XPI-3576-CM5 is a Rockchip RK3576 octa-core Arm Cortex-A72/A53 system-on-module based on the Raspberry Pi CM4/CM5 form factor with up to 16GB LPDDR5 and 128GB eMMC flash. The module also features a RealTek RTL8211F Gigabit Ethernet controller, an Ampak AP6275S wireless module for dual-band WiFi 6 and Bluetooth 5.3 connectivity, and a Rockchip RK806S-5 PMIC for power management. It features two 100-pin B2B connectors, allowing it to be plugged into carrier boards designed for the Raspberry Pi CM4/CM5, with some limitations as we&#8217;ll see further below. Geniatech XPI-3576-CM5 specifications SoC – Rockchip RK3576 Octa-core CPU – 4x Cortex-A72 cores at 2.2GHz, 4x Cortex-A53 cores at 1.8GHz GPU – Arm Mali-G52 MC3 GPU at 1 GHz with support for OpenGL ES 3.2, OpenCL 2.0, and Vulkan 1.1 NPU – 6 TOPS (INT8) AI accelerator with support for INT4/INT8/INT16/BF16/TF32 mixed operations. VPU Video Decoder – H.264, H.265, VP9, AV1, and AVS2 up to [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/07/20/geniatech-xpi-3576-cm5-a-raspberry-pi-cm5-compatible-rockchip-rk3576-ai-compute-module-with-wifi-6-bluetooth-5-3/\">Geniatech XPI-3576-CM5 &#8211; A Raspberry Pi CM5-compatible Rockchip RK3576 AI Compute Module with WiFi 6, Bluetooth 5.3<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "IoTextra modular automation boards with 4 inputs, 4 outputs work with Raspberry Pi and ESP32 MCU boards", "source": "CNX Software", "date": "2026-07-20", "url": "https://www.cnx-software.com/2026/07/20/iotextra-modular-automation-boards-with-4-inputs-4-outputs-work-with-raspberry-pi-and-esp32-mcu-boards/", "summary": "<div><img alt=\"IoTsmart IoTextra modular automation boards\" class=\"attachment-medium size-medium wp-post-image\" height=\"417\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/07/IoTsmart-IoTextra-modular-automation-boards-720x417.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Last week, we wrote about the Olimex PICO-EVB automation board equipped with four relays and four isolated inputs and designed for Raspberry Pi Pico-compatible boards. Make Things Happy does something similar, but in a modular way, with the IoTextra family of carrier boards with four inputs and four outputs for automation, and supporting a range of IoTsmart MCU boards based on Raspberry Pi RP2350, ESP32-S3, etc&#8230; There are currently six IoTextra boards shipping or in development, all measuring 56&#215;47 mm and featuring 3750 Vrms galvanic isolation per channel. All IoTextra modules support different MCU platforms via horizontally or vertically mounted IoTsmart SoM carriers based on Waveshare RP2350 and ESP32-S3 modules, Seeed Studio XIAO boards, and others, all connected via the HOST connector. All IoTextra 8-channel modules support several software ecosystems out of the box: IoTflow framework for no-code programming of distributed MCU nodes over MQTT and Node-RED; used to build custom [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/07/20/iotextra-modular-automation-boards-with-4-inputs-4-outputs-work-with-raspberry-pi-and-esp32-mcu-boards/\">IoTextra modular automation boards with 4 inputs, 4 outputs work with Raspberry Pi and ESP32 MCU boards<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Efinix Titanium Edge FPGA family targets low-power edge AI and vision systems", "source": "CNX Software", "date": "2026-07-20", "url": "https://www.cnx-software.com/2026/07/20/efinix-titanium-edge-fpga-family-targets-low-power-edge-ai-and-vision-systems/", "summary": "<div><img alt=\"Efinix Titanium Edge Ti125 FPGA\" class=\"attachment-medium size-medium wp-post-image\" height=\"418\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/07/Efinix-Titanium-Edge-Ti125-FPGA-720x418.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Efinix has introduced the Titanium Edge FPGA family designed for low-power edge AI and machine vision applications. Based on the company&#8217;s Titanium FPGA architecture, the new family introduces lower static power consumption, configurable 2.5 Gbps MIPI I/O, built-in single-event upset (SEU) correction, and System-in-Package (SiP) variants that integrate SPI flash and HyperRAM for compact systems. The initial Titanium Edge FPGA family includes the Ti125, Ti40, Ti70, and Ti95 devices, with approximately 39K to 123K logic elements for embedded AI, machine vision, robotics, medical systems, and various other applications. Compared to the high-end Titanium Ti375 and the cost-efficient Topaz FPGA family, the new devices are designed to have about 50% lower static power consumption while retaining the company&#8217;s Quantum architecture. Efinix Titanium Edge Ti125 and Ti125 SiP specifications: FPGA Fabric Efinix Quantum architecture Up to 122,792 logic elements (109,440 XLR cells) 288 DSP blocks Embedded Memory – 5.9 Mbit SRAM Memory – [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/07/20/efinix-titanium-edge-fpga-family-targets-low-power-edge-ai-and-vision-systems/\">Efinix Titanium Edge FPGA family targets low-power edge AI and vision systems<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Ultralytics Optimizes YOLO26 for Intel OpenVINO", "source": "Embedded.com", "date": "2026-07-20", "url": "https://www.embedded.com/ultralytics-optimizes-yolo26-for-intel-openvino/", "summary": "<p>The optimized YOLO26 models enable faster, lower-latency computer vision on Intel processors using the OpenVINO toolkit.<\/p>\n<p>The post <a href=\"https://www.embedded.com/ultralytics-optimizes-yolo26-for-intel-openvino/\">Ultralytics Optimizes YOLO26 for Intel OpenVINO<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "Partnership Advances Agentic AI for SoC Design", "source": "Embedded.com", "date": "2026-07-20", "url": "https://www.embedded.com/partnership-advances-agentic-ai-for-soc-design/", "summary": "<p>Rapidus Corp. and Cadence Design Systems Inc. have announced a partnership to advance agentic AI for advanced-node system-on-chip (SoC) design. By integrating the Cadence InnoStack AI Super Agent into the Rapidus AI-Agentic Design Solution (Raads), Rapidus expects up to a 2× improvement in design turnaround time over traditional workflows. The combination of Rapidus' AI-native design [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/partnership-advances-agentic-ai-for-soc-design/\">Partnership Advances Agentic AI for SoC Design<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "Modular test architecture is driving force for Emerson", "source": "Electronics Weekly", "date": "2026-07-20", "url": "https://www.electronicsweekly.com/news/business/modular-test-architecture-is-driving-force-for-emerson-2026-07/", "summary": "<p>The modular system, based on NI technology combines a high-performance FPGA core, for processing real-time data, and interchangeable SerDes interface devices which can be swapped according to the configuration requirements [&#8230;]<\/p>\n<p>The post <a href=\"https://www.electronicsweekly.com/news/business/modular-test-architecture-is-driving-force-for-emerson-2026-07/\">Modular test architecture is driving force for Emerson<\/a> appeared first on <a href=\"https://www.electronicsweekly.com\">Electronics Weekly<\/a>.<\/p>"}, {"title": "SWISSto12 $70m raises Series C for HummingSat development", "source": "Electronics Weekly", "date": "2026-07-20", "url": "https://www.electronicsweekly.com/news/business/finance/swissto12-70m-raises-series-c-for-hummingsat-development-2026-07/", "summary": "<p>SWISSto12, the Swiss manufacturer of satellite and payload systems, has closed its $70 million Series C funding round. The capital raise follows the award of $84.8 million from the European [&#8230;]<\/p>\n<p>The post <a href=\"https://www.electronicsweekly.com/news/business/finance/swissto12-70m-raises-series-c-for-hummingsat-development-2026-07/\">SWISSto12 $70m raises Series C for HummingSat development<\/a> appeared first on <a href=\"https://www.electronicsweekly.com\">Electronics Weekly<\/a>.<\/p>"}, {"title": "European space funding bucks global trends", "source": "Electronics Weekly", "date": "2026-07-20", "url": "https://www.electronicsweekly.com/news/business/european-space-funding-bucks-global-trends-2026-07/", "summary": "<p>The European Space Agency (ESA) has released its latest Space Economy Report covering the year 2025. It gives an overview of the developments shaping Europe&#8217;s space sector. Its findings include [&#8230;]<\/p>\n<p>The post <a href=\"https://www.electronicsweekly.com/news/business/european-space-funding-bucks-global-trends-2026-07/\">European space funding bucks global trends<\/a> appeared first on <a href=\"https://www.electronicsweekly.com\">Electronics Weekly<\/a>.<\/p>"}, {"title": "Taking the unexpected routes in animation and gaming", "source": "Adafruit", "date": "2026-07-20", "url": "https://blog.adafruit.com/2026/07/20/taking-the-unexpected-routes-in-animation-and-gaming/", "summary": "Marcin Wichary looks at “bumping the lamp” – a phrase coined by Disney during the production of Roger Rabbit to describe going above and beyond what was expected of the animators. A lesson learned: I see craft blossom when it can flow from individuals, and when the organization and attendant processes recognize that. Let people [&#8230;]"}, {"title": "Starting a ZX Spectrum shooting gallery in earnest", "source": "Adafruit", "date": "2026-07-20", "url": "https://blog.adafruit.com/2026/07/20/starting-a-zx-spectrum-shooting-gallery-in-earnest/", "summary": "Michael Martin is working through a port of a shooting gallery Rosetta-stone program to the ZX Spectrum. It’s been a long road. We started out knowing how to control text and bitmap output and a decent handle on I/O. From there we designed a reasonably efficient blitting system that operated on 16×16 “sprites” that we carefully prepared for [&#8230;]"}, {"title": "Using a MikroTik as a home router", "source": "Adafruit", "date": "2026-07-20", "url": "https://blog.adafruit.com/2026/07/20/using-a-mikrotik-as-a-home-router/", "summary": "Rafał Opiłowski was looking at setting up a new homelab, starting with a comprehensive networking setup. Given my experiences related to performance and security issues with ISP-provider routers, I wanted to have a better control over the traffic on my home network. I decided to heavily focus traffic on wired connections, to offload WiFi and [&#8230;]"}, {"title": "The Brick Game, through the ages", "source": "Adafruit", "date": "2026-07-20", "url": "https://blog.adafruit.com/2026/07/20/the-brick-game-through-the-ages/", "summary": "The handheld games of 2000: how could we forget the LCD screens and the cheesiness. Nicole Express got one at a church fundraiser and did a comparison with another model which advertises voice. Another oddity about the box. Take a look at the screen. Notice that it has square blocks with a square inside, and [&#8230;]"}, {"title": "The SmartFont Library for LED matrix displays", "source": "Adafruit", "date": "2026-07-20", "url": "https://blog.adafruit.com/2026/07/20/the-smartfont-library-for-led-matrix-displays/", "summary": "The SmartFont Library by Chaiwat Leanyos is a generic C++ font library for embedded systems (Arduino, ESP32, etc.), designed for efficient rendering of UTF-8 strings on pixel-based displays. It features special support for Thai Language, correctly positioning vowels and tone marks (0x0E00 &#8211; 0x0E7F). Features UTF-8 Support: Handles multi-byte characters automatically. Thai Language Layout: Automatically [&#8230;]"}, {"title": "Korg re-releases the PS-3300 synthesizer", "source": "Adafruit", "date": "2026-07-20", "url": "https://blog.adafruit.com/2026/07/20/korg-re-releases-the-ps-3300-synthesizer/", "summary": "Between 1977 and 1981, the original Korg PS-3300 carved out a legendary place in music history. With fewer than 50 units made, its lush, expansive sounds appeared on just a handful of recordings &#8211; making it one of the rarest and most sought-after synths in history. Today, original models are almost impossible to find. Brought [&#8230;]"}, {"title": "Replacing a $120k bowling center system with $1,600 in ESP32s", "source": "Adafruit", "date": "2026-07-20", "url": "https://blog.adafruit.com/2026/07/20/replacing-a-120k-bowling-center-system-with-1600-in-esp32s/", "summary": "After buying an abandoned 8-lane bowling center, HN user section33 found that replacing the six-figure scoring system would cost $80k to $120k, with parts running $4,000 per lane pair. Since the 70-year-old bowling machines are almost entirely mechanical and the &#8220;advanced&#8221; system was largely just firing a single relay to trigger the pinsetter, he built [&#8230;]"}, {"title": "Get to Know Trees with WIRED’s Forest Report", "source": "Adafruit", "date": "2026-07-20", "url": "https://blog.adafruit.com/2026/07/20/get-to-know-trees-with-wireds-forest-report/", "summary": "Dr. Dominick DellaSala, Senior Conservation Science Associate in the North America Initiative of the Conservation Biology, joins WIRED to answer the internet&#8217;s questions about trees. Forest conservation scientist Dominick DellaSala joins WIRED to answer the internet’s burning questions about trees. What did ancient forests look like? What do tree rings really prove? Do rainforests create [&#8230;]"}, {"title": "Serious flaws found in a popular WiFi camera", "source": "Adafruit", "date": "2026-07-20", "url": "https://blog.adafruit.com/2026/07/20/serious-flaws-found-in-a-popular-wifi-camera/", "summary": "Independent researcher Christopher Childress (BadChemical) has published a detailed advisory on the TP-Link Kasa Spot EC71 camera, and it&#8217;s a terrific look at how IoT security research actually gets done. Childress started with firmware 2.3.26, pulled straight off the SPI flash with a ~$3 CH341A programmer, then dug in with packet capture and hardware analysis. [&#8230;]"}, {"title": "The Swiss Cheese model", "source": "Adafruit", "date": "2026-07-20", "url": "https://blog.adafruit.com/2026/07/20/the-swiss-cheese-model/", "summary": "Marcin Wichary discusses the Swiss Cheese model. You see it sometimes in descriptions of how complex systems fail. The whole idea is: even if you have multiple layers of safety – like many slices of cheese – there are always holes in each slice. Typically, a hole in any slice is covered by a non-hole in [&#8230;]"}, {"title": "Light Up Bubble Wand with WLED #LED Pixels #AdafruitLearningSystem @Adafruit", "source": "Adafruit", "date": "2026-07-20", "url": "https://blog.adafruit.com/2026/07/20/light-up-bubble-wand-with-wled-led-pixels-adafruitlearningsystem-adafruit/", "summary": "Check out the latest guide from Erin St Blaine: make a 3d printed bubble wand and add seed pixel lights and a Mini Sparkle Motion controller to light up your bubbles as you blow them. This guide gives instructions on how to connect the lights and waterproof them, and power them with a rechargeable USB [&#8230;]"}, {"title": "Museum of Endangered Sounds #MusicMonday", "source": "Adafruit", "date": "2026-07-20", "url": "https://blog.adafruit.com/2026/07/20/museum-of-endangered-sounds/", "summary": "Take an audio trip down memory lane with the Museum of Endangered Sounds. Savethesounds.info is a time capsule of obsolete noise, started in 2012 with goal of preserving the chimes, whirs, clunks and more  of old technology. You can play each sound individually or play many at once. I&#8217;d love to see the library added [&#8230;]"}, {"title": "element14 Community invites engineers to choose products they want to test", "source": "EE Journal", "date": "2026-07-20", "url": "https://www.eejournal.com/industry_news/element14-community-invites-engineers-to-choose-products-they-want-to-test/", "summary": "PHOENIX – July 14, 2026: element14, an Avnet community, has launched a new initiative within its RoadTest program, inviting engineers to apply to test and review a product of their choosing. The initiative allows participants to request any product priced at $175 or less from Newark, Farnell or element14 online stores. Ten selected applicants will receive their chosen product at &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/element14-community-invites-engineers-to-choose-products-they-want-to-test/\">Read More &#8594;<span class=\"screen-reader-text\"> \"element14 Community invites engineers to choose products they want to test\"<\/span><\/a>"}, {"title": "Application Benefits of M-CRPS for Embedded Redundant Power Solutions — Bel and Mouser Electronics", "source": "EE Journal", "date": "2026-07-20", "url": "https://www.eejournal.com/chalk_talks/application-benefits-of-m-crps-for-embedded-redundant-power-solutions-bel-and-mouser-electronics/", "summary": "&#160; In this episode of Chalk Talk, Ian Warner from Bel and Amelia Dalton explore why the industry is shifting from legacy CRPS to the M-CRPS standard, how open standard solutions from the Open Compute Project provide superior reliability, intelligent monitoring, and the flexibility needed to power the next generation of data center and networking &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/chalk_talks/application-benefits-of-m-crps-for-embedded-redundant-power-solutions-bel-and-mouser-electronics/\">Read More &#8594;<span class=\"screen-reader-text\"> \"Application Benefits of M-CRPS for Embedded Redundant Power Solutions &#8212; Bel and Mouser Electronics\"<\/span><\/a>"}, {"title": "TDK introduces HVC 5422C embedded motor controller for silent BLDC applications up to 1A", "source": "EE Journal", "date": "2026-07-20", "url": "https://www.eejournal.com/industry_news/tdk-introduces-hvc-5422c-embedded-motor-controller-for-silent-bldc-applications-up-to-1a/", "summary": "&#8211;  Single-chip solution with integrated LIN transceiver, MCU, and motor driver help reduce system complexity and BOM cost &#8211;  64 K Flash and 4 KB EEPROM support over-the-air (OTA) software updates and sophisticated control algorithms &#8211;  Advanced Field Oriented Control (FOC) capabilities enable smooth motor operation while reducing acoustic noise to a minimum &#8211;  Cyber &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/tdk-introduces-hvc-5422c-embedded-motor-controller-for-silent-bldc-applications-up-to-1a/\">Read More &#8594;<span class=\"screen-reader-text\"> \"TDK introduces HVC 5422C embedded motor controller for silent BLDC applications up to 1A\"<\/span><\/a>"}, {"title": "MathWorks Enables AI Agents to Execute and Validate Engineering Workflows within MATLAB", "source": "EE Journal", "date": "2026-07-20", "url": "https://www.eejournal.com/industry_news/mathworks-enables-ai-agents-to-execute-and-validate-engineering-workflows-within-matlab/", "summary": "MathWorks, the leading developer of mathematical computing software for designing engineered systems, announced new capabilities that let AI agents run and refine MATLAB® workflows through two new open-source tools—MATLAB MCP Server and MATLAB Agentic Toolkit—using Model Context Protocol. With these tools, agents can write MATLAB code, run it in a live session, examine outputs or errors, and iterate toward &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/mathworks-enables-ai-agents-to-execute-and-validate-engineering-workflows-within-matlab/\">Read More &#8594;<span class=\"screen-reader-text\"> \"MathWorks Enables AI Agents to Execute and Validate Engineering Workflows within MATLAB\"<\/span><\/a>"}, {"title": "TANAKA Commences Operation of “TANAKA H2 Nexus”, One of Japan’s Largest 500 kW Pure Hydrogen Fuel Cell Power Generation Facilities", "source": "EE Journal", "date": "2026-07-20", "url": "https://www.eejournal.com/industry_news/tanaka-commences-operation-of-tanaka-h2-nexus-one-of-japans-largest-500-kw-pure-hydrogen-fuel-cell-power-generation-facilities/", "summary": "TANAKA PRECIOUS METAL TECHNOLOGIES Co., Ltd. (Head Office: Chuo-ku, Tokyo; Representative Director &#38; CEO: Koichiro Tanaka), a company engaged in the industrial precious metals business of TANAKA, today announced that &#8220;TANAKA H2 Nexus&#8221;, one of Japan&#8217;s largest 500 kW pure hydrogen fuel cell power generation facilities, began operation on July 8, 2026, at the TANAKA &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/tanaka-commences-operation-of-tanaka-h2-nexus-one-of-japans-largest-500-kw-pure-hydrogen-fuel-cell-power-generation-facilities/\">Read More &#8594;<span class=\"screen-reader-text\"> \"TANAKA Commences Operation of &#8220;TANAKA H2 Nexus&#8221;, One of Japan&#8217;s Largest 500 kW Pure Hydrogen Fuel Cell Power Generation Facilities\"<\/span><\/a>"}, {"title": "VÆRIDION selects Drive System Design to advance the Microliner electric propulsion system", "source": "EE Journal", "date": "2026-07-20", "url": "https://www.eejournal.com/industry_news/vaeridion-selects-drive-system-design-to-advance-the-microliner-electric-propulsion-system/", "summary": "DSD to develop, build and test the Microliner’s high-tech propeller drive system in the UK ahead of Copper Bird integration Microliner propulsion system development will draw on DSD’s aerospace transmission expertise, integrated engineering and advanced physical testing capabilities Programme advances VÆRIDION’s proprietary multi-engine, single-propeller architecture towards first flight and certification VÆRIDION, the all-electric aircraft manufacturer, &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/vaeridion-selects-drive-system-design-to-advance-the-microliner-electric-propulsion-system/\">Read More &#8594;<span class=\"screen-reader-text\"> \"VÆRIDION selects Drive System Design to advance the Microliner electric propulsion system\"<\/span><\/a>"}, {"title": "Beelink EQi 304 review – Part 3: Ubuntu 26.04 on a Wildcat Lake mini PC", "source": "CNX Software", "date": "2026-07-19", "url": "https://www.cnx-software.com/2026/07/19/beelink-eqi-304-review-part-3-ubuntu-26-04-on-a-wildcat-lake-mini-pc/", "summary": "<div><img alt=\"Beelink EQi Wildcat Lake mini PC Ubuntu 26.04 review\" class=\"attachment-medium size-medium wp-post-image\" height=\"551\"
