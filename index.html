<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Physical AI Intelligence Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
  /* ═══════════════ VARIABLES ═══════════════ */
  :root {
    --bg:#06090f; --glass:rgba(12,17,28,.58); --glass2:rgba(10,15,24,.72);
    --glass3:rgba(8,12,20,.88); --gb:rgba(255,255,255,.055);
    --gb2:rgba(255,255,255,.09); --blur:blur(22px) saturate(1.6);
    --blur2:blur(28px) saturate(1.4);
    --text:#e8f0fa; --t2:#9ab5cc; --t3:#5a7d96; --muted:#304d62;
    --sb:rgba(4,7,14,.92); --sb-text:#7aa0be; --sb-muted:#2e4a60;
    --sb-hover:rgba(255,255,255,.04); --sb-active:rgba(124,58,237,.14);
    --sb-active-t:#c4b5fd;
    --acc:#818cf8; --acc2:#6366f1; --acc3:#7c3aed;
    --apale:rgba(129,140,248,.12); --apale2:rgba(129,140,248,.2);
    --sh:0 4px 24px rgba(0,0,0,.4),0 1px 3px rgba(0,0,0,.3);
    --sh-md:0 8px 40px rgba(0,0,0,.5),0 2px 6px rgba(0,0,0,.35);
    --sh-lg:0 16px 60px rgba(0,0,0,.6),0 4px 12px rgba(0,0,0,.4);
    --r:14px; --rsm:9px; --rxs:7px;
    --c-all:#818cf8; --c-aiNews:#38bdf8; --c-physicalAiNews:#a78bfa;
    --c-roboticsNews:#fbbf24; --c-embeddedNews:#22d3ee; --c-papers:#34d399; --c-repos:#60a5fa;
    --c-models:#fb923c; --c-funding:#a3e635; --c-companies:#f472b6; --c-jobs:#2dd4bf;
    --c-vla:#818cf8; --c-wam:#a78bfa; --c-robotPolicy:#2dd4bf;
    --c-rlPolicy:#fbbf24; --c-simulation:#60a5fa;
  }
  [data-theme="light"] {
    --bg:#f0f4f8; --glass:rgba(255,255,255,.92); --glass2:rgba(248,250,252,.96);
    --glass3:rgba(255,255,255,.98); --gb:rgba(0,0,0,.07); --gb2:rgba(0,0,0,.1);
    --blur:none; --blur2:none;
    --text:#0f172a; --t2:#334155; --t3:#64748b; --muted:#94a3b8;
    --sb:rgba(10,18,32,.96); --sb-text:#8ba5c4; --sb-muted:#2e4a60;
    --sh:0 1px 4px rgba(0,0,0,.07),0 2px 8px rgba(0,0,0,.05);
    --sh-md:0 4px 16px rgba(0,0,0,.1); --sh-lg:0 8px 32px rgba(0,0,0,.13);
    --acc:#6366f1; --acc2:#4f46e5; --acc3:#7c3aed;
    --apale:rgba(99,102,241,.08); --apale2:rgba(99,102,241,.16);
    --c-all:#6366f1; --c-aiNews:#0284c7; --c-physicalAiNews:#7c3aed;
    --c-roboticsNews:#d97706; --c-embeddedNews:#0891b2; --c-papers:#059669; --c-repos:#2563eb;
    --c-models:#ea580c; --c-funding:#65a30d; --c-companies:#db2777; --c-jobs:#0d9488;
    --c-vla:#6366f1; --c-wam:#7c3aed; --c-robotPolicy:#0d9488;
    --c-rlPolicy:#d97706; --c-simulation:#2563eb;
  }

  /* ═══════════════ RESET ═══════════════ */
  *,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
  html { scroll-behavior:smooth; }
  body {
    font-family:'Inter',ui-sans-serif,system-ui,sans-serif;
    background:var(--bg); color:var(--text); line-height:1.5; min-height:100vh;
    overflow-x:hidden;
  }
  a { color:inherit; text-decoration:none; }

  /* ═══════════════ BACKGROUND ═══════════════ */
  #bgCanvas {
    position:fixed; inset:0; z-index:0; pointer-events:none;
    width:100%; height:100%; opacity:.55;
  }
  [data-theme="light"] #bgCanvas { opacity:.1; }

  .orb {
    position:fixed; border-radius:50%;
    pointer-events:none; z-index:0;
    filter:blur(100px); opacity:.12;
    animation:floatOrb 22s ease-in-out infinite;
  }
  .orb1 {
    width:600px; height:600px; top:-180px; left:-150px;
    background:radial-gradient(circle,#7c3aed 0%,transparent 70%);
    animation-duration:22s;
  }
  .orb2 {
    width:500px; height:500px; bottom:-100px; right:-120px;
    background:radial-gradient(circle,#0ea5e9 0%,transparent 70%);
    animation-duration:28s; animation-direction:reverse;
  }
  .orb3 {
    width:360px; height:360px; top:45%; left:55%;
    background:radial-gradient(circle,#6366f1 0%,transparent 70%);
    animation-duration:18s; opacity:.07;
  }
  [data-theme="light"] .orb { opacity:.03; }

  @keyframes floatOrb {
    0%,100% { transform:translate(0,0) scale(1); }
    25%      { transform:translate(40px,-30px) scale(1.05); }
    50%      { transform:translate(-25px,50px) scale(.96); }
    75%      { transform:translate(30px,20px) scale(1.03); }
  }

  /* ═══════════════ LAYOUT ═══════════════ */
  .layout {
    display:grid; grid-template-columns:268px minmax(0,1fr);
    min-height:100vh; position:relative; z-index:2;
  }

  /* ═══════════════ SIDEBAR ═══════════════ */
  .sidebar {
    background:var(--sb); backdrop-filter:var(--blur2);
    -webkit-backdrop-filter:var(--blur2);
    position:sticky; top:0; height:100vh;
    display:flex; flex-direction:column; overflow:hidden;
    border-right:1px solid var(--gb2);
    box-shadow:4px 0 40px rgba(0,0,0,.4);
    z-index:20;
  }
  .brand {
    padding:22px 18px 16px; flex-shrink:0;
    background:linear-gradient(180deg,rgba(124,58,237,.18) 0%,transparent 100%);
    border-bottom:1px solid rgba(124,58,237,.2);
  }
  .brand-row { display:flex; align-items:center; gap:12px; }
  .brand-logo {
    width:44px; height:44px; border-radius:12px; flex-shrink:0;
    background:linear-gradient(135deg,#7c3aed 0%,#4f46e5 100%);
    display:flex; align-items:center; justify-content:center; font-size:22px;
    box-shadow:0 0 24px rgba(124,58,237,.55),0 4px 14px rgba(0,0,0,.4);
  }
  .brand-name { font-size:14.5px; font-weight:800; color:#f0f6fc; letter-spacing:-.015em; }
  .brand-sub  { font-size:11px; color:var(--sb-text); margin-top:2px; }

  .nav-scroll { flex:1; overflow-y:auto; padding:8px 8px; }
  .nav-scroll::-webkit-scrollbar { width:0; }
  .nav-sec {
    font-size:9.5px; font-weight:700; letter-spacing:.09em; text-transform:uppercase;
    color:var(--sb-muted); padding:10px 10px 3px;
  }
  .nav-btn {
    display:flex; align-items:center; gap:9px; width:100%;
    border:none; background:transparent; color:var(--sb-text);
    font:inherit; font-size:13.5px; font-weight:500;
    padding:8px 10px; border-radius:9px; cursor:pointer;
    text-align:left; transition:all .15s; margin-bottom:2px;
    position:relative;
  }
  .nav-btn::before {
    content:''; position:absolute; left:0; top:50%;
    transform:translateY(-50%) scaleY(0);
    width:3px; height:65%; border-radius:0 3px 3px 0;
    background:var(--acc); transition:transform .2s cubic-bezier(.34,1.56,.64,1);
  }
  .nav-btn:hover { background:var(--sb-hover); color:#d0e4f4; }
  .nav-btn.active {
    background:var(--sb-active); color:var(--sb-active-t); font-weight:600;
    box-shadow:inset 0 0 0 1px rgba(129,140,248,.15);
    text-shadow:0 0 20px rgba(196,181,253,.4);
  }
  .nav-btn.active::before { transform:translateY(-50%) scaleY(1); }
  .nav-ico { font-size:15px; width:20px; text-align:center; flex-shrink:0; }
  .nav-lbl { flex:1; }
  .nav-cnt {
    font-size:10.5px; font-weight:700; padding:1px 7px;
    border-radius:999px; background:rgba(255,255,255,.05); color:var(--sb-muted);
  }
  .nav-btn.active .nav-cnt {
    background:rgba(129,140,248,.18); color:var(--sb-active-t);
  }

  .sb-foot {
    padding:12px 18px 14px; border-top:1px solid var(--gb);
    font-size:11px; color:var(--sb-muted); flex-shrink:0;
    display:flex; flex-direction:column; gap:3px;
  }
  .sb-foot strong { color:var(--t3); font-weight:600; }
  .sb-about {
    margin-top:12px; padding-top:10px; border-top:1px solid var(--gb);
    display:flex; flex-direction:column; gap:2px;
  }
  .sb-about-lbl {
    font-size:9px; font-weight:700; letter-spacing:.12em; text-transform:uppercase;
    color:var(--sb-muted); margin-bottom:2px;
  }
  .sb-about-by { font-size:11px; color:var(--sb-text); }
  .sb-about-by strong { color:var(--acc); font-weight:700; }
  .sb-about-mail { font-size:10.5px; color:var(--sb-muted); text-decoration:none; word-break:break-all; }
  .sb-about-mail:hover { color:var(--acc); text-decoration:underline; }
  .refresh-bar {
    margin-top:8px; height:2px; border-radius:1px;
    background:rgba(255,255,255,.06); overflow:hidden;
  }
  .refresh-prog {
    height:100%; border-radius:1px;
    background:linear-gradient(90deg,var(--acc3),var(--acc));
    transition:width .5s ease;
  }

  /* ═══════════════ MAIN ═══════════════ */
  .main { min-width:0; display:flex; flex-direction:column; }

  /* ═══════════════ TOPBAR ═══════════════ */
  .topbar {
    background:var(--glass2); backdrop-filter:var(--blur);
    -webkit-backdrop-filter:var(--blur);
    border-bottom:1px solid var(--gb);
    padding:0 28px; height:64px;
    display:flex; align-items:center; justify-content:space-between; gap:14px;
    position:sticky; top:0; z-index:25;
    box-shadow:0 2px 20px rgba(0,0,0,.3);
  }
  .topbar::after {
    content:''; position:absolute; bottom:0; left:0; right:0; height:1px;
    background:linear-gradient(90deg,#7c3aed,#6366f1 35%,#0ea5e9 70%,transparent);
    opacity:.8;
  }
  .topbar-l { display:flex; align-items:center; gap:13px; min-width:0; }
  .pg-title {
    font-size:18px; font-weight:900; letter-spacing:-.025em;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    background:linear-gradient(135deg,var(--text),var(--acc));
    -webkit-background-clip:text; -webkit-text-fill-color:transparent;
    background-clip:text;
  }
  [data-theme="light"] .pg-title {
    background:linear-gradient(135deg,#0f172a,#6366f1);
    -webkit-background-clip:text; background-clip:text;
  }
  .upd-badge {
    font-size:11px; color:var(--muted); background:var(--glass);
    border:1px solid var(--gb); border-radius:999px;
    padding:3px 10px; flex-shrink:0; white-space:nowrap;
  }
  .topbar-r { display:flex; align-items:center; gap:7px; flex-shrink:0; }
  .btn {
    display:inline-flex; align-items:center; gap:5px;
    height:36px; padding:0 14px;
    border:1px solid var(--gb2); border-radius:var(--rsm);
    background:var(--glass); backdrop-filter:var(--blur);
    color:var(--t2); font:inherit; font-size:13px; font-weight:600;
    cursor:pointer; text-decoration:none; transition:all .15s; white-space:nowrap;
  }
  .btn:hover { background:var(--glass2); border-color:var(--acc); color:var(--text); box-shadow:0 0 12px rgba(129,140,248,.15); }
  .btn-acc {
    background:linear-gradient(135deg,var(--acc3),var(--acc2));
    border-color:transparent; color:#fff;
    box-shadow:0 2px 12px rgba(124,58,237,.4),0 0 0 1px rgba(129,140,248,.2);
  }
  .btn-acc:hover {
    background:linear-gradient(135deg,#6d28d9,var(--acc3));
    box-shadow:0 4px 20px rgba(124,58,237,.5); color:#fff;
    border-color:transparent;
  }
  .ico-btn { width:36px; padding:0; justify-content:center; font-size:16px; }

  /* ═══════════════ CONTENT ═══════════════ */
  .content { padding:22px 28px 52px; flex:1; }

  /* ═══════════════ STATS ═══════════════ */
  .stats {
    display:grid; grid-template-columns:repeat(4,minmax(0,1fr));
    gap:12px; margin-bottom:20px;
  }
  .stat {
    background:var(--glass); backdrop-filter:var(--blur);
    -webkit-backdrop-filter:var(--blur);
    border:1px solid var(--gb); border-radius:var(--r);
    padding:18px 20px 15px; position:relative; overflow:hidden;
    box-shadow:var(--sh);
    transition:transform .3s ease,box-shadow .3s ease;
    cursor:default; transform-style:preserve-3d;
  }
  .stat::before {
    content:''; position:absolute; top:0; left:0; right:0;
    height:2px; background:var(--sc,var(--acc));
    box-shadow:0 0 12px var(--sc,var(--acc));
  }
  .stat::after {
    content:''; position:absolute; inset:0;
    background:radial-gradient(ellipse at top left, rgba(var(--sc-rgb,129,140,248),.06), transparent 60%);
    pointer-events:none;
  }
  .stat-ico { font-size:24px; line-height:1; margin-bottom:10px; display:block;
               filter:drop-shadow(0 0 8px rgba(255,255,255,.2)); }
  .stat-lbl {
    font-size:10.5px; font-weight:700; letter-spacing:.06em;
    text-transform:uppercase; color:var(--t3);
  }
  .stat-num {
    font-size:28px; font-weight:900; letter-spacing:-.04em;
    color:var(--text); line-height:1; margin-top:5px;
  }

  /* ═══════════════ PANEL ═══════════════ */
  .panel {
    background:var(--glass); backdrop-filter:var(--blur);
    -webkit-backdrop-filter:var(--blur);
    border:1px solid var(--gb); border-radius:var(--r);
    box-shadow:var(--sh); overflow:hidden;
  }

  /* ═══════════════ TOOLBAR ═══════════════ */
  .toolbar {
    display:flex; align-items:center; gap:8px; flex-wrap:wrap;
    padding:12px 14px; border-bottom:1px solid var(--gb);
    background:var(--glass2);
  }
  .srch-wrap { position:relative; flex:1; min-width:200px; }
  .srch-ico {
    position:absolute; left:12px; top:50%; transform:translateY(-50%);
    font-size:13px; color:var(--muted); pointer-events:none;
  }
  .srch-inp {
    width:100%; height:38px;
    border:1px solid var(--gb2); border-radius:var(--rsm);
    padding:0 12px 0 34px; background:var(--glass);
    backdrop-filter:var(--blur); color:var(--text);
    font:inherit; font-size:13.5px;
    transition:border-color .15s,box-shadow .15s;
  }
  .srch-inp::placeholder { color:var(--muted); }
  .srch-inp:focus {
    outline:none; border-color:var(--acc);
    box-shadow:0 0 0 3px rgba(129,140,248,.15),0 0 12px rgba(129,140,248,.1);
  }
  .ctrl {
    height:38px; border:1px solid var(--gb2); border-radius:var(--rsm);
    padding:0 10px; background:var(--glass);
    backdrop-filter:var(--blur); color:var(--text);
    font:inherit; font-size:13px; cursor:pointer; flex-shrink:0;
    transition:border-color .15s;
  }
  .ctrl:focus { outline:none; border-color:var(--acc); }
  .vt { display:flex; border:1px solid var(--gb2); border-radius:var(--rsm); overflow:hidden; flex-shrink:0; }
  .vt-b {
    width:36px; height:38px; border:none;
    background:var(--glass); color:var(--muted); font-size:15px;
    cursor:pointer; display:flex; align-items:center; justify-content:center;
    transition:all .13s;
  }
  .vt-b:not(:last-child) { border-right:1px solid var(--gb2); }
  .vt-b.on { background:var(--acc3); color:#fff; box-shadow:inset 0 0 10px rgba(0,0,0,.2); }

  /* ═══════════════ RESULTS BAR ═══════════════ */
  .res-bar {
    display:flex; align-items:center; justify-content:space-between;
    padding:9px 16px; font-size:12.5px; color:var(--muted);
    border-bottom:1px solid var(--gb); background:var(--glass2);
  }
  .res-n { font-weight:700; color:var(--t2); }

  /* ═══════════════ FEED — GRID ═══════════════ */
  .feed.grid-v {
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
    gap:14px; padding:16px;
  }
  .feed.grid-v .fi {
    background:var(--glass); backdrop-filter:var(--blur);
    -webkit-backdrop-filter:var(--blur);
    border:1px solid var(--gb); border-top:2px solid var(--ic,var(--acc));
    border-radius:var(--r); padding:18px;
    box-shadow:var(--sh); cursor:pointer;
    transform-style:preserve-3d; will-change:transform;
    transition:transform .3s ease,box-shadow .3s ease;
    position:relative; overflow:hidden;
  }
  .feed.grid-v .fi::before {
    content:''; position:absolute; top:0; left:0; right:0; height:80px;
    background:linear-gradient(180deg,rgba(var(--ic-r,129,140,248),.06) 0%,transparent 100%);
    pointer-events:none;
  }
  .feed.grid-v .fi-stripe { display:none; }
  .feed.grid-v .fi-body { display:flex; flex-direction:column; height:100%; }
  .feed.grid-v .fi-hdr { margin-bottom:10px; display:flex; align-items:flex-start; justify-content:space-between; gap:8px; }

  /* ═══════════════ FEED — LIST ═══════════════ */
  .feed.list-v .fi {
    padding:16px 20px; border-bottom:1px solid var(--gb);
    transition:background .12s; position:relative;
  }
  .feed.list-v .fi:last-child { border-bottom:none; }
  .feed.list-v .fi:hover { background:var(--glass2); }
  .feed.list-v .fi-wrap { display:flex; gap:14px; align-items:flex-start; }
  .feed.list-v .fi-stripe {
    width:3px; border-radius:3px; flex-shrink:0;
    align-self:stretch; min-height:40px;
    background:var(--ic,var(--acc));
    box-shadow:0 0 8px var(--ic,var(--acc));
    transition:width .15s;
  }
  .feed.list-v .fi:hover .fi-stripe { width:4px; }
  .feed.list-v .fi-body { flex:1; min-width:0; }
  .feed.list-v .fi-hdr {
    display:flex; align-items:flex-start;
    justify-content:space-between; gap:10px;
  }

  /* ═══════════════ ITEM SHARED ═══════════════ */
  .i-cat {
    display:inline-flex; align-items:center; gap:5px;
    font-size:10.5px; font-weight:700; padding:3px 9px;
    border-radius:999px; color:#fff; margin-bottom:8px;
    letter-spacing:.02em;
    box-shadow:0 2px 8px rgba(0,0,0,.3);
  }
  .star-btn {
    flex-shrink:0; background:none; border:none; cursor:pointer;
    font-size:17px; line-height:1; padding:2px 3px; border-radius:6px;
    color:var(--t3); transition:transform .12s, color .12s; margin-top:-2px;
  }
  .star-btn:hover { color:#fbbf24; transform:scale(1.18); }
  .star-btn.on { color:#fbbf24; }
  .i-title {
    font-size:14.5px; font-weight:700; line-height:1.42;
    color:var(--text); display:block; transition:color .13s;
  }
  .i-title:hover { color:var(--acc); }
  .i-score { flex-shrink:0; text-align:right; padding-top:2px; }
  .sc-val {
    font-size:19px; font-weight:900; letter-spacing:-.03em;
    color:var(--acc); line-height:1; display:block;
    text-shadow:0 0 20px rgba(129,140,248,.4);
  }
  .sc-lbl { font-size:10px; color:var(--muted); margin-top:2px; white-space:nowrap; }
  .i-authors {
    display:flex; flex-wrap:wrap; gap:4px;
    margin:6px 0 8px;
  }
  .au { font-size:11px; padding:2px 7px; border-radius:5px;
          background:rgba(255,255,255,.05); border:1px solid var(--gb2);
          color:var(--t3); font-weight:500; }
  [data-theme="light"] .au { background:var(--glass2); }
  .i-sum {
    font-size:13px; color:var(--t2); line-height:1.65;
    margin:6px 0 10px;
  }
  .i-tags {
    display:flex; flex-wrap:wrap; gap:5px; align-items:center;
    margin-top:auto; padding-top:10px;
  }
  .tag {
    display:inline-flex; align-items:center; font-size:11px; font-weight:600;
    padding:2px 9px; border-radius:999px; white-space:nowrap;
  }
  .t-d,.t-s {
    background:rgba(255,255,255,.05); border:1px solid var(--gb2); color:var(--t3);
  }
  [data-theme="light"] .t-d,[data-theme="light"] .t-s {
    background:var(--glass2); border-color:rgba(0,0,0,.09);
  }
  .i-acts { display:flex; gap:6px; margin-top:10px; flex-wrap:wrap; }
  .act {
    display:inline-flex; align-items:center; gap:4px;
    font-size:12px; font-weight:600; padding:5px 12px;
    border-radius:var(--rxs); border:1px solid var(--gb2);
    background:rgba(255,255,255,.04); color:var(--t2);
    text-decoration:none; cursor:pointer; transition:all .13s;
    backdrop-filter:var(--blur);
  }
  .act:hover { background:var(--glass2); color:var(--text); border-color:var(--muted); }
  .act-p {
    background:var(--apale); border-color:rgba(129,140,248,.25); color:var(--acc);
  }
  .act-p:hover {
    background:var(--acc2); border-color:var(--acc2); color:#fff;
    box-shadow:0 2px 12px rgba(99,102,241,.4);
  }

  /* ═══════════════ ENTRY ANIMATIONS ═══════════════ */
  @keyframes cardIn {

ped [&#8230;]"}, {"title": "NVIDIA CEO Drops the Blueprint for Europe’s AI Boom", "source": "NVIDIA AI", "date": "2025-06-11", "url": "https://blogs.nvidia.com/blog/gtc-paris-2025/", "summary": "At GTC Paris — held alongside VivaTech, Europe’s largest tech event — NVIDIA founder and CEO Jensen Huang delivered a clear message: Europe isn’t just adopting AI — it’s building it. “We now have a new industry, an AI industry, and it’s now part of the new infrastructure, called intelligence infrastructure, that will be used [&#8230;]"}, {"title": "NVIDIA Releases New AI Models and Developer Tools to Advance Autonomous Vehicle Ecosystem", "source": "NVIDIA AI", "date": "2025-06-11", "url": "https://blogs.nvidia.com/blog/autonomous-vehicle-ecosystem-ai-models-developer-tools/", "summary": "Autonomous vehicle (AV) stacks are evolving from many distinct models to a unified, end-to-end architecture that executes driving actions directly from sensor data. This transition to using larger models is drastically increasing the demand for high-quality, physically based sensor data for training, testing and validation. To help accelerate the development of next-generation AV architectures, NVIDIA [&#8230;]"}], "physicalAiNews": [{"title": "The Robot I Didn’t Expect to Build", "source": "IEEE Spectrum Robotics", "date": "2026-10-19", "url": "https://spectrum.ieee.org/agility-robotics-digit-5-redesign", "summary": "<img src=\"https://spectrum.ieee.org/media-library/author-jonathan-hurst-a-tall-slim-white-man-wearing-a-black-long-sleeve-shirt-and-dark-jeans-stands-next-to-his-digit-5-humano.jpg?id=68441166&amp;width=1245&amp;height=700&amp;coordinates=0%2C1422%2C0%2C1423\" /><br /><br /><p><strong><a href=\"https://www.agilityrobotics.com/\" rel=\"noopener noreferrer\" target=\"_blank\"><span>Agility Robotics<\/span><\/a>, the <\/strong>company I cofounded out of <a href=\"https://mime.engineering.oregonstate.edu/research/drl/\" target=\"_blank\">my robotics lab at Oregon State University<\/a> in 2015, has just launched <a href=\"https://spectrum.ieee.org/humanoid-robot-safety\" target=\"_self\">Digit 5<\/a>. It’s designed to be the first humanoid robot that can safely and economically do useful work at scale, allowing us to bring tens of thousands of humanoid workers into the real world. Engineered to lift 23-kilogram bins onto high shelves and with a battery that can run for 90 minutes on a 9-minute charge, Digit 5’s goal is to handle heavy warehouse tasks shift after shift, filling the need for labor in jobs that are too physically stressful or too dull for humans to want to do.<\/p><div class=\"rm-embed embed-media\"><\/div><p><span>Digit 5 is what Agility has been working toward for over a decade. But the robot is heavy and bulky, lacking the graceful natural motion of its predecessors, and it’s farther than I thought possible from the robot I dreamed of building when I started this company. To deliver a useful commercial product, Agility has taken a path that is very different from what I first imagined.<\/span><\/p><h2>From ATRIAS to Digit<\/h2><p>My dream has always been to build robots that combine locomotion and manipulation to move through the world and interact with it as people do. I seek a mastery of motion, achieved through devices designed to navigate the constraints of physics with elegance. When I started the <a href=\"https://mime.engineering.oregonstate.edu/research/drl/\" target=\"_blank\">Dynamic Robotics Laboratory<\/a> at Oregon State in 2008, we began with a theory derived from decades of work in biomechanics: that a simple “spring-mass” model (a body supported by legs that act like springs) should be able to reproduce every known walking and running gait found in animals.<\/p><p>We put theory into practice by building the bipedal robot <a href=\"https://spectrum.ieee.org/atrias-robot-dodgeball-barrage\" target=\"_self\">ATRIAS<\/a>—short for “Assume The Robot Is A Sphere,” a <a href=\"https://en.wikipedia.org/wiki/Spherical_cow\" target=\"_blank\">joke among physicists<\/a> about reducing a complex system to its simplest possible form. ATRIAS looked like a large microwave on stilts because it was only intended to demonstrate the physics of human walking and running. This was the first glimmer of achieving my dream; even though ATRIAS wasn’t designed to look like us, it still seemed natural, and even somehow alive, when it settled into a walking gait.<\/p><p>With the success of ATRIAS, the barriers to progress shifted from scientific to engineering and organizational, and a startup company seemed like the way to bridge the gap from a one-off research concept to an actual robotic product. I felt confident of two things: that I would be able to build robots that could go where people go, and that this capability would be incredibly useful. This combination of ambition and naivete is necessary for anyone to found a new company—how hard could it be?<\/p><p class=\"shortcode-media shortcode-media-youtube\"> <span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>Good advice for starting a company is to understand a customer problem, and then find a way to solve it using your unique capabilities. My cofounders, <a href=\"https://www.linkedin.com/in/damion-shelton/\" target=\"_blank\">Damion Shelton<\/a> and <a href=\"https://www.linkedin.com/in/mikhail-jones-5674a22b/\" rel=\"noopener noreferrer\" target=\"_blank\">Mikhail Jones<\/a>, and I did not do this. We relied on our belief that this technology would enable new possibilities and trusted ourselves to figure out the business as we went. So we simply focused on building our first product: the bipedal robot <a href=\"https://robotsguide.com/robots/cassie\" rel=\"noopener noreferrer\" target=\"_blank\">Cassie<\/a>.<\/p><p>Cassie was the first dynamic bipedal robot that researchers could buy, able to maintain its balance through active, fluid motion rather than careful, rigid steps. It had ostrichlike legs, not because we were imitating ground-running birds, but as a result of engineering strictly for performance. It was not intended to be commercially useful, and had no torso, arms, or head. We sold Cassie robots to Harvard, Caltech, the University of Michigan, the University of California, Berkeley, and a handful of other research institutions, ultimately saturating the market for US $250,000 bipedal research robots after having sold a total of 10 of them.<\/p><p class=\"shortcode-media shortcode-media-rebelmouse-image\"> <img alt=\"Three bipedal robots lined up in a warehouse, showing their evolving designs.\" class=\"rm-shortcode\" id=\"f749f\" src=\"https://spectrum.ieee.org/media-library/three-bipedal-robots-lined-up-in-a-warehouse-showing-their-evolving-designs.jpg?id=68441028&amp;width=980\" /><small class=\"image-media media-caption\">ATRIAS, Cassie, and Digit 4 EVT [left to right] are on display at Agility Robotics’ RoboFab in Salem, Ore. The 70,000-square-foot facility has the capacity to produce more than 10,000 Digit 5 robots per year.<\/small><small class=\"image-media media-photo-credit\">Agility Robotics<\/small><\/p><p>Because Cassie’s hardware enabled research into the physics of walking and running, the legged-robot research frontier shifted to control software. Traditionally, engineers controlled legged robots with detailed mathematical models that determined how the machines should move. With Cassie, researchers pioneered the new approach of reinforcement learning for bipedal legged locomotion: A simulated robot learns through trial and error, and the resulting neural network controls the physical machine. This approach is what enables virtually all of the dynamic behaviors that you see on legged robots today, and Cassie looked alive as it recovered from stumbles while climbing stairs, ran 5 kilometers across the Oregon State campus, and <a href=\"https://news.oregonstate.edu/news/bipedal-robot-developed-oregon-state-achieves-guinness-world-record-100-meters\" target=\"_blank\">broke the robot world record<\/a> for a 100-meter dash.<\/p><p>Cassie got us closer to being able to move through the world with confidence and grace, but to make it useful, we needed manipulation. After exhaustively exploring different configurations, we found that an upright torso helped the robot balance, while two arms mounted near the top of the torso allowed it to pick up large objects and to catch itself when it fell. <a href=\"https://robotsguide.com/robots/digit\" target=\"_blank\">Digit 1<\/a>, which added a torso and arms to the Cassie legs, was our first mobile manipulation robot, and another step on the path toward a product that could do useful work for commercial customers.<\/p><h2>Why Digit Began With Warehouse Bins<\/h2><p>As we explored the first applications for Digit, potential customers kept asking us: Why legs? And why a humanoid? These were tough questions for me to answer, because they exposed a core business reality: It didn’t matter to Agility Robotics if we solved a cool science problem in a beautiful way. What mattered to the business was solving real problems for customers.<\/p><p class=\"shortcode-media shortcode-media-youtube\"> <span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>After years of engagement with industry partners, we found one answer in warehouses and manufacturing facilities: moving <a href=\"https://spectrum.ieee.org/agility-robotics-digit\" target=\"_self\">bins<\/a>. Bin handling is a clearly defined task where two arms are needed to lift large bins up high and legs are the best way to balance and move in narrow spaces. Because the task can vary widely from one deployment to another, it hasn’t been broadly addressed by single-purpose automation. Yet it was constrained enough to give Digit an economically viable first job while it developed a broader set of skills.<\/p><p>In 2019, Digit began demonstrating its capabilities to do real work. <a href=\"https://spectrum.ieee.org/ford-self-driving-vans-will-use-legged-robots-to-make-deliveries\" target=\"_self\">With Ford Motor Company<\/a>, we showed how Digit 1 could carry packages from an autonomous vehicle to a front porch. We developed Digit 2 and 3 while working with a certain global package delivery company on moving and sorting cardboard boxes. <a href=\"https://spectrum.ieee.org/humanoid-robots\" target=\"_self\">Amazon<\/a> tested Digit 4 on moving and stacking bins, and it became the world’s first commercially deployed humanoid <a href=\"https://www.agilityrobotics.com/content/digit-moves-over-100k-totes\" target=\"_blank\">at the logistics provider GXO<\/a>. In 2024, Digit appeared on the cover of <em><em>Time<\/em><\/em> magazine.<\/p><p class=\"shortcode-media shortcode-media-youtube\"> <span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>Despite Digit’s apparent success, we began to run into conflicts between my dream and the needs of actual customers. We were no longer working with relatively patient university research labs. Agility has to sell robots to survive, and customers will only purchase robots that provide value. If bins weren’t moving, our customers were losing money. We spent a huge amount of time and effort keeping our first deployments operational, which arguably eliminated any profit we made. Yet this also kept our company learning and alive the way no lab demo ever could.<\/p><p>I had no idea how hard it would be, or that running a company would involve so many things that have nothing to do with solving technical problems: deployments across the country; shipping, service, and customer support; fundraising and investor relations; more fundraising; human resources and IT; developing fleet-management software; managing a supply chain; and even more fundraising. I had no experience with any of these things. My career had focused on solving the technical challenges of robots interacting with the world, and it turned out that was only a tiny piece of building a successful robotics company. But Agility was the only path I saw to continuing the technical work and having an impact.<\/p><h2>Turning Digit Into a Product<\/h2><p>I knew that Agility needed to focus more on robots as a product, but I didn’t know how to make that happen. Hiring the people we needed to run the company meant giving up an immense amount of control, but we had no other choice. We recruited a new executive team with the experience required to commercialize this new technology, and they quickly made changes that were both painful and necessary.<\/p><p class=\"shortcode-media shortcode-media-rebelmouse-image\"> <img alt=\"A series of images showing three headless humanoid robots with each one getting somewhat bulkier and less graceful.\" class=\"rm-shortcode\" id=\"1db2c\" src=\"https://spectrum.ieee.org/media-library/a-series-of-images-showing-three-headless-humanoid-robots-with-each-one-getting-somewhat-bulkier-and-less-graceful.jpg?id=68441280&amp;width=980\" /><small class=\"image-media media-caption\">Digit versions 1, 2, and 3 [left to right] show the evolution of the robot from a dynamic walking platform into a useful mobile manipulator. <\/small><small class=\"image-media media-photo-credit\">Agility<\/small><\/p><p>We had intended the next revision of Digit, <a href=\"https://www.youtube.com/watch?v=6x28vlbfA-k\" target=\"_blank\">Digit 4 EVT<\/a> (Engineering Validation and Test), to be a relatively minor upgrade. But Agility’s new leadership insisted that the robot was missing key features that were essential if Digit was going to become a real product. So Digit 4 EVT instead incorporated a series of major changes in a highly compressed timeline, such as larger batteries and system-wide upgrades for safety and regulatory compliance, which added enough mass to dramatically alter the robot’s appearance and capabilities.<\/p><p class=\"shortcode-media shortcode-media-rebelmouse-image rm-float-left rm-resized-container rm-resized-container-25\" style=\"float: left;\"> <img alt=\"A relatively bulky humanoid robot worker with a white head, simple grippers, and reversed legs stands for a portrait looking directly at the camera.\" class=\"rm-shortcode\" id=\"e15b4\" src=\"https://spectrum.ieee.org/media-library/a-relatively-bulky-humanoid-robot-worker-with-a-white-head-simple-grippers-and-reversed-legs-stands-for-a-portrait-looking-dir.jpg?id=68441369&amp;width=980\" /><small class=\"image-media media-caption\">While early Digits were headless, Agility Robotics was able to justify a head for Digit 4 to optimize antenna and camera placement, and it turned out to be surprisingly useful for human-robot interaction.<\/small><small class=\"image-media media-photo-credit\">Christie Hemm Klok<\/small><\/p><p> I could only watch as others brought their own talents to bear to make Digit into a successful product, in gut-wrenching ways that didn’t always align with my vision. There were some especially difficult times when I felt like there were compromises made that didn’t seem necessary, but making those decisions was no longer my sole responsibility. I had to accept that Digit had grown far beyond me, and look for ways of influencing decisions rather than directing them. In the moment, it was incredibly frustrating, as Digit 4 EVT took a few steps backward from my vision of how humanoids should look and move.<\/p><p>Agility is in our name because agility is core to the future of the company. I want Digit to be lithe and graceful. When people see Digit, I want them to like the robot, to understand what it can do at a glance, and to feel that it’s there to help. But with Digit 4 EVT, all of that was sacrificed to functionality, because of course it had to be—the customer just needs the robot to do the work. The design process became a ruthless triage, with aesthetics and elegance of movement being delayed over and over again in favor of brutal functionality. For an engineer whose mind lives more in the future than in the present, it has been hard for me to accept this trajectory. And yet, through Digit 4 EVT’s commercial deployments, we began to really understand specific applications and what they required. We mapped the first 10 use cases Digit would perform, and then began designing Digit 5 from scratch based on everything we had learned.<\/p><h2>Digit 5<\/h2><p>Digit 5 will be Agility’s first real step toward a general-purpose robot. It marks our transition from imagining what a future humanoid robot should be to designing a product around the realities of customer deployments. These realities include things like European CE regulatory compliance, North American UL electrical-safety certifications, and Federal Communications Commission limits for electromagnetic radiation—all of which felt tangential to my dream for Digit, but were absolute requirements.<\/p><p class=\"shortcode-media shortcode-media-rebelmouse-image rm-float-left rm-resized-container rm-resized-container-25\" style=\"float: left;\"> <img alt=\"A strong and bulky humanoid robot with a teal torso and legs, silver arms, and a black head stands with its arms upraised.\" class=\"rm-shortcode\" id=\"6b948\" src=\"https://spectrum.ieee.org/media-library/a-strong-and-bulky-humanoid-robot-with-a-teal-torso-and-legs-silver-arms-and-a-black-head-stands-with-its-arms-upraised.jpg?id=68441384&amp;width=980\" /><small class=\"image-media media-caption\">Digit 5 is designed to be the first humanoid robot that can operate safely next to human coworkers while working 20 hours a day and lifting more than a human can.<\/small><small class=\"image-media media-photo-credit\">Christie Hemm Klok<\/small><\/p><p>Customer requirements helped us realize that safety in particular was one of the most critical barriers to scaling. In Digit 4’s commercial deployments, the robots had to work behind physical barriers, separated from humans at all times, to meet insurance and regulatory demands. This seemed silly to me, because I’ve never felt that our robots were dangerous, but we have to <em><em>prove<\/em><\/em> that they’re safe. And since keeping the robots in safety cages severely limited their usefulness, enabling Digit 5 to operate safely around people became a primary design goal. We spent two years on this challenge.<\/p><p>Digit 5 is designed to be the first humanoid robot that can operate safely next to human coworkers. It will rely on an array of sensors to locate nearby people in a manner that’s certifiably safe, and then take actions based on that information. As a person approaches, Digit 5 is programmed to stop what it’s doing, set down its payload, sit on the floor, and cut power to its motors before the person gets close enough to touch the robot. This conservative approach reduces the risk to nearby people in a verifiable way, and we believe it’s the only approach that makes sense as a first step toward working alongside humans.<\/p><p class=\"shortcode-media shortcode-media-youtube\"> <span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>Yet this strategy also feels like a massive slowdown on the path toward robots becoming part of everyday life. Enabling coexistence with humans has influenced almost every aspect of Digit 5’s design: the shape of the legs and the body, the safety-rated sensors within protective housings, the isolated computers dedicated to safety, and more. All of these features increase the robot’s complexity, power consumption, mass, and physical size.<\/p><p class=\"shortcode-media shortcode-media-rebelmouse-image rm-float-left rm-resized-container rm-resized-container-25\" style=\"float: left;\"> <img alt=\"Turquoise humanoid robot with labeled safety, battery, cooling, and mobility features\" class=\"rm-shortcode\" id=\"62692\" src=\"https://spectrum.ieee.org/media-library/turquoise-humanoid-robot-with-labeled-safety-battery-cooling-and-mobility-features.png?id=68441430&amp;width=980\" /> <small class=\"image-media media-caption\">Digit 5 is Agility’s largest, heaviest, strongest, and most capable humanoid robot worker.<\/small><\/p><p class=\"shortcode-media shortcode-media-rebelmouse-image rm-float-left rm-resized-container rm-resized-container-25\" style=\"float: left;\"> <img alt=\"Turquoise humanoid robot with cameras, swappable grippers, and lifting-optimized legs\" class=\"rm-shortcode\" id=\"ca796\" src=\"https://spectrum.ieee.org/media-library/turquoise-humanoid-robot-with-cameras-swappable-grippers-and-lifting-optimized-legs.png?id=68441429&amp;width=980\" /> <small class=\"image-media media-caption\">The robot’s design was driven by safety, with integrated protection for the robot and for the humans it will work around.<\/small><small class=\"image-media media-photo-credit\">Agility Robotics<\/small><\/p><p>Weighing over 120 kg, Digit 5 is a <em><em>huge<\/em><\/em> robot. It needed to achieve the lifting limits recommended under the U.S. National Institute for Occupational Safety and Health guidelines for human workers, which include repeatedly lifting 23-kg bins and reaching shelves 1.75 meters high. Digit is designed to perform tasks like these for 20 hours a day—something no human can do. This requires motors with enough power and torque to lift the load, but also enough precision to delicately control the force Digit applies when it makes contact with the world. To power those motors, we needed a large battery and a dock for rapid autonomous charging. The dock will deliver 240 amperes at 48 volts, which is enough current to make its thick charging cables visibly wiggle under the induced magnetic forces, while powerful fans blow air through cooling channels in the robot’s torso to keep the battery from overheating. The battery and cooling system takes up about 75 percent of Digit’s torso, but it will allow the robot to operate for 90 minutes and fully recharge during a 9-minute break, enabling near-continuous work.<\/p><p>All of this extra bulk means that Digit 5 can no longer run or jump the way previous generations could, and the svelte form I imagined has become physically impossible. In some ways, Digit 5 feels more like a forklift than the graceful humanoid I set out to build. But looking at the situation rationally, I believe this trade-off is necessary for any company that claims its humanoid can do this kind of work today: If you see a robot that looks like a human working in a factory or warehouse, it either can’t lift the required weight or can’t make it through the whole shift. And if it’s not covered with sensors, it’s likely not safe to stand next to.<\/p><p>The most visible change with Digit 5 is that humanlike legs replace the ostrichlike legs of our earlier versions. While the “backward” leg configuration was <a href=\"https://spectrum.ieee.org/building-robots-that-can-go-where-we-go\" target=\"_self\">optimized for walking and running<\/a>, we discovered that it created <a href=\"https://youtu.be/OBRppKPXKuU?t=79\" rel=\"noopener noreferrer\" target=\"_blank\">problems<\/a> with squatting because the ankle will strike the ground. Digit 5 will spend a lot of time lifting heavy objects from near the floor, so we used a humanoid leg configuration with knee and hip motors that both contribute torque to help the robot stand up again.<\/p><p class=\"shortcode-media shortcode-media-rebelmouse-image rm-float-left rm-resized-container rm-resized-container-25\" style=\"float: left;\"> <img alt=\"Small teal robot sitting on factory floor as a worker walks past in the background\" class=\"rm-shortcode\" id=\"889db\" src=\"https://spectrum.ieee.org/media-library/small-teal-robot-sitting-on-factory-floor-as-a-worker-walks-past-in-the-background.jpg?id=68441553&amp;width=980\" /> <small class=\"image-media media-caption\">When Digit detects an approaching human, the robot will lower itself to the floor and cut power to its motors. Agility believes this is the only near-term approach to verifiably reduce risk when the robot is working near people.<\/small><small class=\"image-media media-photo-credit\">Agility Robotics<\/small><\/p><p>Other companies building humanoid robots have copied the human form without ever understanding its purpose. It’s very frustrating that, to an outside observer, it now looks like we discarded Agility’s distinctive leg design and simply did what everyone else was doing. Yet I know that we arrived at this shape based purely on functional engineering choices. Making a robot look like a human is the easy part—without the function to match, and the understanding of the physics underlying that function, the whole point of the human form may be lost.<\/p><p>With the power, battery life, and safety features that we are designing into Digit 5, we will have a truly useful robot. But it also compromises on some things that are core to my vision and mission. I understand why we made the choices we did and can justify them all, but together they leave me unsatisfied. It’s the curse of the engineer.<\/p><h2>What Comes After Digit 5<\/h2><p>I believe Digit 5 will be the scaling moment for Agility Robotics, the inflection point where we can begin deploying robots in large numbers. While the robot will continue carrying bins, our road map includes many more tasks, from picking individual items and tending machines, to preparing parts for assembly and shipping, and eventually doing assembly work itself. Its interchangeable tool interfaces and modular design will enable us to gradually upgrade its subsystems. It will be a platform for improvement, a source of data for future behavior training, and a viable product all at the same time.<\/p><p class=\"shortcode-media shortcode-media-rebelmouse-image\"> <img alt=\"Author Jonathan Hurst, a tall slim white man wearing a black long sleeve shirt and dark jeans, stands in between a smaller slimmer humanoid robot with a white head and a larger bulkier humanoid robot with a black head.\" class=\"rm-shortcode\" id=\"f53db\" src=\"https://spectrum.ieee.org/media-library/author-jonathan-hurst-a-tall-slim-white-man-wearing-a-black-long-sleeve-shirt-and-dark-jeans-stands-in-between-a-smaller-slimm.jpg?id=68441550&amp;width=980\" /> <small class=\"image-media media-caption\">Hurst stands between the previous version of Digit, Digit 4 EVT [left], and Digit 5.<\/small><small class=\"image-media media-photo-credit\">Christie Hemm Klok<\/small><\/p><p>But I cannot love Digit 5. It’s the largest, heaviest, most <a href=\"https://spectrum.ieee.org/humanoid-robot-safety\" target=\"_self\">expensive<\/a> robot Agility will ever build, full of design compromises that enable it to be exactly the robot it needs to be right now rather than the robot I dreamed of. In the beginning, I envisioned steady progress on agility and dexterity, with each version becoming more dynamically capable. Instead, developing Digit 5 has required large detours to incorporate requirements that seemed unrelated to my original vision. However, I now recognize that tackling these challenges was always necessary. Customers and product requirements didn’t ruin my vision; they revealed what my vision was missing. This is how robots will achieve commercial success and make a real-world impact, which will bring me closer to my scientific dream as well.<\/p><p>We won’t have a humanoid that matches the capabilities of humans until it achieves that mastery of motion that inspired me to found Agility over a decade ago. I saw glimmers of it with the spring-mass locomotion of ATRIAS, and more glimmers with Cassie’s running gait.<\/p><p>I know that such mastery is physically possible with the tools and hardware that we have right now, and despite all of its compromises, Digit 5 will give us a practical foundation for pursuing that dream. I want every future version of Digit to be lighter and more graceful, to interact more naturally with humans, and to be better at manipulating objects and moving through the world, enabling robots to enter aspects of our lives that they haven’t been able to help with before. By the time I’m old enough to need assistance at home, I expect Digit will be up to the task.<\/p><p>With Digit 5, Agility has built a robot that will be useful in our world. Now I’m getting back to work to make it beautiful, too. <span class=\"ieee-end-mark\"><\/span><\/p><p><em>This article appears in the November 2026 print issue.<\/em><\/p>"}, {"title": "Video Friday: When Two Robots Become One", "source": "IEEE Spectrum Robotics", "date": "2026-10-16", "url": "https://spectrum.ieee.org/video-friday-reconfigurable-robots", "summary": "<img src=\"https://spectrum.ieee.org/media-library/two-small-robots-with-long-limbs-and-bodies-linked-by-a-wire-join-connect-to-form-one-four-wheeled-robot-on-a-paved-pathway.gif?id=68443843&amp;width=1245&amp;height=700&amp;coordinates=0%2C7%2C0%2C7\" /><br /><br /><p><span>Video Friday is your weekly selection of awesome robotics videos, collected by your friends at <\/span><em>IEEE Spectrum<\/em><span> robotics. We also post a weekly calendar of upcoming robotics events for the next few months. Please <\/span><a href=\"mailto:automaton@ieee.org?subject=Robotics%20event%20suggestion%20for%20Video%20Friday\">send us your events<\/a><span> for inclusion.<\/span><\/p><h5><a href=\"https://www.corl.org/\">CoRL 2026<\/a>: 9–12 November 2026, AUSTIN<\/h5><h5><a href=\"https://2026.ieee-humanoids.org/\">Humanoids 2026<\/a>: 6–9 December 2026, SANTA CLARA, CA<\/h5><p>Enjoy today’s videos!<\/p><div class=\"horizontal-rule\"><\/div><div><span style=\"display: none;\"> <\/span><\/div><p class=\"rm-anchors\" id=\"45-ypqogpiu\">When one robot loves another robot very much, and they’re connected by a wire, they can get together and make a brand new robot! SFW.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://shin0805.github.io/twinx-bridging/\">JSK Lab<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"zssoymcggpu\"><em>What happens when Microducks meet? They start to sing together. Each Microduck syncs with its neighbors over Bluetooth, then they compose a song on the fly, in harmony and in perfect time. There’s no score and no conductor. Two, three, or four ducks are enough for a choir to break out.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>If Pollen isn’t selling <a href=\"https://spectrum.ieee.org/video-friday-microduck-robot\" target=\"_blank\">Microducks<\/a> in four packs for this exact reason, WHAT ARE THEY EVEN DOING!?<\/p><p>[ <a href=\"https://pollen-robotics.com/microduck/\">Pollen<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"9picemtfpwu\"><em>In an internal test, Google DeepMind robotics researchers instructed Gemini 4 Argon to watch a video of a human playing cornhole. Using its video understanding and advanced reasoning capabilities, Gemini 4 built a virtual simulation in MuJoCo and accurately calculated the physics and whole-body control required for Apptronik’s Apollo 2 humanoid to sink seven consecutive shots in the real world. This Video-to-Sim-to-Real pipeline compresses weeks of manual modeling into a few hours, transforming ordinary videos into an infinite training ground for physical AI.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://blog.google/innovation-and-ai/models-and-research/gemini-models/introducing-gemini-4-argon/\">Google DeepMind<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"xaxuv6tsib4\"><em>As of 11 October 2026, NASA’s Perseverance rover has driven 28.10 miles (45.22 kilometers), becoming the new off-world record-holder for total distance driven by any vehicle on the surface of another world. The previous record of 28.06 miles (45.16 kilometers) was held by NASA’s Opportunity rover. Perseverance reached that mark on the 2,006th Martian day, or sol, of its mission, covering in five and a half years a distance that took Opportunity almost 15.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.jpl.nasa.gov/missions/mars-2020-perseverance-rover/\">JPL<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"afotkkjjbky\">Let’s not argue about whether these are robots or not and just agree that they’re cool.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://daehwakim.com/oat/\">OATs<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"j9kfpi-hjx4\">If one cute little robot can clean up one block, how many blocks can 40 cute little robots clean up? Science has the answers!<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://arxiv.org/abs/2610.05677\">Paper<\/a> ]<\/p><p>Thanks, Keisuke!<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"ry5caexgbk0\"><em>Before <a href=\"https://spectrum.ieee.org/4-missions-will-search-the-martian-atmosphere-and-soil-for-signs-of-life\" target=\"_blank\">Rosalind Franklin<\/a> can explore Mars, it has to get off its lander. Engineers are rehearsing that first journey on Earth, using a full-size rover model and Mars-like terrain. The test recreates some of the challenges Rosalind Franklin will face on the Red Planet, from reduced gravity and a 20-degree incline to uneven ground and obstacles beneath its ramps.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.esa.int/Science_Exploration/Human_and_Robotic_Exploration/ExoMars_rover_twin_rehearses_first_drive\">European Space Agency<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"dp_i7hrvgpe\"><em>From custom part to running robot, the Atlas shop floor is built on precision, rapid assembly, and real-time collaboration. By machining parts in-house and streamlining assembly and repair under one roof, we are driving the manufacturing velocity needed to turn complex designs into walking hardware at scale.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://bostondynamics.com/\">Boston Dynamics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"jp79jzwmo4k\"><em>What can a quadruped robot do beyond the lab? Deep in China’s Ailao Mountains, DEEP Robotics Lynx M20S joined a team of researchers on a biodiversity field expedition—navigating rugged terrain, scouting routes ahead, carrying research equipment, and capturing wildlife in areas that are difficult to access on foot.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.deeprobotics.us/\">DEEP Robotics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"_eyarcc8d9y\"><em>The Kamino simulation software is a GPU-accelerated physics solver designed for accurate simulation of complex mechanical systems with kinematic loops, such as parallel manipulators, planar and spatial linkages, and multi-limbed robots with coupled joints, without requiring simplified approximations.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://disneyresearch.github.io/kamino-site/\">Disney Research<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"3h4mk2zcm3w\">The original Kawasaki <a href=\"https://spectrum.ieee.org/unimation-robot\" target=\"_blank\">UNIMATE<\/a> robot as featured in (remember this show?) <em>The MacNeil/Lehrer Report<\/em> in 1982.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://kawasakirobotics.com/\">Kawasaki Robotics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"95dsrzgzuhy\"><em>WildOS enables autonomous robots to perform long-range, open-vocabulary object search in previously unmapped and unstructured outdoor environments by unifying geometric safety with semantic visual reasoning. Through a vision-scored navigation graph and beyond-horizon target localization, the system demonstrates more efficient and robust exploration than conventional geometric or purely vision-based approaches in extensive field experiments.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://leggedrobotics.github.io/wildos/\">ETH Zurich Robotics Systems Lab<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"a5oyvvkspva\">Who needs an AI-generated person when you can have an actual robot that looks exactly like an AI-generated person instead?<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.ubtrobot.com/en/humanoid/products/u1-pro\">UBTECH Robotics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"8lc7x7c_sju\">The recovery behaviors here are impressive, but the robot is far slower than a human would be, suggesting that the value it generates is primarily in novelty. Which is fine for now, but novelty wears off, and then what?<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.sharpa.com/pages/sharpa-dq\">Sharpa<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"umohqodj_pi\">Here are a couple of good panels from ICRA 2026 in Vienna, including one on “Impact and Return on Investment on Humanoid Robots” and a second on “Advancing Sustainability in Robotics.”<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p class=\"shortcode-media shortcode-media-youtube\"> <span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://2026.ieee-icra.org/program/panels/\">ICRA 2026<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div>"}, {"title": "Video Friday: Robot Decommissioning Takes a Fun Turn", "source": "IEEE Spectrum Robotics", "date": "2026-10-09", "url": "https://spectrum.ieee.org/video-friday-reachy-mini-raps", "summary": "<img src=\"https://spectrum.ieee.org/media-library/an-ai-generated-image-of-a-smiling-humanoid-robot-in-robe-free-falls-into-deep-pit-filled-with-colorful-balls.jpg?id=68398684&amp;width=1245&amp;height=700&amp;coordinates=0%2C0%2C0%2C1\" /><br /><br /><p><span>Video Friday is your weekly selection of awesome robotics videos, collected by your friends at <\/span><em>IEEE Spectrum<\/em><span> robotics. We also post a weekly calendar of upcoming robotics events for the next few months. Please <\/span><a href=\"mailto:automaton@ieee.org?subject=Robotics%20event%20suggestion%20for%20Video%20Friday\">send us your events<\/a><span> for inclusion.<\/span><\/p><h5><a href=\"https://www.corl.org/\">CoRL 2026<\/a>: 9–12 November 2026, AUSTIN<\/h5><h5><a href=\"https://2026.ieee-humanoids.org/\">Humanoids 2026<\/a>: 6–9 December 2026, SANTA CLARA, CA<\/h5><p>Enjoy today’s videos!<\/p><div class=\"horizontal-rule\"><\/div><div><span style=\"display: none;\"> <\/span><\/div><p class=\"rm-anchors\" id=\"vsqiozzff-g\">It’s possible that I wasn’t the only one who thought that <a href=\"https://spectrum.ieee.org/video-friday-bioinspired-robotics\" target=\"_blank\">Figure’s recent stunt<\/a> was somewhat ridiculous.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>Devanthro is, in fact, selling these plastic balls for $1,000 each, and they’ll arrive in time for Christmas.<\/p><p>[ <a href=\"https://devanthro.myshopify.com/\">Devanthro<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"hfvuu1kmi-a\">Not that anyone uses ringtones anymore, but if we did, this would be absolutely everywhere, and I’d be loving it.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://pollen-robotics.com/\">Pollen<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"lanimroojeo\">Let’s not get too excited, but this threadlike linear motor is pretty sweet.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adma.75156\">Ecole Polytechnique Fédérale de Lausanne LMTS<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"oejn1ggmsi8\">What is this robot for? It’s for doing exactly what you see here, that’s what it’s for.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://rai-inst.com/resources/blog/introducing-exploy-simplifying-rl-policy-deployment-in-autonomous-robotics/\">RAI Institute<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"oxeomba-eew\"><em>Humanoid robots still struggle to plan contact-rich whole-body manipulation from egocentric RGB and proprioception. Workhorse learns such manipulation from robot-free human demonstrations. On a real Unitree G1, Workhorse sorts boxes with its hands and a kick, catches a thrown box, and topples and climbs a suitcase.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>Yeah that happens to me too when I have a communication failure.<\/p><p>[ <a href=\"https://hybridrobotics.github.io/workhorse/\">Hybrid Robotics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"vg9ycujrxag\">A car wash that models your vehicle, then cleans it with robot arms? Interesting idea.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>The recent reviews from this location suggest that the robots aren’t quite up to snuff yet, but it really seems like there’s potential here.<\/p><p>[ <a href=\"https://www.kuka.com/en-us/industries/solutions-database/2026/09/touchless-car-washing-with-robots/\">KUKA<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"_14hvdlehym\">So this is not the worst idea I’ve ever seen for what to do with humanoid robots.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.ehangzhou.gov.cn/2026-10/08/c_299254.htm\">DEEP Robotics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"7owu19bs0zw\">Some lovely manipulation with a deceptively simple gripper.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://generalistai.com/blog/gen-1.5\">Generalist<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"ufoymnzvlvu\">I am genuinely embarrassed to say that this <a href=\"https://spectrum.ieee.org/how-boston-dynamics-taught-its-robots-to-dance\" target=\"_blank\">robot dances<\/a> better than I do.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://generalroboticslab.com/CoDance\">General Robotics Lab<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"jwskw4u0-py\"><em>MIT researchers developed SANDO, a new navigation system that helps robots safely navigate unfamiliar environments while avoiding moving obstacles. The system can rapidly plan and adjust a collision-free path using onboard sensors and computing, with safety backed by mathematical guarantees.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://news.mit.edu/2026/planning-system-ensures-robots-flight-path-will-remain-collision-free-1007\">MIT News<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"y1qepwfahu8\">Can you spot the part of this video that I’m side-eyeing?<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>Yep, it’s where the middle clip starts after the hand already has a good grip on that peelable strip.<\/p><p>[ <a href=\"https://sanctuary.ai/\">Sanctuary AI<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"uhdcii-icjs\"><em>Inspired by feather stars, the NC State researchers report a soft underwater swimming robot capable of achieving three distinct swimming modes—jellyfishlike vertical swimming, fishlike directional steering, and rotorlike 3D reorientation—using only two pneumatic inputs.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://news.ncsu.edu/2026/10/feather-star-robot/\">NC State University<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"pwuq4whzskm\">Here’s a series of mini-keynotes from ICRA earlier this year on manipulation, humanoids, and embodied design.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://2026.ieee-icra.org/program/keynote-sessions/\">ICRA 2026<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div>"}, {"title": "Boston Dynamics gives more insight into its redesigned humanoid hand", "source": "Robotics Business Review", "date": "2026-10-09", "url": "https://www.therobotreport.com/boston-dynamics-gives-more-insight-into-its-redesigned-humanoid-hand/", "summary": "<p>The Robot Report spoke with Alberto Rodriguez, the director of robot behavior for Atlas at Boston Dynamics, about the humanoid's new hand.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/boston-dynamics-gives-more-insight-into-its-redesigned-humanoid-hand/\">Boston Dynamics gives more insight into its redesigned humanoid hand<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Jabil discusses the pace of humanoid robot development and production", "source": "The Robot Report", "date": "2026-10-08", "url": "https://www.therobotreport.com/jabil-discusses-pace-humanoid-robot-development-production/", "summary": "<p>Jabil, which is working with robot developers such as Apptronik, provides a design perspective on humanoid progress.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/jabil-discusses-pace-humanoid-robot-development-production/\">Jabil discusses the pace of humanoid robot development and production<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Boston Dynamics appoints former Amazon exec Rohit Prasad as new CEO", "source": "Robotics Business Review", "date": "2026-10-06", "url": "https://www.therobotreport.com/boston-dynamics-appoints-former-amazon-executive-rohit-prasad-new-ceo/", "summary": "<p>Before Boston Dynamics, Prasad served as senior vice president and head scientist for Alexa and artificial general intelligence at Amazon.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/boston-dynamics-appoints-former-amazon-executive-rohit-prasad-new-ceo/\">Boston Dynamics appoints former Amazon exec Rohit Prasad as new CEO<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Video Friday: Albatross Falls, Spins, Self-Rights, and Sails Away", "source": "IEEE Spectrum Robotics", "date": "2026-10-02", "url": "https://spectrum.ieee.org/video-friday-bioinspired-robotics", "summary": "<img src=\"https://spectrum.ieee.org/media-library/futuristic-robotic-bird-gliding-low-above-water-with-a-trailing-wire.png?id=68024679&amp;width=1245&amp;height=700&amp;coordinates=0%2C275%2C0%2C276\" /><br /><br /><p><span>Video Friday is your weekly selection of awesome robotics videos, collected by your friends at <\/span><em>IEEE Spectrum<\/em><span> robotics. We also post a weekly calendar of upcoming robotics events for the next few months. Please <\/span><a href=\"mailto:automaton@ieee.org?subject=Robotics%20event%20suggestion%20for%20Video%20Friday\">send us your events<\/a><span> for inclusion.<\/span><\/p><h5><a href=\"https://www.corl.org/\">CoRL 2026<\/a>: 9–12 November 2026, AUSTIN<\/h5><h5><a href=\"https://2026.ieee-humanoids.org/\">Humanoids 2026<\/a>: 6–9 December 2026, SANTA CLARA, CA<\/h5><p>Enjoy today’s videos!<\/p><div class=\"horizontal-rule\"><\/div><div><span style=\"display: none;\"> <\/span><\/div><blockquote class=\"rm-anchors\" id=\"j8curj0ydxi\"><em>We’ve developed ALBATROSS (Airborne Lander with Buoyant AuToROtating Sailing Sensor), a hybrid aerial-marine robot. It can be released from the air, autorotate down to the water without a parachute, passively self-right after landing, and then reuse the same rigid wings as sails for autonomous wind-powered navigation.<\/em><em>The key idea is to make the physical structures do as much of the work as possible. Rather than carrying separate systems for aerial descent, landing, and marine propulsion, ALBATROSS uses the same wings for both autorotation and sailing, with minimal actuation. Ultimately, we’re interested in whether platforms like this could combine rapid aerial deployment with persistent, energy-efficient marine sensing.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.sutd.edu.sg/\" target=\"_blank\">Singapore University of Technology and Design<\/a> ] paper via [ <a href=\"https://www.science.org/doi/10.1126/scirobotics.aed1423\">Science Robotics<\/a> ]<\/p><p>Thanks, Shane!<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"pfah5oqdpdm\">I’m just getting so burnt out on the <a href=\"https://spectrum.ieee.org/robot-martial-arts\" target=\"_blank\">humanoid publicity stunts<\/a>, you know?<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.figure.ai/news/f-02-decommission\">Figure<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"_j6cd1smsza\"><em>Sharpa unveiled three major proprietary new products at the IEEE/RSJ International Conference on Intelligent Robots and Systems (IROS): D01, the first integrated tactile-sensing robot built for dexterous manipulation; W02, a next-generation fully tactile, ultracompact, lightweight dexterous hand; and AE01, a high-fidelity haptic exoskeleton data glove.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.sharpa.com/blogs/news/sharpa-launches-three-flagship-products-at-iros-pushing-the-boundaries-of-dexterous-manipulation\">Sharpa<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"cfs_zu1kwqw\"><em>Why will Boston Dynamics win the humanoid robotics race? We’ve already commercialized autonomous mobile robots, creating markets with Spot and Stretch. Now we’re doing it again with Atlas: learning in real environments, designing for manufacturing at scale, and introducing a new era of physical intelligence.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://bostondynamics.com/news/boston-dynamics-opens-robotics-metaplant-application-center-to-train-humanoid-robots-for-manufacturing-tasks/\">Boston Dynamics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"fvk2n5exr_u\"><em>This work presents a lightweight, compliant footpad that enhances the terrain adaptability of a hopping robot. The design combines a planar foot supported by a compliant spherical joint for self‑alignment with embedded spines to improve traction on uneven or slippery surfaces.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://climb.mie.utoronto.ca/\">CLIMB Lab, University of Toronto<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"ozd8vyccygy\"><em>Heterogeneous robot teams distribute complementary capabilities across specialized agents, but their physical roles and capacities typically remain fixed throughout a mission. We present HARP, a Heterogeneous Aerial Robotic modules Platform, in which independently deployable aerial robots physically reconfigure to compose their capabilities for field operations.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://generalroboticslab.com/HARP\">General Robotics Lab<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"rr05thcb6mg\">Some very impressive mobility from <a href=\"https://spectrum.ieee.org/video-friday-anymals-and-animals\" target=\"_blank\">ANYmal<\/a>.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://arxiv.org/abs/2601.17428\">ETH Zurich RSL<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"a-8o8l_zc4a\">Daniel writes, “I’m a high school student in Canada, and I built a self-constructing robot arm that assembles itself. It’s designed to be low-cost, with disaster response in mind: Small robots can squeeze through gaps in rubble but are too weak to move things, while big arms are strong but can’t fit through. My arm is split into three wheeled modules that travel separately, then dock together using a spring-lock mechanism.”<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.youtube.com/@DanielZhu-y1y\">Daniel Zhu<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"rnt97btyqrq\"><a href=\"https://spectrum.ieee.org/rivian-self-driving\" target=\"_blank\">Autonomous highway driving<\/a> not impressive enough for you? Try this.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.xpeng.com/news/01a0f7644454a0e70a9e8a02823600e0\">XPENG<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"aqb3m8j1l88\"><em>The IT Imperial team has connected MaleCNS—a published connectome of a male fruit fly (Drosophila melanogaster)—to a physical Unitree G1 humanoid robot. The system creates a closed loop: camera → fruit-fly neural model → motor decoding → physical robot movement. The robot receives visual input through its stereo camera. The images are transformed into a representation adapted to the fly’s visual system, processed by the computational model based on the reconstructed nervous system, and then converted into movement commands for the robot.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://itimperial.group/en\">IT Imperial<\/a> ]<\/p><p>Thanks, Anna!<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"mhfh0fah5fy\">My guess is that this is far easier than it looks or far harder than it looks, and I’m honestly not sure which.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.ahadjawaid.com/nac\">Paper<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"eqb015r0290\">I cannot believe that this is still a thing, but good on them!<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.tevel-tech.com/\">Tevel<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"7wo36jslsto\"><em>In Part 1 of Dexterity Explained, we break down what manual dexterity is, why it matters, and how robotic hands and physical AI work together to bring greater skill, precision, and control to physical tasks.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://sanctuary.ai/solutions/\">Sanctuary AI<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"zgbm8pdtpgo\">XPENG has a lot of money to build a lot of these robots. They do look very human. I’m not sure what they’re going to do, though.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.xpeng.com/pressroom/news/01a03797fccda01e0de68a02a256006a\">XPENG<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"ae3-hjqw9ci\">That’s a lot of robots! Tell me what they’re all going to do!<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.ubtrobot.com/en/\">UBTECH<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"wtyg6u_sf18\"><em>When floods swept away roads and bridges in Nepal, local drone pilots stepped in to help map the damage, support search teams, and deliver essential supplies to communities cut off from help. In this episode of Ground Truth with Flying Labs, host Leka Tingitana speaks with Uttam Pudasaini, an advisor to Nepal Flying Labs, and Raj Bikram Maharjan, cofounder of Airlift Techn
