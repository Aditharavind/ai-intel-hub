ltiaxial coreless Hall-effect current sensor for EVs<\/a> appeared first on <a href=\"https://www.electronicsweekly.com\">Electronics Weekly<\/a>.<\/p>"}, {"title": "Melexis sampling low-power, cost-sensitive 3D magnetometer", "source": "Electronics Weekly", "date": "2026-09-02", "url": "https://www.electronicsweekly.com/news/business/melexis-sampling-low-power-cost-sensitive-3d-magnetometer-2026-09/", "summary": "<p>Melexis is sampling a low-power 3D magnetometer for cost-sensitive, high-volume applications. Delivering on-the-fly flexibility and wide selectable ranges, the MLX90391 provides smart utility meters with robust tampering protection up to [&#8230;]<\/p>\n<p>The post <a href=\"https://www.electronicsweekly.com/news/business/melexis-sampling-low-power-cost-sensitive-3d-magnetometer-2026-09/\">Melexis sampling low-power, cost-sensitive 3D magnetometer<\/a> appeared first on <a href=\"https://www.electronicsweekly.com\">Electronics Weekly<\/a>.<\/p>"}, {"title": "A Safari extension that hides YouTube AI-labeled videos", "source": "Adafruit", "date": "2026-09-02", "url": "https://blog.adafruit.com/2026/09/02/a-safari-extension-that-hides-youtube-ai-labeled-videos/", "summary": "Weedout is a Safari extension that removes videos YouTube has labeled &#8220;Made with AI&#8221; from what you see. Instead of covering them with a warning screen, it takes them out of the home feed, search results, related videos and Shorts. Detection uses YouTube&#8217;s own &#8220;Made with AI&#8221; disclosure badge, so there is no guessing and [&#8230;]"}, {"title": "Creating green clothing with living fungi", "source": "Adafruit", "date": "2026-09-02", "url": "https://blog.adafruit.com/2026/09/02/creating-green-clothing-with-living-fungi/", "summary": "Maya Posch, writing at Hackaday, covers a Science Advances paper from Ke Li and colleagues on a fungal platform for living textiles. Most fabric is dead tissue, or was never part of an organism at all. This work falls under engineered living materials, where the fabric itself stays alive. The base material is the fungus [&#8230;]"}, {"title": "JP’s Product Pick of the Week  9/1/26 @adafruit @johnedgarpark #adafruit #newproductpick", "source": "Adafruit", "date": "2026-09-02", "url": "https://blog.adafruit.com/2026/09/02/jps-product-pick-of-the-week-9-1-26-adafruit-johnedgarpark-adafruit-newproductpick/", "summary": "If you missed this week’s livestream of John Park’s Product Pick of the Week, not to worry, here’s the video . This week’s pick is the Adafruit I2S 3W Stereo Speaker Bonnet! Watch the video to find out about the Adafruit I2S 3W Stereo Speaker Bonnet, how to use it, a live demo, and more. [&#8230;]"}, {"title": "Apple tells Mac App Store developers they can now drop Intel support", "source": "Adafruit", "date": "2026-09-02", "url": "https://blog.adafruit.com/2026/09/02/apple-tells-mac-app-store-developers-they-can-now-drop-intel-support/", "summary": "Apple started informing developers today that universal macOS apps on the Mac App Store that require macOS 13 or later can now drop support for Intel-based Macs. In the email, Apple says: We’re reaching out to let you know that universal macOS apps on the Mac App Store that require macOS 13 or later can [&#8230;]"}, {"title": "UPDATED GUIDE: Adafruit Sparkle Motion Mini #AdafruitLearningSystem #WipperSnapper @Adafruit", "source": "Adafruit", "date": "2026-09-02", "url": "https://blog.adafruit.com/2026/09/02/updated-guide-adafruit-sparkle-motion-mini-adafruitlearningsystem-wippersnapper-adafruit/", "summary": "UPDATE GUIDE: Adafruit Sparkle Motion Mini The Adafruit Sparkle Motion Mini is part of our series of &#8220;Sparkle Motion&#8221; boards, that are our attempt to make the best small WLED-friendly smart LED driving board in the whole world. Our resident mermaid, firepixie makes a lot of projects with WLED and she loves it! The Adafruit Sparkle Motion Mini guide has everything [&#8230;]"}, {"title": "TIME Trailblazers: Designing and Making the Future", "source": "Adafruit", "date": "2026-09-02", "url": "https://blog.adafruit.com/2026/09/02/time-trailblazers-designing-and-making-the-future/", "summary": "Alex Honnold is one of the TIME Trailblazers, image via Wikipedia Commons: Alex Honnold in 2023 in Antarctica by Christopher Michel &#160; TIME Magazine has released a list of their TIME Trailblazers: Designing and Making the Future recognizing leaders who are building towards the future through engineering, design and more.  The list appears to be [&#8230;]"}, {"title": "How to change Raspberry Pi WiFi details from the SD card", "source": "Adafruit", "date": "2026-09-02", "url": "https://blog.adafruit.com/2026/09/02/how-to-change-raspberry-pi-wifi-details-from-the-sd-card/", "summary": "Abhishek Prakash at It&#8217;s FOSS wrote up a way to fix a Raspberry Pi that can no longer reach your network: edit the WiFi settings straight from the microSD card. This is handy when the router changed, the SSID and password are new, and hooking the Pi up to a monitor and keyboard is more [&#8230;]"}, {"title": "I vibecoded Morrowind, Duke Nukem, and Serious Sam onto an iPhone", "source": "Adafruit", "date": "2026-09-02", "url": "https://blog.adafruit.com/2026/09/02/664081/", "summary": "Arjun Krishna Lal, writing at TechSpot, describes how he got Morrowind, Duke Nukem 3D, and Serious Sam: The First Encounter running natively on an iPhone without knowing how to code. He used AI coding agents and a $100 ChatGPT Pro account. He also had no Mac, so the builds were compiled on a GitHub macOS [&#8230;]"}, {"title": "Smart Phone Mittens #AdafruitLearnSystem", "source": "Adafruit", "date": "2026-09-02", "url": "https://blog.adafruit.com/2026/09/02/smart-phone-mittens-adafruitlearnsystem/", "summary": "Believe it or not its that time of year and sweater weather is just around the corner. Its never too early to start knitting up a pair of conductive mittens for when the seasons change. Have you missed a call because you couldn&#8217;t get your gloves off fast enough? Maybe you&#8217;ve tried a pair of [&#8230;]"}, {"title": "GPIBee (UsbGpib V3) USB-to-GPIB adapter gains PoE Ethernet", "source": "Adafruit", "date": "2026-09-02", "url": "https://blog.adafruit.com/2026/09/02/gpibee-usbgpib-v3-usb-to-gpib-adapter-gains-poe-ethernet/", "summary": "Jean-Luc Aufranc writes at CNX Software that XyphroLabs has released the third revision of its UsbGpib adapter, now called GPIBee. The adapter connects legacy GPIB/IEEE-488 test instruments to modern computers. V3 adds an Ethernet RJ45 port with PoE, an aluminum enclosure, and USB 2.0 at 480 Mbps. That speed supports the VXI-11 protocol over a [&#8230;]"}, {"title": "Where will RISC-V be in 20 Years? Poll results", "source": "Adafruit", "date": "2026-09-02", "url": "https://blog.adafruit.com/2026/09/02/where-will-risc-v-be-in-20-years-poll-results/", "summary": "Babbage, writing at The Chip Letter, re-ran a reader poll asking where RISC-V will be in 20 years. The first poll ran in August 2023, during a series of posts on the architecture. It was framed around a line from Krste Asanović and David Patterson: that RISC-V could become &#8220;the standard ISA for all computing [&#8230;]"}, {"title": "Atari Lynx: the first color handheld game console", "source": "Adafruit", "date": "2026-09-02", "url": "https://blog.adafruit.com/2026/09/02/atari-lynx-the-first-color-handheld-game-console/", "summary": "Dave Farquhar has written a history of the Atari Lynx, which just turned 37 years old, at The Silicon Underground. It was the first handheld game console with a color screen. It reached the market on September 1, 1989, about two months after the Nintendo Game Boy. The design came from three Amiga veterans: Dave [&#8230;]"}, {"title": "Qualcomm introduces Dragonwing Q-2390 and IQ-2390 for consumer and industrial AIoT applications", "source": "CNX Software", "date": "2026-09-01", "url": "https://www.cnx-software.com/2026/09/01/qualcomm-introduces-dragonwing-q-2390-and-iq-2390-for-consumer-and-industrial-aiot-applications/", "summary": "<div><img alt=\"Qualcomm Dragonwing IQ2 Q2\" class=\"attachment-medium size-medium wp-post-image\" height=\"405\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/09/Qualcomm-Dragonwing-IQ2-Q2-720x405.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Qualcomm has announced the Qualcomm Dragonwing Q-2390 and IQ-2390 quad-core Cortex-A78/A55 processors for AIoT consumer, commercial and industrial applications. The Dragonwing Q-2390 processor is designed for commercial and consumer devices, notably for applications such as retail and smart home products, as well as smart displays and enterprise edge devices, while the Dragonwing IQ-2390 processor is the SKU from the Dragonwing IQ2 Series designed for industrial automation, machine vision, building management and energy systems. Qualcomm IQ-2390 and Q-2390 specifications: CPU 1x Arm Cortex-A78 core up to 1.5 or 1.9 GHz depending on SKU 3x Arm Cortex-A55 cores up to 1.5 or 1.9 GHz depending on SKU Optional SiFive E61 RISC-V real-time core up to 600MHz with 768kB memory Cache &#8211; 512 KB L3 cache GPU &#8211; Qualcomm Adreno 704 up to 1.1 GHz Audio DSP &#8211; Qualcomm Hexagon V66  up to 1.1 GHz NPU &#8211; Qualcomm Hexagon up to 1.1 TOPS DPU [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/09/01/qualcomm-introduces-dragonwing-q-2390-and-iq-2390-for-consumer-and-industrial-aiot-applications/\">Qualcomm introduces Dragonwing Q-2390 and IQ-2390 for consumer and industrial AIoT applications<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Makera Z1 Desktop CNC Review – Smart milling, 4-th axis module, and 5W laser engraving", "source": "CNX Software", "date": "2026-09-01", "url": "https://www.cnx-software.com/2026/09/01/makera-z1-desktop-cnc-review-smart-milling-4-axis-module-and-5w-laser-engraving/", "summary": "<div><img alt=\"makera z1 desktop cnc cyclone dust collector lite\" class=\"attachment-medium size-medium wp-post-image\" height=\"540\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/09/makera-z1-desktop-cnc-cyclone-dust-collector-lite-720x540.png\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>The Makera Z1 Desktop CNC is a desktop CNC machine designed for milling and engraving work that requires precision. The fully enclosed machine features an aluminum structure, offers a 200 × 200 × 100 mm work volume, and is suitable for wood, plastic, acrylic, PCB boards, carbon fiber, as well as non-ferrous metals such as aluminum, brass, and copper. The standout feature of this model is its fairly complete set of assistive functions, including a quick tool change system for swapping milling bits, auto probing &#38; leveling for detecting position and leveling the workpiece, the AeroDust system for blowing and managing chips/dust, and a built-in camera for monitoring operation. In addition, optional accessories such as a 4th-axis rotary module, a 5W laser head, a workholding kit, and a 3D probe can also be installed. This model relies on a linear rail system featuring Acme lead screws and NEMA 17 stepper [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/09/01/makera-z1-desktop-cnc-review-smart-milling-4-axis-module-and-5w-laser-engraving/\">Makera Z1 Desktop CNC Review &#8211; Smart milling, 4-th axis module, and 5W laser engraving<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "ArmSoM Sige6 Allwinner A733 SBC features up to 128GB soldered-on eMMC flash, 16GB LPDDR5", "source": "CNX Software", "date": "2026-09-01", "url": "https://www.cnx-software.com/2026/09/01/armsom-sige6-allwinner-a733-sbc-features-up-to-128gb-soldered-on-emmc-flash-16gb-lpddr5/", "summary": "<div><img alt=\"ArmSom Sige6 SBC\" class=\"attachment-medium size-medium wp-post-image\" height=\"470\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/09/ArmSom-Sige6-SBC-720x470.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>ArmSoM Sige6 is yet another SBC powered by the Allwinner A733 octa-core SoC, offered in a credit card form factor with up to 128GB soldered-on eMMC flash and up to 16GB LPDDR5. The single board computer features a microSD card slot and an M.2 M-key PCIe 3.0 x2 slot for storage, Gigabit Ethernet (with optional PoE), WiFi 6, and Bluetooth 5.4 connectivity, HDMI 2.0 and MIPI DSI display interfaces, a MIPI CSI camera interface, USB 3.0/2.0 ports, a 3.5mm audio jack, a 40-pin GPIO header, and more. ArmSom Sige6 specifications: SoC – Allwinner A733-HN3 CPU Dual-core Arm Cortex-A76 @ up to 2.00 GHz Hexa-core Arm Cortex-A55 @ up to 1.80 GHz Single-core RISC-V E902 real-time core GPU – Imagination Technologies BXM-4-64 MC1 GPU with support for OpenGL ES 3.2, Vulkan 1.3, and OpenCL 3.0 VPU 4Kp60/8Kp24 H.265/VP9/AVS2 decoding, 4Kp30 H.264  decoding 4Kp30 H.265/H.264 encoding AI accelerator – 3 TOPS NPU Process [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/09/01/armsom-sige6-allwinner-a733-sbc-features-up-to-128gb-soldered-on-emmc-flash-16gb-lpddr5/\">ArmSoM Sige6 Allwinner A733 SBC features up to 128GB soldered-on eMMC flash, 16GB LPDDR5<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "IAR Adds Native Linux Support to Cross-Platform Embedded IDE", "source": "Embedded.com", "date": "2026-09-01", "url": "https://www.embedded.com/iar-adds-native-linux-support-to-cross-platform-embedded-ide/", "summary": "<p>IAR has expanded the cross-platform capabilities of its certified embedded development environment by adding native Linux support alongside Windows. Developed using the Qt Framework, the new IAR cross-platform IDE is designed to provide a development environment across operating systems for safety- and compliance-critical embedded software projects. The platform also integrates directly with Visual Studio Code [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/iar-adds-native-linux-support-to-cross-platform-embedded-ide/\">IAR Adds Native Linux Support to Cross-Platform Embedded IDE<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "Achronix Adds JESD204C IP Core for Speedster7t FPGAs", "source": "Embedded.com", "date": "2026-09-01", "url": "https://www.embedded.com/achronix-adds-jesd204c-ip-core-for-speedster7t-fpgas/", "summary": "<p>Achronix Semiconductor Corp. has introduced a high-performance JESD204C IP core for its family of Speedster7t FPGAs. The IP core is designed to connect advanced analog-to-digital converters and digital-to-analog converters to programmable logic. Each core supports data rates of up to 32 Gbits/s per lane and up to eight lanes per link, which translates into an [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/achronix-adds-jesd204c-ip-core-for-speedster7t-fpgas/\">Achronix Adds JESD204C IP Core for Speedster7t FPGAs<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "ARK Just A Pi – A tiny NDAA-compliant Raspberry Pi CM5 carrier board for drones and robots", "source": "CNX Software", "date": "2026-08-31", "url": "https://www.cnx-software.com/2026/08/31/ark-just-a-pi-a-tiny-ndaa-compliant-raspberry-pi-cm5-carrier-board-for-drones-and-robots/", "summary": "<div><img alt=\"ARK Just A Pi\" class=\"attachment-medium size-medium wp-post-image\" height=\"443\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/08/ARK-Just-A-Pi-720x443.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>ARK Just A Pi is a tiny NDAA-compliant carrier board for the Raspberry Pi CM5 designed for drones, robots, or other space-constrained embedded applications that&#8217;s about the size of the Compute Module itself. This follows ARK Electronics&#8217; NDAA-compliant ARK Jetson Orin NX/Nano bundles introduced in 2024. The new &#8220;Just A Pi&#8221; is much smaller and lighter, features a built-in 100 Mbps Ethernet switch with two JST-GH Ethernet ports, a micro HDMI port, two MIPI CSI camera connectors, a microSD card slot, a PCIe FFC connector, a USB 3.0 Type-C dual role connector, and a range of small connectors for UART, SPI, PWM, GPIO, and fan. It also features a power connector for the company&#8217;s PAB power modules. ARK Just A Pi specifications: Supported SoM Raspberry Pi Compute Module 5 &#8211; Full support Raspberry Pi Compute Module 4 &#8211; The following interfaces are not supported: CSI1/CAM1, UART2, USB-C, PCIe, and fan [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/08/31/ark-just-a-pi-a-tiny-ndaa-compliant-raspberry-pi-cm5-carrier-board-for-drones-and-robots/\">ARK Just A Pi &#8211; A tiny NDAA-compliant Raspberry Pi CM5 carrier board for drones and robots<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "D-Robotics RDK S100P – A 128 TOPS alternative to NVIDIA Jetson Orin NX 16GB with Cortex-A78AE/R52+ cores", "source": "CNX Software", "date": "2026-08-31", "url": "https://www.cnx-software.com/2026/08/31/d-robotics-rdk-s100p-a-128-tops-alternative-to-nvidia-jetson-orin-nx-16gb-with-cortex-a78ae-r52-cores/", "summary": "<div><img alt=\"RDK S100P Development Kit\" class=\"attachment-medium size-medium wp-post-image\" height=\"480\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/08/RDK-S100P-Development-Kit-720x480.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>D-Robotics RDK S100P development kit is a robotics SBC built around an S100P-based module providing an alternative to NVIDIA Jetson Orin NX 16GB with a 6-core Cortex-A78AE application cluster, a 4-core Cortex-R52+ MCU domain, a Nash BPU rated at 128 TOPS INT8, a Mali-G78AE GPU, and 24 GB of LPDDR5. The four R52+ cores can be configured for reliable real-time control: two cores run in lockstep for safety, and the other two support split-lock operation. In practice, the A78AE CPU and BPU can handle Linux and vision processing, while the MCU handles time-critical tasks such as motor and sensor I/O. This can reduce the need for a separate real-time controller, although whether it eliminates one depends on the robot and its requirements. RDK S100P specifications: SoC – D-Robotics S100P CPU – 6x Arm Cortex-A78AE @ 2.0 GHz (safety-capable AE cores) MCU – 4x Arm Cortex-R52+ @ 1.2 GHz (1x DCLS [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/08/31/d-robotics-rdk-s100p-a-128-tops-alternative-to-nvidia-jetson-orin-nx-16gb-with-cortex-a78ae-r52-cores/\">D-Robotics RDK S100P &#8211; A 128 TOPS alternative to NVIDIA Jetson Orin NX 16GB with Cortex-A78AE/R52+ cores<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Orange Pi Zero 4 – Compact Allwinner A733 SBC offers HDMI, USB-C DP, GbE, WiFI 6, PCIe FFC connector for $26.5 and up", "source": "CNX Software", "date": "2026-08-31", "url": "https://www.cnx-software.com/2026/08/31/orange-pi-zero-4-allwinner-a733-sbc-offers-hdmi-usb-c-dp-gbe-wifi-6-pcie-ffc-connector/", "summary": "<div><img alt=\"Orange Pi Zero 4\" class=\"attachment-medium size-medium wp-post-image\" height=\"498\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/08/Orange-Pi-Zero-4-720x498.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Orange Pi Zero 4 is an affordable yet feature-rich Allwinner A733 single board computer (SBC) with up to 8GB RAM, eMMC/UFS storage footprint, a microSD card slot, and plenty of I/Os. The board packs mini HDMI and USB-C DisplayPort, Gigabit Ethernet, WiFi 6 and Bluetooth 5.4, two MIPI CSI camera connectors, a Raspberry Pi-style PCIe FFC connector, and two GPIO headers into a compact 55x50mm form factor. Orange Pi Zero 4 specifications: SoC – Allwinner A733 CPU Dual-core Arm Cortex-A76 @ up to 2.00 GHz Hexa-core Arm Cortex-A55 @ up to 1.79 GHz Single-core RISC-V E902 real-time core up to 200 MHz GPU – Imagination Technologies BXM-4-64 MC1 GPU with support for OpenGL ES 3.2, Vulkan 1.3, OpenCL 3.0 VPU 8Kp24 H.265/VP9/AVS2 decoding 4Kp30 H.265/H.264 encoding AI accelerator – 3 TOPS NPU System Memory – 1GB, 2GB, 4GB, 6GB, or 8GB LPDDR5/LPDDR4/LPDDR4x; note: 16GB is also listed in the specs, [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/08/31/orange-pi-zero-4-allwinner-a733-sbc-offers-hdmi-usb-c-dp-gbe-wifi-6-pcie-ffc-connector/\">Orange Pi Zero 4 &#8211; Compact Allwinner A733 SBC offers HDMI, USB-C DP, GbE, WiFI 6, PCIe FFC connector for $26.5 and up<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "SensiBel Launches 84-dBA SNR Optical MEMS Microphone", "source": "Embedded.com", "date": "2026-08-31", "url": "https://www.embedded.com/sensibel-launches-84-dba-snr-optical-mems-microphone/", "summary": "<p>SensiBel has introduced the SBM140B, an optical MEMS microphone designed to provide high-fidelity audio capture across a wide acoustic range. The company claims it is the first MEMS microphone to combine an 84-dBA signal-to-noise ratio (SNR) with a 146-dB sound pressure level (SPL) acoustic overload point (AOP), resulting in a specified dynamic range of 136 [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/sensibel-launches-84-dba-snr-optical-mems-microphone/\">SensiBel Launches 84-dBA SNR Optical MEMS Microphone<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "Building an Upgrade Path for Safety-Critical Aerospace Computing", "source": "Embedded.com", "date": "2026-08-31", "url": "https://www.embedded.com/building-an-upgrade-path-for-safety-critical-aerospace-computing/", "summary": "<p>Avionic systems are expected to operate for decades. But the processors inside them have much shorter lifecycles. This creates an expensive problem for avionics engineers because replacing the processor may also force changes to the surrounding computing hardware and software. For instance, advanced drones and autonomous aerial systems need more computing power for perception, sensor [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/building-an-upgrade-path-for-safety-critical-aerospace-computing/\">Building an Upgrade Path for Safety-Critical Aerospace Computing<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "Fujitsu establishes cyber defense lifecycle strategy for AI era", "source": "EE Journal", "date": "2026-08-31", "url": "https://www.eejournal.com/industry_news/fujitsu-establishes-cyber-defense-lifecycle-strategy-for-ai-era/", "summary": "Fujitsu Limited today announced the establishment of a cybersecurity strategy to continuously evolve corporate cyber defense capabilities in response to the advancement of generative AI and the increasing complexity of enterprise systems. This strategy implements cybersecurity not merely as an operational measure after IT system construction, but as a cyber defense lifecycle that encompasses strategic &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/fujitsu-establishes-cyber-defense-lifecycle-strategy-for-ai-era/\">Read More &#8594;<span class=\"screen-reader-text\"> \"Fujitsu establishes cyber defense lifecycle strategy for AI era\"<\/span><\/a>"}, {"title": "Syslogic Announces New AI-Enabled Embedded Computers", "source": "EE Journal", "date": "2026-08-31", "url": "https://www.eejournal.com/industry_news/syslogic-announces-new-ai-enabled-embedded-computers/", "summary": "With the Jetson Orin Nano 2, NVIDIA is introducing the second generation of its compact edge AI module. The new SoM (system-on-module) delivers twice the inference performance of its predecessor while consuming 40 percent less power at the same performance level. Embedded computing specialist Syslogic is announcing several rugged embedded computers based on the Jetson &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/syslogic-announces-new-ai-enabled-embedded-computers/\">Read More &#8594;<span class=\"screen-reader-text\"> \"Syslogic Announces New AI-Enabled Embedded Computers\"<\/span><\/a>"}, {"title": "Aetina Launches MegaEdge AIP-RQ87 2U Edge AI System for Private LLMs, AI Agents and Intelligent Automation", "source": "EE Journal", "date": "2026-08-31", "url": "https://www.eejournal.com/industry_news/aetina-launches-megaedge-aip-rq87-2u-edge-ai-system-for-private-llms-ai-agents-and-intelligent-automation/", "summary": "Aetina Corporation, a leading provider of edge AI solutions and accelerator of edge AI infrastructure, today announced the launch of MegaEdge AIP-RQ87, a ready-to-deploy 2U edge agentic AI system designed to help enterprises and system integrators (SIs) rapidly implement AI agent, private LLM, RAG application, multimodal AI, and AI-driven intelligent automation. Powered by Intel® Core™ &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/aetina-launches-megaedge-aip-rq87-2u-edge-ai-system-for-private-llms-ai-agents-and-intelligent-automation/\">Read More &#8594;<span class=\"screen-reader-text\"> \"Aetina Launches MegaEdge AIP-RQ87 2U Edge AI System for Private LLMs, AI Agents and Intelligent Automation\"<\/span><\/a>"}, {"title": "Renesas Establishes Physical AI & Robotics Lab in Beijing to Accelerate Next-Generation Robotics Innovation", "source": "EE Journal", "date": "2026-08-31", "url": "https://www.eejournal.com/industry_news/renesas-establishes-physical-ai-robotics-lab-in-beijing-to-accelerate-next-generation-robotics-innovation/", "summary": "Renesas Electronics Corporation (TSE: 6723), a premier supplier of advanced semiconductor solutions, today announced the official opening of its Physical AI &#38; Robotics Lab in Beijing, China. The new dedicated facility will enable customers to demonstrate, validate and jointly develop next-generation robotic systems and serve as a hub for executing Renesas’ physical AI strategy from proof-of-concept to deployment at scale. &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/renesas-establishes-physical-ai-robotics-lab-in-beijing-to-accelerate-next-generation-robotics-innovation/\">Read More &#8594;<span class=\"screen-reader-text\"> \"Renesas Establishes Physical AI &#038; Robotics Lab in Beijing to Accelerate Next-Generation Robotics Innovation\"<\/span><\/a>"}, {"title": "AIR Partners with Elmo Motion Control to Enhance Uncrewed Cargo Aircraft Platform", "source": "EE Journal", "date": "2026-08-31", "url": "https://www.eejournal.com/industry_news/air-partners-with-elmo-motion-control-to-enhance-uncrewed-cargo-aircraft-platform/", "summary": "AIR, the leading manufacturer and developer of Smart Aircraft, today announced a strategic partnership with Elmo Motion Control (Elmo), a global leader in motion control technology. Elmo will integrate high-performance motion control solution into AIR’s Heavy Lift UAS – a VTOL-capable uncrewed cargo aircraft capable of 550lb payloads. The partnership brings together Elmo’s compact, high-power density servo &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/air-partners-with-elmo-motion-control-to-enhance-uncrewed-cargo-aircraft-platform/\">Read More &#8594;<span class=\"screen-reader-text\"> \"AIR Partners with Elmo Motion Control to Enhance Uncrewed Cargo Aircraft Platform\"<\/span><\/a>"}, {"title": "Radxa Linkr – A USB drive-sized IP KVM with USB-C, Ethernet, and WiFi support", "source": "CNX Software", "date": "2026-08-30", "url": "https://www.cnx-software.com/2026/08/30/radxa-linkr-a-usb-drive-sized-ip-kvm-with-usb-c-ethernet-and-wifi-support/", "summary": "<div><img alt=\"Radxa Linkr IP KVM\" class=\"attachment-medium size-medium wp-post-image\" height=\"424\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/08/Radxa-Linkr-IP-KVM-720x424.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Radxa Linkr is a compact, USB flash drive-sized IP KVM that connects to the target through HDMI and USB for video, keyboard, and mouse emulation. The user can control it over USB-C, Ethernet, or WiFi client/access point, even before the OS is booted. The device does not require any specific apps, since all you need is a web browser. The company also highlights support for Tailscale VPN, two-factor authentication, and  AI agents such as OpenClaw and Hermes. Radxa Linkr specifications: SoC – Rockchip RV1106G3 CPU – Arm Cortex A7 @ 1.2GHz with an integrated RISC-V co-processor. NPU – 1 TOPS 4th-gen Rockchip NPU with hybrid quantization (int4, int8, int16) ISP – 3rd-gen 5MP high-performance ISP VPU – 3072×1728 (5MP) @ 30fps H.265/H.264 encoding, 16MP @ 60FPS JPEG snapshot System Memory –  256MB DDR3L on-chip memory Storage for OS and virtual media images Optional 16 GB eMMC flash MicroSD card slot Display Input &#8211; [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/08/30/radxa-linkr-a-usb-drive-sized-ip-kvm-with-usb-c-ethernet-and-wifi-support/\">Radxa Linkr &#8211; A USB drive-sized IP KVM with USB-C, Ethernet, and WiFi support<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "ACEMAGIC Kron Mini K5 (Core 3 304) review – Part 1: Specifications, unboxing, teardown, and first boot", "source": "CNX Software", "date": "2026-08-29", "url": "https://www.cnx-software.com/2026/08/29/acemagic-kron-mini-k5-core-3-304-review-part-1-specifications-unboxing-teardown-and-first-boot/", "summary": "<div><img alt=\"ACEMAGIC Kron Mini K5 Intel Core 3 304 unboxing review\" class=\"attachment-medium size-medium wp-post-image\" height=\"479\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/08/ACEMAGIC-Kron-Mini-K5-Intel-Core-3-304-unboxing-review-720x479.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>ACEMAGIC sent us a sample of the Kron Mini K5 Wildcat Lake mini PC for review. The computer is offered with either an Intel Core 3 304 or Core 5 320 CPU, and features triple display output, 2.5GbE and WiFi 6 networking, and several USB ports, but, interestingly, no Thunderbolt/USB4 ports. The company provided us with the entry-level variant pairing an Intel Core 3 304 penta-core processor with 12GB of RAM and 512GB of storage. In this first part of the review, we&#8217;ll list the mini PC&#8217;s specifications, go through an unboxing and a teardown, before booting it into Windows 11. In the next parts, we&#8217;ll review it using Windows 11 and Ubuntu 26.04 in depth with feature testing and benchmarks. ACEMAGIC Kron Mini K5 (Intel Core 3 304) specifications The company hasn&#8217;t put up a product page for this exact model just yet, so we gathered specifications from our [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/08/29/acemagic-kron-mini-k5-core-3-304-review-part-1-specifications-unboxing-teardown-and-first-boot/\">ACEMAGIC Kron Mini K5 (Core 3 304) review &#8211; Part 1: Specifications, unboxing, teardown, and first boot<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Fanless AMD Ryzen Embedded 8840U/8640U Edge AI Computer supports up to 256GB DDR5 SO-DIMM memory", "source": "CNX Software", "date": "2026-08-28", "url": "https://www.cnx-software.com/2026/08/28/fanless-amd-ryzen-embedded-8840u-8640u-edge-ai-computer-supports-up-to-256gb-ddr5-so-dimm-memory/", "summary": "<div><img alt=\"Fanless AMD Ryzen Embedded 8000 Edge AI computer\" class=\"attachment-medium size-medium wp-post-image\" height=\"433\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/08/Fanless-AMD-Ryzen-Embedded-8000-Edge-AI-computer-720x433.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>IBASE AA400-N is an &#8220;ultra-compact&#8221; fanless edge AI computer powered by an AMD Ryzen Embedded 8840U/8640U processor with up to 8 cores, 16 threads, and a combined 39 TOPS of AI performance for machine and robotic vision, autonomous inspection, smart retail, industrial automation, and other data-intensive, space-constrained applications. The most intriguing part of the specs and announcement is the claim of up to 256GB DDR5 capacity through two SO-DIMM modules, implying availability of 128GB DDR5 SO-DIMM memory modules. The system also comes with a 256GB M.2 NVMe SSD, features 8K-capable HDMI and DisplayPort video interfaces, two 2.5GbE jacks, M.2 sockets for optional WiFi, Bluetooth and 4G/5G cellular connectivity, a few USB ports and a COM port. &#160; IBASE AA400-N specifications: AMD Ryzen Embedded 8000 Series processors AA400-NM  – AMD Ryzen Embedded 8840U CPU – 8-core/16-thread Zen4 &#8220;Hawk Point&#8221; processor up to 3.3 GHz / 5.1 GHz (Turbo) GPU – AMD [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/08/28/fanless-amd-ryzen-embedded-8840u-8640u-edge-ai-computer-supports-up-to-256gb-ddr5-so-dimm-memory/\">Fanless AMD Ryzen Embedded 8840U/8640U Edge AI Computer supports up to 256GB DDR5 SO-DIMM memory<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Embedded Systems Runtime Observability, Sensor Fusion for Drones, Embedded Design for Mil/Aero: Embedded Week Insights", "source": "Embedded.com", "date": "2026-08-28", "url": "https://www.embedded.com/embedded-systems-runtime-observability-sensor-fusion-for-drones-embedded-design-for-mil-aero-embedded-week-insights/", "summary": "<p>Here's a roundup of this week's must-read articles. We cover the latest developments on why embedded teams require runtime observability, sensor fusion for drones, and embedded systems design for aerospace and defense. Also, check News Archives - Embed
