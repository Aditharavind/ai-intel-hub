image-media media-photo-credit\">Left: Wei Zhiyang/Zhejiang Daily Press Group/VCG/Getty Images; Right: VCG/Getty Images<\/small><\/p><p>However, the Lightning is not as well-suited to other tasks as a robot designed for greater versatility. Engineering is always characterized by trade-offs, and making the correct ones separates good products from great ones. With consistently improving AI language models, this very human skill is becoming the most valuable one an engineer can have.<\/p><p>The news coverage seemed to overly focus on the fact that the human half-marathon record had been broken by a robot. Machines and humans have very different capabilities and constraints, so why should we ever have expected the half-marathon time for a robot and human to be related? As in <a href=\"https://en.wikipedia.org/wiki/Deep_Blue_versus_Garry_Kasparov\" target=\"_blank\">Deep Blue’s 1997 defeat of Garry Kasparov in chess<\/a>, where it couldn’t physically move the pieces, the Honor robot’s capabilities are much narrower than a human running elbow to elbow with other runners while visually navigating the course without GPS. Comparing the robot runner to a human runner is just an apples-to-oranges comparison, which only risks diminishing Honor’s engineering achievement on one hand and human athletic achievement on the other.<\/p>"}, {"title": "Sanctuary AI validates physical AI performance at Tier 1 automotive supplier", "source": "Robotics Business Review", "date": "2026-06-17", "url": "https://www.therobotreport.com/sanctuary-ai-validates-physical-ai-performance-tier-1-automotive-supplier/", "summary": "<p>Sanctuary AI is not waiting for humanoid robots; it's applying physical AI to demonstrate production-ready performance.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/sanctuary-ai-validates-physical-ai-performance-tier-1-automotive-supplier/\">Sanctuary AI validates physical AI performance at Tier 1 automotive supplier<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Evaluating humanoids for surface finishing applications", "source": "Robotics Business Review", "date": "2026-06-17", "url": "https://www.therobotreport.com/evaluating-humanoids-for-surface-finishing-applications/", "summary": "<p>Most manufacturing applications aim to reduce cycle time to improve throughput. Using general-purpose industrial robots that transcend human constraints is often an attractive option.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/evaluating-humanoids-for-surface-finishing-applications/\">Evaluating humanoids for surface finishing applications<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Fennec Engineering earns T2 qualification for Advanced Safety Acceleration Platform", "source": "Robotics Business Review", "date": "2026-06-17", "url": "https://www.therobotreport.com/fennec-engineering-earns-t2-qualification-advanced-safety-acceleration-platform/", "summary": "<p>Fennec Engineering has obtained certification confirming that its automated traceability platform meets strict safety standards.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/fennec-engineering-earns-t2-qualification-advanced-safety-acceleration-platform/\">Fennec Engineering earns T2 qualification for Advanced Safety Acceleration Platform<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Autonomique deploys semi-humanoid robots and AI at Canadian Tier 1", "source": "Robotics Business Review", "date": "2026-06-17", "url": "https://www.therobotreport.com/autonomique-deploys-semi-humanoid-robots-canadian-tier-1/", "summary": "<p>Autonomique has moved its AI-powered robots from pilot to production at F&#038;P Mfg., with plans for deployment across F-tech's global network.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/autonomique-deploys-semi-humanoid-robots-canadian-tier-1/\">Autonomique deploys semi-humanoid robots and AI at Canadian Tier 1<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "PSYONIC partners with ABB Robotics to apply human touch to robot dexterity", "source": "Robotics Business Review", "date": "2026-06-16", "url": "https://www.therobotreport.com/psyonic-abb-robotics-partner-apply-human-touch-data-robot-dexterity/", "summary": "<p>PSYONIC is combining its Ability Hand with ABB Robotics' GoFa cobot arm to apply data from prosthetics users to robotic grasping.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/psyonic-abb-robotics-partner-apply-human-touch-data-robot-dexterity/\">PSYONIC partners with ABB Robotics to apply human touch to robot dexterity<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Built Robotics, Penn xLAB to develop physical AI for construction", "source": "Robotics Business Review", "date": "2026-06-16", "url": "https://www.therobotreport.com/xlab-and-built-robotics-partner-to-advance-construction/", "summary": "<p>xLAB and Built Robotics partner to capture additional data, advancing AI models to improve construction site safety.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/xlab-and-built-robotics-partner-to-advance-construction/\">Built Robotics, Penn xLAB to develop physical AI for construction<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Kawasaki Robotics to debut RL030N physical AI platform at Automate", "source": "Robotics Business Review", "date": "2026-06-16", "url": "https://www.therobotreport.com/kawasaki-robotics-debut-rl030n-physical-ai-platform-automate/", "summary": "<p>Kawasaki Robotics says its 8-DoF robot, Pulseboard inspection tech, and other systems will show its vision for intelligent automation.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/kawasaki-robotics-debut-rl030n-physical-ai-platform-automate/\">Kawasaki Robotics to debut RL030N physical AI platform at Automate<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Genesis AI launches Eno general-purpose robot", "source": "Robotics Business Review", "date": "2026-06-16", "url": "https://www.therobotreport.com/genesis-ai-launches-eno-general-purpose-robot/", "summary": "<p>Genesis plans to begin Eno’s production and targeted customer deployments by the end of 2026, with home deployments coming later. <\/p>\n<p>The post <a href=\"https://www.therobotreport.com/genesis-ai-launches-eno-general-purpose-robot/\">Genesis AI launches Eno general-purpose robot<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Pegasus Tech Ventures launches $60M fund for physical AI startups", "source": "Robotics Business Review", "date": "2026-06-16", "url": "https://www.therobotreport.com/pegasus-tech-ventures-launches-60m-fund-physical-ai-startups/", "summary": "<p>Pegasus and CYBERDYNE will invest in startups developing robotics, physical AI, healthcare, automation, and intelligent systems.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/pegasus-tech-ventures-launches-60m-fund-physical-ai-startups/\">Pegasus Tech Ventures launches $60M fund for physical AI startups<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Burro introduces Grande 44 with proven outdoor autonomy built for heavy industry", "source": "Robotics Business Review", "date": "2026-06-15", "url": "https://www.therobotreport.com/burro-introduces-grande-44-with-proven-outdoor-autonomy-built-for-heavy-industry/", "summary": "<p>The 44 hp Burro Grande brings more than 1 million hours of real-world experience to industrial towing, site logistics, and facilities operations.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/burro-introduces-grande-44-with-proven-outdoor-autonomy-built-for-heavy-industry/\">Burro introduces Grande 44 with proven outdoor autonomy built for heavy industry<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Autonomous freight developer Einride goes public via SPAC", "source": "Robotics Business Review", "date": "2026-06-15", "url": "https://www.therobotreport.com/autonomous-freight-developer-einride-goes-public-via-spac/", "summary": "<p>Stockholm-based Einride operates a fleet of heavy-duty electric trucks servicing Global Fortune 500 companies across the U.S. and Europe.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/autonomous-freight-developer-einride-goes-public-via-spac/\">Autonomous freight developer Einride goes public via SPAC<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Modernizing the global economy with industrial robotics is needed but not inevitable", "source": "Robotics Business Review", "date": "2026-06-14", "url": "https://www.therobotreport.com/modernizing-global-economy-industrial-robotics-needed-not-inevitable/", "summary": "<p>While service robotics adoption grows, industrial automation faces greater demand and bigger obstacles, notes a columnist.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/modernizing-global-economy-industrial-robotics-needed-not-inevitable/\">Modernizing the global economy with industrial robotics is needed but not inevitable<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Visual Language Models Train Robots to Read Human Emotions", "source": "IEEE Spectrum Robotics", "date": "2026-06-13", "url": "https://spectrum.ieee.org/robot-emotions-visual-language-models", "summary": "<img src=\"https://spectrum.ieee.org/media-library/illustration-of-a-shoulders-up-human-silhouette-with-facial-attributes-vaguely-outlined-by-recognition-points.jpg?id=66888123&amp;width=1245&amp;height=700&amp;coordinates=0%2C187%2C0%2C188\" /><br /><br /><p>\n<em>This article is part of our exclusive <a href=\"https://spectrum.ieee.org/collections/journal-watch/\" target=\"_blank\">IEEE Journal Watch series<\/a> in partnership with IEEE Xplore.<\/em>\n<\/p><p>As robots advance in terms of <a href=\"https://spectrum.ieee.org/gemini-robotics\" target=\"_blank\">dexterity and other physical capabilities<\/a>, it becomes more likely that humans may find themselves working alongside them. If that happens, how will robots’ emotional capabilities need to advance for them to successfully work with people?<\/p><p>In a recent study, researchers trained <a href=\"https://spectrum.ieee.org/rethink-robotics-pioneer-of-collaborative-robots-shuts-down\" target=\"_blank\">collaborative robots<\/a> to read human emotions by not only accounting for facial expressions, but also contextual factors in the interactions as well. Through experiments with 40 volunteers, the researchers then evaluated how a robot’s ability to read human emotions and adjust its behavior in turn impacted a human’s perception of the robot and its capabilities as the two collaborated on tasks. The <a href=\"https://ieeexplore.ieee.org/document/11523497\" rel=\"noopener noreferrer\" target=\"_blank\">results<\/a>—which show that the emotional capabilities of robots only go so far with humans—were published 18 May in<a href=\"https://ieeexplore.ieee.org/xpl/RecentIssue.jsp?punumber=7083369\" rel=\"noopener noreferrer\" target=\"_blank\"> <em><em>IEEE Robotics and Automation Letters<\/em><\/em><\/a>.<\/p><p><a href=\"https://ieeexplore.ieee.org/author/771486883095543\" rel=\"noopener noreferrer\" target=\"_blank\">Seung Chan Hong<\/a> led the study as part of his undergraduate thesis while studying at Monash University, in Melbourne, Australia. He notes that, while there has been a lot of hype in the advancing physical abilities of robots, this is only one piece of the puzzle. “We need to also innovate when it comes to them actually interacting with humans, not just their physical capabilities,” he says.<\/p><p>This prompted him to dig deeper into the emotional aspects of human-robot interactions. First, Hong and his co-authors decided to train a robot to read human emotions using a vision language model (VLM), which is similar to large language models (LLMs) such as ChatGPT, but which can also take visual inputs.<\/p><h2>Training VLMs for Human Emotion Recognition<\/h2><p>To evaluate their VLM, which used Gemini 2.5, the researchers had volunteers watch videos of robots handing over objects to humans—with varying degrees of success—and describe the emotions the humans were expressing. Importantly, the volunteers labeling these videos were able to take into account more context in these interactions, rather than reporting solely on the facial expressions of the humans in the video. For example, a person pausing to think with a furrowed brow may simply be concentrating on their task at hand and not necessarily be angry. Contextual factors such as drumming their fingers, pursing their lips, or other behaviors can point to the real cause of a person’s furrowed brow.<\/p><p>The researchers then compared their VLM to a conventional AI system that relies on standard facial analysis and object tracking that is used in human-robot interactions. They found that the VLM outperformed the traditional approach. On a scale from 0 (no similarity in meaning to the emotion identified by the human volunteers) to 1 (a perfect match in meaning), the conventional AI system achieved a score of 0.77. In comparison, the VLM achieved a score of 0.86.<\/p><p>Hong says, “I think [the VLM] was able to align with what human observers were seeing a lot better, because it wasn’t just looking at the person’s face for a brief amount of time, but seeing the whole scene—where the person was and what they were doing, and how they were interacting with the robot.”<\/p><p>In a second experiment, the research team asked 40 volunteers to interact with a robot using their VLM—but purposefully programmed the robot to make an error. The robot then had to offer either an emotionally adaptive apology that accounted for the human’s perceived response to the mistake or a pre-scripted spoken apology.<\/p><p>Participants overwhelmingly preferred the emotionally adaptive response, with 31 out of 40 people favoring this approach over a boilerplate apology.<\/p><p>However, their survey responses underscored how this emotional adaptivity was far less important than the robot’s functionality. After collaborating with a robot that failed in its task, many participants ranked their trust in the robot as lower, regardless of how it apologized for its mistake. “A personalized apology acts as a social lubricant, but it cannot repair the trust lost by the robot failing its physical task,” Hong says.<\/p><p>Interestingly, the VLM classified the emotions of its human partners similarly to human volunteers who observed an interaction from a third-party perspective. But when the VLM’s assessments were measured against humans’ self-reported emotions during the second experiment—the most accurate descriptions of their true emotions—its ability to accurately predict emotions dropped significantly.<\/p><p>“While the VLM is a good observer of outward social cues, it isn’t a mind reader,” Hong says. “It matched third-person human observers well, but it didn’t always align with the users‘ internal, self-reported feelings.”<\/p><p>Together, these results show that robots are not perfect at reading human emotions. So while people might appreciate their efforts, they still ultimately will want competent co-workers.<\/p><p><em>This story was updated on 15 June 2026 to correct where the research was conducted and clarify that the researchers evaluated the performance of a pre-trained model. <\/em><br /><\/p>"}, {"title": "Windows for robots: Edge AI expands usability", "source": "Robotics Business Review", "date": "2026-06-13", "url": "https://www.therobotreport.com/computers-software-windows-utility-robots/", "summary": "<p>Before Windows, only engineers and computer scientists could work with computers. Edge AI is causing a similar accessibility shift for robotics.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/computers-software-windows-utility-robots/\">Windows for robots: Edge AI expands usability<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Example: Robotics deployment update", "source": "Example Robotics", "date": "2026-06-12", "url": "https://example.com/robotics-news", "summary": "Example robotics seed item."}, {"title": "Award-Winning Researcher Trains Robots to Make Educated Guesses", "source": "IEEE Spectrum Robotics", "date": "2026-06-12", "url": "https://spectrum.ieee.org/researcher-trains-robots-to-guess", "summary": "<img src=\"https://spectrum.ieee.org/media-library/a-young-asian-professor-monitors-her-student-as-they-control-a-robotic-gripper.jpg?id=66879067&amp;width=1245&amp;height=700&amp;coordinates=0%2C469%2C0%2C469\" /><br /><br /><p><a href=\"https://yenlingkuo.com\" rel=\"noopener noreferrer\" target=\"_blank\">Yen-Ling Kuo<\/a> always wanted to understand how things worked. When she was growing up in Taiwan, reading the story of <a href=\"https://ethw.org/Michael_Faraday\" rel=\"noopener noreferrer\" target=\"_blank\">Michael Faraday<\/a> in elementary school piqued her curiosity about the natural world. During that time, she was introduced to <a href=\"https://en.wikipedia.org/wiki/Logo_(programming_language)\" rel=\"noopener noreferrer\" target=\"_blank\">Logo<\/a>, a computer program with a turtle cursor to help children learn basic coding through hands-on experimentation.<\/p><p>It was Kuo’s introduction to programming logic.<\/p><h3>Yen-Ling Kuo<\/h3><br /><p><strong>Employer<\/strong><\/p><p>University of Virginia in Charlottesville<\/p><p><strong>Title<\/strong><\/p><p>Assistant professor of computer science <\/p><p><strong>Member grade<\/strong><\/p><p>Member<\/p><p><strong>Alma maters<\/strong><\/p><p>National Taiwan University; MIT<\/p><p>In high school she learned the capacity computers held. She could write programs that completed tasks independently, she realized.<\/p><p>“Once I discovered how powerful computers could be,” she says, “I knew I wanted to focus on using them to solve real-world problems.”<\/p><p>Kuo, an IEEE member, never lost her interest in the “how” behind processes and tools. Her curiosity, combined with a stint working at a Silicon Valley company, led her to focus on innovations that live at the intersection of cognitive and computer sciences. <\/p><p>Kuo, now an <a href=\"https://engineering.virginia.edu/faculty/yen-ling-kuo\" rel=\"noopener noreferrer\" target=\"_blank\">assistant professor<\/a> of computer science at the <a href=\"https://www.virginia.edu/\" rel=\"noopener noreferrer\" target=\"_blank\">University of Virginia<\/a> in Charlottesville, last year received the <a href=\"https://www.ieee-ras.org\" rel=\"noopener noreferrer\" target=\"_blank\">IEEE Robotics and Automation Society<\/a>’s inaugural <a href=\"https://engineering.virginia.edu/news-events/news/more-honors-computer-scientist-wins-2025-wira-early-career-contribution-award\" rel=\"noopener noreferrer\" target=\"_blank\">Outstanding Women in Robotics and Automation Early Career Contribution Award<\/a>. The award is part of the <a href=\"https://www.ieee-ras.org/wira-paper-awards-icra25/\" rel=\"noopener noreferrer\" target=\"_blank\">IEEE-RAS Women in Engineering’s Outstanding Women in Robotics and Automation (WiRA) Paper Awards<\/a>, which promote excellence and recognize the impact that female researchers have on robotics and automation fields at different stages in their academic careers.<\/p><p>Kuo’s winning paper, “<a href=\"https://diffdagger.github.io/\" rel=\"noopener noreferrer\" target=\"_blank\">Diff-DAgger: Uncertainty Estimation with Diffusion Policy for Robotic Manipulation<\/a>,” demonstrates a novel method to help robots better identify and estimate uncertainty when faced with scenarios on which they’ve not been trained. The method reduces the amount of human supervision, improves a robot’s rate of successful task completion, and opens up a path to introduce more complex models with bigger data demands into interactive robot learning.<\/p><p>She says her research will help people working in the robotics and automation fields more efficiently collect the data needed for effective model training.<\/p><h2>Silicon Valley’s impact<\/h2><p>Kuo earned bachelor’s and master’s degrees in computer science at the <a href=\"https://www.ntu.edu.tw/english/\" rel=\"noopener noreferrer\" target=\"_blank\">National Taiwan University<\/a>, in Taipei, in 2009 and 2012. As she was nearing completion of her master’s degree, she did what many computer science graduates do: She pursued a summer internship at a tech company.<\/p><p>She spent the summer of 2011 at Google’s campus in Kirkland, Wash., working on the company’s <a href=\"https://adwords.googleblog.com/2011/05/comparison-ads-now-part-of-new-google.html\" rel=\"noopener noreferrer\" target=\"_blank\">comparison ads project<\/a>.<\/p><p>When her internship ended, she joined the <a href=\"https://www.media.mit.edu\" rel=\"noopener noreferrer\" target=\"_blank\">MIT Media Lab<\/a> as a visiting student, working on the <a href=\"https://en.wikipedia.org/wiki/Open_Mind_Common_Sense\" rel=\"noopener noreferrer\" target=\"_blank\">Open Mind Common Sense project<\/a> with <a href=\"https://web.media.mit.edu/~lieber/\" rel=\"noopener noreferrer\" target=\"_blank\">Henry Lieberman<\/a>.<\/p><p>As she was considering pursuing a Ph.D., a call from Google changed her plans. The company offered her a full-time role as a software engineer.<\/p><p>“I viewed the job offer as a positive development,” she says. “I believe it can never hurt your future research career to get some real-world experience under your belt.”<\/p><p>She was hired in 2012 and helped build techniques that incorporate computer vision and natural language processing to improve the customer shopping search experience. She led the company’s <a href=\"https://techcrunch.com/2016/09/06/google-is-launching-shop-the-look-to-let-you-search-and-shop-by-outfit/\" rel=\"noopener noreferrer\" target=\"_blank\">Shop the Look initiative<\/a>, a predecessor to Google’s current <a href=\"https://blog.google/products-and-platforms/products/shopping/google-shopping-ai-mode-virtual-try-on-update/\" rel=\"noopener noreferrer\" target=\"_blank\">AI-powered shopping experience<\/a>. The project connected social media content with search results, something the company had struggled to do in the past.<\/p><p>Kuo and her team were tasked with building a connection between the natural language people use to describe an item and an image that matches the searcher’s intent. It was at a time when the <a href=\"https://spectrum.ieee.org/tag/neural-network\" target=\"_self\">neural network<\/a>—using deep learning models to power Google products—was gaining momentum at the company. Integrating neural network tools into her work was a requirement—which raised questions for Kuo.<\/p><p>“I was applying the neural network tools,” she says. “But I didn’t have 100 percent certainty about how they actually worked.”<\/p><p>She considered how she could become more knowledgeable about deep learning models. It was a full-circle moment. She decided that after nearly four years at Google, it was time to earn a Ph.D. in computer science. She returned to MIT in 2016.<\/p><h2>The question that changed everything<\/h2><p><a href=\"https://people.csail.mit.edu/boris/boris.html\" rel=\"noopener noreferrer\" target=\"_blank\">Boris Katz<\/a>, one of Kuo’s Ph.D. advisors, is a principal research scientist and the head of the MIT <a href=\"https://www.csail.mit.edu\" rel=\"noopener noreferrer\" target=\"_blank\">Computer Science and Artificial Intelligence Laboratory<\/a> (CSAIL)’s <a href=\"https://www.csail.mit.edu/research/infolab\" rel=\"noopener noreferrer\" target=\"_blank\">InfoLab<\/a>. He also led the creation of the <a href=\"https://start.csail.mit.edu/index.php\" rel=\"noopener noreferrer\" target=\"_blank\">START Natural Language System<\/a>, the world’s first Web-based question-answering system.<\/p><p>When the two met, Katz asked Kuo why she wanted to pursue a doctorate degree. She explained her interest in understanding how neural networks work and in using that knowledge to connect the physical world with human language.<\/p><p>He suggested she attend a <a href=\"https://bmm.mit.edu/\" rel=\"noopener noreferrer\" target=\"_blank\">summer course<\/a> at MIT’s <a href=\"https://cbmm.mit.edu\" rel=\"noopener noreferrer\" target=\"_blank\">Center for Brains, Minds, and Machines<\/a>, a research initiative that <a href=\"https://sqi.mit.edu/research/cbmm\" rel=\"noopener noreferrer\" target=\"_blank\">ran from 2013 through 2025<\/a>. CBMM’s objective was to bring together computer scientists, cognitive scientists, and neuroscientists to understand how human intelligence works. The goal was to use the resulting insights to establish an engineering practice to build artificial intelligence systems.<\/p><p>For Kuo, it was a chance to better understand human intelligence and identify ways it could be replicated in machines.<\/p><p>“It was an opportunity for me to interact with other scientists and gain insight into how people learn, understand, and figure things out in the world,” she says. “I saw it as a very useful and inspiring way to incorporate those ideas into my own research work.”<\/p><p>During her Ph.D. studies, she was a research assistant at CSAIL. The experience helped shape her doctoral research, which focused on building AI systems that apply past learning to new situations. She developed machine learning models to support the efforts, including language understanding and social interactions.<\/p><p>She completed her Ph.D. in computer science in 2022 with a minor in cognitive science.<\/p><p>After graduation, she continued her work and collaboration at CSAIL, particularly on projects that involved the “theory of mind” concept.<\/p><h2>Theory of mind spurs innovation<\/h2><p>Theory of mind isn’t new, having originated with <a href=\"https://www.cambridge.org/core/journals/behavioral-and-brain-sciences/article/does-the-chimpanzee-have-a-theory-of-mind/1E96B02CD9850016B7C93BC6D2FEF1D0\" rel=\"noopener noreferrer\" target=\"_blank\">primatologists studying chimpanzees<\/a> in the late 1970s. The theory recognizes that others have their own thoughts, beliefs, and perspectives. It’s a skill that allows humans to infer someone’s mental state and predict their behavior without verbal communication.<\/p><p>“It’s like when college roommates are moving into their dorm. They may not talk too much, but they work together naturally to coordinate their activities and accomplish goals,” Kuo says. “They can infer and mentally interpret each other’s behaviors and signals to make decisions and complete tasks without words.”<\/p><p>She brought her theory of mind research to the University of Virginia when she joined as an assistant professor in 2023.<\/p><p>Kuo conducts her research in UVA Engineering’s multidisciplinary cyberphysical <a href=\"https://engineering.virginia.edu/labs-groups/link-lab\" rel=\"noopener noreferrer\" target=\"_blank\">Link Lab<\/a>. Her broad focus is on developing computational models that help robots interpret both direct data and silent signals, from language and movements to a person’s gaze. If successful, it could give robots the same sort of physical and theory of mind reasoning capabilities that power physical and social interactions among humans.<\/p><p>“There are no computational frameworks yet available that will translate this kind of understanding into a robot efficiently,” she says.<\/p><p>She adds that the process to get there begins with improving how robots learn to perform tasks.<\/p><h2>The evolution of robot learning<\/h2><p>Historically, one way robots learned was to mimic humans. A researcher would manually guide a robot through a task, like cutting an apple, and it would repeat the movements. The robot was successful until the environment changed, such as when its hand was in a different position or the apple was at a different angle. The robot was then faced with a situation for which it hadn’t been trained. Without any data available to help it correct course, the robot would start making small errors that eventually led to a full system crash.<\/p><p class=\"shortcode-media shortcode-media-rebelmouse-image\"> <img alt=\"Diagram of a robotic gripper delicately holding a potato chip. Labels describe how the gripper\\u2019s visual perception and tactile sensing prevent the chip from breaking.\" class=\"rm-shortcode\" id=\"bfe1e\" src=\"https://spectrum.ieee.org/media-library/diagram-of-a-robotic-gripper-delicately-holding-a-potato-chip-labels-describe-how-the-gripper-u2019s-visual-perception-and-tact.jpg?id=66879111&amp;width=980\" /> <small class=\"image-media media-caption\">This diagram describes how the robotic gripper’s visual perception and tactile sensing prevents a potato chip from breaking.<\/small><small class=\"image-media media-photo-credit\"><a href=\"https://force-gripper.github.io/\" target=\"_blank\">Xuhui Kang, Yen-Ling Kuo, et al.<\/a><\/small><\/p><p>To solve the problem, researchers developed the dataset aggregation (DAgger) method. As a robot performed a task, a researcher was on standby to provide real-time corrections during unexpected scenarios. The correction data was continuously added to the robot’s model, teaching it how to recover from mistakes.<\/p><p>To reduce the human monitoring effort, robot-gated DAgger was created to enable bots to query humans when the machines became uncertain.<\/p><p>The most popular approach to make the query decision is to train multiple models to consider when determining a course of action. If the models all agree, the robot proceeds. If they don’t agree, the robot is likely to get stuck and ask for help.<\/p><p>Although the multiple model approach was widely adopted, it has limitations. Practically speaking, as models become more complex, it is hard or impossible to train multiple copies. A more fundamental issue is that disagreement among models doesn’t always imply uncertainty; it could just mean there are different ways to accomplish a task.<\/p><h2>The Diff-DAgger solution<\/h2><p>That is the gap Kuo’s research team closed with the novel Diff-DAgger research. The approach builds on diffusion policy, a technique that helps robots account for different ways a task can be performed.<\/p><p>The new method repurposes diffusion loss, the signal a robot uses to improve its model during training, as a real-time confidence check. During task execution, the robot computes the signal and compares it against values from its training data using a statistical test. The signal spikes when the robot faces an unfamiliar situation and is uncertain how to proceed. The signal stays silent when the robot’s current action is close to what it learned before.<\/p><p>The spike represents the robot’s ability to self-diagnose and predict an imminent failure. Human intervention is triggered only when the signal spikes. No spike means the robot can be left to complete its decision-making process on its own.<\/p><p>Kuo’s team achieved <a href=\"https://diffdagger.github.io\" target=\"_blank\">significant results<\/a>: Failure prediction rates were improved by 39 percent. Task completion rates were increased by 20 percent, and tasks were completed nearly eight times faster.<\/p><p>Her research at UVA gained attention from the <a href=\"https://www.nsf.gov\" rel=\"noopener noreferrer\" target=\"_blank\">National Science Foundation<\/a>, which honored her last year with a <a href=\"https://www.nsf.gov/funding/opportunities/career-faculty-early-career-development-program\" rel=\"noopener noreferrer\" target=\"_blank\">Career Award<\/a>, the foundation’s flagship grant for early-career researchers. The five-year US $665,000 grant supports her research that builds computational models for human-robot interactions through theory of mind reasoning.<\/p><p>She also received the Toyota Research Institute’s <a href=\"https://engineering.virginia.edu/news-events/news/uva-and-toyota-research-institute-aim-give-your-car-power-reason\" rel=\"noopener noreferrer\" target=\"_blank\">Young Faculty Researcher Award<\/a> to teach cars to reason about interactions on the road and with the driver.<\/p><p>As service robots and self-driving vehicles become more available, such works are likely to make interactions between humans and robots more intuitive and useful.<\/p><p>Kuo ultimately wants to build more robust robots that are able to integrate into a social space with humans by engaging with us through grounded interactions, she says.<\/p><h2>The impact of IEEE<\/h2><p>Like many IEEE members, Kuo was introduced to the organization as a student. In 2018 she submitted her first paper, “<a href=\"https://arxiv.org/abs/1810.00804\" rel=\"noopener noreferrer\" target=\"_blank\">Deep Sequential Models for Sampling-Based Planning<\/a>,” to the <a href=\"https://www.ieee-ras.org/conferences-workshops/financially-co-sponsored/iros/\" rel=\"noopener noreferrer\" target=\"_blank\">IEEE/Robotics Society of Japan International Conference on Intelligent Robots and Systems<\/a> while pursuing her Ph.D. at MIT. Her IEEE involvement grew alongside her professional career.<\/p><p>“It was a natural segue to transition from student to a full IEEE member,” she says. Today she is an active volunteer with the IEEE Robotics and Automation Society, a reviewer for submitted papers, and a presenter and panelist at conferences.<\/p><p>She says one of the best parts of attending conferences is having the opportunity to engage with students. She also enjoys participating as a panelist at luncheons, she says, because it gives her one-on-one time with student attendees. She can share her knowledge and offer insights as they prepare to embark on their career.<\/p><p>Her goal in the coming years, she says, is to broaden her involvement with IEEE initiatives and branch out to other technical committees. Sharing knowledge and learning from others is essential to anyone’s <a href=\"https://spectrum.ieee.org/influence-your-career\" target=\"_blank\">career growth<\/a>, she says, and “IEEE offers a great opportunity for both.”<\/p>"}, {"title": "Video Friday: Robotic Motion Discovery Reveals Unusual Behaviors", "source": "IEEE Spectrum Robotics", "date": "2026-06-12", "url": "https://spectrum.ieee.org/video-friday-humanoid-loco-manipulation", "summary": "<img src=\"https://spectrum.ieee.org/media-library/humanoid-robot-picks-up-a-box-and-climbs-onto-a-table-in-a-modern-lab-workspace.gif?id=66901035&amp;width=1245&amp;height=700&amp;coordinates=0%2C116%2C0%2C116\" /><br /><br /><p><span>Video Friday is your weekly selection of awesome robotics videos, collected by your friends at <\/span><em>IEEE Spectrum<\/em><span> robotics. We also post a weekly calendar of upcoming robotics events for the next few months. Please <\/span><a href=\"mailto:automaton@ieee.org?subject=Robotics%20event%20suggestion%20for%20Video%20Friday\">send us your events<\/a><span> for inclusion.<\/span><\/p><h5><a href=\"https://roboticsconference.org/\">RSS 2026<\/a>: 13–17 July 2026, SYDNEY<\/h5><h5><a href=\"https://mrs.fel.cvut.cz/summer-school-2026/\">Summer School on Multi-Robot Systems<\/a>: 29 July–4 August 2026, PRAGUE<\/h5><h5><a href=\"https://actuate.foxglove.dev/\">Actuate 2026<\/a>: 18–19 August 2026, SAN FRANCISCO<\/h5><p>Enjoy today’s videos!<\/p><div class=\"horizontal-rule\"><\/div><div><span style=\"display: none;\"> <\/span><\/div><blockquote class=\"rm-anchors\" id=\"dhivz34qylw\"><em>We present MotionDisco, a framework that discovers contact-rich, long-horizon humanoid <a href=\"https://spectrum.ieee.org/video-friday-locoman\" target=\"_blank\">loco-manipulation<\/a> motions from scratch, without relying on teleoperation or motion retargeting from human demonstrations.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>Some of the discovered behaviors are a little nutso:<\/p><p class=\"shortcode-media shortcode-media-youtube\"> <span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://atarilab.github.io/motiondisco.io/\">MotionDisco<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"_21bfsgtm0s\">Not sure I’d say any of this is ‘effortless’ but those <a href=\"https://spectrum.ieee.org/video-friday-mit-hermes-drone-claw-bb8-droid\" target=\"_blank\">claws<\/a> are pretty cute.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.deeprobotics.cn/en\">Deep Robotics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"std5wteoa50\"><em>It turns out running a workout class is a decent way to stress-test <a href=\"https://spectrum.ieee.org/video-humanoid-dancing\" target=\"_blank\">whole-body range of motion<\/a>. Coordinating fluid movement across every joint at once—timing, velocity, balance compensation—is one of the harder control problems in humanoid robotics.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.agilityrobotics.com/\">Agility<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"htrfgxjojrs\">Our very own Gwendolyn Rak made a robotic shoulder-friend at Computer Human Interaction in Barcelona.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>Here’s a bit more about it:<\/p><p class=\"shortcode-media shortcode-media-youtube\"> <span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.media.mit.edu/projects/the-stochastic-parrot/overview/\">MIT<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"v2txavmrsyo\"><em>At AIRoA, we’re bringing <a href=\"https://spectrum.ieee.org/domestic-humanoid-robot-safety-standards\" target=\"_blank\">robots into real homes<\/a>. Check out our exclusive first video to see how they work in our development hub and real-life household settings! The project aims to develop home robots that can assist people with everyday tasks and become long-term companions in daily life. In this video, we demonstrate Toyota’s Human Support Robot (HSR) deployed in real homes, where it assists residents with everyday tasks such as tidying rooms and fetching objects.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.airoa.org/\">AI Robot Association<\/a> ]<\/p><p>Thanks, Naoaki!<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"ntvtrlsyhji\"><em>MIDAS Hand is a fully open-source, tactile-sensor-integrated <a href=\"https://spectrum.ieee.org/video-friday-robotic-hand-dexterity\" target=\"_blank\">dexterous robotic hand<\/a> platform for manipulation, teleoperation, and robot learning research. MIDAS stands for Modular low-Impedance Direct-drive Anthropomorphic Sensing Hand.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://midas-hand.com/\">MIDAS Hand<\/a> ]<\/p><p>Thanks, Jun Kim!<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"vofmkd0asrq\"><em>This video presents a novel flight maneuver for a flying bipedal robot. During forward flight, the robot performs aerial braking by swinging its legs to adjust the orientation of foot-mounted thrusters.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.sciencedirect.com/science/article/abs/pii/S0921889026001983\">Paper<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"z5nf8nz_zyi\">Seems like a really good application for autonomy, to be honest.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.builtrobotics.com/\">Built Robotics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"t9ygyxgfxlm\"><em>In this time-lapse, controllers on the ground are repositioning <a href=\"https://spectrum.ieee.org/dextre-robot-repairs-iss-while-astronauts-sleep\" target=\"_blank\">Dextre<\/a>, our robotic handyman currently installed at the end of the Canadarm2. They used Dextre to unload equipment from the unpressurised Dragon trunk. Such a beautiful choreography to watch with Earth in the background!<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.esa.int/ESA_Multimedia/Images/2008/04/The_Canadian_Special_Purpose_Dextrous_Manipulator_Dextre_installed_on_exterior_of_ISS\">European Space Agency<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"nel2bmgcfjs\"><em>This video demonstrates how AI Sapiens learns and performs humanoid motions from video-based motion capture using only a smartphone camera, without professional motion capture equipment. ROBOTIS plans to release an open-source motion generation and learning pipeline for AI Sapiens, enabling users to generate humanoid motions from video and bring them to the real robot.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://ai.robotis.com/\">ROBOTIS<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"utwezllzulk\">NAO LIVES!<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://maxtronics.com/en/nao6/\">Maxtronics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"thfs0xlallu\"><em>Tumblenauts are a swarm of minimalist, bacteria-inspired robots designed for collaborative inspection of pressurized microgravity habitats such as the International Space Station. Unlike current intra-vehicular robots that rely on complex actuator-dense mechanisms for precise motion, the Tumblenauts use a stochastic run-and-tumble locomotion and collective cooperation inspired by bacterial colonies.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://ssr.princeton.edu/\">Self-Organizing Swarms and Robotics Lab<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"_xbeim3jfoc\"><em>LUMOS Robotics Founder and CEO Yu Chao officially introduces Project EDGE—inviting global builders, universities, robotics labs, and creative technologists to explore the future of humanoid robotics together. To supercharge the global developer community, we are providing 100 complimentary LUMOS NIX robots to selected global partners.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.lumosbot.tech/project-edge/index.html\">Lumos Robotics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"oishy9bus7m\"><em>How do you progress from early childhood computational thinking to advanced high school robotics? Sphero’s product offerings are intentionally scaffolded to scale for students by building critical skills and concepts at every grade level.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://sphero.com/\">Sphero<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div>"}, {"title": "Gatik to bring autonomous freight to PepsiCo’s North American supply chain", "source": "Robotics Business Review", "date": "2026-06-12", "url": "https://www.therobotreport.com/gatik-brings-autonomous-freight-pepsico-north-american-supply-chain/", "summary": "<p>The partnership focuses on PepsiCo’s regional transportation networks, where it moves products daily from site to site.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/gatik-brings-autonomous-freight-pepsico-north-american-supply-chain/\">Gatik to bring autonomous freight to PepsiCo&#8217;s North American supply chain<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "AI in warehousing: Akash Gupta’s vision for the future", "source": "Robotics Business Review", "date": "2026-06-12", "url": "https://www.therobotreport.com/ai-in-warehousing-akash-guptas-vision-for-the-future/", "summary": "<p>Explore how GreyOrange's software revolutionizes warehouse automation with AI, transforming logistics into dynamic, predictive ecosystems.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/ai-in-warehousing-akash-guptas-vision-for-the-future/\">AI in warehousing: Akash Gupta&#8217;s vision for the future<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "MassRobotics announces the winners of 2026 Robotics Medal and Rising Star awards", "source": "Robotics Business Review", "date": "2026-06-12", "url": "https://www.therobotreport.com/massrobotics-announces-winners-2026-robotics-medal-rising-star-awards/", "summary": "<p>Allison Okamura and Ayoung Kim won MassRobotics' 2026 Robotics Medal and Rising Star Medal, which honor women in robotics.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/massrobotics-announces-winners-2026-robotics-medal-rising-star-awards/\">MassRobotics announces the winners of 2026 Robotics Medal and Rising Star awards<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Robotics Summit panel explores the state of humanoid robot design", "source": "Robotics Business Review", "date": "2026-06-12", "url": "https://www.therobotreport.com/robotics-summit-panel-explores-state-humanoid-robot-design/", "summary": "<p>At the Robotics Summit &#038; Expo, experts weighed in on humanoid robotics today — and the ability to achieve a $20,000 price point tomorrow.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/robotics-summit-panel-explores-state-humanoid-robot-design/\">Robotics Summit panel explores the state of humanoid robot design<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Defining Autonomy for Wellness Robots in Senior Care", "source": "IEEE Spectrum Robotics", "date": "2026-06-11", "url": "https://content.knowledgehub.wiley.com/wellness-robots-and-the-path-to-full-autonomy-a-new-paradigm-in-ai-powered-senior-care/", "summary": "<img src=\"https://spectrum.ieee.org/media-library/dreamface-technologies-llc-logo-with-abstract-silver-face-and-circles-on-teal-background.png?id=66892687&amp;width=980\" /><br /><br /><p>An examination of how socially assistive wellness robots could support the seven dimensions of senior wellness, and how a framework can measure their autonomy.<\/p><p>What Attendees will Learn<\/p><ol><li><span>Why the senior care crisis exceeds incremental automation. Demographic pressure, workforce shortages, and a daily wellness-programming gap all strain traditional care models.<\/span><\/li><li><span>What defines a wellness robot as a category. The seven ICAA wellness dimensions and eight properties separate these robots from companion and medical devices.<\/span><\/li><li><span>How autonomy can be measured with CRAS. This six-level scale, modeled on the SAEJ3016 driving standard, evaluates four care dimensions.<\/span><\/li><li><span>What maps the road to full autonomy. The paper examines technical capabilities, clinical evidence, and a three-phase roadmap toward the early 2030s.<\/span><\/li><\/ol><div><span><a href=\"https://content.knowledgehub.wiley.com/wellness-robots-and-the-path-to-full-autonomy-a-new-paradigm-in-ai-powered-senior-care/\" target=\"_blank\">Download this free whitepaper now!<\/a><\/span><\/div>"}, {"title": "Hello Robot is recognized by World Economic Forum as a tech pioneer", "source": "Robotics Business Review", "date": "2026-06-11", "url": "https://www.therobotreport.com/hello-robot-is-recognized-by-world-economic-forum-as-a-tech-pioneer/", "summary": "<p>The World Economic Forum has honored Hello Robot, whose Stretch system provides mobile manipulation to older adults and people with disabilities.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/hello-robot-is-recognized-by-world-economic-forum-as-a-tech-pioneer/\">Hello Robot is recognized by World Economic Forum as a tech pioneer<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Inside XRZero-G0, a new 2,000-hour open dataset for robotics research", "source": "Robotics Business Review", "date": "2026-06-11", "url": "https://www.therobotreport.com/inside-xrzero-g0-a-new-2000-hour-open-dataset-for-robotics-research/", "summary": "<p>X Square Robot has open-sourced XRZero-G0, a framework that reduces real-robot training data requirements by up to 20x.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/inside-xrzero-g0-a-new-2000-hour-open-dataset-for-robotics-research/\">Inside XRZero-G0, a new 2,000-hour open dataset for robotics research<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "NEURA Robotics to raise up to $1.4B in Series C funding for physical AI", "source": "Robotics Business Review", "date": "2026-06-10", "url": "https://www.therobotreport.com/neura-robotics-raise-up-1-4b-in-series-c-funding-physical-ai/", "summary": "<p>NEURA Robotics plans to expand its platforms for robot learning and global production of humanoids and other systems.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/neura-robotics-raise-up-1-4b-in-series-c-funding-physical-ai/\">NEURA Robotics to raise up to $1.4B in Series C funding for physical AI<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Robotics will not have a clean Llama moment", "source": "Robotics Business Review", "date": "2026-06-10", "url": "https://www.therobotreport.com/robotics-will-not-have-a-clean-llama-moment/", "summary": "<p>The Llama moment in robotics will not be the day a policy becomes downloadable. It will be the day another team can take that policy, adapt it to its robot, release it into a customer process, and still know what failed weeks later when the line stops repeating.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/robotics-will-not-have-a-clean-llama-moment/\">Robotics will not have a clean Llama moment<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "For Robotaxis, Safety Must Be Built In, Not Bolted On", "source": "NVIDIA Robotics", "date": "2026-06-10", "url": "https://blogs.nvidia.com/blog/halos-os-robotaxi-safety/", "summary": "A car pulls up to the curb. The app says, “Your ride is here.” No one’s in the driver’s seat. For people who live in one of the dozens of cities now hosting robotaxi services, this is already a reality. The robotaxi industry has moved from prototype milestones to commercial operations, with an expanding ecosystem [&#8230;]"}, {"title": "Beyond Dexterity: Why Contact May Define the Next Era of Robotics", "source": "IEEE Spectrum Robotics", "date": "2026-06-09", "url": "https://spectrum.ieee.org/agilink-contact-intelligence-robot-manipulation", "summary": "<img src=\"https://spectrum.ieee.org/media-library/humanoid-robot-with-four-arms-holding-a-red-balloon-sculpture-at-a-tech-expo.jpg?id=66870200&amp;width=1245&amp;height=700&amp;coordinates=0%2C0%2C0%2C1\" /><br /><br /><p><em>This article is brought to you by <a href=\"https://www.agilink-ai.com/\" target=\"_blank\">AGILINK<\/a>.<\/em><\/p><p>Throughout the exhibition hall at the 2026 IEEE International Conference on Robotics (ICRA), in Vienna, one demonstration seemed to attract a disproportionate amount of attention.<\/p><p>Two robotic hands were making a balloon dog. Slowly and deliberately, the robot twisted a long balloon into loops, bends, and joints without popping it. Visitors stopped, watched, and often returned with colleagues to watch again.<\/p><p class=\"shortcode-media shortcode-media-rebelmouse-image\"> <img alt=\"Crowd at a robotics expo watches a humanoid robot demonstrate its arm movements.\" class=\"rm-shortcode\" id=\"821bd\" src=\"https://spectrum.ieee.org/media-library/crowd-at-a-robotics-expo-watches-a-humanoid-robot-demonstrate-its-arm-movements.jpg?id=66870218&amp;width=980\" /> <small class=\"image-media media-caption\">AGILINK’s balloon dog demonstration draws a crowd at ICRA 2026.<\/small><small class=\"image-media media-photo-credit\">AGILINK<\/small><\/p><p>At first glance, the demonstration appeared almost playful. Among roboticists, however, balloon twisting is widely recognized as an unusually difficult manipulation task.<\/p><p>A balloon is lightweight, highly deformable, slippery, and extremely sensitive to force. Every twist changes its geometry and internal pressure, turning a seemingly simple activity into a continuously changing physical interaction problem.<\/p><p>Humans navigate those changes almost intuitively. While making a balloon animal, people rarely think consciously about force regulation, slip prevention, or contact stability. They simply adjust.<\/p><p>For robots, those adjustments remain remarkably difficult. The challenge is not merely moving fingers to the right positions. The harder part is maintaining stable interaction while the object itself is changing.<\/p><p class=\"shortcode-media shortcode-media-youtube\"> <span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><small class=\"image-media media-caption\">Highlights from AGILINK’s ICRA 2026 demonstrations, including visuotactile sensing, in-hand manipulation, balloon-animal shaping, and other contact-rich tasks enabled by the company’s latest OmniHand platform.<\/small><small class=\"image-media media-photo-credit\">AGILINK<\/small><\/p><p>That distinction helps explain why the balloon dog drew so much attention in Vienna. What appeared to be a dexterity demonstration was, in many ways, a demonstration about contact itself.<\/p><p>As robotic manipulation continues to advance, a growing number of researchers are arriving at a similar conclusion: many of the hardest problems in robotics begin only after contact occurs.<\/p><h2>Motion and Contact Intelligence for Robot Manipulation<\/h2><p>Balloon twisting combines two challenges that robotics has traditionally struggled to solve simultaneously: long-horizon task execution and contact-rich manipulation.<\/p><p>The first concerns motion.<\/p><p>A balloon dog is not created through a single grasp or twist. It emerges through a carefully ordered sequence of manipulations, each setting the conditions for what follows. A small rotational error introduced early may appear insignificant at first, yet several steps later it can prevent the final structure from forming altogether.<\/p><p>In that sense, balloon twisting is a long-horizon task. Success depends not only on performing individual actions correctly, but also on preserving the future feasibility of the entire manipulation process.<\/p><p>To address this challenge, <a href=\"https://www.agilink-ai.com/\" target=\"_blank\">AGILINK<\/a> began by collecting demonstrations from professional balloon artists. Human actions were mapped onto robotic hands to establish an initial manipulation policy. But successful demonstrations alone were insufficient.<\/p><p>In practice, some of the most valuable learning occurred when execution began to drift toward failure. Whenever instability emerged, human operators intervened and corrected the manipulation in real time. Those interventions were recorded and incorporated into reinforcement-learning cycles, allowing the system to learn not only how successful demonstrations unfold, but also how experienced operators recover when things start to go wrong.<\/p><p>Through this process, the robot gradually acquired the capabilities required for long-horizon task execution—a collection of abilities that AGILINK groups under the term <strong>motion intelligence<\/strong>: the ability to generate actions, coordinate bimanual behaviors, and execute extended manipulation sequences under real-world uncertainty.<\/p><p class=\"shortcode-media shortcode-media-rebelmouse-image\"> <img alt=\"Two robotic hands, one white open palm and one black forming an OK gesture, on display.\" class=\"rm-shortcode\" id=\"779ba\" src=\"https://spectrum.ieee.org/media-library/two-robotic-hands-one-white-open-palm-and-one-black-forming-an-ok-gesture-on-display.png?id=66870278&amp;width=980\" /> <small class=\"image-media media-caption\">OmniHand 3 Ultra-M on display at ICRA 2026.<\/small><small class=\"image-media media-photo-credit\">AGILINK<\/small><\/p><p>Yet motion alone does not explain why balloon twisting remains difficult. The second challenge is contact.<\/p><p>The robot must continuously regulate force, adjust contact locations, and respond to subtle changes in the object’s state. These decisions are difficult to encode through explicit rules. Even skilled human operators often rely on tactile intuition developed through experience rather than consciously articulated strategies.<\/p><p>Analysis of those interventions revealed that many failures did not originate from incorrect action sequences, but from the breakdown of contact itself.<\/p><p>To better capture those interaction dynamics, AGILINK collected contact-centric intervention data and incorporated those interactions into reinforcement-learning training. Rather than learning only which motions to perform, the system also learned how humans maintain stability when contact conditions begin to deteriorate.<\/p><p>AGILINK describes this capability as <strong>contact intelligence<\/strong>: the ability to establish, maintain, and adapt physical interaction as force distribution, friction, deformation, and contact geometry continuously evolve.<\/p><p>The distinction between the two capabilities is subtle but important. Motion intelligence determines what the robot intends to do. Contact intelligence determines whether it can continue doing it. For balloon twisting, both are necessary. One provides the sequence of actions. The other keeps those actions physically viable.<\/p><p class=\"shortcode-media shortcode-media-rebelmouse-image\"> <img alt=\"Robot makes balloon animal for visitor at tech expo booth.\" class=\"rm-shortcode\" id=\"431a1\" src=\"https://spectrum.ieee.org/media-library/robot-makes-balloon-animal-for-visitor-at-tech-expo-booth.jpg?id=66870268&amp;width=980\" /> <small class=\"image-media media-caption\">YouTuber KhanFlicks follows OmniHand’s motions while learning to fold a balloon dog at the AGILINK booth.<\/small><small class=\"image-media media-photo-credit\">AGILINK<\/small><\/p><p>Between a balloon slipping away and a balloon bursting lies a narrow region of stability. Successful manipulation depends on finding that region—and remaining within it throughout the task.<\/p><h2>Introducing the OmniHand 3 Ultra-M Dexterous Hand<\/h2><p>The balloon dog demonstration showcased a manipulation capability. It also revealed a broader question. How much contact intelligence can be achieved through learning alone? A robot can only regulate what it can perceive. It can only respond as quickly as its hardware allows.<\/p><p>As manipulation tasks become increasingly complex, researchers are finding that progress depends not only on better policies, but also on richer sensing and faster physical response.<\/p><p>That realization formed the backdrop for AGILINK’s second major announcement at ICRA 2026. Alongside the balloon dog demonstration, the company introduced the <strong><a href=\"https://www.agilink-ai.com/ultra-m.html\" target=\"_blank\">OmniHand 3 Ultra-M<\/a><\/strong>.<\/p><p class=\"shortcode-media shortcode-media-rebelmouse-image\"> <img alt=\"Two robotic hands beside a human hand, all raised open on a display table.\" class=\"rm-shortcode\" id=\"e7eda\" src=\"https://spectrum.ieee.org/media-library/two-robotic-hands-beside-a-human-hand-all-raised-open-on-a-display-table.jpg?id=66870269&amp;width=980\" /> <small class=\"image-media media-caption\">OmniHand 3 Ultra-M closely matches the size of an adult human hand.<\/small><small class=\"image-media media-photo-credit\">AGILINK<\/small><\/p><p>The two exhibits represented different stages of the same technological trajectory. If the balloon dog demonstrated what contact intelligence can already accomplish today, Ultra-M was designed to explore what contact intelligence may require next.<\/p><h2>Building Hardware for Contact Intelligence<\/h2><p>Roughly the size of an adult human hand, the <a href=\"https://www.agilink-ai.com/uploads/upload/files/20260530/a7b12675ce5e3b4e9b913801c0c6f659.pdf\" target=\"_blank\">OmniHand 3 Ultra-M integrates 20 active degrees of freedom<\/a> within a human-scale form factor.<\/p><p>Its most distinctive feature is a fully direct-drive architecture. By adopting direct-drive actuation throughout the system, the hand is designed to enable faster and more transparent force regulation and higher force-control bandwidth, enabling faster response as contact conditions change. For contact-rich manipulation, responsiveness can be as important as sensing itself.<\/p><p class=\"pull-quote\">By adopting direct-drive actuation throughout the system, the OmniHand 3 Ultra-M  is designed to enable faster and more transparent force regulation and higher force-control bandwidth, enabling faster response as contact conditions change.<\/p><p>The platform also incorporates tactile sensing across nearly the entire hand. Each fingertip contains a miniature vision-based tactile sensor, while more than 300 three-dimensional tactile sensing points are distributed throughout the palm. Together, they provide information not only about where contact occurs, but how contact is evolving.<\/p><p>The system is designed to estimate pressure distribution, shear forces, local deformation, slip tendencies, and other interaction dynamics that often remain invisible to conventional position-based control systems.<\/p><p>According to AGILINK’s tests, individual sensors achieve force resolution of approximately 0.005 N—roughly equivalent to detecting the weight of a sheet of paper resting on a fingertip. Spatial resolution reaches approximately 0.04 mm, while sensing density approaches 50,000 sensing points per square centimeter.<\/p><p class=\"shortcode-media shortcode-media-rebelmouse-image\"> <img alt=\"Robot arm delicately holds a feather, inset shows colorful dotted texture close-up.\" class=\"rm-shortcode\" id=\"8f1f1\" src=\"https://spectrum.ieee.org/media-library/robot-arm-delicately-holds-a-feather-inset-shows-colorful-dotted-texture-close-up.png?id=66870273&amp;width=980\" /> <small class=\"image-media media-caption\">OmniHand 3 Ultra-M recognizes feather texture through vision-based tactile sensing.<\/small><small class=\"image-media media-photo-credit\">AGILINK<\/small><\/p><p>For dexterous robots, contact has traditionally been a largely hidden process. Ultra-M is designed to make that process more observable.<\/p><p>Rather than simply detecting that contact has occurred, the system attempts to resolve where interaction is happening, how forces are distributed, whether instability is beginning to emerge, and how manipulation strategies should adapt in response.<\/p><p>The balloon dog offered a glimpse of what contact intelligence can already accomplish. Ultra-M explores a different question: what capabilities may be required to push contact intelligence further?<\/p><h2>The Physical World Remains the Hardest Benchmark<\/h2><p>The significance of contact intelligence extends far beyond balloon animals. Many tasks that continue to resist automation involve unstable or deformable interaction: cable insertion, garment handling, flexible packaging, delicate assembly, connector mating, tool use, and household manipulation.<\/p><p>These tasks are difficult not because robots cannot reach the correct location, but because maintaining stable interaction after contact begins remains extraordinarily hard.<\/p><p>For decades, robotics achieved many of its successes by reducing uncertainty. Factories were engineered to make robotic motion predictable, repeatable, and highly structured. The physical world behaves differently.<\/p><p class=\"pull-quote\">A growing share of robotics research is shifting toward interaction itself—understanding how robots can establish, maintain, and adapt physical contact within environments that remain fundamentally unpredictable.<\/p><p>Objects shift. Materials deform. Friction changes. Contact evolves. Real environments rarely follow scripts. Seen through that lens, the balloon dog was never really about the balloon dog. What attracted attention at ICRA was not simply a visually impressive demonstration, but what it revealed: intelligence in the physical world is ultimately measured through interaction.<\/p><p>As motion generation continues to mature, a growing share of robotics research is shifting toward interaction itself—understanding how robots can establish, maintain, and adapt physical contact within environments that remain fundamentally unpredictable.<\/p><p>For robots moving beyond structured environments and into less predictable real-world settings, managing contact may become as important as motion itself.<\/p>"}, {"title": "How JPL Keeps the 13-Year-Old Curiosity Rover Doing Science", "source": "IEEE Spectrum Robotics", "date": "2026-06-09", "url": "https://spectrum.ieee.org/curiosity-rover-jpl-mars-science", "summary": "<img src=\"https://spectrum.ieee.org/media-library/a-large-robotic-rover-on-reddish-martian-soil.jpg?id=66880331&amp;width=1245&amp;height=700&amp;coordinates=0%2C156%2C0%2C157\" /><br /><br /><p>Thirteen years ago last August, I was <a href=\"https://spectrum.ieee.org/msl-what-to-expect-on-sunday-night\" target=\"_self\">camped out<\/a> in NASA’s Jet Propulsion Laboratory press room in Pasadena, Calif., waiting to see whether the Curiosity rover would survive its descent and skycrane-assisted landing on the surface of Mars. It did, and <a href=\"https://spectrum.ieee.org/curiosity-rover-alive-and-well-on-surface-of-mars\" target=\"_self\">it was awesome<\/a>.<\/p><p>Since then, Curiosity (also known as Mars Science Laboratory) has <a href=\"https://science.nasa.gov/mission/msl-curiosity/location-map/\" rel=\"noopener noreferrer\" target=\"_blank\">traveled nearly 37 kilometers<\/a>, drilled into and sampled <a href=\"https://science.nasa.gov/resource/curiositys-42-drill-holes/\" rel=\"noopener noreferrer\" target=\"_blank\">42 different rocks<\/a>, and as of publication has snapped nearly <a href=\"https://mars.nasa.gov/msl/multimedia/raw-images/?order=sol+desc%2Cinstrument_sort+asc%2Csample_type_sort+asc%2C+date_taken+desc&amp;per_page=50&amp;page=0&amp;mission=msl\" rel=\"noopener noreferrer\" target=\"_blank\">763,000 photos<\/a>. The fact that this robot is still <a href=\"https://www.jpl.nasa.gov/news/nasas-perseverance-curiosity-panoramas-capture-two-sides-of-mars/\" rel=\"noopener noreferrer\" target=\"_blank\">hard at work<\/a>, getting <a href=\"https://www.nasa.gov/missions/mars-science-laboratory/curiosity-rover/nasas-curiosity-finds-organic-molecules-never-seen-before-on-mars/\" rel=\"noopener noreferrer\" target=\"_blank\">real science done<\/a> at the age of 13, is absolutely incredible—not only is Mars an actively hostile environment for robots, but the only kind of maintenance that JPL engineers can do is to send very, very careful software updates.<\/p><p>Nevertheless, the clever folks at JPL have managed to keep Curiosity safe, warm, mobile, and sciencing, despite well-worn wheels and less and less power every day. One of those folks is <a href=\"https://www.linkedin.com/in/alexandraholloway/\" rel=\"noopener noreferrer\" target=\"_blank\">Alexandra Holloway<\/a>, the assistant team chief for engineering operations for Curiosity, who spoke to <em><em>IEEE Spectrum<\/em><\/em> about keeping Curiosity roving, what its future looks like, and how JPL has used that experience to make rovers like Perseverance even more capable.<\/p><p><strong>How astonished should we be that after 13 years on Mars, Curiosity is not only still doing science, but actually getting more capable?<\/strong><\/p><p class=\"shortcode-media shortcode-media-rebelmouse-image rm-float-left rm-resized-container rm-resized-container-25\" style=\"float: left;\"> <img alt=\"A woman with large green eyes and a shaved head\" class=\"rm-shortcode\" id=\"f275c\" src=\"https://spectrum.ieee.org/media-library/a-woman-with-large-green-eyes-and-a-shaved-head.jpg?id=66880338&amp;width=980\" /> <small class=\"image-media media-caption\">Alexandra Holloway is the assistant team chief for engineering operations on the Curiosity Mars rover at the Jet Propulsion Laboratory.<\/small><small class=\"image-media media-photo-credit\">Alexandra Holloway<\/small><\/p><p><strong>Alexandra Holloway: <\/strong>I’m astonished! The longevity comes from a lot of ongoing work. It’s not just that Curiosity was built robustly; it’s also because we’re continuously putting in effort to ensure it can continue to have that lifespan. I think about all the different kinds of embedded systems there are, from cars to refrigerators, and none of them have the kind of longevity that we have with the rover. It’s mind-boggling, and it’s inspiring.<\/p><p><strong>Is the <\/strong><a href=\"https://robotsguide.com/robots/perseverance\" target=\"_blank\"><strong>Perseverance rover<\/strong><\/a><strong>, which is nine years younger than Curiosity, significantly different in terms of its hardware and software?<\/strong><\/p><p><strong>Holloway: <\/strong>In terms of hardware, the rovers are actually very similar. Both use a <a href=\"https://www.baesystems.com/en/article/bae-systems-rad750--single-board-computers-guide-insight-mars-landing\" target=\"_blank\">RAD 750 processor<\/a> and have the same amount of memory. However, Perseverance has an extra processor specifically for visual odometry, which allows it to drive autonomously. <a href=\"https://www.youtube.com/watch?v=Q_P0swqaZDk\" rel=\"noopener noreferrer\" target=\"_blank\">This difference reflects their primary mission designs<\/a>: Perseverance was designed for driving long distances, while Curiosity is a mission focused on sampling as it goes. So Perseverance’s onboard scheduling capabilities are there to optimize its driving. In fact, just last year, Perseverance surpassed <a href=\"https://science.nasa.gov/mission/msl-curiosity/location-map/\" rel=\"noopener noreferrer\" target=\"_blank\">Curiosity’s driving distance<\/a> after only about three years on Mars.<\/p><h2>Curiosity Rover Memory and Software Fixes<\/h2><p><strong>Do you have some examples of significant tweaks the team has made to keep Curiosity roving?<\/strong><\/p><p><strong>Holloway: <\/strong>One of my favorite examples comes from a <a href=\"https://science.nasa.gov/blog/sol-2204-curiosity-science-is-baaaack/\" rel=\"noopener noreferrer\" target=\"_blank\">processor anomaly<\/a> that happened on Sol 2172 [Ed. note: “Sol” is the term for a Martian day—about 24 hours and 40 minutes]. Curiosity has two computers, A and B. We landed on A, swapped to B due to <a href=\"https://llis.nasa.gov/lesson/11201\" rel=\"noopener noreferrer\" target=\"_blank\">a NAND memory anomaly early on (Sol 200)<\/a>. For years, we were chugging along on B, until one day there was a problem—B booted up, but it couldn’t mount its drive partition. We’d never seen this before. To preserve B’s data, we swapped back to A, which we hadn’t trusted in two thousand Sols. A also had a degraded memory, with only two gigabytes of usable storage space instead of four. We painstakingly transferred data from B over to A and then down to Earth, and eventually we ran out of stuff we wanted to transfer, which was really good, because A then started acting funny in the same way it did on Sol 200. It was acting like its memory was coming unsoldered. That’s bad. <\/p><p>We quickly swapped back to B, formatted it, and got it working again. The problem then became that we couldn’t trust A’s memory at all, but we needed a second computer as a “lifeboat” for diagnostics and transfers if B failed again. We realized we had one other place of memory: where we keep our flight software. We have four copies of the flight software (two current versions and two older versions) in different banks of very small amounts of memory, just 32 megabytes each. What if we just jettisoned the old flight software copies and used that 64-megabyte NOR memory as our file system for computer A? <\/p><p>So <a href=\"https://ieeexplore.ieee.org/document/9697661\" rel=\"noopener noreferrer\" target=\"_blank\">that’s what we did<\/a>. It was so elegant! Computer A is operating with less than 1 percent of its original memory, but we can run a mission on it. A small mission, but we haven’t had to jettison any core capabilities. We can still drive, we can manage data, we can even theoretically do science. Everything works fine, just much slower and much smaller. That flight software release was even called “<a href=\"https://www.computer.org/csdl/proceedings-article/smc-it/2021/856000a007/1ANLcTE5g3e\" rel=\"noopener noreferrer\" target=\"_blank\">R-Hope<\/a>“ because we hoped it would work.<\/p><p><strong>What are the constraints on Curiosity’s lifespan?<\/strong><\/p><p><strong>Holloway: <\/strong>Our biggest hardware challenge is <a href=\"https://spectrum.ieee.org/if-necessary-mars-rover-curiosity-could-rip-its-own-wheels-off-to-stay-mobile\" target=\"_self\">wheel wear<\/a>. It looks like we’re driving on this sandy terrain with some rocks in it, and our intuition said that we could just drive over these rocks and they’d get pushed down into the sand and it would be no big deal. But what we ended up seeing was that those little rocks are actually the tips of giant boulders buried in the sand, and they’re razor sharp. Our wheels were getting ripped apart driving over them, especially our front wheels, so <a href=\"https://www.jpl.nasa.gov/news/curiosity-adds-reverse-driving-for-wheel-protection/\" rel=\"noopener noreferrer\" target=\"_blank\">we started driving backwards<\/a>.<\/p><p>We also monitor consumables. We consider the number of times we move our actuators. That’s a consumable. Curiosity hasn’t <a href=\"https://www.nasa.gov/image-article/curiositys-dusty-selfie/\" rel=\"noopener noreferrer\" target=\"_blank\">taken a selfie<\/a> in a while, and one of the reasons is that it’s really hard on the joint actuators. Our onboard memory is a consumable, but surprisingly we’re not anywhere near our life cycle for memory. Our biggest consumable is power; we have an <a href=\"https://mars.nasa.gov/internal_resources/788/\" rel=\"noopener noreferrer\" target=\"_blank\">RTG<\/a>, a nuclear power source, which decreases its output as it ages.<\/p><p>Newer missions are flying <a href=\"https://www.qualcomm.com/snapdragon/overview\" rel=\"noopener noreferrer\" target=\"_blank\">Snapdragon<\/a> [processors], but Curiosity’s RAD 750 is a power hog. One of the things that we’ve rolled out that’s going really well is a way of reducing the amount of time we spend with the computer powered on, by harvesting time when we finish activities early and going to sleep, which lets us turn off the computers and some of the heating. Another thing we’re looking at is doing stuff in parallel when we’re on, like being able to drive or use the arm while communicating with an orbiter. <\/p><p>So power is decreasing, and that’s causing us to do all this parallelism work and become more efficient and nuanced in the way we operate. But we are not having any degraded science output at this time. Our wheels are still going, our arm is still okay for now, knock on wood. I would say maybe the bottleneck is budget.<\/p><h2>Curiosity Rover’s Impact on Future Mars Exploration<\/h2><p><strong>What have you learned from Curiosity that will improve future missions?<\/strong><\/p><p><strong>Holloway: <\/strong>As an embedded flight software person, I think about how we can change, add, or modify software capabilities during the mission. There’s definitely a sweet spot for loading and patching flight software—some of these concepts were pioneered on Spirit and Opportunity and then inherited by Curiosity and Perseverance, making it easier to understand and change the software.<\/p><p>Some of the things that I wish we had now on [the Mars Science Laboratory] include a better understanding of where our power is going. I want to see how much power each component is drawing every minute, so that we could architect a software system that could balance loads better. We have some of this information that was built in by the engineers who designed the rover, but as an operator, I want something slightly different. So if I were building a mission, I would have those discussions earlier and get operators into the room to say, “what do you want your data products to look like?”<\/p><p>The key takeaway for designing future missions is to talk to all your users early in the design process. It needs to happen upfront.<\/p><p><strong>What does Curiosity’s long-term future look like?<\/strong><\/p><p><strong>Holloway: <\/strong>That’s a conversation that happens, and it’s a really delicate one. We have a lot of science instruments, and a lot of them have to do with contact science and sampling and rely on the arm. If we lose the arm, what science can we still do? Well, we have a lot of remote sensors too, like cameras, environmental sensors, and radiation sensors. All of these things are important for the future of space exploration and humans on Mars. <\/p><p>From a power perspective, our RTG is projected to start degrading science output in the sixth extended mission, but we’re going to be fine through 2035 and potentially even beyond that. So we have a long and exciting future ahead of us. We need to figure out the best way of operating within our constraints, but we’re still kicking.<\/p>"}, {"title": "Walmart, Wing add 7 markets in drone delivery expansion", "source": "Robotics Business Review", "date": "2026-06-09", "url": "https://www.therobotre
