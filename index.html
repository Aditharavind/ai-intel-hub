<\/p><p>She completed her Ph.D. in computer science in 2022 with a minor in cognitive science.<\/p><p>After graduation, she continued her work and collaboration at CSAIL, particularly on projects that involved the “theory of mind” concept.<\/p><h2>Theory of mind spurs innovation<\/h2><p>Theory of mind isn’t new, having originated with <a href=\"https://www.cambridge.org/core/journals/behavioral-and-brain-sciences/article/does-the-chimpanzee-have-a-theory-of-mind/1E96B02CD9850016B7C93BC6D2FEF1D0\" rel=\"noopener noreferrer\" target=\"_blank\">primatologists studying chimpanzees<\/a> in the late 1970s. The theory recognizes that others have their own thoughts, beliefs, and perspectives. It’s a skill that allows humans to infer someone’s mental state and predict their behavior without verbal communication.<\/p><p>“It’s like when college roommates are moving into their dorm. They may not talk too much, but they work together naturally to coordinate their activities and accomplish goals,” Kuo says. “They can infer and mentally interpret each other’s behaviors and signals to make decisions and complete tasks without words.”<\/p><p>She brought her theory of mind research to the University of Virginia when she joined as an assistant professor in 2023.<\/p><p>Kuo conducts her research in UVA Engineering’s multidisciplinary cyberphysical <a href=\"https://engineering.virginia.edu/labs-groups/link-lab\" rel=\"noopener noreferrer\" target=\"_blank\">Link Lab<\/a>. Her broad focus is on developing computational models that help robots interpret both direct data and silent signals, from language and movements to a person’s gaze. If successful, it could give robots the same sort of physical and theory of mind reasoning capabilities that power physical and social interactions among humans.<\/p><p>“There are no computational frameworks yet available that will translate this kind of understanding into a robot efficiently,” she says.<\/p><p>She adds that the process to get there begins with improving how robots learn to perform tasks.<\/p><h2>The evolution of robot learning<\/h2><p>Historically, one way robots learned was to mimic humans. A researcher would manually guide a robot through a task, like cutting an apple, and it would repeat the movements. The robot was successful until the environment changed, such as when its hand was in a different position or the apple was at a different angle. The robot was then faced with a situation for which it hadn’t been trained. Without any data available to help it correct course, the robot would start making small errors that eventually led to a full system crash.<\/p><p class=\"shortcode-media shortcode-media-rebelmouse-image\"> <img alt=\"Diagram of a robotic gripper delicately holding a potato chip. Labels describe how the gripper\\u2019s visual perception and tactile sensing prevent the chip from breaking.\" class=\"rm-shortcode\" id=\"bfe1e\" src=\"https://spectrum.ieee.org/media-library/diagram-of-a-robotic-gripper-delicately-holding-a-potato-chip-labels-describe-how-the-gripper-u2019s-visual-perception-and-tact.jpg?id=66879111&amp;width=980\" /> <small class=\"image-media media-caption\">This diagram describes how the robotic gripper’s visual perception and tactile sensing prevents a potato chip from breaking.<\/small><small class=\"image-media media-photo-credit\"><a href=\"https://force-gripper.github.io/\" target=\"_blank\">Xuhui Kang, Yen-Ling Kuo, et al.<\/a><\/small><\/p><p>To solve the problem, researchers developed the dataset aggregation (DAgger) method. As a robot performed a task, a researcher was on standby to provide real-time corrections during unexpected scenarios. The correction data was continuously added to the robot’s model, teaching it how to recover from mistakes.<\/p><p>To reduce the human monitoring effort, robot-gated DAgger was created to enable bots to query humans when the machines became uncertain.<\/p><p>The most popular approach to make the query decision is to train multiple models to consider when determining a course of action. If the models all agree, the robot proceeds. If they don’t agree, the robot is likely to get stuck and ask for help.<\/p><p>Although the multiple model approach was widely adopted, it has limitations. Practically speaking, as models become more complex, it is hard or impossible to train multiple copies. A more fundamental issue is that disagreement among models doesn’t always imply uncertainty; it could just mean there are different ways to accomplish a task.<\/p><h2>The Diff-DAgger solution<\/h2><p>That is the gap Kuo’s research team closed with the novel Diff-DAgger research. The approach builds on diffusion policy, a technique that helps robots account for different ways a task can be performed.<\/p><p>The new method repurposes diffusion loss, the signal a robot uses to improve its model during training, as a real-time confidence check. During task execution, the robot computes the signal and compares it against values from its training data using a statistical test. The signal spikes when the robot faces an unfamiliar situation and is uncertain how to proceed. The signal stays silent when the robot’s current action is close to what it learned before.<\/p><p>The spike represents the robot’s ability to self-diagnose and predict an imminent failure. Human intervention is triggered only when the signal spikes. No spike means the robot can be left to complete its decision-making process on its own.<\/p><p>Kuo’s team achieved <a href=\"https://diffdagger.github.io\" target=\"_blank\">significant results<\/a>: Failure prediction rates were improved by 39 percent. Task completion rates were increased by 20 percent, and tasks were completed nearly eight times faster.<\/p><p>Her research at UVA gained attention from the <a href=\"https://www.nsf.gov\" rel=\"noopener noreferrer\" target=\"_blank\">National Science Foundation<\/a>, which honored her last year with a <a href=\"https://www.nsf.gov/funding/opportunities/career-faculty-early-career-development-program\" rel=\"noopener noreferrer\" target=\"_blank\">Career Award<\/a>, the foundation’s flagship grant for early-career researchers. The five-year US $665,000 grant supports her research that builds computational models for human-robot interactions through theory of mind reasoning.<\/p><p>She also received the Toyota Research Institute’s <a href=\"https://engineering.virginia.edu/news-events/news/uva-and-toyota-research-institute-aim-give-your-car-power-reason\" rel=\"noopener noreferrer\" target=\"_blank\">Young Faculty Researcher Award<\/a> to teach cars to reason about interactions on the road and with the driver.<\/p><p>As service robots and self-driving vehicles become more available, such works are likely to make interactions between humans and robots more intuitive and useful.<\/p><p>Kuo ultimately wants to build more robust robots that are able to integrate into a social space with humans by engaging with us through grounded interactions, she says.<\/p><h2>The impact of IEEE<\/h2><p>Like many IEEE members, Kuo was introduced to the organization as a student. In 2018 she submitted her first paper, “<a href=\"https://arxiv.org/abs/1810.00804\" rel=\"noopener noreferrer\" target=\"_blank\">Deep Sequential Models for Sampling-Based Planning<\/a>,” to the <a href=\"https://www.ieee-ras.org/conferences-workshops/financially-co-sponsored/iros/\" rel=\"noopener noreferrer\" target=\"_blank\">IEEE/Robotics Society of Japan International Conference on Intelligent Robots and Systems<\/a> while pursuing her Ph.D. at MIT. Her IEEE involvement grew alongside her professional career.<\/p><p>“It was a natural segue to transition from student to a full IEEE member,” she says. Today she is an active volunteer with the IEEE Robotics and Automation Society, a reviewer for submitted papers, and a presenter and panelist at conferences.<\/p><p>She says one of the best parts of attending conferences is having the opportunity to engage with students. She also enjoys participating as a panelist at luncheons, she says, because it gives her one-on-one time with student attendees. She can share her knowledge and offer insights as they prepare to embark on their career.<\/p><p>Her goal in the coming years, she says, is to broaden her involvement with IEEE initiatives and branch out to other technical committees. Sharing knowledge and learning from others is essential to anyone’s <a href=\"https://spectrum.ieee.org/influence-your-career\" target=\"_blank\">career growth<\/a>, she says, and “IEEE offers a great opportunity for both.”<\/p>"}, {"title": "Video Friday: Robotic Motion Discovery Reveals Unusual Behaviors", "source": "IEEE Spectrum Robotics", "date": "2026-06-12", "url": "https://spectrum.ieee.org/video-friday-humanoid-loco-manipulation", "summary": "<img src=\"https://spectrum.ieee.org/media-library/humanoid-robot-picks-up-a-box-and-climbs-onto-a-table-in-a-modern-lab-workspace.gif?id=66901035&amp;width=1245&amp;height=700&amp;coordinates=0%2C116%2C0%2C116\" /><br /><br /><p><span>Video Friday is your weekly selection of awesome robotics videos, collected by your friends at <\/span><em>IEEE Spectrum<\/em><span> robotics. We also post a weekly calendar of upcoming robotics events for the next few months. Please <\/span><a href=\"mailto:automaton@ieee.org?subject=Robotics%20event%20suggestion%20for%20Video%20Friday\">send us your events<\/a><span> for inclusion.<\/span><\/p><h5><a href=\"https://roboticsconference.org/\">RSS 2026<\/a>: 13–17 July 2026, SYDNEY<\/h5><h5><a href=\"https://mrs.fel.cvut.cz/summer-school-2026/\">Summer School on Multi-Robot Systems<\/a>: 29 July–4 August 2026, PRAGUE<\/h5><h5><a href=\"https://actuate.foxglove.dev/\">Actuate 2026<\/a>: 18–19 August 2026, SAN FRANCISCO<\/h5><p>Enjoy today’s videos!<\/p><div class=\"horizontal-rule\"><\/div><div><span style=\"display: none;\"> <\/span><\/div><blockquote class=\"rm-anchors\" id=\"dhivz34qylw\"><em>We present MotionDisco, a framework that discovers contact-rich, long-horizon humanoid <a href=\"https://spectrum.ieee.org/video-friday-locoman\" target=\"_blank\">loco-manipulation<\/a> motions from scratch, without relying on teleoperation or motion retargeting from human demonstrations.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>Some of the discovered behaviors are a little nutso:<\/p><p class=\"shortcode-media shortcode-media-youtube\"> <span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://atarilab.github.io/motiondisco.io/\">MotionDisco<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"_21bfsgtm0s\">Not sure I’d say any of this is ‘effortless’ but those <a href=\"https://spectrum.ieee.org/video-friday-mit-hermes-drone-claw-bb8-droid\" target=\"_blank\">claws<\/a> are pretty cute.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.deeprobotics.cn/en\">Deep Robotics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"std5wteoa50\"><em>It turns out running a workout class is a decent way to stress-test <a href=\"https://spectrum.ieee.org/video-humanoid-dancing\" target=\"_blank\">whole-body range of motion<\/a>. Coordinating fluid movement across every joint at once—timing, velocity, balance compensation—is one of the harder control problems in humanoid robotics.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.agilityrobotics.com/\">Agility<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"htrfgxjojrs\">Our very own Gwendolyn Rak made a robotic shoulder-friend at Computer Human Interaction in Barcelona.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>Here’s a bit more about it:<\/p><p class=\"shortcode-media shortcode-media-youtube\"> <span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.media.mit.edu/projects/the-stochastic-parrot/overview/\">MIT<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"v2txavmrsyo\"><em>At AIRoA, we’re bringing <a href=\"https://spectrum.ieee.org/domestic-humanoid-robot-safety-standards\" target=\"_blank\">robots into real homes<\/a>. Check out our exclusive first video to see how they work in our development hub and real-life household settings! The project aims to develop home robots that can assist people with everyday tasks and become long-term companions in daily life. In this video, we demonstrate Toyota’s Human Support Robot (HSR) deployed in real homes, where it assists residents with everyday tasks such as tidying rooms and fetching objects.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.airoa.org/\">AI Robot Association<\/a> ]<\/p><p>Thanks, Naoaki!<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"ntvtrlsyhji\"><em>MIDAS Hand is a fully open-source, tactile-sensor-integrated <a href=\"https://spectrum.ieee.org/video-friday-robotic-hand-dexterity\" target=\"_blank\">dexterous robotic hand<\/a> platform for manipulation, teleoperation, and robot learning research. MIDAS stands for Modular low-Impedance Direct-drive Anthropomorphic Sensing Hand.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://midas-hand.com/\">MIDAS Hand<\/a> ]<\/p><p>Thanks, Jun Kim!<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"vofmkd0asrq\"><em>This video presents a novel flight maneuver for a flying bipedal robot. During forward flight, the robot performs aerial braking by swinging its legs to adjust the orientation of foot-mounted thrusters.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.sciencedirect.com/science/article/abs/pii/S0921889026001983\">Paper<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"z5nf8nz_zyi\">Seems like a really good application for autonomy, to be honest.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.builtrobotics.com/\">Built Robotics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"t9ygyxgfxlm\"><em>In this time-lapse, controllers on the ground are repositioning <a href=\"https://spectrum.ieee.org/dextre-robot-repairs-iss-while-astronauts-sleep\" target=\"_blank\">Dextre<\/a>, our robotic handyman currently installed at the end of the Canadarm2. They used Dextre to unload equipment from the unpressurised Dragon trunk. Such a beautiful choreography to watch with Earth in the background!<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.esa.int/ESA_Multimedia/Images/2008/04/The_Canadian_Special_Purpose_Dextrous_Manipulator_Dextre_installed_on_exterior_of_ISS\">European Space Agency<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"nel2bmgcfjs\"><em>This video demonstrates how AI Sapiens learns and performs humanoid motions from video-based motion capture using only a smartphone camera, without professional motion capture equipment. ROBOTIS plans to release an open-source motion generation and learning pipeline for AI Sapiens, enabling users to generate humanoid motions from video and bring them to the real robot.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://ai.robotis.com/\">ROBOTIS<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"utwezllzulk\">NAO LIVES!<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://maxtronics.com/en/nao6/\">Maxtronics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"thfs0xlallu\"><em>Tumblenauts are a swarm of minimalist, bacteria-inspired robots designed for collaborative inspection of pressurized microgravity habitats such as the International Space Station. Unlike current intra-vehicular robots that rely on complex actuator-dense mechanisms for precise motion, the Tumblenauts use a stochastic run-and-tumble locomotion and collective cooperation inspired by bacterial colonies.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://ssr.princeton.edu/\">Self-Organizing Swarms and Robotics Lab<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"_xbeim3jfoc\"><em>LUMOS Robotics Founder and CEO Yu Chao officially introduces Project EDGE—inviting global builders, universities, robotics labs, and creative technologists to explore the future of humanoid robotics together. To supercharge the global developer community, we are providing 100 complimentary LUMOS NIX robots to selected global partners.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.lumosbot.tech/project-edge/index.html\">Lumos Robotics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"oishy9bus7m\"><em>How do you progress from early childhood computational thinking to advanced high school robotics? Sphero’s product offerings are intentionally scaffolded to scale for students by building critical skills and concepts at every grade level.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://sphero.com/\">Sphero<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div>"}, {"title": "Gatik to bring autonomous freight to PepsiCo’s North American supply chain", "source": "Robotics Business Review", "date": "2026-06-12", "url": "https://www.therobotreport.com/gatik-brings-autonomous-freight-pepsico-north-american-supply-chain/", "summary": "<p>The partnership focuses on PepsiCo’s regional transportation networks, where it moves products daily from site to site.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/gatik-brings-autonomous-freight-pepsico-north-american-supply-chain/\">Gatik to bring autonomous freight to PepsiCo&#8217;s North American supply chain<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "AI in warehousing: Akash Gupta’s vision for the future", "source": "Robotics Business Review", "date": "2026-06-12", "url": "https://www.therobotreport.com/ai-in-warehousing-akash-guptas-vision-for-the-future/", "summary": "<p>Explore how GreyOrange's software revolutionizes warehouse automation with AI, transforming logistics into dynamic, predictive ecosystems.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/ai-in-warehousing-akash-guptas-vision-for-the-future/\">AI in warehousing: Akash Gupta&#8217;s vision for the future<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "MassRobotics announces the winners of 2026 Robotics Medal and Rising Star awards", "source": "Robotics Business Review", "date": "2026-06-12", "url": "https://www.therobotreport.com/massrobotics-announces-winners-2026-robotics-medal-rising-star-awards/", "summary": "<p>Allison Okamura and Ayoung Kim won MassRobotics' 2026 Robotics Medal and Rising Star Medal, which honor women in robotics.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/massrobotics-announces-winners-2026-robotics-medal-rising-star-awards/\">MassRobotics announces the winners of 2026 Robotics Medal and Rising Star awards<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Robotics Summit panel explores the state of humanoid robot design", "source": "Robotics Business Review", "date": "2026-06-12", "url": "https://www.therobotreport.com/robotics-summit-panel-explores-state-humanoid-robot-design/", "summary": "<p>At the Robotics Summit &#038; Expo, experts weighed in on humanoid robotics today — and the ability to achieve a $20,000 price point tomorrow.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/robotics-summit-panel-explores-state-humanoid-robot-design/\">Robotics Summit panel explores the state of humanoid robot design<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Defining Autonomy for Wellness Robots in Senior Care", "source": "IEEE Spectrum Robotics", "date": "2026-06-11", "url": "https://content.knowledgehub.wiley.com/wellness-robots-and-the-path-to-full-autonomy-a-new-paradigm-in-ai-powered-senior-care/", "summary": "<img src=\"https://spectrum.ieee.org/media-library/dreamface-technologies-llc-logo-with-abstract-silver-face-and-circles-on-teal-background.png?id=66892687&amp;width=980\" /><br /><br /><p>An examination of how socially assistive wellness robots could support the seven dimensions of senior wellness, and how a framework can measure their autonomy.<\/p><p>What Attendees will Learn<\/p><ol><li><span>Why the senior care crisis exceeds incremental automation. Demographic pressure, workforce shortages, and a daily wellness-programming gap all strain traditional care models.<\/span><\/li><li><span>What defines a wellness robot as a category. The seven ICAA wellness dimensions and eight properties separate these robots from companion and medical devices.<\/span><\/li><li><span>How autonomy can be measured with CRAS. This six-level scale, modeled on the SAEJ3016 driving standard, evaluates four care dimensions.<\/span><\/li><li><span>What maps the road to full autonomy. The paper examines technical capabilities, clinical evidence, and a three-phase roadmap toward the early 2030s.<\/span><\/li><\/ol><div><span><a href=\"https://content.knowledgehub.wiley.com/wellness-robots-and-the-path-to-full-autonomy-a-new-paradigm-in-ai-powered-senior-care/\" target=\"_blank\">Download this free whitepaper now!<\/a><\/span><\/div>"}, {"title": "Hello Robot is recognized by World Economic Forum as a tech pioneer", "source": "Robotics Business Review", "date": "2026-06-11", "url": "https://www.therobotreport.com/hello-robot-is-recognized-by-world-economic-forum-as-a-tech-pioneer/", "summary": "<p>The World Economic Forum has honored Hello Robot, whose Stretch system provides mobile manipulation to older adults and people with disabilities.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/hello-robot-is-recognized-by-world-economic-forum-as-a-tech-pioneer/\">Hello Robot is recognized by World Economic Forum as a tech pioneer<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Inside XRZero-G0, a new 2,000-hour open dataset for robotics research", "source": "Robotics Business Review", "date": "2026-06-11", "url": "https://www.therobotreport.com/inside-xrzero-g0-a-new-2000-hour-open-dataset-for-robotics-research/", "summary": "<p>X Square Robot has open-sourced XRZero-G0, a framework that reduces real-robot training data requirements by up to 20x.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/inside-xrzero-g0-a-new-2000-hour-open-dataset-for-robotics-research/\">Inside XRZero-G0, a new 2,000-hour open dataset for robotics research<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "NEURA Robotics to raise up to $1.4B in Series C funding for physical AI", "source": "Robotics Business Review", "date": "2026-06-10", "url": "https://www.therobotreport.com/neura-robotics-raise-up-1-4b-in-series-c-funding-physical-ai/", "summary": "<p>NEURA Robotics plans to expand its platforms for robot learning and global production of humanoids and other systems.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/neura-robotics-raise-up-1-4b-in-series-c-funding-physical-ai/\">NEURA Robotics to raise up to $1.4B in Series C funding for physical AI<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Robotics will not have a clean Llama moment", "source": "Robotics Business Review", "date": "2026-06-10", "url": "https://www.therobotreport.com/robotics-will-not-have-a-clean-llama-moment/", "summary": "<p>The Llama moment in robotics will not be the day a policy becomes downloadable. It will be the day another team can take that policy, adapt it to its robot, release it into a customer process, and still know what failed weeks later when the line stops repeating.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/robotics-will-not-have-a-clean-llama-moment/\">Robotics will not have a clean Llama moment<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "For Robotaxis, Safety Must Be Built In, Not Bolted On", "source": "NVIDIA Robotics", "date": "2026-06-10", "url": "https://blogs.nvidia.com/blog/halos-os-robotaxi-safety/", "summary": "A car pulls up to the curb. The app says, “Your ride is here.” No one’s in the driver’s seat. For people who live in one of the dozens of cities now hosting robotaxi services, this is already a reality. The robotaxi industry has moved from prototype milestones to commercial operations, with an expanding ecosystem [&#8230;]"}, {"title": "Beyond Dexterity: Why Contact May Define the Next Era of Robotics", "source": "IEEE Spectrum Robotics", "date": "2026-06-09", "url": "https://spectrum.ieee.org/agilink-contact-intelligence-robot-manipulation", "summary": "<img src=\"https://spectrum.ieee.org/media-library/humanoid-robot-with-four-arms-holding-a-red-balloon-sculpture-at-a-tech-expo.jpg?id=66870200&amp;width=1245&amp;height=700&amp;coordinates=0%2C0%2C0%2C1\" /><br /><br /><p><em>This article is brought to you by <a href=\"https://www.agilink-ai.com/\" target=\"_blank\">AGILINK<\/a>.<\/em><\/p><p>Throughout the exhibition hall at the 2026 IEEE International Conference on Robotics (ICRA), in Vienna, one demonstration seemed to attract a disproportionate amount of attention.<\/p><p>Two robotic hands were making a balloon dog. Slowly and deliberately, the robot twisted a long balloon into loops, bends, and joints without popping it. Visitors stopped, watched, and often returned with colleagues to watch again.<\/p><p class=\"shortcode-media shortcode-media-rebelmouse-image\"> <img alt=\"Crowd at a robotics expo watches a humanoid robot demonstrate its arm movements.\" class=\"rm-shortcode\" id=\"821bd\" src=\"https://spectrum.ieee.org/media-library/crowd-at-a-robotics-expo-watches-a-humanoid-robot-demonstrate-its-arm-movements.jpg?id=66870218&amp;width=980\" /> <small class=\"image-media media-caption\">AGILINK’s balloon dog demonstration draws a crowd at ICRA 2026.<\/small><small class=\"image-media media-photo-credit\">AGILINK<\/small><\/p><p>At first glance, the demonstration appeared almost playful. Among roboticists, however, balloon twisting is widely recognized as an unusually difficult manipulation task.<\/p><p>A balloon is lightweight, highly deformable, slippery, and extremely sensitive to force. Every twist changes its geometry and internal pressure, turning a seemingly simple activity into a continuously changing physical interaction problem.<\/p><p>Humans navigate those changes almost intuitively. While making a balloon animal, people rarely think consciously about force regulation, slip prevention, or contact stability. They simply adjust.<\/p><p>For robots, those adjustments remain remarkably difficult. The challenge is not merely moving fingers to the right positions. The harder part is maintaining stable interaction while the object itself is changing.<\/p><p class=\"shortcode-media shortcode-media-youtube\"> <span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><small class=\"image-media media-caption\">Highlights from AGILINK’s ICRA 2026 demonstrations, including visuotactile sensing, in-hand manipulation, balloon-animal shaping, and other contact-rich tasks enabled by the company’s latest OmniHand platform.<\/small><small class=\"image-media media-photo-credit\">AGILINK<\/small><\/p><p>That distinction helps explain why the balloon dog drew so much attention in Vienna. What appeared to be a dexterity demonstration was, in many ways, a demonstration about contact itself.<\/p><p>As robotic manipulation continues to advance, a growing number of researchers are arriving at a similar conclusion: many of the hardest problems in robotics begin only after contact occurs.<\/p><h2>Motion and Contact Intelligence for Robot Manipulation<\/h2><p>Balloon twisting combines two challenges that robotics has traditionally struggled to solve simultaneously: long-horizon task execution and contact-rich manipulation.<\/p><p>The first concerns motion.<\/p><p>A balloon dog is not created through a single grasp or twist. It emerges through a carefully ordered sequence of manipulations, each setting the conditions for what follows. A small rotational error introduced early may appear insignificant at first, yet several steps later it can prevent the final structure from forming altogether.<\/p><p>In that sense, balloon twisting is a long-horizon task. Success depends not only on performing individual actions correctly, but also on preserving the future feasibility of the entire manipulation process.<\/p><p>To address this challenge, <a href=\"https://www.agilink-ai.com/\" target=\"_blank\">AGILINK<\/a> began by collecting demonstrations from professional balloon artists. Human actions were mapped onto robotic hands to establish an initial manipulation policy. But successful demonstrations alone were insufficient.<\/p><p>In practice, some of the most valuable learning occurred when execution began to drift toward failure. Whenever instability emerged, human operators intervened and corrected the manipulation in real time. Those interventions were recorded and incorporated into reinforcement-learning cycles, allowing the system to learn not only how successful demonstrations unfold, but also how experienced operators recover when things start to go wrong.<\/p><p>Through this process, the robot gradually acquired the capabilities required for long-horizon task execution—a collection of abilities that AGILINK groups under the term <strong>motion intelligence<\/strong>: the ability to generate actions, coordinate bimanual behaviors, and execute extended manipulation sequences under real-world uncertainty.<\/p><p class=\"shortcode-media shortcode-media-rebelmouse-image\"> <img alt=\"Two robotic hands, one white open palm and one black forming an OK gesture, on display.\" class=\"rm-shortcode\" id=\"779ba\" src=\"https://spectrum.ieee.org/media-library/two-robotic-hands-one-white-open-palm-and-one-black-forming-an-ok-gesture-on-display.png?id=66870278&amp;width=980\" /> <small class=\"image-media media-caption\">OmniHand 3 Ultra-M on display at ICRA 2026.<\/small><small class=\"image-media media-photo-credit\">AGILINK<\/small><\/p><p>Yet motion alone does not explain why balloon twisting remains difficult. The second challenge is contact.<\/p><p>The robot must continuously regulate force, adjust contact locations, and respond to subtle changes in the object’s state. These decisions are difficult to encode through explicit rules. Even skilled human operators often rely on tactile intuition developed through experience rather than consciously articulated strategies.<\/p><p>Analysis of those interventions revealed that many failures did not originate from incorrect action sequences, but from the breakdown of contact itself.<\/p><p>To better capture those interaction dynamics, AGILINK collected contact-centric intervention data and incorporated those interactions into reinforcement-learning training. Rather than learning only which motions to perform, the system also learned how humans maintain stability when contact conditions begin to deteriorate.<\/p><p>AGILINK describes this capability as <strong>contact intelligence<\/strong>: the ability to establish, maintain, and adapt physical interaction as force distribution, friction, deformation, and contact geometry continuously evolve.<\/p><p>The distinction between the two capabilities is subtle but important. Motion intelligence determines what the robot intends to do. Contact intelligence determines whether it can continue doing it. For balloon twisting, both are necessary. One provides the sequence of actions. The other keeps those actions physically viable.<\/p><p class=\"shortcode-media shortcode-media-rebelmouse-image\"> <img alt=\"Robot makes balloon animal for visitor at tech expo booth.\" class=\"rm-shortcode\" id=\"431a1\" src=\"https://spectrum.ieee.org/media-library/robot-makes-balloon-animal-for-visitor-at-tech-expo-booth.jpg?id=66870268&amp;width=980\" /> <small class=\"image-media media-caption\">YouTuber KhanFlicks follows OmniHand’s motions while learning to fold a balloon dog at the AGILINK booth.<\/small><small class=\"image-media media-photo-credit\">AGILINK<\/small><\/p><p>Between a balloon slipping away and a balloon bursting lies a narrow region of stability. Successful manipulation depends on finding that region—and remaining within it throughout the task.<\/p><h2>Introducing the OmniHand 3 Ultra-M Dexterous Hand<\/h2><p>The balloon dog demonstration showcased a manipulation capability. It also revealed a broader question. How much contact intelligence can be achieved through learning alone? A robot can only regulate what it can perceive. It can only respond as quickly as its hardware allows.<\/p><p>As manipulation tasks become increasingly complex, researchers are finding that progress depends not only on better policies, but also on richer sensing and faster physical response.<\/p><p>That realization formed the backdrop for AGILINK’s second major announcement at ICRA 2026. Alongside the balloon dog demonstration, the company introduced the <strong><a href=\"https://www.agilink-ai.com/ultra-m.html\" target=\"_blank\">OmniHand 3 Ultra-M<\/a><\/strong>.<\/p><p class=\"shortcode-media shortcode-media-rebelmouse-image\"> <img alt=\"Two robotic hands beside a human hand, all raised open on a display table.\" class=\"rm-shortcode\" id=\"e7eda\" src=\"https://spectrum.ieee.org/media-library/two-robotic-hands-beside-a-human-hand-all-raised-open-on-a-display-table.jpg?id=66870269&amp;width=980\" /> <small class=\"image-media media-caption\">OmniHand 3 Ultra-M closely matches the size of an adult human hand.<\/small><small class=\"image-media media-photo-credit\">AGILINK<\/small><\/p><p>The two exhibits represented different stages of the same technological trajectory. If the balloon dog demonstrated what contact intelligence can already accomplish today, Ultra-M was designed to explore what contact intelligence may require next.<\/p><h2>Building Hardware for Contact Intelligence<\/h2><p>Roughly the size of an adult human hand, the <a href=\"https://www.agilink-ai.com/uploads/upload/files/20260530/a7b12675ce5e3b4e9b913801c0c6f659.pdf\" target=\"_blank\">OmniHand 3 Ultra-M integrates 20 active degrees of freedom<\/a> within a human-scale form factor.<\/p><p>Its most distinctive feature is a fully direct-drive architecture. By adopting direct-drive actuation throughout the system, the hand is designed to enable faster and more transparent force regulation and higher force-control bandwidth, enabling faster response as contact conditions change. For contact-rich manipulation, responsiveness can be as important as sensing itself.<\/p><p class=\"pull-quote\">By adopting direct-drive actuation throughout the system, the OmniHand 3 Ultra-M  is designed to enable faster and more transparent force regulation and higher force-control bandwidth, enabling faster response as contact conditions change.<\/p><p>The platform also incorporates tactile sensing across nearly the entire hand. Each fingertip contains a miniature vision-based tactile sensor, while more than 300 three-dimensional tactile sensing points are distributed throughout the palm. Together, they provide information not only about where contact occurs, but how contact is evolving.<\/p><p>The system is designed to estimate pressure distribution, shear forces, local deformation, slip tendencies, and other interaction dynamics that often remain invisible to conventional position-based control systems.<\/p><p>According to AGILINK’s tests, individual sensors achieve force resolution of approximately 0.005 N—roughly equivalent to detecting the weight of a sheet of paper resting on a fingertip. Spatial resolution reaches approximately 0.04 mm, while sensing density approaches 50,000 sensing points per square centimeter.<\/p><p class=\"shortcode-media shortcode-media-rebelmouse-image\"> <img alt=\"Robot arm delicately holds a feather, inset shows colorful dotted texture close-up.\" class=\"rm-shortcode\" id=\"8f1f1\" src=\"https://spectrum.ieee.org/media-library/robot-arm-delicately-holds-a-feather-inset-shows-colorful-dotted-texture-close-up.png?id=66870273&amp;width=980\" /> <small class=\"image-media media-caption\">OmniHand 3 Ultra-M recognizes feather texture through vision-based tactile sensing.<\/small><small class=\"image-media media-photo-credit\">AGILINK<\/small><\/p><p>For dexterous robots, contact has traditionally been a largely hidden process. Ultra-M is designed to make that process more observable.<\/p><p>Rather than simply detecting that contact has occurred, the system attempts to resolve where interaction is happening, how forces are distributed, whether instability is beginning to emerge, and how manipulation strategies should adapt in response.<\/p><p>The balloon dog offered a glimpse of what contact intelligence can already accomplish. Ultra-M explores a different question: what capabilities may be required to push contact intelligence further?<\/p><h2>The Physical World Remains the Hardest Benchmark<\/h2><p>The significance of contact intelligence extends far beyond balloon animals. Many tasks that continue to resist automation involve unstable or deformable interaction: cable insertion, garment handling, flexible packaging, delicate assembly, connector mating, tool use, and household manipulation.<\/p><p>These tasks are difficult not because robots cannot reach the correct location, but because maintaining stable interaction after contact begins remains extraordinarily hard.<\/p><p>For decades, robotics achieved many of its successes by reducing uncertainty. Factories were engineered to make robotic motion predictable, repeatable, and highly structured. The physical world behaves differently.<\/p><p class=\"pull-quote\">A growing share of robotics research is shifting toward interaction itself—understanding how robots can establish, maintain, and adapt physical contact within environments that remain fundamentally unpredictable.<\/p><p>Objects shift. Materials deform. Friction changes. Contact evolves. Real environments rarely follow scripts. Seen through that lens, the balloon dog was never really about the balloon dog. What attracted attention at ICRA was not simply a visually impressive demonstration, but what it revealed: intelligence in the physical world is ultimately measured through interaction.<\/p><p>As motion generation continues to mature, a growing share of robotics research is shifting toward interaction itself—understanding how robots can establish, maintain, and adapt physical contact within environments that remain fundamentally unpredictable.<\/p><p>For robots moving beyond structured environments and into less predictable real-world settings, managing contact may become as important as motion itself.<\/p>"}, {"title": "How JPL Keeps the 13-Year-Old Curiosity Rover Doing Science", "source": "IEEE Spectrum Robotics", "date": "2026-06-09", "url": "https://spectrum.ieee.org/curiosity-rover-jpl-mars-science", "summary": "<img src=\"https://spectrum.ieee.org/media-library/a-large-robotic-rover-on-reddish-martian-soil.jpg?id=66880331&amp;width=1245&amp;height=700&amp;coordinates=0%2C156%2C0%2C157\" /><br /><br /><p>Thirteen years ago last August, I was <a href=\"https://spectrum.ieee.org/msl-what-to-expect-on-sunday-night\" target=\"_self\">camped out<\/a> in NASA’s Jet Propulsion Laboratory press room in Pasadena, Calif., waiting to see whether the Curiosity rover would survive its descent and skycrane-assisted landing on the surface of Mars. It did, and <a href=\"https://spectrum.ieee.org/curiosity-rover-alive-and-well-on-surface-of-mars\" target=\"_self\">it was awesome<\/a>.<\/p><p>Since then, Curiosity (also known as Mars Science Laboratory) has <a href=\"https://science.nasa.gov/mission/msl-curiosity/location-map/\" rel=\"noopener noreferrer\" target=\"_blank\">traveled nearly 37 kilometers<\/a>, drilled into and sampled <a href=\"https://science.nasa.gov/resource/curiositys-42-drill-holes/\" rel=\"noopener noreferrer\" target=\"_blank\">42 different rocks<\/a>, and as of publication has snapped nearly <a href=\"https://mars.nasa.gov/msl/multimedia/raw-images/?order=sol+desc%2Cinstrument_sort+asc%2Csample_type_sort+asc%2C+date_taken+desc&amp;per_page=50&amp;page=0&amp;mission=msl\" rel=\"noopener noreferrer\" target=\"_blank\">763,000 photos<\/a>. The fact that this robot is still <a href=\"https://www.jpl.nasa.gov/news/nasas-perseverance-curiosity-panoramas-capture-two-sides-of-mars/\" rel=\"noopener noreferrer\" target=\"_blank\">hard at work<\/a>, getting <a href=\"https://www.nasa.gov/missions/mars-science-laboratory/curiosity-rover/nasas-curiosity-finds-organic-molecules-never-seen-before-on-mars/\" rel=\"noopener noreferrer\" target=\"_blank\">real science done<\/a> at the age of 13, is absolutely incredible—not only is Mars an actively hostile environment for robots, but the only kind of maintenance that JPL engineers can do is to send very, very careful software updates.<\/p><p>Nevertheless, the clever folks at JPL have managed to keep Curiosity safe, warm, mobile, and sciencing, despite well-worn wheels and less and less power every day. One of those folks is <a href=\"https://www.linkedin.com/in/alexandraholloway/\" rel=\"noopener noreferrer\" target=\"_blank\">Alexandra Holloway<\/a>, the assistant team chief for engineering operations for Curiosity, who spoke to <em><em>IEEE Spectrum<\/em><\/em> about keeping Curiosity roving, what its future looks like, and how JPL has used that experience to make rovers like Perseverance even more capable.<\/p><p><strong>How astonished should we be that after 13 years on Mars, Curiosity is not only still doing science, but actually getting more capable?<\/strong><\/p><p class=\"shortcode-media shortcode-media-rebelmouse-image rm-float-left rm-resized-container rm-resized-container-25\" style=\"float: left;\"> <img alt=\"A woman with large green eyes and a shaved head\" class=\"rm-shortcode\" id=\"f275c\" src=\"https://spectrum.ieee.org/media-library/a-woman-with-large-green-eyes-and-a-shaved-head.jpg?id=66880338&amp;width=980\" /> <small class=\"image-media media-caption\">Alexandra Holloway is the assistant team chief for engineering operations on the Curiosity Mars rover at the Jet Propulsion Laboratory.<\/small><small class=\"image-media media-photo-credit\">Alexandra Holloway<\/small><\/p><p><strong>Alexandra Holloway: <\/strong>I’m astonished! The longevity comes from a lot of ongoing work. It’s not just that Curiosity was built robustly; it’s also because we’re continuously putting in effort to ensure it can continue to have that lifespan. I think about all the different kinds of embedded systems there are, from cars to refrigerators, and none of them have the kind of longevity that we have with the rover. It’s mind-boggling, and it’s inspiring.<\/p><p><strong>Is the <\/strong><a href=\"https://robotsguide.com/robots/perseverance\" target=\"_blank\"><strong>Perseverance rover<\/strong><\/a><strong>, which is nine years younger than Curiosity, significantly different in terms of its hardware and software?<\/strong><\/p><p><strong>Holloway: <\/strong>In terms of hardware, the rovers are actually very similar. Both use a <a href=\"https://www.baesystems.com/en/article/bae-systems-rad750--single-board-computers-guide-insight-mars-landing\" target=\"_blank\">RAD 750 processor<\/a> and have the same amount of memory. However, Perseverance has an extra processor specifically for visual odometry, which allows it to drive autonomously. <a href=\"https://www.youtube.com/watch?v=Q_P0swqaZDk\" rel=\"noopener noreferrer\" target=\"_blank\">This difference reflects their primary mission designs<\/a>: Perseverance was designed for driving long distances, while Curiosity is a mission focused on sampling as it goes. So Perseverance’s onboard scheduling capabilities are there to optimize its driving. In fact, just last year, Perseverance surpassed <a href=\"https://science.nasa.gov/mission/msl-curiosity/location-map/\" rel=\"noopener noreferrer\" target=\"_blank\">Curiosity’s driving distance<\/a> after only about three years on Mars.<\/p><h2>Curiosity Rover Memory and Software Fixes<\/h2><p><strong>Do you have some examples of significant tweaks the team has made to keep Curiosity roving?<\/strong><\/p><p><strong>Holloway: <\/strong>One of my favorite examples comes from a <a href=\"https://science.nasa.gov/blog/sol-2204-curiosity-science-is-baaaack/\" rel=\"noopener noreferrer\" target=\"_blank\">processor anomaly<\/a> that happened on Sol 2172 [Ed. note: “Sol” is the term for a Martian day—about 24 hours and 40 minutes]. Curiosity has two computers, A and B. We landed on A, swapped to B due to <a href=\"https://llis.nasa.gov/lesson/11201\" rel=\"noopener noreferrer\" target=\"_blank\">a NAND memory anomaly early on (Sol 200)<\/a>. For years, we were chugging along on B, until one day there was a problem—B booted up, but it couldn’t mount its drive partition. We’d never seen this before. To preserve B’s data, we swapped back to A, which we hadn’t trusted in two thousand Sols. A also had a degraded memory, with only two gigabytes of usable storage space instead of four. We painstakingly transferred data from B over to A and then down to Earth, and eventually we ran out of stuff we wanted to transfer, which was really good, because A then started acting funny in the same way it did on Sol 200. It was acting like its memory was coming unsoldered. That’s bad. <\/p><p>We quickly swapped back to B, formatted it, and got it working again. The problem then became that we couldn’t trust A’s memory at all, but we needed a second computer as a “lifeboat” for diagnostics and transfers if B failed again. We realized we had one other place of memory: where we keep our flight software. We have four copies of the flight software (two current versions and two older versions) in different banks of very small amounts of memory, just 32 megabytes each. What if we just jettisoned the old flight software copies and used that 64-megabyte NOR memory as our file system for computer A? <\/p><p>So <a href=\"https://ieeexplore.ieee.org/document/9697661\" rel=\"noopener noreferrer\" target=\"_blank\">that’s what we did<\/a>. It was so elegant! Computer A is operating with less than 1 percent of its original memory, but we can run a mission on it. A small mission, but we haven’t had to jettison any core capabilities. We can still drive, we can manage data, we can even theoretically do science. Everything works fine, just much slower and much smaller. That flight software release was even called “<a href=\"https://www.computer.org/csdl/proceedings-article/smc-it/2021/856000a007/1ANLcTE5g3e\" rel=\"noopener noreferrer\" target=\"_blank\">R-Hope<\/a>“ because we hoped it would work.<\/p><p><strong>What are the constraints on Curiosity’s lifespan?<\/strong><\/p><p><strong>Holloway: <\/strong>Our biggest hardware challenge is <a href=\"https://spectrum.ieee.org/if-necessary-mars-rover-curiosity-could-rip-its-own-wheels-off-to-stay-mobile\" target=\"_self\">wheel wear<\/a>. It looks like we’re driving on this sandy terrain with some rocks in it, and our intuition said that we could just drive over these rocks and they’d get pushed down into the sand and it would be no big deal. But what we ended up seeing was that those little rocks are actually the tips of giant boulders buried in the sand, and they’re razor sharp. Our wheels were getting ripped apart driving over them, especially our front wheels, so <a href=\"https://www.jpl.nasa.gov/news/curiosity-adds-reverse-driving-for-wheel-protection/\" rel=\"noopener noreferrer\" target=\"_blank\">we started driving backwards<\/a>.<\/p><p>We also monitor consumables. We consider the number of times we move our actuators. That’s a consumable. Curiosity hasn’t <a href=\"https://www.nasa.gov/image-article/curiositys-dusty-selfie/\" rel=\"noopener noreferrer\" target=\"_blank\">taken a selfie<\/a> in a while, and one of the reasons is that it’s really hard on the joint actuators. Our onboard memory is a consumable, but surprisingly we’re not anywhere near our life cycle for memory. Our biggest consumable is power; we have an <a href=\"https://mars.nasa.gov/internal_resources/788/\" rel=\"noopener noreferrer\" target=\"_blank\">RTG<\/a>, a nuclear power source, which decreases its output as it ages.<\/p><p>Newer missions are flying <a href=\"https://www.qualcomm.com/snapdragon/overview\" rel=\"noopener noreferrer\" target=\"_blank\">Snapdragon<\/a> [processors], but Curiosity’s RAD 750 is a power hog. One of the things that we’ve rolled out that’s going really well is a way of reducing the amount of time we spend with the computer powered on, by harvesting time when we finish activities early and going to sleep, which lets us turn off the computers and some of the heating. Another thing we’re looking at is doing stuff in parallel when we’re on, like being able to drive or use the arm while communicating with an orbiter. <\/p><p>So power is decreasing, and that’s causing us to do all this parallelism work and become more efficient and nuanced in the way we operate. But we are not having any degraded science output at this time. Our wheels are still going, our arm is still okay for now, knock on wood. I would say maybe the bottleneck is budget.<\/p><h2>Curiosity Rover’s Impact on Future Mars Exploration<\/h2><p><strong>What have you learned from Curiosity that will improve future missions?<\/strong><\/p><p><strong>Holloway: <\/strong>As an embedded flight software person, I think about how we can change, add, or modify software capabilities during the mission. There’s definitely a sweet spot for loading and patching flight software—some of these concepts were pioneered on Spirit and Opportunity and then inherited by Curiosity and Perseverance, making it easier to understand and change the software.<\/p><p>Some of the things that I wish we had now on [the Mars Science Laboratory] include a better understanding of where our power is going. I want to see how much power each component is drawing every minute, so that we could architect a software system that could balance loads better. We have some of this information that was built in by the engineers who designed the rover, but as an operator, I want something slightly different. So if I were building a mission, I would have those discussions earlier and get operators into the room to say, “what do you want your data products to look like?”<\/p><p>The key takeaway for designing future missions is to talk to all your users early in the design process. It needs to happen upfront.<\/p><p><strong>What does Curiosity’s long-term future look like?<\/strong><\/p><p><strong>Holloway: <\/strong>That’s a conversation that happens, and it’s a really delicate one. We have a lot of science instruments, and a lot of them have to do with contact science and sampling and rely on the arm. If we lose the arm, what science can we still do? Well, we have a lot of remote sensors too, like cameras, environmental sensors, and radiation sensors. All of these things are important for the future of space exploration and humans on Mars. <\/p><p>From a power perspective, our RTG is projected to start degrading science output in the sixth extended mission, but we’re going to be fine through 2035 and potentially even beyond that. So we have a long and exciting future ahead of us. We need to figure out the best way of operating within our constraints, but we’re still kicking.<\/p>"}, {"title": "Walmart, Wing add 7 markets in drone delivery expansion", "source": "Robotics Business Review", "date": "2026-06-09", "url": "https://www.therobotreport.com/walmart-wing-add-7-markets-in-drone-delivery-expansion/", "summary": "<p>Wing plans to bring drone deliveries to Memphis, New Orleans, Philadelphia, Phoenix, San Diego, San Francisco, and Salt Lake City.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/walmart-wing-add-7-markets-in-drone-delivery-expansion/\">Walmart, Wing add 7 markets in drone delivery expansion<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Effort to establish a National Commission on Robotics advances in Congress", "source": "Robotics Business Review", "date": "2026-06-09", "url": "https://www.therobotreport.com/effort-establish-national-commission-on-robotics-advances-congress/", "summary": "<p>As the proposed National Commission on Robotics advances, industry leaders continue to call for more unified U.S. policy.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/effort-establish-national-commission-on-robotics-advances-congress/\">Effort to establish a National Commission on Robotics advances in Congress<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Standard Bots raises $200M to expand U.S. manufacturing footprint", "source": "Robotics Business Review", "date": "2026-06-09", "url": "https://www.therobotreport.com/standard-bots-raises-200m-expand-u-s-manufacturing-footprint/", "summary": "<p>Standard Bots asserted that investments in robotics are key to making U.S. manufacturing competitive on the global stage.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/standard-bots-raises-200m-expand-u-s-manufacturing-footprint/\">Standard Bots raises $200M to expand U.S. manufacturing footprint<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "ACS raises $200M to scale autonomous counter-drone system", "source": "Robotics Business Review", "date": "2026-06-08", "url": "https://www.therobotreport.com/allen-control-systems-raises-200m-for-autonomous-weapons-stations/", "summary": "<p>Allen Control Systems will use the funding to scale manufacturing and accelerate deployment of its autonomous weapon station, Bullfrog.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/allen-control-systems-raises-200m-for-autonomous-weapons-stations/\">ACS raises $200M to scale autonomous counter-drone system<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Daimon Robotics and Galbot jointly launches RobOmni for benchmarking tactile perception and dexterous manipulation", "source": "Robotics Business Review", "date": "2026-06-08", "url": "https://www.therobotreport.com/daimon-robotics-and-galbot-jointly-launches-robomni-for-benchmarking-tactile-perception-and-dexterous-manipulation/", "summary": "<p>Embodied AI is evolving from vision-centric perception toward Physical AI.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/daimon-robotics-and-galbot-jointly-launches-robomni-for-benchmarking-tactile-perception-and-dexterous-manipulation/\">Daimon Robotics and Galbot jointly launches RobOmni for benchmarking tactile perception and dexterous manipulation<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "NVIDIA and LG Group Build an AI Factory to Advance Physical AI, Mobility and AI Infrastructure", "source": "NVIDIA Robotics", "date": "2026-06-08", "url": "https://blogs.nvidia.com/blog/nvidia-and-lg-group-ai-factory/", "summary": "NVIDIA and LG Group are building an AI factory to accelerate LG Group’s next wave of AI-driven businesses, spanning robotics, autonomous driving, data center technologies and GPU cloud services. The AI factory will provide LG Group with accelerated computing infrastructure to train, simulate, validate and deploy AI-based applications across its key businesses.  The collaboration brings [&#8230;]"}, {"title": "AGIBOT holds World Challenge 2026 to see how AI models perform on real tasks", "source": "Robotics Business Review", "date": "2026-06-07", "url": "https://www.therobotreport.com/agibot-holds-world-challenge-2026-see-how-ai-models-perform-real-tasks/", "summary": "<p>AGIBOT said the industry is moving beyond simulation scores toward closed-loop testing on real robots with real tasks.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/agibot-holds-world-challenge-2026-see-how-ai-models-perform-real-tasks/\">AGIBOT holds World Challenge 2026 to see how AI models perform on real tasks<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "NVIDIA and Doosan Group Collaborate to Advance Physical AI and AI Factory Infrastructure", "source": "NVIDIA Robotics", "date": "2026-06-07", "url": "https://blogs.nvidia.com/blog/nvidia-and-doosan-group-physical-ai/", "summary": "NVIDIA and Doosan Group are expanding their collaboration to advance new opportunities across physical AI, robotics and AI factory infrastructure, spanning Doosan Robotics, Doosan Bobcat, Doosan Enerbility and Doosan Corporation Electro-Materials BG. The collaboration will bring together NVIDIA’s full-stack accelerated computing platforms with Doosan Group’s capabilities in industrial automation, power generation and advanced electronics materials [&#8230;]"}, {"title": "Robots can enhance manufacturing workers rather than replace them", "source": "Robotics Business Review", "date": "2026-06-06", "url": "https://www.therobotreport.com/robots-can-enhance-manufacturing-workers-rather-than-replace-them/", "summary": "<p>With the right AI, teleoperation, and safeguards, robotics can augment manufacturing opportunities, says one to ONE Holdings' president.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/robots-can-enhance-manufacturing-workers-rather-than-replace-them/\">Robots can enhance manufacturing workers rather than replace them<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Video Friday: Watch This Running Robot Not Fall Down Stairs", "source": "IEEE Spectrum Robotics", "date": "2026-06-05", "url": "https://spectrum.ieee.org/video-friday-humanoid-robot-running", "summary": "<img src=\"https://spectrum.ieee.org/media-library/humanoid-robot-running-down-stone-steps-in-a-green-park.gif?id=66866536&amp;width=1245&amp;height=700&amp;coordinates=0%2C0%2C0%2C0\" /><br /><br /><p>Video Friday is your weekly selection of awesome robotics videos, collected by your friends at <em>IEEE Spectrum<\/em> robotics. We also post a weekly calendar of upcoming robotics events for the next few months. Please <a href=\"mailto:automaton@ieee.org?subject=Robotics%20event%20suggestion%20for%20Video%20Friday\">send us your events<\/a> for inclusion.<\/p><h5><a href=\"https://roboticsconference.org/\">RSS 2026<\/a>: 13–17 July 2026, SYDNEY<\/h5><h5><a href=\"https://mrs.fel.cvut.cz/summer-school-2026/\">Summer School on Multi-Robot Systems<\/a>: 29 July–4 August 2026, PRAGUE<\/h5><h5><a href=\"https://actuate.foxglove.dev/\">Actuate 2026<\/a>: 18–19 August 2026, SAN FRANCISCO<\/h5><p>Enjoy today’s videos!<\/p><div class=\"horizontal-rule\"><\/div><div><span style=\"display: none;\"> <\/span><\/div><p class=\"rm-anchors\" id=\"sqlsazqkgak\">It’s been a while since a humanoid robot video actually impressed me, but the beginning of this does. <\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>Hard to know how much of that recovery was luck, though.<\/p><p>[ <a href=\"https://www.deeprobotics.cn/en\">Deep Robotics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"24itn9kfhfs\"><em>When you’re very confident in your MPC-based balance controller...<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>I feel you, buddy. And thanks for posting this. We’ve all been there, in one way or another.<\/p><p>[ <a href=\"https://groups.cs.umass.edu/daros/sample-home-page/\">DARoS Lab<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"acfgwbab5ei\"><em>GENE01 designed from scratch and sent to batch production. Two scalable lower bodies. Physical AI deployed for motor control and world-action modeling. All in three months. Generative Bionics is running.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://gbionics.ai/\">Generative Bionics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"1o8te5fjsd0\"><em>Alex, the newest humanoid robot built entirely by ‪IHMCRobotics‬, takes its first steps outdoors! This was a significant milestone for our team, especially because Alex is the first humanoid robot developed entirely by IHMC Robotics to venture outside the lab. These outdoor trials were conducted in preparation for a demonstration in Maryland, where Alex later successfully walked completely untethered.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.ihmc.us/news20251119/\">IHMC<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"oxtcmmw63t4\"><em>Built on the Enlight platform, Flexiv Mico is a compact dual-arm system engineered for safe, seamless collaboration in any workspace.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://flexiv.com/product/robot-system\">Flexiv Robotics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"gvbyvkp6k5s\">Is it weird that I’m jealous that robots can have feet that are swappable?<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://bostondynamics.com/products/atlas/\">Boston Dynamics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"w4daoeu3aas\"><em>Midweek at ICRA 2026. Cable-climbing robots that work as a squad: CCRobot-S is a team of robots with reconfigurable cable-driven manipulation that collaboratively inspect and maintain long-span bridge stay cables. Parallel operation for speed, morphological reconfiguration for reach.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://ieeexplore.ieee.org/document/11196028/\">IEEE Transactions on Robotics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"2xajzq8v9p8\">I would love to know the story behind this odd choice of hat.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://github.com/ROBOTIS-GIT\" target=\"_blank\">Robotis <\/a>]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"qyy-bwbpxbi\"><em>How did Atlas learn football—and why? Go behind the scenes of <a href=\"https://spectrum.ieee.org/the-evolution-of-robot-soccer\" target=\"_blank\">School of Football<\/a> and discover a glimpse of the Next of robotics.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>What I really want to know is, what kinds of things is it possible to do in football (<a href=\"https://spectrum.ieee.org/video-friday-rabona-soccer\" target=\"_blank\">soccer<\/a>) when your robot’s joints are not constrained by biology?<\/p><p>[ <a href=\"https://bostondynamics.com/blog/can-football-teach-a-robot-to-move/\">Boston Dynamics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div>"}, {"title": "Why deterministic real-time systems are more critical than ever in robotics", "source": "Robotics Business Review", "date": "2026-06-05", "url": "https://www.therobotreport.com/qnx-why-deterministic-real-time-systems-are-more-critical-than-ever-robotics/", "summary": "<p>Winston Leung discusses the role of QNX in robotics and AI, focusing on safety, innovation, and industry trends.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/qnx-why-deterministic-real-time-systems-are-more-critical-than-ever-robotics/\">Why deterministic real-time systems are more critical than ever in robotics<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "NVIDIA Research Unlocks Advanced Grasping, Smarter Autonomous Driving and Agent Training at Scale", "source": "NVIDIA Robotics", "date": "2026-06-03", "url": "https://blogs.nvidia.com/blog/cvpr-research-grasping-driving-agent-training/", "summary": "What makes a robot gripper useful isn’t that it can pick up one object — it’s that it can pick up the next one, and the one after that, with a tool it’s never held before.  What makes an autonomous vehicle system safe isn’t just that it can reason through a situation — it’s that [&#8230;]"}, {"title": "NVIDIA Enables the Next Era Of Physical AI Research With Agent Skills For Autonomous Vehicles, Robotics And Vision AI", "source": "NVIDIA Robotics", "date": "2026-06-03", "url": "https://blogs.nvidia.com/blog/cvpr-physical-ai-research-agent-skills/", "summary": "At CVPR, NVIDIA is unveiling new physical AI agent skills that help researchers and developers speed the development of autonomous vehicles, robots and vision AI systems. The core challenge in physical AI research isn’t simply developing stronger models. It’s building a full workflow around them — reconstructing real-world scenes, generating edge-case scenarios, training policies, evaluating [&#8230;]"}, {"title": "NVIDIA Jetson Brings Agentic AI to the Physical World", "source": "NVIDIA Robotics", "date": "2026-06-02", "url": "https://blogs.nvidia.com/blog/jetson-agentic-ai-physical-world/", "summary": "Agentic AI is getting physical. At COMPUTEX on Tuesday, NVIDIA announced NVIDIA JetPack 7.2 and NVIDIA NemoClaw support on NVIDIA Jetson. JetPack 7.2 brings agentic AI skills, Yocto project support, NVIDIA CUDA 13 on NVIDIA Jetson Orin, a substantial performance gain on Jetson AGX Orin 32GB module and Multi-Instance GPU (MIG) support on NVIDIA Jetson [&#8230;]"}, {"title": "NVIDIA Factory Operations Blueprint Gives Factories a New AI Brain", "source": "NVIDIA Robotics", "date": "2026-06-01", "url": "https://blogs.nvidia.com/blog/factory-operations-fox-blueprint-ai-brain/", "summary": "As factories move from isolated automation to plant-wide intelligence, manufacturers need AI systems that can connect live machine signals, quality systems, work instructions and operational alerts into a unified decision layer.  Today at GTC Taipei at COMPUTEX, NVIDIA announced the NVIDIA Factory Operations Blueprint (FOX) — a reference design for building an autonomous factory manager [&#8230;]"}, {"title": "How Cosmos 3 Helps Physical AI Think Before It Acts", "source": "NVIDIA Robotics", "date": "2026-06-01", "url": "https://blogs.nvidia.com/blog/cosmos-3-physical-ai-open-world-foundation-model/", "summary": ""}, {"title": "This DIY Bipedal Robot Used Pneumatic “Air-Muscles” Instead of Motors", "source": "IEEE Spectrum Robotics", "date": "2026-05-31", "url": "https://spectrum.ieee.org/shadow-walker-biped-humanoid-robot", "summary": "<img src=\"https://spectrum.ieee.org/media-library/two-photos-of-a-prototype-humanoid-robot-with-a-wooden-frame-and-wires-and-other-components-strung-on-its-body.jpg?id=66825613&amp;width=1245&amp;height=700&amp;coordinates=0%2C187%2C0%2C188\" /><br /><br /><p>In 1987, <a href=\"https://shadowrobot.com/the-story-of-our-founder-richard-greenhill/\" rel=\"noopener noreferrer\" target=\"_blank\">Richard Greenhill<\/a>, a British photographer who was fascinated by (but had no actual training in) robotics, decided he wanted to build a life-size humanoid that could do useful things, like carrying luggage. He was working at a startup called Intergalactic Robots, but he couldn’t convince anyone there to build such a machine, so he set about building one himself, in his attic.<\/p><div class=\"rm-embed embed-media\"><\/div><p>To help with his project, he organized a weekly get-together of a dozen or so like-minded folks. Every Wednesday night, his wife, Sally, would make a big pot of spaghetti, and the group would tinker with components scavenged from old printers and picked up from junkyards. They called themselves the Shadow Group. They eventually constructed several different robots, but their main project was the two-legged Shadow Walker.<\/p><p class=\"shortcode-media shortcode-media-rebelmouse-image\"> <img alt=\"Two color photos of a casually dressed white man in a workroom posing with a partially assembled wooden robot.\" class=\"rm-shortcode\" id=\"b189a\" src=\"https://spectrum.ieee.org/media-library/two-color-photos-of-a-casually-dressed-white-man-in-a-workroom-posing-with-a-partially-assembled-wooden-robot.jpg?id=66825888&amp;width=980\" /> <small class=\"image-media media-caption\">In 1987, photographer Richard Greenhill organized a weekly gathering of DIY enthusiasts to work on projects in his attic, including the Shadow Walker. <\/small><small class=\"image-media media-photo-credit\">Richard Greenhill and David Buckley<\/small><\/p><p>Greenhill’s friend <a href=\"https://davidbuckley.net/DB/aboutme.htm\" target=\"_blank\">David Buckley<\/a>, a robotics and animatronics expert he’d met at Intergalactic, sketched out a rough design based on medical textbooks of human bone structure and muscle movement. The robot’s skeleton, made of maple, was greatly simplified—only one bone in the lower leg and a single wide toe on each foot. The ankle’s double-axis design allowed for two degrees of movement. The knee had no complicating kneecap.<\/p><p>Greenhill didn’t want the robot to use motors, so its movement was controlled using compressed air to extend and contract 28 “air-muscles”—his version of a McKibben muscle, invented in the 1950s to mimic musculature with pneumatics. The muscles were connected to the bones across eight joints (hips, knees, ankles, toes), which provided 12 degrees of freedom.<\/p><p class=\"ieee-inbody-related\">RELATED: <a href=\"https://spectrum.ieee.org/the-short-strange-life-of-the-first-friendly-robot\" target=\"_self\">The Short, Strange Life of the First Friendly Robot<\/a><\/p><p>The robot’s headless torso held the control valves, electronics, and computer interfaces. It stood 168 centimeters tall and 46 cm wide and weighed about 38 kilograms. The group managed to get the robot to stand up reliably and balance itself; it could even regain its center if pushed a little. But walking turned out to be more of a challenge.<\/p><p><a href=\"https://www.linkedin.com/in/walkerrich/\" target=\"_blank\">Rich Walker<\/a> joined the group as a teenager and began writing software to get the robot to stand. He was particularly interested in using neural networks to solve balancing problems, although he ran into a number of hardware obstacles, including the unreliability of the sensors and the valves, and the robot’s overall fragility. Over time, Walker and the team developed a standard library of routines to control the robot. Walker wrote a <a href=\"https://davidbuckley.net/DB/ShadowBiped/ShadBipedArchive/Shadow%20Robot%20Company%20Shadow%20Biped.htm\" target=\"_blank\">detailed description<\/a> of the Shadow Walker in 1999, which is available on David Buckley’s website.<\/p><h2>The 1st International Robot Olympics<\/h2><p>By the time the Shadow Group began developing Shadow Walker, engineers in academia and industry had been working on robotics for several decades. The world’s first industrial robot, the <a href=\"https://spectrum.ieee.org/unimation-robot\" target=\"_self\">Unimate<\/a>, debuted in 1961, and in 1967 Donald Michie and others began building a series of <a href=\"https://spectrum.ieee.org/freddy-robot-british-ai-winter\" target=\"_self\">Freddy <\/a>robots to investigate machine intelligence. The IEEE created its first dedicated robotics organization in 1984 when it established the IEEE Robotics and Automation Council, which became the <a href=\"https://www.ieee-ras.org/\" target=\"_blank\">IEEE Robotics and Automation Society<\/a> in 1987. Also in 1987, the nonprofit International Federation of Robotics was established to promote research, development, use, and cooperation in the field of robotics.<\/p><p>As Shadow Walker pushed the limits for a DIY humanoid robot, industrial humanoids were also gaining ground. In 1986, Honda began working on its experimental (E-series) and later the prototype (P-series) humanoid robots, finally unveiling the P2 in 1996. The P2 stood 183 cm tall and weighed 210 kg. It was the first humanoid capable of stable, autonomous walking. This work eventually led to the development of the groundbreaking <a href=\"https://spectrum.ieee.org/honda-p2-robot-ieee-milestone\" target=\"_self\">ASIMO<\/a>.<\/p><p class=\"shortcode-media shortcode-media-rebelmouse-image\"> <img alt=\"Two color photos of a casually dressed bearded white man posing with a wooden robot leg and with a computer and other equipment.\" class=\"rm-shortcode\" id=\"45b6e\" src=\"https://spectrum.ieee.org/media-library/two-color-photos-of-a-casually-dressed-bearded-white-man-posing-with-a-wooden-robot-leg-and-with-a-computer-and-other-equipment.jpg?id=66826216&amp;width=980\" /> <small class=\"image-media media-caption\">Greenhill’s friend, roboticist David Buckley, consulted medical textbooks to create Shadow Walker’s humanoid design.<\/small><small class=\"image-media media-photo-credit\">Richard Greenhill and David Buckley<\/small><\/p><p>In the late 1980s, the public was both fascinated and horrified by the potential of robots. Businesses saw robots as a way to increase productivity, while workers worried they would take their jobs. Children viewed them as wondrous toys, while people with disabilities embraced them as tools of liberation. Military experts hoped robots would fight wars without endangering human soldiers, while politicians pondered if robots might eventually get to vote. Philosophers thought robots could challenge our notions of intelligence (and stupidity), while the religious struggled with concerns about the human race in a robot-dominated future.<\/p><p class=\"shortcode-media shortcode-media-rebelmouse-image rm-float-left rm-resized-container rm-resized-container-25\" style=\"float: left;\"> <img alt=\"Photo of two articulated feet made of pieces of wood strung with wires and other components.\" class=\"rm-shortcode\" id=\"528f6\" src=\"https://spectrum.ieee.org/media-library/photo-of-two-articulated-feet-made-of-pieces-of-wood-strung-with-wires-and-other-components.jpg?id=66835726&amp;width=980\" /> <small class=\"image-media media-caption\">Shadow Walker’s simplified anatomy included only one bone in the lower leg and a single wide toe on each foot.<\/small><small class=\"image-media media-photo-credit\">Science Museum Group<\/small><\/p>Peter Mowforth, cofounder of the <a href=\"https://en.wikipedia.org/wiki/Turing_Institute\" target=\"_blank\">Turing Institute<\/a> in Glasgow, noted these disparate visions for robots when he announced the 1st International Robot Olympics, to be held in 27 and 28 September 1990 and hosted by the Turing Institute and the University of Strathclyde. The Olympics would round up the world’s best robots and showcase them head-to-head.<p>Mowforth himself thought all of the competing visions of robots were overblown. Steeped in machine learning research and robotics development, he knew firsthand the limitations of the state of the art: Robots rarely worked as intended, easily broke down, and glitched over seemingly trivial problems. He envisioned the Robot Olympics as a testbed to assess what the latest generation of robots could and could not do.<\/p><p class=\"shortcode-media shortcode-media-rebelmouse-image rm-float-left rm-resized-container rm-resized-container-25\" style=\"float: left;\"> <img alt=\"Photo of a headless and armless humanoid robot wearing red pants.\" class=\"rm-shortcode\" id=\"3135a\" src=\"https://spectrum.ieee.org/media-library/photo-of-a-headless-and-armless-humanoid-robot-wearing-red-pants.jpg?id=66826230&amp;width=980\" /> <small class=\"image-media media-caption\">At the 1990 Robot Olympics, held in Glasgow, Shadow Walker wore pants to conceal its pneumatic “air-muscles” from competitors.<\/small><small class=\"image-media media-photo-credit\">Adam Hart-Davis/Science Source<\/small><\/p><p>The call for participation was wide open. Instead of having predetermined categories of competition, the organizers opted to see who applied to compete and then group them based on their claimed capabilities. In addition to picking the winners of individual events, the judges would select an overall Olympic champion based on the quality of the hardware, the sophistication of behavior, and novelty. Other prizes were given for young competitors, technologies that showed commercial potential, and design. In the end, more than 50 robots were entered, from a mix of universities, industry, and hobbyist groups from Canada, France, India, Japan, Mexico, the Soviet Union, the United States, the United Kingdom, and Yugoslavia.<\/p><p>There were plenty of disappointments. Trolleyman, a golf-cart-like wheeled robot, suffered a power failure while carrying the opening Olympic torch through the streets of Glasgow. The pile rug in the arena tripped up many robots that had been trained
