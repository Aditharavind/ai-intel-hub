port.com/walmart-wing-add-7-markets-in-drone-delivery-expansion/", "summary": "<p>Wing plans to bring drone deliveries to Memphis, New Orleans, Philadelphia, Phoenix, San Diego, San Francisco, and Salt Lake City.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/walmart-wing-add-7-markets-in-drone-delivery-expansion/\">Walmart, Wing add 7 markets in drone delivery expansion<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Effort to establish a National Commission on Robotics advances in Congress", "source": "Robotics Business Review", "date": "2026-06-09", "url": "https://www.therobotreport.com/effort-establish-national-commission-on-robotics-advances-congress/", "summary": "<p>As the proposed National Commission on Robotics advances, industry leaders continue to call for more unified U.S. policy.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/effort-establish-national-commission-on-robotics-advances-congress/\">Effort to establish a National Commission on Robotics advances in Congress<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Standard Bots raises $200M to expand U.S. manufacturing footprint", "source": "Robotics Business Review", "date": "2026-06-09", "url": "https://www.therobotreport.com/standard-bots-raises-200m-expand-u-s-manufacturing-footprint/", "summary": "<p>Standard Bots asserted that investments in robotics are key to making U.S. manufacturing competitive on the global stage.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/standard-bots-raises-200m-expand-u-s-manufacturing-footprint/\">Standard Bots raises $200M to expand U.S. manufacturing footprint<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "ACS raises $200M to scale autonomous counter-drone system", "source": "Robotics Business Review", "date": "2026-06-08", "url": "https://www.therobotreport.com/allen-control-systems-raises-200m-for-autonomous-weapons-stations/", "summary": "<p>Allen Control Systems will use the funding to scale manufacturing and accelerate deployment of its autonomous weapon station, Bullfrog.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/allen-control-systems-raises-200m-for-autonomous-weapons-stations/\">ACS raises $200M to scale autonomous counter-drone system<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Daimon Robotics and Galbot jointly launches RobOmni for benchmarking tactile perception and dexterous manipulation", "source": "Robotics Business Review", "date": "2026-06-08", "url": "https://www.therobotreport.com/daimon-robotics-and-galbot-jointly-launches-robomni-for-benchmarking-tactile-perception-and-dexterous-manipulation/", "summary": "<p>Embodied AI is evolving from vision-centric perception toward Physical AI.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/daimon-robotics-and-galbot-jointly-launches-robomni-for-benchmarking-tactile-perception-and-dexterous-manipulation/\">Daimon Robotics and Galbot jointly launches RobOmni for benchmarking tactile perception and dexterous manipulation<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "NVIDIA and LG Group Build an AI Factory to Advance Physical AI, Mobility and AI Infrastructure", "source": "NVIDIA Robotics", "date": "2026-06-08", "url": "https://blogs.nvidia.com/blog/nvidia-and-lg-group-ai-factory/", "summary": "NVIDIA and LG Group are building an AI factory to accelerate LG Group’s next wave of AI-driven businesses, spanning robotics, autonomous driving, data center technologies and GPU cloud services. The AI factory will provide LG Group with accelerated computing infrastructure to train, simulate, validate and deploy AI-based applications across its key businesses.  The collaboration brings [&#8230;]"}], "embeddedNews": [{"title": "When An Engineering Education Doesn’t Teach You How To Really Make Anything", "source": "Hackaday", "date": "2026-07-07", "url": "https://hackaday.com/2026/07/07/when-an-engineering-education-doesnt-teach-you-how-to-really-make-anything/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"549\" src=\"https://hackaday.com/wp-content/uploads/2014/12/hacking-education.jpg?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>In the sweltering temperatures of an unusually hot European heatwave, I found myself having a chat with  a friend of mine from my university days. After discussing the health of <a class=\"read-more\" href=\"https://hackaday.com/2026/07/07/when-an-engineering-education-doesnt-teach-you-how-to-really-make-anything/\">&#8230;read more<\/a>"}, {"title": "SB Mini II is a Homebrew Apple II Clone", "source": "Hackaday", "date": "2026-07-07", "url": "https://hackaday.com/2026/07/07/sb-mini-ii-is-a-homebrew-apple-ii-clone/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"450\" src=\"https://hackaday.com/wp-content/uploads/2026/07/sb-mini-ii-inside.DBeQM3Ou_Z12u12c.webp?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>On the one hand, the original Apple II has been copied over and over again since at least the early 80s, so maybe this hack is old hat to the <a class=\"read-more\" href=\"https://hackaday.com/2026/07/07/sb-mini-ii-is-a-homebrew-apple-ii-clone/\">&#8230;read more<\/a>"}, {"title": "Is Now the Time for Volumetric 3D Printing?", "source": "Hackaday", "date": "2026-07-07", "url": "https://hackaday.com/2026/07/07/is-now-the-time-for-volumetric-3d-printing/", "summary": "<div><img alt=\"Art of 3D printer in the middle of printing a Hackaday Jolly Wrencher logo\" class=\"attachment-large size-large wp-post-image\" height=\"450\" src=\"https://hackaday.com/wp-content/uploads/2020/02/3D-Printering-Header-New.jpg?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>Of all innovations adopted by the maker community within the past couple of decades, one stands among the rest on top for anything regarding manufacturing. It goes without saying here <a class=\"read-more\" href=\"https://hackaday.com/2026/07/07/is-now-the-time-for-volumetric-3d-printing/\">&#8230;read more<\/a>"}, {"title": "An Interactive Tomato Farm Overseen by AI", "source": "Hackaday", "date": "2026-07-07", "url": "https://hackaday.com/2026/07/07/an-interactive-tomato-farm-overseen-by-ai/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"330\" src=\"https://hackaday.com/wp-content/uploads/2026/07/Screenshot-2026-07-06-135444.png?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>Oh, the farming lifestyle…living off the land, fending for yourself. But who&#8217;s got time for all that? For the modern hacker, the best option in the garden space may be <a class=\"read-more\" href=\"https://hackaday.com/2026/07/07/an-interactive-tomato-farm-overseen-by-ai/\">&#8230;read more<\/a>"}, {"title": "Why the NES Put Out a Wobbly Picture", "source": "Hackaday", "date": "2026-07-07", "url": "https://hackaday.com/2026/07/07/why-the-nes-put-out-a-wobbly-picture/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"450\" src=\"https://hackaday.com/wp-content/uploads/2026/07/nes-colour-featured.jpg?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>The NTSC television standard is a masterpiece of mid-century engineering, to pack a color image into the transmission bandwidth of a monochrome one, and to do so while maintaining backward <a class=\"read-more\" href=\"https://hackaday.com/2026/07/07/why-the-nes-put-out-a-wobbly-picture/\">&#8230;read more<\/a>"}, {"title": "Belt Fed Potato Cannon Spits Spuds", "source": "Hackaday", "date": "2026-07-07", "url": "https://hackaday.com/2026/07/06/belt-fed-potato-cannon-spits-spuds/", "summary": "<div><img alt=\"The gun on its bipod.\" class=\"attachment-large size-large wp-post-image\" height=\"450\" src=\"https://hackaday.com/wp-content/uploads/2026/07/belt-fed-potato-cannon1.jpg?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>Spud guns are a staple of summertime fun for the maker set, especially on the Eagleland side of the pond, combining as they do two of our favourite things: firearms <a class=\"read-more\" href=\"https://hackaday.com/2026/07/06/belt-fed-potato-cannon-spits-spuds/\">&#8230;read more<\/a>"}, {"title": "Performance Improvements For Open-Source 80386", "source": "Hackaday", "date": "2026-07-07", "url": "https://hackaday.com/2026/07/06/performance-improvements-for-open-source-80386/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"450\" src=\"https://hackaday.com/wp-content/uploads/2026/07/386-featured.jpg?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>The Intel 80386 is a rather fascinating slice of computer history. It marked the first 32 bit X86 processor, and was a staple of early desktop computing. Like all chips, <a class=\"read-more\" href=\"https://hackaday.com/2026/07/06/performance-improvements-for-open-source-80386/\">&#8230;read more<\/a>"}, {"title": "ESP32-C5 devkit offers 2.8-inch capacitive touch display, dual-band Wi-Fi 6, Bluetooth 5 LE, LiPo battery support", "source": "CNX Software", "date": "2026-07-07", "url": "https://www.cnx-software.com/2026/07/07/esp32-c5-devkit-offers-2-8-inch-capacitive-touch-display-dual-band-wi-fi-6-bluetooth-5-le-lipo-battery-support/", "summary": "<div><img alt=\"ESP32-C5-Touch-LCD-2.8\" class=\"attachment-medium size-medium wp-post-image\" height=\"542\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/07/ESP32-C5-Touch-LCD-2.8-720x542.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Last week, I wrote about the ESP32-C5-LCD-1.47 as one of the first ESP32-C5 devkits with a built-in display enabling dual-band WiFi 6 connectivity for IoT and HMI projects. However, one reader lamented the lack of touch-capable screens, at which point kwchow pointed to the ESP32-C5-Touch-LCD-2.8 model offering just that by pairing an ESP32-C5 with a 2.8-inch IPS  display with capacitive touch and 320&#215;480 resolution. The new board also features a microSD card slot, a USB-C port for power and programming, a built-in microphone and a speaker connector, a few sensors, and various I/Os connectors for expansion. Let&#8217;s have a closer look. ESP32-C5-Touch-LCD-2.8 specifications: Wireless module – Espressif Systems ESP32-C5-WROOM-1-N32R8 SoC &#8211; ESP32-C5HR8 CPU Single-core 32-bit RISC-V processor @ up to 240 MHz Low-power RISC-V core @ 40 MHz acting as the main processor for power-sensitive applications Memory – 384 KB SRAM on-chip, 8MB PSRAM Storage – 320 KB ROM Wireless [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/07/07/esp32-c5-devkit-offers-2-8-inch-capacitive-touch-display-dual-band-wi-fi-6-bluetooth-5-le-lipo-battery-support/\">ESP32-C5 devkit offers 2.8-inch capacitive touch display, dual-band Wi-Fi 6, Bluetooth 5 LE, LiPo battery support<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Mercedes-Benz hosts open-source hardware Automotive Rapid DEvelopment Platform (ARDEP)", "source": "CNX Software", "date": "2026-07-07", "url": "https://www.cnx-software.com/2026/07/07/mercedes-benz-hosts-open-source-hardware-automotive-rapid-development-platform-ardep/", "summary": "<div><img alt=\"ARDEP V2\" class=\"attachment-medium size-medium wp-post-image\" height=\"405\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/07/ARDEP-V2-720x405.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>ARDEP (Automotive Rapid DEvelopment Platform) is an open-source hardware and software platform hosted on Mercedes-Benz&#8217;s GitHub account and released under an Apache 2.0 license. The ARDEP V2 main board is based on an STMicroelectronics STM32G474VE Arm Cortex-M4F microcontroller for motor control with CORDIC and FMAC hardware math accelerators, and features CAN-FD and LIN transceivers, while the PowerIO Shield features 6 outputs and 6 inputs supporting up to 48V and 3A per channel. ARDEP V2 specifications: MCU &#8211; STMicroelectronics STM32G474VE Arm Cortex-M4 with FPU at up to 170 MHz Math accelerators  &#8211; CORDIC for trigonometric functions and Filter Mathematical ACcelerator (FMAC) Memory &#8211; 128 KB SRAM Storage &#8211; 256 KB single-bank flash USB 1x USB Type-C &#8220;ARDEP&#8221; port 1x USB Type-C &#8220;Debugger&#8221; port Transceivers 2x CAN-FD capable transceivers, each with a common mode choke, ESD protection, and hardware-configurable 120 Ohm termination 1x LIN transceiver, software-selectable master or slave mode I/Os DB-9 [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/07/07/mercedes-benz-hosts-open-source-hardware-automotive-rapid-development-platform-ardep/\">Mercedes-Benz hosts open-source hardware Automotive Rapid DEvelopment Platform (ARDEP)<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "PocketMage – An ESP32-S3-based Personal Digital Assistant (Crowdfunding)", "source": "CNX Software", "date": "2026-07-07", "url": "https://www.cnx-software.com/2026/07/07/pocketmage-esp32-s3-personal-digital-assistant/", "summary": "<div><img alt=\"ESP32-S3 Personal Digital Assistant PDA\" class=\"attachment-medium size-medium wp-post-image\" height=\"486\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/07/ESP32-S3-Personal-Digital-Assistant-PDA-720x486.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>PocketMage is an open-source hardware, ESP32-S3 personal digital assistant (PDA) with a primary, sun-readable 3.1-inch E Ink display, a secondary 1.8-inch OLED for high-refresh rate feedback, a full tactile QWERTY keyboard, and a capacitive scroll bar. The device also features a microSD card slot for storage, a buzzer for audio/sound feedback, a USB-C port for charging the 1,200 mAh battery or connecting a USB keyboard, as well as an RTC and an FPC connector for GPIO expansion. PocketMage specifications: SoC &#8211; ESP32-S3 microcontroller with Wi-Fi and Bluetooth wireless connectivity Memory &#8211; 2 MB QSPI PSRAM Storage 16 MB QSPI flash MicroSD card slot Displays Primary 3.1-inch E Ink/e-paper display with 320&#215;240 resolution Secondary 1.8-inch OLED with 256&#215;32 resolution Audio &#8211; Piezo buzzer for beeps and boops USB &#8211; USB Type-C port for charging and peripherals like a keyboard User input Built-in tactile QWERTY keyboard Capacitive scroll bar USB keyboard support [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/07/07/pocketmage-esp32-s3-personal-digital-assistant/\">PocketMage &#8211; An ESP32-S3-based Personal Digital Assistant (Crowdfunding)<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "How NOR Flash Memory Safety Features Protect Linux Systems", "source": "Embedded.com", "date": "2026-07-07", "url": "https://www.embedded.com/how-nor-flash-memory-safety-features-protect-linux-systems/", "summary": "<p>Utilizing the safety features in NOR flash memories such as error correction and data integrity checks can enhance the reliability and integrity of Linux-based applications, particularly in safety-critical domains such as automotive (e.g., in-vehicle infotainment, advanced-driver assistance systems, telematics) and industrial automation (e.g., HMI panels). Linux, an open-source operating system, maintains initiatives that support safety-critical [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/how-nor-flash-memory-safety-features-protect-linux-systems/\">How NOR Flash Memory Safety Features Protect Linux Systems<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "Syslogic, Ark Vision Partner on Rugged Edge AI Hardware", "source": "Embedded.com", "date": "2026-07-07", "url": "https://www.embedded.com/syslogic-ark-vision-partner-on-rugged-edge-ai-hardware/", "summary": "<p>Syslogic and Ark Vision Systems have announced a collaboration to deliver a fully integrated hardware platform for edge AI applications. The joint solution combines Ark Vision Systems' GMSL2 machine vision cameras with Syslogic's rugged embedded computers, providing developers with a ready-to-deploy hardware foundation for industrial automation, agriculture, mobility, robotics, and other environments that require reliable [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/syslogic-ark-vision-partner-on-rugged-edge-ai-hardware/\">Syslogic, Ark Vision Partner on Rugged Edge AI Hardware<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "JP’s Product Pick of the Week — 4pm Eastern TODAY! 7/7/26 @adafruit #adafruit #newproductpick", "source": "Adafruit", "date": "2026-07-07", "url": "https://blog.adafruit.com/2026/07/07/jps-product-pick-of-the-week-4pm-eastern-today-7-7-26-adafruit-adafruit-newproductpick/", "summary": "Come on by for JP&#8217;s Product Pick of The Week ! A new product pick will be revealed. The show airs at 4pm ET / 1pm PT, TODAY! Check out the livestream right here inside this product page you won&#8217;t want to miss it because there will be a BEEEG DISCOUNT during the show! Tune [&#8230;]"}, {"title": "Designing a personal Pebble watchface", "source": "Adafruit", "date": "2026-07-07", "url": "https://blog.adafruit.com/2026/07/07/designing-a-personal-pebble-watchface/", "summary": "Jonas Hietala recently got a Pebble Time 2 and wanted to create a custom watchface for his specific problems. It took more effort to design the watch than I had anticipated and there’s a deceptively large amount of thought that has gone into some of the features here, so I thought it’d be interesting to [&#8230;]"}, {"title": "Visual Basic on the PC with Windows 3.1", "source": "Adafruit", "date": "2026-07-07", "url": "https://blog.adafruit.com/2026/07/07/visual-basic-on-the-pc-with-windows-3-1/", "summary": "Christopher Drum on the Stone Tools blog takes a look back at Visual Basic on the PC using the Windows 3.1 operating system. A while back, I dug into Apple&#8217;s HyperCard. Visual Basic gives us an interesting opportunity to look at a similar first-party, visual programming solution from Microsoft&#8217;s perspective. Like HyperCard, Visual Basic had its own dedicated magazine, and inspired legions of developers [&#8230;]"}, {"title": "ICYMI Python on Microcontrollers Newsletter: ScrollKit for your LED Matrices, AI Tools, Device Security and More!", "source": "Adafruit", "date": "2026-07-07", "url": "https://blog.adafruit.com/2026/07/07/icymi-python-on-microcontrollers-newsletter-scrollkit-for-your-led-matrices-ai-tools-device-security-and-more/", "summary": "If you missed this week’s Python on Microcontrollers Newsletter, here is the ICYMI (in case you missed it) version. To never miss another issue, subscribe now! – You’ll get a terrific newsletter each Monday (which is out before this post). 12,366 subscribers worldwide! The next newsletter goes out Monday morning and subscribing is the best way to keep [&#8230;]"}, {"title": "Marble Machine Phone Case", "source": "Adafruit", "date": "2026-07-07", "url": "https://blog.adafruit.com/2026/07/07/marble-machine-phone-case/", "summary": "Strange Inventions 3d printed a phone case that&#8217;s also a marble machine! I&#8217;m laughing out loud at &#8220;built in filter&#8221;. Check out the project video over on YouTube."}, {"title": "Deal between 3PEAK and Anglia delivers cost effective drop-in analog parts with increased functionality", "source": "EE Journal", "date": "2026-07-07", "url": "https://www.eejournal.com/industry_news/deal-between-3peak-and-anglia-delivers-cost-effective-drop-in-analog-parts-with-increased-functionality/", "summary": "Anglia Components, one of Europe’s longest-established, independent, authorised distributors of electronic components, has signed a distribution deal with 3PEAK Incorporated, semiconductor company focusing on high-performance, high-quality, and highly reliable ICs, including signal chain, power management, and mixed-signal front-ends. Immediately attractive to UK and EU customers will be 3PEAK’s wide range of analog parts which are &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/deal-between-3peak-and-anglia-delivers-cost-effective-drop-in-analog-parts-with-increased-functionality/\">Read More &#8594;<span class=\"screen-reader-text\"> \"Deal between 3PEAK and Anglia delivers cost effective drop-in analog parts with increased functionality\"<\/span><\/a>"}, {"title": "Portwell Introduces PCOM-B65C COM Express® Module Powered  by AMD Ryzen™ Embedded 8000 Series Processors for Diverse  Edge AI and Embedded Applications", "source": "EE Journal", "date": "2026-07-07", "url": "https://www.eejournal.com/industry_news/portwell-introduces-pcom-b65c-com-express-module-powered-by-amd-ryzen-embedded-8000-series-processors-for-diverse-edge-ai-and-embedded-applications/", "summary": "Portwell, Inc., a global innovator in industrial and embedded computing  solutions, announced the launch of PCOM-B65C, a high-performance COM Express® Type 6 Compact module  powered by the NPU-integrated AMD Ryzen™ Embedded 8000 Series processors. Designed in compliance with the  PICMG COM Express® R3.1 specification, PCOM-B65C combines robust computing, graphics, and AI acceleration  with integrated Out-of-Band &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/portwell-introduces-pcom-b65c-com-express-module-powered-by-amd-ryzen-embedded-8000-series-processors-for-diverse-edge-ai-and-embedded-applications/\">Read More &#8594;<span class=\"screen-reader-text\"> \"Portwell Introduces PCOM-B65C COM Express® Module Powered  by AMD Ryzen™ Embedded 8000 Series Processors for Diverse  Edge AI and Embedded Applications\"<\/span><\/a>"}, {"title": "DDR-Free Architecture Keeps BitFlow Frame Grabbers Available Amid Global Memory Crisis", "source": "EE Journal", "date": "2026-07-07", "url": "https://www.eejournal.com/industry_news/ddr-free-architecture-keeps-bitflow-frame-grabbers-available-amid-global-memory-crisis/", "summary": "As the global DRAM shortage enters a critical phase, driven by insatiable AI data center demand consuming upwards of 70% of worldwide memory production, frame grabber manufacturers dependent on onboard DDR4 memory are facing lead times exceeding 20–30 weeks, allocation rationing, and, in many cases, complete product unavailability. BitFlow, Inc., a division of Advantech, is &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/ddr-free-architecture-keeps-bitflow-frame-grabbers-available-amid-global-memory-crisis/\">Read More &#8594;<span class=\"screen-reader-text\"> \"DDR-Free Architecture Keeps BitFlow Frame Grabbers Available Amid Global Memory Crisis\"<\/span><\/a>"}, {"title": "The Dawn of Agentic AI Super-Agents", "source": "EE Journal", "date": "2026-07-07", "url": "https://www.eejournal.com/article/the-dawn-of-agentic-ai-super-agents/", "summary": "<img alt=\"\" class=\"webfeedsFeaturedVisual wp-post-image\" height=\"300\" src=\"https://www.eejournal.com/wp-content/uploads/2026/07/max-0498-image-for-home-page-cadence-chipstack-300x300.jpg\" style=\"display: block; margin-bottom: 5px; clear: both;\" width=\"300\" />On the one hand, I think I’m taking the incredible advances we’re currently seeing in Electronic Design Automation (EDA) tools in my stride, striving to maintain a dignified persona as the latest and greatest marvels unfold before my eyes. On the other hand, I sometimes find it hard to restrain myself from exclaiming, “Wow!” or &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/article/the-dawn-of-agentic-ai-super-agents/\">Read More &#8594;<span class=\"screen-reader-text\"> \"The Dawn of Agentic AI Super-Agents\"<\/span><\/a>"}, {"title": "Beelink EQi Wildcat Lake Core 3 304 mini PC review – Part 1: Specifications, unboxing, teardown, and first boot", "source": "CNX Software", "date": "2026-07-06", "url": "https://www.cnx-software.com/2026/07/06/beelink-eqi-wildcat-lake-core-3-304-mini-pc-review-part-1-specifications-unboxing-teardown-and-first-boot/", "summary": "<div><img alt=\"Beelink EQi Wildcat Lake Core 3 304 review\" class=\"attachment-medium size-medium wp-post-image\" height=\"551\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/07/Beelink-EQi-Wildcat-Lake-Core-3-304-review-720x551.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>We&#8217;ve received our first Wildcat Lake hardware for review, as Beelink has sent us an EQi mini PC powered by the Intel Core 3 304 entry-level 5-core processor with a 15 TOPS AI accelerator. The mini PC ships with either 16GB of LPDDR5 (soldered-on) or 24GB/32GB of DDR5 (SO-DIMM) memory and 512GB UFS 3.1 storage. It also features two M.2 Key-M PCIe Gen4 sockets, 10GbE and 2.5GbE RJ45 ports, WiFI 6 and Bluetooth 5.2 connectivity, three display outputs via HDMI and USB4 ports, and more. We&#8217;ll start the review by listing the specifications, checking out the hardware with an unboxing and a teardown, before giving it a quick try with Windows 11 Pro. In the second part of the review, we&#8217;ll focus on Windows 11 Pro, with feature testing and benchmarks, before switching to Ubuntu 26.04 to test a recent Linux distribution on a Wildcat Lake mini PC. Beelink EQi [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/07/06/beelink-eqi-wildcat-lake-core-3-304-mini-pc-review-part-1-specifications-unboxing-teardown-and-first-boot/\">Beelink EQi Wildcat Lake Core 3 304 mini PC review &#8211; Part 1: Specifications, unboxing, teardown, and first boot<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Tiny Calixto Systems AM62L STAMP SOM targets industrial automation, HMI applications, EV chargers", "source": "CNX Software", "date": "2026-07-06", "url": "https://www.cnx-software.com/2026/07/06/tiny-calixto-systems-am62l-stamp-som-targets-industrial-automation-hmi-applications-ev-chargers/", "summary": "<div><img alt=\"AM62L STAMP SOM and Evaluation Kit\" class=\"attachment-medium size-medium wp-post-image\" height=\"480\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/07/AM62L-STAMP-SOM-and-Evaluation-Kit-720x480.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Calixto Systems has introduced the AM62L STAMP SOM, a tiny (40x40mm) system-on-module around the Texas Instruments AM62L dual-core Arm Cortex-A53 CPU running at up to 1.25 GHz, along with an evaluation kit. Designed for embedded Linux applications, the module targets industrial automation, HMIs, EV chargers, and smart retail. Calixto AM62L STAMP SOM The SoM integrates up to 2GB LPDDR4x RAM and 8GB or 16GB eMMC storage, along with Gigabit Ethernet, two USB 2.0 OTG interfaces, dual SD interfaces, MIPI DSI and parallel RGB display support, McASP audio, and a wide range of industrial I/Os, including CAN FD, eight UARTs, four SPI buses, five I2C buses, ADC, DAC, PWM, GPIO, and a GPMC interface. It also integrates hardware security features such as AES encryption, RSA/ECC acceleration, DRBG, TRNG, and a unique device ID for secure embedded applications. AM62L STAMP SOM specifications: SoC – Texas Instruments Sitara AM62Lx single-core/dual-core Arm Cortex-A53 processor @ [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/07/06/tiny-calixto-systems-am62l-stamp-som-targets-industrial-automation-hmi-applications-ev-chargers/\">Tiny Calixto Systems AM62L STAMP SOM targets industrial automation, HMI applications, EV chargers<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "u-blox F11 low-power dual-band GNSS chips and modules consume just 7mW in LEAP mode", "source": "CNX Software", "date": "2026-07-06", "url": "https://www.cnx-software.com/2026/07/06/u-blox-f11-low-power-dual-band-gnss-chips-and-modules-consume-just-7mw-in-leap-mode/", "summary": "<div><img alt=\"u blox UBX F11270 KB and UBX F11170 CC L1,L5 dual band GNSS with just 7mW power consumption\" class=\"attachment-medium size-medium wp-post-image\" height=\"480\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/07/u-blox-UBX-F11270-KB-and-UBX-F11170-CC-L1L5-dual-band-GNSS-with-just-7mW-power-consumption-720x480.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>u-blox has introduced the F11 platform, a new family of low-power GNSS chips and modules that includes the UBX-F11270-KB and UBX-F11170-CC dual-band GNSS chips, the UBX-M11070-KB  chip (L1-only), the MAX-M11N module (L1-only), and the EVK-F112 evaluation kit. These are designed for battery-powered applications such as aftermarket telematics, asset tracking, wearables, drones, micromobility, and other industrial and consumer devices. Among those, the UBX-F11270-KB and UBX-F11170-CC support dual-band L1/L5 GNSS that automatically switch between L1/L5 operation based on signal conditions. The UBX-M11070-KB chip and MAX-M11N module are L1 band only, but all the modules and chips in the series support LEAP (Low Energy Accurate Positioning) mode with a typical power consumption of around 7 mW. Other features include indoor detection, polygonal geofencing, and multipath mitigation. u-blox UBX-F11270-KB and UBX-F11170-CC specifications: GNSS Engine – u-blox F11 platform Memory / Storage UBX-F11270-KB &#8211; Embedded flash memory supports firmware upgrade UBX-F11170-CC &#8211; Optional external SPI [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/07/06/u-blox-f11-low-power-dual-band-gnss-chips-and-modules-consume-just-7mw-in-leap-mode/\">u-blox F11 low-power dual-band GNSS chips and modules consume just 7mW in LEAP mode<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "AMD Versal Premium Gen 2 MoP adaptive SoC integrates 32GB LPDDR5X to shrink board footprint by 60%", "source": "CNX Software", "date": "2026-07-06", "url": "https://www.cnx-software.com/2026/07/06/amd-versal-premium-gen-2-mop-adaptive-soc-integrates-32gb-lpddr5x-to-shrink-board-footprint-by-60/", "summary": "<div><img alt=\" Versal Premium Gen 2 Memory on Package (MoP) adaptive SoCs\" class=\"attachment-medium size-medium wp-post-image\" height=\"480\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/07/Versal-Premium-Gen-2-Memory-on-Package-MoP-adaptive-SoCs-720x480.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>AMD has announced the Versal Premium Gen 2 Memory-on-Package (MoP) adaptive SoCs, adding an integrated memory option to the Premium Gen 2 family, a topic we covered back in November 2024. While the core silicon (dual-core Cortex-A72 + dual-core Cortex-R5F + high-end FPGA fabric) remains the same, the new devices (2VP3422, 2VP3522, and 2VP3622) integrate up to 32 GB of LPDDR5X memory directly inside the package. This removes the need for external high-speed memory on the board and reduces PCB area by up to 60%. This also eliminates high-speed memory routing on the carrier board, increasing the maximum memory bandwidth to 288 GB/s. AMD Versal Premium Gen2 MoP specifications: CPU cores Dual-core Arm Cortex-A72 application core, 48 KB/32 KB L1 Cache w/ parity &#38; ECC; 1 MB L2 Cache w/ ECC Dual-core Arm Cortex R5F, 32 KB/32 KB L1 Cache, and 256 KB TCM w/ECC Memory on Package 32 GB of LPDDR5X DRAM [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/07/06/amd-versal-premium-gen-2-mop-adaptive-soc-integrates-32gb-lpddr5x-to-shrink-board-footprint-by-60/\">AMD Versal Premium Gen 2 MoP adaptive SoC integrates 32GB LPDDR5X to shrink board footprint by 60%<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "What's Next for the Renesas 365 Development Platform", "source": "Embedded.com", "date": "2026-07-06", "url": "https://www.embedded.com/whats-next-for-the-renesas-365-development-platform/", "summary": "<p>Renesas Electronics Corp. recently announced its acquisition of U.S. software developer startup Pictorus, based in Oakland, California. The company plans to integrate Pictorus's cloud-based behavioral modeling platform into the Renesas 365 electronics development platform. The upgraded toolchain for the Altium-powered embedded design platform is expected to deliver a more streamlined design environment for embedded engineers. [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/whats-next-for-the-renesas-365-development-platform/\">What’s Next for the Renesas 365 Development Platform<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "GigaDevice Unveils I2C EEPROMs", "source": "Embedded.com", "date": "2026-07-06", "url": "https://www.embedded.com/gigadevice-unveils-i2c-eeproms/", "summary": "<p>The I²C EEPROMs with integrated ECC offer up to four million program/erase cycles.<\/p>\n<p>The post <a href=\"https://www.embedded.com/gigadevice-unveils-i2c-eeproms/\">GigaDevice Unveils I2C EEPROMs<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "Bypassing the Sound Blaster’s new firmware signature check", "source": "Adafruit", "date": "2026-07-06", "url": "https://blog.adafruit.com/2026/07/06/bypassing-the-sound-blasters-new-firmware-signature-check/", "summary": "Rasmus Moorats recently demonstrated a few vulnerabilities in the Sound Blaster Katana V2/V2X/SE which allowed one to hijack the device over Bluetooth and turn it into an attacker-controlled keyboard peripheral, injecting keystrokes into the connected machine. One of the flaws I highlighted in my previous post was that CTP, which the mobile and desktop applications use to [&#8230;]"}, {"title": "An Atomic Force Microscope and specialized etching", "source": "Adafruit", "date": "2026-07-06", "url": "https://blog.adafruit.com/2026/07/06/an-atomic-force-microscope-and-specialized-etching/", "summary": "Applied Science explores the mechanics of a MEMS-based atomic force microscope by imaging biological samples and testing specialized etching techniques. Through careful sample preparation, such as using gelatin for immobilization, Applied Science investigates how surface modifications on stainless steel respond to various electrochemical processes. Makers of this microscope: https://www.icspicorp.com/contact-us/ See the video below:"}, {"title": "The Windows CE Dreamcast Community edition", "source": "Adafruit", "date": "2026-07-06", "url": "https://blog.adafruit.com/2026/07/06/the-windows-ce-dreamcast-community-edition/", "summary": "The Dreamcast shipped a stripped-down Windows CE 2.12 that retail games booted into and never exposed. Windows CE Dreamcast Community Edition takes that same on-disc CE runtime and turns it into something you can actually use: a multitasking windowed desktop and an in-progress TCP/IP stack over the Broadband Adapter — all baked into a standard bootable Dreamcast disc. [&#8230;]"}, {"title": "Apricot Computers: an underrated British brand", "source": "Adafruit", "date": "2026-07-06", "url": "https://blog.adafruit.com/2026/07/06/apricot-computers-an-underrated-british-brand/", "summary": "David L. Farquhar clearly notes that Sinclair and Amstrad and Acorn are well known vintage computers. But when it comes to British brands, it seems like one that you don’t hear a lot about Apricot. But thanks to a television program that aired in early 1990, we know a fair bit about Apricot’s triumphs and [&#8230;]"}, {"title": "A Raspberry Pi Compute Module 0 (CM0) 3D model (STEP)", "source": "Adafruit", "date": "2026-07-06", "url": "https://blog.adafruit.com/2026/07/06/a-raspberry-pi-compute-module-0-cm0-3d-model-step/", "summary": "Mirosław Folejewski has created a 3D model of the Raspberry Pi Compute Module 0 (CM0) System-on-Module (SOM) in STEP format. While designing hardware based on the Raspberry Pi CM0, I searched for an official 3D CAD model provided by Raspberry Pi. However, I was unable to find a STEP model for the CM0 on the manufacturer&#8217;s [&#8230;]"}, {"title": "psutil – process and system utilities for Python", "source": "Adafruit", "date": "2026-07-06", "url": "https://blog.adafruit.com/2026/07/06/psutil-process-and-system-utilities-for-python/", "summary": "psutil is a cross-platform library for retrieving information about running processes and system utilization (CPU, memory, disks, network, sensors) in Python. It is useful mainly for system monitoring, profiling, limiting process resources, and managing running processes. It implements many functionalities offered by UNIX command line tool such as ps, top, free, iotop, netstat, ifconfig, lsof and others (see shell equivalents). psutil supports the following platforms: Linux [&#8230;]"}, {"title": "ICYMI – Adafruit IoT Monthly: Banned Books, ADS-B Scanner, and More!", "source": "Adafruit", "date": "2026-07-06", "url": "https://blog.adafruit.com/2026/07/06/icymi-adafruit-iot-monthly-temu-iot-doorbell-cloud-ham-radio-repeaters-and-more/", "summary": "ICYMI (In case you missed it) – the IoT Monthly Newsletter from AdafruitDaily.com went out this morning! If you missed it, subscribe now! – You’ll get one newsletter each month. The next newsletter will be out in a month, and being subscribed is the best way to keep up with all things Internet of Things. There is no spam, no selling lists, and [&#8230;]"}, {"title": "A Practical Migration Path with PIC32CM Arm® Cortex®-based MCUs — Microchip and Mouser", "source": "EE Journal", "date": "2026-07-06", "url": "https://www.eejournal.com/chalk_talks/a-practical-migration-path-with-pic32cm-arm-cortex-based-mcus-microchip-and-mouser/", "summary": "&#160; In this episode of Chalk Talk, Marc McComb from Microchip and Amelia Dalton explore a practical migration strategy for moving from 8-bit to 32-bit architectures, the technical foundations of the PIC32CM environment, and discuss how Microchip’s tools and resources can bridge the gap between these two architectures to ensure the process feels like a &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/chalk_talks/a-practical-migration-path-with-pic32cm-arm-cortex-based-mcus-microchip-and-mouser/\">Read More &#8594;<span class=\"screen-reader-text\"> \"A Practical Migration Path with PIC32CM Arm® Cortex®-based MCUs &#8212; Microchip and Mouser\"<\/span><\/a>"}, {"title": "EIZO Releases 6U OpenVPX/SOSA aligned GPGPU Processing Cards Designed for High-Throughput AI and Sensor Processing in Embedded Edge Systems", "source": "EE Journal", "date": "2026-07-06", "url": "https://www.eejournal.com/industry_news/eizo-releases-6u-openvpx-sosa-aligned-gpgpu-processing-cards-designed-for-high-throughput-ai-and-sensor-processing-in-embedded-edge-systems/", "summary": "EIZO’s Condor XR2S 6U VPX Series is designed with the NVIDIA Blackwell architecture supporting the NVIDIA RTX PRO 5000/4000 Blackwell embedded GPUs The series features up to 24 GB GDDR7 graphics memory, 10,496 CUDA Cores, support for PCI Express Gen 5, and incorporates dual Microchip Switchtec™ PFX PCIe switches EIZO Rugged Solutions Inc., a leading &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/eizo-releases-6u-openvpx-sosa-aligned-gpgpu-processing-cards-designed-for-high-throughput-ai-and-sensor-processing-in-embedded-edge-systems/\">Read More &#8594;<span class=\"screen-reader-text\"> \"EIZO Releases 6U OpenVPX/SOSA aligned GPGPU Processing Cards Designed for High-Throughput AI and Sensor Processing in Embedded Edge Systems\"<\/span><\/a>"}, {"title": "Bath researchers join NASA Earth System Explorers mission", "source": "EE Journal", "date": "2026-07-06", "url": "https://www.eejournal.com/industry_news/bath-researchers-join-nasa-earth-system-explorers-mission/", "summary": "Bath researchers Dr Neil Hindley and Professor Corwin Wright, from the University of Bath’s Centre for Climate Adaptation &#38; Environment Research (CAER), have joined the science team behind NASA’s next-generation satellite mission. The STRIVE mission, which stands for Stratosphere Troposphere Response using Infrared Vertically-resolved light Explorer, will take high-resolution, daily measurements of global temperature, aerosol pollution and &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/bath-researchers-join-nasa-earth-system-explorers-mission/\">Read More &#8594;<span class=\"screen-reader-text\"> \"Bath researchers join NASA Earth System Explorers mission\"<\/span><\/a>"}, {"title": "Need a low-cost FPGA dev board? Check out Adiuvo Engineering’s $99 Explorer board with an AMD Artix UltraScale+ FPGA", "source": "EE Journal", "date": "2026-07-06", "url": "https://www.eejournal.com/article/need-a-low-cost-fpga-dev-board-check-out-adiuvo-engineerings-99-explorer-board-with-an-amd-artix-ultrascale-fpga/", "summary": "<img alt=\"\" class=\"webfeedsFeaturedVisual wp-post-image\" height=\"232\" src=\"https://www.eejournal.com/wp-content/uploads/2026/07/Explorer-Board-Front.jpg\" style=\"display: block; margin-bottom: 5px; clear: both;\" width=\"300\" />If you’re looking for a real bargain in an FPGA development board, Adiuvo Engineering’s Adam Taylor has a deal for you. His company’s new $99 Explorer dev board sports an AMD Artix UltraScale+ AU7P FPGA, which is lower than the single-piece price for the FPGA alone. How does Adiuvo work this magic? AMD was an &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/article/need-a-low-cost-fpga-dev-board-check-out-adiuvo-engineerings-99-explorer-board-with-an-amd-artix-ultrascale-fpga/\">Read More &#8594;<span class=\"screen-reader-text\"> \"Need a low-cost FPGA dev board? Check out Adiuvo Engineering’s $99 Explorer board with an AMD Artix UltraScale+ FPGA\"<\/span><\/a>"}, {"title": "Macintosh emulator works on ESP32-P4 display devkits from M5Stack and Waveshare", "source": "CNX Software", "date": "2026-07-05", "url": "https://www.cnx-software.com/2026/07/05/macintosh-emulator-works-on-esp32-p4-display-devkits-from-m5stack-and-waveshare/", "summary": "<div><img alt=\"ESP32-P4 MacOS emulator\" class=\"attachment-medium size-medium wp-post-image\" height=\"491\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/07/ESP32-P4-MacOS-emulator-720x491.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>ESP32 chips have been used for retro gaming and computing for years, but Austin McChord (Amcchord) adds to that with a Macintosh emulator ported to a couple of ESP32-P4 display devkits. His project is a full port of the BasiliskII Macintosh 68k emulator, bringing classic Mac OS (System 7.x through Mac OS 8.1) to portable ESP32-P4 embedded devices with touchscreen, USB peripherals, and WiFi support through an ESP32-C6 on the boards. The main development platform appears to be the M5Stack Tab5 equipped with a 5-inch touchscreen display with 1280×720 resolution. However, if you need something with a larger screen, the Waveshare ESP32-P4-WIFI6-Touch-LCD-10.1 is also supported, and features a 10.1-inch display with 1280&#215;800 resolution and a 10-point capacitive touchscreen. The actual Mac OS resolutions used are 640&#215;360 and 640&#215;400, respectively, then scaled twice to the native resolution of the display. Highlights of the project: CPU &#8211;  Motorola 68040 emulation with FPU (68881) [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/07/05/macintosh-emulator-works-on-esp32-p4-display-devkits-from-m5stack-and-waveshare/\">Macintosh emulator works on ESP32-P4 display devkits from M5Stack and Waveshare<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "BIGTREETECH Panda Sense Pro 8-in-1 smart air quality monitor works with Home Assistant and Klipper for 3D printers", "source": "CNX Software", "date": "2026-07-04", "url": "https://www.cnx-software.com/2026/07/04/bigtreetech-panda-sense-pro-8-in-1-smart-air-quality-monitor-works-with-home-assistant-and-klipper-for-3d-printers/", "summary": "<div><img alt=\"BIGTREETECH Panda Sense Pro 8-in-1 Air Quality Monitor for 3D Printers\" class=\"attachment-medium size-medium wp-post-image\" height=\"480\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/07/BIGTREETECH-Panda-Sense-Pro-8-in-1-Air-Quality-Monitor-for-3D-Printers-720x480.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>BIGTREETECH (BIQU) has introduced the BIQU Panda Sense Pro, an 8-in-1 smart air quality monitor designed for 3D printing environments such as home workshops, maker spaces, and print farms. It continuously measures airborne particles, gases, temperature, and humidity, helping users monitor indoor air quality while printing. The device also integrates with Klipper-based printers and smart home platforms, making it suitable for both standalone monitoring and automated environmental control. It combines laser particle, NDIR CO₂, and electrochemical formaldehyde sensors to monitor PM2.5, PM10, CO₂, HCHO, eTVOC, AQI, temperature, and humidity in real time. The monitor features a 3.5-inch 480×320 TFT display, 2.4 GHz Wi-Fi with MQTT, USB Type-C power, 24-hour and 30-day data logging, and upcoming app-based remote monitoring. It integrates with Moonraker (Fluidd/Mainsail) and Home Assistant for automation, such as controlling fans or air purifiers based on sensor readings. The enclosure files are open-source, which means you can customize and [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/07/04/bigtreetech-panda-sense-pro-8-in-1-smart-air-quality-monitor-works-with-home-assistant-and-klipper-for-3d-printers/\">BIGTREETECH Panda Sense Pro 8-in-1 smart air quality monitor works with Home Assistant and Klipper for 3D printers<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "HALO TOUCH V2 – A customizable desktop USB hub with rotary encoder fitted with round touchscreen display", "source": "CNX Software", "date": "2026-07-03", "url": "https://www.cnx-software.com/2026/07/03/halo-touch-v2-a-customizable-desktop-usb-hub-with-rotary-encoder-fitted-with-round-touchscreen-display/", "summary": "<div><img alt=\"HALO TOUCH USB Hub Dock with Clock V2\" class=\"attachment-medium size-medium wp-post-image\" height=\"480\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/07/HALO-TOUCH-USB-Hub-Dock-with-Clock-V2-720x480.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Designed by Innoelement in Guangzhou, China, the HALO TOUCH V2 is a multifunctional desktop USB hub with a round touchscreen and a rotary encoder designed as an interactive desk companion. It integrates system monitoring, media playback, and productivity features for workstations, home offices, and desktop setups. The device features a USB 2.0 hub with two USB Type-A ports, one USB Type-C port, two microSD card readers, and a 100Mbps Ethernet port with per-port power monitoring. Its 360 × 360 IPS touchscreen supports a Pomodoro timer, photo and animation viewer, MP3 player, audio spectrum visualizer, and an AIDA64 system monitoring dashboard. A rotary encoder provides Microsoft Surface Dial-compatible controls on Windows, while 2.4GHz Wi-Fi enables clock synchronization and OTA firmware updates. It also supports USB PD power input and customization for themes, media, and animations using files on a microSD card. MAHOGANY HALO TOUCH V2 specifications: MCU &#8211; Unspecified (potentially ESP32-S3) [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/07/03/halo-touch-v2-a-customizable-desktop-usb-hub-with-rotary-encoder-fitted-with-round-touchscreen-display/\">HALO TOUCH V2 – A customizable desktop USB hub with rotary encoder fitted with round touchscreen display<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "ESP32-C5 dual-band WiFi 6 and Bluetooth LE IoT board features 1.47-inch color LCD", "source": "CNX Software", "date": "2026-07-03", "url": "https://www.cnx-software.com/2026/07/03/esp32-c5-dual-band-wifi-6-and-bluetooth-le-iot-board-features-1-47-inch-color-lcd/", "summary": "<div><img alt=\"ESP32-C5-LCD-1.47 board\" class=\"attachment-medium size-medium wp-post-image\" height=\"511\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/07/ESP32-C5-LCD-1.47-LCD-720x511.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>We&#8217;ve covered plenty of connected displays based on ESP32 chips over the years, but the Waveshare ESP32-C5-LCD-1.47 is a little different, since it&#8217;s the first to feature an ESP32-C5 chip for dual-band WiFi 6 connectivity. It&#8217;s basically based on the ESP32-C6-LCD-1.47 design, but replaces the ESP32-C6 supporting 2.4 GHz WiFi 6 with an ESP32-C5 capable of handling both 2.4 GHz and 5 GHz WiFi 6. Other features mostly remain the same: a 1.47-inch 262K-color display with 320 x 172 resolution, 4MB of flash, an RGB LED, a microSD card slot, and two 9-pin headers for GPIO expansion. Waveshare ESP32-C5-LCD-1.47 specifications: Wireless MCU – Espressif Systems ESP32-C5FH4 CPU Single-core 32-bit RISC-V processor @ up to 240 MHz Low-power RISC-V core @ 40 MHz acting as the main processor for power-sensitive applications Memory – 384 KB SRAM on-chip Storage – 320 KB ROM, 4MB flash Wireless Connectivity Dual-band (2.4GHz/5 GHz) 802.11ax WiFi [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/07/03/esp32-c5-dual-band-wifi-6-and-bluetooth-le-iot-board-features-1-47-inch-color-lcd/\">ESP32-C5 dual-band WiFi 6 and Bluetooth LE IoT board features 1.47-inch color LCD<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "NVIDIA Jetson Orin Nano/NX-based Mekotronics AI Box targets humanoid robots, Smart Cities management, transportation applications", "source": "CNX Software", "date": "2026-07-03", "url": "https://www.cnx-software.com/2026/07/03/nvidia-jetson-orin-nano-nx-based-mekotronics-ai-box-targets-humanoid-robots-smart-cities-management-transportation-applications/", "summary": "<div><img alt=\"Mekotronics AI Box NVIDIA Jetson Orin Nano NX\" class=\"attachment-medium size-medium wp-post-image\" height=\"401\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/07/Mekotronics-AI-Box-NVIDIA-Jetson-Orin-Nano-NX-720x401.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Better known for its unique Rockchip industrial PC designs, Mekotronics has now launched an &#8220;AI Box&#8221; based on the NVIDIA Jetson Orin Nano 4GB/8GB or Jetson Orin NX 8GB/16GB for humanoid robots, smart transportation (V2X) applications, Smart Cities, Smart Agriculture, medical imaging, and more. While the company often provides niche features on its Rockchip systems, its Jetson embedded computer offers pretty standard interfaces with an HDMI video output, six USB Type-A ports, two Gigabit Ethernet RJ45 ports (one with PoE), a 40-pin GPIO header, two camera connectors, a terminal block for CAN Bus and UART, and a system connector for LEDs, power button, etc&#8230; Mekotronics AI Box specifications: Compatible modules NVIDIA Jetson Orin Nano 4GB up to 34 TOPS NVIDIA Jetson Orin Nano 8GB up to 67 TOPS NVIDIA Jetson Orin NX 8GB up to 117 TOPS NVIDIA Jetson Orin NX 16GB up to 157 TOPS Storage 2x M.2 Key-M [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/07/03/nvidia-jetson-orin-nano-nx-based-mekotronics-ai-box-targets-humanoid-robots-smart-cities-management-transportation-applications/\">NVIDIA Jetson Orin Nano/NX-based Mekotronics AI Box targets humanoid robots, Smart Cities management, transportation applications<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Agentic Software for Physical AI, Rigid-Flex PCB Prototyping, LEO Satellites: Embedded Week Insights", "source": "Embedded.com", "date": "2026-07-03", "url": "https://www.embedded.com/agentic-software-for-physical-ai-rigid-flex-pcb-prototyping-leo-satellites-embedded-week-insights/", "summary": "<p>Here's a roundup of this week's must-read articles. We look into the latest developments on agentic software for physical AI, lowering the costs of rigid-flex PCB prototyping, and payload pointing in LEO satellites. Also, check News Archives - Embedded and Technical Articles Archives - Embedded for the complete list of news and articles from our website. NEWS Kyocera AVX [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/agentic-software-for-physical-ai-rigid-flex-pcb-prototyping-leo-satellites-embedded-week-insights/\">Agentic Software for Physical AI, Rigid-Flex PCB Prototyping, LEO Satellites: Embedded Week Insights<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "Flux Report Examines Challenges of AI-Generated Code in Production", "source": "Embedded.com", "date": "2026-07-03", "url": "https://www.embedded.com/flux-report-examines-challenges-of-ai-generated-code-in-production/", "summary": "<p>Flux has released its AI Code Generation Reality Check, an independent study examining how organizations are adopting AI-generated software while managing the associated risks. Conducted by Dimensional Research, the survey collected responses from 309 engineering leaders and practitioners across five continents and highlights a growing gap between the widespread use of AI-assisted coding and organizations' [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/flux-report-examines-challenges-of-ai-generated-code-in-production/\">Flux Report Examines Challenges of AI-Generated Code in Production<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "Syslogic and Ark Vision Deliver Complete Hardware Solution for Edge AI", "source": "EE Journal", "date": "2026-07-03", "url": "https://www.eejournal.com/industry_news/syslogic-and-ark-vision-deliver-complete-hardware-solution-for-edge-ai/", "summary": "Ark Vision Systems and Syslogic have joined forces to deliver a fully integrated hardware solution for Edge AI. Ark Vision Systems&#8217; GMSL2 cameras now connect seamlessly with Syslogic&#8217;s rugged embedded computers, providing customers with a complete hardware platform for demanding Edge AI applications in industrial automation, agriculture, and mobility. Harsh environments demand rugged electronics. Ark &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/syslogic-and-ark-vision-deliver-complete-hardware-solution-for-edge-ai/\">Read More &#8594;<span class=\"screen-reader-text\"> \"Syslogic and Ark Vision Deliver Complete Hardware Solution for Edge AI\"<\/span><\/a>"}, {"title": "Bio-based Multi-purpose Adhesive With Excellent Adhesion", "source": "EE Journal", "date": "2026-07-03", "url": "https://www.eejournal.com/industry_news/bio-based-multi-purpose-adhesive-with-excellent-adhesion/", "summary": "DELO has developed an adhesive that consists primarily of bio-based components and combines performance with sustainability. DELO PHOTOBOND SJ4192 is characterized by excellent moisture resistance as well as high flexibility and peel strength. As a multi-purpose adhesive, it is suitable for metal, glass and plastics and can help achieve sustainability goals in the automotive industry, &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/bio-based-multi-purpose-adhesive-with-excellent-adhesion/\">Read More &#8594;<span class=\"screen-reader-text\"> \"Bio-based Multi-purpose Adhesive With Excellent Adhesion\"<\/span><\/a>"}, {"title": "Kyocera AVX Launches Antenna Integration Tool", "source": "Embedded.com", "date": "2026-07-02", "url": "https://www.embedded.com/kyocera-avx-launches-antenna-integration-tool/", "summary": "<p>Kyocera AVX has unveiled a new web-based antenna integration tool to help RF design engineers select the right antenna for their applications. The Antenna Integrator Studio is designed to streamline and optimize the antenna selection and placement processes, enabling improvements in product quality, performance, and time to market. \"Selecting the right antenna and the right [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/kyocera-avx-launches-antenna-integration-tool/\">Kyocera AVX Launches Antenna Integration Tool<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "SiMa Unveils Agentic Development Environment for Physical AI", "source": "Embedded.com", "date": "2026-07-02", "url": "https://www.embedded.com/sima-unveils-agentic-development-environment-for-physical-ai/", "summary": "<p>SiMa's CEO says it has developed the most advanced agentic software for physical AI that cuts development time from months to days or hours.<\/p>\n<p>The post <a href=\"https://www.embedded.com/sima-unveils-agentic-development-environment-for-physical-ai/\">SiMa Unveils Agentic Development Environment for Physical AI<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "Efficient Computer Introduces Efficient Labs Platform", "source": "Embedded.com", "date": "2026-07-01", "url": "https://www.embedded.com/efficient-computer-introduces-efficient-labs-platform/", "summary": "<p>Efficient Computer has introduced Efficient Labs, a browser-based suite of interactive development tools designed to simplify software and hardware development for its Electron E1 general-purpose processor. The platform integrates directly into existing engineering workflows, providing a collection of web-based utilities that reduce the complexity of embedded system design while accelerating evaluation and prototyping. Developed as [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/efficient-computer-introduces-efficient-labs-platform/\">Efficient Computer Introduces Efficient Labs Platform<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "How to Avoid Higher Rigid-Flex PCB Prototyping Costs", "source": "Embedded.com", "date": "2026-07-01", "url": "https://www.embedded.com/how-to-avoid-higher-rigid-flex-pcb-prototyping-costs/", "summary": "<p>Rigid-flex printed-circuit-board (PCB) manufacturing can be expensive at first glance. Complex lamination steps and tight tolerances result in lower yields and higher scrap rates. Finding the right supplier early in the process and engaging with them during the design phase improves manufacturability, preventing costly revisions, shortening development cycles, and making rigid-flex PCBs more affordable. The [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/how-to-avoid-higher-rigid-flex-pcb-prototyping-costs/\">How to Avoid Higher Rigid-Flex PCB Prototyping Costs<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}], "papers": [{"title": "From Fixed to Free Cameras: Calibration-Free View-Robust Vision-Language-Action Model", "authors": ["Wenhao Li", "Xueying Jiang", "Quanhao Qian", "Deli Zhao", "Shijian Lu", "Gongjie Zhang", "Ran Xu"], "published": "2026-07-06", "summary": "Real-world robot deployment rarely maintains the training-stage camera setup, where cameras often experience repositioning or remounting depending on actual scenarios. Existing view-robust Vision-Language-Action (VLA) policies tolerate such camera variations only when the camera extrinsics are explicitly provided, making them fragile and hard to use especially when view robustness is critical. We argue that the policy should not be told where the camera is, but rather figure it out by itself. To this end, we introduce Camera-Centric VLA (CamVLA), a new VLA model that decouples manipulation controls from camera geometry by predicting (i) a camera-centric end-effector action expressed in the local camera frame, and (ii) a 6-DoF hand-eye matrix relating cameras to the robot base. A deterministic geometric transformation composes the two predictions into a robot base-frame action. This disentangles how I should move in pose-independent camera-centric action generation from where I am looking from in camera-perspective geometric grounding. The resulting policy is calibration-free, depth-free, and single-view, requiring only a single monocular RGB image as the visual observation and task instruction at deployment. Evaluations in both simulation and real-world robot data show that CamVLA consistently improves success rates across diverse unseen viewpoints. Project page: https://alibaba-damo-academy.github.io/CamVLA/.", "pdf_url": "https://arxiv.org/pdf/2607.05396v1"}, {"title": "LLM-as-a-Verifier: A General-Purpose Verification Framework", "authors": ["Jacky Kwok", "Shulu Li", "Pranav Atreya", "Yuejiang Liu", "Yixing Jiang", "Chelsea Finn", "Marco Pavone", "Ion Stoica", "Azalia Mirhoseini"], "published": "2026-07-06", "summary": "Scaling pre-training, post-training, and test-time compute have become the central paradigms for improving the capabilities of LLMs. In this work, we identify verification, the ability to determine the correctness of a solution, as a new scaling axis. To unlock this and demonstrate its effectiveness, we introduce LLM-as-a-Verifier, a general-purpose verification framework that provides fine-grained feedback for agentic tasks without requiring additional training. Unlike standard LM judges that prompt LLMs to produce discrete scores for candidate solutions, LLM-as-a-Verifier computes the expectation over the distribution of scoring token logits to generate continuous scores. This probabilistic formulation enables verification to scale along multiple dimensions: (1) score granularity, (2) repeated evaluation, and (3) criteria decomposition. In particular, we show that scaling the scoring granularity leads to better separation between positive and negative solutions, resulting in more calibrated comparisons. Moreover, scaling repeated evaluation and criteria decomposition consistently lead to additional gains in verification accuracy through variance and complexity reduction. We further introduce a cost-efficient ranking algorithm for selecting the best solution among candidates using the verifier's continuous scores. LLM-as-a-Verifier achieves state-of-the-art performance on Terminal-Bench V2 (86.5%), SWE-Bench Verified (78.2%), RoboRewardBench (87.4%), and MedAgentBench (73.3%). Beyond verification, the fine-grained signals from LLM-as-a-Verifier can also serve as a proxy for estimating task progress. We build an extension for Claude Code, enabling developers to monitor and improve their own agentic systems. Finally, we show that LLM-as-a-Verifier can provide dense feedback for RL, improving the sample efficiency of SAC and GRPO on robotics and mathematical reasoning benchmarks.", "pdf_url": "https://arxiv.org/pdf/2607.05391v1"}, {"title": "Deform360: A Massive Multi-view Visuotactile Dataset for Deformable World Models", "authors": ["Hongyu Li", "Wanjia Fu", "Xiaoyan Cong", "Zekun Li", "Binghao Huang", "Hanxiao Jiang", "Xintong He", "Yiqing Liang", "Rao Fu", "Tao Lu", "Srinath Sridhar", "Kevin A. Smith", "George Konidaris", "Yunzhu Li"], "published": "2026-07-06", "summary": "Predicting object dynamics (i.e., world modeling) is a fundamental challenge for robotic manipulation, and modeling deformable objects presents a particularly difficult case due to their high-dimensional state spaces and complex material properties. While current world models approach this through two distinct paradigms: learning the dynamics over the 2D pixel space or more explicit 3D geometric space. A systematic understanding of their relative strengths and limitations remains elusive due to the lack of diverse, large-scale real-world data. To address this, we present Deform360, a large-scale visuotactile dataset featuring 198 daily-life objects, 1,980 interaction sequences, and over 215 hours of observations from 41 surround-view cameras and bimanual tactile grippers to capture both global motion and contact-induced local deformations. Leveraging a novel markerless visuotactile 3D tracking pipeline to extract dense geometry and motion, we systematically evaluate current state-of-the-art world models, comparing 2D video models against 3D particle models. Finally, we provide a preliminary demonstration indicating the real-world applicability of our dataset by performing robot planning tasks on deformable objects. Our analysis reveals key insights into the trade-offs between structural priors and scalability, providing a solid benchmark for future research in generalizable deformable object-centric world modeling. Project website: https://deform360.lhy.xyz", "pdf_url": "https://arxiv.org/pdf/2607.05390v1"}, {"title": "Cortex: A Bidirectionally Aligned Embodied Agent Framework for Long-horizon Manipulation", "authors": ["Jiaqi Peng", "Xiqian Yu", "Delin Feng", "Yuqiang Yang", "Wenzhe Cai", "Jing Xiong", "Ganlin Yang", "Jinliang Zheng", "Jiafei Cao", "Xueyuan Wei", "Jiangmiao Pang", "Yuan Shen", "Tai Wang"], "published": "2026-07-06", "summary": "While recent Vision-Language-Action (VLA) models show promise toward generalist manipulation policies, they struggle with long-horizon tasks due to their Markovian nature-relying solely on current observations. Hierarchical dual-system methods address this but suffer from a gap between high-level planning semantics and low-level execution kinematics. We introduce Cortex, a bidirectionally aligned embodied agent framework with a customized planning interface that conveys executable and tractable subtask plans from high-level VLM to low-level VLA. Specifically, we standardize manipulation subtasks into 32 canonical skill primitives and inject tractability principles, such as representative object attributes and improved trajectory reachability, into the data generation pipeline. This enables automatic annotation of over 4k hours of open-source video data and generation of 30 hours of simulation data. We further devise an event-balanced sampling strategy to construct training data for fine-tuning the framework to better handle planning ambiguity during subtask transitions, enhanced by carefully designed harness engineering from task contexts to skill constraints during inference. Both open-loop VLM and closed-loop system evaluations demonstrate Cortex's efficacy, e.g., it outperforms monolithic baselines by 3.1% on Libero-long and 4.1% on RoboTwin. Notably, Cortex's generalist VLM enables zero-shot completion of unseen real-world long-horizon tasks, such as multi-stage chemistry experiments, by simply combining with a fine-tuned VLA-a capability infeasible through VLA fine-tuning alone.", "pdf_url": "https://arxiv.org/pdf/2607.05377v1"}, {"title": "PixWorld: Unifying 3D Scene Generation and Reconstruction in Pixel Space", "authors": ["Sensen Gao", "Zhaoqing Wang", "Qihang Cao", "Dongdong Yu", "Changhu Wang", "Jia-Wang Bian"], "published": "2026-07-06", "summary": "3D reconstruction and generation are commonly tackled by separate paradigms: pixel-based regression for reconstruction, and latent diffusion for generation. Recent works attempt to unify them in latent space, but with notable drawbacks: the diffusion objective is defined on latent features rather than the underlying 3D representation, and both branches suffer from information loss introduced by latent encoding, while requiring a pretrained Variational Autoencoder (VAE) or Representation Autoencoder (RAE). In this paper, we reformulate these two tasks under a unified pixel-space diffusion paradigm and introduce PixWorld, a single model that jointly addresses 3D reconstruction and generation. By supervising diffusion directly on rendered images, PixWorld removes the above limitations and aligns optimization with 3D scene fidelity. Beyond photometric and perceptual supervision that operates at the 2D image level and lacks 3D geometric awareness, we further introduce a geometry perception loss that aligns rendered views with their ground truth in the geometry-aware feature space of a pretrained 3D foundation model, providing 3D structural supervision. PixWorld consistently outperforms prior latent-space generation methods and matches state-of-the-art reconstruction methods, demonstrating the superiority of a unified pixel-space approach.", "pdf_url": "https://arxiv.org/pdf/2607.05373v1"}, {"title": "GaP: A Graph-as-Policy Multi-Agent Self-Learning Harness For Variational Automation Tasks", "authors": ["Kaiyuan Chen", "Shuangyu Xie", "Letian Fu", "Justin Yu", "William Pacini", "Sandeep Bajamahal", "Hudson Kim", "Jaimyn Drake", "Daehwa Kim", "Haoru Xue", "Jonathan Francis", "Christian Juette", "Peter Schaldenbrand", "Muhammet Yunus Seker", "Ruwan Wickramarachchi", "Uksang Yoo", "Guanzhi Wang", "Adithyavairavan Murali", "Balakumar Sundaralingam", "S. Shankar Sastry", "Spencer Huang", "Yuke Zhu", "Linxi \"Jim\" Fan", "Ken Goldberg"], "published": "2026-07-06", "summary": "For robots to work reliably in commercial and industrial applications, can recent advances in agentic coding systems combine interpretable robot programming with the open-world adaptability of model-free policies? We focus on \"Variational Automation\" (VA), a class of tasks that have larger variations in object geometry and pose than fixed automation. Model-free policies often struggle to close the reliability gap for VA tasks, which must be executed persistently and reliably in commercial and industrial applications. Motivated by prior work on Task and Motion Planning (TAMP) and the Robot Operating System (ROS), we introduce Graph-as-Policy (GaP), a multi-agent coding harness that generates directed computation graphs with perception, planning, and control nodes from a Modular Open Robot Skill Library (MORSL). GaP then generates an internal simulation environment to rehearse task instances with different graphs in parallel to iteratively refine the graph structure and parameters to improve success rates and throughput. Evaluation with 8 new open VA task benchmarks, 4 in-simulation and 4 in real-world, suggests that GaP can achieve success rates that significantly outperform baselines. Details, code, and data can be found online: https://graph-robots.github.io/gap", "pdf_url": "https://arxiv.org/pdf/2607.05369v1"}, {"title": "Multiplayer Interactive World Models with Representation Autoencoders", "authors": ["Anthony Hu", "Václav Volhejn", "Adrien Ramanana Rahary", "Chris Mulder", "Aditya Makkar", "Amélie Royer", "Manu Orsini", "Alyx Liao", "Adam Jelley", "Eloi Alonso", "Florian Laurent", "Fredrik Norén", "James Swingos", "Jan Hünermann", "Kent Rollins", "Lucas Hosseini", "Matthieu Le Cauchois", "Maxim Peter", "Pim de Witte", "Tim Brown", "Vincent Micheli", "Moritz Böhle", "Gabriel de Marmiesse", "Viktoriia Sharmanska", "Lucia Specia", "Michael Black", "Patrick Pérez"], "published": "2026-07-06", "summary": "We introduce the first multiplayer world model for highly dynamic environments governed by complex physical interactions. Whereas single-player world models treat the other agents as part of the environment, ours conditions on the action streams of multiple agents, learning to attribute changes in the scene to the correct player and to stay coherent under arbitrary combinations of their actions. We study this problem in the game of Rocket League, where players compete and cooperate under fast, tightly coupled dynamics. Trained on 10,000 hours of gameplay collected with publicly available bots, our 5-billion-parameter latent diffusion model generates four-player matches in real time, producing 20 frames per second on a single Nvidia B200 GPU. Although trained only on short clips, its rollouts stay stable far beyond the training horizon: distributional quality holds steady out to five minutes, the longest horizon we measure, and in practice we observe rollouts continuing for hours with no sign of collapse. We systematically investigate the central design choices: the video codec, the generative objective, and the multiplayer conditioning scheme. In addition, we characterize how behavior changes with model and data scale, including the capabilities that emerge and the failure modes that persist. We further develop targeted evaluations that probe the model's physical understanding rather than visual appearance alone. To support continued research on multiplayer world models, we release our dataset, our full training and inference codebase, and a live demo.", "pdf_url": "https://arxiv.org/pdf/2607.05352v1"}, {"title": "Beyond Isolated Objects: Relationship-aware Open Vocabulary Scene Understanding via 3D Scene Graph Analysis", "authors": ["Xianhao Chen", "Jiarui Hu", "Yuanbo Yang", "Xiyu Zhang", "Tengyue Wang", "Hujun Bao", "Guofeng Zhang", "Zhaopeng Cui"], "published": "2026-07-06", "summary": "Open-vocabulary 3D scene understanding aims to segment 3D scenes beyond predefined categories by transferring semantic knowledge from vision-language models. Existing methods have advanced this task by lifting language-aligned 2D features into 3D, yet they often rely on context-independent semantic representations, leaving object relationships underexplored for contextual refinement. We propose RelGraphOV, a relationship-aware framework that uses 3D scene graphs to enhance open-vocabulary 3D understanding. Our method constructs relational scene graphs from multi-view observations by leveraging vision-language reasoning to infer object relationships and prune geometrically implausible connections, without manual relationship annotations. To aggregate relational context while avoiding feature interference, we introduce an Adaptive Gated Dual-Stream Contextual GAT that separates dense geometric features and semantic CLIP embeddings, performs edge-guided message passing, and adaptively fuses complementary semantics. A hierarchical contrastive objective further promotes instance-level consistency and category-level discrimination. Experiments on ScanNetV2, ScanNet200, ScanNet$++$, and Replica demonstrate strong performance and generalization ability. Project Page: https://cxavireh.github.io/relgraphov-projectpage", "pdf_url": "https://arxiv.org/pdf/2607.05348v1"}, {"title": "Socially-Aware Autonomous Doorway Traversal and Payload Delivery for Emergency Assistance", "authors": ["Andrew Snowdy", "Ananya Trivedi", "Sarvesh Prajapati", "Lorena Maria Genua", "Taskin Padir"], "published": "2026-07-06", "summary": "In this work, we focus on the scenario of a robot-assisted emergency evacuation. We consider two capabilities relevant to such a setting. The first is opening doors ahead of the people being evacuated, so that their path toward an exit stays clear. The second is retrieving rescue equipment and delivering it to the emergency responders carrying out the evacuation. From a systems perspective, this involves several tasks at once. The robot must locate ADA-compliant door buttons and the rescue equipment it needs to retrieve. Additionally, it must remain aware of the people around it and adapt its behavior to them, so that it supports the evacuation rather than getting in the way. We address these demands with a behavior tree at the core of our framework. This structure is chosen for its ability to select high-level tasks based on environmental triggers, and to extend to new situations as they arise. We evaluate the system in 105 trials on the Toyota Human Support Robot, across five hardware and three simulation scenarios. These trials capture the decisions the robot must make in this setting: whether to press a door button, yield to a nearby person, walk through a door someone else is holding, or first retrieve rescue equipment before traversing the door. Overall, the system completes 97 of the 105 trials successfully. These results suggest our framework provides a practical basis for robotic assistance in broader emergency response tasks. Code and video demonstrations are available at https://github.com/AndrewSnowdy/hsr_mm_control.", "pdf_url": "https://arxiv.org/pdf/2607.05315v1"}, {"title": "Forecasting Realized Volatility with Time Series Foundation Models: A Comparison with Econometric Benchmarks", "authors": ["Alessio Brini"], "published": "2026-07-06", "summary": "We ask whether pretrained time series foundation models (TSFMs) improve on established econometric benchmarks for forecasting realized volatility. Using the VOLARE dataset, we conduct the first systematic comparison of nine zero-shot TSFMs against eight econometric specifications, including the Heterogeneous Autoregressive (HAR) family, across 50 assets in equities, foreign exchange, and futures, and three forecast horizons, with formal pairwise and multi-model forecast-comparison tests. Foundation models do not deliver a uniform gain. Pooled losses favor them, but the advantage is concentrated in a few outlier assets; averaging each asset's loss ratio to a well-specified Log-HAR benchmark, so that no single asset dominates, only one small model, Tiny Time Mixers (TTM), beats the benchmark at every horizon, and by a narrow margin. The other foundation models do not improve on Log-HAR, and the econometric benchmarks remain competitive throughout. A Mincer--Zarnowitz recalibration, which removes level and scale bias from every forecast, shows that much of the short-horizon advantage reflects better-scaled forecasts rather than better prediction of volatility dynamics, and only at the monthly horizon does a genuine informational gain remain. Because this edge is thin and even TTM is not best on every asset, a simple equal-weight average of TTM and Log-HAR matches the best single model and enters the Model Confidence Set for 98 to 100\\% of assets, more often than either component alone, so a forecaster need not identify the best model for each asset in advance. Our most durable finding is that performance varies so much across foundation-model architectures that choosing the right architecture matters more than the broader choice between foundation and econometric models.", "pdf_url": "https://arxiv.org/pdf/2607.05291v1"}, {"title": "Vision Pretraining for Dense Spatial Perception", "authors": ["Zelin Fu", "Bin Tan", "Changjiang Sun", "Shaohui Liu", "Kecheng Zheng", "Yinghao Xu", "Xing Zhu", "Yujun Shen", "Nan Xue"], "published": "2026-07-06", "summary": "Dense spatial perception is essential for physical intelligence, where visual systems are expected to recover structured, metric, and actionable representations from pixel observations. Modern visual foundation models tend to prioritize semantic invariance, often at the expense of detailed spatial understanding. In this work, we study vision pretraining through a boundary-centric lens, motivated by the premise that boundaries and shape discontinuities offer essential cues for perceiving geometric properties. Concretely, we propose masked boundary modeling, a self-supervised paradigm that dynamically learns sub-pixel boundary representations and subsequently leverages the discovered boundary-bearing tokens as masked targets to facilitate dense visual token learning. By scaling this framework, we develop LingBot-Vision and demonstrate its efficacy across a diverse set of downstream vision tasks with DINOv3 as a strong bas
