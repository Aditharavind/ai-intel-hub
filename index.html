nd driven by artificial intelligence. Each campus is planned to exceed one gigawatt of capacity. Lightpath will provide triverse fiber infrastructure and multi-terabit capacity to the two facilities, located in Saline, Michigan &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/lightpath-to-deliver-ai-grade-fiber-infrastructure-to-two-new-hyperscale-data-center-campuses/\">Read More &#8594;<span class=\"screen-reader-text\"> \"Lightpath to Deliver AI-Grade Fiber Infrastructure to Two New Hyperscale Data Center Campuses\"<\/span><\/a>"}, {"title": "DeepInfra Expands AI Inference Capacity with First International Data Center in Toronto", "source": "EE Journal", "date": "2026-07-09", "url": "https://www.eejournal.com/industry_news/deepinfra-expands-ai-inference-capacity-with-first-international-data-center-in-toronto/", "summary": "DeepInfra, a purpose-built cloud platform for high-throughput AI inference, today announced the opening of a new data center location in Toronto. Global AI infrastructure demand is increasingly being driven by inference workloads as enterprises shift from model training to production-scale deployment. According to research from McKinsey &#38; Company, AI inference is projected to account for more than &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/deepinfra-expands-ai-inference-capacity-with-first-international-data-center-in-toronto/\">Read More &#8594;<span class=\"screen-reader-text\"> \"DeepInfra Expands AI Inference Capacity with First International Data Center in Toronto\"<\/span><\/a>"}, {"title": "Infineon supplies SiC technology to ADVANTICS, enhancing efficiency in power converters for megawatt charging", "source": "EE Journal", "date": "2026-07-09", "url": "https://www.eejournal.com/industry_news/infineon-supplies-sic-technology-to-advantics-enhancing-efficiency-in-power-converters-for-megawatt-charging/", "summary": "Infineon Technologies AG (FSE: IFX / OTCQX: IFNNY) will supply CoolSiC™ MOSFETs 1200 V and matching dual-channel EiceDRIVER™ 2EDB9259Y gate drivers to ADVANTICS, a technology leader in silicon carbide (SiC) power electronics and advanced control systems, for its new line of liquid-cooled power converters. The solutions enhance efficiency, power density and reliability in applications such &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/infineon-supplies-sic-technology-to-advantics-enhancing-efficiency-in-power-converters-for-megawatt-charging/\">Read More &#8594;<span class=\"screen-reader-text\"> \"Infineon supplies SiC technology to ADVANTICS, enhancing efficiency in power converters for megawatt charging\"<\/span><\/a>"}, {"title": "We’re One Step Closer to Drag-and-Drop Off-the-Shelf Chiplet-Based Design", "source": "EE Journal", "date": "2026-07-09", "url": "https://www.eejournal.com/article/were-one-step-closer-to-drag-and-drop-off-the-shelf-chiplet-based-design/", "summary": "<img alt=\"\" class=\"webfeedsFeaturedVisual wp-post-image\" height=\"300\" src=\"https://www.eejournal.com/wp-content/uploads/2026/07/max-0499-image-for-home-page-zero-asic-300x300.jpg\" style=\"display: block; margin-bottom: 5px; clear: both;\" width=\"300\" />Close your eyes and imagine the following scene. No. That won’t work, will it? Let’s try doing this a different way. Keep your eyes open and imagine they’re closed. Visualize a future timeline where you use a GUI to drag-and-drop chiplets onto an active silicon substrate, run simulations and profiling, fine-tune your design, pick a &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/article/were-one-step-closer-to-drag-and-drop-off-the-shelf-chiplet-based-design/\">Read More &#8594;<span class=\"screen-reader-text\"> \"We’re One Step Closer to Drag-and-Drop Off-the-Shelf Chiplet-Based Design\"<\/span><\/a>"}, {"title": "Rikomagic DS04 – An Android 14 4K digital signage player powered by Rockchip RK3576 SoC", "source": "CNX Software", "date": "2026-07-08", "url": "https://www.cnx-software.com/2026/07/08/rikomagic-ds04-an-android-14-4k-digital-signage-player-powered-by-rockchip-rk3576-soc/", "summary": "<div><img alt=\"Rikomagic DS04 4K digital signage player\" class=\"attachment-medium size-medium wp-post-image\" height=\"480\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/07/Rikomagic-DS04-4K-digital-signage-player-720x480.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Rikomagic DS04 is a new 4K digital signage player running Android 14 on a Rockchip RK3576 octa-core Cortex-A72/A53 processor paired with 4GB of RAM and 32GB of storage. It looks to be a cost-down version of the Rockchip RK3588-powered Rikomagic DS08 8K digital signage player with many of the same ports and features, including two 4K-capable HDMI 2.1 ports, a Gigabit Ethernet RJ45 jack, WiFi 6 and Bluetooth 5.2 connectivity, optional 4G LTE, and a few USB ports. Rikomagic DS04 specifications: SoC – Rockchip RK3576 CPU 4x Cortex-A72 cores at 2.3GHz, 4x Cortex-A53 cores at 2.2GHz Arm Cortex-M0 MCU at 400MHz GPU – ARM Mali-G52 MC3 GPU with support for OpenGL ES 1.1, 2.0, and 3.2, OpenCL up to 2.0, and Vulkan 1.1 NPU – 6 TOPS (INT8) AI accelerator with support for INT4/INT8/INT16/BF16/TF32 mixed operations. VPU Video Decoder – H.264, H.265, VP9, AV1, and AVS2 up to 8Kp30 or [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/07/08/rikomagic-ds04-an-android-14-4k-digital-signage-player-powered-by-rockchip-rk3576-soc/\">Rikomagic DS04 &#8211; An Android 14 4K digital signage player powered by Rockchip RK3576 SoC<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "KKSB 10-inch and 19-inch rack panels target Raspberry Pi clusters, support Pi HATs and active coolers", "source": "CNX Software", "date": "2026-07-08", "url": "https://www.cnx-software.com/2026/07/08/kksb-10-inch-and-19-inch-rack-panels-target-raspberry-pi-clusters-support-pi-hats-and-active-coolers/", "summary": "<div><img alt=\"KKBS Raspberry Pi Rack Panel\" class=\"attachment-medium size-medium wp-post-image\" height=\"480\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/07/KKBS-Raspberry-Pi-Rack-Panel-720x480.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>KKSB Cases has introduced a series of rack panels designed for Raspberry Pi clusters in standard rack enclosures. The lineup includes a 10-inch 1U model for two Raspberry Pi boards, a 19-inch 1U model for five boards, and a 19-inch 2U model for up to ten boards. All the panels support Raspberry Pi 5, Raspberry Pi 4, Raspberry Pi 3, Pi 2, and other boards sharing the same mounting hole pattern. The rack panels are made from powder-coated steel and expose the USB and Ethernet ports on the front of the rack for easier cable management. Each slot provides room for Raspberry Pi HATs and the official Raspberry Pi active cooler. KKSB also includes hex standoffs and 40-pin GPIO headers so HATs can be installed above the SBCs when additional clearance is required. Each Raspberry Pi is first attached to an individual mounting tray, which is then secured into the [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/07/08/kksb-10-inch-and-19-inch-rack-panels-target-raspberry-pi-clusters-support-pi-hats-and-active-coolers/\">KKSB 10-inch and 19-inch rack panels target Raspberry Pi clusters, support Pi HATs and active coolers<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "ACEMAGIC discounts its AMD Ryzen 7 mini PCs by up to 32% for a limited time (Sponsored)", "source": "CNX Software", "date": "2026-07-08", "url": "https://www.cnx-software.com/2026/07/08/acemagic-discounts-its-amd-ryzen-7-mini-pcs-by-up-to-32/", "summary": "<div><img alt=\"ACEMAGIC Retro X3\" class=\"attachment-medium size-medium wp-post-image\" height=\"647\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/07/ACEMAGIC-Retro-X3-720x647.webp\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>ACEMAGIC has launched a promotion for two of its AMD Ryzen 7 mini PCs. The Matrix Mini K1 mini PC, powered by a Ryzen 7 7730U paired with 16GB LPDDR4X and a 512GB NVMe SSD, benefits from a 23% discount down to $386, and the company offers an even deeper 32% discount for the ACEMAGIC Retro X3 Ryzen 7 H 255 mini PC, shipping with 16GB LPDDR5 and a 1TB NVME SSD. ACEMAGICIAN Matrix Mini K1 Key features and specifications: SoC &#8211; AMD Ryzen 7 7730U 8-core/16-thread CPU @ up to 4.5 GHz with AMD Radeon Graphics  @ 2000 MHz; TDP: 15W System Memory &#8211; 16GB LPDDR4X Storage &#8211; 512GB NVMe SSD Video Output HDMI 2.0, DP 1.4b, USB-C with DisplayPort Alt mode Up to 3x 4K displays supported Audio &#8211; 3.5 mm audio jack Networking Ethernet RJ45 port WiFI and Bluetooth USB 4x USB 3.2 Gen1 ports 2x USB [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/07/08/acemagic-discounts-its-amd-ryzen-7-mini-pcs-by-up-to-32/\">ACEMAGIC discounts its AMD Ryzen 7 mini PCs by up to 32% for a limited time (Sponsored)<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Qualcomm Unveils Dragonfly Data Center Portfolio for Agentic AI Infrastructure", "source": "Embedded.com", "date": "2026-07-08", "url": "https://www.embedded.com/qualcomm-unveils-dragonfly-data-center-portfolio-for-agentic-ai-infrastructure/", "summary": "<p>The new CPUs, AI accelerators and HBC technology target higher inference throughput, improved energy efficiency and lower AI infrastructure costs.<\/p>\n<p>The post <a href=\"https://www.embedded.com/qualcomm-unveils-dragonfly-data-center-portfolio-for-agentic-ai-infrastructure/\">Qualcomm Unveils Dragonfly Data Center Portfolio for Agentic AI Infrastructure<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "Advantech Introduces Dragonwing IQ9-Based Edge AI Solutions", "source": "Embedded.com", "date": "2026-07-08", "url": "https://www.embedded.com/advantech-introduces-dragonwing-iq9-based-edge-ai-solutions/", "summary": "<p>Advantech Co. Ltd. has expanded its edge AI portfolio with a new family of industrial computing platforms based on the Qualcomm Dragonwing IQ-9075 processor. The new lineup includes the AOM-6741 SMARC module, the ASR-A503 and AFE-A503 robotic controllers, and the AIR-055 edge AI system, all designed to support advanced vision-based artificial intelligence applications in industrial [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/advantech-introduces-dragonwing-iq9-based-edge-ai-solutions/\">Advantech Introduces Dragonwing IQ9-Based Edge AI Solutions<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "Virginia Fiber Express Networks Advances Licensing and Permitting for Phase 1 of a State-Wide Fiber Network", "source": "EE Journal", "date": "2026-07-08", "url": "https://www.eejournal.com/industry_news/virginia-fiber-express-networks-advances-licensing-and-permitting-for-phase-1-of-a-state-wide-fiber-network/", "summary": "Virginia Fiber Express Networks LLC (VFE Networks), a wholly owned subsidiary of Infraforward Strategies LLC, announces the successful securing of Competitive Local Exchange Carrier (CLEC) and Interexchange Carrier (IXC) operating licenses and Land Use permit from the Commonwealth of Virginia. Having achieved these milestones, VFE Networks, in collaboration with its Virginia-based partners Express Technologies Inc. (Express-tek) and S&#38;N Infrastructure, &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/virginia-fiber-express-networks-advances-licensing-and-permitting-for-phase-1-of-a-state-wide-fiber-network/\">Read More &#8594;<span class=\"screen-reader-text\"> \"Virginia Fiber Express Networks Advances Licensing and Permitting for Phase 1 of a State-Wide Fiber Network\"<\/span><\/a>"}, {"title": "How NOR Flash Memory Safety Features Protect Linux Systems", "source": "Embedded.com", "date": "2026-07-07", "url": "https://www.embedded.com/how-nor-flash-memory-safety-features-protect-linux-systems/", "summary": "<p>Utilizing the safety features in NOR flash memories such as error correction and data integrity checks can enhance the reliability and integrity of Linux-based applications, particularly in safety-critical domains such as automotive (e.g., in-vehicle infotainment, advanced-driver assistance systems, telematics) and industrial automation (e.g., HMI panels). Linux, an open-source operating system, maintains initiatives that support safety-critical [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/how-nor-flash-memory-safety-features-protect-linux-systems/\">How NOR Flash Memory Safety Features Protect Linux Systems<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "Syslogic, Ark Vision Partner on Rugged Edge AI Hardware", "source": "Embedded.com", "date": "2026-07-07", "url": "https://www.embedded.com/syslogic-ark-vision-partner-on-rugged-edge-ai-hardware/", "summary": "<p>Syslogic and Ark Vision Systems have announced a collaboration to deliver a fully integrated hardware platform for edge AI applications. The joint solution combines Ark Vision Systems' GMSL2 machine vision cameras with Syslogic's rugged embedded computers, providing developers with a ready-to-deploy hardware foundation for industrial automation, agriculture, mobility, robotics, and other environments that require reliable [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/syslogic-ark-vision-partner-on-rugged-edge-ai-hardware/\">Syslogic, Ark Vision Partner on Rugged Edge AI Hardware<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "What's Next for the Renesas 365 Development Platform", "source": "Embedded.com", "date": "2026-07-06", "url": "https://www.embedded.com/whats-next-for-the-renesas-365-development-platform/", "summary": "<p>Renesas Electronics Corp. recently announced its acquisition of U.S. software developer startup Pictorus, based in Oakland, California. The company plans to integrate Pictorus's cloud-based behavioral modeling platform into the Renesas 365 electronics development platform. The upgraded toolchain for the Altium-powered embedded design platform is expected to deliver a more streamlined design environment for embedded engineers. [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/whats-next-for-the-renesas-365-development-platform/\">What’s Next for the Renesas 365 Development Platform<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "GigaDevice Unveils I2C EEPROMs", "source": "Embedded.com", "date": "2026-07-06", "url": "https://www.embedded.com/gigadevice-unveils-i2c-eeproms/", "summary": "<p>The I²C EEPROMs with integrated ECC offer up to four million program/erase cycles.<\/p>\n<p>The post <a href=\"https://www.embedded.com/gigadevice-unveils-i2c-eeproms/\">GigaDevice Unveils I2C EEPROMs<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}], "papers": [{"title": "PanoWorld: Real-World Panoramic Generation", "authors": ["Haoyuan Li", "Dizhe Zhang", "Yuemei Zhou", "Xiangkai Zhang", "Haoran Feng", "Xiaofan Lin", "Wenjie Jiang", "Bo Du", "Ming-Hsuan Yang", "Lu Qi"], "published": "2026-07-10", "summary": "In this work, we aim to address the challenge of long-range memory in panoramic world models by exploiting the rotation-equivariant property of omnidirectional representations, where rotation can be treated as an implicit geometric transformation.Building on this insight, we propose PanoWorld, which simplifies camera trajectories into translations via fixed headings for both current-action modeling and long-range memory through Dense Panoramic Ray-Conditioning (DPRC) and Geometry-aware Memory Augmentation (GMA).Then, a three-stage training pipeline is introduced to progressively optimize each component. To better evaluate physical consistency under large-scale spatial variations and diverse illumination conditions, where existing datasets are relatively stable, we construct World360, a large-scale dataset consisting of both real-world video clips collected via panoramic unmanned aerial vehicles and high-quality simulated clips generated by AirSim360.Extensive experiments on World360 demonstrate the effectiveness of PanoWorld, outperforming alternative methods by a large margin.Our models, training code, and dataset will be publicly available. More information can be found on our project page: https://lihaoy-ux.github.io/panoworld-page/.", "pdf_url": "https://arxiv.org/pdf/2607.09661v1"}, {"title": "Scalable Visual Pretraining for Language Intelligence", "authors": ["Yiming Zhang", "Zhonghan Zhao", "Wenwei Zhang", "Haiteng Zhao", "Tianyang Lin", "Yunhua Zhou", "Demin Song", "Kuikun Liu", "Haochen Ye", "Haian Huang", "Yuzhe Gu", "Haijun Lv", "Qipeng Guo", "Bin Liu", "Gaoang Wang", "Kai Chen"], "published": "2026-07-10", "summary": "The rapid progress of large foundation models has been driven predominantly by pretraining on large-scale text corpora. However, many forms of knowledge are conveyed through visual representations, where figures, typeset equations, and page layouts carry rich information that cannot be faithfully or completely captured by text alone. Yet current pretraining approaches discard these visual cues by converting visually rich sources, such as documents and web pages, into plain text for learning language intelligence. This paper challenges the default assumption that language models must be trained on text-only representations and shows that Visual Pretraining is a scalable learner for foundation model intelligence. To this end, we conduct a systematic study of unsupervised visual pretraining paradigms that directly leverage visual documents without text extraction. Across multiple backbones and benchmarks, visual pretraining on the same underlying corpora consistently outperforms text-only pretraining, offering an efficient pathway to scalable language intelligence.", "pdf_url": "https://arxiv.org/pdf/2607.09657v1"}, {"title": "Revisiting Euler-Angle Regression with Kolmogorov-Arnold Networks", "authors": ["Yangting Sun", "Zijun Cui", "Yufei Zhang"], "published": "2026-07-10", "summary": "In many real-world systems, including articulated robots and biomechanical models, rotations are defined in joint space and naturally parameterized by Euler angles with bounded ranges. Yet regressing Euler angles remains challenging, as their discontinuities and singularities often destabilize training. In this work, we revisit Euler-angle regression and show that its effectiveness depends critically on the interaction between rotation representation, regression architecture, and domain constraints. We introduce a new framework that combines range-aware Euler modeling with Kolmogorov-Arnold Networks (KAN), which replace fixed node-wise activations with learnable univariate functions on edges. We further provide theoretical analysis indicating that bounded Euler ranges motivate a near-additive structure in the regression function, which favors the additive functional form of KAN, and we confirm this trend empirically. Extensive experiments on controlled rotation regression, object pose estimation, and robotic and human inverse kinematics demonstrate consistent improvements in accuracy, convergence, and efficiency. The code will be publicly available.", "pdf_url": "https://arxiv.org/pdf/2607.09650v1"}, {"title": "B-spline Policy: Accelerating Manipulation Policies via B-spline Action Representations", "authors": ["Xiaoshen Han", "Haoyu Xiong", "Haonan Chen", "Chaoqi Liu", "Antonio Torralba", "Yuke Zhu", "Yilun Du"], "published": "2026-07-10", "summary": "In this work, we present B-spline Policy (BSP), an action representation designed for accelerating robot manipulation policies. Rather than predicting discrete-time action chunks, BSP parameterizes actions as continuous B-spline curves defined by a set of knots and control points. This representation yields smooth, time-continuous trajectories that can be temporally scaled and executed by low-level controllers at higher frequencies and speeds. We show that B-spline-parameterized actions can be seamlessly integrated into standard policy learning pipelines by directly predicting B-spline parameters. Experiments on simulated and real-world tasks demonstrate that BSP significantly reduces task completion time, achieving substantial improvements over baseline methods while maintaining strong success rates. More results: https://b-spline-policy.github.io", "pdf_url": "https://arxiv.org/pdf/2607.09648v1"}, {"title": "PAC-ACT: Post-training Actor-Critic for Action Chunking Transformers", "authors": ["Yujie Pang", "Zudong Li"], "published": "2026-07-10", "summary": "Precision industrial contact manipulation requires reliable robot policies under pose perturbations and contact-force constraints. Vision-language-action models offer broad generalization but often introduce high inference latency and GPU-memory cost, while vision-action chunking policies are more suitable for real-time industrial control. However, these policies are usually trained by behavior cloning and suffer from distribution shift in contact-rich tasks. This paper proposes PAC-ACT, a reinforcement-learning post-training framework for pretrained Action Chunking Transformer policies. PAC-ACT reformulates policy optimization at the chunk level, constructs an ACT-transferred actor-critic architecture, and introduces a hybrid behavior-prior constraint to preserve the pretrained action distribution during online fine-tuning. Experiments on industrial precision-contact benchmarks show that PAC-ACT improves task success, contact stability, and force safety while retaining low latency and low GPU-memory usage. On the Contour task, PAC-ACT significantly reduces peak contact force and decreases the proportion of force readings above 60 N by 46 times. Sparse-reward ablations further show that the proposed behavior-prior constraint enables effective exploration under randomized initial poses.", "pdf_url": "https://arxiv.org/pdf/2607.09590v1"}, {"title": "CoDiMAD: Diffusion-Based Privileged Distillation for Communication-Free Multi-Robot Coordination", "authors": ["Jiyue Tao", "Shunheng Xin", "Tongsheng Shen", "Dexin Zhao", "Feitian Zhang"], "published": "2026-07-10", "summary": "Decentralized multi-robot coordination under partial observability remains challenging, especially in communication-free settings where agents must act solely from local sensor observations. Privileged policy distillation provides a promising approach by transferring knowledge from a globally informed oracle to sensor-constrained students. However, in multi-agent systems, the same local observation may correspond to multiple global configurations requiring qualitatively different cooperative actions, making the conditional action distribution inherently multi-modal. Standard deterministic distillation collapses these modes to their mean, often yielding invalid or hesitant actions. To address this issue, we propose CoDiMAD, a three-stage framework that trains a privileged oracle with MAPPO, constructs an offline dataset of local-observation-oracle-action pairs, and distills the oracle into decentralized students parameterized as conditional denoising diffusion probabilistic models. By approximating the conditional oracle-action distribution through the diffusion reverse process, CoDiMAD samples decisive actions from coherent coordination modes rather than averaging across them. Theoretical analysis characterizes the mode-averaging failure of deterministic distillation and the distributional recovery property of diffusion-based distillation. Experiments on three cooperative tasks show that CoDiMAD consistently outperforms direct local MARL and deterministic distillation baselines. The source code will be made publicly available upon acceptance.", "pdf_url": "https://arxiv.org/pdf/2607.09587v1"}, {"title": "Promptable Concept Segmentation from Above: Evaluating SAM 3's Zero-Shot and One-Shot Capabilities in Remote Sensing", "authors": ["Mohammad Dabaja", "Turgay Celik"], "published": "2026-07-10", "summary": "The deployment of large-scale foundation models, such as the Segment Anything Model 3 (SAM 3), promises a transition toward open-vocabulary, training-free computer vision. However, their capacity to generalize out-of-distribution to the complex, top-down geometric structures of Earth Observation imagery remains largely unquantified. Driven by SAM 3's performance disparities in highly specialized domains, we present a comprehensive, multi-task empirical evaluation across remote sensing scene classification, object detection, and instance segmentation under strict zero-shot and one-shot constraints. To achieve this, we introduce a structural adaptation of SAM 3 by repurposing its decoupled binary presence head into a standalone zero-shot classifier. Furthermore, by systematically isolating textual and visual prompt modalities across five configurations, we explicitly diagnose the alignment mechanics within the model's multimodal decoder. Our findings reveal severe cross-modal interference: while visual prompts successfully align the decoder to complex remote sensing geometry, textual prompts inject misaligned, ground-level semantic bias, actively degrading coordinate regression. To benchmark these capabilities without resource-intensive training, we formulate a novel training-free proxy evaluation protocol for Generalized Zero-Shot tasks (scene classification and instance segmentation). Ultimately, our results demonstrate that SAM 3 avoids the overfitting commonly seen in legacy domain-adapted models, achieving high Harmonic Mean scores in segmentation tasks. However, it remains fundamentally constrained by sub-pixel resolution limits and overhead semantic blind spots, charting a definitive mandate for parameter-efficient geospatial fine-tuning of its multimodal decoder.", "pdf_url": "https://arxiv.org/pdf/2607.09583v1"}, {"title": "A censoring-aware target interface for tabular foundation models in survival prediction", "authors": ["Yue Lyu", "Steven H. Lin", "Xuelin Huang", "Ziyi Li"], "published": "2026-07-10", "summary": "Time-to-event prediction from tabular patient data is central to prognosis and biomedical decision support, but right-censored follow-up prevents direct use of ordinary regression labels. Tabular foundation models offer reusable prediction machinery for modest heterogeneous datasets, yet they generally assume fully observed outcomes. We introduce SurvFM-RMST, a censoring-aware target-interface framework that converts survival outcomes into jackknife pseudo-observation targets for restricted mean survival time, enabling multiple tabular backbones to perform horizon-specific RMST regression without survival-specific fine-tuning. In controlled simulations with known conditional RMST, SurvFM-RMST recovered restricted event-free time accurately, and pseudo-RMST targets outperformed naive restricted observed-time and event-only targets. Across 36 eligible static SurvSet datasets, SurvFM backbones were competitive with established survival and RMST-regression comparators, though relative performance varied by endpoint, horizon and practical constraints. Predicted RMST further stratified held-out patients into groups with ordered observed event-free time and event enrichment. Overall, the results support pseudo-RMST target construction as a portable interface between censored survival data and tabular foundation-model prediction.", "pdf_url": "https://arxiv.org/pdf/2607.09577v1"}, {"title": "CORAL-AUV: CFD Oriented Reinforcement Learning for Autonomous Underwater Vehicles", "authors": ["Steven Roche", "Milo Van Mooy", "Nathan McGuire", "Levi Cai", "Jonathan P. How", "Yogesh Girdhar"], "published": "2026-07-10", "summary": "Fine grain control and positioning of autonomous underwater vehicles (AUVs) is critical for sampling, maintenance, and survey applications. Traditional control methods for AUVs are labor intensive and are not robust to changes in the vehicle configuration or environmental conditions. Reinforcement learning (RL) promises rapid controller development while handling a range of deployment parameters via domain randomization (DR). However, DR is still limited by the capacity of the underlying simulation to model real physics. In particular, drag physics are difficult to model and are a large contributor to sim-to-real gaps. Meanwhile, computational fluid dynamics (CFD) provides high fidelity drag models but is challenging to leverage within reinforcement learning frameworks due to its computational overhead. Thus, in this paper we exploit the idea of training surrogate approximations of CFD models of a given vehicle, enabling fast inference within RL pipelines. We are the first to successfully deploy a zero-shot RL policy on a 6-DOF AUV in which policy training is performed on surrogate drag models (SDMs) trained on CFD data. We find 31% lower energy usage compared to a controller using simplified physics while traversing between waypoints 11% faster with 19% less error. Our SDM based RL controller better predicts zero-shot transfer and is more robust across reward shaping design choices. When using DR to complete a task with perturbed parameters, we find that the CFD policy is the only controller that successfully transfers. The policies are evaluated in a controlled tank environment and in the field providing extensive testing of the policies' capabilities.", "pdf_url": "https://arxiv.org/pdf/2607.09557v1"}, {"title": "Task-Adaptive Design of Modular Aerial Manipulators Under Airflow Exposure Constraints", "authors": ["Mengguang Li", "Heinz Koeppl"], "published": "2026-07-10", "summary": "Aerial manipulation with multirotor platforms enables physical interaction in complex environments, but rotor-induced airflow remains a critical limitation for tasks involving airflow-sensitive targets or surroundings. This paper presents an optimization-based design framework for modular aerial manipulators that jointly considers task wrench feasibility, end-effector placement, and airflow exposure constraints. We first introduce a novel categorization of target-side airflow tolerance and formulate the corresponding exposure requirements as geometric constraints. To efficiently model rotor-induced airflow, we introduce a compact cone-sphere envelope that approximates the spreading structure of a quadrotor's airflow while preserving computational tractability for optimization. Building on this formulation, we propose a reconfiguration optimization that adapts a modular aerial manipulator to diverse task wrench requirements while enforcing both target-side airflow exposure and intra-platform airflow interference constraints. Unlike prior designs that assume a fixed end-effector location, the proposed framework optimizes the end-effector placement together with the platform configuration. Scalability experiments and ablation studies validate the effectiveness of the proposed framework.", "pdf_url": "https://arxiv.org/pdf/2607.09548v1"}, {"title": "CoCoT-EEG: Contrastive-Pretrained Multiscale Convolutional Transformer for EEG Decoding", "authors": ["Gabriel Mahuas", "Victoria Shevchenko", "Ugo Tanielian", "Yassir Bendou", "Richard Gao"], "published": "2026-07-10", "summary": "Self-supervised pretrained foundation models (FM) have shown early promise for non-invasive electroencephalogram (EEG) decoding applications. Many recent large-scale models converged on the approach of tokenizing raw EEG followed by masked reconstruction pretraining. However, this recipe has been shown to be suboptimal for data, like EEG, with high noise amplitude and information confined to limited dimensions such as narrow frequency bands. Building on this insight, we develop a novel contrastive-pretrained EEG model with multiscale temporal convolution input layers and Transformer encoder blocks (CoCoT). CoCoT matches or beats state-of-the-art reconstruction-pretrained EEG models on extensive benchmark decoding tasks with heterogeneous electrode configurations. Furthermore, CoCoT trained from scratch outperforms previous single-task decoding models and even rivals pretrained models, showcasing the architecture's flexibility and data efficiency. Through systematic ablations, including model architecture and pretraining objective, we demonstrate the viability of contrastive learning for building EEG FMs while suggesting key architectural design considerations, prompting further investigations in alternative large-scale pretraining strategies.", "pdf_url": "https://arxiv.org/pdf/2607.09543v1"}, {"title": "GatedLinear: Adaptive Routing of Complementary Linear Bases for Time Series Forecasting", "authors": ["Qitai Tan", "Ruiwen Gu", "Yilin Su", "Mo Li", "Xu Lin", "Xiao-Ping Zhang"], "published": "2026-07-10", "summary": "Time series forecasting requires models to capture diverse, often mutually exclusive, temporal dynamics, from smooth trend continuation to nonstationary drift and strict phase-aligned recurrence. While recent deep learning models have improved accuracy, they typically force these diverse patterns through a single computational backbone governed by fixed algorithmic inductive biases (e.g., self-attention or spectral filtering). This single-mechanism approach often struggles with the profound heterogeneity of real-world series, where different variables and forecast horizons necessitate fundamentally different predictive treatments. To address this, we propose GatedLinear: a lightweight framework that frames forecasting as the adaptive routing of complementary linear bases. GatedLinear leverages a pool of three specialized mechanisms: a global trend-seasonal basis for smooth projection, a difference-based incremental basis for nonstationary drift, and a phase-aligned recurrence basis for explicit cyclic reuse. To dynamically orchestrate these distinct behaviors, we introduce a Tri-Factorized Fusion Gate that disentangles routing decisions into channel-specific preferences, horizon-aware offsets, and phase-indexed biases derived from known future time marks. This design allows the model to perform highly granular, point-wise soft routing across different predictive regimes without stacking computationally heavy neural modules. Experiments on standard benchmarks show that our method achieves state-of-the-art or highly competitive accuracy against recent complex foundational models, while offering explicitly interpretable routing patterns and operating with a substantially smaller parameter footprint.", "pdf_url": "https://arxiv.org/pdf/2607.09537v1"}, {"title": "How Mobile Gas Sensor Trajectories Govern Hydrogen Leak Detection: A Safety Gap in Manual Leak Inspection of Hydrogen System Components", "authors": ["Christian Masuhr", "Arne Wendt", "Thorsten Schüppstuhl"], "published": "2026-07-10", "summary": "The integrity of hydrogen infrastructure relies on reliable leak detection, performed almost exclusively via manual tracer gas sniffing in electrolyzer manufacturing. Although mandated by standards, the lack of spatial probe guidance instructions leaves detection reliability entirely to operator execution, further compromised by sensor signal delays. This study quantifies how sniffer trajectory kinematics affect detection reliability at small-scale pipes and fittings, a near-field regime largely neglected by macroscopic dispersion research. Using a robotically guided test bench to eliminate operator variability, static concentration fields and dynamic trajectory passes were acquired across representative geometries under standardized leak rates (5 vol% hydrogen in nitrogen) and varying scanning velocities. Results demonstrate that scanning velocity and spatial probe orientation strongly dictate detectability. Conventional linear trajectories frequently miss leaks under dynamic conditions, causing severe false negatives. Conversely, geometry-specific routing, such as circumferential plunging paths around sealing points, maintains a high safety margin. From these observations, geometry-specific routing rules and a reduction-factor model for dynamic signal loss are derived. The findings reveal that current standard operating procedures pose a tangible safety risk. To operationalize these rules, a proof-of-concept software pipeline is presented, generating validated trajectories directly from 3D models for visualization in assistance systems.", "pdf_url": "https://arxiv.org/pdf/2607.09527v1"}, {"title": "ALICE: Learning a General-Purpose Pathology Foundation Model from Vision, Vision-Language, and Slide-Level Experts", "authors": ["Jiawen Li", "Tian Guan", "Huijuan Shi", "Xitong Ling", "Mingxi Fu", "Anjia Han", "Chao He", "Yonghong He"], "published": "2026-07-10", "summary": "Foundation models are reshaping computational pathology, yet their capabilities remain shaped by pretraining objectives, data sources, and spatial scales, fragmenting complementary expertise across separate backbones. Here we present ALICE, a unified foundation model trained through multi-stage agglomerative distillation that sequentially distills eight vision-only, vision-language, and slide-level teacher models into dedicated modules of a single backbone. ALICE is pretrained on 24,985,184 tile-level pathology images and 155,604 high-resolution images, and evaluated across 21 task scenarios, 96 downstream tasks, and 48 data sources, spanning region-of-interest tissue analysis, vision-language multimodal evaluation, and whole-slide clinical assessment. In all three evaluation settings, ALICE achieved the best average rank among task-matched pathology foundation models. These results demonstrate that agglomerative distillation can consolidate complementary capabilities from specialized models into a unified backbone for broad computational pathology applications. The model is available at https://github.com/WonderLandxD/ALICE.", "pdf_url": "https://arxiv.org/pdf/2607.09526v1"}, {"title": "Seeing is Free, Speaking is Not: Uncovering the True Energy Bottleneck in Edge VLM Inference", "authors": ["Junfei Zhan", "Haoxun Shen", "Mingang Guo", "Zixuan Huang", "Tengjiao He"], "published": "2026-07-10", "summary": "Vision-Language Models (VLMs) are the perceptual backbone of embodied AI, but their energy footprint on edge hardware remains poorly understood. Existing efficiency efforts focus predominantly on reducing visual tokens, implicitly treating visual processing as the dominant energy cost. We overturn this implicit assumption through the first systematic energy profiling of on-device VLM inference, spanning five models across three architecture families, four input resolutions, and two hardware platforms (NVIDIA RTX 3070 and Jetson Orin NX). Our analysis yields three findings. First, average inference power is a model-intrinsic constant, invariant to input resolution, image complexity, and prompt type, with less than 5% variation across all conditions. This means that all energy variation across inputs must arise from variation in inference time, not from variation in power draw. Second, each output token costs 11 to 39x more wall-clock time than each input token due to the compute-bound and memory-bound asymmetry between prefill and decode, making output token count the dominant driver of both latency and energy. Third, image complexity, measured by the number of objects in an image, induces up to 4.1x energy differences at identical resolution. This variation arises not from increased visual processing cost, but from differences in output length. These findings expose a fundamental limitation of visual token pruning: even removing all visual tokens saves at most 10% of total energy for fixed-token models. Across models spanning 1 billion to 8 billion parameters, controlling output length saves up to 97% of total energy, with the energy dominance of decoding growing stronger at larger model scale. In short, the true energy bottleneck in edge VLM inference is not what the model sees, but how much it says.", "pdf_url": "https://arxiv.org/pdf/2607.09520v1"}, {"title": "DemoBridge: A Simulation-in-the-Loop Toolkit for Single-View Human Demonstration Retargeting", "authors": ["Zehao Wang", "Fabien Despinoy", "Sergey Zakharov", "Tinne Tuytelaars", "Rahaf Aljundi"], "published": "2026-07-10", "summary": "We present DemoBridge, an toolkit that turns a single-view RGB stereo recording of a human hand demonstration into an executable, physics-validated robot-arm trajectory. Retargeting across the embodiment gap is hard. A robot arm reaches a target with a long, articulated body whose links carry far more collision volume than a hand. Solving inverse kinematics for the mapped end-effector pose often yields no collision-free solution, and a trajectory imposes this at every waypoint. A single view adds noise, leaving the demonstrated reference inaccurate. At the core of DemoBridge is a single collision-aware planner. It optimizes the whole joint trajectory at once, reasoning jointly over alternative grasp poses, whole-arm and grasped-object collision, and fidelity to the demonstrated path. A physics simulator runs in the loop. It validates each phase as it is produced and backtracks on failure, so a demonstration that cannot be reproduced as given is re-planned rather than discarded. The resulting action sequence is dynamically stable and faithful to the demonstrated manipulation. It also doubles as a ready-to-use simulation rollout for policy learning. Grasp timing is inferred automatically, and the perception backends, robot, and pipeline stages are swappable from configuration. We evaluate whole-pipeline retargeting on three real-demonstration tasks and the planner on a controlled synthetic benchmark. Our code is available at https://gitlab.kuleuven.be/u0123974/demo-bridge/ .", "pdf_url": "https://arxiv.org/pdf/2607.09519v1"}, {"title": "One-Shot Multimodal Learning from Demonstration with Force-Constrained Elastic Maps", "authors": ["Brendan Hertel", "Jonathan Spanos", "Navya Garg", "Reza Azadeh"], "published": "2026-07-10", "summary": "Robotic manipulation tasks often require simultaneous reasoning over motion and contact forces, yet most Learning from Demonstration (LfD) methods model only spatial trajectories and neglect force interactions with the environment. This limitation reduces robustness and can lead to unsafe or inconsistent task reproduction in force-constrained settings. We propose a novel one-shot multimodal LfD framework for the segmentation, encoding, and reproduction of force-inclusive demonstrations. First, we introduce a multimodal probabilistic segmentation method that adaptively weighs spatial and force modalities over time, enabling the automatic extraction of force-aware motion primitives. Second, we extend the elastic maps representation to incorporate external force constraints during skill encoding and formulate a convex optimization procedure for learning force-consistent trajectory models. The resulting skills reproduce both motion and contact characteristics from a single demonstration while promoting safer execution by accounting for demonstrated force profiles. We validate our approach on five real-world manipulation tasks across two distinct force-sensing configurations: wrist force sensing on a UR5e with a Robotiq 2f-85 gripper and finger force sensing on a Kinova Gen3 with an Openhand Model O gripper. Experimental results demonstrate robust multimodal segmentation, accurate force-aware reproduction, and cross-platform generality.", "pdf_url": "https://arxiv.org/pdf/2607.09515v1"}, {"title": "What VGGT Knows About Overlap: Probing Geometric Foundation Models for Co-Visibility", "authors": ["Filippo Ziliotto", "Luciano Serafini", "Lamberto Ballan", "Tommaso Campari"], "published": "2026-07-10", "summary": "A fundamental challenge in 3D reconstruction and robotic localization is co-visibility: determining which image pairs share overlapping visible surfaces, particularly in scenarios with minimal overlap. We demonstrate that VGGT implicitly encodes co-visibility as an emergent behavior: without any supervision for this task, its internal representations exhibit a clear hierarchical structure mirroring that of large language models, i.e. early layers build a 3D-aware scene representation, while late layers act as dedicated co-visibility reasoners. In particular, we identify layer L17 as a negative anchor that consistently routes non-co-visible pairs for this backbone, regardless of the evaluation setting, providing task-grounded evidence of layer specialization in a geometry-grounded foundation model. Building on this, we introduce Co-VGGT, which freezes VGGT and trains only a lightweight layer-wise mixture-of-experts head (less than 7.5M parameters) to classify co-visibility from RGB alone, treating each layer as a specialized expert whose geometric abstraction is adaptively weighted per input pair. On the Co-VisiON benchmark, Co-VGGT surpasses the human annotation baseline and improves over prior work by more than 25% pairwise and 10% multiview. Pairwise predictions are well-calibrated (ECE=0.030), enabling direct use as edge weights in visibility graphs for downstream SfM and SLAM pipelines without post-hoc correction. Code and data are available.", "pdf_url": "https://arxiv.org/pdf/2607.09503v1"}, {"title": "Hydra++: Real-Time Hierarchical 3D Scene Graph Construction With Object-Level Shape Estimation", "authors": ["Hyungtae Lim", "Nathan Hughes", "Xihang Yu", "Ruihan Xu", "Yun Chang", "Jingnan Shi", "Rajat Talak", "Luca Carlone"], "published": "2026-07-10", "summary": "3D scene graphs provide a hierarchical abstraction of environments by encoding spatial entities, such as objects and places, and their relationships. However, existing scene graph systems model object geometry coarsely, relying on partial point clouds or class-level CAD templates, which limits instance-specific shape detail. This paper presents Hydra++, a system-level investigation into how learning-based object shape estimators can be integrated into a hierarchical 3D scene graph pipeline. Hydra++ incorporates category-agnostic shape estimation and a reprojection-mask consistency check to reject degenerate predictions from partial observations or imprecise segmentation. In its default CRISP-based configuration, Hydra++ performs online scene graph construction; slower estimators such as SAM3D are evaluated as modular alternatives to demonstrate generalization-latency trade-offs. Furthermore, to address the challenges of sparse and noisy depth measurements in outdoor environments, Hydra++ supports a hybrid LiDAR-camera configuration for large-scale operation, improving scene-level reconstruction quality. Experiments in both simulation and real-world outdoor campus scenarios demonstrate that Hydra++ improves object- and scene-level reconstruction quality. Project page is available at https://hydra-plusplus.github.io/.", "pdf_url": "https://arxiv.org/pdf/2607.09455v1"}, {"title": "A Sovereign, Open-Source Foundation Model for German and English", "authors": ["The Soofi-Team", ":", "Benedikt Droste", "David Fitzek", "Ruben Härle", "Lukas Helff", "Maximilian Idahl", "Alex Jude", "Abbas Goher Khan", "Maurice Kraus", "Timm Ruland", "Richard Rutmann", "Sebastian Sztwiertnia", "Markus Frey", "Daniil Gurgurov", "Jan Pfister", "Tom Röhr", "Sebastian von Rohrscheidt", "Jörg Bienert", "Nicolas Flores-Herr", "Simon Gottschalk", "Andreas Hotho", "Kristian Kersting", "Joachim Köhler", "Alexander Löser", "Wolfgang Nejdl", "Simon Ostermann", "Jan Plogsties", "Patrick Putzky", "Mehdi Ali", "Michael Fromm", "Max Lübbering"], "published": "2026-07-10", "summary": "We present Soofi S 30B-A3B, a sovereign, open-source Mixture-of-Experts (MoE) hybrid Mamba Transformer foundation model for German and English. Its hybrid design activates only 3B of 30B parameters per token and keeps the inference cache near-constant as context grows, giving it a decisive throughput advantage over dense models for long-context, high-concurrency deployment. Pretrained on roughly 27 trillion tokens with deliberately up-weighted German, Soofi S matches dense 14 to 27B models on aggregate English and German benchmarks while achieving the best code aggregates in both languages among 17 open base models, and outperforms every European sovereign baseline in our comparison, including ones far larger in active parameters. Among fully open models, Soofi S obtains the highest English and German evaluation scores, ahead of Olmo 3 32B and Apertus 70B. Soofi S was built end-to-end on the German Industrial AI Cloud, a sovereign HPC scale AI infrastructure operated by Deutsche Telekom in Munich. Soofi S will be released under highly permissive, open-access terms: weights, selected intermediate checkpoints, full per-source data accounting, hyperparameters, and training and evaluation code. Where source licenses permit, data-construction artifacts are released under permissive licenses; commercially licensed sources are documented with aggregate statistics and exact mixture accounting.", "pdf_url": "https://arxiv.org/pdf/2607.09424v1"}, {"title": "Mach-Mind-4-Flash Technical Report", "authors": ["Foundation Model Team"], "published": "2026-07-10", "summary": "We present Mach-Mind-4-Flash, a 35B-parameter Mixture-of-Experts (MoE) agentic model with 3B activated parameters. Through post-training optimization alone without scaling pre-training compute, the model achieves performance on par with or surpassing that of 100B-parameter-class models. By introducing scalable agentic interaction environments for large-scale reinforcement learning, the model attains significant performance gains on real-world application tasks. Our pipeline comprises three stages: (1) a unified RL/OPD training infrastructure with dynamic multi-teacher scheduling and operator-level acceleration, delivering 17\\% end-to-end training speedup; (2) multiple domain-specific RL experts trained in parallel across Reasoning, General, and Agent tracks, then fused into a single generalist via Multi-Teacher On-Policy Distillation (MOPD) -- a routed reverse-KL objective that eliminates the see-saw degradation of mixed-reward RL; (3) Hybrid Median-length Policy Optimization (HMPO), a single-stage token-efficiency method that compresses reasoning chains by 19--46\\% with $\\le$0.7 percentage-point accuracy loss. Mach-Mind-4-Flash scores 92.70 on AIME'26, 82.82 on IFBench, 80.74 on Behavioral-SafetyBench, 75.80 on BFCL-v4, 72.31 on BrowseComp-zh, and 84.20 on ClawBench -- leading or matching models with 10--30$\\times$ its activated size at a fraction of the inference cost.", "pdf_url": "https://arxiv.org/pdf/2607.09375v1"}, {"title": "PhysV2A: Reachability-Gated and Semantic-Mask-Constrained Feasibility Completion for Video-to-Robot Manipulation", "authors": ["Haohui Huang", "Junda Duan", "Tao Teng", "Chenguang Yang"], "published": "2026-07-10", "summary": "Video-based manipulation provides object-centric motion priors from human demonstrations, generated videos, or RGB-D observations, but such priors are typically embodiment-agnostic and cannot be directly executed by a specific robot. This paper presents \\textbf{PhysV2A}, a reachability-gated and semantic-mask-constrained feasibility-completion framework for converting video-derived 6D object motion into robot-executable manipulation trajectories. The key idea is to treat grasp feasibility as trajectory-conditioned rather than local: each RGB-D-generated 6-DoF grasp candidate is rigidly coupled with the recovered object motion to form a grasp-conditioned TCP trajectory hypothesis. PhysV2A then performs hierarchical reachability-gated selection, where infeasible grasp--trajectory pairs are rejected by robot-centric kinematic checks and surviving candidates are ranked by downstream execution suitability. For the selected reachable trajectory, a VLM-assisted and rule-validated S-Mask identifies task-critical and relaxable Cartesian components, enabling semantic-mask-constrained manipulability refinement through redundancy-first optimization and bounded Cartesian relaxation. Real-robot experiments on four tabletop manipulation tasks show that PhysV2A improves task success over representative video-prior and IK-only baselines, reduces kinematic-feasibility failures, and produces better-conditioned trajectories with bounded semantic deviations.", "pdf_url": "https://arxiv.org/pdf/2607.09365v1"}, {"title": "Shortcut Trajectory Planning for Efficient Offline Reinforcement Learning", "authors": ["Guanquan Wang", "Yoshimasa Tsuruoka"], "published": "2026-07-10", "summary": "Diffusion-based trajectory planners have shown strong performance in offline reinforcement learning, but their iterative denoising process often incurs high inference cost. Consistency-based planners reduce the number of sampling steps, yet they typically rely on a two-stage teacher--student distillation pipeline that increases training cost and may introduce instability. We propose Shortcut Trajectory Planning (STP), an offline model-based reinforcement learning framework that incorporates shortcut models as efficient trajectory generators. STP trains a conditional shortcut trajectory model in a single stage, supports adjustable one-step and few-step inference through step-size conditioning, and selects candidate plans using a critic augmented with feasibility-aware correction. Across standard D4RL benchmarks, including locomotion, navigation, manipulation, and dexterous control tasks, STP achieves strong performance while simplifying the training pipeline for fast generative planning.", "pdf_url": "https://arxiv.org/pdf/2607.09336v1"}, {"title": "Communication-Efficient Digital-Twin Coordination for Heterogeneous LLM Embodied Agents over Computing Power Networks", "authors": ["Nuocheng Yang", "Sihua Wang", "Zihan Chen", "Tony Q. S. Quek", "Changchuan Yin"], "published": "2026-07-10", "summary": "Embodied agent teams powered by heterogeneous large language models (LLMs) are being widely deployed in physical artificial intelligence such as smart factories, warehouses, and service robotics. To enable collaboration among such an agent team, efficient coordination mechanisms that operate reliably under limited network resources are required. However, existing heterogeneous LLM-agent coordination frameworks that rely on multi-round natural-language-based conversations introduce three coupled challenges. First, inter-agent dialogue incurs communication overhead that grows rapidly with team size. Second, the quality of coordination is constrained by the heterogeneous capabilities of the agent team's LLMs. Third, agents may suffer from action delays due to iterative negotiation. To address these challenges, we propose LDT-Coord, a networked coordination framework built upon a lightweight digital twin (DT). Specifically, each agent independently selects its intended action and reports both the action decision and a structured temporal constraint over shared resources to the DT server, thereby decoupling coordination performance from natural-language reasoning ability. Then, DT executes a training-free, rule-based orchestrator algorithm to resolve cross-agent conflicts and returns coordination instructions to prevent such conflicts. To further reduce communication overhead, we formulate agent reporting control as a constrained partially observable Markov decision process (C-POMDP) and solve it with the PPO-Lagrangian algorithm. Simulation results show that LDT-Coord achieves a task success rate comparable to conventional coordination methods while reducing communication overhead by more than 70x and maintaining robustness under LLM heterogeneity.", "pdf_url": "https://arxiv.org/pdf/2607.09330v1"}, {"title": "Effects of Robotic Touch on Older Users During Walking Guidance by a Humanoid Robot", "authors": ["Leonie Leven", "Marko Ackermann", "Christian Werner", "Melina Schmetterer", "Theresa Buchner", "Monika Eckstein", "Katja Mombaur"], "published": "2026-07-10", "summary": "The shortage of healthcare staff is a challenge in geriatric care. To address this, robots can be integrated into care settings to provide assistance and emotional support. A promising application is walking guidance, particularly benefiting older adults as navigation skills deteriorate with aging. As walking guidance involves direct contact, the aim of this study is to understand how older adults perceive and respond to different touch modes during guided walking. 24 older adults (68 - 88 yrs.) walked four times a ten-meter trajectory guided by the robot TIAGo Pro in four contact conditions: no physical contact (NC); physical contact through holding the robot's wrist with the hand (HH); physical interaction through linking arms with the robot (LA); and physical contact through resting the forearm on the robots forearm (FC). A multimodal assessment approach included electrocardiogram, electrodermal activity, contact force, distance to robot, and questionnaires. Physiological results reveal a slight increase in stress levels during robot interaction. Behavioural and subjective measures, however, show overall acceptance of robotic touch. The two conditions corresponding to larger interaction forces (HH and FC) were associated with lower relative distances between participant and robot, indicating a higher trust and confidence. Questionnaire responses supported these findings, evidencing greater perceived safety, trust and comfort in these conditions. This study provides insights for the design of robotic walking guidance assistance, indicating that gentle, stable touch is preferred by older adults in comparison to contactless interaction.", "pdf_url": "https://arxiv.org/pdf/2607.09323v1"}, {"title": "Differential Analysis of Multispectral Images for Terrain Identification", "authors": ["Omar Kashmar", "Hemendra Arya", "Fulvio Mastrogiovanni"], "published": "2026-07-10", "summary": "Reliable terrain understanding is a prerequisite for autonomous robot navigation. Yet, the widespread RGB-based perception can fail under low illumination, shadows, and material ambiguities. In this work we propose DRIFT, a lightweight multispectral framework that combines raw spectral bands and illumination-tolerant band-ratio representations through a dual-stream residual architecture and a differential fusion branch. Band ratios attenuate multiplicative acquisition effects (illumination/sensor gains), while the differential fusion explicitly highlights discrepancies between absolute-band and ratio-derived cues, which improves the robustness to noisy or partially unreliable spectral measurements. In the paper (i) we evaluate DRIFT on a new oil-on-soil multispectral dataset acquired using a MicaSense RedEdge-P camera mounted on an Unmanned Aerial Vehicle, and (ii) we provide an additional controlled study on water-on-grass under varying illumination and thermal perturbations (hot/cold water) to analyze NIR-sensitive effects. DRIFT consistently improves over strong baselines, while remaining compatible with edge deployment.", "pdf_url": "https://arxiv.org/pdf/2607.09319v1"}, {"title": "Robot Trajectron V3: A Probabilistic Shared Control Framework for SE(3) Manipulation", "authors": ["Pinhao Song", "Zhongxi Li", "Ze Fu", "Federico Ulloa Rios", "Renaud Detry"], "published": "2026-07-10", "summary": "We aim to address the challenge of teleoperating robotic arms for high-degree-of-freedom (high-DoF) manipulation tasks, which is cognitively demanding and error-prone, particularly when relying on low-bandwidth interfaces. We propose Robot Trajectron V3 (RT-V3), a probabilistic shared control framework designed for $SE(3)$ grasping tasks. RT-V3 formulates shared control as Bayesian inference by learning a prior over user intent and combining it with real-time user commands to estimate the posterior intent distribution. The prior models user intent as a distribution over future trajectories conditioned on past robot dynamics and visual scene context. The intent prior is parameterized by a transformer-based conditional generative model that reasons over point clouds and candidate grasp poses, together with a factorized translation-rotation representation that improves learning efficiency in high-dimensional action spaces. During execution, RT-V3 continuously estimates the posterior distribution over future trajectories by combining the learned intent prior with a user-command likelihood derived from the observed control input, enabling continuous intent refinement and shared assistance. Comprehensive experiments demonstrate that RT-V3 achieves high accuracy in trajectory prediction and competitive performance in reactive planning. Furthermore, real-world user studies indicate that RT-V3 significantly outperforms baseline methods in terms of success rate and efficiency, while substantially reducing the user's physical and mental workload.", "pdf_url": "https://arxiv.org/pdf/2607.09315v1"}, {"title": "REMIND: RE-Identification with Memory for INDoor Navigation", "authors": ["Pablo Diaz-Pereda", "Alejandro Rodriguez-Ramos", "David Perez-Saura", "Pascual Campoy"], "published": "2026-07-10", "summary": "Mobile robots operating indoors must re-identify previously observed objects after long temporal gaps, significant viewpoint changes, and severe illumination variations. This remains a challenging problem: multi-object tracking methods are optimized for short-term association of pedestrians and vehicles at video rates, person and vehicle re-identification approaches lack persistent memory mechanisms, and state-of-the-art video object segmentation techniques rely on reactive distractor filtering rather than enforcing global identity consistency. To address these limitations, we present REMIND, an online tracker designed for long-term multi-object re-identification of generic indoor objects from monocular RGB imagery, requiring neither camera pose nor depth. Motivated by evidence from visual cognition that humans rely on accumulated appearance familiarity and spatial context rather than explicit self-localization, REMIND combines frozen DINOv3 features with a dual-bank multi-prototype appearance memory, part- and background-level descriptors, a neighbour-context reasoning module exploiting spatial co-occurrence, and joint Hungarian assignment with ambiguity-aware safeguards. On a purpose-built indoor dataset featuring controlled revisits and dense same-class clutter, REMIND reaches 90.35% IDF1, nearly 20 points above a state-of-the-art video object segmentation baseline and more than 36 above a strong tracking-by-detection baseline. On ScanNet++, it attains the highest IDF1 in every setting but one, end-to-end detection over all scenes, where the tracking-by-detection baseline is marginally ahead while REMIND still associates and recovers identities more accurately; it also completes every scene, whereas the video object segmentation baseline exhausts GPU memory on 66.9% under YOLO detections. The complete system, evaluation framework, and dataset are publicly released.", "pdf_url": "https://arxiv.org/pdf/2607.09267v1"}, {"title": "Validating Virtual Reality for Studying Multimodal Human-Robot Interaction in Socially Aware Robot Navigation", "authors": ["Hariharan Arunachalam", "Phani Teja Singamaneni", "Rachid Alami"], "published": "2026-07-10", "summary": "Virtual Reality (VR) offers a flexible and controllable platform for studying human-robot interaction. Prior work has explored VR for socially aware robot navigation. However, whether VR captures the multimodal interaction dynamics observed in real-world human-robot co-navigation remains insufficiently understood. In this work, we present a VR prototype and evaluate its suitability for studying multimodal human-robot interaction (HRI) in socially aware navigation. Specifically, we investigate whether VR preserves the multimodal interaction dynamics observed in real-world human-robot co-navigation. We conducted a within-subjects study (N = 21) in which participants interacted with a PR2 mobile manipulator robot in both a motion capture equipped arena and its virtual replica in an immersive VR environment. Two common co-navigation scenarios were examined : orthogonal crossing and pass-by interactions. Participants evaluated the robot's perceived social awareness and interaction comfort, while trajectory and head-orientation data were analysed to examine behavioral responses during the interaction. Our results show that participants perceive the robot's socially aware navigation similarly in VR and in the real world. Furthermore, VR captures human interaction behaviors in ways consistent with real-world observations. These findings suggest that VR can be a reliable and flexible platform for studying richer multimodal behaviors in social navigation and HRI.", "pdf_url": "https://arxiv.org/pdf/2607.09261v1"}, {"title": "Implicit-Behavior Coordination from Unlabeled Sub-Task Demonstrations for Rearrangement Tasks", "authors": ["Ahmed Shokry", "Usama Ahmed Siddiquie", "Sicong Pan", "Maren Bennewitz"], "published": "2026-07-10", "summary": "Long-horizon robotic rearrangement tasks are often treated as skill sequencing problems, requiring predefined skills, skill labels, or boundaries, and task-specific switching logic. Although effective, such explicit skill abstractions can become difficult to scale as the number of behaviors and the task horizon increase. We instead formulate rearrangement as implicit-behavior coordination from unlabeled sub-task demonstrations, where skill-like behaviors are learned directly from mixed behavior data and coordinated through value-guided action selection. Experiments in Habitat rearrangement tasks support this formulation in three ways. First, our method outperforms task-specific imitation baselines on more complex rearrangement tasks and approaches an oracle-planner baseline with behavior-cloned skills, while using no oracle task plan or skill-labeled full-task demonstrations. Second, ablations show that reliable critic-guided candidate selection is essential for coordinating multi-modal behaviors. Third, scaling experiments show that the method handles larger behavior repertoires and maintains stronger performance than task-specific imitation baselines as chained targets extend the horizon. These results suggest that explicit skill abstraction is not a prerequisite for long-horizon rearrangement, and that implicit-behavior coordination offers a promising data-driven alternative to explicit skill-based pipelines.", "pdf_url": "https://arxiv.org/pdf/2607.09234v1"}, {"title": "Glob3R: Global Structure-from-Motion with 3D Foundation Models", "authors": ["Junyuan Deng", "Heng Li", "Kejie Qiu", "Lingteng Qiu", "Rui Peng", "Weichao Shen", "Weihao Yuan", "Siyu Zhu", "Zilong Dong", "Ping Tan"], "published": "2026-07-10", "summary": "Recent 3D geometric foundation models, such as VGGT, provide robust feed-forward 3D reconstruction by directly predicting camera poses and 3D scene points from input images. However, their results remain inaccurate, and scaling them to long sequences or large unordered image sets typically requires chunk-wise processing, which can introduce drift and inconsistency. We present Glob3R, a global SfM-style reconstruction built on 3D foundation models. Our key idea is to explicitly optimize feed-forward geometric predictions. To this end, we augment a frozen Pi3X backbone with a lightweight dense matching head that predicts image warps between selected reference frames and neighboring views. These dense warps are converted into sparse but reliable multi-view feature tracks, which provide correspondence constraints for global optimization. We further introduce a keyframe-based sliding-window association strategy that propagates tracks and relative poses across overlapping windows, enabling scalable reconstruction. Finally, we perform global motion averaging and bundle adjustment to refine camera poses, reduce scale inconsistencies, and recover dense scene geometry. Extensive experiments on indoor, outdoor, large-scale driving, and unordered SfM benchmarks demonstrate that Glob3R achieves robust and accurate reconstruction. It consistently improves over feed-forward foundation-model baselines and recent scalable reconstruction methods, while being more robust than classical SfM pipelines. The refined poses also lead to higher-quality neural rendering, validating the benefit of combining foundation-model priors with global geometric optimization. Project page: https://junyuandeng.github.io/Glob3r", "pdf_url": "https://arxiv.org/pdf/2607.09225v1"}, {"title": "Tactile and Vision Conditioned Contact-Centric Control for Whole-Arm Manipulation", "authors": ["Rishabh Madan", "Angchen Xie", "Samantha Saak", "Andres Blanco", "Dohyeok Lee", "Sarah Grace Brown", "Yunting Yan", "Mark Zolotas", "Jose Barreiros", "Tapomayukh Bhattacharjee"], "published": "2026-07-10", "summary": "Whole-arm manipulation involves direct contact with the environment while the robot completes a task by distributing contact across multiple links as contacts form, slide, and break. This setting breaks common implicit assumptions in many learning-based manipulation pipelines: arm configuration tightly couples motion and contact forces, contact state is partially observed under occlusion, and purely learned rollouts can become physically inconsistent under distribution shift because many multi-link contact configurations are sparsely represented in the data. To address this, we propose TACTIC (Tactile and Vision Conditioned Contact-Centric Control), a receding-horizon controller for whole-arm manipulation. TACTIC uses a contact-centric hybrid predictive model that combines RGB-D, distributed tactile sensing, and a compact 2D proximity representation. The model couples a learned, action-conditioned latent dynamics model with analytical kinematics through contact Jacobians, enabling rollouts of future contact configurations and interaction forces. TACTIC integrates these rollouts into a sampling-based MPC planner with contact-aware action sampling: contact Jacobian-based projections steer sampled action sequences toward force-modulating directions, and objectives defined over predicted proximity and interaction forces trade task progress against whole-arm force regulation. We evaluate TACTIC in simulation against state-of-the-art model-based and model-free methods, and perform ablations that isolate the contribution of each design choice. TACTIC consistently outperforms other methods. We further demonstrate real-world performance on a robot with distributed tactile sensing across three whole-arm manipulation tasks that require multi-contact trajectories: turning over and repositioning a manikin, and goal-reaching in a 3D dynamic maze. Website: https://emprise.cs.cornell.edu/tactic", "pdf_url": "https://arxiv.org/pdf/2607.09218v1"}, {"title": "Empirical Pedestrian Safety Assessment in a Mobile Robot Using a Predictive Social Force Model", "authors": ["Alireza Jafari", "Yun-Hao Tsai", "Yen-Chen Liu"], "published": "2026-07-10", "summary": "Mobile robots are going to share the sidewalks with pedestrians. They must ensure their objective safety and respect the walkers' subjective safety/comfort. Computationally efficient Social Force Models (SFM) present interpretable solutions for real-time robot navigation in dynamic crowds. Recent explorations of Projected Time-to-collision (PTTC) integration into SFM variants, for example, PTTC-based SFM (TSFM), improve safety metrics. But the effect of predictive variants is unclear. We introduce Predictive SFM (PSFM) and Predictive TSFM (PTSFM) by integrating predicted social force vectors over a finite time horizon. The paper implements SFM, TSFM, PSFM, and PTSFM on a nonholonomic mobile robot and performs experimental trials with volunteers attending a facing scenario. We systematically study objective and subjective safety across the variants. Minimum PTTC, average speed, minimum distance, lateral distance, and the maximum trajectory curvature benchmark the objective safety. Likert scale post-interaction surveys assess subjective safety by marking comfort, smoothness, distance appropriateness, and speed suitability. We confirm that PTTC integration improves safety metrics. The prediction contribution is limited and occasionally visible in some of the sub-metrics. Some participants perceive smoother movements and safer speed behavior with predictive methods, but Mann-Whitney tests reveal no significant differences in subjective ratings. Therefore, PTTC-based navigation enhances safety, whereas the formulated prediction offers limited additional benefits in single-pedestrian scenarios.", "pdf_url": "https://arxiv.org/pdf/2607.09192v1"}, {"title": "GenVid2Robot: From Video Generation to Robot Manipulation via Rigid-Geometric Consistency", "authors": ["Haohui Huang", "Xi Yuan", "Panpan Liao", "Tao Teng", "Chenguang Yang", "Jing Guo", "Yi Guo"], "published": "2026-07-10", "summary": "Generated videos provide useful visual motion priors for robot manipulation, but their visual plausibility does not imply physical executability. A generated video usually lacks metric geometry, grasp grounding, robot kinematic feasibility, and execution-time feedback, which makes direct trajectory replay unreliable in real-world manipulation. This paper presents GenVid2Robot, a rigid-geometric consistency framework that converts generated video motion into executable real-robot manipulation trajectories. Given an initial RGB-D observation and a task instruction, GenVid2Robot samples task-relevant semantic anchors from the real first frame, tracks these anchors through generated video candidates, and verifies whether the resulting 2D motion can be explained by first-frame RGB-D anchors under a sparse relative $SE(3)$ model. In this way, generated videos are treated as uncertain visual motion hypotheses rather than direct robot demonstrations. Only geometrically consistent motion is transferred to the robot. The accepted relative motion is then applied to the real grasp-time TCP pose selected by mask-constrained grasping, producing a grasp-conditioned execution trajectory that is consistent with both the visual motion prior and the physical grasp configuration. To reduce execution mismatch caused by RGB-D noise, calibration residuals, and small contact-induced displacement, a bounded depth-compensation module corrects local depth-direction errors without assuming full online replanning. Real-robot experiments demonstrate that GenVid2Robot improves the reliability of generated-video-guided manipulation by grounding visual motion priors with sparse metric geometry, grasp constraints, robot feasibility checking, and bounded execution feedback.", "pdf_url": "https://arxiv.org/pdf/2607.09191v1"}, {"title": "TactiDex: A Real-World Tactile-Guided Benchmark for Human-Like Dexterous Manipulation", "authors": ["Suting Ni", "Hanbing Zhang", "Zhenyu Wei", "Guo Chen", "Chixuan Zhang", "Ye Shi", "Jingya Wang"], "published": "2026-07-10", "summary": "Tactile feedback is fundamental to Hand-Object Interaction (HOI), governing contact formation, force regulation, and stable manipulation, making it essential for achieving true human-like dexterous manipulation. Yet, current human-to-robot dexterous transfer pipelines primarily rely on kinematic trajectories, resulting in motion imitation without physically grounded interaction. To address this, we introduce TactiDex, a real-world tactile-guided benchmark specifically designed to move dexterous manipulation beyond kinematic mimicry toward contact-level human-likeness. TactiDex provides a comprehensive dataset that elegantly aligns whole-hand tactile signals with multi-granularity kinematic and object states, coupled with standardized evaluation metrics. Building upon this data paradigm, we propose a tactile-driven transfer framework that effectively translates human demonstrations into physically plausible robotic execution. We introduce TactiSkill, a framework built upon a novel tri-component tactile reward that innovatively uses tactile signals as structured supervision. This reward unifies guidance, human-like alignment, and contact constraints into a single objective. Through comprehensive experiments on both single and bimanual tasks, we demonstrate that TactiSkill achieves superior performance in manipulation success and physical realism. This work lays a crucial foundation for advancing tactile-aware dexterous manipulation. Our project page at https://tactidex.github.io/.", "pdf_url": "https://arxiv.org/pdf/2607.09190v1"}, {"title": "Causally Debiased Latent Action Model for Embodied Action Conditioned World Models", "authors": ["Yufan Wei", "Kun Zhou", "Lingjun Mao", "Zijun Zhang", "Ziming Xu", "Ziqiao Xi", "Shuang Liang", "Ruobing Han", "Yuchen Yan", "Xinyue Wang", "Fan Feng", "Biwei Huang"], "published": "2026-07-10", "summary": "Action-conditioned world models (ACWMs) aim to simulate future observations conditioned on embodied actions, offering a promising foundation for robot planning, policy evaluation, and data augmentation. However, learning controllable ACWMs requires large-scale action-labeled data, which remains costly to collect in the real world. Latent action models (LAMs) mitigate this bottleneck by inferring latent actions from unlabeled videos, but existing LAMs are typically trained with reconstruction-only objectives and therefore entangle action-relevant dynamics with action-irrelevant visual factors such as backgrounds and untouched objects. In this work, we identify this action-irrelevant bias as a key obstacle to controllable ACWMs and introduce evaluation metrics to measure latent-action bias, action following, and robustness. We propose CD-LAM, a causally debiased framework for LAM-based ACWMs. CD-LAM introduces three efficient fine-tuning objectives: embodiment-centric reconstruction, action-centric contrastive learning, and latent space calibration, which together encourage embodiment-focused, action-aware, and calibrated non-collapsed latent action representations. Experiments on 2B and 14B ACWM backbones show that CD-LAM substantially improves latent-action controllability, downstream robot-action following, visual fidelity, and adaptation efficiency, requiring only 6k fine-tuning steps and more than 12$\\times$ fewer robot-action adaptation updates than the baseline.", "pdf_url": "https://arxiv.org/pdf/2607.09185v1"}], "repos": [{"repo": "copper-project/copper-rs", "stars": 1402, "language": "Rust", "description": "Copper is an operating system for robots -  build, run, and replay your entire robot deterministically.", "url": "https://github.com/copper-project/copper-rs", "date": "2026-07-13", "topic": "physical-ai", "score": 560.9}, {"repo": "mosaico-labs/mosaico", "stars": 889, "language": "Python", "description": "Mosaico - The data platform for Physical AI", "url": "https://github.com/mosaico-labs/mosaico", "date": "2026-07-13", "topic": "physical-ai", "score": 355.7}, {"repo": "awslabs/awsome-distributed-ai", "stars": 457, "language": "Shell", "description": "Collection of best practices, reference architectures, model training examples and utilities to train large models on AWS. ", "url": "https://github.com/awslabs/awsome-distributed-ai", "date": "2026-07-13", "topic": "physical-ai", "score": 182.9}, {"repo": "commaai/openpilot", "stars": 63097, "langu
