<span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://bostondynamics.com/\">Boston Dynamics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"vxfnou7kf6y\"><em>No teleoperation. No cuts. Long take. One of the world’s few complete demonstrations of long-horizon mobile manipulation, bringing fully autonomous humanoid robots another step closer to us.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.limxdynamics.com/en\">LimX<\/a> ]<\/p><p>Thanks, Jinyan!<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"ytq2o5gcu3w\">Impressive. But get a job.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.magiclab.top/en/\">MagicLab<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"w3n009ayfhq\">We saw some footage of this <a href=\"https://spectrum.ieee.org/video-friday-robot-world-cup\" target=\"_blank\">last week<\/a>, but here’s a much better video.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><blockquote><em>Wing-propelled diving birds flap their wings to move through air and water, yet the wing morphology and kinematics that enable this behavior remain poorly understood because of the difficulty of collecting in situ data. The impact of flapping frequency, wing size, and stiffness on locomotion in—and transition between—the two media are still unknown. We compared data from diving birds against experiments using a flapping-wing robot capable of flying, swimming, plunge diving, and exiting the water. We show that frequency adaptation, flexible wings, and powerful actuation enable seamless transitions without folding wings or legs, that large wings enhance flight without substantially reducing underwater efficiency, and that tail-body distance and egress angle affect water exit. These results clarify how birds (and robots) balance multifluid locomotion constraints.<\/em><\/blockquote><p>[ <a href=\"https://dspace.mit.edu/entities/publication/a8ca74c5-9e2a-42f3-9ddf-636701e91ae2\">EPFL LIS<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div>"}, {"title": "Weave Robotics launches Isaac, its first mobile humanoid robot", "source": "The Robot Report", "date": "2026-07-17", "url": "https://www.therobotreport.com/weave-robotics-launches-isaac-first-mobile-humanoid-robot/", "summary": "<p>Weave Robotics has listed the features of its Isaac wheeled bimanual manipulator robot for household and office use.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/weave-robotics-launches-isaac-first-mobile-humanoid-robot/\">Weave Robotics launches Isaac, its first mobile humanoid robot<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "This Graduate Student Equips NASA’s Robots With Assembly Skills", "source": "IEEE Spectrum Robotics", "date": "2026-07-17", "url": "https://spectrum.ieee.org/graduate-student-nasas-robots-assembly", "summary": "<img src=\"https://spectrum.ieee.org/media-library/a-young-woman-with-blonde-hair-softly-smiling-next-to-a-pair-of-collaborative-robot-arms.jpg?id=67499761&amp;width=1245&amp;height=700&amp;coordinates=0%2C156%2C0%2C157\" /><br /><br /><p>Like many engineers, <a href=\"https://www.linkedin.com/in/sarahdownsprofile\" rel=\"noopener noreferrer\" target=\"_blank\">Sarah Downs<\/a> says she knew she wanted to pursue a STEM career from a young age. As a teenager, she discovered <a href=\"https://spectrum.ieee.org/topic/robotics/\" target=\"_self\">robotics<\/a> through her Tulsa, Okla., middle school’s <a href=\"https://www.firstlegoleague.org/\" rel=\"noopener noreferrer\" target=\"_blank\">First Lego League<\/a> team, and she fell in love with the field, she says. Downs participated in the international robotics program from 2014 to 2016.<\/p><p>Watching <a href=\"https://www.pbs.org/\" rel=\"noopener noreferrer\" target=\"_blank\">PBS<\/a> specials on <a href=\"https://www.nasa.gov/\" rel=\"noopener noreferrer\" target=\"_blank\">NASA<\/a> Mars rovers <a href=\"https://spectrum.ieee.org/mars-for-the-rest-of-us\" target=\"_self\"><em><em>Spirit<\/em><\/em><\/a><em> <\/em>and <a href=\"https://spectrum.ieee.org/video-friday-opportunity-celebrates-10-years-on-mars\" target=\"_self\"><em><em>Opportunity<\/em><\/em><\/a>, and seeing the live broadcast of the <a href=\"https://spectrum.ieee.org/if-necessary-mars-rover-curiosity-could-rip-its-own-wheels-off-to-stay-mobile\" target=\"_self\"><em><em>Curiosity<\/em><\/em><\/a> rover launch in 2011, inspired the teen to dream of a career working with NASA.<\/p><h3>Sarah Downs<\/h3><br /><p><strong>MEMBER GRADE<\/strong><\/p><p>Graduate student member<\/p><p><strong>UNIVERSITY <\/strong><\/p><p>Texas A&amp;M University in College Station<\/p><p><strong>MAJOR <\/strong><\/p><p>Electric engineering<\/p><h3><\/h3><br /><p>This year the IEEE graduate student member achieved that dream. For her final project as a master’s degree candidate in electrical engineering at the <a href=\"https://utulsa.edu/\" target=\"_blank\">University of Tulsa<\/a>, she worked on an algorithm in collaboration with NASA and the U.S. <a href=\"https://www.airforce.com/en\" target=\"_blank\">Air Force<\/a>.<\/p><p>The algorithm she developed enables a robot assembling satellites in space to insert an antenna into the correct spot, addressing robotics’s classic peg-in-hole problem of inserting an object into its corresponding hole.<\/p><p>Now a Ph.D. student in electrical engineering at <a href=\"https://www.tamu.edu/index.html\" target=\"_blank\">Texas A&amp;M University<\/a> in College Station, Downs is continuing her research on satellite assembly and manipulation “but on a much larger scale,” she says.<\/p><h2>Following a childhood passion<\/h2><p>Downs grew up in the Tulsa area. Her father, who died from a heart attack in 2015 when she was 13, was a safety advisor in the oil and gas industry. Her mother stayed home to take care of her brother, who has autism. After her father died, her mother went back to college to earn a bachelor’s degree in business so she could support the family.<\/p><p>“We didn’t have much income, and my mom was always worried about money,” Downs says. “That made me more aware of having a successful career, in a monetary sense.”<\/p><p>From then on, whenever she considered her future career, having a decent salary to support the family was high on her list.<\/p><p>By pursuing a career in robotics, she says, she can follow her passion while obtaining financial security.<\/p><p>In high school, Downs joined the <a href=\"https://www.firstinspires.org/\" rel=\"noopener noreferrer\" target=\"_blank\">First<\/a> robotics club, where she found herself drawn to the electrical components used in the machines she and her classmates built.<\/p><p>During her final two years of high school, she participated in an <a href=\"https://tulsatech.edu/full-time-programs/science-technology-engineering-and-mathematics/pre-engineering/\" rel=\"noopener noreferrer\" target=\"_blank\">extension program<\/a> at <a href=\"https://tulsatech.edu/\" rel=\"noopener noreferrer\" target=\"_blank\">Tulsa Tech<\/a>, a training school. She spent half her day in high school classes and the other half taking engineering courses at the vocational school.<\/p><p>After graduating in 2020, she accepted scholarships to attend the University of Tulsa. She began her freshman year at UTulsa not knowing whether she wanted to major in electrical or mechanical engineering, she says, adding that her love of working with small systems helped her choose EE.<\/p><p>For her <a href=\"https://utulsa.edu/news/celebrating-student-innovation-tus-role-in-tasms-new-exhibits/\" rel=\"noopener noreferrer\" target=\"_blank\">senior year capstone project<\/a>, she and two of her classmates designed a lunar lander exhibit for the <a href=\"https://www.tulsamuseum.org/\" rel=\"noopener noreferrer\" target=\"_blank\">Tulsa Air and Space Museum<\/a>. They created an interactive game that simulates missions on lunar and martian surfaces. Four celestial bodies—the moon, Venus, Mars, and Titan—are listed across three computer monitors. Using a game controller, museum visitors can explore the virtual surface of each one. The <a href=\"https://www.linkedin.com/feed/update/urn:li:activity:7207091982790266880/\" rel=\"noopener noreferrer\" target=\"_blank\">exhibit<\/a> is still on display.<\/p><p>Downs earned her bachelor’s degree in electrical engineering in 2024 and continued her education at the university’s EE master’s degree program.<\/p><h2>Both more and less complicated than people think<\/h2><p>When Downs began her graduate studies, she was supposed to be part of a NASA robotics project for two years. But when a delay in government funding postponed the project’s start, she instead spent her first year in the school’s <a href=\"https://utulsa.edu/research/robotics-institute/\" rel=\"noopener noreferrer\" target=\"_blank\">Institute for Robotics and Autonomy<\/a>, then newly launched. Its main focus is developing robots to assist people who have mobility challenges.<\/p><p>Inspired by her grandmother, who was wheelchair-bound due to severe arthritis, Downs developed a robotic arm that helps older people and wheelchair users live independently. The arm was able to identify and place objects in the appropriate locations inside the home, such as unloading certain groceries from a shopping bag and placing them on a shelf or in separate containers.<\/p><p>Before the start of her sophomore year in 2025, the NASA project finally secured government funding. She developed a robot that achieves the peg-in-hole task without using any vision systems. Typically, cameras help guide robots’ satellite-assembly work. But in the harsh, remote environment of outer space, cameras might malfunction or encounter delays.<\/p><h3><\/h3><br /><p>“Don’t stop asking questions. Especially in engineering, don’t pretend like you know everything, because science is about constantly wanting to learn and listen.”<\/p><h3><\/h3><br /><p>Rather than using cameras, Downs’s robotic arm deploys a force-based insertion process to sense position and orientation of objects in the arm’s environment. The robot loosely grips an antenna and, with a torque sensor on its gripper, “feels” the force feedback of where the satellite and antenna are in relation to each other. The robot then guides the antenna assembly into a target opening on its satellite and maintains the position during adhesion.<\/p><p>Adding to the complexity, the robot performs its task in zero gravity.<\/p><p>“Without gravity, you now have to consider the arm’s reaction torques on the satellite to avoid flinging it into space,” Downs says. Any motion from the arm during the insertion process, especially from increased forces, could cause the satellite to continue movement in that direction.<\/p><p>To combat that, Downs is performing calculations for the project to direct targeted reverse thrusts and counter the force of the robot’s motions.<\/p><p>Her graduate project captures the simple yet complex nature of robotics that she finds fascinating, she says.<\/p><p>“I think robots are both more and also less complicated than people think,” she says. “Really, all you need to start programming a robot is its <a href=\"https://www.universal-robots.com/developer/hardware-and-motion/robot-motion-dh-parameters/\" target=\"_blank\">Denavit-Hartenberg parameters<\/a>, and you can do a lot with that,” she says, referencing the four values used to describe the position and orientation of a robotic arm and manipulators. Even with different grippers and degrees of freedom, “fundamentally, all robot manipulators start there,” she says.<\/p><p>“But,” she adds, “we’re still learning so much about how robots interact with their environment. Even something simple to us, like manipulating a pen, is still incredibly complex for robots.”<\/p><p>Downs is completing her doctoral thesis in the <a href=\"https://rad.engr.tamu.edu/robotic-space-simulator/\" rel=\"noopener noreferrer\" target=\"_blank\">Robotic Space Simulator<\/a> project at Texas A&amp;M’s <a href=\"https://rad.engr.tamu.edu/\" rel=\"noopener noreferrer\" target=\"_blank\">Robotics and Automation Design (RAD) Lab<\/a>, which specializes in developing machines that can survive in extreme environments. It collaborates with NASA.<\/p><p>Her thesis advisor is <a href=\"https://spectrum.ieee.org/video-friday-punch-out\" target=\"_self\">Robert Ambrose<\/a>, a NASA veteran who launched the RAD Lab in 2022. The IEEE member is set to serve as associate director of the school’s Space Institute, due to open this year in Houston. The research facility is being built next to the <a href=\"https://www.nasa.gov/johnson/\" rel=\"noopener noreferrer\" target=\"_blank\">Johnson Space Center<\/a>.<\/p><p>After earning her Ph.D., Downs says, she hopes to one day work for NASA, developing rovers that collect samples from Mars or robotic arms that perform tasks on space stations.<\/p><p>To learn more about robots, check out <em>IEEE Spectrum<\/em>’s <a href=\"https://robotsguide.com/about\" rel=\"noopener noreferrer\" target=\"_blank\">guide<\/a>.<\/p><h2>Getting out of the engineering bubble<\/h2><p>Downs joined <a href=\"https://www.ieee.org/\" rel=\"noopener noreferrer\" target=\"_blank\">IEEE<\/a> in 2020 as a freshman at UTulsa to get more involved in electrical engineering events on campus. At the time, the <a href=\"https://spectrum.ieee.org/tag/covid-19\" target=\"_self\">COVID-19 pandemic<\/a> kept clubs and organizations from meeting in person.<\/p><p>She was active in her school’s <a href=\"https://utulsa.edu/academics/engineering-computer-science/academics/departments/electrical-computer-engineering/institute-of-electronics-and-electrical-engineers-ieee/\" rel=\"noopener noreferrer\" target=\"_blank\">IEEE student branch<\/a> and was elected as its 2022–2024 president. Under her leadership, the branch went from having a few events to hosting one every two weeks.<\/p><p>They included lunch-and-learn sessions and dinners that connected students with professional engineers and the university’s alumni. Downs also organized hands-on workshops on soldering, <a href=\"https://spectrum.ieee.org/lunar-base-3d-printing\" target=\"_self\">3D printing<\/a>, CAD modeling, and <a href=\"https://spectrum.ieee.org/be-a-polarizing-job-seeker\" target=\"_self\">résumé-building<\/a>.<\/p><p>Her efforts helped increase the branch’s executive board membership from roughly five students to 25 in 2023. The same year, her soldering workshop attracted about 80 students.<\/p><p>She says she enjoyed working with IEEE, especially “engaging with alumni and learning from engineers.”<\/p><p>IEEE is a great resource for networking opportunities, she says, noting that “during the COVID-19 pandemic, engineering students stayed in their bubbles.” IEEE events helped the students make connections that could serve them well, she says.<\/p><p>“Networking is very important, especially in today’s tough job market,” she says. “It’s a lot about who you know and how people observe your work ethic.”<\/p><p>Downs, who now serves as an IEEE graduate advisor for UTulsa’s student branch, says she has seen firsthand how the school’s student branch network has benefited its student members.<\/p><p>“A lot of them have found jobs” because of IEEE, she says.<\/p><h3>The working and networking of an engineer<\/h3><br /><p>As the IEEE graduate advisor for UTulsa’s student branch, Downs noticed that many engineering undergraduates finish college without any <a href=\"https://spectrum.ieee.org/hands-on-projects-career-advice\" target=\"_self\">hands-on experience<\/a>, whether it be a project or an internship.<\/p><p>“Their résumés are very sparse, and they have no proof of their technical skills,” she says. She herself completed a facilities engineering internship at <a href=\"https://flytulsa.com/\" target=\"_blank\">Tulsa International Airport<\/a>’s <a href=\"https://www.google.com/aclk?sa=L&amp;ai=DChsSEwiakeLTiIqVAxWRzsIEHX4aO3UYACICCAEQABoCcHY&amp;ae=2&amp;co=1&amp;ase=2&amp;gclid=CjwKCAjwxb7RBhA5EiwAQ-AAdIuO_CE21RKvxNvZKxWXCYpo9d0-vpx3D3XClr2XRTWwP13SUuMbKhoCzuIQAvD_BwE&amp;ei=RV4waqKnFs-G0PEPpMyjoAg&amp;cid=CAASZuRoVbgIgx56926ScONp0UCppyfOxCgiUjlNwIYIyRNwiPfCRnB-35o-3qx5zfez3l5RTJDkwOw_SW-pvC4ORqwKrbj2g4yojyTEu490Veitl0o0gJG9sB38UMie-GYDrIURjI2CPw&amp;cce=2&amp;category=acrcp_v1_71&amp;sig=AOD64_2LzW3O1QygURf8h7S57YqN5jIk3A&amp;q&amp;sqi=2&amp;nis=4&amp;adurl&amp;ved=2ahUKEwji3dfTiIqVAxVPAzQIHSTmCIQQ0Qx6BAgNEAE\" rel=\"noopener noreferrer\" target=\"_blank\">American Airlines<\/a> maintenance facility after her sophomore year of college. And she was an electrical engineering intern at <a href=\"https://www.flightsafety.com/\" rel=\"noopener noreferrer\" target=\"_blank\">Flight Safety International<\/a> outside Tulsa after her junior year and after she graduated. The company designs, builds, and maintains its own flight simulators.<\/p><p>Her advice to undergraduates is to hone and demonstrate both their hard and soft skills by working on research projects or even personal passion projects.<\/p><p>“A <a href=\"https://www.raspberrypi.com/\" rel=\"noopener noreferrer\" target=\"_blank\">Raspberry Pi<\/a> doesn’t cost that much, and you can start working with that immediately,” she says. Students also can take part in engineering interest groups and professional organizations at their school, she adds.<\/p><p>“Put yourself out there and join a research team,” she says. “It’s a great way to show people that you’re a good person to work with and you’d do a good job in the field.”<\/p><p>She adds that it’s also a fine way to keep learning—which is what drew her to a field that has developed only within the past century.<\/p><p>“We’re still constantly learning about robots,” she says.<\/p><p>“Don’t stop asking questions,” she advises students. “Especially in engineering, don’t pretend like you know everything, because science is about constantly wanting to learn and listen.”<\/p>"}, {"title": "Founder of Maximo discusses how robotics is accelerating solar construction", "source": "Robotics Business Review", "date": "2026-07-17", "url": "https://www.therobotreport.com/transforming-solar-construction-through-robotics-deise-yumi-asami-maximo/", "summary": "<p>Maximo founder Deise Yumi Asami discusses the process of automating solar construction with robotics.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/transforming-solar-construction-through-robotics-deise-yumi-asami-maximo/\">Founder of Maximo discusses how robotics is accelerating solar construction<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Lockheed Martin taps Machina’s robots for mission-critical missile parts", "source": "Robotics Business Review", "date": "2026-07-16", "url": "https://www.therobotreport.com/lockheed-martin-taps-machinas-robots-for-mission-critical-missile-parts/", "summary": "<p>Machina Labs secured a Lockheed Martin contract to qualify robotically formed metal components for the JASSM missile program.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/lockheed-martin-taps-machinas-robots-for-mission-critical-missile-parts/\">Lockheed Martin taps Machina’s robots for mission-critical missile parts<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Xpanner rolls out X1 Panel Lift for automated solar panel installation", "source": "Robotics Business Review", "date": "2026-07-16", "url": "https://www.therobotreport.com/xpanner-rolls-out-x1-panel-lift-automated-solar-panel-installation/", "summary": "<p>X1 Panel Lift uses existing excavators and a single workflow so solar installation crews can focus on alignment, fastening, and quality.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/xpanner-rolls-out-x1-panel-lift-automated-solar-panel-installation/\">Xpanner rolls out X1 Panel Lift for automated solar panel installation<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "How to Make an Invisible Drone", "source": "IEEE Spectrum Robotics", "date": "2026-07-16", "url": "https://spectrum.ieee.org/invisible-spinning-drone", "summary": "<img src=\"https://spectrum.ieee.org/media-library/low-visibility-drone-flying-in-front-of-an-office-plant.jpg?id=67480624&amp;width=1245&amp;height=700&amp;coordinates=0%2C62%2C0%2C63\" /><br /><br /><p><span>There are many words that I would never, ever use to describe a drone. Stealthy. Subtle. Whatever the opposite of obnoxious is. Much of this is because of the giant angry bee sound that drones tend to make, but it’s also the way that they look in flight: With uncannily linear movements and an even less canny ability to hover perfectly still, they tend to draw the eye as affronts to nature.<\/span><\/p><p>In a paper presented this week at <a href=\"https://roboticsconference.org/\" target=\"_blank\">Robotics Science and Systems 2026<\/a> in Sydney, roboticists from Northwestern University, Evanston, Ill., demonstrated a drone called Phantom Twist that is essentially invisible to humans, being an order of magnitude more difficult to see in flight than a typical quadrotor. They accomplished this with the aid of computational design, and while the resulting hardware is, I would argue, also an order of magnitude more of an affront to nature than a typical quadrotor represents, it’s pretty amazing how well it works.<\/p><p class=\"shortcode-media shortcode-media-youtube\"> <span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span> <small class=\"image-media media-caption\">Phantom Twist spins so fast, it’s practically invisible.<\/small><small class=\"image-media media-photo-credit\">Michael Rubenstein/Northwestern University<\/small><\/p><p><span>The trick here is easy to see, even if the drone isn’t. By spinning in flight at between 15 and 25 hertz, Phantom Twist takes advantage of humans’ decidedly mediocre visual system to turn a solid spinning object into an opaque smear. Human eyes take some amount of time (typically about 100 milliseconds) to integrate what we see before sending the full scene off to our brains for processing. Moving objects can cause problems for this system, because if the movement is fast enough, our eyes are forced to average that motion across the scene, combining it with whatever is in the background and resulting in a transparent blur. This effect is called persistence of vision. For something that spins like Phantom Twist, that motion blur comes from the drone’s rapid rotation, and it works because most of the drone is cleverly designed to be empty space.<\/span><\/p><p>Drones that spin in flight are nothing new—we’ve covered a bunch of them in the past, including <a href=\"https://www.modlabupenn.org/piccolissimo/\" target=\"_blank\">Picolissimo<\/a> and any number of <a href=\"https://spectrum.ieee.org/spinning-drone\" target=\"_self\">samara<\/a> <a href=\"https://spectrum.ieee.org/foldable-monocopter-drone\" target=\"_self\">drones<\/a> inspired by the spinning flight of maple seeds. What makes Phantom Twist unique, and also very odd, is that the design was computationally optimized for low visibility. <\/p><h2>Controlling how drones like this fly<\/h2><p>Before we get into that, though, a quick note about how drones like this can even fly controllably, because it’s not at all obvious. With just a single motor and no control surfaces, the only possible control input is through the motor itself, and by pulsing the motor speed up or down at just the right time during each rotation, the drone can translate in any direction. Altitude control comes from changing overall motor thrust, and the drone‘s spinning nature makes it passively stable.<\/p><p class=\"shortcode-media shortcode-media-rebelmouse-image rm-float-left rm-resized-container rm-resized-container-25\" style=\"float: left;\"> <img alt=\"A minimalist drone made of a few thin rods, wires and a miniature circuit board.\" class=\"rm-shortcode\" id=\"b2caf\" src=\"https://spectrum.ieee.org/media-library/a-minimalist-drone-made-of-a-few-thin-rods-wires-and-a-miniature-circuit-board.jpg?id=67480639&amp;width=980\" /> <small class=\"image-media media-caption\">Carbon fiber rods connect batteries, a controller, some counterweights, and a motor and propeller. The research robot also includes optical tracking tags.<\/small><small class=\"image-media media-photo-credit\">Michael Rubenstein/Northwestern University<\/small><\/p><p>The bits that you need for this kind of drone include the motor and propeller, a couple of batteries, a controller, some counterweights (which could be replaced with more batteries or payload), 0.8-mm carbon fiber rods to tie it all together, and a connector for the handheld launcher that gets the whole thing up to speed. The actual <em><em>arrangement<\/em><\/em> of these components is surprisingly flexible, and that’s where the invisibility comes in. <\/p><p>“The design space is high dimensional,” explains Northwestern’s <a href=\"https://www.mccormick.northwestern.edu/research-faculty/directory/profiles/rubenstein-michael.html\" target=\"_blank\">Michael Rubenstein<\/a>. “It’s very difficult for a human to reason through all the trade-offs between the physical constraints required for stable flight and the visual appearance of the spinning drone, and I don’t think we would have easily arrived at this low-visibility design ourselves.”<\/p><p>The visibility (or not) of Phantom Twist is primarily driven by the extent to which different components line up with each other from the perspective of someone looking at the drone. The more components that line up with each other as the drone flies, the less background you see through the spinning drone, and the more visible the drone becomes. Because you might be looking at the drone from a number of different angles, and also because the drone has to be stable enough for controlled flight, there are a bunch of different things that need to be optimized all at once, which is why computational design is effective here.<\/p><p>Phantom Twist’s final design was generated using an iterative optimizer which had a goal of minimizing a metric called <a href=\"https://eureka.patsnap.com/article/what-is-lpips-and-how-it-measures-perceptual-similarity\" target=\"_blank\">learned perceptual image patch similarity<\/a>, or LPIPS, while making sure that the design could still physically work. LPIPS is the difference between two images: a background image, and a background image with an overlay of the simulated spinning drone. The smaller that difference is, the more invisible that design is. It’s tricky for a human to consider all of the variables at once, but Rubenstein says that the final design does make intuitive sense, because “the automated pipeline prefers placements where components don’t visually overlap as it spins, or where the components are too close to the center of rotation.”<\/p><p class=\"shortcode-media shortcode-media-rebelmouse-image\"> <img alt=\"Two variations of minimalist drones made from a few thin rods, wires and a miniature circuit board. Both are barely visible when in-flight.\" class=\"rm-shortcode\" id=\"394e6\" src=\"https://spectrum.ieee.org/media-library/two-variations-of-minimalist-drones-made-from-a-few-thin-rods-wires-and-a-miniature-circuit-board-both-are-barely-visible-when.jpg?id=67480677&amp;width=980\" /> <small class=\"image-media media-caption\">Two iterations of Phantom Twist drones are shown with their handheld launching mechanisms. The better-optimized version [bottom row] relocates the launcher interface to remove components that are too close to the central axis, making them more visible.<\/small><small class=\"image-media media-photo-credit\">Michael Rubenstein/Northwestern University<\/small><\/p><p>Out of a starting set of around 20,000 feasible Phantom Twist configurations, the optimized design (the one that you see or don’t see in the pictures and videos) has a LPIPS score of 0.0104. A human-designed Phantom Twist is about twice as visible, with a LPIPS score of around 0.2, and a conventional quadrotor (of the same size) would be over 10 times more visible. And there’s still a bit more optimization that could be done with the electrical wiring as well as increasing the baseline transparency of the components themselves.<\/p><p>Phantom Twist is currently controlled using an optical tracking system, which means that it’s not yet capable of flying outside of a controlled environment. But Rubenstein has built <a href=\"https://www.roboticsproceedings.org/rss20/p102.pdf\" target=\"_blank\">other drones along similar principles<\/a> in the past, which have successfully flown outside, and he’s optimistic about using those techniques to break Phantom Twist out of the lab. The spinning behavior might even enable some useful sensing capabilities, he says. “An interesting possibility is mounting a camera on the spinning body. As the vehicle rotates, it could capture imagery in every direction, effectively creating a 360-degree view of its surroundings that could be used for onboard navigation and control.”<\/p><p>As for what a drone like Phantom Twist could be used for—assuming that the sound can be mitigated somewhat (and there are <a href=\"https://spectrum.ieee.org/pennysized-ionocraft-flies-with-no-moving-parts\" target=\"_self\">potential approaches to making that happen<\/a>), a stealthy microdrone could do all sorts of things with covert surveillance being the most obvious application. For his part, Rubenstein says that he’s personally excited about the potential for watching wildlife, “where a less-intrusive drone could observe animals while minimizing its impact on their natural behavior.” The elephants in particular <a href=\"https://spectrum.ieee.org/research-proves-drones-sound-like-bees-which-is-good-news-for-elephants\" target=\"_self\">would certainly appreciate that<\/a>.<\/p><p>For a deeper dive into all the particulars of this project, read the paper: <a href=\"https://arxiv.org/html/2605.11296v1\" target=\"_blank\"><em><em>Computational Design of a Low-Visibility UAV Using a Human-Aligned Perceptual Metric<\/em><\/em><\/a>, by Jingxian Wang, Chen Yu, David Matthews, Emma Alexander, Sam Kriegman, and Michael Rubenstein from Northwestern University, which is being presented this week at <a href=\"https://roboticsconference.org/\" target=\"_blank\">RSS 2026 in Sydney<\/a>.<\/p>"}, {"title": "TerraFirma raises $115M to build robotic infrastructure for construction", "source": "Robotics Business Review", "date": "2026-07-16", "url": "https://www.therobotreport.com/terrafirma-raises-115m-build-robotic-infrastructure-construction/", "summary": "<p>TerraFirma has developed a platform that combines AI-enabled software, a remote command-and-control center, and retrofitted heavy machinery.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/terrafirma-raises-115m-build-robotic-infrastructure-construction/\">TerraFirma raises $115M to build robotic infrastructure for construction<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}], "embeddedNews": [{"title": "Printing FDM Filaments that are just Plain Weird", "source": "Hackaday", "date": "2026-08-17", "url": "https://hackaday.com/2026/08/17/printing-fdm-filaments-that-are-just-plain-weird/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"503\" src=\"https://hackaday.com/wp-content/uploads/2026/08/canadian_filament_carbon_capture_pumpkin_spice_zack_freedman_youtube.jpg?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>The fun thing about thermopolymers like PLA is that you can blend in additives, some of which are necessary to make it at all usable, while so many other additives <a class=\"read-more\" href=\"https://hackaday.com/2026/08/17/printing-fdm-filaments-that-are-just-plain-weird/\">&#8230;read more<\/a>"}, {"title": "May This Balloon Banjo Resonate With You", "source": "Hackaday", "date": "2026-08-17", "url": "https://hackaday.com/2026/08/17/may-this-balloon-banjo-resonate-with-you/", "summary": "<div><img alt=\"A small, 3D-printed banjo frame that uses a party balloon for the resonating chamber.\" class=\"attachment-large size-large wp-post-image\" height=\"600\" src=\"https://hackaday.com/wp-content/uploads/2026/08/balloon-banjo-800.jpg?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>Most instruments, with maybe the exception of pianos, have consumable parts. Guitars need string changes, bows need rosin, saxophones need reeds. [Co:Creation Lab]&#8217;s balloon banjo requires both fishing line and <a class=\"read-more\" href=\"https://hackaday.com/2026/08/17/may-this-balloon-banjo-resonate-with-you/\">&#8230;read more<\/a>"}, {"title": "More On Wave Overhangs for 3D Printing", "source": "Hackaday", "date": "2026-08-17", "url": "https://hackaday.com/2026/08/16/more-on-wave-overhangs-for-3d-printing/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"571\" src=\"https://hackaday.com/wp-content/uploads/2026/08/wave.png?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>We&#8217;ve heard of wave overhangs before. It is a new technique for printing horizontal overhangs with no supports. Building on some other techniques like arc overhangs. The idea is to <a class=\"read-more\" href=\"https://hackaday.com/2026/08/16/more-on-wave-overhangs-for-3d-printing/\">&#8230;read more<\/a>"}, {"title": "Using the Famicom Network System in 2026", "source": "Hackaday", "date": "2026-08-17", "url": "https://hackaday.com/2026/08/16/using-the-famicom-network-system-in-2026/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"474\" src=\"https://hackaday.com/wp-content/uploads/2026/08/famicom_network_system_installed_custom_card_throaty_mumbo_youtube.jpg?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>Usually, the name &#8216;Famicom&#8217; and the associated Nintendo Entertainment System (NES) don&#8217;t exactly bring to mind downloadable content and online services. However, at least in Japan, a modem add-on for <a class=\"read-more\" href=\"https://hackaday.com/2026/08/16/using-the-famicom-network-system-in-2026/\">&#8230;read more<\/a>"}, {"title": "Pi-Ener-lite – A compact 18650 UPS board for Raspberry Pi Zero with RTC and fuel gauge", "source": "CNX Software", "date": "2026-08-17", "url": "https://www.cnx-software.com/2026/08/17/pi-ener-lite-a-compact-18650-ups-board-for-raspberry-pi-zero-with-rtc-and-fuel-gauge/", "summary": "<div><img alt=\"Pi Ener lite with Raspberry PI Zero attached\" class=\"attachment-medium size-medium wp-post-image\" height=\"480\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/08/Pi-Ener-lite-with-Raspberry-PI-Zero-attached-720x480.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Designed by ACE Design Studio in China, the Pi-Ener-lite is a dedicated UPS board made specifically for the Raspberry Pi Zero series. It features a standard flat-top 18650 lithium-ion battery holder and switches to battery power when external power is lost, while supporting simultaneous charging and discharging. The Pi-Ener-lite connects to the bottom of the Raspberry Pi Zero via seven spring-loaded pogo pins that handle both power delivery and I2C data communication, leaving the top GPIO header free for other HATs or expansions. Pi-Ener-lite specifications: Compatibility – Raspberry Pi Zero series SBCs USB &#8211; 1x USB Type-C port for charging  Misc Power switch DS1307 real-time clock (RTC) chip with a CR1220 coin cell battery holder 7x spring pogo pins for power delivery and I2C data Power Management Battery Support – Standard flat-top 18650 lithium-ion cell; supports simultaneous charging and discharging Charging current &#8211; 1A @ 5V Output current &#8211; 2.5A [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/08/17/pi-ener-lite-a-compact-18650-ups-board-for-raspberry-pi-zero-with-rtc-and-fuel-gauge/\">Pi-Ener-lite &#8211; A compact 18650 UPS board for Raspberry Pi Zero with RTC and fuel gauge<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Luckfox Lyra PLC – A Linux-based Rockchip RK3506B industrial controller with RS232, RS422, RS485, CAN bus, and relays", "source": "CNX Software", "date": "2026-08-17", "url": "https://www.cnx-software.com/2026/08/17/luckfox-lyra-plc-a-linux-based-rockchip-rk3506b-industrial-controller-with-rs232-rs422-rs485-can-bus-and-relays/", "summary": "<div><img alt=\"Luckfox Lyra PLC\" class=\"attachment-medium size-medium wp-post-image\" height=\"604\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/08/Luckfox-Lyra-PLC-720x604.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Luckfox Lyra PLC is a Linux-based programmable logic controller powered by a Rockchip RK3506B tri-core Arm Cortex-A7 SoC, equipped with dual Ethernet, WiFi 6 and Bluetooth 5.2 wireless connectivity, a 1.9-inch touchscreen LCD, and a range of I/Os. The I/Os are mostly exposed through two 11-pole terminal blocks with one RS232, one shared RS422/RS485, one CAN Bus, and two relays, as well as smaller connectors for I2C, GPIO, and debugging. The system can be powered via USB-C  (5V only), terminal block pins supporting 7V-24V DC input, or an optional PoE module. &#160; Luckfox Lyra PLC specifications: SoC – Rockchip RK3506B CPU 3x Arm Cortex-A7 cores up to 1.2 GHz Arm Cortex-M0 real-time core GPU – 2D GPU only No VPU, no NPU System Memory – 512MB DDR3L Storage &#8211; 8GB eMMC flash Display &#8211; 1.9-inch touchscreen LCD with 320 x 170 resolution Networking 2x 10/100 Mbps Ethernet RJ45 ports 2.4 GHz [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/08/17/luckfox-lyra-plc-a-linux-based-rockchip-rk3506b-industrial-controller-with-rs232-rs422-rs485-can-bus-and-relays/\">Luckfox Lyra PLC &#8211; A Linux-based Rockchip RK3506B industrial controller with RS232, RS422, RS485, CAN bus, and relays<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Google Chrome is now available for Arm Linux. We tested it on a Raspberry Pi 5", "source": "CNX Software", "date": "2026-08-17", "url": "https://www.cnx-software.com/2026/08/17/google-chrome-is-now-available-for-arm-linux-we-tested-it-on-a-raspberry-pi-5/", "summary": "<div><img alt=\"Google Chrome Arm Linux Raspberry Pi OS\" class=\"attachment-medium size-medium wp-post-image\" height=\"415\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/08/Google-Chrome-Arm-Linux-Raspberry-Pi-OS-720x415.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Google Chrome web browser is now available for 64-bit Arm Linux, and we quickly tested it with Raspberry Pi OS on a Raspberry Pi 5 2GB SBC. The open-source Google Chromium web browser has been available for Arm Linux for years, but it lacks some features such as account sync, out-of-the-box DRM support, and automatic updates. Google wrote about working on a port last March, but hasn&#8217;t officially released it. However, users on Interfacing Linux have noticed that it can easily be installed by changing amd64 to arm64 in the download link. So we did that on a Raspberry Pi 5: [crayon-6a82eb03e2ecd013553615/] Google Chrome now appears alongside Chromium and Firefox in the list of Internet applications. The screenshot below shows that some GPU features like WebGL and video acceleration are enabled. The latter is not especially useful on a Raspberry Pi 5 since the Broadcom BCM2712 only supports H.265 hardware [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/08/17/google-chrome-is-now-available-for-arm-linux-we-tested-it-on-a-raspberry-pi-5/\">Google Chrome is now available for Arm Linux. We tested it on a Raspberry Pi 5<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Dstl, Lancaster Uni research innovations for thermal cameras", "source": "Electronics Weekly", "date": "2026-08-17", "url": "https://www.electronicsweekly.com/news/research-news/dstl-lancaster-uni-research-innovations-for-thermal-cameras-2026-08/", "summary": "<p>Working with Amethyst Research and Lancaster University, the UK&#8217;s Dstl (Defence Science and Technology Laboratory) has been designing a novel detector architecture for thermal cameras that boosts efficiency. Specifically, addressing [&#8230;]<\/p>\n<p>The post <a href=\"https://www.electronicsweekly.com/news/research-news/dstl-lancaster-uni-research-innovations-for-thermal-cameras-2026-08/\">Dstl, Lancaster Uni research innovations for thermal cameras<\/a> appeared first on <a href=\"https://www.electronicsweekly.com\">Electronics Weekly<\/a>.<\/p>"}, {"title": "Nvidia books TSMC 1.6nm process for Feynman in H2 2028", "source": "Electronics Weekly", "date": "2026-08-17", "url": "https://www.electronicsweekly.com/news/business/nvidia-books-tsmc-1-6nm-process-for-feynman-in-h2-2028-2026-08/", "summary": "<p>Nvidia is reported to have booked TSMC A16 capacity for Feynman, its post-Rubin architecture GPU. A16 is TSMC’s 1.6nm  successor to its 2nm process N2 with GAA transistors and backside [&#8230;]<\/p>\n<p>The post <a href=\"https://www.electronicsweekly.com/news/business/nvidia-books-tsmc-1-6nm-process-for-feynman-in-h2-2028-2026-08/\">Nvidia books TSMC 1.6nm process for Feynman in H2 2028<\/a> appeared first on <a href=\"https://www.electronicsweekly.com\">Electronics Weekly<\/a>.<\/p>"}, {"title": "D2C phone calls get nearer", "source": "Electronics Weekly", "date": "2026-08-17", "url": "https://www.electronicsweekly.com/news/business/d2c-phone-calls-get-nearer-2026-08/", "summary": "<p>Starlink has recently deployed its first batch of V3 satellites, which deliver direct-to-cell (D2C) services. To avoid congestion, Starlink lowered the V3 satellites&#8217; operating altitude to about 350km, aiming to [&#8230;]<\/p>\n<p>The post <a href=\"https://www.electronicsweekly.com/news/business/d2c-phone-calls-get-nearer-2026-08/\">D2C phone calls get nearer<\/a> appeared first on <a href=\"https://www.electronicsweekly.com\">Electronics Weekly<\/a>.<\/p>"}, {"title": "XPU to CPU ratio in datacentres transitioning from 10:1 to 1:1", "source": "Electronics Weekly", "date": "2026-08-17", "url": "https://www.electronicsweekly.com/news/business/xpu-to-cpu-ratio-transitioning-from-101-to-11-2026-08/", "summary": "<p>The rise of inference workloads is driving new demand and introducing network requirements that differ from those associated with training workloads, says Dell’Oro. This shift is leading to significant expansion [&#8230;]<\/p>\n<p>The post <a href=\"https://www.electronicsweekly.com/news/business/xpu-to-cpu-ratio-transitioning-from-101-to-11-2026-08/\">XPU to CPU ratio in datacentres transitioning from 10:1 to 1:1<\/a> appeared first on <a href=\"https://www.electronicsweekly.com\">Electronics Weekly<\/a>.<\/p>"}, {"title": "Panasonic proposes thick film current resistors as alternative to metal shunt resistors", "source": "Electronics Weekly", "date": "2026-08-17", "url": "https://www.electronicsweekly.com/news/panasonic-proposes-thick-film-current-resistors-as-alternative-to-metal-shunt-resistors-2026-08/", "summary": "<p>Panasonic Industry offers its Thick Film Current Sensing Resistors as a cost-effective alternative to conventional metal shunt resistors for selected low- and medium-current sensing applications. Not all current-sensing applications require [&#8230;]<\/p>\n<p>The post <a href=\"https://www.electronicsweekly.com/news/panasonic-proposes-thick-film-current-resistors-as-alternative-to-metal-shunt-resistors-2026-08/\">Panasonic proposes thick film current resistors as alternative to metal shunt resistors<\/a> appeared first on <a href=\"https://www.electronicsweekly.com\">Electronics Weekly<\/a>.<\/p>"}, {"title": "Toshiba adds to digital isolators", "source": "Electronics Weekly", "date": "2026-08-17", "url": "https://www.electronicsweekly.com/news/business/toshiba-adds-to-digital-isolators-3-2026-08/", "summary": "<p>Toshiba has expanded its DCL34xx0B series of standard digital isolators with four new quad-channel devices for industrial automation equipment. The new devices achieve typical current consumption of 0.2mA per channel [&#8230;]<\/p>\n<p>The post <a href=\"https://www.electronicsweekly.com/news/business/toshiba-adds-to-digital-isolators-3-2026-08/\">Toshiba adds to digital isolators<\/a> appeared first on <a href=\"https://www.electronicsweekly.com\">Electronics Weekly<\/a>.<\/p>"}, {"title": "Ed Becomes The PM’s Fixer", "source": "Electronics Weekly", "date": "2026-08-17", "url": "https://www.electronicsweekly.com/blogs/mannerisms/ed-the-serial-ceo/ed-sorts-out-the-new-pm-2026-08/", "summary": "<p>The new PM has made made it clear to the Cabinet that, with the next general election due by mid-2029,  the No.1 task of the new government  is to be [&#8230;]<\/p>\n<p>The post <a href=\"https://www.electronicsweekly.com/blogs/mannerisms/ed-the-serial-ceo/ed-sorts-out-the-new-pm-2026-08/\">Ed Becomes The PM’s Fixer<\/a> appeared first on <a href=\"https://www.electronicsweekly.com\">Electronics Weekly<\/a>.<\/p>"}, {"title": "Hackaday Links: August 16, 2026", "source": "Hackaday", "date": "2026-08-16", "url": "https://hackaday.com/2026/08/16/hackaday-links-august-16-2026/", "summary": "<div><img alt=\"Hackaday Links Column Banner\" class=\"attachment-large size-large wp-post-image\" height=\"430\" src=\"https://hackaday.com/wp-content/uploads/2014/11/had-links-banner.jpg?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>We&#8217;re no strangers to unusual hardware failures around these parts, but even so, a swarm of jellyfish clogging up the works is a new one to us. That&#8217;s exactly what <a class=\"read-more\" href=\"https://hackaday.com/2026/08/16/hackaday-links-august-16-2026/\">&#8230;read more<\/a>"}, {"title": "Another Radio on a Chip Design", "source": "Hackaday", "date": "2026-08-16", "url": "https://hackaday.com/2026/08/16/another-radio-on-a-chip-design/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"318\" src=\"https://hackaday.com/wp-content/uploads/2026/08/tea.png?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>It used to be a rite of passage to build some sort of AM radio receiver. Many people started with a crystal radio, of course, but you&#8217;d graduate to maybe <a class=\"read-more\" href=\"https://hackaday.com/2026/08/16/another-radio-on-a-chip-design/\">&#8230;read more<\/a>"}, {"title": "Laser Layers for (Almost) Isotropicly Strong Prints", "source": "Hackaday", "date": "2026-08-16", "url": "https://hackaday.com/2026/08/16/laser-layers-for-almost-isotropicly-strong-prints/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"450\" src=\"https://hackaday.com/wp-content/uploads/2026/08/laser-layer-3d-print.jpg?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>If there&#8217;s one defining factor about 3D printing you have to account for when you&#8217;re making a design, it&#8217;s probably layer adhesion. Sure, there are a lot of factors to <a class=\"read-more\" href=\"https://hackaday.com/2026/08/16/laser-layers-for-almost-isotropicly-strong-prints/\">&#8230;read more<\/a>"}, {"title": "Using the Khadas Mind Graphics 2 (NVIDIA RTX 5060 Ti USB4 eGPU) on Ubuntu 26.04", "source": "CNX Software", "date": "2026-08-16", "url": "https://www.cnx-software.com/2026/08/16/using-the-khadas-mind-graphics-2-nvidia-rtx-5060-ti-usb4-egpu-on-ubuntu-26-04/", "summary": "<div><img alt=\"Khadas Mind Graphics 2 NVIDIA GeForce RTX 5060 Ti 16GB eGPU Ubuntu 26.04\" class=\"attachment-medium size-medium wp-post-image\" height=\"532\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/08/Khadas-Mind-Graphics-2-NVIDIA-GeForce-RTX-5060-Ti-16GB-eGPU-Ubuntu-26.04-720x532.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>When we used the NVIDIA GeForce RTX 5060 Ti 16GB-based Khadas Mind Graphics 2 dock with a mini PC running Ubuntu 26.04 last week, the USB4-connected eGPU was detected and enabled automatically, but we encountered two issues: very poor performance and the mini PC failed to boot when the dock was removed. The solution is partially documented as part of a long GEEKOM IT13 Max Ubuntu 26.04 review, but I thought it might be useful to document everything in a shorter article for people who own the Khadas Mind Graphics 2 or another NVIDIA Blackwell eGPU connected over USB4/Thunderbolt. Fixing Khadas Mind Graphics 2 performance issues on Ubuntu The Khadas Mind Graphics 2 and NVIDIA graphics card were automatically detected when I connected the dock to an Ubuntu 26.04 mini PC<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/08/16/using-the-khadas-mind-graphics-2-nvidia-rtx-5060-ti-usb4-egpu-on-ubuntu-26-04/\">Using the Khadas Mind Graphics 2 (NVIDIA RTX 5060 Ti USB4 eGPU) on Ubuntu 26.04<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Adafruit Weekly Editorial Round Up: Back to School, LED Devil Horns, and more!", "source": "Adafruit", "date": "2026-08-16", "url": "https://blog.adafruit.com/2026/08/16/adafruit-weekly-editorial-round-up-back-to-school-led-devil-horns-and-more/", "summary": "ADAFRUIT WEEKLY EDITORIAL ROUND-UP We’ve got so much happening here at Adafruit that it’s not always easy to keep up! Don’t fret, we’ve got you covered. Each week we’ll be posting a handy round-up of what we’ve been up to, ranging from learn guides to blog articles, videos, and more. BLOG Back to School LEARN [&#8230;]"}, {"title": "It’s National Roller Coaster Day #NationalRollerCoasterDay #coasterday", "source": "Adafruit", "date": "2026-08-16", "url": "https://blog.adafruit.com/2026/08/16/its-national-roller-coaster-day-nationalrollercoasterday-coasterday/", "summary": "Cyclone Roller Coaster, Coney Island, New York via Wikipedia &#160; Did you know every August 16 is National Roller Coaster Day? Ride out the summer, with all of the ups and downs, on a coaster of your choosing. If you can stomach them, coasters are marvels of engineering and have been teaching young engineers lessons [&#8230;]"}, {"title": "GEEKOM IT13 Max Review – Part 3: Ubuntu 26.04 on an Intel Core Ultra 9 185H mini computer", "source": "CNX Software", "date": "2026-08-15", "url": "https://www.cnx-software.com/2026/08/15/geekom-it13-max-review-part-3-ubuntu-26-04-on-an-intel-core-ultra-9-185h-mini-computer/", "summary": "<div><img alt=\"GEEKOM IT13 Max Mini PC review Ubuntu 26.04 Linux\" class=\"attachment-medium size-medium wp-post-image\" height=\"483\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/08/GEEKOM-IT13-Max-Mini-PC-review-Ubuntu-26.04-Linux-720x483.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>We&#8217;ve already checked out the hardware with an unboxing and a teardown of the GEEKOM IT13 Max in the first part of the review, before testing the Intel Core Ultra 9 185H mini PC with Windows 11, so it&#8217;s now time to test Linux on the mini computer using Ubuntu 26.04. In this review, we will report our experience running Ubuntu 26.04 on the GEEKOM IT13 Max, after going through feature testing, running system benchmarks and AI benchmarks on the CPU, GPU, and NPU, checking out storage and USB performance, testing 2.5GbE and WiFi 6/7, stress testing the mini PC, and measuring the Meteor Lake mini PC&#8217;s fan noise and power consumption. Installing Ubuntu 26.04 We installed Ubuntu 26.04 alongside Windows 11 in dual boot configuration. We first shrank the Windows partition (C:) size by approximately half, before inserting a USB flash drive with Ubuntu 26.04 to start the installation [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/08/15/geekom-it13-max-review-part-3-ubuntu-26-04-on-an-intel-core-ultra-9-185h-mini-computer/\">GEEKOM IT13 Max Review &#8211; Part 3: Ubuntu 26.04 on an Intel Core Ultra 9 185H mini computer<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "EITWatch open-source ESP32-S3 smartwatch implements planar EIT hand gesture recognition", "source": "CNX Software", "date": "2026-08-14", "url": "https://www.cnx-software.com/2026/08/14/eitwatch-open-source-esp32-s3-smartwatch-implements-planar-eit-hand-gesture-recognition/", "summary": "<div><img alt=\"EITWatch\" class=\"attachment-medium size-medium wp-post-image\" height=\"480\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/08/EITWatch-720x480.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Researchers from Northwestern University have introduced EITWatch, an open-source ESP32-S3-based EIT (Electrical Impedance Tomography) gesture-sensing system that fits within a standard smartwatch footprint. It relies on a Seeed Studio XIAO ESP32-S3 board and eight electrodes arranged on the back of the case to detect hand gestures via impedance changes caused by muscle and tendon movement beneath the skin. Unlike other wrist-EIT systems that use circumferential electrode bands, EITWatch places all eight electrodes on the back of the smartwatch case. The sensing area consists of a 31 mm electrode ring that fits within a standard 40 mm watch case, while a 20 mm PCB extension carries the discrete analog front end (AFE). EITWatch hardware specifications: Wireless board – XIAO ESP32-S3 SoC – Espressif ESP32-S3R8 CPU – Dual-core Tensilica LX7 microcontroller up to 240 MHz with vector instructions for AI acceleration Memory – 512KB SRAM, 8MB PSRAM Wireless – Wi-Fi 4 and [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/08/14/eitwatch-open-source-esp32-s3-smartwatch-implements-planar-eit-hand-gesture-recognition/\">EITWatch open-source ESP32-S3 smartwatch implements planar EIT hand gesture recognition<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Giada DK320 digital signage player and Edge AI embedded PC supports up to the Intel Core 5 315 Wildcat Lake processor", "source": "CNX Software", "date": "2026-08-14", "url": "https://www.cnx-software.com/2026/08/14/giada-dk320-digital-signage-player-and-edge-ai-embedded-pc-supports-up-to-the-intel-core-5-315-wildcat-lake-processor/", "summary": "<div><img alt=\"Giada DK320\" class=\"attachment-medium size-medium wp-post-image\" height=\"370\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/08/Giada-DK320-720x370.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Giada DK320 is an ultra-compact Wildcat Lake mini PC powered by up to an Intel Core 5 315 hexa-core processor and designed for digital signage, edge computing, and embedded applications requiring real-time analytics, intelligent monitoring, and automated decision-making. The system supports up to 48GB DDR5 RAM and M.2 2240/2280 NVMe storage, and offers dual 4K-capable HDMI video output, 2.5GbE networking, an optional WiFi 5/6/7 and Bluetooth module, an RS232 COM port, and four USB 3.2 ports. Giada DK320 specifications: Wildcat Lake SoC (one or the other) Intel Core 3 304 5-core CPU – 1x P-cores @ 1.5/4.3 GHz (Turbo) + 4x LPE-cores @ 1.4/3.3 GHz (Turbo) GPU – 1-core Intel Xe3 Graphics @ 2.3 GHz (9 TOPS) NPU – 15 TOPS Intel Core 5 315 6-core CPU – 2x P-cores @ 1.5/4.4 GHz (Turbo) + 4x LPE-cores @ 1.4/3.3 GHz (Turbo) GPU – 2-core Intel Xe3 Graphics @ 2.3 GHz [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/08/14/giada-dk320-digital-signage-player-and-edge-ai-embedded-pc-supports-up-to-the-intel-core-5-315-wildcat-lake-processor/\">Giada DK320 digital signage player and Edge AI embedded PC supports up to the Intel Core 5 315 Wildcat Lake processor<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Gemma Translator multilingual interpreter runs locally on Raspberry Pi 5 with the LiteRT runtime", "source": "CNX Software", "date": "2026-08-14", "url": "https://www.cnx-software.com/2026/08/14/gemma-translator-multilingual-interpreter-runs-locally-on-raspberry-pi-5-with-the-litert-runtime/", "summary": "<div><img alt=\"Gemma Translator\" class=\"attachment-medium size-medium wp-post-image\" height=\"602\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/08/Gemma-Translator-720x602.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Gemma Translator is an open-source project for the Raspberry Pi 5 that acts as a multilingual interpreter running locally without access to the cloud using Google Gemma 4 and LiteRT runtime. It&#8217;s a project built by three Google engineers with the help of Google Antigravity. It includes code to run an on-device, fully offline voice translator/interpreter using Gemma 4 E2B (2.3B effective / ~5.1B total parameters with per-layer embeddings) and the LiteRT runtime. The hardware is comprised of a few components: A Raspberry Pi 5 with 8GB of RAM Display &#8211; HDMI monitor or touchscreen display such as a 480&#215;320 kiosk display Audio Microphone or USB audio capture interface Speaker or headphone output device Keyboard  &#8211; The project demonstrated below appears to use a custom PCB (AX-4LABS-NEW) with a rotary encoder and four mechanical keys (of which only two are used) Optional 3D printed parts for the enclosure Software highlights: [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/08/14/gemma-translator-multilingual-interpreter-runs-locally-on-raspberry-pi-5-with-the-litert-runtime/\">Gemma Translator multilingual interpreter runs locally on Raspberry Pi 5 with the LiteRT runtime<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Humanoid Robots, Simplifying Embedded System Design, Photonic IC Development: Embedded Week Insights", "source": "Embedded.com", "date": "2026-08-14", "url": "https://www.embedded.com/humanoid-robots-simplifying-embedded-system-design-photonic-ic-development-embedded-week-insights/", "summary": "<p>Here's a roundup of this week's must-read articles. We'll look into the latest developments on humanoid robots, simplifying embedded system design, photonic IC development, and more. Also, check News Archives - Embedded and Technical Articles Archives - Embedded for the complete list of news and articles from our website. NEWS OpenLight and Tower Accelerate Photonic IC Development The expanded [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/humanoid-robots-simplifying-embedded-system-design-photonic-ic-development-embedded-week-insights/\">Humanoid Robots, Simplifying Embedded System Design, Photonic IC Development: Embedded Week Insights<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "Altera Expands DDR5 and LPDDR5 Support Across Agilex FPGAs", "source": "Embedded.com", "date": "2026-08-14", "url": "https://www.embedded.com/altera-expands-ddr5-and-lpddr5-support-across-agilex-fpgas/", "summary": "<p>Altera Corp. has expanded memory support across its Agilex FPGA portfolio with Quartus Prime Pro Edition Software version 26.1.1. The release adds DDR5, LPDDR5, and LPDDR5X-compatible memory capabilities to additional Agilex devices, giving developers greater flexibility when optimizing system bandwidth, power consumption, PCB space, and component availability. For Agilex 7 M-Series devices, the latest software [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/altera-expands-ddr5-and-lpddr5-support-across-agilex-fpgas/\">Altera Expands DDR5 and LPDDR5 Support Across Agilex FPGAs<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "How To: Develop Edge AI on a Raspberry Pi with LiteRT and Gemma", "source": "Electronics Weekly", "date": "2026-08-14", "url": "https://www.electronicsweekly.com/blogs/gadget-master/raspberry-pi-gadget-master/how-to-develop-edge-ai-on-a-raspberry-pi-with-litert-and-gemma-2026-08/", "summary": "<p>This is an interesting one from Google's Developer blog: an example project on Edge AI using a Raspberry Pi along with LiteRT and Gemma.<\/p>\n<p>The post <a href=\"https://www.electronicsweekly.com/blogs/gadget-master/raspberry-pi-gadget-master/how-to-develop-edge-ai-on-a-raspberry-pi-with-litert-and-gemma-2026-08/\">How To: Develop Edge AI on a Raspberry Pi with LiteRT and Gemma<\/a> appeared first on <a href=\"https://www.electronicsweekly.com\">Electronics Weekly<\/a>.<\/p>"}, {"title": "Standards and AI will shape-shift EDA", "source": "Electronics Weekly", "date": "2026-08-14", "url": "https://www.electronicsweekly.com/news/design/eda-and-ip/standards-and-ai-will-shape-shift-eda-2026-08/", "summary": "<p>As AI and machine learning are getting more and more integrated into the EDA workflows, there are new challenges emerging around areas such as interoperability, data exchange, trust, and reproducibility. [&#8230;]<\/p>\n<p>The post <a href=\"https://www.electronicsweekly.com/news/design/eda-and-ip/standards-and-ai-will-shape-shift-eda-2026-08/\">Standards and AI will shape-shift EDA<\/a> appeared first on <a href=\"https://www.electronicsweekly.com\">Electronics Weekly<\/a>.<\/p>"}, {"title": "Google joins OpenROAD EDA initiative", "source": "Electronics Weekly", "date": "2026-08-14", "url": "https://www.electronicsweekly.com/news/design/eda-and-ip/google-joins-openroad-eda-initiative-2026-08/", "summary": "<p>Google is joining the OpenROAD Initiative (ORI) as a principal member, for its open source electronic design automation (EDA). As is customary, Google&#8217;s Technical Program Manager, Aaron Cunningham, is joining [&#8230;]<\/p>\n<p>The post <a href=\"https://www.electronicsweekly.com/news/design/eda-and-ip/google-joins-openroad-eda-initiative-2026-08/\">Google joins OpenROAD EDA initiative<\/a> appeared first on <a href=\"https://www.electronicsweekly.com\">Electronics Weekly<\/a>.<\/p>"}, {"title": "Gemma Translator – Live Translating Offline on a Raspberry Pi 5   #piday #raspberrypi", "source": "Adafruit", "date": "2026-08-14", "url": "https://blog.adafruit.com/2026/08/14/gemma-translator-live-translating-offline-on-a-raspberry-pi-5-piday-raspberrypi/", "summary": "This open source translator was built by a team at google. It is an experiment to build a fully offline translator. All the parts are off the shelf and easy to find: a Raspberry Pi 5, portable battery pack, tiny touchscreen display, mini speaker, and micro keyboard with a knob to select languages. It&#8217;s all [&#8230;]"}, {"title": "John Park’s CircuitPython Parsec: Fruit Jam Library – NeoPixels", "source": "Adafruit", "date": "2026-08-14", "url": "https://blog.adafruit.com/2026/08/14/john-parks-circuitpython-parsec-fruit-jam-library-neopixels/", "summary": "#circuitpythonparsec Use the Fruit Jam Library peripherals module to light on-board NeoPixels. Try out the code example To learn about CircuitPython: https://circuitpython.org &#160;"}, {"title": "Low-Tech Buzzing Operation Game #BackToSchool #BackToSchool2026", "source": "Adafruit", "date": "2026-08-14", "url": "https://blog.adafruit.com/2026/08/14/low-tech-buzzing-operation-game-backtoschool-backtoschool2026/", "summary": "Low-Tech Buzzing Operation Game Build a buzzing gameboard that teaches simple circuits &#8212; great for kids and classes! This version uses mainly everyday household and recycled materials, and it&#8217;s easy for kids to build themselves. There&#8217;s no programming involved &#8212; just a simple paper circuit, basic components, and 3V coin battery for power. August is [&#8230;]"}, {"title": "The Python on Microcontrollers Newsletter: subscribe for free", "source": "Adafruit", "date": "2026-08-14", "url": "https://blog.adafruit.com/2026/08/14/the-python-on-microcontrollers-newsletter-subscribe-for-free-8-14-2/", "summary": "The Python for Microcontrollers Newsletter is the place for the latest news involving Python on hardware (microcontrollers AND single board computers like Raspberry Pi). This ad-free, spam-free weekly email is filled with CircuitPython, MicroPython, and Python information that you may have missed, all in one place! You get a summary of all the software, events, projects, and the latest hardware worldwide once a week, no [&#8230;]"}, {"title": "Make a LEGO Synthesizer or a Color Sensing Music Player with our AS7341 10-Channel Light / Color Sensor Breakout", "source": "Adafruit", "date": "2026-08-14", "url": "https://blog.adafruit.com/2026/08/14/make-a-lego-synthesizer-or-a-color-sensing-music-player-with-our-as7341-10-channel-light-color-sensor-breakout/", "summary": "&#160; The Adafruit AS7341 10-Channel Light / Color Sensor Breakout is a multi-channel spectrometer, which is a special type of light sensor that is able to detect not only the amount of light present but also the amounts of light within different wavelengths. This means that you can use it to detect much better than [&#8230;]"}, {"title": "Raspberry Pi Pico Case with Sensor Cage – Snap-Fit + Wall Mount #3DThursday #3DPrinting", "source": "Adafruit", "date": "2026-08-14", "url": "https://blog.adafruit.com/2026/08/13/raspberry-pi-pico-case-with-sensor-cage-snap-fit-wall-mount-3dthursday-3dprinting/", "summary": "i.boxit shares: A snap-fit Pi Pico case with an integrated sensor cage that lets you keep temp/humidity or other sensors mounted outside the electronics enclosure. Fits Pico, Pico W, and Pico 2. Includes wall mount, Bootsel button access, user LED light tube, cooling grille, and a built-in opener. 0.4mm nozzle at 0.2mm layer height. By [&#8230;]"}, {"title": "Fighting Fire with AI: Technosylva and The Future of Wildfire Prediction", "source": "EE Journal", "date": "2026-08-14", "url": "https://www.eejournal.com/fish_fry/fighting-fire-with-ai-technosylva-and-the-future-of-wildfire-prediction/", "summary": "<img alt=\"\" class=\"webfeedsFeaturedVisual wp-post-image\" height=\"300\" src=\"https://www.eejournal.com/wp-content/uploads/2026/08/ChatGPT-Image-Aug-11-2026-12_46_15-PM-300x300.png\" style=\"display: block; margin-bottom: 5px; clear: both;\" width=\"300\" />In this week&#8217;s podcast, Today, we&#8217;re talking about a problem that is increasingly difficult to ignore: wildfires and extreme weather. My guest today is Indran &#8220;Indy&#8221; Ratnathicam, Chief Growth Officer from Technosylva, a company whose tagline says it all: “We fight fire and extreme weather with science.” Indy and I chat about about Technosylva&#8217;s dedicated wildfire &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/fish_fry/fighting-fire-with-ai-technosylva-and-the-future-of-wildfire-prediction/\">Read More &#8594;<span class=\"screen-reader-text\"> \"Fighting Fire with AI: Technosylva and The Future of Wildfire Prediction\"<\/span><\/a>"}, {"title": "AAEON PICO-ADN2 – A low-profile Alder Lake-N Pico-ITX SBC for space-constrained applications", "source": "CNX Software", "date": "2026-08-13", "url": "https://www.cnx-software.com/2026/08/13/aaeon-pico-adn2-a-low-profile-alder-lake-n-pico-itx-sbc-for-space-constrained-applications/", "summary": "<div><img alt=\"AAEON PICO ADN2\" class=\"attachment-medium size-medium wp-post-image\" height=\"520\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/08/AAEON-PICO-ADN2-720x520.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>AAEON PICO-ADN2 is a low-profile Alder Lake-N Pico-ITX SBC powered by an Intel N97 or Core i3-N305 SoC and designed for space-constrained transportation, digital signage, industrial automation, and smart kiosk applications. Its features are very similar to the PICO-ADN4 Pico-ITX SBC introduced in 2023, with up to 16 GB LPDDR5, HDMI, LVDS, and eDP display interfaces, dual Gigabit Ethernet, an M.2  E-Key socket for wireless, multiple USB interfaces, RS232/RS485 interfaces, and more. The main difference is that most standard (and thick) ports have been replaced by low-profile connectors, except somehow the HDMI connector. AAEON PICO-ADN2 specifications Alder Lake-N SoC (one or the other) Intel Processor N97 quad-core processor up to 3.6 GHz with 6MB cache, 24EU Intel UHD Graphics; TDP: 12W Intel Core i3-N305 octa-core processor up to 3.8 GHz with 6MB cache, 32EU Intel UHD Graphics; TDP: 15W Other Intel Atom x7000E Series, Processor N-series, and Intel Core i3 [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/08/13/aaeon-pico-adn2-a-low-profile-alder-lake-n-pico-itx-sbc-for-space-constrained-applications/\">AAEON PICO-ADN2 &#8211; A low-profile Alder Lake-N Pico-ITX SBC for space-constrained applications<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Qualcomm Snapdragon C Arm SoC outperforms an Intel N250 CPU by up to 67 percent in “unplugged” benchmarks", "source": "CNX Software", "date": "2026-08-13", "url": "https://www.cnx-software.com/2026/08/13/qualcomm-snapdragon-c-arm-soc-outperforms-an-intel-n250-cpu-by-up-to-67-percent-in-unplugged-benchmarks/", "summary": "<div><img alt=\"Qualcomm Snapdragon C specs benchmarks\" class=\"attachment-medium size-medium wp-post-image\" height=\"567\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/08/Qualcomm-Snapdragon-C-specs-benchmarks-720x567.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Qualcomm unveiled the Snapdragon C entry-level Arm SoC for $300+ Windows laptops at Computex 2026 with a ridiculously small amount of details last May, so we had to rely on the specs of the upcoming Acer Aspire Go 15 (AG15-Q31P) laptop. Qualcomm has now released a document entitled &#8220;Snapdragon C Platform Overview&#8221; with more technical details and &#8220;unplugged&#8221; benchmarks &#8211; meaning running on batteries &#8211; comparing a Snapdragon C laptop to one based on Intel Processor N250 Twin Lake SoC. The presentation Snapdragon C specifications: CPU – Up to an octa-core Kryo processor at up to 3.0 GHz (single-core) or 2.0 GHz (quad-core) with 2 MB total cache; note: no data for eight cores GPU – Qualcomm Adreno GPU at up to 900 MHz AI accelerator – Built-in Qualcomm Hexagon NPU (still unspecified performance) System Memory – Up to 16GB LPDDR5/5x or LPDDR4 Storage – PCIe 3.0 NVMe, UFS 2.2/3.1 [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/08/13/qualcomm-snapdragon-c-arm-soc-outperforms-an-intel-n250-cpu-by-up-to-67-percent-in-unplugged-benchmarks/\">Qualcomm Snapdragon C Arm SoC outperforms an Intel N250 CPU by up to 67 percent in &#8220;unplugged&#8221; benchmarks<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "WCH CH32V407/467 RISC-V MCU integrates Fast Ethernet MAC + PHY, 480 Mbps USB 2.0 PHY, up to 8 MB on-chip PSRAM", "source": "CNX Software", "date": "2026-08-13", "url": "https://www.cnx-software.com/2026/08/13/wch-ch32v407-467-risc-v-mcu-integrates-fast-ethernet-mac-phy-480-mbps-usb-2-0-phy-up-to-8-mb-on-chip-psram/", "summary": "<div><img alt=\"CH32V407 block diagram\" class=\"attachment-medium size-medium wp-post-image\" height=\"423\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/08/CH32V407-block-diagram-720x423.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>WCH CH32V407 and CH32V467 are new 200 MHz RISC-V microcontrollers with a built-in 10/100 Mbps Ethernet MAC + PHY, a USB 2.0 high-speed (480 Mbps) host PHY, up to 8 MB on-chip PSRAM, and a range of peripherals for industrial IoT &#38; edge AI applications. Both are based on the company’s Qingke V3V core with RVV vector extensions, delivering 4.11 CoreMark/MHz, a score higher than a typical Arm Cortex-M4 core. The main difference between the CH32V407 and CH32V467 is that the latter comes with 4 MB or 8 MB PSRAM, making it more suitable for display/HMI applications. WCH CH32V407/467 specifications: MCU Core &#8211; QingKe V3V 32-bit RISC-V (IMACV-X, X = custom) core @ up to 200 MHz RVV-vector instruction set and parallel computing Memory and storage 200KB SRAM 4MB or 8MB PSRAM memory (CH32V467 only) 512KB Flash SDIO Interface (MMC, SD/SDIO Cards, and CE-ATA) Optional Flexible Static Memory Controller (FSMC) [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/08/13/wch-ch32v407-467-risc-v-mcu-integrates-fast-ethernet-mac-phy-480-mbps-usb-2-0-phy-up-to-8-mb-on-chip-psram/\">WCH CH32V407/467 RISC-V MCU integrates Fast Ethernet MAC + PHY, 480 Mbps USB 2.0 PHY, up to 8 MB on-chip PSRAM<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Humanoid Robots Need a Real-Time, Distributed Nervous System", "source": "Embedded.com", "date": "2026-08-13", "url": "https://www.embedded.com/humanoid-robots-need-a-real-time-distributed-nervous-system/", "summary": "<p>The emulation of the numerous types of movement produced by the human body in humanoid robots is arguably among the most complex challenges at the forefront of modern engineering. Designing robots to tackle everyday tasks such as assembly on a production line or cooking in a kitchen demands the coordination of multiple sub-tasks. The automation [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/humanoid-robots-need-a-real-time-distributed-nervous-system/\">Humanoid Robots Need a Real-Time, Distributed Nervous System<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "OpenLight and Tower Accelerate Photonic IC Development", "source": "Embedded.com", "date": "2026-08-13", "url": "https://www.embedded.com/openlight-and-tower-accelerate-photonic-ic-development/", "summary": "<p>OpenLight and Tower Semiconductor Ltd. have expanded the design ecosystem for Tower's PH18DA indium phosphide (InP)-on-silicon photonics platform. OpenLight's photonic process design kit (PDK) is now available within Cadence Design Systems' electronic design automation (EDA) tools, enabling developers to design photonic integrated circuits (PICs) using an established IC design environment. The PDK has been developed [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/openlight-and-tower-accelerate-photonic-ic-development/\">OpenLight and Tower Accelerate Photonic IC Development<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "Articulated Skeleton Halloween Flexy – Print-in-Place with Keychain #3DThursday #3DPrinting", "source": "Adafruit", "date": "2026-08-13", "url": "https://blog.adafruit.com/2026/08/13/articulated-skeleton-halloween-flexy-print-in-place-with-keychain-3dthursday-3dprinting/", "summary": "Shared by Printpals on MakerWorld: A funny human skeleton — articulated and flexible for easy posing, quick to print, and simple to assemble. Print-in-place, no supports. Includes a keychain hole on top of the
