he same speed and fidelity that any other connected node can.<\/p><p class=\"pull-quote\">The history of computing is a history of interface revolutions. The next transition is not about a new screen or a new microphone — it is about treating the human body itself as a participant in the computing network.<\/p><p>This path is not a competitor to the work being done on humanoid robots, foundation models for embodied AI, and dexterous manipulation. It is the missing complement to that work. The hardest open problem for humanoid systems is the data: every natural interaction between a human and the physical world is a potential training signal, and most of those interactions are currently invisible to any computing system. As more humans become first-class nodes in the loop, those interactions become observable, structured, and ultimately useful for training the next generation of embodied AI, including the humanoid robots being developed today.<\/p><p>In other words: putting the human back into the computing loop is not just about better interfaces for individual users. It is about generating the kind of grounded, in-the-wild human-machine interaction data that the broader Physical AI ecosystem will need to keep advancing. The robot side and the human side of the loop are not two competing futures. They are two halves of the same one.<\/p><p>That is what Wetour Robotics means when it says: <em>Your body is the interface.<\/em><\/p><p>Learn more at <a href=\"https://wetourrobotics.com/\" target=\"_blank\">wetourrobotics.com<\/a>.<\/p>"}, {"title": "Will Robotics Have a ChatGPT Moment?", "source": "IEEE Spectrum Robotics", "date": "2026-05-20", "url": "https://spectrum.ieee.org/robotics-ai-breakthrough", "summary": "<img src=\"https://spectrum.ieee.org/media-library/a-collection-of-5-robots-against-colored-backgrounds.jpg?id=66734221&amp;width=1245&amp;height=700&amp;coordinates=0%2C88%2C0%2C88\" /><br /><br /><p>Over the next few decades, billions of autonomous, AI-powered robots will work alongside people in factories, perform tedious tasks in warehouses, care for the elderly, <a href=\"https://spectrum.ieee.org/collections/darpa-subterranean-challenge/\" target=\"_blank\">assist in unsafe disaster areas<\/a>, deliver packages and food to our doorsteps, and eventually help out in our homes. Some will look like us, and many won’t. What is certain is that regardless of form factor, robots will all rely heavily on AI in order to deliver real-world value.<\/p><div class=\"rm-embed embed-media\"><\/div><p><span>In 2025, total investments in robotics companies reached <\/span><a href=\"https://www.cbinsights.com/research/report/venture-trends-2025/\" target=\"_blank\">a record US $40.7 billion, accounting for 9 percent of all venture funding<\/a><span>. The multibillion dollar question therefore is this: What will it take for AI-powered robots to begin to have a serious economic impact? Many of today’s robotics and AI companies are making bold claims, such as that humanoid robots will <\/span><a href=\"https://www.1x.tech/\" target=\"_blank\">soon be coming into our homes<\/a><span>, but there’s still a big gap between promise and reality.<\/span><\/p><p><span><\/span><span>The promise of robots that live and work alongside us has been the stuff of science fiction for a very long time. And while many programmers have tried to make that promise a reality, the physical world is just too complicated for traditional computer programs to handle the endless complexity it presents. Thanks to AI, robots are no longer being programmed—instead, they learn to operate in the real world. With enough practice, they can learn to perceive and understand the world around them, reason about that world, and use that reason and understanding to perform tasks that are useful, reliable, and safe.<\/span><\/p><p>The two of us have worked at the forefront of AI and robotics for the last decade, as a <a href=\"https://engineering.oregonstate.edu/people/jonathan-hurst\" target=\"_blank\">Professor in Robotics at Oregon State University<\/a> and <a href=\"https://www.agilityrobotics.com/about/leadership\" target=\"_blank\">Co-Founder of Agility Robotics<\/a>, and as <a href=\"https://www.linkedin.com/in/hanspeter/\" rel=\"noopener noreferrer\" target=\"_blank\">former CEO<\/a> of the <a href=\"https://everydayrobots.ai/\" rel=\"noopener noreferrer\" target=\"_blank\">Everyday Robots moonshot at Google X<\/a>. Our experience deploying AI-powered robots in real-world settings has given us a perspective on where AI can be used to great benefit in complex robotic systems in the near term and where we are still on the frontier of science fiction. We believe AI will enable an inflection point in robotics advances, but that it will be through the well-engineered application of coordinated systems of different AI tools rather than a single ChatGPT-style breakthrough.<\/p><p>As the excitement around AI is matched only by the uncertainty of what will be possible, here are five hard truths that will define AI in robotics.<\/p><h2>1. The YouTube-to-Reality Gap Is Real<\/h2><p>For years, we have been seeing videos on YouTube with humanoid robots performing amazing moves on everything from a dance floor to an obstacle course. The inside knowledge in robotics is to “never trust a YouTube robot video.” The gap between real robots that can perform real work in unstructured human environments and carefully scripted and edited robot performances remains significant. The latest performance to get a lot of attention was a <a href=\"https://www.youtube.com/watch?v=mUmlv814aJo\" rel=\"noopener noreferrer\" target=\"_blank\">martial arts show<\/a> featuring Unitree humanoid robots performing with children at the Chinese 2026 Spring Festival Gala. While impressive, this falls into a long lineage of tightly scripted robotic performances, where everything has been carefully choreographed and planned in advance. The low-level controls, synchronization, and choreography were stunning, yet the Spring Gala robot performance showed a level of autonomy and intelligence much closer to industrial robots building cars in a factory than something that will show up in your living room any time soon. <\/p><p class=\"shortcode-media shortcode-media-youtube\"> <span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span> <\/p><p><span>Seeing these kinds of demos nevertheless raises questions about where robotics really is. If robots can perform kung fu moves and do backflips and dance, why aren’t they also showing up on factory floors yet? And why can’t they do the dishes in my home after dinner? The simple answer is this: Making AI-powered robots capable of performing general tasks in varied human environments is still <\/span><em><em>really<\/em><\/em><span> hard. While impressive technological feats like those at the Spring Festival may make it look like we could be very close, the use of AI in these demos is only for low-level motor control (to keep the robots from falling over) and therefore is only a small part of the solution for robots to be general purpose in the real, unstructured spaces where we humans live and work.<\/span><\/p><h2>2. Data Is An Unsolved Challenge<\/h2><p>Large Language Models (LLMs) like OpenAI’s ChatGPT and Anthropic’s Claude were initially trained on an internet-scale database of text. The world woke up one day in late 2022 to ChatGPT demonstrating that AI computers could suddenly “speak” to us in prose or verse and about seemingly any topic. LLMs have turned out to generalize well and are now able to take multimodal input (text, images, video) and produce multimodal output. Importantly, the corpus of training data was both enormous and human-generated, which are characteristics that form the gold standard for AI training.<\/p><p class=\"shortcode-media shortcode-media-rebelmouse-image rm-float-left rm-resized-container rm-resized-container-25\" style=\"float: left;\"> <img alt=\"A series of four images, including robots working in a contained factory space, in an open indoor factory, outdoors in the real world delivering a package, and working with a human to move a couch in an apartment.\" class=\"rm-shortcode\" id=\"a0903\" src=\"https://spectrum.ieee.org/media-library/a-series-of-four-images-including-robots-working-in-a-contained-factory-space-in-an-open-indoor-factory-outdoors-in-the-real.jpg?id=66734272&amp;width=980\" /> <small class=\"image-media media-caption\">The fastest path to robots as part of everyday life may emerge through a range of robot forms performing increasingly sophisticated applications and employing a range of AI tools.<\/small><small class=\"image-media media-photo-credit\">Agility Robotics<\/small><\/p><p>Giving AI a body (in the form of a robot), so that it can engage with people in the physical world, continues to be a very difficult and broadly unsolved problem. AI models for general-purpose robotics must simultaneously satisfy multiple, often conflicting, physical, geometric, and temporal limitations while operating in unstructured, dynamic environments. In order to generalize, robot models need to be trained on data gathered in a high-dimensional configuration space, where “dimensions” represent text, lighting conditions, degrees of freedom, joint limits, velocities, force, and safety boundaries, just to mention a few. Importantly, this must be <em><em>good<\/em><\/em> data—it must contain many examples from what amounts to an infinite number of possible configurations in the physical world.<\/p><p>Since there are very few existing sources of data like this, approaches like teleoperation, video analysis, motion capture of humans, and self-exploration in simulation and in the real world are all seen as important ways to collect data. It’s a herculean task. For example, at Everyday Robots at Google X, we ran 240 million robot instances in our simulator over the course of 2022 to collect training data, mostly to train a trash-sorting model. Similar amounts of data will be needed for every skill to get to a similar level of capability, which is not yet human level.<\/p><h2>3. There Will Be No Single Robot AI<\/h2><p>We are far away from a moment where a single AI model might allow general-purpose robots to live and work alongside us. <\/p><p>General-purpose robots can have wheels or legs. They can have one, two, three, or more arms. Some have propellers and can fly, while others may be designed to operate under water. Some will drive on busy roads. The physical world is infinitely varied and complex. And then there are all the people and other animals that will be surrounding the robots. How do you train a model to operate a robot safely and reliably in all of these settings? The simple answer is: You don’t. At least not for quite some time.<\/p><p>We believe the winning AI architecture leading to the next big breakthroughs in general-purpose robotics will be “agentic AI” for robots, which are high-level coordinating models that can reason, plan, use tools, and learn from outcomes to execute complex tasks with limited supervision. Agentic, high-level models running on robots will invoke a system of specialized ones for different types of tasks. We will likely soon see multiple robots collaborating and coordinating with each other through their onboard agentic AI models.<\/p><p>AI tools are unlocking new and powerful capabilities in robotics, which in turn will enable new solutions and new markets. It’s encouraging to see these new models being made broadly available, some even as open-source solutions. This availability is akin to what happened with the internet: Real progress occurred when it became ubiquitous. We anticipate an inevitable democratization of complex behaviors in robotics with wide access to these AI tools and technologies.<\/p><h2>4. Hardware Is Still Very Hard<\/h2><p>Robots are complex systems with many parts that all need to work together with great precision. For a robot to be useful and safe, every part of it must be coordinated, from its perception systems to the computer controlling it, all the way down to its individual actuators.<\/p><p>Actuators—that is, the motors and gears—are a good example of an important part of the robot where what got us here won’t get us there. The actuators used at scale by most industrial robots will not work for robots that will operate in human environments. If these robots accidentally collide with an obstacle, the resulting impacts are harsh, forces are high, and things break. Humans don’t move in this way. We are far more compliant in how we interact with the world, and we’re constantly making contact with our environment and using that contact to help us accomplish things. <\/p><p>Consider the challenge of inserting a key in a lock: Humans typically don’t do this by aligning the key perfectly with the keyhole. Instead, we just feel for the edge of the keyhole and jiggle the key in. Robots need to be able to operate in novel ways to achieve comparable capabilities by using a new class of actuators that are sensitive to force and able to have a compliant interaction with the environment. While these kinds of actuators do exist, they are not yet generally available at scale for robot systems designed to operate around people.<\/p><h2>5. Real Value Comes From “Easy” Tasks<\/h2><p>There’s a big difference between tasks that look impressive and real-world tasks that provide value. Robotics is a perfect example of <a href=\"https://en.wikipedia.org/wiki/Moravec%27s_paradox\" target=\"_blank\">Moravec’s paradox<\/a>, which states that tasks that are hard for humans are easy for computers (like multiplying two big numbers), and tasks easy for humans (like a toddler’s movements) are extremely difficult for computers and robots.<\/p><p>Serving customers is an unforgiving reality check, because customers only care about solving the real problems they have. If we are to deploy AI-based robot solutions, they must outperform the way things are currently done while demonstrating reliable performance metrics and safety. Agility Robotics’ early work to deploy our humanoid robot Digit in customer locations led to the realization that our first obstacle was safety: Robots that balance and manipulate objects in human spaces bring new types of risk to the workplace. In the first <a href=\"https://www.youtube.com/watch?v=AJpTpUqjgrY\" target=\"_blank\">humanoid deployments<\/a>, physical barriers were necessary, and Agility kicked off a multi-year engineering effort to solve the safety challenge, touching nearly every aspect of robot design and relying heavily on new AI-based approaches to human detection and behavior control.<\/p><p class=\"shortcode-media shortcode-media-youtube\"> <span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span> <\/p><p><a href=\"https://everydayrobots.ai/vision\" target=\"_blank\">Everyday Robots<\/a> at Google deployed robots in 2019 that worked autonomously in office buildings doing chores like cleaning cafe tables and sorting trash. We quickly learned how “messy” and difficult the real world is for a robot. This experience informed the architecture and deployment of our AI systems while also gathering real-world data that could be combined with simulation data for training and improving models.<\/p><p>This focus on creating a product to meet specific customer needs and deploying robots in real-world settings is the only way to inform the structure of the AI tools and infrastructure for near-term utility on a path towards long-term broader capability and generality. There will be no “aha” moment, no silver bullet algorithm, and no volume of data sufficient to produce a general-purpose robot without extensive real-world experience. <\/p><h2>AI Robots Are Coming, One Step at a Time<\/h2>As we look to the future, there is no doubt that the world is bringing AI into the physical world through robots. We are at the beginning of a “<a href=\"https://spectrum.ieee.org/is-a-cambrian-explosion-coming-for-robotics\" target=\"_self\">Cambrian explosion<\/a>“ of useful, intelligent machines. We believe AI is not one tool, but a huge frontier of technical approaches that is unlocking new capabilities so powerful, they will define our economy moving forward. This will happen not in one single definitive moment, but as an ongoing set of small and large breakthroughs, where AI-driven robots begin to provide real value in a few tasks, and then a few more, with impacts unfolding across numerous $100 billion-plus markets that will dramatically improve the quality of our lives."}], "roboticsNews": [{"title": "RoboBusiness 2026 recap", "source": "Robotics Business Review", "date": "2026-10-30", "url": "https://www.therobotreport.com/robobusiness-2026-recap/", "summary": "<p>The Robot Report editorial team sits down for a recap of noteworthy sessions and networking around the 2026 RoboBusiness event.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/robobusiness-2026-recap/\">RoboBusiness 2026 recap<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Video Friday: Spot Plays to Show Its Whole-Body Manipulation", "source": "IEEE Spectrum Robotics", "date": "2026-10-30", "url": "https://spectrum.ieee.org/video-friday-whole-body-manipulation", "summary": "<img src=\"https://spectrum.ieee.org/media-library/colorful-boston-dynamics-robot-dog-plays-with-a-tire-on-an-outdoor-basketball-court-while-someone-with-a-hockey-stick-interferes.webp?id=68558917&amp;width=1200&amp;height=800&amp;coordinates=88%2C0%2C89%2C0\" /><br /><br /><p><span>Video Friday is your weekly selection of awesome robotics videos, collected by your friends at <\/span><em>IEEE Spectrum<\/em><span> robotics. We also post a weekly calendar of upcoming robotics events for the next few months. Please <\/span><a href=\"mailto:automaton@ieee.org?subject=Robotics%20event%20suggestion%20for%20Video%20Friday\">send us your events<\/a><span> for inclusion.<\/span><\/p><h5><a href=\"https://www.corl.org/\">CoRL 2026<\/a>: 9–12 November 2026, AUSTIN<\/h5><h5><a href=\"https://2026.ieee-humanoids.org/\">Humanoids 2026<\/a>: 6–9 December 2026, SANTA CLARA, CA<\/h5><p>Enjoy today’s videos!<\/p><div class=\"horizontal-rule\"><\/div><div><span style=\"display: none;\"> <\/span><\/div><p class=\"rm-anchors\" id=\"ndiwulwjdz8\">Some top-notch <a href=\"https://spectrum.ieee.org/boston-dynamics-spot-robot-arm\" target=\"_blank\">whole-body manipulation<\/a> here from RAI, although it’s a little hard to tell whether there’s direct torso involvement, which is something that humans do with heavy or awkward stuff all the time.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>“Anything that shows up as a blob in a depth image can be taken for the tire, whether a person walking past or a stray object on the floor. In a few runs the robot left the tire and went after something else.” That “something else” seems suspiciously vague, doesn’t it?<\/p><p>[ <a href=\"https://rai-inst.com/resources/blog/whole-body-manipulation-outside-the-lab/\">Robotics and AI Institute<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"bpqiqhl3lwe\"><em>We present a contact-centric learning framework for versatile humanoid mobility in complex and unstructured environments. Our approach bridges motion imitation and reinforcement learning by leveraging human motion data as a training prior while enabling autonomous adaptation to previously unseen terrains.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://leggedrobotics.github.io/ACP/\">ETH Zurich Robotic Systems Lab<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"zul_un_vsyy\">You’ve literally heard me say it a thousand times: The only things that could possibly make <a href=\"https://spectrum.ieee.org/video-friday-reachy-mini\" target=\"_blank\">Reachy Mini<\/a> better would be some wheels and a whole bunch of fancy hats.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>But of course the only way I could possibly recommend the wheels is if Reachy Mini can totally wreck <a href=\"https://spectrum.ieee.org/video-friday-microduck-robot\" target=\"_blank\">Microduck<\/a> in a race.<\/p><p class=\"shortcode-media shortcode-media-youtube\"> <span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://pollen-robotics.com/reachy-mini/\">Pollen Robotics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"457qs4y5ovk\"><em>Luxonis is launching OAK 4 FFC, a 70 x 53 mm vision computer that lets humanoid and drone builders put up to five cameras wherever the robot needs them. The board runs sync, stereo depth, and AI itself, and calibrates from the scene instead of a checkerboard.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.luxonis.com/oak4-ffc\">Luxonis<\/a> ]<\/p><p>Thanks, Carson!<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"afq3itbj0sy\">Coming soon: <a href=\"https://spectrum.ieee.org/robot-video-2655205032\" target=\"_blank\">Mini Pupper<\/a> 4!<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.kickstarter.com/projects/mdrobotkits/mini-pupper-4-from-learning-to-earning-with-3dof-motors\">MangDang<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"kzfs2w343gc\"><em>HX Friends explores different robotic hand designs powered by DYNAMIXEL, ranging from a single articulated finger and a gripper to three-, four-, and five-finger hands. The video includes motion demonstrations across the lineup and VR teleoperation of the multifinger hands.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://docs.robotis.com/docs/systems/hx_friends/\">Robotis<\/a> ]<\/p><p>Thanks, Hyunwoo!<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"-7sm7wi95gw\"><em>Developed by bluZenit, monkeyBot 2.0 is an innovative robotic platform designed to navigate complex industrial piping systems. Inspired by nature, monkeyBot 2.0 uses a unique gripping and climbing mechanism to move along vertical and horizontal pipes, navigate bends, and access challenging locations within industrial facilities.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://bluzenit.com/\">bluZenit<\/a> ]<\/p><p>Thanks, Trevor!<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"sj22ovurksg\">I understand that you need some kind of repeatable baseline or whatever for training robots to do stuff, but I would be so much more impressed with any cleaning robot at all if it would clean stuff that was actually dirty for once.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://generalistai.com/\">Generalist<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"a8hwk-sjmt8\">Calling this a “robot” hand at this point might be a little bit premature, but this is the kind of technology we’re going to need for deployable robots that are compliant and safe.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.brubotics.eu/\">BruBotics Human Robotics Research Center<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"qj_jx64ww_e\">Robotiq really is the OG of industrial manipulation, aren’t they?<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>And they’ve got a new tactile sensing gripper, too.<\/p><p>[ <a href=\"https://robotiq.com/physical-ai-grippers\">Robotiq<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"ryvbmafgmtc\">Introducing ANYmal X, which is the least likely to explode quadruped currently available for purchase.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.anybotics.com/robotics/anymal-x/\">ANYbotics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"upecnveyc2u\">For those of us who prefer to play tennis alone.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://tenniix.ai/\">LimX Dynamics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"qolnqlkmmdq\"><em>At Yulong River Scenic Area in Guangxi, China, DEEPRobotics’ Lite3 quadruped robot and LYNX M20 wheeled-legged robot are working together across a range of real-world tourism scenarios.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.deeprobotics.us/\">DEEPRobotics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"e0r_uglakl8\"><em>In April 2025, the MAVLab team from TU Delft competed in the A2RL Drone Racing Championship in Abu Dhabi. Their AI algorithm MonoRace won the AI Grand Challenge and then beat three human FPV world champions. The drone uses only a single onboard camera and an IMU for state estimation. An onboard neural network maps the estimated state directly to motor commands.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.science.org/doi/10.1126/scirobotics.aee9250\">MonoRace via Science Robotics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"jeodoari4ve\">This video from Starship is worth watching mostly for the b-roll of their early prototypes.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.starship.xyz/\">Starship<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"3rf5wat7z_y\"><em>Meet SAWbot, a bio-inspired amphibious robot that swims using a continuous wavelike motion powered by a single motor. SAWbot is among the most energy-efficient swimming robots reported to date. It can swim, crawl on land, and transition between water and land while generating minimal disturbance to aquatic life.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://ieeexplore.ieee.org/abstract/document/11595504\">Paper via IEEE Robotics and Automation<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"raeqxgoid6e\">If you missed IROS this year, a bunch of the talks are now online, and here are a couple of good ones.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p class=\"shortcode-media shortcode-media-youtube\"> <span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://2026.ieee-iros.org/\">IROS 2026<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div>"}, {"title": "Percepto launches Axion AI platform to unify inspection data analysis", "source": "Robotics Business Review", "date": "2026-10-30", "url": "https://www.therobotreport.com/percepto-launches-axion-ai-platform-unify-inspection-data-analysis/", "summary": "<p>Percepto has launched Axion, a hardware-agnostic physical AI platform delivering visibility across mission-critical infrastructure.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/percepto-launches-axion-ai-platform-unify-inspection-data-analysis/\">Percepto launches Axion AI platform to unify inspection data analysis<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Humanoid developer Agility now expects to raise $465M in SPAC deal", "source": "Robotics Business Review", "date": "2026-10-30", "url": "https://www.therobotreport.com/humanoid-developer-agility-now-expects-raise-465m-spac-deal/", "summary": "<p>Agility said it expects to raise $465 million in its combination with Churchill Capital Corp XI, $155 million less than it had estimated.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/humanoid-developer-agility-now-expects-raise-465m-spac-deal/\">Humanoid developer Agility now expects to raise $465M in SPAC deal<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "AGIBOT introduces Worken to measure robot productivity at AGIBOT Innovation Day 2026", "source": "Robotics Business Review", "date": "2026-10-29", "url": "https://www.therobotreport.com/agibot-introduces-worken-measure-robot-productivity-innovation-day-2026/", "summary": "<p>AGIBOT unveiled its AHA3 integrated platform, GO-3 Preview, and WITA-Omni 1.0 model, as well as the G2 Max robot and Link-U OS 1.0 framework.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/agibot-introduces-worken-measure-robot-productivity-innovation-day-2026/\">AGIBOT introduces Worken to measure robot productivity at AGIBOT Innovation Day 2026<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "White House makes Section 232 determination regarding foreign-made robots", "source": "Robotics Business Review", "date": "2026-10-29", "url": "https://www.therobotreport.com/white-house-makes-section-232-determination-regarding-foreign-made-robots/", "summary": "<p>The U.S. secretary of commerce's Section 232 investigation concluded that dependence on robotics imports poses a national security risk.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/white-house-makes-section-232-determination-regarding-foreign-made-robots/\">White House makes Section 232 determination regarding foreign-made robots<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "2026 Robotics Handbook looks at humanoids, AI, and design choices", "source": "Robotics Business Review", "date": "2026-10-29", "url": "https://www.therobotreport.com/2026-robotics-handbook-looks-at-humanoids/", "summary": "<p>The 2026 Robotics Handbook examines design choices behind dexterous manipulation, humanoid robots, and construction automation.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/2026-robotics-handbook-looks-at-humanoids/\">2026 Robotics Handbook looks at humanoids, AI, and design choices<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "What Symbotic’s Walmart growth teaches robotics startups about anchor customers", "source": "Robotics Business Review", "date": "2026-10-28", "url": "https://www.therobotreport.com/what-symbotic-growth-with-walmart-teaches-robotics-startups-about-anchor-customers/", "summary": "<p>Symbotic’s growth with Walmart shows how an anchor customer can fund a robotics startup’s scale while creating risks around customer concentration, contractual restrictions and the challenge of building a diversified, repeatable business.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/what-symbotic-growth-with-walmart-teaches-robotics-startups-about-anchor-customers/\">What Symbotic’s Walmart growth teaches robotics startups about anchor customers<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Warp Sciences emerges from stealth, to apply robotics to drug research", "source": "Robotics Business Review", "date": "2026-10-28", "url": "https://www.therobotreport.com/warp-sciences-emerges-stealth-apply-robotics-drug-research/", "summary": "<p>Warp Sciences has co-founders from OpenAI, Meta, and more, plus funding to build infrastructure for automated drug discovery in the U.S.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/warp-sciences-emerges-stealth-apply-robotics-drug-research/\">Warp Sciences emerges from stealth, to apply robotics to drug research<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "WorldOracle Tests Whether World Models Can Reliably Predict Real-World Executions", "source": "Robotics Business Review", "date": "2026-10-28", "url": "https://www.therobotreport.com/worldoracle-tests-whether-world-models-can-reliably-predict-real-world-executions/", "summary": "<p>In one case showcased by WorldOracle, a robot's grasp missed, yet the world model predicted that the robot had successfully picked up the fruit.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/worldoracle-tests-whether-world-models-can-reliably-predict-real-world-executions/\">WorldOracle Tests Whether World Models Can Reliably Predict Real-World Executions<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "North American robot orders climb 24.8% in Q3 of 2026, says A3", "source": "Robotics Business Review", "date": "2026-10-28", "url": "https://www.therobotreport.com/north-american-robot-orders-climb-24-8-q3-2026-says-a3/", "summary": "<p>Robot demand from automotive component manufacturers nearly doubled in Q3, as other sectors posted strong gains, reported A3.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/north-american-robot-orders-climb-24-8-q3-2026-says-a3/\">North American robot orders climb 24.8% in Q3 of 2026, says A3<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "ANYbotics begins delivering ANYmal X legged robot for explosive atmospheres", "source": "Robotics Business Review", "date": "2026-10-27", "url": "https://www.therobotreport.com/anybotics-begins-delivering-anymal-x-legged-robot-explosive-atmospheres/", "summary": "<p>ANYbotics has designed the ANYmal X inspection robot to comply with the strictest safety standards of the oil, gas, and chemical industries.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/anybotics-begins-delivering-anymal-x-legged-robot-explosive-atmospheres/\">ANYbotics begins delivering ANYmal X legged robot for explosive atmospheres<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Embotech and BMW move 1M vehicles with automated driving technology", "source": "Robotics Business Review", "date": "2026-10-27", "url": "https://www.therobotreport.com/embotech-bmw-move-1m-vehicles-automated-driving-technology/", "summary": "<p>Embotech is automatically moving 3,500 vehicles around the clock daily across four BMW sites in the U.K. and Germany.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/embotech-bmw-move-1m-vehicles-automated-driving-technology/\">Embotech and BMW move 1M vehicles with automated driving technology<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Xpanner launches autonomous pile driver for solar farm contruction", "source": "Robotics Business Review", "date": "2026-10-27", "url": "https://www.therobotreport.com/xpanner-launches-new-autonomous-pile-driver-solar-farm-contruction/", "summary": "<p>Xpanner's new X1 Piling R6 robot autonomously drives solar posts with one operator, improving placement accuracy while cutting on-site labor.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/xpanner-launches-new-autonomous-pile-driver-solar-farm-contruction/\">Xpanner launches autonomous pile driver for solar farm contruction<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Your Robot’s Safety Functions Already Work. What If the Input Lies?", "source": "IEEE Spectrum Robotics", "date": "2026-10-27", "url": "https://spectrum.ieee.org/ai-robot-safety-cybersecurity-vicone", "summary": "<img src=\"https://spectrum.ieee.org/media-library/humanoid-robot-and-robot-dog-meet-a-woman-on-a-sunny-terrace-at-sunset.jpg?id=68002098&amp;width=1200&amp;height=800&amp;coordinates=25%2C0%2C26%2C0\" /><br /><br /><p><em>This article is brought to you by <a href=\"https://vicone.com/?utm_source=ieee-spectrum&amp;utm_medium=sponsored-content&amp;utm_campaign=2026-10\" rel=\"noopener noreferrer\" target=\"_blank\">VicOne<\/a>.<\/em><\/p><p><em><\/em><span>A mobile robot slows for someone in a hallway. A collaborative arm eases its movement as a worker approaches. A humanoid pauses to let a person pass. Each response depends on information about the robot or its surroundings: a distance reading, a position estimate, or a stop signal.<\/span><\/p><p>But what happens when one of those inputs is wrong, and the robot still responds exactly as designed? The mobile robot reads the hallway as clear while someone is still there. The arm estimates that the worker is farther away. The humanoid does not receive a stop signal as a person crosses its path.<\/p><p>In each case, a fault could cause that mismatch. So could <a href=\"https://vicone.com/blog/can-a-robot-do-everything-right-and-still-be-unsafe/?utm_source=ieee-spectrum&amp;utm_medium=sponsored-content&amp;utm_campaign=2026-10\" target=\"_blank\">deliberate manipulation<\/a>.<\/p><p>At <a href=\"https://www.linkedin.com/showcase/vicone-lab-r7/posts/?utm_source=ieee-spectrum&amp;utm_medium=sponsored-content&amp;utm_campaign=2026-10\" target=\"_blank\">VicOne LAB R7<\/a>, we examine how manipulated inputs can change robot behavior — and what that means for the systems meant to keep people safe.<\/p><h2>How an untrusted input can change a robot’s behavior<\/h2><p>A robot does more than measure its surroundings. It may interpret what it sees and hears to decide what to do next. Information placed in its environment can therefore influence its actions.<\/p><p>Published research shows how this can happen. In a <a href=\"https://arxiv.org/abs/2411.13587\" target=\"_blank\">study of vision-language-action (VLA) models<\/a>, a patch in a camera’s view reduced task success in simulated robot tests. <a href=\"https://arxiv.org/abs/2509.19870\" target=\"_blank\">FreezeVLA<\/a> found that an adversarial image could cause tested models to ignore later instructions. Although the studies used different methods, both demonstrate how visual input can interfere with a robot’s intended task.<\/p><p class=\"pull-quote\">In a robot-dog test using Gemma 4 E4B, text on a poster was treated as an instruction and changed the robot’s movement.<\/p><p><a href=\"https://www.linkedin.com/showcase/vicone-lab-r7/posts/?utm_source=ieee-spectrum&amp;utm_medium=sponsored-content&amp;utm_campaign=2026-10\" target=\"_blank\">VicOne LAB R7<\/a> also tested how untrusted inputs could change robot behavior. In a robot-dog test using Gemma 4 E4B, text on a poster was treated as an instruction and changed the robot’s movement. In a separate hospital-service-robot simulation using Nemotron on NVIDIA Jetson AGX Orin, crafted audio that is inaudible to people changed the robot’s simulated behavior. The assigned tasks did not change; the inputs did.<\/p><p class=\"shortcode-media shortcode-media-youtube\"> <span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span> <small class=\"image-media media-caption\">In a VicOne LAB R7 test, text on a poster changed a robot dog’s movement, illustrating how a crafted input can turn an unlikely outcome into a repeatable attack.<\/small><small class=\"image-media media-photo-credit\">VicOne<\/small><\/p><h2>Safety-related decisions have inputs too<\/h2><p>An independent protective system may still stop a dangerous action. But that system also depends on information: readings, estimates, and messages that tell it when to intervene. What happens if one of those inputs is manipulated?<\/p><p>At a robotics bug bounty event, VicOne LAB R7 researchers injected a ROS 2/DDS message into a robot that organizers expected to remain still under a safe-control setting. The robot moved.<\/p><p>A humanoid’s balance controller offers another example. If it relies on a vulnerable gyroscope, sound at the sensor’s resonant frequency could distort its reported rotation. The controller might correct for a tilt that never occurred. <a href=\"https://www.usenix.org/conference/usenixsecurity15/technical-sessions/presentation/son\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"https://www.usenix.org/conference/usenixsecurity15/technical-sessions/presentation/son\">Researchers demonstrated<\/a> the underlying acoustic attack against drones with vulnerable gyroscopes. The research did not demonstrate the same attack chain causing a humanoid to fall.<\/p><p>Other protections could interrupt either chain. The question for safety and security teams is whether those protections detect the danger independently or depend on the same manipulated information.<\/p><p class=\"shortcode-media shortcode-media-rebelmouse-image\"> <img alt=\"Table comparing AI safety risks (bugs, failures) with security risks (attacks, hijacks).\" class=\"rm-shortcode\" id=\"571fc\" src=\"https://spectrum.ieee.org/media-library/table-comparing-ai-safety-risks-bugs-failures-with-security-risks-attacks-hijacks.jpg?id=68002090&amp;width=980\" /> <small class=\"image-media media-caption\">Figure 1. VicOne maps how accidental faults and deliberate cyber manipulation can lead to similar robot safety outcomes, from loss of control to physical harm.<\/small><small class=\"image-media media-photo-credit\">VicOne<\/small><\/p><h2>Deliberate attacks challenge safety assumptions<\/h2><p>A safety assessment may treat a combination of accidental faults as unlikely. Deliberate manipulation changes that assumption. An attacker can choose when to introduce a false input and repeat the same trigger. That does not make harm inevitable, but it may change how cyber risks should be assessed.<\/p><p>Redundant sensors also need an adversarial test. If one action can affect both inputs, their agreement may offer less reassurance than expected. In <a href=\"https://arxiv.org/abs/2106.09249\" target=\"_blank\">autonomous driving research<\/a>, a crafted physical object misled a system combining camera and LiDAR perception. The study does not establish a weakness in a particular robot, but it shows why teams should test whether one manipulation can affect several checks at once.<\/p><p class=\"pull-quote\">Cyber threats add intent to the safety equation, so risk assessments based on accidental faults must be revisited to account for attacks that can be timed and repeated.<\/p><h2>Security testing strengthens robot safety evidence<\/h2><p>Safety teams set limits for speed, protective distances, and permitted operating areas. The evidence behind those limits should also show what happens when the information used to enforce them is deliberately manipulated.<\/p><p>That evidence can also support assessments against applicable requirements. China’s <a href=\"https://vicone.com/blog/from-perception-to-action-what-gbt-45502-2025-signals-for-service-robot-security/?utm_source=ieee-spectrum&amp;utm_medium=sponsored-content&amp;utm_campaign=2026-10\" target=\"_blank\">GB/T 45502-2025<\/a> addresses information security for service robots. <a href=\"https://webstore.iec.ch/en/publication/69228\" target=\"_blank\">IEC TS 63074<\/a> examines security threats that could affect safety-related control systems. The <a href=\"https://vicone.com/blog/when-ai-moves-why-the-eu-machinery-regulation-matters-for-physical-ai-security/?utm_source=ieee-spectrum&amp;utm_medium=sponsored-content&amp;utm_campaign=2026-10\" target=\"_blank\">EU Machinery Regulation<\/a>, which applies from January 20, 2027, includes requirements to protect safety-relevant systems and data against corruption. Each has its own scope, and teams still need evidence for their robot’s design and operating conditions.<\/p><p class=\"shortcode-media shortcode-media-rebelmouse-image ieee-sidebar-large\"> <img alt=\"Diagram of AI robot security lifecycle from development to operation monitoring\" class=\"rm-shortcode\" id=\"f3777\" src=\"https://spectrum.ieee.org/media-library/diagram-of-ai-robot-security-lifecycle-from-development-to-operation-monitoring.jpg?id=68002095&amp;width=980\" /> <small class=\"image-media media-caption\">Figure 2. Cybersecurity strengthens robot safety evidence throughout the lifecycle. VicOne helps teams test safety limits against manipulation before deployment and monitor the conditions behind safe behavior in operation.<\/small><small class=\"image-media media-photo-credit\">VicOne<\/small><\/p><p><span>Before deployment, safety and security engineers can compare normal and adversarial scenarios against the same safety limits. During operation, they can monitor for changes to software, models, sensor signals, or behavior that may call earlier results into question. Any response to suspicious behaviors should follow policies approved by the safety team.<\/span><\/p><p>VicOne supports that work across the robot lifecycle. Through the <a href=\"https://robotichackingcommunity.com/?utm_source=ieee-spectrum&amp;utm_medium=sponsored-content&amp;utm_campaign=2026-10\" target=\"_blank\">Robotic Hacking Community<\/a>, VicOne LAB R7 works with researchers to investigate how cyber threats can change robot behavior. <a href=\"https://vicone.com/products/radeis/?utm_source=ieee-spectrum&amp;utm_medium=sponsored-content&amp;utm_campaign=2026-10\" target=\"_blank\">VicOne’s Radeis<\/a> helps teams validate potential effects before deployment, while <a href=\"https://vicone.com/products/rthena/?utm_source=ieee-spectrum&amp;utm_medium=sponsored-content&amp;utm_campaign=2026-10\" target=\"_blank\">Rthena<\/a> provides visibility into risks and behavior during operation.<\/p><h2>Five questions safety and security teams should answer together<\/h2><p>The central test is whether a robot’s safeguards still protect people when the information they rely on is manipulated. Safety and security teams can begin by tracing the inputs behind each protective decision, challenging them, and revisiting the evidence as the robot changes. They can start with these five questions:<\/p><p>1. <strong>What does each protective function read?<\/strong> Map the readings, estimates, messages, and confirmations. Identify which safeguards operate independently of the robot’s AI decisions.<\/p><p>2. <strong>How does that information arrive?<\/strong> Check how inputs are produced, transmitted, authenticated where appropriate, and handled when they are missing or implausible.<\/p><p>3. <strong>What happens if an input is manipulated?<\/strong> Test false distances, drifting position estimates, and other relevant scenarios against the robot’s safety limits.<\/p><p>4. <strong>Can one action mislead several inputs?<\/strong> Check whether sensor fusion or seemingly independent safeguards share a point of failure.<\/p><p>5. <strong>When should the evidence be revisited?<\/strong> Reassess after changes to software, models, sensors, or operating conditions. Agree on bounded responses to suspicious behavior with the safety team in advance.<\/p><p>The goal is not only to show that a protective function works. Teams also need evidence that it remains protective when the information behind its decision is wrong or deliberately manipulated — and that another safeguard can catch the resulting hazard when needed. As robots change, that evidence needs to change with them.<\/p><p>For a deeper look how cybersecurity can affect robot safety, download our white paper “<a href=\"https://info.vicone.com/why-robot-safety-depends-on-cybersecurity-vicone?utm_source=ieee-spectrum&amp;utm_medium=sponsored-content&amp;utm_campaign=2026-10\" target=\"_blank\">Why Robot Safety Depends on Cybersecurity: Protecting the Information That Safety Decisions Rely On<\/a>.”<\/p>"}, {"title": "Agility and GXO Logistics plan expanded deployment of Digit humanoid", "source": "Robotics Business Review", "date": "2026-10-26", "url": "https://www.therobotreport.com/agility-gxo-logistics-plan-expanded-deployment-digit-humanoid/", "summary": "<p>GXO Logistics, which has tested humanoid robots from multiple companies, will deploy Agility's Digit at two more sites.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/agility-gxo-logistics-plan-expanded-deployment-digit-humanoid/\">Agility and GXO Logistics plan expanded deployment of Digit humanoid<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Bedrock Robotics nears $1B in total funding as demand for autonomous heavy equipment surges", "source": "Robotics Business Review", "date": "2026-10-26", "url": "https://www.therobotreport.com/bedrock-robotics-nears-1b-in-total-funding-as-demand-for-autonomous-heavy-equipment-surges/", "summary": "<p>Bedrock Robotics has secured $600 million to scale autonomous heavy equipment and combat construction labor shortages.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/bedrock-robotics-nears-1b-in-total-funding-as-demand-for-autonomous-heavy-equipment-surges/\">Bedrock Robotics nears $1B in total funding as demand for autonomous heavy equipment surges<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "OMRON to acquire OnLogic to address edge AI applications", "source": "Robotics Business Review", "date": "2026-10-26", "url": "https://www.therobotreport.com/omron-acquires-onlogic-address-edge-ai-applications/", "summary": "<p>OMRON will add industrial computing from OnLogic to its industrial automation expertise to serve data- and AI-intensive applications.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/omron-acquires-onlogic-address-edge-ai-applications/\">OMRON to acquire OnLogic to address edge AI applications<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Teradyne Robotics partners with Sereact to scale physical AI in retail and logistics", "source": "Robotics Business Review", "date": "2026-10-25", "url": "https://www.therobotreport.com/teradyne-robotics-partners-sereact-scale-physical-ai-retail-logistics/", "summary": "<p>Sereact and Teradyne have already shipped hundreds of UR robots in dual-arm systems to live customer sites across Europe.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/teradyne-robotics-partners-sereact-scale-physical-ai-retail-logistics/\">Teradyne Robotics partners with Sereact to scale physical AI in retail and logistics<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Eka Robotics raises $150M to scale its vision-force-action model for robots", "source": "Robotics Business Review", "date": "2026-10-24", "url": "https://www.therobotreport.com/eka-robotics-raises-150m-scale-vision-force-action-model-robots/", "summary": "<p>Eka Robotics is building a vision-force-action, or VFA, model to develop an intuition of physics through reinforcement learning at scale.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/eka-robotics-raises-150m-scale-vision-force-action-model-robots/\">Eka Robotics raises $150M to scale its vision-force-action model for robots<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Video Friday: Quadruped Robot Solves Giant Rubik’s Cube by Itself", "source": "IEEE Spectrum Robotics", "date": "2026-10-23", "url": "https://spectrum.ieee.org/video-friday-rubiks-cube-robot", "summary": "<img src=\"https://spectrum.ieee.org/media-library/red-quadruped-robot-facing-a-large-rubik-s-cube-on-an-outdoor-tiled-surface.png?id=68512950&amp;width=1200&amp;height=800&amp;coordinates=150%2C0%2C150%2C0\" /><br /><br /><p><span>Video Friday is your weekly selection of awesome robotics videos, collected by your friends at <\/span><em>IEEE Spectrum<\/em><span> robotics. We also post a weekly calendar of upcoming robotics events for the next few months. Please <\/span><a href=\"mailto:automaton@ieee.org?subject=Robotics%20event%20suggestion%20for%20Video%20Friday\">send us your events<\/a><span> for inclusion.<\/span><\/p><h5><a href=\"https://www.corl.org/\">CoRL 2026<\/a>: 9–12 November 2026, AUSTIN<\/h5><h5><a href=\"https://2026.ieee-humanoids.org/\">Humanoids 2026<\/a>: 6–9 December 2026, SANTA CLARA, CA<\/h5><p>Enjoy today’s videos!<\/p><div class=\"horizontal-rule\"><\/div><div><span style=\"display: none;\"> <\/span><\/div><blockquote class=\"rm-anchors\" id=\"hfdrsfie68c\"><em>A quadruped robot autonomously solves a giant Rubik’s Cube using only its feet.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://leggedrobotics.github.io/rubik-skills/\">ETH Zurich Robotics Systems Lab<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"eg3pd8lgngo\"><em>Humans effortlessly react to the world; they adeptly return a tennis shot, catch a falling cup, step aside from a passing cart, or pass a box tossed during truck unloading. These everyday actions require anticipating a moving target and reflexively responding with the whole body within about a second. Such visual reactive whole-body control remains challenging for humanoids. We present Reflex, a three-stage framework that learns these capabilities stage by stage while connecting them through a compact representation of object dynamics.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://toberj.github.io/reflex/\">Reflex<\/a> ]<\/p><p>Thanks, Weikai!<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"joxrxmlyryo\">I have long advocated for exactly this in the context of <a href=\"https://spectrum.ieee.org/is-there-a-future-for-laundry-folding-robots\" target=\"_blank\">robotic laundry folding<\/a>, or more broadly, other robot recognition and manipulation tasks. Why not make it easy when we can make it easy?<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://programs.sigchi.org/uist/2026/program/content/262871\">ACM SIGCHI<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"zpann8yrli8\">We first wrote about <a href=\"https://spectrum.ieee.org/parallel-systems-autonomous-trains\" target=\"_blank\">Parallel Systems in 2022<\/a>. Nice to see them still rolling.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.moveparallel.com/\">Parallel Systems<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"hbfz2a0dj9s\">I’ll be honest with you: The end of this video is freaking me out a little bit for some reason.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><blockquote><em>This video showcases the whole-body loco-manipulation capabilities of KAIST Humanoid v0.9, developed at the DRCD Lab in collaboration with RAILAB, which developed the robot’s arms. Using onboard visual feedback, the humanoid demonstrates pushing objects weighing up to 35 kilograms and lifting objects up to 20 kg to arrange the letters “KAIST.”<\/em><\/blockquote><p>[ <a href=\"https://www.dynamicrobot.kaist.ac.kr/\">KAIST DRCD Lab<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"ch0divlg64w\">When you don’t spend any money on sensors for your robots, you can afford much bigger wheels.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://railab.kaist.ac.kr/\">RaiLab Kaist<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"uatutxaksa0\">Those robots with wires have gotten somewhat weirder.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://shin0805.github.io/twinx_multi_floating_link/\">JSK Robotics Laboratory<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"pcjjjsxfrba\"><em>The AthenaZero has two, three-fingered robot hands driven by tendons. This design allows the fingers to interdigitate to hold objects of different sizes, such as an egg or a hammer. Each finger is powered by a motor located in the robot’s torso to keep the hand light, transmitting force through flexible cables. This hand is both fast (closing in about 80 milliseconds) and strong.  With the addition of highly accurate barometric pressure sensors, it can also be gentle.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://rai-inst.com/\">Robotics and AI Institute<\/a> ] via [ <a href=\"https://www.science.org/doi/10.1126/scirobotics.aee1868\" target=\"_blank\">Science Robotics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"uwv-5cdqlgg\"><em>A biohybrid robot combines living tissue with engineered materials—here, lab-grown skeletal muscle paired with a soft, 3D-printed scaffold that turns the muscle’s contraction into movement. What if you designed the living muscle and the soft scaffold together, instead of growing the muscle and then building a skeleton around it? In this work from the Soft Robotics Lab at ETH Zurich, we adapted a soft-body simulation framework to co-optimize both at once—and the resulting centimeter-scale bioactuators achieve up to 11x more range of motion than previous systems of comparable tissue volume. Strong enough to jump, swim, walk, and grasp.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://ethz.ch/en/news-and-events/eth-news/news/2026/10/one-small-leap-for-a-muscle-one-giant-step-for-robotics.html\">ETH Zurich Soft Robotics Lab<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"y3zb4o47yqa\">Oh yes, this is definitely the use case that will scale humanoid robots.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.unitree.com/\">Unitree<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"dx8midegpbs\">Here are a couple more teasers from the upcoming ACM Symposium on User Interface Software and Technology (UIST).<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p class=\"shortcode-media shortcode-media-youtube\"> <span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p class=\"shortcode-media shortcode-media-youtube\"> <span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://programs.sigchi.org/uist/2026/program/all\">ACM Symposium on User Interface Software and Technology<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"ibh_mosnele\"><em>In three hours, on a single GPU, SuperMimic surpasses the return of a state-of-the-art motion tracker baseline trained for seven days on 128 GPUs. It reduces GPU-hours by more than 1,000× and fails on only 25 of 129,514 benchmark motions, versus 179 failures for the baseline. After 9.8 hours on two GPUs, SuperMimic achieves zero failures.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://supermimic.github.io/\">Hybrid Robotics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"abq0_jdzfpk\">This is getting out of hand! Now there are two of them!<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><blockquote><em>Introducing the Grain Weevil dual robot attachment. Two robots linked into one larger machine, run by a single operator, doing the work of up to three robots.<\/em><\/blockquote><p>[ <a href=\"https://grainweevil.com/?utm_source=youtube&amp;utm_medium=video&amp;utm_campaign=dual-robot-launch\">Grain Weevil<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"aundvj8lw00\"><em>Today [21 October 2026] <\/em><em>at CES Unveiled Milan, Generative Bionics announced its plan to build Europe’s largest Physical AI Data Factory, with AMD as its AI infrastructure partner.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://news.gbionics.ai/?article=data-factory&amp;lang=en\">Generative Bionics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"zezt6esg9we\"><em>From robotic rovers exploring the rugged lunar landscape to lunar terrain vehicles carrying Artemis astronauts across the surface, mobility will play a crucial role in establishing an enduring human presence on the moon. During the early phases of Moon Base development, these vehicles will help NASA investigate the lunar South Pole region, conduct scientific research, test new technologies, and gather the information that will inform future missions. In this Moon Base update, get a closer look at some of the lunar terrain vehicles and robotic rovers helping to pave the way for humanity’s first lunar outpost. <\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.nasa.gov/missions/moon-base/nasa-provides-progress-update-on-moon-base-rovers/\">NASA<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"ndftcft6xhu\">I appreciate the designer of this single motor drone crediting previous research, which included some cool <a href=\"https://spectrum.ieee.org/flying-robots-stay-stable-with-just-one-motor\" target=\"_blank\">drones from UPenn<\/a> that we wrote about in 2014.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.youtube.com/watch?v=Ndftcft6XhU\">Joshua Bird<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"rsg0vj5agmu\"><em>Why choose a bipedal, human-form robot over specialized wheels, gantry arms, or quadruped platforms? Speaking at the Humanoids Summit Seoul 2026, Michael Perry from Persona AI tackles the single most debated question in the industry and delivers the definitive business and engineering justification for the humanoid form factor.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://humanoidssummit.com/\">Humanoids Summit<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div>"}, {"title": "Webinar to discuss how the FCC robotics ruling affects automation buyers", "source": "Robotics Business Review", "date": "2026-10-23", "url": "https://www.therobotreport.com/webinar-discuss-how-fcc-robotics-ruling-affects-automation-buyers/", "summary": "<p>Industry leaders will discuss what robotics buyers should know about the recent FCC restriction on certain connected systems.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/webinar-discuss-how-fcc-robotics-ruling-affects-automation-buyers/\">Webinar to discuss how the FCC robotics ruling affects automation buyers<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Generative Bionics to launch Physical AI Data Factory in Italy", "source": "Robotics Business Review", "date": "2026-10-23", "url": "https://www.therobotreport.com/generative-bionics-to-launch-physical-ai-data-factory-in-italy/", "summary": "<p>Generative Bionics says it hopes to advance European robotics sovereignty by ensuring that humanoid data is are generated on the continent. <\/p>\n<p>The post <a href=\"https://www.therobotreport.com/generative-bionics-to-launch-physical-ai-data-factory-in-italy/\">Generative Bionics to launch Physical AI Data Factory in Italy<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Dream Labs raises $90M and launches Dream API", "source": "Robotics Business Review", "date": "2026-10-22", "url": "https://www.therobotreport.com/dream-labs-raises-90m-and-launches-dream-api/", "summary": "<p>Dream Labs says its Dream-1 AI model works across robots from different manufacturers and will allow robots to transfer their learning.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/dream-labs-raises-90m-and-launches-dream-api/\">Dream Labs raises $90M and launches Dream API<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "AGCO to deploy Agility Digit humanoid in Kansas factory", "source": "Robotics Business Review", "date": "2026-10-21", "url": "https://www.therobotreport.com/agco-to-deploy-agility-digit-humanoid-in-kansas-factory/", "summary": "<p>The Agility pilot, which is expected to begin in 2027, will begin at an AGCO production facility for agricultural equipment.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/agco-to-deploy-agility-digit-humanoid-in-kansas-factory/\">AGCO to deploy Agility Digit humanoid in Kansas factory<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "A guide to Day 2 of RoboBusiness 2026", "source": "Robotics Business Review", "date": "2026-10-21", "url": "https://www.therobotreport.com/a-guide-to-day-2-of-robobusiness-2026/", "summary": "<p>Day 2 of RoboBusiness 2026, the 20th anniversary of the event, will include interesting keynotes around humanoids and social robots.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/a-guide-to-day-2-of-robobusiness-2026/\">A guide to Day 2 of RoboBusiness 2026<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Avenda Health expands Unfold AI platform to support intraoperative prostate cancer care", "source": "Robotics Business Review", "date": "2026-10-20", "url": "https://www.therobotreport.com/avenda-health-expands-unfold-ai-platform-support-intraoperative-prostate-cancer-care/", "summary": "<p>Surgery Mode in Unfold AI brings patient-specific 3D maps to give an enhanced view of cancer anatomy during robotic prostate procedures.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/avenda-health-expands-unfold-ai-platform-support-intraoperative-prostate-cancer-care/\">Avenda Health expands Unfold AI platform to support intraoperative prostate cancer care<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "A guide to Day 1 of RoboBusiness 2026", "source": "Robotics Business Review", "date": "2026-10-20", "url": "https://www.therobotreport.com/a-guide-to-day-1-of-robobusiness-2026/", "summary": "<p>We've compiled a schedule for everything happening on the first day of RoboBusiness 2026 in Santa Clara, Calif.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/a-guide-to-day-1-of-robobusiness-2026/\">A guide to Day 1 of RoboBusiness 2026<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Gecko Robotics secures $300M contract with the U.S. Navy", "source": "Robotics Business Review", "date": "2026-10-20", "url": "https://www.therobotreport.com/gecko-robotics-earns-300m-contract-with-the-u-s-navy/", "summary": "<p>Gecko claimed this signals the Pentagon’s confidence that it is a core military capability that is delivering results.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/gecko-robotics-earns-300m-contract-with-the-u-s-navy/\">Gecko Robotics secures $300M contract with the U.S. Navy<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "RoboBusiness rebrands as Robotics Summit & Expo West", "source": "Robotics Business Review", "date": "2026-10-20", "url": "https://www.therobotreport.com/robobusiness-rebrands-as-robotics-summit-expo-west/", "summary": "<p>Robotics Summit &#038; Expo West sharpens focus on deploying robotics and AI in the real world, complementing the East Coast flagship event.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/robobusiness-rebrands-as-robotics-summit-expo-west/\">RoboBusiness rebrands as Robotics Summit &#038; Expo West<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "2027 TRR50 Robotics Innovation Awards open nominations", "source": "Robotics Business Review", "date": "2026-10-20", "url": "https://www.therobotreport.com/2027-trr50-robotics-innovation-awards-open-nominations/", "summary": "<p>The TRR50 winners will be celebrated at an awards gala during the Robotics Summit &#038; Expo, which will be held on June 2-3, 2027 in Boston.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/2027-trr50-robotics-innovation-awards-open-nominations/\">2027 TRR50 Robotics Innovation Awards open nominations<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Reservoir launches new agricultural robotics incubator for Washington growers", "source": "Robotics Business Review", "date": "2026-10-20", "url": "https://www.therobotreport.com/reservoir-launches-new-agricultural-robotics-incubator-for-washington-growers/", "summary": "<p>Reservoir hopes to put agricultural robotics startups to work in the orchards, vineyards and berry fields alongside researchers and growers.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/reservoir-launches-new-agricultural-robotics-incubator-for-washington-growers/\">Reservoir launches new agricultural robotics incubator for Washington growers<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "The Robot I Didn’t Expect to Build", "source": "IEEE Spectrum Robotics", "date": "2026-10-19", "url": "https://spectrum.ieee.org/agility-robotics-digit-5-redesign", "summary": "<img src=\"https://spectrum.ieee.org/media-library/author-jonathan-hurst-a-tall-slim-white-man-wearing-a-black-long-sleeve-shirt-and-dark-jeans-stands-next-to-his-digit-5-humano.jpg?id=68441166&amp;width=1200&amp;height=800&amp;coordinates=0%2C1230%2C0%2C1230\" /><br /><br /><p><strong><a href=\"https://www.agilityrobotics.com/\" rel=\"noopener noreferrer\" target=\"_blank\"><span>Agility Robotics<\/span><\/a>, the <\/strong>company I cofounded out of <a href=\"https://mime.engineering.oregonstate.edu/research/drl/\" target=\"_blank\">my robotics lab at Oregon State University<\/a> in 2015, has just launched <a href=\"https://spectrum.ieee.org/humanoid-robot-safety\" target=\"_self\">Digit 5<\/a>. It’s designed to be the first humanoid robot that can safely and economically do useful work at scale, allowing us to bring tens of thousands of humanoid workers into the real world. Engineered to lift 23-kilogram bins onto high shelves and with a battery that can run for 90 minutes on a 9-minute charge, Digit 5’s goal is to handle heavy warehouse tasks shift after shift, filling the need for labor in jobs that are too physically stressful or too dull for humans to want to do.<\/p><div class=\"rm-embed embed-media\"><\/div><p><span>Digit 5 is what Agility has been working toward for over a decade. But the robot is heavy and bulky, lacking the graceful natural motion of its predecessors, and it’s farther than I thought possible from the robot I dreamed of building when I started this company. To deliver a useful commercial product, Agility has taken a path that is very different from what I first imagined.<\/span><\/p><h2>From ATRIAS to Digit<\/h2><p>My dream has always been to build robots that combine locomotion and manipulation to move through the world and interact with it as people do. I seek a mastery of motion, achieved through devices designed to navigate the constraints of physics with elegance. When I started the <a href=\"https://mime.engineering.oregonstate.edu/research/drl/\" target=\"_blank\">Dynamic Robotics Laboratory<\/a> at Oregon State in 2008, we began with a theory derived from decades of work in biomechanics: that a simple “spring-mass” model (a body supported by legs that act like springs) should be able to reproduce every known walking and running gait found in animals.<\/p><p>We put theory into practice by building the bipedal robot <a href=\"https://spectrum.ieee.org/atrias-robot-dodgeball-barrage\" target=\"_self\">ATRIAS<\/a>—short for “Assume The Robot Is A Sphere,” a <a href=\"https://en.wikipedia.org/wiki/Spherical_cow\" target=\"_blank\">joke among physicists<\/a> about reducing a complex system to its simplest possible form. ATRIAS looked like a large microwave on stilts because it was only intended to demonstrate the physics of human walking and running. This was the first glimmer of achieving my dream; even though ATRIAS wasn’t designed to look like us, it still seemed natural, and even somehow alive, when it settled into a walking gait.<\/p><p>With the success of ATRIAS, the barriers to progress shifted from scientific to engineering and organizational, and a startup company seemed like the way to bridge the gap from a one-off research concept to an actual robotic product. I felt confident of two things: that I would be able to build robots that could go where people go, and that this capability would be incredibly useful. This combination of ambition and naivete is necessary for anyone to found a new company—how hard could it be?<\/p><p class=\"shortcode-media shortcode-media-youtube\"> <span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>Good advice for starting a company is to understand a customer problem, and then find a way to solve it using your unique capabilities. My cofounders, <a href=\"https://www.linkedin.com/in/damion-shelton/\" target=\"_blank\">Damion Shelton<\/a> and <a href=\"https://www.linkedin.com/in/mikhail-jones-5674a22b/\" rel=\"noopener noreferrer\" target=\"_blank\">Mikhail Jones<\/a>, and I did not do this. We relied on our belief that this technology would enable new possibilities and trusted ourselves to figure out the business as we went. So we simply focused on building our first product: the bipedal robot <a href=\"https://robotsguide.com/robots/cassie\" rel=\"noopener noreferrer\" target=\"_blank\">Cassie<\/a>.<\/p><p>Cassie was the first dynamic bipedal robot that researchers could buy, able to maintain its balance through active, fluid motion rather than careful, rigid steps. It had ostrichlike legs, not because we were imitating ground-running birds, but as a result of engineering strictly for performance. It was not intended to be commercially useful, and had no torso, arms, or head. We sold Cassie robots to Harvard, Caltech, the University of Michigan, the University of California, Berkeley, and a handful of other research institutions, ultimately saturating the market for US $250,000 bipedal research robots after having sold a total of 10 of them.<\/p><p class=\"shortcode-media shortcode-media-rebelmouse-image\"> <img alt=\"Three bipedal robots lined up in a warehouse, showing their evolving designs.\" class=\"rm-shortcode\" id=\"f749f\" src=\"https://spectrum.ieee.org/media-library/three-bipedal-robots-lined-up-in-a-warehouse-showing-their-evolving-designs.jpg?id=68441028&amp;width=980\" /><small class=\"image-media media-caption\">ATRIAS, Cassie, and Digit 4 EVT [left to right] are on display at Agility Robotics’ RoboFab in Salem, Ore. The 70,000-square-foot facility has the capacity to produce more than 10,000 Digit 5 robots per year.<\/small><small class=\"image-media media-photo-credit\">Agility Robotics<\/small><\/p><p>Because Cassie’s hardware enabled research into the physics of walking and running, the legged-robot research frontier shifted to control software. Traditionally, engineers controlled legged robots with detailed mathematical models that determined how the machines should move. With Cassie, researchers pioneered the new approach of reinforcement learning for bipedal legged locomotion: A simulated robot learns through trial and error, and the resulting neural network controls the physical machine. This approach is what enables virtually all of the dynamic behaviors that you see on legged robots today, and Cassie looked alive as it recovered from stumbles while climbing stairs, ran 5 kilometers across the Oregon State campus, and <a href=\"https://news.oregonstate.edu/news/bipedal-robot-developed-oregon-state-achieves-guinness-world-record-100-meters\" target=\"_blank\">broke the robot world record<\/a> for a 100-meter dash.<\/p><p>Cassie got us closer to being able to move through the world with confidence and grace, but to make it useful, we needed manipulation. After exhaustively exploring different configurations, we found that an upright torso helped the robot balance, while two arms mounted near the top of the torso allowed it to pick up large objects and to catch itself when it fell. <a href=\"https://robotsguide.com/robots/digit\" target=\"_blank\">Digit 1<\/a>, which added a torso and arms to the Cassie legs, was our first mobile manipulation robot, and another step on the path toward a product that could do useful work for commercial customers.<\/p><h2>Why Digit Began With Warehouse Bins<\/h2><p>As we explored the first applications for Digit, potential customers kept asking us: Why legs? And why a humanoid? These were tough questions for me to answer, because they exposed a core business reality: It didn’t matter to Agility Robotics if we solved a
