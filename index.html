 social intelligence<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "How integrated actuators improve humanoid robot joint performance and system integration", "source": "Robotics Business Review", "date": "2026-07-28", "url": "https://www.therobotreport.com/how-integrated-actuators-improve-humanoid-robot-joint-performance-and-system-integration/", "summary": "<p>Humanoid robots have become an important area of research in robotics, attracting attention from universities, research institutions, and technology companies.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/how-integrated-actuators-improve-humanoid-robot-joint-performance-and-system-integration/\">How integrated actuators improve humanoid robot joint performance and system integration<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Robot Finger Feels in Color", "source": "IEEE Spectrum Robotics", "date": "2026-07-28", "url": "https://spectrum.ieee.org/robot-finger", "summary": "<img src=\"https://spectrum.ieee.org/media-library/close-up-of-a-sensor-for-a-robotic-fingertip-and-raised-relief-images-of-a-leaf-and-a-u-s-penny.jpg?id=67542077&amp;width=1245&amp;height=700&amp;coordinates=0%2C187%2C0%2C188\" /><br /><br /><p><span>Imagine running your fingertip over the surface of a U.S. penny. You would feel the ridges of the raised letters and numbers, Abe Lincoln’s bearded side profile, and, if it’s tails, the fluted columns of the Lincoln Memorial. Getting a robot to sense the same things is an imposing task, often requiring gathering data on pressure and force at many spatial locations at once. But that’s just what a team of scientists in Europe has now managed to do, using an unusual, colorful robotic skin that provides high-resolution sensing in real time.<\/span><\/p><p>“To be honest, when they showed us this, we thought it was, and pardon my French, [expletive] cool, because it’s a distinctly different approach,” recalled Rich Walker, director of <a href=\"https://shadowrobot.com/\" target=\"_blank\">Shadow Robot<\/a>, the U.K.’s longest-running robot company, which primarily focuses on <a href=\"https://spectrum.ieee.org/video-friday-shadow-robot-hand\" target=\"_blank\">robotic hands<\/a>.<\/p><p class=\"ieee-inbody-related\">RELATED: <a href=\"https://spectrum.ieee.org/shadow-walker-biped-humanoid-robot\" target=\"_self\">“This DIY Bipedal Robot Used Pneumatic “Air-Muscles” Instead of Motors”<\/a><\/p><p>The research team, which hails from Queen Mary University of London, the University of Florence, the University of Trieste, and the University of Trento, designed a robotic fingertip with a synthetic skin that reflects different colors of light in response to mechanical deformation. By reading the light reflected off the skin, the fingertip generates maps of topology, strain, and contact pressure. The team has already used the sensor to generate maps of a human fingertip, a penny, and a leaf.<\/p><p><a href=\"https://www.seresearch.qmul.ac.uk/cit/people/gsasso/\" target=\"_blank\">Giacomo Sasso<\/a>, a postdoctoral research associate in the lab of <a href=\"https://www.sems.qmul.ac.uk/staff/f.carpi/\" target=\"_blank\">Federico Carpi<\/a> at Queen Mary University of London, came up with the idea for the sensor. He had been researching optics when he stumbled upon an interesting <a href=\"https://www.nature.com/articles/s41563-022-01318-x\" target=\"_blank\">paper published in the journal <em><em>Nature<\/em><\/em><\/a>. It described the “mechanochromic material” that would eventually make up the reflector in the skin.<\/p><p>Following the method described in <em><em>Nature<\/em><\/em>, Sasso exposed a light-sensitive film to a 5-megawatt, 635-nanometer (red) laser for seven minutes. The laser beam creates an interference pattern which causes the film to polymerize in alternating densities, creating layers with different refractive indices.<\/p><p>This structure is called a <a href=\"https://spectrum.ieee.org/a-simple-filter-makes-blueemitting-oleds-give-off-white-light\" target=\"_blank\">Bragg reflector<\/a>. The alternating densities and refractive indices in the polymer cause specific wavelengths of light to be reflected. When the reflector is deformed by contact with an object, its layers are stretched, becoming thinner and reflecting light of a different wavelength. <\/p><p>It took Sasso less than a week to re-create the material in the lab. “From there, we started seeing how we could translate these color patterns into something that was useful for us,” he says. Soon, they realized that the color produced by the material was all they needed to be able to sense the topology of objects.<\/p><p>In the robotic finger, the Bragg reflector is sandwiched between a layer of silicone, which protects it from the outside, and a transparent, fingertip-shaped silicone finger with a camera and LED light embedded inside of it. <\/p><p>The light from the LED shines through the clear polymer of the finger. When the fingertip is deformed by an object, the reflector bounces light back to the camera, with wavelengths depending on the level of deformation—red for least deformation, shifting to green, and then to blue when most deformed.<\/p><p>The team also made adjustments to increase the sensitivity of the skin and help the camera to better read color differences. The silicone of the outer layer of the fingertip is colored black to increase the color contrast, allowing the camera to better translate color into the morphology. The rigidity of the camera inside the finger also enhances the deformation of the reflector, producing greater differences in reflected wavelengths.<\/p><p>After all that optimization, the finger provided 100-micrometer resolution with no <a href=\"https://spectrum.ieee.org/robot-fingers\" target=\"_blank\">computational<\/a> latency, the researchers determined.<\/p><h2>What robot fingers need<\/h2><p>Human skin takes in a variety of tactile information in order to successfully move and manipulate objects, including temperature, texture, pressure, and vibration. But engineering a robot to do the same is challenging because of spatial constraints. There often isn’t enough room in a robotic fingertip to incorporate more than one type of sensor. The question then becomes: Which type of sensor should be used?<\/p><p>“And the answer to that is…that’s a really hard question. No one knows yet,” says Walker. Carpi’s team’s robotic finger is exciting because it presents yet another option for roboticists to experiment with, Walker says.<\/p><p>Although Carpi’s team <a href=\"https://www.gelsight.com/\" target=\"_blank\">isn’t the first<\/a> to use soft materials for tactile sensing, its technology is unique because it is able to extract quantitative information about depth and size from the topologic maps it generates. According to Walker, most sensors can only generate topological maps, which reveal the relative sizes of object features.<\/p><p>To Sasso, another key advantage of this robotic finger is that it embeds tactile sensing directly into the material of the finger, rather than using taxels, or pixels that measure force or pressure at specific spatial points. <\/p><p class=\"ieee-inbody-related\">RELATED: <a href=\"https://spectrum.ieee.org/robot-fingers\" target=\"_blank\">Robot Hand Manipulates Complex Objects by Touch Alone<\/a><\/p><p>“The core aspect of the sensor is that we’re essentially [moving toward] having the sensing element at the material level,” he says. “The camera, which is a very highly optimized electronic component, is translating whatever the material is already doing directly into digital signals.” <\/p><p><a href=\"https://www.linkedin.com/in/michael-yu-wang-258a4525/\" target=\"_blank\">Michael Wang<\/a>, co-founder and chief scientist at <a href=\"https://spectrum.ieee.org/daimon-robotics-physical-ai\" target=\"_blank\">Daimon Robotics<\/a>, which, unlike Shadow Robot, primarily uses vision-based sensing, echoed Walker’s sentiment that it’s beneficial to explore new methods of sensing, which may bring unique advantages. But he also explained that soft materials often face challenges with durability, and that the significance of the team’s work would be revealed when the finger is integrated into real<a href=\"https://spectrum.ieee.org/robot-fingers\" target=\"_blank\"> robot hands<\/a>.<\/p><p>“The practical and useful benefits, especially in the context of robot hands, remain to be tested and validated,” he says.<\/p><p>When the materials of soft sensors, like the silicone in Carpi’s team’s fingertip, become eroded or damaged after repeated use, the signals measured by the sensors may not reflect objects’ topography as well. <\/p><p>“Especially if you have the electronics embedded into the material layer itself, that becomes a very challenging engineering problem. And I haven’t seen [many] good soft electronics materials that really can undergo long periods of usage,” Wang says.<\/p><p><span>However, because the Bragg reflector isn’t in direct contact with objects itself, the outer layer of silicone material acts as a protective barrier, Sasso says. The silicone can also be made more durable using certain chemical coatings, according to Wang.<\/span><\/p><p>The team has already been talking to companies that could potentially employ the new sensor. They also hope to improve the sensor so that it can sense objects that don’t lie flat on surfaces. That could open up its use in surgical instruments that require precise contact mapping of tissues and organs, Carpi says.<\/p><p>“There are significant developments that we expect with a clear path toward transition to real world applications,” he says.<\/p>"}, {"title": "Agency Tool Company wants to make OTA software updates easier", "source": "The Robot Report", "date": "2026-07-28", "url": "https://www.therobotreport.com/agency-tool-company-wants-to-make-ota-software-updates-easier/", "summary": "<p>Two Scythe co-founders are using their experience building commercial robots to create tools for robotics developers at Agency Tool Co.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/agency-tool-company-wants-to-make-ota-software-updates-easier/\">Agency Tool Company wants to make OTA software updates easier<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Powerful Compute So Compact, It’s Clutch — Build AI Anywhere With NVIDIA Jetson", "source": "NVIDIA Robotics", "date": "2026-07-28", "url": "https://blogs.nvidia.com/blog/build-ai-with-nvidia-jetson/", "summary": "As a discerning AI investor who values style and substance, Sarah Guo knows this season’s standout accessory isn’t the latest designer purse — but what’s inside it.  In a recent video, Guo, founder of AI-native venture capital firm Conviction and co-host of the AI podcast No Priors, highlighted how the NVIDIA Jetson platform for edge [&#8230;]"}, {"title": "Registration is open for RoboBusiness 2026", "source": "Robotics Business Review", "date": "2026-07-28", "url": "https://www.therobotreport.com/registration-is-open-for-robobusiness-2026/", "summary": "<p>This year, join us in October in Santa Clara to celebrate 20 years of robotics excellence at RoboBusiness 2026.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/registration-is-open-for-robobusiness-2026/\">Registration is open for RoboBusiness 2026<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "ENvue Medical develops robotic feeding tube placement system", "source": "Robotics Business Review", "date": "2026-07-28", "url": "https://www.therobotreport.com/envue-medical-develops-robotic-feeding-tube-placement-system/", "summary": "<p>ENvue Drive is designed to assist, not replace, the clinician, who retains full control of the procedure at all times.  <\/p>\n<p>The post <a href=\"https://www.therobotreport.com/envue-medical-develops-robotic-feeding-tube-placement-system/\">ENvue Medical develops robotic feeding tube placement system<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "NORD expands compact NORDAC VFD family to 200 hp", "source": "Robotics Business Review", "date": "2026-07-27", "url": "https://www.therobotreport.com/nord-expands-nordac-compact-vfd-family-to-200-hp/", "summary": "<p>NORD Drivesystems said its NORDAC PRO VFDs are adaptable to individual application requirements across industries.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/nord-expands-nordac-compact-vfd-family-to-200-hp/\">NORD expands compact NORDAC VFD family to 200 hp<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Kraken Technology raises Series B funding for autonomous vessels", "source": "Robotics Business Review", "date": "2026-07-27", "url": "https://www.therobotreport.com/kraken-technology-raises-series-b-funding-autonomous-vessels/", "summary": "<p>Kraken Technology plans to use its funding to continue developing uncrewed surface vessels and localizing manufacturing around the world.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/kraken-technology-raises-series-b-funding-autonomous-vessels/\">Kraken Technology raises Series B funding for autonomous vessels<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Magmotor makes motors for a changing world for 150+ years", "source": "Robotics Business Review", "date": "2026-07-26", "url": "https://www.therobotreport.com/magmotor-makes-motors-changing-world-150-years/", "summary": "<p>Magmotor has been providing motors for demanding use cases for decades and offers custom systems for robotics.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/magmotor-makes-motors-changing-world-150-years/\">Magmotor makes motors for a changing world for 150+ years<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Optical Tech Would Update a Robot’s AI on the Fly", "source": "IEEE Spectrum Robotics", "date": "2026-07-26", "url": "https://spectrum.ieee.org/ai-in-robotics", "summary": "<img src=\"https://spectrum.ieee.org/media-library/an-asian-man-positions-the-lens-of-an-optical-receiver-a-meter-away-from-a-beam-of-led-light-in-a-lab.jpg?id=67530602&amp;width=1245&amp;height=700&amp;coordinates=0%2C469%2C0%2C470\" /><br /><br /><p>Atop a lab bench, <a href=\"https://tech.cornell.edu/\" rel=\"noopener noreferrer\" target=\"_blank\">Cornell Tech<\/a> postdoctoral researcher <a href=\"https://www.linkedin.com/in/yifan-he-5471a1386/\" rel=\"noopener noreferrer\" target=\"_blank\">Yifan He<\/a> positions the lens of an optical receiver almost a meter away from an LED emitting a beam of red light. The computer monitor attached to the receiver takes a beat to refresh, then displays an array of squares that resemble a QR code.<\/p><p>When you hold your phone camera up to a QR code, light strikes the image sensor as only a first step to revealing the data hidden behind the black-and-white matrix. The receiver here is doing something different: directly altering its own memory using the photocurrents produced by the beamed array of light. And unlike the data behind a QR code, which might point to a simple web address, this optical code could convey the <a href=\"https://spectrum.ieee.org/sparse-ai\" target=\"_blank\">parameters of an AI model<\/a>. <\/p><p>The new receiver design, presented last month at the <a href=\"https://www.vlsisymposium.org/\" rel=\"noopener noreferrer\" target=\"_blank\">IEEE/JSAP Symposium on VLSI Technology & Circuits<\/a> in Honolulu, seeks to reduce the burden of increasing memory demands on AI systems. Shining data down onto processors could lower the energy typically required for data centers, self-driving cars, and even “edge” applications like AI-powered robots, researchers say. <\/p><p>“People are designing all sorts of different AI chips,” says <a href=\"https://www.linkedin.com/in/jae-sun-seo-21062717/\" rel=\"noopener noreferrer\" target=\"_blank\">Jae-sun Seo<\/a>, an associate professor of electrical and computer engineering at Cornell Tech, in New York City. These processors don’t often have room for all the parameters that make up AI models, so the additional data is stored in dynamic RAM (<a href=\"https://spectrum.ieee.org/stacking-chips-sideways\" target=\"_blank\">DRAM<\/a>). The electrical connections commonly used to move the data between the DRAM and the processor create cost and efficiency concerns when systems scale up. “That’s one of the major bottlenecks.” <\/p><p>Optical links move data at high bandwidth with less energy loss than metal wires, but today’s optical receivers undercut that advantage by relying on power-hungry analog circuits to convert light to electronic bits. The group’s new tech would instead receive rapid flashes of digital QR-code-like matrices so that chips can tweak model parameters without those analog circuits, enabling fully digital optical communication that would consume less energy.<\/p><p>“This is a really important problem,” says <a href=\"https://www.linkedin.com/in/dennis-sylvester-68a938/\" rel=\"noopener noreferrer\" target=\"_blank\">Dennis Sylvester<\/a>, an IEEE Fellow who chairs the <a href=\"https://umich.edu/\" rel=\"noopener noreferrer\" target=\"_blank\">University of Michigan<\/a>’s electrical and computer engineering department and was not involved in the work. “It’s got massive commercial implications. This solution is a clever way of dealing with it.”<\/p><p class=\"shortcode-media shortcode-media-rebelmouse-image\"> <img alt=\"Two Asian men standing in front of a lab desk with a receiver chip, oscilloscope and laptop displaying an optically programmable SRAM-based receiver demo.\" class=\"rm-shortcode\" id=\"b2c1d\" src=\"https://spectrum.ieee.org/media-library/two-asian-men-standing-in-front-of-a-lab-desk-with-a-receiver-chip-oscilloscope-and-laptop-displaying-an-optically-programmable.jpg?id=67530613&amp;width=980\" /> <small class=\"image-media media-caption\">Jae-sun Seo [left] and Yifan He have developed a receiver that can edit memory in response to QR-code-like arrays of light.<\/small><small class=\"image-media media-photo-credit\">Alex Music<\/small><\/p><h2>How Light “Flips” Memory to Power AI<\/h2><p>Processors have a bit of built-in static RAM (<a href=\"https://spectrum.ieee.org/sram-intel-tsmc\" target=\"_blank\">SRAM<\/a>), but not enough to allow an AI model to run independently. While SRAM is the faster of the two memory options, DRAM can store more data in the same footprint.<\/p><p>In the new system, the DRAM sits with the transmitter, and the receiver is part of the processor’s SRAM. The transmitter beams the data to the array of SRAM cells, which in this case are modified to contain photodiodes. Light hitting each photodiode creates a current to flip binary values in the SRAM. <\/p><p>Creating a link between the light and receiver requires calibration, because you can’t expect them to be perfectly aligned or perpendicular to each other. So the chip references a data frame that has information about the expected position of each pixel of data and uses that frame to ensure it can receive the real data, He says. “Ideally the best way is to have direct, point-to-point space between the transmitter and the receiver,” Seo adds, “but even if it’s slightly tilted, we have this calibration circuit.”<\/p><p>For applications in real-world settings, the researchers say they will need to build an optical transmitter that can alter the light matrix millions of times per second, transferring gigabits per second. The transmitter that I saw in He and Seo’s lab is only a proof of concept, emitting a static 14-by-14-bit matrix through a metal mask over the light. The researchers say they are working with optics research groups to build a transmitter that is capable of rapidly changing the matrix. <\/p><h2>The Future of Light-Based Memory Links<\/h2><p>Michigan’s Sylvester says that the tech in its current form is likely far from commercialization because the individual photosensitive bit cells are larger than SRAM bit cells in conventional chips. Those larger cells mean the chip can fit less memory, a trade-off that he says could cancel out the added efficiency of the light-based approach. <\/p><p>Seo says that it’s part of the group’s ongoing efforts to shrink the bit cells, which can be achieved by optimizing the size of transistors and circuits and leveraging CMOS scaling.<\/p><p>Seo and He are looking at uses for the tech in robotics and other edge applications. One example is in AI-robot-powered warehouses and factories, which could use optical data transmission to save time and energy when updating the AI models in each robot. Additionally, <a href=\"https://spectrum.ieee.org/microbots\" target=\"_self\">microrobots<\/a>, which are inherently memory-constrained due to their size, could one day benefit from the tech, though it would require a more size-conscious design.<\/p><p>“Edge AI is a big growth area, and in three, four, five years, you’re going to hear as much about that as you are with data centers, probably, as the intelligence migrates more and more into these devices that we have,” Sylvester says.<\/p>"}, {"title": "Photos: First look at J&J’s Ottava surgical robot", "source": "Robotics Business Review", "date": "2026-07-25", "url": "https://www.therobotreport.com/photos-first-look-at-jjs-ottava-surgical-robot/", "summary": "<p>The robot-in-table design is meant to save space in the operating room, with J&#038;J saying its novel architecture takes up 30-50% less space than boom-and-cart systems.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/photos-first-look-at-jjs-ottava-surgical-robot/\">Photos: First look at J&#038;J&#8217;s Ottava surgical robot<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "NEURA Robotics establishes NEURA Gym RWTH Aachen to train physical AI", "source": "Robotics Business Review", "date": "2026-07-24", "url": "https://www.therobotreport.com/neura-robotics-establishes-neura-gym-rwth-aachen-train-physical-ai/", "summary": "<p>NEURA Robotics has partnered with a German university for NEURA Gym RWTH Aachen, one of 10 facilities for training physical AI.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/neura-robotics-establishes-neura-gym-rwth-aachen-train-physical-ai/\">NEURA Robotics establishes NEURA Gym RWTH Aachen to train physical AI<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Video Friday: An Italian Humanoid Comes to Life", "source": "IEEE Spectrum Robotics", "date": "2026-07-24", "url": "https://spectrum.ieee.org/video-friday-physical-ai-robotics", "summary": "<img src=\"https://spectrum.ieee.org/media-library/humanoid-robot-with-red-armor-and-glowing-lights-stands-against-a-dark-background.png?id=67531350&amp;width=1245&amp;height=700&amp;coordinates=0%2C0%2C0%2C0\" /><br /><br /><p><span>Video Friday is your weekly selection of awesome robotics videos, collected by your friends at <\/span><em>IEEE Spectrum<\/em><span> robotics. We also post a weekly calendar of upcoming robotics events for the next few months. Please <\/span><a href=\"mailto:automaton@ieee.org?subject=Robotics%20event%20suggestion%20for%20Video%20Friday\">send us your events<\/a><span> for inclusion.<\/span><\/p><h5><a href=\"https://mrs.fel.cvut.cz/summer-school-2026/\">Summer School on Multi-Robot Systems<\/a>: 29 July–4 August 2026, PRAGUE<\/h5><h5><a href=\"https://actuate.foxglove.dev/\">Actuate 2026<\/a>: 18–19 August 2026, SAN FRANCISCO<\/h5><h5><a href=\"https://2026.ieee-iros.org/\">IROS 2026<\/a>: 27 September–1 October 2026, PITTSBURGH<\/h5><h5><a href=\"https://humanoidssummit.com/\">Humanoids Summit Seoul<\/a>: 22–23 September 2026, SEOUL<\/h5><p>Enjoy today’s videos!<\/p><div class=\"horizontal-rule\"><\/div><div><span style=\"display: none;\"> <\/span><\/div><blockquote class=\"rm-anchors\" id=\"mgf142yepjc\"><em>In just six months, our team turned GENE.01 into a fully functional humanoid platform that can walk, sense and interact. Its full-body multimodal skin perceives touch, proximity, force, and temperature, bringing Physical AI closer to safe and natural collaboration with people. Not a render. Not a concept. This is GENE.01. The future of Physical AI is taking its first steps.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://gbionics.ai/\">Generative Bionics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"iq3pccrfegq\"><em>Why create robot intelligence for just one hand, when we could have it learn from many? GEN-1, our latest embodied foundation model, now supports a broad range of end effectors from 5-finger hands, to specialized tools, and everything in between. Each hand is a different sensorimotor interface by which GEN-1 experiences the physical world. Scaling pretraining across thousands of these interfaces teaches GEN-1 a universal physical common sense that transfers to new hands and new ways to grasp, push, pull, twist, and more.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>And to illustrate this concept, a surprise spatula.<\/p><p class=\"shortcode-media shortcode-media-youtube\"> <span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://generalistai.com/blog/towards-machines-with-a-thousand-hands\">Generalist<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"gu2nuedjiuq\"><em>This paper presents the design, fabrication, and flight validation of a flat-packable <a href=\"https://spectrum.ieee.org/foldable-airplane-could-ride-a-cubesat-to-mars-in-2022\" target=\"_blank\">flying wing<\/a> built primarily from corrugated cardboard. The aircraft is manufactured from three laser-cut sheets and assembled through a fold-and-lock architecture that forms load-bearing wing structures with minimal tooling and no permanent fasteners. The full airframe can be assembled in under 15 minutes, demonstrating strong potential for rapid deployment, low-cost logistics, and scalable field use.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://airlab.sutd.edu.sg/\">AIR Lab<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"hukrzo75_ww\">A $14,000 open-source data-collection system that includes beat-down capability.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://github.com/haraduka/mevion\">MEVION<\/a> ]<\/p><p>Thanks, Kento!<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"qzr0rmp2_5w\"><em>Together with Niantic Spatial and Nvidia, [we] can now scan a real deployment site with off-the-shelf hardware, reconstruct it into a photorealistic Gaussian splat, and run massively parallel RL [<a href=\"https://spectrum.ieee.org/ai-institute\" target=\"_blank\">reinforcement learning<\/a>] training. The policies trained in our Gym environment then transfer zero-shot to the real robot and environments they were trained for. This enables faster deployment of more capable and robust policies for the end user.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://flexion.ai/news/niantic-spatial-flexion-and-nvidia-closing-the-sim2real-gap-for-humanoids\">Flexion<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"w2bmy5cnhvs\">I don’t know why, but the version of Tron 2 with the stubby little legs is just adorable.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.limxdynamics.com/en/products/tron2\">LimX Dynamics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"vmgiim6g_fg\">Uh, get a real job already...?<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.pndbotics.com/\">PNDbotics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"xtggy9lrisw\">Well, I guess we can all stop asking what humanoid robots are good for.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://en.engineai.com.cn/\">EngineAI<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"143b_pm77ga\">I think the right thing to do here is only post the disclaimer included with this video: “This film is a conceptual creative production, and certain scenes are presented for demonstration purposes only and do not represent the actual in-store operating process. The final store environment, robot appearance, and functionality are subject to the actual deployment. During actual operations, the robot will autonomously perform only designated preparation steps for specified ice cream products, and its hands will be fitted with protective gloves that comply with applicable food safety requirements.”<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.sharpa.com/pages/north-at-work\">Sharpa<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"h_ztrvhjv8k\"><em><a href=\"https://spectrum.ieee.org/in-the-air-with-ziplines-medical-delivery-drones\" target=\"_blank\">Drone delivery<\/a> is now an essential part of the South West London Pathology (SWLP) modernization agenda. Since February 2026, our highly automated aircraft have been delivering urgent NHS samples across south west London, with service up to 85% faster than ground transport. We are thrilled to be part of this initiative, supporting clinicians in providing timely, effective care for patients and contributing to a greener, more resilient NHS.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://wing.com/news/elevating-healthcare-logistics-wing-apian-nhs-south-west-london-drone-deliveries\">Wing<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"tzpswti20e8\"><em>Take a closer look at what’s next for the Aurora Driver. Designed to move freight farther, faster, and more efficiently, this next generation of the Aurora Driver delivers greater performance, built to last one million miles and cut hardware cost in half. <\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://aurora.tech/newsroom/your-questions-about-our-latest-driverless-launch-answered\">Aurora<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"gj4p0pc6kwc\"><em>How does a robot learn to recognize an object it’s never encountered? In this case, a demo can be worth a thousand words. Short human demonstrations can be used to create fully automated training datasets, sidestepping the prompting limitations that hold back vision-language models. Rather than describing objects with language, the system tracks what a person touches and manipulates during a demo, follows those objects through time, and clusters detections to handle objects merging or splitting apart in the scene. This bypasses a core weakness of VLMs, which struggle to reliably detect unusual or novel objects even with repeated, carefully engineered prompts.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://rai-inst.com/resources/blog/show-dont-tell-detecting-novel-objects-by-watching-human-demonstrations/\">Robotics and AI Institute<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div>"}, {"title": "How time series databases unlock real-time data for robotics", "source": "Robotics Business Review", "date": "2026-07-24", "url": "https://www.therobotreport.com/how-time-series-databases-unlock-real-time-data-for-robotics/", "summary": "<p>Discover how time series databases help robotics teams manage high-volume sensor data, power AI insights, and keep systems running at scale.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/how-time-series-databases-unlock-real-time-data-for-robotics/\">How time series databases unlock real-time data for robotics<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Generalist’s GEN-1 foundation model now supports a range of robot end effectors", "source": "Robotics Business Review", "date": "2026-07-24", "url": "https://www.therobotreport.com/generalists-gen-1-foundation-model-now-supports-a-range-of-robot-end-effectors/", "summary": "<p>By training GEN-1 to work with new hands, Generalist said a single base model can learn sensorimotor policies on different robots.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/generalists-gen-1-foundation-model-now-supports-a-range-of-robot-end-effectors/\">Generalist&#8217;s GEN-1 foundation model now supports a range of robot end effectors<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "AMD unveils Kria module for real-time control, unified memory for robots", "source": "Robotics Business Review", "date": "2026-07-23", "url": "https://www.therobotreport.com/amd-unveils-kria-module-real-time-control-unified-memory-robots/", "summary": "<p>AMD has launched the Ryzen AI Embedded X100 and Kria AI SoM, bringing unified memory and real-time control to challenge NVIDIA in robotics.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/amd-unveils-kria-module-real-time-control-unified-memory-robots/\">AMD unveils Kria module for real-time control, unified memory for robots<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Ropedia raises $22M to scale data collection for training robots", "source": "Robotics Business Review", "date": "2026-07-23", "url": "https://www.therobotreport.com/ropedia-raises-22m-scale-data-collection-training-robots/", "summary": "<p>Ropdeia's HOMIE is a head-mounted device, equipped with a 360º camera view, that captures first-person data for training robots.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/ropedia-raises-22m-scale-data-collection-training-robots/\">Ropedia raises $22M to scale data collection for training robots<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}], "embeddedNews": [{"title": "The Days Of Broadcast Digital TV Could Be Numbered", "source": "Hackaday", "date": "2026-08-25", "url": "https://hackaday.com/2026/08/25/the-days-of-broadcast-digital-tv-could-be-numbered/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"450\" src=\"https://hackaday.com/wp-content/uploads/2026/08/tv-switchoff-featured.jpg?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>When the analog TV signals were turned off in most places around fifteen years ago, their replacement took the form of a set of digital multiplexes. ATSC for North America, <a class=\"read-more\" href=\"https://hackaday.com/2026/08/25/the-days-of-broadcast-digital-tv-could-be-numbered/\">&#8230;read more<\/a>"}, {"title": "Straight Talk on 3D Printing Footwear At Home", "source": "Hackaday", "date": "2026-08-25", "url": "https://hackaday.com/2026/08/24/straight-talk-on-3d-printing-footwear-at-home/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"450\" src=\"https://hackaday.com/wp-content/uploads/2026/08/wearing-3d-printed-tpu-clogs-banner.png?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>Printed footwear is an intriguing idea, but as far as projects go it is somewhat more complex than it first appears. This guide to 3D printing your own clogs not <a class=\"read-more\" href=\"https://hackaday.com/2026/08/24/straight-talk-on-3d-printing-footwear-at-home/\">&#8230;read more<\/a>"}, {"title": "3D-Printed Skin Gives Robots the Sensation of Touch", "source": "Hackaday", "date": "2026-08-25", "url": "https://hackaday.com/2026/08/24/3d-printed-skin-gives-robots-the-sensation-of-touch/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"298\" src=\"https://hackaday.com/wp-content/uploads/2026/08/humanoid_touch_skin_haofeng_chen_et_al_arXiv_2026.jpg?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>Hypoesthesia, more commonly referred to as numbness, is one of the more distressing ailments that can affect us humans, primarily because it reminds us of just how much we rely <a class=\"read-more\" href=\"https://hackaday.com/2026/08/24/3d-printed-skin-gives-robots-the-sensation-of-touch/\">&#8230;read more<\/a>"}, {"title": "$299 Arduino Ventuno Q SBC combines Qualcomm Dragonwing IQ8 SoC and STM32H5 MCU", "source": "CNX Software", "date": "2026-08-25", "url": "https://www.cnx-software.com/2026/08/25/299-arduino-ventuno-q-sbc-combines-qualcomm-dragonwing-iq8-soc-and-stm32h5-mcu/", "summary": "<div><img alt=\"Arduino Ventuno Q\" class=\"attachment-medium size-medium wp-post-image\" height=\"480\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/08/Arduino-Ventuno-Q-720x480.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>The Arduino Ventuno Q is a single board computer pairing a Qualcomm Dragonwing IQ8 (IQ-8275) octa-core Edge AI SoC with an STM32H5F5 Arm Cortex-M33 microcontroller for real-time I/Os. First introduced at Embedded World 2026, the Ventuno Q is the second Qualcomm-based Arduino board after the Arduino UNO Q launched in October 2025. It&#8217;s quite a different beast with a larger design featuring 16GB LPDDR5, 64GB eMMC flash, an M.2 socket for NVMe storage, 2.5GbE and Wi-Fi 6 networking, a 4K-capable HDMI output, and two USB 3.2 ports, while still offloading real-time I/O to a Cortex-M33 microcontroller. &#160; Arduino Ventuno Q (ABX00181) specifications: SoC  &#8211; Qualcomm Dragonwing IQ8 (IQ-8275, also known as QCS8275): CPU &#8211; Octa-core Kryo Gen 6 (Arm Cortex-A78/A55) processor GPU &#8211; Adreno A623 AI accelerator -Hexagon Tensor AI Processor (NPU) up to 40 dense TOPS ISP &#8211; Qualcomm Spectra 692/690 ISP Microcontroller (MCU) &#8211; STMicro STM32H5F5 CPU core [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/08/25/299-arduino-ventuno-q-sbc-combines-qualcomm-dragonwing-iq8-soc-and-stm32h5-mcu/\">$299 Arduino Ventuno Q SBC combines Qualcomm Dragonwing IQ8 SoC and STM32H5 MCU<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Firehat is an open-source FireWire DV capture HAT for SBCs with Raspberry Pi PCIe FFC connector (Crowdfunding)", "source": "CNX Software", "date": "2026-08-25", "url": "https://www.cnx-software.com/2026/08/25/firehat-open-source-firewire-dv-capture-hat-pcie-sbc-raspberry-pi-5-radxa-rock-2f/", "summary": "<div><img alt=\"Firehat A compact FireWire DV capture HAT for single board computers\" class=\"attachment-medium size-medium wp-post-image\" height=\"480\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/08/Firehat-A-compact-FireWire-DV-capture-HAT-for-single-board-computers-720x480.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Computer Equipment Group has launched the Firehat, an open-source FireWire HAT that adds a native IEEE 1394 / i.LINK / DV port to SBCs with a Raspberry Pi PCIe FFC connector like the Pi 5 or the Radxa ROCK 2F. Built around a VIA VT6315N controller, the Firehat provides a modern way to capture footage from MiniDV, Digital8, DVCAM, DVCPRO, and HDV camcorders. It lets users connect compatible cameras or decks to an SBC and record the original digital DV stream directly to local storage, without legacy computers or discontinued FireWire capture cards. Firehat specifications: Compatibility – Radxa ROCK 2F, Raspberry Pi 5, and other SBCs that expose PCIe over an FPC connector (or via adapter) Controller – VIA VT6315N FireWire / IEEE 1394 controller Display – 1.3-inch monochrome OLED display onboard Camera input port – 6-pin FireWire/i.LINK/DV port Host interface PCIe 2.0 FFC connector for video 40-pin Raspberry Pi [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/08/25/firehat-open-source-firewire-dv-capture-hat-pcie-sbc-raspberry-pi-5-radxa-rock-2f/\">Firehat is an open-source FireWire DV capture HAT for SBCs with Raspberry Pi PCIe FFC connector (Crowdfunding)<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Advantech AOM-6741 AI Vision SMARC module features 100 TOPS Qualcomm IQ-9075 SoC, up to 36 GB LPDDR5", "source": "CNX Software", "date": "2026-08-25", "url": "https://www.cnx-software.com/2026/08/25/advantech-aom-6741-qualcomm-iq-9075-smarc-module/", "summary": "<div><img alt=\"Advantech AOM-6741\" class=\"attachment-medium size-medium wp-post-image\" height=\"432\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/08/Advantech-AOM-6741-720x432.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Advantech AOM-6741 is a SMARC 2.2 Full Size module powered by a Qualcomm Dragonwing IQ-9075 octa-core SoC with up to 100 TOPS (INT8) of AI performance, up to 36 GB LPDDR5 memory, and 128GB UFS storage. The module also features two MIPI DSI connectors, at least one MIPI CSI connector, and exposes all I/Os through a standard 314-pin MXM 3.0 edge connector, including four DisplayPort interfaces, dual 2.5GbE, two USB 3.2 Gen2, PCIe Gen3 x2 and x4 interfaces, and more. With support for up to 16 concurrent cameras, the OAM-06741 SoM mainly targets industrial-grade vision intelligence applications. Advantech AOM-6741 specifications: SoC – Qualcomm DragonWing IQ-9075 CPU Octa-core Kryo Gen 6 (Cortex-A78C-based) application cores @ up to 3.2 GHz (according to Advantech, conflicts with earlier announcements mentioning up to 2.36 GHz) Quad-core Cortex-R52 real-time cores @ up to 1.85GHz GPU – Adreno 663 GPU delivering up to 1.2 TFLOPS FP32 with secure [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/08/25/advantech-aom-6741-qualcomm-iq-9075-smarc-module/\">Advantech AOM-6741 AI Vision SMARC module features 100 TOPS Qualcomm IQ-9075 SoC, up to 36 GB LPDDR5<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Nvidia and SpaceXAI adapting terrestrial datacentre infrastructure for space", "source": "Electronics Weekly", "date": "2026-08-25", "url": "https://www.electronicsweekly.com/news/business/nvidia-and-spacexai-adapting-terrestrial-datacentre-infrastructure-for-space-2026-08/", "summary": "<p>SpaceXAI’s planned first-generation Starmind datacentre satellite, due for launch next year, will be based on the Nvidia Vera Rubin NVL72 rack-scale system, extending the Earth-bound Nvidia datacentre environment into space, [&#8230;]<\/p>\n<p>The post <a href=\"https://www.electronicsweekly.com/news/business/nvidia-and-spacexai-adapting-terrestrial-datacentre-infrastructure-for-space-2026-08/\">Nvidia and SpaceXAI adapting terrestrial datacentre infrastructure for space<\/a> appeared first on <a href=\"https://www.electronicsweekly.com\">Electronics Weekly<\/a>.<\/p>"}, {"title": "IBM and Arm designing dual architecture processor", "source": "Electronics Weekly", "date": "2026-08-25", "url": "https://www.electronicsweekly.com/news/business/ibm-and-arm-designing-dual-architecture-processor-2026-08/", "summary": "<p>IBM and Arm are designing a dual architecture processor, designed for future IBM Z and LinuxONE systems. Rather than treating Arm as a separate subsystem, each processor core is designed [&#8230;]<\/p>\n<p>The post <a href=\"https://www.electronicsweekly.com/news/business/ibm-and-arm-designing-dual-architecture-processor-2026-08/\">IBM and Arm designing dual architecture processor<\/a> appeared first on <a href=\"https://www.electronicsweekly.com\">Electronics Weekly<\/a>.<\/p>"}, {"title": "$1.6trn semi market, says Gartner", "source": "Electronics Weekly", "date": "2026-08-25", "url": "https://www.electronicsweekly.com/news/business/1-6trn-semi-market-says-gartner-2026-08/", "summary": "<p>Gartner sees semiconductor revenue reaching $1.6 trillion in 2026, increasing 92% from 2025 revenue of $809 billion. In 2027, it is forecast to total $1.9 trillion.. “The AI data center [&#8230;]<\/p>\n<p>The post <a href=\"https://www.electronicsweekly.com/news/business/1-6trn-semi-market-says-gartner-2026-08/\">$1.6trn semi market, says Gartner<\/a> appeared first on <a href=\"https://www.electronicsweekly.com\">Electronics Weekly<\/a>.<\/p>"}, {"title": "Can China’s Humanoid Robots be useful?", "source": "Electronics Weekly", "date": "2026-08-25", "url": "https://www.electronicsweekly.com/news/business/can-chinas-humanoid-robots-be-useful-2026-08/", "summary": "<p>Humanoid robots in China are beginning to be deployed across a wider range of applications—automotive, 3C electronics, aerospace, logistics, and energy—putting their commercial viability to the test, says TrendForce . [&#8230;]<\/p>\n<p>The post <a href=\"https://www.electronicsweekly.com/news/business/can-chinas-humanoid-robots-be-useful-2026-08/\">Can China’s Humanoid Robots be useful?<\/a> appeared first on <a href=\"https://www.electronicsweekly.com\">Electronics Weekly<\/a>.<\/p>"}, {"title": "Anglia signs OptoMedia", "source": "Electronics Weekly", "date": "2026-08-25", "url": "https://www.electronicsweekly.com/news/business/anglia-signs-optomedia-2026-08/", "summary": "<p>Anglia Components has signed afranchise agreement with Taiwanese manufacturer OptoMedia to distribute its range of fibre optic transceivers for industrial defence and video applications. “OptoMedia has the products and technologies [&#8230;]<\/p>\n<p>The post <a href=\"https://www.electronicsweekly.com/news/business/anglia-signs-optomedia-2026-08/\">Anglia signs OptoMedia<\/a> appeared first on <a href=\"https://www.electronicsweekly.com\">Electronics Weekly<\/a>.<\/p>"}, {"title": "IEE Christmas Lectures For Children", "source": "Electronics Weekly", "date": "2026-08-25", "url": "https://www.electronicsweekly.com/blogs/mannerisms/memory-lane/iee-christmas-lectures-for-children-2026-08/", "summary": "<p>Rockets For Christmas was the headline on a story written 66 years ago published in Electronics Weekly’s edition of November 30th 1960. The story opens: Research by Rocket and Satellite will [&#8230;]<\/p>\n<p>The post <a href=\"https://www.electronicsweekly.com/blogs/mannerism " /><\/div>It&#8217;s likely that even those of us who have never picked up a guitar in our lives will recognize the sound of an electric guitar with a fuzz box effects <a class=\"read-more\" href=\"https://hackaday.com/2026/08/24/an-electronic-explanation-of-1960s-fuzz-boxes/\">&#8230;read more<\/a>"}, {"title": "At Last, A Gameboy Advance With Decent Audio", "source": "Hackaday", "date": "2026-08-24", "url": "https://hackaday.com/2026/08/24/at-last-a-gameboy-advance-with-decent-audio/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"450\" src=\"https://hackaday.com/wp-content/uploads/2026/08/gba-audio-featured.jpg?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>Many pieces of consumer electronics are build down to a price, and the corners cut show up in their performance. The Gameboy Advance from Nintendo is no exception: its audio <a class=\"read-more\" href=\"https://hackaday.com/2026/08/24/at-last-a-gameboy-advance-with-decent-audio/\">&#8230;read more<\/a>"}, {"title": "Tech in Plain Sight: Vacuum Blood Collection", "source": "Hackaday", "date": "2026-08-24", "url": "https://hackaday.com/2026/08/24/tech-in-plain-sight-vacuum-blood-collection/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"533\" src=\"https://hackaday.com/wp-content/uploads/2026/08/Drawing_Test_tubes_different_colors_featured.png?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>If you&#8217;re blessed enough that you haven&#8217;t had blood drawn in a while, you might not have thought much about the process. You might imagine that a needle goes in, <a class=\"read-more\" href=\"https://hackaday.com/2026/08/24/tech-in-plain-sight-vacuum-blood-collection/\">&#8230;read more<\/a>"}, {"title": "Jetway PIC-TWL1 Intel N150 Pico-ITX motherboard is made for industrial automation and embedded systems", "source": "CNX Software", "date": "2026-08-24", "url": "https://www.cnx-software.com/2026/08/25/jetway-pic-twl1-intel-n150-pico-itx-motherboard-is-made-for-industrial-automation-and-embedded-systems/", "summary": "<div><img alt=\"Jetway PIC-TWL1\" class=\"attachment-medium size-medium wp-post-image\" height=\"454\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/08/Jetway-PIC-TWL1-720x454.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Jetway PIC-TWL1 is a compact (100&#215;72 mm) fanless Pico-ITX motherboard powered by an Intel N150 Twin Lake processor and engineered for industrial control, factory automation, facial recognition, and edge embedded systems. The board supports up to 32GB DDR5 SO-DIMM memory and NVMe SSD storage, and features HDMI and LVDS/eDP display interfaces, two USB 3.2 ports, two Gigabit Ethernet ports, an M.2 E-Key socket for WiFi and Bluetooth, and several headers for GPIOs, RS232/RS485, USB 2.0, audio, SMBUs, and front panel connections. It takes 12V DC power and can operate in a -20°C ~ 60°C temperature range. Jetway PIC-TWL1 specifications: SoC &#8211; Intel Processor N150 CPU &#8211; Quad-core Twin Lake processor @ 800 MHz / 3.6 GHz (Turbo) with 6MB cache GPU &#8211; 24EU Intel UHD graphics @ 1.0 GHz TDP &#8211; 6W System Memory –  Up to 32GB DDR5 4800 MT/s via single-channel SO-DIMM slot Storage &#8211; NVMe SSD via M.2 [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/08/25/jetway-pic-twl1-intel-n150-pico-itx-motherboard-is-made-for-industrial-automation-and-embedded-systems/\">Jetway PIC-TWL1 Intel N150 Pico-ITX motherboard is made for industrial automation and embedded systems<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "MNT Station fanless, modular open-hardware computer supports a choice of 10+ Arm CPU or FPGA modules (Crowdfunding)", "source": "CNX Software", "date": "2026-08-24", "url": "https://www.cnx-software.com/2026/08/24/mnt-station-fanless-modular-open-hardware-computer-supports-a-choice-of-10-arm-cpu-or-fpga-modules/", "summary": "<div><img alt=\"MNT Station fanless open hardware modular computer\" class=\"attachment-medium size-medium wp-post-image\" height=\"480\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/08/MNT-Station-fanless-open-hardware-modular-computer-720x480.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>MNT Research, the Berlin-based team behind the MNT Reform, MNT Pocket Reform, Reform 2, and MNT Reform Next, has launched the MNT Station, a fanless, open-hardware modular computer designed for use as a desktop PC, home server, NAS, router, edge device, or low-power media center. The MNT Station is built around the MNT Reform mainboard ecosystem and designed for those who want to reuse an existing MNT Reform mainboard (versions 2.0, 2.5, or 3.0) as a stationary computer, as well as those building a modular Arm (or FPGA-based) desktop from scratch using the new MNT Reform Mainboard 3.0. Like other MNT systems, it&#8217;s fully open-source hardware, and the 200-pin processor module connector supports different processor modules, including the Rockchip RK3588, NXP Layerscape LS1028A, and Raspberry Pi CM4, among others. MNT Station specifications: SoC/Processor and Memory options (via 200-pin module) Rockchip RK3588 (MNT RCORE V2) — 4× Cortex-A76 + 4× Cortex-A55 [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/08/24/mnt-station-fanless-modular-open-hardware-computer-supports-a-choice-of-10-arm-cpu-or-fpga-modules/\">MNT Station fanless, modular open-hardware computer supports a choice of 10+ Arm CPU or FPGA modules (Crowdfunding)<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "$60+ Nordic Semi nRF93M1 Development Kit (DK) targets LTE Cat 1 bis IoT applications", "source": "CNX Software", "date": "2026-08-24", "url": "https://www.cnx-software.com/2026/08/24/60-nordic-semi-nrf93m1-development-kit-dk-targets-lte-cat-1-bis-iot-applications/", "summary": "<div><img alt=\"Nordic Semi nRF93M1 Development Kit\" class=\"attachment-medium size-medium wp-post-image\" height=\"478\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/08/Nordic-Semi-nRF93M1-Development-Kit-720x478.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Nordic Semiconductor has launched the nRF93M1 DK (Development Kit) based on the nRF93M1-LABA LTE Cat 1 bis with Wi-Fi and cellular location and a Nordic Semi nRF54L15 host microcontroller. The nRF93M1 module was first introduced at Embedded World 2026 last March, and the company has now announced general availability of the nRF93M1-LABA smart modem module for Europe, Asia, the Middle East, Africa, and sampling of the nRF93M1-LACA module for global markets, scheduled to become available in Q3 2026. The announcement also covers the launch of the nRF93M1 Development Kit, which was teased last March with limited details. Time to have a closer look. nRF93M1 DK specifications: Host MCU &#8211; Nordic Semiconductor nRF54L15 MCU cores Arm Cortex-M33 with Arm TrustZone @ 128MHz RISC-V coprocessor for software-defined peripheral Memory – 256KB SRAM Storage – 1.5MB non-volatile memory Wireless Bluetooth 6.0 Data rates – 2Mbps, 1Mbps, 500kbps, 125kbps Features (TBC in built-in firmware) AoA [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/08/24/60-nordic-semi-nrf93m1-development-kit-dk-targets-lte-cat-1-bis-iot-applications/\">$60+ Nordic Semi nRF93M1 Development Kit (DK) targets LTE Cat 1 bis IoT applications<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Completing the Audit Trail: Why Embedded Teams Need Runtime Observability", "source": "Embedded.com", "date": "2026-08-24", "url": "https://www.embedded.com/completing-the-audit-trail-why-embedded-teams-need-runtime-observability/", "summary": "<p>Reproducible builds have become a cornerstone of modern embedded development. They provide confidence that a specific source-code baseline and toolchain produce a known firmware artifact, creating a traceable path from source code to deployed software. For many organizations, this forms an essential part of the engineering audit trail. Teams can determine what software was built, [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/completing-the-audit-trail-why-embedded-teams-need-runtime-observability/\">Completing the Audit Trail: Why Embedded Teams Need Runtime Observability<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "Mikroe Releases RTLS UWB Click Board", "source": "Embedded.com", "date": "2026-08-24", "url": "https://www.embedded.com/mikroe-releases-rtls-uwb-click-board/", "summary": "<p>Mikroe has launched its latest Click board addition, the real-time location system (RTLS) ultra-wideband (UWB) add-on board for high-precision real-time location, distance measurement, and motion-aware tracking. The new board is suited for applications such as asset tracking, indoor positioning, personnel and equipment localization, smart logistics, and industrial monitoring. It can be used for indoor navigation [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/mikroe-releases-rtls-uwb-click-board/\">Mikroe Releases RTLS UWB Click Board<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "Picture of the Day: Humanoid 3 – 0 Human", "source": "Electronics Weekly", "date": "2026-08-24", "url": "https://www.electronicsweekly.com/blogs/gadget-master/robot/picture-of-the-day-humanoid-4-0-human-2026-08/", "summary": "<p>Note must be taken of the historic World Humanoid Robot Games in the Beijing National Stadium. Specifically, the Tiangong Ultra robot surpassing the fastest human's time for a 100m sprint.<\/p>\n<p>The post <a href=\"https://www.electronicsweekly.com/blogs/gadget-master/robot/pictur le-chip quantum dot-based DWDM (dense wavelength division multiplexing) comb laser. Described as a new [&#8230;]<\/p>\n<p>The post <a href=\"https://www.electronicsweekly.com/news/products/quintessent-begins-sampling-single-chip-dwdm-comb-laser-2026-08/\">Quintessent begins sampling single-chip DWDM comb laser<\/a> appeared first on <a href=\"https://www.electronicsweekly.com\">Electronics Weekly<\/a>.<\/p>"}, {"title": "Electronic component zero orientation for CAD library construction", "source": "Adafruit", "date": "2026-08-24", "url": "https://blog.adafruit.com/2026/08/24/electronic-component-zero-orientation-for-cad-library-construction/", "summary": "Mentor Graphics Corporation, back in 2010, established a consistent technique for the description of electronic component orientation, and their land pattern geometries, that facilitates and encourages a common data capture and transfer methodology amongst and between global trading partners. IPC, in conjunction with the International Electrotechnical Commission (IEC), have established several standards that are in [&#8230;]"}, {"title": "A dithered QR code generator", "source": "Adafruit", "date": "2026-08-24", "url": "https://blog.adafruit.com/2026/08/24/a-dithered-qr-code-generator/", "summary": "A QR code is really just a way of encoding a few bytes of data in a way that can be easily read from a photo by a smartphone or similar device. They&#8217;re designed to be very robust to bad focus, bad printing, funny angles, and missing areas. Exactly how they work isn&#8217;t terribly important, [&#8230;]"}, {"title": "Everything about my smart home and homelab setup", "source": "Adafruit", "date": "2026-08-24", "url": "https://blog.adafruit.com/2026/08/24/everything-about-my-smart-home-and-homelab-setup/", "summary": "So many people are looking to set up homelabs and also looking to automate their home. But actual examples are not so easy to find. Bruno Rocha writes about his home network and home automation setup is laid out and has changed over time. I’m very satisfied with my hardware and setup choices. As I [&#8230;]"}, {"title": "Celebrating 45 years of Kermit with the first new C-Kermit release in 15 years", "source": "Adafruit", "date": "2026-08-24", "url": "https://blog.adafruit.com/2026/08/24/celebrating-45-years-of-kermit-with-the-first-new-c-kermit-release-in-15-years/", "summary": "John Goerzen writes on The Changelog that 1981 was a different time for computing. It was expensive (both hardware and software), and it was far from a given that machines from one vendor would be able to talk to those from another. In fact, Columbia University had just such a problem, so in 1981, Frank [&#8230;]"}, {"title": "A portable, sensitive, low power, analog Geiger counter", "source": "Adafruit", "date": "2026-08-24", "url": "https://blog.adafruit.com/2026/08/24/a-portable-sensitive-low-power-analog-geiger-counter/", "summary": "Manfred Mornhinweg bought a Chinese J306β Geiger-Müller counter tube, the glass version, which is rated to give 88 counts per minute at average background radiation, or 8 counts per second at a radiation intensity of 1µSv/h. This tube is nearly 20cm long, and about 18mm in diameter. I took quite some time to decide whether [&#8230;]"}, {"title": "sectorforth is a 16-bit x86 Forth that fits in a 512-byte boot sector", "source": "Adafruit", "date": "2026-08-24", "url": "https://blog.adafruit.com/2026/08/24/sectorforth-is-a-16-bit-x86-forth-that-fits-in-a-512-byte-boot-sector/", "summary": "sectorforth is a 16-bit x86 Forth that fits in a 512-byte boot sector. Inspiration to write sectorforth came from a 1996 Usenet thread (in particular, Bernd Paysan&#8217;s first post on the thread). sectorforth contains only the eight primitives outlined in the Usenet post above, five variables for manipulating internal state, and two I/O primitives. With [&#8230;]"}, {"title": "RideLinkBLE: Arduino ESP32 BLE library for e-bike controllers", "source": "Adafruit", "date": "2026-08-24", "url": "https://blog.adafruit.com/2026/08/24/ridelinkble-arduino-esp32-ble-library-for-e-bike-controllers/", "summary": "RideLinkBLE is an Arduino ESP32 BLE library for controlling and reading telemetry from compatible e-bike controllers by ToasterForSale. RideLinkBLE requires an ESP32-family board with Bluetooth Low Energy support. Classic AVR-based Arduino Uno, Nano, and Mega boards cannot run this library without separate BLE hardware and a different BLE implementation. Install the Espressif ESP32 board package, [&#8230;]"}, {"title": "How to Mentally Calculate the Day of the Week for Any Date", "source": "Adafruit", "date": "2026-08-24", "url": "https://blog.adafruit.com/2026/08/24/how-to-mentally-calculate-the-day-of-the-week-for-any-date/", "summary": "&#160; Tinker &#38; See share tools to master the impressive party trick of naming the day of the week for any date. There is some math and memorization but A LOT less than you would guess. The &#8220;secrets&#8221; come down to the days of the week being a circle of 7 and a squad of [&#8230;]"}, {"title": "NEW GUIDE: Adding a Bubble Level to the MEMENTO #Adafruit Products #AdafruitLearningSystem @Adafruit", "source": "Adafruit", "date": "2026-08-24", "url": "https://blog.adafruit.com/2026/08/24/new-guide-adding-a-bubble-level-to-the-memento-adafruit-products-adafruitlearningsystem-adafruit/", "summary": "Have you ever tried taking a top-down photo only to find that you were off by just a little bit and the subject suddenly looks a bit warped? By using the MEMENTO Python-programmable camera with its built-in accelerometer, it&#8217;s easy to add a bubble level that will help you keep the photos straight and level [&#8230;]"}, {"title": "Simplified Raspberry Pi Pico VGA", "source": "Adafruit", "date": "2026-08-24", "url": "https://blog.adafruit.com/2026/08/24/simplified-raspberry-pi-pico-vga/", "summary": "Having spent far too long chewing over how the Raspberry Pi Pico Scanvideo library works over in Simplified Pico VGA, Kevin posts about coding a simplified Pico VGA in Arduino. One constraint I have for myself, is that I want to keep using the Arduino IDE for the Pico, so the first step is to [&#8230;]"}, {"title": "Attachécade Luggable Arcade: New Learn Guide Alert", "source": "Adafruit", "date": "2026-08-24", "url": "https://blog.adafruit.com/2026/08/24/attachecade-luggable-arcade-new-learn-guide-alert/", "summary": "Build your own portable arcade machine housed inside of a repurposed record player case. John Park&#8217;s Attachécade Learn Guide shows you how. The Attachécade is a Raspberry Pi-based emulation machine with built-in 14&#8243; monitor, arcade joystick and buttons, and stereo speakers. You can flip it open and play from the comfort of your couch, even [&#8230;]"}, {"title": "eCAV: Electric Commercial Agricultural Vehicles — onsemi and Mouser Electronics", "source": "EE Journal", "date": "2026-08-24", "url": "https://www.eejournal.com/chalk_talks/ecav-electric-commercial-agricultural-vehicles-onsemi-and-mouser-electronics/", "summary": "&#160; In this episode of Chalk Talk, Youssef Bouguerba from onsemi and Amelia Dalton explore the eCAV landscape, break down the core architecture that distinguishes these vehicles from standard EVs, and check out how onsemi’s portfolio of power modules, image sensors, and connectivity solutions can help you optimize your next design. Click here for more &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/chalk_talks/ecav-electric-commercial-agricultural-vehicles-onsemi-and-mouser-electronics/\">Read More &#8594;<span class=\"screen-reader-text\"> \"eCAV: Electric Commercial Agricultural Vehicles &#8212; onsemi and Mouser Electronics\"<\/span><\/a>"}, {"title": "TDK acquires assets from OQmented to advance AR display technologies", "source": "EE Journal", "date": "2026-08-24", "url": "https://www.eejournal.com/industry_news/tdk-acquires-assets-from-oqmented-to-advance-ar-display-technologies/", "summary": "&#8211; TDK acquired assets from OQmented to strengthen AR display technology portfolio. &#8211; The acquisition adds valuable IP, engineering expertise, and MEMS-based laser beam scanning technology. &#8211; Purchase supports TDK’s strategy to develop advanced, vertically integrated display solutions for future smart glasses, combining TDK’s eye intent technology, Full-color Laser Module (FCLM), MEMS mirror, and other &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/tdk-acquires-assets-from-oqmented-to-advance-ar-display-technologies/\">Read More &#8594;<span class=\"screen-reader-text\"> \"TDK acquires assets from OQmented to advance AR display technologies\"<\/span><\/a>"}, {"title": "New Xteink X3 eReader Launch Offers a Distraction-Free Solution for All Book Lovers", "source": "EE Journal", "date": "2026-08-24", "url": "https://www.eejournal.com/industry_news/new-xteink-x3-ereader-launch-offers-a-distraction-free-solution-for-all-book-lovers/", "summary": "Millions of people love to read. Being able to pick up a book and fall into a story of unrequited love or fantasy realms is a wonderful break from the hustle and bustle of daily living. The trouble is, not everyone can fit a library of books in their backpack. That is, until products like &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/new-xteink-x3-ereader-launch-offers-a-distraction-free-solution-for-all-book-lovers/\">Read More &#8594;<span class=\"screen-reader-text\"> \"New Xteink X3 eReader Launch Offers a Distraction-Free Solution for All Book Lovers\"<\/span><\/a>"}, {"title": "Epson to Showcase Quartz MEMS IMU Technology at Small Satellite Conference 2026", "source": "EE Journal", "date": "2026-08-24", "url": "https://www.eejournal.com/industry_news/epson-to-showcase-quartz-mems-imu-technology-at-small-satellite-conference-2026/", "summary": "Epson will showcase its high-performance Quartz MEMS inertial measurement unit (IMU) technology for next-generation small spacecraft at the Small Satellite Conference (SmallSat) 2026, taking place August 23–26 in Salt Lake City, Utah. Visitors can meet Epson’s inertial sensing specialists at Booth #2005. As small satellites take on increasingly demanding missions, accurate and dependable inertial sensing &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/epson-to-showcase-quartz-mems-imu-technology-at-small-satellite-conference-2026/\">Read More &#8594;<span class=\"screen-reader-text\"> \"Epson to Showcase Quartz MEMS IMU Technology at Small Satellite Conference 2026\"<\/span><\/a>"}, {"title": "Powering the Future: Indium Corporation to Present Next Gen Semiconductor Packaging Solutions at PCIM Asia", "source": "EE Journal", "date": "2026-08-24", "url": "https://www.eejournal.com/industry_news/powering-the-future-indium-corporation-to-present-next-gen-semiconductor-packaging-solutions-at-pcim-asia/", "summary": "Indium Corporation® Senior Area Technical Manager Leo Hu will discuss how key material innovations can collaboratively address cutting-edge advanced packaging process challenges at PCIM Asia 2026, August 26-28, in Shenzhen, China. The presentation, titled Next-Gen Advanced Packaging Materials and System Integration for Power Electronics, examines how advanced interconnection materials and process innovations work together to improve yield, reliability, and manufacturability in next-generation semiconductor &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/powering-the-future-indium-corporation-to-present-next-gen-semiconductor-packaging-solutions-at-pcim-asia/\">Read More &#8594;<span class=\"screen-reader-text\"> \"Powering the Future: Indium Corporation to Present Next Gen Semiconductor Packaging Solutions at PCIM Asia\"<\/span><\/a>"}, {"title": "AI Disrupts Engineering Resins and Polymer Materials Development, Unlocking New Frontiers in EV, 5G, and Sustainable Formulation", "source": "EE Journal", "date": "2026-08-24", "url": "https://www.eejournal.com/industry_news/ai-disrupts-engineering-resins-and-polymer-materials-development-unlocking-new-frontiers-in-ev-5g-and-sustainable-formulation/", "summary": "Artificial intelligence is rapidly reshaping the engineering resins, polymer alloys, and blends landscape — accelerating materials discovery, transforming manufacturing process control, and redefining how next-generation formulations are designed for demanding applications in electric vehicles, 5G infrastructure, and advanced electronics. BCC Research&#8217;s newly published AI Impact on Engineering Resins, Polymer Alloys and Blends Market — BCC Pulse &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/ai-disrupts-engineering-resins-and-polymer-materials-development-unlocking-new-frontiers-in-ev-5g-and-sustainable-formulation/\">Read More &#8594;<span class=\"screen-reader-text\"> \"AI Disrupts Engineering Resins and Polymer Materials Development, Unlocking New Frontiers in EV, 5G, and Sustainable Formulation\"<\/span><\/a>"}, {"title": "Rockchip RV1126B-based Forlinx FCU3101 fanless edge AI system targets IIoT and smart security applications", "source": "CNX Software", "date": "2026-08-23", "url": "https://www.cnx-software.com/2026/08/24/rockchip-rv1126b-based-forlinx-fcu3101-fanless-edge-ai-system-targets-iiot-and-smart-security-applications/", "summary": "<div><img alt=\"Forlinx FCU3101 RV1126B fanless edge AI system\" class=\"attachment-medium size-medium wp-post-image\" height=\"480\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/08/Forlinx-FCU3101-RV1126B-fanless-edge-AI-system-720x480.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Forlinx has just introduced the FCU3101, a fanless Edge AI system based on the Rockchip RV1126B/RV1126BJ SoC and designed for Industrial IoT (IIoT) and smart security applications, such as video surveillance, license plate recognition, intrusion detection, industrial inspection, and material counting. It ships with up to 4GB of DDR4, up to 64GB of eMMC storage, and includes dual Ethernet, Wi-Fi 4, Bluetooth 4.2, optional 4G LTE, RS485, RS232, digital I/O, relay outputs, HDMI, and USB ports. It supports up to 9–36V DC input and operates in the -40°C to +85°C temperature range in its industrial configuration. Forlinx FCU3101 specifications: SoC – Rockchip RV1126B or RV1126BJ (industrial-grade version) CPU – Quad-core Arm Cortex-A53 up to 1.6 GHz with 32KB L1 I-Cache and 32KB L1 D-Cache, unified 512KB L2 Cache GPU – 2D Graphics Engine VPU Video Decoder – H.265/H.264 up to 3840×2160 @ 30fps Video Encoder  – H.265, H.264, JPEG up to [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/08/24/rockchip-rv1126b-based-forlinx-fcu3101-fanless-edge-ai-system-targets-iiot-and-smart-security-applications/\">Rockchip RV1126B-based Forlinx FCU3101 fanless edge AI system targets IIoT and smart security applications<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Openterface KeyMod turns your smartphone into a USB keyboard, mouse, gamepad, or SSH client (Crowdfunding)", "source": "CNX Software", "date": "2026-08-23", "url": "https://www.cnx-software.com/2026/08/24/openterface-keymod-turns-your-smartphone-into-a-usb-keyboard-mouse-gamepad-or-ssh-client/", "summary": "<div><img alt=\"Openterface KeyMod mini and plus Pocket USB multi toole for tech, professionals and gaming\" class=\"attachment-medium size-medium wp-post-image\" height=\"480\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/08/Openterface-KeyMod-mini-and-plus-Pocket-USB-multi-toole-for-tech-professionals-and-gaming-720x480.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>After successfully launching the Openterface Mini-KVM and Openterface KVM-GO, TechxArtisan has just introduced the Openterface KeyMod pocket-sized USB multi-tool that turns an Android or iOS smartphone into a wireless keyboard, mouse, gamepad, presentation remote, or an SSH terminal for controlling PCs, servers, kiosks, Raspberry Pi boards, and other USB hosts. It comes in two variants: the KeyMod Mini with a USB-C port, and the KeyMod Plus with a USB-A port. KeyMod Mini connects to the phone through Bluetooth 5.3, while KeyMod Plus relies on a wired USB connection for higher bandwidth. It provides USB HID keyboard and mouse functions that work even in BIOS, along with a USB CDC-ECM network bridge for SSH, VNC, SCP, rsync, and other TCP-based tools. The hardware uses a CH32V208 HID controller and USB composite architecture and is powered directly from the target&#8217;s USB port. It is designed for IT support, server administration, embedded development, [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/08/24/openterface-keymod-turns-your-smartphone-into-a-usb-keyboard-mouse-gamepad-or-ssh-client/\">Openterface KeyMod turns your smartphone into a USB keyboard, mouse, gamepad, or SSH client (Crowdfunding)<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Framework Laptop 12 repairable, convertible laptop gets Wildcat Lake motherboard, ships with Fedora 44 or Windows 11", "source": "CNX Software", "date": "2026-08-23", "url": "https://www.cnx-software.com/2026/08/23/framework-laptop-12-repairable-convertible-laptop-gets-wildcat-lake-motherboard-ships-with-fedora-44-or-windows-11/", "summary": "<div><img alt=\"Framework Laptop 12\" class=\"attachment-medium size-medium wp-post-image\" height=\"540\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/08/Framework-Laptop-12-720x540.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>First introduced in 2025, the Framework Laptop 12 upgradable and repairable laptop has just gotten a new motherboard offered with a choice of Wildcat Lake (Intel Core Series 3) processors from the Core 3 304 up to the Core 7 350. The Wildcat Lake-based convertible Laptop 12 features a 12.2-inch display with 1920 x 1200 resolution, a SO-DIMM slot supporting up to 64GB DDR5, an M.2 2230 NVMe SSD slot, and high-speed connectivity with Thunderbolt 4, WiFi 7, and more. Framework Laptop 12 (Intel Core Series 3) specifications: Wildcat Lake SoC (one or the other) Intel Core 3 304 5-core CPU – 1x P-cores @ 1.5/4.3 GHz (Turbo) + 4x LPE-cores @ 1.4/3.3 GHz (Turbo) GPU – 1-core Intel Xe3 Graphics @ 2.3 GHz (9 TOPS) NPU – 15 TOPS Intel Core 5 320 6-core CPU – 2x P-cores @ 1.5/4.6 GHz (Turbo) + 4x LPE-cores @ 1.4/3.4 GHz (Turbo) [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/08/23/framework-laptop-12-repairable-convertible-laptop-gets-wildcat-lake-motherboard-ships-with-fedora-44-or-windows-11/\">Framework Laptop 12 repairable, convertible laptop gets Wildcat Lake motherboard, ships with Fedora 44 or Windows 11<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Espressif Systems releases a Linux BSP developer preview for ESP32-S31 RISC-V microprocessor", "source": "CNX Software", "date": "2026-08-22", "url": "https://www.cnx-software.com/2026/08/22/espressif-systems-releases-a-linux-bsp-developer-preview-for-esp32-s31-risc-v-microprocessor/", "summary": "<div><img alt=\"ESP32-S31 Linux\" class=\"attachment-medium size-medium wp-post-image\" height=\"432\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/08/ESP32-S31-Linux-720x432.png\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>The ESP32-S31 microprocessor is getting Linux support from Espressif Systems. The ESP32-S31 dual-core RISC-V microprocessor was first unveiled in March, two ESP32-S31 development boards followed in May, and mass production was announced a few weeks ago. The new RISC-V chip features an MMU (Memory Management Unit), which makes Linux much easier to handle, and the development boards also come with 16MB PSRAM, so a minimal Linux image is possible. Moving from theory to practice, Espressif Systems has now released a developer preview version of the ESP Linux BSP for ESP32-S31, and some community Linux ports are also in the works (more on that at the end of the article). Let&#8217;s focus on the official ESP Linux BSP. The aforementioned repo only contains the image layout and packaging tools used by the ESP32-S31 Buildroot integration, and the core of the project can be found in the esp-buildroot-external repo with ESP32-S31 NOR boot [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/08/22/espressif-systems-releases-a-linux-bsp-developer-preview-for-esp32-s31-risc-v-microprocessor/\">Espressif Systems releases a Linux BSP developer preview for ESP32-S31 RISC-V microprocessor<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "AAEON uCOM-Q6490 – A SMARC 2.1-compliant SoM powered by Qualcomm Dragonwing QCS6490 SoC", "source": "CNX Software", "date": "2026-08-21", "url": "https://www.cnx-software.com/2026/08/21/aaeon-ucom-q6490-a-smarc-2-1-qualcomm-dragonwing-qcs6490-som/", "summary": "<div><img alt=\"AAEON uCOM Q6490 A SMARC 2.1 computer on module (COM) with Qualcomm Dragonwing QCS6490 processor\" class=\"attachment-medium size-medium wp-post-image\" height=\"480\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/08/AAEON-uCOM-Q6490-A-SMARC-2.1-computer-on-module-COM-with-Qualcomm-Dragonwing-QCS6490-processor-720x480.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>AAEON uCOM-Q6490 is a SMARC 2.1-compliant System-on-Module (SoM) built around the Qualcomm Dragonwing QCS6490 octa-core SoC, designed for robotics, healthcare, industrial automation, and digital signage applications. The 82 × 50 mm module ships with up to 16GB LPDDR5 memory and 64GB UFS storage, and its standard MXM 3.0 edge connector exposes SDIO 3.0, PCIe 3.0, dual GbE, USB 3.1, and U
