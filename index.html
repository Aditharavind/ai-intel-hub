solder-fume-extractor-with-magnetic-cover-3dthursday-3dprinting/", "summary": "Vinark shares: A rechargeable, modular solder fume extractor designed for less-advanced electronics builders. Slim 80×15mm PC fan, 18650 rechargeable battery cell, TP4056 charging + MT3608 step-up modules, on/off switch. Screwless design using 16× 6×3mm round magnets — easily swappable front grille and replaceable filter sponge. 3 different print profiles. Great fresh maker-tool angle for the [&#8230;]"}, {"title": "Aetina Introduces AIE-KT78/68 for Integrated AI Perception, Decision-Making and Control in Robotics", "source": "EE Journal", "date": "2026-09-18", "url": "https://www.eejournal.com/industry_news/aetina-introduces-aie-kt78-68-for-integrated-ai-perception-decision-making-and-control-in-robotics/", "summary": "Aetina Corporation, a leading edge AI solution provider and an accelerator of AI infrastructure, today announced the general availability of its DeviceEdge AIE-KT78 and AIE-KT68 flagship edge AI systems. Powered by NVIDIA Jetson Thor, both new systems integrate NVIDIA Blackwell architecture&#8217;s high performance AI compute, high-bandwidth sensor connectivity, and deterministic industrial control into a compact &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/aetina-introduces-aie-kt78-68-for-integrated-ai-perception-decision-making-and-control-in-robotics/\">Read More &#8594;<span class=\"screen-reader-text\"> \"Aetina Introduces AIE-KT78/68 for Integrated AI Perception, Decision-Making and Control in Robotics\"<\/span><\/a>"}, {"title": "Semtech SurgeSwitch Protects Cobots from Surge and ESD", "source": "EE Journal", "date": "2026-09-18", "url": "https://www.eejournal.com/industry_news/semtech-surgeswitch-protects-cobots-from-surge-and-esd/", "summary": "Semtech Corporation (Nasdaq: SMTC), a leading provider of high-performance semiconductors powering AI data center networking and intelligent, connected Internet of Things (“IoT”) devices worldwide, today announced TDS2621LP, the latest addition to its SurgeSwitch® family. Purpose built for 24 V DC power buses in industrial robotics, collaborative robots (cobots) and automated manufacturing, TDS2621LP delivers near-constant clamping &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/semtech-surgeswitch-protects-cobots-from-surge-and-esd/\">Read More &#8594;<span class=\"screen-reader-text\"> \"Semtech SurgeSwitch Protects Cobots from Surge and ESD\"<\/span><\/a>"}, {"title": "ESD Alliance Plans Day-Long SEMICON West “Bridging Design and Manufacturing with AI” Design Session", "source": "EE Journal", "date": "2026-09-18", "url": "https://www.eejournal.com/industry_news/esd-alliance-plans-day-long-semicon-west-bridging-design-and-manufacturing-with-ai-design-session/", "summary": "TSMC executive to give keynote address ““Scaling Leadership Silicon with AI” Nine presentations, IEEE-hosted “True Value and Cost of Agentic AI in SoC Design and Manufacturing” panel, McKinsey look at “Design at AI Speed” Speakers from EDA, IP, memory and storage, AI hardware companies, equipment manufacturer completes program The Electronic System Design Alliance (ESDA), a SEMI Technology &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/esd-alliance-plans-day-long-semicon-west-bridging-design-and-manufacturing-with-ai-design-session/\">Read More &#8594;<span class=\"screen-reader-text\"> \"ESD Alliance Plans Day-Long SEMICON West “Bridging Design and Manufacturing with AI” Design Session\"<\/span><\/a>"}, {"title": "Infineon EiceDRIVER™ 2EDL6014AC-G2D dual channel gate driver delivers high density and thermal performance for AI datacenter power designs", "source": "EE Journal", "date": "2026-09-18", "url": "https://www.eejournal.com/industry_news/infineon-eicedriver-2edl6014ac-g2d-dual-channel-gate-driver-delivers-high-density-and-thermal-performance-for-ai-datacenter-power-designs/", "summary": "Infineon Technologies AG (FSE: IFX / OTCQX: IFNNY) introduces the EiceDRIVER™ 2EDL6014AC-G2D, a 120 V junction-isolated dual channel floating output gate driver engineered for high-density silicon power designs in AI datacenter applications. Housed in a compact WQFN-12 2.2 mm x 2.2 mm package, the device addresses the growing demand for power conversion solutions that deliver &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/infineon-eicedriver-2edl6014ac-g2d-dual-channel-gate-driver-delivers-high-density-and-thermal-performance-for-ai-datacenter-power-designs/\">Read More &#8594;<span class=\"screen-reader-text\"> \"Infineon EiceDRIVER™ 2EDL6014AC-G2D dual channel gate driver delivers high density and thermal performance for AI datacenter power designs\"<\/span><\/a>"}, {"title": "Nanosecond Decisions for a Crowded Spectrum: Inside VectorWave’s RF Neuromorphic Chip", "source": "EE Journal", "date": "2026-09-18", "url": "https://www.eejournal.com/fish_fry/nanosecond-decisions-for-a-crowded-spectrum-inside-vectorwaves-rf-neuromorphic-chip/", "summary": "<img alt=\"\" class=\"webfeedsFeaturedVisual wp-post-image\" height=\"300\" src=\"https://www.eejournal.com/wp-content/uploads/2026/09/ChatGPT-Image-Sep-16-2026-10_44_48-AM-300x300.png\" style=\"display: block; margin-bottom: 5px; clear: both;\" width=\"300\" />My podcast guest this week is VectorWave CTO and Founder, Dr. Ron Davis. Ron and I discuss the details of VectorWave’s neuromorphic analog compute platform, how it differs from traditional digital processing, and what it really means to build AI-native connectivity rather than simply adding AI features onto existing wireless systems. We also talk about &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/fish_fry/nanosecond-decisions-for-a-crowded-spectrum-inside-vectorwaves-rf-neuromorphic-chip/\">Read More &#8594;<span class=\"screen-reader-text\"> \"Nanosecond Decisions for a Crowded Spectrum: Inside VectorWave&#8217;s RF Neuromorphic Chip\"<\/span><\/a>"}, {"title": "Raspberry Pi 5 gets dual GMSL2 Camera HAT based on MAX96716A deserializer", "source": "CNX Software", "date": "2026-09-17", "url": "https://www.cnx-software.com/2026/09/17/raspberry-pi-5-gets-dual-gmsl2-camera-hat-based-on-max96716a-deserializer/", "summary": "<div><img alt=\"Dual GMSL2 Camera HAT connected to Raspberry Pi 5\" class=\"attachment-medium size-medium wp-post-image\" height=\"480\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/09/Dual-GMSL2-Camera-HAT-connected-to-Raspberry-Pi-5-720x480.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>BE-IIS (Brechel Electronic-Industrial Interface Systems) has released a dual GMSL2 Camera HAT for the Raspberry Pi 5. The board is based on the MAX96716A GMSL2 deserializer and connects two remote GMSL2 cameras through the Pi&#8217;s CSI-2 interfaces. The solution has been validated in a dual-camera setup that operates at 2304 × 1296, RAW10, with two CSI-2 lanes per camera using the same Sony IMX708 12MP camera sensors found in the Raspberry Pi Camera Module 3. Besides low latency, one advantage of GMSL2 is long-range operation, and the HAT has been tested with two cameras connected over 10-meter coaxial cables. BE-IIS BE-IIS-2CAM (aka BE-IIS-GMSL2-2CAM) HAT+ specifications: Dual MIPI CSI camera output compatible with Raspberry Pi CSI interfaces Dual GMSL2 camera input 2x Rosenberger FAKRA connectors Up to 6 Gbps each PoC filter and protection per connector Analog Devices MAX96716A GMSL2 deserializer Misc Single and Dual HAT Operation 40-pin Raspberry Pi GPIO header [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/09/17/raspberry-pi-5-gets-dual-gmsl2-camera-hat-based-on-max96716a-deserializer/\">Raspberry Pi 5 gets dual GMSL2 Camera HAT based on MAX96716A deserializer<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "ENILINX TICKEY – An ESP32-S3-based color e-Paper badge with open firmware (Crowdfunding)", "source": "CNX Software", "date": "2026-09-17", "url": "https://www.cnx-software.com/2026/09/17/enilinx-tickey-esp32-s3-color-e-paper-badge-with-open-firmware/", "summary": "<div><img alt=\"TICKEY ESP32 S3 based color e Paper badge with 48 native colors\" class=\"attachment-medium size-medium wp-post-image\" height=\"480\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/09/TICKEY-ESP32-S3-based-color-e-Paper-badge-with-48-native-colors-720x480.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>ENIAC (operating as ENILINX) has launched the TICKEY, a 3.7-inch color e-Paper smart badge and desk display built around an ESP32-S3 MCU. The device features Wi-Fi, Bluetooth, and NFC connectivity, allowing users to update the screen from a smartphone without requiring continuous power to hold a static image. The display uses Modos’ color e-paper technology to deliver 48+ native colors, with refresh times as fast as 3 seconds and sunlight readability. Measuring just 3.8mm thick and weighing 45 grams, TICKEY features an aluminum-alloy body and interchangeable faceplates, and supports NFC and QR code-based web profile sharing. The standard version includes 8MB of storage, whereas the Developer Edition offers 128MB for more advanced applications. These features make it suitable for desk reminders, event identification, digital business cards, and interactive maker projects. TICKEY specifications: Wireless MCU –  ESP32-S3 Dual-core Tensilica LX7 microcontroller @ up to 240 MHz Wireless – 2.4 GHz 802.11n [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/09/17/enilinx-tickey-esp32-s3-color-e-paper-badge-with-open-firmware/\">ENILINX TICKEY &#8211; An ESP32-S3-based color e-Paper badge with open firmware (Crowdfunding)<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Abaco Systems Introduces VNX+ SBC", "source": "Embedded.com", "date": "2026-09-17", "url": "https://www.embedded.com/abaco-systems-introduces-vnx-sbc/", "summary": "<p>Abaco Systems has launched the VNX382, the company's first VNX+ single-board computer (SBC). The VNX+ standard, developed by VITA and the Open Group SOSA community and ratified by ANSI in 2026, extends the open-standard VPX into lower size, weight, and power (SWaP) applications. The VNX382 extends rugged embedded computing into SWaP-constrained applications without tradeoffs in [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/abaco-systems-introduces-vnx-sbc/\">Abaco Systems Introduces VNX+ SBC<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "Halloween Skull Tear Pumpkin Lantern #3DThursday #3DPrinting", "source": "Adafruit", "date": "2026-09-17", "url": "https://blog.adafruit.com/2026/09/17/halloween-skull-tear-pumpkin-lantern-3dthursday-3dprinting-2/", "summary": "Shared by NUKDDD on MakerWorld: A skull-tear-themed Jack-o&#8217;-lantern for LED tea lights up to 38mm. Easy to print, no supports, no AMS needed — pause at layer 464 and change color for the stem if not using the print profile. Fits Bambu Lab tea lights and other brands up to 38mm. Dark-themed pumpkin alternative to [&#8230;]"}, {"title": "Cyclops Visor ’97 Replica – X-Men Cosplay Prop #3DThursday #3DPrinting", "source": "Adafruit", "date": "2026-09-17", "url": "https://blog.adafruit.com/2026/09/17/cyclops-visor-97-replica-x-men-cosplay-prop-3dthursday-3dprinting/", "summary": "Lins shares: I designed this instantly recognizable Cyclops Visor replica inspired from the 1997 X-Men animated TV series from Marvel Comics. It is a fully wearable cosplay prop and costume accessory, and I made a neat display stand to print alongside download the files on: https://makerworld.com/en/models/3070988-cyclops-visor-97-replica-x-men-cosplay-prop Every Thursday is #3dthursday here at Adafruit! The DIY [&#8230;]"}, {"title": "Articulated Skeleton – High Detail Full-Body Figure #3DThursday #3DPrinting", "source": "Adafruit", "date": "2026-09-17", "url": "https://blog.adafruit.com/2026/09/17/articulated-skeleton-high-detail-full-body-figure-3dthursday-3dprinting/", "summary": "Shared by 3D design flexible skeleton. It&#8217;s a fun piece of toy that&#8217;s incredibly flexible, with virtually all joints capable of movement. It has become a huge hit with the kids at home! Download the files and learn more Every Thursday is #3dthursday here at Adafruit! The DIY 3D printing community has passion and dedication [&#8230;]"}, {"title": "Flexi Mummy #3DThursday #3DPrinting", "source": "Adafruit", "date": "2026-09-17", "url": "https://blog.adafruit.com/2026/09/17/flexi-mummy-3dthursday-3dprinting/", "summary": "printthis3d shares this great model for a Flexi Mummy download the files on: https://makerworld.com/en/models/3187767-flexi-mummy-articulated-legs-and-arms Every Thursday is #3dthursday here at Adafruit! The DIY 3D printing community has passion and dedication for making solid objects from digital models. Recently, we have noticed electronics projects integrated with 3D printed enclosures, brackets, and sculptures, so each Thursday we [&#8230;]"}, {"title": "STMicroelectronics reveals sizably smaller intelligent power modules for air conditioners, heat pumps, and home appliances", "source": "EE Journal", "date": "2026-09-17", "url": "https://www.eejournal.com/industry_news/stmicroelectronics-reveals-sizably-smaller-intelligent-power-modules-for-air-conditioners-heat-pumps-and-home-appliances/", "summary": "STMicroelectronics has announced small low-loss intelligent molded modules (SLLIMM) with direct-bonded copper (DBC) in a new compact outline for industrial drives, air conditioners, heat pumps and home appliances. The space-saving modules deliver a complete 600V, 3-phase IGBT inverter bridge with an 18.8mm x 32.8mm footprint, which is more than 30% smaller than existing IGBT IPM &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/stmicroelectronics-reveals-sizably-smaller-intelligent-power-modules-for-air-conditioners-heat-pumps-and-home-appliances/\">Read More &#8594;<span class=\"screen-reader-text\"> \"STMicroelectronics reveals sizably smaller intelligent power modules for air conditioners, heat pumps, and home appliances\"<\/span><\/a>"}, {"title": "TDK Ventures Invests in R3 Lithium to Accelerate US Domestic Supply of Lithium Carbonate", "source": "EE Journal", "date": "2026-09-17", "url": "https://www.eejournal.com/industry_news/tdk-ventures-invests-in-r3-lithium-to-accelerate-us-domestic-supply-of-lithium-carbonate/", "summary": "−  TDK Ventures invests in R3 Lithium, a Covington, Georgia-based company specializing in lithium carbonate recovery from recycled battery materials. −  R3 Lithium’s focus on lithium carbonate is designed to address supply reliability challenges in critical mineral supply chains. −  The partnership aims to provide access to expertise from TDK Ventures and explore technical collaboration &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/tdk-ventures-invests-in-r3-lithium-to-accelerate-us-domestic-supply-of-lithium-carbonate/\">Read More &#8594;<span class=\"screen-reader-text\"> \"TDK Ventures Invests in R3 Lithium to Accelerate US Domestic Supply of Lithium Carbonate\"<\/span><\/a>"}, {"title": "Vacuum Interrupters Introduces LRTS10 Battery-Powered 10 A Digital Micro-Ohmmeter", "source": "EE Journal", "date": "2026-09-17", "url": "https://www.eejournal.com/industry_news/vacuum-interrupters-introduces-lrts10-battery-powered-10-a-digital-micro-ohmmeter/", "summary": "Vacuum Interrupters, a leading developer of electrical test equipment and manufacturer of replacement vacuum interrupters, pole assemblies, parts, and components for medium-voltage vacuum circuit breakers and contactors, introduces the new LRTS10 low-resistance test set, the industry&#8217;s first digital micro-ohmmeter built on the Milwaukee® M18™ REDLITHIUM™ battery platform. Rather than stopping to recharge, technicians can swap in &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/vacuum-interrupters-introduces-lrts10-battery-powered-10-a-digital-micro-ohmmeter/\">Read More &#8594;<span class=\"screen-reader-text\"> \"Vacuum Interrupters Introduces LRTS10 Battery-Powered 10 A Digital Micro-Ohmmeter\"<\/span><\/a>"}, {"title": "New Agentic AI Engine Takes the Reins on Marketing Campaigns", "source": "EE Journal", "date": "2026-09-17", "url": "https://www.eejournal.com/article/new-agentic-ai-engine-takes-the-reins-on-marketing-campaigns/", "summary": "<img alt=\"\" class=\"webfeedsFeaturedVisual wp-post-image\" height=\"300\" src=\"https://www.eejournal.com/wp-content/uploads/2026/09/max-0519-image-for-home-page-thinkingai-300x300.jpg\" style=\"display: block; margin-bottom: 5px; clear: both;\" width=\"300\" />As I’ve mentioned in previous pieces, I’m constantly amazed by my ongoing discoveries of all the things I don’t know, and that’s just in the STEM (science, technology, engineering, and mathematics) domains. Things become even more dire when we consider other realms, such as marketing, public relations (PR), and sales. In a recent column—We’re All &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/article/new-agentic-ai-engine-takes-the-reins-on-marketing-campaigns/\">Read More &#8594;<span class=\"screen-reader-text\"> \"New Agentic AI Engine Takes the Reins on Marketing Campaigns\"<\/span><\/a>"}, {"title": "AAEON MIX-PTLWV1 Panther Lake industrial mini-ITX motherboard offers quad DisplayPort, dual 10GbE, and more", "source": "CNX Software", "date": "2026-09-16", "url": "https://www.cnx-software.com/2026/09/16/aaeon-mix-ptlwv1-panther-lake-industrial-mini-itx-motherboard-offers-quad-displayport-dual-10gbe/", "summary": "<div><img alt=\"Industrial Panther Lake mini ITX motherbaord\" class=\"attachment-medium size-medium wp-post-image\" height=\"539\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/05/Industrial-Panther-Lake-mini-ITX-motherbaord-720x539.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>AAEON MIX-PTLWV1 is an industrial mini-ITX motherboard based on Intel Core Ultra Series 3 &#8220;Panther Lake&#8221; processors with up to two 10GbE and two 2.5GbE RJ45 jacks, and four 4K-capable DisplayPort video outputs. The motherboard also supports up to 128GB DDR5 C/SO-DIMM memory, M.2 NVMe SSD storage, optional WiFi and Bluetooth, and/or 4G LTE/5G cellular via M.2 modules, a PCIe Gen4 x8 slot for expansion, six serial interfaces, 12V-24V wide DC input, and more. AAEON MIX-PTLWV1 specifications: SoC – Intel Panther Lake processor (PTL-H404/PTL-H484 families) with Intel Xe LPG graphics; TDP: 15 to 25W System Memory – Up to 128GB via 2x 262-pin DDR5 C/SO-DIMM sockets up to 6400MHz (H404 SKU) or 7200MHz (H484 SKU) Storage – M.2 2280 M-Key (PCIe Gen4 x4) socket for NVMe SSD Display Interfaces 4x DisplayPort 1.4 up to 4096 x 2160 @ 60Hz 40-pin LVDS/eDP co-layout connector for Default: 18/24 bit dual-channel LVDS up [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/09/16/aaeon-mix-ptlwv1-panther-lake-industrial-mini-itx-motherboard-offers-quad-displayport-dual-10gbe/\">AAEON MIX-PTLWV1 Panther Lake industrial mini-ITX motherboard offers quad DisplayPort, dual 10GbE, and more<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "OpenMANET – A higher-bandwidth Meshtastic alternative leveraging 802.11ah WiFi HaLow", "source": "CNX Software", "date": "2026-09-16", "url": "https://www.cnx-software.com/2026/09/16/openmanet-a-higher-bandwidth-meshtastic-alternative-leveraging-802-11ah-wifi-halow/", "summary": "<div><img alt=\"OpenMANET\" class=\"attachment-medium size-medium wp-post-image\" height=\"614\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/09/OpenMANET-720x614.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>OpenMANET is an open-source project for building long-range wireless mesh Mobile Ad-hoc Networks (MANETs) using Raspberry Pi SBCs and Wi-Fi HaLow (802.11ah) chips from Morse Micro. This came up when we wrote about Morse Micro USB WiFi HaLow adapters, and an X user commented that &#8220;OpenMANET is going to explode with these available, no more adapter boards or M.2 cards&#8221;. OpenMANET targets search and rescue, disaster response, airsoft events, and other off-grid or infrastructure-failed situations. So it looks like an alternative to LoRa-based Meshtastic and Meshcore, with higher bandwidth, at the cost of more expensive hardware and higher power consumption. OpenMANET supports field communications, including push-to-talk, sharing GPS positions, cameras/video streams, and ATAK (Android Team Awareness Kit) integration. The mesh network can access the Internet through a single &#8220;mesh gate&#8221; over Starlink or cellular connectivity. The project supports a range of hardware platforms including Gateworks Venice, Raspberry Pi  Zero 2 W, [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/09/16/openmanet-a-higher-bandwidth-meshtastic-alternative-leveraging-802-11ah-wifi-halow/\">OpenMANET &#8211; A higher-bandwidth Meshtastic alternative leveraging 802.11ah WiFi HaLow<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "CVITEK CV1842H-P-based edge AI camera module offers night vision and AI-ISP support (Crowdfunding)", "source": "CNX Software", "date": "2026-09-16", "url": "https://www.cnx-software.com/2026/09/16/cvitek-cv1842h-p-based-edge-ai-camera-module-offers-night-vision-and-ai-isp-support/", "summary": "<div><img alt=\"AIMORELOGY Ovis A CVITEK CV1842H P based edge AI camera module\" class=\"attachment-medium size-medium wp-post-image\" height=\"480\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/09/AIMORELOGY-Ovis-A-CVITEK-CV1842H-P-based-edge-AI-camera-module-720x480.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>The AIMORELOGY Ovis is an open-source AI vision camera module built around the CVITEK CV1842H-P SoC, with full-color 1080p night vision and 1.5 TOPS edge AI inference in a compact modular design. It is designed for drones, robotics, security systems, smart cameras, and custom embedded vision products. The camera features a compact stacked design, with a 20 × 20 mm Core board that includes the CVITEK CV1842H-P SoC, 2 Gbit NAND flash, USB, and UART debug pads. A Sensor board with the SC235HAI image sensor connects on top and also adds Ethernet and UART interfaces. An optional CVBS board goes between the Sensor board and the Ovis Core board. AIMORELOGY Ovis specifications: Ovis Core Board SoC – CVITEK CV1842H-P CPU – 1x Arm Cortex-A53 core @ 1.1 GHz, 1x RISC-V C906 core @ 800 MHz NPU – 1.5 TOPS @ INT8 with BF16 support ISP – AI-ISP with real-time 1080p [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/09/16/cvitek-cv1842h-p-based-edge-ai-camera-module-offers-night-vision-and-ai-isp-support/\">CVITEK CV1842H-P-based edge AI camera module offers night vision and AI-ISP support (Crowdfunding)<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Micron Develops Ultra-Dense 512-GB DDR5 Memory Module", "source": "Embedded.com", "date": "2026-09-16", "url": "https://www.embedded.com/micron-develops-ultra-dense-512-gb-ddr5-memory-module/", "summary": "<p>Micron Technology Inc. has demonstrated a 512-GB DDR5 Registered DIMM (RDIMM) across multiple server platforms, targeting the growing memory requirements of AI, data analytics, in-memory databases, and other data-intensive workloads. Claiming the industry's first 512-GB DDR5 module, the company says the module can reach speeds of up to 9,200 MT/s, while reducing operating power by [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/micron-develops-ultra-dense-512-gb-ddr5-memory-module/\">Micron Develops Ultra-Dense 512-GB DDR5 Memory Module<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "MIPI Alliance Forms Kinematics Working Group", "source": "Embedded.com", "date": "2026-09-16", "url": "https://www.embedded.com/mipi-alliance-forms-kinematics-working-group/", "summary": "<p>The new working group will develop a specification to standardize the streaming format for radar and LiDAR sensor data.<\/p>\n<p>The post <a href=\"https://www.embedded.com/mipi-alliance-forms-kinematics-working-group/\">MIPI Alliance Forms Kinematics Working Group<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "Automotive MCUs for Next Gen eMobility, Automotive E/E Architectures and AI – Infineon and Mouser Electronics", "source": "EE Journal", "date": "2026-09-16", "url": "https://www.eejournal.com/chalk_talks/automotive-mcus-for-next-gen-emobility-automotive-e-e-architectures-and-ai-infineon-and-mouser-electronics/", "summary": "&#160; In this episode of Chalk Talk, Andres Zavala from Infineon and Amelia Dalton explore how zonal architectures can simplify wiring, improve scalability, and create a more adaptable foundation for Software-Defined Vehicles. They also investigate the role of emerging technologies in this transition, including RRAM-based nonvolatile memory and integrated parallel processing units for artificial intelligence &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/chalk_talks/automotive-mcus-for-next-gen-emobility-automotive-e-e-architectures-and-ai-infineon-and-mouser-electronics/\">Read More &#8594;<span class=\"screen-reader-text\"> \"Automotive MCUs for Next Gen eMobility, Automotive E/E Architectures and AI &#8211; Infineon and Mouser Electronics\"<\/span><\/a>"}, {"title": "Alif Semi Balletto B1 and Ensemble E1C StartKits feature Cortex-M55 + Ethos-U55 MCU for IoT and Edge AI", "source": "CNX Software", "date": "2026-09-15", "url": "https://www.cnx-software.com/2026/09/15/alif-semi-balletto-b1-and-ensemble-e1c-startkits-feature-cortex-m55-ethos-u55-mcu-for-iot-and-edge-ai/", "summary": "<div><img alt=\"Ensemble E1C (SK E1C) and Balletto B1 (SK B1) StartKits\" class=\"attachment-medium size-medium wp-post-image\" height=\"480\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/09/Ensemble-E1C-SK-E1C-and-Balletto-B1-SK-B1-StartKits-720x480.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Alif Semiconductor’s Ensemble E1C (SK-E1C) and Balletto B1 (SK-B1) StartKits are low-cost development boards built around the company&#8217;s Cortex-M55 + Ethos-U55 microcontrollers. The Balletto B1 adds BLE 5.3 and 802.15.4 wireless connectivity, while the Ensemble E1C does not have built-in wireless connectivity. Both StartKits feature a microcontroller with a 160MHz Cortex-M55 CPU, an Ethos-U55 NPU, 2MB SRAM, and 1.8/1.9MB NVM. They also include an Arducam camera header, a mikroBUS Click Board expansion socket, and two PDM microphones for camera, audio, and sensor-based projects. The Balletto B1 additionally provides the complete RF path to a chip antenna for its wireless subsystem, while both boards feature an on-board Segger J-Link debugger for development and testing. Alif Semiconductor StartKit (SK-B1 and SK-E1C) specifications: MCU SK-E1C – Alif Semiconductor Ensemble E1C  SK-B1 – Alif Semiconductor Balletto B1  CPU – Arm Cortex-M55 core with Helium-M Vector Extension @ up to 160 MHz NPU – Arm [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/09/15/alif-semi-balletto-b1-and-ensemble-e1c-startkits-feature-cortex-m55-ethos-u55-mcu-for-iot-and-edge-ai/\">Alif Semi Balletto B1 and Ensemble E1C StartKits feature Cortex-M55 + Ethos-U55 MCU for IoT and Edge AI<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Design in KiCad, Quote with AIVON: A Faster Path to PCB Prototyping (Sponsored)", "source": "CNX Software", "date": "2026-09-15", "url": "https://www.cnx-software.com/2026/09/15/design-in-kicad-quote-with-aivon-a-faster-path-to-pcb-prototyping/", "summary": "<div><img alt=\"AIVON KiCad Plugin\" class=\"attachment-medium size-medium wp-post-image\" height=\"405\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/09/AIVON-KiCad-Plugin-720x405.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Finished your PCB layout in KiCad? You don&#8217;t necessarily need to leave the PCB Editor, export a separate set of manufacturing files, and manually upload them to a PCB manufacturer. AIVON&#8217;s KiCad Plugin creates a direct path from your PCB design to an online PCB quote. AIVON has integrated an official KiCad plugin that connects a finished PCB layout to the company’s online quotation page. After DRC, users can click the plugin in the PCB Editor, automatically prepare manufacturing data, and land on a pre-filled quote form instead of exporting, zipping, and uploading files by hand. Rather than introducing a new plugin framework, AIVON&#8217;s integration leverages KiCad&#8217;s existing Plugin and Content Manager ecosystem. For developers who already use KiCad for schematic capture and PCB layout, the integration provides another way to connect the design stage with PCB fabrication without manually repeating every manufacturing-file preparation step. Connecting KiCad PCB Design with [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/09/15/design-in-kicad-quote-with-aivon-a-faster-path-to-pcb-prototyping/\">Design in KiCad, Quote with AIVON: A Faster Path to PCB Prototyping (Sponsored)<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Tektronix Launches Dynamic Test System for 800-V AI Data Centers", "source": "Embedded.com", "date": "2026-09-15", "url": "https://www.embedded.com/tektronix-launches-dynamic-test-system-for-800-v-ai-data-centers/", "summary": "<p>Tektronix Inc. has introduced the EA-ELR 21000 Dynamic Test System, a high-dynamic, auto-ranging electronic load platform designed to validate the ±400-V and 800-V DC power architectures emerging in AI data centers. The system combines rapid load emulation with a fully regenerative architecture, allowing it to return absorbed test energy to the grid rather than dissipate [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/tektronix-launches-dynamic-test-system-for-800-v-ai-data-centers/\">Tektronix Launches Dynamic Test System for 800-V AI Data Centers<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "MediaTek Unveils New Flagship Smartphone Chip", "source": "Embedded.com", "date": "2026-09-15", "url": "https://www.embedded.com/mediatek-unveils-new-flagship-smartphone-chip/", "summary": "<p>The Dimensity 9600 Pro smartphone SoC reduces multi-core power consumption by 61%.<\/p>\n<p>The post <a href=\"https://www.embedded.com/mediatek-unveils-new-flagship-smartphone-chip/\">MediaTek Unveils New Flagship Smartphone Chip<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "ESD eBook September/October 2026: Rethinking Mil/Aero System Design", "source": "Embedded.com", "date": "2026-09-15", "url": "https://www.embedded.com/esd-ebook-september-october-2026-rethinking-mil-aero-system-design/", "summary": "<p>Embedded engineers designing military and aerospace systems traditionally have built hardware devices and systems around the need for ruggedness and military-grade components to ensure operation in harsh environments while meeting size, weight, and power (SWaP) budgets. As mission-critical systems from electronic warfare equipment to military drones become more intelligent and complex, designers face challenges around [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/esd-ebook-september-october-2026-rethinking-mil-aero-system-design/\">ESD eBook September/October 2026: Rethinking Mil/Aero System Design<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "Morse Micro Wi-Fi HaLow USB adapters add 802.11ah connectivity to PCs and routers", "source": "CNX Software", "date": "2026-09-14", "url": "https://www.cnx-software.com/2026/09/14/morse-micro-wi-fi-halow-usb-adapters-add-802-11ah-connectivity-to-pcs-and-routers/", "summary": "<div><img alt=\"Morse Micro’s Wi Fi HaLow USB Network Adapters in USB A and USB C form factors\" class=\"attachment-medium size-medium wp-post-image\" height=\"504\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/09/Morse-Micros-Wi-Fi-HaLow-USB-Network-Adapters-in-USB-A-and-USB-C-form-factors-720x504.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Last year, we saw Morse Micro introduce the MM8108 Wi-Fi HaLow (802.11ah) SoC with up to 43.33 Mbps throughput, along with an MM8108-RD09 USB dongle reference design, for which we had virtually no details at the time. Morse Micro has now released USB-A and USB-C Wi-Fi HaLow adapters based on that reference design. The adapters let PCs and routers connect to 802.11ah networks through USB without a dedicated expansion card and feature an external SMA antenna delivering up to 26 dBm transmit power. Wi-Fi HaLow USB network adapter specifications: SoC – Morse Micro MM8108 32-bit RISC-V Host Applications Processor (HAP) Standard – IEEE802.11ah Wi-Fi HaLow Frequency band – 850-950 MHz (Worldwide sub-1 GHz license-exempt range) Operating Modes – Access Point (AP) and Station (STA). Channel Width – 1/2/4/8 MHz Modulation – BPSK, QPSK, 16QAM, 64QAM, 256QAM. Data rate – Up to 43.3 Mbps using 256-QAM modulation at an 8 MHz bandwidth [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/09/14/morse-micro-wi-fi-halow-usb-adapters-add-802-11ah-connectivity-to-pcs-and-routers/\">Morse Micro Wi-Fi HaLow USB adapters add 802.11ah connectivity to PCs and routers<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Eggtronic, Renesas Target 140-W USB-C Chargers with GaN", "source": "Embedded.com", "date": "2026-09-14", "url": "https://www.embedded.com/eggtronic-renesas-target-140-w-usb-c-chargers-with-gan/", "summary": "<p>Eggtronic has introduced a 140-W USB-C Power Delivery AC/DC reference platform for premium laptops and other high-performance USB-C-powered equipment. The design combines Eggtronic's EPIC digital power architecture with Renesas Electronic Corp.'s high-voltage GaN technology to target high efficiency, reduced component count, and competitive system cost. The reference design uses Renesas' TP70H150G4LSG, a 700-V GaN transistor [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/eggtronic-renesas-target-140-w-usb-c-chargers-with-gan/\">Eggtronic, Renesas Target 140-W USB-C Chargers with GaN<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "Designing SWaP-Optimized Compute for UAVs", "source": "Embedded.com", "date": "2026-09-14", "url": "https://www.embedded.com/designing-swap-optimized-compute-for-uavs/", "summary": "<p>The embedded architecture of unmanned aerial vehicles (UAVs) is changing as more intelligence moves from the remote operator onto the aircraft itself. In a conventional, first-person-view drone, a human analyzes the video feed, determines where the aircraft should go, and makes many of the decisions required to complete the mission. But the architecture depends on [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/designing-swap-optimized-compute-for-uavs/\">Designing SWaP-Optimized Compute for UAVs<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}], "papers": [], "repos": [{"repo": "harvard-edge/cs249r_book", "stars": 28359, "language": "Python", "description": "Machine Learning Systems: Founda const fmt = n => n>=1e6?(n/1e6).toFixed(1)+'M':n>=1000?(n/1000).toFixed(1)+'K':String(n);
const truncWords=(t,n=100)=>{if(!t)return'';const w=t.trim().split(/\s+/);return w.length<=n?t:w.slice(0,n).join(' ')+'…';};

/* ── stars (persist across data refreshes via localStorage, keyed by URL) ── */
const keyOf = x => x.url||x.pdf_url||titleOf(x);
let STARS = new Set(JSON.parse(localStorage.getItem('hub-stars')||'[]'));
const isStarred = x => STARS.has(keyOf(x));
function toggleStar(k) {
  if (STARS.has(k)) STARS.delete(k); else STARS.add(k);
  localStorage.setItem('hub-stars', JSON.stringify([...STARS]));
}
function starredRows() { return allRows().filter(isStarred); }


function hrefOf(x) {
  if (x.pdf_url) {
    const m=x.pdf_url.match(/arxiv\.org\/(?:pdf|abs)\/([0-9]+\.[0-9]+)/);
    if (m) return 'https://arxiv.org/abs/'+m[1];
  }
  if (x.url) return x.url;
  if (x.pdf_url) return x.pdf_url;
  if (x.source && /^https?:\/\//.test(x.source)) return x.source;
  return '#';
}

function cutoff(r) {
  if (r==='all') return '';
  const d=new Date();
  if (r==='today') d.setHours(0,0,0,0);
  else if (r==='7d')  d.setDate(d.getDate()-7);
  else if (r==='30d') d.setDate(d.getDate()-30);
  else if (r==='90d') d.setDate(d.getDate()-90);
  return d.toISOString().slice(0,10);
}

function colorOf(k) { return SRC_COLOR[k]||(TOPICS[k]&&TOPICS[k].color)||'#818cf8'; }
function labelOf(k) { return SRC_LABEL[k]||(TOPICS[k]&&TOPICS[k].label)||k; }
function iconOf(k)  { return SRC_ICON[k]||(TOPICS[k]&&TOPICS[k].icon)||'•'; }

/* ── rows ── */
function allRows() {
  return Object.entries(data).flatMap(([k,rows])=>rows.filter(x=>!isSeed(x)).map(x=>( {...x,_k:k} )));
}
function rowsFor(ds) {
  if (ds==='starred') return starredRows();
  if (TOPICS[ds]) {
    const t=TOPICS[ds];
    return (data.papers||[]).filter(x=>{
      if (isSeed(x)) return false;
      const txt=(x.title+' '+(x.summary||'')).toLowerCase();
      return t.kw.some(k=>txt.includes(k));
    }).map(x=>( {...x,_k:ds} ));
  }
  return ds==='all'?allRows():(data[ds]||[]).filter(x=>!isSeed(x)).map(x=>( {...x,_k:ds} ));
}
function filtered() {
  const q=state.q.trim().toLowerCase(), from=cutoff(state.dr);
  let rows=rowsFor(state.ds);
  if (q) rows=rows.filter(x=>JSON.stringify(x).toLowerCase().includes(q));
  if (from) rows=rows.filter(x=>dateOf(x)>=from);
  return rows.sort((a,b)=>{
    if (state.sort==='score') return scoreOf(b)-scoreOf(a);
    if (state.sort==='alpha') return titleOf(a).localeCompare(titleOf(b));
    return dateOf(b).localeCompare(dateOf(a));
  });
}

/* ── render stats (with count-up) ── */
let lastDs='';
function renderStats() {
  const rows=rowsFor(state.ds);
  const scored=rows.filter(x=>scoreOf(x)>0).length;
  const jobs=rows.filter(x=>x._k==='jobs').length;
  const latest=rows.map(dateOf).filter(Boolean).sort().pop()||'—';
  const items=[
    ['⚡','Total Signals',rows.length,'#818cf8'],
    ['🎯','Scored Items',scored,'#38bdf8'],
    ['💼','Job Postings',jobs,'#34d399'],
    ['📅','Latest',latest,'#fbbf24'],
  ];
  document.getElementById('stats').innerHTML = items.map(([ico,lbl,val,col])=>`
    <div class="stat" style="--sc:${col}">
      <span class="stat-ico">${ico}</span>
      <div class="stat-lbl">${lbl}</div>
      <div class="stat-num" data-target="${typeof val==='number'?val:''}"
           style="${String(val).length>8?'font-size:15px;margin-top:8px':''}">
        ${typeof val==='number'?'0':esc(String(val))}
      </div>
    </div>`).join('');

  /* stat hover handled by CSS lift */

  /* count-up */
  const doCount = state.ds!==lastDs;
  lastDs=state.ds;
  document.querySelectorAll('.stat-num[data-target]').forEach(el=>{
    const t=Number(el.dataset.target);
    if (!t) return;
    if (!doCount) { el.textContent=t.toLocaleString(); return; }
    const dur=1400, s=performance.now();
    const tick=now=>{
      const p=Math.min((now-s)/dur,1), ease=1-Math.pow(1-p,3);
      el.textContent=Math.round(ease*t).toLocaleString();
      if (p<1) requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  });
}

/* ── pagination ── */
function pageWin(c,t) {
  const s=Math.max(1,c-2),e=Math.min(t,c+2);
  const ps=[];
  for(let p=s;p<=e;p++) ps.push(p);
  if(!ps.includes(1)){ if(ps[0]>2) ps.unshift('…'); ps.unshift(1); }
  if(!ps.includes(t)){ if(ps[ps.length-1]<t-1) ps.push('…'); ps.push(t); }
  return ps;
}
function renderPag(tot) {
  const el=document.getElementById('pages');
  el.innerHTML=[
    `<button class="pgb" data-p="${state.page-1}" ${state.page===1?'disabled':''}>‹ Prev</button>`,
    ...pageWin(state.page,tot).map(p=>p==='…'
      ?`<button class="pgb" disabled>…</button>`
      :`<button class="pgb${p===state.page?' on':''}" data-p="${p}">${p}</button>`),
    `<button class="pgb" data-p="${state.page+1}" ${state.page===tot?'disabled':''}>Next ›</button>`,
  ].join('');
  el.querySelectorAll('.pgb:not([disabled])').forEach(b=>b.addEventListener('click',()=>{
    const p=Number(b.dataset.p);
    if(p&&p!==state.page){ state.page=p; render(); document.querySelector('.panel').scrollIntoView({behavior:'smooth',block:'start'}); }
  }));
}

/* ── main render ── */
function render() {
  const isAdv = state.ds==='__adv__';
  document.getElementById('pageTitle').textContent =
    isAdv?(state.advMod?ADV_MODS.find(m=>m.id===state.advMod)?.label||'Advanced':'🚀 Advanced Intelligence')
    :SRC_LABEL[state.ds]||(TOPICS[state.ds]&&TOPICS[state.ds].label)||state.ds;
  renderNav();
  document.getElementById('mainPanel').style.display = isAdv?'none':'';
  document.getElementById('stats').style.display = isAdv?'none':'';
  document.getElementById('advWrap').style.display = isAdv?'':'none';
  if (isAdv) { renderAdvanced(); return; }
  renderStats();
  const rows=filtered();
  const tot=Math.max(1,Math.ceil(rows.length/state.size));
  state.page=Math.min(state.page,tot);
  const s=(state.page-1)*state.size;
  const slice=rows.slice(s,s+state.size);
  document.getElementById('resultCount').textContent=
    rows.length.toLocaleString()+' result'+(rows.length!==1?'s':'');
  document.getElementById('pageStatus').textContent=`Page ${state.page} of ${tot}`;
  document.getElementById('rangeStatus').textContent=rows.length
    ?`Showing ${s+1}–${s+slice.length} of ${rows.length}`:'No results';
  const feed=document.getElementById('feed');
  feed.className='feed '+(state.view==='grid'?'grid-v':'list-v');
  feed.innerHTML=slice.length?slice.map(itemHtml).join('')
    :`<div class="empty">
        <div class="empty-ico">🔭</div>
        <h3>No matching signals</h3>
        <p>Try adjusting your search or selecting a different category.</p>
      </div>`;
  renderPag(tot);
  addTilts();
}

/* ══════════════════════════════════════════
   NEURAL NETWORK BACKGROUND ANIMATION
══════════════════════════════════════════ */
(function() {
  const canvas=document.getElementById('bgCanvas');
  const ctx=canvas.getContext('2d');
  let W,H;
  function resize(){ W=canvas.width=window.innerWidth; H=canvas.height=window.innerHeight; }
  window.addEventListener('resize',resize); resize();

  const N=40, MAXD=150;
  const PCOLORS=['rgba(124,58,237,','rgba(99,102,241,','rgba(129,140,248,','rgba(14,165,233,'];
  const nodes=Array.from({length:N},()=>{
    const c=PCOLORS[Math.floor(Math.random()*PCOLORS.length)];
    return {
      x:Math.random()*window.innerWidth,
      y:Math.random()*window.innerHeight,
      vx:(Math.random()-.5)*.32,
      vy:(Math.random()-.5)*.32,
      r:Math.random()*1.8+.6,
      c, ph:Math.random()*Math.PI*2,
      ps:.008+Math.random()*.014,
    };
  });

  let mx=-2000,my=-2000;
  window.addEventListener('mousemove',e=>{ mx=e.clientX; my=e.clientY; });

  function frame() {
    ctx.clearRect(0,0,W,H);
    nodes.forEach(n=>{
      n.x+=n.vx; n.y+=n.vy; n.ph+=n.ps;
      if(n.x<0||n.x>W) n.vx*=-1;
      if(n.y<0||n.y>H) n.vy*=-1;
      n.x=Math.max(0,Math.min(W,n.x));
      n.y=Math.max(0,Math.min(H,n.y));
      const dx=n.x-mx,dy=n.y-my,md=Math.sqrt(dx*dx+dy*dy);
      if(md<110){ n.vx+=(dx/md)*.012; n.vy+=(dy/md)*.012; }
      n.vx=Math.max(-.7,Math.min(.7,n.vx*.997));
      n.vy=Math.max(-.7,Math.min(.7,n.vy*.997));
      const p=.35+Math.sin(n.ph)*.18;
      /* glow halo */
      const g=ctx.createRadialGradient(n.x,n.y,0,n.x,n.y,n.r*5);
      g.addColorStop(0,n.c+(p*.7)+')');
      g.addColorStop(1,n.c+'0)');
      ctx.beginPath(); ctx.arc(n.x,n.y,n.r*5,0,Math.PI*2);
      ctx.fillStyle=g; ctx.fill();
      /* core */
      ctx.beginPath(); ctx.arc(n.x,n.y,n.r,0,Math.PI*2);
      ctx.fillStyle=n.c+(p*1.4)+')'; ctx.fill();
    });
    /* connections */
    for(let i=0;i<N;i++) for(let j=i+1;j<N;j++) {
      const dx=nodes[i].x-nodes[j].x, dy=nodes[i].y-nodes[j].y;
      const d=Math.sqrt(dx*dx+dy*dy);
      if(d<MAXD) {
        const a=(1-d/MAXD)*.14;
        ctx.beginPath();
        ctx.moveTo(nodes[i].x,nodes[i].y);
        ctx.lineTo(nodes[j].x,nodes[j].y);
        ctx.strokeStyle=`rgba(129,140,248,${a})`;
        ctx.lineWidth=.7; ctx.stroke();
      }
    }
    requestAnimationFrame(frame);
  }
  frame();
})();

/* ══════════════════════════════════════════
   AUTO-REFRESH COUNTDOWN (every 6 hours)
══════════════════════════════════════════ */
(function() {
  const SIX_H=6*60*60*1000;
  const end=Date.now()+SIX_H;
  const updEl=document.getElementById('nextUpd');
  const progEl=document.getElementById('refProg');

  function tick() {
    const left=end-Date.now();
    if(left<=0){ location.reload(); return; }
    const h=Math.floor(left/3600000);
    const m=Math.floor((left%3600000)/60000);
    const s=Math.floor((left%60000)/1000);
    if(updEl) updEl.textContent=`Refresh in ${h}h ${m}m ${s}s`;
    if(progEl) progEl.style.width=((left/SIX_H)*100).toFixed(2)+'%';
  }
  tick();
  setInterval(tick,1000);
  setTimeout(()=>location.reload(),SIX_H);
})();

const ALL_TEXT = (arr) => arr.filter(x=>!isSeed(x)).map(x=>JSON.stringify(x).toLowerCase());

function mktScore(k) {
  const kws=MKTS[k].kw;
  const has=txt=>kws.some(w=>txt.includes(w));
  const papers   =(data.papers||[]).filter(x=>!isSeed(x)&&has((x.title+' '+(x.summary||'')).toLowerCase())).length;
  const news     =[...(data.aiNews||[]),...(data.physicalAiNews||[]),...(data.roboticsNews||[]),...(data.embeddedNews||[])].filter(x=>!isSeed(x)&&has(JSON.stringify(x).toLowerCase())).length;
  const funding  =(data.funding||[]).filter(x=>!isSeed(x)&&has(JSON.stringify(x).toLowerCase())).length;
  const jobs     =(data.jobs||[]).filter(x=>!isSeed(x)&&has(JSON.stringify(x).toLowerCase())).length;
  const repos    =(data.repos||[]).filter(x=>!isSeed(x)&&has(JSON.stringify(x).toLowerCase())).length;
  const models   =(data.models||[]).filter(x=>!isSeed(x)&&has(JSON.stringify(x).toLowerCase())).length;
  const companies=(data.companies||[]).filter(x=>!isSeed(x)&&has(JSON.stringify(x).toLowerCase())).length;
  const research = papers*3+repos*2+models*2;
  const commercial= funding*5+companies*4;
  const demand = news*2+jobs*1;
  const total = research+commercial+demand;
  const momentum = Math.min(99,research*2+demand*3);
  const competition= Math.min(99,commercial*4);
  const opp = Math.min(99,Math.max(1,research*3+demand*2-competition*0.5+10));
  const gap = Math.max(0,research - commercial);
  return {papers,news,funding,jobs,repos,models,companies,research,commercial,demand,total,momentum,competition,opp,gap};
}

/* ── helper: bar HTML ── */
function bar(label,pct,color) {
  return `<div class="adv-bar-row">
    <span class="adv-bar-lbl">${label}</span>
    <div class="adv-bar"><div class="adv-bar-fill" style="width:${pct}%;background:${color||'var(--acc)'}"></div></div>
    <span style="font-size:11px;color:var(--t3);width:30px;text-align:right;flex-shrink:0">${Math.round(pct)}</span>
  </div>`;
}

/* ── Module: GapFinder ── */
function advGapFinder() {
  const SUGGESTED = {
    humanoid:'Humanoid Robot OS / Middleware Platform',vla:'VLA Fine-Tuning & Deployment API',
    worldModel:'World Model Evaluation Framework',synData:'Synthetic Training Data Marketplace',
    robotInfra:'Robot Fleet Monitoring & Orchestration',embodied:'Embodied AI Simulation Cloud',
    manipulation:'Dexterous Hand Teleop & Data Platform',locomotion:'Legged Robot Trail Dataset Hub',
    agents:'Embodied Agent Evaluation Suite',evalBench:'Open Physical Robot Benchmark',
    dataInfra:'Robot Demonstration Collection Platform',multimodal:'Embodied Multimodal Foundation API',
  };
  const MARKET_SIZE = {
    humanoid:'$38B by 2035',vla:'$2.4B by 2028',worldModel:'$5B by 2030',synData:'$1.8B by 2027',
    robotInfra:'$12B by 2030',embodied:'$22B by 2032',manipulation:'$8B by 2029',locomotion:'$4.5B by 2029',
    agents:'$47B by 2030',evalBench:'$800M by 2028',dataInfra:'$6B by 2029',multimodal:'$15B by 2030',
  };
  const gaps=Object.entries(MKTS).map(([k,m])=>{
    const s=mktScore(k);
    const gapScore=Math.min(99,Math.max(1,s.papers*4+s.news*2+s.jobs*3-s.funding*6-s.models*3+5));
    return {k,m,s,gapScore,suggested:SUGGESTED[k]||'TBD',mktSize:MARKET_SIZE[k]||'Est. $1B+'};
  }).sort((a,b)=>b.gapScore-a.gapScore);
  return `
  <div class="adv-metrics">
    <div class="adv-metric"><div class="adv-metric-n">${gaps.filter(g=>g.gapScore>60).length}</div><div class="adv-metric-l">High-Value Gaps</div></div>
    <div class="adv-metric"><div class="adv-metric-n">${gaps[0].gapScore}</div><div class="adv-metric-l">Top Gap Score</div></div>
    <div class="adv-metric"><div class="adv-metric-n">${gaps.reduce((a,g)=>a+g.s.papers,0)}</div><div class="adv-metric-l">Papers w/ No Product</div></div>
    <div class="adv-metric"><div class="adv-metric-n">${Object.keys(MKTS).length}</div><div class="adv-metric-l">Markets Scanned</div></div>
  </div>
  <div class="adv-panel">
    <div class="adv-panel-hdr">🔍 Identified Market Gaps — Research exists, solutions do not</div>
    <ul class="adv-list">
      ${gaps.map((g,i)=>`
        <li class="adv-item">
          <div class="adv-rank" style="background:${g.m.color}22;color:${g.m.color}">${i+1}</div>
          <div class="adv-item-body">
            <div class="adv-item-title">${g.m.icon} ${g.m.label} Gap</div>
            <div class="adv-item-sub">
              <strong>Suggested startup:</strong> ${g.suggested}<br>
              <strong>Est. market:</strong> ${g.mktSize}
            </div>
            ${bar('Gap Score',g.gapScore,g.m.color)}
            ${bar('Research Depth',Math.min(99,g.s.papers*8),'#34d399')}
            ${bar('Commercial Vacuum',Math.min(99,Math.max(0,100-g.s.commercial*8)),'#fbbf24')}
            <div class="adv-scores">
              <span class="adv-tag adv-tag-green">📄 ${g.s.papers} papers</span>
              <span class="adv-tag adv-tag-red">🏢 ${g.s.companies} companies</span>
              <span class="adv-tag adv-tag-blue">💼 ${g.s.jobs} open roles</span>
            </div>
          </div>
          <div style="text-align:right;flex-shrink:0;padding-top:2px">
            <div style="font-size:28px;font-weight:900;color:${g.m.color}">${g.gapScore}</div>
            <div style="font-size:10px;color:var(--muted)">gap score</div>

function advStartupValidatorBind() {
  const btn=document.getElementById('val-run');
  if(!btn) return;
  btn.addEventListener('click',()=>{
    const idea=(document.getElementById('val-idea').value||'').toLowerCase();
    const mkt=(document.getElementById('val-market').value||'').toLowerCase();
    const combined=idea+' '+mkt;
    let bestMkt=null, bestScore=0;
    Object.entries(MKTS).forEach(([k,m])=>{
      const s=mktScore(k);
      if(m.kw.some(w=>combined.includes(w.split(' ')[0]))){
        if(s.opp>bestScore){bestScore=s.opp;bestMkt={k,m,s};}
      }
    });
    if(!bestMkt) { const e=Object.entries(MKTS).map(([k,m])=>{return{k,m,s:mktScore(k)};}); bestMkt=e.sort((a,b)=>b.s.opp-a.s.opp)[0]; }
    const s=bestMkt.s;
    const valScore=Math.min(97,s.opp+s.demand-s.competition*0.3+Math.floor(Math.random()*10)+10);
    const r=document.getElementById('val-result');
    r.className='adv-result show';
    r.innerHTML=`
      <div style="font-size:15px;font-weight:800;margin-bottom:14px">Validation Results for: <span style="color:var(--acc)">${esc(document.getElementById('val-idea').value.slice(0,60))}</span></div>
      <div class="adv-grid2">
        <div class="adv-kv"><div class="adv-kv-k">Validation Score</div><div class="adv-kv-v" style="color:${valScore>75?'#34d399':'#fbbf24'}">${valScore}/100</div></div>
        <div class="adv-kv"><div class="adv-kv-k">Closest Market</div><div class="adv-kv-v" style="font-size:14px">${bestMkt.m.icon} ${bestMkt.m.label}</div></div>
        <div class="adv-kv"><div class="adv-kv-k">Research Activity</div><div class="adv-kv-v">${s.papers} papers</div></div>
        <div class="adv-kv"><div class="adv-kv-k">Funding Activity</div><div class="adv-kv-v">${s.funding} rounds</div></div>
        <div class="adv-kv"><div class="adv-kv-k">Hiring Demand</div><div class="adv-kv-v">${s.jobs} jobs</div></div>
        <div class="adv-kv"><div class="adv-kv-k">Competition Level</div><div class="adv-kv-v" style="color:${s.competition<40?'#34d399':'#f87171'}">${s.competition<30?'Low':s.competition<60?'Medium':'High'}</div></div>
      </div>
      <div style="margin-top:14px">
        ${bar('Market Opportunity',s.opp,'#34d399')}
        ${bar('Demand Signals',Math.min(99,s.demand*4),'#60a5fa')}
        ${bar('Competition',s.competition,'#f87171')}
        ${bar('Tech Readiness',Math.min(99,s.papers*5),'#a78bfa')}
      </div>
      <div style="margin-top:14px;padding:12px;background:var(--apale);border-radius:var(--rsm);font-size:13px;color:var(--t2)">
        <strong style="color:var(--acc)">💡 Verdict:</strong>
        ${valScore>80?'Strong signal — research activity and demand both point to this being a viable market. Build the MVP now.'
          :valScore>60?'Moderate signal — the market exists but competition is growing. Differentiation will be key.'
          :'Early market — you are ahead of the curve. High risk, high reward. Find early design partners first.'}
      </div>`;
  });
}

function advBuilderMatchBind() {
  const btn=document.getElementById('bm-run');
  if(!btn) return;
  btn.addEventListener('click',()=>{
    const SKILLS_ARR=['ml','robotics','fullstack','cloud','hardware','cv','nlp','sim','biz','design','data','pm'];
    const MARKET_SKILLS={
      humanoid:['robotics','hardware','ml','sim'],vla:['ml','cv','robotics','data'],
      worldModel:['ml','sim','cv'],synData:['sim','data','cloud'],
      robotInfra:['cloud','fullstack','robotics'],embodied:['ml','robotics','cv'],
      manipulation:['robotics','hardware','ml'],locomotion:['robotics','hardware','sim'],

      dataInfra:['cloud','data','fullstack'],multimodal:['ml','cv','data'],

    const budget=Number(document.getElementById('bm-budget').value)||0;
    if(!selected.length){alert('Please select at least one skill.'); return;}
    const breadth=selected.length/SKILLS_ARR.length;
    const depth=selected.length>=4?1:selected.length/4;
    const timeBonus=Math.min(1,time/40);
    const budgetBonus=budget>0?Math.min(0.3,budget/1000000*0.3):0;
    const gpa=Math.min(4.0,((breadth*0.35+depth*0.4+timeBonus*0.25)*4+budgetBonus)).toFixed(2);
    const matched=Object.entries(MKTS).map(([k,m])=>{
      const req=({...{humanoid:['robotics','hardware','ml','sim'],vla:['ml','cv','robotics','data'],worldModel:['ml','sim','cv'],synData:['sim','data','cloud'],robotInfra:['cloud','fullstack','robotics'],embodied:['ml','robotics','cv'],manipulation:['robotics','hardware','ml'],locomotion:['robotics','hardware','sim'],agents:['nlp','ml','fullstack'],evalBench:['robotics','ml','data'],dataInfra:['cloud','data','fullstack'],multimodal:['ml','cv','data']}})[k]||[];
      const overlap=req.filter(r=>selected.includes(r)).length;
      const matchPct=Math.round((overlap/Math.max(req.length,1))*100);

      return {k,m,matchPct,opp:s.opp};

    const gaps=selected.length<6?['Consider adding ' + (['hardware','cloud','biz'].filter(s=>!selected.includes(s)).slice(0,2).join(' and ') || 'complementary skills')]:[];
    const r=document.getElementById('bm-result');
    r.className='adv-result show';
    r.innerHTML=`
      <div style="text-align:center;margin-bottom:16px">
        <div style="font-size:48px;font-weight:900;color:var(--acc)">${gpa}</div>
        <div style="font-size:14px;color:var(--t2)">Founder GPA</div>
        <div style="font-size:12px;color:var(--muted);margin-top:4px">${gpa>=3.7?'🔥 Exceptional — you have what it takes to ship fast':gpa>=3.0?'⚡ Strong — solid foundation, identify co-founders for gaps':'💡 Good start — partner up in weak areas'}</div>
      </div>

            <div class="adv-bar" style="height:5px;margin-top:4px"><div class="adv-bar-fill" style="width:${m.matchPct}%;background:${m.m.color}"></div></div>

/* ── Module: ProblemMine ── */
function advProblemMine() {
  const MARKERS=['challenge','problem','limitation','lack of','difficult','lacking','absence of','gap in','fail to','struggle','insufficient','unable to','barrier'];
  const problems=[];
  const allSrc=[...(data.papers||[]),...(data.aiNews||[]),...(data.roboticsNews||[]),...(data.physicalAiNews||[])].filter(x=>!isSeed(x));
  allSrc.forEach(x=>{
    const text=plain(x.summary||x.description||'');
    if(!text) return;
    const sentences=text.split(/[.!?]/).map(s=>s.trim()).filter(s=>s.length>20&&s.length<200);
    sentences.forEach(s=>{
      const sl=s.toLowerCase();
      if(MARKERS.some(m=>sl.includes(m))){
        problems.push({problem:s,source:titleOf(x),url:hrefOf(x),date:dateOf(x),
          opp:50+Math.floor(Math.random()*45)});
      }
    });
  });
  const unique=problems.filter((p,i)=>problems.findIndex(q=>q.problem.slice(0,30)===p.problem.slice(0,30))===i);
  const top=unique.sort((a,b)=>b.opp-a.opp).slice(0,20);
  return `
  <div class="adv-metrics">
    <div class="adv-metric"><div class="adv-metric-n">${top.length}</div><div class="adv-metric-l">Problems Found</div></div>
    <div class="adv-metric"><div class="adv-metric-n">${top.filter(p=>p.opp>=80).length}</div><div class="adv-metric-l">High-Value</div></div>
    <div class="adv-metric"><div class="adv-metric-n">${new Set(top.map(p=>p.date.slice(0,7))).size}</div><div class="adv-metric-l">Date Ranges</div></div>
    <div class="adv-metric"><div class="adv-metric-n">Live</div><div class="adv-metric-l">Data Source</div></div>
  </div>
  <div class="adv-panel">
    <div class="adv-panel-hdr">⛏️ Real problems extracted from research papers & news</div>
    <ul class="adv-list">
      ${top.length?top.map((p,i)=>`
        <li class="adv-item">
          <div class="adv-rank">${i+1}</div>
          <div class="adv-item-body">
            <div class="adv-item-title" style="font-size:13.5px;font-weight:600;color:var(--t2)">"${esc(p.problem)}"</div>
            <div style="margin-top:6px;display:flex;gap:8px;flex-wrap:wrap;align-items:center">
              <a href="${esc(p.url)}" target="_blank" style="font-size:11.5px;color:var(--acc)">📄 ${esc(truncWords(p.source,8))}</a>
              ${p.date?`<span style="font-size:11px;color:var(--muted)">${p.date}</span>`:''}
              <span class="adv-tag adv-tag-green">Opp: ${p.opp}</span>
            </div>
          </div>
        </li>`).join('')
      :`<li class="adv-item"><div style="color:var(--muted);padding:20px">No problems extracted yet — add more papers with summaries.</div></li>`}
    </ul>
  </div>`;
}

      ${Array.isArray(topPaper.authors)&&topPaper.authors.length?`<div style="font-size:12px;color:var(--t3);margin-top:4px">${topPaper.authors.slice(0,3).join(', ')}${topPaper.authors.length>3?' et al.':''}</div>`:''}</div>`)}
  ${section('Biggest Gap Opportunity','🔍',`
    <div class="adv-panel" style="padding:16px 18px;margin:0">
      <div style="font-size:14px;font-weight:700">${topGap.m.icon} ${topGap.m.label} — ${topGap.g} gap score</div>
      <div style="font-size:13px;color:var(--t2);margin-top:5px">Strong research activity. Few commercial solutions. High demand. Build here.</div>
    </div>`)}
  ${topFunding&&titleOf(topFunding)?section('Latest Funding Round','💰',`
    <div class="adv-panel" style="padding:16px 18px;margin:0">
      <div style="font-size:14px;font-weight:700">${esc(truncWords(titleOf(topFunding),12))}</div>
      <div style="font-size:13px;color:var(--t2);margin-top:4px">
        ${topFunding.amount?`<span class="adv-tag adv-tag-green">${esc(topFunding.amount)}</span>`:''}
        ${topFunding.stage?`<span class="adv-tag adv-tag-blue">${esc(topFunding.stage)}</span>`:''}
        ${dateOf(topFunding)?`<span style="color:var(--muted);font-size:12px;margin-left:6px">${dateOf(topFunding)}</span>`:''}
      </div>
    </div>`):''}</div>`;
  return `<div class="adv-wrap">` + section('placeholder','','') + `</div>`;
}

/* ── Module: Signal Score Engine ── */
function advSignalEngine() {
  const WEIGHTS={research:3,funding:5,hiring:1,openSource:2,news:2};
  const calcSignal=(item,type)=>{
    const txt=JSON.stringify(item).toLowerCase();
    const hasMkt=k=>MKTS[k].kw.some(w=>txt.includes(w));
    const mktBonus=Object.keys(MKTS).filter(hasMkt).length*4;
    if(type==='paper') return Math.min(99,scoreOf(item)*10+mktBonus+20);
    if(type==='repo')  return Math.min(99,Math.log1p(scoreOf(item))*10+mktBonus+10);
    if(type==='model') return Math.min(99,Math.log1p(scoreOf(item))*8+mktBonus+15);
    return Math.min(99,mktBonus+25);
  };
  const allItems=[
    ...(data.papers||[]).filter(x=>!isSeed(x)).map(x=>{return{...x,_type:'paper',_sig:calcSignal(x,'paper')};}),
    ...(data.repos||[]).filter(x=>!isSeed(x)).map(x=>{return{...x,_type:'repo',_sig:calcSignal(x,'repo')};}),
    ...(data.models||[]).filter(x=>!isSeed(x)).map(x=>{return{...x,_type:'model',_sig:calcSignal(x,'model')};}),
    ...(data.funding||[]).filter(x=>!isSeed(x)).map(x=>{return{...x,_type:'funding',_sig:calcSignal(x,'funding')};}),
  ].sort((a,b)=>b._sig-a._sig).slice(0,25);
  const byType=t=>allItems.filter(x=>x._type===t).length;
  const typeIcon={paper:'📄',repo:'💻',model:'🧠',funding:'💰'};
  const typeColor={paper:'#34d399',repo:'#60a5fa',model:'#fb923c',funding:'#a3e635'};
  return `
  <div class="adv-metrics">
    <div class="adv-metric"><div class="adv-metric-n">${allItems[0]?._sig||0}</div><div class="adv-metric-l">Top Signal Score</div></div>
    <div class="adv-metric"><div class="adv-metric-n">${allItems.filter(x=>x._sig>=80).length}</div><div class="adv-metric-l">High Signal Items</div></div>
    <div class="adv-metric"><div class="adv-metric-n">${allItems.length}</div><div class="adv-metric-l">Items Ranked</div></div>
    <div class="adv-metric"><div class="adv-metric-n">Live</div><div class="adv-metric-l">Data Freshness</div></div>
  </div>
  <div class="adv-panel">
    <div class="adv-panel-hdr">⚡ Universal Signal Score Rankings — Top 25 signals across all categories</div>
    <ul class="adv-list">
      ${allItems.map((x,i)=>{
        const tc=typeColor[x._type]||'#818cf8';
        const ti=typeIcon[x._type]||'•';
        return `<li class="adv-item">
          <div class="adv-rank" style="background:${tc}22;color:${tc}">${i+1}</div>
          <div class="adv-item-body">
            <div class="adv-item-title">
              <a href="${esc(hrefOf(x))}" target="_blank" style="color:var(--text)">${esc(truncWords(titleOf(x),12))}</a>
            </div>
            <div class="adv-scores">
              <span class="adv-tag" style="background:${tc}22;border:1px solid ${tc}44;color:${tc}">${ti} ${x._type}</span>
              ${scoreOf(x)?`<span class="adv-tag adv-tag-blue">${fmt(scoreOf(x))}</span>`:''}</div>
          </div>
          <div style="text-align:right;flex-shrink:0">
            <div style="font-size:22px;font-weight:900;color:${tc}">${x._sig}</div>
            <div style="font-size:10px;color:var(--muted)">signal</div>
          </div>
        </li>`;
      }).join('')}
    </ul>
  </div>`;
}

/* ── ADVANCED main renderer ── */
function renderAdvanced() {
  const wrap=document.getElementById('advWrap');
  if(state.advMod) {
    const mod=ADV_MODS.find(m=>m.id===state.advMod);
    let content='<div style="color:var(--muted);padding:40px;text-align:center">Module coming soon.</div>';
    if(state.advMod==='opportunity_radar') content=advOpportunityRadar();
    else if(state.advMod==='gapfinder')       content=advGapFinder();
    else if(state.advMod==='future_unicorn')  content=advFutureUnicorn();
    else if(state.advMod==='startup_ideas')   content=advStartupIdeas();
    else if(state.advMod==='startup_validator') content=advStartupValidator();
    else if(state.advMod==='builder_match')   content=advBuilderMatch();
    else if(state.advMod==='problemmine')     content=advProblemMine();
    else if(state.advMod==='market_intel')    content=advMarketIntel();
    else if(state.advMod==='research_map')    content=advResearchMap();
    else if(state.advMod==='startup_genome')  content=advStartupGenome();
    else if(state.advMod==='hidden_gems')     content=advHiddenGems();
    else if(state.advMod==='investor_mode')   content=advInvestorMode();
    else if(state.advMod==='graveyard')       content=advGraveyard();
    else if(state.advMod==='time_machine')    content=advTimeMachine();
    else if(state.advMod==='cofounder')       content=advCoFounder();
    else if(state.advMod==='cert_hub')        content=advCertHub();
    else if(state.advMod==='daily_brief')     content=advDailyBrief();
    else if(state.advMod==='signal_engine')   content=advSignalEngine();
    wrap.innerHTML=`
      <button class="adv-back" id="advBack">← Back to Advanced Hub</button>
      <div class="adv-mod-hdr">
        <div class="adv-mod-ico">${mod?.icon||'🚀'}</div>
        <div>
          <div class="adv-mod-title">${mod?.label||state.advMod}</div>
          <div class="adv-mod-sub">${mod?.desc||''}</div>
        </div>
      </div>
      ${content}`;
    document.getElementById('advBack')?.addEventListener('click',()=>{
      state.advMod=null; renderAdvanced();
    });
    /* bind interactive modules */
    if(state.advMod==='startup_validator') advStartupValidatorBind();
    else if(state.advMod==='builder_match') advBuilderMatchBind();
    else if(state.advMod==='cofounder') advCoFounderBind();
  } else {
    wrap.innerHTML=renderAdvHub();
    wrap.querySelectorAll('.adv-hcard').forEach(c=>c.addEventListener('click',()=>{
      state.advMod=c.dataset.mod; renderAdvanced();
      document.querySelector('.main').scrollTo({top:0,behavior:'smooth'});
    }));
  }
}

/* ── init ── */
syncVT();
render();
</script>
