": "2026-08-25", "url": "https://www.embedded.com/nvidia-unveils-jetson-orin-nano-2-for-robotics-and-edge-ai/", "summary": "<p>Nvidia claims to redefine entry-level edge AI with the launch of the Jetson Orin Nano 2 robotics computer, making frontier-class AI models available to millions of developers. Advancing generative AI at the edge, the new AI supercomputer targets applications such as robots, delivery and inspection drones, and vision AI systems that need small, energy-efficient robotics [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/nvidia-unveils-jetson-orin-nano-2-for-robotics-and-edge-ai/\">Nvidia Unveils Jetson Orin Nano 2 for Robotics and Edge AI<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "Why Sensor Fusion Matters for Drone Navigation and Detection", "source": "Embedded.com", "date": "2026-08-25", "url": "https://www.embedded.com/why-sensor-fusion-matters-for-drone-navigation-and-detection/", "summary": "<p>A variety of sensors are used on drones for spatial awareness, terrain and target mapping, obstacle navigation, and optimizing flight paths to the target. Anti-drone defense systems similarly rely on many sensors for detection, flight-path tracking, and drone classification. Each sensor has its strengths and weaknesses. Sensor fusion involves merging the multiple sensor data input [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/why-sensor-fusion-matters-for-drone-navigation-and-detection/\">Why Sensor Fusion Matters for Drone Navigation and Detection<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "Viavi Vertex 6.0 Targets 6G and Wi-Fi 7/8 RF Testing", "source": "Embedded.com", "date": "2026-08-25", "url": "https://www.embedded.com/viavi-vertex-6-0-targets-6g-and-wi-fi-7-8-rf-testing/", "summary": "<p>Viavi Solutions has introduced Vertex 6.0, an enhanced version of its channel emulation platform designed to reproduce real-world RF propagation conditions in laboratory environments. The new platform targets next-generation cellular, Wi-Fi, military, and aerospace technologies and is well-positioned to test emerging 6G and Wi-Fi 7/8 systems. Vertex 6.0 provides 400 MHz of instantaneous bandwidth and [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/viavi-vertex-6-0-targets-6g-and-wi-fi-7-8-rf-testing/\">Viavi Vertex 6.0 Targets 6G and Wi-Fi 7/8 RF Testing<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "Jetway PIC-TWL1 Intel N150 Pico-ITX motherboard is made for industrial automation and embedded systems", "source": "CNX Software", "date": "2026-08-24", "url": "https://www.cnx-software.com/2026/08/25/jetway-pic-twl1-intel-n150-pico-itx-motherboard-is-made-for-industrial-automation-and-embedded-systems/", "summary": "<div><img alt=\"Jetway PIC-TWL1\" class=\"attachment-medium size-medium wp-post-image\" height=\"454\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/08/Jetway-PIC-TWL1-720x454.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Jetway PIC-TWL1 is a compact (100&#215;72 mm) fanless Pico-ITX motherboard powered by an Intel N150 Twin Lake processor and engineered for industrial control, factory automation, facial recognition, and edge embedded systems. The board supports up to 32GB DDR5 SO-DIMM memory and NVMe SSD storage, and features HDMI and LVDS/eDP display interfaces, two USB 3.2 ports, two Gigabit Ethernet ports, an M.2 E-Key socket for WiFi and Bluetooth, and several headers for GPIOs, RS232/RS485, USB 2.0, audio, SMBUs, and front panel connections. It takes 12V DC power and can operate in a -20°C ~ 60°C temperature range. Jetway PIC-TWL1 specifications: SoC &#8211; Intel Processor N150 CPU &#8211; Quad-core Twin Lake processor @ 800 MHz / 3.6 GHz (Turbo) with 6MB cache GPU &#8211; 24EU Intel UHD graphics @ 1.0 GHz TDP &#8211; 6W System Memory –  Up to 32GB DDR5 4800 MT/s via single-channel SO-DIMM slot Storage &#8211; NVMe SSD via M.2 [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/08/25/jetway-pic-twl1-intel-n150-pico-itx-motherboard-is-made-for-industrial-automation-and-embedded-systems/\">Jetway PIC-TWL1 Intel N150 Pico-ITX motherboard is made for industrial automation and embedded systems<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "MNT Station fanless, modular open-hardware computer supports a choice of 10+ Arm CPU or FPGA modules (Crowdfunding)", "source": "CNX Software", "date": "2026-08-24", "url": "https://www.cnx-software.com/2026/08/24/mnt-station-fanless-modular-open-hardware-computer-supports-a-choice-of-10-arm-cpu-or-fpga-modules/", "summary": "<div><img alt=\"MNT Station fanless open hardware modular computer\" class=\"attachment-medium size-medium wp-post-image\" height=\"480\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/08/MNT-Station-fanless-open-hardware-modular-computer-720x480.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>MNT Research, the Berlin-based team behind the MNT Reform, MNT Pocket Reform, Reform 2, and MNT Reform Next, has launched the MNT Station, a fanless, open-hardware modular computer designed for use as a desktop PC, home server, NAS, router, edge device, or low-power media center. The MNT Station is built around the MNT Reform mainboard ecosystem and designed for those who want to reuse an existing MNT Reform mainboard (versions 2.0, 2.5, or 3.0) as a stationary computer, as well as those building a modular Arm (or FPGA-based) desktop from scratch using the new MNT Reform Mainboard 3.0. Like other MNT systems, it&#8217;s fully open-source hardware, and the 200-pin processor module connector supports different processor modules, including the Rockchip RK3588, NXP Layerscape LS1028A, and Raspberry Pi CM4, among others. MNT Station specifications: SoC/Processor and Memory options (via 200-pin module) Rockchip RK3588 (MNT RCORE V2) — 4× Cortex-A76 + 4× Cortex-A55 [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/08/24/mnt-station-fanless-modular-open-hardware-computer-supports-a-choice-of-10-arm-cpu-or-fpga-modules/\">MNT Station fanless, modular open-hardware computer supports a choice of 10+ Arm CPU or FPGA modules (Crowdfunding)<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "$60+ Nordic Semi nRF93M1 Development Kit (DK) targets LTE Cat 1 bis IoT applications", "source": "CNX Software", "date": "2026-08-24", "url": "https://www.cnx-software.com/2026/08/24/60-nordic-semi-nrf93m1-development-kit-dk-targets-lte-cat-1-bis-iot-applications/", "summary": "<div><img alt=\"Nordic Semi nRF93M1 Development Kit\" class=\"attachment-medium size-medium wp-post-image\" height=\"478\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/08/Nordic-Semi-nRF93M1-Development-Kit-720x478.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Nordic Semiconductor has launched the nRF93M1 DK (Development Kit) based on the nRF93M1-LABA LTE Cat 1 bis with Wi-Fi and cellular location and a Nordic Semi nRF54L15 host microcontroller. The nRF93M1 module was first introduced at Embedded World 2026 last March, and the company has now announced general availability of the nRF93M1-LABA smart modem module for Europe, Asia, the Middle East, Africa, and sampling of the nRF93M1-LACA module for global markets, scheduled to become available in Q3 2026. The announcement also covers the launch of the nRF93M1 Development Kit, which was teased last March with limited details. Time to have a closer look. nRF93M1 DK specifications: Host MCU &#8211; Nordic Semiconductor nRF54L15 MCU cores Arm Cortex-M33 with Arm TrustZone @ 128MHz RISC-V coprocessor for software-defined peripheral Memory – 256KB SRAM Storage – 1.5MB non-volatile memory Wireless Bluetooth 6.0 Data rates – 2Mbps, 1Mbps, 500kbps, 125kbps Features (TBC in built-in firmware) AoA [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/08/24/60-nordic-semi-nrf93m1-development-kit-dk-targets-lte-cat-1-bis-iot-applications/\">$60+ Nordic Semi nRF93M1 Development Kit (DK) targets LTE Cat 1 bis IoT applications<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Completing the Audit Trail: Why Embedded Teams Need Runtime Observability", "source": "Embedded.com", "date": "2026-08-24", "url": "https://www.embedded.com/completing-the-audit-trail-why-embedded-teams-need-runtime-observability/", "summary": "<p>Reproducible builds have become a cornerstone of modern embedded development. They provide confidence that a specific source-code baseline and toolchain produce a known firmware artifact, creating a traceable path from source code to deployed software. For many organizations, this forms an essential part of the engineering audit trail. Teams can determine what software was built, [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/completing-the-audit-trail-why-embedded-teams-need-runtime-observability/\">Completing the Audit Trail: Why Embedded Teams Need Runtime Observability<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "Mikroe Releases RTLS UWB Click Board", "source": "Embedded.com", "date": "2026-08-24", "url": "https://www.embedded.com/mikroe-releases-rtls-uwb-click-board/", "summary": "<p>Mikroe has launched its latest Click board addition, the real-time location system (RTLS) ultra-wideband (UWB) add-on board for high-precision real-time location, distance measurement, and motion-aware tracking. The new board is suited for applications such as asset tracking, indoor positioning, personnel and equipment localization, smart logistics, and industrial monitoring. It can be used for indoor navigation [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/mikroe-releases-rtls-uwb-click-board/\">Mikroe Releases RTLS UWB Click Board<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "Advanced RF Systems, Agilex FPGAs, a Neuromorphic Chip for AI Optical Inspection: Embedded Week Insights", "source": "Embedded.com", "date": "2026-08-21", "url": "https://www.embedded.com/advanced-rf-systems-agilex-fpgas-a-neuromorphic-chip-for-ai-optical-inspection-embedded-week-insights/", "summary": "<p>Here's a roundup of this week's must-read articles. We'll cover the latest developments on advanced RF systems for mil-aero communications, Agilex FPGAs, and a neuromorphic chip for AI optical inspection. Also, check News Archives - Embedded and Technical Articles Archives - Embedded for the complete list of news and articles from our website. NEWS Aetina Introduces Palm-Sized In-Vehicle Edge [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/advanced-rf-systems-agilex-fpgas-a-neuromorphic-chip-for-ai-optical-inspection-embedded-week-insights/\">Advanced RF Systems, Agilex FPGAs, a Neuromorphic Chip for AI Optical Inspection: Embedded Week Insights<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "Vector Brings Natural-Language AI Automation to CANoe", "source": "Embedded.com", "date": "2026-08-21", "url": "https://www.embedded.com/vector-brings-natural-language-ai-automation-to-canoe/", "summary": "<p>Vector Informatik GmbH has expanded its CANoe development and testing environment with AI agents and Model Context Protocol (MCP) capabilities. The new functions allow users to describe development, analysis, and testing tasks using natural-language prompts, after which specialized AI agents can determine the required steps and execute complete workflows automatically. The CANoe AI Package and [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/vector-brings-natural-language-ai-automation-to-canoe/\">Vector Brings Natural-Language AI Automation to CANoe<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}], "papers": [{"title": "VBVR-Pro: A Scalable and Verifiable Suite for Native Visual Reasoning", "authors": ["Junxiang Xu", "Ruisi Wang", "Fanyi Pu", "Maijunxian Wang", "Ran Ji", "Tongxi Zhou", "Chenyang Gu", "Jing Zuo", "Hongcan Xiao", "Yimeng Geng", "Wanqi Yin", "Wei Chen", "Oscar Qian", "Zhengan Yan", "Ziqi Huang", "Haiwen Diao", "Liang Pan", "Bo Li", "Xiangyu Fan", "Dezhi Luo", "Fengyuan Yu", "Zehong Zhao", "Qingying Gao", "Tinghui Zhu", "Yilan Zhang", "Jingqi Tong", "Pinyuan Feng", "Zhengze Jiang", "Letian Wang", "Ziyu Guo", "Renrui Zhang", "Jieneng Chen", "Sonia Joseph", "Constantin Venhoff", "Saman Motamed", "Mengyue Yang", "Chandra Sripada", "Alan Yuille", "Philip Torr", "Lvmin Zhang", "Vikash Kumar", "Daniel Khashabi", "Nikolaus Kriegeskorte", "Raphaël Millière", "Vincent C. Müller", "Anyi Rao", "Quan Wang", "Ziwei Liu", "Dahua Lin", "Lei Yang", "Hokin Deng", "Zhongang Cai"], "published": "2026-08-26", "summary": "Native visual reasoning treats visual generation as the medium of reasoning itself: visual states (i.e. images and videos) are not merely inputs to be understood or outputs to be rendered, but first-class substrates for problem solving beyond language. Yet progress remains bottlenecked by the lack of scalable training tasks, reliable feedback, and controlled comparisons across generative substrates. In this work, we introduce VBVR-Pro, a closed-loop testbed that makes native visual reasoning through generation trainable, verifiable, optimizable, and experimentally controllable. 1) Task scaling. VBVR-Pro turns visual reasoning into a controlled task space of 300 procedurally generated tasks. Models trained on VBVR-Pro show strong transfer beyond the proposed suite across seven external visual reasoning benchmarks such as RISE-Video, MME-CoF-Pro, and BabyVision. 2) Verifiable rewards. VBVR-Pro provides verifiable reward scorers for task-grounded evaluation. Through a systematic study of leading MLLMs as judges, we identify recurring failure modes of the prevalent VLM-as-a-judge paradigm. In contrast, the proposed scorers are grounded in deterministic, task-specific rules, achieve fine-grained alignment with human judgments. Importantly, they serve as reliable reward signals for large-scale multi-task reinforcement learning and demonstrate stronger post-RL performance across visual reasoning tasks. 3) Mechanism study. VBVR-Pro enables controlled modality studies across more than 30 image, video, and interleaved generators. Our analysis shows that video generation remains strongest for tasks requiring persistent spatiotemporal state tracking, while interleaved generation provides a compute-efficient alternative. Critically, ablations and probing suggest the presence of vision-native trajectories that are crucial to visual reasoning. We release all data, models, scorers, and code.", "pdf_url": "https://arxiv.org/pdf/2608.26105v1"}, {"title": "Zero-WAM: In-Context World-Action Modeling from Human Videos for Open-Ended Task Generalization", "authors": ["Jiaming Zhou", "Qihang Zhang", "Gangwei Xu", "Cunxin Fan", "Yujie Zhao", "Ruilin Wang", "Yiming Luo", "Shuai Yang", "Xing Zhu", "Yujun Shen", "Junwei Liang", "Yinghao Xu"], "published": "2026-08-26", "summary": "Zero-shot cross-task generalization, where a policy must execute manipulation tasks never seen during training, remains a central challenge in robot learning. In large language models, a novel task can be performed simply by specifying it in the context, without any parameter update. This form of in-context learning (ICL) turns generalization into a problem of task specification. To achieve cross-task generalization, we bring this paradigm to robotic manipulation, and argue that the natural task specification for manipulation is a human video: unlike language, it provides rich visual cues about the intended task evolution. We present Zero-WAM, a causal video-action model that executes unseen tasks by following in-context human video guidance. To address the scarcity of task-rich paired human-robot data, we propose an automatic pipeline that converts task-sampled robot trajectories into semantically matched human videos, yielding HumanGen, a dataset of 74.2K human-robot ICL pairs across 8.6K tasks. For model training, we further introduce an in-context future chunk prediction (IFP) objective that suppresses shortcuts learned from seen tasks and forces the policy to draw task information from the video prompt. On seven unseen tasks in RoboTwin 2.0 simulation, Zero-WAM achieves a 47.0% average success rate, an absolute improvement of 29.5 percentage points over the strongest video-action baseline. In real-world evaluations, it follows human video guidance to generalize to unseen task configurations involving multi-object scenes, long-horizon manipulation, and fine-grained insertion.", "pdf_url": "https://arxiv.org/pdf/2608.26103v1"}, {"title": "MyoMechanix: Biomechanically-Grounded Compositional Skilled Activity Understanding and Coaching", "authors": ["Hao Yin", "Paritosh Parmar", "Lijun Gu", "Lin Xu", "Tianxiao Guo", "Xiujin Liu", "Tianyou Zheng", "Yang Zhang", "Weiwei Fu"], "published": "2026-08-26", "summary": "Existing action quality assessment (AQA) datasets and methods rely primarily on visual inputs such as RGB and pose, overlooking physiological dynamics such as muscle mechanics and often modeling actions as monolithic patterns. These limitations hinder fine-grained, biomechanically grounded feedback. We introduce MyoMechanix, a multimodal ecosystem for weight-loaded actions that aligns motion with muscle activity. Expert-annotated, it contains 7,500+ samples of 20 actions from 38 subjects, with synchronized multiview RGB video, 3D pose, sEMG, and additional physiological signals, forming the largest multimodal AQA benchmark to date. We further construct the Fitness Knowledge Graph (FKG), which organizes expert annotations into structured relationships among actions, phases, key steps, errors, and corrective feedback, enabling compositional scoring and interpretable assessment. Building on these representations, we develop CUBIST (Compositional Ontological Reasoning Engine), which performs decomposition-analysis-recomposition for fine-grained error attribution and feedback generation. We also establish MyoMechanix-AQA, MyoMechanix-VideoQA, and a novel MyoMechanix-Video2EMG task. Experiments show that multimodal sensing and structured representations improve performance, interpretability, and error attribution, with CUBIST achieving state-of-the-art results; VideoQA enhances language-grounded action understanding; and Video2EMG suggests video-based alternatives to costly EMG sensing. MyoMechanix advances skilled activity understanding toward biomechanically grounded, multimodal, and compositional reasoning for Physical AI applications in fitness, rehabilitation, healthcare, and machine learning. Project page: https://haoyin116.github.io/MyoMechanix/", "pdf_url": "https://arxiv.org/pdf/2608.26094v1"}, {"title": "Finding and using interpretable latents in a neutrino foundation model with sparse autoencoders", "authors": ["Raphaël Bonnet-Guerrini", "Johann Ioannou-Nikolaides", "Inar Timiryasov", "Vincenzo Piuri"], "published": "2026-08-26", "summary": "We present a first application of sparse-autoencoder-based mechanistic interpretability to particle physics. Studying a neutrino foundation model pretrained on IceCube data and fine-tuned for direction reconstruction, we identify a validated atlas of physical concepts in the model representation, using a strict validation protocol consisting of held-out tests, matched nuisance controls, and replication across independent dictionary trainings. Causal interventions show that the direction head barely draws on this atlas. Motivated by this underused information, we train an uncertainty head on the same event-level representation to predict the model's angular reconstruction error. Unlike the direction head, it depends causally on quality and brightness features from the atlas. At $20\\%$ selection efficiency, this interpretable estimator improves the median angular resolution from $20.2^\\circ$ to $3.2^\\circ$. These results suggest that mechanistic interpretability can reveal learned latent physics encoded within a model's internal representation and help design downstream tasks that exploit it.", "pdf_url": "https://arxiv.org/pdf/2608.26090v1"}, {"title": "Planetary Prediction Engine: Autonomous Geospatial Prediction via Intelligent Data Selection and Foundation Model Embeddings", "authors": ["Evelyn Ma", "Rama Kumar Pasumarthi", "Kishwar Shafin", "Mandar Sharma", "Mimi Sun", "Hamed Sadeghi", "Dav M. Ebengo", "Mbulayi Onesime", "Rouslan Solomakhin", "John Wamburu", "William Ogallo", "Aisha Walcott-Bryant", "Sanxing Chen", "Arbaaz Muslim", "Yael Mayer", "Ronald Ho", "Roy Lee", "Ruth Alcantara", "Abdoulaye Diack", "Monica Bharel", "Lambert Rosique", "Jeremy Amez-Droz", "Christopher Haire", "James Manyika", "Yossi Matias", "Niv Efron", "Gautam Prasad", "Shravya Shetty"], "published": "2026-08-26", "summary": "Addressing critical global challenges, from food security and disaster risk to disease outbreaks and socio-economic vulnerability, demands high-fidelity geospatial modeling. However, building predictive planetary models remains bottlenecked by a fragmented data ecosystem, requiring manual data retrieval, multimodal data curation and fusion along with iterative model selection. We present the Planetary Prediction Engine (PPE), an autonomous AI system that executes this end-to-end workflow directly from natural-language queries. PPE synthesizes multimodal datasets on the fly, retrieving spatiotemporally relevant covariates across open-web and Earth observation platforms (Data Commons, Google Earth Engine) and fusing them with geospatial foundation model embeddings (PDFM, AlphaEarth). Simultaneously, it searches over task-tailored model architecture families with automated overfitting guards. Across diverse tasks, geographies, and scientific domains, PPE consistently outperforms state-of-the-art or manually tuned expert baselines. For US spatial regression, PPE improves mean $R^2$ across 21 CDC health indicators (76.8% vs. 60.0%), FEMA national risk indices (64.9% vs. 60.0%), and the Social Vulnerability Index (66.2% vs. 58.6%). For spatial downscaling in data-scarce settings, PPE integrates localized proxies to double baseline accuracy in Nigerian food security indicators ($R^2$ of 66.1% vs. 31.5%). For epidemiological nowcasting of the 2026 DRC Bundibugyo Ebola outbreak, PPE achieves a Recall@10 of 83.3% (identifying 15 of 18 newly invaded health zones across five weekly forecasts), a +10.3 percentage-point improvement over the public state-of-the-art modeling (~73%). By combining autonomous multimodal planetary data discovery with targeted model optimization, PPE lowers the technical barrier to planetary-scale analytics, enabling rapid, customized, expert-level deployment.", "pdf_url": "https://arxiv.org/pdf/2608.26088v1"}, {"title": "Fast Generative Grasping via Lie Group-Constrained MeanFlow", "authors": ["S. Talha Bukhari", "Yi Wei", "Ruiqi Ni", "Zachary Kingston", "Aniket Bera"], "published": "2026-08-26", "summary": "Grasp synthesis is a core task in robotic manipulation, for which the solution typically forms a multimodal distribution rather than a point estimate. Generative robotic grasping aims to learn this distribution with deep generative models such as diffusion and flow-based approaches. The iterative nature of such generative models makes them flexible and generalizable; however, multi-step sampling impedes the time-critical operation required in robotics. We devise an approach to fast generative grasping based on MeanFlow on the product Lie group $\\mathcal{G} = \\mathrm{SO}(3) \\times \\mathbb{R}^3$. The training objective couples a purely algebraic semigroup consistency condition with Riemannian Conditional Flow Matching on $\\mathcal{G}$ that anchors the average velocity to the data distribution. The resulting Lie Group-constrained MeanFlow formulation samples reliable grasps in $\\leq 5$ network evaluations, matching the grasp generation performance of state-of-the-art diffusion and flow-based models on the ACRONYM dataset at millisecond-scale inference latency (up to $39\\times$ speed-up). We further demonstrate that the approach directly translates to real-world robotic grasping without additional training or domain adaptation, exhibiting robust grasp synthesis under observation noise.", "pdf_url": "https://arxiv.org/pdf/2608.26076v1"}, {"title": "Gating Before Commitment: Anticipating Intent Divergence to Prevent Post-Interaction Decision Failures in Autonomous Driving", "authors": ["Cong Xu", "Ravi Sankar"], "published": "2026-08-26", "summary": "Intent misinterpretation during vehicle interactions causes recurring planning failures. We study a decision layer in which a language-guided intent module reads structured descriptors, computes a smoothed intent-geometry divergence score, and gates the planned maneuver before commitment, upstream of a corridor envelope. On a replayed off-road departure and four crash clips under a frozen, disclosed implementation, gating is the only layer that repairs the plan: on the main case it fires 72 ms after the drift onset but 161 ms before the corridor exit, keeping the trajectory in the corridor in all ten replays. The first calibration draws nine false triggers in 5.9 minutes, each from scoring uncertainty as half a conflict; a preregistered redesign treating uncertainty as abstention cuts this to 0.341 per minute. Two ablations bound the model's contribution: the full score detects fastest on four of five failures under the deployed eligibility, three of five against the unvetoed rule (000871 by one cycle; 000228 by a pre-onset fire on an uncertain stretch that five clips cannot classify as signal or coincidence; dropping the confidence term costs two detections), while on in-domain tracks at equal false positives the geometric rule more than triples its detection. The evidence supports the gating mechanism; the model's demonstrated roles are the fastest detection on these failures and an uncertainty veto on the geometric rule.", "pdf_url": "https://arxiv.org/pdf/2608.26074v1"}, {"title": "StreamPI: Streaming Multimodal Temporal Modeling for Vision-Language-Action Models", "authors": ["Zhe Liu", "Jinghua Hou", "Yuxiang Lu", "Zhenya Yang", "Xianzhe Fan", "Junwei Luo", "Junyi Li", "Ruihua Han", "Zhi Hou", "Hengshuang Zhao"], "published": "2026-08-26", "summary": "Vision-Language-Action (VLA) models have demonstrated effectiveness in robot manipulation, yet state-of-the-art models such as pi0.5 operate under a single-frame paradigm, limiting their ability to retain past observations and develop precise spatial perception. In this paper, we propose StreamPI, a streaming multimodal temporal modeling framework that equips single-frame VLA with temporal reasoning capability without introducing any additional parameters. One core design is instruction-anchored temporal modeling. It treats each (visual observation, language instruction) pair as an atomic temporal unit: bidirectional attention within each pair enables cross-modal fusion, while causal attention across pairs preserves autoregressive streaming inference. This ensures the language instruction serves as a persistent semantic anchor throughout task execution. To bridge the gap between synchronous training and asynchronous real-robot deployment, we introduce a andom-interval streaming training strategy: a proper inter-frame interval (e.g., every 3 frames) enables faster and smoother action execution. Beyond this, randomizing the interval further improves robustness to frame-timing perturbations, supporting asynchronous deployment in practice. Furthermore, by leveraging the length extrapolation capability of the LLM backbone, StreamPI seamlessly inherits pretrained single-frame weights and supports flexible single-frame and multi-frame inference. Experiments on real-robot tasks spanning memory-dependent and precise perception scenarios, as well as the simulation benchmark LIBERO, demonstrate that StreamPI outperforms pi0.5 across diverse tasks.", "pdf_url": "https://arxiv.org/pdf/2608.26067v1"}, {"title": "VirTooS: A ROS 2 - Unity Virtualization Toolkit for Fleet Management of Autonomous Mobile Robots", "authors": ["Andrea Drudi", "Lorenzo Pichierri", "Andrea Testa", "Giuseppe Notarstefano"], "published": "2026-08-26", "summary": "In this paper, we present VirTooS, a Python/C# toolkit designed to implement fleet-management tasks on teams of Autonomous Mobile Robots (AMRs). VirTooS leverages the Robot Operating System (ROS) 2 and Unity game engine to provide realistic, scalable virtual experiments in a mixed-reality environment. The toolbox allows users to easily generate and customize virtual scenarios for realistic simulations. Virtual and real sensors as, e.g., LiDARs, can be exploited to map and safely navigate in the mixed-reality environment. To enable distributed robotics experiments, we propose a set of tailored routines leveraging the ChoiRbot framework. As a motivating example, we show a set of experiments for task assignment problems in a virtual environment, allowing seamless interaction among real and virtual robots. Moreover, the package comes with a containerized suite to easily deploy it on different machines. The source code will be made publicly available on GitHub.", "pdf_url": "https://arxiv.org/pdf/2608.26066v1"}, {"title": "Fine-Tuning Whisper for Automatic Speech Recognition in Baniwa: A Preliminary Study", "authors": ["Leonardo Duart", "Tiago Fonseca", "Thiago Chacón"], "published": "2026-08-26", "summary": "Automatic Speech Recognition (ASR) technologies have achieved remarkable performance in recent years through the use of large multilingual foundation models. However, most advances remain concentrated on high-resource languages, while indigenous languages continue to suffer from a lack of speech resources and language technologies. This work presents a preliminary study on the adaptation of Whisper for Automatic Speech Recognition in Baniwa, an indigenous Arawakan language spoken in Brazil, Colombia, and Venezuela. The experiments were conducted using a corpus of 1,373 manually transcribed recordings obtained from a linguistic documentation project. The corpus contains approximately 0.54 hours of speech and consists primarily of isolated words and short elicited utterances. The Whisper Small model was fine-tuned using supervised learning and evaluated using Word Error Rate (WER) and Character Error Rate (CER). The best model achieved a WER of 37.5% and a CER of 7.45%, demonstrating that multilingual foundation models can be successfully adapted to extremely low-resource indigenous languages. The results establish an initial baseline for Baniwa Automatic Speech Recognition and provide a foundation for future research involving larger datasets, language-specific adaptation strategies, and post-processing techniques.", "pdf_url": "https://arxiv.org/pdf/2608.26060v1"}, {"title": "One Policy, Many Embodiments: Unified Camera-Centric Action Geometry Pre-training for Heterogeneous Embodied Manipulation", "authors": ["Xiaomi Embodied Intelligence Team", "University of Macau", ":", "Shaoqing Xu", "Fang Li", "Guozhi Zhan", "Zhixiang Duan", "Yuhan Wang", "Yuechen Luo", "Shengyin Jiang", "Hanbing Li", "Zhiying Du", "Longlong Wang", "Longmei Jiang", "Weixiang Liang", "Ying Gong", "Yong Pan", "Ziping Zhao", "Zhiyuan Chen", "Yangwei You", "Kun Ma", "Qinyuan Liu", "Hangjun Ye", "Zhi-xin Yang"], "published": "2026-08-26", "summary": "Scaling generalist vision-language-action (VLA) policies is severely bottlenecked by the inherent heterogeneity of embodied data, which spans diverse robot morphologies, camera configurations, and low-level action spaces. Existing paradigms typically address this mismatch through explicit action retargeting, human-to-robot video synthesis, or dataset-specific adaptation branches, fundamentally hindering the joint learning of a unified policy. We introduce UCAG-P, a camera-centric unified action formulation that structurally aligns heterogeneous embodied datasets into a shared geometric action space. Rather than treating robot-specific commands as the shared policy target, UCAG-P represents manipulation through camera-observable anchor motion in image and camera-frame coordinates, treating robot arms, humanoids, and human hands as different embodiments of a common action schema. A geometry-conditioned action translator combines predicted motion with target-embodiment kinematics to produce executable controls. The resulting decoupled architecture allows a shared VLA policy to learn transferable manipulation geometry while retaining embodiment-specific controllability. UCAG-P is trained on 4.03K hours of robot and simulation data and 2.34K hours of human demonstrations. A single checkpoint reaches 98.3% on LIBERO, 88.7% and 89.2% on RoboTwin Easy and Hard, 82.0% zero-shot on LIBERO-Plus, and 62.0% on RoboCasa GR-1, without benchmark-specific fine-tuning.", "pdf_url": "https://arxiv.org/pdf/2608.26058v1"}, {"title": "$R^3$: Training Robots to Reason in Natural Language via Reinforcement Learning", "authors": ["Lehong Wu", "Yuxiao Qu", "Zheyuan Hu", "Ivan Zhang", "Limin Wei", "Zackory Erickson", "Aviral Kumar"], "published": "2026-08-26", "summary": "Reasoning in language allows foundation models to spend more test-time compute on hard problems, such as those requiring decomposition, constraint tracking, and prediction of future consequences. Whether this mechanism can improve robotic manipulation remains unclear, where long-horizon tasks require tracking partial progress, reasoning about object relations, recovering from mistakes, and steering noisy low-level policies. In this paper, we study whether VLMs can be trained to reason directly in natural language to guide low-level manipulation policies. We introduce $R^3$, a simple post-training recipe that turns off-the-shelf VLMs into robotic reasoners: it first mid-trains a VLM on expert-generated reasoning traces to initialize the desired reasoning style, then improves the reasoner with single-step rubric-based RL from offline action data. Unlike prior robotic reasoning methods that mostly use structured traces as auxiliary supervision, $R^3$ trains free-form language reasoning to produce test-time guidance for action. We instantiate $R^3$ on Language Table and simulated bimanual grocery packing, two controlled testbeds for studying robotic reasoning and long-horizon manipulation. $R^3$ improves exploration and generalization across unseen tasks and significantly outperforms instruction-only imitation learning baselines on both benchmarks. Our analyses suggest that free-form language reasoning can function as a test-time compute mechanism for steering low-level policies. Our project page is available at https://robotic-reasoner.github.io/.", "pdf_url": "https://arxiv.org/pdf/2608.26053v1"}, {"title": "When Obstacles Bend: Modeling Vegetation Deformation in the context of Field Robotics", "authors": ["Muhammad Hsaeeb Zaar Khizar", "Tom Montagnon", "Roland Lenain", "Romuald Aufrère", "Johann Laconte"], "published": "2026-08-26", "summary": "Autonomous robots operating in natural environments must often interact with vegetation rather than simply avoid it. In this context, traversability is typically defined from the robot's perspective, by measuring how a specific platform responds when moving through the environment. While practical, this viewpoint entangles the assessment of the environment with the robot's own dynamics, making the resulting characterization difficult to transfer across different platforms. More importantly, it does not directly reflect the properties of the vegetation itself, which are the true source of interaction and potential damage in applications such as agriculture and environmental monitoring. To address this limitation, we propose to characterize vegetation through its intrinsic mechanical properties, independently of any specific robot. By combining deformation measurements with contact force data, we estimate the underlying mechanical parameters and reconstruct the vegetation's response to interaction. This enables vegetation-aware navigation based on intrinsic environmental properties rather than platform-dependent metrics.", "pdf_url": "https://arxiv.org/pdf/2608.26050v1"}, {"title": "UltraPIPS: Improving model perception in B-mode ultrasound with foundation models", "authors": ["Tal Grutman", "Tali Ilovitsh"], "published": "2026-08-26", "summary": "In medical imaging, it is common to use learned perceptual image patch similarity (LPIPS) to compare images semantically in feature space. Although backbones pretrained on natural images are widely used for LPIPS computation, B-mode ultrasound images possess distinct speckle patterns and acoustic-specific image statistics that are fundamentally different from natural images and even from other images in radiology. Consequently, we propose that domain-specific models are needed to measure perceptual similarity in ultrasound data, a finding which is not necessarily the case for other imaging modalities. We compare LPIPS metrics across downstream tasks like classification, segmentation and reconstruction using natural image, medical generalist and ultrasound backbone models and show that selection of LPIPS backbone is a non-trivial design choice. In particular, the ultrasound backbone models were more correlated with downstream performance of supervised models than classical and natural image models, and optimization of the LPIPS loss with an ultrasound backbone achieved a strong balance between reconstruction quality and realism. Our code is available at https://github.com/talg2324/UltraPIPS and introduces the UltraPIPS library, a set of LPIPS metrics based on the open-source foundation models analyzed in this paper.", "pdf_url": "https://arxiv.org/pdf/2608.26033v1"}, {"title": "Phantom Navigator: Stealthy and Precise Unmanned Aerial Vehicle Redirection with Real-Time Tracking and GPS Spoofing", "authors": ["Haocheng Meng", "Shaocheng Luo", "Songqiao Xie", "Miroslav Pajic"], "published": "2026-08-26", "summary": "Redirecting unmanned aerial vehicles (UAVs) from their intended mission trajectories has been an active area of research. However, existing UAV redirection attacks lack reliability, precision, and covertness for a targeted diversion. They primarily rely on physical capture, communication hijacking, or sensor spoofing. Yet, physical interception is costly, offers only a single opportunity for success, and poses a high risk of collateral damage; network-based attacks demand deep technical expertise and access to encrypted communication channels; and sensor spoofing techniques typically fall short in achieving the accuracy and robustness required to steer a UAV toward a specified target. Consequently, we propose Phantom Navigator, a UAV redirection attack to mislead drones to a designated spoofing target, covertly and precisely. Our approach combines offline pre-redirection reachability analysis, which provides high-fidelity estimates of achievable redirect ranges, with an online closed-loop, stealthy execution layer that ensures successful redirection in practice. Based on this approach, we build a physical attack platform equipped with a LiDAR--camera detection, tracking, and spoofing stack that performs real-time identification, pose estimation, and computation of targeted spoofing signals to covertly and accurately redirect victim UAVs to a designated location. We demonstrate the effectiveness of our redirection methodology and the attack implementation in real-world case studies.", "pdf_url": "https://arxiv.org/pdf/2608.26011v1"}, {"title": "DESCENT: Directed Edge Scene Encoding for Airport Surface Movement Prediction", "authors": ["Alexander Prutsch", "David Schinagl", "Horst Possegger"], "published": "2026-08-26", "summary": "Advanced automation is a key technology for enhancing the safety of ground operations amidst the increasing density of commercial air traffic. While motion forecasting is a well-studied task in autonomous driving, its application to airport surface movements remains underexplored. To enable efficient and accurate prediction in this domain, we propose DESCENT, a transformer-based architecture designed to handle heterogeneous dynamics and strict topological constraints. Our approach features a Potential Reachable Set (PRS) context sampling mechanism that adaptively collects airfield environment context across diverse operational phases. Combined with a detection transformer-based decoder, DESCENT generates accurate trajectory forecasts. Extensive evaluations on the Amelia-10 benchmark demonstrate significant performance improvements over state-of-the-art baselines. These gains are especially pronounced in safety-critical scenarios, where our domain-aware sampling provides critical long-horizon context necessary for safe navigation.", "pdf_url": "https://arxiv.org/pdf/2608.26002v1"}, {"title": "4DGS-WAM: Bridging Past and Future with an Object-Centric World Action Model based on 4D Gaussian Splatting", "authors": ["Yueen Ma", "Zenglin Xu", "Irwin King"], "published": "2026-08-26", "summary": "Current world action models (WAMs) typically operate on 2D visual data. These models can achieve exceptional visual quality, but they lack explicit spatial structure for individual objects and repeatedly process redundant background content. Although point clouds can represent the world in 3D space, they can be difficult to align and accumulate across viewpoints. In this paper, we leverage an explicit 4D Gaussian Splatting (4DGS) representation that separately models dynamic objects and the static background of a scene. For dynamic objects, we use a policy model to predict future actor actions and a world model to predict transformations of their observed Gaussian splats. The static background need not be regenerated for future states, as much of it has already been observed in past frames. This forms an object-centric world action model, which we name 4DGS-WAM. It lifts 2D observations into a persistent 4D representation so that previously observed static content can be reused during future prediction. Future-state extrapolation can then focus on modeling the evolution of dynamic objects. Experiments on KITTI-MOT evaluate short-horizon prediction and past reconstruction.", "pdf_url": "https://arxiv.org/pdf/2608.25956v1"}, {"title": "Auditable CT Phenotyping Through Report-derived Radiological Observations", "authors": ["Riga Wu", "Walter Witschey", "Yicheng Li", "Felix Barajas Ordonez", "Keno K. Bressem", "Lisa C. Adams", "Gary E. Weissman", "Li Shen", "Christos Davatzikos", "Eduardo Barbosa", "Daniel Truhn", "Tianyu Han"], "published": "2026-08-26", "summary": "Medical image foundation models can predict clinical phenotypes from computed tomography (CT), but strong performance leaves open whether they read disease-specific findings or shortcuts that correlate with the diagnosis. We tested this in 221 electronic-health-record (EHR) phenotypes using Auditable CT phenotyping (ACT), built on report-derived radiological observations. We trained ACT on 38,317 patients, mined 376,194 observations and evaluated it in 25,183 held-out patients. ACT exceeded five vision-language baselines on zero-shot annotation, and CT-CLIP across 221 phenotypes from unseen CT pulmonary angiography, both under zero-shot scoring (0.651 versus 0.572) and under linear probing (0.709 versus 0.662). Reading each probe exposes what accuracy conceals: only 97 observations occupy the 221 rank-1 positions, and one phrase describing aortic and coronary calcification ranks first for 20 phenotypes, including osteoporosis, urinary tract infection and major depressive disorder. Restricting the bank to clinician-specified evidence redirects those probes onto phenotype-related observations in 86 phenotypes at no accuracy cost (0.751 versus 0.741). Accurate CT-based EHR phenotyping can therefore rest on observations that are not valid evidence for the coded phenotype and that ACT can identify and intervene on.", "pdf_url": "https://arxiv.org/pdf/2608.25948v1"}, {"title": "A Statistical Audit of Physical AI Benchmark Redundancy", "authors": ["Zaruhi Navasardyan", "Hrant Davtyan"], "published": "2026-08-26", "summary": "Physical AI models are evaluated on suites of benchmarks that differ across model reports, leaving the model-by-benchmark matrix sparse and the relationship between benchmarks unmeasured. We construct a matrix of 51 models on 12 physical AI benchmarks, selected from a registry of 51 benchmarks and 152 models by reporting density, combining scores from model cards and benchmark papers with our own evaluation runs under each benchmark's official protocol. We measure how much information the benchmarks share and show quantitative evidence of Redundancy. Redundancy affects reported rankings: collapsing the two substitute pairs into single columns moves 22 of 51 models by three or more places under an equally weighted average. We then select benchmarks greedily under a utility combining score dispersion with variance not explained by the already-selected set, and obtain a four-benchmark subset retaining 78.5\\% of the utility of all 12, on which we fit a Bradley--Terry ranking. The procedure requires only benchmark-level scores with sufficient overlap and is not specific to physical AI.", "pdf_url": "https://arxiv.org/pdf/2608.25940v1"}, {"title": "Code World Model: Coding Agent as World Brain", "authors": ["Yiwen Chen", "Guosheng Lin", "Chi Zhang"], "published": "2026-08-26", "summary": "World models aim to simulate how complex environments evolve under actions and events, yet existing video-based world models primarily learn dynamics from visual observations, which reveal outcomes rather than the underlying knowledge, rules, and mechanisms governing world evolution. This makes it difficult to maintain persistent consequences and support coherent, open-ended evolution. We introduce Code World Model, a framework that separates world evolution from visual realization by combining the reasoning and coding capabilities of language models with the generative priors of video models. A coding agent serves as the world brain, reasoning about events and their consequences and generating executable code to maintain persistent world state and perform rule-consistent evolution. To connect executable state with visual generation, we introduce a proxy representation that encodes frame-wise spatiotemporal constraints and is compiled into a proxy video, which conditions a video model to render high-fidelity visual observations. We further develop data pipelines for constructing aligned proxy-observation pairs from gameplay and real-world videos. After fine-tuning on paired gameplay data, MiniMax-H3 follows proxy-based spatiotemporal specifications from simple interactive worlds built by the coding agent while preserving rich visual details and dynamics. These results demonstrate the potential of combining code for persistent world evolution with video models for flexible visual realization, providing a new path toward open-ended world models.", "pdf_url": "https://arxiv.org/pdf/2608.25927v1"}, {"title": "Choose Your Game Wisely: Measuring Game-Theoretic Structures in Real-World Vehicle Interactions", "authors": ["Yueyuan Li", "Rongcheng Nie", "Weijie Xi", "Mingyang Jiang", "Songan Zhang", "Hanyang Zhuang", "Ming Yang"], "published": "2026-08-26", "summary": "Game-theoretic models provide principled frameworks for modeling vehicle interactions, but their underlying temporal assumptions have not been systematically examined against real-world driving behavior. In particular, it remains unclear how simultaneous, sequential, and asymmetric interaction structures can be measured from vehicle trajectories. This paper develops a trajectory-based interaction measurement framework to identify interaction events and quantify behavioral change onset, temporal organization, post-onset response dynamics, and ordering stability. The framework uses behavioral deviations to verify candidate interactions. We evaluate the framework on six real-world trajectory datasets, including INTERACTION, highD, inD, rounD, Waymo Open Motion, and nuPlan, covering diverse road geometries, traffic environments, and interaction types. The results show that concurrent and sequential behavioral changes both constitute substantial proportions of observed following, merging, and conflicting interactions. Among sequential interactions, stable ordering is more prevalent than alternating ordering, indicating that persistent asymmetric roles are a common interaction structure. Importantly, temporal precedence does not necessarily coincide with a measurable behavioral response, indicating that temporal ordering alone may not be sufficient to characterize behavioral dependence. These findings show that real-world interactions exhibit concurrent, sequential, and persistently ordered temporal structures. Different game-theoretic formulations are therefore better regarded as complementary modeling abstractions for different interaction regimes rather than as a universal structure governing all vehicle interactions.", "pdf_url": "https://arxiv.org/pdf/2608.25917v1"}, {"title": "A spinal circuit for collective coordination", "authors": ["Laurence Picton", "David Madrid", "Alessandro Pazzaglia", "Yutong Wang", "Maria Bertuzzi", "Andrea Ferrario", "Alexandros Anastasiadis", "Jonathan Arreguit", "Pierre Fontanel", "Chun-Xiao Huang", "Karen Mulleners", "Jianren Song", "Auke Jan Ijspeert", "Abdel El Manira"], "published": "2026-08-26", "summary": "The coordinated movement of animal groups is one of the most widespread social behaviors, which are generally attributed to high-order cognitive processing in the brain. Yet, collective coordination can seemingly emerge from rapid, local interactions between individuals, suggesting the existence of decentralized mechanisms of online coordination that remain to be identified. Here, we show that a low-order spinal sensorimotor circuit is required for real-time social coordination during schooling in zebrafish. Central to this circuit are intraspinal proprioceptive neurons that detect local body bending and deliver direct, curvature-based inhibition to precisely time the locomotor network. Combining electrophysiology, calcium imaging, optogenetics, and behavioral analysis, we show that this circuit encodes both self-generated (egocentric) and neighbor-induced (allocentric) body bending signals, enabling fish to match the phase of their swimming to the wakes of their neighbors (vortex phase matching). In a neuromechanical model and physical robot, this single feedback loop is sufficient to generate vortex phase matching and to lower the energetic cost of swimming. Disrupting this circuit uncouples neighboring fish and abolishes schooling behavior. These results show that a spinal circuit dynamically synchronizes individuals through simple, local interactions, revealing how low-order mechanisms can drive the emergence of coordinated group behavior.", "pdf_url": "https://arxiv.org/pdf/2608.25909v1"}, {"title": "A General-Purpose Molecular Foundation Model Transfers Across Diverse Olfactory Tasks", "authors": ["Yikun Han", "Yi Wang", "Neil Mankodi", "Stephen Yang", "Ambuj Tewari"], "published": "2026-08-26", "summary": "Foundation models have transformed molecular property prediction, yet it remains unclear whether a molecular foundation model, fine-tuned on a single canonical olfactory prediction task, can learn representations that transfer across diverse machine olfaction problems. We investigate this question by fine-tuning Uni-Mol2 on the GS-LF benchmark for multi-label odor descriptor prediction and evaluating the resulting model, without additional deep-learning training, on four complementary downstream settings: cross-dataset odor descriptor prediction, odorous-versus-odorless classification, enantiomer evaluation, and odor mixture discriminability. The fine-tuned model matches or exceeds the performance of the state-of-the-art olfaction-specific baseline on the primary GS-LF benchmark and consistently transfers across these downstream evaluations. The enantiomer analysis further shows that three-dimensional molecular representations distinguish mirror-image molecules in a way that two-dimensional graph models fundamentally cannot, although accurately predicting the perceptual consequences of stereochemistry remains an open challenge. Together, these results support a train-once, transfer-across-tasks paradigm for machine olfaction and suggest that chemically pretrained molecular representations provide a strong foundation for transferable olfactory prediction.", "pdf_url": "https://arxiv.org/pdf/2608.25893v1"}, {"title": "Low-Resolution Perception for Robotic Packing", "authors": ["Giuseppe Fabio Preziosa", "Federico Vignoni", "Chiara Castellano", "Marco Faroni", "Andrea Maria Zanchettin", "Paolo Rocco"], "published": "2026-08-26", "summary": "This work tackles the problem of scalable perception for robotic packing with low-cost, low-resolution depth sensing. We propose a framework where reconstruction cues drive next-view selection and grasp evidence updates a per-object stability estimate, jointly deciding what to acquire next and when to grasp. During the reconstruction, a low-resolution Next Best View (NBV) strategy explicitly avoids redundant views while preserving task-relevant geometry. We validate the approach in two steps: (i) an ablation study of the utility function under very low resolution, and (ii) a full end-to-end evaluation across policies, showing how low-resolution perception is a practical, scalable option for robotic packing.", "pdf_url": "https://arxiv.org/pdf/2608.25874v1"}, {"title": "VISTA: Visually Inferred Spatial ConTact Attention for Contact-Rich Manipulation", "authors": ["Jiayi Chen", "Wenlong Dong", "Yan Huang", "Xianglin Chen", "Zijian Lin", "Jiaqi Yin", "Yushan Liu", "Wenbo Ding"], "published": "2026-08-26", "summary": "Contact-rich manipulation requires precise interaction feedback. While vision-centric imitation learning is prevalent, external visual observations provide indirect and ambiguous cues about contact states, particularly under occlusion or subtle object--gripper interactions; dedicated tactile or force sensors can provide rich contact information but introduce additional hardware complexity, calibration requirements, and deployment costs. To bridge this gap, we propose VISTA-Policy, an imitation learning paradigm that utilizes the Visual Deformation Field (VDF), a 3D displacement representation of a compliant gripper, as high-dimensional visuo-physical feedback. The framework integrates: 1) a Physics-Aware Encoding Engine for real-time VDF decoding; 2) an Energy Aggregation Denoising Mechanism to isolate true interaction signals; and 3) a Deformation-Augmented Policy Network with incremental gripper actions for precise closed-loop correction. Extensive evaluations on Cross-Scale Object Grasping, Cap Unscrewing, and Calligraphy Writing demonstrate that VISTA-Policy outperforms the strong pure-vision baseline 3D Diffusion Policy and the tactile baseline. VISTA-Policy further demonstrates substantial out-of-distribution generalization to unseen object scales and robustness against dynamic disturbances, offering a durable and cost-effective route toward general-purpose fine-grained manipulation in unstructured environments. Project videos and supplementary materials are available at: https://sites.google.com/view/vista-policy.", "pdf_url": "https://arxiv.org/pdf/2608.25872v1"}, {"title": "MA-VLA: Multi-Arm Vision-Language-Action Model for Collaboration and Compositional Generalization", "authors": ["Zaibin Zhang", "Junlan Xiao", "Zhongbo Zhang", "Yifan Wang", "Li Kang", "Yiran Qin", "Changxing Xia", "Heng Zhou", "Talas Fu", "Enshen Zhou", "Ruimao Zhang", "Zhenfei Yin", "Huchuan Lu", "Lijun Wang"], "published": "2026-08-26", "summary": "Multi-arm collaboration is becoming a core capability in embodied manipulation. Recent vision-language-action (VLA) models integrate perception, language, and control, but most represent language as a single global instruction and do not provide an explicit mechanism for assigning and composing arm-specific behaviors. This design limits transfer to collaboration patterns that differ from those observed during training. We present MA-VLA, a unified framework for multi-arm collaboration via atomic action assignment. MA-VLA decomposes cooperative behavior into mid-level atomic prompts and allocates them to individual arms, enabling explicit subgoal specification and compositional reuse across tasks. To reduce reliance on fixed execution roles, we introduce Arm Shuffle, a training-time permutation of the observation, state, and assigned atomic prompts for each arm. This permutation enforces role-agnostic instruction following and supports recomposition into unseen coordination patterns, which we term multi-arm compositional generalization. We also construct a benchmark in which test-time collaboration patterns are absent in training set. Across simulation and real-world evaluations, prior state-of-the-art VLAs largely fail under these unseen collaborations, while MA-VLA consistently succeeds. These results indicate that structured, per-arm atomic action assignment offers a practical route to scalable generalization in multi-arm embodied systems. Code, models, and data are available at https://github.com/zhangzaibin/future-robots", "pdf_url": "https://arxiv.org/pdf/2608.25864v1"}, {"title": "Precipitation Downscaling Using Foundation Model-Conditioned Diffusion", "authors": ["Victor Nascimento Ribeiro", "Jorge Guevara", "Jorge Sebastian Moraga", "Chris Lucas", "Natalie Lord", "Andrew Taylor", "Edward Lockhart", "Will Trojak", "Johannes Schmude", "Anne Jones"], "published": "2026-08-26", "summary": "High-resolution precipitation fields are essential for hydrological impact assessment, yet global climate model outputs are too coarse and biased for direct use. AI-based statistical downscaling with diffusion models offers a promising approach, but the mechanism by which large-scale atmospheric predictors condition generation remains largely unexplored. We investigate three conditioning strategies for a denoising diffusion probabilistic model applied to daily precipitation downscaling: channel concatenation of upsampled coarse predictors, cross-attention conditioning with a learned convolutional encoder, and cross-attention conditioning with the frozen encoder of the pretrained Prithvi WxC weather foundation model. All strategies are evaluated against an unconditioned baseline under identical conditions using probabilistic, distributional, spectral, and extreme-event metrics for the Colorado River Basin. Concatenation conditioning achieves the lowest point-wise CRPS and MSE, but tends to produce over-smoothed fields that suppress high-intensity events. In contrast, cross-attention conditioning provides substantially better distributional realism and modest improvements in spectral fidelity. Improvements are greatest for extremes: the Prithvi-WxC conditioned model retains over half of >100mm/day events, although estimates are uncertain due to limited samples. When trained on the full dataset, the learned convolutional model performs similarly to the foundation model-conditioned approach while requiring lower computational resources. However, the Prithvi-WxC-conditioned model achieves comparable performance with only five years of training data. These results indicate that cross-attention conditioning offers advantages over simple concatenation for probabilistic precipitation downscaling, and that pre-trained foundation model representations may offer benefits in data-limited settings.", "pdf_url": "https://arxiv.org/pdf/2608.25858v1"}, {"title": "Anytime Global Tensor Motion Planning", "authors": ["Sai Coumar", "An T. Le", "Zachary Kingston"], "published": "2026-08-26", "summary": "Global Tensor Motion Planning (GTMP) solves motion planning with batched tensor operations over a layered multipartite graph. We generalize GTMP so that adjacent-layer edges are realized by any black-box local planner (e.g., linear interpolation, splines, sampling-based planning, trajectory optimization, or generative sampling). We provide two anytime policies on top of this generalization: Anytime GTMP with random restarts at a fixed budget, which covers every homotopy class almost surely, and AO-GTMP with informed expansion with growing budgets, which converges to the optimal cost. We prove that a single sampled graph covers every endpoint-fixed homotopy class admitting a \\(δ\\)-clear representative of bounded length. We also prove that additional samples per layer reduce the per-layer miss probability exponentially, whereas stronger local planners reduce the required layer count only sublinearly. On manipulation benchmarks the method matches state-of-the-art performance, and on 2D navigation it returns batches of topologically diverse solutions, while the informed baselines concentrate on one or two classes.", "pdf_url": "https://arxiv.org/pdf/2608.25830v1"}, {"title": "Label-Free Foundational Model Selection for Medical Image Classification under Distribution Shift via Pseudo Label Discrepancy", "authors": ["Juan Iñaki Larrea", "Lucas Mansilla", "Enzo Ferrante"], "published": "2026-08-26", "summary": "Foundation models are increasingly deployed for medical image analysis. However, under the inter-institutional distribution shift typical of deployment, their performance varies widely and cannot be known without target-domain labels, which are rarely available. This leaves a practical question unresolved: given several candidate foundational models and labeled-data from a source domain, which one to deploy in an unlabeled target domain? We propose a label-free selection criterion built on SUDO, a framework for evaluating clinical AI systems without ground-truth annotations. SUDO partitions the unlabeled target data by predicted probability and, for each region, measures a pseudo-label discrepancy reflecting class contamination; aggregated across regions, this yields a score (AURCC) requiring neither target annotation nor fine-tuning. We show that AURCC can be used to rank a variety of vision-language models (BioMedCLIP, CXR-CLIP, CheXzero, MedCLIP, MedImageInsight, CLIP) on chest X-ray classification across three inter-hospital shift scenarios, under zero-shot and MLP-probe regimes. The AURCC ranking recovers the ground-truth ranking with Spearman rho up to 0.943 (p<0.05). Against the natural baseline of ranking by held-out source accuracy, AURCC is competitive when the labeled source is large and yields a more accurate ranking once it is small; the regime of interest in resource-constrained settings.", "pdf_url": "https://arxiv.org/pdf/2608.25810v1"}, {"title": "TDFNet: Tri-projection Deformable Fusion Network for Panoramic Salient Object Detection", "authors": ["Qiangqiang Zhou", "Jiacong Yu", "Jiawei Xu", "Yong Chen", "Xin Huang", "Ping Li"], "published": "2026-08-26", "summary": "Recent years have witnessed the growing potential of panoramic salient object detection in robotic vision, virtual reality, and related applications. However, projecting spherical scenes onto 2D planes inevitably introduces geometric distortions, which fundamentally limit the effectiveness of existing projection-based methods. Specifically, Equirectangular Projection (ERP) suffers from severe polar stretching distortions, while cube map projection introduces discontinuities across cube-face boundaries, resulting in degraded feature discriminability and compromised geometric consistency. To address these limitations, we propose TDFNet, the first Tri-projection Deformable Fusion Network for panoramic salient object detection, exploiting complementary projection representations to alleviate geometric distortions and improve detection performance.Specifically, we design a cross-projection deformable attention (CDA) module that leverages spatial correspondences between different projections to construct geometry-aware sampling locations, guiding deformable attention for cross-projection contextual aggregation and enhancing robustness against projection-induced deformations. Furthermore, we introduce a latitude-guided fusion module, which utilizes spherical latitude priors to construct geometric confidence weights for adaptively balancing ERP and CMP features. Meanwhile, LGF incorporates distortion-reduced semantic references from Tangent Projection to achieve cross-projection feature refinement and spatial alignment.By constructing a three-branch encoding architecture based on ERP, CMP, and Tangent Projection, TDFNet simultaneously preserves global spatial continuity, local geometric details, and fine-grained boundary information.", "pdf_url": "https://arxiv.org/pdf/2608.25808v1"}, {"title": "AGRO-Nav: Autonomous Graph-based Orchard Navigation", "authors": ["Ho Young Yun", "Jaemin Yu", "Duksu Kim"], "published": "2026-08-26", "summary": "Orchards form semi-structured environments in which parallel tree rows create natural driving corridors, yet narrow inter-row clearance and dense foliage lead geometry-agnostic grid planners to drift off the row center and risk trunk or canopy contact. We present AGRO-Nav, an automated framework for static graph-based global planning in orchards. From tree-row lines fitted to trunk clusters in a SLAM point cloud, it builds, without any manual waypoints, a sparse topological graph of intra- and inter-row connectivity; a global route is then found by Dijkstra search on this graph, connected to the start and goal by any-angle Theta* segments, and smoothed with a cubic B-spline. In real-orchard trials, AGRO-Nav follows the row center with a mean error of about 0.08 m, far below the A* (0.31 m) and Theta* (0.43 m) shortest-path baselines, while planning roughly four to five times faster. In Isaac Sim, it attains the lowest error among A*, Theta*, and a reproduced RANSAC midline baseline and remains stable as tree density drops to 70%, where the RANSAC baseline degrades. The resulting trajectories---straight row-centered segments joined by controlled turns---suit differential-drive and four-wheel-steering platforms.", "pdf_url": "https://arxiv.org/pdf/2608.25799v1"}, {"title": "TacForcing: Streaming Action Generation with Execution-Time Tactile Feedback", "authors": ["Jianbo Zhou", "Boyuan Zhao", "Yuzheng Zhang", "Yiyang Chen", "Wenxin Chen", "Qiuyue Li", "Xiangyang Gu", "Yuhan Cao", "Xiao Xia", "Yanzhe Hu", "Zhijie Deng"], "published": "2026-08-26", "summary": "Contact-rich manipulation requires adapting to contact states that can evolve substantially within an action horizon. However, chunk-based vision-language-action models predict complete action chunks from observations collected before execution, leaving tactile conditioning stale during execution. Existing tactile-reactive approaches typically rely on separate high-frequency controllers, which increase both architectural and training complexity. In this paper, we introduce TacForcing, a streaming action-generation framework that effectively incorporates execution-time tactile feedback. Instead of employing a separate reactive controller, TacForcing replaces the standard action expert with a streaming action expert to generate actions conditioned on the evolving tactile observations acquired during execution. TacForcing also introduces Execution-Aware Tactile Attention (EATA), which restricts tactile conditioning to actions nearing execution, thereby reducing the temporal mismatch between tactile acquisition and action execution. Across six simulated UniVTAC tasks and three real-world contact-rich manipulation tasks, TacForcing achieves average success rates of 65% and 69%, respectively, outperforming strong baselines in both settings.", "pdf_url": "https://arxiv.org/pdf/2608.25798v1"}, {"title": "EXAONE Tabular 1.0 : Technical Report", "authors": ["Moonjung Eo", "Min-Kook Suh", "Hye-Seung Cho", "Jiwon Kim", "Seoyoon Kim", "Sangjun Nam", "Soonyoung Lee"], "published": "2026-08-26", "summary": "EXAONE Tabular is a compact tabular foundation model family for classification and regression via in-context learning, producing predictions without dataset-specific gradient updates. Pretrained exclusively on a synthetic structural-causal-model (SCM) prior, its central contribution is an architecture-centered redesign of tabular in-context learning. Rather than compressing features into a fixed row embedding before a separate row-level learner, EXAONE Tabular interleaves feature-axis attention within each item with support-conditioned item-axis attention within each feature at every Transformer layer, mediated by item-summary and feature-summary tokens. Across four public benchmarks, EXAONE Tabular combines strong predictive performance with high efficiency. On TabArena, its 20.81M-parameter classification model ranks first overall, surpassing tuned ensembles and 4-hour AutoML pipelines, while regression reaches the performance regime of the 1.64B-parameter TabFM at roughly 1/11 the inference cost. On BCCO and TALENT, EXAONE Tabular ranks second in classification and first in regression. On ScoringBench, it achieves the best mean rank for both point-estimation and predictive-distribution quality, leading the $R^2$, RMSE, and CRPS evaluations. Together, these results establish EXAONE Tabular as a state-of-the-art compact tabular foundation model family, combining strong predictive performance across classification, point regression, and probabilistic regression with an efficient model design.", "pdf_url": "https://arxiv.org/pdf/2608.25774v1"}, {"title": "HypoForge: A Self-Improving Multi-Agent Framework for Automated Hypothesis Generation and Testing via Scientific Skill Learning", "authors": ["Ziqing Qian", "Jiaying Lei", "Yifang Wang", "Nan Cao"], "published": "2026-08-26", "summary": "Large language models (LLMs) have enabled AI scientist systems to automate scientific discovery, yet existing approaches most rely on static prompting or fixed workflows and fail to accumulate experience for continual improvement. We propose HypoForge, an experience-guided multi-agent framework that learns reusable scientific skills for automated hypothesis generation and hypothesis testing. HypoForge is built on the observation that these two stages involve different supervision signals. For hypothesis generation, where explicit feedback is unavailable, HypoForge adopts an adversarial generator--discriminator mechanism to improve reasoning through comparative critique. For hypothesis testing, where empirical feedback is available, HypoForge learns testing skills from execution outcomes and ground-truth results. By matching skill learning strategies with stage-specific supervision, HypoForge enables continual improvement without fine-tuning foundation models. Experiments on hypothesis generation and testing benchmarks show that HypoForge consistently outperforms existing AI scientist frameworks and skill-level variants. Further analysis demonstrates the effectiveness of the proposed stage-specific skill learning paradigms.", "pdf_url": "https://arxiv.org/pdf/2608.25770v1"}, {"title": "MoganBert-TR: A Turkish Encoder Foundation Model Trained from Scratch with a CLM-to-MLM Curriculum", "authors": ["Furkan Yilmaz", "Habibe Aleyna Tasdemir", "Muhammed Faruk Gozay"], "published": "2026-08-26", "summary": "Turkish encoder models have adopted modern architectures while leaving the pretraining objective fixed at masked language modelling. This paper introduces MoganBert-TR, a 149M-parameter Turkish encoder foundation model trained from scratch on a language-specifically filtered corpus, together with an embedding model derived from it (MoganBert-Embed). MoganBert-TR is trained over 237.3B tokens with a two-stage CLM-to-MLM curriculum: causal language modelling first, masked language modelling for the remainder, with the transition made inside the stable phase of a WSD schedule. In a controlled ablation under an equal step budget, this design outperforms pure MLM by 2.7-3.7x on Turkish MS MARCO retrieval; the measured mechanism is embedding geometry, where a single direction absorbs 28.1% of the variance under pure MLM against 11.9% under the curriculum. Long-context extension and learning-rate decay are then split into two branches after a shared prefix: running the final portion of decay at 1024 context improves the TrGLUE average by 0.49 +/- 0.26 points across five paired seeds (p = 0.013) and beats a model-soup alternative by 0.75 points at ~4.3% additional cost. MoganBert-TR attains 78.41 on TrGLUE, the best among the Turkish ModernBERT models compared, and 77.73 on TabiBench, where it leads two of the eight categories with the largest margin on code retrieval (+3.62 points over TabiBERT). MoganBert-Embed, produced through teacher distillation and multi-signal contrastive fine-tuning, ranks first among student models on the MTEB(Turkish) overall average with 68.30 and reaches 99.5% of its 7.57B-parameter teacher's score with a 51x smaller backbone. The accompanying 50,048-token tokenizer outperforms all compared Turkish tokenizers on compression and fertility across two independent test sets. Weights, tokenizer, embedding model and evaluation code: https://huggingface.co/moganai", "pdf_url": "https://arxiv.org/pdf/2608.25768v1"}, {"title": "LM-X: Explainable Action Modeling with Progress, Event, and Uncertainty Prediction for Generalist Robot Manipulation", "authors": ["Jin Lou", "Jingxuan Zhu", "Andong Chen", "Xupeng Wang", "Yuan Xu", "Yuexuan Li", "Xingdong Zhu", "Zhijie Zhu", "Yingwei Ji", "Wenpeng Nie", "Jingyi Li", "Liangliang Chen", "Jinyan Liu", "Zhiqi Song", "Jidong Zhang", "Hongming Li", "Yuchen Zhu"], "published": "2026-08-26", "summary": "Generalist vision--language--action (VLA) policies learn long-horizon behavior mainly through short-horizon action prediction and reveal little beyond sampled commands. This creates two coupled bottlenecks: a single action target must implicitly absorb task progress, intermediate intent, and local reliability, while these control states remain hidden during execution. Inspired by functional principles of biological sensorimotor control, we introduce LM-X , which organizes prediction across task, event, and motor scales without claiming anatomical correspondence. Three explicitly supervised signals are emitted online and directly condition action generation: return-to-go (RTG) measures visible task progress, event-to-go (ETG) identifies the next semantic transition, and heteroscedastic action flow estimates local reliability through propagated variance. Explanation is therefore intrinsic to control rather than generated post hoc. Before a costly 20-day pretraining run on 64 NVIDIA B200 GPUs, a controlled five-task pretraining gate verifies the design: the complete model improves success by 16.0 points over the action-only backbone and by 10.8 points over the strongest single-head variant. We then train LM-X on more than 20,000 hours of real-robot trajectories, including over 1,000 hours of failed policy rollouts. LM-X achieves 74.1\\% across 50 randomized-hard RoboTwin2.0 tasks versus 55.4\\% for GR00T N1.7, and 68.6\\% versus 50.7\\% across seven real-robot tasks. RTG tracks semantic progress and visible regression, while variance rises during hesitation and oscillatory control. These results show that explicit multi-timescale predictive state can strengthen control while exposing interpretable internal estimates.", "pdf_url": "https://arxiv.org/pdf/2608.25757v1"}], "repos": [{"repo": "NVIDIA/skills", "stars": 3120, "language": "Python", "description": "Agent Skills for NVIDIA products — install into Claude Code, Codex, and other coding agents to run Physical AI, robotics, simulation, CUDA, and RAG workflows end to end.", "url": "https://github.com/NVIDIA/skills", "date": "2026-08-27", "topic": "physical-ai", "score": 1248.1}, {"repo": "copper-project/copper-rs", "stars": 1468, "language": "Rust", "description": "Copper is an operating system for robots -  build, run, and replay your entire robot deterministically.", "url": "https://github.com/copper-project/copper-rs", "date": "2026-08-27", "topic": "physical-ai", "score": 587.3}, {"repo": "Edgenesis/shifu", "stars": 1432, "language": "Go", "description": "Kubernetes-native IoT gateway", "url": "https://github.com/Edgenesis/shifu", "date": "2026-08-27", "topic": "physical-ai", "score": 572.9}, {"repo": "mosaico-labs/mosaico", "stars": 961, "language": "Python", "description": "Mosaico - The data platform for Physical AI", "url": "https://github.com/mosaico-labs/mosaico", "date": "2026-08-27", "topic": "physical-ai", "score": 384.5}, {"repo": "awslabs/awsome-distributed-ai", "stars": 472, "language": "Shell", "description": "Collection of best practices, reference architectures, model training examples and utilities to train large models on AWS. ", "url": "https://github.com/awslabs/awsome-distributed-ai", "date": "2026-08-27", "topic": "physical-ai", "score": 188.9}, {"repo": "autonomous-ai/autonomous-os", "stars": 228, "language": "Python", "description": "The open-source operating system for robots — install it and your robot comes alive", "url": "https://github.com/autonomous-ai/autonomo
