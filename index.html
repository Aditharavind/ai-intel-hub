h Ratel Robotics' unmanned ground vehicles in Ukraine.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/swarmer-to-acquire-ukrainian-ugv-maker-ratel-robotics-for-up-to-224m/\">Swarmer to acquire Ukrainian UGV maker Ratel Robotics for up to $224M<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Comau automates picking, handling, and palletizing for Decathlon", "source": "Robotics Business Review", "date": "2026-09-10", "url": "https://www.therobotreport.com/comau-automates-picking-handling-and-palletizing-for-decathlon/", "summary": "<p>Comau's system incorporates its MyCo cobot, ROS2 software architecture, AI-powered vision systems, and a modular gripper.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/comau-automates-picking-handling-and-palletizing-for-decathlon/\">Comau automates picking, handling, and palletizing for Decathlon<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Robots Are Learning to Feel", "source": "IEEE Spectrum Robotics", "date": "2026-09-10", "url": "https://spectrum.ieee.org/tactile-data-robots", "summary": "<img src=\"https://spectrum.ieee.org/media-library/image.jpg?id=67745231&amp;width=980\" /><br /><br /><p>Dexterous manipulation remains one of the biggest barriers keeping robots from successfully tackling a wide range of everyday tasks. A sense of touch could be the key, but a lack of quality data has held back progress. This is now starting to change as academic labs and startups race to build new tactile datasets and techniques to put them to use.<\/p><p>Over the last few years, <a href=\"https://spectrum.ieee.org/gemini-robotics\" target=\"_self\">vision-language-action (VLA) models<\/a> have significantly improved the ability of robots to carry out complex tasks involving objects and environments they’ve never encountered before. Pretrained on huge amounts of images, video, and text, and then fine-tuned on a smaller number of teleoperated robot demonstrations, these VLAs can guide robots through a growing range of everyday jobs—<a href=\"https://www.pi.website/blog/pistar06\" rel=\"noopener noreferrer\" target=\"_blank\">like folding laundry, tidying living rooms, and even operating kitchen gadgets<\/a>—using just a video feed and natural language instructions.<\/p><p>But robots still struggle with tasks that require fine-grained hand control, such as handling deformable materials or manipulating small objects—plugging in a USB cable or turning a key in a lock, for example. That’s partly because VLAs ignore one of the primary sources of information humans rely on in these situations: tactile feedback.<\/p><h2>Manipulating Like Humans<\/h2><p>“Most dexterous manipulation can be done by humans with their eyes closed,” says <a href=\"https://people.eecs.berkeley.edu/~trevor/\" rel=\"noopener noreferrer\" target=\"_blank\">Trevor Darrell<\/a>, professor of computer science at the University of California, Berkeley. “Understanding force, slip, and precise grasping is not something that can be done well with traditional vision sensors.”<\/p><p>However, making effective use of tactile sensors is difficult. Tactile sensor data has very different characteristics to the image data VLAs are normally trained on, and tactile datasets lag far behind the internet-scale of many vision and language datasets. To get around this, Darrell’s team devised a way to first pretrain a model on existing datasets before giving it a sense of touch by training a specialist submodel on <a href=\"https://arxiv.org/abs/2606.17055\" rel=\"noopener noreferrer\" target=\"_blank\">100 hours of specially collected, high-quality tactile data<\/a> including demonstrations of common actions like wiping, grasping, twisting, or pouring using more than 200 different household objects.<\/p><h3><\/h3><br />\n<p class=\"caption\">Explore an interactive visualizer of a small portion of the T-Rex dataset. <span class=\"image-media media-photo-credit\"><a href=\"https://tactile-reactive-dexterous.github.io/#citation\" target=\"_blank\">T-Rex<\/a><\/span><\/p><p>Putting the tactile data to use was not straightforward. The goal was for a robot to be able to use the tactile signal to correct its grip in real time as it manipulated objects. But this requires reaction times faster than most vision-language models operate at. This mismatch is a significant challenge, says Darrell, so the team used separate submodels, known as “experts,” to handle high-level actions and low-level tactile control in a way that’s quick enough for the tactile feedback to be useful.<\/p><p>The action expert produces motion plans, while the tactile expert, which operates four times faster, uses tactile feedback to adjust the motion plan in real time based on what the robot is feeling as it goes. The model was then fine-tuned on about 100 teleoperated demonstrations of relatively complex manipulation tasks, such as screwing in a light bulb, applying toothpaste to a toothbrush, or transferring an egg between trays, where it averaged a success rate of 65 percent across 12 tasks—nearly double the best VLA model.<\/p><h2>Data Diversity<\/h2><p>One limitation, admits Darrell, is that his data comes from a single instance of robotic hardware. Robot hands range from fully articulated five-finger designs to simple pincer grippers, and tactile sensors can rely on fundamentally different physics, from measuring changes in resistance to recording images of a soft gel pad deforming. That makes most tactile AI research sensor-specific, says <a href=\"https://michaelyuancb.github.io/\" target=\"_blank\">Chengbo Yuan<\/a>, a master’s student at Tsinghua University in Beijing, and makes it hard to share data and transfer learnings between groups.<\/p><p>Yuan recently set out to tackle this problem by <a href=\"https://arxiv.org/pdf/2606.13102\" rel=\"noopener noreferrer\" target=\"_blank\">aggregating more than 3,000 hours<\/a> of tactile robotic data from publicly available datasets, covering 21 sensor types and a variety of robot embodiments. Yuan says they were inspired by efforts like the <a href=\"https://spectrum.ieee.org/global-robotic-brain\" target=\"_self\">Open X-Embodiment collaboration<\/a>, which pooled data from many robots and led to models that generalize to hardware not used in training. Yuan’s team then designed a hardware-agnostic model that can train on this diverse data by converting each sensor’s output into a shared format and mapping it onto labeled positions on a template of a human hand. This model was much more successful than a baseline model, even on hardware it had never encountered before. Yuan puts that down to it acquiring “some kind of common sense of tactile knowledge,” by training on such diverse setups.<\/p><h2>Chasing Scale<\/h2><p>Despite the promising results, Yuan thinks more tactile data is needed, and his group is now leading an 80-institution collaboration to collate a larger set of teleoperated demonstrations using a standardized approach to tactile data collection and processing. In the meantime, Fudan University in Shanghai and its spin-out <a href=\"https://baike.baidu.com/en/item/NeoteAI/1682418\" rel=\"noopener noreferrer\" target=\"_blank\">NeoteAI<\/a> have already produced <a href=\"https://research.neoteai.com/assets/n0-foundation-report.pdf\" rel=\"noopener noreferrer\" target=\"_blank\">a tactile dataset<\/a> an order of magnitude larger than previous efforts. Using <a href=\"https://neoteai.com/\" rel=\"noopener noreferrer\" target=\"_blank\">a proprietary sensor<\/a> attached to a variety of robotic arms and a handheld gripper operated by humans, they have collected more than 30,000 hours of demonstrations with synchronized visual and tactile data.<\/p><p>The researchers used this data to <a href=\"https://research.neoteai.com/n0-twam/\" rel=\"noopener noreferrer\" target=\"_blank\">train a model<\/a> that doesn’t just react to touch, but also proactively predicts what the robot should be feeling to help guide and assess actions, significantly improving performance. <a href=\"https://shunlinlu.github.io/\" rel=\"noopener noreferrer\" target=\"_blank\">Shunlin Lu<\/a>, a postdoc researcher at Fudan University and CTO of NeoteAI, says the results are clear evidence that access to large-scale and diverse tactile data leads to significant performance gains.<\/p><p class=\"shortcode-media shortcode-media-youtube\"> <span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><small class=\"image-media media-caption\">Robot manipulation policies with a tactile component offer improved performance on a variety of real-world tasks.<\/small><small class=\"image-media media-photo-credit\">NeoteAI<\/small><\/p><p>Another approach to scaling tactile data could be to piggyback on the vast quantities of visual robotics data already collected. Researchers at the University of Southern California, in Los Angeles, recently <a href=\"https://arxiv.org/pdf/2607.20683\" rel=\"noopener noreferrer\" target=\"_blank\">released a model<\/a> that learned to infer tactile information from visual data, by training it on more than 2,700 demonstrations of everyday manipulation using a handheld gripper that records both tactile data and images from a camera on the device. The model learned associations between images of the gripper coming into contact with objects and the amount of pressure felt by the tactile sensors at that moment, giving even robots without tactile sensors a rudimentary sense of touch that the researchers showed to be particularly useful for contact-rich manipulation tasks. But their broader ambition is to use the generator to add tactile data to existing vision datasets.<\/p><p>How much tactile data will be required for breakthroughs in dexterous tasks remains unclear. So far, tactile training’s main contribution has been to make robots more efficient learners at tasks already within reach like picking and placing objects, says Yuan, and he suspects new algorithms may be required to tackle problems truly impossible without touch.<\/p><p><a href=\"https://people.ucas.ac.cn/~chenglong?language=en\" rel=\"noopener noreferrer\" target=\"_blank\">Long Cheng<\/a> of the Chinese Academy of Sciences also thinks raw data is no panacea. “Data is good,” he says. “But how to use them correctly is another issue.” The problem, he notes, is that vision provides a continuous, high-bandwidth stream of pixels, while tactile signals are sparse and intermittent, so models learn to ignore them. His solution, being presented at <a href=\"https://2026.ieee-iros.org/\" rel=\"noopener noreferrer\" target=\"_blank\">IROS 2026<\/a> later this month, is a model that predicts what a robot will feel from vision alone and then compares it against real tactile input. A large gap between the two means the sensor is detecting something the robot would otherwise miss, so these surprising signals are amplified while predictable ones are dampened. Across five contact-rich tasks the approach averaged 62.8% success against 28.2% for the same model without touch.<\/p><p>Lu is more confident that data scaling could have similar benefits to those seen in areas like language and vision. He guesses closer to 100,000 hours, collected in varied, real-world settings rather than in the lab, could unlock new capabilities. Either way, the field now has some early signs that larger tactile datasets and smarter ways to use them can give robots a significant boost on some of the most challenging tasks. “I think tactile intelligence is actually the next step for physical AI,” says Lu.<\/p>"}, {"title": "Teradyne Robotics sues JAKA over 3 Universal Robots patents", "source": "Robotics Business Review", "date": "2026-09-10", "url": "https://www.therobotreport.com/teradyne-robotics-sues-jaka-over-3-universal-robots-patents/", "summary": "<p>New details reveal the lawsuit involves three Universal Robots patents about robot interfaces, safety brakes, and joints.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/teradyne-robotics-sues-jaka-over-3-universal-robots-patents/\">Teradyne Robotics sues JAKA over 3 Universal Robots patents<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "AGIBOT to explain how to scale humanoids from the lab to the real world at RoboBusiness", "source": "Robotics Business Review", "date": "2026-09-09", "url": "https://www.therobotreport.com/agibot-share-plans-scale-humanoids-from-lab-to-real-world-at-robobusiness/", "summary": "<p>AGIBOT plans to give attendees actionable insights on identifying high-value robotics use cases and building sustainable developer ecosystems.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/agibot-share-plans-scale-humanoids-from-lab-to-real-world-at-robobusiness/\">AGIBOT to explain how to scale humanoids from the lab to the real world at RoboBusiness<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Vention opens Physical AI Lab for manufacturing in Montreal", "source": "Robotics Business Review", "date": "2026-09-09", "url": "https://www.therobotreport.com/vention-opens-physical-ai-lab-manufacturing-montreal/", "summary": "<p>Vention's new Physical AI Lab will focus on advancing robotic manipulation from research to scalable production-line deployment.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/vention-opens-physical-ai-lab-manufacturing-montreal/\">Vention opens Physical AI Lab for manufacturing in Montreal<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Unitree shares down 53% from IPO debut", "source": "Robotics Business Review", "date": "2026-09-09", "url": "https://www.therobotreport.com/unitree-shares-down-53-from-ipo-debut/", "summary": "<p>The market is pulling back on Unitree's $66 billion valuation from its debut on the Shanghai Stock Exchange just last month.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/unitree-shares-down-53-from-ipo-debut/\">Unitree shares down 53% from IPO debut<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "What bricklaying has taught Monumental about robots in construction", "source": "Robotics Business Review", "date": "2026-09-09", "url": "https://www.therobotreport.com/what-bricklaying-has-taught-monumental-about-robots-construction/", "summary": "<p>The construction industry is rife with opportunity for robotics, but the technology hasn't broken in at scale yet. <\/p>\n<p>The post <a href=\"https://www.therobotreport.com/what-bricklaying-has-taught-monumental-about-robots-construction/\">What bricklaying has taught Monumental about robots in construction<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Why vision AI is the safety backbone of the automated job site", "source": "Robotics Business Review", "date": "2026-09-08", "url": "https://www.therobotreport.com/why-vision-ai-is-safety-backbone-of-automated-job-site/", "summary": "<p>Vision AI doesn't replace robots or human judgement; it provides the continuous perception that allows both to operate safely together.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/why-vision-ai-is-safety-backbone-of-automated-job-site/\">Why vision AI is the safety backbone of the automated job site<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Boston Dynamics veteran launches Dynamic Creatures to bring characters to life with robotics", "source": "Robotics Business Review", "date": "2026-09-08", "url": "https://www.therobotreport.com/boston-dynamics-veterans-launch-dynamic-creatures-to-bring-characters-to-life-with-robotics/", "summary": "<p>Dynamic Creatures plants to create its own line of characters, and to re-create characters for specific brands and environments.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/boston-dynamics-veterans-launch-dynamic-creatures-to-bring-characters-to-life-with-robotics/\">Boston Dynamics veteran launches Dynamic Creatures to bring characters to life with robotics<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "AI can’t outrun a humanoid’s hardware", "source": "Robotics Business Review", "date": "2026-09-08", "url": "https://www.therobotreport.com/ai-cant-outrun-a-humanoids-hardware/", "summary": "<p>The remarkable progress in AI has brought robotics closer to machines capable of determining what they should do. The next major advance may depend on whether their physical systems can execute those decisions efficiently, precisely and safely.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/ai-cant-outrun-a-humanoids-hardware/\">AI can’t outrun a humanoid&#8217;s hardware<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "This Robot Will Draw Your Blood Now", "source": "IEEE Spectrum Robotics", "date": "2026-09-07", "url": "https://spectrum.ieee.org/blood-draw-robot-vitestro-aletta", "summary": "<img src=\"https://spectrum.ieee.org/media-library/an-older-silver-haired-woman-seated-at-automated-medical-device-with-a-robotic-arm-drawing-blood.jpg?id=67726417&amp;width=1200&amp;height=800&amp;coordinates=0%2C83%2C0%2C84\" /><br /><br /><p>You sit down and put your arm in the cradle. You press a button. The machine takes it from there.<\/p><p>A <a href=\"https://spectrum.ieee.org/tag/near-infrared-light\" target=\"_self\">near-infrared light<\/a> sweeps your inner elbow, hunting for a vein. A puff of alcohol hits your skin. An <a href=\"https://spectrum.ieee.org/tag/ultrasound\" target=\"_self\">ultrasound<\/a> probe glides across your arm, mapping how deep the vessel runs and which way it bends. Doppler captures the direction of blood flow to rule out the artery.<\/p><p>The cuff tightens around your upper arm. The needle comes down and pierces the skin. Your blood flows into the collection tubes, each one tipped end over end nine times—no more, no less. The needle withdraws. You get a bandage. No human ever touched you.<\/p><p>This is what it’s like to have blood taken by <a href=\"https://vitestro.com/aletta/\" rel=\"noopener noreferrer\" target=\"_blank\">Aletta<\/a>, the first <a href=\"https://spectrum.ieee.org/profile-veebot\" target=\"_self\">autonomous blood-draw device<\/a> authorized for use in the United States. Developed by the Dutch medical robotics firm <a href=\"https://vitestro.com/\" rel=\"noopener noreferrer\" target=\"_blank\">Vitestro<\/a>, the system combines imaging technologies with advanced robotics and AI to do by algorithm what a human phlebotomist—a trained health care professional who finds veins and draws blood by hand—does by feel.<\/p><p>The U.S. Food and Drug Administration <a href=\"https://www.fda.gov/news-events/press-announcements/fda-authorizes-first-its-kind-robotic-blood-draw-device\" rel=\"noopener noreferrer\" target=\"_blank\">gave Aletta the go-ahead<\/a> on 19 August for use on adults in nonhospitalized settings. The decision follows the lead of European regulators, who <a href=\"https://www.prnewswire.com/news-releases/vitestro-achieves-ce-marking-for-autonomous-blood-drawing-device-302231939.html\" rel=\"noopener noreferrer\" target=\"_blank\">authorized the device two years earlier<\/a>.<\/p><p>“You have to tip your cap to them,” says <a href=\"https://www.linkedin.com/in/maxbalter/\" rel=\"noopener noreferrer\" target=\"_blank\">Max Balter<\/a>, a surgical-robotics specialist at Medtronic who <a href=\"https://ieeexplore.ieee.org/document/7169572\" rel=\"noopener noreferrer\" target=\"_blank\">worked<\/a> on <a href=\"https://ieeexplore.ieee.org/document/7457657\" rel=\"noopener noreferrer\" target=\"_blank\">autonomous<\/a> blood-draw <a href=\"https://www.worldscientific.com/doi/10.1142/S2339547819500067\" rel=\"noopener noreferrer\" target=\"_blank\">systems<\/a> during grad school in the mid-2010s. “The engineering that they have is incredible…and with their FDA clearance, it moves the whole industry forward.”<\/p><h2>Aletta Boosts Lab Capacity Amid Shortages<\/h2><p>In a clinical trial involving more than 1,600 people in the Netherlands, Aletta successfully drew blood on the first attempt in <a href=\"https://doi.org/10.1093/clinchem/hvag029\" rel=\"noopener noreferrer\" target=\"_blank\">94.5 percent of cases<\/a>, even among those with hard-to-access veins, people with obesity, and the elderly. When Aletta failed to identify a suitable vein, the patient was referred for conventional phlebotomy.<\/p><p>“It’s exceptional performance,” says <a href=\"https://medicine.yale.edu/profile/joe-el-khoury/\" rel=\"noopener noreferrer\" target=\"_blank\">Joe El-Khoury<\/a>, a clinical chemist at Yale who was not involved in the Dutch trial. “It’s definitely as good if not better” than a typical professional phlebotomist.<\/p><p>Complications were minimal, with multiple built-in safeguards to detect problems, such as sensors that track arm movement and needle position, and to halt the process should something go awry. And for those whose veins proved too challenging, a phlebotomist remains on hand to take over when needed.<\/p><p>Notably, because a single phlebotomist can supervise up to three Aletta machines, the system should go a long way toward “helping clinical labs address the critical operational challenges related to the staffing shortages of phlebotomists,” says <a href=\"https://www.linkedin.com/in/luuk-giesen/\" rel=\"noopener noreferrer\" target=\"_blank\">Luuk Giesen<\/a>, chief medical officer of Vitestro.<\/p><p>That’s no small challenge in a profession with a <a href=\"https://aplm.kglmeridian.com/doi/10.5858/arpa.2019-0140-CP\" rel=\"noopener noreferrer\" target=\"_blank\">median annual turnover rate of nearly 25 percent<\/a> and a <a href=\"https://academic.oup.com/ajcp/article/164/5/759/8267738\" rel=\"noopener noreferrer\" target=\"_blank\">vacancy rate of close to 10 percent<\/a>, according to surveys of medical laboratories that draw mostly from U.S. institutions. The resulting staffing shortages can limit labs’ capacity to meet demand for routine diagnostic testing of blood counts, cholesterol, metabolic markers, and more. Aletta could address that bottleneck.<\/p><h2>Addressing Skin Tone Bias in Blood Draw AI<\/h2><p>The promise of greater capacity, however, comes with a caveat: Aletta still fails in roughly one case out of 20. Who are those people?<\/p><p>Some may simply have elusive or unusually deep veins. But a more significant obstacle could be skin pigmentation. In particular, the melanin in darker skin can interfere with the near-infrared light Aletta uses to first map the veins near the skin’s surface and identify promising puncture sites. The technique relies on hemoglobin absorbing the light differently from surrounding tissue, and darker skin tones can absorb more of that light before it reaches the camera, thereby reducing the contrast.<\/p><p class=\"shortcode-media shortcode-media-rebelmouse-image\"> <img alt=\"A smiling dark skinned woman holds a bandaid onto her arm while sitting next to a large machine.\" class=\"rm-shortcode\" id=\"9138e\" src=\"https://spectrum.ieee.org/media-library/a-smiling-dark-skinned-woman-holds-a-bandaid-onto-her-arm-while-sitting-next-to-a-large-machine.jpg?id=67726420&amp;width=980\" /> <small class=\"image-media media-caption\">Some experts have raised concerns that Aletta’s infrared sensors will perform poorly for people with darker skin tones, but Vitestro says that its machine also includes an ultrasound sensor, in part to mitigate that risk.<\/small><small class=\"image-media media-photo-credit\">Vitestro<\/small><\/p><p>Giesen recognizes that the issue could affect first-pass imaging, but notes that the main determinant of vein selection and needle placement is the ultrasound system, which relies on sound rather than light and should not be affected by skin pigmentation in the same way. “Ultrasound is skin-tone agnostic,” he says, adding that Vitestro has unpublished data showing no effect of skin tone on the system’s performance.<\/p><p>The company thus <a href=\"https://vitestro.com/aletta/patients/\" target=\"_blank\">claims on its website<\/a> that the “technology works well for all skin tones,” an assertion <a href=\"https://www.fda.gov/news-events/press-announcements/fda-authorizes-first-its-kind-robotic-blood-draw-device\" rel=\"noopener noreferrer\" target=\"_blank\">echoed in the FDA press release<\/a> announcing the authorization of Vitestro’s device.<\/p><p>But given the history of racial disparities in medical devices—particularly optical technologies such as pulse oximeters, which can be <a href=\"https://spectrum.ieee.org/pulse-oximeters-encode-racial-bias-with-clear-consequences-for-covid-19-patients\" target=\"_self\">less accurate in people with darker skin<\/a> and went largely unrecognized as a problem for decades—such claims warrant evidence, says El-Khoury, who has <a href=\"https://academic.oup.com/clinchem/article-lookup/doi/10.1093/clinchem/hvag045\" rel=\"noopener noreferrer\" target=\"_blank\">written about the issue<\/a>.<\/p><p><a href=\"https://www.mayoclinic.org/biographies/katzman-brooke-m-ph-d/bio-20514695\" rel=\"noopener noreferrer\" target=\"_blank\">Brooke Katzman<\/a>, a clinical chemist at the Mayo Clinic who is collaborating with Vitestro, also wants more evidence that samples collected by the robot are as suitable for testing as those drawn by hand.<\/p><p>The Dutch trial reported little damage to red blood cells, but other measures of sample quality, including clotted tubes, insufficient blood, and proper tube filling, still need to be assessed, as do the results of routine laboratory tests themselves. Katzman plans to launch a U.S.-based trial next year to collect just that sort of data.<\/p><p>“We’re going to do our due diligence,” she says. “Like any instrument we would bring into the lab, we’re going to put it through its paces before using it clinically.”<\/p><h2>The Future of Automated Blood Testing<\/h2><p>Aletta takes its name from the 19th-century physician <a href=\"https://pmc.ncbi.nlm.nih.gov/articles/PMC11151697/\" rel=\"noopener noreferrer\" target=\"_blank\">Aletta Jacobs<\/a>, the first female doctor in the Netherlands and founder of what is widely considered the world’s first birth-control clinic.<\/p><p>That nod to history is fitting for a technology that builds on decades of research in robotic phlebotomy by groups in <a href=\"https://ieeexplore.ieee.org/document/826854/\" rel=\"noopener noreferrer\" target=\"_blank\">Europe<\/a>, the <a href=\"https://www.researchgate.net/publication/309480332_Robotic_Assistive_Device_for_Phlebotomy\" rel=\"noopener noreferrer\" target=\"_blank\">United States<\/a>, and <a href=\"https://haoyangli16.github.io/pdf/venibot.pdf\" rel=\"noopener noreferrer\" target=\"_blank\">China<\/a>, and <a href=\"https://doi.org/10.3389/fmed.2023.1251963\" rel=\"noopener noreferrer\" target=\"_blank\">MagicNurse<\/a>. Yet few pushed the concept as far as biomedical engineer <a href=\"https://bme.rutgers.edu/martin-l-yarmush\" rel=\"noopener noreferrer\" target=\"_blank\">Martin Yarmush<\/a> of Rutgers University in New Jersey, in whose lab Medtronic’s Balter completed his Ph.D.<\/p><p>In one version of their platform, the Rutgers team even <a href=\"https://ieeexplore.ieee.org/document/7759102/\" rel=\"noopener noreferrer\" target=\"_blank\">coupled their robot to a benchtop blood analyzer<\/a>, allowing it to draw samples and then measure levels of infection-fighting immune cells and oxygen-carrying red blood cells—all within minutes.<\/p><p>That all-in system never made it out of laboratory testing. And VascuLogic, the company spun out to commercialize the platform, is long defunct—though others, including <a href=\"https://rophai.net/\" rel=\"noopener noreferrer\" target=\"_blank\">ROPHAI<\/a>, <a href=\"https://bhealthcare.com/\" rel=\"noopener noreferrer\" target=\"_blank\">BHealthCare<\/a>, and <a href=\"https://doi.org/10.3389/fmed.2023.1251963\" rel=\"noopener noreferrer\" target=\"_blank\">MagicNurse<\/a>, continue to work in the space. But the Rutgers proof-of-concept demonstration points toward the tantalizing possibility of fully automated blood testing at the point of care, with robots handling everything from the needle stick to the analysis.<\/p><p>It is, in some ways, the promise that Theranos made—but built on conventional, validated laboratory technology rather than the <a href=\"https://www.goodreads.com/en/book/show/37976541-bad-blood\" rel=\"noopener noreferrer\" target=\"_blank\">dubious science and deception<\/a> that brought that particular company down.<\/p><p>“I have no doubt that is the future,” says <a href=\"https://www.feinberg.northwestern.edu/faculty-profiles/az/profile.html?xid=22300\" rel=\"noopener noreferrer\" target=\"_blank\">Gregory Retzinger<\/a>, a clinical pathologist at the Northwestern University Feinberg School of Medicine, in Chicago, who <a href=\"https://vitestro.com/news/northwestern-medicine-and-vitestro-collaborate-to-advance-autonomous-robotic-phlebotomy/\" rel=\"noopener noreferrer\" target=\"_blank\">collaborates with Vitestro<\/a> and has tried the Aletta device himself. (“It was painless, it was fast,” he says.)<\/p><p>For now, Giesen says Vitestro is keeping its ambitions—and its machine—focused on the blood-collection process itself, though he believes Aletta could ultimately do far more. The company plans to launch Aletta in Europe next year, with the U.S. market to follow. <\/p>"}, {"title": "Inbolt to discuss physical AI’s deployment problem at RoboBusiness", "source": "Robotics Business Review", "date": "2026-09-07", "url": "https://www.therobotreport.com/inbolt-ceo-to-discuss-physical-ais-deployment-problem-at-robobusiness/", "summary": "<p>Rudy Cohen, the co-founder and CEO of Inbolt, will reframe where physical AI pays off at RoboBusiness this fall.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/inbolt-ceo-to-discuss-physical-ais-deployment-problem-at-robobusiness/\">Inbolt to discuss physical AI&#8217;s deployment problem at RoboBusiness<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Agility Robotics reports $1.8M revenue ahead of humanoid SPAC", "source": "Robotics Business Review", "date": "2026-09-07", "url": "https://www.therobotreport.com/agility-robotics-reports-18m-revenue-ahead-of-humanoid-spac/", "summary": "<p>Agility Robotics’ S-4 filing reveals $1.8 million in 2025 revenue, a $140 million operating loss and plans to scale its Digit humanoid robot business.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/agility-robotics-reports-18m-revenue-ahead-of-humanoid-spac/\">Agility Robotics reports $1.8M revenue ahead of humanoid SPAC<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "MassRobotics shares member survey results around FCC restrictions", "source": "Robotics Business Review", "date": "2026-09-07", "url": "https://www.therobotreport.com/massrobotics-shares-member-survey-results-around-fcc-restrictions/", "summary": "<p>MassRobotics has found that companies were split on the FCC ban on new foreign-produced mobile robots.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/massrobotics-shares-member-survey-results-around-fcc-restrictions/\">MassRobotics shares member survey results around FCC restrictions<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Pressure sensors can help improve robotic gripping accuracy", "source": "Robotics Business Review", "date": "2026-09-06", "url": "https://www.therobotreport.com/pressure-sensors-can-help-improve-robotic-gripping-accuracy/", "summary": "<p>From first contact through surface deformation, load distribution, and final stable hold, pressure sensors can improve robotic bin picking.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/pressure-sensors-can-help-improve-robotic-gripping-accuracy/\">Pressure sensors can help improve robotic gripping accuracy<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Eric Sivertson discusses FPGAs and robot security", "source": "Robotics Business Review", "date": "2026-09-06", "url": "https://www.therobotreport.com/eric-sivertson-discusses-fpgas-robot-security/", "summary": "<p>An interview with Eric Sivertson of Lattice Semiconductor about FPGAs and how they can improve robot safety and security.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/eric-sivertson-discusses-fpgas-robot-security/\">Eric Sivertson discusses FPGAs and robot security<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Cyborg Roaches Can Stab You With Needles", "source": "IEEE Spectrum Robotics", "date": "2026-09-05", "url": "https://spectrum.ieee.org/cyborg-rescue-roach", "summary": "<img src=\"https://spectrum.ieee.org/media-library/large-brown-cockroach-fitted-with-an-electronic-device-and-wires-on-its-back.jpg?id=67724302&amp;width=1200&amp;height=800&amp;coordinates=62%2C0%2C63%2C0\" /><br /><br /><p>Imagine you are trapped under rubble after an earthquake and you see an electronics-covered cockroach with a spring-loaded needle on its back scuttling toward you. Although the sight might be unnerving, to say the least, this prototype paramedic cyborg, or “Paraborg,” might one day help deliver lifesaving aid to disaster victims who might be otherwise impossible to reach.<\/p><hr /><h3>The Hardest Problems in Robotics<\/h3><p>For decades, scientists have sought to develop cyborg insects as “a shortcut around some of the hardest problems in robotics,” says <a href=\"https://about.uq.edu.au/experts/42152\" rel=\"noopener noreferrer\" target=\"_blank\">T. Thang Vo-Doan<\/a>, director of the <a href=\"https://tthangvodoan.wordpress.com/\" rel=\"noopener noreferrer\" target=\"_blank\">University of Queensland’s Biorobotics Lab<\/a> in Brisbane, Australia, which just published a paper on the Paraborgs.<\/p><p class=\"shortcode-media shortcode-media-youtube\"> <span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span> <small class=\"image-media media-photo-credit\">The University of Queensland<\/small> <\/p><p>Building an insect-size robot “that can move reliably through rubble, climb over irregular surfaces, recover from falls, carry its own power, and still have room for useful sensors is extraordinarily difficult,” Vo-Doan says. An insect already comes with much of that mobility built in, so instead of trying to create artificial versions of every part of an insect’s body from scratch, researchers can graft an electronic interface onto an insect to make use of its existing capabilities.<\/p><p>Previously, scientists have shown they could steer cyborg insects such as <a href=\"https://spectrum.ieee.org/the-robot-insect-race\" target=\"_self\">beetles<\/a> and <a href=\"https://spectrum.ieee.org/cyborg-moth-gets-a-new-radio\" target=\"_self\">moths<\/a>. This prior work largely focused on controlling their movements to serve as passive sensor platforms.<\/p><p>In 2023, as Vo-Doan and fellow researcher <a href=\"https://www.unsw.edu.au/staff/thanh-nho-do\" rel=\"noopener noreferrer\" target=\"_blank\">Thanh Nho Do<\/a> were talking about search-and-rescue cyborg insects shortly before that year’s IEEE International Conference on Robotics and Automation (ICRA), they asked, “What happens after an insect finds a trapped victim?” Vo-Doan recalls. “Could it go beyond locating someone and actually provide some form of assistance while rescuers are still trying to reach them?”<\/p><h3>Giant Cockroaches to the Rescue<\/h3><p>To answer this question, the roboticists experimented with giant burrowing cockroaches (<a href=\"https://en.wikipedia.org/wiki/Giant_burrowing_cockroach\" rel=\"noopener noreferrer\" target=\"_blank\"><em><em>Macropanesthia rhinoceros<\/em><\/em><\/a>), which are native to Australia. The researchers needed an insect capable of carrying a large payload (over half its weight), and at roughly 40 grams in size, this species is <a href=\"https://www.guinnessworldrecords.com/world-records/106442-heaviest-cockroach\" rel=\"noopener noreferrer\" target=\"_blank\">the world’s heaviest species of roach<\/a>. A larger insect is also easier to operate on to implant cybernetic interfaces.<\/p><p>The cockroaches were saddled with lightweight electronics that included electrodes implanted into both their antennae and small tail-like appendages known as cerci. Wirelessly activating these electrodes with a handheld gaming controller could steer the roaches left or right, spur them forward, or stop them from moving.<\/p><p>The insects were also equipped with either a wireless camera or a remote-controlled injector, which used a spring to launch a drug-filled syringe at a nearby target. A chemical reaction inside the syringe then generated a puff of carbon dioxide, which exerted pressure within the syringe to inject its payload into a target.<\/p><p class=\"shortcode-media shortcode-media-rebelmouse-image\"> <img alt=\"Two large cockroaches each with a set of electronics and sensors on their carapace\" class=\"rm-shortcode\" id=\"1244e\" src=\"https://spectrum.ieee.org/media-library/two-large-cockroaches-each-with-a-set-of-electronics-and-sensors-on-their-carapace.jpg?id=67724308&amp;width=980\" /> <small class=\"image-media media-caption\">Paraborgs are designed to work in teams, with some carrying cameras and others carrying injectors with potentially lifesaving medications.<\/small><small class=\"image-media media-photo-credit\">The University of Queensland<\/small><\/p><p>The scientists decided not to load both a camera and an injector onto a single roach because the combined weight and bulk could impair their mobility on complex terrain. Having both sets of electronics would also increase energy demands, resulting in reduced operation time. Instead, the researchers envision a <a href=\"https://spectrum.ieee.org/swarm-of-cyborg-cockroaches\" target=\"_self\">swarm<\/a> approach with the Paraborgs, with different specialized cyborgs performing complementary roles.<\/p><p>In proof-of-concept tests, the scientists were able to successfully navigate the Paraborgs over a 2.5-meter course past three checkpoints before launching their needles at an 8-by-10-centimeter silicone target. In 25 trials, the cockroaches completed the course every single time and succeeded at injecting the target 72 percent of the time. “The long-term goal is to combine the insect’s advanced locomotion with sensing and intervention capabilities so we can reach and help more people, more quickly,” Vo-Doan says.<\/p><p class=\"shortcode-media shortcode-media-rebelmouse-image\"> <img alt=\"Two large cockroaches with backpack electronics navigate around rocks and over sand.\" class=\"rm-shortcode\" id=\"e3858\" src=\"https://spectrum.ieee.org/media-library/two-large-cockroaches-with-backpack-electronics-navigate-around-rocks-and-over-sand.jpg?id=67724312&amp;width=980\" /> <small class=\"image-media media-caption\">While the Paraborgs can be steered remotely, the cockroaches themselves are still very much alive and able to use their skills as bugs to navigate through complex terrain.<\/small><small class=\"image-media media-photo-credit\">The University of Queensland<\/small><\/p><p>The researchers acknowledge that “for someone who is already trapped or injured, seeing a cyborg insect approaching could understandably be a little surprising or unsettling at first,” Vo-Doan says. Ways to make it clear these insects were part of rescue efforts might include flashing lights, recognizable emergency markings, “or perhaps a tiny speaker delivering a simple message such as, ‘Help is on the way,’ ” Vo-Doan adds. “Making people feel comfortable with the technology is just as important as making it work.”<\/p><h3>Practical Paraborgs<\/h3><p>In the future, Vo-Doan and his colleagues aim to address practical issues with the Paraborg. These include compensating for the movements of victims, establishing reliable wireless communications inside collapsed structures, and guiding the cyborgs as they climb over and squeeze through complex environments filled with rubble and dust. Autonomy will become increasingly important for these insects, particularly if the scientists want to operate multiple cyborgs at the same time, he says.<\/p><p>In addition, a fundamental challenge when it comes to working with cyborg insects is that they are living creatures with minds of their own. “We are not piloting them like conventional wheeled robots,” Vo-Doan says. “Electrical stimulation influences their direction, but the insect still generates and controls much of its own locomotion.” To deal with this unreliability, the Paraborgs will need better onboard systems to pinpoint their positions and monitor their actions so researchers can recognize when an insect has deviated from its course or become less responsive.<\/p><p>“We are not suggesting that this is a medical device ready to be used on people today,” Vo-Doan says. “Real disaster sites are full of unstable debris, narrow gaps, and communication difficulties, so we need to understand how the insect, electronics, and injector all perform under those conditions. There are also important questions around drug choice and dosage, sterility, needle safety, reliability, and regulation.”<\/p><p>Ultimately, such research into cyborg cockroaches may help inform robot design, explains Vo-Doan. These insects “can give us useful capabilities sooner while, at the same time, helping us develop the fully artificial systems of the future.”<\/p><p>The scientists detailed <a href=\"https://advanced.onlinelibrary.wiley.com/doi/10.1002/advs.76973\" target=\"_blank\">their findings<\/a> last month in the journal <em><em>Advanced Science<\/em><\/em>.<\/p>"}, {"title": "Enovis to acquire surgical tech provider eCential Robotics for $180M", "source": "Robotics Business Review", "date": "2026-09-05", "url": "https://www.therobotreport.com/enovis-to-acquire-ecential-robotics-for-180m/", "summary": "<p>Enovis said it plans to bring a robotic system targeting the knee within the next two years, followed by a system focusing on the shoulder.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/enovis-to-acquire-ecential-robotics-for-180m/\">Enovis to acquire surgical tech provider eCential Robotics for $180M<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "ARM Institute gets $90M for 10 projects to modernize military manufacturing", "source": "The Robot Report", "date": "2026-09-05", "url": "https://www.therobotreport.com/arm-institute-gets-90m-for-10-projects-to-modernize-military-manufacturing/", "summary": "<p>Fifteen member organizations will deliver viable working solutions within a two-year timeframe, the ARM Institute said.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/arm-institute-gets-90m-for-10-projects-to-modernize-military-manufacturing/\">ARM Institute gets $90M for 10 projects to modernize military manufacturing<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Lyte raises $165M to help robots better sense their surroundings", "source": "Robotics Business Review", "date": "2026-09-04", "url": "https://www.therobotreport.com/lyte-raises-165m-help-robots-better-sense-their-surroundings/", "summary": "<p>Lyte AI plans to use its second round of funding this year to scale production of its AI and perception capabilities.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/lyte-raises-165m-help-robots-better-sense-their-surroundings/\">Lyte raises $165M to help robots better sense their surroundings<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Robot.com partners with Sodexo to roll out more sidewalk delivery robots", "source": "Robotics Business Review", "date": "2026-09-04", "url": "https://www.therobotreport.com/robot-com-partners-sodexo-rolls-out-more-sidewalk-delivery-robots/", "summary": "<p>Robot.com says college campuses will continue to be an important part of its strategy as it scales sidewalk delivery robots.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/robot-com-partners-sodexo-rolls-out-more-sidewalk-delivery-robots/\">Robot.com partners with Sodexo to roll out more sidewalk delivery robots<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "How FPGAs become the gatekeepers of physical AI security", "source": "Robotics Business Review", "date": "2026-09-04", "url": "https://www.therobotreport.com/how-fpgas-become-the-gatekeepers-of-physical-ai-security/", "summary": "<p>Eric Sivertson, vice president of security business at Lattice Semiconductor, explains how FPGAs can act as deterministic guardrails for robotic systems.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/how-fpgas-become-the-gatekeepers-of-physical-ai-security/\">How FPGAs become the gatekeepers of physical AI security<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Calling robotics startups: Apply now to be part of the 2026 Robotics Startup Radar", "source": "Robotics Business Review", "date": "2026-09-04", "url": "https://www.therobotreport.com/calling-all-robotics-startups-apply-now-2026-robotics-startup-radar/", "summary": "<p>Submit now to be part of the Robotics Startup Radar, which brings together some of the most promising robotics startups.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/calling-all-robotics-startups-apply-now-2026-robotics-startup-radar/\">Calling robotics startups: Apply now to be part of the 2026 Robotics Startup Radar<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Video Friday: Digit Redecorates", "source": "IEEE Spectrum Robotics", "date": "2026-09-04", "url": "https://spectrum.ieee.org/video-friday-agility-robotics-digit", "summary": "<img src=\"https://spectrum.ieee.org/media-library/humanoid-robot-tidies-an-orange-couch-while-a-person-watches-in-a-modern-living-room.gif?id=67725697&amp;width=1200&amp;height=800&amp;coordinates=62%2C0%2C63%2C0\" /><br /><br /><p><span>Video Friday is your weekly selection of awesome robotics videos, collected by your friends at <\/span><em>IEEE Spectrum<\/em><span> robotics. We also post a weekly calendar of upcoming robotics events for the next few months. Please <\/span><a href=\"mailto:automaton@ieee.org?subject=Robotics%20event%20suggestion%20for%20Video%20Friday\">send us your events<\/a><span> for inclusion.<\/span><\/p><h5><a href=\"https://humanoidssummit.com/\">Humanoids Summit Seoul<\/a>: 22–23 September 2026, SEOUL<\/h5><h5><a href=\"https://2026.ieee-iros.org/\">IROS 2026<\/a>: 27 September–1 October 2026, PITTSBURGH<\/h5><h5><a href=\"https://www.corl.org/\">CoRL 2026<\/a>: 9–12 November 2026, AUSTIN<\/h5><p>Enjoy today’s videos!<\/p><div class=\"horizontal-rule\"><\/div><div><span style=\"display: none;\"> <\/span><\/div><p class=\"rm-anchors\" id=\"ozpzi8vhgsg\">I know these videos from <a href=\"https://spectrum.ieee.org/digit-agility-robotics\" target=\"_blank\">Agility<\/a> can be a little bit silly, but the couch drag in this one is impressive.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.agilityrobotics.com/\">Agility Robotics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"hbynm1gcxbu\"><em>Stabilizing unsecured payloads against the inherent oscillations of dynamic bipedal locomotion remains a critical engineering bottleneck for humanoids in unstructured environments. To solve this, we introduce ReST-RL, a hierarchical reinforcement-learning architecture that explicitly decouples locomotion from payload stabilization. Successfully deployed on the Unitree G1 humanoid hardware, this modular approach demonstrates highly reliable zero-shot sim-to-real generalization across various objects and external force disturbances.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://steadytray.github.io/\">SteadyTray<\/a> ]<\/p><p>Thanks, Ioana!<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"qbuixdvviv4\"><a href=\"https://spectrum.ieee.org/figure-new-humanoid-robot\" target=\"_blank\">Figure<\/a> is scaling compute so that its robots can...uh...have their compute scaled, I guess?<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>Solving for a robot in every home is not a data-and-compute problem, it’s a safety-and-cost problem.<\/p><p>[ <a href=\"https://www.figure.ai/\">Figure<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"lg0lq7s69g4\">The most important thing to know about this gripper is that koalas have two thumbs on each hand.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://rai-inst.com/resources/blog/handheld-robotic-data-collection/\">RAI Institute<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"frfad-zunfy\">DARPA Triage Challenge Finals are in November!<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.darpa.mil/research/challenges/darpa-triage-challenge\">DARPA<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"ezcbwdvd_ya\"><em>Online, humanoid robots are very impressive to watch, but behind the scenes, most of those movements are carefully choreographed. Researchers in Carnegie Mellon University’s Safe AI Lab are instead teaching robots how to adapt. Their system, called APEX, allows a humanoid robot to navigate obstacles using adaptive, full-body maneuvers.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://engineering.cmu.edu/news-events/news/2026/09/02-robot-human-collaboration.html\">CMU<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"7dl-f9sbnek\"><em>Researchers from North Carolina State University have created teardrop-shaped soft robots that leap upward or forward when exposed to infrared light—and will keep jumping as long as the light is present. <\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><blockquote><em>The robots are made of a liquid-crystal elastomer ribbon shaped like a teardrop, with a thin aluminum tube shaped like a V at one end. When exposed to light from an infrared lamp, the surface of the ribbon contracts, causing the ribbon to rotate. The stiff V at one end of the robot prevents the ribbon from simply rolling in place, causing the ribbon to twist tighter and tighter. This stores energy until the twist reaches a critical point when the ribbon releases that energy, causing the V at one end of the teardrop to snap downward and strike the surface. This launches the teardrop into the air.<\/em><\/blockquote><p>[ <a href=\"https://news.ncsu.edu/2026/08/soft-robots-jumping-forever/\">NC State<\/a> ]<\/p><p>Thanks, Ship!<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"ws6boq4yeaq\">I’ll be honest—I was prepared to be underwhelmed by the DARPA Lift Challenge, but there was such creativity in the heavy-lift drone designs that I’m excited for it to come back in 2028.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.darpaliftchallenge.com/\">DARPA Lift Challenge<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"nh47n7cbx7s\">Thank you, Christian, for attempting to talk some sense into the internet.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.christianhubicki.com/\">Christian Hubicki<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"l9xu2wmkrrg\"><em>Humans use not only muscle signals but also stretched skin around joints as a cue for proprioception. To mimic this biological mechanism, we developed a three-layer joint-covering skin with 44 pressure- and stretch-sensitive elements for the musculoskeletal humanoid Musashi-W.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>It’s not a replicant, but one day, it will be.<\/p><p>[ <a href=\"https://poyotamu000.github.io/musashiw-joint-covering-skin/\">University of Tokyo<\/a> ]<\/p><p>Thanks, Akihiro!<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"8kdxnt-4zl0\">Having mobility issues with your robot? Just staple it to the end of an industrial robotic arm. Problem solved!<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.limxdynamics.com/en/products/tron2\">LimX Dynamics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"_kytnzqoe4k\">But what if I am the sort of person who needs to speak to a manager?<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.sharpa.com/pages/north-at-work\">Sharpa<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"gzxkmyjh5py\"><em>In Turpan, China—known as the City of Fire—summer ground temperatures can exceed 50 °C. During the grape harvest, farmers traditionally carry heavy baskets back and forth under the intense heat, while every extra minute in the sun can affect the freshness of the fruit. This year, the DEEP Robotics Lynx M20S joined the harvest. <\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.deeprobotics.cn/en\">DEEP Robotics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"_uav5s18cwq\"><em>This video showcases the achievements of the first OH! GYM! Project cohort, a group of university and graduate students who explored, developed, and deployed their own humanoid behaviors using the open-source AI Sapiens K1 platform. Over the course of one month, the students experienced the complete process of humanoid development—from creating motions in simulation to transferring them onto a physical robot through repeated Sim2Real experiments.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://docs.robotis.com/docs/common/oh_project/\">ROBOTIS<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div>"}, {"title": "PlusAI to take autonomous trucking public via a SPAC deal", "source": "Robotics Business Review", "date": "2026-09-03", "url": "https://www.therobotreport.com/plusai-takes-autonomous-trucking-public-via-spac-deal/", "summary": "<p>The SPAC transaction values PlusAI, whose self-driving trucking software is already generating revenue, at about $800 million.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/plusai-takes-autonomous-trucking-public-via-spac-deal/\">PlusAI to take autonomous trucking public via a SPAC deal<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Protecting Dynamic Industrial Robot Cable Carriers", "source": "IEEE Spectrum Robotics", "date": "2026-09-03", "url": "https://spectrum.ieee.org/industrial-robot-cable-carrier-protection", "summary": "<img src=\"https://spectrum.ieee.org/media-library/industrial-robotic-arm-with-cable-management-system-and-flexible-energy-chains.jpg?id=67633840&amp;width=1200&amp;height=800&amp;coordinates=0%2C0%2C0%2C0\" /><br /><br /><p><em>This article is brought to you by <a href=\"https://tsubaki-kabelschlepp.com/\" target=\"_blank\">Tsubaki KabelSchlepp<\/a>.<\/em><\/p><p>In modern automated manufacturing, six-axis articulated robots perform high-speed, multidirectional maneuvers under demanding operational cycles. However, as robot arms swivel, rotate, and extend, the electrical cables, fiber optics, and pneumatic hoses supplying them endure severe mechanical stress. Torsional twist, rapid acceleration, and repeated contact with machine structures often lead to premature conductor fatigue, insulation breakdown, and costly unplanned production halts.<\/p><p>To overcome these multi-axis motion challenges, the <a href=\"https://carriers.ustsubaki.com/products/cable-carriers/robotrax-system?utm_campaign=KSD&amp;utm_source=IEEESpectrum&amp;utm_medium=Native&amp;utm_term=Article&amp;utm_content=RobotraxDresspack\" rel=\"noopener noreferrer\" target=\"_blank\"><span>Tsubaki KabelSchlepp Robotrax System<\/span><\/a> provides a specialized three-dimensional cable carrier engineered specifically for complex robotic motion.<\/p><h2>Managing High Tensile Forces With Central Steel Technology<\/h2><p>Conventional cable carriers often transfer operational movement stress directly onto internal electrical lines and hoses. The Robotrax system changes this dynamic through a central steel cable that runs through the core of every chain link.<\/p><p class=\"pull-quote\">The Robotrax system’s central steel cable absorbs the primary tensile loads and preserves conductor integrity, dramatically extending cable service life.<\/p><p>When robot arms undergo rapid directional shifts and accelerations up to 10 g, this internal steel cable absorbs the primary tensile loads. By isolating electrical and fluid lines from pulling forces, the design preserves conductor integrity and dramatically extends cable service life. Mechanics can easily calibrate and adjust system tension using an integrated clamping piece, ensuring consistent mechanical support throughout long operational cycles.<\/p><h2>Spherical Link Design and Modular Cable Routing<\/h2><p>The foundation of the Robotrax system lies in its open, single-piece plastic links featuring spherical snap-on connections on both sides. This geometry allows the carrier to flex smoothly across three axes, providing radial rotation of up to ±450 degrees per meter depending on the model size.<\/p><p>To optimize internal organization, carrier links contain up to three distinct chambers. This physical separation prevents signal interference and mechanical abrasion between heavy power lines, sensitive data channels, and fluid hoses. For standard models (R040 through R100), technicians can press cables directly into the carrier without tools, drastically reducing installation and maintenance time. Larger configurations, such as the R140X, incorporate swiveling crossbars with snap locks alongside vertical and horizontal dividers for customized interior partitioning.<\/p><h3>​ROBOTRAX System<\/h3><br /><img alt=\"Numbered diagram of a flexible robotic arm with segmented joints and components\" class=\"rm-shortcode\" id=\"4af39\" src=\"https://spectrum.ieee.org/media-library/numbered-diagram-of-a-flexible-robotic-arm-with-segmented-joints-and-components.jpg?id=67685927&amp;width=980\" /><ol style=\"margin: 16px 0 0 0;\"><li style=\"padding: 4px 4px;\">Steel cable for transferring extremely high tensile forces<\/li><li style=\"padding: 4px 4px;\">Tension piece for locking the chain links<\/li><li style=\"padding: 4px 4px;\">Type with toolless opening swivel crossbars and divider module available<\/li><li style=\"padding: 4px 4px;\">Open design<br />– Fast cable laying as the cables are simply pressed in<br />– Easy checking of all cables<\/li><li style=\"padding: 4px 4px;\">Special plastic for long service life<\/li><li style=\"padding: 4px 4px;\">Protective covers or heat shields made from different materials are available for different environmental conditions<\/li><li style=\"padding: 4px 4px;\">Quick-release bracket for fixing and continuation<\/li><li style=\"padding: 4px 4px;\">Strain relief with LineFix clamps<\/li><li style=\"padding: 4px 4px;\">Protection against hard impacts, excessive abrasion and premature wear as well as limitation of the bending radius through protector<\/li><\/ol><h2>Active Retraction and Impact Protection<\/h2><p>Large robot work envelopes and high-speed motion trajectories can cause loose cable carrier loops to swing and strike the robot body. To eliminate these destructive collisions, Tsubaki KabelSchlepp integrates the Pull Back Unit (PBU).<\/p><p>The PBU serves as an active retraction mechanism that maintains optimal tension on the cable carrier throughout the entire motion cycle. By preventing excess slack and eliminating interfering contours, the PBU minimizes collision risks across complex movement paths. The unit requires zero maintenance on its retraction element and offers standard mounting configurations for leading industrial robot platforms, including KUKA, ABB, and FANUC.<\/p><p class=\"pull-quote\">Tsubaki KabelSchlepp’s Pull Back Unit <span>maintains optimal tension on the cable carrier and minimizes collision risks across complex movement paths.<\/span><\/p><p><span><\/span><span>Additionally, external protectors can be retrofitted onto individual chain links. These durable impact shields limit the minimum bending radius to prevent over-flexing while shielding the chain body from severe external abrasion. If wear occurs, technicians simply replace the modular protector rather than the entire cable carrier assembly.<\/span><\/p><h2>Built for Demanding Industrial Environments<\/h2><p>From automotive welding cells to high-speed machining centers, Robotrax systems adapt to severe working conditions through tailored protective accessories:<\/p><ul><li><strong>Heat Shields: <\/strong>Aluminum-coated textile fiber covers protect against radiated heat, hot weld spatter, and flying sparks.<\/li><li><strong>Protective Covers: <\/strong>Coated polyester sleeves shield sensitive lines against aggressive cutting fluids, hydraulic oils, paint overspray, and abrasive dust.<\/li><li><strong>LineFix Strain Relief:<\/strong> Multi-layer clamping devices anchor cables securely at both ends to prevent axial displacement during intense motion.<\/li><\/ul>By combining central load absorption, multi-axis flexibility, and active retraction control, the Robotrax system offers plant engineers and system integrators a reliable path toward maximizing robot uptime and reducing total operational costs."}, {"title": "The Best Way to Explore Lunar Craters Is a Giant Robot Ball", "source": "IEEE Spectrum Robotics", "date": "2026-09-03", "url": "https://spectrum.ieee.org/moon-ball-robot", "summary": "<img src=\"https://spectrum.ieee.org/media-library/a-gif-of-a-spherical-robot-rolling-over-a-bumpy-path.gif?id=67701776&amp;width=1200&amp;height=800&amp;coordinates=62%2C0%2C63%2C0\" /><br /><br /><p>On a good day, the rock quarry in central Texas is about 370,000 kilometers (230,000 miles) from the moon. But last February, when Rishi Jangale watched his 1.8-meter-wide, 150-kilogram inflatable robot roll effortlessly over rocks, gravel, and wet clay, his imagination turned the quarry into the lunar surface instead.<\/p><p>Jangale is an upbeat mechanical engineer nearing the end of his Ph.D. at Texas A&amp;M University, in College Station, Texas. He and his labmates have been working on this big tan “RoboBall” for about five years. Their goal: create a vehicle capable of <a href=\"https://spectrum.ieee.org/a-jumping-robot-for-enceladus\" target=\"_blank\">exploring some of the most inaccessible terrain<\/a> in our solar system, such as the 21 km-wide Shackleton crater on the moon’s south pole.<\/p><p>The Shackleton crater is 4 km deep and contains many smaller, deeper craters within. Some parts of the crater never see the sun, and within these perpetually dark, frigid pockets lie mysterious substances that planetary scientists have long struggled to examine, including layers of ancient lunar geology and stores of frozen water that could potentially support a future lunar base.<\/p><p>“The moon is like an archive of what happened to the Earth,” says <a href=\"https://www.nhm.ac.uk/our-science/people/sara-russell.html\" rel=\"noopener noreferrer\" target=\"_blank\">Sara Russell<\/a>, a cosmic mineralogist with London’s Natural History Museum who is not involved with Texas A&amp;M’s work. “Robotic collection works brilliantly well, and it’s great to see that being explored more in this context.”<\/p><p>“NASA is not going to let astronauts get anywhere near these craters, because if someone falls in, you’re not going to be able to get them out,” Jangale says. “So we thought, what better shape to roll down a hill than a ball?” In a <a href=\"https://ieeexplore.ieee.org/document/11248963\" rel=\"noopener noreferrer\" target=\"_blank\">recent paper<\/a> published in <em><em>IEEE Transactions on Field Robotics<\/em><\/em>, Jangale’s team reports on the design of RoboBall, a hypothetical lunar mission, and the results from initial tests in the Texas quarry.<\/p><h2>Getting Rolling<\/h2><p>RoboBall is the brainchild of Jangale’s advisor, <a href=\"http://link?\" rel=\"noopener noreferrer\" target=\"_blank\">former NASA robotics engineer Robert Ambrose<\/a>, who first conceived of the design in 2003.<\/p><p>Ambrose figured that a ball could address a pesky mobility risk that robots face on lunar terrain, especially in low gravity: <a href=\"https://www.bbc.com/news/science-environment-68388695\" rel=\"noopener noreferrer\" target=\"_blank\">tipping over<\/a>. An inflatable sphere can’t tip over, and the form factor also insulates its internal components from sharp rocks, dust, and the huge temperature swings from over 93 °C in sunlit spots to minus 240 °C in the shade inside lunar craters. Ambrose imagined a wheeled rover parking at a crater’s edge and releasing a RoboBall to explore its depths. Unlike <a href=\"https://www-robotics.jpl.nasa.gov/how-we-do-it/systems/the-axel-rover/\" rel=\"noopener noreferrer\" target=\"_blank\">a small tethered rover<\/a>, the RoboBall wouldn’t roll its way back up—but with no strings attached, it would have a far greater range to collect geological samples, and then be able to launch them back to the rover outside the crater with small rockets.<\/p><p class=\"shortcode-media shortcode-media-rebelmouse-image rm-float-left rm-resized-container rm-resized-container-25\" style=\"float: left;\"> <img alt=\"A wheeled rover carrying a robotic ball up a small hill of dirt and gravel.\" class=\"rm-shortcode\" id=\"20656\" src=\"https://spectrum.ieee.org/media-library/a-wheeled-rover-carrying-a-robotic-ball-up-a-small-hill-of-dirt-and-gravel.jpg?id=67694269&amp;width=980\" /> <small class=\"image-media media-caption\">A robotic rover would ferry RoboBall across the lunar surface to the edge of a crater.<\/small><small class=\"image-media media-photo-credit\"><a href=\"https://ieeexplore.ieee.org/document/11248963\" target=\"_blank\">R. Jangale, D. Pravecek, et al.<\/a><\/small><\/p><p>NASA hasn’t brought lunar samples back to Earth in over 50 years. Some morsels of moon geology find their way to Earth as meteorites, but Russell says these lack the “gold standard” field work—context about where that sample actually came from. Even as NASA reboots its crewed moon missions, many lunar sites remain inaccessible.<\/p><p>In 2022, Ambrose’s lab finished a proof of concept, the 0.5-meter-wide RoboBall II. Creating the full-size RoboBall III then took about 11 months. “We were building these robots really quickly,” Jangale says. “Ambrose really encourages us to use and break these robots.” And designs did go awry. Jangale remembers software errors and a drivetrain that proved too weak to roll over soft bumps in initial tests.<\/p><p class=\"shortcode-media shortcode-media-youtube\"> <span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span> <small class=\"image-media media-photo-credit\"><a href=\"https://www.youtube.com/watch?v=tnj4BRuprlI\" target=\"_blank\">Texas A&amp;M RAD Lab/YouTube<\/a><\/small><\/p><h2>How to Slow Your Roll<\/h2><p>RoboBall drives by moving a pendulum within its shell, shifting its entire center of mass. On flat ground, if the pendulum’s arm points forward, the shell rolls forward to compensate, and as long as the pendulum keeps the center of mass in front of the center of the ball, RoboBall will keep rolling forward. If the pendulum leans a few degrees to the left or right, RoboBall steers left or right to match. “The robot wants to go where you point the pendulum,” Jangale says. The 340-pound ball is just soft enough to bounce lightly over bumpy obstacles, but its slight overpressure keeps it relatively firm. On steep slopes, this mechanism also lets the ball control its downhill speed by simply angling the pendulum uphill.<\/p><p>“The beauty here is the simplicity,” says Hiro Ono, an aerospace engineer who worked on robot mobility at NASA’s Jet Propulsion Lab for 13 years before joining Georgia Tech. For space robots, Ono describes simplicity in terms of the number of actuators. RoboBall has just two, and both are fully inside of the shell, shielded from environmental risk factors like dust, a feature that Ono describes as “unique.”<\/p><p>After the first quarry tests, it took about seven months for the team to design and build an upgraded RoboBall III with 2.5 times more torque—enough to fling itself over small obstacles and roll up 20 degree slopes.<\/p><p class=\"shortcode-media shortcode-media-rebelmouse-image\"> <img alt=\"Close-up of a needle-like rocket protruding from the payload bay of a large robotic ball.\" class=\"rm-shortcode\" id=\"0c74a\" src=\"https://spectrum.ieee.org/media-library/close-up-of-a-needle-like-rocket-protruding-from-the-payload-bay-of-a-large-robotic-ball.jpg?id=67694233&amp;width=980\" /> <small class=\"image-media media-caption\">A small rocket can launch out of the center of the RoboBall to return a sample back to a rover outside the crater.<\/small><small class=\"image-media media-photo-credit\"><a href=\"https://ieeexplore.ieee.org/document/11248963\" target=\"_blank\">R. Jangale, D. Pravecek, et al.<\/a><\/small><\/p><h2>Getting Mission Ready<\/h2><p>In the new paper, the remotely operated RoboBall III descended the quarry’s slopes, navigated soft terrain, and launched hypothetical payloads back out of the crater with small rockets. Powered by a large battery, the robot would inflate itself during a lunar mission and charge up from a robotic rover at the edge of a crater before heading out on its own.<\/p><p>RoboBall is probably not the right platform for all kinds of missions—its slightly bumbling nature means that it’s not ideal if you want to collect a sample from a very specific rock, for example. For now, the team hopes to work with scientists designing lunar science instruments to physically fit into RoboBall’s carry-on-luggage-size interior, while also fitting in with how RoboBall operates. “The robot is not the mission,” Jangale says. “The robot is a way for you to complete the mission.”<\/p><p>The current version of RoboBall cost roughly $250,000 to build, but is not quite ready for the moon in its current form. While its gold-treated aluminum parts are appropriate for space missions, its other materials are not. Space-grade electronics will cost more, and the ball’s shell—made from a material tough enough to roll over steel shards and withstand minus 184 °C temperatures—has never been evaluated in lunar extremes. Aside from materials questions, the team plans to engineer the ball to adapt how it drives on varying slopes autonomously. They also hope to collaborate with government agencies or spaceflight contractors to keep refining the robot’s design for a real, <a href=\"https://spectrum.ieee.org/moon-landing-2025\" target=\"_blank\">eventual mission<\/a>.<\/p><p>Later this year, Texas A&amp;M will open <a href=\"https://space.tamu.edu/institute/facility/\" target=\"_blank\">a new facility<\/a> in Houston with the world’s largest indoor simulated moon and Mars landscapes. The facility is only 190 km from Jangale’s quarry. It’s still about 370,000 km from the moon, but it’s going to help Jangale get his robot quite a bit closer.<\/p>"}, {"title": "JAKA hits Teradyne Robotics back over patent dispute", "source": "Robotics Business Review", "date": "2026-09-03", "url": "https://www.therobotreport.com/jaka-hits-teradyne-robotics-back-over-patent-dispute/", "summary": "<p>JAKA is now taking legal action against Teradyne Robotics to end public dissemination of statements it considers \"false, misleading and damaging.\"<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/jaka-hits-teradyne-robotics-back-over-patent-dispute/\">JAKA hits Teradyne Robotics back over patent dispute<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "NVIDIA plans to acquire Hugging Face and keep AI development platform open", "source": "Robotics Business Review", "date": "2026-09-03", "url": "https://www.therobotreport.com/nvidia-to-acquire-hugging-face-and-keep-ai-develpment-platform-open/", "summary": "<p>NVIDIA is already a major model contributor to Hugging Face, which recently surpassed 1 million datasets.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/nvidia-to-acquire-hugging-face-and-keep-ai-develpment-platform-open/\">NVIDIA plans to acquire Hugging Face and keep AI development platform open<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Medtronic invests $700M in surgical partner Cornerstone Robotics", "source": "Robotics Business Review", "date": "2026-09-03", "url": "https://www.therobotreport.com/medtronic-invests-700m-in-surgical-partner-cornerstone-robotics/", "summary": "<p>Medtronic and Cornerstone Robotics are building a multi-port portfolio anchored by the Hugo surgical system and expanded by Sentire.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/medtronic-invests-700m-in-surgical-partner-cornerstone-robotics/\">Medtronic invests $700M in surgical partner Cornerstone Robotics<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Learn why food is physical AI’s hardest problem at RoboBusiness", "source": "Robotics Business Review", "date": "2026-09-02", "url": "https://www.therobotreport.com/learn-why-food-is-physical-ai-hardest-problem-chef-robotics-robobusiness/", "summary": "<p>Rajat Bhageria, the founder and CEO of Chef Robotics, will explore what makes food such a demanding benchmark for physical AI.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/learn-why-food-is-physical-ai-hardest-problem-chef-robotics-robobusiness/\">Learn why food is physical AI&#8217;s hardest problem at RoboBusiness<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "AIR to use Elmo Motion Control technology in uncrewed cargo aircraft", "source": "Robotics Business Review", "date": "2026-09-02", "url": "https://www.therobotreport.com/air-uses-elmo-motion-control-technology-in-uncrewed-cargo-aircraft/", "summary": "<p>The partnership brings together Elmo's compact, high-power density servo drives and AIR's electric aviation design.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/air-uses-elmo-motion-control-technology-in-uncrewed-cargo-aircraft/\">AIR to use Elmo Motion Control technology in uncrewed cargo aircraft<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "NexCOBOT discusses physical AI market hurdles and acceleration", "source": "Robotics Business Review", "date": "2026-09-02", "url": "https://www.therobotreport.com/nexcobot-discusses-physical-ai-market-hurdles-and-acceleration/", "summary": "<p>NexCOBOT, which provides functional safety and motion controllers, discusses how physical AI benefits from 'Big Tech' and where it will grow.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/nexcobot-discusses-physical-ai-market-hurdles-and-acceleration/\">NexCOBOT discusses physical AI market hurdles and acceleration<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "The Missing Layer in Robot Safety Assurance", "source": "Robotics Business Review", "date": "2026-09-01", "url": "https://www.therobotreport.com/the-missing-layer-in-robot-safety-assurance/", "summary": "<p>Why robot safety assurance must account for attacks that can change how a machine sees, decides, and acts.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/the-missing-layer-in-robot-safety-assurance/\">The Missing Layer in Robot Safety Assurance<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "HowToRobot and Robotics Australia Group partner on platform to encourage robot adoption", "source": "Robotics Business Review", "date": "2026-09-01", "url": "https://www.therobotreport.com/howtorobot-robotics-australia-group-partner-platform-encourage-robot-adoption/", "summary": "<p>The initiative is intended to help businesses in Australia identify automation opportunities, test them, and connect with local suppliers.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/howtorobot-robotics-australia-group-partner-platform-encourage-robot-adoption/\">HowToRobot and Robotics Australia Group partner on platform to encourage robot adoption<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "From spreadsheets to AI: Deere gives farmers new features in Operations Center, JD", "source": "The Robot Report", "date": "2026-09-01", "url": "https://www.therobotreport.com/from-spreadsheets-ai-john-deeres-new-jd-operations-center-features/", "summary": "<p>John Deere has launched JD, an AI tool that turns historical farm data into actionable insights to boost profitability.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/from-spreadsheets-ai-john-deeres-new-jd-operations-center-features/\">From spreadsheets to AI: Deere gives farmers new features in Operations Center, JD<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Learn how physical AI is being used to do real work at RoboBusiness",
