search/report/venture-trends-2025/\" target=\"_blank\">a record US $40.7 billion, accounting for 9 percent of all venture funding<\/a><span>. The multibillion dollar question therefore is this: What will it take for AI-powered robots to begin to have a serious economic impact? Many of today’s robotics and AI companies are making bold claims, such as that humanoid robots will <\/span><a href=\"https://www.1x.tech/\" target=\"_blank\">soon be coming into our homes<\/a><span>, but there’s still a big gap between promise and reality.<\/span><\/p><p><span><\/span><span>The promise of robots that live and work alongside us has been the stuff of science fiction for a very long time. And while many programmers have tried to make that promise a reality, the physical world is just too complicated for traditional computer programs to handle the endless complexity it presents. Thanks to AI, robots are no longer being programmed—instead, they learn to operate in the real world. With enough practice, they can learn to perceive and understand the world around them, reason about that world, and use that reason and understanding to perform tasks that are useful, reliable, and safe.<\/span><\/p><p>The two of us have worked at the forefront of AI and robotics for the last decade, as a <a href=\"https://engineering.oregonstate.edu/people/jonathan-hurst\" target=\"_blank\">Professor in Robotics at Oregon State University<\/a> and <a href=\"https://www.agilityrobotics.com/about/leadership\" target=\"_blank\">Co-Founder of Agility Robotics<\/a>, and as <a href=\"https://www.linkedin.com/in/hanspeter/\" rel=\"noopener noreferrer\" target=\"_blank\">former CEO<\/a> of the <a href=\"https://everydayrobots.ai/\" rel=\"noopener noreferrer\" target=\"_blank\">Everyday Robots moonshot at Google X<\/a>. Our experience deploying AI-powered robots in real-world settings has given us a perspective on where AI can be used to great benefit in complex robotic systems in the near term and where we are still on the frontier of science fiction. We believe AI will enable an inflection point in robotics advances, but that it will be through the well-engineered application of coordinated systems of different AI tools rather than a single ChatGPT-style breakthrough.<\/p><p>As the excitement around AI is matched only by the uncertainty of what will be possible, here are five hard truths that will define AI in robotics.<\/p><h2>1. The YouTube-to-Reality Gap Is Real<\/h2><p>For years, we have been seeing videos on YouTube with humanoid robots performing amazing moves on everything from a dance floor to an obstacle course. The inside knowledge in robotics is to “never trust a YouTube robot video.” The gap between real robots that can perform real work in unstructured human environments and carefully scripted and edited robot performances remains significant. The latest performance to get a lot of attention was a <a href=\"https://www.youtube.com/watch?v=mUmlv814aJo\" rel=\"noopener noreferrer\" target=\"_blank\">martial arts show<\/a> featuring Unitree humanoid robots performing with children at the Chinese 2026 Spring Festival Gala. While impressive, this falls into a long lineage of tightly scripted robotic performances, where everything has been carefully choreographed and planned in advance. The low-level controls, synchronization, and choreography were stunning, yet the Spring Gala robot performance showed a level of autonomy and intelligence much closer to industrial robots building cars in a factory than something that will show up in your living room any time soon. <\/p><p class=\"shortcode-media shortcode-media-youtube\"> <span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span> <\/p><p><span>Seeing these kinds of demos nevertheless raises questions about where robotics really is. If robots can perform kung fu moves and do backflips and dance, why aren’t they also showing up on factory floors yet? And why can’t they do the dishes in my home after dinner? The simple answer is this: Making AI-powered robots capable of performing general tasks in varied human environments is still <\/span><em><em>really<\/em><\/em><span> hard. While impressive technological feats like those at the Spring Festival may make it look like we could be very close, the use of AI in these demos is only for low-level motor control (to keep the robots from falling over) and therefore is only a small part of the solution for robots to be general purpose in the real, unstructured spaces where we humans live and work.<\/span><\/p><h2>2. Data Is An Unsolved Challenge<\/h2><p>Large Language Models (LLMs) like OpenAI’s ChatGPT and Anthropic’s Claude were initially trained on an internet-scale database of text. The world woke up one day in late 2022 to ChatGPT demonstrating that AI computers could suddenly “speak” to us in prose or verse and about seemingly any topic. LLMs have turned out to generalize well and are now able to take multimodal input (text, images, video) and produce multimodal output. Importantly, the corpus of training data was both enormous and human-generated, which are characteristics that form the gold standard for AI training.<\/p><p class=\"shortcode-media shortcode-media-rebelmouse-image rm-float-left rm-resized-container rm-resized-container-25\" style=\"float: left;\"> <img alt=\"A series of four images, including robots working in a contained factory space, in an open indoor factory, outdoors in the real world delivering a package, and working with a human to move a couch in an apartment.\" class=\"rm-shortcode\" id=\"a0903\" src=\"https://spectrum.ieee.org/media-library/a-series-of-four-images-including-robots-working-in-a-contained-factory-space-in-an-open-indoor-factory-outdoors-in-the-real.jpg?id=66734272&amp;width=980\" /> <small class=\"image-media media-caption\">The fastest path to robots as part of everyday life may emerge through a range of robot forms performing increasingly sophisticated applications and employing a range of AI tools.<\/small><small class=\"image-media media-photo-credit\">Agility Robotics<\/small><\/p><p>Giving AI a body (in the form of a robot), so that it can engage with people in the physical world, continues to be a very difficult and broadly unsolved problem. AI models for general-purpose robotics must simultaneously satisfy multiple, often conflicting, physical, geometric, and temporal limitations while operating in unstructured, dynamic environments. In order to generalize, robot models need to be trained on data gathered in a high-dimensional configuration space, where “dimensions” represent text, lighting conditions, degrees of freedom, joint limits, velocities, force, and safety boundaries, just to mention a few. Importantly, this must be <em><em>good<\/em><\/em> data—it must contain many examples from what amounts to an infinite number of possible configurations in the physical world.<\/p><p>Since there are very few existing sources of data like this, approaches like teleoperation, video analysis, motion capture of humans, and self-exploration in simulation and in the real world are all seen as important ways to collect data. It’s a herculean task. For example, at Everyday Robots at Google X, we ran 240 million robot instances in our simulator over the course of 2022 to collect training data, mostly to train a trash-sorting model. Similar amounts of data will be needed for every skill to get to a similar level of capability, which is not yet human level.<\/p><h2>3. There Will Be No Single Robot AI<\/h2><p>We are far away from a moment where a single AI model might allow general-purpose robots to live and work alongside us. <\/p><p>General-purpose robots can have wheels or legs. They can have one, two, three, or more arms. Some have propellers and can fly, while others may be designed to operate under water. Some will drive on busy roads. The physical world is infinitely varied and complex. And then there are all the people and other animals that will be surrounding the robots. How do you train a model to operate a robot safely and reliably in all of these settings? The simple answer is: You don’t. At least not for quite some time.<\/p><p>We believe the winning AI architecture leading to the next big breakthroughs in general-purpose robotics will be “agentic AI” for robots, which are high-level coordinating models that can reason, plan, use tools, and learn from outcomes to execute complex tasks with limited supervision. Agentic, high-level models running on robots will invoke a system of specialized ones for different types of tasks. We will likely soon see multiple robots collaborating and coordinating with each other through their onboard agentic AI models.<\/p><p>AI tools are unlocking new and powerful capabilities in robotics, which in turn will enable new solutions and new markets. It’s encouraging to see these new models being made broadly available, some even as open-source solutions. This availability is akin to what happened with the internet: Real progress occurred when it became ubiquitous. We anticipate an inevitable democratization of complex behaviors in robotics with wide access to these AI tools and technologies.<\/p><h2>4. Hardware Is Still Very Hard<\/h2><p>Robots are complex systems with many parts that all need to work together with great precision. For a robot to be useful and safe, every part of it must be coordinated, from its perception systems to the computer controlling it, all the way down to its individual actuators.<\/p><p>Actuators—that is, the motors and gears—are a good example of an important part of the robot where what got us here won’t get us there. The actuators used at scale by most industrial robots will not work for robots that will operate in human environments. If these robots accidentally collide with an obstacle, the resulting impacts are harsh, forces are high, and things break. Humans don’t move in this way. We are far more compliant in how we interact with the world, and we’re constantly making contact with our environment and using that contact to help us accomplish things. <\/p><p>Consider the challenge of inserting a key in a lock: Humans typically don’t do this by aligning the key perfectly with the keyhole. Instead, we just feel for the edge of the keyhole and jiggle the key in. Robots need to be able to operate in novel ways to achieve comparable capabilities by using a new class of actuators that are sensitive to force and able to have a compliant interaction with the environment. While these kinds of actuators do exist, they are not yet generally available at scale for robot systems designed to operate around people.<\/p><h2>5. Real Value Comes From “Easy” Tasks<\/h2><p>There’s a big difference between tasks that look impressive and real-world tasks that provide value. Robotics is a perfect example of <a href=\"https://en.wikipedia.org/wiki/Moravec%27s_paradox\" target=\"_blank\">Moravec’s paradox<\/a>, which states that tasks that are hard for humans are easy for computers (like multiplying two big numbers), and tasks easy for humans (like a toddler’s movements) are extremely difficult for computers and robots.<\/p><p>Serving customers is an unforgiving reality check, because customers only care about solving the real problems they have. If we are to deploy AI-based robot solutions, they must outperform the way things are currently done while demonstrating reliable performance metrics and safety. Agility Robotics’ early work to deploy our humanoid robot Digit in customer locations led to the realization that our first obstacle was safety: Robots that balance and manipulate objects in human spaces bring new types of risk to the workplace. In the first <a href=\"https://www.youtube.com/watch?v=AJpTpUqjgrY\" target=\"_blank\">humanoid deployments<\/a>, physical barriers were necessary, and Agility kicked off a multi-year engineering effort to solve the safety challenge, touching nearly every aspect of robot design and relying heavily on new AI-based approaches to human detection and behavior control.<\/p><p class=\"shortcode-media shortcode-media-youtube\"> <span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span> <\/p><p><a href=\"https://everydayrobots.ai/vision\" target=\"_blank\">Everyday Robots<\/a> at Google deployed robots in 2019 that worked autonomously in office buildings doing chores like cleaning cafe tables and sorting trash. We quickly learned how “messy” and difficult the real world is for a robot. This experience informed the architecture and deployment of our AI systems while also gathering real-world data that could be combined with simulation data for training and improving models.<\/p><p>This focus on creating a product to meet specific customer needs and deploying robots in real-world settings is the only way to inform the structure of the AI tools and infrastructure for near-term utility on a path towards long-term broader capability and generality. There will be no “aha” moment, no silver bullet algorithm, and no volume of data sufficient to produce a general-purpose robot without extensive real-world experience. <\/p><h2>AI Robots Are Coming, One Step at a Time<\/h2>As we look to the future, there is no doubt that the world is bringing AI into the physical world through robots. We are at the beginning of a “<a href=\"https://spectrum.ieee.org/is-a-cambrian-explosion-coming-for-robotics\" target=\"_self\">Cambrian explosion<\/a>“ of useful, intelligent machines. We believe AI is not one tool, but a huge frontier of technical approaches that is unlocking new capabilities so powerful, they will define our economy moving forward. This will happen not in one single definitive moment, but as an ongoing set of small and large breakthroughs, where AI-driven robots begin to provide real value in a few tasks, and then a few more, with impacts unfolding across numerous $100 billion-plus markets that will dramatically improve the quality of our lives."}], "roboticsNews": [{"title": "Reimagine Robotics emerges from stealth with robots that ‘learn on the job’", "source": "Robotics Business Review", "date": "2026-08-03", "url": "https://www.therobotreport.com/reimagine-robotics-emerges-stealth-with-robotslearn-on-the-job/", "summary": "<p>Reimagine Robotics, founded by former Google DeepMind Applied Robotics leaders, is developing systems that do not require specialized programmers.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/reimagine-robotics-emerges-stealth-with-robotslearn-on-the-job/\">Reimagine Robotics emerges from stealth with robots that &#8216;learn on the job&#8217;<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Walden Robotics Partners With Toyota on Practical Humanoids", "source": "IEEE Spectrum Robotics", "date": "2026-08-03", "url": "https://spectrum.ieee.org/humanoid-robots-walden-robotics-toyota", "summary": "<img src=\"https://spectrum.ieee.org/media-library/humanoid-orange-and-white-robot-using-two-finger-gripper-hands-to-work-with-metal-tool-components.jpg?id=67568024&amp;width=1200&amp;height=800&amp;coordinates=62%2C0%2C63%2C0\" /><br /><br /><p>For a while there, it seemed as though robotics as a whole was stuck in a <a href=\"https://spectrum.ieee.org/top-robotics-stories-2024\" target=\"_self\">mad rush<\/a> towards building <a href=\"https://spectrum.ieee.org/topic/robotics/humanoid-robots/\" target=\"_self\">humanoid robots<\/a> mostly because it was very possible (and very lucrative) to do so, even without near-term goals that were necessarily realistic. Some of the magic of those first couple of years of the humanoid explosion has stuck around, but there’s also been an industry-wide sobering leading to <a href=\"https://spectrum.ieee.org/humanoid-robot-scaling\" target=\"_self\">pointed questions about practicality and value<\/a>. In other words, starting a commercial humanoid company <em><em>now<\/em><\/em> is a much different proposition than it would have been just a few years ago. <\/p><p>On 15 July, <a href=\"https://www.waldenrobotics.com/news/walden-robotics-launches-from-stealth\" rel=\"noopener noreferrer\" target=\"_blank\">Walden Robotics emerged from stealth<\/a> with US $300 million in funding at a valuation of $1.1 billion. Walden is a spinout of <a href=\"https://spectrum.ieee.org/toyota-to-invest-1-billion-in-ai-and-robotics-rd\" target=\"_self\">Toyota Research Institute<\/a> (TRI), and it’s spent the last 10 or so years working on hard problems in robotics with the goal of transitioning from research to real-world applications. That seems like the amount of time and experience that it might reasonably take to develop a <a href=\"https://spectrum.ieee.org/humanoid-robot-scaling\" target=\"_self\">practical and value-driven approach<\/a> to deploying general-purpose humanoid robots, and Walden has chosen an excellent starting point by skipping the legs.<\/p><p>“It’s ironic,” says Walden co-founder and CEO <a href=\"https://www.linkedin.com/in/russ-tedrake-88648a4a/\" rel=\"noopener noreferrer\" target=\"_blank\">Russ Tedrake<\/a>. “I thought about legs for 20 years; that’s the class I teach at MIT. There are many reasons to build a robot with legs. But the question is, what’s the addressable market? And what percentage of it is covered by a wheeled base?” It’s this focused, practical thinking that sets Walden somewhat apart from many (if not most) of the other companies in this space. Rather than <a href=\"https://spectrum.ieee.org/boston-dynamics-spot-robot-dog-now-available\" target=\"_self\">developing a robot first and searching for a viable commercial use case second<\/a>, Walden instead identified applications where robots can provide value now, and designed a robot that could safely and efficiently meet those needs.<\/p><p class=\"shortcode-media shortcode-media-youtube\"> <span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span> <small class=\"image-media media-photo-credit\">Walden Robotics<\/small> <\/p><h2>Walden Robotics’ Manufacturing Focus<\/h2><p class=\"shortcode-media shortcode-media-rebelmouse-image rm-float-left rm-resized-container rm-resized-container-25\" style=\"float: left;\"> <img alt=\"A smiling man in a blue shirt\" class=\"rm-shortcode\" id=\"f545c\" src=\"https://spectrum.ieee.org/media-library/a-smiling-man-in-a-blue-shirt.jpg?id=67568051&amp;width=980\" /> <small class=\"image-media media-caption\">Russ Tedrake is the CEO and co-founder of Walden Robotics.<\/small><small class=\"image-media media-photo-credit\">Walden Robotics<\/small><\/p><p>Tedrake is light on the details about what specific applications Walden is targeting at this point (citing confidentiality with current commercial partners). Manufacturing and logistics environments where there are a lot of <a href=\"https://www.youtube.com/watch?v=F_7IPm7f1vI\" target=\"_blank\">relatively simple<\/a> and <a href=\"https://www.youtube.com/watch?v=tv90GFM9RAo\" target=\"_blank\">repetitive tasks<\/a> that aren’t friendly to conveyor belts and pre-programmed robot arms are a good bet. Even in these environments, however, robots still have to find a useful niche, because they’re going up against human workers who are more flexible while also cheaper to employ. So the question is: how do you make an argument to a customer that a robot is actually a better solution than their existing human workers?<\/p><p>“You need to find applications with high utilization—where the robot is used 24 hours a day, 7 days a week,” says Tedrake. “Manufacturing is a global imperative right now, and it makes the economics work.” Economic viability is a necessary condition, but it’s not a sufficient one for Walden, or for their partnership with Toyota. People are a big part of Walden’s plan, too.<\/p><p>One of Walden’s major strengths is the company’s partnership with Toyota, which is not all that surprising given that Walden is a spinout from TRI, which is <a href=\"https://spectrum.ieee.org/toyota-to-invest-1-billion-in-ai-and-robotics-rd\" target=\"_self\">Toyota’s Silicon Valley-based R&amp;D arm<\/a>. “Toyota was very proud of the work we had done at TRI, and was ready to go big in this space,” says Tedrake. “Part of the excitement of having Toyota as a partner is that their culture is deeply people-first. When talking to Toyota’s leadership, I was never asked how much money this is going to make, but I was asked how it will improve the quality of life for all people.”<\/p><p class=\"shortcode-media shortcode-media-rebelmouse-image\"> <img alt=\"A white and orange humanoid robot manipulates an object in its two-finger grippers.\" class=\"rm-shortcode\" id=\"209d4\" src=\"https://spectrum.ieee.org/media-library/a-white-and-orange-humanoid-robot-manipulates-an-object-in-its-two-finger-grippers.jpg?id=67568030&amp;width=980\" /> <small class=\"image-media media-caption\">The robot’s chonky design allows it to meet the high payload requirements of useful manufacturing work.<\/small><small class=\"image-media media-photo-credit\">Walden Robotics<\/small><\/p><p>In this context, at least in the short term, Walden’s approach to improving the quality of life for people is to take over those aforementioned repetitive manufacturing tasks with robots. Tedrake hopes that this will lead to workplaces where skilled craftspeople are able to do even more with their hard-earned expertise, increasing their efficiency, productivity, and happiness all at the same time—a noble goal, although there’s only so much Walden itself can do to make this happen, and not all customers will share Toyota’s priorities.<\/p><h2>Wheeled Humanoid Robots in Factories<\/h2><p>Many other <a href=\"https://www.agilityrobotics.com/\" target=\"_blank\">humanoid<\/a> <a href=\"https://www.figure.ai/\" target=\"_blank\">robotics<\/a> <a href=\"https://apptronik.com/\" target=\"_blank\">companies<\/a> are also targeting these logistics and manufacturing spaces with general-purpose robots, and they’re doing so by making robots that are as human-like as possible. The theory is that a humanoid form factor is necessary when operating in human environments. And there are certainly arguments in favor of a humanoid with legs—stairs exist, for one, and legged robots have a smaller footprint compared to wheels.<\/p><p>But a large wheeled base offers some significant advantages, as Tedrake points out. You’re incentivized to cram the base full of batteries, since more weight near the floor keeps the robot stable, which also solves the problem of running out of power during the middle of the workday. More importantly, a statically stable robot that moves around on a wheeled base can bypass the <a href=\"https://spectrum.ieee.org/humanoid-robot-scaling\" target=\"_self\">safety challenges<\/a> that are currently keeping legged humanoids physically separated from real humans—most prominently, the fact that legged robots can fall over. “Factories already have autonomous mobile [wheeled] robots,” explains Tedrake. “They already have safety cases built around AMRs. You can piggyback on that with a wheeled base.”<\/p><p class=\"shortcode-media shortcode-media-rebelmouse-image\"> <img alt=\"A close-up of a robotic gripper grasping a metallic object in a vise.\" class=\"rm-shortcode\" id=\"f600c\" src=\"https://spectrum.ieee.org/media-library/a-close-up-of-a-robotic-gripper-grasping-a-metallic-object-in-a-vise.jpg?id=67568022&amp;width=980\" /> <small class=\"image-media media-caption\">Simple, rugged grippers make the robot suitable for commercial deployment.<\/small><small class=\"image-media media-photo-credit\">Walden Robotics<\/small><\/p><p>Walden’s perspective on manipulation is similar. Many humanoid companies are using five-fingered hands that are highly dexterous, but also highly complex, which Tedrake believes is not a pragmatic approach in the context of commercial deployments. “There’s a question of what you need to do the tasks, but the real question is just durability,” Tedrake says. “We have been deployed in a Toyota factory, and at the end of the week, the hands take a beating, so we built hands that can take that. I have not seen a more dexterous hand that could have done the work our hand has done.”<\/p><p>Walden’s long-term plan is to build “general purpose robots.” It’s not always clear what a general purpose robot is, because (I would argue) nobody is quite sure what “general purpose” means. It’s certainly not referring to robots that can do <em><em>everything<\/em><\/em>; I think the closest we can get are robots that can be taught to do a useful number of different skills, which is why I prefer the term “multi-purpose.” It’s a little pedantic, I know, but I think the distinction is important because it moderates expectations in the near term.<\/p><p>Part of where Walden’s optimism towards general purposeness comes from is TRI’s earlier research on <a href=\"https://medium.com/toyotaresearch/tris-robots-learn-new-skills-in-an-afternoon-here-s-how-2c30b1a8c573\" target=\"_blank\">diffusion policy<\/a>, which helps robots learn new skills more quickly by leveraging previously learned skills as a foundation. “Fundamentally, multi-tasking is a way to get to a general purpose robot,” Tedrake says. “I believe there is a single platform that can do a lot of tasks that are of high value for real customers. That will give us the experience we need to give birth to this deployed general-purpose capability.”<\/p>"}, {"title": "HEBI Robotics earns NASA SBIR grant to fast track miniaturized actuators", "source": "Robotics Business Review", "date": "2026-08-03", "url": "https://www.therobotreport.com/hebi-robotics-earns-nasa-sbir-grant-fast-track-miniaturized-actuators/", "summary": "<p>This Phase I award is only part of HEBI Robotics' roadmap. The company also plans to continue developing its existing actuation hardware.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/hebi-robotics-earns-nasa-sbir-grant-fast-track-miniaturized-actuators/\">HEBI Robotics earns NASA SBIR grant to fast track miniaturized actuators<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "igus launches energy chain with 600-degree rotation for industrial robots", "source": "Robotics Business Review", "date": "2026-08-03", "url": "https://www.therobotreport.com/igus-launches-energy-chain-600-degree-rotation-industrial-robots/", "summary": "<p>igus says its new twisterchain energy chain provides cable management for challenging industrial robotics applications such as palletizing.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/igus-launches-energy-chain-600-degree-rotation-industrial-robots/\">igus launches energy chain with 600-degree rotation for industrial robots<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Google DeepMind says Gemini Robotics 2 enables full body control", "source": "Robotics Business Review", "date": "2026-08-02", "url": "https://www.therobotreport.com/google-deepmind-says-gemini-robotics-2-enables-full-body-control/", "summary": "<p>Gemini Robotics 2 enables robots to reason through every movement, unlocking a broad range of tasks, DeepMind said. <\/p>\n<p>The post <a href=\"https://www.therobotreport.com/google-deepmind-says-gemini-robotics-2-enables-full-body-control/\">Google DeepMind says Gemini Robotics 2 enables full body control<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Top 10 robotics stories of July 2026", "source": "Robotics Business Review", "date": "2026-08-01", "url": "https://www.therobotreport.com/top-10-robotics-stories-july-2026/", "summary": "<p>In July, large funding rounds, new approaches to robot training, and new robot models drew our readers attention.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/top-10-robotics-stories-july-2026/\">Top 10 robotics stories of July 2026<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Procore Technologies acquires DroneDeploy for $845M", "source": "Robotics Business Review", "date": "2026-07-31", "url": "https://www.therobotreport.com/procore-technologies-acquires-dronedeploy-845m/", "summary": "<p>Procore will integrate DroneDeploy's visual intelligence technology to link the digital world with physical construction sites.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/procore-technologies-acquires-dronedeploy-845m/\">Procore Technologies acquires DroneDeploy for $845M<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "KUKA deploys Automation Management Platform for North American automakers", "source": "Robotics Business Review", "date": "2026-07-31", "url": "https://www.therobotreport.com/kuka-deploys-automation-management-platform-north-american-automakers/", "summary": "<p>KUKA has deployed its Automation Management Platform at KTPO, a major manufacturing facility in Ohio.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/kuka-deploys-automation-management-platform-north-american-automakers/\">KUKA deploys Automation Management Platform for North American automakers<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "FCC robot ruling shines a spotlight on U.S. policy; how next-gen AI can help warehousing", "source": "Robotics Business Review", "date": "2026-07-31", "url": "https://www.therobotreport.com/fcc-robot-ruling-shines-spotlight-on-u-s-policy-how-next-gen-ai-can-help-warehousing/", "summary": "<p>OSARO’s Derek Pridmore says warehouse robots are advancing, but real-world safety and reliability still depend on specialized, layered AI systems.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/fcc-robot-ruling-shines-spotlight-on-u-s-policy-how-next-gen-ai-can-help-warehousing/\">FCC robot ruling shines a spotlight on U.S. policy; how next-gen AI can help warehousing<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Video Friday: Meet Google DeepMind’s Gemini Robotics 2", "source": "IEEE Spectrum Robotics", "date": "2026-07-31", "url": "https://spectrum.ieee.org/video-robot-gemini2-ai-robot", "summary": "<img src=\"https://spectrum.ieee.org/media-library/humanoid-robot-and-robotic-arm-labeled-gemini-robotics-er-2-in-a-workshop-setting.webp?id=67560022&amp;width=1200&amp;height=800&amp;coordinates=125%2C0%2C125%2C0\" /><br /><br /><p><span>Video Friday is your weekly selection of awesome robotics videos, collected by your friends at <\/span><em>IEEE Spectrum<\/em><span> robotics. We also post a weekly calendar of upcoming robotics events for the next few months. Please <\/span><a href=\"mailto:automaton@ieee.org?subject=Robotics%20event%20suggestion%20for%20Video%20Friday\">send us your events<\/a><span> for inclusion.<\/span><\/p><h5><a href=\"https://actuate.foxglove.dev/\">Actuate 2026<\/a>: 18–19 August 2026, SAN FRANCISCO<\/h5><h5><a href=\"https://2026.ieee-iros.org/\">IROS 2026<\/a>: 27 September–1 October 2026, PITTSBURGH<\/h5><h5><a href=\"https://humanoidssummit.com/\">Humanoids Summit Seoul<\/a>: 22–23 September 2026, SEOUL<\/h5><p>Enjoy today’s videos!<\/p><div class=\"horizontal-rule\"><\/div><div><span style=\"display: none;\"> <\/span><\/div><blockquote class=\"rm-anchors\" id=\"4lsqnrmc6ny\"><em>Introducing Gemini Robotics 2—the intelligence layer powering the next generation of truly adaptable robots. As it takes its first literal steps, this major advance unlocks intelligent whole-body control, advanced dexterity, and multi-robot collaboration. <\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p class=\"shortcode-media shortcode-media-youtube\"> <span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p class=\"shortcode-media shortcode-media-youtube\"> <span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://deepmind.google/blog/gemini-robotics-2-brings-whole-body-intelligence-to-robots/\">Google DeepMind<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"vzwytn3fw1w\">THE ROADMAP! NOOOOO!<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.agilityrobotics.com/\">Agility<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"xha2tj_1c6q\">Videos like this always make me wonder how <a href=\"https://spectrum.ieee.org/robot-with-liquid-metal-tendons-can-heal-itself\" target=\"_blank\">repairable<\/a> these robots are. Very, I would hope.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.unitree.com/As2-W\">Unitree<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"m81_7rggdxm\"><em>Humans routinely communicate through abstractions of their bodies, including shadows, silhouettes, and reflections. Here, we present a robotic system capable of dynamic shadow expression using a 21-degree-of-freedom <a href=\"https://spectrum.ieee.org/video-friday-robotic-hand-dexterity\" target=\"_blank\">dexterous hand<\/a> with compliant soft skin and a learned shadow self-model.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://generalroboticslab.com/shadow\">General Robotics Lab<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"n20cvjhmzh8\">Human to quadruped motion transfer is an odd concept but I’m here for it.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://studios.disneyresearch.com/2026/07/30/two2four-generative-quadruped-puppeteering-from-human-motion/\">Disney Research<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"alc1aon3a4i\"><em>Meet Stretch 4.0<\/em>—<em>The one-armed, three-wheeled robot that can navigate your home safely. Would you rather a humanoid robot or Stretch?<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://hello-robot.com/\">Hello Robot<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"cjytikq4dum\">And now, this, for some reason.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.pndbotics.com/\">PNDbotics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"k4wzqzblkry\">I’m not sure we’re allowed to be impressed if you resize a badminton court to accommodate your robot.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.phybot.tech/en/home\">PHYBOT<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"rnrf8fc47qm\">Golden eagles care not for <a href=\"https://spectrum.ieee.org/dutch-police-training-eagles-to-take-down-drones\" target=\"_blank\">drones<\/a>. <\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.team-blacksheep.com/\">Team BlackSheep<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"1tzmvkf7x10\"><em>USC researchers work with NASA and others to train robot dogs for planetary exploration on Mars, the moon and beyond!<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.radlab.us/\">Research in Applied Decisions: RAD Lab<\/a> ]<\/p><p>Thanks, Cristina!<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"lzphwt2wwv8\"><a href=\"https://spectrum.ieee.org/humanoid-robots-japan\" target=\"_blank\">WABOT-1<\/a> was arguably the birth of the humanoid robot in Japan. We’ve come a long way, and it’s good to be reminded where we started.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"http://www.takanishi.mech.waseda.ac.jp/top/index.htm\">Takanishi Lab<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"1eplnnhbqbs\">If only this video was at 1x instead of 5x we could have had 15 hours of Memo folding laundry.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.sunday.ai/\">Sunday Robotics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div>"}, {"title": "Teradyne Robotics revenue rises 33% year over year in Q2", "source": "Robotics Business Review", "date": "2026-07-30", "url": "https://www.therobotreport.com/teradyne-robotics-revenue-rises-33-year-over-year-in-q2/", "summary": "<p>Teradyne Robotics said growth in the U.S. and in AI were big drivers for its revenue increase in the second quarter of 2026.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/teradyne-robotics-revenue-rises-33-year-over-year-in-q2/\">Teradyne Robotics revenue rises 33% year over year in Q2<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "DoorDash gains FAA certification to operate its own drone delivery program", "source": "Robotics Business Review", "date": "2026-07-30", "url": "https://www.therobotreport.com/doordash-gains-faa-certification-to-operate-its-own-drone-delivery-program/", "summary": "<p>The FAA approval came nearly a year after DoorDash unveiled its delivery robot and reflects its increasing interest in building automation in-house.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/doordash-gains-faa-certification-to-operate-its-own-drone-delivery-program/\">DoorDash gains FAA certification to operate its own drone delivery program<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "5 Physical AI infrastructure platforms shaping robotics in 2026", "source": "Robotics Business Review", "date": "2026-07-30", "url": "https://www.therobotreport.com/5-physical-ai-infrastructure-platforms-shaping-robotics-in-2026/", "summary": "<p>These five platforms address different challenges and provide the basis for the emerging physical AI tech stack, according to Lightwheel.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/5-physical-ai-infrastructure-platforms-shaping-robotics-in-2026/\">5 Physical AI infrastructure platforms shaping robotics in 2026<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Experts react to FCC limits on U.S. imports of new humanoid and mobile robots", "source": "Robotics Business Review", "date": "2026-07-29", "url": "https://www.therobotreport.com/industry-reacts-fcc-ban-u-s-imports-new-humanoid-quadruped-robots/", "summary": "<p>The FCC has banned some foreign humanoids, which industry experts say could help U.S. industry but hinder innovation.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/industry-reacts-fcc-ban-u-s-imports-new-humanoid-quadruped-robots/\">Experts react to FCC limits on U.S. imports of new humanoid and mobile robots<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "GMEX Robotics to acquire MediaMeta.ai for social intelligence", "source": "Robotics Business Review", "date": "2026-07-29", "url": "https://www.therobotreport.com/gmex-robotics-to-acquire-mediameta-ai-social-intelligence/", "summary": "<p>GMEX Robotics has acquired shares in MediaMeta to incorporate social intelligence capabilities into its service robots.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/gmex-robotics-to-acquire-mediameta-ai-social-intelligence/\">GMEX Robotics to acquire MediaMeta.ai for social intelligence<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "How integrated actuators improve humanoid robot joint performance and system integration", "source": "Robotics Business Review", "date": "2026-07-28", "url": "https://www.therobotreport.com/how-integrated-actuators-improve-humanoid-robot-joint-performance-and-system-integration/", "summary": "<p>Humanoid robots have become an important area of research in robotics, attracting attention from universities, research institutions, and technology companies.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/how-integrated-actuators-improve-humanoid-robot-joint-performance-and-system-integration/\">How integrated actuators improve humanoid robot joint performance and system integration<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Robot Finger Feels in Color", "source": "IEEE Spectrum Robotics", "date": "2026-07-28", "url": "https://spectrum.ieee.org/robot-finger", "summary": "<img src=\"https://spectrum.ieee.org/media-library/close-up-of-a-sensor-for-a-robotic-fingertip-and-raised-relief-images-of-a-leaf-and-a-u-s-penny.jpg?id=67542077&amp;width=1200&amp;height=800&amp;coordinates=0%2C83%2C0%2C84\" /><br /><br /><p><span>Imagine running your fingertip over the surface of a U.S. penny. You would feel the ridges of the raised letters and numbers, Abe Lincoln’s bearded side profile, and, if it’s tails, the fluted columns of the Lincoln Memorial. Getting a robot to sense the same things is an imposing task, often requiring gathering data on pressure and force at many spatial locations at once. But that’s just what a team of scientists in Europe has now managed to do, using an unusual, colorful robotic skin that provides high-resolution sensing in real time.<\/span><\/p><p>“To be honest, when they showed us this, we thought it was, and pardon my French, [expletive] cool, because it’s a distinctly different approach,” recalled Rich Walker, director of <a href=\"https://shadowrobot.com/\" target=\"_blank\">Shadow Robot<\/a>, the U.K.’s longest-running robot company, which primarily focuses on <a href=\"https://spectrum.ieee.org/video-friday-shadow-robot-hand\" target=\"_blank\">robotic hands<\/a>.<\/p><p class=\"ieee-inbody-related\">RELATED: <a href=\"https://spectrum.ieee.org/shadow-walker-biped-humanoid-robot\" target=\"_self\">“This DIY Bipedal Robot Used Pneumatic “Air-Muscles” Instead of Motors”<\/a><\/p><p>The research team, which hails from Queen Mary University of London, the University of Florence, the University of Trieste, and the University of Trento, designed a robotic fingertip with a synthetic skin that reflects different colors of light in response to mechanical deformation. By reading the light reflected off the skin, the fingertip generates maps of topology, strain, and contact pressure. The team has already used the sensor to generate maps of a human fingertip, a penny, and a leaf.<\/p><p><a href=\"https://www.seresearch.qmul.ac.uk/cit/people/gsasso/\" target=\"_blank\">Giacomo Sasso<\/a>, a postdoctoral research associate in the lab of <a href=\"https://www.sems.qmul.ac.uk/staff/f.carpi/\" target=\"_blank\">Federico Carpi<\/a> at Queen Mary University of London, came up with the idea for the sensor. He had been researching optics when he stumbled upon an interesting <a href=\"https://www.nature.com/articles/s41563-022-01318-x\" target=\"_blank\">paper published in the journal <em><em>Nature<\/em><\/em><\/a>. It described the “mechanochromic material” that would eventually make up the reflector in the skin.<\/p><p>Following the method described in <em><em>Nature<\/em><\/em>, Sasso exposed a light-sensitive film to a 5-megawatt, 635-nanometer (red) laser for seven minutes. The laser beam creates an interference pattern which causes the film to polymerize in alternating densities, creating layers with different refractive indices.<\/p><p>This structure is called a <a href=\"https://spectrum.ieee.org/a-simple-filter-makes-blueemitting-oleds-give-off-white-light\" target=\"_blank\">Bragg reflector<\/a>. The alternating densities and refractive indices in the polymer cause specific wavelengths of light to be reflected. When the reflector is deformed by contact with an object, its layers are stretched, becoming thinner and reflecting light of a different wavelength. <\/p><p>It took Sasso less than a week to re-create the material in the lab. “From there, we started seeing how we could translate these color patterns into something that was useful for us,” he says. Soon, they realized that the color produced by the material was all they needed to be able to sense the topology of objects.<\/p><p>In the robotic finger, the Bragg reflector is sandwiched between a layer of silicone, which protects it from the outside, and a transparent, fingertip-shaped silicone finger with a camera and LED light embedded inside of it. <\/p><p>The light from the LED shines through the clear polymer of the finger. When the fingertip is deformed by an object, the reflector bounces light back to the camera, with wavelengths depending on the level of deformation—red for least deformation, shifting to green, and then to blue when most deformed.<\/p><p>The team also made adjustments to increase the sensitivity of the skin and help the camera to better read color differences. The silicone of the outer layer of the fingertip is colored black to increase the color contrast, allowing the camera to better translate color into the morphology. The rigidity of the camera inside the finger also enhances the deformation of the reflector, producing greater differences in reflected wavelengths.<\/p><p>After all that optimization, the finger provided 100-micrometer resolution with no <a href=\"https://spectrum.ieee.org/robot-fingers\" target=\"_blank\">computational<\/a> latency, the researchers determined.<\/p><h2>What robot fingers need<\/h2><p>Human skin takes in a variety of tactile information in order to successfully move and manipulate objects, including temperature, texture, pressure, and vibration. But engineering a robot to do the same is challenging because of spatial constraints. There often isn’t enough room in a robotic fingertip to incorporate more than one type of sensor. The question then becomes: Which type of sensor should be used?<\/p><p>“And the answer to that is…that’s a really hard question. No one knows yet,” says Walker. Carpi’s team’s robotic finger is exciting because it presents yet another option for roboticists to experiment with, Walker says.<\/p><p>Although Carpi’s team <a href=\"https://www.gelsight.com/\" target=\"_blank\">isn’t the first<\/a> to use soft materials for tactile sensing, its technology is unique because it is able to extract quantitative information about depth and size from the topologic maps it generates. According to Walker, most sensors can only generate topological maps, which reveal the relative sizes of object features.<\/p><p>To Sasso, another key advantage of this robotic finger is that it embeds tactile sensing directly into the material of the finger, rather than using taxels, or pixels that measure force or pressure at specific spatial points. <\/p><p class=\"ieee-inbody-related\">RELATED: <a href=\"https://spectrum.ieee.org/robot-fingers\" target=\"_blank\">Robot Hand Manipulates Complex Objects by Touch Alone<\/a><\/p><p>“The core aspect of the sensor is that we’re essentially [moving toward] having the sensing element at the material level,” he says. “The camera, which is a very highly optimized electronic component, is translating whatever the material is already doing directly into digital signals.” <\/p><p><a href=\"https://www.linkedin.com/in/michael-yu-wang-258a4525/\" target=\"_blank\">Michael Wang<\/a>, co-founder and chief scientist at <a href=\"https://spectrum.ieee.org/daimon-robotics-physical-ai\" target=\"_blank\">Daimon Robotics<\/a>, which, unlike Shadow Robot, primarily uses vision-based sensing, echoed Walker’s sentiment that it’s beneficial to explore new methods of sensing, which may bring unique advantages. But he also explained that soft materials often face challenges with durability, and that the significance of the team’s work would be revealed when the finger is integrated into real<a href=\"https://spectrum.ieee.org/robot-fingers\" target=\"_blank\"> robot hands<\/a>.<\/p><p>“The practical and useful benefits, especially in the context of robot hands, remain to be tested and validated,” he says.<\/p><p>When the materials of soft sensors, like the silicone in Carpi’s team’s fingertip, become eroded or damaged after repeated use, the signals measured by the sensors may not reflect objects’ topography as well. <\/p><p>“Especially if you have the electronics embedded into the material layer itself, that becomes a very challenging engineering problem. And I haven’t seen [many] good soft electronics materials that really can undergo long periods of usage,” Wang says.<\/p><p><span>However, because the Bragg reflector isn’t in direct contact with objects itself, the outer layer of silicone material acts as a protective barrier, Sasso says. The silicone can also be made more durable using certain chemical coatings, according to Wang.<\/span><\/p><p>The team has already been talking to companies that could potentially employ the new sensor. They also hope to improve the sensor so that it can sense objects that don’t lie flat on surfaces. That could open up its use in surgical instruments that require precise contact mapping of tissues and organs, Carpi says.<\/p><p>“There are significant developments that we expect with a clear path toward transition to real world applications,” he says.<\/p>"}, {"title": "Agency Tool Company wants to make OTA software updates easier", "source": "The Robot Report", "date": "2026-07-28", "url": "https://www.therobotreport.com/agency-tool-company-wants-to-make-ota-software-updates-easier/", "summary": "<p>Two Scythe co-founders are using their experience building commercial robots to create tools for robotics developers at Agency Tool Co.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/agency-tool-company-wants-to-make-ota-software-updates-easier/\">Agency Tool Company wants to make OTA software updates easier<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Powerful Compute So Compact, It’s Clutch — Build AI Anywhere With NVIDIA Jetson", "source": "NVIDIA Robotics", "date": "2026-07-28", "url": "https://blogs.nvidia.com/blog/build-ai-with-nvidia-jetson/", "summary": "As a discerning AI investor who values style and substance, Sarah Guo knows this season’s standout accessory isn’t the latest designer purse — but what’s inside it.  In a recent video, Guo, founder of AI-native venture capital firm Conviction and co-host of the AI podcast No Priors, highlighted how the NVIDIA Jetson platform for edge [&#8230;]"}, {"title": "Registration is open for RoboBusiness 2026", "source": "Robotics Business Review", "date": "2026-07-28", "url": "https://www.therobotreport.com/registration-is-open-for-robobusiness-2026/", "summary": "<p>This year, join us in October in Santa Clara to celebrate 20 years of robotics excellence at RoboBusiness 2026.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/registration-is-open-for-robobusiness-2026/\">Registration is open for RoboBusiness 2026<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "ENvue Medical develops robotic feeding tube placement system", "source": "Robotics Business Review", "date": "2026-07-28", "url": "https://www.therobotreport.com/envue-medical-develops-robotic-feeding-tube-placement-system/", "summary": "<p>ENvue Drive is designed to assist, not replace, the clinician, who retains full control of the procedure at all times.  <\/p>\n<p>The post <a href=\"https://www.therobotreport.com/envue-medical-develops-robotic-feeding-tube-placement-system/\">ENvue Medical develops robotic feeding tube placement system<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "NORD expands compact NORDAC VFD family to 200 hp", "source": "Robotics Business Review", "date": "2026-07-27", "url": "https://www.therobotreport.com/nord-expands-nordac-compact-vfd-family-to-200-hp/", "summary": "<p>NORD Drivesystems said its NORDAC PRO VFDs are adaptable to individual application requirements across industries.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/nord-expands-nordac-compact-vfd-family-to-200-hp/\">NORD expands compact NORDAC VFD family to 200 hp<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Kraken Technology raises Series B funding for autonomous vessels", "source": "Robotics Business Review", "date": "2026-07-27", "url": "https://www.therobotreport.com/kraken-technology-raises-series-b-funding-autonomous-vessels/", "summary": "<p>Kraken Technology plans to use its funding to continue developing uncrewed surface vessels and localizing manufacturing around the world.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/kraken-technology-raises-series-b-funding-autonomous-vessels/\">Kraken Technology raises Series B funding for autonomous vessels<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Magmotor makes motors for a changing world for 150+ years", "source": "Robotics Business Review", "date": "2026-07-26", "url": "https://www.therobotreport.com/magmotor-makes-motors-changing-world-150-years/", "summary": "<p>Magmotor has been providing motors for demanding use cases for decades and offers custom systems for robotics.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/magmotor-makes-motors-changing-world-150-years/\">Magmotor makes motors for a changing world for 150+ years<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Optical Tech Would Update a Robot’s AI on the Fly", "source": "IEEE Spectrum Robotics", "date": "2026-07-26", "url": "https://spectrum.ieee.org/ai-in-robotics", "summary": "<img src=\"https://spectrum.ieee.org/media-library/an-asian-man-positions-the-lens-of-an-optical-receiver-a-meter-away-from-a-beam-of-led-light-in-a-lab.jpg?id=67530602&amp;width=1200&amp;height=800&amp;coordinates=0%2C209%2C0%2C209\" /><br /><br /><p>Atop a lab bench, <a href=\"https://tech.cornell.edu/\" rel=\"noopener noreferrer\" target=\"_blank\">Cornell Tech<\/a> postdoctoral researcher <a href=\"https://www.linkedin.com/in/yifan-he-5471a1386/\" rel=\"noopener noreferrer\" target=\"_blank\">Yifan He<\/a> positions the lens of an optical receiver almost a meter away from an LED emitting a beam of red light. The computer monitor attached to the receiver takes a beat to refresh, then displays an array of squares that resemble a QR code.<\/p><p>When you hold your phone camera up to a QR code, light strikes the image sensor as only a first step to revealing the data hidden behind the black-and-white matrix. The receiver here is doing something different: directly altering its own memory using the photocurrents produced by the beamed array of light. And unlike the data behind a QR code, which might point to a simple web address, this optical code could convey the <a href=\"https://spectrum.ieee.org/sparse-ai\" target=\"_blank\">parameters of an AI model<\/a>. <\/p><p>The new receiver design, presented last month at the <a href=\"https://www.vlsisymposium.org/\" rel=\"noopener noreferrer\" target=\"_blank\">IEEE/JSAP Symposium on VLSI Technology & Circuits<\/a> in Honolulu, seeks to reduce the burden of increasing memory demands on AI systems. Shining data down onto processors could lower the energy typically required for data centers, self-driving cars, and even “edge” applications like AI-powered robots, researchers say. <\/p><p>“People are designing all sorts of different AI chips,” says <a href=\"https://www.linkedin.com/in/jae-sun-seo-21062717/\" rel=\"noopener noreferrer\" target=\"_blank\">Jae-sun Seo<\/a>, an associate professor of electrical and computer engineering at Cornell Tech, in New York City. These processors don’t often have room for all the parameters that make up AI models, so the additional data is stored in dynamic RAM (<a href=\"https://spectrum.ieee.org/stacking-chips-sideways\" target=\"_blank\">DRAM<\/a>). The electrical connections commonly used to move the data between the DRAM and the processor create cost and efficiency concerns when systems scale up. “That’s one of the major bottlenecks.” <\/p><p>Optical links move data at high bandwidth with less energy loss than metal wires, but today’s optical receivers undercut that advantage by relying on power-hungry analog circuits to convert light to electronic bits. The group’s new tech would instead receive rapid flashes of digital QR-code-like matrices so that chips can tweak model parameters without those analog circuits, enabling fully digital optical communication that would consume less energy.<\/p><p>“This is a really important problem,” says <a href=\"https://www.linkedin.com/in/dennis-sylvester-68a938/\" rel=\"noopener noreferrer\" target=\"_blank\">Dennis Sylvester<\/a>, an IEEE Fellow who chairs the <a href=\"https://umich.edu/\" rel=\"noopener noreferrer\" target=\"_blank\">University of Michigan<\/a>’s electrical and computer engineering department and was not involved in the work. “It’s got massive commercial implications. This solution is a clever way of dealing with it.”<\/p><p class=\"shortcode-media shortcode-media-rebelmouse-image\"> <img alt=\"Two Asian men standing in front of a lab desk with a receiver chip, oscilloscope and laptop displaying an optically programmable SRAM-based receiver demo.\" class=\"rm-shortcode\" id=\"b2c1d\" src=\"https://spectrum.ieee.org/media-library/two-asian-men-standing-in-front-of-a-lab-desk-with-a-receiver-chip-oscilloscope-and-laptop-displaying-an-optically-programmable.jpg?id=67530613&amp;width=980\" /> <small class=\"image-media media-caption\">Jae-sun Seo [left] and Yifan He have developed a receiver that can edit memory in response to QR-code-like arrays of light.<\/small><small class=\"image-media media-photo-credit\">Alex Music<\/small><\/p><h2>How Light “Flips” Memory to Power AI<\/h2><p>Processors have a bit of built-in static RAM (<a href=\"https://spectrum.ieee.org/sram-intel-tsmc\" target=\"_blank\">SRAM<\/a>), but not enough to allow an AI model to run independently. While SRAM is the faster of the two memory options, DRAM can store more data in the same footprint.<\/p><p>In the new system, the DRAM sits with the transmitter, and the receiver is part of the processor’s SRAM. The transmitter beams the data to the array of SRAM cells, which in this case are modified to contain photodiodes. Light hitting each photodiode creates a current to flip binary values in the SRAM. <\/p><p>Creating a link between the light and receiver requires calibration, because you can’t expect them to be perfectly aligned or perpendicular to each other. So the chip references a data frame that has information about the expected position of each pixel of data and uses that frame to ensure it can receive the real data, He says. “Ideally the best way is to have direct, point-to-point space between the transmitter and the receiver,” Seo adds, “but even if it’s slightly tilted, we have this calibration circuit.”<\/p><p>For applications in real-world settings, the researchers say they will need to build an optical transmitter that can alter the light matrix millions of times per second, transferring gigabits per second. The transmitter that I saw in He and Seo’s lab is only a proof of concept, emitting a static 14-by-14-bit matrix through a metal mask over the light. The researchers say they are working with optics research groups to build a transmitter that is capable of rapidly changing the matrix. <\/p><h2>The Future of Light-Based Memory Links<\/h2><p>Michigan’s Sylvester says that the tech in its current form is likely far from commercialization because the individual photosensitive bit cells are larger than SRAM bit cells in conventional chips. Those larger cells mean the chip can fit less memory, a trade-off that he says could cancel out the added efficiency of the light-based approach. <\/p><p>Seo says that it’s part of the group’s ongoing efforts to shrink the bit cells, which can be achieved by optimizing the size of transistors and circuits and leveraging CMOS scaling.<\/p><p>Seo and He are looking at uses for the tech in robotics and other edge applications. One example is in AI-robot-powered warehouses and factories, which could use optical data transmission to save time and energy when updating the AI models in each robot. Additionally, <a href=\"https://spectrum.ieee.org/microbots\" target=\"_self\">microrobots<\/a>, which are inherently memory-constrained due to their size, could one day benefit from the tech, though it would require a more size-conscious design.<\/p><p>“Edge AI is a big growth area, and in three, four, five years, you’re going to hear as much about that as you are with data centers, probably, as the intelligence migrates more and more into these devices that we have,” Sylvester says.<\/p>"}, {"title": "Photos: First look at J&J’s Ottava surgical robot", "source": "Robotics Business Review", "date": "2026-07-25", "url": "https://www.therobotreport.com/photos-first-look-at-jjs-ottava-surgical-robot/", "summary": "<p>The robot-in-table design is meant to save space in the operating room, with J&#038;J saying its novel architecture takes up 30-50% less space than boom-and-cart systems.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/photos-first-look-at-jjs-ottava-surgical-robot/\">Photos: First look at J&#038;J&#8217;s Ottava surgical robot<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "NEURA Robotics establishes NEURA Gym RWTH Aachen to train physical AI", "source": "Robotics Business Review", "date": "2026-07-24", "url": "https://www.therobotreport.com/neura-robotics-establishes-neura-gym-rwth-aachen-train-physical-ai/", "summary": "<p>NEURA Robotics has partnered with a German university for NEURA Gym RWTH Aachen, one of 10 facilities for training physical AI.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/neura-robotics-establishes-neura-gym-rwth-aachen-train-physical-ai/\">NEURA Robotics establishes NEURA Gym RWTH Aachen to train physical AI<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Video Friday: An Italian Humanoid Comes to Life", "source": "IEEE Spectrum Robotics", "date": "2026-07-24", "url": "https://spectrum.ieee.org/video-friday-physical-ai-robotics", "summary": "<img src=\"https://spectrum.ieee.org/media-library/humanoid-robot-with-red-armor-and-glowing-lights-stands-against-a-dark-background.png?id=67531350&amp;width=1200&amp;height=800&amp;coordinates=150%2C0%2C150%2C0\" /><br /><br /><p><span>Video Friday is your weekly selection of awesome robotics videos, collected by your friends at <\/span><em>IEEE Spectrum<\/em><span> robotics. We also post a weekly calendar of upcoming robotics events for the next few months. Please <\/span><a href=\"mailto:automaton@ieee.org?subject=Robotics%20event%20suggestion%20for%20Video%20Friday\">send us your events<\/a><span> for inclusion.<\/span><\/p><h5><a href=\"https://mrs.fel.cvut.cz/summer-school-2026/\">Summer School on Multi-Robot Systems<\/a>: 29 July–4 August 2026, PRAGUE<\/h5><h5><a href=\"https://actuate.foxglove.dev/\">Actuate 2026<\/a>: 18–19 August 2026, SAN FRANCISCO<\/h5><h5><a href=\"https://2026.ieee-iros.org/\">IROS 2026<\/a>: 27 September–1 October 2026, PITTSBURGH<\/h5><h5><a href=\"https://humanoidssummit.com/\">Humanoids Summit Seoul<\/a>: 22–23 September 2026, SEOUL<\/h5><p>Enjoy today’s videos!<\/p><div class=\"horizontal-rule\"><\/div><div><span style=\"display: none;\"> <\/span><\/div><blockquote class=\"rm-anchors\" id=\"mgf142yepjc\"><em>In just six months, our team turned GENE.01 into a fully functional humanoid platform that can walk, sense and interact. Its full-body multimodal skin perceives touch, proximity, force, and temperature, bringing Physical AI closer to safe and natural collaboration with people. Not a render. Not a concept. This is GENE.01. The future of Physical AI is taking its first steps.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://gbionics.ai/\">Generative Bionics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"iq3pccrfegq\"><em>Why create robot intelligence for just one hand, when we could have it learn from many? GEN-1, our latest embodied foundation model, now supports a broad range of end effectors from 5-finger hands, to specialized tools, and everything in between. Each hand is a different sensorimotor interface by which GEN-1 experiences the physical world. Scaling pretraining across thousands of these interfaces teaches GEN-1 a universal physical common sense that transfers to new hands and new ways to grasp, push, pull, twist, and more.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>And to illustrate this concept, a surprise spatula.<\/p><p class=\"shortcode-media shortcode-media-youtube\"> <span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://generalistai.com/blog/towards-machines-with-a-thousand-hands\">Generalist<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"gu2nuedjiuq\"><em>This paper presents the design, fabrication, and flight validation of a flat-packable <a href=\"https://spectrum.ieee.org/foldable-airplane-could-ride-a-cubesat-to-mars-in-2022\" target=\"_blank\">flying wing<\/a> built primarily from corrugated cardboard. The aircraft is manufactured from three laser-cut sheets and assembled through a fold-and-lock architecture that forms load-bearing wing structures with minimal tooling and no permanent fasteners. The full airframe can be assembled in under 15 minutes, demonstrating strong potential for rapid deployment, low-cost logistics, and scalable field use.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://airlab.sutd.edu.sg/\">AIR Lab<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"hukrzo75_ww\">A $14,000 open-source data-collection system that includes beat-down capability.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://github.com/haraduka/mevion\">MEVION<\/a> ]<\/p><p>Thanks, Kento!<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"qzr0rmp2_5w\"><em>Together with Niantic Spatial and Nvidia, [we] can now scan a real deployment site with off-the-shelf hardware, reconstruct it into a photorealistic Gaussian splat, and run massively parallel RL [<a href=\"https://spectrum.ieee.org/ai-institute\" target=\"_blank\">reinforcement learning<\/a>] training. The policies trained in our Gym environment then transfer zero-shot to the real robot and environments they were trained for. This enables faster deployment of more capable and robust policies for the end user.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://flexion.ai/news/niantic-spatial-flexion-and-nvidia-closing-the-sim2real-gap-for-humanoids\">Flexion<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"w2bmy5cnhvs\">I don’t know why, but the version of Tron 2 with the stubby little legs is just adorable.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.limxdynamics.com/en/products/tron2\">LimX Dynamics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"vmgiim6g_fg\">Uh, get a real job already...?<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.pndbotics.com/\">PNDbotics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"xtggy9lrisw\">Well, I guess we can all stop asking what humanoid robots are good for.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://en.engineai.com.cn/\">EngineAI<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"143b_pm77ga\">I think the right thing to do here is only post the disclaimer included with this video: “This film is a conceptual creative production, and certain scenes are presented for demonstration purposes only and do not represent the actual in-store operating process. The final store environment, robot appearance, and functionality are subject to the actual deployment. During actual operations, the robot will autonomously perform only designated preparation steps for specified ice cream products, and its hands will be fitted with protective gloves that comply with applicable food safety requirements.”<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.sharpa.com/pages/north-at-work\">Sharpa<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"h_ztrvhjv8k\"><em><a href=\"https://spectrum.ieee.org/in-the-air-with-ziplines-medical-delivery-drones\" target=\"_blank\">Drone delivery<\/a> is now an essential part of the South West London Pathology (SWLP) modernization agenda. Since February 2026, our highly automated aircraft have been delivering urgent NHS samples across south west London, with service up to 85% faster than ground transport. We are thrilled to be part of this initiative, supporting clinicians in providing timely, effective care for patients and contributing to a greener, more resilient NHS.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://wing.com/news/elevating-healthcare-logistics-wing-apian-nhs-south-west-london-drone-deliveries\">Wing<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"tzpswti20e8\"><em>Take a closer look at what’s next for the Aurora Driver. Designed to move freight farther, faster, and more efficiently, this next generation of the Aurora Driver delivers greater performance, built to last one million miles and cut hardware cost in half. <\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://aurora.tech/newsroom/your-questions-about-our-latest-driverless-launch-answered\">Aurora<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"gj4p0pc6kwc\"><em>How does a robot learn to recognize an object it’s never encountered? In this case, a demo can be worth a thousand words. Short human demonstrations can be used to create fully automated training datasets, sidestepping the prompting limitations that hold back vision-language models. Rather than describing objects with language, the system tracks what a person touches and manipulates during a demo, follows those objects through time, and clusters detections to handle objects merging or splitting apart in the scene. This bypasses a core weakness of VLMs, which struggle to reliably detect unusual or novel objects even with repeated, carefully engineered prompts.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://rai-inst.com/resources/blog/show-dont-tell-detecting-novel-objects-by-watching-human-demonstrations/\">Robotics and AI Institute<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div>"}, {"title": "How time series databases unlock real-time data for robotics", "source": "Robotics Business Review", "date": "2026-07-24", "url": "https://www.therobotreport.com/how-time-series-databases-unlock-real-time-data-for-robotics/", "summary": "<p>Discover how time series databases help robotics teams manage high-volume sensor data, power AI insights, and keep systems running at scale.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/how-time-series-databases-unlock-real-time-data-for-robotics/\">How time series databases unlock real-time data for robotics<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Generalist’s GEN-1 foundation model now supports a range of robot end effectors", "source": "Robotics Business Review", "date": "2026-07-24", "url": "https://www.therobotreport.com/generalists-gen-1-foundation-model-now-supports-a-range-of-robot-end-effectors/", "summary": "<p>By training GEN-1 to work with new hands, Generalist said a single base model can learn sensorimotor policies on different robots.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/generalists-gen-1-foundation-model-now-supports-a-range-of-robot-end-effectors/\">Generalist&#8217;s GEN-1 foundation model now supports a range of robot end effectors<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "AMD unveils Kria module for real-time control, unified memory for robots", "source": "Robotics Business Review", "date": "2026-07-23", "url": "https://www.therobotreport.com/amd-unveils-kria-module-real-time-control-unified-memory-robots/", "summary": "<p>AMD has launched the Ryzen AI Embedded X100 and Kria AI SoM, bringing unified memory and real-time control to challenge NVIDIA in robotics.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/amd-unveils-kria-module-real-time-control-unified-memory-robots/\">AMD unveils Kria module for real-time control, unified memory for robots<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Ropedia raises $22M to scale data collection for training robots", "source": "Robotics Business Review", "date": "2026-07-23", "url": "https://www.therobotreport.com/ropedia-raises-22m-scale-data-collection-training-robots/", "summary": "<p>Ropdeia's HOMIE is a head-mounted device, equipped with a 360º camera view, that captures first-person data for training robots.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/ropedia-raises-22m-scale-data-collection-training-robots/\">Ropedia raises $22M to scale data collection for training robots<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Uber co-founder raises $1.7B for new robotics startup ATOMS", "source": "Robotics Business Review", "date": "2026-07-23", "url": "https://www.therobotreport.com/uber-co-founder-raises-1-7b-for-new-robotics-startup-atoms/", "summary": "<p>Travis Kalanick, the former CEO of Uber, said with ATOMS, he hopes to create physical automation to transform industry.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/uber-co-founder-raises-1-7b-for-new-robotics-startup-atoms/\">Uber co-founder raises $1.7B for new robotics startup ATOMS<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Holiday Robotics raises $105M for its FRIDAY wheeled humanoid", "source": "Robotics Business Review", "date": "2026-07-23", "url": "https://www.therobotreport.com/holiday-robotics-raises-105m-wheeled-humanoid-friday/", "summary": "<p>Holiday's robot features a wheel-based mobile base, an upper body for dexterous manipulation, and hot-swappable batteries.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/holiday-robotics-raises-105m-wheeled-humanoid-friday/\">Holiday Robotics raises $105M for its FRIDAY wheeled humanoid<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "NVIDIA Open Sources First GPU-Accelerated Medical Physics Simulation Framework", "source": "NVIDIA Robotics", "date": "2026-07-22", "url": "https://blogs.nvidia.com/blog/medical-physics-simulation-open-source/", "summary": "Before a healthcare robot can be useful in the real world, it has to learn how the physical world pushes back. Anatomy varies. Instruments bend, press, slip and interact with tissue. Imaging can be noisy or incomplete. And the rare, edge scenarios developers most need to understand don’t appear on schedule. That creates one of [&#8230;]"}, {"title": "Medtronic to launch AI compute platform for the operating room", "source": "The Robot Report", "date": "2026-07-22", "url": "https://www.therobotreport.com/medtronic-launch-ai-compute-platform-operating-room/", "summary": "<p>Touch Surgery bridges pre-operative planning and training, intra-operative tele-mentoring and tele-proctoring, and post-operative insights.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/medtronic-launch-ai-compute-platform-operating-room/\">Medtronic to launch AI compute platform for the operating room<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Report shares the state of physical AI and robotics", "source": "Robotics Business Review", "date": "2026-07-22", "url": "https://www.therobotreport.com/physical-ai-and-robotics/", "summary": "<p>A report looks at how physical AI is increasingly enabling autonomous systems to perceive their environments, make decisions, and act in the real world.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/physical-ai-and-robotics/\">Report shares the state of physical AI and robotics<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "MISUMI Americas releases reshoring report, supports manufacturing training bill", "source": "Robotics Business Review", "date": "2026-07-21", "url": "https://www.therobotreport.com/misumi-americas-releases-reshoring-report-supports-manufacturing-training-bill/", "summary": "<p>MISUMI Ameri
