y as generation conditions, with no human annotation. An action prior and two affect priors, trained in a shared latent space, are composed at each denoising step: the action prior fixes what is performed, the affect priors modulate how. Whole-body motion rolls out autoregressively on a 29-DoF Unitree G1 in real time, with action and affect both editable. Generated motion tracks the commanded V-A over its full range while text-to-motion fidelity still matches text-only baselines. In a perceptual study, raters identify the commanded emotion on 0.38 of trials, above both baselines and approaching the 0.44 reported for acted human bodies.", "pdf_url": "https://arxiv.org/pdf/2608.28213v1"}, {"title": "Explainable Diabetic Retinopathy Classification Using Vision Foundation Models", "authors": ["Abhishek Verma", "Anila Krishna", "Abhishek Gajanan Bankar", "Juan Miguel Lopez Alcaraz"], "published": "2026-08-28", "summary": "Diabetic retinopathy (DR) is a major cause of preventable blindness, creating a need for accurate and trustworthy automated screening. This study investigates an explainable DR classification framework using vision foundation models and multiple transfer learning strategies. Three backbones, DINOv2, CLIP, and Vision Transformer (ViT), were evaluated using full fine-tuning, linear probing, and Low-Rank Adaptation (LoRA). Models were trained and internally evaluated on the ODIR dataset and externally evaluated on APTOS to assess generalization. DINOv2-LoRA achieved the highest internal AUROC of 0.758, while DINOv2 full fine-tuning and ViT full fine-tuning achieved the highest external AUROC of 0.920. Calibration was further assessed using reliability analysis after isotonic regression. For explainability, Grad-CAM and HiResCAM were evaluated against expert-annotated lesion masks from the IDRiD dataset using Dice, Intersection over Union (IoU), and Pointing Game metrics. The results demonstrate that foundation models, particularly DINOv2, can provide strong predictive performance, while LoRA offers a parameter-efficient alternative to full fine-tuning. Quantitative evaluation of explanation maps further supports the assessment of whether model attention corresponds to clinically relevant retinal lesions.", "pdf_url": "https://arxiv.org/pdf/2608.28207v1"}, {"title": "Cut-ViT: Task-Specific Model Pruning via Gram Anchoring Subspace Consistency", "authors": ["Jianjian Yin", "Liulei Li", "Tao Chen", "Yi Chen", "Yazhou Yao", "Wenguan Wang"], "published": "2026-08-28", "summary": "Pruning visual foundation models has attracted considerable attention. However, existing methods focus on rigid point-to-point token alignment on a single dataset for pruning, suffering from two limitations: i) robustness degradation, and ii) task-specificity deficiency. To address these limitations, we propose a task-specific pruning pipeline, named Cut-ViT. Specifically, we first construct gram anchoring matrices from both spatial and semantic perspectives, and perform the subspace decomposition to extract the corresponding subspace bases. Basis-agnostic and residual constraints are then adopted to align the gram subspaces between the native and pruned DINOv3 models along spatial and channel dimensions, enabling subnetworks to inherit robust feature representations of native DINOv3. Furthermore, we design spectral entropy adaptation, which quantifies the information density of feature manifolds along spatial and channel dimensions, thereby adapting the pruning objective to specific downstream tasks. Experiments show that Cut-ViT requires approximately one minute on a single A100 GPU to obtain subnetworks at various sparsity levels, using only 20.9% of the time and 45.5% of the GPU memory compared with previous methods, while achieving SOTA performance on six tasks across nine datasets.", "pdf_url": "https://arxiv.org/pdf/2608.28205v1"}, {"title": "EXPOSE: Explainable and Domain-Robust Embeddings from Pathology Vision Foundation Models using Sparse Autoencoders", "authors": ["Anja Witte", "Maximilian Lennartz", "Jan Baumbach", "Guido Sauter", "Stefan Bonn", "Patrick Fuhlert", "Marina Zimmermann"], "published": "2026-08-28", "summary": "Vision Foundation Models (VFMs) are widely used in computational pathology but remain sensitive to domain shifts arising from variations in staining, tissue preparation, and scanner hardware. A key limitation is that VFM embeddings entangle biological with domain-specific information, hindering cross-domain generalization. We propose Explainable Probing of Cross-Domain Sparse Embeddings (EXPOSE), a framework that uses Sparse Autoencoders (SAEs) as an explainable bottleneck to identify and suppress domain-specific components in VFM embeddings. We train a sparse representation of VFM features, use a linear classifier to identify domain-specific latent dimensions, and mask these features prior to downstream relapse prediction without retraining the backbone model. Experiments on a large prostate cancer dataset with multiple acquisition domains show that SAE features capture both domain- and task-specific information, which are partially disentangled in the latent space. Removing domain-specific features improves cross-domain performance and increases embedding robustness as measured by the Domain Robustness Index (DoRI). Code is available at https://github.com/imsb-uke/expose .", "pdf_url": "https://arxiv.org/pdf/2608.28191v1"}, {"title": "Picking Bins Empty: A Hierarchical Hybrid Approach with Online Self-Learning of Grasp Points for Reliable Industrial Bin-Picking", "authors": ["Florian Töper", "Samarth Kishor Yelvande", "Jan Niklas Ewertz", "Rudolph Triebel", "Peter Ohlhausen"], "published": "2026-08-28", "summary": "Bin-picking is a cornerstone of modern manufacturing, yet achieving complete bin clearance without manual intervention remains a critical challenge. While model-based methods provide high precision, they frequently suffer from deadlocks when predefined grasps are occluded or perception fails. Labor-intensive fine-tuning of grasp points is commonly required to reach a satisfactory performance for new parts. Model-free algorithms offer a more flexible alternative with \"out-of-the-box\" versatility but lack the reliability and repeatability required for production. Unlike existing work, which treats the two techniques in isolation, we propose a fourtiered hierarchical hybrid approach to combine the best of both worlds. A model-based pipeline serves as a robust backbone, while a model-free \"exploration agent\" resolves deadlock situations and discovers new grasp points. This is supported by an online self-learning mechanism that uses gripper-stroke feedback and Wilson score intervals to autonomously rank grasp candidates, reducing manual commissioning effort. Validation on three automotive parts demonstrates that our method significantly outperforms a model-free baseline in grasp success rate while improving the bin clearance rate of the model-based baseline from 50.9% to 100% across all experiments. This transition to full bin clearance marks a significant step towards truly autonomous, intervention-free industrial operation.", "pdf_url": "https://arxiv.org/pdf/2608.28175v1"}, {"title": "From Small Talk to Rapport: Exploring Robot Self-Disclosure in Collaborative Tasks", "authors": ["Kaitlynn Taylor Pineda", "Anvii Mishra", "Brian Chien", "Angela Guo", "Toluwani Williams", "Ziang Xiao", "Chien-Ming Huang"], "published": "2026-08-28", "summary": "People naturally chat while collaborating and share personal information (i.e., self-disclose) to build rapport and maintain social connections. As robots are increasingly developed to work with people, the effective use of these social behaviors to enhance engagement and support teamwork becomes ever more important. While prior work has shown that robot-initiated small talk can benefit human-robot collaboration, less is known about how best to design such small talk. In this work, we explore how self-disclosure may be designed to support small talk within a human-robot team---especially when the robot is an industrial manipulator that lacks anthropomorphic cues and performs physical work. We first developed an LLM-driven manipulator capable of partaking in small talk, adopting either a low-disclosure or high-disclosure strategy. We then conducted a user study (N = 50) to investigate how self-disclosure in small talk influences human-robot dynamics. Unexpectedly, participants disclosed more in the low-disclosure condition and reported stronger teaming and coordination than those in the high-disclosure condition. This effect was more pronounced among users with prior experience teaming with robots. These results suggest that increasing robot self-disclosure does not necessarily foster rapport, social connection, or reciprocal disclosure; other factors, such as prior HRI experience, should be considered.", "pdf_url": "https://arxiv.org/pdf/2608.28154v1"}, {"title": "Contact-Guided Exploration for Non-Prehensile Locomanipulation with Multi-Critic RL", "authors": ["Simone Tolomei", "Mayank Mittal", "Franco Angelini", "Manolo Garabini", "Paolo Salaris", "Marco Hutter"], "published": "2026-08-28", "summary": "Non-prehensile manipulation offers versatile skills for moving and rearranging heavy or bulky objects, particularly when combined with a mobile manipulation platform. However, both model-based and model-free approaches struggle with the complex hybrid dynamics and the sparsity of the contact in these tasks. To address these challenges, we propose a contact-guided exploration strategy implemented within a Multi-Critic Reinforcement Learning (RL) framework. A dedicated exploration critic is trained with a dense contact-seeking reward that guides the end-effector toward meaningful contact points; its influence is progressively decayed to recover a task-optimal policy. We obtain candidate interaction points from a general-purpose grasping algorithm, enabling the exploration mechanism to generalise across various object geometries. We evaluate the approach on multiple tasks, including box pushing, chair transportation, and a dishwasher opening task. Finally, we validate the chair transportation policy through extensive experiments on a quadrupedal mobile manipulator, demonstrating deployable non-prehensile manipulation in the real world.", "pdf_url": "https://arxiv.org/pdf/2608.28140v1"}, {"title": "DeicticVLA: Unifying Instruction Modes Based on Language and Deictic Gestures in a Single VLA", "authors": ["Kango Yanagida", "Tatsuya Aoki", "Yuichiro Yoshikawa", "Takato Horii"], "published": "2026-08-28", "summary": "Vision-Language-Action models (VLAs) allow users to specify manipulation tasks in natural language, but distinguishing a target or placement goal among objects of the same category or similar appearance requires detailed expressions that VLAs may not use reliably. We propose DeicticVLA, which canonicalizes Language Instruction (LI), Vision-Language Instruction (VLI), and Visual Instruction (VI) into a text prompt and deictic masks through text-prompt completion and deictic gesture grounding, enabling a single pretrained VLA to handle all three instruction modes. With a shared backbone, demonstrations, and matched training steps, we compare two RGB visual prompting methods, two separate-channel mask prompting methods, and three training strategies in simulation. Under two-stage training, the four prompting methods achieve high in-distribution success but differ in their ability to use deictic masks in unseen layouts. Across methods, training-strategy ablations show that two-stage training improves such use, while retaining second-stage LI data mitigates forgetting without reducing VLI and VI performance. In three real-world tasks, one policy supports all modes. VLI and VI outperform LI under unseen expressions, appearance changes, and novel objects. For unseen categories, both achieve 100% success, compared with 16.7% for jointly trained LI. These results demonstrate the unified three-mode interface and guide DeicticVLA design.", "pdf_url": "https://arxiv.org/pdf/2608.28108v1"}, {"title": "uMOF: A Universal Database, Benchmark, and Machine Learning Interatomic Potentials for Metal-Organic Frameworks", "authors": ["Théo Jaffrelot Inizan", "Prathami Divakar Kamath", "Alin Marin Elena", "Kristin A. Persson"], "published": "2026-08-28", "summary": "Foundation machine learning interatomic potentials (MLIPs) deliver near-ab-initio accuracy at a fraction of the computational cost, yet their promise for Metal-organic Frameworks (MOFs) remains largely unrealized as large unit cells make first-principles training data expensive to generate, fine-tuned models are scarce, and experimentally grounded benchmarks are scarcer still. We introduce uMOF, a three-part contribution addressing this gap. First, we release the largest and most accurate density functional theory dataset for MOFs to date, computed at the r$^2$SCAN-D4 level of theory across 85524 configurations spanning 19950 unique frameworks and 79 elements, covering empty and gas-loaded structures, geometry optimizations, equations of state, and finite-temperature molecular dynamics. Second, we release a literature-mined benchmark of 3986 verified property values (3146 experimental) extracted from 626 papers by a seven-stage, checkpointed multi-pass large language model pipeline, linked to more than 650 crystallographic information files. Third, we release two universal MLIPs for MOFs, uMOF-MH and uMOF-POLAR, fine-tuned from two architecturally distinct MACE foundation models on the uMOF dataset. On near-equilibrium, ``Tier-1'' properties (bulk modulus, phonon-derived heat capacity) the uMOF models perform comparably to existing foundation and fine-tuned baselines. On harder, dynamics-sensitive properties like gas adsorption enthalpies via Widom insertion and adsorption isotherms, the uMOF models outperform every baseline we test, including MOF-specialized gas-capture models trained on datasets up to three orders of magnitude larger, cutting error by more than 80% to within experimental uncertainty. We trace this advantage to the physical diversity of the training data and to level of theory where a small (1.7%) fraction of MD simulations is decisive for MLIP stability.", "pdf_url": "https://arxiv.org/pdf/2608.28100v1"}, {"title": "Do Medical Vision Models Reason About Anatomy? Probing the Spatial Inductive Biases of Learned Visual Representations", "authors": ["Naren Akash", "Neeraja Ramanan"], "published": "2026-08-28", "summary": "Interpreting a CT scan means comparing structures on either side, judging how far apart organs sit, and knowing where each one belongs. Medical vision encoders are evaluated on diagnostic accuracy, or through assembled multimodal systems where a failure is hard to attribute, so it remains unclear whether their representations support any of this. We construct SPAR-Bench, eight probes over multi-organ abdominal CT that separate coordinate localization, relational reasoning, and spatial queries, and apply them to five architectural configurations and three medical foundation models, frozen and finetuned. Probes that ask for a comparison within the slice stay at chance, and neither pretraining scale, finetuning, nor architecture closes the gap. Probes that appear solved in domain fall to chance under zero-shot transfer, indicating that their accuracy reflects recall of canonical anatomy rather than computation over the image. Reading the same frozen features with a pooled head rather than the full set of tokens moves relational recovery from 0.7% to 67.8%, so pooled probing understates what a representation holds. Questions the encoders answer well are answered at chance by four open-weight MLLMs. Our results suggest these encoders carry a map of where organs usually lie, and little of the machinery for comparing structures within a particular patient. Code and data will be available at https://spar-bench.github.io.", "pdf_url": "https://arxiv.org/pdf/2608.28092v1"}, {"title": "Stay Seated: Learning Omnidirectional Humanoid Locomotion on a Passive Mobile Chair with Casters", "authors": ["Kango Yanagida", "Kazuki Miyazawa", "Takato Horii"], "published": "2026-08-28", "summary": "Humanoid robots with quasi-direct-drive actuators continuously generate joint torque while standing, whereas seated humans delegate weight support to chairs during desk work. As a first step toward seated loco-manipulation, we study omnidirectional seated locomotion on a passive mobile chair, requiring unfixed pelvis-seat contact and intermittent foot-floor propulsion of the robot-chair system. We extend a standard standing velocity-tracking environment with a passive-chair model, seated-state rewards, critic-only chair observations, and task-tailored contact settings. The policy is learned without motion-imitation rewards; its actor uses only proprioception and velocity commands, without contact sensing or chair states. In random-command evaluation, the policies tracked omnidirectional commands through nearly all 20-s rollouts, and the best seated policies could outperform the Standing policy in velocity tracking. Across four training seeds, a $2^3$ full-factorial comparison of symmetry regularization (SY), foot-slip regularization (FS), and command curriculum (CC) showed that FS reduced CoT but increased tracking error and that some FS-only policies converged to stationary local optima. Combining FS with either SY or CC avoided this failure without retuning FS, while SY improved bilateral leg symmetry during longitudinal motion. Direction-resolved analysis showed CoT ordered backward $<$ lateral $\\ll$ forward, with planted-leg extension in backward and lateral motion and knee flexion following heel contact in forward motion. The learned policy achieved zero-shot sim-to-real transfer to a Unitree G1 and generated omnidirectional seated locomotion.", "pdf_url": "https://arxiv.org/pdf/2608.28090v1"}, {"title": "Plan Along the Way: Event-Triggered Foundation-Model Planning for TAMP Execution in Partially Observable Manipulation", "authors": ["Puru Ojha", "Narendhiran Vijayakumar", "Nav Singhal", "Girish Varma", "Antony Thomas"], "published": "2026-08-28", "summary": "Manipulation in partially observable environments requires planning under incomplete scene information. In such settings, an initially valid plan may execute successfully yet remain insufficient for task completion. Existing foundation-model-guided task and motion planning (TAMP) systems can generate useful long-horizon task decompositions, subgoals, or constraints, but they often assume having access to a fully specified scene state or invoke model-level replanning after a subgoal, refinement, or execution attempt fails. We present ROBUST TAMP, a modular LLM/VLM-guided planning framework for reactive TAMP where unseen task-relevant and non-target objects may become visible during execution. The framework restricts the foundation-model planner to the currently visible relational scene state, validates generated task-level actions against a strict executable interface, and routes the accepted actions to scene-specific execution adapters. Object discovery is treated as a distinct replanning event and, after a stable execution horizon, the system reconstructs the visible scene state and replans using completed-action history and structured replanning event context. Evaluations are performed on six RLBench/CoppeliaSim kitchen and grill variants involving hidden objects, non-target object discovery, articulated-container interaction, and temporal manipulation procedures. We compare text-only LLM and VLM planners of different sizes under the same validation, execution, monitoring, and replanning pipeline, reporting task success, partial goal completion, discovery- and failure-triggered replanning behavior, implicit non-target-object handling, and planner inference cost.", "pdf_url": "https://arxiv.org/pdf/2608.28075v1"}, {"title": "Learning to Allocate Incentives for Incentivized Advertising via Offline Model-Based Reinforcement Learning", "authors": ["Zilin Zhao", "Han Yang", "Tianpei Yang", "Fangsheng Huang", "Yanfei Cui", "Kan Peng", "Yi Li", "Yiming Zong", "Hao Zhang", "Yinsong Xue"], "published": "2026-08-28", "summary": "Complete your ad view and grab a 5-cent bonus! In incentivized advertising, a platform promises users a bonus before observing downstream ad revenue, encouraging them to click and complete ads. It must balance the incentive promised in advance against the revenue realized afterward: insufficient incentives forfeit monetization opportunities, whereas excessive incentives reduce net profit. Because current incentives may also shape user expectations and future engagement, incentive allocation is a sequential decision problem with delayed revenue, cost sensitivity, and carryover effects. Existing work has not studied decision-making algorithms for this setting. Auto-bidding assumes available ad opportunities, while targeted promotion optimizes incentives outside the ad monetization pipeline. We formulate the problem as an MDP and develop an offline model-based RL framework for cost-controllable sequential incentive allocation. It learns a world model of user feedback and ad revenue, then performs conservative policy optimization. An independent counterfactual scorer evaluates each learned policy on held-out logs, enabling pre-launch selection without costly online exposure. Experiments on large-scale industrial data and online A/B tests show that the scorer provides a stable offline signal. The deployment path from causal inference to offline RL and then Offline-MBRL further validates the framework: MB-IQL improves per-user net profit by 7.96\\% over TD3+BC, whereas reverting to plain IQL reduces it by 6.56\\% (both \\(p<0.0001\\)).", "pdf_url": "https://arxiv.org/pdf/2608.28065v1"}, {"title": "Should I Use This Synthetic Dataset for Training? How to Test with Minimal Real Data", "authors": ["Zhenyu Tao", "Wei Xu", "Xiaohu You", "Petar Popovski", "Osvaldo Simeone"], "published": "2026-08-28", "summary": "Digital twins (DTs) and learned world models are increasingly used to generate synthetic data that augment the scarce real datasets available for training artificial intelligence (AI) models in engineering systems. Owing to the inevitable simulation-to-reality (sim-to-real) gap, however, augmentation may fail to improve the performance of the trained model on the real data distribution. This paper addresses the resulting decision problem: Given a real dataset, a candidate synthetic dataset, and a fixed learning algorithm, decide whether training on the augmented dataset improves the true, population-level performance, while consuming as few real test data points as possible. Two formulations are considered: a direct test on the mean loss difference between the two trained models, and a symmetry-based test on the paired loss difference, which trades a stronger null assumption for faster evidence accumulation. For the latter, we introduce the {adaptive e-process sign-flip test} (aeSFT), a doubly adaptive procedure that adapts both the number of Monte Carlo sign-flip rounds, and hence the computational cost, and the amount of real test data consumed. aeSFT yields anytime-valid Type-I error control, with no need to pre-specify the test-set size. Experiments on a synthetic-data classification task, a DT-aided wireless packet-scheduling task, and a radio-map prediction task show that aeSFT identifies useful synthetic data using substantially fewer real test samples than mean-based sequential testing, matches the power of fixed-sample sign-flip testing and the paired $t$-test, while keeping the false-positive rate below the target level.", "pdf_url": "https://arxiv.org/pdf/2608.27996v1"}, {"title": "GAAT: Geometry-Aware Alignment Transformer for Multimodal UAV Perception", "authors": ["Jingpu Yang", "Debin Tang", "Yilin Sun", "Fengxian Ji", "Jiahua Zhu", "Wenrui Ding", "Yufeng Wang"], "published": "2026-08-28", "summary": "Unmanned aerial vehicle (UAV) multimodal perception integrates visible (RGB), infrared (IR), synthetic aperture radar (SAR), and depth sensors for scene understanding under diverse conditions. However, differences in optics, resolution, and mounting often limit practical systems to global or image-center alignment. After tokenization, parallax, platform motion, and lens distortion can shift corresponding patch centers across modalities, weakening the spatial correspondence assumed by dense contrastive learning and cross-modal fusion. We propose GAAT (Geometry-Aware Alignment Transformer), an alignment-first pretrained model that estimates local correspondence reliability before cross-modal interaction. GAAT introduces syncPATC, which learns patch-center consistency under synchronized view transformations without correspondence annotations. It emits geometric priors, including token and query confidence, query centers, and sub-token offsets, that identify reliable local anchors across residual misalignment. Guided by these priors, MG-Sparse-MMA performs query-mediated sparse fusion over top-K_s reliable regions, replacing dense all-patch interaction with geometry-calibrated local updates. RA-QCGCL aligns pretraining supervision with this sparse query bottleneck through reliable patch-to-patch, patch-to-query, and query-to-query contrastive branches. We introduce UAVMeta and StateBench, which provide four acquisition-state scores derived from platform telemetry and image statistics: camera reliability, observation scale, viewpoint stability, and flight maneuver complexity. Extensive experiments across six downstream tasks demonstrate consistently superior transfer performance, establishing GAAT as a state-of-the-art multimodal foundation model for UAV perception. StateBench further enables a systematic diagnosis of real-world acquisition conditions.", "pdf_url": "https://arxiv.org/pdf/2608.27971v1"}, {"title": "Dense Cores in the Vicinity of an HII Region", "authors": ["Ruofei Zhang", "Xing Lu", "Jingwen Wu", "Sihan Jiao", "Hauyu Baobab Liu", "Guang-Xing Li", "Roberto Galván-Madrid", "Aiyuan Yang", "Siju Zhang", "Shanghuo Li", "Fengwei Xu", "Xindi Tang", "Yu Cheng", "Weiyuan Zhang", "Andrés E. Guzmán", "Yuxin Lin", "Yuhua Liu", "Qizhou Zhang", "Patricio Sanhueza", "Ke Wang", "Siyi Feng", "Linjing Feng", "Fangyuan Deng", "Hao Ruan", "Yuanzhen Xiong", "Yuxiang Liu"], "published": "2026-08-28", "summary": "Massive stars strongly influence their surroundings through radiative and mechanical feedback, but its effects on dense gas structures at sub-pc scales remain poorly constrained. We investigate how feedback from a newly formed massive star affects dense cores in the filamentary molecular cloud IRAS 18530+0215. We analyze ALMA Band 6 observations of 1.3 mm dust continuum and DCN, N$_2$D$^+$, and $^{13}$CS line emission, together with VLA K-band continuum and NH$_3$ observations. Dense cores are identified with astrodendro, and their temperatures, masses, velocity dispersions, and virial parameters are derived. The dynamical state of the ultra-compact H II region is examined through energy and pressure estimates. The H II region has a radius of $\\sim$0.1 pc and an expansion velocity of $\\sim$2.5 km s$^{-1}$, corresponding to a shell dynamical age of $\\sim$0.06 Myr. DCN and $^{13}$CS cores are concentrated near the H II region, whereas N$_2$D$^+$ cores preferentially lie farther away. Core temperatures and velocity dispersions decrease with projected distance from the H II region. Virial parameters increase within the inner $\\sim$0.3 pc but decline sharply beyond this scale, while core masses show no significant trend with distance. Strong star formation signatures are found at $\\sim$0.2 pc, whereas more distant regions still host quiescent, cold dense cores. The compact H II region appears trapped or choked within $\\sim$0.1 pc, while its feedback extends to at least $\\sim$0.3 pc. Within this region, feedback enhances core velocity dispersions, gas temperatures, and virial parameters, with no evidence that it promotes the formation of more massive dense cores.", "pdf_url": "https://arxiv.org/pdf/2608.27913v1"}], "repos": [{"repo": "NVIDIA/skills", "stars": 3162, "language": "Python", "description": "Agent Skills for NVIDIA products — install into Claude Code, Codex, and other coding agents to run Physical AI, robotics, simulation, CUDA, and RAG workflows end to end.", "url": "https://github.com/NVIDIA/skills", "date": "2026-09-01", "topic": "physical-ai", "score": 1264.9}, {"repo": "awslabs/awsome-distributed-ai", "stars": 473, "language": "Shell", "description": "Collection of best practices, reference architectures, model training examples and utilities to train large models on AWS. ", "url": "https://github.com/awslabs/awsome-distributed-ai", "date": "2026-09-01", "topic": "physical-ai", "score": 189.3}, {"repo": "commaai/openpilot", "stars": 63543, "language": "Python", "description": "openpilot is an operating system for robotics. Currently, it upgrades the driver assistance system on 300+ supported cars.", "url": "https://github.com/commaai/openpilot", "date": "2026-09-01", "topic": "robotics", "score": 25417.3}, {"repo": "ArduPilot/ardupilot", "stars": 15780, "language": "C++", "description": "ArduPlane, ArduCopter, ArduRover, ArduSub source", "url": "https://github.com/ArduPilot/ardupilot", "date": "2026-09-01", "topic": "robotics", "score": 6312.1}, {"repo": "earthtojake/text-to-cad", "stars": 14081, "language": "Python", "description": "A library of agent skills for CAD, CAE and CAM", "url": "https://github.com/earthtojake/text-to-cad", "date": "2026-09-01", "topic": "robotics", "score": 5632.5}, {"repo": "vllm-project/vllm-omni", "stars": 6512, "language": "Python", "description": "A framework for efficie   models:'HF Models',funding:'Funding',companies:'Companies',jobs:'Jobs',
};
const TOPICS = {
  vla:{ label:'VLA Models',    icon:'🎯', color:'#818cf8', kw:['vla','vision-language-action','vision language action'] },
  wam:{ label:'World Action',  icon:'🌍', color:'#a78bfa', kw:['wam','world action model','world-action','world model'] },
  robotPolicy:{ label:'Robot Policy',  icon:'🦿', color:'#2dd4bf', kw:['robot polic','manipulation polic','dexterous','locomotion','loco-manipul'] },
  rlPolicy:{    label:'RL Policy',     icon:'🧮', color:'#fbbf24', kw:['reinforcement learning','reward function','policy gradient','actor-critic','ppo ','rl agent'] },
  simulation:{  label:'Simulation',    icon:'🖥️', color:'#60a5fa', kw:['sim-to-real','simulation','simulator','simulated env','mujoco','isaac','sapien','robotwin','libero'] },
};

const state = { ds:'all',page:1,size:20,q:'',sort:'newest',view:'grid',dr:'all',advMod:null };

/* ── helpers ── */
const esc = v => String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const plain = v => { const d=document.createElement('div'); d.innerHTML=String(v??''); return d.textContent||''; };
const titleOf = x => x.title||x.repo||x.model||x.company||'Untitled';
const dateOf  = x => x.date||x.published||x.posted||'';
const srcOf   = x => { const s=x.source; if (s && !/^https?:\/\//.test(s)) return s; return x.company||x.language||x.topic||x.category||''; };
const scoreOf = x => Number(x.score||x.stars||x.downloads||0);
const isSeed  = x => { const u=x.url||x.pdf_url||''; return u.includes('example.com')||(x.title||'').toLowerCase().startsWith('example'); };
const fmt = n => n>=1e6?(n/1e6).toFixed(1)+'M':n>=1000?(n/1000).toFixed(1)+'K':String(n);
const truncWords=(t,n=100)=>{if(!t)return'';const w=t.trim().split(/\s+/);return w.length<=n?t:w.slice(0,n).join(' ')+'…';};

/* ── stars (persist across data refreshes via localStorage, keyed by URL) ── */
const keyOf = x => x.url||x.pdf_url||titleOf(x);
let STARS = new Set(JSON.parse(localStorage.getItem('hub-stars')||'[]'));
const isStarred = x => STARS.has(keyOf(x));
function toggleStar(k) {
  if (STARS.has(k)) STARS.delete(k); else STARS.add(k);
  localStorage.setItem('hub-stars', JSON.stringify([...STARS]));
}
function starredRows() { return allRows().filter(isStarred); }


function hrefOf(x) {
  if (x.pdf_url) {
    const m=x.pdf_url.match(/arxiv\.org\/(?:pdf|abs)\/([0-9]+\.[0-9]+)/);
    if (m) return 'https://arxiv.org/abs/'+m[1];
  }
  if (x.url) return x.url;
  if (x.pdf_url) return x.pdf_url;
  if (x.source && /^https?:\/\//.test(x.source)) return x.source;
  return '#';
}

function cutoff(r) {
  if (r==='all') return '';
  const d=new Date();
  if (r==='today') d.setHours(0,0,0,0);
  else if (r==='7d')  d.setDate(d.getDate()-7);
  else if (r==='30d') d.setDate(d.getDate()-30);
  else if (r==='90d') d.setDate(d.getDate()-90);
  return d.toISOString().slice(0,10);
}

function colorOf(k) { return SRC_COLOR[k]||(TOPICS[k]&&TOPICS[k].color)||'#818cf8'; }
function labelOf(k) { return SRC_LABEL[k]||(TOPICS[k]&&TOPICS[k].label)||k; }
function iconOf(k)  { return SRC_ICON[k]||(TOPICS[k]&&TOPICS[k].icon)||'•'; }

/* ── rows ── */
function allRows() {
  return Object.entries(data).flatMap(([k,rows])=>rows.filter(x=>!isSeed(x)).map(x=>( {...x,_k:k} )));
}
function rowsFor(ds) {
  if (ds==='starred') return starredRows();
  if (TOPICS[ds]) {
    const t=TOPICS[ds];
    return (data.papers||[]).filter(x=>{
      if (isSeed(x)) return false;
      const txt=(x.title+' '+(x.summary||'')).toLowerCase();
      return t.kw.some(k=>txt.includes(k));
    }).map(x=>( {...x,_k:ds} ));
  }
  return ds==='all'?allRows():(data[ds]||[]).filter(x=>!isSeed(x)).map(x=>( {...x,_k:ds} ));
}
function filtered() {
  const q=state.q.trim().toLowerCase(), from=cutoff(state.dr);
  let rows=rowsFor(state.ds);
  if (q) rows=rows.filter(x=>JSON.stringify(x).toLowerCase().includes(q));
  if (from) rows=rows.filter(x=>dateOf(x)>=from);
  return rows.sort((a,b)=>{
    if (state.sort==='score') return scoreOf(b)-scoreOf(a);
    if (state.sort==='alpha') return titleOf(a).localeCompare(titleOf(b));
    return dateOf(b).localeCompare(dateOf(a));
  });
}

/* ── render nav ── */
function renderNav() {
  const mk = (k,lbl,ico,n) => `
    <button class="nav-btn${state.ds===k?' active':''}" data-k="${k}">
      <span class="nav-ico">${ico}</span>
      <span class="nav-lbl">${esc(lbl)}</span>
      <span class="nav-cnt">${n}</span>
    </button>`;
  document.getElementById('navMain').innerHTML =
    [['all',allRows().length],['starred',starredRows().length],...Object.entries(data).map(([k,r])=>[k,r.length])]
      .map(([k,n])=>mk(k,SRC_LABEL[k]||k,SRC_ICON[k]||'•',n)).join('');
  document.getElementById('navTopics').innerHTML =
    Object.entries(TOPICS).map(([k,t])=>mk(k,t.label,t.icon,rowsFor(k).length)).join('');
  document.getElementById('navAdv').innerHTML =
    mk('__adv__','ADVANCED','🚀','18 modules');
  document.querySelectorAll('.nav-btn').forEach(b=>b.addEventListener('click',()=>{
    state.ds=b.dataset.k; state.page=1; state.advMod=null; render();
  }));
}

/* ── render stats (with count-up) ── */
let lastDs='';
function renderStats() {
  const rows=rowsFor(state.ds);
  const scored=rows.filter(x=>scoreOf(x)>0).length;
  const jobs=rows.filter(x=>x._k==='jobs').length;
  const latest=rows.map(dateOf).filter(Boolean).sort().pop()||'—';
  const items=[
    ['⚡','Total Signals',rows.length,'#818cf8'],
    ['🎯','Scored Items',scored,'#38bdf8'],
    ['💼','Job Postings',jobs,'#34d399'],
    ['📅','Latest',latest,'#fbbf24'],
  ];
  document.getElementById('stats').innerHTML = items.map(([ico,lbl,val,col])=>`
    <div class="stat" style="--sc:${col}">
      <span class="stat-ico">${ico}</span>
      <div class="stat-lbl">${lbl}</div>
      <div class="stat-num" data-target="${typeof val==='number'?val:''}"
           style="${String(val).length>8?'font-size:15px;margin-top:8px':''}">
        ${typeof val==='number'?'0':esc(String(val))}
      </div>
    </div>`).join('');

  /* stat hover handled by CSS lift */

  /* count-up */
  const doCount = state.ds!==lastDs;
  lastDs=state.ds;
  document.querySelectorAll('.stat-num[data-target]').forEach(el=>{
    const t=Number(el.dataset.target);
    if (!t) return;
    if (!doCount) { el.textContent=t.toLocaleString(); return; }
    const dur=1400, s=performance.now();
    const tick=now=>{
      const p=Math.min((now-s)/dur,1), ease=1-Math.pow(1-p,3);
      el.textContent=Math.round(ease*t).toLocaleString();
      if (p<1) requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  });
}

/* ── item template ── */

/* ── pagination ── */
function pageWin(c,t) {
  const s=Math.max(1,c-2),e=Math.min(t,c+2);
  const ps=[];
  for(let p=s;p<=e;p++) ps.push(p);
  if(!ps.includes(1)){ if(ps[0]>2) ps.unshift('…'); ps.unshift(1); }
  if(!ps.includes(t)){ if(ps[ps.length-1]<t-1) ps.push('…'); ps.push(t); }
  return ps;
}
function renderPag(tot) {
  const el=document.getElementById('pages');
  el.innerHTML=[
    `<button class="pgb" data-p="${state.page-1}" ${state.page===1?'disabled':''}>‹ Prev</button>`,
    ...pageWin(state.page,tot).map(p=>p==='…'
      ?`<button class="pgb" disabled>…</button>`
      :`<button class="pgb${p===state.page?' on':''}" data-p="${p}">${p}</button>`),
    `<button class="pgb" data-p="${state.page+1}" ${state.page===tot?'disabled':''}>Next ›</button>`,
  ].join('');
  el.querySelectorAll('.pgb:not([disabled])').forEach(b=>b.addEventListener('click',()=>{
    const p=Number(b.dataset.p);
    if(p&&p!==state.page){ state.page=p; render(); document.querySelector('.panel').scrollIntoView({behavior:'smooth',block:'start'}); }
  }));
}

/* ── main render ── */
function render() {
  const isAdv = state.ds==='__adv__';
  document.getElementById('pageTitle').textContent =
    isAdv?(state.advMod?ADV_MODS.find(m=>m.id===state.advMod)?.label||'Advanced':'🚀 Advanced Intelligence')
    :SRC_LABEL[state.ds]||(TOPICS[state.ds]&&TOPICS[state.ds].label)||state.ds;
  renderNav();
  document.getElementById('mainPanel').style.display = isAdv?'none':'';
  document.getElementById('stats').style.display = isAdv?'none':'';
  document.getElementById('advWrap').style.display = isAdv?'':'none';
  if (isAdv) { renderAdvanced(); return; }
  renderStats();
  const rows=filtered();
  const tot=Math.max(1,Math.ceil(rows.length/state.size));
  state.page=Math.min(state.page,tot);
  const s=(state.page-1)*state.size;
  const slice=rows.slice(s,s+state.size);
  document.getElementById('resultCount').textContent=
    rows.length.toLocaleString()+' result'+(rows.length!==1?'s':'');
  document.getElementById('pageStatus').textContent=`Page ${state.page} of ${tot}`;
  document.getElementById('rangeStatus').textContent=rows.length
    ?`Showing ${s+1}–${s+slice.length} of ${rows.length}`:'No results';
  const feed=document.getElementById('feed');
  feed.className='feed '+(state.view==='grid'?'grid-v':'list-v');
  feed.innerHTML=slice.length?slice.map(itemHtml).join('')
    :`<div class="empty">
        <div class="empty-ico">🔭</div>
        <h3>No matching signals</h3>
        <p>Try adjusting your search or selecting a different category.</p>
      </div>`;
  renderPag(tot);
  addTilts();
}

/* ══════════════════════════════════════════
   NEURAL NETWORK BACKGROUND ANIMATION
══════════════════════════════════════════ */
(function() {
  const canvas=document.getElementById('bgCanvas');
  const ctx=canvas.getContext('2d');
  let W,H;
  function resize(){ W=canvas.width=window.innerWidth; H=canvas.height=window.innerHeight; }
  window.addEventListener('resize',resize); resize();

  const N=40, MAXD=150;
  const PCOLORS=['rgba(124,58,237,','rgba(99,102,241,','rgba(129,140,248,','rgba(14,165,233,'];
  const nodes=Array.from({length:N},()=>{
    const c=PCOLORS[Math.floor(Math.random()*PCOLORS.length)];
    return {
      x:Math.random()*window.innerWidth,
      y:Math.random()*window.innerHeight,
      vx:(Math.random()-.5)*.32,
      vy:(Math.random()-.5)*.32,
      r:Math.random()*1.8+.6,
      c, ph:Math.random()*Math.PI*2,
      ps:.008+Math.random()*.014,
    };
  });

  let mx=-2000,my=-2000;
  window.addEventListener('mousemove',e=>{ mx=e.clientX; my=e.clientY; });

  function frame() {
    ctx.clearRect(0,0,W,H);
    nodes.forEach(n=>{
      n.x+=n.vx; n.y+=n.vy; n.ph+=n.ps;
      if(n.x<0||n.x>W) n.vx*=-1;
      if(n.y<0||n.y>H) n.vy*=-1;
      n.x=Math.max(0,Math.min(W,n.x));
      n.y=Math.max(0,Math.min(H,n.y));
      const dx=n.x-mx,dy=n.y-my,md=Math.sqrt(dx*dx+dy*dy);
      if(md<110){ n.vx+=(dx/md)*.012; n.vy+=(dy/md)*.012; }
      n.vx=Math.max(-.7,Math.min(.7,n.vx*.997));
      n.vy=Math.max(-.7,Math.min(.7,n.vy*.997));
      const p=.35+Math.sin(n.ph)*.18;
      /* glow halo */
      const g=ctx.createRadialGradient(n.x,n.y,0,n.x,n.y,n.r*5);
      g.addColorStop(0,n.c+(p*.7)+')');
      g.addColorStop(1,n.c+'0)');
      ctx.beginPath(); ctx.arc(n.x,n.y,n.r*5,0,Math.PI*2);
      ctx.fillStyle=g; ctx.fill();
      /* core */
      ctx.beginPath(); ctx.arc(n.x,n.y,n.r,0,Math.PI*2);
      ctx.fillStyle=n.c+(p*1.4)+')'; ctx.fill();
    });
    /* connections */
    for(let i=0;i<N;i++) for(let j=i+1;j<N;j++) {
      const dx=nodes[i].x-nodes[j].x, dy=nodes[i].y-nodes[j].y;
      const d=Math.sqrt(dx*dx+dy*dy);
      if(d<MAXD) {
        const a=(1-d/MAXD)*.14;
        ctx.beginPath();
        ctx.moveTo(nodes[i].x,nodes[i].y);
        ctx.lineTo(nodes[j].x,nodes[j].y);
        ctx.strokeStyle=`rgba(129,140,248,${a})`;
        ctx.lineWidth=.7; ctx.stroke();
      }
    }
    requestAnimationFrame(frame);
  }
  frame();
})();

/* ══════════════════════════════════════════
   AUTO-REFRESH COUNTDOWN (every 6 hours)
══════════════════════════════════════════ */
(function() {
  const SIX_H=6*60*60*1000;
  const end=Date.now()+SIX_H;
  const updEl=document.getElementById('nextUpd');
  const progEl=document.getElementById('refProg');

  function tick() {
    const left=end-Date.now();
    if(left<=0){ location.reload(); return; }
    const h=Math.floor(left/3600000);
    const m=Math.floor((left%3600000)/60000);
    const s=Math.floor((left%60000)/1000);
    if(updEl) updEl.textContent=`Refresh in ${h}h ${m}m ${s}s`;
    if(progEl) progEl.style.width=((left/SIX_H)*100).toFixed(2)+'%';
  }
  tick();
  setInterval(tick,1000);
  setTimeout(()=>location.reload(),SIX_H);
})();

const ALL_TEXT = (arr) => arr.filter(x=>!isSeed(x)).map(x=>JSON.stringify(x).toLowerCase());

function mktScore(k) {
  const kws=MKTS[k].kw;
  const has=txt=>kws.some(w=>txt.includes(w));
  const papers   =(data.papers||[]).filter(x=>!isSeed(x)&&has((x.title+' '+(x.summary||'')).toLowerCase())).length;
  const news     =[...(data.aiNews||[]),...(data.physicalAiNews||[]),...(data.roboticsNews||[]),...(data.embeddedNews||[])].filter(x=>!isSeed(x)&&has(JSON.stringify(x).toLowerCase())).length;
  const funding  =(data.funding||[]).filter(x=>!isSeed(x)&&has(JSON.stringify(x).toLowerCase())).length;
  const jobs     =(data.jobs||[]).filter(x=>!isSeed(x)&&has(JSON.stringify(x).toLowerCase())).length;
  const repos    =(data.repos||[]).filter(x=>!isSeed(x)&&has(JSON.stringify(x).toLowerCase())).length;
  const models   =(data.models||[]).filter(x=>!isSeed(x)&&has(JSON.stringify(x).toLowerCase())).length;
  const companies=(data.companies||[]).filter(x=>!isSeed(x)&&has(JSON.stringify(x).toLowerCase())).length;
  const research = papers*3+repos*2+models*2;
  const commercial= funding*5+companies*4;
  const demand = news*2+jobs*1;
  const total = research+commercial+demand;
  const momentum = Math.min(99,research*2+demand*3);
  const competition= Math.min(99,commercial*4);
  const opp = Math.min(99,Math.max(1,research*3+demand*2-competition*0.5+10));
  const gap = Math.max(0,research - commercial);
  return {papers,news,funding,jobs,repos,models,companies,research,commercial,demand,total,momentum,competition,opp,gap};
}

/* ── Module: ProblemMine ── */
function advProblemMine() {
  const MARKERS=['challenge','problem','limitation','lack of','difficult','lacking','absence of','gap in','fail to','struggle','insufficient','unable to','barrier'];
  const problems=[];
  const allSrc=[...(data.papers||[]),...(data.aiNews||[]),...(data.roboticsNews||[]),...(data.physicalAiNews||[])].filter(x=>!isSeed(x));
  allSrc.forEach(x=>{
    const text=plain(x.summary||x.description||'');
    if(!text) return;
    const sentences=text.split(/[.!?]/).map(s=>s.trim()).filter(s=>s.length>20&&s.length<200);
    sentences.forEach(s=>{
      const sl=s.toLowerCase();
      if(MARKERS.some(m=>sl.includes(m))){
        problems.push({problem:s,source:titleOf(x),url:hrefOf(x),date:dateOf(x),
          opp:50+Math.floor(Math.random()*45)});
      }
    });
  });
  const unique=problems.filter((p,i)=>problems.findIndex(q=>q.problem.slice(0,30)===p.problem.slice(0,30))===i);
  const top=unique.sort((a,b)=>b.opp-a.opp).slice(0,20);
  return `
  <div class="adv-metrics">
    <div class="adv-metric"><div class="adv-metric-n">${top.length}</div><div class="adv-metric-l">Problems Found</div></div>
    <div class="adv-metric"><div class="adv-metric-n">${top.filter(p=>p.opp>=80).length}</div><div class="adv-metric-l">High-Value</div></div>
    <div class="adv-metric"><div class="adv-metric-n">${new Set(top.map(p=>p.date.slice(0,7))).size}</div><div class="adv-metric-l">Date Ranges</div></div>
    <div class="adv-metric"><div class="adv-metric-n">Live</div><div class="adv-metric-l">Data Source</div></div>
  </div>
  <div class="adv-panel">
    <div class="adv-panel-hdr">⛏️ Real problems extracted from research papers & news</div>
    <ul class="adv-list">
      ${top.length?top.map((p,i)=>`
        <li class="adv-item">
          <div class="adv-rank">${i+1}</div>
          <div class="adv-item-body">
            <div class="adv-item-title" style="font-size:13.5px;font-weight:600;color:var(--t2)">"${esc(p.problem)}"</div>
            <div style="margin-top:6px;display:flex;gap:8px;flex-wrap:wrap;align-items:center">
              <a href="${esc(p.url)}" target="_blank" style="font-size:11.5px;color:var(--acc)">📄 ${esc(truncWords(p.source,8))}</a>
              ${p.date?`<span style="font-size:11px;color:var(--muted)">${p.date}</span>`:''}
              <span class="adv-tag adv-tag-green">Opp: ${p.opp}</span>
            </div>
          </div>
        </li>`).join('')
      :`<li class="adv-item"><div style="color:var(--muted);padding:20px">No problems extracted yet — add more papers with summaries.</div></li>`}
    </ul>
  </div>`;
}

  const funding=(data.funding||[]).filter(x=>!isSeed(x));
  const byMkt=Object.entries(MKTS).map(([k,m])=>{
    const s=mktScore(k); return {k,m,s};
  }).sort((a,b)=>b.s.funding-a.s.funding);
  const recent=funding.sort((a,b)=>dateOf(b).localeCompare(dateOf(a))).slice(0,10);
  return `
  <div class="adv-metrics">
    <div class="adv-metric"><div class="adv-metric-n">${funding.length}</div><div class="adv-metric-l">Rounds Tracked</div></div>
    <div class="adv-metric"><div class="adv-metric-n">${byMkt[0].m.icon} ${truncWords(byMkt[0].m.label,3)}</div><div class="adv-metric-l">Hottest Market</div></div>
    <div class="adv-metric"><div class="adv-metric-n">${byMkt.filter(r=>r.s.funding>0).length}</div><div class="adv-metric-l">Active Markets</div></div>
    <div class="adv-metric"><div class="adv-metric-n">2026</div><div class="adv-metric-l">Cycle Peak Est.</div></div>
  </div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
    <div class="adv-panel" style="margin:0">
      <div class="adv-panel-hdr">💰 Most Funded Markets</div>
      <ul class="adv-list">
        ${byMkt.slice(0,8).map((r,i)=>`
          <li class="adv-item" style="padding:10px 16px">
            <div class="adv-rank" style="background:${r.m.color}22;color:${r.m.color}">${i+1}</div>
            <div class="adv-item-body">
              <div style="font-size:13px;font-weight:700">${r.m.icon} ${r.m.label}</div>
              ${bar('',Math.min(99,r.s.funding*12),r.m.color)}
            </div>
            <span style="font-size:14px;font-weight:800;color:${r.m.color}">${r.s.funding}</span>
          </li>`).join('')}
      </ul>
    </div>
    <div class="adv-panel" style="margin:0">
      <div class="adv-panel-hdr">📋 Recent Funding Activity</div>
      <ul class="adv-list">
        ${recent.length?recent.map(f=>`
          <li class="adv-item" style="padding:10px 16px">
            <div class="adv-item-body">
              <div style="font-size:13px;font-weight:700">${esc(truncWords(titleOf(f),10))}</div>
              <div style="font-size:11.5px;color:var(--t3);margin-top:3px">
                ${f.amount?`<span class="adv-tag adv-tag-green">${esc(f.amount)}</span>`:''}
                ${f.stage?`<span class="adv-tag adv-tag-blue">${esc(f.stage)}</span>`:''}
                ${dateOf(f)?`<span style="color:var(--muted)">${dateOf(f)}</span>`:''}
              </div>
            </div>
          </li>`).join(''):`<li class="adv-item"><div style="color:var(--muted);padding:20px">No recent funding data.</div></li>`}
      </ul>
    </div>
  </div>`;
}

/* ── Module: AI Co-Founder ── */
function advCoFounder() {
  return `
  <div class="adv-panel">
    <div class="adv-panel-hdr">🤝 AI Co-Founder — Ask anything about what to build next</div>
    <div class="adv-chat">
      <div class="adv-chat-msgs" id="cf-msgs">
        <div class="adv-msg bot">👋 Hi! I'm your AI Co-Founder. I have full access to this platform's data — papers, funding, jobs, companies, and market signals.<br><br>Ask me things like:<br>• "What startup should I build in robotics?"<br>• "What market is underserved right now?"<br>• "How do I monetize this paper about VLA models?"<br>• "What's the best opportunity in simulation?"</div>
      </div>
      <div class="adv-chat-inp">
        <input class="adv-inp" id="cf-inp" type="text" placeholder="Ask your AI Co-Founder…" autocomplete="off">
        <button class="adv-btn" id="cf-send" style="height:40px;padding:0 16px">Send</button>
      </div>
    </div>
  </div>`;
}
function advCoFounderBind() {
  const send=()=>{
    const inp=document.getElementById('cf-inp');
    const msgs=document.getElementById('cf-msgs');
    if(!inp||!msgs) return;
    const q=(inp.value||'').trim();
    if(!q) return;
    msgs.innerHTML+=`<div class="adv-msg user">${esc(q)}</div>`;
    inp.value='';
    const ql=q.toLowerCase();
    let reply='';
    const topMkt=Object.entries(MKTS).map(([k,m])=>{const s=mktScore(k);return{k,m,s};}).sort((a,b)=>b.s.opp-a.s.opp)[0];
    const topGap=Object.entries(MKTS).map(([k,m])=>{const s=mktScore(k);const g=Math.min(99,s.papers*4+s.news*2-s.funding*6);return{k,m,g};}).sort((a,b)=>b.g-a.g)[0];
    if(ql.includes('startup')||ql.includes('build')||ql.includes('idea')) {
      reply=`Based on current signals, the highest-opportunity startup right now is in <strong>${topMkt.m.icon} ${topMkt.m.label}</strong> (opportunity score: ${topMkt.s.opp}/100).<br><br>Specifically: I'd build a <strong>Robot Data Flywheel Platform</strong> — no scalable marketplace exists for robot demonstration data, yet VLA model training demands are exploding. Papers: ${topMkt.s.papers}, Funding rounds: ${topMkt.s.funding}, Open jobs: ${topMkt.s.jobs}.<br><br>MVP: Teleoperation recorder → S3 → data marketplace. Target: robotics researchers and startups as first customers.`;
    } else if(ql.includes('underserved')||ql.includes('gap')||ql.includes('whitespace')) {
      reply=`The biggest gap I see: <strong>${topGap.m.icon} ${topGap.m.label}</strong> — gap score ${topGap.g}/100. This means there's strong research activity (${topGap.s?.papers||0} papers) but very few commercial products exist yet.<br><br>This is classic "research valley of death" territory — the perfect place to build a bridge. The academic papers have proven the concept works; now someone needs to productize it.`;
    } else if(ql.includes('fund')||ql.includes('invest')||ql.includes('raise')) {
      const topFunded=Object.entries(MKTS).map(([k,m])=>{const s=mktScore(k);return{k,m,s};}).sort((a,b)=>b.s.funding-a.s.funding)[0];
      reply=`Investors are most active in <strong>${topFunded.m.icon} ${topFunded.m.label}</strong> right now (${topFunded.s.funding} tracked rounds).<br><br>To fundraise in 2026: 1) Show real robot demos, not slides. 2) Have a data story — how will you collect proprietary training data? 3) Target Khosla Ventures, Lux Capital, GV, and Coatue — all active in physical AI. 4) Your pre-seed ask should be $1-3M with a 12-month runway to robot demo.`;
    } else if(ql.includes('simulation')||ql.includes('sim')) {
      const s=mktScore('synData');
      reply=`Simulation is one of the hottest infrastructure bets. Key signals: ${s.papers} papers, ${s.repos} repos, ${s.jobs} open roles.<br><br>Opportunity: Build a <strong>Sim2Real Validation SaaS</strong> — companies training on Isaac Sim or MuJoCo have no standardized way to validate that their policy will actually work on real hardware. $800M addressable market by 2028.`;
    } else if(ql.includes('vla')||ql.includes('vision language action')) {
      const s=mktScore('vla');
      reply=`VLA models are the hottest research area right now. ${s.papers} papers, ${s.funding} funding rounds.<br><br>Best commercial angle: <strong>VLA Fine-Tuning API</strong> — Physical Intelligence and OpenVLA are releasing foundation models, but every industrial customer needs domain adaptation. Build the "Replicate for VLA" — 1-click fine-tuning on custom manipulation demos. $2.4B market by 2028.`;
    } else if(ql.includes('paper')||ql.includes('research')||ql.includes('monetize')) {
      const rp=(data.papers||[]).filter(x=>!isSeed(x)).sort((a,b)=>dateOf(b).localeCompare(dateOf(a)))[0];
      reply=`The fastest path from paper to product:<br>1. <strong>Reproduce it</strong> — get the code working as a Python package<br>2. <strong>API-ify it</strong> — wrap it in FastAPI or a Cloudflare Worker<br>3. <strong>Find 3 paying design partners</strong> — robotics startups who need this exact capability<br>4. <strong>Charge per inference</strong> — $0.01–0.10 per call<br><br>Latest paper to consider: <a href="${esc(hrefOf(rp))}" target="_blank" style="color:var(--acc)">${esc(truncWords(titleOf(rp),15))}</a>`;
    } else if(ql.includes('job')||ql.includes('career')||ql.includes('skill')) {
      const topJobMkt=Object.entries(MKTS).map(([k,m])=>{const s=mktScore(k);return{k,m,s};}).sort((a,b)=>b.s.jobs-a.s.jobs)[0];
      reply=`Most in-demand skills right now based on job postings:<br>1. 🤖 <strong>ROS2</strong> — every robotics company needs this<br>2. 🔬 <strong>PyTorch + transformers</strong> — foundation for robot learning<br>3. ☁️ <strong>Cloud infra (AWS/GCP)</strong> — robot data pipelines<br>4. 👁️ <strong>Computer vision</strong> — always in demand<br><br>Most hiring: ${topJobMkt.m.icon} ${topJobMkt.m.label} (${topJobMkt.s.jobs} open roles).<br><br>Check the Certification Hub module for free learning resources.`;
    } else {
      reply=`I analyzed the current signals for your question. Here's what the data says:<br><br>📊 <strong>Top market right now:</strong> ${topMkt.m.icon} ${topMkt.m.label} (score: ${topMkt.s.opp})<br>🔍 <strong>Biggest gap:</strong> ${topGap.m.icon} ${topGap.m.label} (gap: ${topGap.g})<br>📄 <strong>Research activity:</strong> ${(data.papers||[]).filter(x=>!isSeed(x)).length} papers tracked<br>💰 <strong>Funding activity:</strong> ${(data.funding||[]).filter(x=>!isSeed(x)).length} rounds<br><br>Try asking: "What startup should I build?", "What market is underserved?", or "How do I monetize a VLA paper?"`;
    }
    setTimeout(()=>{
      msgs.innerHTML+=`<div class="adv-msg bot">${reply}</div>`;
      msgs.scrollTop=msgs.scrollHeight;
    },400);
    msgs.scrollTop=msgs.scrollHeight;
  };
  const btn=document.getElementById('cf-send');
  const inp=document.getElementById('cf-inp');
  if(btn) btn.addEventListener('click',send);
  if(inp) inp.addEventListener('keydown',e=>{ if(e.key==='Enter') send(); });
}

  const topPaper=(data.papers||[]).filter(x=>!isSeed(x)).sort((a,b)=>dateOf(b).localeCompare(dateOf(a)))[0]||{};
  const topFunding=(data.funding||[]).filter(x=>!isSeed(x)).sort((a,b)=>dateOf(b).localeCompare(dateOf(a)))[0]||{};
  const topRepo=(data.repos||[]).filter(x=>!isSeed(x)).sort((a,b)=>scoreOf(b)-scoreOf(a))[0]||{};
  const topNews=[...(data.physicalAiNews||[]),...(data.roboticsNews||[])].filter(x=>!isSeed(x)).sort((a,b)=>dateOf(b).localeCompare(dateOf(a)))[0]||{};
  const topMkt=Object.entries(MKTS).map(([k,m])=>{const s=mktScore(k);return{k,m,s};}).sort((a,b)=>b.s.opp-a.s.opp)[0];
  const topGap=Object.entries(MKTS).map(([k,m])=>{const s=mktScore(k);const g=Math.min(99,s.papers*4-s.funding*6+20);return{k,m,g};}).sort((a,b)=>b.g-a.g)[0];
  const today=new Date().toLocaleDateString('en-US',{weekday:'long',year:'numeric',month:'long',day:'numeric'});
  const section=(label,icon,content)=>
    `<div class="adv-brief-section"><div class="adv-brief-label">${icon} ${label}</div>${content}</div>`;
  return `
  <div class="adv-hero" style="text-align:left;padding:20px 24px">
    <div style="font-size:12px;font-weight:700;color:var(--acc);letter-spacing:.08em;text-transform:uppercase;margin-bottom:5px">Daily Founder Brief</div>
    <div class="adv-hero-title" style="font-size:22px">${today}</div>
    <div class="adv-hero-sub">Your daily intelligence digest for Physical AI builders</div>
  </div>
  ${section('Top Market Signal','📡',`
    <div class="adv-panel" style="padding:16px 18px;margin:0">
      <div style="font-size:15px;font-weight:800">${topMkt.m.icon} ${topMkt.m.label} — Opportunity Score ${topMkt.s.opp}</div>
      <div style="font-size:13px;color:var(--t2);margin-top:5px">
        ${topMkt.s.papers} papers · ${topMkt.s.funding} funding rounds · ${topMkt.s.jobs} open jobs
      </div>
      ${bar('Momentum',topMkt.s.momentum,topMkt.m.color)}
    </div>`)}
  ${section('Top Research Paper','📄',`
    <div class="adv-panel" style="padding:16px 18px;margin:0">
      <a href="${esc(hrefOf(topPaper))}" target="_blank" style="font-size:14px;font-weight:700;color:var(--text)">${esc(truncWords(titleOf(topPaper),15))}</a>
      ${Array.isArray(topPaper.authors)&&topPaper.authors.length?`<div style="font-size:12px;color:var(--t3);margin-top:4px">${topPaper.authors.slice(0,3).join(', ')}${topPaper.authors.length>3?' et al.':''}</div>`:''}</div>`)}
  ${section('Biggest Gap Opportunity','🔍',`
    <div class="adv-panel" style="padding:16px 18px;margin:0">
      <div style="font-size:14px;font-weight:700">${topGap.m.icon} ${topGap.m.label} — ${topGap.g} gap score</div>
      <div style="font-size:13px;color:var(--t2);margin-top:5px">Strong research activity. Few commercial solutions. High demand. Build here.</div>
    </div>`)}
  ${topFunding&&titleOf(topFunding)?section('Latest Funding Round','💰',`
    <div class="adv-panel" style="padding:16px 18px;margin:0">
      <div style="font-size:14px;font-weight:700">${esc(truncWords(titleOf(topFunding),12))}</div>
      <div style="font-size:13px;color:var(--t2);margin-top:4px">
        ${topFunding.amount?`<span class="adv-tag adv-tag-green">${esc(topFunding.amount)}</span>`:''}
        ${topFunding.stage?`<span class="adv-tag adv-tag-blue">${esc(topFunding.stage)}</span>`:''}
        ${dateOf(topFunding)?`<span style="color:var(--muted);font-size:12px;margin-left:6px">${dateOf(topFunding)}</span>`:''}
      </div>
    </div>`):''}</div>`;
  return `<div class="adv-wrap">` + section('placeholder','','') + `</div>`;
}

/* ── Module: Signal Score Engine ── */
function advSignalEngine() {
  const WEIGHTS={research:3,funding:5,hiring:1,openSource:2,news:2};
  const calcSignal=(item,type)=>{
    const txt=JSON.stringify(item).toLowerCase();
    const hasMkt=k=>MKTS[k].kw.some(w=>txt.includes(w));
    const mktBonus=Object.keys(MKTS).filter(hasMkt).length*4;
    if(type==='paper') return Math.min(99,scoreOf(item)*10+mktBonus+20);
    if(type==='repo')  return Math.min(99,Math.log1p(scoreOf(item))*10+mktBonus+10);
    if(type==='model') return Math.min(99,Math.log1p(scoreOf(item))*8+mktBonus+15);
    return Math.min(99,mktBonus+25);
  };
  const allItems=[
    ...(data.papers||[]).filter(x=>!isSeed(x)).map(x=>{return{...x,_type:'paper',_sig:calcSignal(x,'paper')};}),
    ...(data.repos||[]).filter(x=>!isSeed(x)).map(x=>{return{...x,_type:'repo',_sig:calcSignal(x,'repo')};}),
    ...(data.models||[]).filter(x=>!isSeed(x)).map(x=>{return{...x,_type:'model',_sig:calcSignal(x,'model')};}),
    ...(data.funding||[]).filter(x=>!isSeed(x)).map(x=>{return{...x,_type:'funding',_sig:calcSignal(x,'funding')};}),
  ].sort((a,b)=>b._sig-a._sig).slice(0,25);
  const byType=t=>allItems.filter(x=>x._type===t).length;
  const typeIcon={paper:'📄',repo:'💻',model:'🧠',funding:'💰'};
  const typeColor={paper:'#34d399',repo:'#60a5fa',model:'#fb923c',funding:'#a3e635'};
  return `
  <div class="adv-metrics">
    <div class="adv-metric"><div class="adv-metric-n">${allItems[0]?._sig||0}</div><div class="adv-metric-l">Top Signal Score</div></div>
    <div class="adv-metric"><div class="adv-metric-n">${allItems.filter(x=>x._sig>=80).length}</div><div class="adv-metric-l">High Signal Items</div></div>
    <div class="adv-metric"><div class="adv-metric-n">${allItems.length}</div><div class="adv-metric-l">Items Ranked</div></div>
    <div class="adv-metric"><div class="adv-metric-n">Live</div><div class="adv-metric-l">Data Freshness</div></div>
  </div>
  <div class="adv-panel">
    <div class="adv-panel-hdr">⚡ Universal Signal Score Rankings — Top 25 signals across all categories</div>
    <ul class="adv-list">
      ${allItems.map((x,i)=>{
        const tc=typeColor[x._type]||'#818cf8';
        const ti=typeIcon[x._type]||'•';
        return `<li class="adv-item">
          <div class="adv-rank" style="background:${tc}22;color:${tc}">${i+1}</div>
          <div class="adv-item-body">
            <div class="adv-item-title">
              <a href="${esc(hrefOf(x))}" target="_blank" style="color:var(--text)">${esc(truncWords(titleOf(x),12))}</a>
            </div>
            <div class="adv-scores">
              <span class="adv-tag" style="background:${tc}22;border:1px solid ${tc}44;color:${tc}">${ti} ${x._type}</span>
              ${scoreOf(x)?`<span class="adv-tag adv-tag-blue">${fmt(scoreOf(x))}</span>`:''}</div>
          </div>
          <div style="text-align:right;flex-shrink:0">
            <div style="font-size:22px;font-weight:900;color:${tc}">${x._sig}</div>
            <div style="font-size:10px;color:var(--muted)">signal</div>
          </div>
        </li>`;
      }).join('')}
    </ul>
  </div>`;
}

/* ── ADVANCED main renderer ── */
function renderAdvanced() {
  const wrap=document.getElementById('advWrap');
  if(state.advMod) {
    const mod=ADV_MODS.find(m=>m.id===state.advMod);
    let content='<div style="color:var(--muted);padding:40px;text-align:center">Module coming soon.</div>';
    if(state.advMod==='opportunity_radar') content=advOpportunityRadar();
    else if(state.advMod==='gapfinder')       content=advGapFinder();
    else if(state.advMod==='future_unicorn')  content=advFutureUnicorn();
    else if(state.advMod==='startup_ideas')   content=advStartupIdeas();
    else if(state.advMod==='startup_validator') content=advStartupValidator();
    else if(state.advMod==='builder_match')   content=advBuilderMatch();
    else if(state.advMod==='problemmine')     content=advProblemMine();
    else if(state.advMod==='market_intel')    content=advMarketIntel();
    else if(state.advMod==='research_map')    content=advResearchMap();
    else if(state.advMod==='startup_genome')  content=advStartupGenome();
    else if(state.advMod==='hidden_gems')     content=advHiddenGems();
    else if(state.advMod==='investor_mode')   content=advInvestorMode();
    else if(state.advMod==='graveyard')       content=advGraveyard();
    else if(state.advMod==='time_machine')    content=advTimeMachine();
    else if(state.advMod==='cofounder')       content=advCoFounder();
    else if(state.advMod==='cert_hub')        content=advCertHub();
    else if(state.advMod==='daily_brief')     content=advDailyBrief();
    else if(state.advMod==='signal_engine')   content=advSignalEngine();
    wrap.innerHTML=`
      <button class="adv-back" id="advBack">← Back to Advanced Hub</button>
      <div class="adv-mod-hdr">
        <div class="adv-mod-ico">${mod?.icon||'🚀'}</div>
        <div>
          <div class="adv-mod-title">${mod?.label||state.advMod}</div>
          <div class="adv-mod-sub">${mod?.desc||''}</div>
        </div>
      </div>
      ${content}`;
    document.getElementById('advBack')?.addEventListener('click',()=>{
      state.advMod=null; renderAdvanced();
    });
    /* bind interactive modules */
    if(state.advMod==='startup_validator') advStartupValidatorBind();
    else if(state.advMod==='builder_match') advBuilderMatchBind();
    else if(state.advMod==='cofounder') advCoFounderBind();
  } else {
    wrap.innerHTML=renderAdvHub();
    wrap.querySelectorAll('.adv-hcard').forEach(c=>c.addEventListener('click',()=>{
      state.advMod=c.dataset.mod; renderAdvanced();
      document.querySelector('.main').scrollTo({top:0,behavior:'smooth'});
    }));
  }
}

/* ── init ── */
syncVT();
render();
</script>
