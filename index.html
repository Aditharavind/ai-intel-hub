/agibot-produces-15000th-robot-marking-milestone-embodied-ai-deployment/", "summary": "<p>AGIBOT has rolled out 15,000 wheeled semi-humanoid robots as it moves from embodied AI from development and production to deployment.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/agibot-produces-15000th-robot-marking-milestone-embodied-ai-deployment/\">AGIBOT produces 15,000th robot, marking a milestone in embodied AI deployment<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "We know how to build smarter robots. Now, we need to learn smarter ways to test them", "source": "Robotics Business Review", "date": "2026-06-27", "url": "https://www.therobotreport.com/we-know-how-to-build-smarter-robots-now-we-need-to-learn-smarter-ways-to-test-them/", "summary": "<p>Atharv Kolhar, a staff test automation engineer at Figure AI, says the robotics industry needs a testing philosophy that scales alongside autonomy. <\/p>\n<p>The post <a href=\"https://www.therobotreport.com/we-know-how-to-build-smarter-robots-now-we-need-to-learn-smarter-ways-to-test-them/\">We know how to build smarter robots. Now, we need to learn smarter ways to test them<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "How compact cobot integration enhances autonomous mobile robot applications", "source": "The Robot Report", "date": "2026-06-27", "url": "https://www.therobotreport.com/how-compact-cobot-integration-enhances-autonomous-mobile-robot-applications/", "summary": "<p>Cobots are quickly shaping the future of warehousing, with their use rising 10-fold from 2018 to 2025, Kassow said.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/how-compact-cobot-integration-enhances-autonomous-mobile-robot-applications/\">How compact cobot integration enhances autonomous mobile robot applications<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Orbbec shows AI-powered vision systems at Automate 2026", "source": "Robotics Business Review", "date": "2026-06-26", "url": "https://www.therobotreport.com/orbbec-shows-ai-powered-vision-systems-automate-2026/", "summary": "<p>Orbbec presented industrial-grade 3D cameras for challenging automation scenarios, as well as AI integration for enhanced robotic perception.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/orbbec-shows-ai-powered-vision-systems-automate-2026/\">Orbbec shows AI-powered vision systems at Automate 2026<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Video Friday: Give Robots a Hand", "source": "IEEE Spectrum Robotics", "date": "2026-06-26", "url": "https://spectrum.ieee.org/video-friday-robot-grippers", "summary": "<img src=\"https://spectrum.ieee.org/media-library/three-fingered-robotic-gripper-arm-crawls-upright-on-a-white-table.gif?id=67036633&amp;width=1245&amp;height=700&amp;coordinates=0%2C0%2C0%2C0\" /><br /><br /><p><span>Video Friday is your weekly selection of awesome robotics videos, collected by your friends at <\/span><em>IEEE Spectrum<\/em><span> robotics. We also post a weekly calendar of upcoming robotics events for the next few months. Please <\/span><a href=\"mailto:automaton@ieee.org?subject=Robotics%20event%20suggestion%20for%20Video%20Friday\">send us your events<\/a><span> for inclusion.<\/span><\/p><h5><a href=\"https://roboticsconference.org/\">RSS 2026<\/a>: 13–17 July 2026, SYDNEY<\/h5><h5><a href=\"https://mrs.fel.cvut.cz/summer-school-2026/\">Summer School on Multi-Robot Systems<\/a>: 29 July–4 August 2026, PRAGUE<\/h5><h5><a href=\"https://actuate.foxglove.dev/\">Actuate 2026<\/a>: 18–19 August 2026, SAN FRANCISCO<\/h5><h5><a href=\"https://2026.ieee-iros.org/\">IROS 2026<\/a>: 27 September–1 October 2026, PITTSBURGH<\/h5><p>Enjoy today’s videos!<\/p><div class=\"horizontal-rule\"><\/div><div><span style=\"display: none;\"> <\/span><\/div><p class=\"rm-anchors\" id=\"yfjuag9w2hg\">The best way of introducing a new <a href=\"https://spectrum.ieee.org/dlr-super-robust-robot-hand\" target=\"_blank\">robot hand<\/a> is to have a disembodied one crawling across a table.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.tangentrobotics.ai/\">Tangent Robotics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"auamgssnyqm\"><em>MIT CSAIL’s Improbable AI Lab Director Pulkit Agrawal explains his “SoftMimic” approach to making robots safer around humans.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://arxiv.org/abs/2510.17792\">SoftMimic<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"uskdotwb0k4\">I now have absolutely no interest in a humanoid robot for my home unless it can do this.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.pndbotics.com/\">PNDbotics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"ueon0tm0jzs\"><em>The <a href=\"https://spectrum.ieee.org/video-friday-heavy-lift-drones\" target=\"_blank\">DARPA Lift Challenge<\/a> is open to the public August 6-9, 2026, at the National Museum of the US Air Force.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.darpa.mil/research/challenges/lift\">DARPA<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"76cusj01dn8\"><em>Getting Digit to step and shuffle around an obstacle on the floor is a real test of reactive footstep planning. Digit has to spot something small and moving, recalculate where to place each foot, and keep working—all without breaking stride or losing balance. That’s the same dynamic footwork Digit uses to navigate clutter and foot traffic on a real warehouse floor.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.agilityrobotics.com/\">Agility Robotics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"9lgujrgb_kq\">This is the most aggressive <a href=\"https://spectrum.ieee.org/firefighting-robot-snake-flies-on-jets-of-water\" target=\"_blank\">firefighting robot<\/a> I’ve ever seen.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.deeprobotics.cn/en\">DEEP Robotics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"rio7kurb53o\">Wait a sec, Dusty can print things on floors besides construction layouts? How is this not in every city, making sidewalks exciting and fun everywhere?!<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.dustyrobotics.com/\">Dusty<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"mtmyfvd4zcw\">I am the first to admit that for US $4,900, the performance of the Unitree R1 is very impressive. But what is it going to do out in the world such that it will give you some sort of return on that investment?<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.unitree.com/R1\">Unitree R1<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"ij93ftr3hqe\">Event cameras are extraordinarily powerful because they can see motion, but what if everything is moving because your camera is moving? Oh no!<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://rpg.ifi.uzh.ch/\">University of Zurich Robotics & Perception Group<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"hleaklk4ixm\"><em>Can we understand whale behavior and language? Harvard SEAS Professor Stephanie Gil explains the possibility of understanding animal language and behavior using AI-driven robots and machine learning.  With ongoing whale research and advancements in artificial intelligence, the potential for animal communication with whales could become a tangible reality.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://react.seas.harvard.edu/\">Harvard SEAS<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"upxxhr8r7-a\"><em>Rodney Brooks, founder and chief technology officer of Robust.AI, sits down with Forbes Assistant Managing Editor Kerry Dolan to discuss how he came up with the idea of the Roomba vacuum cleaner and the future of robotics.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.linkedin.com/posts/rodney-brooks-1a137517_how-ants-inspired-this-founder-to-build-a-activity-7475766254587387904-ZsL9/\">LinkedIn<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"h_dtuu5jl3g\">Here are a couple of interesting presentations from UIST 2025, including everyday objects that move around your home with a mind of their own and a project featuring teamwork between helium balloons and ground robots called Buoyancé.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p class=\"shortcode-media shortcode-media-youtube\"> <span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://programs.sigchi.org/uist/2025\">UIST 2025<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div>"}, {"title": "General Intuition raises $320M to use video game data to train robots", "source": "Robotics Business Review", "date": "2026-06-26", "url": "https://www.therobotreport.com/general-intuition-raises-320m-uses-video-game-data-train-robots/", "summary": "<p>General Intuition is using video game clips with embedded action labels to speed up AI training for robotics. <\/p>\n<p>The post <a href=\"https://www.therobotreport.com/general-intuition-raises-320m-uses-video-game-data-train-robots/\">General Intuition raises $320M to use video game data to train robots<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "ARM Institute expands RoboticsCareer.org into physical AI", "source": "Robotics Business Review", "date": "2026-06-25", "url": "https://www.therobotreport.com/arm-institute-launches-physical-ai-focused-expansion-roboticscareer-org/", "summary": "<p>RoboticsCareer.org now lists the growing job opportunities in physical AI and enables employers to connect to qualified talent.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/arm-institute-launches-physical-ai-focused-expansion-roboticscareer-org/\">ARM Institute expands RoboticsCareer.org into physical AI<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Hirebotics offers no-code, explosion-proof cobot for painting", "source": "Robotics Business Review", "date": "2026-06-25", "url": "https://www.therobotreport.com/hirebotics-offers-no-code-explosion-proof-cobot-for-painting/", "summary": "<p>Hirebotics' Cobot Painter supports stationary painting, with parts placed in a paint booth where robots perform all spraying operations.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/hirebotics-offers-no-code-explosion-proof-cobot-for-painting/\">Hirebotics offers no-code, explosion-proof cobot for painting<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Robust.AI chooses Aptiv PULSE sensor for Gen 3 Carter mobile robot", "source": "Robotics Business Review", "date": "2026-06-25", "url": "https://www.therobotreport.com/robust-ai-chooses-aptiv-pulse-sensor-for-gen-3-carter-mobile-robot/", "summary": "<p>Aptiv provides sensor fusion from radar and vision using AI to enable Robust.AI's Carter robot to move safely around people.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/robust-ai-chooses-aptiv-pulse-sensor-for-gen-3-carter-mobile-robot/\">Robust.AI chooses Aptiv PULSE sensor for Gen 3 Carter mobile robot<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Deep dive into Arm’s physical AI and robotics strategies with Drew Henry", "source": "Robotics Business Review", "date": "2026-06-24", "url": "https://www.therobotreport.com/deep-dive-into-arms-physical-ai-and-robotics-strategies-with-drew-henry/", "summary": "<p>Arm EVP Drew Henry discusses the future of physical AI, robotics, and autonomous systems built for real-world constraints.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/deep-dive-into-arms-physical-ai-and-robotics-strategies-with-drew-henry/\">Deep dive into Arm&#8217;s physical AI and robotics strategies with Drew Henry<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Humanoid maker Agility Robotics to go public through SPAC merger", "source": "Robotics Business Review", "date": "2026-06-24", "url": "https://www.therobotreport.com/humanoid-maker-agility-robotics-go-public-through-spac-merger/", "summary": "<p>Agility Robotics will merge with Churchill Capital Corp XI, raising $620 million to advance Digit v5 and fulfill growing customer orders.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/humanoid-maker-agility-robotics-go-public-through-spac-merger/\">Humanoid maker Agility Robotics to go public through SPAC merger<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Mantis Robotics launches dual-arm, fenceless robot", "source": "Robotics Business Review", "date": "2026-06-24", "url": "https://www.therobotreport.com/mantis-robotics-launches-dual-arm-fenceless-robot/", "summary": "<p>Mantis said the robot allows for new flexibility in how to configure automation in complex, real-world environments.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/mantis-robotics-launches-dual-arm-fenceless-robot/\">Mantis Robotics launches dual-arm, fenceless robot<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "FAULHABER focuses on torque, noise, and power with new GPT gearheads", "source": "Robotics Business Review", "date": "2026-06-24", "url": "https://www.therobotreport.com/faulhaber-focuses-torque-noise-power-new-gpt-gearheads/", "summary": "<p>FAULHABER says its new GPT gearheads work with motors in its standard range and provide more performance with a compact design. <\/p>\n<p>The post <a href=\"https://www.therobotreport.com/faulhaber-focuses-torque-noise-power-new-gpt-gearheads/\">FAULHABER focuses on torque, noise, and power with new GPT gearheads<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Reservoir acquires Contain to scale agtech startups", "source": "Robotics Business Review", "date": "2026-06-24", "url": "https://www.therobotreport.com/reservoir-acquires-contain-to-scale-agtech-startups/", "summary": "<p>Reservoir has acquired agriculture finance platform Contain,, naming founder Nicola Kerslake general partner to help scale AI startups.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/reservoir-acquires-contain-to-scale-agtech-startups/\">Reservoir acquires Contain to scale agtech startups<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Why physical AI 2.0 needs a reality check", "source": "Robotics Business Review", "date": "2026-06-23", "url": "https://www.therobotreport.com/why-physical-ai-2-0-needs-reality-check/", "summary": "<p>While vision and language are key parts of physical AI, physical state recovery will enable robots to interact with the world, says a columnist.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/why-physical-ai-2-0-needs-reality-check/\">Why physical AI 2.0 needs a reality check<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "CreateMe partners with Avalo and Laguna Fabrics to bring resilience to apparel supply chains", "source": "Robotics Business Review", "date": "2026-06-23", "url": "https://www.therobotreport.com/createme-partners-with-avalo-and-laguna-fabrics-to-bring-resilience-to-apparel-supply-chains/", "summary": "<p>CreateMe said the partnership aims to demonstrate how apparel can be produced faster, more locally, and with greater supply chain resilience.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/createme-partners-with-avalo-and-laguna-fabrics-to-bring-resilience-to-apparel-supply-chains/\">CreateMe partners with Avalo and Laguna Fabrics to bring resilience to apparel supply chains<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Vention collaborates with FANUC and Universal Robots on software-defined automation", "source": "Robotics Business Review", "date": "2026-06-23", "url": "https://www.therobotreport.com/vention-collaborates-with-fanuc-universal-robots-software-defined-automation/", "summary": "<p>Vention is working with partners to make design and deployment of industrial and collaborative robots easier for manufacturers.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/vention-collaborates-with-fanuc-universal-robots-software-defined-automation/\">Vention collaborates with FANUC and Universal Robots on software-defined automation<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "ExRobotics launches UL-certified inspection robot for hazardous environments", "source": "Robotics Business Review", "date": "2026-06-23", "url": "https://www.therobotreport.com/exrobotics-launches-ul-certified-inspection-robot-for-hazardous-environments/", "summary": "<p>ExRobotics says its ExR-2.5 inspection robot is certified for safe operations in explosive environments in North America.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/exrobotics-launches-ul-certified-inspection-robot-for-hazardous-environments/\">ExRobotics launches UL-certified inspection robot for hazardous environments<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "NVIDIA releases Halos, a full-stack safety system for robotics", "source": "Robotics Business Review", "date": "2026-06-22", "url": "https://www.therobotreport.com/nvidia-releases-halos-a-full-stack-safety-system-for-robotics/", "summary": "<p>NVIDIA said Halos connects AI compute, system software, sensor data, safety applications, and inspection for robotic systems.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/nvidia-releases-halos-a-full-stack-safety-system-for-robotics/\">NVIDIA releases Halos, a full-stack safety system for robotics<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Cobot’s Proxie Gen 2 robot adds autotasking, mobile manipulation", "source": "Robotics Business Review", "date": "2026-06-22", "url": "https://www.therobotreport.com/cobots-proxie-gen-2-robot-adds-autotasking-mobile-manipulation/", "summary": "<p>Cobot founder and CEO Brad Porter said Proxie Gen 2 can determine when materials are ready to move, identify destinations, and create tasks without human intervention.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/cobots-proxie-gen-2-robot-adds-autotasking-mobile-manipulation/\">Cobot&#8217;s Proxie Gen 2 robot adds autotasking, mobile manipulation<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "How Intrinsic eliminates manual robot coding", "source": "Robotics Business Review", "date": "2026-06-22", "url": "https://www.therobotreport.com/how-intrinsic-eliminates-manual-robot-coding/", "summary": "<p>Alphabet’s Intrinsic has debuted its AI-powered \"Intelligence Cell\" to simplify factory automation and eliminate complex robot programming.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/how-intrinsic-eliminates-manual-robot-coding/\">How Intrinsic eliminates manual robot coding<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Bear Robotics acquires Kinisi Robotics to boost its physical AI capabilities", "source": "Robotics Business Review", "date": "2026-06-22", "url": "https://www.therobotreport.com/bear-robotics-acquires-kinisi-robotics-to-boost-its-physical-ai-capabilities/", "summary": "<p>Kinisi's KR1 humanoid robot, its Bristol-based engineering team, and its physical AI capabilities will be integrated into Bear Robotics.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/bear-robotics-acquires-kinisi-robotics-to-boost-its-physical-ai-capabilities/\">Bear Robotics acquires Kinisi Robotics to boost its physical AI capabilities<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Eclipse Automation launches RealitySync simulation platform", "source": "Robotics Business Review", "date": "2026-06-22", "url": "https://www.therobotreport.com/eclipse-automation-launches-realitysync-simulation-platform/", "summary": "<p>Eclipse said its new RealitySync platform allows manufacturers to step into their future factory before it’s built.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/eclipse-automation-launches-realitysync-simulation-platform/\">Eclipse Automation launches RealitySync simulation platform<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "FORT and NVIDIA launch AI-driven Outside-In Safety blueprint", "source": "Robotics Business Review", "date": "2026-06-22", "url": "https://www.therobotreport.com/fort-and-nvidia-launch-ai-driven-outside-in-safety-blueprint/", "summary": "<p>FORT Robotics and NVIDIA launch Outside-In Safety, using external sensors to improve autonomous robot productivity and worker safety.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/fort-and-nvidia-launch-ai-driven-outside-in-safety-blueprint/\">FORT and NVIDIA launch AI-driven Outside-In Safety blueprint<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Güdel to show grinding beyond stationary robots with vertical, horizontal motion at Automate 2026", "source": "Robotics Business Review", "date": "2026-06-21", "url": "https://www.therobotreport.com/gudel-to-showcase-grinding-beyond-stationary-robots-integrated-vertical-horizontal-motion-automate/", "summary": "<p>Güdel has added two degrees of freedom to heavy-duty robotic grinding applications through its TMV and TMF systems.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/gudel-to-showcase-grinding-beyond-stationary-robots-integrated-vertical-horizontal-motion-automate/\">Güdel to show grinding beyond stationary robots with vertical, horizontal motion at Automate 2026<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Defense manufacturing readiness hinges on autonomous finishing, says GrayMatter Robotics", "source": "Robotics Business Review", "date": "2026-06-20", "url": "https://www.therobotreport.com/defense-manufacturing-readiness-hinges-autonomous-surface-prep-says-graymatter/", "summary": "<p>The Navy's industrial base review identified a projected need for 174,000 new workers. GrayMatter says robotics can fill this gap.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/defense-manufacturing-readiness-hinges-autonomous-surface-prep-says-graymatter/\">Defense manufacturing readiness hinges on autonomous finishing, says GrayMatter Robotics<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "What Amazon’s Astro Taught Me About Giving Robots a Soul", "source": "IEEE Spectrum Robotics", "date": "2026-06-19", "url": "https://spectrum.ieee.org/amazon-astro-robot-sound", "summary": "<img src=\"https://spectrum.ieee.org/media-library/cute-wheeled-home-robot-with-a-tablet-face-set-against-a-blue-heart-patterned-background.jpg?id=66906422&amp;width=1245&amp;height=700&amp;coordinates=0%2C187%2C0%2C188\" /><br /><br /><p>In 2018, Amazon brought me in as the lead UX Sound Designer for <a href=\"https://spectrum.ieee.org/amazon-astro-robot\" target=\"_blank\">Astro, its first consumer home robot<\/a>. Astro used cameras and other sensors to map and navigate your <a href=\"https://spectrum.ieee.org/ai-robots\" target=\"_blank\">home and workplace<\/a>, and could proactively patrol, check up on loved ones, and transport small items using its built-in cargo bin. While there was a well-defined feature set and form factor, initially there was no character direction. In fact, even before <a href=\"https://www.amazon.com/Introducing-Amazon-Astro/dp/B078NSDFSB\" target=\"_blank\">Astro<\/a> had a name, there were two main questions—was it simply Alexa on wheels, or was it a robot with its own character?<\/p><p>The Astro team was divided. One option was to focus on Alexa, and treat the mobile robot simply as an added utility. Along with the majority of the UX team, I argued for Astro to not focus on Alexa. Our belief was that a thing that moves through your home and turns toward you with intent can never be just an appliance. People would ascribe character to it whether we wanted them to or not, and so the only question was whether we shaped that character or let it happen by accident.<\/p><p>Ultimately, <a href=\"https://www.aboutamazon.com/news/devices/meet-astro-a-home-robot-unlike-any-other\" target=\"_blank\">Astro became Astro rather than Alexa<\/a>, and user testing backed up our decision. People <em><em>didn’t<\/em><\/em> see the robot as Alexa. They saw it as its own character, and that’s what they wanted it to be. Alexa on the device felt somewhat strange and creepy, but building Astro its own voice was too slow and expensive in 2018. So, we settled on Alexa as a supporting character that handled any actual talking, while Astro was the main character, communicating as much as it could without words, through sound, motion, and facial expressions.<\/p><p>I had been brought on to the Astro team to define the robot’s sound design language and voice. But there was no one to flesh out the robot’s actual character. You cannot make a single real decision about a character without defining it first. Every choice about how Astro moved, sounded, paused, or reacted was a character choice, and those choices required all disciplines working together. As sound lead, I was weaving together sound, motion, and character, and how they played together inside each story moment. The animators, who programmed Astro’s motion and facial expressions, were extraordinary at what they did, but the emotional arc they were animating came from the sound (and therefore character) work first. So I stepped into that role, which is where my real work started. What I learned about building character for robots applies to nearly everything being built in embodied AI right now.<\/p><h2>Character Is a Design System<\/h2><p>Developing a character for Astro meant answering questions that had never been asked about a product at Amazon: What is the emotional range of this robot’s baseline state? How does this robot communicate uncertainty without eroding trust? Where is the line between being expressive and annoying? What are the vulnerabilities of this device’s character?<\/p><p>These are design questions. They have real answers, and every team working on the product has to build from them. For example, Astro’s emotional range was designed to be relatively small at first. We never wanted Astro to get too sad or too angry. It could play sad, but would snap out of it quickly and end the reaction on a high note to keep things positive.<\/p><p class=\"shortcode-media shortcode-media-youtube\"> <span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>Character leaks out of every seam and can create a disjointed experience if not defined correctly. Even if it’s just animation timing that’s slightly off, or a response that’s technically correct but contextually tone-deaf, users feel every one of these inconsistencies, even if they can’t name them. Watch what happens at the beginning and end of this Sing sequence:<\/p><p class=\"shortcode-media shortcode-media-youtube\"> <span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>Astro goes from nothing, into the emotional moment, and then lands back on nothing. No buildup, no cooldown, no sense that the feeling came from somewhere or had anywhere to go. I pushed hard for better character stitching, the transitions in and out of expressive moments that make a performance feel continuous rather than assembled, but it never got implemented. The moment itself works. But without the stitching, it reads as a clip playing on a robot rather than coming from within the robot character itself.<\/p><h2>Story and Sound at the Beginning<\/h2><p>We had decided that Astro would have no spoken dialogue, but it had something that functioned the same way: a vocabulary of sounds, tones, and rhythms that acted as its voice. This vocabulary became the leading output of the character’s personality. The robot’s motion and facial expressions were built around it.<\/p><p>Astro’s wake-up sequence is a great example. Waking wasn’t just a boot animation on the screen; it was an entire performance. Slow and humble at first, the robot oriented itself quietly, then stretched its screen, checked its wheels, and finally, with an upward gesture toward its telescoping mast, it popped it up slightly, and did a little dance of joy. Sound, motion, and eyes hit every beat<em> <\/em>together in full choreography.<\/p><p class=\"shortcode-media shortcode-media-youtube\"> <span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>The character’s output in that sequence was first written as a story. Astro is waking up in its new home for the first time. Its main aspiration is to be part of a family, so this is the moment it has been waiting for, this is its purpose. Being the responsible character that it is, it wants to make sure everything is good to go before it introduces itself and starts learning its new home.<\/p><p>This narrative came first because it drove every other decision that we made. After the story was written, sound gave that story a metaphorical voice: the excited tones, the pacing as it checked its wheels, and the bright melodic phrase as Astro looked up at its new family for the first time and introduced itself. Once the sound was laid down, the animation team did their thing with motion and facial expressions, taking cues from the emotional arc the sound had established. Motion didn’t lead—it followed the feeling of the story and the sounds, the same way an animator follows a recorded vocal take.<\/p><p>That wake-up sequence became one of the most-discussed moments in early user testing. People described it as “alive.” What they were responding to wasn’t any single element. It was all three channels (sound, motion, and facial expressions) expressing the same defined character in harmony.<\/p><h2>Context Is Where Character Becomes Real<\/h2><p>The most compelling characters are defined not by a fixed disposition but by how they respond to their environments and the people in them. They’re still recognizably themselves even as they adapt. This is what I call contextual character. A robot living in a home doesn’t occupy a single emotional state. It moves through rooms with different energy, encounters people in different moods, operates at different times of day, and responds to an endless range of social situations it was never explicitly designed for.<\/p><p>We got close to a contextual character output with Astro’s sound. When a specific piece of environmental context was fed in, the system adapted beautifully, and Astro felt completely alive. But every state like this was still a prediction we made by hand—a situation we had to imagine in advance and design a response for. A random home throws more situations at a robot than anyone can possibly predict, so there was always a longer tail of moments the system was never prepared for.<\/p><p>The difference between a product people describe as “smart” and one they describe as “aware” often comes down to this. Smartness is capability. Awareness is context. Presence is character. And character is always in reaction to the people around it, to its environment, to its own evolving state. That’s what makes it feel like something is emotionally present with you.<\/p><p>This is where AI changes the game for character design in ways that go well beyond what was possible with Astro. AI-driven adaptation doesn’t require the contextual predictions that we relied on. It learns the specific rhythms, preferences, and emotional context of the people it lives and works with. The character doesn’t just respond to context. It <em><em>grows<\/em><\/em> into it.<\/p><h2>What Industry Is Missing<\/h2><p>The character and soul of the impending wave of embodied AI products appears to almost always be an afterthought. And character defined late is character defined by default. It becomes the sum of a thousand small decisions made by different people thinking about anything but character. People project character onto devices whether you plan for it or not, especially if those devices move—a robot that moves is <em><em>already<\/em><\/em> a character. If nobody has designed this character, the result will be products that feel like nothing, or worse, feel confusing and not trustworthy. Technically impressive, but lifeless.<\/p><p>We did not get this fully right with Astro. So many things were moving in parallel that character was rarely treated as a utility, and it made sense why. When you are building a first-of-its-kind product, the things that are the loudest are the ones that break, the deadlines, the costs, the features a customer can point to on a box. Character is quieter than all of that. It’s easy to assume it can come later. On a team as large as the Amazon Astro team, it’s lucky to get any idea onto the road map when it is competing with a hundred others that all feel more urgent in the moment. None of this came from people not caring. It came from character being the kind of thing that is hard to prioritize until you see what its absence costs you.<\/p><h2>My Asks to Product Leaders<\/h2><p>If you are building a product that will share physical or conversational space with people, three things are worth considering:<\/p><p><strong>Define character before you define interactions.<\/strong> You need a defensible character with enough emotional logic to answer hard questions consistently. Find answers to character questions early, and have every discipline build from the same foundation.<\/p><p><strong>Build story and sound into the character pipeline, not the production pipeline.<\/strong> Story and sound developed alongside character definition has the chance to inform motion, expression, and interaction logic. This requires a different kind of collaboration, and a different kind of hire.<\/p><p><strong>Design for adaptation, not just consistency.<\/strong> A consistent character is necessary, but the products that will matter most in people’s lives are the ones that deepen through use. The infrastructure to support that is more and more accessible, but the design thinking to take advantage of it is still rare.<\/p><div class=\"horizontal-rule\"><\/div><p><em><em>An expanded version of this story is available on <a href=\"https://medium.com/@mikeforstmusic/what-amazons-astro-taught-me-about-giving-ai-a-soul-989fcd9c45f4\" target=\"_blank\">Medium<\/a>.<\/em><\/em><\/p>"}, {"title": "U.S. robotics industry saw double-digit growth in 2025, says IFR", "source": "Robotics Business Review", "date": "2026-06-19", "url": "https://www.therobotreport.com/u-s-robotics-industry-saw-double-digit-growth-in-2025-says-ifr/", "summary": "<p>The IFR said robust growth in the food industry and other non-manufacturing sectors drove this recovery in the U.S. robotics industry.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/u-s-robotics-industry-saw-double-digit-growth-in-2025-says-ifr/\">U.S. robotics industry saw double-digit growth in 2025, says IFR<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Elmo releases new motion controller and servo drives for industrial applications", "source": "Robotics Business Review", "date": "2026-06-19", "url": "https://www.therobotreport.com/elmo-releases-new-motion-controller-servo-drives-industrial-applications/", "summary": "<p>Elmo said its latest products set new benchmarks for power density, expand its existing Platinum line, and introduce the Titanium line.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/elmo-releases-new-motion-controller-servo-drives-industrial-applications/\">Elmo releases new motion controller and servo drives for industrial applications<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Video Friday: Do Robots Even Need Legs?", "source": "IEEE Spectrum Robotics", "date": "2026-06-19", "url": "https://spectrum.ieee.org/video-friday-agentic-ai-robot", "summary": "<img src=\"https://spectrum.ieee.org/media-library/white-service-robot-on-a-square-mobile-base-working-at-a-countertop-in-a-modern-wooden-kitchen.png?id=66959675&amp;width=1245&amp;height=700&amp;coordinates=0%2C0%2C0%2C0\" /><br /><br /><p><span>Video Friday is your weekly selection of awesome robotics videos, collected by your friends at <\/span><em>IEEE Spectrum<\/em><span> robotics. We also post a weekly calendar of upcoming robotics events for the next few months. Please <\/span><a href=\"mailto:automaton@ieee.org?subject=Robotics%20event%20suggestion%20for%20Video%20Friday\">send us your events<\/a><span> for inclusion.<\/span><\/p><h5><a href=\"https://roboticsconference.org/\">RSS 2026<\/a>: 13–17 July 2026, SYDNEY<\/h5><h5><a href=\"https://mrs.fel.cvut.cz/summer-school-2026/\">Summer School on Multi-Robot Systems<\/a>: 29 July–4 August 2026, PRAGUE<\/h5><h5><a href=\"https://actuate.foxglove.dev/\">Actuate 2026<\/a>: 18–19 August 2026, SAN FRANCISCO<\/h5><h5><a href=\"https://2026.ieee-iros.org/\">IROS 2026<\/a>: 27 September–1 October 2026, PITTSBURGH<\/h5><p>Enjoy today’s videos!<\/p><div class=\"horizontal-rule\"><\/div><div><span style=\"display: none;\"> <\/span><\/div><blockquote class=\"rm-anchors\" id=\"zab62_u-a5u\"><em>Eno is our first agentic robot: an AI agent and a general-purpose robot working as one system. It reasons, plans, and acts in the real world. Human in capability, not in form. Every detail with a purpose, reduced to what matters. Designed not to resemble us, but to extend us. Eno is built end to end at Genesis.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.genesis.ai/\">Genesis<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"rhhqoyxvade\"><em>Engineers from NASA’s Jet Propulsion Laboratory are field-testing advanced capabilities for potential future Moon and Mars rovers. In the Colorado Desert near Plaster City, California, teams used a prototype rover called ERNEST (Exploration Rover for Navigating Extreme Sloped Terrain) to test software for a potential <a href=\"https://spectrum.ieee.org/lunar-base-3d-printing\" target=\"_blank\">future long-range lunar mission<\/a>. The software enables the rover, developed at JPL, to operate autonomously and travel extreme distances with minimal intervention from human operators. <\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>ERNEST is a lot more capable than it may look; here’s some recent research showing the kinds of terrain it can handle:<\/p><p class=\"shortcode-media shortcode-media-youtube\"> <span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.jpl.nasa.gov/news/nasa-testing-advanced-capabilities-for-moon-mars-rovers/\">NASA's Jet Propulsion Lab<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"6mzafau1puq\"><em>Table tennis can produce moments that are difficult even for experienced players to anticipate…like when the ball clips the net and suddenly changes direction. For the Ace research project at Sony AI, these events were a key test of the system’s ability to operate reliably in unpredictable real-world conditions. Ace addresses this uncertainty by simulating counterfactual ball trajectories in real time. In the video, the green overlays show these alternative paths the system considers while planning its response.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>And check out some of these rallies that the robot has with Miyuu Khiara.<\/p><p class=\"shortcode-media shortcode-media-youtube\"> <span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://ace.ai.sony/\">Sony AI<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"oilpnumvgve\">This video of an ANYmal deployment in a concrete plant is worth watching because it makes explicit how quadrupeds make money in <a href=\"https://spectrum.ieee.org/north-sea-deployment-shows-how-quadruped-robots-can-be-commercially-useful\" target=\"_blank\">inspection contexts<\/a>: Among other things, “a cracked crusher foundation [was] caught before a week-long shutdown, avoiding roughly $630,000 in lost production.” That pays for a lot of robots.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.anybotics.com/\">ANYbotics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"xcqgxr7efdo\">A lot of interesting footage here from GITAI’s prep for a robotic satellite servicing demo mission. The thruster test-firing isn’t a robot, exactly, but it may be the coolest part.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.prnewswire.com/news-releases/gitai-completes-flight-model-of-s3-robotic-satellite-for-on-orbit-servicing-demonstration-mission-302801614.html\">GITAI<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"ko1cqdbsr_o\">Anyone who’s tried to take a half decent photo underwater knows that it’s basically impossible, so let’s try and teach robots to cope.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://mertcookimg.github.io/bi-aqua/\">Bi-AQUA<\/a> ]<\/p><p>Thanks, Masato!<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"y41op9mupqa\"><em>Handling delicate, irregular or unpredictable objects is one of the hardest problems left in automation, and one of the most important. It’s what’s holding back the next wave of robots from doing more in the real world. That’s why we’re working with PSYONIC on a new approach. Their Ability Hand, worn by hundreds of people every day, captures real-world data on touch, pressure and grip. Our GoFa cobot brings the industrial-grade accuracy and repeatability to turn that human data into reliable robotic performance.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.abb.com/global/en/news/136690/prsrl-abb-robotics-and-psyonic-use-human-generated-data-to-advance-robotic-dexterity\">ABB Robotics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"oiyl5neg4rc\"><em>Sanctuary AI has achieved world-class performance on a complex wire-plugging production task with a global Tier 1 automotive supplier. In this demonstration, Sanctuary AI’s Physical AI successfully performs a high-speed wire-plug insertion task, achieving a validated task success rate of over 99.5% with a cycle time of just 2.54 seconds, meeting live production benchmarks established by the customer.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>WHY IS THIS STRESSING ME OUT SO MUCH?<\/p><p>[ <a href=\"https://sanctuary.ai/\">Sanctuary<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"-kqaschiady\">This video is quite obviously fake, but I suppose maybe there’s a market for extra beefy quadrupeds? Maybe?<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.gotokepler.com/home\">Kepler<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"vypbeg6i6og\">I cannot overstate how much I do not want any robot to look at what I’m wearing and then attempt to sell me things based on what it thinks it can guess about my personality or interests.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.magiclab.top/en/\">MagicLab<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"ylopovulwi8\">I am here for fed-up robots learning how to move boxes by just kicking them.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.ce.cit.tum.de/en/aipd/home/\">ATARI Lab<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"cbwsags8al8\">Ah, yes, very useful and very important robots that make me very uncomfortable.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://ieeexplore.ieee.org/document/11112617\">Paper<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"s67z2aekbri\"><em>I built GrowBot ( a ~6”, two-servo bipedal robot) that runs entirely on a $15 Raspberry Pi Zero 2 W, ~$100 in parts. An LLM drives it directly: it reads the raw IMU stream with no translation layer and narrates its own motion (“rocked side to side like a baby”), riding on a 50-Hz reinforcement-learning walk policy trained in sim and transferred to the real body.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>The idea here is to build an open course around this project, Brit says, “so everyone can experience physical AI right now in a low-risk way.”<\/p><p>[ <a href=\"https://artoftheproblem.com/pages/growbot\">GrowBot<\/a> ]<\/p><p>Thanks, Brit!<\/p><div class=\"horizontal-rule\"><\/div>"}, {"title": "RealSense unveils AI-native D585 Pro depth camera for robots", "source": "Robotics Business Review", "date": "2026-06-18", "url": "https://www.therobotreport.com/realsense-unveils-ai-native-d585-pro-depth-camera-for-robots/", "summary": "<p>The D585 Pro is powered by a proprietary Gen 5 system-on-chip and delivers more than 2x better depth quality than the previous generation of RealSense cameras.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/realsense-unveils-ai-native-d585-pro-depth-camera-for-robots/\">RealSense unveils AI-native D585 Pro depth camera for robots<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Kinova launches KIMA medical robotic arm", "source": "Robotics Business Review", "date": "2026-06-18", "url": "https://www.therobotreport.com/kinova-launches-kima-medical-robotic-arm/", "summary": "<p>Instead of adapting the robot from industrial technology, Kinova said it designed KIMA from the ground up for clinical use.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/kinova-launches-kima-medical-robotic-arm/\">Kinova launches KIMA medical robotic arm<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Microbot Medical to expand veteran access to robotic surgery with LIBERTY", "source": "Robotics Business Review", "date": "2026-06-18", "url": "https://www.therobotreport.com/microbot-medical-expands-veteran-access-robotic-surgery-liberty/", "summary": "<p>Lovell Government Services will become Microbot's service-disabled veteran-owned small business vendor to supply federal programs.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/microbot-medical-expands-veteran-access-robotic-surgery-liberty/\">Microbot Medical to expand veteran access to robotic surgery with LIBERTY<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}], "embeddedNews": [{"title": "The BornHack 2026 Cyber Ægg Is A Badge With A Life Afterwards", "source": "Hackaday", "date": "2026-07-17", "url": "https://hackaday.com/2026/07/17/the-bornhack-2026-cyber-aegg-is-a-badge-with-a-life-afterwards/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"450\" src=\"https://hackaday.com/wp-content/uploads/2026/07/bh2026-featured.jpg?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>A problem facing the designers of event badges is this: what happens to the badge after the event? It&#8217;s one that designers have tried to solve in many ways with <a class=\"read-more\" href=\"https://hackaday.com/2026/07/17/the-bornhack-2026-cyber-aegg-is-a-badge-with-a-life-afterwards/\">&#8230;read more<\/a>"}, {"title": "Hackaday Podcast Episode 378: C Coders, Ceramic Printers, and Shadow Archives", "source": "Hackaday", "date": "2026-07-17", "url": "https://hackaday.com/2026/07/17/hackaday-podcast-episode-378-c-coders-ceramic-printers-and-shadow-archives/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"484\" src=\"https://hackaday.com/wp-content/uploads/2016/05/microphone.jpg?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>It&#8217;s a hot one at both microphones, as Elliot Williams and Kristina Panos wilt in the heat with ice lollies and freezer packs. But still, we persevered long enough to <a class=\"read-more\" href=\"https://hackaday.com/2026/07/17/hackaday-podcast-episode-378-c-coders-ceramic-printers-and-shadow-archives/\">&#8230;read more<\/a>"}, {"title": "MacSurf Hits 2.0 To Bring PowerPCs back Online", "source": "Hackaday", "date": "2026-07-17", "url": "https://hackaday.com/2026/07/17/macsurf-hits-2-0-to-bring-powerpcs-back-online/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"451\" src=\"https://hackaday.com/wp-content/uploads/2026/07/macsurf-1.68-imac-e1784219899544.jpg?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>There&#8217;s an interesting thing about retrocomputing &#8212; the moment that you realize your 25-year-old machine can do almost everything your average person uses a computer for. The problem is that the <a class=\"read-more\" href=\"https://hackaday.com/2026/07/17/macsurf-hits-2-0-to-bring-powerpcs-back-online/\">&#8230;read more<\/a>"}, {"title": "This Week in Security: Another Record Patch Tuesday, LAME is More Secure, Secure Boot is Less Secure, and Milk Malware", "source": "Hackaday", "date": "2026-07-17", "url": "https://hackaday.com/2026/07/17/this-week-in-security-another-record-patch-tuesday-lame-is-more-secure-secure-boot-is-less-secure-and-milk-malware/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"484\" src=\"https://hackaday.com/wp-content/uploads/2016/01/darkarts.jpg?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>Following the reports last week using the Windows Global Device ID (GDID) in tracking a malware operators behavior, here is a comprehensive write-up about what goes into the GDID and <a class=\"read-more\" href=\"https://hackaday.com/2026/07/17/this-week-in-security-another-record-patch-tuesday-lame-is-more-secure-secure-boot-is-less-secure-and-milk-malware/\">&#8230;read more<\/a>"}, {"title": "EU Adds Exemptions to User-Serviceable Batteries Rules", "source": "Hackaday", "date": "2026-07-17", "url": "https://hackaday.com/2026/07/17/eu-adds-exemptions-to-user-serviceable-batteries-rules/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"484\" src=\"https://hackaday.com/wp-content/uploads/2025/10/LithiumAA.jpg?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>Built-in batteries put a timebomb inside devices, with especially the calendar aging feature of Li-ion chemistries setting a hard limit on when you&#8217;ll have to toss the device or figure <a class=\"read-more\" href=\"https://hackaday.com/2026/07/17/eu-adds-exemptions-to-user-serviceable-batteries-rules/\">&#8230;read more<\/a>"}, {"title": "Wireless LCD Streaming for the ANENG AN870 Multimeter", "source": "Hackaday", "date": "2026-07-17", "url": "https://hackaday.com/2026/07/17/wireless-lcd-streaming-for-the-aneng-an870-multimeter/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"485\" src=\"https://hackaday.com/wp-content/uploads/2026/07/airmeter_dmm_installed_aneng_an870_bits_und_bolts_github.jpg?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>Having the information shown on the display of a digital multimeter also recorded off-screen can be incredibly useful, but unless the device exposes something like SCPI on a network interface, <a class=\"read-more\" href=\"https://hackaday.com/2026/07/17/wireless-lcd-streaming-for-the-aneng-an870-multimeter/\">&#8230;read more<\/a>"}, {"title": "A Sloshing-Mercury-Powered Neon Light", "source": "Hackaday", "date": "2026-07-17", "url": "https://hackaday.com/2026/07/16/a-sloshing-mercury-powered-neon-light/", "summary": "<div><img alt=\"A person&#039;s hand is shown holding a glass flask in a dark room. An orange-red glow is emanating from the flask in a patches, forming a splash-like pattern near the base of the flask.\" class=\"attachment-large size-large wp-post-image\" height=\"450\" src=\"https://hackaday.com/wp-content/uploads/2026/07/triboelectric_mercury_lamp.png?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>In 1675, while transporting a barometer by night, the astronomer Jean Picard noticed a glow inside its glass tube, just above the mercury. As the mercury sloshed and splashed across <a class=\"read-more\" href=\"https://hackaday.com/2026/07/16/a-sloshing-mercury-powered-neon-light/\">&#8230;read more<\/a>"}, {"title": "Espressif releases SDK for Aliro smart door locks based on ESP32-C or ESP32-H SoCs", "source": "CNX Software", "date": "2026-07-17", "url": "https://www.cnx-software.com/2026/07/17/espressif-releases-sdk-for-aliro-smart-door-locks-based-on-esp32-c-or-esp32-h-socs/", "summary": "<div><img alt=\"ESP32-C ESP32-H21 Aliro smart lock\" class=\"attachment-medium size-medium wp-post-image\" height=\"429\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/07/ESP32-C-ESP32-H21-Aliro-smart-lock-720x429.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Espressif Systems has just released the SDK for Aliro, designed for smart Matter door locks and other access control solutions built around ESP32-C (WiFi) or ESP32-H (Thread) microcontroller and third-party NFC chips. We recently wrote about the Aliro vendor-agnostic digital access control standard working over NFC, Bluetooth LE, or BLE+UWB. It&#8217;s basically the equivalent of Matter, but for smart locks, instead of the broader Smart Home ecosystem. The ultimate goal is to reduce fragmentation and allow users to use compliant wallets from Google, Apple, Samsung, and others to work with Aliro-compatible devices. Espressif&#8217;s SDK for Aliro (ESP-Aliro) currently supports the following features of Aliro-over-NFC: Standard Expedited Phase Fast Expedited Phase Reader Certificate Sending via AUTH1/LoadCert Command Keyslot to Look up Access Credential Public Key Mailbox of Exchange command Step-up Phase Espressif’s solution currently only works with Aliro NFC for tap-to-unlock applications, although Bluetooth LE and Bluetooth LE + UWB support [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/07/17/espressif-releases-sdk-for-aliro-smart-door-locks-based-on-esp32-c-or-esp32-h-socs/\">Espressif releases SDK for Aliro smart door locks based on ESP32-C or ESP32-H SoCs<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "reCamera Pro “Open AI Camera” supports computer vision, LLM, VLM, STT, and TTS workloads", "source": "CNX Software", "date": "2026-07-17", "url": "https://www.cnx-software.com/2026/07/17/recamera-pro-open-ai-camera-supports-computer-vision-llm-vlm-stt-and-tts-workloads/", "summary": "<div><img alt=\"reCamera Pro RV1126B AI camera\" class=\"attachment-medium size-medium wp-post-image\" height=\"540\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/07/reCamera-Pro-RV1126B-AI-camera-720x540.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Seeed Studio&#8217;s reCamera Pro is an AI camera powered by a Rockchip RV1126B quad-core Cortex-A53 SoC with a 3 TOPS NPU for on-device AI vision, but also large language models (LLMs), vision language models (VLMs), as well as speech-to-text (STT) and text-to-speech (TTS) with built-in audio capabilities. It offers a powerful update to the earlier reCamera modular AI camera based on an SG2002 RISC-V AI SoC, with up to 4GB RAM, 16GB eMMC flash, an 8MP camera sensor supporting up to 4K @ 30 FPS, an M12 lens mount, a built-in 1W speaker, two microphones, Gigabit Ethernet with PoE, dual-band WiFi 5 connectivity, a USB-C port for power and data, and and expansion through a GPIO and MIPI DSI connectors. reCamera Pro specifications: SoC – Rockchip RV1126B CPU – Quad-core Arm Cortex-A53 up to 1.2 GHz with 32KB L1 I-Cache and 32KB L1 D-Cache, unified 512KB L2 Cache MCU &#8211; [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/07/17/recamera-pro-open-ai-camera-supports-computer-vision-llm-vlm-stt-and-tts-workloads/\">reCamera Pro &#8220;Open AI Camera&#8221; supports computer vision, LLM, VLM, STT, and TTS workloads<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "The Protocol Wars in Factories, Nvidia's Thor Modules for Robotics and Edge AI, 'Mind of the Engineer' survey: Embedded Week Insights", "source": "Embedded.com", "date": "2026-07-17", "url": "https://www.embedded.com/the-protocol-wars-in-factories-nvidias-thor-modules-for-robotics-and-edge-ai-mind-of-the-engineer-survey-embedded-week-insights/", "summary": "<p>Here's a roundup of this week's must-read articles. We look into the latest developments on the challenges of using different protocols in factories, Nvidia's latest Thor modules for scalable robotics and edge AI, AI-powered custom test development, the Mind of the Engineer survey, and more. Also, check News Archives - Embedded and Technical Articles Archives - Embedded for the [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/the-protocol-wars-in-factories-nvidias-thor-modules-for-robotics-and-edge-ai-mind-of-the-engineer-survey-embedded-week-insights/\">The Protocol Wars in Factories, Nvidia&#8217;s Thor Modules for Robotics and Edge AI, ‘Mind of the Engineer’ survey: Embedded Week Insights<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "The CMMC Pause: The DoD Suspends Phase 2 Requirements", "source": "Embedded.com", "date": "2026-07-17", "url": "https://www.embedded.com/the-cmmc-pause-the-dod-suspends-phase-2-requirements/", "summary": "<p>What 60 days of review means for the defense industrial base.<\/p>\n<p>The post <a href=\"https://www.embedded.com/the-cmmc-pause-the-dod-suspends-phase-2-requirements/\">The CMMC Pause: The DoD Suspends Phase 2 Requirements<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "Vector Photonics Develops New PCSEL Packaging Technology", "source": "Embedded.com", "date": "2026-07-17", "url": "https://www.embedded.com/vector-photonics-develops-new-pcsel-packaging-technology/", "summary": "<p>Vector Photonics has launched the Accelerated Manufacturing for PCSEL Packaging Solutions (AMPPS) program, an initiative aimed at addressing a key barrier to the commercial adoption of photonic crystal surface-emitting lasers (PCSELs): scalable, thermally efficient device packaging. By adding advanced packaging capabilities to its manufacturing process, the company intends to accelerate the deployment of PCSEL technology [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/vector-photonics-develops-new-pcsel-packaging-technology/\">Vector Photonics Develops New PCSEL Packaging Technology<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "Samtec angled launch connectors for precision RF", "source": "Electronics Weekly", "date": "2026-07-17", "url": "https://www.electronicsweekly.com/news/products/connectors/samtec-angled-launch-connectors-for-precision-rf-2026-07/", "summary": "<p>Samtec is announcing full production availability of its 185-AL series of 1.85 mm 30-degree angled launch board connector (185-AL Series). The angled launch is to allow cables to exit PCBs [&#8230;]<\/p>\n<p>The post <a href=\"https://www.electronicsweekly.com/news/products/connectors/samtec-angled-launch-connectors-for-precision-rf-2026-07/\">Samtec angled launch connectors for precision RF<\/a> appeared first on <a href=\"https://www.electronicsweekly.com\">Electronics Weekly<\/a>.<\/p>"}, {"title": "Tales In Sintr res tips learned from their elders back home in India on how to stay cool in extreme heat for NPR: I know that each of these tips on its own may seem trivial. But as a heat wave researcher, I can tell you that done together, they [&#8230;]"}, {"title": "The Python on Microcontrollers Newsletter: subscribe for free", "source": "Adafruit", "date": "2026-07-17", "url": "https://blog.adafruit.com/2026/07/17/the-python-on-microcontrollers-newsletter-subscribe-for-free-7-18-2/", "summary": "The Python for Microcontrollers Newsletter is the place for the latest news involving Python on hardware (microcontrollers AND single board computers like Raspberry Pi). This ad-free, spam-free weekly email is filled with CircuitPython, MicroPython, and Python information that you may have missed, all in one place! You get a summary of all the software, events, projects, and the latest hardware worldwide once a week, no [&#8230;]"}, {"title": "NEW PRODUCT – NeoPixel Stick – 8 x 5050 WWA White LEDs with Integrated Drivers", "source": "Adafruit", "date": "2026-07-17", "url": "https://blog.adafruit.com/2026/07/17/new-product-neopixel-stick-8-x-5050-wwa-white-leds-with-integrated-drivers/", "summary": "NEW PRODUCT &#8211; NeoPixel Stick &#8211; 8 x 5050 WWA White LEDs with Integrated Drivers __________________________________________________________________________________________________ What is better than smart LEDs? Smart WWA LEDs! These NeoPixel sticks now have 3 white LEDs in them in three tints (also known as &#8216;color temperatures&#8217;): warm white, cool white and amber, great for excellent lighting effects that want pure white [&#8230;]"}, {"title": "The Python on Microcontrollers Newsletter: subscribe for free", "source": "Adafruit", "date": "2026-07-17", "url": "https://blog.adafruit.com/2026/07/17/the-python-on-microcontrollers-newsletter-subscribe-for-free-7-17-2/", "summary": "The Python for Microcontrollers Newsletter is the place for the latest news involving Python on hardware (microcontrollers AND single board computers like Raspberry Pi). This ad-free, spam-free weekly email is filled with CircuitPython, MicroPython, and Python information that you may have missed, all in one place! You get a summary of all the software, events, projects, and the latest hardware worldwide once a week, no [&#8230;]"}, {"title": "ESP8266 NodeMCU Case – Fully Customizable + Ready-to-Print Profiles #3DPrinting #3DThursday", "source": "Adafruit", "date": "2026-07-17", "url": "https://blog.adafruit.com/2026/07/16/esp8266-nodemcu-case-fully-customizable-ready-to-print-profiles-3dprinting-3dthursday/", "summary": "Derek3Rosen shares: A parametric ESP8266 NodeMCU case with in-slicer Customize mode plus multiple ready-to-print profiles. Tight snap fit for the MCU, optional wall-mount ball joint screw hole, and Gap parameters for extra internal room for sensors. Wall thickness, lid thickness, and radius all tunable. Part of the designer&#8217;s 200+ box variations. By Derek download the [&#8230;]"}, {"title": "Securing the Silicon: The Seismic Shift to Hardware Security", "source": "EE Journal", "date": "2026-07-17", "url": "https://www.eejournal.com/fish_fry/securing-the-silicon-the-seismic-shift-to-hardware-security/", "summary": "<img alt=\"\" class=\"webfeedsFeaturedVisual wp-post-image\" height=\"300\" src=\"https://www.eejournal.com/wp-content/uploads/2026/07/AD-071726-300x300.png\" style=\"display: block; margin-bottom: 5px; clear: both;\" width=\"300\" />My podcast guest this week is Jason Oberg from Arteris. Jason and I discuss this profound transition toward hardware security, explore how Cycuity&#8217;s integration into Arteris is changing the game for system-level security and discuss how teams can address the emerging risks in our era of distributed systems, chiplets, and constant data movement. &#160; &#160; &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/fish_fry/securing-the-silicon-the-seismic-shift-to-hardware-security/\">Read More &#8594;<span class=\"screen-reader-text\"> \"Securing the Silicon: The Seismic Shift to Hardware Security\"<\/span><\/a>"}, {"title": "Olimex PICO-EVB automation board adds high-voltage terminals to Raspberry Pi Pico family", "source": "CNX Software", "date": "2026-07-16", "url": "https://www.cnx-software.com/2026/07/17/olimex-pico-evb-automation-board-adds-high-voltage-terminals-to-raspberry-pi-pico-family/", "summary": "<div><img alt=\"Olimex Pico-EVB\" class=\"attachment-medium size-medium wp-post-image\" height=\"600\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/07/Olimex-Pico-EVB-720x600.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Olimex PICO-EVB board for the Raspberry Pi Pico and compatible boards is designed for high-voltage automation with four 3.3-30V DC or 110-220V AC inputs and four 15V DC/220V AC relays. It features two 20-pin headers enabling users to connect their preferred Pi Pico-compatible board, a USB-C port for power and programming, a UEXT connector for I2C, UART, and SPI expansion, and status LEDs for the high-voltage signals. Olimex PICO-EVB specifications: Compatible boards Raspberry Pi Pico, Pico 2, Pico W, Pico 2 W Olimex RP2040-PICO30 USB &#8211; 1x USB Type-C port I/Os 4x 15V DC/240V AC relays 4x optoisolated inputs taking 3.3 &#8211; 30V DC or 110-220V AC UEXT connector with I2C, UART, and SPI signals Unpopulated 18-pin GPIO header Misc 4x status LEDs for the relays 4x status LEDs for the inputs Power Supply &#8211; 5V power supply via screw connector, USB-C port, or Pico&#8217;s micro USB connector Dimensions &#8211; [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/07/17/olimex-pico-evb-automation-board-adds-high-voltage-terminals-to-raspberry-pi-pico-family/\">Olimex PICO-EVB automation board adds high-voltage terminals to Raspberry Pi Pico family<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "pico-usb-wifi firmware converts the Raspberry Pi Pico W into a driverless USB WiFi adapter", "source": "CNX Software", "date": "2026-07-16", "url": "https://www.cnx-software.com/2026/07/16/pico-usb-wifi-converts-the-raspberry-pi-pico-w-into-a-driverless-usb-wifi-adapter/", "summary": "<div><img alt=\"raspberrypi pico usb wifi adapter\" class=\"attachment-medium size-medium wp-post-image\" height=\"393\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/07/raspberrypi-pico-usb-wifi-adapter-720x393.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>pico-usb-wifi is an open-source firmware project that converts the Raspberry Pi Pico W into a driverless USB WiFi adapter that works with Windows, Linux, macOS, and other operating systems with USB CDC-NCM support. The Infineon CYW43439 chip found in the SBC can&#8217;t be used directly as a USB to WiFi bridge, and instead, the firmware implements a transparent Layer-2 bridge between the Pico W’s wireless module and USB interfaces. It basically works as an Ethernet to WiFi gateway/bridge, which exposes an Ethernet connection through USB (aka USB gadget mode) used to route Wi-Fi packets from the network. pico-usb-wifi highlights: Transparent Layer-2 Bridging between the Pico W’s wireless and USB interfaces Exposed as a USB CDC-NCM device IPv4 and IPv6 with no NAT, no private subnet, and no port-forwarding to configure Out-of-band management and debug consoles over CDC-ACM serial WPA2-PSK and WPA3-SAE authentication (and open networks) Throughput &#8211; Average 4.75 Mbits/sec; [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/07/16/pico-usb-wifi-converts-the-raspberry-pi-pico-w-into-a-driverless-usb-wifi-adapter/\">pico-usb-wifi firmware converts the Raspberry Pi Pico W into a driverless USB WiFi adapter<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "OpenInfrared Point is an ESP32-S3 powered universal remote hub with Infrared, BLE, NFC, audio streaming (Crowdfunding)", "source": "CNX Software", "date": "2026-07-16", "url": "https://www.cnx-software.com/2026/07/16/openinfrared-point-esp32-s3-universal-remote-hub-infrared-ble-nfc-audio-streaming/", "summary": "<div><img alt=\"OpenInfrared Point Universal Remote Hub\" class=\"attachment-medium size-medium wp-post-image\" height=\"480\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/07/OpenInfrared-Point-Universal-Remote-Hub-720x480.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>OpenInfrared Point is a universal remote hub built around ESP32-S3 that lets users control compatible devices from a smartphone by scanning a QR code or tapping an NFC tag, eliminating the need for dedicated remote controls. Powered via USB-C, the Point hub can learn IR codes from existing remote controls and supports infrared, IP (HTTP), and Bluetooth Low Energy (BLE) device control, with RF support planned as a future add-on. Hardware features include an IR output for external emitters, an audio input for private TV audio streaming, built-in NFC, QR-code access, and support for controlling TVs, projectors, AV receivers, air conditioners, streaming devices, and other compatible equipment. OpenInfrared Point specifications: Wireless Module – ESP32-S3-WROOM-1 SoC – Espressif Systems ESP32-S3 CPU – Dual-core Tensilica LX7 up to 240 MHz with vector extension for AI/ML workloads RAM – 512KB SRAM; 8MB PSRAM Wireless – WiFi 4 and Bluetooth LE 5 Storage – 16MB [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/07/16/openinfrared-point-esp32-s3-universal-remote-hub-infrared-ble-nfc-audio-streaming/\">OpenInfrared Point is an ESP32-S3 powered universal remote hub with Infrared, BLE, NFC, audio streaming (Crowdfunding)<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "NVIDIA launches smaller, mainstream Jetson T2000 and T3000 modules for Edge AI and robotics applications", "source": "CNX Software", "date": "2026-07-16", "url": "https://www.cnx-software.com/2026/07/16/nvidia-jetson-t2000-and-t3000-modules-for-edge-ai-and-robotics-applications/", "summary": "<div><img alt=\"NVIDIA Jetson Thor T2000 T3000\" class=\"attachment-medium size-medium wp-post-image\" height=\"383\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/07/NVIDIA-Jetson-Thor-T2000-T3000-720x383.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>NVIDIA has just launched the Jetson T2000 and T3000 &#8220;mainstream&#8221; modules as smaller and lower cost options to the Jetson T4000/T5000 modules introduced last year for Edge AI and robotics applications. The Jetson Thor T3000 and the industrial version IGX Thor T3000, which adds functional safety, both deliver up to 865 FP4 TFLOPS of AI compute. They feature a 1536-core NVIDIA Blackwell GPU, an eight-core Neoverse Arm CPU, 32GB of LPDDR5X memory with 273GB/s bandwidth, and 25 GbE connectivity. The Jetson Thor T2000 delivers up to 400 TFLOPS of AI performance, features a 1024-core Blackwell GPU, 16GB LPDDR5 with 137GB/s bandwidth, and 10 GbE networking. Both are about half the size of the Jetson T4000/T5000 modules. Here&#8217;s a preliminary comparison between the Jetson Thor T2000, T3000, T4000, and T5000 modules. It&#8217;s preliminary because, as I write this article, NVIDIA has yet to provide the full specifications for the new T2000 and [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/07/16/nvidia-jetson-t2000-and-t3000-modules-for-edge-ai-and-robotics-applications/\">NVIDIA launches smaller, mainstream Jetson T2000 and T3000 modules for Edge AI and robotics applications<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "The Protocol Wars: The Factory Floor's Fragmentation Problem", "source": "Embedded.com", "date": "2026-07-16", "url": "https://www.embedded.com/the-protocol-wars-the-factory-floors-fragmentation-problem/", "summary": "<p>By consolidating PLC monitoring into a single platform, factories can detect and resolve issues faster, while improving efficiency.<\/p>\n<p>The post <a href=\"https://www.embedded.com/the-protocol-wars-the-factory-floors-fragmentation-problem/\">The Protocol Wars: The Factory Floor’s Fragmentation Problem<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "The Electronics Weekly website is redesigned!", "source": "Electronics Weekly", "date": "2026-07-16", "url": "https://www.electronicsweekly.com/news/the-electronics-weekly-website-is-redesigned-2026-07/", "summary": "<p>Yes, you&#8217;ve come to the right website, the new-look ElectronicsWeekly.com. We&#8217;ve updated our design to better reflect and present the latest industry content we are providing. Essentially, we are making [&#8230;]<\/p>\n<p>The post <a href=\"https://www.electronicsweekly.com/news/the-electronics-weekly-website-is-redesigned-2026-07/\">The Electronics Weekly website is redesigned!<\/a> appeared first on <a href=\"https://www.electronicsweekly.com\">Electronics Weekly<\/a>.<\/p>"}, {"title": "Mushroom LED Lamp #3DThursday #3DPrinting", "source": "Adafruit", "date": "2026-07-16", "url": "https://blog.adafruit.com/2026/07/16/mushroom-led-lamp-3dthursday-3dprinting/", "summary": "Shared by Maxx Design on MakerWorld: A cozy mushroom-shaped lamp supporting three light sources: Bambu LED Lamp Kit, RGBW Puck Lights, and standard tea lights. Print cap with or without dots (AMS or glue-in slot alignment). All parts modular and screw together — no glue needed for the base. Includes matching mini version. Download the [&#8230;]"}, {"title": "Digital Multimeter/Oscilloscope Probe Holder – 2020 Extrusion Mount #3DPrinting #3DThursday", "source": "Adafruit", "date": "2026-07-16", "url": "https://blog.adafruit.com/2026/07/16/digital-multimeter-oscilloscope-probe-holder-2020-extrusion-mount-3dprinting-3dthursday/", "summary": "MarkHarris shares: A workspace organizer that securely holds oscilloscope and multimeter probes on 2020 aluminum extrusion. Universal multimeter probe holder plus a Rigol-specific oscilloscope holder. Wrap the probe around the spool, drop it in — no more tangled probes on the bench. By Mark Harris download the files on: https://makerworld.com/en/models/227047-digital-multimeter-oscilloscope-probe-holder-for-2 Every Thursday is #3dthursday here [&#8230;]"}, {"title": "Arduino Nano Snap-fit Case #3DThursday #3DPrinting", "source": "Adafruit", "date": "2026-07-16", "url": "https://blog.adafruit.com/2026/07/16/arduino-nano-snap-fit-case-3dthursday-3dprinting/", "summary": "Shared by Brim Reaper on MakerWorld: A clean snap-fit case for the Arduino Nano. Simple, no-frills protection for one of the most popular starter boards, perfect for tidying up your maker bench or project prototypes. Download the files and learn more Every Thursday is #3dthursday here at Adafruit! The DIY 3D printing community has passion [&#8230;]"}, {"title": "EMIS Advanced Single Phase and Three Phase Common Mode Facility Power Line Filters", "source": "EE Journal", "date": "2026-07-16", "url": "https://www.eejournal.com/industry_news/emis-advanced-single-phase-and-three-phase-common-mode-facility-power-line-filters/", "summary": "Global EMC solutions provider EMIS  introduces the SMF911 and TMF911 series of Single Phase and Three Phase Common Mode Facility Power Line Filters, engineered to provide exceptional electromagnetic interference (EMI) and radio frequency interference (RFI) suppression for industrial, commercial, defence and mission-critical power installations. Designed to ensure the reliable operation of sensitive electronic equipment, the SMF911 (Single &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/emis-advanced-single-phase-and-three-phase-common-mode-facility-power-line-filters/\">Read More &#8594;<span class
