ww.embedded.com/sensibel-launches-84-dba-snr-optical-mems-microphone/\">SensiBel Launches 84-dBA SNR Optical MEMS Microphone<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "Building an Upgrade Path for Safety-Critical Aerospace Computing", "source": "Embedded.com", "date": "2026-08-31", "url": "https://www.embedded.com/building-an-upgrade-path-for-safety-critical-aerospace-computing/", "summary": "<p>Avionic systems are expected to operate for decades. But the processors inside them have much shorter lifecycles. This creates an expensive problem for avionics engineers because replacing the processor may also force changes to the surrounding computing hardware and software. For instance, advanced drones and autonomous aerial systems need more computing power for perception, sensor [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/building-an-upgrade-path-for-safety-critical-aerospace-computing/\">Building an Upgrade Path for Safety-Critical Aerospace Computing<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "Fujitsu establishes cyber defense lifecycle strategy for AI era", "source": "EE Journal", "date": "2026-08-31", "url": "https://www.eejournal.com/industry_news/fujitsu-establishes-cyber-defense-lifecycle-strategy-for-ai-era/", "summary": "Fujitsu Limited today announced the establishment of a cybersecurity strategy to continuously evolve corporate cyber defense capabilities in response to the advancement of generative AI and the increasing complexity of enterprise systems. This strategy implements cybersecurity not merely as an operational measure after IT system construction, but as a cyber defense lifecycle that encompasses strategic &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/fujitsu-establishes-cyber-defense-lifecycle-strategy-for-ai-era/\">Read More &#8594;<span class=\"screen-reader-text\"> \"Fujitsu establishes cyber defense lifecycle strategy for AI era\"<\/span><\/a>"}, {"title": "Syslogic Announces New AI-Enabled Embedded Computers", "source": "EE Journal", "date": "2026-08-31", "url": "https://www.eejournal.com/industry_news/syslogic-announces-new-ai-enabled-embedded-computers/", "summary": "With the Jetson Orin Nano 2, NVIDIA is introducing the second generation of its compact edge AI module. The new SoM (system-on-module) delivers twice the inference performance of its predecessor while consuming 40 percent less power at the same performance level. Embedded computing specialist Syslogic is announcing several rugged embedded computers based on the Jetson &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/syslogic-announces-new-ai-enabled-embedded-computers/\">Read More &#8594;<span class=\"screen-reader-text\"> \"Syslogic Announces New AI-Enabled Embedded Computers\"<\/span><\/a>"}, {"title": "Aetina Launches MegaEdge AIP-RQ87 2U Edge AI System for Private LLMs, AI Agents and Intelligent Automation", "source": "EE Journal", "date": "2026-08-31", "url": "https://www.eejournal.com/industry_news/aetina-launches-megaedge-aip-rq87-2u-edge-ai-system-for-private-llms-ai-agents-and-intelligent-automation/", "summary": "Aetina Corporation, a leading provider of edge AI solutions and accelerator of edge AI infrastructure, today announced the launch of MegaEdge AIP-RQ87, a ready-to-deploy 2U edge agentic AI system designed to help enterprises and system integrators (SIs) rapidly implement AI agent, private LLM, RAG application, multimodal AI, and AI-driven intelligent automation. Powered by Intel® Core™ &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/aetina-launches-megaedge-aip-rq87-2u-edge-ai-system-for-private-llms-ai-agents-and-intelligent-automation/\">Read More &#8594;<span class=\"screen-reader-text\"> \"Aetina Launches MegaEdge AIP-RQ87 2U Edge AI System for Private LLMs, AI Agents and Intelligent Automation\"<\/span><\/a>"}, {"title": "Renesas Establishes Physical AI & Robotics Lab in Beijing to Accelerate Next-Generation Robotics Innovation", "source": "EE Journal", "date": "2026-08-31", "url": "https://www.eejournal.com/industry_news/renesas-establishes-physical-ai-robotics-lab-in-beijing-to-accelerate-next-generation-robotics-innovation/", "summary": "Renesas Electronics Corporation (TSE: 6723), a premier supplier of advanced semiconductor solutions, today announced the official opening of its Physical AI &#38; Robotics Lab in Beijing, China. The new dedicated facility will enable customers to demonstrate, validate and jointly develop next-generation robotic systems and serve as a hub for executing Renesas’ physical AI strategy from proof-of-concept to deployment at scale. &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/renesas-establishes-physical-ai-robotics-lab-in-beijing-to-accelerate-next-generation-robotics-innovation/\">Read More &#8594;<span class=\"screen-reader-text\"> \"Renesas Establishes Physical AI &#038; Robotics Lab in Beijing to Accelerate Next-Generation Robotics Innovation\"<\/span><\/a>"}, {"title": "AIR Partners with Elmo Motion Control to Enhance Uncrewed Cargo Aircraft Platform", "source": "EE Journal", "date": "2026-08-31", "url": "https://www.eejournal.com/industry_news/air-partners-with-elmo-motion-control-to-enhance-uncrewed-cargo-aircraft-platform/", "summary": "AIR, the leading manufacturer and developer of Smart Aircraft, today announced a strategic partnership with Elmo Motion Control (Elmo), a global leader in motion control technology. Elmo will integrate high-performance motion control solution into AIR’s Heavy Lift UAS – a VTOL-capable uncrewed cargo aircraft capable of 550lb payloads. The partnership brings together Elmo’s compact, high-power density servo &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/air-partners-with-elmo-motion-control-to-enhance-uncrewed-cargo-aircraft-platform/\">Read More &#8594;<span class=\"screen-reader-text\"> \"AIR Partners with Elmo Motion Control to Enhance Uncrewed Cargo Aircraft Platform\"<\/span><\/a>"}, {"title": "Radxa Linkr – A USB drive-sized IP KVM with USB-C, Ethernet, and WiFi support", "source": "CNX Software", "date": "2026-08-30", "url": "https://www.cnx-software.com/2026/08/30/radxa-linkr-a-usb-drive-sized-ip-kvm-with-usb-c-ethernet-and-wifi-support/", "summary": "<div><img alt=\"Radxa Linkr IP KVM\" class=\"attachment-medium size-medium wp-post-image\" height=\"424\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/08/Radxa-Linkr-IP-KVM-720x424.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Radxa Linkr is a compact, USB flash drive-sized IP KVM that connects to the target through HDMI and USB for video, keyboard, and mouse emulation. The user can control it over USB-C, Ethernet, or WiFi client/access point, even before the OS is booted. The device does not require any specific apps, since all you need is a web browser. The company also highlights support for Tailscale VPN, two-factor authentication, and  AI agents such as OpenClaw and Hermes. Radxa Linkr specifications: SoC – Rockchip RV1106G3 CPU – Arm Cortex A7 @ 1.2GHz with an integrated RISC-V co-processor. NPU – 1 TOPS 4th-gen Rockchip NPU with hybrid quantization (int4, int8, int16) ISP – 3rd-gen 5MP high-performance ISP VPU – 3072×1728 (5MP) @ 30fps H.265/H.264 encoding, 16MP @ 60FPS JPEG snapshot System Memory –  256MB DDR3L on-chip memory Storage for OS and virtual media images Optional 16 GB eMMC flash MicroSD card slot Display Input &#8211; [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/08/30/radxa-linkr-a-usb-drive-sized-ip-kvm-with-usb-c-ethernet-and-wifi-support/\">Radxa Linkr &#8211; A USB drive-sized IP KVM with USB-C, Ethernet, and WiFi support<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "ACEMAGIC Kron Mini K5 (Core 3 304) review – Part 1: Specifications, unboxing, teardown, and first boot", "source": "CNX Software", "date": "2026-08-29", "url": "https://www.cnx-software.com/2026/08/29/acemagic-kron-mini-k5-core-3-304-review-part-1-specifications-unboxing-teardown-and-first-boot/", "summary": "<div><img alt=\"ACEMAGIC Kron Mini K5 Intel Core 3 304 unboxing review\" class=\"attachment-medium size-medium wp-post-image\" height=\"479\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/08/ACEMAGIC-Kron-Mini-K5-Intel-Core-3-304-unboxing-review-720x479.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>ACEMAGIC sent us a sample of the Kron Mini K5 Wildcat Lake mini PC for review. The computer is offered with either an Intel Core 3 304 or Core 5 320 CPU, and features triple display output, 2.5GbE and WiFi 6 networking, and several USB ports, but, interestingly, no Thunderbolt/USB4 ports. The company provided us with the entry-level variant pairing an Intel Core 3 304 penta-core processor with 12GB of RAM and 512GB of storage. In this first part of the review, we&#8217;ll list the mini PC&#8217;s specifications, go through an unboxing and a teardown, before booting it into Windows 11. In the next parts, we&#8217;ll review it using Windows 11 and Ubuntu 26.04 in depth with feature testing and benchmarks. ACEMAGIC Kron Mini K5 (Intel Core 3 304) specifications The company hasn&#8217;t put up a product page for this exact model just yet, so we gathered specifications from our [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/08/29/acemagic-kron-mini-k5-core-3-304-review-part-1-specifications-unboxing-teardown-and-first-boot/\">ACEMAGIC Kron Mini K5 (Core 3 304) review &#8211; Part 1: Specifications, unboxing, teardown, and first boot<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Embedded Systems Runtime Observability, Sensor Fusion for Drones, Embedded Design for Mil/Aero: Embedded Week Insights", "source": "Embedded.com", "date": "2026-08-28", "url": "https://www.embedded.com/embedded-systems-runtime-observability-sensor-fusion-for-drones-embedded-design-for-mil-aero-embedded-week-insights/", "summary": "<p>Here's a roundup of this week's must-read articles. We cover the latest developments on why embedded teams require runtime observability, sensor fusion for drones, and embedded systems design for aerospace and defense. Also, check News Archives - Embedded and Technical Articles Archives - Embedded for the complete list of news and articles from our website. NEWS RAIN Alliance Launches [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/embedded-systems-runtime-observability-sensor-fusion-for-drones-embedded-design-for-mil-aero-embedded-week-insights/\">Embedded Systems Runtime Observability, Sensor Fusion for Drones, Embedded Design for Mil/Aero: Embedded Week Insights<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "Seco Introduces SMARC Module for Industrial Edge AI", "source": "Embedded.com", "date": "2026-08-28", "url": "https://www.embedded.com/seco-introduces-smarc-module-for-industrial-edge-ai/", "summary": "<p>Seco has announced the SOM-SMARC-Dragonwing-IQ8, a SMARC Rel. 2.1.1 system-on-module (SOM) designed to help OEMs transition from Arduino-based prototyping to production-oriented industrial edge AI systems. Early hardware samples are available to select customers and partners for evaluation of AI-enabled robotics, smart machines, industrial vision, human-machine interfaces (HMIs), and machine-control applications. The module is based on [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/seco-introduces-smarc-module-for-industrial-edge-ai/\">Seco Introduces SMARC Module for Industrial Edge AI<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "FSP Launches Next-Gen 3200W CRPS Power Solutions to Fully Power AI Edge and Next-Generation Data Centers", "source": "EE Journal", "date": "2026-08-28", "url": "https://www.eejournal.com/industry_news/fsp-launches-next-gen-3200w-crps-power-solutions-to-fully-power-ai-edge-and-next-generation-data-centers/", "summary": "FSP Group, a global leading power supply manufacturer, leverages its deep R&#38;D capabilities and forward-looking insights into computing architectures to announce two new 3200W Common Redundant Power Supply (CRPS) modules: the FSP3200-20HM (12V output) and FSP3200-21HE (54V output). Designed specifically for next-generation data centers, edge AI servers, and high-density workstations, FSP&#8217;s dual-voltage architecture (12V &#38; &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/fsp-launches-next-gen-3200w-crps-power-solutions-to-fully-power-ai-edge-and-next-generation-data-centers/\">Read More &#8594;<span class=\"screen-reader-text\"> \"FSP Launches Next-Gen 3200W CRPS Power Solutions to Fully Power AI Edge and Next-Generation Data Centers\"<\/span><\/a>"}, {"title": "OMC introduces new high-performance laboratory-grade polish finish for its industrial fibre optic cables", "source": "EE Journal", "date": "2026-08-28", "url": "https://www.eejournal.com/industry_news/omc-introduces-new-high-performance-laboratory-grade-polish-finish-for-its-industrial-fibre-optic-cables/", "summary": "OMC, a pioneer in optoelectronics design &#38; manufacture, has introduced a new ultra-performance laboratory-grade polish finish for its industrial fibre optic cables and datalinks, designed to serve the most demanding applications. The use of a combination of highly skilled human operators and custom-trained, calibrated and tooled cobots has enabled a new, unprecedented quality of finish to be &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/omc-introduces-new-high-performance-laboratory-grade-polish-finish-for-its-industrial-fibre-optic-cables/\">Read More &#8594;<span class=\"screen-reader-text\"> \"OMC introduces new high-performance laboratory-grade polish finish for its industrial fibre optic cables\"<\/span><\/a>"}, {"title": "STL takes a major leap towards Decarbonisation; enabling Eco-friendly product portfolio by transitioning to 100% ‘Green power’", "source": "EE Journal", "date": "2026-08-28", "url": "https://www.eejournal.com/industry_news/stl-takes-a-major-leap-towards-decarbonisation-enabling-eco-friendly-product-portfolio-by-transitioning-to-100-green-power/", "summary": "Reduction of ~80% carbon emission for G.657.A2 Fibre to 0.9 Kg from 4.7Kg Transition of key manufacturing facilities in India to 100% ‘Green Power’ energy source Shift to 100% Green Hydrogen manufacturing in India  STL [NSE: STLTECH], a leading connectivity solutions provider for AI-ready digital infrastructure, today announced significant progress on its journey towards decarbonisation and its Net-Zero ambitions. Transitioning to 100% Green Power &#8211; STL, recently, has moved &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/stl-takes-a-major-leap-towards-decarbonisation-enabling-eco-friendly-product-portfolio-by-transitioning-to-100-green-power/\">Read More &#8594;<span class=\"screen-reader-text\"> \"STL takes a major leap towards Decarbonisation; enabling Eco-friendly product portfolio by transitioning to 100% ‘Green power’\"<\/span><\/a>"}, {"title": "From Lab to Battlefield: Navigating Hardware, TRLs, and the Edge in Defense", "source": "EE Journal", "date": "2026-08-28", "url": "https://www.eejournal.com/fish_fry/from-lab-to-battlefield-navigating-hardware-trls-and-the-edge-in-defense/", "summary": "<img alt=\"\" class=\"webfeedsFeaturedVisual wp-post-image\" height=\"300\" src=\"https://www.eejournal.com/wp-content/uploads/2026/08/AD-082826-300x300.jpg\" style=\"display: block; margin-bottom: 5px; clear: both;\" width=\"300\" />My podcast guest this week is David Jedynak, Vice President of Strategic Planning at Curtiss-Wright Defense Solutions. David and I chat about the complexities of &#8220;New Defense&#8221; innovation and what founders must understand about translating tech to the tactical environment. We also examine the similarities and differences between the defense sector and the tech industry &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/fish_fry/from-lab-to-battlefield-navigating-hardware-trls-and-the-edge-in-defense/\">Read More &#8594;<span class=\"screen-reader-text\"> \"From Lab to Battlefield: Navigating Hardware, TRLs, and the Edge in Defense\"<\/span><\/a>"}, {"title": "Engineering Embedded Systems for Aerospace and Defense", "source": "Embedded.com", "date": "2026-08-27", "url": "https://www.embedded.com/engineering-embedded-systems-for-aerospace-and-defense/", "summary": "<p>For years, electronics for military and aerospace applications have been built around hardware that could tolerate harsh environments far beyond those encountered by commercial and industrial machinery. Such systems include satellites, planetary rovers, combat vehicles, naval platforms, avionics, and electronic warfare equipment. Ruggedized packaging, military-grade components, and rigorous qualification testing ensured that systems remained operational [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/engineering-embedded-systems-for-aerospace-and-defense/\">Engineering Embedded Systems for Aerospace and Defense<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "RAIN Alliance Launches RFID Sensor Working Group", "source": "Embedded.com", "date": "2026-08-27", "url": "https://www.embedded.com/rain-alliance-launches-rfid-sensor-working-group/", "summary": "<p>The RAIN Alliance has established a new RFID Sensor Working Group to support the development and adoption of sensor-enabled RAIN RFID technologies. The group will bring together technology providers, end users, and industry stakeholders to address emerging applications, deployment challenges, and standards requirements across industrial IoT, asset management, and digital product passport (DPP) use cases. [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/rain-alliance-launches-rfid-sensor-working-group/\">RAIN Alliance Launches RFID Sensor Working Group<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "Infineon supplies silicon carbide technology to Fox ESS, enhancing efficiency of residential energy storage systems", "source": "EE Journal", "date": "2026-08-27", "url": "https://www.eejournal.com/industry_news/infineon-supplies-silicon-carbide-technology-to-fox-ess-enhancing-efficiency-of-residential-energy-storage-systems/", "summary": "Infineon Technologies AG (FSE: IFX / OTCQX: IFNNY) supplies silicon carbide (SiC) power semiconductors to Fox ESS, a leading provider of renewable energy solutions, to enhance the efficiency of its residential energy storage systems (ESS). Leveraging Infineon&#8217;s CoolSiC™ MOSFETs 1200 V G2 in the Q-DPAK package, Fox ESS has reduced switching losses by 70 percent. &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/infineon-supplies-silicon-carbide-technology-to-fox-ess-enhancing-efficiency-of-residential-energy-storage-systems/\">Read More &#8594;<span class=\"screen-reader-text\"> \"Infineon supplies silicon carbide technology to Fox ESS, enhancing efficiency of residential energy storage systems\"<\/span><\/a>"}], "papers": [{"title": "SolarWM: Open Data and Scalable Training for Long-Horizon Video World Models", "authors": ["Junchao Huang", "Guian Fang", "Shengju Qian", "Xianghao Kong", "Zhuoran Zhao", "Wei Huang", "Yihua Du", "Zixin Zhang", "Justin Cui", "Yuchao Gu", "Yukang Chen", "Xinting Hu", "Tianyu He", "Shaoshuai Shi", "Zhuotao Tian", "Xin Wang", "Mike Zheng Shou", "Li Jiang"], "published": "2026-09-02", "summary": "We introduce SolarWM, a fully open foundation for building interactive video world models from data preparation through long-horizon inference. Training across heterogeneous data sources and video backbones is challenging: datasets differ in temporal scale, camera geometry, visual quality, motion, and captioning styles, while video generators use distinct representations and architectures. Naive data mixing and model-specific implementations therefore produce inconsistent supervision and make results difficult to reproduce and compare. SolarWM addresses this coupling with a reconfigurable multi-source data engine and a backbone-native adaptation framework. The engine converts 1.43 million canonical clips from 10 datasets into a unified, frame-aligned contract covering visual observations, metric camera geometry, captions, quality metadata, selection decisions, and provenance, while decoupling source processing from mixture construction. Under shared camera-conditioning, training, and inference interfaces, we instantiate four 5B--33B models based on Wan2.2, LTX-2.5, and MiniMax-H3 while preserving their native representations and objectives. A unified three-stage recipe combines bidirectional adaptation, teacher-forced autoregressive initialization, and distribution matching distillation. The resulting causal models enable real-time interaction over rollouts ranging from minutes to hours after being trained on only 5s sequences. By releasing the resulting data, pipeline, recipes, weights, and framework, SolarWM provides a reproducible and extensible foundation for interactive world-model research.", "pdf_url": "https://arxiv.org/pdf/2609.02886v1"}, {"title": "Discriminative World Models for Web Agents", "authors": ["Kelvin Li", "Dhruv Pendharkar", "Anish Pahilajani", "Chuyi Shang", "Leon Oks", "Leonid Karlinsky", "Rogerio Feris", "Trevor Darrell", "Roei Herzig"], "published": "2026-09-02", "summary": "Recent web agents use world models for test-time action selection by sampling candidate actions, predicting the resulting web states, and ranking them with a ranker model or a Process Reward Model (PRM). These world models are typically trained via supervised next-state prediction to generate fixed representations like HTML or AXTree snapshots. However, this objective is misaligned with the downstream ranker, which relies on predicted states being discriminative across candidates to accurately score them. To address this, we introduce predicted-state matching, a training objective where the predicted representation must distinguish the true resulting state from those reached by alternative actions. We train these models using a branching web-agent dataset derived from WebArena Go-Browse trajectories, where every decision point contains multiple alternative actions and their resulting states. Experiments on our held-out predicted-state matching benchmark show that our approach outperforms world models trained with supervised next-state prediction. We further show that our approach improves PRM-style action ranking on WebPRMBench compared with action-only PRMs and PRMs augmented with supervised-next-state world models. Finally, on WebArena-Lite, using our world model for test-time action selection improves end-to-end task success. Our project page is available at: https://dhruvpendharkar.github.io/dwm/.", "pdf_url": "https://arxiv.org/pdf/2609.02885v1"}, {"title": "Towards Trustworthy Autonomous Robots: An Explainable AI-Based Decision Framework", "authors": ["Cagri Temel"], "published": "2026-09-02", "summary": "Autonomous robots powered by deep learning face a fundamental auditability challenge: when incidents occur, investigators cannot reconstruct why the system made specific decisions. This paper presents TRACE (Transparent Reasoning Architecture for Credible Execution), a decision framework that ensures every autonomous action can be traced back to sensor evidence through documented causal chains. The framework organizes decision-making into four auditable layers: Semantic Perception for evidence-grounded entity recognition, Belief Reasoning for probabilistic state estimation with causal graphs, Action Synthesis for constraint-aware planning with counterfactual documentation, and Execution Verification for compliance monitoring. TRACE is model-agnostic yet designed to integrate learning-based perception modules (CNNs, transformers) while preserving decision-level auditability. We evaluate the framework using three objective metrics: Evidence Traceability (sensor-to-decision linkage), Decision Reconstructability (post-hoc analysis capability), and Temporal Continuity (audit trail completeness). Experimental evaluation on warehouse robot navigation demonstrates that TRACE achieves 98.6% evidence traceability, 99.0% temporal continuity, and 98.1% decision reconstructability across 500 simulated decision cycles. Post-hoc methods like LIME provide feature attributions but lack the artifact structure needed for decision-level reconstruction. The framework addresses EU AI Act requirements for high-risk system transparency and contributes to Explainable AI for safety-critical autonomous systems.", "pdf_url": "https://arxiv.org/pdf/2609.02861v1"}, {"title": "Efficient All-in-One Weather Restoration using Spectral Harmonization", "authors": ["Paula Garrido-Mellado", "Daniel Feijoo", "Yuning Cui", "Alvaro Garcia", "Marcos V. Conde"], "published": "2026-09-02", "summary": "Adverse weather conditions such as rain, haze, and snow significantly degrade image quality, posing challenges for both human perception and physical AI. Existing restoration methods require large computational budgets, struggling to process high-resolution images and handle different degradations. In this paper, we present Frequency Reconstruction via Spectral Harmonization, a novel lightweight all-in-one restoration method that explicitly decomposes feature representations into high- and low-frequency components at each scale of a hierarchical encoder-decoder architecture. By combining spectral decomposition with spatial processing through Fourier-based skip connections, FReSH-IR captures complementary frequency information without sacrificing spatial detail. Our approach achieves similar restoration quality with 80% fewer parameters and operations than transformer-based models. Extensive experiments demonstrate that our method offers a great efficiency-performance trade-off, highlighting its practical applications in constrained-resource systems.", "pdf_url": "https://arxiv.org/pdf/2609.02839v1"}, {"title": "Toward Robust LiDAR Semantic Segmentation for Real-World Deployment: Evaluation under Coarse Labels, Adverse Conditions, and Domain Shifts", "authors": ["Samir Abou Haidar", "Alexandre Chariot", "Mehdi Darouich", "Cyril Joly", "Jean-Emmanuel Deschaud"], "published": "2026-09-02", "summary": "LiDAR-based semantic segmentation is a core perception module for autonomous vehicles and mobile robots. Despite the strong performance of recent state-of-the-art methods on standard benchmarks, existing evaluation protocols remain focused on clean, single-domain settings and fine-grained label taxonomies, leaving deployment readiness largely unassessed. Real-world systems must handle safety-critical label semantics, degraded sensing conditions, and cross-domain variability, yet no unified protocol currently addresses all three aspects together. In this paper, we propose a structured evaluation protocol that assesses the deployment readiness of LiDAR semantic segmentation models along three complementary dimensions: (i) coarse-label evaluation aligned with autonomous driving safety priorities, revealing how label granularity affects different methods; (ii) robustness under eight types of LiDAR corruptions designed to emulate real-world atmospheric, geometric, and sensor degradations; and (iii) domain generalization across datasets without adaptation. The evaluation includes inference speed measured on an embedded Jetson AGX Orin platform, directly reflecting deployment constraints. Our results show that fine-grained benchmark rankings do not always reflect safety-relevant performance, that all methods experience substantial degradation under corruptions with architecture-dependent robustness characteristics, and that current domain generalization remains insufficient for reliable deployment. These findings expose concrete gaps between benchmark performance and deployment readiness, and provide a reference protocol for more practically grounded evaluation of LiDAR semantic segmentation.", "pdf_url": "https://arxiv.org/pdf/2609.02830v1"}, {"title": "Do Better Imagined Rollouts Mean Better Robot Control? A Controlled Study of World-Model Evaluation Under Feedback", "authors": ["Dharini Raghavan", "Amritpal Singh"], "published": "2026-09-02", "summary": "Predictive models are increasingly used in robotics for state estimation, planning, control, and policy evaluation, yet they are often judged by open-loop prediction accuracy over a fixed horizon. In closed-loop operation, a robot repeatedly acts, receives new measurements, updates its state estimate, and recomputes control. We study this difference in a differential-drive path-tracking task with biased odometry and intermittent landmark sensing. Six state estimators are evaluated across 24 sensing conditions using trajectory replay, a 20-step measurement-free rollout, and closed-loop tracking. Replay position RMSE correlates more strongly with closed-loop cross-track RMSE than rollout error (Spearman rho = 0.923 vs. 0.774) and selects a different estimator from the closed-loop optimum in 5/24 conditions, compared with 18/24 for the rollout metric. We then vary rollout horizon and measurement-update interval. With H=20, rank agreement decreases from rho = 0.916 with measurements at every step to rho = 0.774 with no measurements. A horizon-update grid shows that long prediction horizons remain informative when regular corrections are retained, whereas long rollouts without correction can produce rankings that differ substantially from closed-loop behavior. We also test recurrent estimators trained on longer sensing outages. This improves the EKF-anchored models under combined sensing degradation, reducing GRU-EKF cross-track RMSE from 1.72 m to 1.06 m, but the gain is not consistent across isolated outages or estimator architectures. These results show that predictive-model evaluation in robotics should specify both prediction horizon and measurement-update schedule. For models used in feedback, offline rollouts are most informative when their sensing and correction pattern reflects closed-loop operation. Code is available at https://github.com/rdharini2001/Robot_World_Model", "pdf_url": "https://arxiv.org/pdf/2609.02811v1"}, {"title": "Dutch Books for Language Models", "authors": ["Isaiah Andrews", "Suproteem Sarkar"], "published": "2026-09-02", "summary": "People increasingly use language models to support life decisions. Many such decisions involve a probabilistic forecast: How likely is a major life event, a natural disaster, or an economic outcome? Users of language models may implicitly trust that these forecasts fall out of a coherent world model. In this paper, we evaluate the coherence of language model probabilistic forecasts through a procedure that builds on a theorem due to de Finetti. We elicit forecasts from language models across events generated from stock returns data. We then use linear programs to compute the largest Dutch-book profit - the profit an arbitrageur could guarantee by betting against model-generated probabilities - which we use as a measure of incoherence. Our procedure does not require outcome labels, so we can evaluate coherence even in settings where outcomes are not observed or have not yet resolved. We find substantial evidence of incoherence in language model forecasts. Such incoherence increases when there are richer logical relationships between events, and irrelevant contextual details can increase incoherence by an order of magnitude. We conclude by discussing how alternative training strategies may improve probabilistic coherence.", "pdf_url": "https://arxiv.org/pdf/2609.02797v1"}, {"title": "Do Tabular Foundation Models Know Physics? Contamination, Units, and the Deterministic Limit", "authors": ["Wassim Tenachi", "Yashar Hezaveh", "Laurence Perreault Levasseur", "Pierre-Luc Bacon"], "published": "2026-09-02", "summary": "Tabular foundation models (TFMs) learn to fill in tables the way language models fill in text, and tables are arguably the format in which most physical measurement arrives. Did they learn any physics in the process? They are Bayesian by construction, so the question is what their prior contains. We probe it directly, evaluating four of them (TabPFN-3, TabICLv2, TabDPT and Real-TabPFN-2.5) against six baselines on datasets sampled from 316 physical equations, in and out of domain. TFMs dominate, out of the box and after tuning. But we show that their prior can represent neither a noiseless mechanism nor physical units, which is why they interpolate physics without yet being able to act as physical models.", "pdf_url": "https://arxiv.org/pdf/2609.02766v1"}, {"title": "An Adaptive Projected-Gradient Algorithm for Sample-Average Approximations of Stochastic Multi-Objective Optimization", "authors": ["Yiyang Li", "Lei Wang", "Xiaojun Chen"], "published": "2026-09-02", "summary": "We consider stochastic multi-objective optimization over a nonempty closed convex set, where every objective is an expectation and only sample-gradient information is available. We develop a line-search-free and function-value-free adaptive projected-gradient algorithm for the sample-average approximation (SAA) problem. Each iteration computes a feasible regularized multi-gradient step and updates the regularization parameter from the projected step length. A normal-cone-based certificate yields descent estimates and an explicit complexity bound for the Pareto-stationarity residual of the SAA problem. The consistency of SAA gradients then transfers vanishing SAA residuals to Pareto stationarity for the population problem, while an additional concentration argument gives a finite-sample residual bound on compact sets. Experiments on synthetic problems, classification, portfolio selection, multi-task learning, and robot control illustrate the practical performance of our algorithm.", "pdf_url": "https://arxiv.org/pdf/2609.02722v1"}, {"title": "MV-dVRK: A Multi-Viewpoint Benchmark for Spatial Surgical Perception", "authors": ["Guido Caccianiga", "Sergey Prokudin", "Yutong Chen", "Bernard Javot", "Rachael L'Orsa", "Omer Burak Aladağ", "Yarden Sharon", "Jens Rolinger", "Ivan Capobianco", "Anton Deguet", "Siyu Tang", "Katherine J. Kuchenbecker"], "published": "2026-09-02", "summary": "Large-scale training and refined optimization techniques have greatly improved sparse multi-view 3D reconstruction. Despite their relevance to surgery, such methods have never before been rigorously evaluated on real endoscopic images. Current clinical telerobots deploy a single stereo camera inside the patient, making multi-viewpoint data extremely rare. This paper presents MV-dVRK, the first ex-vivo surgical dataset to combine multiple exposure-synchronized stereo viewpoints with accurate surface geometry and camera poses. The static subset of the benchmark provides dense SfM reference geometry, validated against an industrial 3D scanner, together with ground-truth camera poses and sparse-view test sets. We use MV-dVRK to systematically compare zero-shot monocular, stereo, multi-stereo, and multi-view 3D reconstruction methods as the number of viewpoints increases. With two endoscopes, multi-stereo reconstruction achieves the highest coverage. With a third viewpoint, optimization-based multi-view methods perform best, covering 67% of ground-truth surface points within a 1 mm tolerance and recovering highly accurate relative camera poses. By contrast, feed-forward foundation models cover only 43% of the ground-truth surface in the same setting. MV-dVRK also includes ten dynamic sequences spanning multiple surgical tasks, with increasing kinematic complexity and tissue deformation, providing a basis for future research in multi-viewpoint surgical perception. The project is available at: https://mv-dvrk.is.mpg.de.", "pdf_url": "https://arxiv.org/pdf/2609.02717v1"}, {"title": "From Proxy Learning to Driving Decisions: A Transfer-Based Framework for Evaluating Future-Aware Autonomous Driving Planners", "authors": ["Yikai Wu"], "published": "2026-09-02", "summary": "Future-aware representations and world models are increasingly used in proposal-based autonomous-driving planners to improve trajectory selection. However, improvements in proxy objectives or restricted subsets are often interpreted as planning gains without verifying proposal ordering, selected trajectories, full-scale utility, and critical driving components. We propose the Proxy-to-Decision Transfer (PDT) Framework, an analysis framework that evaluates when learned future information supports a reliable driving-performance improvement claim. Its Decision-Transfer Decomposition Module localizes value loss through score margins, switch-conditioned utility, and support-versus-selection regret. Its Reliability-Constrained Validation Module requires exact pairing, a minimum meaningful effect, scale-expanded confirmation, safety non-compensation, sequential comparability, and family-level robustness. On a representative future-aware planner evaluated with NAVSIM-v1, component BCE decreases from 0.705 to 0.530 while held selected PDM decreases from 0.963 to 0.961. A separate candidate improves a 512-record prefix by 0.00909, with a scene-bootstrap 95% interval of [0.000744, 0.0177], but its 2048-record and complete-support intervals include zero. A proposal-level replay further confirms the switch-utility decomposition, yet none of 432 screened configurations passes the two-half, two-seed robustness gate. PDT therefore identifies where decision transfer fails or remains indeterminate across proxy, subset, aggregate, and selection evidence.", "pdf_url": "https://arxiv.org/pdf/2609.02688v1"}, {"title": "LoFi RADIO: A Distilled In-Domain Backbone Applied for Artifact-Severity Grading of Ultra-Low-Field Neonatal Brain MR", "authors": ["Jonathan B. Martin", "Yashwant Kurmi", "Charlotte R. Sappo"], "published": "2026-09-02", "summary": "Ultra-low-field MRI makes neonatal brain imaging deploy- able in low-resource settings, but its low SNR, lack of shielding, and long scan duration make it especially prone to acquisition artifacts, motivating automated quality control. We address the LISA 2026 Task 1a challenge: multi-label severity grading (0/1/2) of seven common image artifacts on ULF T2 weighted volumes. We identify that a number of backbones may be successfully paired with a classification MLP, but that no single backbone is uniformly best across artifacts. To improve performance, we evaluate routing complementary foundation model teachers through a per-artifact gate, as well as distilling the teachers into a single in-domain ViT-S student (LoFi RADIO) over an unlabeled low-field MRI corpus. Both of these strategies improve the weighted composite. The distilled backbone matches or exceeds the gate and has the added advantage of not requiring deployment of multiple large foundation models at infer- ence.", "pdf_url": "https://arxiv.org/pdf/2609.02676v1"}, {"title": "Projective Affine Body Dynamics for Multibody Systems", "authors": ["Zimeng Ye", "Xiaowei He", "Yuzhong Guo", "Yin Yang", "Chenfanfu Jiang", "Hongan Wang"], "published": "2026-09-02", "summary": "Multibody systems have widespread applications in diverse fields such as robotics, entertainment, and animation. Their capability to model and simulate intricate interactions among interconnected bodies makes them invaluable in various domains. However, complexity arises with factors like non-smooth contact handling, nonlinearity in flexible joints, and parallelization challenges. We introduce a stable and highly parallel GPU algorithm within affine body dynamics for solving constrained multibody dynamics with nonlinear constraints.Our innovation involves reformulating constrained multibody dynamics into a variational form, treating the system as a set of affine bodies connected with peridynamic bonds. This formulation provides a unified model for affine body dynamics, constraints, and contact within the peridynamics framework.It also facilitates the integration of the semi-implicit successive substitution method to solve nonlinear optimization in a global-local iterative manner. The proposed method obviates the necessity of assembling a global Hessian, rendering it highly suitable for efficient implementation on GPUs.This allows real-time simulation of intricate interactions involving both rigid and flexible bodies, encompassing contact, joint constraints, and friction.", "pdf_url": "https://arxiv.org/pdf/2609.02675v1"}, {"title": "HINT: Human-Intent Inception for Long-Horizon Robot Manipulation", "authors": ["Mingyu Mei", "Haojie Xu", "Shihao Jin", "Zibo Dai", "Qihao Cheng", "Zhengrui Lv", "Hongjie Fang", "Shirun Tang", "Guang Chen", "Xinyue Zhao", "Huiliang Shen", "Zaixing He"], "published": "2026-09-02", "summary": "Humans can perform complex manipulations given a simple intent through an overall instruction, while continuously adapting to evolving visual observations. However, current vision-language action (VLA) models and other action policies struggle to realize this high-level intelligent behavior under dense, evolving visual inputs and sparse language guidance. Visual correlations can then dominate semantic intent, leading actions to follow visual shortcuts rather than human goals. We present HINT (Human-INTent INcepTion), an agentic framework inspired by the human manipulation principles: semantic intent changes sparsely at manipulation-pattern transitions, whereas continuous control primarily depends on the evolving object-hand relationship. HINT invokes semantic reasoning only at pattern transitions to resolve the current subtask and target, then maintains this commitment through multi-view grounding and visual tracking. We explore two visual interfaces-image-space semantic highlighting and attention-prior injection-to communicate the tracked intent to the action policy without introducing additional trainable parameters into the foundation action model. Experiments across three long-horizon tasks and out-of-distribution variants show that HINT substantially improves intent understanding, task progress, and end-to-end success across two foundation policies while preserving low-latency control.", "pdf_url": "https://arxiv.org/pdf/2609.02653v1"}, {"title": "Latent Cluster Analysis for Vision-Language-Action Models", "authors": ["Theodor Wulff", "Sergio Lanza", "Tamara Bila", "Angelo Cangelosi", "Stefan Wermter", "Igor Farkas"], "published": "2026-09-02", "summary": "Vision-Language-Action (VLA) Models are increasingly used in robotics for their ability to ground language and perception into action, yet the internal representations driving their behaviour remain poorly understood. We propose LAVLA, a framework for latent cluster analysis of VLA models, and conduct a layer-wise study of the state-of-the-art GR00T N1.5 model, with particular focus on its action decoder. To better characterise the latent space during action diffusion, we introduce a cross-attention-based embedding-weighting method that amplifies relevant features while suppressing less informative ones. Quantitative evaluation shows that weighted clustering consistently outperforms the baseline. To improve interpretability, we extract human-interpretable concepts for each cluster, linking latent representations to semantic descriptions. Our analysis shows that latent clusters progressively disentangle spatiotemporal and kinematic features, with representations becoming more refined in the middle layers and stabilising toward the output. As such, LAVLA advances the interpretability of language-driven robotic systems.", "pdf_url": "https://arxiv.org/pdf/2609.02634v1"}, {"title": "Advancing Accessible Underwater Robotics: The Mini-Girona I-AUV at RAMI 2025", "authors": ["Taqi Hamoda", "Bilal Ahmed", "Deborah Ele-Ojo", "Thi Tran Ha Bao", "Adel Saidani", "Mazen Elgabalawy", "Alaaeddine Chaarani", "Sebastian Realpe", "Patryk Cieslak", "Pere Ridao", "Narcis Palomeras", "Nuno Gracias"], "published": "2026-09-02", "summary": "The Mini-Girona Intervention Autonomous Underwater Vehicle (I-AUV) represents an advancement in accessible underwater robotics, designed to bridge the gap between costly, specialized research AUVs and basic Remotely Operated Vehicles (ROVs). Developed with a focus on affordability and usability, the Mini-Girona, priced at approximately $50,000, integrates advanced components such as a 5-DOF manipulator arm, stereo vision, and AI-driven processing for autonomous navigation and intervention tasks. This paper presents the design and development of the Mini-Girona, detailing its performance during the RAMI 2025 student competition. Despite challenges such as thermal management issues and restricted team access, the Mini-Girona achieved second place overall, excelling in vision-based perception and intervention tasks. This work highlights the platform's potential as a tool for underwater robotics research and education, fostering innovation in real-world underwater applications.", "pdf_url": "https://arxiv.org/pdf/2609.02605v1"}, {"title": "Drift-dominated dust evolution. A multiwavelength analysis of dust rings in CY Tau and DoAr25", "authors": ["Anastasia Topalidou", "Nienke van der Marel", "Paola Pinilla", "Haochang Jiang", "Osmar M. Guerra-Alvarado", "Brodie J. Norfolk"], "published": "2026-09-02", "summary": "Context. Protoplanetary disks are the birthplaces of planets, and understanding the distribution and evolution of dust within them is essential for tracing the early stages of planet formation. Aims. Following the DSHARP survey, we aim to constrain the radial distribution of the dust surface density and the maximum emitting grain size in the disks of CY Tau and DoAr 25 and assess the relative importance of dust trapping and radial drift in shaping the dust population in disks. Methods. We present multiwavelength continuum observations of CY Tau and DoAr 25 from ALMA at 2.4 and 1.25 mm and archival VLA data at 8.8 mm. Combining the observations with dust continuum forward modeling, we sought to infer a radial profile of the two systems of the dust surface density and maximum emitting grain size. Results. For DoAr 25, the results reveal a prominent dust ring at 111 AU and evidence for large (centimeter-sized) grains extending to the outer disk. In contrast, CY Tau exhibits a more compact and smoother structure, with both the dust surface density and grain size decreasing monotonically with radius. A tentative shoulder feature in the radial profiles, located between 20-40 AU, may point to a marginal substructure, possibly a weak dust trap. Conclusions. DoAr 25 shows evidence for a dust trap capable of halting inward drift, while CY Tau exhibits behavior consistent with evolution dominated by radial drift. Together, these results highlight how dust evolution processes shape the disk morphology and grain-size distributions, even in the low-mass stellar regime.", "pdf_url": "https://arxiv.org/pdf/2609.02599v1"}, {"title": "3.5-meter Segmented-Mirror Robotic Space Telescope Mission White Paper III. Key Scientific Mission: Exoplanet Science with a Coronagraph", "authors": ["Juhan Kim", "Sang Hyun Lee", "Yong-Woo Kang", "Jeong-Yeol Han", "Sungwook E. Hong", "Bongkon Moon", "Donguk Song", "Juhyung Kang", "Myeong-Gu Park", "Sang Chul Kim", "Chung-Uk Lee", "Sangmo Tony Sohn", "Arman Shafieloo", "David Parkinson", "Hong Soo Park", "Dohyeong Kim", "Chan Park", "Jungjoo Sohn", "Young-Beom Jeon", "Jong-Hak Woo", "Hyung Mok Lee", "Hong Bae Ann", "Myungkook James Jee", "Mansoo Choi", "Changbom Park"], "published": "2026-09-02", "summary": "This volume defines the exoplanet science program enabled by the dedicated high-contrast coronagraph in the baseline science payload of the 3.5-meter Segmented-Mirror Robotic Space Telescope. The observatory architecture incorporates the optical interfaces, wavefront sensing and control, pointing stability, and operations software required for coronagraphic observations from the outset. The observing strategy gives priority to the nearest stellar systems because they provide the most accessible laboratories for planetary exploration and the most likely destinations of future interstellar missions. The diffraction limit sets a reflected-light horizon of roughly 10--15 pc for planets at 1 AU and roughly 50--80 pc for Jupiter analogs. Within those horizons, the telescope can image nearby giant planets, obtain reflected-light spectra of their atmospheres, survey young systems and circumstellar disks, and support the habitability and biosignature programs that larger future missions will pursue. The wide-field imager complements the coronagraph through transit photometry, occurrence-rate statistics, and long-term monitoring of stellar magnetic activity. A systematic census of the nearest stellar neighbors provides a lasting reference for exoplanet science and future space exploration.", "pdf_url": "https://arxiv.org/pdf/2609.02577v1"}, {"title": "Pre-Lane-change Signal in Transitional Autonomous Vehicles: Results from Controlled Experiments", "authors": ["Zeyu Mu", "Danjue Chen", "Abhinav Sharma", "George F. List"], "published": "2026-09-02", "summary": "This paper investigates how a production transitional autonomous vehicle (tAV) develops and executes mandatory lane-change decisions. Using 150 controlled mandatory lane changes from the NC-tALC experiments, the study examines whether the eventual target gap is observable before lateral movement begins and how the tAV progresses longitudinally from that pre-lane-change state to lane-change start. Signal time (SigT) is defined as an operational pre-lane-change-start reference point. A Firth logistic regression predicts whether the tAV eventually merges in front of or behind its nearest target-lane vehicle using relative position and relative speed at SigT. Longitudinal progression from SigT to lane-change start is then examined separately for in-position and repositioning cases. The traffic state at SigT contains substantial information about eventual target-gap choice and provides meaningful lead time before lateral movement begins. The proposed formulation predicts whether the tAV remains with its current gap or repositions to a neighboring gap by moving forward or dropping back, including cases with longitudinal overlap and ambiguous current-gap geometry. The model achieves an average five-fold cross-validated accuracy of 0.89. Results also provide preliminary evidence that in-position and repositioning cases follow different longitudinal pathways from SigT to lane-change start. These findings support a two-stage conjecture of the observable lane-change process: longitudinal preparation from SigT to lane-change start, followed by lateral maneuver execution. The formulation applies to in-position, repositioning, and longitudinally overlapping cases, and can support lane-change models that distinguish target-gap choice from lateral-onset timing while representing longitudinal preparation before lateral movement begins.", "pdf_url": "https://arxiv.org/pdf/2609.02575v1"}, {"title": "3.5-meter Segmented-Mirror Robotic Space Telescope Mission White Paper II. Key Scientific Mission: Wide-Field Cosmology and Galaxy Evolution", "authors": ["Juhan Kim", "Yong-Woo Kang", "Sang Hyun Lee", "Jeong-Yeol Han", "Sungwook E. Hong", "Bongkon Moon", "Donguk Song", "Juhyung Kang", "Myeong-Gu Park", "Sang Chul Kim", "Chung-Uk Lee", "Sangmo Tony Sohn", "Arman Shafieloo", "David Parkinson", "Hong Soo Park", "Dohyeong Kim", "Chan Park", "Jungjoo Sohn", "Young-Beom Jeon", "Jong-Hak Woo", "Hyung Mok Lee", "Hong Bae Ann", "Myungkook James Jee", "Mansoo Choi", "Changbom Park"], "published": "2026-09-02", "summary": "The 3.5-meter Segmented-Mirror Robotic Space Telescope uses an image slicer for all spectroscopic observations. The planning baseline uses $R \\simeq 1000$ for the wide survey and retains selectable $R \\simeq 5000$ bands for precision line measurements. The central science case is a dense emission-line galaxy redshift survey for baryon acoustic oscillations and redshift-space distortions. Supernova and quasar programs exploit the stability, multiplexing, and repeatability of space operations. The supernova tier measures rest-frame U and near-ultraviolet magnitudes that separate optical twins at subgroup precision to $z \\simeq 0.9$--$1.1$ in standard visits and to $z \\simeq 1.3$--$1.5$ in ten-hour stacks. Every wide-survey tile receives three spectroscopic orientations, and a joint scene reconstruction uses their different overlap geometries to recover the spectra. The flagship survey covers 100--300 deg$^2$ and targets $10^6$--$3 \\times 10^6$ emission-line galaxies. A deep pencil-beam tier and a supernova time-domain tier complement the wide survey. The same observations provide a census of ultra-diffuse and low-surface-brightness galaxies, map intracluster light, and test cold, self-interacting, and fuzzy dark matter through dwarf-galaxy structure and low-mass halo abundance.", "pdf_url": "https://arxiv.org/pdf/2609.02574v1"}, {"title": "3.5-meter Segmented-Mirror Robotic Space Telescope Mission White Paper I. Overall Architecture and Scientific Mission", "authors": ["Yong-Woo Kang", "Sang Hyun Lee", "Juhan Kim", "Jeong-Yeol Han", "Sungwook E. Hong", "Bongkon Moon", "Donguk Song", "Juhyung Kang", "Myeong-Gu Park", "Sang Chul Kim", "Chung-Uk Lee", "Sangmo Tony Sohn", "Arman Shafieloo", "David Parkinson", "Hong Soo Park", "Dohyeong Kim", "Chan Park", "Jungjoo Sohn", "Young-Beom Jeon", "Jong-Hak Woo", "Hyung Mok Lee", "Hong Bae Ann", "Myungkook James Jee", "Mansoo Choi", "Changbom Park"], "published": "2026-09-02", "summary": "A 3.5-meter segmented-mirror robotic space telescope is under study as a space-based observatory for precision astrophysical observations and rapid-response transient astronomy in the 0.2-1.5 micron wavelength range. The telescope adopts a Cassegrain optical configuration optimized to deliver diffraction-limited performance across a wide, flat focal plane, achieving a Strehl ratio greater than 0.8 at 633 nm. The proposed scientific payload includes a Wide-field Camera (WC), a spectroscopic instrument, and an optional Exoplanet Imaging Coronagraph. The Wide-field Camera (WC) provides multi-wavelength imaging and high-cadence time-series photometry over a field of view ranging from 10'X10' to 30'X30'. The spectroscopic configuration and resolving power remain under study to accommodate the requirements of the principal science programs. An optional Exoplanet Imaging Coronagraph is being investigated for high-contrast imaging of nearby planetary systems, with performance goals extending toward raw contrasts of approximately 10^(-8) and improved post-processed performance. Candidate orbital configurations, including Earth orbit and the Sun-Earth L2 region, are currently being evaluated. Planned investigations include gravitational-wave counterparts, rapidly evolving transients, Type Ia supernova cosmology, direct imaging of exoplanets, and exoplanet atmospheric spectroscopy. Although driven by these core scientific objectives, the observatory is conceived as a general-purpose facility providing open-access observing time to the international scientific community. This paper presents the preliminary architecture, performance goals, and scientific mission of the proposed 3.5-meter space telescope.", "pdf_url": "https://arxiv.org/pdf/2609.02571v1"}, {"title": "RGB-to-IR image translation for infrared vehicle detection in unseen UAV domains", "authors": ["Thijs A. Eker", "Ella P. Fokkinga", "Jan Erik van Woerden", "Elfi I. S. Hofmeijer", "Sebastiaan P. Snel", "Klamer Schutte", "Friso G. Heslinga"], "published": "2026-09-02", "summary": "Synthetic training data is crucial for developing vision AI when real-world data is scarce, as in thermal infrared (IR) aerial vehicle detection. While abundant UAV RGB imagery motivates RGB-to-IR translation for data augmentation, unobservable thermal traits (e.g., engine heat) make learning transferable mappings challenging. This work investigates whether modern generative translators can overcome this cross-modal gap to improve infrared vehicle detection on unseen UAV target domains. Translators are trained on paired RGB-IR source datasets and applied to RGB training images from held-out target datasets to generate synthetic IR data. Evaluated methods include supervised GANs, ControlNet-based diffusion models, and foundation-model editing via LoRA. The resulting synthetic IR imagery is used to train RF-DETR vehicle detectors, which are evaluated on unseen IR target test splits across five aerial datasets, with Kust4K and VTUAV serving as target domains. Synthetic IR consistently outperforms RGB and grayscale baselines. Stable Diffusion 3.5 with ControlNet yields the best results, improving mAP from 50.8 to 60.1 on Kust4K and from 25.6 to 38.4 on VTUAV compared to models trained only on source-domain IR data. Increasing output diversity via multiple seeds (+1.1 mAP) and prompt variations (+3.3 mAP) provides additional gains on VTUAV. Although a performance gap to real target IR data remains, generative RGB-to-IR translation effectively mitigates IR data scarcity and improves cross-domain aerial vehicle detection.", "pdf_url": "https://arxiv.org/pdf/2609.02556v1"}, {"title": "ZETA: A Controlled Study of Zero-Shot Cross-Embodiment VLA Transfer for Tabletop Manipulation", "authors": ["Mi Yan", "Wenhao Zhang", "Zhiqi Zhang", "Yu Peng", "Tangxinyu Wang", "Lingfei Zhai", "Jiayi Su", "Shengliang Deng", "Lin Peng", "Yaowei Liu", "Yuxing Chen", "Zhiyuan Wei", "Jilong Wang", "Jiayi Chen", "Jiangran Lyu", "Zhizheng Zhang", "He Wang"], "published": "2026-09-02", "summary": "Zero-shot generalization to unseen embodiments is important for generalizable vision-language-action (VLA) models as robot hardware evolves and task-specific data collection remains costly. However, a systematic understanding of this problem remains limited, in part because the literature lacks a unified zero-shot transfer definition and controlled evaluation settings that isolate embodiment changes from differences in tasks, scenes, or protocols. To address this gap, we first distinguish strict zero-shot transfer, where the target embodiment is absent from all training data, from pretrain-exposed zero-shot transfer, where it appears only during pretraining. We then introduce a controlled benchmark spanning 14 held-out target embodiments across simulation and real-world validation. Within this framework, we conduct a controlled analysis of four factors: state-action representations, pretraining embodiment diversity, auxiliary co-training objectives, and target-embodiment exposure. Experimental results show that local end-effector (EEF) state-action representations, the source embodiment diversity, and auxiliary co-training improve cross-embodiment transfer by around 15, 18, and 7 percentage points, respectively. We further find that adding only 5% target-embodiment data during pretraining improves average target-embodiment progress by 13.4 percentage points, showing that strict and pretrain-exposed zero-shot transfer are distinct and should be reported separately. Together, these findings provide practical guidance for evaluating and improving cross-embodiment VLA transfer in stationary tabletop manipulation with two-finger grippers, while motivating future investigation of broader settings including mobile-base control, dexterous hands, and long-horizon tasks.", "pdf_url": "https://arxiv.org/pdf/2609.02546v1"}, {"title": "World-Model-Augmented Visual Locomotion for Humanoids on Foothold-Constrained Terrain", "authors": ["Yuxi Liu", "Lijun Han", "Ziming Wang", "Ao Zhang", "Cong Yang", "Wei Sui"], "published": "2026-09-02", "summary": "Foothold-constrained terrain is characterized by sparse, discontinuous, or geometrically restricted feasible foot contacts, as encountered on stepping stones, across gaps, and on narrow stair treads. On such terrain, a single misstep often leaves little room to recover, so policies that base foot-placement decisions primarily on the immediately visible terrain are prone to failure. We ask whether a learned predictive summary of near-future observations and rewards can provide the anticipatory information required in such settings. We present World-Model-Augmented Visual Locomotion (WM-LOCO), which jointly trains a recurrent world model and a PPO policy. Conditioned on proprioception and a single onboard depth image, the world model produces a predictive recurrent feature that guides the policy, without explicit foothold labels. In simulation, WM-LOCO succeeds on gaps and stepping stones where a matched baseline fails completely, and matches the baseline's success rate on stairs while improving stride efficiency and reducing pelvis acceleration. We deploy the same policy onboard a physical Unitree G1 humanoid using onboard proprioception and a single depth stream; it traverses all three terrain classes with an average success rate of 93.3%.", "pdf_url": "https://arxiv.org/pdf/2609.02542v1"}, {"title": "Spatially Aware World Action Model via Geometric Latent Diffusion", "authors": ["Javier Alejandro Lopetegui Gonzalez", "Paul Pacaud", "Cordelia Schmid"], "published": "2026-09-02", "summary": "World Action Models (WAMs) leverage the capabilities of large-scale pretrained video diffusion models to jointly predict future observations and actions, inheriting rich visual and physical priors from internet-scale video. This has made them a promising paradigm for robot policy learning, yet the prevailing models operate exclusively on RGB observations and do not leverage 3D information. To bridge this gap, we introduce a Spatially Aware World Action Model (SA-WAM), which repurposes a pretrained video model for joint action, RGB, and depth prediction, enabling 3D-aware world modeling and action prediction within a single diffusion backbone. We use a nonlinear encoding that maps the unbounded depth signal into the bounded input domain expected by the frozen VAE tokenizer. This allows us to reuse the tokenizer without 3D-specific fine-tuning, incorporating geometric information without sacrificing the pretrained priors. SA-WAM achieves state-of-the-art results on the RoboCasa and LIBERO-Plus benchmarks, while simultaneously improving future-state predictions. Furthermore, SA-WAM outperforms strong baselines in real-world evaluation using a UR5 robotic arm, with strong gains in randomized environments. We analyze the correlation between world model prediction quality and rollout success, providing insights into WAM performance and avenues for its improvement.", "pdf_url": "https://arxiv.org/pdf/2609.02531v1"}, {"title": "MS-MEM: Multi-Skill Manipulation-Enhanced Mapping via Uncertainty- and Disturbance-Aware Action Selection", "authors": ["Yitian Shi", "Jesper Mücke", "Nils Dengler", "Sicong Pan", "Rania Rayyes", "Maren Bennewitz"], "published": "2026-09-02", "summary": "Accurate scene understanding in confined, cluttered spaces such as shelves is essential for service robots, as many everyday tasks require them to locate and retrieve objects reliably. Yet, it remains challenging due to severe occlusions, restricted accessibility, and the need to avoid excessive scene changes. In this paper, we propose Multi-Skill Manipulation-Enhanced Mapping (MS-MEM), an evidential framework for uncertainty-aware mapping that integrates active viewpoint selection, object pushing, and grasping. MS-MEM combines scene-level metric-semantic evidential belief estimators with an uncertainty-aware grasp representation. This representation is learned using a novel full-evidential grasp estimator that models both grasp affordance and orientation uncertainty. In our framework, candidate perception and manipulation actions are evaluated within a unified action selection pipeline using a common information gain criterion. For manipulation actions, we further introduce a collateral disturbance constraint (CDC) that discourages excessive changes to confident regions of the scene belief. This enables MS-MEM to select actions that effectively reduce map uncertainty while limiting collateral scene changes. Experimental results show that, compared with single-skill and unconstrained baselines that ignore scene disturbance, MS-MEM achieves higher mapping accuracy while substantially reducing scene disturbance, highlighting the synergistic effects of active viewpoint selection, push, and grasp actions.", "pdf_url": "https://arxiv.org/pdf/2609.02493v1"}, {"title": "An Adaptive Control Architecture for Slope and Terrain Compensation in Autonomous Navigation in Mediterranean Greenhouses", "authors": ["Fernando Cañadas-Aránega", "Dirk Wollherr", "José L. Guzmán", "José C. Moreno", "José L. Blanco-Claraco"], "published": "2026-09-02", "summary": "The ability to move stably over terrain with varying slopes and textures is essential for mobile agricultural robots operating in complex and dynamic environments such as greenhouses, where small terrain irregularities can lead to significant navigation errors. This article presents a novel terrain-adaptation strategy based on the carried payload, ensuring accurate and robust trajectory tracking. The proposed approach is based on: (i) the experimental characterization of the most common types of greenhouse soil, concrete, compacted sand, and gravel, and (ii) the direct measurement of terrain slope using the IMU, in order to estimate the force with which this angle affects the motor input. Based on this information, a cascade trajectory-tracking scheme has been designed, consisting of a model-based predictive controller (MPC) in the outer loop and a PI controller in the inner loop. The system incorporates an adaptive feedforward control through gain scheduling approach, capable of adjusting to disturbances caused by variations in slope and terrain type. Simulation results demonstrate that the differential-drive robot achieves a significant improvement both in error indices and in control signal efficiency, highlighting the effectiveness and robustness of the proposed approach.", "pdf_url": "https://arxiv.org/pdf/2609.02487v1"}, {"title": "Adapting a Foundation Model for Lunar Surface Height Estimation", "authors": ["Patrick Bauer", "Marius Schwinning", "Melanie Siegel", "Andreas Weinmann", "Hichem Snoussi"], "published": "2026-09-02", "summary": "Digital elevation models (DEMs) can provide accurate height information, making it invaluable for analyzing the lunar surface. As the European Space Agency (ESA) prepares for future lunar missions that aim to land on the Moon, a precise method for height estimation will be essential for hazardous terrain that could endanger the landing approach. Traditional approaches to generate DEMs from imagery, such as shape from shading (SfS) and stereophotogrammetry (SPG) have been proven highly valuable for this task. However, due to advancements in machine learning, especially computer vision, the focus has shifted towards monocular depth estimation via deep learning. The lunar surface is covered by rocks and craters, and classic hazard detection methods rely solely on 2D image data. Our goal is to address this issue by developing a relative lunar surface height estimator that can provide additional information for hazard localization. In this letter, we present a methodology that builds on the well-known zero-shot relative depth estimation model Depth Anything V2 (DAV2). Other works have been using it as a state-of-the-art comparison for their proposed lunar DEM estimation method, but without adaptations to the target domain. Thus, it may underperform. Therefore, we propose a fine-tuning strategy with publicly available SPG-derived DEM data of the lunar surface. Our results demonstrate a significant improvement in performance compared to the zero-shot model, effectively transforming DAV2 into a reliable relative depth estimator of the lunar surface.", "pdf_url": "https://arxiv.org/pdf/2609.02448v1"}, {"title": "WildFab: Multi-Axis 3D Printing from Models in the Wild", "authors": ["Jiasheng Qu", "Zhikai Shen", "Chenyu Xu", "Hailin Sun", "Chengkai Dai", "Yuhu Guo", "Junpeng Wang", "Yeung Yam", "Guoxin Fang"], "published": "2026-09-02", "summary": "Multi-axis 3D printing enables support-free fabrication and improved part quality, but robustly processing real-world geometries remains challenging. Models from design workflows or direct data acquisition often contain solid--shell combinations and non-manifold structures. Handling such models in the wild typically requires time-consuming geometry repair, which may alter the intended geometry. In this work, we present WildFab, a computational framework for multi-axis 3D printing that directly computes spatial toolpath and global collision-free motion from input models. Our pipeline builds on a hybrid query representation that combines a neural unsigned distance field (UDF) with a regularized generalized winding number field (reg-GWN). The UDF supplies differentiable surface-distance and direction queries, while the reg-GWN resolves near-surface ambiguity in the fitted UDF by providing reliable surface localization and a solid-void indicator. Based on this representation, we introduce a high-precision spatial toolpath computation algorithm that iteratively projects points between optimized guidance-field level sets and reg-GWN gradient-magnitude ridges. Subsequently, we develop an efficient and robust coarse-to-fine collision checking scheme for motion planning: UDF-based rejection first identifies potential collisions, while time-varying reg-GWN verification accurately resolves collision pairs for both solid and shell components. We validate WildFab on diverse inputs, demonstrating successful computation from non-manifold parametric surfaces, voxelized topology-optimization results, implicit models, raw scanned point clouds, and non-watertight meshes. The fabrication results highlight our method's ability to advance end-to-end design-to-3DP workflows.", "pdf_url": "https://arxiv.org/pdf/2609.02413v1"}, {"title": "A Physics-Consistent Benchmark for Contact-Rich Human-Robot Interaction in Assistive Care", "authors": ["Chengxiao He", "Shanghai Yuan", "Liuqun Fan", "Shenzhen Zhu"], "published": "2026-09-02", "summary": "Conventional task-level evaluation asks whether a robot policy completes a specified action, but can miss failures that emerge only during physical human contact. This limitation is critical in contact-rich assistive tasks, where meaningful evaluation requires a physically responsive human, interaction-quality assessment beyond task success, and a leak-free observer-scorer protocol. We introduce a physics-consistent benchmark for contact-rich human-robot interaction, instantiated in robot-assisted bathing. The benchmark combines a deformable, passively responding human, physics-aware scores alongside task-level success, and a frozen vision-only / scorer-only evaluation protocol. To establish physical validity, region-wise simulated responses are calibrated against force-indentation measurements from Franka impedance pushes on a medical-care manikin. Under a frozen T1-T7 protocol with 140 runs per method, an LLM-augmented state machine (State Machine) achieves 72.9% task success but drops to 56.4% after correct-region and force-safety screening; VoxPoser produces lighter and more stable contact but completes only 27.9% of trials; and zero-shot pi0.5 achieves 0.7% task success with no correct-region or safety-gated successes. These results show that task completion alone does not imply physically valid contact and motivate physics-aware screening before deployment of contact-rich assistive robot policies.", "pdf_url": "https://arxiv.org/pdf/2609.02402v1"}, {"title": "Seeing Beyond the Lesion: Disease Recognition from Reactive CNS Tissue", "authors": ["Jan Schnorrenberg", "Jan Ernsting", "Enrico Küllenberg", "Tim Hahn", "Benjamin Risse", "Christian Thomas"], "published": "2026-09-02", "summary": "Sampling error yields exclusively reactive, non-lesional brain parenchyma in a significant proportion of intracranial biopsies, leaving the underlying disease undiagnosed. We benchmark four pathology foundation models (UNI2-h, Virchow2, Prov-GigaPath, H-optimus-0) as frozen patch encoders within a shared attention-based multiple-instance learning framework using 245 whole-slide images from 186 patients with confirmed downstream diagnoses. We first show that coarse disease-category prediction can be reproduced largely from slide size alone. After restricting classification to three finer diagnostic distinctions within common tissue categories, this confound no longer explains performance, yet disease labels remain predictable above chance under permutation testing (p $\\le 10^{-4}$ throughout). Surprisingly, performance is statistically indistinguishable across all foundation-model encoders, suggesting that recovering these weak morphological signatures is not limited by current patch representations. Signed instance-contribution maps and expert review further test whether predictive evidence localizes to reactive parenchyma rather than sampling-induced bias like blood introduced during tissue sampling. These results position acquisition-shortcut auditing via a provenance-only baseline as a necessary control in computational-pathology benchmarks, and show, once that confound is removed, that weakly supervised models still recover disease signal from tissue conventionally regarded as non-diagnostic.", "pdf_url": "https://arxiv.org/pdf/2609.02390v1"}, {"title": "Towards a Foundational Ontology for Identifying and Resolving Contradictions in Dialogue-based Human-Robot Interactions", "authors": ["Maitreyee Tewari", "Michele Persiani"], "published": "2026-09-02", "summary": "Existing Human-Robot Interaction (HRI) literature has focused on identifying and structuring errors, failures, conflicts, and knowledge issues (called in this work as contradictions) in domain-specific dialogue-based interactions. However, there is still lack of a formal computational framework to represent and define these contradictions, interoperable and usable across HRI and human-agent interaction (HAI) domains. Thus, this research project aims to capture, represent, and evaluate the notion of (1) dialogue-based collaborative interaction and (2) related contradictions in a foundational ontology. METHONTOLOGY, a systematic approach to build domain-independent ontologies was applied. In the conceptualisation stage of the presented ontology, concepts and models from Activity Theory were used. Preliminary results presented in this short article are: (i) Natural language definitions of dialogues and related contradictions in HRI, (ii) Set Theoretic definitions of dialogues and contradictions, and (iii) First Order Logic (FoL) formulation of the contradiction concepts and three novel principles guiding dialogue-based interactions between humans and robots. In summary, we report on ongoing work to develop a foundational ontology based on Activity Theory called Activity Theory-based foundational ontology (ATFOt) to capture and represent the notion of contradictions in HRI.", "pdf_url": "https://arxiv.org/pdf/2609.02364v1"}, {"title": "Humanoid Safe Stop via Learned Stoppability Value", "authors": ["Junfeng Long", "Pieter Abbeel", "Koushil Sreenath", "Roberto Horowitz", "Guanya Shi", "C. Karen Liu"], "published": "2026-09-02", "summary": "Humanoid robots responding to emergency stop commands typically execute a fixed maneuver, without reasoning about whether a safe stop is actually feasible from the current state. We cast emergency stopping as a reach-avoid problem and propose Safe-Stop, a task-agnostic framework that pairs a learned stop policy with learned stoppability estimators. The estimators are complementary: a stop-probability estimator supervised by the actual outcomes of the fixed stop policy, and a reach-avoidance estimator supervised by a Hamilton-Jacobi backup over physical state. The first captures emergent stopping behavior of the learned controller; the second provides a complementary recoverability signal. Because the stop policy and estimators do not depend on the behavior policy that preceded the stop command, they transfer across diverse upstream tasks without retraining. At deployment, the two estimates are combined: Safe-Stop commits to the stop only when both estimators indicate that stopping remains feasible, otherwise it hands off to a fall policy, instantiated as a damping fallback. This agreement check yields decisions that are robust without sacrificing reactivity.", "pdf_url": "https://arxiv.org/pdf/2609.02358v1"}, {"title": "LookStep: Efficient Vision-Language Navigation with Linguistic Foresight and Event Driven Memory", "authors": ["Kun-Yang Yu", "Yingzhe Li", "Hongyu Xu", "Shi-Yu Tian", "Zhi Zhou", "Yang Chen", "Ming Yang", "Sheng Wang", "Qing Yu", "Lan-Zhe Guo", "Yu-Feng Li"], "published": "2026-09-02", "summary": "Vision-Language Navigation (VLN) requires an embodied agent to follow natural-language instructions in unseen environments. Recent progress has been largely driven by Multimodal Large Language Models (MLLMs). Existing methods follow a next-step action prediction paradigm, supervising only the expert action, which requires a high quantity of data for training. They also rely on cognitive maps, accumulated historical frames, or external 3D tools to maintain states, leading to high computational and memory overhead. To realize resource efficiency VLN, we propose LookStep, a unified end-to-end framework that combines Language Centric Future State Modeling and Event Driven Rolling Memory that uses language labels to generate coarse-grained navigation progress and future states for each candidate action, while autonomously deciding whether to write each observation into a bounded rolling memory with a semantic role. We validate LookStep empirically. On VLN-CE tasks, LookStep outperforms existing methods under the same training settings, achieving a 49.7\\% success rate on R2R-CE Val-Unseen with better memory efficiency and less data usage. Code and model is available at https://github.com/kunyang-YU/LookStep.", "pdf_url": "https://arxiv.org/pdf/2609.02350v1"}, {"title": "Towards Zero-Shot Transfer Across Embodiments For Driving VLAs", "authors": ["Caio Azevedo", "Stefano Sabatini", "Sascha Hornauer", "Fabien Moutarde"], "published": "2026-09-02", "summary": "Vision-Language-Action models (VLAs) have shown strong potential in autonomous driving by leveraging multimodal pretraining for instruction following, visual reasoning, and scene-level generalization. In robotic manipulation, scaling VLA fine-tuning across multiple robot setups--especially when unifying representations across embodiments--has been shown to improve in-dataset performance and cross-embodiment generalization; in autonomous driving, however, VLAs remain largely trained on individual datasets and are rarely evaluated for zero-shot transfer to unseen datasets and camera rigs; furthermore naively adding more datasets to the training data does not necessarily lead to better performance within seen embodiments. To address these problems, we study multi-dataset training for the driving task and BEV
