><p>More concretely, Mazzolai would like to incorporate the concept of a life cycle into the design of robots, so that at the end of their useful life these machines can be reused, recycled, or even biodegraded.<\/p><p>While that might sound ambitious, she’s confident that all the ingredients to make it a reality are in place. And it’s a vision that she is certain will inspire future roboticists. “There are younger people who want to really work in this field because this is the future, their future,” she says. Facing the threat of ongoing environmental damage, “they want to develop something that can help.”<\/p>"}, {"title": "Intrinsic open sources key parts of its platform for easier development", "source": "Robotics Business Review", "date": "2026-09-22", "url": "https://www.therobotreport.com/intrinsic-open-sources-key-parts-platform-easier-development/", "summary": "<p>With Intrinsic Core, the company is making key parts of its manipulation platform available to robotics developers. <\/p>\n<p>The post <a href=\"https://www.therobotreport.com/intrinsic-open-sources-key-parts-platform-easier-development/\">Intrinsic open sources key parts of its platform for easier development<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "NVIDIA Isaac ROS 5.0 Advances Agentic, Open Source Robotics Development", "source": "NVIDIA Robotics", "date": "2026-09-22", "url": "https://blogs.nvidia.com/blog/isaac-ros-5-0-agentic-open-source-robotics/", "summary": "To build and deploy sophisticated robotics applications that can perceive, reason and act in dynamic environments, developers need new physical AI models and tools. The ROS open framework is a project from Open Robotics that helps humans build robots. NVIDIA Isaac ROS 5.0 — a collection of GPU-accelerated packages built on ROS, released today at [&#8230;]"}, {"title": "Isaac ROS 5.0 brings AI agents to robotics development, says NVIDIA", "source": "Robotics Business Review", "date": "2026-09-22", "url": "https://www.therobotreport.com/isaac-ros-5-0-brings-ai-agents-robotics-development-says-nvidia/", "summary": "<p>The release brings new agentic workflows and platform support to NVIDIA Isaac ROS to help developers deploy robotics applications faster. <\/p>\n<p>The post <a href=\"https://www.therobotreport.com/isaac-ros-5-0-brings-ai-agents-robotics-development-says-nvidia/\">Isaac ROS 5.0 brings AI agents to robotics development, says NVIDIA<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Intel to discuss the infrastructure needed to scale physical AI at RoboBusiness", "source": "Robotics Business Review", "date": "2026-09-22", "url": "https://www.therobotreport.com/intel-discusses-infrastructure-needed-to-scale-physical-ai-robobusiness/", "summary": "<p>Intel's Nagesh Puppala will discuss why the next phase of robotics innovation depends on more than bigger models or better simulations.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/intel-discusses-infrastructure-needed-to-scale-physical-ai-robobusiness/\">Intel to discuss the infrastructure needed to scale physical AI at RoboBusiness<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Why outdoor robots fail (and how to build systems that survive)", "source": "Robotics Business Review", "date": "2026-09-22", "url": "https://www.therobotreport.com/why-outdoor-robots-fail-how-to-build-systems-that-survive/", "summary": "<p>Learn practical strategies for building reliable outdoor robots from WiBotic, Burro, and Nextpower at RoboBusiness in Silicon Valley.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/why-outdoor-robots-fail-how-to-build-systems-that-survive/\">Why outdoor robots fail (and how to build systems that survive)<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Boston Dynamics opens Metaplant Application Center to train Atlas humanoids", "source": "Robotics Business Review", "date": "2026-09-21", "url": "https://www.therobotreport.com/boston-dynamics-opens-metaplant-application-center-train-atlas-humanoid-robots/", "summary": "<p>The new Robotics Metaplant Application Center is training humanoids as part of Hyundai's Metaplant America in Georgia.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/boston-dynamics-opens-metaplant-application-center-train-atlas-humanoid-robots/\">Boston Dynamics opens Metaplant Application Center to train Atlas humanoids<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "IAC completes autonomous racing event at Laguna Seca", "source": "Robotics Business Review", "date": "2026-09-21", "url": "https://www.therobotreport.com/iac-completes-autonomous-racing-event-at-laguna-seca/", "summary": "<p>At Laguna Seca, Unimore Racing won the Indy Autonomous Challenge, marking the IAC's first autonomous car overtakes on a road course.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/iac-completes-autonomous-racing-event-at-laguna-seca/\">IAC completes autonomous racing event at Laguna Seca<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Why Deploying Physical AI at Scale Demands Safety at Every Layer", "source": "NVIDIA Robotics", "date": "2026-09-21", "url": "https://blogs.nvidia.com/blog/physical-ai-halos-safety/", "summary": "Physical AI is moving rapidly from research to large-scale deployment. By 2035, ABI Research projects an installed base of 49 million level 3-5 autonomous vehicles (AVs), while Omdia estimates that roughly 60 million industrial robots will be deployed between 2026 and 2035. As these machines enter roads, factories, warehouses and other environments shared with people, [&#8230;]"}, {"title": "What do you do with a humanoid robot when it breaks down?", "source": "Robotics Business Review", "date": "2026-09-20", "url": "https://www.therobotreport.com/what-do-you-do-with-a-humanoid-robot-when-it-breaks-down/", "summary": "<p>Decommissioning a humanoid robot is not a matter of traditional scrapping. It's a highly technical, high-stakes surgical endeavor.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/what-do-you-do-with-a-humanoid-robot-when-it-breaks-down/\">What do you do with a humanoid robot when it breaks down?<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Hirebotics adds line tracking and linear rail capabilities to its cobots", "source": "Robotics Business Review", "date": "2026-09-19", "url": "https://www.therobotreport.com/hirebotics-adds-line-tracking-linear-rail-capabilities-cobots/", "summary": "<p>Hirebotics said these new capabilities extend the working range of the cobots, giving manufacturers greater flexibility.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/hirebotics-adds-line-tracking-linear-rail-capabilities-cobots/\">Hirebotics adds line tracking and linear rail capabilities to its cobots<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Neptune Medical earns FDA clearance for its Triton 1 robotic system", "source": "Robotics Business Review", "date": "2026-09-18", "url": "https://www.therobotreport.com/neptune-medical-earns-fda-clearance-triton-1-robotic-system/", "summary": "<p>Neptune said Triton can elevate any endoscopist's capabilities for screening, surveillance, and diagnostic colonoscopies.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/neptune-medical-earns-fda-clearance-triton-1-robotic-system/\">Neptune Medical earns FDA clearance for its Triton 1 robotic system<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Icarus Robotics flies ISS-bound robot in microgravity for the first time", "source": "Robotics Business Review", "date": "2026-09-18", "url": "https://www.therobotreport.com/icarus-robotics-flies-iss-bound-robot-in-microgravity-for-the-first-time/", "summary": "<p>This is the last major test of the system before Icarus Robotics will be sending JOY the the ISS in early 2027.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/icarus-robotics-flies-iss-bound-robot-in-microgravity-for-the-first-time/\">Icarus Robotics flies ISS-bound robot in microgravity for the first time<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Video Friday: Two Birotors Make a Quadrotor", "source": "IEEE Spectrum Robotics", "date": "2026-09-18", "url": "https://spectrum.ieee.org/video-friday-quadrotor-from-birotor", "summary": "<img src=\"https://spectrum.ieee.org/media-library/two-small-dual-propeller-robots-facing-each-other-connected-by-a-loose-green-cord.png?id=67790149&amp;width=1245&amp;height=700&amp;coordinates=103%2C0%2C103%2C0\" /><br /><br /><p><span>Video Friday is your weekly selection of awesome robotics videos, collected by your friends at <\/span><em>IEEE Spectrum<\/em><span> robotics. We also post a weekly calendar of upcoming robotics events for the next few months. Please <\/span><a href=\"mailto:automaton@ieee.org?subject=Robotics%20event%20suggestion%20for%20Video%20Friday\">send us your events<\/a><span> for inclusion.<\/span><\/p><h5><a href=\"https://humanoidssummit.com/\">Humanoids Summit Seoul<\/a>: 22–23 September 2026, SEOUL<\/h5><h5><a href=\"https://2026.ieee-iros.org/\">IROS 2026<\/a>: 27 September–1 October 2026, PITTSBURGH<\/h5><h5><a href=\"https://www.corl.org/\">CoRL 2026<\/a>: 9–12 November 2026, AUSTIN<\/h5><p>Enjoy today’s videos!<\/p><div class=\"horizontal-rule\"><\/div><div><span style=\"display: none;\"> <\/span><\/div><p class=\"rm-anchors\" id=\"2o41k1nlo1y\">A <a href=\"https://spectrum.ieee.org/flying-quadrotors-with-your-mind\" target=\"_blank\">quadrotor<\/a> is really just two birotors that love each other very much.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://climb.mie.utoronto.ca/\">CLIMB Lab<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"hsnniqsk2vu\">The last 30 seconds of this video are fantastic.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://tolomeis.github.io/contact-guided-exp/\">ETH Zurich Robotic Systems Lab<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"ljpm_2a1zre\">This is great! But if you really want to impress me, convince me that it’s a) safe to be in my home and 2) a realistic alternative to a human.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.figure.ai/news/helix-2-5-zero-shot-30-home-generalization\">Figure<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"2dbyg67etua\">I doubt anyone would call Digit 5 pretty, but here is what serious <a href=\"https://spectrum.ieee.org/humanoid-robot-safety\" target=\"_blank\">humanoid safety<\/a> looks like.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.agilityrobotics.com/\">Agility<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"setzfvdtc7i\"><em>NYU Tandon researchers built an undulatory robot that pumps water between its head and tail to climb slopes, clear steps, and swim, all while keeping the same basic gait.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><blockquote><em>On an incline, shifting water toward the head increases the force pressing the robot’s front contact points against the surface, giving them more traction. Head-biased placement was the only configuration that successfully carried WorMa up the steepest incline tested, 19.5 degrees; every other configuration slid back down. It also reduced the robot’s cost of transport by at least 33 percent compared with the other configurations.<\/em><br /><em>Steps required something different. Neither a fixed head-heavy nor tail-heavy robot could clear a step on its own. The researchers instead had WorMa approach the step with water in its head for traction, then shifted the water to the tail and raised the head and neck so the tail could push the robot closer. Once the head anchored on the step’s edge, the water shifted back to the head, and the robot continued. That sequence got WorMa over steps as high as 15 centimeters.<\/em><\/blockquote><p>[ <a href=\"https://engineering.nyu.edu/news/robot-shifts-its-own-weight-cross-land-steps-and-water\">NYU Tandon School of Engineering<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"n3obxr3law0\"><em>Kubi 2.0 is a desktop telepresence AI robot that allows remote users to look around and interact as if they were physically present. It is also a Physical AI device enabling AI agents to interact with people in the physical environment. For over the past 10 years in Japan, we have successfully implemented our telepresence solutions to help hospitalized and homebound students attend classes, interact with friends, and participate in school events. Now, we are expanding this initiative globally through Kickstarter.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.kickstarter.com/projects/kubi-2/kubi-20-be-present-from-anywhere\">Kubi 2.0 Telepresence Kickstarter<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"baelsmhwmni\">I am oddly impressed by this use case for a wheeled quadruped.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.accessnewswire.com/newsroom/en/industrial-and-manufacturing/technology-empowers-desertification-control-deep-robotics-robotic-dog-1221078\">DEEP Robotics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"rpkqzo1vshu\"><em>Legged robots are versatile on land, but their use in underwater environments remains limited. Extending quadruped locomotion to water enables amphibious mobility with applications in inspection, environmental monitoring, and disaster response. This paper presents the design, modeling, and experimental validation of a reproducible underwater quadruped robot. The robot is built around custom waterproof motor housings machined from polyoxymethylene plastic, which use off-the-shelf O-rings and dynamic shaft seals. A simplified model is derived to describe the dynamics of this underwater legged system, capturing how drag forces on spherical end effectors transmit torque to the floating base. Building on this model, a closed-loop attitude controller is developed using an error formulation defined on the special orthogonal group SO(3). The controller is evaluated both in simulation and experimentally in a water tank, where the robot tracks desired orientation setpoints in roll, pitch, and yaw.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://ntnu-arl.github.io/underwater-quadruped-robot/\">Norwegian University of Science & Technology Autonomous Robots Lab<\/a> ]<\/p><p>Thanks, Kostas!<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"4ehrwhjw5ha\"><em>Ugo Nova, a domestically produced [in Japan] semi-humanoid robot, accelerates the social implementation of physical AI, from research and development to operation in industrial settings.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://ugo.plus/ai/ugo-nova/\">Ugo<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"tpj1xtgl1nc\">I appreciate how much manipulation you can actually do with a good <a href=\"https://spectrum.ieee.org/robots-getting-a-grip-on-general-manipulation\" target=\"_blank\">two-finger gripper<\/a> and a clever robot.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.dmrobot.com/en/\">Daimon Robotics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"hulfqorvpxa\"><em>One humanoid robot rolls off the line every 10 minutes. UBTECH’s benchmark humanoid robot smart factory just goes live—from 1,000 to 10,000 units, we made the leap in less than 9 months.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>This is great! But what are they all going to do?<\/p><p>[ <a href=\"https://www.ubtrobot.com/en/humanoid/products/walker-s2\">UBTECH<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"ao1u9joxlpk\"><em>MIT engineers have built a robotic optics lab that builds, runs, and dismantles an optics experiment on demand. The setup centers on a robotic arm that physically arranges mirrors, lenses, and other optical components that are each set in custom-designed, QR-encoded housings. The robot arranges each component in precise alignments to direct and focus a beam of light (red laser). The autonomous system could speed up testing of high-tech materials, from solar cells and sensors to video displays and quantum technologies. This video is sped up 2x.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://news.mit.edu/2026/robotic-lab-runs-optics-experiments-on-demand-0917\">MIT<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"nlbijwhuqx4\"><em>Student-built rovers. Lunar terrain. High-stakes competition at NASA’s Kennedy Space Center. See the energy, engineering, and excitement of Lunabotics as university teams put their robotic systems to the test in a simulated lunar environment. These are highlights from the previous competition, as well as a look ahead as teams get ready for Lunabotics 2027.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.nasa.gov/learning-resources/lunabotics-challenge/\">Lunabotics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"gsoci0alw6g\">This CMU Robotics Institute Seminar is by Erol Şahin from METU, on “Augmenting Bee Colonies with Robotics and AI Technologies for Ecosystem Support.”<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><blockquote><em>Earth’s ecosystems are facing a rapid decline in biodiversity, with honeybees—keystone pollinators critical to ecosystem stability—being among the most affected. The EU-funded RoboRoyale project addresses this crisis by integrating advanced robotics and AI to augment the beehive, enabling observation at unprecedented resolutions and scales. Featured on the cover of Science Robotics<\/em><em> and receiving the 6th Edge of Government Award at the World Government Summit in 2024, our system tracks the Queen’s behaviors, colony efficiency, comb states, and long-term foraging activities, while advancing microrobotic intervention capabilities to support hive health. In this talk, I will discuss the challenges of developing this system, share key findings regarding complex social interactions, and explore the future potential of bio-hybrid research.<\/em><\/blockquote><p>[ <a href=\"https://www.ri.cmu.edu/event/augmenting-bee-colonies-with-robotics-and-ai-technologies-for-ecosystem-support/\">Carnegie Mellon University Robotics Institute<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div>"}, {"title": "SoftBank agrees to acquire Robotics and AI Institute", "source": "Robotics Business Review", "date": "2026-09-18", "url": "https://www.therobotreport.com/softbank-agrees-to-acquire-robotics-and-ai-institute/", "summary": "<p>The deal has been rumored for a couple of months, but it is now being reviewed by the Committee on Foreign Investment in the United States.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/softbank-agrees-to-acquire-robotics-and-ai-institute/\">SoftBank agrees to acquire Robotics and AI Institute<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "F-Prime Capital to give insights on the state of robotics investments at RoboBusiness", "source": "Robotics Business Review", "date": "2026-09-18", "url": "https://www.therobotreport.com/f-prime-capital-give-insights-state-robotics-investments-robobusiness/", "summary": "<p>Sanjay Aggarwal and Betsy Mulé of F-Prime Capital will unveil the firm's State of Robotics Investments report at RoboBusiness.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/f-prime-capital-give-insights-state-robotics-investments-robobusiness/\">F-Prime Capital to give insights on the state of robotics investments at RoboBusiness<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "The picks-and-shovels strategy behind the robotics boom", "source": "Robotics Business Review", "date": "2026-09-18", "url": "https://www.therobotreport.com/the-picks-and-shovels-strategy-behind-the-robotics-boom/", "summary": "<p>The real robotics opportunity isn’t a humanoid in every home—it’s packaging robots for the jobs businesses need done today.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/the-picks-and-shovels-strategy-behind-the-robotics-boom/\">The picks-and-shovels strategy behind the robotics boom<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Robotics investments reach $4.9B in August 2026", "source": "Robotics Business Review", "date": "2026-09-17", "url": "https://www.therobotreport.com/robotics-investments-reach-4-9b-in-august-2026/", "summary": "<p>The August 2026 Robotics Investments Report includes a table with all 162 investments rounds, complete with breakdowns by technology, country, funding stage, and more.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/robotics-investments-reach-4-9b-in-august-2026/\">Robotics investments reach $4.9B in August 2026<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Arm Total Design for Physical AI brings more than 80 developers together", "source": "Robotics Business Review", "date": "2026-09-17", "url": "https://www.therobotreport.com/arm-total-design-for-physical-ai-brings-more-than-80-developers-together/", "summary": "<p>With its new program and its Robotics Capability Framework, Arm aims to bring more clarity and unity to the robotics industry.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/arm-total-design-for-physical-ai-brings-more-than-80-developers-together/\">Arm Total Design for Physical AI brings more than 80 developers together<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Designing long-travel axes: When rack and pinion outperforms ball screws and linear motors", "source": "Robotics Business Review", "date": "2026-09-17", "url": "https://www.therobotreport.com/designing-long-travel-axes-when-rack-and-pinion-outperforms-ball-screws-and-linear-motors/", "summary": "<p>When long-travel motion demands more than ball screws and linear motors can deliver, rack-and-pinion systems can offer a compelling combination of speed, precision, scalability, and cost. Here’s when engineers should consider the tradeoff.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/designing-long-travel-axes-when-rack-and-pinion-outperforms-ball-screws-and-linear-motors/\">Designing long-travel axes: When rack and pinion outperforms ball screws and linear motors<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Rethinking Robot Safety in the Age of AI", "source": "IEEE Spectrum Robotics", "date": "2026-09-16", "url": "https://spectrum.ieee.org/physical-ai-robot-cybersecurity-vicone", "summary": "<img src=\"https://spectrum.ieee.org/media-library/humanoid-robots-and-people-walking-through-a-modern-city-street-with-glass-buildings.jpg?id=67745861&amp;width=1245&amp;height=700&amp;coordinates=0%2C0%2C0%2C0\" /><br /><br /><p><em>This article is brought to you by <a href=\"https://vicone.com?utm_source=ieee-spectrum&amp;utm_medium=sponsored-content&amp;utm_campaign=2026-09\" target=\"_blank\">VicOne<\/a>.<\/em><\/p><p>Robot safety has traditionally asked: Can a machine remain safe when something goes wrong? Physical AI raises a harder question: Can a machine remain safe when an attacker changes what it sees, decides, or does even when nothing appears to have failed?<\/p><p>As AI and robotics continue to advance at an unprecedented pace, modern robots perceive through multimodal sensors, interpret context using AI models, and translate those interpretations into physical action. As they move into dynamic environments, their safety increasingly depends on the integrity of the data guiding their decisions.<\/p><p>That dependence creates risks that conventional safety assessments may not fully capture. Recent research has demonstrated that manipulating what a robot sees, hears, or interprets can influence its behavior without requiring direct control.<\/p><p>Such manipulation can occur anywhere across its complex sensing and decision-making system — a layered attack surface encompassing training pipelines, system infrastructure, and runtime perception.<\/p><h2>Layer One: Corrupting intelligence at its source<\/h2><p>In 2017, <a href=\"https://arxiv.org/abs/1708.06733\" rel=\"noopener noreferrer\" target=\"_blank\">BadNets<\/a> demonstrated that a model could behave normally under most conditions, yet fail in the presence of a specific hidden trigger. In one example, a subtle pattern caused a stop sign to be misclassified as a speed limit sign without affecting the model’s behavior on other inputs.<\/p><p>What began as a classification vulnerability has since evolved into action manipulation.<\/p><p>At NeurIPS 2025, researchers introduced <a href=\"https://arxiv.org/abs/2505.16640\" rel=\"noopener noreferrer\" target=\"_blank\">BadVLA<\/a><strong> <\/strong>a backdoor attack targeting Vision-Language-Action (VLA) models that allow robots to see, interpret instructions, and produce coordinated physical movement. Rather than altering a single label, the attack caused conditional deviations in the robot’s action trajectory when a trigger was present. Without the trigger, the model largely preserved normal task performance, while the backdoor remained effective under task transfers and model fine-tuning.<\/p><p>A related study in 2025, <a href=\"https://arxiv.org/abs/2510.09269\" rel=\"noopener noreferrer\" target=\"_blank\">GoBA<\/a>, showed that ordinary objects such as a coffee mug could serve as a reliable trigger. The researchers reported a 97 percent attack success rate without degrading performance on clean inputs.<\/p><p class=\"pull-quote\">A critical safety question today is whether Physical AI models remain within their task and safety boundaries under adversarial conditions.<\/p><p>These studies expose a blind spot in model validation: A model may pass testing yet produce corrupted behavior when a hidden trigger appears in operation.<\/p><p>So a critical safety question today is whether Physical AI models remain within their task and safety boundaries under adversarial conditions. <a href=\"https://vicone.com/company/press-releases/vicone-turns-def-con-34-robot-hacking-research-into-free-nvidia-isaac-sim-extension?utm_source=ieee-spectrum&amp;utm_medium=sponsored-content&amp;utm_campaign=2026-09\" rel=\"noopener noreferrer\" target=\"_blank\">Simulation tools<\/a> such as NVIDIA Isaac Sim, when paired with <a href=\"https://vicone.com/products/radeis?utm_source=ieee-spectrum&amp;utm_medium=sponsored-content&amp;utm_campaign=2026-09\" target=\"_blank\">VicOne Radeis<\/a>, can test the effects of manipulated inputs before deployment.<\/p><p class=\"shortcode-media shortcode-media-youtube\"> <span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span> <small class=\"image-media media-caption\">VicOne LAB R7 demonstrates Radeis, a Physical AI safety validator for NVIDIA Isaac Sim that tests how adversarial visual inputs affect robot behavior before deployment.<\/small><small class=\"image-media media-photo-credit\">VicOne<\/small><\/p><h2>Layer Two: System vulnerabilities as gateways to AI control<\/h2><p>Even a securely trained model can be subverted if the surrounding system stack is vulnerable.<\/p><p>In September 2025, researchers disclosed <a href=\"https://github.com/Bin4ry/UniPwn\" rel=\"noopener noreferrer\" target=\"_blank\">UniPwn<\/a>, a Bluetooth <a href=\"https://spectrum.ieee.org/unitree-robot-exploit\" target=\"_blank\">exploit chain affecting quadruped and humanoid robots<\/a> from a major manufacturer. Hardcoded cryptographic keys allowed traffic decryption, authentication checks were bypassed, and command injection enabled root-level execution. The exploit is also described as “wormable.” A compromised robot could scan nearby units and potentially affect an entire fleet.<\/p><p class=\"shortcode-media shortcode-media-youtube\"> <span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span> <small class=\"image-media media-caption\">VicOne Lab R7’s demo shows how chaining three wireless exploits can trigger uncontrolled robot behavior within 60 seconds, resulting in operational disruption.<\/small><small class=\"image-media media-photo-credit\">VicOne<\/small><\/p><p><span>Middleware creates another exposure point. Vulnerabilities in <a href=\"https://www.ros.org/\" target=\"_blank\">ROS 2<\/a> and DDS-based systems can enable arbitrary code execution or abuse unauthenticated topics to deliver malicious commands. With sufficient access, an attacker could override motor commands or replace AI model weights without directly attacking the model architecture.<\/span><\/p><p>In this case, the components may still function as designed. What has changed is the trustworthiness of the commands flowing through the system. Vulnerability management can help teams identify known risks before deployment, while continuous monitoring can surface emerging threats.<\/p><h2>Layer Three: Manipulating perception and reasoning at runtime<\/h2><p>At runtime, manipulating inputs that shape perception or reasoning may require neither firmware modification nor a network breach.<\/p><p>In 2024, <a href=\"https://robopair.org/\" target=\"_blank\">RoboPAIR<\/a><strong> <\/strong>demonstrated how carefully structured prompts could redirect LLM-controlled robots into unsafe trajectories. <a href=\"https://arxiv.org/abs/2407.20242\" target=\"_blank\">BadRobot<\/a><strong> <\/strong>exposed a deeper architectural weakness: in several cases, a robot verbally refused a dangerous command while its motion controller executed the action anyway.<\/p><p>Vision-based manipulation is equally powerful. <a href=\"https://arxiv.org/abs/2411.13587\" target=\"_blank\">VLAttack<\/a><strong> <\/strong>showed that an adversarial patch within the camera’s view could reduce a VLA model’s task success rate to zero. <a href=\"https://arxiv.org/abs/2509.19870\" target=\"_blank\">FreezeVLA<\/a><strong> <\/strong>showed that a single adversarial image could freeze a robot’s decision-making loop, making it unresponsive to subsequent instructions.<\/p><p class=\"pull-quote\">Runtime assurance must therefore look beyond whether individual components remain available and assess whether cyber events are beginning to affect physical behavior.<\/p><p>In each case, the camera may still work, the model may still run, and the controller may still respond. Yet the resulting behavior can be unsafe because the robot is acting on manipulated perception or reasoning.<\/p><p>Runtime assurance must therefore look beyond whether individual components remain available and assess whether cyber events are beginning to affect physical behavior. Security event correlation, behavioral-impact assessment, and policy-bounded response supported by edge AI, can help contain the affected path without unnecessarily stopping the entire robot fleet.<\/p><h2>From point-in-time safety to lifecycle assurance<\/h2><p>The risks across these three layers reveal the missing layer in robot safety assurance: cybersecurity. Functional safety addresses failures and unexpected operating conditions; cybersecurity extends that assurance to deliberate manipulation, including attacks that may leave the underlying system apparently functional.<\/p><p>This requires assurance across the robot’s lifecycle. During design, teams need to understand which cyber risks could invalidate assumptions behind intended behavior. Before deployment, they should test whether realistic attacks can cause a robot to deviate from its task or safety boundaries. In operation, monitoring should identify whether cyber events are beginning to affect behavior, contain the affected path, and preserve safe operation where possible.<\/p><p class=\"shortcode-media shortcode-media-rebelmouse-image\"> <img alt=\"Diagram of end\\u2011to\\u2011end AI robot security from development to operation monitoring\" class=\"rm-shortcode\" id=\"097ea\" src=\"https://spectrum.ieee.org/media-library/diagram-of-end-u2011to-u2011end-ai-robot-security-from-development-to-operation-monitoring.jpg?id=67745953&amp;width=980\" /> <small class=\"image-media media-caption\">VicOne’s lifecycle approach combines AI model and vulnerability scanning, simulation-based validation, and continuous monitoring to help secure robots from development through operation.<\/small><small class=\"image-media media-photo-credit\">VicOne<\/small><\/p><p><span>While cybersecurity does not replace functional safety, it helps ensure that Physical AI remains within acceptable boundaries even when what it sees, decides, or does is under attack.<\/span><\/p><p>For a deeper look at the cybersecurity risks and defense strategies shaping autonomous robotics, download our whitepaper “<a href=\"https://info.vicone.com/ai-robotics-security-risk-whitepaper?utm_source=ieee-spectrum&amp;utm_medium=sponsored-content&amp;utm_campaign=2026-09\" target=\"_blank\">Securing the Rise of AI Robots: Cyber Risks, Real-World Threats, and Defense Strategies<\/a>.”<\/p>"}, {"title": "The evolution of Digit: Agility Robotics’ journey from Cassie to Digit 5", "source": "Robotics Business Review", "date": "2026-09-16", "url": "https://www.therobotreport.com/the-evolution-of-digit-agility-robotics-journey-from-cassie-to-digit-5/", "summary": "<p>From Cassie, to five different versions of Digit, Agility Robotics has adapted its technology to fit industrial tasks. <\/p>\n<p>The post <a href=\"https://www.therobotreport.com/the-evolution-of-digit-agility-robotics-journey-from-cassie-to-digit-5/\">The evolution of Digit: Agility Robotics&#8217; journey from Cassie to Digit 5<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "OLogic to share how robots can learn from human demonstrations at RoboBusiness", "source": "Robotics Business Review", "date": "2026-09-16", "url": "https://www.therobotreport.com/ologic-to-share-how-robots-can-learn-from-human-demonstrations-at-robobusiness/", "summary": "<p>OLogic CEO Ted Larson will explore the foundations of egocentric robot learning and the technical challenges involved in building these systems.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/ologic-to-share-how-robots-can-learn-from-human-demonstrations-at-robobusiness/\">OLogic to share how robots can learn from human demonstrations at RoboBusiness<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Agility’s Digit 5 humanoid has new legs, batteries, and safety upgrades", "source": "Robotics Business Review", "date": "2026-09-15", "url": "https://www.therobotreport.com/agilitys-digit-5-humanoid-has-new-legs-batteries-safety-upgrades/", "summary": "<p>The latest version of Digit includes new knees, upgraded batteries, and more comprehensive safety architecture.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/agilitys-digit-5-humanoid-has-new-legs-batteries-safety-upgrades/\">Agility’s Digit 5 humanoid has new legs, batteries, and safety upgrades<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Digit 5 May Be the First Humanoid Robot Worker That’s Truly Safe", "source": "IEEE Spectrum Robotics", "date": "2026-09-15", "url": "https://spectrum.ieee.org/humanoid-robot-safety", "summary": "<img src=\"https://spectrum.ieee.org/media-library/a-front-and-an-angled-view-of-a-teal-colored-humanoid-robot-with-arms-bent-at-the-elbow.jpg?id=67776740&amp;width=1245&amp;height=700&amp;coordinates=0%2C187%2C0%2C188\" /><br /><br /><p><span>Despite the recent deluge of videos of humanoid robots doing backflips and kung fu, the actual pace of progress towards humanoids that can do economically viable jobs at scale has at times seemed a bit plodding. There are <\/span><a href=\"https://spectrum.ieee.org/humanoid-robot-scaling\" target=\"_self\">some good reasons for this<\/a><span>: A humanoid robot needs to be powerful enough to do useful work, safe enough for humans to walk past, and have enough battery life to limit how much of the day it’s hooked to a charger. But all three of those necessary features actively work against each other.<\/span><\/p><p>With its new Digit 5 robot, announced today, Agility Robotics may have found the sweet spot. Digit 5 is a humanoid worker that can lift 23 kilograms up 2.1 meters, can work in close proximity to people without relying on physical barriers, and can operate for more than 20 hours a day. This combination of power, safety, and battery life has resulted in a 1.8-meter tall, 129-kg robot that prioritizes functionality over style and pretty much everything else, but this is exactly what it’s going to take to get humanoids a job.<\/p><p class=\"shortcode-media shortcode-media-youtube\"> <span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span> <\/p><p>Humanoid robot companies have been reluctant to talk about safety, because there are no easy answers to “What happens if your fundamentally unstable bipedal robot falls over onto me/my pet/my baby?” And there are still no easy answers, but Agility does have <em><em>an<\/em><\/em> answer that allows Digit to be verifiably safe. That answer is to make sure that it’s physically impossible for Digit to fall over on anyone, ever, by “autonomously avoiding, stopping, or assuming a seated position,” according to today’s press release. In other words, as a person approaches Digit, Digit will put down whatever it’s carrying and then if necessary make sure that it’s stably seated on the ground before that person gets near. It may not be elegant, but it works, which is more than can be said for any other commercial humanoid that I’m aware of.<\/p><p>The other big change is Digit’s legs. Somewhat famously, Agility Robotics first introduced Cassie and then a whole series of Digit robots featuring bird-like ‘backwards’ legs. In <a href=\"https://spectrum.ieee.org/building-robots-that-can-go-where-we-go\" target=\"_self\">his 2019 article for IEEE Spectrum<\/a>, Agility co-founder Jonathan Hurst explained that this leg configuration was the result of a careful analysis of the physics of animal locomotion, rather than for the leg to look like any sort of animal in particular. The unfortunate reality for those of us who were fans of Cassie is that bird legs are optimal for dynamic motion, while human legs are better for squats and lifts, which will make sense to anyone who has seen an ostrich trying to lift a heavy box up off the floor and also anyone who has tried to outrun a cassowary.<\/p><h2>How much will Digit 5 cost?<\/h2><p>We also know a couple of things about Digit 5 that weren’t included in today’s announcement, thanks to Agility’s June <a href=\"https://www.sec.gov/Archives/edgar/data/2074973/000121390026071287/ea029548401ex99-2.htm\" rel=\"noopener noreferrer\" target=\"_blank\">SEC filing<\/a> in advance of their <a href=\"https://www.agilityrobotics.com/content/agility-robotics-to-go-public-through-merger-with-churchill-capital-corp-xi\" rel=\"noopener noreferrer\" target=\"_blank\">plan to go public by the end of 2026<\/a>. For example, at launch, <a href=\"https://www.sec.gov/Archives/edgar/data/2074973/000121390026071287/ea029548401_ex99-2img46.jpg\" rel=\"noopener noreferrer\" target=\"_blank\">Digit 5’s BOM (bill of materials) cost<\/a> is likely to be somewhere between US $150,000 and $200,000. This is just the cost of the parts that make up a Digit robot, not what it costs for Agility to actually build one. Based on real production data, Agility is anticipating that with some near-term optimizing and at a volume of 10,000 units per year, that cost should drop to under US $50,000 per robot. <\/p><p class=\"shortcode-media shortcode-media-rebelmouse-image\"> <img alt=\"An illustration of humanoid robots working in a warehouse with humans in the distance.\" class=\"rm-shortcode\" id=\"a6c5f\" src=\"https://spectrum.ieee.org/media-library/an-illustration-of-humanoid-robots-working-in-a-warehouse-with-humans-in-the-distance.jpg?id=67776745&amp;width=980\" /> <small class=\"image-media media-caption\">In this rendering, Digit 5 robots work in a factory with humans nearby, no safety barriers needed. When a human approaches, the robot puts down what it’s carrying and squats down so it can’t fall on anybody.<\/small><small class=\"image-media media-photo-credit\">Agility<\/small><\/p><p>Arguably less important than the per-robot cost is how Agility (and its customers) will profit from Digit 5. In the filing, <a href=\"https://www.sec.gov/Archives/edgar/data/2074973/000121390026071287/ea029548401_ex99-2img41.jpg\" target=\"_blank\">Agility estimates<\/a> (using “rounded estimates” which are “purely illustrative”) that Digit 5 robots will be offered to customers as a service at something like $8,500 per month. Based on 20 hours per day of work, and assuming that the total cost of a human worker to their employer is $30.50 per hour, Digit 5 as a service could save employers $100,000 per year, per robot. <\/p><p>It’s important to note that all of these numbers are just estimates, and that all kinds of things (many of them not under Agility’s control) could cause them to change. They’re most useful as an illustration of Agility’s broad approach to making Digit 5 profitable. It’s also important to note the assumption here with such a direct comparison is that Digit 5 will be a more or less effortless drop-in replacement for human labor, which is not something that I’m entirely sure has ever happened with any robot, anywhere.<\/p><p>Where does Digit 5 go from here? Today’s press release says that “as of May 2026, Agility had more than $300 million in multi-year customer orders for Digit 5, with a sales pipeline of prospective customers across manufacturing, warehousing, and logistics.” That works out to comfortably under 1,000 robots, one-tenth of the full capacity of <a href=\"https://spectrum.ieee.org/agility-humanoid-robotics-factory\" target=\"_self\">Agility’s RoboFab factory<\/a> in Oregon.<\/p><p>Between now and all those robots, however, lies an unpredictable entry into the stock market through what’s called a <a href=\"https://www.agilityrobotics.com/content/agility-robotics-to-go-public-through-merger-with-churchill-capital-corp-xi\" target=\"_blank\">SPAC (special purpose acquisition company) merger<\/a>. That’s expected to close within the next few months. Agility hopes to raise more than $620 million through the merger, and it will primarily spend the money to scale production of Digit 5 and get it to customers. Those in the European Union and United Kingdom should be able to buy the bots in 2027.<\/p>"}, {"title": "InOrbit.AI releases OpenRobOps ISO 21423 reference implementation", "source": "Robotics Business Review", "date": "2026-09-15", "url": "https://www.therobotreport.com/inorbit-ai-releases-openrobops-iso-21423-reference-implementation/", "summary": "<p>OpenRobOps gives robotics developers a foundation to deliver a fleet manager with support for the upcoming interoperability standard. <\/p>\n<p>The post <a href=\"https://www.therobotreport.com/inorbit-ai-releases-openrobops-iso-21423-reference-implementation/\">InOrbit.AI releases OpenRobOps ISO 21423 reference implementation<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Heart of the Matter: How a Major Children’s Hospital Uses Open Source NVIDIA AI for Cardiac Care", "source": "NVIDIA Robotics", "date": "2026-09-15", "url": "https://blogs.nvidia.com/blog/childrens-hospital-open-source-ai-cardiac-care/", "summary": ""}, {"title": "Universal Robots launches its seventh generation robot platform at IMTS", "source": "Robotics Business Review", "date": "2026-09-14", "url": "https://www.therobotreport.com/universal-robots-launches-its-seventh-generation-robot-platform-at-imts/", "summary": "<p>Universal Robots has released three new robot arms, a rebuilt core controller, a new AI-ready tool flange, and more. <\/p>\n<p>The post <a href=\"https://www.therobotreport.com/universal-robots-launches-its-seventh-generation-robot-platform-at-imts/\">Universal Robots launches its seventh generation robot platform at IMTS<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Arm to discuss scaling physical AI at RoboBusiness", "source": "Robotics Business Review", "date": "2026-09-14", "url": "https://www.therobotreport.com/arm-to-discuss-scaling-physical-ai-at-robobusiness/", "summary": "<p>Dermot O'Driscoll, the VP of go-to-market for physical AI at Arm, will examine key compute principles behind trusted physical AI.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/arm-to-discuss-scaling-physical-ai-at-robobusiness/\">Arm to discuss scaling physical AI at RoboBusiness<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Why RaaS needs more than a subscription model", "source": "Robotics Business Review", "date": "2026-09-14", "url": "https://www.therobotreport.com/why-raas-needs-more-than-a-subscription-model/", "summary": "<p>At RoboBusiness 2026, a panel of robotics business leaders will examine the practical playbook behind Robots-as-a-Service or RaaS offerings. <\/p>\n<p>The post <a href=\"https://www.therobotreport.com/why-raas-needs-more-than-a-subscription-model/\">Why RaaS needs more than a subscription model <\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Report covers advances in surgical robots, deploying warehouse automation in the real world", "source": "Robotics Business Review", "date": "2026-09-14", "url": "https://www.therobotreport.com/report-covers-surgical-robot-advances-deploying-warehouse-automation-real-world/", "summary": "<p>Learn from a surgical robotics case study and a discussion of how to best deploy mobile robots in the warehouse in this issue.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/report-covers-surgical-robot-advances-deploying-warehouse-automation-real-world/\">Report covers advances in surgical robots, deploying warehouse automation in the real world<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "How autonomous fleets are changing what’s possible in American agriculture", "source": "Robotics Business Review", "date": "2026-09-13", "url": "https://www.therobotreport.com/how-autonomous-fleets-are-changing-whats-possible-american-agriculture/", "summary": "<p>Autonomous tractors can help American agriculture, as exemplified in ASI's collaboration with U.S. Sugar and Everglades Equipment.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/how-autonomous-fleets-are-changing-whats-possible-american-agriculture/\">How autonomous fleets are changing what&#8217;s possible in American agriculture<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Ultrasound offers a scalable path to tactile intelligence for physical AI", "source": "Robotics Business Review", "date": "2026-09-12", "url": "https://www.therobotreport.com/ultrasound-offers-scalable-path-tactile-intelligence-physical-ai/", "summary": "<p>Ultrasound sensing can provide tactile perception for robotic hands while avoiding wear and tear, says UltraSense.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/ultrasound-offers-scalable-path-tactile-intelligence-physical-ai/\">Ultrasound offers a scalable path to tactile intelligence for physical AI<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "How to select the right rack and pinion system for high-precision linear motion", "source": "Robotics Business Review", "date": "2026-09-11", "url": "https://www.therobotreport.com/how-to-select-the-right-rack-and-pinion-system-for-high-precision-linear-motion/", "summary": "<p>GAM explains why robotics designers should consider pinion size when thinking about motion control for high-precision applications. <\/p>\n<p>The post <a href=\"https://www.therobotreport.com/how-to-select-the-right-rack-and-pinion-system-for-high-precision-linear-motion/\">How to select the right rack and pinion system for high-precision linear motion<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "How drone developers are navigating changing regulatory landscapes to help farmers", "source": "Robotics Business Review", "date": "2026-09-11", "url": "https://www.therobotreport.com/how-hylio-drone-developers-navigate-changing-regulatory-landscape-help-farmers/", "summary": "<p>Before the FCC put restrictions on foreign-made robots, it had already set similar restrictions on drones last year, noted Hylio.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/how-hylio-drone-developers-navigate-changing-regulatory-landscape-help-farmers/\">How drone developers are navigating changing regulatory landscapes to help farmers<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Video Friday: Humanoid Robot Takes On Monkey Bars", "source": "IEEE Spectrum Robotics", "date": "2026-09-11", "url": "https://spectrum.ieee.org/video-friday-disaster-response-robots", "summary": "<img src=\"https://spectrum.ieee.org/media-library/humanoid-robot-moves-across-scaffolding-rigged-as-playground-monkey-bars-in-a-lab-while-trying-to-keep-its-balance.gif?id=67756707&amp;width=1245&amp;height=700&amp;coordinates=0%2C105%2C0%2C106\" /><br /><br /><p><span>Video Friday is your weekly selection of awesome robotics videos, collected by your friends at <\/span><em>IEEE Spectrum<\/em><span> robotics. We also post a weekly calendar of upcoming robotics events for the next few months. Please <\/span><a href=\"mailto:automaton@ieee.org?subject=Robotics%20event%20suggestion%20for%20Video%20Friday\">send us your events<\/a><span> for inclusion.<\/span><\/p><h5><a href=\"https://humanoidssummit.com/\">Humanoids Summit Seoul<\/a>: 22–23 September 2026, SEOUL<\/h5><h5><a href=\"https://2026.ieee-iros.org/\">IROS 2026<\/a>: 27 September–1 October 2026, PITTSBURGH<\/h5><h5><a href=\"https://www.corl.org/\">CoRL 2026<\/a>: 9–12 November 2026, AUSTIN<\/h5><p>Enjoy today’s videos!<\/p><div class=\"horizontal-rule\"><\/div><div><span style=\"display: none;\"> <\/span><\/div><blockquote class=\"rm-anchors\" id=\"ky2mqam4lq8\"><em>Traversing sparse 3D structures requires humanoid robots to perceive thin, overhanging geometry while executing agile, accurate whole-body motions. We study this problem through monkey-bar traversal, where the robot must jump to the structure, traverse it through sparse bar interactions, and land safely.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>The list of obstacles that you can traverse to escape a robot is getting shorter.<\/p><p>[ <a href=\"https://nemantor.github.io/sparse-3d-traversal-website/\">ETH Zurich Robotic Systems Lab<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"tkmazhql58o\">YES GIVE ROBOTS TWO HEADS I LOVE IT!<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://generalroboticslab.com/DukeHumanoidv2\">General Robotics Lab<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"wpg0va81l7g\"><em>9/11 was the first documented use of <a href=\"https://spectrum.ieee.org/japan-earthquake-more-robots-to-the-rescue\" target=\"_blank\">robots for urban search and rescue<\/a> and helped create the field of disaster robotics. Personnel began assembling on the afternoon of September 11 and worked the pile from late on  September 11 through October 2, when the last available robot failed. The robots found no survivors, but they located remains and helped search for routes through the rubble toward basements and stairwells where trapped firefighters might have gone.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"http://crasar.org/\">CRASAR<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"ghysqmmria4\"><em>Unitree majorly fully open-sources the UnifoLM-WLA-1.0 embodied foundation model, achieving new SOTA results across multiple benchmarks among open-source models worldwide. A single model coordinates desktop and whole-body mobile manipulation, supporting cross-task and cross-end-effector generalization, driven by one model, whole-body coordination.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://unigen-x.github.io/unifolm-wla.github.io/\">Unitree<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"bsvwmcv60xo\"><em>Compliance is very important in physical interaction. In this work, we show how a multi-lined aerial robot uses its centroid and joint motion to achieve hybrid impedance—admittance control in contact-rich aerial manipulation tasks such as surface sliding. This work will be presented in IEEE IROS 2026.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.dragon.t.u-tokyo.ac.jp/\">DRAGON Lab<\/a> ]<\/p><p>Thanks, Moju!<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"xvuwficd5g0\">Remind me not to get too close to this.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://railab.kaist.ac.kr/\">RaiLab Kaist<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"ypkcijt_nuw\">Welcome to this edition of Things That Really Seem Like They Should Not Fly.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://avfl.engr.tamu.edu/\">Texas A&amp;M University Advanced Vertical Flight Lab<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"fna1crvtbls\"><em>Achieving agile and generalized <a href=\"https://spectrum.ieee.org/quadruped-robot-benchmark-barkour\" target=\"_blank\">legged locomotion<\/a> across terrains requires tight integration of perception and control, especially under occlusions and sparse footholds. Existing methods have demonstrated agility on parkour courses but often rely on end-to-end sensorimotor models with limited generalization and interpretability. By contrast, methods targeting generalized locomotion typically exhibit limited agility and struggle with visual occlusions. We introduce a unified reinforcement learning (RL) framework for agile and generalized locomotion that incorporates a novel attention-based map encoder in the control policy.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://sites.google.com/leggedrobotics.com/ame-2\">ETH Zurich Robotic Systems Lab<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"qkijeldgula\">Finally, the killer app for humanoid robots! But we probably shouldn’t call it that.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.unitree.com/\">Unitree<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"p3bftreqwks\">I suspect that this demo avoids many of the things that are actually difficult about doing dishes. Not just the water and the slippery soapiness, but also identifying when a dish is dirty as well as when it is actually clean.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.flexiv.com/\">Flexiv<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"broo89hfta4\">Sure, I guess I might want a robot to deliver a burrito to me while I’m hiking to the top of a mountain in the rain...?<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.deeprobotics.cn/en\">DEEP Robotics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"k9uhqymng9i\"><em>AI has transformed the digital world. It writes our code, generates our images, reasons in our language. But the physical world—the plants that make our power, our fuel, our steel, and chemicals—it has barely touched. ANYbotics CEO and co-founder Péter Fankhauser on the bet behind the company: Why legged robots turned out to be the way into the world’s most demanding industrial plants, what it took to certify one for explosive atmospheres after experts called it impossible, and where autonomous industrial work goes next.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.anybotics.com/\">ANYbotics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div>"}, {"title": "One brick at a time: How Monumental uses robotics to build walls", "source": "Robotics Business Review", "date": "2026-09-11", "url": "https://www.therobotreport.com/one-brick-at-a-time-how-monumental-uses-robotics-to-build-walls/", "summary": "<p>CEO Salar al Khafaji introduces podcast listeners to how Monumental is using robotics to build walls.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/one-brick-at-a-time-how-monumental-uses-robotics-to-build-walls/\">One brick at a time: How Monumental uses robotics to build walls<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Learn how AVs and robotics are laying the groundwork for field deployments at RoboBusiness", "source": "Robotics Business Review", "date": "2026-09-11", "url": "https://www.therobotreport.com/learn-how-avs-robotics-are-laying-groundwork-field-deployments-robobusiness/", "summary": "<p>ASI CEO Mel Torrie will explore why the intersection of autonomous vehicles and robotics will further revolutionize field deployments.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/learn-how-avs-robotics-are-laying-groundwork-field-deployments-robobusiness/\">Learn how AVs and robotics are laying the groundwork for field deployments at RoboBusiness<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Skild AI Taps NVIDIA Physical AI to Teach Robots New Tasks From a Single Video", "source": "NVIDIA Robotics", "date": "2026-09-10", "url": "https://blogs.nvidia.com/blog/skild-ai-s1-physical-ai/", "summary": "Manufacturing floors, warehouses and production lines rarely stay fixed — tasks change, layouts shift and new products arrive, and most robots can’t keep up without significant reprogramming. Skild AI’s new S1 robot foundation model helps address this, designed to learn previously unseen, long-horizon tasks from a single video demonstration. The model, launched last week, uses [&#8230;]"}, {"title": "Swarmer to acquire Ukrainian UGV maker Ratel Robotics for up to $224M", "source": "Robotics Business Review", "date": "2026-09-10", "url": "https://www.therobotreport.com/swarmer-to-acquire-ukrainian-ugv-maker-ratel-robotics-for-up-to-224m/", "summary": "<p>Swarmer, which has developed swarm software, plans to work with Ratel Robotics' unmanned ground vehicles in Ukraine.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/swarmer-to-acquire-ukrainian-ugv-maker-ratel-robotics-for-up-to-224m/\">Swarmer to acquire Ukrainian UGV maker Ratel Robotics for up to $224M<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Comau automates picking, handling, and palletizing for Decathlon", "source": "Robotics Business Review", "date": "2026-09-10", "url": "https://www.therobotreport.com/comau-automates-picking-handling-and-palletizing-for-decathlon/", "summary": "<p>Comau's system incorporates its MyCo cobot, ROS2 software architecture, AI-powered vision systems, and a modular gripper.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/comau-automates-picking-handling-and-palletizing-for-decathlon/\">Comau automates picking, handling, and palletizing for Decathlon<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Robots Are Learning to Feel", "source": "IEEE Spectrum Robotics", "date": "2026-09-10", "url": "https://spectrum.ieee.org/tactile-data-robots", "summary": "<img src=\"https://spectrum.ieee.org/media-library/image.jpg?id=67745231&amp;width=980\" /><br /><br /><p>Dexterous manipulation remains one of the biggest barriers keeping robots from successfully tackling a wide range of everyday tasks. A sense of touch could be the key, but a lack of quality data has held back progress. This is now starting to change as academic labs and startups race to build new tactile datasets and techniques to put them to use.<\/p><p>Over the last few years, <a href=\"https://spectrum.ieee.org/gemini-robotics\" target=\"_self\">vision-language-action (VLA) models<\/a> have significantly improved the ability of robots to carry out complex tasks involving objects and environments they’ve never encountered before. Pretrained on huge amounts of images, video, and text, and then fine-tuned on a smaller number of teleoperated robot demonstrations, these VLAs can guide robots through a growing range of everyday jobs—<a href=\"https://www.pi.website/blog/pistar06\" rel=\"noopener noreferrer\" target=\"_blank\">like folding laundry, tidying living rooms, and even operating kitchen gadgets<\/a>—using just a video feed and natural language instructions.<\/p><p>But robots still struggle with tasks that require fine-grained hand control, such as handling deformable materials or manipulating small objects—plugging in a USB cable or turning a key in a lock, for example. That’s partly because VLAs ignore one of the primary sources of information humans rely on in these situations: tactile feedback.<\/p><h2>Manipulating Like Humans<\/h2><p>“Most dexterous manipulation can be done by humans with their eyes closed,” says <a href=\"https://people.eecs.berkeley.edu/~trevor/\" rel=\"noopener noreferrer\" target=\"_blank\">Trevor Darrell<\/a>, professor of computer science at the University of California, Berkeley. “Understanding force, slip, and precise grasping is not something that can be done well with traditional vision sensors.”<\/p><p>However, making effective use of tactile sensors is difficult. Tactile sensor data has very different characteristics to the image data VLAs are normally trained on, and tactile datasets lag far behind the internet-scale of many vision and language datasets. To get around this, Darrell’s team devised a way to first pretrain a model on existing datasets before giving it a sense of touch by training a specialist submodel on <a href=\"https://arxiv.org/abs/2606.17055\" rel=\"noopener noreferrer\" target=\"_blank\">100 hours of specially collected, high-quality tactile data<\/a>, including demonstrations of common actions like wiping, grasping, twisting, or pouring using more than 200 different household objects.<\/p><h3><\/h3><br />\n<p class=\"caption\">Explore an interactive visualizer of a small portion of the T-Rex dataset. <span class=\"image-media media-photo-credit\"><a href=\"https://tactile-reactive-dexterous.github.io/#citation\" target=\"_blank\">T-Rex<\/a><\/span><\/p><p>Putting the tactile data to use was not straightforward. The goal was for a robot to be able to use the tactile signal to correct its grip in real time as it manipulated objects. But this requires reaction times faster than most vision-language models operate at. This mismatch is a significant challenge, Darrell says, so the team used separate submodels, known as “experts,” to handle high-level actions and low-level tactile control in a way that’s quick enough for the tactile feedback to be useful.<\/p><p>The action expert produces motion plans, while the tactile expert, which operates four times faster, uses tactile feedback to adjust the motion plan in real time based on what the robot is feeling as it goes. The model was then fine-tuned on about 100 teleoperated demonstrations of relatively complex manipulation tasks, such as screwing in a light bulb, applying toothpaste to a toothbrush, or transferring an egg between trays, where it averaged a success rate of 65 percent across 12 tasks—nearly double the best VLA model.<\/p><h2>Data Diversity<\/h2><p>One limitation, admits Darrell, is that his data comes from a single instance of robotic hardware. Robot hands range from fully articulated five-finger designs to simple pincer grippers, and tactile sensors can rely on fundamentally different physics, from measuring changes in resistance to recording images of a soft gel pad deforming. That makes most tactile AI research sensor-specific, says <a href=\"https://michaelyuancb.github.io/\" target=\"_blank\">Chengbo Yuan<\/a>, a master’s student at Tsinghua University in Beijing, and makes it hard to share data and transfer learnings between groups.<\/p><p>Yuan recently set out to tackle this problem by <a href=\"https://arxiv.org/pdf/2606.13102\" rel=\"noopener noreferrer\" target=\"_blank\">aggregating more than 3,000 hours<\/a> of tactile robotic data from publicly available datasets, covering 21 sensor types and a variety of robot embodiments. Yuan says they were inspired by efforts like the <a href=\"https://spectrum.ieee.org/global-robotic-brain\" target=\"_self\">Open X-Embodiment collaboration<\/a>, which pooled data from many robots and led to models that generalize to hardware not used in training. Yuan’s team then designed a hardware-agnostic model that can train on this diverse data by converting each sensor’s output into a shared format and mapping it onto labeled positions on a template of a human hand. This model was much more successful than a baseline model, even on hardware it had never encountered before. Yuan puts that down to it acquiring “some kind of common sense of tactile knowledge,” by training on such diverse setups.<\/p><h2>Chasing Scale<\/h2><p>Despite the promising results, Yuan thinks more tactile data is needed, and his group is now leading an 80-institution collaboration to collate a larger set of teleoperated demonstrations using a standardized approach to tactile data collection and processing. In the meantime, Fudan University in Shanghai and its spin-out <a href=\"https://baike.baidu.com/en/item/NeoteAI/1682418\" rel=\"noopener noreferrer\" target=\"_blank\">NeoteAI<\/a> have already produced <a href=\"https://research.neoteai.com/assets/n0-foundation-report.pdf\" rel=\"noopener noreferrer\" target=\"_blank\">a tactile dataset<\/a> an order of magnitude larger than previous efforts. Using <a href=\"https://neoteai.com/\" rel=\"noopener noreferrer\" target=\"_blank\">a proprietary sensor<\/a> attached to a variety of robotic arms and a handheld gripper operated by humans, they have collected more than 30,000 hours of demonstrations with synchronized visual and tactile data.<\/p><p>The researchers used this data to <a href=\"https://research.neoteai.com/n0-twam/\" rel=\"noopener noreferrer\" target=\"_blank\">train a model<\/a> that doesn’t just react to touch, but also proactively predicts what the robot should be feeling to help guide and assess actions, significantly improving performance. <a href=\"https://shunlinlu.github.io/\" rel=\"noopener noreferrer\" target=\"_blank\">Shunlin Lu<\/a>, a postdoc researcher at Fudan University and CTO of NeoteAI, says the results are clear evidence that access to large-scale and diverse tactile data leads to significant performance gains.<\/p><p class=\"shortcode-media shortcode-media-youtube\"> <span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><small class=\"image-media media-caption\">Robot manipulation policies with a tactile component offer improved performance on a variety of real-world tasks.<\/small><small class=\"image-media media-photo-credit\">NeoteAI<\/small><\/p><p>Another approach to scaling tactile data could be to piggyback on the vast quantities of visual robotics data already collected. Researchers at the University of Southern California, in Los Angeles, recently <a href=\"https://arxiv.org/pdf/2607.20683\" rel=\"noopener noreferrer\" target=\"_blank\">released a model<\/a> that learned to infer tactile information from visual data, by training it on more than 2,700 demonstrations of everyday manipulation using a handheld gripper that records both tactile data and images from a camera on the device. The model learned associations between images of the gripper coming into contact with objects and the amount of pressure felt by the tactile sensors at that moment, giving even robots without tactile sensors a rudimentary sense of touch that the researchers showed to be particularly useful for contact-rich manipulation tasks. But their broader ambition is to use the generator to add tactile data to existing vision datasets.<\/p><p>How much tactile data will be required for breakthroughs in dexterous tasks remains unclear. So far, tactile training’s main contribution has been to make robots more efficient learners at tasks already within reach like picking and placing objects, says Yuan, and he suspects new algorithms may be required to tackle problems truly impossible without touch.<\/p><p><a href=\"https://people.ucas.ac.cn/~chenglong?language=en\" rel=\"noopener noreferrer\" target=\"_blank\">Long Cheng<\/a> of the Chinese Academy of Sciences in Beijing also thinks raw data is no panacea. “Data is good,” he says. “But how to use them correctly is another issue.” The problem, he notes, is that vision provides a continuous, high-bandwidth stream of pixels, while tactile signals are sparse and intermittent, so models learn to ignore them. His solution, being presented at <a href=\"https://2026.ieee-iros.org/\" rel=\"noopener noreferrer\" target=\"_blank\">IROS 2026<\/a> later this month, is a model that predicts what a robot will feel from vision alone and then compares it against real tactile input. A large gap between the two means the sensor is detecting something the robot would otherwise miss, so these surprising signals are amplified while predictable ones are dampened. Across five contact-rich tasks, the approach averaged 62.8 percent success against 28.2 percent for the same model without touch.<\/p><p>Lu is more confident that data scaling could have similar benefits to those seen in areas like language and vision. He guesses closer to 100,000 hours, collected in varied, real-world settings rather than in the lab, could unlock new capabilities. Either way, the field now has some early signs that larger tactile datasets and smarter ways to use them can give robots a significant boost on some of the most challenging tasks. “I think tactile intelligence is actually the next step for physical AI,” Lu says.<\/p>"}, {"title": "Teradyne Robotics sues JAKA over 3 Universal Robots patents", "source": "Robotics Business Review", "date": "2026-09-10", "url": "https://www.therobotreport.com/teradyne-robotics-sues-jaka-over-3-universal-robots-patents/", "summary": "<p>New details reveal the lawsuit involves three Universal Robots patents about robot interfaces, safety brakes, and joints.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/teradyne-robotics-sues-jaka-over-3-universal-robots-patents/\">Teradyne Robotics sues JAKA over 3 Universal Robots patents<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "AGIBOT to explain how to scale humanoids from the lab to the real world at RoboBusiness", "source": "Robotics Business Review", "date": "2026-09-09", "url": "https://www.therobotreport.com/agibot-share-plans-scale-humanoids-from-lab-to-real-world-at-robobusiness/", "summary": "<p>AGIBOT plans to give attendees actionable insights on identifying high-value robotics use cases and building sustainable developer ecosystems.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/agibot-share-plans-scale-humanoids-from-lab-to-real-world-at-robobusiness/\">AGIBOT to explain how to scale humanoids from the lab to the real world at RoboBusiness<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Vention opens Physical AI Lab for manufacturing in Montreal", "source": "Robotics Business Review", "date": "2026-09-09", "url": "https://www.therobotreport.com/vention-opens-physical-ai-lab-manufacturing-montreal/", "summary": "<p>Vention's new Physical AI Lab will focus on advancing robotic manipulation from research to scalable production-line deployment.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/vention-opens-physical-ai-lab-manufacturing-montreal/\">Vention opens Physical AI Lab for manufacturing in Montreal<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Unitree shares down 53% from IPO debut", "source": "Robotics Business Review", "date": "2026-09-09", "url": "https://www.therobotreport.com/unitree-shares-down-53-from-ipo-debut/", "summary": "<p>The market is pulling back on Unitree's $66 billion valuation from its debut on the Shanghai Stock Exchange just last month.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/unitree-shares-down-53-from-ipo-debut/\">Unitree shares down 53% from IPO debut<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "What bricklaying has taught Monumental about robots in construction", "source": "Robotics Business Review", "date": "2026-09-09", "url": "https://www.therobotreport.com/what-bricklaying-has-taught-monumental-about-robots-construction/", "summary": "<p>The construction industry is rife with opportunity for robotics, but the technology hasn't broken in at scale yet. <\/p>\n<p>The post <a href=\"https://www.therobotreport.com/what-bricklaying-has-taught-monumental-about-robots-construction/\">What bricklaying has taught Monumental about robots in construction<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Why vision AI is the safety backbone of the automated job site", "source": "Robotics Business Review", "date": "2026-09-08", "url": "https://www.therobotreport.com/why-vision-ai-is-safety-backbone-of-automated-job-site/", "summary": "<p>Vision AI doesn't replace robots or human judgement; it provides the continuous perception that allows both to operate safely together.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/why-vision-ai-is-safety-backbone-of-automated-job-site/\">Why vision AI is the safety backbone of the automated job site<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Boston Dynamics veteran launches Dynamic Creatures to bring characters to life with robotics", "source": "Robotics Business Review", "date": "2026-09-08", "url": "https://www.therobotreport.com/boston-dynamics-veterans-launch-dynamic-creatures-to-bring-characters-to-life-with-robotics/", "summary": "<p>Dynamic Creatures plants to create its own line of characters, and to re-create characters for specific brands and environments.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/boston-dynamics-veterans-launch-dynamic-creatures-to-bring-characters-to-life-with-robotics/\">Boston Dynamics veteran launches Dynamic Creatures to bring characters to life with robotics<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "AI can’t outrun a humanoid’s hardware", "source": "Robotics Business Review", "date": "2026-09-08", "url": "https://www.therobotreport.com/ai-cant-outrun-a-humanoids-hardware/", "summary": "<p>The remarkable progress in AI has brought robotics closer to machines capable of determining what they should do. The next major advance may depend on whether their physical systems can execute those decisions efficiently, precisely and safely.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/ai-cant-outrun-a-humanoids-hardware/\">AI can’t outrun a humanoid&#8217;s hardware<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "This Robot Will D
