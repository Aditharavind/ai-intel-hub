os in simulation, achieving success rates over 25 percentage points higher than those of baselines during simulation-based training. In real-world closed-loop experiments, it achieves diverse grasps, including functional grasps, non-prehensile manipulation, and post-grasp object-pose tracking. Videos and code are available at https://boyuan-an.github.io/GALATEA/.", "pdf_url": "https://arxiv.org/pdf/2609.10050v1"}, {"title": "Belief-State Engine: Augmenting LLMs for Principled Planning Under Partial Observability", "authors": ["Arnab Chattopadhayay", "Debdipta Halder"], "published": "2026-09-09", "summary": "Large language model agents produce fluent action sequences across a wide range of tasks, yet they fail in characteristic ways once the environment becomes partially observable. Ambiguous feedback pushes them into premature commitments. A single informative observation can collapse their uncertainty onto the wrong hypothesis. Policies drift as the history grows. We trace these symptoms to a common structural cause. An LLM agent, as commonly deployed, is a history-conditioned policy with no explicit belief over hidden state. We propose an architectural fix. The Belief-State Engine (BSE) is an inference module placed outside the LLM. It maintains a Bayesian posterior over the latent states of a given POMDP (Partially Observable Markov Decision Process) model, and at each decision step it exposes only that posterior to the LLM. The raw action-observation log is not shown. We set out a minimal four-axiom specification of what a belief-consistent internal state must satisfy, and prove that the LLM paired with the BSE is a sound Markov policy on the belief MDP induced by the underlying POMDP. It therefore inherits the Bellman optimality guarantees of classical POMDP theory, provided the LLM is never exposed to the raw history. We evaluate the architecture on the Tiger POMDP and a red-team attack-graph task, against six baselines: a reactive LLM, Chain-of-Thought, ReAct, a natural-language belief tracker, QMDP, and POMCP. Across both domains, the BSE-augmented agent improves task return, belief calibration, and decision consistency. Ten targeted ablations isolate the contribution of each architectural choice confirms that the effect is not specific to any one model. Code, environment specifications, prompt templates, and seed logs accompany this paper.", "pdf_url": "https://arxiv.org/pdf/2609.10036v1"}, {"title": "What Symmetry Buys a Learned Motion Planner", "authors": ["Andrea Emir Sevincel"], "published": "2026-09-09", "summary": "Learning-based motion planners pay at training what classical planners pay per query. Trained in world coordinates, they relearn the same motion at every position and orientation. Existing work restores the missing rigid-body equivariance in the training data, in the inference operator, or in the weights, and each carries a cost. We ask how much of that equivariance the planning query supplies for free. A start s and a goal g determine a frame in closed form, with origin at their midpoint and first axis along g-s. Expressing trajectory and obstacles in that frame removes three translations and two rotations of SE(3), at initialisation, for one cross product per query and with no constraint on the architecture. A single rotation about the start-goal axis remains, and no continuous rule removes it. On a cluttered 3D benchmark, holding architecture, data and budget fixed, the frame raises the held-out collision-free rate from 14.60% to 51.10%, where a straight segment from start to goal scores 15.6% and the world-frame model does not beat it. We build all three mechanisms for the residual rotation and each is worth under a point, though the equivariant backbone reaches any given level two to three times sooner. What the representation supplies therefore dominates what any mechanism enforces, and the standard diagnostic does not see the difference: two models with indistinguishable non-equivariance residuals differ by 28 points. Calibrated against a non-symmetry intervention, the frame is not even the largest effect available, since local geometry is worth +40.0 where the frame is worth +36.5.", "pdf_url": "https://arxiv.org/pdf/2609.10033v1"}, {"title": "AXON: A ROS 2 RMW with Shared-Memory/QUIC Transport and QKD/ML-KEM Key Establishment", "authors": ["Sergio Sánchez de la Fuente", "Miguel Ángel González-Santamarta", "Francisco Javier Rodríguez-Lera", "Vicente Matellán Olivera", "Ángel Manuel Guerrero-Higueras"], "published": "2026-09-09", "summary": "Robot Operating System 2 (ROS 2) standardizes application code against a middleware interface (RMW) whose reference implementations are built on the Data Distribution Service (DDS). We present AXON, an alternative ROS 2 RMW implementation that separates transport policy by deployment scope. A Rust core and C++ adapter use POSIX shared-memory rings for same-host communication, QUIC for remote communication, and a daemon for discovery and graph synchronization. We then describe two fail-closed TLS 1.3 key-establishment configurations for remote traffic. The classic configuration offers only the hybrid X25519MLKEM768 group, preventing negotiation of a classical-only group. The qkd configuration imports a 256-bit key obtained through the ETSI GS QKD 014 API as a pairwise external PSK and offers no Diffie-Hellman group. Its default messages10 strategy additionally protects remote application messages with AES-256-GCM, rotating KME material after ten outgoing messages and using a fresh nonce per envelope; session relies on QUIC protection alone. The external-PSK path requires a narrow extension to rustls, now bundled with AXON. We define the threat model, distinguish peer authentication in the two configurations, and delimit the implementation-level validation from ROS 2 conformance, comparative performance, and physical-QKD validation.", "pdf_url": "https://arxiv.org/pdf/2609.10024v1"}, {"title": "RoboDrop: Curating VLA Post-Training Data via Local Gradient Compatibility", "authors": ["Runze Xu", "Yuanfan Xu", "Cuijie Xu", "Shuang Dai", "Yining Li", "Yu Wang", "Jincheng Yu"], "published": "2026-09-09", "summary": "Vision--language--action (VLA) models acquire broad generalization through large-scale pretraining, yet adapting them to a new task and robot embodiment still requires post-training on newly collected data. Unlike pretraining, post-training targets task- and embodiment-specific adaptation, making it particularly sensitive to data quality. In practice, collected robot datasets often contain heterogeneous errors, including execution mistakes, sensor drift, and timestamp misalignment, which can impair post-training and policy performance. Manual inspection is costly, while existing data-cleaning methods are typically tailored to particular corruption types. To address these challenges, we introduce \\textsc{RoboDrop}, a data-curation framework that audits supervision using local gradient compatibility measured along the training trajectory as a proxy for its effect on post-training performance. During a one-epoch warm-up run, RoboDrop scores each candidate sample online by comparing its gradient with those of task-semantic and visually matched validation samples. The resulting sample scores are aggregated at the episode level, and a simple automatic post-processing rule converts them into filtering decisions. We evaluate RoboDrop on controlled observation--action corruptions, naturally suboptimal demonstrations in simulation, and real-robot datasets containing non-expert collection errors. Across these settings, RoboDrop more accurately distinguishes unreliable demonstrations than prior methods, while post-training on the curated data consistently yields stronger downstream policies, with average real-robot rollout success rising from $35.0\\%$ to $67.5\\%$. These results establish training-trajectory-aware, context-conditioned supervision auditing as an effective approach to robust VLA post-training.", "pdf_url": "https://arxiv.org/pdf/2609.10021v1"}, {"title": "Beyond Similarity: Foundation Models as an Efficient Backbone for Training-Free Composed Video Retrieval", "authors": ["Dmitry Demidov", "Muhammad Zaigham Zaheer", "Omkar Thawakar", "Abdelrahman Mohamed Shaker", "Rao Anwer"], "published": "2026-09-09", "summary": "Composed video retrieval (CoVR) searches a gallery for the target video that realizes a natural-language modification of a source clip. However, at gallery scale, this creates a fundamental tension: compact embeddings enable efficient, reusable search but can miss the transient actions, state changes, and subtle constraints that demand fine-grained video reasoning, whereas applying large multimodal models uniformly sacrifices scalability. To address these limitations, we propose that frozen foundation models should instead occupy complementary roles, with inference depth adapted to query difficulty. Based on this premise, we introduce \\methodname{}, a framework for training-free \\methodexpansion{}. Specifically, a composed-query embedding first searches reusable video-only gallery representations; uncertain queries undergo bounded reranking and candidate expansion; ambiguous edits trigger target-description generation; and only close leading candidates reach multimodal verification. To support these roles, frame selection, spatial resolution, and time cues are adapted to each stage. Across complete target-gallery evaluations, our method reaches state-of-the-art performance among training-free approaches, with 89.55 and 93.43 R@1 on Dense-WebVid-CoVR and CoVR-R, respectively (with more than +35\\% and +25\\% absolute margins to the closest counterpart). These results show that adaptively orchestrating foundation-model capabilities can combine scalable retrieval with fine-grained reasoning without task-specific training. The source code and all relevant guidelines are available on https://github.com/demidovd98/CoVRAGE.", "pdf_url": "https://arxiv.org/pdf/2609.10008v1"}, {"title": "From Few-Shot Segmentation to Clinician-in-the-Loop Medical Image Analysis", "authors": ["Yazhou Zhu"], "published": "2026-09-09", "summary": "Few-shot medical image segmentation (FSMIS) seeks to delineate unseen structures from a small support set, but its standard formulation fixes task-defining evidence before inference. This assumption is fragile when query cases exhibit acquisition shift, atypical pathology, ambiguous boundaries, or poor image quality. Prototype learning, cross-domain matching, interactive segmentation, uncertainty estimation, test-time adaptation, and promptable foundation models address parts of this problem, yet have not been jointly evaluated under a common model of expert attention and clinical risk. This Perspective reframes FSMIS as a sequential clinician-model decision problem with a static support budget $K$ and a distinct interaction budget $B$. At each step, a system accepts the current segmentation, requests feedback, or defers to full expert review. Queries vary in location and modality and are selected by response-conditioned net expected value of information; clinician-provided feedback informs bounded adaptation only after prespecified provenance, consistency, and safety gates. The framework separates distributional atypicality from predicted clinical failure and treats clinician responses as informative but fallible observations. We synthesize the transition from few-shot and cross-domain segmentation to interactive and selective adaptation, delineate the integration gap, and define four research directions with falsifiable hypotheses. Evaluation spans external-domain calibration, quality-effort trade-offs, reader studies, and prospective workflow assessment. The central claim is not that interaction alone resolves domain shift, but that scarce expert attention should be allocated only when it is expected to reduce clinically relevant risk.", "pdf_url": "https://ar /* ── helpers ── */
const esc = v => String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const plain = v => { const d=document.createElement('div'); d.innerHTML=String(v??''); return d.textContent||''; };
const titleOf = x => x.title||x.repo||x.model||x.company||'Untitled';
const dateOf  = x => x.date||x.published||x.posted||'';
const srcOf   = x => { const s=x.source; if (s && !/^https?:\/\//.test(s)) return s; return x.company||x.language||x.topic||x.category||''; };
const scoreOf = x => Number(x.score||x.stars||x.downloads||0);
const isSeed  = x => { const u=x.url||x.pdf_url||''; return u.includes('example.com')||(x.title||'').toLowerCase().startsWith('example'); };
const fmt = n => n>=1e6?(n/1e6).toFixed(1)+'M':n>=1000?(n/1000).toFixed(1)+'K':String(n);
const truncWords=(t,n=100)=>{if(!t)return'';const w=t.trim().split(/\s+/);return w.length<=n?t:w.slice(0,n).join(' ')+'…';};

/* ── stars (persist across data refreshes via localStorage, keyed by URL) ── */
const keyOf = x => x.url||x.pdf_url||titleOf(x);
let STARS = new Set(JSON.parse(localStorage.getItem('hub-stars')||'[]'));
const isStarred = x => STARS.has(keyOf(x));
function toggleStar(k) {
  if (STARS.has(k)) STARS.delete(k); else STARS.add(k);
  localStorage.setItem('hub-stars', JSON.stringify([...STARS]));
}
function starredRows() { return allRows().filter(isStarred); }


function hrefOf(x) {
  if (x.pdf_url) {
    const m=x.pdf_url.match(/arxiv\.org\/(?:pdf|abs)\/([0-9]+\.[0-9]+)/);
    if (m) return 'https://arxiv.org/abs/'+m[1];
  }
  if (x.url) return x.url;
  if (x.pdf_url) return x.pdf_url;
  if (x.source && /^https?:\/\//.test(x.source)) return x.source;
  return '#';
}

function cutoff(r) {
  if (r==='all') return '';
  const d=new Date();
  if (r==='today') d.setHours(0,0,0,0);
  else if (r==='7d')  d.setDate(d.getDate()-7);
  else if (r==='30d') d.setDate(d.getDate()-30);
  else if (r==='90d') d.setDate(d.getDate()-90);
  return d.toISOString().slice(0,10);
}

function colorOf(k) { return SRC_COLOR[k]||(TOPICS[k]&&TOPICS[k].color)||'#818cf8'; }
function labelOf(k) { return SRC_LABEL[k]||(TOPICS[k]&&TOPICS[k].label)||k; }
function iconOf(k)  { return SRC_ICON[k]||(TOPICS[k]&&TOPICS[k].icon)||'•'; }

/* ── rows ── */
function allRows() {
  return Object.entries(data).flatMap(([k,rows])=>rows.filter(x=>!isSeed(x)).map(x=>( {...x,_k:k} )));
}
function rowsFor(ds) {
  if (ds==='starred') return starredRows();
  if (TOPICS[ds]) {
    const t=TOPICS[ds];
    return (data.papers||[]).filter(x=>{
      if (isSeed(x)) return false;
      const txt=(x.title+' '+(x.summary||'')).toLowerCase();
      return t.kw.some(k=>txt.includes(k));
    }).map(x=>( {...x,_k:ds} ));
  }
  return ds==='all'?allRows():(data[ds]||[]).filter(x=>!isSeed(x)).map(x=>( {...x,_k:ds} ));
}

  if (q) rows=rows.filter(x=>JSON.stringify(x).toLowerCase().includes(q));
  if (from) rows=rows.filter(x=>dateOf(x)>=from);
  return rows.sort((a,b)=>{
    if (state.sort==='score') return scoreOf(b)-scoreOf(a);
    if (state.sort==='alpha') return titleOf(a).localeCompare(titleOf(b));
    return dateOf(b).localeCompare(dateOf(a));
  });
}

    const t=Number(el.dataset.target);

    const dur=1400, s=performance.now();
    const tick=now=>{
      const p=Math.min((now-s)/dur,1), ease=1-Math.pow(1-p,3);
      el.textContent=Math.round(ease*t).toLocaleString();
      if (p<1) requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  });
}

/* ── pagination ── */
function pageWin(c,t) {
  const s=Math.max(1,c-2),e=Math.min(t,c+2);
  const ps=[];
  for(let p=s;p<=e;p++) ps.push(p);
  if(!ps.includes(1)){ if(ps[0]>2) ps.unshift('…'); ps.unshift(1); }
  if(!ps.includes(t)){ if(ps[ps.length-1]<t-1) ps.push('…'); ps.push(t); }
  return ps;
}
function renderPag(tot) {
  const el=document.getElementById('pages');
  el.innerHTML=[
    `<button class="pgb" data-p="${state.page-1}" ${state.page===1?'disabled':''}>‹ Prev</button>`,
    ...pageWin(state.page,tot).map(p=>p==='…'
      ?`<button class="pgb" disabled>…</button>`
      :`<button class="pgb${p===state.page?' on':''}" data-p="${p}">${p}</button>`),
    `<button class="pgb" data-p="${state.page+1}" ${state.page===tot?'disabled':''}>Next ›</button>`,
  ].join('');
  el.querySelectorAll('.pgb:not([disabled])').forEach(b=>b.addEventListener('click',()=>{
    const p=Number(b.dataset.p);
    if(p&&p!==state.page){ state.page=p; render(); document.querySelector('.panel').scrollIntoView({behavior:'smooth',block:'start'}); }
  }));
}

/* ══════════════════════════════════════════
   NEURAL NETWORK BACKGROUND ANIMATION
══════════════════════════════════════════ */
(function() {
  const canvas=document.getElementById('bgCanvas');
  const ctx=canvas.getContext('2d');
  let W,H;
  function resize(){ W=canvas.width=window.innerWidth; H=canvas.height=window.innerHeight; }
  window.addEventListener('resize',resize); resize();

  const N=40, MAXD=150;
  const PCOLORS=['rgba(124,58,237,','rgba(99,102,241,','rgba(129,140,248,','rgba(14,165,233,'];
  const nodes=Array.from({length:N},()=>{
    const c=PCOLORS[Math.floor(Math.random()*PCOLORS.length)];
    return {
      x:Math.random()*window.innerWidth,
      y:Math.random()*window.innerHeight,
      vx:(Math.random()-.5)*.32,
      vy:(Math.random()-.5)*.32,
      r:Math.random()*1.8+.6,
      c, ph:Math.random()*Math.PI*2,
      ps:.008+Math.random()*.014,
    };
  });

  let mx=-2000,my=-2000;
  window.addEventListener('mousemove',e=>{ mx=e.clientX; my=e.clientY; });

  function frame() {
    ctx.clearRect(0,0,W,H);
    nodes.forEach(n=>{
      n.x+=n.vx; n.y+=n.vy; n.ph+=n.ps;
      if(n.x<0||n.x>W) n.vx*=-1;
      if(n.y<0||n.y>H) n.vy*=-1;
      n.x=Math.max(0,Math.min(W,n.x));
      n.y=Math.max(0,Math.min(H,n.y));
      const dx=n.x-mx,dy=n.y-my,md=Math.sqrt(dx*dx+dy*dy);
      if(md<110){ n.vx+=(dx/md)*.012; n.vy+=(dy/md)*.012; }
      n.vx=Math.max(-.7,Math.min(.7,n.vx*.997));
      n.vy=Math.max(-.7,Math.min(.7,n.vy*.997));
      const p=.35+Math.sin(n.ph)*.18;
      /* glow halo */
      const g=ctx.createRadialGradient(n.x,n.y,0,n.x,n.y,n.r*5);
      g.addColorStop(0,n.c+(p*.7)+')');
      g.addColorStop(1,n.c+'0)');
      ctx.beginPath(); ctx.arc(n.x,n.y,n.r*5,0,Math.PI*2);
      ctx.fillStyle=g; ctx.fill();
      /* core */
      ctx.beginPath(); ctx.arc(n.x,n.y,n.r,0,Math.PI*2);
      ctx.fillStyle=n.c+(p*1.4)+')'; ctx.fill();
    });
    /* connections */
    for(let i=0;i<N;i++) for(let j=i+1;j<N;j++) {
      const dx=nodes[i].x-nodes[j].x, dy=nodes[i].y-nodes[j].y;
      const d=Math.sqrt(dx*dx+dy*dy);
      if(d<MAXD) {
        const a=(1-d/MAXD)*.14;
        ctx.beginPath();
        ctx.moveTo(nodes[i].x,nodes[i].y);
        ctx.lineTo(nodes[j].x,nodes[j].y);
        ctx.strokeStyle=`rgba(129,140,248,${a})`;
        ctx.lineWidth=.7; ctx.stroke();
      }
    }
    requestAnimationFrame(frame);
  }
  frame();
})();

══════════════════════════════════════════ */
(function() {
  const SIX_H=6*60*60*1000;
  const end=Date.now()+SIX_H;
  const updEl=document.getElementById('nextUpd');
  const progEl=document.getElementById('refProg');

  function tick() {
    const left=end-Date.now();
    if(left<=0){ location.reload(); return; }
    const h=Math.floor(left/3600000);
    const m=Math.floor((left%3600000)/60000);
    const s=Math.floor((left%60000)/1000);
    if(updEl) updEl.textContent=`Refresh in ${h}h ${m}m ${s}s`;
    if(progEl) progEl.style.width=((left/SIX_H)*100).toFixed(2)+'%';
  }
  tick();
  setInterval(tick,1000);
  setTimeout(()=>location.reload(),SIX_H);
})();

function mktScore(k) {
  const kws=MKTS[k].kw;
  const has=txt=>kws.some(w=>txt.includes(w));
  const papers   =(data.papers||[]).filter(x=>!isSeed(x)&&has((x.title+' '+(x.summary||'')).toLowerCase())).length;
  const news     =[...(data.aiNews||[]),...(data.physicalAiNews||[]),...(data.roboticsNews||[]),...(data.embeddedNews||[])].filter(x=>!isSeed(x)&&has(JSON.stringify(x).toLowerCase())).length;
  const funding  =(data.funding||[]).filter(x=>!isSeed(x)&&has(JSON.stringify(x).toLowerCase())).length;
  const jobs     =(data.jobs||[]).filter(x=>!isSeed(x)&&has(JSON.stringify(x).toLowerCase())).length;
  const repos    =(data.repos||[]).filter(x=>!isSeed(x)&&has(JSON.stringify(x).toLowerCase())).length;
  const models   =(data.models||[]).filter(x=>!isSeed(x)&&has(JSON.stringify(x).toLowerCase())).length;
  const companies=(data.companies||[]).filter(x=>!isSeed(x)&&has(JSON.stringify(x).toLowerCase())).length;
  const research = papers*3+repos*2+models*2;
  const commercial= funding*5+companies*4;
  const demand = news*2+jobs*1;
  const total = research+commercial+demand;
  const momentum = Math.min(99,research*2+demand*3);
  const competition= Math.min(99,commercial*4);
  const opp = Math.min(99,Math.max(1,research*3+demand*2-competition*0.5+10));
  const gap = Math.max(0,research - commercial);
  return {papers,news,funding,jobs,repos,models,companies,research,commercial,demand,total,momentum,competition,opp,gap};
}

    agents:'Embodied Agent Evaluation Suite',evalBench:'Open Physical Robot Benchmark',

  };
  const MARKET_SIZE = {
    humanoid:'$38B by 2035',vla:'$2.4B by 2028',worldModel:'$5B by 2030',synData:'$1.8B by 2027',
    robotInfra:'$12B by 2030',embodied:'$22B by 2032',manipulation:'$8B by 2029',locomotion:'$4.5B by 2029',
    agents:'$47B by 2030',evalBench:'$800M by 2028',dataInfra:'$6B by 2029',multimodal:'$15B by 2030',
  };
  const gaps=Object.entries(MKTS).map(([k,m])=>{

    const mkt=(document.getElementById('val-market').value||'').toLowerCase();

    let bestMkt=null, bestScore=0;
    Object.entries(MKTS).forEach(([k,m])=>{
      const s=mktScore(k);

    const timeBonus=Math.min(1,time/40);
    const budgetBonus=budget>0?Math.min(0.3,budget/1000000*0.3):0;

/* ── Module: ProblemMine ── */
function advProblemMine() {
  const MARKERS=['challenge','problem','limitation','lack of','difficult','lacking','absence of','gap in','fail to','struggle','insufficient','unable to','barrier'];
  const problems=[];
  const allSrc=[...(data.papers||[]),...(data.aiNews||[]),...(data.roboticsNews||[]),...(data.physicalAiNews||[])].filter(x=>!isSeed(x));
  allSrc.forEach(x=>{
    const text=plain(x.summary||x.description||'');
    if(!text) return;
    const sentences=text.split(/[.!?]/).map(s=>s.trim()).filter(s=>s.length>20&&s.length<200);
    sentences.forEach(s=>{
      const sl=s.toLowerCase();
      if(MARKERS.some(m=>sl.includes(m))){
        problems.push({problem:s,source:titleOf(x),url:hrefOf(x),date:dateOf(x),
          opp:50+Math.floor(Math.random()*45)});
      }
    });
  });
  const unique=problems.filter((p,i)=>problems.findIndex(q=>q.problem.slice(0,30)===p.problem.slice(0,30))===i);
  const top=unique.sort((a,b)=>b.opp-a.opp).slice(0,20);
  return `
  <div class="adv-metrics">
    <div class="adv-metric"><div class="adv-metric-n">${top.length}</div><div class="adv-metric-l">Problems Found</div></div>
    <div class="adv-metric"><div class="adv-metric-n">${top.filter(p=>p.opp>=80).length}</div><div class="adv-metric-l">High-Value</div></div>
    <div class="adv-metric"><div class="adv-metric-n">${new Set(top.map(p=>p.date.slice(0,7))).size}</div><div class="adv-metric-l">Date Ranges</div></div>
    <div class="adv-metric"><div class="adv-metric-n">Live</div><div class="adv-metric-l">Data Source</div></div>
  </div>
  <div class="adv-panel">
    <div class="adv-panel-hdr">⛏️ Real problems extracted from research papers & news</div>
    <ul class="adv-list">
      ${top.length?top.map((p,i)=>`
        <li class="adv-item">
          <div class="adv-rank">${i+1}</div>
          <div class="adv-item-body">
            <div class="adv-item-title" style="font-size:13.5px;font-weight:600;color:var(--t2)">"${esc(p.problem)}"</div>
            <div style="margin-top:6px;display:flex;gap:8px;flex-wrap:wrap;align-items:center">
              <a href="${esc(p.url)}" target="_blank" style="font-size:11.5px;color:var(--acc)">📄 ${esc(truncWords(p.source,8))}</a>
              ${p.date?`<span style="font-size:11px;color:var(--muted)">${p.date}</span>`:''}
              <span class="adv-tag adv-tag-green">Opp: ${p.opp}</span>
            </div>
          </div>
        </li>`).join('')
      :`<li class="adv-item"><div style="color:var(--muted);padding:20px">No problems extracted yet — add more papers with summaries.</div></li>`}
    </ul>
  </div>`;
}

/* ── Module: Signal Score Engine ── */
function advSignalEngine() {
  const WEIGHTS={research:3,funding:5,hiring:1,openSource:2,news:2};
  const calcSignal=(item,type)=>{
    const txt=JSON.stringify(item).toLowerCase();
    const hasMkt=k=>MKTS[k].kw.some(w=>txt.includes(w));
    const mktBonus=Object.keys(MKTS).filter(hasMkt).length*4;
    if(type==='paper') return Math.min(99,scoreOf(item)*10+mktBonus+20);
    if(type==='repo')  return Math.min(99,Math.log1p(scoreOf(item))*10+mktBonus+10);
    if(type==='model') return Math.min(99,Math.log1p(scoreOf(item))*8+mktBonus+15);
    return Math.min(99,mktBonus+25);
  };
  const allItems=[
    ...(data.papers||[]).filter(x=>!isSeed(x)).map(x=>{return{...x,_type:'paper',_sig:calcSignal(x,'paper')};}),
    ...(data.repos||[]).filter(x=>!isSeed(x)).map(x=>{return{...x,_type:'repo',_sig:calcSignal(x,'repo')};}),
    ...(data.models||[]).filter(x=>!isSeed(x)).map(x=>{return{...x,_type:'model',_sig:calcSignal(x,'model')};}),
    ...(data.funding||[]).filter(x=>!isSeed(x)).map(x=>{return{...x,_type:'funding',_sig:calcSignal(x,'funding')};}),
  ].sort((a,b)=>b._sig-a._sig).slice(0,25);
  const byType=t=>allItems.filter(x=>x._type===t).length;
  const typeIcon={paper:'📄',repo:'💻',model:'🧠',funding:'💰'};
  const typeColor={paper:'#34d399',repo:'#60a5fa',model:'#fb923c',funding:'#a3e635'};
  return `
  <div class="adv-metrics">
    <div class="adv-metric"><div class="adv-metric-n">${allItems[0]?._sig||0}</div><div class="adv-metric-l">Top Signal Score</div></div>
    <div class="adv-metric"><div class="adv-metric-n">${allItems.filter(x=>x._sig>=80).length}</div><div class="adv-metric-l">High Signal Items</div></div>
    <div class="adv-metric"><div class="adv-metric-n">${allItems.length}</div><div class="adv-metric-l">Items Ranked</div></div>
    <div class="adv-metric"><div class="adv-metric-n">Live</div><div class="adv-metric-l">Data Freshness</div></div>
  </div>
  <div class="adv-panel">
    <div class="adv-panel-hdr">⚡ Universal Signal Score Rankings — Top 25 signals across all categories</div>
    <ul class="adv-list">
      ${allItems.map((x,i)=>{
        const tc=typeColor[x._type]||'#818cf8';
        const ti=typeIcon[x._type]||'•';
        return `<li class="adv-item">
          <div class="adv-rank" style="background:${tc}22;color:${tc}">${i+1}</div>
          <div class="adv-item-body">
            <div class="adv-item-title">
              <a href="${esc(hrefOf(x))}" target="_blank" style="color:var(--text)">${esc(truncWords(titleOf(x),12))}</a>
            </div>
            <div class="adv-scores">
              <span class="adv-tag" style="background:${tc}22;border:1px solid ${tc}44;color:${tc}">${ti} ${x._type}</span>
              ${scoreOf(x)?`<span class="adv-tag adv-tag-blue">${fmt(scoreOf(x))}</span>`:''}</div>
          </div>
          <div style="text-align:right;flex-shrink:0">
            <div style="font-size:22px;font-weight:900;color:${tc}">${x._sig}</div>
            <div style="font-size:10px;color:var(--muted)">signal</div>
          </div>
        </li>`;
      }).join('')}
    </ul>
  </div>`;
}

/* ── ADVANCED main renderer ── */
function renderAdvanced() {
  const wrap=document.getElementById('advWrap');
  if(state.advMod) {
    const mod=ADV_MODS.find(m=>m.id===state.advMod);
    let content='<div style="color:var(--muted);padding:40px;text-align:center">Module coming soon.</div>';
    if(state.advMod==='opportunity_radar') content=advOpportunityRadar();
    else if(state.advMod==='gapfinder')       content=advGapFinder();
    else if(state.advMod==='future_unicorn')  content=advFutureUnicorn();
    else if(state.advMod==='startup_ideas')   content=advStartupIdeas();
    else if(state.advMod==='startup_validator') content=advStartupValidator();
    else if(state.advMod==='builder_match')   content=advBuilderMatch();
    else if(state.advMod==='problemmine')     content=advProblemMine();
    else if(state.advMod==='market_intel')    content=advMarketIntel();
    else if(state.advMod==='research_map')    content=advResearchMap();
    else if(state.advMod==='startup_genome')  content=advStartupGenome();
    else if(state.advMod==='hidden_gems')     content=advHiddenGems();
    else if(state.advMod==='investor_mode')   content=advInvestorMode();
    else if(state.advMod==='graveyard')       content=advGraveyard();
    else if(state.advMod==='time_machine')    content=advTimeMachine();
    else if(state.advMod==='cofounder')       content=advCoFounder();
    else if(state.advMod==='cert_hub')        content=advCertHub();
    else if(state.advMod==='daily_brief')     content=advDailyBrief();
    else if(state.advMod==='signal_engine')   content=advSignalEngine();
    wrap.innerHTML=`
      <button class="adv-back" id="advBack">← Back to Advanced Hub</button>
      <div class="adv-mod-hdr">
        <div class="adv-mod-ico">${mod?.icon||'🚀'}</div>
        <div>
          <div class="adv-mod-title">${mod?.label||state.advMod}</div>
          <div class="adv-mod-sub">${mod?.desc||''}</div>
        </div>
      </div>
      ${content}`;
    document.getElementById('advBack')?.addEventListener('click',()=>{
      state.advMod=null; renderAdvanced();
    });
    /* bind interactive modules */
    if(state.advMod==='startup_validator') advStartupValidatorBind();
    else if(state.advMod==='builder_match') advBuilderMatchBind();
    else if(state.advMod==='cofounder') advCoFounderBind();
  } else {
    wrap.innerHTML=renderAdvHub();
    wrap.querySelectorAll('.adv-hcard').forEach(c=>c.addEventListener('click',()=>{
      state.advMod=c.dataset.mod; renderAdvanced();
      document.querySelector('.main').scrollTo({top:0,behavior:'smooth'});
    }));
  }
}

/* ── init ── */
syncVT();
render();
</script>
</body>
</html>
