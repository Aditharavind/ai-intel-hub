ork Public Library will be honoring the anniversary with original illustrations, events, and more!"}, {"title": "UN General Assembly endorses a new world map that shows more accurately Africa’s size", "source": "Adafruit", "date": "2026-09-08", "url": "https://blog.adafruit.com/2026/09/08/un-general-assembly-endorses-a-new-world-map-that-shows-more-accurately-africas-size/", "summary": "The Associated Press reports that the United Nations General Assembly voted Friday to endorse the Equal Earth projection as a replacement for the Mercator map. The resolution was sponsored by Togo and backed by African Union members. It passed with 164 votes in favor. The U.S. voted against it, and Serbia, Estonia, Georgia, Lithuania, Moldova [&#8230;]"}, {"title": "How ‘cornflakes’ can help decode ancient writing", "source": "Adafruit", "date": "2026-09-08", "url": "https://blog.adafruit.com/2026/09/08/how-cornflakes-can-help-decode-ancient-writing/", "summary": "Margherita Bassi, writing for Popular Science, reports on the small papyrus scraps that papyrologists call cornflakes. Each one holds a partial piece of an ancient text. This summer, nine researchers from around the world worked on them at the University of Michigan&#8217;s Papyrus Conservation Summer Seminar in Ann Arbor. Most arrived with no papyrus experience. [&#8230;]"}, {"title": "A vacuum tube computer for the home", "source": "Adafruit", "date": "2026-09-08", "url": "https://blog.adafruit.com/2026/09/08/a-vacuum-tube-computer-for-the-home/", "summary": "A project posted on Hackaday.io documents an 8 bit computer built entirely from vacuum tubes. The builder used recycled 1950s 6N3P double triodes, sourced in Eastern Europe a few years ago. The 6N3P is a Soviet era double triode, meaning two triodes share one glass envelope. That helps keep the tube count down, but a [&#8230;]"}, {"title": "Welcome to the Materials Age (We Hope You’ll Enjoy Your Stay)", "source": "EE Journal", "date": "2026-09-08", "url": "https://www.eejournal.com/article/welcome-to-the-materials-age-we-hope-youll-enjoy-your-stay/", "summary": "<img alt=\"\" class=\"webfeedsFeaturedVisual wp-post-image\" height=\"300\" src=\"https://www.eejournal.com/wp-content/uploads/2026/09/max-0516-image-for-home-page-matlantis-300x300.jpg\" style=\"display: block; margin-bottom: 5px; clear: both;\" width=\"300\" />When you come to think about it, many of the early ages of human development were defined by the materials people used, such as the Stone Age, the Bronze Age, and the Iron Age. Much later came the Industrial Revolution and the Industrial Age. This was followed by a succession of increasingly overlapping technological eras—the &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/article/welcome-to-the-materials-age-we-hope-youll-enjoy-your-stay/\">Read More &#8594;<span class=\"screen-reader-text\"> \"Welcome to the Materials Age (We Hope You’ll Enjoy Your Stay)\"<\/span><\/a>"}, {"title": "Fujitsu develops diamond-spin quantum computer prototype", "source": "EE Journal", "date": "2026-09-08", "url": "https://www.eejournal.com/industry_news/fujitsu-develops-diamond-spin-quantum-computer-prototype/", "summary": "Fujitsu today announced that it has developed the world’s first working prototype of a diamond-spin quantum computer incorporating tin-vacancy (SnV) centers into photonic integrated circuits [1] [2]. The prototype can be operated at -271.6°C, higher than the typical operating temperature of superconducting quantum computers (-273.13°C) and Fujitsu has demonstrated in a test environment that it &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/fujitsu-develops-diamond-spin-quantum-computer-prototype/\">Read More &#8594;<span class=\"screen-reader-text\"> \"Fujitsu develops diamond-spin quantum computer prototype\"<\/span><\/a>"}, {"title": "IK Multimedia Launches TONEX Board", "source": "EE Journal", "date": "2026-09-08", "url": "https://www.eejournal.com/industry_news/ik-multimedia-launches-tonex-board/", "summary": "IK Multimedia today launches TONEX Board, its most advanced TONEX hardware platform to date and the centerpiece of the expanding TONEX ecosystem. Combining IK&#8217;s award-winning AI Machine Modeling™ technology with AmpliTube studio-grade effects, dual signal paths, advanced routing, extensive connectivity, and intuitive touchscreen control, TONEX Board puts one of the most advanced and best-sounding complete guitar &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/ik-multimedia-launches-tonex-board/\">Read More &#8594;<span class=\"screen-reader-text\"> \"IK Multimedia Launches TONEX Board\"<\/span><\/a>"}, {"title": "Up to 100 Meters Between Vehicle and Charging Station: Vector Launches vSECC.InPlug for Bus and Truck Depots", "source": "EE Journal", "date": "2026-09-08", "url": "https://www.eejournal.com/industry_news/up-to-100-meters-between-vehicle-and-charging-station-vector-launches-vsecc-inplug-for-bus-and-truck-depots/", "summary": "Vector is introducing vSECC.InPlug, a new communication controller board for DC charging infrastructures. By relocating charging communication directly into the DC charging connector, the solution enables cable runs of up to 100 meters between vehicle and charging station. This gives bus and truck depot operators greater flexibility when planning and building their charging infrastructure. Moreover, &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/up-to-100-meters-between-vehicle-and-charging-station-vector-launches-vsecc-inplug-for-bus-and-truck-depots/\">Read More &#8594;<span class=\"screen-reader-text\"> \"Up to 100 Meters Between Vehicle and Charging Station: Vector Launches vSECC.InPlug for Bus and Truck Depots\"<\/span><\/a>"}, {"title": "Imec advances scalable superconducting technology with world-first NbTiN circuits and 30nm interconnects", "source": "EE Journal", "date": "2026-09-08", "url": "https://www.eejournal.com/industry_news/imec-advances-scalable-superconducting-technology-with-world-first-nbtin-circuits-and-30nm-interconnects/", "summary": "• At the 2026 Applied Superconductivity Conference, imec demonstrates two world-firsts: (1) a three-metal-level (3ML) niobium-titanium-nitride (NbTiN)-based Josephson junction circuit, achieving circuit design densities of 3.8 million junctions per cm2; and (2) 3ML NbTiN routing with superconducting wires scaled down to an unprecedented 30nm linewidth for superconducting digital (SCD) applications. • The achievements extend imec’s &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/imec-advances-scalable-superconducting-technology-with-world-first-nbtin-circuits-and-30nm-interconnects/\">Read More &#8594;<span class=\"screen-reader-text\"> \"Imec advances scalable superconducting technology with world-first NbTiN circuits and 30nm interconnects\"<\/span><\/a>"}, {"title": "NEURA Robotics and SECO Join Forces to Scale Physical AI from Europe", "source": "EE Journal", "date": "2026-09-08", "url": "https://www.eejournal.com/industry_news/neura-robotics-and-seco-join-forces-to-scale-physical-ai-from-europe/", "summary": "•     Partnership combines NEURA&#8217;s Physical AI architecture, which leverages Qualcomm Technologies&#8217; advanced computing platforms and SECO&#8217;s embedded engineering and manufacturing expertise, while jointly developing Physical AI solutions for the semiconductor industry •     NEURA and SECO will collaborate on electronic compute modules for NEURA&#8217;s cognitive robots, including the humanoid 4NE1, supporting scalable series production in Europe •     The collaboration &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/neura-robotics-and-seco-join-forces-to-scale-physical-ai-from-europe/\">Read More &#8594;<span class=\"screen-reader-text\"> \"NEURA Robotics and SECO Join Forces to Scale Physical AI from Europe\"<\/span><\/a>"}, {"title": "YuzukiNeko – A Linux-capable Allwinner F101 RISC-V SBC with Raspberry Pi Pico form factor", "source": "CNX Software", "date": "2026-09-07", "url": "https://www.cnx-software.com/2026/09/08/yuzukineko-a-linux-capable-allwinner-f101-64-bit-risc-v-sbc-with-raspberry-pi-pico-form-factor/", "summary": "<div><img alt=\"YuzukiNeko Allwinner F101 SBC\" class=\"attachment-medium size-medium wp-post-image\" height=\"476\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/09/YuzukiNeko-Allwinner-F101-SBC-720x476.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>YuzukiHD has made another open-source hardware Linux SBC. YuzukiNeko is a Raspberry Pi Pico-sized single board computer powered by a new Allwinner F101 RISC-V SoC. The Allwinner F101 processor features a single 1.008 GHz C907 RISC-V core, 8MB or 16 MB PSRAM, and support for various display interfaces such as MIPI DSI, 24-bit RGB, and LVDS. The YuzukiNeko board itself features the F101 SoC, an SPI NOR flash, a microSD card for storage, a USB-C port, and two 20-pin GPIO headers. YuzukiNeko specifications: SoC &#8211; Allwinner F101 CPU &#8211; T-head C907 RISC-V core up to 1.008 GHz Memory &#8211; 8MB or 16MB PSRAM @ 252 MHz Package &#8211; QFN-68 Storage 128 Mbit NOR flash (PY25Q128HA-SUH-IT) MicroSD card slot USB &#8211; USB Type-C port for data, power, and programming Expansion 2x 20-pin expansion headers with GPIOs, ADC, 5V, 3.3V, and GND 5x pads with HP out (analog speaker output) and four [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/09/08/yuzukineko-a-linux-capable-allwinner-f101-64-bit-risc-v-sbc-with-raspberry-pi-pico-form-factor/\">YuzukiNeko &#8211; A Linux-capable Allwinner F101 RISC-V SBC with Raspberry Pi Pico form factor<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Reverse Engineering Without CAD Data: How MetroY Ultra Turns Physical Parts into Digital Designs (Sponsored)", "source": "CNX Software", "date": "2026-09-07", "url": "https://www.cnx-software.com/2026/09/07/reverse-engineering-without-cad-data-how-metroy-ultra-turns-physical-parts-into-digital-designs/", "summary": "<div><img alt=\"MetroY Ultra Scan\" class=\"attachment-medium size-medium wp-post-image\" height=\"405\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/08/MetroY-Ultra-Scan-720x405.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>When the Part Exists, but the Data Doesn’t Reverse engineering often starts with a physical part but no reliable digital data. In restoration and customization, manual measurement can provide basic dimensions, but it becomes limiting when complex curves, mounting points, and tight clearances need to be captured accurately. MetroY Ultra captures the actual three-dimensional geometry of a part, providing a reliable digital reference for reverse engineering, custom design, and manufacturing. Designing a Custom Motorcycle Seat Tray from Accurate Scan Data In a custom 1984 Honda CB400 build, the builder needed to create a seat tray and seat pan for a custom seat while integrating the rear fender into the modified rear subframe. The challenge was not simply designing a new part, but making that part accurately fit a motorcycle whose geometry had already been modified. Traditionally, this kind of work is often done with welded sheet metal or fiberglass layup. [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/09/07/reverse-engineering-without-cad-data-how-metroy-ultra-turns-physical-parts-into-digital-designs/\">Reverse Engineering Without CAD Data: How MetroY Ultra Turns Physical Parts into Digital Designs (Sponsored)<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "XIAO SAMD21 Plus and RP2040 Plus USB-C boards get additional GPIO pins, integrated Li-ion battery management", "source": "CNX Software", "date": "2026-09-07", "url": "https://www.cnx-software.com/2026/09/07/xiao-samd21-plus-and-rp2040-plus-usb-c-boards-get-additional-gpio-pins-integrated-li-ion-battery-management/", "summary": "<div><img alt=\"XIAO SAMD21 Plus\" class=\"attachment-medium size-medium wp-post-image\" height=\"494\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/09/XIAO-SAMD21-Plus-720x494.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Seeed Studio has expanded its XIAO Plus Series introduced in 2025, with the XIAO SAMD21 Plus and XIAO RP2040 Plus USB-C boards adding several GPIOs and integrated Li-ion battery management to the XIAO (SAMD21) and XIAO RP2040, launched in 2020 and 2021, respectively, while keeping the same form factor. XIAO SAMD21 Plus Specifications: MCU – Microchip SAMD21G18 Arm Cortex-M0+ microcontroller at up to 48MHz with 256KB Flash,32KB SRAM USB – 1x USB Type-C port for power and programming Expansion I/Os 2x 7-pin &#8220;legacy&#8221; headers with 11x analog inputs, 11x digital I/Os, 1x DAC, SPI, UART, and I2C Castellated holes and pads with 16x digital I/Os, I2C,and I2S 3.3V I/O voltage (not 5V tolerant) Misc Reset and Boot buttons RGB LED Charge LED Power Supply 5V via USB-C port Pads for battery On-board PMIC Dimensions – 23.5×17.5 mm Temperature Range &#8211; -40°C ~ 85°C The upgraded variant of the XIAO SAMD21 [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/09/07/xiao-samd21-plus-and-rp2040-plus-usb-c-boards-get-additional-gpio-pins-integrated-li-ion-battery-management/\">XIAO SAMD21 Plus and RP2040 Plus USB-C boards get additional GPIO pins, integrated Li-ion battery management<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "New PerleCLOUD Platform Accelerates Deployment and Management of Remote Infrastructure Assets", "source": "EE Journal", "date": "2026-09-07", "url": "https://www.eejournal.com/industry_news/new-perlecloud-platform-accelerates-deployment-and-management-of-remote-infrastructure-assets/", "summary": "Perle Systems, a global provider of secure device networking hardware, today announced the launch of PerleCLOUD™, a cloud-based management platform that enables organizations to centrally manage, monitor, and access Perle IOLAN SCR Console Servers and connected infrastructure through a single interface. Designed for data centers and distributed environments, PerleCLOUD simplifies remote infrastructure operations while improving visibility, &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/new-perlecloud-platform-accelerates-deployment-and-management-of-remote-infrastructure-assets/\">Read More &#8594;<span class=\"screen-reader-text\"> \"New PerleCLOUD Platform Accelerates Deployment and Management of Remote Infrastructure Assets\"<\/span><\/a>"}, {"title": "Ambarella Engages Capgemini to Help Accelerate Enterprise Adoption of Edge and Physical AI", "source": "EE Journal", "date": "2026-09-07", "url": "https://www.eejournal.com/industry_news/ambarella-engages-capgemini-to-help-accelerate-enterprise-adoption-of-edge-and-physical-ai/", "summary": "Ambarella, Inc. (NASDAQ: AMBA), an edge AI semiconductor company, and Capgemini (Euronext Paris: CAP), the global AI-driven business and technology transformation company, today announced their engagement to accelerate the development and deployment of Edge and Physical AI solutions across smart infrastructure, retail and logistics, industrial automation, healthcare, and automotive sectors. Under the agreement, Capgemini will &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/ambarella-engages-capgemini-to-help-accelerate-enterprise-adoption-of-edge-and-physical-ai/\">Read More &#8594;<span class=\"screen-reader-text\"> \"Ambarella Engages Capgemini to Help Accelerate Enterprise Adoption of Edge and Physical AI\"<\/span><\/a>"}, {"title": "Powell Electronics shows latest highly reliable connector solutions for rail applications at Innotrans 2026", "source": "EE Journal", "date": "2026-09-07", "url": "https://www.eejournal.com/industry_news/powell-electronics-shows-latest-highly-reliable-connector-solutions-for-rail-applications-at-innotrans-2026/", "summary": "At Innotrans 2026 in Berlin, Germany from 22nd to 25th Sept 2026, Powell Electronics will be showing the latest hi-reliability connector solutions for harsh environment rail applications from its key franchises, e.g. Amphenol, Glenair, Honeywell, Samtec and ITT Cannon. Visitors to Powell’s stand in Hall 14.1 Stand 210 will be able to talk to the technical experts &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/powell-electronics-shows-latest-highly-reliable-connector-solutions-for-rail-applications-at-innotrans-2026/\">Read More &#8594;<span class=\"screen-reader-text\"> \"Powell Electronics shows latest highly reliable connector solutions for rail applications at Innotrans 2026\"<\/span><\/a>"}, {"title": "TriLite and AAC Technologies Advance LBS Toward Industrial-Scale Deployment", "source": "EE Journal", "date": "2026-09-07", "url": "https://www.eejournal.com/industry_news/trilite-and-aac-technologies-advance-lbs-toward-industrial-scale-deployment/", "summary": "TriLite Technologies GmbH, developer of the world’s smallest laser beam scanning (LBS) projection displays for AR smart glasses and automotive applications, has signed a long-term cooperation agreement with AAC Technologies Pte Ltd. The agreement focuses on the joint development, manufacturing and commercialization of TriLite’s LBS technology for consumer AR/MR/VR devices and automotive applications, leveraging AAC &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/trilite-and-aac-technologies-advance-lbs-toward-industrial-scale-deployment/\">Read More &#8594;<span class=\"screen-reader-text\"> \"TriLite and AAC Technologies Advance LBS Toward Industrial-Scale Deployment\"<\/span><\/a>"}, {"title": "ACEMAGIC Kron Mini K5 Review – Part 2: A $400 Intel Core 3 304 Wildcat Lake mini PC tested with Windows 11 Pro", "source": "CNX Software", "date": "2026-09-06", "url": "https://www.cnx-software.com/2026/09/06/acemagic-kron-mini-k5-review-part-2-a-400-intel-core-3-304-wildcat-lake-mini-pc-tested-with-windows-11-pro/", "summary": "<div><img alt=\"ACEMAGIC Kron Mini K5 Intel Core 3 304 review windows 11\" class=\"attachment-medium size-medium wp-post-image\" height=\"480\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/09/ACEMAGIC-Kron-Mini-K5-Intel-Core-3-304-review-windows-11-720x480.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>After checking out the hardware of the ACEMAGIC Kron Mini K5 with an unboxing and a teardown in the first part of the review, we&#8217;ve now had time to test the Intel Core 3 304 Wildcat Lake mini PC in more depth with Windows 11 Pro. So in this article, we&#8217;ll report our experience with the penta-core mini PC, testing features, running system and AI benchmarks, playing 4K and 8K YouTube videos on Firefox, measuring network throughput (2.5GbE and WiFi 6), evaluating thermal performance, and measuring fan noise and power consumption. Software overview and feature testing The System &#62; About window confirms we have a 1.5 GHz (base frequency) Intel Core 3 304 computer paired with 12GB of RAM and 477GB of storage, running Windows 11 Pro 25H2 build 26200.9168. HWiNFO 64 provides additional details about the 15W Intel Core 3 304 penta-core (1P+4E) Wildcat Lake-U processor, the motherboard with [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/09/06/acemagic-kron-mini-k5-review-part-2-a-400-intel-core-3-304-wildcat-lake-mini-pc-tested-with-windows-11-pro/\">ACEMAGIC Kron Mini K5 Review &#8211; Part 2: A $400 Intel Core 3 304 Wildcat Lake mini PC tested with Windows 11 Pro<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "OpenTrailPaper transforms LILYGO T5 E-Paper S3 Pro devkit into a DIY e‑paper bike computer", "source": "CNX Software", "date": "2026-09-05", "url": "https://www.cnx-software.com/2026/09/05/opentrailpaper-transforms-lilygo-t5-e-paper-s3-pro-devkit-into-a-diy-e-paper-bike-computer/", "summary": "<div><img alt=\"OpenTrailPaper DIY e-paper bike computer\" class=\"attachment-medium size-medium wp-post-image\" height=\"572\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/09/OpenTrailPaper-DIY-e-paper-bike-computer-720x572.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>OpenTrailPaper is an open-source, DIY e-paper bike computer project comprised of firmware for the ESP32-S3-based T5 E-Paper S3 Pro devkit and Android and iOS companion apps for maps, routes, and settings. It shows ride data and offline maps, follows standard GPX (GPS Exchange Format) routes, records FIT (Flexible and Interoperable Data Transfer used in Garmin devices) files, and connects to Bluetooth (and soon ANT/ANT+) heart rate, power, and cadence sensors. Before looking into the project&#8217;s details, let&#8217;s check out the LILYGO T5 E-Paper S3 Pro specifications: ESP32-S3-WROOM-1 wireless module SoC –  ESP32-S3N16R8 dual-core Tensilica LX7 microcontroller @ up to 240 MHz with 2.4 GHz 802.11n WiFi 4 and Bluetooth 5.0 LE connectivity Memory – 8MB PSRAM Storage – 16MB SPI flash PCB antenna Storage &#8211; MicroSD card slot Display – 4.7-inch e-Paper display with 960&#215;540 resolution, 16 shades of gray, capacitive touch (GT911); ED047TC1 drive IC Wireless 2.4 GHz 802.11n [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/09/05/opentrailpaper-transforms-lilygo-t5-e-paper-s3-pro-devkit-into-a-diy-e-paper-bike-computer/\">OpenTrailPaper transforms LILYGO T5 E-Paper S3 Pro devkit into a DIY e‑paper bike computer<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Microchip, Marelli Target Software-Defined Vehicle Display Systems", "source": "Embedded.com", "date": "2026-09-05", "url": "https://www.embedded.com/microchip-marelli-target-software-defined-vehicle-display-systems/", "summary": "<p>Microchip Technology and Marelli have demonstrated a display connectivity solution that streams graphics and video generated by a vehicle's centralized computing system directly to automotive displays using ASA Motion Link (ASA-ML). Based on the open automotive video connectivity and SerDes standard defined by the Automotive SerDes Alliance (ASA), the solution is designed to simplify display [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/microchip-marelli-target-software-defined-vehicle-display-systems/\">Microchip, Marelli Target Software-Defined Vehicle Display Systems<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "ArduinoCore-Zephyr 1.0.0 adds support for Arduino VENTUNO Q, updates to Zephyr 4.4.1, and more", "source": "CNX Software", "date": "2026-09-04", "url": "https://www.cnx-software.com/2026/09/04/arduinocore-zephyr-1-0-0-adds-support-for-arduino-ventuno-q-updates-to-zephyr-4-4-1-and-more/", "summary": "<div><img alt=\"ArduinoCore Zephyr 1.0.0 Arduino Ventuno Q\" class=\"attachment-medium size-medium wp-post-image\" height=\"480\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/09/ArduinoCore-Zephyr-1.0.0-Arduino-Ventuno-Q-720x480.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Arduino has just announced the release of ArduinoCore-Zephyr version 1.0.0, with new hardware support, including the VENTUNO Q SBC, an updated Zephyr 4.4.1 base, support for the Nicla Vision camera, and various fixes and improvements. Arduino first announced its plans to switch from Arm Mbed to Zephyr RTOS in July 2024, before releasing the first beta of Arduino Core for Zephyr in December of the same year. ArduinoCore-Zephyr 1.0.0 is not the first stable version, since that was version 0.90.0 released on July 29, 2026. The new release builds on that, so let&#8217;s see what&#8217;s new. ArduinoCore-Zephyr 1.0.0 highlights Support for Arduino VENTUNO Q SBC, specifically the STM32H5F5 real-time MCU on the board Update to Zephyr 4.4.1 with the latest upstream improvements, security fixes, and driver support Added Nicla Vision camera support to capture and process image data directly through the Zephyr core Various bug fixes and CI improvements Currently [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/09/04/arduinocore-zephyr-1-0-0-adds-support-for-arduino-ventuno-q-updates-to-zephyr-4-4-1-and-more/\">ArduinoCore-Zephyr 1.0.0 adds support for Arduino VENTUNO Q, updates to Zephyr 4.4.1, and more<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Petoi Quaddle – A mini robot dog for physical AI experimentation (Crowdfunding)", "source": "CNX Software", "date": "2026-09-04", "url": "https://www.cnx-software.com/2026/09/04/petoi-quaddle-a-mini-robot-dog-for-physical-ai-experimentation/", "summary": "<div><img alt=\"Petoi Quaddle mini robot dog\" class=\"attachment-medium size-medium wp-post-image\" height=\"418\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/09/Petoi-Quaddle-mini-robot-dog-720x418.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>If you are not into ducks, but still would like to play around with physical AI, the Petoi Quaddle is a mini robot dog equipped with 4 servos controlling its legs and is designed to help people learn robotics, coding, AI, and 3D printing. The robot is powered by an ESP32-S3 motion core for servo control and wireless connectivity, and an optional ESP32-S3 AI core to enable voice commands and Smart Home control. The robot can walk, strafe, spin, talk back, and react to the user&#8217;s touch. Three models are available depending on the user&#8217;s requirements: Builder, Buddy, and Scout. A Raspberry Pi Zero can also be mounted on the top in place of the ESP32-S3-based AI core. Petoi Quaddle runs OpenCat open-source firmware (Arduino) already used in the earlier Petoi Bittle robot dog, first introduced in 2020. The robot can be programmed in a visual programming IDE with drag-and-drop [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/09/04/petoi-quaddle-a-mini-robot-dog-for-physical-ai-experimentation/\">Petoi Quaddle &#8211; A mini robot dog for physical AI experimentation (Crowdfunding)<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "NXP MCX A5 MCUs, Edge AI for Military Drone Autonomy, Modular Computing for Long-Lifecycle Aerospace Platforms: Embedded Week Insights", "source": "Embedded.com", "date": "2026-09-04", "url": "https://www.embedded.com/nxp-mcx-a5-mcus-edge-ai-for-military-drone-autonomy-modular-computing-for-long-lifecycle-aerospace-platforms-embedded-week-insights/", "summary": "<p>Here's a roundup of this week's must-read articles. We'll look into the latest developments on NXP MCX A5 MCUs, edge AI for military drones, modular computing for aerospace platforms, and more. Also, check News Archives - Embedded and Technical Articles Archives - Embedded for the complete list of news and articles from our website. NEWS SomDevices, Celus Bring μSMARC [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/nxp-mcx-a5-mcus-edge-ai-for-military-drone-autonomy-modular-computing-for-long-lifecycle-aerospace-platforms-embedded-week-insights/\">NXP MCX A5 MCUs, Edge AI for Military Drone Autonomy, Modular Computing for Long-Lifecycle Aerospace Platforms: Embedded Week Insights<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "Everspin, Teledyne HiRel Partner on Mission-Critical MRAM", "source": "Embedded.com", "date": "2026-09-04", "url": "https://www.embedded.com/everspin-teledyne-hirel-partner-on-mission-critical-mram/", "summary": "<p>Everspin Technologies and Teledyne HiRel Semiconductors have announced a strategic partnership to expand the use of magnetoresistive random-access memory (MRAM) in aerospace, defense, and other mission-critical applications. The collaboration will initially focus on Everspin's 256-Mb PERSYST spin-transfer torque MRAM (STT-MRAM), combining RAM-like access performance with non-volatile data retention. Under the agreement, Teledyne HiRel will offer [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/everspin-teledyne-hirel-partner-on-mission-critical-mram/\">Everspin, Teledyne HiRel Partner on Mission-Critical MRAM<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "SomDevices, Celus Bring μSMARC Modules to Design Platform", "source": "Embedded.com", "date": "2026-09-03", "url": "https://www.embedded.com/somdevices-celus-bring-%ce%bcsmarc-modules-to-design-platform/", "summary": "<p>Seven NXP i.MX-based modules will become reusable CUBOs, helping engineers evaluate interfaces and implementation requirements earlier.<\/p>\n<p>The post <a href=\"https://www.embedded.com/somdevices-celus-bring-%ce%bcsmarc-modules-to-design-platform/\">SomDevices, Celus Bring μSMARC Modules to Design Platform<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "NXP MCX A5 MCUs Bring 10BASE-T1S Ethernet to Industrial Edge Nodes", "source": "Embedded.com", "date": "2026-09-02", "url": "https://www.embedded.com/nxp-mcx-a5-mcus-bring-10base-t1s-ethernet-to-industrial-edge-nodes/", "summary": "<p>The MCX A5 MCUs combine 10BASE-T1S Ethernet, topology discovery, and post-quantum security to extend Ethernet deeper into industrial networks.<\/p>\n<p>The post <a href=\"https://www.embedded.com/nxp-mcx-a5-mcus-bring-10base-t1s-ethernet-to-industrial-edge-nodes/\">NXP MCX A5 MCUs Bring 10BASE-T1S Ethernet to Industrial Edge Nodes<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "Unlocking Autonomy in Military Drones Goes Beyond SWaP-C", "source": "Embedded.com", "date": "2026-09-02", "url": "https://www.embedded.com/unlocking-autonomy-in-military-drones-goes-beyond-swap-c/", "summary": "<p>Global defense spending has increased amidst rising geopolitical tensions and de-globalization to strengthen national security. The Trump administration's hefty defense budget request this June allocates $2.4 billion just to drones. Resulting from this paradigm shift in warfare, global spending also follows this trend. Further fueled by technological advances, it has converged into a boon for [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/unlocking-autonomy-in-military-drones-goes-beyond-swap-c/\">Unlocking Autonomy in Military Drones Goes Beyond SWaP-C<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "IAR Adds Native Linux Support to Cross-Platform Embedded IDE", "source": "Embedded.com", "date": "2026-09-01", "url": "https://www.embedded.com/iar-adds-native-linux-support-to-cross-platform-embedded-ide/", "summary": "<p>IAR has expanded the cross-platform capabilities of its certified embedded development environment by adding native Linux support alongside Windows. Developed using the Qt Framework, the new IAR cross-platform IDE is designed to provide a development environment across operating systems for safety- and compliance-critical embedded software projects. The platform also integrates directly with Visual Studio Code [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/iar-adds-native-linux-support-to-cross-platform-embedded-ide/\">IAR Adds Native Linux Support to Cross-Platform Embedded IDE<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}], "papers": [{"title": "Programmable World Model", "authors": ["Zheng-Hui Huang", "Guixu Lin", "Jiacheng Lin", "Yi-Chuan Huang", "Ruihan Yu", "Muyao Niu", "Siqi Yang", "Yu-Lun Liu", "Yung-Yu Chuang", "Kaipeng Zhang", "Zhixiang Wang"], "published": "2026-09-09", "summary": "Recent video world models generate increasingly realistic and interactive visual experiences, yet lack reliable mechanisms for maintaining persistent world state and enforcing programmable rules over extended interactions. We introduce Programmable World Model, a framework that decouples world-state evolution from visual observation generation. An agent translates natural-language instructions into executable programs that specify entity states and state-transition rules, enabling direct control over individual entities and their interactions. A lightweight engine executes these programs to update and maintain an explicit, persistent global world state, including off-screen entities and non-visual attributes. To connect world state with visual generation, we introduce state-augmented 3D oriented bounding boxes (OBBs) as an intermediate representation. This representation, together with the target camera trajectory, is deterministically compiled into pixel-aligned spatiotemporal conditioning signals for a pretrained video model serving as the generative renderer. This design allows users to create playable games with predefined mechanics, direct control over individual entities, and persistent world state throughout gameplay. We further introduce CombatStateBench, a benchmark for evaluating programmable world models. On CombatStateBench, our method achieves 94% Count Accuracy and 98% State Accuracy, substantially outperforming existing interactive video world models while supporting coherent long-horizon generation. These results demonstrate the effectiveness of separating explicit state evolution from generative rendering for building persistent, programmable worlds.", "pdf_url": "https://arxiv.org/pdf/2609.10540v1"}, {"title": "Show-Harness: Just a VLM Agent Can Play Robots", "authors": ["Yanzhe Chen", "Zechen Bai", "Zhijun Cao", "Wenzheng Zeng", "Kevin Qinghong Lin", "Yiqi Lin", "Guoqiang Liang", "Kevin Yuchen Ma", "Qiming Huang", "Mike Zheng Shou"], "published": "2026-09-09", "summary": "Foundation vision-language models (VLMs) exhibit broad intelligence about the world, yet translating this intelligence into robot control remains challenging. We present Show-Harness, an Embodied Harness that enables VLMs to \"play\" robots through a compact semantic interface linking intent to action. Show-Harness exposes discrete semantic action units that VLMs can naturally reason over, while embodiment-specific interpreters deterministically ground them into local robot actions, keeping the VLM directly responsible for fine-grained physical decisions. Through the same interface, Show-Harness demonstrates the feasibility of (1) directly unlocking closed-source frontier VLMs for zero-shot robot control, and (2) adapting small-scale open-source VLMs for low-cost deployment with just a few GPU-hours of fine-tuning. We further develop GUMI (GUI Manipulation Interface), which extends the same semantic action space to GUI-based demonstration collection, allowing humans and agents to \"play\" robots across embodiments without specialized teleoperation hardware. Extensive experiments show that Show-Harness-equipped VLM agents generalize robustly across tasks, embodiments, and environments, outperforming representative agentic and VLA paradigms. These results suggest that the right interface can unlock substantial embodied capability from foundation VLMs, without requiring additional model capacity or costly embodiment-specific pretraining.", "pdf_url": "https://arxiv.org/pdf/2609.10522v1"}, {"title": "BrainTaskonomy: Learning How to Pretrain and What to Transfer in fMRI Foundation Models", "authors": ["Junfeng Xia", "Wenhao Ye", "Junxiang Zhang", "Jiayu Zuo", "Mo Wang", "Quanying Liu"], "published": "2026-09-09", "summary": "fMRI foundation models increasingly aggregate heterogeneous data across brain states, cohorts, and acquisition settings, yet pretraining domains are commonly treated as a flat mixture and downstream tasks are adapted independently. We study whether measured learning relations can organize both stages without modifying the backbone. During pretraining, a lightweight Brain-DiT proxy estimates difficulty and directed facilitation across ten fMRI domains, yielding a priority-guided cumulative domain curriculum combined with high-to-low-noise timestep scheduling and joint consolidation. During adaptation, controlled first- and higher-order transfer across fifteen tasks constructs a directed taskonomy, from which budgeted integer programming (BIP) selects directly supervised source tasks and target-specific routes. The joint priority-domain and high-to-low-timestep curriculum reduces v-NMSE, PSD-NMSE, and FC-MSE by 6.5%, 16.3%, and 10.5%, respectively, relative to uniform sampling over both dimensions, and shows strong downstream performance across six in- and out-of-domain tasks. The taskonomy reveals asymmetric, target-dependent transfer, while exploratory sealed-test evaluation shows larger descriptive gains for BIP policies when higher-order route spaces are available than for matched random controls. Together, these findings support organizing fMRI pretraining and adaptation by measured learning relations rather than treating domains and tasks as independent flat sets.", "pdf_url": "https://arxiv.org/pdf/2609.10518v1"}, {"title": "DUET-DINO: Simultaneous Cross-View World Modeling for Latent Planning in Robot Manipulation", "authors": ["Nisarga Nilavadi", "Ralf Römer", "Moritz Reuss", "Michael Krawez", "Tobias Jülg", "Angela P. Schoellig", "Rudolf Lioutikov", "Wolfram Burgard"], "published": "2026-09-09", "summary": "Action-conditioned latent world models predict future visual representations, enabling zero-shot goal-conditioned robot planning and control. However, their predictions for fine-grained spatial and rotational actions are unreliable for full 7-DoF end-effector control. To address this gap, we introduce DUET-DINO, a simultaneous cross-view latent world model that jointly learns action-conditioned predictions from static side- and wrist-camera observations through cross-view conditioning. By exploiting complementary global scene and gripper-centric information, DUET-DINO enables latent planning over the full 7-DoF action space. Across spatially diverse reach, orientation-intensive angled-reach, and multi-goal grasp-and-lift tasks, DUET-DINO consistently outperforms single-view and independent dual-view baselines, achieving 92% success on reach, 72.5% on angled-reach, and 60.0% on lift tasks. DUET-DINO is trained from scratch on DROID and RoboArena datasets and generalizes robustly under visual distribution shifts. We further show that while V-JEPA 2 wrist-view predictions underestimate visual dynamics induced by fine-grained actions, DINOv3 predictions better capture action-conditioned scene changes, leading to stronger downstream planning. The code and model checkpoints will be open-sourced. Project page: https://utn-air.github.io/DUET-DINO", "pdf_url": "https://arxiv.org/pdf/2609.10506v1"}, {"title": "Coastal Environment Generation with HoloOcean", "authors": ["Abigail Austin", "Brady Moon", "Joshua G. Mangelson"], "published": "2026-09-09", "summary": "Marine robotic simulation provides a safe and inexpensive method of developing and testing algorithms for unmanned underwater vehicle (UUV) and unmanned surface vessel (USV) autonomy and perception before full field deployment. However, these simulations are often limited by the availability of simulated environments. Current marine robotics simulation suites offer manual ways to edit or create environments, but they require existing data or specialized knowledge of the environment system. To address these issues, we introduce a novel Unreal Engine 5 level generation pipeline that enables automatic creation of coastal environments for HoloOcean. Our pipeline relies on a user-provided overhead image of a coastal scene. The pipeline then uses the image to generate height map data, as well as automatically select assets and place them in the environment.", "pdf_url": "https://arxiv.org/pdf/2609.10484v1"}, {"title": "Semigroup-JEPA: Latent Dynamics Consistency for Zero-Shot Physics Generalization", "authors": ["Andy Zeyi Liu", "Haoran Sun", "Lucas Baker", "Randall Balestriero", "John Sous"], "published": "2026-09-09", "summary": "Joint-Embedding Predictive Architecture (JEPA) world models learn a compact latent representation of the world that supports prediction and planning, but their capability to learn physics and generate physically realistic dynamics remains hitherto untested. In this work, we introduce SemiGroup-JEPA (SG-JEPA), which extends the LeWorldModel framework by supplying the parameter governing the physics to the temporal model via action-conditioning and jointly training an encoder and predictor through an autoregressive latent rollout. To evaluate the model's ability to generalize out of distribution, we design dynamical tasks under different gravitational fields that, despite obeying the same physical law, exhibit qualitatively different dynamics, ranging from floating motion in weak gravitational fields to rapid bouncing in strong ones. In contrast to DINO-WM, SG-JEPA reduces open-loop prediction error by up to 2 times on two-dimensional datasets, and increases control success rate up to 2.5 times for three-dimensional robotic datasets, for which we train independent diffusion policies. To explain this advantage, we develop a linear feature model that separates local law-conditioned error from its recursive amplification under rollout. Guided by this model, we find that back-propagating the multi-step rollout loss into the representation trains the encoder to keep the features that the predictor can carry forward, and that those are the features the dynamics depend on, so most of the gain comes from the encoder learning better features rather than from the predictor learning better dynamics. See project page at https://sg-jepa.github.io.", "pdf_url": "https://arxiv.org/pdf/2609.10464v1"}, {"title": "Do speech foundation models really learn words?", "authors": ["Robin Huo", "Ewan Dunbar"], "published": "2026-09-09", "summary": "Self-supervised speech foundation models are now used in a wide array of downstream applications, including traditional speech recognition and as the basis for tokens in speech-aware language models. Attempts to understand their usefulness have largely focused on probing their representations' ability to discriminate phonemes and words. However, discriminative ability for words need not imply specialized representation of words per se. Good discrimination of words may be explained by good encoding of word form (phonemes) rather than form-independent word representations encoding identity or syntactic/semantic properties. By partialling out phoneme information using residualization, we show that, in later layers, HuBERT and wav2vec 2.0 do in general learn representations which encode words with reasonable fidelity independently of local phonetic content. We show that this simple approach to disentanglement can enhance higher-order linguistic information in word discovery tasks.", "pdf_url": "https://arxiv.org/pdf/2609.10434v1"}, {"title": "Multi-Agent Reinforcement Learning for Autonomous UAV Exploration in Wildfire Response", "authors": ["Caden Chandra", "Jerry Ng"], "published": "2026-09-09", "summary": "This study develops a deep reinforcement learning framework for training Unmanned Aerial Vehicle (UAV) agents to navigate and monitor simulated wildfire environments. Results show that agents learn increasingly stable and effective behaviors over time, as demonstrated by converging loss trends, improved reward signals, and more consistent navigation patterns such as fire-boundary tracking. Overall, these findings highlight the potential of deep reinforcement learning (DRL) based UAV systems for autonomous wildfire monitoring and suggest that environmental structure and reward design influence policy effectiveness.", "pdf_url": "https://arxiv.org/pdf/2609.10433v1"}, {"title": "Can Foundation Models Moderate Online Content? Evaluating Instruction- vs. Example-Driven Policy Operationalization", "authors": ["Ayan Majumdar", "Shounak Paul", "Pushpdeep Singh", "Ines Abdelaziz", "Sayeh Jarollahi", "Seungeon Lee", "Krishna P. Gummadi", "Ingmar Weber", "Abhisek Dash"], "published": "2026-09-09", "summary": "The growing complexity of content moderation policies presents a critical challenge for their consistent operationalization. While foundation models possess the basic capabilities needed to confront this challenge, whether they can reliably moderate online content remains an unanswered question. In this paper, we systematically compare two competing paradigms for Vision-Language Model (VLM) guidance: an instruction-driven approach where models reason from policy precepts, and an example-driven approach where they generalize from prior precedents. We ground this investigation in ModerationBench, a new benchmark of 4,000 manually annotated, in-the-wild posts from the Bluesky platform. Our experiments reveal that foundation models can substantially outperform Bluesky's deployed moderation system, nearly tripling its $F_1$ score (0.60 vs. 0.22) on Random Posts in the benchmark, with both instruction- and example-driven paradigms achieving comparable peak effectiveness. Our findings thus chart a path toward reliable and adaptable policy operationalization at scale.", "pdf_url": "https://arxiv.org/pdf/2609.10410v1"}, {"title": "Frequency-Conditioned Flow Matching for Vision-Language-Action Models", "authors": ["Haochen Niu", "Shengye Dong", "Hao Liu", "Peiwen Lin", "Wang Chuang"], "published": "2026-09-09", "summary": "Robot actions are temporally correlated trajectories whose frequency components encode motion at different scales with highly non-uniform energy distributions. Yet Flow Matching--based vision-language-action (VLA) models typically generate actions in temporal coordinates, without explicitly modeling or systematically leveraging this frequency heterogeneity. We introduce \\emph{FreqFM}, a frequency-conditioned Flow Matching framework for VLA models. It raises action frequency from an implicit trajectory property to an explicit conditioning dimension that spans the entire generation pipeline. Concretely, in DCT frequency coordinates, FreqFM constructs a spectrum-matched source distribution, adaptively balances the objective across frequencies, and constrains per-frequency guidance residuals using the corresponding reference transport scales. FreqFM integrates into existing Flow Matching action experts without changing the VLA backbone. Across LIBERO, LIBERO-Plus, and VLA-Arena, FreqFM consistently improves performance, including a 9.3-point gain on LIBERO-Plus, and further demonstrates its effectiveness on six real-robot tasks.", "pdf_url": "https://arxiv.org/pdf/2609.10405v1"}, {"title": "A traffic management system for large and heterogeneous vehicles in narrow industrial environments", "authors": ["Alessandro Bonetti", "Silvia Proia", "Simone Guidetti", "Lorenzo Sabattini"], "published": "2026-09-09", "summary": "The coordination of Automated Guided Vehicles (AGVs) in high-density industrial environments represents a critical challenge within Logistics 4.0, as traditional traffic management methods often lead to inefficiencies caused by negotiation-based priority assignment. To overcome the resulting limitations, this paper presents an innovative AGV traffic management system based on a Lifelong Multi-Agent Path Finding (L-MAPF) algorithm operating on roadmaps generated with Non-Uniform Rational B-Splines (NURBS) curves. The approach guarantees locally optimal coordination and ensures safe operation of large and heterogeneous AGVs. Building on this concept, the proposed framework integrates a modified version of the Bounded Horizon Conflict Based Search (CBS) technique within a Rolling Horizon Conflict Resolution strategy, utilizing an extended time horizon for each agent to enable effective conflict resolution in corridors identified by a topological map. In contrast to state-of-the-art methods for AGV fleet traffic management, the proposed solution is designed for real-world, non-standardized (i.e., non-grid-like) industrial settings characterized by narrow bidirectional corridors and high-traffic density, where AGVs of various sizes and capabilities operate simultaneously. Key contributions include an anytime conflict resolution strategy with adaptive time horizon regulation, an execution layer for safe and standard-compliant interaction with real AGVs, and an advanced mechanism for deadlock detection and resolution. Experimental results obtained in realistic industrial environments demonstrate higher throughput, with improvements of up to 11% over a conventional rule-based traffic management system, a state-of-the-art industrial method, and a priority-based L-MAPF variant, while maintaining continuous operation and improved efficiency.", "pdf_url": "https://arxiv.org/pdf/2609.10400v1"}, {"title": "Data-Driven Risk Fields for Safer End-to-End Autonomous Driving", "authors": ["Yuanxin Tian", "Zhiyuan Liu", "Jinhao Li", "Zhenhua Xu", "Wenhao Yu", "Jianqiang Wang"], "published": "2026-09-09", "summary": "Safety is a fundamental requirement for autonomous driving, yet existing end-to-end driving models still lack explicit risk-aware learning capacities. Existing rule-based risk models provide interpretable safety priors, yet their absolute risk scores depend on handcrafted functions, coefficients, and thresholds. Learning-based risk representations reduce part of this manual design, but their supervision often relies on occupancy-derived labels or heuristic cost values, which may not capture ego-conditioned planning risk. In this paper, we propose DRiF, a data-driven risk-field framework for safer end-to-end autonomous driving. DRiF learns a shared BEV feature with static map segmentation, dynamic risk prediction, and vehicle planning. For dynamic risk learning, DRiF converts rule-based safety priors into pairwise risk labels, and trains the risk field to preserve relative risk ordering instead of regressing handcrafted absolute scores. Experiments on Bench2Drive show that DRiF achieves competitive overall performance, with consistent improvements in driving score, success rate, and collision-related metrics. These results establish relative risk supervision as an effective way to connect explicit safety structure with end-to-end planning. The data and code will be publicly available.", "pdf_url": "https://arxiv.org/pdf/2609.10377v1"}, {"title": "PACE: Perceived-Latency-Aware Cascading Service Routing and Filler Control for QoE-Efficient Retrieval-Augmented Dialogue Serving", "authors": ["Lin Huang", "Yujuan Tan", "Weisheng Li", "Lixiang Zeng", "Kun Yang", "Suihan Xiao"], "published": "2026-09-09", "summary": "We present the PACE, a framework for retrieval-augmented dialogue serving that formalizes Perceived Time-to-First-Response (PTFR) as a QoE objective and minimizes it under quality/cost constraints. Unlike prior work on cascaded routing, semantic caching, or adaptive retrieval, PACE jointly controls which answer source composes the response and what fills the waiting window. Deployed on a humanoid-robot sales service, it combines three mechanisms: a load-adaptive cascading router, a joint path-filler controller, and volatility-aware cache admission. On 75k CarQA requests, the cascade halves pure-LLM PTFR at P95 (0.29 vs 0.53s at c16). The adaptive controller reaches 0.41s P95, outperforming RAG by 2.4 times at high load with equal quality. The filler controller cuts calls by 94% with zero conflict. Volatility-aware admission reduces stale answers from 86% to 0%. A gating rule ensures the controller never worse than the baseline, with exposure bounded by one hold period. This is the first quantification of filler-answer conflict risk in deployed services.", "pdf_url": "https://arxiv.org/pdf/2609.10372v1"}, {"title": "A Later Test Set Is Not a New Domain: Pretraining Familiarity Survives a Contamination-Free Hold-Out", "authors": ["Mahdi Naser Moghadasi", "Faezeh Ghaderi"], "published": "2026-09-09", "summary": "Time-series foundation models are evaluated almost exclusively on public archives that predate them, so a strong score cannot be separated from having seen the test set during pretraining. The obvious remedy is a hold-out that postdates the models. We build one: thirteen forecasters -- four classical, three trained per dataset, six pretrained -- on seven groups drawn from five domains, every observation published after the last model was released, and every dataset rebuildable without an API key. Under this protocol pretrained models win 5 of 7 groups, lose one to a Theta baseline, and on daily exchange rates are indistinguishable from a seasonal naive forecast, along with every other method tested. We then ask what separates the wins from the losses, and report a negative result: the two intrinsic properties one would reach for -- seasonal strength and spectral entropy, measured on the input window -- do not account for the pattern, and seasonal strength is if anything negatively associated with the advantage. What does track it is corpus familiarity. Our largest gain (28% lower MASE than the best classical method, on weekly Wikipedia pageviews) falls on Wikipedia pageviews, the domain TimesFM's authors describe as the bulk of its pretraining corpus, at the same granularities and differing only in time window. Within the pretrained family, where every model forecasts identical series so that series difficulty cancels, the TimesFM family outranks the Chronos family by -0.53 ranks on Wikipedia against -0.09 everywhere else (1,500 vs. 754 series, Mann-Whitney p < 1e-5). We conclude that a temporal hold-out removes memorisation of a window but not familiarity with a domain, that benchmarks therefore need domain hold-outs stated relative to disclosed corpora, and that the practitioner's question is less which model is better than whether their domain is one the model was raised on.", "pdf_url": "https://arxiv.org/pdf/2609.10357v1"}, {"title": "A Confidence-Aware Multimodal Fusion Framework for Industrial Human-Robot Collaboration", "authors": ["Xinyu Liu", "Qiqi Dong", "Boya Jia", "Yi Zhang", "Binbin Lian"], "published": "2026-09-09", "summary": "A confidence-aware multimodal fusion framework (CAMF) is proposed to realize reliable human intention prediction for industrial human-robot collaboration. This framework fuses four heterogeneous modalities including object 6D pose, gaze, skeletal motion and IMU-based hand motion. It embeds a confidence-trend-driven dynamic fusion mechanism into BiLSTM to adaptively balance bidirectional temporal features according to real-time modality reliability. A confidence-guided balanced learning strategy combined with a confidence freezing mechanism is further adopted to adjust network gradients dynamically, suppress noise from low-quality modalities and mitigate cross-modal learning bias. A physical platform based on the UR3 collaborative robot is built for experimental validation. Comparative results show that the proposed method reaches an intention recognition accuracy of 91.86% and outperforms existing multimodal fusion approaches in overall performance and stability. It also maintains satisfactory accuracy under low light and partial occlusion interference. In practical assembly tasks, the framework enables proactive and stable human-robot cooperation with strong environmental adaptability.", "pdf_url": "https://arxiv.org/pdf/2609.10339v1"}, {"title": "Odometer-Agnostic Drift Correction Using OpenStreetMap Lane Geometry", "authors": ["Joaquin Caballero", "Emilio Garcia-Fidalgo", "Alberto Ortiz", "Jarno Ralli"], "published": "2026-09-09", "summary": "Despite significant progress in odometry estimation, long-term drift remains a fundamental limitation of incremental pose integration, especially in large-scale or loop-free environments. Existing map-assisted methods can reduce drift, but often depend on dense maps, sensor-specific processing, or complex matching pipelines. We propose a lightweight open-source, odometry-agnostic correction method that aligns short trajectory segments to OpenStreetMap (OSM) lane centerlines. By formulating drift correction as a direct alignment between recent odometry and sparse lane geometry, the method enables efficient online operation without dense priors or expensive preprocessing. Experiments with LiDAR and visual odometry backends demonstrate consistent improvements, with particularly strong gains under severe drift.", "pdf_url": "https://arxiv.org/pdf/2609.10336v1"}, {"title": "Geometry Without Coordinates: LiDAR Diffusion as a 3D Feature Bridge", "authors": ["Samed Doğan", "Nico Leuze", "Alfred Schöttl"], "published": "2026-09-09", "summary": "Transferring the rich priors of large 2D foundation models to sparse 3D LiDAR remains challenging, as training native 3D foundation models at comparable scale is limited by data and annotation scarcity. We introduce a LiDAR-conditioned diffusion model trained on pseudo-labels from off-the-shelf 2D foundation models. The model supports multiple output modalities, including depth, semantic segmentation and instance prediction, selectable via a textual task prompt. Because the model is conditioned on LiDAR, both its outputs and its intermediate UNet features can be projected back onto the input point cloud, enabling analysis of a 3D representation learned entirely under 2D supervision. We study this representation directly in point-cloud space, explicitly excluding raw spatial coordinates to isolate feature content from projection geometry. Linear probes recover up to ~23% Mean Intersection over Union (MIoU) on 3D semantic classes, compared to ~3.5% for a matched Gaussian-noise control, indicating substantial non-trivial structure. Pairwise cosine similarity across modality-specific feature streams reveals a layered organization. Early encoder layers remain weakly aligned across modalities while individually decodable, intermediate layers converge toward a shared representation, and decoder layers re-specialize toward task-specific outputs. These findings indicate that LiDAR-conditioned diffusion models can induce structured 3D representations from 2D supervision alone, with a modality-dependent manifold that locally unifies near a shared bottleneck. This positions diffusion as a viable mechanism for transferring large-scale 2D priors into sparse 3D domains.", "pdf_url": "https://arxiv.org/pdf/2609.10322v1"}, {"title": "Deformable Object Manipulation under Partial Observability via Real-Time Full-Shape Estimation", "authors": ["Kosar Behnia", "Ville Kyrki", "Gokhan Alcan"], "published": "2026-09-09", "summary": "Manipulating deformable objects (DOs) is challenging due to their high-dimensional state space, underactuated dynamics, and partial observability. In this paper, we propose cRVAE, a lightweight conditional recurrent variational autoencoder that estimates the full DO state from only partial corner-node observations during inference. The resulting model is used as the forward model in a receding-horizon optimal control framework for obstacle-aware collaborative DO manipulation. In simulation on rope and fabric, cRVAE estimates the full DO state from the available corner-node measurements alone, matching the accuracy of a parameter-identified XPBD model. At inference it uses no physical parameters as model inputs and performs no online parameter identification. It also runs approximately 350 times faster on the rope and over 1500 times faster on the fabric per forward pass, keeping horizon-based planning within the 100 ms control budget where XPBD exceeds it already at short horizons. Full-shape estimation from corner sensing at in-loop speed is what makes the model deployable on hardware, which we demonstrate on a Unitree Go2 robot.", "pdf_url": "https://arxiv.org/pdf/2609.10308v1"}, {"title": "Learning Terrain-Adaptive Humanoid Locomotion on Granular Terrain", "authors": ["Junnosuke Kamohara", "Feiyang Wu", "Andy Ningan Zong", "Daniel I. Goldman", "Yashwanth Nakka", "Seth Hutchinson", "Ye Zhao"], "published": "2026-09-09", "summary": "Humanoid locomotion on granular terrain remains a significant challenge due to its complex foot-terrain interaction dynamics that are difficult to model. Existing approaches either ignore granular contact dynamics or incorporate simplified normal force models with heuristic tangential components. In this work, we present a physics-grounded granular contact model based on three-dimensional resistive force theory (3D RFT) and efficiently simulate granular terrain for reinforcement learning (RL) training. Unlike traditional rigid contact models and simplified granular contact models with ad-hoc heuristics, our contact solver produces physically accurate granular intrusion dynamics without resorting to heuristics. It captures realistic penetration and tangential drag during training, enabling the policy to learn behaviors that transfer reliably to real-world granular terrain where rigid contact models fail. To adapt to varying terrain conditions, we train a terrain-adaptive locomotion controller via teacher-student RL, using a variational autoencoder to encode terrain information into a compact latent representation. Simulation studies using material point method (MPM) with NVIDIA Newton demonstrate that our method generalizes to unseen granular terrains, achieves a significantly higher success rate than baselines, and demonstrates zero-shot terrain identification and adaptation. We further validate our approach through extensive hardware experiments across diverse real-world granular terrains including basalt, dry sand, and beach sand. To the best of our knowledge, this is the first demonstration of agile humanoid locomotion on real-world granular terrain. Project page: https://humanoid-gm-locomotion.github.io/HUMANOID-GM/", "pdf_url": "https://arxiv.org/pdf/2609.10286v1"}, {"title": "SwingBot: Learning Whole-Body Brachiation for Humanoid Robots", "authors": ["Yujie Xiong", "Peng Zhai", "Taixian Hou", "Quancheng Qian", "Cunwang Liu", "Kangmai Hu", "Long Yang", "Zhiyan Dong", "Lihua Zhang"], "published": "2026-09-09", "summary": "Brachiation enables primates to move across overhead supports when ground paths are blocked, suggesting a complementary locomotion mode for robots operating in cluttered or hazardous environments. Bringing this capabil?ity to high-DoF humanoid robots is difficult because the controller must discover a long-horizon release-swing-capture sequence, coordinate alternating contacts with whole-body momentum, and act without reliable measurements of segment?relative displacement or hook-contact state. We present SwingBot, a learning framework for continuous humanoid brachiation with passive wrist hooks. Swing?Bot makes the task trainable by organizing learning around the structure of brachi?ation: biomimetic keyframes make rare release-swing-capture transitions reach?able during early exploration, and recurrent privileged-state estimation provides compact position and contact latents for deployment. Hardware experiments demonstrate continuous bar traversal and robustness to payload, external distur?bances and different bar spacings, showing that this formulation offers a practical route to whole-body robotic brachiation.", "pdf_url": "https://arxiv.org/pdf/2609.10283v1"}, {"title": "Frame-Coded Legged Locomotion over Noisy Terrain", "authors": ["Lav R. Varshney"], "published": "2026-09-09", "summary": "Open-loop multilegged locomotion over rough terrain has been interpreted as matter transport over a noisy channel: leg-ground interactions are discrete basic active contacts, terrain deletes or perturbs those contacts, and spatial redundancy concentrates the resulting thrust and arrival time. That construction is repetition-like because every module carries the same scalar locomotion task. It consequently provides neither a positive task rate nor a decoder that changes with the surviving contact set. Here we formulate locomotion instead as a quantized finite-frame expansion with erasures. A d-dimensional body-level command is mapped into N>d heterogeneous local contact commands. Rough terrain erases or corrupts frame coefficients, while a contact-gated compliant morphology physically realizes the weighted active-subframe decoder. For a linear-Gaussian model, mechanical equilibrium is exactly the posterior mean, tangent stiffness is posterior precision, and mechanical compliance is posterior covariance. Equal-norm Parseval frames are shown to be minimax optimal against one missing contact, two-contact robustness is governed by frame coherence, and a harmonic frame gives a directly realizable gait family. For independently surviving contacts of probability q, random Gaussian gait frames admit exact reconstruction at every analog dimension rate R<q, with a binomial reliability exponent, whereas recovery of arbitrary commands is impossible for R>q. Residual contact noise yields an asymptotic per-mode amplification 1/(q-R) and a vanishing mechanical stiffness margin at the threshold. An information-locomotion inequality and an exact incremental-redundancy rule direct the next gait component toward the softest task-relevant unresolved mode. The resulting analog frame-coding theorem establishes a finite relative redundancy and converse as part of a fundamental limit theory of legged locomotion.", "pdf_url": "https://arxiv.org/pdf/2609.10273v1"}, {"title": "FolDeX: A Physical-World Benchmark for Long-Horizon Robotic Manipulation of Deformable Objects", "authors": ["Chenhuan Liu", "Yi Xu", "Feng Wu", "Hanyang Wang", "Wenxiao Kuai", "Weihao Ding", "Shan Wang", "Yang Liu", "Shuyong Gao", "Wenqiang Zhang"], "published": "2026-09-09", "summary": "Embodied AI, including vision-language-action and world-action models, must operate reliably in the physical world. Yet methods that perform well in simulation can degrade substantially on real robots, especially in long-horizon deformable-object manipulation, where policies must track changing states and execute reliable multi-stage bimanual interactions. Existing real-robot benchmarks mainly focus on short-horizon rigid-object tasks and offer limited coverage of long-horizon deformable manipulation. We introduce FolDeX, a physical-world benchmark built entirely from real-robot data, with garment folding as its primary task. Since real-robot data collection is costly, FolDeX studies how heterogeneous physical experience can be reused efficiently. The benchmark is organized around four research axes: leveraging human intervention and recovery data collected during deployment; transferring data across tasks, including across garment categories and from rigid to deformable-object manipulation; reusing data across scenes with changes in lighting, background, and layout; and transferring data across robotic embodiments. FolDeX provides 2,000+ hours of real-robot data spanning 20+ tasks and 10+ embodiments. We also establish a fair real-robot evaluation platform for externally submitted policies, with standardized tasks, held-out physical objects, controlled initializations, and a unified execution protocol. The platform is publicly accessible at https://ai.midea.com/#/fold-challenge. We hope FolDeX will serve as a unified testbed for heterogeneous real-robot data reuse and reliable long-horizon deformable manipulation.", "pdf_url": "https://arxiv.org/pdf/2609.10243v1"}, {"title": "CougarTail & CUB: A General-Purpose Mast and Central Utility Board for Cylindrical Underwater Enclosures", "authors": ["Ben Washburn", "Clayton Smith", "Eli Gaskin", "Brighton Anderson", "Braden Meyers", "Brady Moon", "Joshua Mangelson"], "published": "2026-09-09", "summary": "Cylindrical watertight enclosures are widely used across various underwater systems, from unmanned underwater vehicles (UUVs), to remotely operated vehicles (ROVs), to various sensor platforms. However, electronics are typically built on rectangular PCBs arranged in horizontal stacks, which inefficiently occupy the circular cross-section volume that is critical for both payload capacity and buoyancy management. This paper presents CUB (Central Utility Board) and CougarTail, a general-purpose system designed to address this gap. CUB is a circular PCB sized for 4-inch-diameter enclosures that consolidates a Raspberry Pi Compute Module 5 (CM5) and an STM32 microcontroller, while also providing power management features and auxiliary connections. Mounted coaxially, CUB reduces the electronics stack of our CougUV from 200 mm of tube length and 709 g to 25 mm and 156 g, returning that length and mass budget to payload and buoyancy trim. CougarTail is an open-source companion sensor mast that houses a GPS antenna and two dual-band (2.4 and 5 GHz) omnidirectional PCB antennas. Both components are validated through bench testing and integration on a CougUV platform, our small open-sourced torpedo UUVs.", "pdf_url": "https://arxiv.org/pdf/2609.10230v1"}, {"title": "Adaptive Shared Control with Online Bounded-Rational Human Behavior Estimation", "authors": ["Henry Ascencio Trejo", "Roel Pieters", "Gokhan Alcan"], "published": "2026-09-09", "summary": "This work considers adaptive shared human-robot control for nonlinear control-affine systems, where the assumption of a fully rational human is relaxed and the robot adapts its assistance to observed boundedly rational human behavior. We use a level-k bounded-rationality model of the two-player game to construct a finite bank of candidate human and robot policies through alternating best-response computations, with the associated value functions and policies approximated using adaptive dynamic programming. During the shared-control interaction, state-transition residuals compare the measured system evolution with the trajectories predicted by the candidate human policies. The residuals are accumulated using a forgetting factor and mapped to a probabilistic human-behavior model over the finite candidate bank. Rather than selecting a single candidate or averaging stored robot policies, the robot computes a distribution-aware one-step best response by minimizing an expected cooperative cost over the complete estimated human behavior distribution. For a quadratic terminal-value approximation and Euler state propagation, this response admits a closed-form solution expressed in terms of the expected human input. The proposed methods are evaluated in simulations of a benchmark nonlinear system stabilization task, and of a planar manipulator shared control setup. The reported results show decreasing Kullback-Leibler divergence between the estimated and simulated human behavior distributions, and a lower accumulated running cost for the robot agent over the shared control interaction period, than the maximum-probability and probability-weighted alternative policies baseline.", "pdf_url": "https://arxiv.org/pdf/2609.10215v1"}, {"title": "IMU-Centric Moving Horizon Estimation for Lateral Dynamics Estimation Across Vehicles and Grip Conditions", "authors": ["Seuffo Akouan ha Ngoune", "Alessandro Toschi", "Paolo Burgio", "Marko Bertogna"], "published": "2026-09-09", "summary": "Accurate estimation of lateral vehicle dynamics near the adhesion limit is important for stability control and high-performance driving, but lateral velocity is rarely measured directly because sensors such as optical sensors are costly. This paper presents an inertial measurement unit (IMU)-centric Moving Horizon Estimation framework that reconstructs lateral velocity using standard onboard signals, without relying on exteroceptive odometry or detailed tire-parameter tuning. Experimental validation on human-driven sports cars and an autonomous open-wheel race car across tracks, maneuvers, and conditions demonstrates accurate and robust lateral velocity and lateral acceleration estimates. The proposed framework is available at https://github.com/Aseuffo/IMU-Centric-MHE", "pdf_url": "https://arxiv.org/pdf/2609.10202v1"}, {"title": "Multi-Robot Scanner for Automated Full-Body Dermoscopic Imaging", "authors": ["Valerio Franchi", "Rafael Garcia", "Nuno Gracias", "Ricard Campos", "Josep Quintana", "Sandra González-Villà", "Mark Ventura", "Nuria Ferrera", "Clément Lenoir", "Josep Malvehy"], "published": "2026-09-09", "summary": "This paper outlines the specifications and design approach used to construct a full body imaging scanner capable of capturing skin lesions at a dermatoscopic level using cameras mounted on the end-effectors of four UR10 manipulators. The system possesses a view-planning algorithm capable of appropriately selecting the best camera position to acquire images of moles, a high-level controller to allow the manipulators to work simultaneously and a collision-detector that halts the manipulators when they make contact with an object or a person. We evaluate the system through real-patient full-body scans, comparing acquired images against contact dermoscopy and an existing total-body photography system (Vectra) across clinically relevant lesion features, and quantify true optical resolving power using a USAF 1951 resolution target, yielding a smallest resolvable feature size of 22.1 microns for our scanner compared to 8.8 microns for contact dermoscopy. Results show the scanner consistently outperforms Vectra across most clinically relevant features and achieves comparable performance to contact dermoscopy for the majority of features assessed. By acquiring dermatoscopic-quality images automatically and without contact, and without requiring a separate manual dermoscopic examination, the scanner closes part of the gap between total-body photography and handheld dermoscopy, suggesting potential for future integration into screening workflows.", "pdf_url": "https://arxiv.org/pdf/2609.10169v1"}, {"title": "Future-Aware Flow Planning for Safe UAV Target Following", "authors": ["Boning Feng", "Haoran Zhang", "Xiaowen Bi", "Yanzhen Zhang", "Xiaodan Shi"], "published": "2026-09-09", "summary": "UAV target following in cluttered environments is inherently predictive: current-state followers can lag behind turns, choose blocked corridors, or trade tracking for unsafe near-horizon motion. We propose a future-aware flow planning framework for state-informed UAV target following. Predicted target futures guide clean UAV trajectory generation as horizon-aligned residual signals, while risk-scored executable-prefix repair is embedded inside the sampling loop. On fixed ID/OOD receding-horizon benchmarks, the planner improves the intended safety--tracking trade-off rather than dominating every metric: it matches zero measured ID collision rate with the highest ID safe-tracking time, and gives the lowest OOD macro collision rate and final tracking error among the displayed methods, while Future-MPC remains smoother and stronger on some thresholded OOD success metrics under its hand-designed objective. Ablations show that future adaptation improves candidate generation before safety repair, and simulator-facing stress tests probe interface, sensing, and controller-execution effects. These results support horizon-aligned future adaptation and embedded prefix repair as complementary ingredients for safe UAV target following under the tested simulation conditions.", "pdf_url": "https://arxiv.org/pdf/2609.10166v1"}, {"title": "Assembling Two Parts in One Hand", "authors": ["Liuao Pei", "Tianyue Wu", "Hui Zhang", "Ping Luo", "Jie Song"], "published": "2026-09-09", "summary": "A hallmark of human dexterity is the cooperative use of fingers, where different fingers take on distinct yet coordinated roles to accomplish fine manipu- lation, such as capping a pen with the hand that holds it. We study this finger-level coordination through in-hand assembly: mating two rigid objects within a single dexterous hand, with no second arm and no fixture. We present a reinforcement learning formulation to solve this problem in a unified framework, which is driven by a goal relative pose between the two parts. Finger coordination is shaped by a function-based auxiliary reward and regularized toward a single human reference pose, while domain randomization and a fusion of historical proprioception and object observation confer robustness to occlusion-induced estimation noise. The same recipe solves three different assembly tasks (Bottle, Syringe, and Marker). Trained purely in simulation, the policies transfer zero-shot to hardware with a single camera, demonstrating robustness to state-estimation errors caused by oc- clusion. Our experiments also reveal that in-hand assembly places demands on hand morphology and can serve as a benchmark for modern robotic hand systems. Videos and code are available at https://ltbgbird.github.io/in-hand-assembly-page/.", "pdf_url": "https://arxiv.org/pdf/2609.10137v1"}, {"title": "Automatic Reproducible Camera Intrinsic Calibration", "authors": ["Xiangcheng Hu"], "published": "2026-09-09", "summary": "Accurate camera intrinsic calibration is fundamental to robot perception, and the accuracy depends on the quality of the collected images. However, existing target-based calibration methods often require the practitioner to manually filter out high-quality images and to specify an appropriate radial distortion order. This paper presents a fully automatic intrinsic calibration pipeline that determines both from the collected data. We adopt an iterative rejection scheme that estimates parameters on a candidate image set and removes views whose mean residual exceeds a multiple of the median. Crucially, this process runs independently under each candidate distortion order, so that the retained image set is consistent with the residual scale of that order. Further, the distortion order is selected on held-out images, with the intrinsics and distortion fixed and only the board pose re-estimated, ensuring that an added coefficient is supported by independent observations. Finally, we integrate both steps into an interactive calibration tool that supports full-pipeline data inspection and parameter estimation. Experiments on our own camera data and five public real-world datasets show that image filtering reduces the held-out reprojection error by 25\\%, the order selection further by 5\\%, achieving the lowest held-out mean among four compared configurations without manual image selection. We will release the code and data to facilitate future research.", "pdf_url": "https://arxiv.org/pdf/2609.10082v1"}, {"title": "Grounding Generated Video Plans in Simulation Towards Versatile Dexterous Controllers", "authors": ["Tianyue Wu", "Boyuan An", "Shuqi Zhao", "Heyu Guo", "Wanli Xing", "Yi Ma", "Kaifeng Zhang", "Ruihai Wu", "Masayoshi Tomizuka"], "published": "2026-09-09", "summary": "Generated hand-object interaction (HOI) videos provide a controllable way to propose manipulation motions. Simulation-based HOI tracking can translate such kinematic references into feasible low-level control, but its scalability is limited by the lack of reliable reference motions. We therefore combine generated videos with simulation-based HOI grounding: during training, generated videos provide diverse motion references for learning a multi-object, multi-trajectory HOI tracker, and at deployment, the video model produces motion plans that are executed by the learned tracker. In particular, we propose a method that enables scalable reference generation by HOI reconstruction with minimal manual intervention and successfully grounds more than 1,500 generated vide
