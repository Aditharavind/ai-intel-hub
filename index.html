ng>Occupation: <\/strong><\/p><p>Associate director for robotics; director of the Bioinspired Soft Robotics Laboratory<\/p><p><strong>Education: <\/strong><\/p><p>Master’s degree in biology, University of Pisa; master’s degree in eco-management and audit schemes, Scuola Superiore Sant’Anna; Ph.D. in microsystems engineering, University of Rome Tor Vergata<\/p><p>But Mazzolai, now the associate director for robotics at the <a href=\"https://www.iit.it/\" rel=\"noopener noreferrer\" target=\"_blank\">Italian Institute of Technology, in Genoa<\/a>, also believes engineering needs to <a href=\"https://spectrum.ieee.org/robotics-climate-change\" target=\"_blank\">reckon with its own impact<\/a> on the natural world. That’s why she is advocating for a new field of research she calls “sustainability robotics.”<\/p><p>In a manifesto <a href=\"https://www.nature.com/articles/s42256-026-01260-6\" rel=\"noopener noreferrer\" target=\"_blank\">published in<em><em> Nature Machine Intelligence<\/em><\/em><\/a> in July, she and her collaborators outline a vision for a new approach to designing robots that’s meant to improve the relationship between nature, humanity, and technology.<\/p><p>“We need to reduce the footprint of our technology,” she says. “It’s really about thinking in a different way to open new possibilities for robotics [and] for society.” In this new mode of thinking, Mazzolai considers sustainability a core component of the design.<\/p><h2>A child of nature<\/h2><p>Mazzolai traces her fascination with the living world back to her childhood growing up on Italy’s Tuscan coast, close to the port city Livorno. Her father was a public-health inspector and a professional mycologist, and the family spent a lot of time exploring forests and learning about the local fungi and plants.<\/p><p>After toying with the prospect of pursuing art, her other major passion, Mazzolai ultimately decided to enroll at the <a href=\"https://www.unipi.it/en/\" rel=\"noopener noreferrer\" target=\"_blank\">University of Pisa<\/a> in 1987 to study biology. She was particularly drawn to marine biology, but shortly before graduating with a master’s degree in 1995, she secured a research position at the <a href=\"https://www.cnr.it/en/institute/008/institute-of-biophysics-ibf\" rel=\"noopener noreferrer\" target=\"_blank\">Italian National Research Council’s Institute of Biophysics<\/a> studying the cycles of heavy metals like mercury through both living and nonliving parts of the environment.<\/p><p>This involved collecting and analyzing samples from water, soil, vegetables, and even humans to understand the impact these metals have on health and the environment. She balanced this work with studying environmental management at the <a href=\"https://www.santannapisa.it/it\" rel=\"noopener noreferrer\" target=\"_blank\">Scuola Superiore Sant’Anna<\/a>, in Pisa, graduating with a master’s degree in 1998.<\/p><p>During that time, however, she learned that the university was recruiting biologists to help design new devices for environmental monitoring. She applied for and got the job in 1999 and began working as a research assistant under renowned bioroboticist <a href=\"https://www.embs.org/tbme/past-editorial-board-members/paolo-dario/\" rel=\"noopener noreferrer\" target=\"_blank\">Paolo Dario<\/a>, first developing sensors and then robots meant to monitor air, water, and soil.<\/p><p>Even before entering a doctoral program, Mazzolai was promoted to assistant professor in 2004 and shortly afterward made her first foray into bioinspired robotics. In collaboration with colleagues at Sant’Anna, she helped design a soft robot inspired by the octopus. “We proposed it as a paradigm for launching this idea of soft robotics: demonstrating that [robots] can be soft, but at the same time apply strong force to the environment, like the animal does,” she says.<\/p><h2>Back to school<\/h2><p>In 2007 Mazzolai enrolled in a Ph.D. in microsystems engineering at <a href=\"https://web.uniroma2.it/\" rel=\"noopener noreferrer\" target=\"_blank\">Tor Vergata University of Rome<\/a>, which she balanced with her role at Sant’Anna. She was already relying heavily on microfabrication techniques to develop sensors for her robots, and she was keen to push that part of the field forward.<\/p><p>While robots frequently feature sensors designed for perception, such as tactile or proprioceptive sensors, these systems typically focus on understanding the robot’s position in its environment, she says. “But there are few robots that integrate physical or chemical sensors to really understand the environment they move in,” she adds.<\/p><p class=\"pull-quote\"><span>“I’ve always been fascinated by living organisms, [and] by the extraordinary variety of solutions in nature.”<\/span><\/p><p>Mazzolai was appointed as a team leader at the Center for Micro-BioRobotics of the Italian Institute of Technology in 2009, where she continued her work on the emerging field of bioinspired robotics. Two years later, she completed her Ph.D. and was promoted to director of the center.<\/p><h2>Planting the seeds<\/h2><p>Around this time Mazzolai says she became interested in using plants as a model for new kinds of robots, expanding bioinspiration beyond just animals. In particular, she was captivated by the ability of roots to efficiently explore the underground environment, and she imagined machines with the same deftness could have applications in both environmental modeling and <a href=\"https://spectrum.ieee.org/fertilizer-shortage-precision-agricultur\" target=\"_blank\">precision agriculture<\/a>.<\/p><p class=\"shortcode-media shortcode-media-rebelmouse-image\"> <img alt=\"photo of silver metallic coil wrapped around a green plant vine\" class=\"rm-shortcode\" id=\"305e3\" src=\"https://spectrum.ieee.org/media-library/photo-of-silver-metallic-coil-wrapped-around-a-green-plant-vine.jpg?id=67787644&amp;width=980\" /> <small class=\"image-media media-caption\">While many bioinspired robots mimic animals, plants also serve as a muse for Mazzolai. This tendril-like bot can coil around other structures like a vine. <\/small><small class=\"image-media media-photo-credit\">Italian Institute of Technology<\/small><\/p><p>When she first proposed the idea, colleagues were somewhat skeptical of robots based on seemingly static organisms. But in reality, she says, plants move nonstop through a process known as indeterminate growth. “They really grow for their entire life,” she says. “They adapt their morphology, their behavior to the external environment; they repair, they sense, they communicate.”<\/p><p>Trying to mimic a system that operates on such different principles to conventional robotics required some serious thinking, however. Mazzolai says that working in bioinspired robotics sometimes requires you to have “two separate brains”—one of a biologist and one of an engineer.<\/p><p>The process often involves deep study of the target organism to learn the underlying principles that shape how it operates before trying to engineer a robot capable of mimicking them. “It’s not a copy of natural organisms,” says Mazzolai, because a living organism is both difficult to replicate and has different goals.<\/p><p>In the case of plant roots, what makes them so efficient at exploring the soil is that they reduce friction by growing only at the very fine tip of the structure, while the thicker base of the root remains static. This significantly reduces the amount of energy required to push through the earth compared to that of a more conventional drill, which must push the entire structure from above.<\/p><p>To realize this principle in a robot, her team developed a miniaturized 3D printer that sits at the machine’s tip and feeds thermoplastic filament through a heated nozzle to build a snakelike body behind it. This allows the robot to push through the soil efficiently. The tip also contains sensors that allow it to avoid obstacles and detect nearby nutrients or water.<\/p><h2>Making robotics sustainable<\/h2><p>After spending so much of her career borrowing from nature, Mazzolai is now eager to return the favor. Many modern technologies, including plastics and car batteries, have been developed with little thought about how they will affect the environment at the end of their life cycles, she says.<\/p><p>She wants to ensure that robotics doesn’t follow the same path. This is the inspiration for what she and collaborators now call sustainability robotics. The approach has three central pillars: ensuring that robots have minimal impact on the environment; that they’re available to people from across the world and all socioeconomic backgrounds; and that they’re “symbiotic,” providing benefits to both humans and nature.<\/p><p>More concretely, Mazzolai would like to incorporate the concept of a life cycle into the design of robots, so that at the end of their useful life these machines can be reused, recycled, or even biodegraded.<\/p><p>While that might sound ambitious, she’s confident that all the ingredients to make it a reality are in place. And it’s a vision that she is certain will inspire future roboticists. “There are younger people who want to really work in this field because this is the future, their future,” she says. Facing the threat of ongoing environmental damage, “they want to develop something that can help.”<\/p>"}, {"title": "Intrinsic open sources key parts of its platform for easier development", "source": "Robotics Business Review", "date": "2026-09-22", "url": "https://www.therobotreport.com/intrinsic-open-sources-key-parts-platform-easier-development/", "summary": "<p>With Intrinsic Core, the company is making key parts of its manipulation platform available to robotics developers. <\/p>\n<p>The post <a href=\"https://www.therobotreport.com/intrinsic-open-sources-key-parts-platform-easier-development/\">Intrinsic open sources key parts of its platform for easier development<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "NVIDIA Isaac ROS 5.0 Advances Agentic, Open Source Robotics Development", "source": "NVIDIA Robotics", "date": "2026-09-22", "url": "https://blogs.nvidia.com/blog/isaac-ros-5-0-agentic-open-source-robotics/", "summary": "To build and deploy sophisticated robotics applications that can perceive, reason and act in dynamic environments, developers need new physical AI models and tools. The ROS open framework is a project from Open Robotics that helps humans build robots. NVIDIA Isaac ROS 5.0 — a collection of GPU-accelerated packages built on ROS, released today at [&#8230;]"}, {"title": "Isaac ROS 5.0 brings AI agents to robotics development, says NVIDIA", "source": "Robotics Business Review", "date": "2026-09-22", "url": "https://www.therobotreport.com/isaac-ros-5-0-brings-ai-agents-robotics-development-says-nvidia/", "summary": "<p>The release brings new agentic workflows and platform support to NVIDIA Isaac ROS to help developers deploy robotics applications faster. <\/p>\n<p>The post <a href=\"https://www.therobotreport.com/isaac-ros-5-0-brings-ai-agents-robotics-development-says-nvidia/\">Isaac ROS 5.0 brings AI agents to robotics development, says NVIDIA<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Intel to discuss the infrastructure needed to scale physical AI at RoboBusiness", "source": "Robotics Business Review", "date": "2026-09-22", "url": "https://www.therobotreport.com/intel-discusses-infrastructure-needed-to-scale-physical-ai-robobusiness/", "summary": "<p>Intel's Nagesh Puppala will discuss why the next phase of robotics innovation depends on more than bigger models or better simulations.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/intel-discusses-infrastructure-needed-to-scale-physical-ai-robobusiness/\">Intel to discuss the infrastructure needed to scale physical AI at RoboBusiness<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Why outdoor robots fail (and how to build systems that survive)", "source": "Robotics Business Review", "date": "2026-09-22", "url": "https://www.therobotreport.com/why-outdoor-robots-fail-how-to-build-systems-that-survive/", "summary": "<p>Learn practical strategies for building reliable outdoor robots from WiBotic, Burro, and Nextpower at RoboBusiness in Silicon Valley.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/why-outdoor-robots-fail-how-to-build-systems-that-survive/\">Why outdoor robots fail (and how to build systems that survive)<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Boston Dynamics opens Metaplant Application Center to train Atlas humanoids", "source": "Robotics Business Review", "date": "2026-09-21", "url": "https://www.therobotreport.com/boston-dynamics-opens-metaplant-application-center-train-atlas-humanoid-robots/", "summary": "<p>The new Robotics Metaplant Application Center is training humanoids as part of Hyundai's Metaplant America in Georgia.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/boston-dynamics-opens-metaplant-application-center-train-atlas-humanoid-robots/\">Boston Dynamics opens Metaplant Application Center to train Atlas humanoids<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "IAC completes autonomous racing event at Laguna Seca", "source": "Robotics Business Review", "date": "2026-09-21", "url": "https://www.therobotreport.com/iac-completes-autonomous-racing-event-at-laguna-seca/", "summary": "<p>At Laguna Seca, Unimore Racing won the Indy Autonomous Challenge, marking the IAC's first autonomous car overtakes on a road course.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/iac-completes-autonomous-racing-event-at-laguna-seca/\">IAC completes autonomous racing event at Laguna Seca<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Why Deploying Physical AI at Scale Demands Safety at Every Layer", "source": "NVIDIA Robotics", "date": "2026-09-21", "url": "https://blogs.nvidia.com/blog/physical-ai-halos-safety/", "summary": "Physical AI is moving rapidly from research to large-scale deployment. By 2035, ABI Research projects an installed base of 49 million level 3-5 autonomous vehicles (AVs), while Omdia estimates that roughly 60 million industrial robots will be deployed between 2026 and 2035. As these machines enter roads, factories, warehouses and other environments shared with people, [&#8230;]"}, {"title": "What do you do with a humanoid robot when it breaks down?", "source": "Robotics Business Review", "date": "2026-09-20", "url": "https://www.therobotreport.com/what-do-you-do-with-a-humanoid-robot-when-it-breaks-down/", "summary": "<p>Decommissioning a humanoid robot is not a matter of traditional scrapping. It's a highly technical, high-stakes surgical endeavor.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/what-do-you-do-with-a-humanoid-robot-when-it-breaks-down/\">What do you do with a humanoid robot when it breaks down?<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Hirebotics adds line tracking and linear rail capabilities to its cobots", "source": "Robotics Business Review", "date": "2026-09-19", "url": "https://www.therobotreport.com/hirebotics-adds-line-tracking-linear-rail-capabilities-cobots/", "summary": "<p>Hirebotics said these new capabilities extend the working range of the cobots, giving manufacturers greater flexibility.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/hirebotics-adds-line-tracking-linear-rail-capabilities-cobots/\">Hirebotics adds line tracking and linear rail capabilities to its cobots<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Neptune Medical earns FDA clearance for its Triton 1 robotic system", "source": "Robotics Business Review", "date": "2026-09-18", "url": "https://www.therobotreport.com/neptune-medical-earns-fda-clearance-triton-1-robotic-system/", "summary": "<p>Neptune said Triton can elevate any endoscopist's capabilities for screening, surveillance, and diagnostic colonoscopies.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/neptune-medical-earns-fda-clearance-triton-1-robotic-system/\">Neptune Medical earns FDA clearance for its Triton 1 robotic system<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Icarus Robotics flies ISS-bound robot in microgravity for the first time", "source": "Robotics Business Review", "date": "2026-09-18", "url": "https://www.therobotreport.com/icarus-robotics-flies-iss-bound-robot-in-microgravity-for-the-first-time/", "summary": "<p>This is the last major test of the system before Icarus Robotics will be sending JOY the the ISS in early 2027.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/icarus-robotics-flies-iss-bound-robot-in-microgravity-for-the-first-time/\">Icarus Robotics flies ISS-bound robot in microgravity for the first time<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Video Friday: Two Birotors Make a Quadrotor", "source": "IEEE Spectrum Robotics", "date": "2026-09-18", "url": "https://spectrum.ieee.org/video-friday-quadrotor-from-birotor", "summary": "<img src=\"https://spectrum.ieee.org/media-library/two-small-dual-propeller-robots-facing-each-other-connected-by-a-loose-green-cord.png?id=67790149&amp;width=1245&amp;height=700&amp;coordinates=103%2C0%2C103%2C0\" /><br /><br /><p><span>Video Friday is your weekly selection of awesome robotics videos, collected by your friends at <\/span><em>IEEE Spectrum<\/em><span> robotics. We also post a weekly calendar of upcoming robotics events for the next few months. Please <\/span><a href=\"mailto:automaton@ieee.org?subject=Robotics%20event%20suggestion%20for%20Video%20Friday\">send us your events<\/a><span> for inclusion.<\/span><\/p><h5><a href=\"https://humanoidssummit.com/\">Humanoids Summit Seoul<\/a>: 22–23 September 2026, SEOUL<\/h5><h5><a href=\"https://2026.ieee-iros.org/\">IROS 2026<\/a>: 27 September–1 October 2026, PITTSBURGH<\/h5><h5><a href=\"https://www.corl.org/\">CoRL 2026<\/a>: 9–12 November 2026, AUSTIN<\/h5><p>Enjoy today’s videos!<\/p><div class=\"horizontal-rule\"><\/div><div><span style=\"display: none;\"> <\/span><\/div><p class=\"rm-anchors\" id=\"2o41k1nlo1y\">A <a href=\"https://spectrum.ieee.org/flying-quadrotors-with-your-mind\" target=\"_blank\">quadrotor<\/a> is really just two birotors that love each other very much.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://climb.mie.utoronto.ca/\">CLIMB Lab<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"hsnniqsk2vu\">The last 30 seconds of this video are fantastic.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://tolomeis.github.io/contact-guided-exp/\">ETH Zurich Robotic Systems Lab<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"ljpm_2a1zre\">This is great! But if you really want to impress me, convince me that it’s a) safe to be in my home and 2) a realistic alternative to a human.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.figure.ai/news/helix-2-5-zero-shot-30-home-generalization\">Figure<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"2dbyg67etua\">I doubt anyone would call Digit 5 pretty, but here is what serious <a href=\"https://spectrum.ieee.org/humanoid-robot-safety\" target=\"_blank\">humanoid safety<\/a> looks like.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.agilityrobotics.com/\">Agility<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"setzfvdtc7i\"><em>NYU Tandon researchers built an undulatory robot that pumps water between its head and tail to climb slopes, clear steps, and swim, all while keeping the same basic gait.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><blockquote><em>On an incline, shifting water toward the head increases the force pressing the robot’s front contact points against the surface, giving them more traction. Head-biased placement was the only configuration that successfully carried WorMa up the steepest incline tested, 19.5 degrees; every other configuration slid back down. It also reduced the robot’s cost of transport by at least 33 percent compared with the other configurations.<\/em><br /><em>Steps required something different. Neither a fixed head-heavy nor tail-heavy robot could clear a step on its own. The researchers instead had WorMa approach the step with water in its head for traction, then shifted the water to the tail and raised the head and neck so the tail could push the robot closer. Once the head anchored on the step’s edge, the water shifted back to the head, and the robot continued. That sequence got WorMa over steps as high as 15 centimeters.<\/em><\/blockquote><p>[ <a href=\"https://engineering.nyu.edu/news/robot-shifts-its-own-weight-cross-land-steps-and-water\">NYU Tandon School of Engineering<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"n3obxr3law0\"><em>Kubi 2.0 is a desktop telepresence AI robot that allows remote users to look around and interact as if they were physically present. It is also a Physical AI device enabling AI agents to interact with people in the physical environment. For over the past 10 years in Japan, we have successfully implemented our telepresence solutions to help hospitalized and homebound students attend classes, interact with friends, and participate in school events. Now, we are expanding this initiative globally through Kickstarter.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.kickstarter.com/projects/kubi-2/kubi-20-be-present-from-anywhere\">Kubi 2.0 Telepresence Kickstarter<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"baelsmhwmni\">I am oddly impressed by this use case for a wheeled quadruped.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.accessnewswire.com/newsroom/en/industrial-and-manufacturing/technology-empowers-desertification-control-deep-robotics-robotic-dog-1221078\">DEEP Robotics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"rpkqzo1vshu\"><em>Legged robots are versatile on land, but their use in underwater environments remains limited. Extending quadruped locomotion to water enables amphibious mobility with applications in inspection, environmental monitoring, and disaster response. This paper presents the design, modeling, and experimental validation of a reproducible underwater quadruped robot. The robot is built around custom waterproof motor housings machined from polyoxymethylene plastic, which use off-the-shelf O-rings and dynamic shaft seals. A simplified model is derived to describe the dynamics of this underwater legged system, capturing how drag forces on spherical end effectors transmit torque to the floating base. Building on this model, a closed-loop attitude controller is developed using an error formulation defined on the special orthogonal group SO(3). The controller is evaluated both in simulation and experimentally in a water tank, where the robot tracks desired orientation setpoints in roll, pitch, and yaw.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://ntnu-arl.github.io/underwater-quadruped-robot/\">Norwegian University of Science & Technology Autonomous Robots Lab<\/a> ]<\/p><p>Thanks, Kostas!<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"4ehrwhjw5ha\"><em>Ugo Nova, a domestically produced [in Japan] semi-humanoid robot, accelerates the social implementation of physical AI, from research and development to operation in industrial settings.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://ugo.plus/ai/ugo-nova/\">Ugo<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"tpj1xtgl1nc\">I appreciate how much manipulation you can actually do with a good <a href=\"https://spectrum.ieee.org/robots-getting-a-grip-on-general-manipulation\" target=\"_blank\">two-finger gripper<\/a> and a clever robot.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.dmrobot.com/en/\">Daimon Robotics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"hulfqorvpxa\"><em>One humanoid robot rolls off the line every 10 minutes. UBTECH’s benchmark humanoid robot smart factory just goes live—from 1,000 to 10,000 units, we made the leap in less than 9 months.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>This is great! But what are they all going to do?<\/p><p>[ <a href=\"https://www.ubtrobot.com/en/humanoid/products/walker-s2\">UBTECH<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"ao1u9joxlpk\"><em>MIT engineers have built a robotic optics lab that builds, runs, and dismantles an optics experiment on demand. The setup centers on a robotic arm that physically arranges mirrors, lenses, and other optical components that are each set in custom-designed, QR-encoded housings. The robot arranges each component in precise alignments to direct and focus a beam of light (red laser). The autonomous system could speed up testing of high-tech materials, from solar cells and sensors to video displays and quantum technologies. This video is sped up 2x.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://news.mit.edu/2026/robotic-lab-runs-optics-experiments-on-demand-0917\">MIT<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"nlbijwhuqx4\"><em>Student-built rovers. Lunar terrain. High-stakes competition at NASA’s Kennedy Space Center. See the energy, engineering, and excitement of Lunabotics as university teams put their robotic systems to the test in a simulated lunar environment. These are highlights from the previous competition, as well as a look ahead as teams get ready for Lunabotics 2027.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.nasa.gov/learning-resources/lunabotics-challenge/\">Lunabotics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"gsoci0alw6g\">This CMU Robotics Institute Seminar is by Erol Şahin from METU, on “Augmenting Bee Colonies with Robotics and AI Technologies for Ecosystem Support.”<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><blockquote><em>Earth’s ecosystems are facing a rapid decline in biodiversity, with honeybees—keystone pollinators critical to ecosystem stability—being among the most affected. The EU-funded RoboRoyale project addresses this crisis by integrating advanced robotics and AI to augment the beehive, enabling observation at unprecedented resolutions and scales. Featured on the cover of Science Robotics<\/em><em> and receiving the 6th Edge of Government Award at the World Government Summit in 2024, our system tracks the Queen’s behaviors, colony efficiency, comb states, and long-term foraging activities, while advancing microrobotic intervention capabilities to support hive health. In this talk, I will discuss the challenges of developing this system, share key findings regarding complex social interactions, and explore the future potential of bio-hybrid research.<\/em><\/blockquote><p>[ <a href=\"https://www.ri.cmu.edu/event/augmenting-bee-colonies-with-robotics-and-ai-technologies-for-ecosystem-support/\">Carnegie Mellon University Robotics Institute<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div>"}, {"title": "SoftBank agrees to acquire Robotics and AI Institute", "source": "Robotics Business Review", "date": "2026-09-18", "url": "https://www.therobotreport.com/softbank-agrees-to-acquire-robotics-and-ai-institute/", "summary": "<p>The deal has been rumored for a couple of months, but it is now being reviewed by the Committee on Foreign Investment in the United States.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/softbank-agrees-to-acquire-robotics-and-ai-institute/\">SoftBank agrees to acquire Robotics and AI Institute<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "F-Prime Capital to give insights on the state of robotics investments at RoboBusiness", "source": "Robotics Business Review", "date": "2026-09-18", "url": "https://www.therobotreport.com/f-prime-capital-give-insights-state-robotics-investments-robobusiness/", "summary": "<p>Sanjay Aggarwal and Betsy Mulé of F-Prime Capital will unveil the firm's State of Robotics Investments report at RoboBusiness.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/f-prime-capital-give-insights-state-robotics-investments-robobusiness/\">F-Prime Capital to give insights on the state of robotics investments at RoboBusiness<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "The picks-and-shovels strategy behind the robotics boom", "source": "Robotics Business Review", "date": "2026-09-18", "url": "https://www.therobotreport.com/the-picks-and-shovels-strategy-behind-the-robotics-boom/", "summary": "<p>The real robotics opportunity isn’t a humanoid in every home—it’s packaging robots for the jobs businesses need done today.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/the-picks-and-shovels-strategy-behind-the-robotics-boom/\">The picks-and-shovels strategy behind the robotics boom<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Robotics investments reach $4.9B in August 2026", "source": "Robotics Business Review", "date": "2026-09-17", "url": "https://www.therobotreport.com/robotics-investments-reach-4-9b-in-august-2026/", "summary": "<p>The August 2026 Robotics Investments Report includes a table with all 162 investments rounds, complete with breakdowns by technology, country, funding stage, and more.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/robotics-investments-reach-4-9b-in-august-2026/\">Robotics investments reach $4.9B in August 2026<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Arm Total Design for Physical AI brings more than 80 developers together", "source": "Robotics Business Review", "date": "2026-09-17", "url": "https://www.therobotreport.com/arm-total-design-for-physical-ai-brings-more-than-80-developers-together/", "summary": "<p>With its new program and its Robotics Capability Framework, Arm aims to bring more clarity and unity to the robotics industry.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/arm-total-design-for-physical-ai-brings-more-than-80-developers-together/\">Arm Total Design for Physical AI brings more than 80 developers together<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Designing long-travel axes: When rack and pinion outperforms ball screws and linear motors", "source": "Robotics Business Review", "date": "2026-09-17", "url": "https://www.therobotreport.com/designing-long-travel-axes-when-rack-and-pinion-outperforms-ball-screws-and-linear-motors/", "summary": "<p>When long-travel motion demands more than ball screws and linear motors can deliver, rack-and-pinion systems can offer a compelling combination of speed, precision, scalability, and cost. Here’s when engineers should consider the tradeoff.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/designing-long-travel-axes-when-rack-and-pinion-outperforms-ball-screws-and-linear-motors/\">Designing long-travel axes: When rack and pinion outperforms ball screws and linear motors<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Rethinking Robot Safety in the Age of AI", "source": "IEEE Spectrum Robotics", "date": "2026-09-16", "url": "https://spectrum.ieee.org/physical-ai-robot-cybersecurity-vicone", "summary": "<img src=\"https://spectrum.ieee.org/media-library/humanoid-robots-and-people-walking-through-a-modern-city-street-with-glass-buildings.jpg?id=67745861&amp;width=1245&amp;height=700&amp;coordinates=0%2C0%2C0%2C0\" /><br /><br /><p><em>This article is brought to you by <a href=\"https://vicone.com?utm_source=ieee-spectrum&amp;utm_medium=sponsored-content&amp;utm_campaign=2026-09\" target=\"_blank\">VicOne<\/a>.<\/em><\/p><p>Robot safety has traditionally asked: Can a machine remain safe when something goes wrong? Physical AI raises a harder question: Can a machine remain safe when an attacker changes what it sees, decides, or does even when nothing appears to have failed?<\/p><p>As AI and robotics continue to advance at an unprecedented pace, modern robots perceive through multimodal sensors, interpret context using AI models, and translate those interpretations into physical action. As they move into dynamic environments, their safety increasingly depends on the integrity of the data guiding their decisions.<\/p><p>That dependence creates risks that conventional safety assessments may not fully capture. Recent research has demonstrated that manipulating what a robot sees, hears, or interprets can influence its behavior without requiring direct control.<\/p><p>Such manipulation can occur anywhere across its complex sensing and decision-making system — a layered attack surface encompassing training pipelines, system infrastructure, and runtime perception.<\/p><h2>Layer One: Corrupting intelligence at its source<\/h2><p>In 2017, <a href=\"https://arxiv.org/abs/1708.06733\" rel=\"noopener noreferrer\" target=\"_blank\">BadNets<\/a> demonstrated that a model could behave normally under most conditions, yet fail in the presence of a specific hidden trigger. In one example, a subtle pattern caused a stop sign to be misclassified as a speed limit sign without affecting the model’s behavior on other inputs.<\/p><p>What began as a classification vulnerability has since evolved into action manipulation.<\/p><p>At NeurIPS 2025, researchers introduced <a href=\"https://arxiv.org/abs/2505.16640\" rel=\"noopener noreferrer\" target=\"_blank\">BadVLA<\/a><strong> <\/strong>a backdoor attack targeting Vision-Language-Action (VLA) models that allow robots to see, interpret instructions, and produce coordinated physical movement. Rather than altering a single label, the attack caused conditional deviations in the robot’s action trajectory when a trigger was present. Without the trigger, the model largely preserved normal task performance, while the backdoor remained effective under task transfers and model fine-tuning.<\/p><p>A related study in 2025, <a href=\"https://arxiv.org/abs/2510.09269\" rel=\"noopener noreferrer\" target=\"_blank\">GoBA<\/a>, showed that ordinary objects such as a coffee mug could serve as a reliable trigger. The researchers reported a 97 percent attack success rate without degrading performance on clean inputs.<\/p><p class=\"pull-quote\">A critical safety question today is whether Physical AI models remain within their task and safety boundaries under adversarial conditions.<\/p><p>These studies expose a blind spot in model validation: A model may pass testing yet produce corrupted behavior when a hidden trigger appears in operation.<\/p><p>So a critical safety question today is whether Physical AI models remain within their task and safety boundaries under adversarial conditions. <a href=\"https://vicone.com/company/press-releases/vicone-turns-def-con-34-robot-hacking-research-into-free-nvidia-isaac-sim-extension?utm_source=ieee-spectrum&amp;utm_medium=sponsored-content&amp;utm_campaign=2026-09\" rel=\"noopener noreferrer\" target=\"_blank\">Simulation tools<\/a> such as NVIDIA Isaac Sim, when paired with <a href=\"https://vicone.com/products/radeis?utm_source=ieee-spectrum&amp;utm_medium=sponsored-content&amp;utm_campaign=2026-09\" target=\"_blank\">VicOne Radeis<\/a>, can test the effects of manipulated inputs before deployment.<\/p><p class=\"shortcode-media shortcode-media-youtube\"> <span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span> <small class=\"image-media media-caption\">VicOne LAB R7 demonstrates Radeis, a Physical AI safety validator for NVIDIA Isaac Sim that tests how adversarial visual inputs affect robot behavior before deployment.<\/small><small class=\"image-media media-photo-credit\">VicOne<\/small><\/p><h2>Layer Two: System vulnerabilities as gateways to AI control<\/h2><p>Even a securely trained model can be subverted if the surrounding system stack is vulnerable.<\/p><p>In September 2025, researchers disclosed <a href=\"https://github.com/Bin4ry/UniPwn\" rel=\"noopener noreferrer\" target=\"_blank\">UniPwn<\/a>, a Bluetooth <a href=\"https://spectrum.ieee.org/unitree-robot-exploit\" target=\"_blank\">exploit chain affecting quadruped and humanoid robots<\/a> from a major manufacturer. Hardcoded cryptographic keys allowed traffic decryption, authentication checks were bypassed, and command injection enabled root-level execution. The exploit is also described as “wormable.” A compromised robot could scan nearby units and potentially affect an entire fleet.<\/p><p class=\"shortcode-media shortcode-media-youtube\"> <span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span> <small class=\"image-media media-caption\">VicOne Lab R7’s demo shows how chaining three wireless exploits can trigger uncontrolled robot behavior within 60 seconds, resulting in operational disruption.<\/small><small class=\"image-media media-photo-credit\">VicOne<\/small><\/p><p><span>Middleware creates another exposure point. Vulnerabilities in <a href=\"https://www.ros.org/\" target=\"_blank\">ROS 2<\/a> and DDS-based systems can enable arbitrary code execution or abuse unauthenticated topics to deliver malicious commands. With sufficient access, an attacker could override motor commands or replace AI model weights without directly attacking the model architecture.<\/span><\/p><p>In this case, the components may still function as designed. What has changed is the trustworthiness of the commands flowing through the system. Vulnerability management can help teams identify known risks before deployment, while continuous monitoring can surface emerging threats.<\/p><h2>Layer Three: Manipulating perception and reasoning at runtime<\/h2><p>At runtime, manipulating inputs that shape perception or reasoning may require neither firmware modification nor a network breach.<\/p><p>In 2024, <a href=\"https://robopair.org/\" target=\"_blank\">RoboPAIR<\/a><strong> <\/strong>demonstrated how carefully structured prompts could redirect LLM-controlled robots into unsafe trajectories. <a href=\"https://arxiv.org/abs/2407.20242\" target=\"_blank\">BadRobot<\/a><strong> <\/strong>exposed a deeper architectural weakness: in several cases, a robot verbally refused a dangerous command while its motion controller executed the action anyway.<\/p><p>Vision-based manipulation is equally powerful. <a href=\"https://arxiv.org/abs/2411.13587\" target=\"_blank\">VLAttack<\/a><strong> <\/strong>showed that an adversarial patch within the camera’s view could reduce a VLA model’s task success rate to zero. <a href=\"https://arxiv.org/abs/2509.19870\" target=\"_blank\">FreezeVLA<\/a><strong> <\/strong>showed that a single adversarial image could freeze a robot’s decision-making loop, making it unresponsive to subsequent instructions.<\/p><p class=\"pull-quote\">Runtime assurance must therefore look beyond whether individual components remain available and assess whether cyber events are beginning to affect physical behavior.<\/p><p>In each case, the camera may still work, the model may still run, and the controller may still respond. Yet the resulting behavior can be unsafe because the robot is acting on manipulated perception or reasoning.<\/p><p>Runtime assurance must therefore look beyond whether individual components remain available and assess whether cyber events are beginning to affect physical behavior. Security event correlation, behavioral-impact assessment, and policy-bounded response supported by edge AI, can help contain the affected path without unnecessarily stopping the entire robot fleet.<\/p><h2>From point-in-time safety to lifecycle assurance<\/h2><p>The risks across these three layers reveal the missing layer in robot safety assurance: cybersecurity. Functional safety addresses failures and unexpected operating conditions; cybersecurity extends that assurance to deliberate manipulation, including attacks that may leave the underlying system apparently functional.<\/p><p>This requires assurance across the robot’s lifecycle. During design, teams need to understand which cyber risks could invalidate assumptions behind intended behavior. Before deployment, they should test whether realistic attacks can cause a robot to deviate from its task or safety boundaries. In operation, monitoring should identify whether cyber events are beginning to affect behavior, contain the affected path, and preserve safe operation where possible.<\/p><p class=\"shortcode-media shortcode-media-rebelmouse-image\"> <img alt=\"Diagram of end\\u2011to\\u2011end AI robot security from development to operation monitoring\" class=\"rm-shortcode\" id=\"097ea\" src=\"https://spectrum.ieee.org/media-library/diagram-of-end-u2011to-u2011end-ai-robot-security-from-development-to-operation-monitoring.jpg?id=67745953&amp;width=980\" /> <small class=\"image-media media-caption\">VicOne’s lifecycle approach combines AI model and vulnerability scanning, simulation-based validation, and continuous monitoring to help secure robots from development through operation.<\/small><small class=\"image-media media-photo-credit\">VicOne<\/small><\/p><p><span>While cybersecurity does not replace functional safety, it helps ensure that Physical AI remains within acceptable boundaries even when what it sees, decides, or does is under attack.<\/span><\/p><p>For a deeper look at the cybersecurity risks and defense strategies shaping autonomous robotics, download our whitepaper “<a href=\"https://info.vicone.com/ai-robotics-security-risk-whitepaper?utm_source=ieee-spectrum&amp;utm_medium=sponsored-content&amp;utm_campaign=2026-09\" target=\"_blank\">Securing the Rise of AI Robots: Cyber Risks, Real-World Threats, and Defense Strategies<\/a>.”<\/p>"}, {"title": "The evolution of Digit: Agility Robotics’ journey from Cassie to Digit 5", "source": "Robotics Business Review", "date": "2026-09-16", "url": "https://www.therobotreport.com/the-evolution-of-digit-agility-robotics-journey-from-cassie-to-digit-5/", "summary": "<p>From Cassie, to five different versions of Digit, Agility Robotics has adapted its technology to fit industrial tasks. <\/p>\n<p>The post <a href=\"https://www.therobotreport.com/the-evolution-of-digit-agility-robotics-journey-from-cassie-to-digit-5/\">The evolution of Digit: Agility Robotics&#8217; journey from Cassie to Digit 5<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "OLogic to share how robots can learn from human demonstrations at RoboBusiness", "source": "Robotics Business Review", "date": "2026-09-16", "url": "https://www.therobotreport.com/ologic-to-share-how-robots-can-learn-from-human-demonstrations-at-robobusiness/", "summary": "<p>OLogic CEO Ted Larson will explore the foundations of egocentric robot learning and the technical challenges involved in building these systems.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/ologic-to-share-how-robots-can-learn-from-human-demonstrations-at-robobusiness/\">OLogic to share how robots can learn from human demonstrations at RoboBusiness<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Agility’s Digit 5 humanoid has new legs, batteries, and safety upgrades", "source": "Robotics Business Review", "date": "2026-09-15", "url": "https://www.therobotreport.com/agilitys-digit-5-humanoid-has-new-legs-batteries-safety-upgrades/", "summary": "<p>The latest version of Digit includes new knees, upgraded batteries, and more comprehensive safety architecture.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/agilitys-digit-5-humanoid-has-new-legs-batteries-safety-upgrades/\">Agility’s Digit 5 humanoid has new legs, batteries, and safety upgrades<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Digit 5 May Be the First Humanoid Robot Worker That’s Truly Safe", "source": "IEEE Spectrum Robotics", "date": "2026-09-15", "url": "https://spectrum.ieee.org/humanoid-robot-safety", "summary": "<img src=\"https://spectrum.ieee.org/media-library/a-front-and-an-angled-view-of-a-teal-colored-humanoid-robot-with-arms-bent-at-the-elbow.jpg?id=67776740&amp;width=1245&amp;height=700&amp;coordinates=0%2C187%2C0%2C188\" /><br /><br /><p><span>Despite the recent deluge of videos of humanoid robots doing backflips and kung fu, the actual pace of progress towards humanoids that can do economically viable jobs at scale has at times seemed a bit plodding. There are <\/span><a href=\"https://spectrum.ieee.org/humanoid-robot-scaling\" target=\"_self\">some good reasons for this<\/a><span>: A humanoid robot needs to be powerful enough to do useful work, safe enough for humans to walk past, and have enough battery life to limit how much of the day it’s hooked to a charger. But all three of those necessary features actively work against each other.<\/span><\/p><p>With its new Digit 5 robot, announced today, Agility Robotics may have found the sweet spot. Digit 5 is a humanoid worker that can lift 23 kilograms up 2.1 meters, can work in close proximity to people without relying on physical barriers, and can operate for more than 20 hours a day. This combination of power, safety, and battery life has resulted in a 1.8-meter tall, 129-kg robot that prioritizes functionality over style and pretty much everything else, but this is exactly what it’s going to take to get humanoids a job.<\/p><p class=\"shortcode-media shortcode-media-youtube\"> <span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span> <\/p><p>Humanoid robot companies have been reluctant to talk about safety, because there are no easy answers to “What happens if your fundamentally unstable bipedal robot falls over onto me/my pet/my baby?” And there are still no easy answers, but Agility does have <em><em>an<\/em><\/em> answer that allows Digit to be verifiably safe. That answer is to make sure that it’s physically impossible for Digit to fall over on anyone, ever, by “autonomously avoiding, stopping, or assuming a seated position,” according to today’s press release. In other words, as a person approaches Digit, Digit will put down whatever it’s carrying and then if necessary make sure that it’s stably seated on the ground before that person gets near. It may not be elegant, but it works, which is more than can be said for any other commercial humanoid that I’m aware of.<\/p><p>The other big change is Digit’s legs. Somewhat famously, Agility Robotics first introduced Cassie and then a whole series of Digit robots featuring bird-like ‘backwards’ legs. In <a href=\"https://spectrum.ieee.org/building-robots-that-can-go-where-we-go\" target=\"_self\">his 2019 article for IEEE Spectrum<\/a>, Agility co-founder Jonathan Hurst explained that this leg configuration was the result of a careful analysis of the physics of animal locomotion, rather than for the leg to look like any sort of animal in particular. The unfortunate reality for those of us who were fans of Cassie is that bird legs are optimal for dynamic motion, while human legs are better for squats and lifts, which will make sense to anyone who has seen an ostrich trying to lift a heavy box up off the floor and also anyone who has tried to outrun a cassowary.<\/p><h2>How much will Digit 5 cost?<\/h2><p>We also know a couple of things about Digit 5 that weren’t included in today’s announcement, thanks to Agility’s June <a href=\"https://www.sec.gov/Archives/edgar/data/2074973/000121390026071287/ea029548401ex99-2.htm\" rel=\"noopener noreferrer\" target=\"_blank\">SEC filing<\/a> in advance of their <a href=\"https://www.agilityrobotics.com/content/agility-robotics-to-go-public-through-merger-with-churchill-capital-corp-xi\" rel=\"noopener noreferrer\" target=\"_blank\">plan to go public by the end of 2026<\/a>. For example, at launch, <a href=\"https://www.sec.gov/Archives/edgar/data/2074973/000121390026071287/ea029548401_ex99-2img46.jpg\" rel=\"noopener noreferrer\" target=\"_blank\">Digit 5’s BOM (bill of materials) cost<\/a> is likely to be somewhere between US $150,000 and $200,000. This is just the cost of the parts that make up a Digit robot, not what it costs for Agility to actually build one. Based on real production data, Agility is anticipating that with some near-term optimizing and at a volume of 10,000 units per year, that cost should drop to under US $50,000 per robot. <\/p><p class=\"shortcode-media shortcode-media-rebelmouse-image\"> <img alt=\"An illustration of humanoid robots working in a warehouse with humans in the distance.\" class=\"rm-shortcode\" id=\"a6c5f\" src=\"https://spectrum.ieee.org/media-library/an-illustration-of-humanoid-robots-working-in-a-warehouse-with-humans-in-the-distance.jpg?id=67776745&amp;width=980\" /> <small class=\"image-media media-caption\">In this rendering, Digit 5 robots work in a factory with humans nearby, no safety barriers needed. When a human approaches, the robot puts down what it’s carrying and squats down so it can’t fall on anybody.<\/small><small class=\"image-media media-photo-credit\">Agility<\/small><\/p><p>Arguably less important than the per-robot cost is how Agility (and its customers) will profit from Digit 5. In the filing, <a href=\"https://www.sec.gov/Archives/edgar/data/2074973/000121390026071287/ea029548401_ex99-2img41.jpg\" target=\"_blank\">Agility estimates<\/a> (using “rounded estimates” which are “purely illustrative”) that Digit 5 robots will be offered to customers as a service at something like $8,500 per month. Based on 20 hours per day of work, and assuming that the total cost of a human worker to their employer is $30.50 per hour, Digit 5 as a service could save employers $100,000 per year, per robot. <\/p><p>It’s important to note that all of these numbers are just estimates, and that all kinds of things (many of them not under Agility’s control) could cause them to change. They’re most useful as an illustration of Agility’s broad approach to making Digit 5 profitable. It’s also important to note the assumption here with such a direct comparison is that Digit 5 will be a more or less effortless drop-in replacement for human labor, which is not something that I’m entirely sure has ever happened with any robot, anywhere.<\/p><p>Where does Digit 5 go from here? Today’s press release says that “as of May 2026, Agility had more than $300 million in multi-year customer orders for Digit 5, with a sales pipeline of prospective customers across manufacturing, warehousing, and logistics.” That works out to comfortably under 1,000 robots, one-tenth of the full capacity of <a href=\"https://spectrum.ieee.org/agility-humanoid-robotics-factory\" target=\"_self\">Agility’s RoboFab factory<\/a> in Oregon.<\/p><p>Between now and all those robots, however, lies an unpredictable entry into the stock market through what’s called a <a href=\"https://www.agilityrobotics.com/content/agility-robotics-to-go-public-through-merger-with-churchill-capital-corp-xi\" target=\"_blank\">SPAC (special purpose acquisition company) merger<\/a>. That’s expected to close within the next few months. Agility hopes to raise more than $620 million through the merger, and it will primarily spend the money to scale production of Digit 5 and get it to customers. Those in the European Union and United Kingdom should be able to buy the bots in 2027.<\/p>"}, {"title": "InOrbit.AI releases OpenRobOps ISO 21423 reference implementation", "source": "Robotics Business Review", "date": "2026-09-15", "url": "https://www.therobotreport.com/inorbit-ai-releases-openrobops-iso-21423-reference-implementation/", "summary": "<p>OpenRobOps gives robotics developers a foundation to deliver a fleet manager with support for the upcoming interoperability standard. <\/p>\n<p>The post <a href=\"https://www.therobotreport.com/inorbit-ai-releases-openrobops-iso-21423-reference-implementation/\">InOrbit.AI releases OpenRobOps ISO 21423 reference implementation<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Heart of the Matter: How a Major Children’s Hospital Uses Open Source NVIDIA AI for Cardiac Care", "source": "NVIDIA Robotics", "date": "2026-09-15", "url": "https://blogs.nvidia.com/blog/childrens-hospital-open-source-ai-cardiac-care/", "summary": ""}, {"title": "Universal Robots launches its seventh generation robot platform at IMTS", "source": "Robotics Business Review", "date": "2026-09-14", "url": "https://www.therobotreport.com/universal-robots-launches-its-seventh-generation-robot-platform-at-imts/", "summary": "<p>Universal Robots has released three new robot arms, a rebuilt core controller, a new AI-ready tool flange, and more. <\/p>\n<p>The post <a href=\"https://www.therobotreport.com/universal-robots-launches-its-seventh-generation-robot-platform-at-imts/\">Universal Robots launches its seventh generation robot platform at IMTS<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Arm to discuss scaling physical AI at RoboBusiness", "source": "Robotics Business Review", "date": "2026-09-14", "url": "https://www.therobotreport.com/arm-to-discuss-scaling-physical-ai-at-robobusiness/", "summary": "<p>Dermot O'Driscoll, the VP of go-to-market for physical AI at Arm, will examine key compute principles behind trusted physical AI.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/arm-to-discuss-scaling-physical-ai-at-robobusiness/\">Arm to discuss scaling physical AI at RoboBusiness<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Why RaaS needs more than a subscription model", "source": "Robotics Business Review", "date": "2026-09-14", "url": "https://www.therobotreport.com/why-raas-needs-more-than-a-subscription-model/", "summary": "<p>At RoboBusiness 2026, a panel of robotics business leaders will examine the practical playbook behind Robots-as-a-Service or RaaS offerings. <\/p>\n<p>The post <a href=\"https://www.therobotreport.com/why-raas-needs-more-than-a-subscription-model/\">Why RaaS needs more than a subscription model <\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}], "embeddedNews": [{"title": "Using an ESP32-C3’s RF Hardware for DVB-S2 Video Transmission", "source": "Hackaday", "date": "2026-10-14", "url": "https://hackaday.com/2026/10/14/using-an-esp32-c3s-rf-hardware-for-dvb-s2-video-transmission/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"450\" src=\"https://hackaday.com/wp-content/uploads/2020/11/esp32-c3-featured.jpg?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>Generally the DVB-S and -S2 standards require a satellite somewhere in Earth orbit to provide a signal to receive, but you can also transmit your own DVB-S2 stream with any <a class=\"read-more\" href=\"https://hackaday.com/2026/10/14/using-an-esp32-c3s-rf-hardware-for-dvb-s2-video-transmission/\">&#8230;read more<\/a>"}, {"title": "Tiny e-Paper Display Delivers 30 FPS of Game Boy Fun", "source": "Hackaday", "date": "2026-10-14", "url": "https://hackaday.com/2026/10/14/tiny-e-paper-display-delivers-30-fps-of-game-boy-fun/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"450\" src=\"https://hackaday.com/wp-content/uploads/2026/10/ePaper_esp32_gameboy.jpg?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>Slow refresh, ghosting and low-contrast &#8212; wait, are we talking about passive matrix LCDs, or e-paper displays? That might be why e-paper Game Boy emulators are a thing: the limitations <a class=\"read-more\" href=\"https://hackaday.com/2026/10/14/tiny-e-paper-display-delivers-30-fps-of-game-boy-fun/\">&#8230;read more<\/a>"}, {"title": "2026 Hackaday Supercon: Workshops are Open!", "source": "Hackaday", "date": "2026-10-14", "url": "https://hackaday.com/2026/10/14/2026-hackaday-supercon-workshops-are-open/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"450\" src=\"https://hackaday.com/wp-content/uploads/2026/09/supercon-x-initial-4k.png?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>Supercon is Hackaday&#8217;s annual gathering, and you absolutely need to be there. Today, we&#8217;re pleased to announce our lineup of workshops, and it&#8217;s more than we&#8217;ve ever offered, thanks to <a class=\"read-more\" href=\"https://hackaday.com/2026/10/14/2026-hackaday-supercon-workshops-are-open/\">&#8230;read more<\/a>"}, {"title": "DIY Force Sensing Joysticks are a Cheap Way To Go", "source": "Hackaday", "date": "2026-10-14", "url": "https://hackaday.com/2026/10/14/diy-force-sensing-joysticks-are-a-cheap-way-to-go/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"625\" src=\"https://hackaday.com/wp-content/uploads/2026/10/Force-Sensing-Joysticks-Are-Cheap-.-if-you-diy-1-51-screenshot-1-e1791945124894.png?w=625\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"625\" /><\/div>Traditional joysticks typically use potentiometers or hall effect sensors to determine the displacement of the stick itself when moved by the operator. Force-sensing joysticks are considered more desirable for certain <a class=\"read-more\" href=\"https://hackaday.com/2026/10/14/diy-force-sensing-joysticks-are-a-cheap-way-to-go/\">&#8230;read more<\/a>"}, {"title": "What’s a Nonius?", "source": "Hackaday", "date": "2026-10-14", "url": "https://hackaday.com/2026/10/14/whats-a-nonius/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"564\" src=\"https://hackaday.com/wp-content/uploads/2026/10/nunes.png?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>If you already know what a nonius is, you can probably skip this post. But, if like us, you would have to look it up, we&#8217;ll tell you what we <a class=\"read-more\" href=\"https://hackaday.com/2026/10/14/whats-a-nonius/\">&#8230;read more<\/a>"}, {"title": "Testing Oneself for AI Slop", "source": "Hackaday", "date": "2026-10-14", "url": "https://hackaday.com/2026/10/14/testing-oneself-for-ai-slop/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"484\" src=\"https://hackaday.com/wp-content/uploads/2023/03/AIcoding.jpg?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>The feed of a Hackaday writer brings many surprises, some rubbish, and the occasional diamond which of course we bring to you. Sometimes a page catches the eye that&#8217;s not <a class=\"read-more\" href=\"https://hackaday.com/2026/10/14/testing-oneself-for-ai-slop/\">&#8230;read more<\/a>"}, {"title": "Rendering 3D Prints From G-Code", "source": "Hackaday", "date": "2026-10-14", "url": "https://hackaday.com/2026/10/14/rendering-3d-prints-from-g-code/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"464\" src=\"https://hackaday.com/wp-content/uploads/2026/10/Screenshot-2026-10-14-140032.png?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>Your CAD software generally has some rudimentary tools for rending images of your parts, from simply-textured models to more photo-realistic options. However, those renders are of the geometry you created—not <a class=\"read-more\" href=\"https://hackaday.com/2026/10/14/rendering-3d-prints-from-g-code/\">&#8230;read more<\/a>"}, {"title": "Romu – A Tiny Raspberry Pi RP2354A board for USB application development (Crowdfunding)", "source": "CNX Software", "date": "2026-10-14", "url": "https://www.cnx-software.com/2026/10/14/romu-tiny-raspberry-pi-rp2354a-usb-board/", "summary": "<div><img alt=\"Romu board vs dollar coin\" class=\"attachment-medium size-medium wp-post-image\" height=\"405\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/10/Romu-board-vs-dollar-coin-720x405.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Bitmerse Romu is a tiny (15.5 x 12 mm), almost minimal Raspberry Pi RP2354A USB board with a USB 2.0 interface on one side of the PCB, and the dual Cortex-M33/RISC-V MCU on the other side, connected to a few debugging/programming pads, buttons, and an RGB LED. It doesn&#8217;t come with any GPIO, and it&#8217;s mostly designed for USB applications such as a security key for passwordless login, a USB MIDI controller, a macro pad, or a custom HID device. You can plug it directly into a spare USB Type-A port of your computer/host without any cables, breadboard, or adapters required. Romu specifications: SoC – Raspberry Pi RP2354A CPU Dual-core Arm Cortex-M33 @ 150 MHz with Arm Trustzone, Secure boot Dual-core 32-bit RISC-V Hazard3 @ 150 MHz (3-stage in-order pipeline; RV32IMAC with Zba, Zbb, Zbs, Zbkb, Zcb, Zcmp, and Zicsr extensions) Up to two cores can be used at a time, either 2x [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/10/14/romu-tiny-raspberry-pi-rp2354a-usb-board/\">Romu &#8211; A Tiny Raspberry Pi RP2354A board for USB application development (Crowdfunding)<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "VIEWE launches 4.3-inch ESP32-S31 display development board", "source": "CNX Software", "date": "2026-10-14", "url": "https://www.cnx-software.com/2026/10/14/viewe-4-3-inch-esp32-s31-display-development-board/", "summary": "<div><img alt=\"VIEWE 4.3 inch ESP32 S31 smart display with a music player interface\" class=\"attachment-medium size-medium wp-post-image\" height=\"480\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/10/VIEWE-4.3-inch-ESP32-S31-smart-display-with-a-music-player-interface-720x480.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>VIEWE has introduced the PLCM-UES31S043H800V480C-U, a 4.3-inch smart display module that appears to be the first third-party development board powered by the new ESP32-S31 MCU. The board includes a 4.3-inch display with 2.4 GHz Wi-Fi 6, Bluetooth 5.4 LE and Classic, and IEEE 802.15.4 for Zigbee and Thread. It also features USB-C and USB-A ports, a microSD card slot, RS485 and CAN interfaces, and a 20-pin GPIO expansion header with UART and I2C. The board also includes an ES8389 audio codec, two NS4150B amplifiers, two onboard microphones, four ADC buttons, a WS2812B RGB LED, and BOOT/RESET buttons. It operates on a 5V power supply and supports an operating temperature range of -20°C to +70°C. VIEWE PLCM-UES31S043H800V480C-U Specifications: Wireless module – ESP32-S31-WROOM-3-N16R16V SoC – ESP32-S31NRV16 CPU RISC-V HP (High-performance) RV32IMAFCP CPU @ 320 MHz with FPU, SIMD, etc. RISC-V LP (Low-power) MCU core Memory – 512 KB SRAM, 32 KB low-power SRAM, [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/10/14/viewe-4-3-inch-esp32-s31-display-development-board/\">VIEWE launches 4.3-inch ESP32-S31 display development board<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Microchip Unveils PCIe Gen 6 and NVMe Devices for Data Centers", "source": "Embedded.com", "date": "2026-10-14", "url": "https://www.embedded.com/microchip-unveils-pcie-gen-6-and-nvme-devices-for-data-centers/", "summary": "<p>Microchip Technology Inc. has expanded its data center portfolio with new connectivity, storage, and acceleration capabilities designed to meet the performance, security, and scalability needs of AI infrastructure. The additions include PCIe Gen 6 switching, enhanced PCIe Gen 5 NVMe SSD controllers, and updates to the Adaptec SmartRAID 4300 family of NVMe RAID storage accelerators, [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/microchip-unveils-pcie-gen-6-and-nvme-devices-for-data-centers/\">Microchip Unveils PCIe Gen 6 and NVMe Devices for Data Centers<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "Axiado, Arm Integrate AI Security into AGI CPU Servers", "source": "Embedded.com", "date": "2026-10-14", "url": "https://www.embedded.com/axiado-arm-integrate-ai-security-into-agi-cpu-servers/", "summary": "<p>Axiado Corporation has announced a collaboration with Arm to integrate its Data Center Secure Control Module (DC-SCM) cards into the Arm AGI CPU server platform. The integration combines hardware-anchored security, intelligent platform management, and AI-assisted monitoring to address the operational and security requirements of next-generation data centers designed for agentic AI workloads. The companies are [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/axiado-arm-integrate-ai-security-into-agi-cpu-servers/\">Axiado, Arm Integrate AI Security into AGI CPU Servers<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "10 years of TME Education – a decade of supporting technical education", "source": "Electronics Weekly", "date": "2026-10-14", "url": "https://www.electronicsweekly.com/certification-and-test/general-certification-and-test/10-years-of-tme-education-a-decade-of-supporting-technical-education-2-2026-10/", "summary": "<p>Learn more about TME Education &#8211; an educational project based on practical learning and collaboration with local communities.<\/p>\n<p>The post <a href=\"https://www.electronicsweekly.com/certification-and-test/general-certification-and-test/10-years-of-tme-education-a-decade-of-supporting-technical-education-2-2026-10/\">10 years of TME Education – a decade of supporting technical education<\/a> appeared first on <a href=\"https://www.electronicsweekly.com\">Electronics Weekly<\/a>.<\/p>"}, {"title": "Vishay optical sensors target battery management, energy storage", "source": "Electronics Weekly", "date": "2026-10-14", "url": "https://www.electronicsweekly.com/news/products/sensors-products/vishay-optical-sensors-target-battery-management-energy-storage-2026-10/", "summary": "<p>Vishay&#8217;s new automotive grade optical sensors address challenges in modern battery management, energy storage, and industrial automation systems. The four new devices combine an infrared (IR) emitter and PIN photodiode [&#8230;]<\/p>\n<p>The post <a href=\"https://www.electronicsweekly.com/news/products/sensors-products/vishay-optical-sensors-target-battery-management-energy-storage-2026-10/\">Vishay optical sensors target battery management, energy storage<\/a> appeared first on <a href=\"https://www.electronicsweekly.com\">Electronics Weekly<\/a>.<\/p>"}, {"title": "Datacentre? Not In My Backyard", "source": "Electronics Weekly", "date": "2026-10-14", "url": "https://www.electronicsweekly.com/blogs/mannerisms/democracy-and-standards/datacentre-not-in-ny-backyard-2026-10/", "summary": "<p>Ballotpedia has counted 35 local measures on the ballot in the US November 3 midterm elections  aimed at banning or restricting the construction of new datacentres. Ohio has 21 such [&#8230;]<\/p>\n<p>The post <a href=\"https://www.electronicsweekly.com/blogs/mannerisms/democracy-and-standards/datacentre-not-in-ny-backyard-2026-10/\">Datacentre? Not In My Backyard<\/a> appeared first on <a href=\"https://www.electronicsweekly.com\">Electronics Weekly<\/a>.<\/p>"}, {"title": "In conversation with Siemens on semiconductor test technology", "source": "Electronics Weekly", "date": "2026-10-14", "url": "https://www.electronicsweekly.com/news/design/eda-and-ip/ew-video-in-conversation-with-tessent-on-semiconductor-test-technology-2026-10/", "summary": "<p>Electronics Weekly recently caught up with Lee Harrison, Director of Product Marketing at Tessent, Siemens Digital Industries Software, to discuss the latest semiconductor test technology. Topics include silicon lifecycle management, [&#8230;]<\/p>\n<p>The post <a href=\"https://www.electronicsweekly.com/news/design/eda-and-ip/ew-video-in-conversation-with-tessent-on-semiconductor-test-technology-2026-10/\">In conversation with Siemens on semiconductor test technology<\/a> appeared first on <a href=\"https://www.electronicsweekly.com\">Electronics Weekly<\/a>.<\/p>"}, {"title": "TechPoint buys Esprit Electronics for EMS growth", "source": "Electronics Weekly", "date": "2026-10-14", "url": "https://www.electronicsweekly.com/news/business/techpoint-buys-esprit-electronics-for-ems-growth-2026-10/", "summary": "<p>TechPoint has announced it is buying Esprit Electronics, to strengthen its UK manufacturing capability and support its growth ambitions, says the company. &#8220;We’re delighted to welcome the Esprit Electronics team [&#8230;]<\/p>\n<p>The post <a href=\"https://www.electronicsweekly.com/news/business/techpoint-buys-esprit-electronics-for-ems-growth-2026-10/\">TechPoint buys Esprit Electronics for EMS growth<\/a> appeared first on <a href=\"https://www.electronicsweekly.com\">Electronics Weekly<\/a>.<\/p>"}, {"title": "Qualcomm wins Arm case – awarded $2 in damages", "source": "Electronics Weekly", "date": "2026-10-14", "url": "https://www.electronicsweekly.com/news/business/qualcomm-wins-arm-case-awarded-2-in-damages-2026-10/", "summary": "<p>The  jury in the Qualcomm vs Arm case found Arm in breach of its architectural license agreement (ALA) with Qualcomm, and awarded Qualcomm $2 in nominal damages. The jury concluded that [&#8230;]<\/p>\n<p>The post <a href=\"https://www.electronicsweekly.com/news/business/qualcomm-wins-arm-case-awarded-2-in-damages-2026-10/\">Qualcomm wins Arm case &#8211; awarded $2 in damages<\/a> appeared first on <a href=\"https://www.electronicsweekly.com\">Electronics Weekly<\/a>.<\/p>"}, {"title": "UK tech companies raise $25.7bn this year", "source": "Electronics Weekly", "date": "2026-10-14", "url": "https://www.electronicsweekly.com/news/business/uk-tech-has-raised-25-7bn-this-year-2026-10/", "summary": "<p>UK Tech companies raised $25.7 billion in the first nine months of 2026, up 88% from $13.7 billion in 9M 2025, across 816 rounds, down 17% from 984, according to [&#8230;]<\/p>\n<p>The post <a href=\"https://www.electronicsweekly.com/news/business/uk-tech-has-raised-25-7bn-this-year-2026-10/\">UK tech companies raise $25.7bn this year<\/a> appeared first on <a href=\"https://www.electronicsweekly.com\">Electronics Weekly<\/a>.<\/p>"}, {"title": "This time it’s different", "source": "Electronics Weekly", "date": "2026-10-14", "url": "https://www.electronicsweekly.com/news/business/this-time-its-different-2026-10/", "summary": "<p>The overall chip market continues to show treble-digit monthly annualised growth rates, more than twice as large as the industry’s two previous record highs in June 2000 (59.3 percent) and [&#8230;]<\/p>\n<p>The post <a href=\"https://www.electronicsweekly.com/news/business/this-time-its-different-2026-10/\">This time it’s different<\/a> appeared first on <a href=\"https://www.electronicsweekly.com\">Electronics Weekly<\/a>.<\/p>"}, {"title": "Apple bids for home electronics market", "source": "Electronics Weekly", "date": "2026-10-14", "url": "https://www.electronicsweekly.com/news/business/apple-2026-10/", "summary": "<p>Apple made a statement yesterday that it is rl": "https://blog.adafruit.com/2026/10/14/todays-guide-update-adds-dvi-audio-to-dvi-video-in-circuitpython/", "summary": "Have you wanted to add audio to your DVI video in CircuitPython? In games, programs, etc.? Now you can! In the latest bleeding edge version of CircuitPython, DVI audio has been added. Several examples show you how to implement things currently. Later updates to CircuitPython may add additional capabilities into the mix. This is to [&#8230;]"}, {"title": "Build a 10.1-inch Home Assistant panel with an ESP32-P4", "source": "Adafruit", "date": "2026-10-14", "url": "https://blog.adafruit.com/2026/10/14/build-a-10-1-inch-home-assistant-panel-with-an-esp32-p4/", "summary": "Julian Horsey at Geeky Gadgets writes up a build from Techiesms that turns an ESP32-P4 module into a wall-mounted Home Assistant control panel. The hardware is a 10.1-inch TFT LCD with a 1200&#215;800 capacitive touchscreen that handles up to five touch points. The ESP32-P4 behind it has a dual-core 400 MHz processor, 16 MB of [&#8230;]"}, {"title": "Epic Games reportedly pivoting to “AI first” game development model", "source": "Adafruit", "date": "2026-10-14", "url": "https://blog.adafruit.com/2026/10/14/epic-games-reportedly-pivoting-to-ai-first-game-development-model/", "summary": "Kyle Orland reports at Ars Technica that Epic Games is moving to an &#8220;AI first&#8221; development strategy for its collaboration with the Walt Disney Company. Citing a Bloomberg report based on internal employee messages, the story says AI models will write all the code and guide all the artwork for an upcoming shooter. Human developers [&#8230;]"}, {"title": "Improving Epinephrine Injections with a Wearable", "source": "Adafruit", "date": "2026-10-14", "url": "https://blog.adafruit.com/2026/10/14/improving-epinephrine-injections-with-a-wearable/", "summary": "Components of the wearable AI device that monitors physiological indicators for anaphylaxis and intervenes by administering an epinephrine injection. (Purdue University photo/Johana Elisa Vargas Gómez) via PPurdue University Professor Muhammad Hussain from Purdue University is leading a team of electrical and computer engineers working on developing a wearable device capable of rapid epinephrine administration. The [&#8230;]"}, {"title": "Last Minute Projects from our Halloween Gift Guide! #ElectronicHalloween", "source": "Adafruit", "date": "2026-10-14", "url": "https://blog.adafruit.com/2026/10/14/last-minute-projects-from-our-halloween-gift-guide-electronichalloween/", "summary": "Halloween is a little over two weeks away &#8211; that means you still have time to put something together! Here are a few last minute projects we pulled from the Adafruit Halloween Gift Guide! Not seeing anything you like? Browse through all the Halloween things in our Learn System! Make a simple LED Unicorn Horn [&#8230;]"}, {"title": "Open Source ESP32 Retro Smart Speaker", "source": "Adafruit", "date": "2026-10-14", "url": "https://blog.adafruit.com/2026/10/14/open-source-esp32-retro-smart-speaker/", "summary": "Mostly Builds shared this open source retro smart speaker. The custom PCB is built around an ESP32 and the radio features a 3D-printed case with a capacitive touchscreen. It supports Bluetooth, streaming internet radio and playback via a microSD card. Thanks for sharing!! I’m finally open sourcing my retro smart speaker. The firmware, KiCad files, [&#8230;]"}, {"title": "JP’s Product Pick of the Week 10/13/26 @adafruit @johnedgarpark #adafruit #newproductpick", "source": "Adafruit", "date": "2026-10-14", "url": "https://blog.adafruit.com/2026/10/14/jps-product-pick-of-the-week-10-13-26-adafruit-johnedgarpark-adafruit-newproductpick/", "summary": "This week’s pick is the Adafruit Feather RP2040 with RFM95 LoRa Radio &#8211; 915MHz &#8211; RadioFruit and STEMMA QT! Watch the video for a live demo and more. Tune in every Tuesday at 3pm ET and 12pm PT on Youtube LIVE, Twitch, Periscope (Twitter) and Facebook. LIVE TEXT CHAT IS HERE in the Adafruit Discord [&#8230;]"}, {"title": "The Python on Microcontrollers Newsletter: subscribe for free", "source": "Adafruit", "date": "2026-10-14", "url": "https://blog.adafruit.com/2026/10/14/the-python-on-microcontrollers-newsletter-subscribe-for-free-10-14-2/", "summary": "The Python for Microcontrollers Newsletter is the place for the latest news involving Python on hardware (microcontrollers AND single board computers like Raspberry Pi). This ad-free, spam-free weekly email is filled with CircuitPython, MicroPython, and Python information that you may have missed, all in one place! You get a summary of all the software, events, projects, and the latest hardware worldwide once a week, no [&#8230;]"}, {"title": "NEW PRODUCT – NeoPixel Ring – 12 x 5050 WWA with Integrated Drivers", "source": "Adafruit", "date": "2026-10-14", "url": "https://blog.adafruit.com/2026/10/14/new-product-neopixel-ring-12-x-5050-wwa-with-integrated-drivers/", "summary": "NEW PRODUCT &#8211; NeoPixel Ring &#8211; 12 x 5050 WWA with Integrated Drivers __________________________________________________________________________________________________ What is better than smart LEDs? Smart WWA LEDs! These NeoPixel rings now have 3 white LEDs in them in three tints (also known as &#8216;color temperatures&#8217;): warm white, cool white and amber, great for excellent lighting effects that want pure white [&#8230;]"}, {"title": "NEW PRODUCT – NeoPixel Ring – 16 x 5050 WWA LED with Integrated Drivers", "source": "Adafruit", "date": "2026-10-14", "url": "https://blog.adafruit.com/2026/10/14/new-product-neopixel-ring-16-x-5050-wwa-led-with-integrated-drivers/", "summary": "NEW PRODUCT &#8211; NeoPixel Ring &#8211; 16 x 5050 WWA LED with Integrated Drivers __________________________________________________________________________________________________ What is better than smart LEDs? Smart WWA LEDs! These NeoPixel rings now have 3 white LEDs in them in three tints (also k
