e": "Luxonis closes Series A round to scale physical AI perception layer", "source": "Robotics Business Review", "date": "2026-07-02", "url": "https://www.therobotreport.com/luxonis-closes-series-a-round-to-scale-physical-ai-perception-layer/", "summary": "<p>Luxonis said it plans to scale production of its OAK camera and refine its platform to support robotics and industrial automation. <\/p>\n<p>The post <a href=\"https://www.therobotreport.com/luxonis-closes-series-a-round-to-scale-physical-ai-perception-layer/\">Luxonis closes Series A round to scale physical AI perception layer<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Automate 2026 show recap", "source": "Robotics Business Review", "date": "2026-07-02", "url": "https://www.therobotreport.com/automate-2026-show-recap/", "summary": "<p>Editors Steve Crowe, Mike Oitzman, and Sarah Wynn review Automate 2026, analyzing key trends in physical AI, humanoids, and software orchestration.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/automate-2026-show-recap/\">Automate 2026 show recap<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Apptronik unveils Apollo 2 and a flagship data collection and training facility", "source": "Robotics Business Review", "date": "2026-07-01", "url": "https://www.therobotreport.com/apptronik-unveils-apollo-2-flagship-data-collection-training-facility/", "summary": "<p>Built as a data collection and training platform, Apollo 2 enables continuous learning through deployment, Apptronik said.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/apptronik-unveils-apollo-2-flagship-data-collection-training-facility/\">Apptronik unveils Apollo 2 and a flagship data collection and training facility<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Top 10 robotics developments of June 2026", "source": "Robotics Business Review", "date": "2026-07-01", "url": "https://www.therobotreport.com/top-10-robotic-stories-june-2026/", "summary": "<p>Humanoid robots made many headlines in June 2026, whether it be for companies going public, new deployments, or hitting production milestones.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/top-10-robotic-stories-june-2026/\">Top 10 robotics developments of June 2026<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "In Robotics, Ruggedization Is No Longer Optional", "source": "Robotics Business Review", "date": "2026-07-01", "url": "https://www.therobotreport.com/in-robotics-ruggedization-is-no-longer-optional/", "summary": "<p>As autonomy moves beyond controlled environments, ruggedized design is becoming a prerequisite for reliable robotic operations.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/in-robotics-ruggedization-is-no-longer-optional/\">In Robotics, Ruggedization Is No Longer Optional<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Sonair ADAR One 3D ultrasonic sensor is now safety-certified", "source": "Robotics Business Review", "date": "2026-06-30", "url": "https://www.therobotreport.com/sonair-3d-ultrasonic-sensor-is-now-safety-certified/", "summary": "<p>Sonair says ADAR One was assessed as a human detection sensor according to the IEC 61496 standard for electrosensitive protection devices.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/sonair-3d-ultrasonic-sensor-is-now-safety-certified/\">Sonair ADAR One 3D ultrasonic sensor is now safety-certified<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Queue raises funding to build fully autonomous pharmacy", "source": "Robotics Business Review", "date": "2026-06-30", "url": "https://www.therobotreport.com/queue-raises-funding-fully-autonomous-pharmacy/", "summary": "<p>Queue is developing automated pharmacies to expand access to prescriptions in hospitals, retail sites, and underserved communities.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/queue-raises-funding-fully-autonomous-pharmacy/\">Queue raises funding to build fully autonomous pharmacy<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Soft, robotic cells from morph embed physical AI into hardware", "source": "Robotics Business Review", "date": "2026-06-30", "url": "https://www.therobotreport.com/soft-robotic-cells-from-morph-embed-physical-ai-into-hardware/", "summary": "<p>morph launched a physically intelligent soft robotics platform that designs and manufactures what it calls “soft robotic cells.” <\/p>\n<p>The post <a href=\"https://www.therobotreport.com/soft-robotic-cells-from-morph-embed-physical-ai-into-hardware/\">Soft, robotic cells from morph embed physical AI into hardware<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "How Jaiveer Singh Is Helping Robots — and Developers — Move Faster", "source": "NVIDIA Robotics", "date": "2026-06-30", "url": "https://blogs.nvidia.com/blog/nvidia-life-jaiveer-singh/", "summary": "When Jaiveer Singh talks about robots, he doesn’t begin with spectacle. He begins with infrastructure: the boards inside machines, the software that lets developers see through a robot&#8217;s cameras and the engineering required before a robot can leave a demo floor to do something useful. As a robotics software engineer who leads the team behind [&#8230;]"}, {"title": "Into the Omniverse: Three Workflows for Improving Vision AI Agent Accuracy With Synthetic Data and Fine-Tuning", "source": "NVIDIA Robotics", "date": "2026-06-30", "url": "https://blogs.nvidia.com/blog/vision-ai-agent-skills-omniverse-metropolis/", "summary": "Editor’s note: This post is part of Into the Omniverse, a series focused on how developers, 3D practitioners, and enterprises can transform their workflows using the latest advances in OpenUSD and NVIDIA Omniverse. Vision AI agents are becoming a practical way to automatically turn video data from the physical world into operational intelligence in factories, [&#8230;]"}, {"title": "X Square Robot brings its valuation to $2.8B with four consecutive funding rounds", "source": "Robotics Business Review", "date": "2026-06-30", "url": "https://www.therobotreport.com/x-square-robot-brings-valuation-2-8b-four-consecutive-funding-rounds/", "summary": "<p>X Square Robots' system combines foundation models, robotics hardware, a data pipeline system, and real-world deployments.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/x-square-robot-brings-valuation-2-8b-four-consecutive-funding-rounds/\">X Square Robot brings its valuation to $2.8B with four consecutive funding rounds<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "MBody AI expands service robotics operations to eleven states and Canada", "source": "Robotics Business Review", "date": "2026-06-29", "url": "https://www.therobotreport.com/mbody-ai-expands-service-robotics-operations-eleven-states-canada/", "summary": "<p>MBody AI has deployed its hardware-agnostic Orchestrator platform to Florida and California, with a pilot in Ontario.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/mbody-ai-expands-service-robotics-operations-eleven-states-canada/\">MBody AI expands service robotics operations to eleven states and Canada<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Advantages of hypoid gearing over worm, bevel and bevel-planetary", "source": "Robotics Business Review", "date": "2026-06-29", "url": "https://www.therobotreport.com/advantages-of-hypoid-gearing-over-worm-bevel-and-bevel-planetary/", "summary": "<p>Right-angle gearing often requires engineers to compromise between torque capacity and mechanical efficiency. Hypoid gearing offers a balance of mechanical efficiency, load-carrying capability, and single-stage ratio range.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/advantages-of-hypoid-gearing-over-worm-bevel-and-bevel-planetary/\">Advantages of hypoid gearing over worm, bevel and bevel-planetary<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "BMW Group deploys Figure 03 humanoid after tests with previous version", "source": "Robotics Business Review", "date": "2026-06-29", "url": "https://www.therobotreport.com/bmw-group-deploys-figure-03-humanoid-after-tests-previous-version/", "summary": "<p>The Figure 02 robot supported the production of more than 30,000 BMW X3 vehicles over 11 months in South Carolina.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/bmw-group-deploys-figure-03-humanoid-after-tests-previous-version/\">BMW Group deploys Figure 03 humanoid after tests with previous version<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Firefly Aerospace Operates NVIDIA Jetson in Lunar Orbit for the First Time", "source": "NVIDIA Robotics", "date": "2026-06-29", "url": "https://blogs.nvidia.com/blog/firefly-aerospace-nvidia-jetson-lunar-orbit/", "summary": ""}, {"title": "Insights behind Kinisi’s acquisition by Bear Robotics", "source": "Robotics Business Review", "date": "2026-06-29", "url": "https://www.therobotreport.com/insights-behind-kinisi-acquisition-by-bear-robotics/", "summary": "<p>Brennand Pierce, founder and CEO of Kinisi Robotics, discusses the company's approach to physical AI and its acquisition by Bear Robotics.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/insights-behind-kinisi-acquisition-by-bear-robotics/\">Insights behind Kinisi’s acquisition by Bear Robotics<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "AGIBOT produces 15,000th robot, marking a milestone in embodied AI deployment", "source": "Robotics Business Review", "date": "2026-06-28", "url": "https://www.therobotreport.com/agibot-produces-15000th-robot-marking-milestone-embodied-ai-deployment/", "summary": "<p>AGIBOT has rolled out 15,000 wheeled semi-humanoid robots as it moves from embodied AI from development and production to deployment.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/agibot-produces-15000th-robot-marking-milestone-embodied-ai-deployment/\">AGIBOT produces 15,000th robot, marking a milestone in embodied AI deployment<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "We know how to build smarter robots. Now, we need to learn smarter ways to test them", "source": "Robotics Business Review", "date": "2026-06-27", "url": "https://www.therobotreport.com/we-know-how-to-build-smarter-robots-now-we-need-to-learn-smarter-ways-to-test-them/", "summary": "<p>Atharv Kolhar, a staff test automation engineer at Figure AI, says the robotics industry needs a testing philosophy that scales alongside autonomy. <\/p>\n<p>The post <a href=\"https://www.therobotreport.com/we-know-how-to-build-smarter-robots-now-we-need-to-learn-smarter-ways-to-test-them/\">We know how to build smarter robots. Now, we need to learn smarter ways to test them<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "How compact cobot integration enhances autonomous mobile robot applications", "source": "The Robot Report", "date": "2026-06-27", "url": "https://www.therobotreport.com/how-compact-cobot-integration-enhances-autonomous-mobile-robot-applications/", "summary": "<p>Cobots are quickly shaping the future of warehousing, with their use rising 10-fold from 2018 to 2025, Kassow said.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/how-compact-cobot-integration-enhances-autonomous-mobile-robot-applications/\">How compact cobot integration enhances autonomous mobile robot applications<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Orbbec shows AI-powered vision systems at Automate 2026", "source": "Robotics Business Review", "date": "2026-06-26", "url": "https://www.therobotreport.com/orbbec-shows-ai-powered-vision-systems-automate-2026/", "summary": "<p>Orbbec presented industrial-grade 3D cameras for challenging automation scenarios, as well as AI integration for enhanced robotic perception.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/orbbec-shows-ai-powered-vision-systems-automate-2026/\">Orbbec shows AI-powered vision systems at Automate 2026<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Video Friday: Give Robots a Hand", "source": "IEEE Spectrum Robotics", "date": "2026-06-26", "url": "https://spectrum.ieee.org/video-friday-robot-grippers", "summary": "<img src=\"https://spectrum.ieee.org/media-library/three-fingered-robotic-gripper-arm-crawls-upright-on-a-white-table.gif?id=67036633&amp;width=1245&amp;height=700&amp;coordinates=0%2C0%2C0%2C0\" /><br /><br /><p><span>Video Friday is your weekly selection of awesome robotics videos, collected by your friends at <\/span><em>IEEE Spectrum<\/em><span> robotics. We also post a weekly calendar of upcoming robotics events for the next few months. Please <\/span><a href=\"mailto:automaton@ieee.org?subject=Robotics%20event%20suggestion%20for%20Video%20Friday\">send us your events<\/a><span> for inclusion.<\/span><\/p><h5><a href=\"https://roboticsconference.org/\">RSS 2026<\/a>: 13–17 July 2026, SYDNEY<\/h5><h5><a href=\"https://mrs.fel.cvut.cz/summer-school-2026/\">Summer School on Multi-Robot Systems<\/a>: 29 July–4 August 2026, PRAGUE<\/h5><h5><a href=\"https://actuate.foxglove.dev/\">Actuate 2026<\/a>: 18–19 August 2026, SAN FRANCISCO<\/h5><h5><a href=\"https://2026.ieee-iros.org/\">IROS 2026<\/a>: 27 September–1 October 2026, PITTSBURGH<\/h5><p>Enjoy today’s videos!<\/p><div class=\"horizontal-rule\"><\/div><div><span style=\"display: none;\"> <\/span><\/div><p class=\"rm-anchors\" id=\"yfjuag9w2hg\">The best way of introducing a new <a href=\"https://spectrum.ieee.org/dlr-super-robust-robot-hand\" target=\"_blank\">robot hand<\/a> is to have a disembodied one crawling across a table.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.tangentrobotics.ai/\">Tangent Robotics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"auamgssnyqm\"><em>MIT CSAIL’s Improbable AI Lab Director Pulkit Agrawal explains his “SoftMimic” approach to making robots safer around humans.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://arxiv.org/abs/2510.17792\">SoftMimic<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"uskdotwb0k4\">I now have absolutely no interest in a humanoid robot for my home unless it can do this.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.pndbotics.com/\">PNDbotics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"ueon0tm0jzs\"><em>The <a href=\"https://spectrum.ieee.org/video-friday-heavy-lift-drones\" target=\"_blank\">DARPA Lift Challenge<\/a> is open to the public August 6-9, 2026, at the National Museum of the US Air Force.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.darpa.mil/research/challenges/lift\">DARPA<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"76cusj01dn8\"><em>Getting Digit to step and shuffle around an obstacle on the floor is a real test of reactive footstep planning. Digit has to spot something small and moving, recalculate where to place each foot, and keep working—all without breaking stride or losing balance. That’s the same dynamic footwork Digit uses to navigate clutter and foot traffic on a real warehouse floor.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.agilityrobotics.com/\">Agility Robotics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"9lgujrgb_kq\">This is the most aggressive <a href=\"https://spectrum.ieee.org/firefighting-robot-snake-flies-on-jets-of-water\" target=\"_blank\">firefighting robot<\/a> I’ve ever seen.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.deeprobotics.cn/en\">DEEP Robotics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"rio7kurb53o\">Wait a sec, Dusty can print things on floors besides construction layouts? How is this not in every city, making sidewalks exciting and fun everywhere?!<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.dustyrobotics.com/\">Dusty<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"mtmyfvd4zcw\">I am the first to admit that for US $4,900, the performance of the Unitree R1 is very impressive. But what is it going to do out in the world such that it will give you some sort of return on that investment?<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.unitree.com/R1\">Unitree R1<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"ij93ftr3hqe\">Event cameras are extraordinarily powerful because they can see motion, but what if everything is moving because your camera is moving? Oh no!<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://rpg.ifi.uzh.ch/\">University of Zurich Robotics & Perception Group<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"hleaklk4ixm\"><em>Can we understand whale behavior and language? Harvard SEAS Professor Stephanie Gil explains the possibility of understanding animal language and behavior using AI-driven robots and machine learning.  With ongoing whale research and advancements in artificial intelligence, the potential for animal communication with whales could become a tangible reality.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://react.seas.harvard.edu/\">Harvard SEAS<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"upxxhr8r7-a\"><em>Rodney Brooks, founder and chief technology officer of Robust.AI, sits down with Forbes Assistant Managing Editor Kerry Dolan to discuss how he came up with the idea of the Roomba vacuum cleaner and the future of robotics.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.linkedin.com/posts/rodney-brooks-1a137517_how-ants-inspired-this-founder-to-build-a-activity-7475766254587387904-ZsL9/\">LinkedIn<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"h_dtuu5jl3g\">Here are a couple of interesting presentations from UIST 2025, including everyday objects that move around your home with a mind of their own and a project featuring teamwork between helium balloons and ground robots called Buoyancé.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p class=\"shortcode-media shortcode-media-youtube\"> <span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://programs.sigchi.org/uist/2025\">UIST 2025<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div>"}, {"title": "General Intuition raises $320M to use video game data to train robots", "source": "Robotics Business Review", "date": "2026-06-26", "url": "https://www.therobotreport.com/general-intuition-raises-320m-uses-video-game-data-train-robots/", "summary": "<p>General Intuition is using video game clips with embedded action labels to speed up AI training for robotics. <\/p>\n<p>The post <a href=\"https://www.therobotreport.com/general-intuition-raises-320m-uses-video-game-data-train-robots/\">General Intuition raises $320M to use video game data to train robots<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "ARM Institute expands RoboticsCareer.org into physical AI", "source": "Robotics Business Review", "date": "2026-06-25", "url": "https://www.therobotreport.com/arm-institute-launches-physical-ai-focused-expansion-roboticscareer-org/", "summary": "<p>RoboticsCareer.org now lists the growing job opportunities in physical AI and enables employers to connect to qualified talent.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/arm-institute-launches-physical-ai-focused-expansion-roboticscareer-org/\">ARM Institute expands RoboticsCareer.org into physical AI<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Hirebotics offers no-code, explosion-proof cobot for painting", "source": "Robotics Business Review", "date": "2026-06-25", "url": "https://www.therobotreport.com/hirebotics-offers-no-code-explosion-proof-cobot-for-painting/", "summary": "<p>Hirebotics' Cobot Painter supports stationary painting, with parts placed in a paint booth where robots perform all spraying operations.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/hirebotics-offers-no-code-explosion-proof-cobot-for-painting/\">Hirebotics offers no-code, explosion-proof cobot for painting<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Robust.AI chooses Aptiv PULSE sensor for Gen 3 Carter mobile robot", "source": "Robotics Business Review", "date": "2026-06-25", "url": "https://www.therobotreport.com/robust-ai-chooses-aptiv-pulse-sensor-for-gen-3-carter-mobile-robot/", "summary": "<p>Aptiv provides sensor fusion from radar and vision using AI to enable Robust.AI's Carter robot to move safely around people.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/robust-ai-chooses-aptiv-pulse-sensor-for-gen-3-carter-mobile-robot/\">Robust.AI chooses Aptiv PULSE sensor for Gen 3 Carter mobile robot<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Deep dive into Arm’s physical AI and robotics strategies with Drew Henry", "source": "Robotics Business Review", "date": "2026-06-24", "url": "https://www.therobotreport.com/deep-dive-into-arms-physical-ai-and-robotics-strategies-with-drew-henry/", "summary": "<p>Arm EVP Drew Henry discusses the future of physical AI, robotics, and autonomous systems built for real-world constraints.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/deep-dive-into-arms-physical-ai-and-robotics-strategies-with-drew-henry/\">Deep dive into Arm&#8217;s physical AI and robotics strategies with Drew Henry<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Humanoid maker Agility Robotics to go public through SPAC merger", "source": "Robotics Business Review", "date": "2026-06-24", "url": "https://www.therobotreport.com/humanoid-maker-agility-robotics-go-public-through-spac-merger/", "summary": "<p>Agility Robotics will merge with Churchill Capital Corp XI, raising $620 million to advance Digit v5 and fulfill growing customer orders.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/humanoid-maker-agility-robotics-go-public-through-spac-merger/\">Humanoid maker Agility Robotics to go public through SPAC merger<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Mantis Robotics launches dual-arm, fenceless robot", "source": "Robotics Business Review", "date": "2026-06-24", "url": "https://www.therobotreport.com/mantis-robotics-launches-dual-arm-fenceless-robot/", "summary": "<p>Mantis said the robot allows for new flexibility in how to configure automation in complex, real-world environments.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/mantis-robotics-launches-dual-arm-fenceless-robot/\">Mantis Robotics launches dual-arm, fenceless robot<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "FAULHABER focuses on torque, noise, and power with new GPT gearheads", "source": "Robotics Business Review", "date": "2026-06-24", "url": "https://www.therobotreport.com/faulhaber-focuses-torque-noise-power-new-gpt-gearheads/", "summary": "<p>FAULHABER says its new GPT gearheads work with motors in its standard range and provide more performance with a compact design. <\/p>\n<p>The post <a href=\"https://www.therobotreport.com/faulhaber-focuses-torque-noise-power-new-gpt-gearheads/\">FAULHABER focuses on torque, noise, and power with new GPT gearheads<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Reservoir acquires Contain to scale agtech startups", "source": "Robotics Business Review", "date": "2026-06-24", "url": "https://www.therobotreport.com/reservoir-acquires-contain-to-scale-agtech-startups/", "summary": "<p>Reservoir has acquired agriculture finance platform Contain,, naming founder Nicola Kerslake general partner to help scale AI startups.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/reservoir-acquires-contain-to-scale-agtech-startups/\">Reservoir acquires Contain to scale agtech startups<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Why physical AI 2.0 needs a reality check", "source": "Robotics Business Review", "date": "2026-06-23", "url": "https://www.therobotreport.com/why-physical-ai-2-0-needs-reality-check/", "summary": "<p>While vision and language are key parts of physical AI, physical state recovery will enable robots to interact with the world, says a columnist.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/why-physical-ai-2-0-needs-reality-check/\">Why physical AI 2.0 needs a reality check<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "CreateMe partners with Avalo and Laguna Fabrics to bring resilience to apparel supply chains", "source": "Robotics Business Review", "date": "2026-06-23", "url": "https://www.therobotreport.com/createme-partners-with-avalo-and-laguna-fabrics-to-bring-resilience-to-apparel-supply-chains/", "summary": "<p>CreateMe said the partnership aims to demonstrate how apparel can be produced faster, more locally, and with greater supply chain resilience.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/createme-partners-with-avalo-and-laguna-fabrics-to-bring-resilience-to-apparel-supply-chains/\">CreateMe partners with Avalo and Laguna Fabrics to bring resilience to apparel supply chains<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Vention collaborates with FANUC and Universal Robots on software-defined automation", "source": "Robotics Business Review", "date": "2026-06-23", "url": "https://www.therobotreport.com/vention-collaborates-with-fanuc-universal-robots-software-defined-automation/", "summary": "<p>Vention is working with partners to make design and deployment of industrial and collaborative robots easier for manufacturers.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/vention-collaborates-with-fanuc-universal-robots-software-defined-automation/\">Vention collaborates with FANUC and Universal Robots on software-defined automation<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "ExRobotics launches UL-certified inspection robot for hazardous environments", "source": "Robotics Business Review", "date": "2026-06-23", "url": "https://www.therobotreport.com/exrobotics-launches-ul-certified-inspection-robot-for-hazardous-environments/", "summary": "<p>ExRobotics says its ExR-2.5 inspection robot is certified for safe operations in explosive environments in North America.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/exrobotics-launches-ul-certified-inspection-robot-for-hazardous-environments/\">ExRobotics launches UL-certified inspection robot for hazardous environments<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "NVIDIA releases Halos, a full-stack safety system for robotics", "source": "Robotics Business Review", "date": "2026-06-22", "url": "https://www.therobotreport.com/nvidia-releases-halos-a-full-stack-safety-system-for-robotics/", "summary": "<p>NVIDIA said Halos connects AI compute, system software, sensor data, safety applications, and inspection for robotic systems.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/nvidia-releases-halos-a-full-stack-safety-system-for-robotics/\">NVIDIA releases Halos, a full-stack safety system for robotics<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}], "embeddedNews": [{"title": "FLOSS Weekly Episode 876: There Is No Money Fairy", "source": "Hackaday", "date": "2026-07-22", "url": "https://hackaday.com/2026/07/22/floss-weekly-episode-876-there-is-no-money-fairy/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"484\" src=\"https://hackaday.com/wp-content/uploads/2021/06/Pipewire.jpg?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>This week Jonathan chats with Michael Meeks about Collabora! What&#8217;s the origin story in this consulting company, why do they have an outstanding office suite, and where is the world <a class=\"read-more\" href=\"https://hackaday.com/2026/07/22/floss-weekly-episode-876-there-is-no-money-fairy/\">&#8230;read more<\/a>"}, {"title": "The Need for Speed: Internet Speed Measurement (or DIY?)", "source": "Hackaday", "date": "2026-07-22", "url": "https://hackaday.com/2026/07/22/the-need-for-speed-internet-speed-measurement-or-diy/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"484\" src=\"https://hackaday.com/wp-content/uploads/2026/07/flash.png?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>Car enthusiasts want to know how quickly they can make a quarter mile. Weightlifters are forever trying to add one more plate to the bar. Internet denizens have their own <a class=\"read-more\" href=\"https://hackaday.com/2026/07/22/the-need-for-speed-internet-speed-measurement-or-diy/\">&#8230;read more<\/a>"}, {"title": "Dress Up Your YubiKey With This Web-Based Tool", "source": "Hackaday", "date": "2026-07-22", "url": "https://hackaday.com/2026/07/22/dress-up-your-yubikey-with-this-web-based-tool/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"406\" src=\"https://hackaday.com/wp-content/uploads/2026/07/yubiart_feat.png?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>The combination of hardware required to make use of this project is specific enough that we imagine only a relatively limited number of readers will actually be able to try <a class=\"read-more\" href=\"https://hackaday.com/2026/07/22/dress-up-your-yubikey-with-this-web-based-tool/\">&#8230;read more<\/a>"}, {"title": "Compile Here, Run Everywhere: Crosstool-Ng", "source": "Hackaday", "date": "2026-07-22", "url": "https://hackaday.com/2026/07/22/compile-here-run-everywhere-crosstool-ng/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"484\" src=\"https://hackaday.com/wp-content/uploads/2026/07/CrossCompiling.jpg?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>In a recent post, I mentioned that I wanted to build some tools for a stripped-down Linux running on a 3D printer with a MIPS CPU. I had two options: <a class=\"read-more\" href=\"https://hackaday.com/2026/07/22/compile-here-run-everywhere-crosstool-ng/\">&#8230;read more<\/a>"}, {"title": "Old TV Vacuum Tube Turned DIY X-Ray Machine", "source": "Hackaday", "date": "2026-07-22", "url": "https://hackaday.com/2026/07/22/old-tv-vacuum-tube-turned-diy-x-ray-machine/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"434\" src=\"https://hackaday.com/wp-content/uploads/2026/07/diyxray_feat.jpg?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>Just because you probably shouldn&#8217;t make a DIY X-ray machine, doesn&#8217;t mean nobody would. [mircemk] shows off his DIY unit, how it works, how to use it safely and of <a class=\"read-more\" href=\"https://hackaday.com/2026/07/22/old-tv-vacuum-tube-turned-diy-x-ray-machine/\">&#8230;read more<\/a>"}, {"title": "60 FPS NES Emulator on ESP32", "source": "Hackaday", "date": "2026-07-22", "url": "https://hackaday.com/2026/07/22/60-fps-nes-emulator-on-esp32/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"450\" src=\"https://hackaday.com/wp-content/uploads/2026/07/nes-esp-main.png?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>At least in theory, video games are more resistant to becoming lost media thanks to their digital nature &#8212; they&#8217;re easy to copy and emulators have saved many titles that <a class=\"read-more\" href=\"https://hackaday.com/2026/07/22/60-fps-nes-emulator-on-esp32/\">&#8230;read more<\/a>"}, {"title": "A Smarter DIY Air Filter", "source": "Hackaday", "date": "2026-07-22", "url": "https://hackaday.com/2026/07/21/a-smarter-diy-air-filter/", "summary": "<div><img alt=\"A vaguely perforated metal cylinder sits on a wooden box with a grey cylinder and LCD display atop it. There are holes in the top of the grey cylinder for air to flow through.\" class=\"attachment-large size-large wp-post-image\" height=\"600\" src=\"https://hackaday.com/wp-content/uploads/2026/07/AirSense-ESP32-Air-Purifier.png?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>As predominantly indoor creatures, it&#8217;s important to maintain a healthy habitat for the hacker. [Kishan Pratap Singh] designed a clever solution in AirSense, an ESP32-powered air filter. If you&#8217;re thinking <a class=\"read-more\" href=\"https://hackaday.com/2026/07/21/a-smarter-diy-air-filter/\">&#8230;read more<\/a>"}, {"title": "Arduino UNO Q Arcade bundle lets you build a custom retro gaming console for about $90", "source": "CNX Software", "date": "2026-07-22", "url": "https://www.cnx-software.com/2026/07/22/arduino-uno-q-arcade-bundle-lets-you-build-a-custom-retro-gaming-console/", "summary": "<div><img alt=\"Arduino UNO Q Arcade bundle\" class=\"attachment-medium size-medium wp-post-image\" height=\"478\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/07/Arduino-UNO-Q-Arcade-bundle-1-720x478.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Arduino UNO Q Arcade bundle is a kit designed to build a custom retro gaming console. The bundle combines the Arduino UNO Q 4GB SBC with a set of daisy-chainable Modulino I2C modules, allowing users to create a custom game controller without requiring complex wiring or breadboards. The kit relies on Qwiic connectors to daisy-chain the input modules, whose data is then processed by the UNO Q to emulate standard HIDs for gaming or development. The plastic parts can be 3D printed by the user. Arduino UNO Q Arcade bundle contents: Arduino UNO Q 4GB – A Qualcomm Dragonwing QRB2210 SBC with an onboard eMMC, running Debian Linux Modulino Joystick – An I2C node configurable for simulating D-pad inputs or mouse cursor movements Modulino Buttons – An I2C node for mapping single keystrokes, multi-key shortcuts, or mouse clicks Modulino Movement – A 6-axis IMU node for motion-based mouse control Note: [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/07/22/arduino-uno-q-arcade-bundle-lets-you-build-a-custom-retro-gaming-console/\">Arduino UNO Q Arcade bundle lets you build a custom retro gaming console for about $90<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "ACEMAGICIAN Kron K1 mini PC gets low-cost variant with AMD Ryzen R2544 CPU, 8GB DDR4, 256GB SSD", "source": "CNX Software", "date": "2026-07-22", "url": "https://www.cnx-software.com/2026/07/22/acemagician-kron-k1-mini-pc-gets-low-cost-variant-with-amd-ryzen-r2544-cpu-8gb-ddr4-256gb-ssd/", "summary": "<div><img alt=\"AMD Ryzen R2544 mini PC\" class=\"attachment-medium size-medium wp-post-image\" height=\"424\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/07/AMD-Ryzen-R2544-mini-PC-720x424.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Previously offered with AMD Ryzen 5/7/9 CPUs, the ACEMAGICIAN Kron K1 mini PC has now gotten a low-cost version based on the AMD Ryzen R2544 quad-core processor paired with 8GB DDR4 and a 256GB SSD and sold for just $279.99 on Amazon. With everything going up in price, companies are trying to offer more affordable systems. ACEMAGICIAN has decided to use a processor from the Ryzen Embedded R2000 family introduced in 2022 that&#8217;s typically found in industrial-grade modules and motherboards such as the AAEON COM-R2KC6 COM Express module or the Kontron D3723-R mini-ITX motherboard. ACEMAGICIAN Kron K1 R2544 specifications: SoC &#8211; AMD Ryzen Embedded R2544 CPU &#8211; Quad-core/eight-thread processor @ 3.35 / 3.7 GHz (Turbo) GPU &#8211; 8-core AMD Radeon Vega Graphics TDP &#8211; 45 Watts System Memory 8GB DDR4 RAM pre-installed Upgradeable up to 64GB via two DDR4 SO-DIMM sockets Storage 256GB M.2 SSD pre-installed 2x M.2 2280 slots: [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/07/22/acemagician-kron-k1-mini-pc-gets-low-cost-variant-with-amd-ryzen-r2544-cpu-8gb-ddr4-256gb-ssd/\">ACEMAGICIAN Kron K1 mini PC gets low-cost variant with AMD Ryzen R2544 CPU, 8GB DDR4, 256GB SSD<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Raspberry Pi Touch Display 2 – 10″ Portrait review, 3D printed VESA mount", "source": "CNX Software", "date": "2026-07-22", "url": "https://www.cnx-software.com/2026/07/22/raspberry-pi-touch-display-2-10%e2%80%b3-portrait-review-3d-printed-vesa-mount/", "summary": "<div><img alt=\"Raspberry Pi Touch 2 10 Portrait review\" class=\"attachment-medium size-medium wp-post-image\" height=\"542\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/07/Raspberry-Pi-Touch-2-10-Portrait-review-720x542.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Raspberry Pi has just announced the &#8220;Raspberry Pi Touch Display 2 – 10″ Portrait&#8221;, and we&#8217;ve received an early review sample for testing. The new 10.1-inch Raspberry Pi Touch Display 2 is a multi-touch portrait panel for Raspberry Pi designed for interactive projects such as tablets, entertainment systems, and information dashboards. The new 10.1-inch model follows the original 7-inch Raspberry Pi Touch Display 2 launched in 2024 and the 5-inch Raspberry Pi Touch Displays 2 introduced in 2025. I reviewed the 7-inch model with the Raspberry Pi AI camera and a Pi 4, and I just gave away the 5-inch variant. In this short review, I&#8217;ll show how to mount a Raspberry Pi 5 to the Raspberry Pi Touch Display 2 – 10″ Portrait, install it on a VESA mount, and test features such as 10-pin capacitive touch and display orientation. But let&#8217;s start with the specifications first. Raspberry Pi [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/07/22/raspberry-pi-touch-display-2-10%e2%80%b3-portrait-review-3d-printed-vesa-mount/\">Raspberry Pi Touch Display 2 – 10″ Portrait review, 3D printed VESA mount<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "NVIDIA increases the price of Jetson modules and devkits by up to 101%", "source": "CNX Software", "date": "2026-07-22", "url": "https://www.cnx-software.com/2026/07/22/nvidia-increases-the-price-of-jetson-modules-and-devkits-by-up-to-101/", "summary": "<div><img alt=\"NVIDIA Jetson price increase\" class=\"attachment-medium size-medium wp-post-image\" height=\"310\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/07/NVIDIA-Jetson-price-increase-720x310.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>A few months ago, NVIDIA phased out several Jetson modules due to high LPDDR4 prices, and now the company has decided to increase the prices on all its Jetson modules and developer kits by up to 101%. There was no specific announcement about the price, but the updated prices are available in the FAQ on the NVIDIA developer website. This was initially spotted by a reader at VideoCardz, and the table below shows the old and new prices, as well as the percentage increase. The table above is sortable. The highest price increases in percentage terms are for the Jetson Nano module (101% from $99 to $199) and the Jetson AGX Orin 32GB module (100% from $899 to $1,799). The Jetson Nano module is still the cheapest option, and the most powerful and expensive part is the Jetson AGX Thor Developer Kit. The popular Jetson Orin Nano Super Developer Kit, [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/07/22/nvidia-increases-the-price-of-jetson-modules-and-devkits-by-up-to-101/\">NVIDIA increases the price of Jetson modules and devkits by up to 101%<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Hybrid Microcontrollers Reshape Embedded Computing", "source": "Embedded.com", "date": "2026-07-22", "url": "https://www.embedded.com/hybrid-microcontrollers-reshape-embedded-computing/", "summary": "<p>Hybrid MCUs optimize performance and functionality by assigning workloads to the best on-chip hardware block for higher efficiency in complex designs.<\/p>\n<p>The post <a href=\"https://www.embedded.com/hybrid-microcontrollers-reshape-embedded-computing/\">Hybrid Microcontrollers Reshape Embedded Computing<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "Siemens Expands EDA Portfolio with Defacto Technologies Acquisition", "source": "Embedded.com", "date": "2026-07-22", "url": "https://www.embedded.com/siemens-expands-eda-portfolio-with-defacto-technologies-acquisition/", "summary": "<p>Siemens has signed an agreement to acquire Defacto Technologies, a privately held electronic design automation (EDA) software company specializing in automated system-on-chip (SoC) design creation at the register-transfer level (RTL). The acquisition strengthens Siemens' EDA portfolio by adding technologies that automate SoC development, improve implementation planning at earlier design stages, and enhance verification throughout the [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/siemens-expands-eda-portfolio-with-defacto-technologies-acquisition/\">Siemens Expands EDA Portfolio with Defacto Technologies Acquisition<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "Phantom Twist drone spins to near invisibility", "source": "Electronics Weekly", "date": "2026-07-22", "url": "https://www.electronicsweekly.com/blogs/gadget-master/general/phantom-twist-drone-spins-to-near-invisibility-2026-07/", "summary": "<p>Like a propeller, this new drone spins too fast for human eyes to see it clearly. But you will hear it whine! It&#8217;s the &#8220;Phantom Twist&#8221; developed by Northwestern University, [&#8230;]<\/p>\n<p>The post <a href=\"https://www.electronicsweekly.com/blogs/gadget-master/general/phantom-twist-drone-spins-to-near-invisibility-2026-07/\">Phantom Twist drone spins to near invisibility<\/a> appeared first on <a href=\"https://www.electronicsweekly.com\">Electronics Weekly<\/a>.<\/p>"}, {"title": "Redwire opens research and microgravity payload development facility", "source": "Electronics Weekly", "date": "2026-07-22", "url": "https://www.electronicsweekly.com/news/research-news/redwire-opens-research-and-microgravity-payload-development-facility-2026-07/", "summary": "<p>Redwire, the aerospace and defence company, has opened a new 30,000 square foot vertically-integrated research and microgravity payload development facility in Georgetown, Indiana. The facility, says the company, will have [&#8230;]<\/p>\n<p>The post <a href=\"https://www.electronicsweekly.com/news/research-news/redwire-opens-research-and-microgravity-payload-development-facility-2026-07/\">Redwire opens research and microgravity payload development facility<\/a> appeared first on <a href=\"https://www.electronicsweekly.com\">Electronics Weekly<\/a>.<\/p>"}, {"title": "What Is The Golden Pitch?", "source": "Electronics Weekly", "date": "2026-07-22", "url": "https://www.electronicsweekly.com/blogs/mannerisms/delusions/what-is-the-golden-pitch-2026-07/", "summary": "<p>For someone who sees AI as training software programmes on more data than before, the investment in it is mystifying to me. Like everyone, I’m enjoying the superior  search capabilities [&#8230;]<\/p>\n<p>The post <a href=\"https://www.electronicsweekly.com/blogs/mannerisms/delusions/what-is-the-golden-pitch-2026-07/\">What Is The Golden Pitch?<\/a> appeared first on <a href=\"https://www.electronicsweekly.com\">Electronics Weekly<\/a>.<\/p>"}, {"title": "UK and Space Florida sign MoU for access to US space market", "source": "Electronics Weekly", "date": "2026-07-22", "url": "https://www.electronicsweekly.com/news/business/uk-and-space-florida-sign-mou-for-access-to-us-space-market-2026-07/", "summary": "<p>The UK and Florida are partnering in an initiative to help space companies develop ideas into commercial reality: the UK Government and Space Florida have signed of a Memorandum of [&#8230;]<\/p>\n<p>The post <a href=\"https://www.electronicsweekly.com/news/business/uk-and-space-florida-sign-mou-for-access-to-us-space-market-2026-07/\">UK and Space Florida sign MoU for access to US space market<\/a> appeared first on <a href=\"https://www.electronicsweekly.com\">Electronics Weekly<\/a>.<\/p>"}, {"title": "Raspberry Pi goes big with 10-inch Touch Display 2", "source": "Electronics Weekly", "date": "2026-07-22", "url": "https://www.electronicsweekly.com/news/products/raspberry-pi-development/raspberry-pi-goes-big-screen-with-10-inch-touch-display-2-2026-07/", "summary": "<p>Raspberry Pi has expanded its range of multi-touch capacitive touch panes with a 10-inch Touch Display 2. You attach a Raspberry Pi to the rear of the display, via four [&#8230;]<\/p>\n<p>The post <a href=\"https://www.electronicsweekly.com/news/products/raspberry-pi-development/raspberry-pi-goes-big-screen-with-10-inch-touch-display-2-2026-07/\">Raspberry Pi goes big with 10-inch Touch Display 2<\/a> appeared first on <a href=\"https://www.electronicsweekly.com\">Electronics Weekly<\/a>.<\/p>"}, {"title": "Yokogawa unveils new features on its “most accurate” power analyser", "source": "Electronics Weekly", "date": "2026-07-22", "url": "https://www.electronicsweekly.com/market-sectors/power/yokogawa-unveils-new-features-on-its-most-accurate-power-analyser-2026-07/", "summary": "<p>The WT1500 high-precision power analyser is the latest addition to the company&#8217;s WT series. It is also the most accurate in the portfolio with a power accuracy of +/- 0.038% [&#8230;]<\/p>\n<p>The post <a href=\"https://www.electronicsweekly.com/market-sectors/power/yokogawa-unveils-new-features-on-its-most-accurate-power-analyser-2026-07/\">Yokogawa unveils new features on its &#8220;most accurate&#8221; power analyser<\/a> appeared first on <a href=\"https://www.electronicsweekly.com\">Electronics Weekly<\/a>.<\/p>"}, {"title": "Intel planning more lay-offs", "source": "Electronics Weekly", "date": "2026-07-22", "url": "https://www.electronicsweekly.com/news/intel-planning-more-lay-offs-2026-07/", "summary": "<p>Intel said yesterday it is planning more layoffs in its datacentre and AI group (DCG). The number of layoffs has not been stated. “As part of our broader strategy to become [&#8230;]<\/p>\n<p>The post <a href=\"https://www.electronicsweekly.com/news/intel-planning-more-lay-offs-2026-07/\">Intel planning more lay-offs<\/a> appeared first on <a href=\"https://www.electronicsweekly.com\">Electronics Weekly<\/a>.<\/p>"}, {"title": "Siemens to buy De Facto Technologies", "source": "Electronics Weekly", "date": "2026-07-22", "url": "https://www.electronicsweekly.com/news/business/sienens-to-buy-de-facto-technologies-2026-07/", "summary": "<p>Siemens is to buy Defacto Technologies, a privately held EDA software company active in the RTL design field focused on automated SoC design creation and integration. The acquisition delivers capabilities [&#8230;]<\/p>\n<p>The post <a href=\"https://www.electronicsweekly.com/news/business/sienens-to-buy-de-facto-technologies-2026-07/\">Siemens to buy De Facto Technologies<\/a> appeared first on <a href=\"https://www.electronicsweekly.com\">Electronics Weekly<\/a>.<\/p>"}, {"title": "Farnell signs Hailo", "source": "Electronics Weekly", "date": "2026-07-22", "url": "https://www.electronicsweekly.com/news/business/farnell-signs-hailo-2026-07/", "summary": "<p>Farnell is to distribute Hailo’s AI edge processors  via its global sales network, e-commerce platforms, and engineering community. “Partnering with Hailo further strengthens Farnell’s commitment to delivering leading-edge technologies that [&#8230;]<\/p>\n<p>The post <a href=\"https://www.electronicsweekly.com/news/business/farnell-signs-hailo-2026-07/\">Farnell signs Hailo<\/a> appeared first on <a href=\"https://www.electronicsweekly.com\">Electronics Weekly<\/a>.<\/p>"}, {"title": "Mouser signs Parker Chomerics", "source": "Electronics Weekly", "date": "2026-07-22", "url": "https://www.electronicsweekly.com/news/business/mouser-signs-parker-chomerics-2026-07/", "summary": "<p>Mouser has signed a global distribution agreement with Parker Chomerics, the thermal interface materials (TIMs) and EMI specialist. Parker Chomerics supplies products for heat management and signal integrity, supporting electronic [&#8230;]<\/p>\n<p>The post <a href=\"https://www.electronicsweekly.com/news/business/mouser-signs-parker-chomerics-2026-07/\">Mouser signs Parker Chomerics<\/a> appeared first on <a href=\"https://www.electronicsweekly.com\">Electronics Weekly<\/a>.<\/p>"}, {"title": "Completing a remote power sensor", "source": "Adafruit", "date": "2026-07-22", "url": "https://blog.adafruit.com/2026/07/22/completing-a-remote-power-sensor/", "summary": "Steve at smayze.com completes a solar-powered wireless sensor network for the garden shed — gateway, end node, and battery monitor, talking over XBee. It’s a long one, covering the design decisions and lessons learned, plus a technique I picked up from a KiCon 2024 talk: using KiCad to lay out control panel wiring. The original [&#8230;]"}, {"title": "NEW GUIDE ALERT: Demofruit: Demoscene for Fruit Jam", "source": "Adafruit", "date": "2026-07-22", "url": "https://blog.adafruit.com/2026/07/22/new-guide-alert-demofruit-demoscene-for-fruit-jam/", "summary": "Demofruit is a love letter to the C64/Amiga/DOS graphics and music demoscene of the 1980s and 90s, built to run on the Fruit Jam. Six classic demoscene effects have been ported using Claude Opus 4.8 to run in Arduino on the RP2350-based Fruit Jam Starfield forward-warping star field with bouncing text Plasma palette cycled summed [&#8230;]"}, {"title": "Tech note: making your own V-I plots at home", "source": "Adafruit", "date": "2026-07-22", "url": "https://blog.adafruit.com/2026/07/22/tech-note-making-your-own-v-i-plots-at-home/", "summary": "Michał Zalewski on the lcamtuf’s thing blog says when working on the book, The Secret Life of Circuits, he wanted to keep the artwork real. My beef with the diagrams in popular electronics textbooks and online tutorials is that most of them are fake. At best, they’re retraced from ancient texts; at worst, they’re sketched [&#8230;]"}, {"title": "Bidirectional BLE Communication between Raspberry Pi and Raspberry Pi Pico W", "source": "Adafruit", "date": "2026-07-22", "url": "https://blog.adafruit.com/2026/07/22/bidirecional-ble-communication-between-raspberry-pi-and-raspberry-pi-pico-w/", "summary": "Random Nerd Tutorials shows how to establish a bidirectional Bluetooth Low Energy (BLE) communication between a Raspberry Pi and a Raspberry Pi Pico. The Raspberry Pi Pico will be set as a BLE peripheral with two characteristics. The Raspberry Pi will read and write to those characteristics, establishing a bidirectional communication. For the Raspberry Pi [&#8230;]"}, {"title": "An IR NeoPixel controller dongle", "source": "Adafruit", "date": "2026-07-22", "url": "https://blog.adafruit.com/2026/07/22/an-ir-neopixel-controller-dongle/", "summary": "David Johnson-Davies on Technoblogy has designed a NeoPixel driver, controlled by an infrared remote control, that fits on a small USB dongle that plugs into a USB-C power adapter to power the LEDs. It will drive a chain of several high-power NeoPixel LEDs; for example, to provide controllable illumination in a room. The IR remote [&#8230;]"}, {"title": "Running DOOM on a custom CPU and going viral", "source": "Adafruit", "date": "2026-07-22", "url": "https://blog.adafruit.com/2026/07/22/running-doom-on-a-custom-cpu-and-going-viral/", "summary": "Doom is a video game made by id Software that released in 1993. It was a revolution in gaming that spread across the world and defined the modern FPS. Its popularity has given rise to the saying &#8220;Doom can run on anything&#8221;. To prove this point Doom has been ported to almost everything, from microcontrollers, [&#8230;]"}, {"title": "FreeInk: an open ecosystem for e-readers", "source": "Adafruit", "date": "2026-07-22", "url": "https://blog.adafruit.com/2026/07/22/freeink-an-open-ecosystem-for-e-readers/", "summary": "FreeInk is an open-source collective building the software, firmware and hardware for e-paper readers. Every layer ships in the open, so anyone can pick it up, extend it, and make it their own. Community-built, fully open-source firmware for budget e-paper readers, with more features, more control, and an open base anyone can build on. FreeInk [&#8230;]"}, {"title": "Understanding the Microstructure of Ingestive Behavior #WearableWednesday", "source": "Adafruit", "date": "2026-07-22", "url": "https://blog.adafruit.com/2026/07/22/understanding-the-microstructure-of-ingestive-behavior-wearablewednesday/", "summary": "Adeleke Justin Akinkurolere uses sensors on his wrist and jaw to collect data while chewing on a snack. via The University of Rhode Island The University of Rhode Island shares how a machine-learning-enabled wearable was developed to monitor and understand ingestive behaviors. The research team included Kathleen Melanson, URI nutrition professor; Theodore Walls, URI psychology [&#8230;]"}, {"title": "The source code for the Apollo 11 Command and Lunar Modules", "source": "Adafruit", "date": "2026-07-22", "url": "https://blog.adafruit.com/2026/07/22/the-source-code-for-the-apollo-11-command-and-lunar-modules/", "summary": "Chris Garry has posted the original Apollo 11 guidance computer (AGC) source code for Command Module (Comanche055) and Lunar Module (Luminary099). Digitized by the folks at Virtual AGC and MIT Museum. The goal is to be a repo for the original Apollo 11 source code. As such, PRs are welcome for any issues identified between the transcriptions in [&#8230;]"}, {"title": "A secure USB drive that hides itself", "source": "Adafruit", "date": "2026-07-22", "url": "https://blog.adafruit.com/2026/07/22/a-secure-usb-drive-that-hides-itself/", "summary": "Ryan Walker created Phantomdrive as many places don’t respect privacy laws &#8211; in certain situations you may be forced to unencrypt your media, or worse, assumed to be guilty. A Veracrypt hidden volume is useful in the former situation, but not the latter. Phantomdrive is a completely open source USB drive that appears as an 8 GB [&#8230;]"}, {"title": "Modding the Unicomp Mini M keyboard with CircuitPython", "source": "Adafruit", "date": "2026-07-22", "url": "https://blog.adafruit.com/2026/07/22/modding-the-unicomp-mini-m-keyboard-with-circuitpython/", "summary": "Unicomp is the heir to the IBM Buckling Spring legacy. This style of keyboard has a distinctive sound &#38; feel which some people just can&#8217;t get enough of. Jeff epler one of them, having used a crusty old Model M for at least a decade at work. Their &#8220;Mini M&#8221; is an 87-key (&#8220;tenkeyless&#8221;) layout, [&#8230;]"}, {"title": "A Linux utility to control USB power per-port on smart USB hubs", "source": "Adafruit", "date": "2026-07-22", "url": "https://blog.adafruit.com/2026/07/22/a-utility-to-control-usb-power-per-port-on-smart-usb-hubs/", "summary": "uhubctl is Linux utility to control USB power per-port on smart USB hubs. Smart hub is defined as one that implements per-port power switching. According to USB 2.0 specification, USB hubs can advertise no power switching, ganged (all ports at once) power switching or per-port (individual) power switching. Note that by default uhubctl will only detect USB [&#8230;]"}, {"title": "Avalue RIVAR-1539 is a 15.6-inch fanless industrial panel PC powered by an Intel N150 Twin Lake processor", "source": "CNX Software", "date": "2026-07-21", "url": "https://www.cnx-software.com/2026/07/21/avalue-rivar-1539-is-a-15-6-inch-fanless-industrial-panel-pc-powered-by-an-intel-n150-twin-lake-processor/", "summary": "<div><img alt=\"Intel N150 Industrial Panel PC\" class=\"attachment-medium size-medium wp-post-image\" height=\"554\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/07/Intel-N150-Industrial-Panel-PC-720x554.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Avalue Technology has introduced the RIVAR-1539, a 15.6-inch industrial fanless panel PC powered by the Intel N150 quad-core Twin Lake processor. The system features a Full HD projected capacitive touch display, dual Gigabit Ethernet, four USB 3.0 ports, and an IP65-rated front panel. The all-in-one POS terminal is designed for edge computing and HMI applications, such as self-ordering kiosks, smart counters, digital signage, and queue management systems across retail, healthcare, and public service environments. Avalue RIVAR-1539 specifications: SoC – Intel Processor N150 quad-core processor @ 800 MHz / 3.6 GHz (Turbo) with 6MB cache, 24EU Intel UHD graphics @ 1.0 GHz; TDP: 6W Memory – 8GB LPDDR5 Storage – 128GB eMMC flash Display &#8211;  15.6-inch Full HD (1920 x 1080) LED display Luminance – 350 cd/m² Contrast ratio – 1500:1 Viewing angle – 89° (U/D/L/R) Response time – 25ms 10-point projected capacitive multi-touch with USB interface controller Video Output &#8211; HDMI [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/07/21/avalue-rivar-1539-is-a-15-6-inch-fanless-industrial-panel-pc-powered-by-an-intel-n150-twin-lake-processor/\">Avalue RIVAR-1539 is a 15.6-inch fanless industrial panel PC powered by an Intel N150 Twin Lake processor<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "ART-Pi II development board features 600 MHz STM32H7R7 Cortex-M7 MCU with NeoChrom GPU", "source": "CNX Software", "date": "2026-07-21", "url": "https://www.cnx-software.com/2026/07/21/art-pi-ii-development-board-features-600-mhz-stm32h7r7-cortex-m7-mcu-with-neochrom-gpu/", "summary": "<div><img alt=\"STM32H7R7 development board\" class=\"attachment-medium size-medium wp-post-image\" height=\"405\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/07/STM32H7R7-development-board-720x405.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>The 600 MHz STM32H7R/S Cortex-M7 microcontroller family with an optional NeoChrom  2.5D GPU and up to 640 KB SRAM and 64 KB flash was introduced in 2024. However, apart from ST&#8217;s own development boards such as the NUCLEO-H7S3L8 and STM32H7S78-DK, we hadn&#8217;t seen any boards based on it. The ART-Pi II development board changes that. It&#8217;s a compact board powered by an STM32H7R7L8H microcontroller paired with 32 MB HyperRAM and 64 MB HyperFlash, and featuring a microSD card slot, an RGB LCD connector, WiFi 4 and Bluetooth 5.1 connectivity, two USB-C ports (OTG and Debug), a 40-pin Raspberry Pi-compatible GPIO header, a 28-pin GPIO header, two Qwiic connectors, and an on-board debugger. ART-Pi II board specifications: MCU &#8211; STMicro STM32H7R7L8H CPU core &#8211; Arm Cortex-M7 @ up to 600 MHz GPU &#8211; NeoChrom 2.5D GPU Memory &#8211; 64 KB flash Storage &#8211;  620 KB SRAM Package &#8211; TFBGA225 Memory &#8211; [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/07/21/art-pi-ii-development-board-features-600-mhz-stm32h7r7-cortex-m7-mcu-with-neochrom-gpu/\">ART-Pi II development board features 600 MHz STM32H7R7 Cortex-M7 MCU with NeoChrom GPU<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "nRF54L Arduino Core project brings Arduino support to Nordic Semi nRF54L wireless SoCs", "source": "CNX Software", "date": "2026-07-21", "url": "https://www.cnx-software.com/2026/07/21/nrf54l-arduino-core-project-brings-arduino-support-to-nordic-semi-nrf54l-wireless-socs/", "summary": "<div><img alt=\"nRF54L Arduino Core\" class=\"attachment-medium size-medium wp-post-image\" height=\"341\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/07/nRF54L-Arduino-Core-720x341.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>nRF54L Arduino Core is an open-source project designed to bring Arduino support for Nordic Semiconductor nRF54L wireless SoCs, starting with Seeed Studio&#8217;s XIAO nRF54L15 (Sense) and XIAO nRF54LM20A (Sense) boards, as well as compatible Holyiot nRF54L15 modules. Since the launch of the nRF52840-based Arduino Nano 33 BLE  board in 2019, Nordic nRF52 wireless microcontrollers have been officially supported by the Arduino IDE. However, it&#8217;s not quite the case for the newer nRF54L Cortex-M33 microcontrollers. Lolren has decided to change that with the unofficial nRF54 Arduino core project. nRF54L Arduino Core highlights: Dual-core access &#8211; Use the 128 MHz Cortex-M33 application CPU and the VPR RISC-V coprocessor without adopting a vendor RTOS Wireless Bluetooth LE support &#8211; Peripheral, central, dual-role, GATT server/client, HID, BLE UART, PHY/DLE/MTU control, LE Secure Connections, bonding, OOB, Numeric Comparison, privacy/RPA, and CSRK signed writes Experimental support for Zigbee &#8211; Partial stack and device demonstrations; incomplete Zigbee [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/07/21/nrf54l-arduino-core-project-brings-arduino-support-to-nordic-semi-nrf54l-wireless-socs/\">nRF54L Arduino Core project brings Arduino support to Nordic Semi nRF54L wireless SoCs<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "NXP Unveils Single-Chip Automotive Audio and Radio Processor", "source": "Embedded.com", "date": "2026-07-21", "url": "https://www.embedded.com/nxp-unveils-single-chip-automotive-audio-and-radio-processor/", "summary": "<p>NXP Semiconductors has expanded its automotive infotainment product portfolio with the launch of the SAF9800 automotive audio and radio processor. Designed to simplify infotainment architectures, the SAF9800 integrates an analog radio (AM and FM) and AI/ML-enabled audio processing into a flexible single-chip solution. This innovative approach for analog radio reception and audio processing integrates functionality [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/nxp-unveils-single-chip-automotive-audio-and-radio-processor/\">NXP Unveils Single-Chip Automotive Audio and Radio Processor<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "Pros and Cons of MCU Hardware and Software Peripherals", "source": "Embedded.com", "date": "2026-07-21", "url": "https://www.embedded.com/pros-and-cons-of-mcu-hardware-and-software-peripherals/", "summary": "<p>How do you tell time? You might glance at a watch or look up at a clock. But for a microcontroller (MCU), it's not that simple. MCUs are integrated circuits that contain core independent peripherals, or CIPs. CIPs are specialized hardware circuits designed to perform a task with little to no CPU intervention. Every manufacturer [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/pros-and-cons-of-mcu-hardware-and-software-peripherals/\">Pros and Cons of MCU Hardware and Software Peripherals<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "OMRON Advances Inspection Technology with NVIDIA Omniverse and Metropolis", "source": "EE Journal", "date": "2026-07-21", "url": "https://www.eejournal.com/industry_news/omron-advances-inspection-technology-with-nvidia-omniverse-and-metropolis/", "summary": "OMRON Corporation (HQ: Shimogyo-ku, Kyoto. President and CEO: Junta Tsujinaga) Industrial Automation Company announced in Japan an expansion of its integration of NVIDIA technologies by combining OMRON&#8217;s Automated Optical Inspection (AOI) and 3D-CT X-ray Inspection (AXI) with NVIDIA Omniverse libraries. Specifically, this will make it possible to visualize substrate warpage caused by heat and to &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/omron-advances-inspection-technology-with-nvidia-omniverse-and-metropolis/\">Read More &#8594;<span class=\"screen-reader-text\"> \"OMRON Advances Inspection Technology with NVIDIA Omniverse and Metropolis\"<\/span><\/a>"}, {"title": "Compact 35W to 350W AC-DC power supplies improve system reliability in demanding industrial applications", "source": "EE Journal", "date": "2026-07-21", "url": "https://www.eejournal.com/industry_news/compact-35w-to-350w-ac-dc-power-supplies-improve-system-reliability-in-demanding-industrial-applications/", "summary": "XP Power announces the introduction of the LBA series of low-profile enclosed, chassis-mount, single-output AC-DC power supplies, covering power levels from 35W to 350W. Designed for cost-sensitive industrial technology applications, the series provides a versatile, reliable, and easy-to-integrate platform for engineers developing industrial automation, security and surveillance systems, lighting control, smart home and building control equipment. The &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/compact-35w-to-350w-ac-dc-power-supplies-improve-system-reliability-in-demanding-industrial-applications/\">Read More &#8594;<span class=\"screen-reader-text\"> \"Compact 35W to 350W AC-DC power supplies improve system reliability in demanding industrial applications\"<\/span><\/a>"}, {"title": "The versatile MIL-C-55302 PCB and cable connectors from Incon can be sourced through Powell Electronics", "source": "EE Journal", "date": "2026-07-21", "url": "https://www.eejournal.com/industry_news/the-versatile-mil-c-55302-pcb-and-cable-connectors-from-incon-can-be-sourced-through-powell-electronics/", "summary": "Powell Electronics, the supplier of connectors and more for high-rel applications including defence, aerospace and industrial, offers the complete line of Incon MIL-C-55302 printed circuit board and cable connectors. Qualified to the Defense Supply Center Columbus (DSCC) Qualified Products List (QPL), the connector family provides proven interconnect solutions for military, aerospace, industrial, and other mission-critical &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/the-versatile-mil-c-55302-pcb-and-cable-connectors-from-incon-can-be-sourced-through-powell-electronics/\">Read More &#8594;<span class=\"screen-reader-text\"> \"The versatile MIL-C-55302 PCB and cable connectors from Incon can be sourced through Powell Electronics\"<\/span><\/a>"}, {"title": "It’s RAINing RFID", "source": "EE Journal", "date": "2026-07-21", "url": "https://www.eejournal.com/article/its-raining-rfid/", "summary": "<img alt=\"\" class=\"webfeedsFeaturedVisual wp-post-image\" height=\"300\" src=\"https://www.eejournal.com/wp-content/uploads/2026/07/max-0502-image-for-home-page-impinj-300x300.jpg\" style=\"display: block; margin-bottom: 5px; clear: both;\" width=\"300\" />I must admit that I was tempted to title this column “It’s RAINing RFID! Hallelujah!” But then I thought you&#8217;d probably spend the rest of the day with the Weather Girls song rattling around in your head, so I decided against it. You&#8217;re welcome. I flatter myself that I know as much about RFID (Radio-Frequency &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/article/its-raining-rfid/\">Read More &#8594;<span class=\"screen-reader-text\"> \"It’s RAINing RFID\"<\/span><\/a>"}, {"title": "Globalscale Case8 – A MediaTek Genio 520/720 cyberdeck for gaming, home automation, and education (Crowdfunding)", "source": "CNX Software", "date": "2026-07-20", "url": "https://www.cnx-software.com/2026/07/20/globalscale-case8-mediatek-genio-520-720-cyberdeck-for-gaming-home-automation-and-education/", "summary": "<div><img alt=\"Case8 Platfrom with gaming, home automation, and education variants\" class=\"attachment-medium size-medium wp-post-image\" height=\"480\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/07/Case8-Platfrom-with-gaming-home-automation-and-education-variants-720x480.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Globalscale Technologies has launched the Case8 series of open-source cyberdeck-style computing platforms based on MediaTek Genio 520 and Genio 720 processors. The platform is offered in hacker (PCBA only), gaming, home automation, and education variants. The Case8 is built around an OSM-L compute module with a MediaTek Genio 520 or Genio 720 SoC with up to eight cores, a Mali-G67 GPU, and a 10 TOPS NPU. Depending on the configuration, it comes with 4GB, 8GB, or 16GB LPDDR5 memory and 64GB or 128GB UFS storage, along with Gigabit Ethernet, Wi-Fi 6, Bluetooth 5.4, stereo speakers, microphones, and optional 4G/5G connectivity. Display options include a 5-inch panel for the gaming model and 7-inch touch or non-touch displays for the home automation and education variants, with camera configurations varying by model. Case8 cyberdeck platform specifications: OSM-L compute module (one or the other) MediaTek Genio 520 CPU – 2x Cortex-A78 up to 2.2GHz,  6x [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/07/20/globalscale-case8-mediatek-genio-520-720-cyberdeck-for-gaming-home-automation-and-education/\">Globalscale Case8 &#8211; A MediaTek Genio 520/720 cyberdeck for gaming, home automation, and education (Crowdfunding)<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Geniatech XPI-3576-CM5 – A Raspberry Pi CM5-compatible Rockchip RK3576 AI Compute Module with WiFi 6, Bluetooth 5.3", "source": "CNX Software", "date": "2026-07-20", "url": "https://www.cnx-software.com/2026/07/20/geniatech-xpi-3576-cm5-a-raspberry-pi-cm5-compatible-rockchip-rk3576-ai-compute-module-with-wifi-6-bluetooth-5-3/", "summary": "<div><img alt=\"Geniatech XPI-3576-CM5\" class=\"attachment-medium size-medium wp-post-image\" height=\"521\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/07/Geniatech-XPI-3576-CM5-720x521.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Geniatech XPI-3576-CM5 is a Rockchip RK3576 octa-core Arm Cortex-A72/A53 system-on-module based on the Raspberry Pi CM4/CM5 form factor with up to 16GB LPDDR5 and 128GB eMMC flash. The module also features a RealTek RTL8211F Gigabit Ethernet controller, an Ampak AP6275S wireless module for dual-band WiFi 6 and Bluetooth 5.3 connectivity, and a Rockchip RK806S-5 PMIC for power management. It features two 100-pin B2B connectors, allowing it to be plugged into carrier boards designed for the Raspberry Pi CM4/CM5, with some limitations as we&#8217;ll see further below. Geniatech XPI-3576-CM5 specifications SoC – Rockchip RK3576 Octa-core CPU – 4x Cortex-A72 cores at 2.2GHz, 4x Cortex-A53 cores at 1.8GHz GPU – Arm Mali-G52 MC3 GPU at 1 GHz with support for OpenGL ES 3.2, OpenCL 2.0, and Vulkan 1.1 NPU – 6 TOPS (INT8) AI accelerator with support for INT4/INT8/INT16/BF16/TF32 mixed operations. VPU Video Decoder – H.264, H.265, VP9, AV1, and AVS2 up to [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/07/20/geniatech-xpi-3576-cm5-a-raspberry-pi-cm5-compatible-rockchip-rk3576-ai-compute-module-with-wifi-6-bluetooth-5-3/\">Geniatech XPI-3576-CM5 &#8211; A Raspberry Pi CM5-compatible Rockchip RK3576 AI Compute Module with WiFi 6, Bluetooth 5.3<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "IoTextra modular automation boards with 4 inputs, 4 outputs work with Raspberry Pi and ESP32 MCU boards", "source": "CNX Software", "date": "2026-07-20", "url": "https://www.cnx-software.com/2026/07/20/iotextra-modular-automation-boards-with-4-inputs-4-outputs-work-with-raspberry-pi-and-esp32-mcu-boards/", "summary": "<div><img alt=\"IoTsmart IoTextra modular automation boards\" class=\"attachment-medium size-medium wp-post-image\" height=\"417\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/07/IoTsmart-IoTextra-modular-automation-boards-720x417.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Last week, we wrote about the Olimex PICO-EVB automation board equipped with four relays and four isolated inputs and designed for Raspberry Pi Pico-compatible boards. Make Things Happy does something similar, but in a modular way, with the IoTextra family of carrier boards with four inputs and four outputs for automation, and supporting a range of IoTsmart MCU boards based on Raspberry Pi RP2350, ESP32-S3, etc&#8230; There are currently six IoTextra boards shipping or in development, all measuring 56&#215;47 mm and featuring 3750 Vrms galvanic isolation per channel. All IoTextra modules support different MCU platforms via horizontally or vertically mounted IoTsmart SoM carriers based on Waveshare RP2350 and ESP32-S3 modules, Seeed Studio XIAO boards, and others, all connected via the HOST connector. All IoTextra 8-channel modules support several software ecosystems out of the box: IoTflow framework for no-code programming of distributed MCU nodes over MQTT and Node-RED; used to build custom [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/07/20/iotextra-modular-automation-boards-with-4-inputs-4-outputs-work-with-raspberry-pi-and-esp32-mcu-boards/\">IoTextra modular automation boards with 4 inputs, 4 outputs work with Raspberry Pi and ESP32 MCU boards<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Efinix Titanium Edge FPGA family targets low-power edge AI and vision systems", "source": "CNX Software", "date": "2026-07-20", "url": "https://www.cnx-software.com/2026/07/20/efinix-titanium-edge-fpga-family-targets-low-power-edge-ai-and-vision-systems/", "summary": "<div><img alt=\"Efinix Titanium Edge Ti125 FPGA\" class=\"attachment-medium size-medium wp-post-image\" height=\"418\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/07/Efinix-Titanium-Edge-Ti125-FPGA-720x418.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Efinix has introduced the Titanium Edge FPGA family designed for low-power edge AI and machine vision applications. Based on the company&#8217;s Titanium FPGA architecture, the new family introduces lower static power consumption, configurable 2.5 Gbps MIPI I/O, built-in single-event upset (SEU) correction, and System-in-Package (SiP) variants that integrate SPI flash and HyperRAM for compact systems. The initial Titanium Edge FPGA family includes the Ti125, Ti40, Ti70, and Ti95 devices, with approximately 39K to 123K logic elements for embedded AI, machine vision, robotics, medical systems, and various other applications. Compared to the high-end Titanium Ti375 and the cost-efficient Topaz FPGA family, the new devices are designed to have about 50% lower static power consumption while retaining the company&#8217;s Quantum architecture. Efinix Titanium Edge Ti125 and Ti125 SiP specifications: FPGA Fabric Efinix Quantum architecture Up to 122,792 logic elements (109,440 XLR cells) 288 DSP blocks Embedded Memory – 5.9 Mbit SRAM Memory – [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/07/20/efinix-titanium-edge-fpga-family-targets-low-power-edge-ai-and-vision-systems/\">Efinix Titanium Edge FPGA family targets low-power edge AI and vision systems<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Ultralytics Optimizes YOLO26 for Intel OpenVINO", "source": "Embedded.com", "date": "2026-07-20", "url": "https://www.embedded.com/ultralytics-optimizes-yolo26-for-intel-openvino/", "summary": "<p>The optimized YOLO26 models enable faster, lower-latency computer vision on Intel processors using the OpenVINO toolkit.<\/p>\n<p>The post <a href=\"https://www.embedded.com/ultralytics-optimizes-yolo26-for-intel-openvino/\">Ultralytics Optimizes YOLO26 for Intel OpenVINO<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "Partnership Advances Agentic AI for SoC Design", "source": "Embedded.com", "date": "2026-07-20", "url": "https://www.embedded.com/partnership-advances-agentic-ai-for-soc-design/", "summary": "<p>Rapidus Corp. and Cadence Design Systems Inc. have announced a partnership to advance agentic AI for advanced-node system-on-chip (SoC) design. By integrating the Cadence InnoStack AI Super Agent into the Rapidus AI-Agentic Design Solution (Raads), Rapidus expects up to a 2× improvement in design turnaround time over traditional workflows. The combination of Rapidus' AI-native design [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/partnership-advances-agentic-ai-for-soc-design/\">Partnership Advances Agentic AI for SoC Design<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "element14 Community in
