;\" width=\"720\" /><\/div>\n<p>Waveshare ESP32-C5-Touch-LCD-3.5 is another ESP32-C5 devkit with a built-in display, but equipped with a larger 3.5-inch color touch LCD and an optional BF3901 low-resolution (0.08 MP) camera and/or a 500 mAh battery. It also features a speaker connector and a built-in microphone for voice interaction, a 6-axis IMU  and a temperature and humidity sensor, a microSD card slot for additional storage, and a 32-pin GPIO connector for expansion. ESP32-C5-Touch-LCD-3.5 specifications: Wireless module – Espressif Systems ESP32-C5-WROOM-1U-N32R8 SoC – ESP32-C5HR8 CPU Single-core 32-bit RISC-V processor @ up to 240 MHz Low-power RISC-V core @ 40 MHz acting as the main processor for power-sensitive applications Memory – 384 KB SRAM on-chip, 8MB PSRAM Storage – 320 KB ROM Wireless Connectivity Dual-band (2.4GHz/5 GHz) 802.11ax WiFi 6, with 802.11b/g/n WiFi 4 standard fallback Bluetooth 5.0 Low Energy (LE) 802.15.4 radio for Zigbee 3.0 and Thread 1.3 Storage – 32MB flash Antenna – IPEX [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/09/30/esp32-c5-devkit-features-3-5-inch-touch-lcd-optional-camera-and-battery/\">ESP32-C5 devkit features 3.5-inch touch LCD, optional camera and battery<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Efinix Adds 64-Bit RISC-V SoC with Linux and DDR Support", "source": "Embedded.com", "date": "2026-09-30", "url": "https://www.embedded.com/efinix-adds-64-bit-risc-v-soc-with-linux-and-ddr-support/", "summary": "<p>Efinix Inc. has introduced the Sapphire RV64 SoC, a 64-bit RISC-V processor core designed to extend the company's embedded processing capabilities beyond its existing 32-bit Sapphire RV32 architecture. The new SoC targets FPGA-based applications that need greater processing performance, larger addressable memory, expanded I/O, and Linux support, while retaining the configurability and low-power characteristics of [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/efinix-adds-64-bit-risc-v-soc-with-linux-and-ddr-support/\">Efinix Adds 64-Bit RISC-V SoC with Linux and DDR Support<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "EU Cyber Resilience Act: Evidence Matters", "source": "Embedded.com", "date": "2026-09-30", "url": "https://www.embedded.com/eu-cyber-resilience-act-evidence-matters/", "summary": "<p>The device rebooted and the evidence disappeared. Now what?<\/p>\n<p>The post <a href=\"https://www.embedded.com/eu-cyber-resilience-act-evidence-matters/\">EU Cyber Resilience Act: Evidence Matters<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "ESP-SDR uses undocumented raw I/Q capture of ESP32 to make software defined radios", "source": "Adafruit", "date": "2026-09-30", "url": "https://blog.adafruit.com/2026/09/30/esp-sdr-uses-undocumented-raw-i-q-capture-of-esp32-to-make-software-defined-radios/", "summary": "ESPARGOS&#8217; Florian Euchner has published ESP-SDR on GitHub, firmware that turns the ESP32&#8217;s built-in 2.4 GHz Wi-Fi radio into a software defined radio (SDR). It captures raw I/Q samples from the receiver, so the spectrum can be viewed and signals studied beyond ordinary WiFi packets. No separate SDR hardware is required. The ESP32-C5 can also [&#8230;]"}, {"title": "DIY AI voice assistant with ESP32 and animated OLED eyes", "source": "Adafruit", "date": "2026-09-30", "url": "https://blog.adafruit.com/2026/09/30/diy-ai-voice-assistant-with-esp32-and-animated-oled-eyes/", "summary": "oeadmin at Open Electronics covers a voice assistant project by jayesh_nawani that runs entirely on an ESP32. An I2S microphone picks up speech, the clip is packaged as a WAV file and sent to the OpenAI Whisper API for transcription. GPT writes a reply and the TTS audio streams back out through a MAX98357A amplifier [&#8230;]"}, {"title": "Synopsys Powers Autonomous Engineering with a Broad Portfolio of Long-Horizon Agents and Autopilot Platform", "source": "EE Journal", "date": "2026-09-30", "url": "https://www.eejournal.com/industry_news/synopsys-powers-autonomous-engineering-with-a-broad-portfolio-of-long-horizon-agents-and-autopilot-platform/", "summary": "Synopsys, Inc. (Nasdaq: SNPS) today announced Synopsys AgentEngineer™ solutions, the industry&#8217;s broadest portfolio of domain-specific long-horizon agents that can reason, plan, and execute complete engineering workflows from silicon to systems across verification, system validation, implementation, analog, manufacturing, and simulation and analysis domains. Built on the Synopsys Autopilot™ Platform, a comprehensive, open, and secure foundation for autonomous engineering, &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/synopsys-powers-autonomous-engineering-with-a-broad-portfolio-of-long-horizon-agents-and-autopilot-platform/\">Read More &#8594;<span class=\"screen-reader-text\"> \"Synopsys Powers Autonomous Engineering with a Broad Portfolio of Long-Horizon Agents and Autopilot Platform\"<\/span><\/a>"}, {"title": "Gigaphoton Begins Evaluation of L300KZ Excimer Laser for Pulsed Laser Deposition  ﻿for Advanced Materials Applications", "source": "EE Journal", "date": "2026-09-30", "url": "https://www.eejournal.com/industry_news/gigaphoton-begins-evaluation-of-l300kz-excimer-laser-for-pulsed-laser-deposition-for-advanced-materials-applications/", "summary": "Gigaphoton Inc. (Head Office: Oyama, Tochigi; President and CEO: Tatsuo Enami), a manufacturer of lightsources for leading-edge semiconductor fabrication processes, today announced that it has installed its L300KZ KrF excimer laser for pulsed laser deposition (PLD) at a domestic manufacturer of high-temperature superconducting wire on September 25, 2026. Developed under Goal 10 of Japan’s Moonshot &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/gigaphoton-begins-evaluation-of-l300kz-excimer-laser-for-pulsed-laser-deposition-for-advanced-materials-applications/\">Read More &#8594;<span class=\"screen-reader-text\"> \"Gigaphoton Begins Evaluation of L300KZ Excimer Laser for Pulsed Laser Deposition  ﻿for Advanced Materials Applications\"<\/span><\/a>"}, {"title": "Innodisk Launches DDR5 8000 RDIMM for Edge AI and High-Performance Computing", "source": "EE Journal", "date": "2026-09-30", "url": "https://www.eejournal.com/industry_news/innodisk-launches-ddr5-8000-rdimm-for-edge-ai-and-high-performance-computing/", "summary": "Innodisk, a leading global AI solution provider, today announced the launch of its new industrial-grade DDR5 8000 RDIMM, expanding its DDR5 portfolio for compute-intensive applications such as edge AI and enterprise servers. Delivering industry-leading data transfer speeds of 8000 MT/s, 11.1% higher than the previous generation, the module addresses growing memory bandwidth requirements while enhancing &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/innodisk-launches-ddr5-8000-rdimm-for-edge-ai-and-high-performance-computing/\">Read More &#8594;<span class=\"screen-reader-text\"> \"Innodisk Launches DDR5 8000 RDIMM for Edge AI and High-Performance Computing\"<\/span><\/a>"}, {"title": "Renesas Introduces Smallest Configurable GreenPAK IC with Multi-Time Programmability in Ultra-Compact WLCSP and STQFN Packages", "source": "EE Journal", "date": "2026-09-30", "url": "https://www.eejournal.com/industry_news/renesas-introduces-smallest-configurable-greenpak-ic-with-multi-time-programmability-in-ultra-compact-wlcsp-and-stqfn-packages/", "summary": "The industry&#8217;s smallest WLCSP-packaged GreenPAK device, featuring a 9-ball, 1.155 mm × 1.155 mm, with an STQFN option for additional I/O and package flexibility. Multi-time programmable and target I²C enable in-system bug fixes, updates and configuration changes after deployment Full 1.71 V to 5.5 V operating and configurable range supports versatile, low-cost sensing, control and &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/renesas-introduces-smallest-configurable-greenpak-ic-with-multi-time-programmability-in-ultra-compact-wlcsp-and-stqfn-packages/\">Read More &#8594;<span class=\"screen-reader-text\"> \"Renesas Introduces Smallest Configurable GreenPAK IC with Multi-Time Programmability in Ultra-Compact WLCSP and STQFN Packages\"<\/span><\/a>"}, {"title": "ZincFive Expands Nickel-Zinc Technology into In-Rack Backup and AI Dynamic Power Solutions", "source": "EE Journal", "date": "2026-09-30", "url": "https://www.eejournal.com/industry_news/zincfive-expands-nickel-zinc-technology-into-in-rack-backup-and-ai-dynamic-power-solutions/", "summary": "ZincFive®, the leader in nickel-zinc (NiZn) battery-based solutions for immediate power applications, today announced its expansion into in-rack energy storage with the development of Battery Backup Unit (BBU) and AI Dynamic Power Module (DPM) solutions designed to address the evolving energy storage requirements of AI data centers. As AI drives higher rack power densities and increasingly &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/zincfive-expands-nickel-zinc-technology-into-in-rack-backup-and-ai-dynamic-power-solutions/\">Read More &#8594;<span class=\"screen-reader-text\"> \"ZincFive Expands Nickel-Zinc Technology into In-Rack Backup and AI Dynamic Power Solutions\"<\/span><\/a>"}, {"title": "NXP FRDM-IMXRT1186 development board features i.MX RT1186 crossover MCU, four Ethernet ports", "source": "CNX Software", "date": "2026-09-29", "url": "https://www.cnx-software.com/2026/09/29/nxp-frdm-imxrt1186-development-board-features-i-mx-rt1186-crossover-mcu-four-ethernet-ports/", "summary": "<div><img alt=\"NXP FRDM-IMXRT1186\" class=\"attachment-medium size-medium wp-post-image\" height=\"514\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/09/NXP-FRDM-IMXRT1186-720x514.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>NXP has just launched the FRDM-IMXRT1186, a development board based on the i.MX RT1186 crossover MCU for industrial automation, robotics, PLCs, and edge computing applications. The MCU uses a heterogeneous architecture with an 800 MHz Arm Cortex-M7 core for application processing and a 300 MHz Arm Cortex-M33 core for real-time control and communications. The board includes 64 Mbit HyperRAM, 512 Mbit HyperFlash, and 128 Mbit QSPI Flash, along with two Gigabit Ethernet ports for TSN switching and two Fast Ethernet ports for EtherCAT or TSN switching. It also features a USB Type-C OTG port and a CAN transceiver, while debugging is supported through an on-board MCU-Link debugger and JTAG connector. For expansion, the board includes Arduino UNO R3 and FRDM headers, a FlexSPI follower header, an SRAMC header, and motor-control headers. NXP FRDM-IMXRT1186 development board specifications: SoC – NXP MIMXRT1186CVJ8C (i.MX RT1180 family, LFBGA196) CPU Arm Cortex-M7 application core @ [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/09/29/nxp-frdm-imxrt1186-development-board-features-i-mx-rt1186-crossover-mcu-four-ethernet-ports/\">NXP FRDM-IMXRT1186 development board features i.MX RT1186 crossover MCU, four Ethernet ports<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Walnut Pi CM2 – A cheaper Raspberry Pi CM5 alternative based on Allwinner T527 octa-core SoC", "source": "CNX Software", "date": "2026-09-29", "url": "https://www.cnx-software.com/2026/09/29/walnut-pi-cm2-a-cheaper-raspberry-pi-cm5-alternative-based-on-allwinner-t527-octa-core-soc/", "summary": "<div><img alt=\"Walnut Pi CM2\" class=\"attachment-medium size-medium wp-post-image\" height=\"467\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/09/Walnut-Pi-CM2-720x467.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Walnut Pi CM2 is a low-cost Raspberry Pi CM5-compatible Compute Module powered by an Allwinner T527 octa-core Cortex-A55 processor paired with up to 4GB LPDDR4 RAM, 16GB eMMC flash, and an optional wireless module. It&#8217;s basically the company&#8217;s Walnut Pi 2B credit card-sized SBC in Pi Compute Module form factor, exposing I/Os via two 100-pin high-density connectors. Besides the price, benefits include a WiFi 6 and Bluetooth 5.0 module, a Gigabit Ethernet PHY on the module, and a built-in 2 TOPS NPU in the T527 SoC. Downsides are that the Allwinner T527 is not quite as powerful as the Broadcom BCM2712 (4x Cortex-A76 cores) found in the CM5, and as with other such &#8220;Raspberry Pi CM5-compatible&#8221; modules, it&#8217;s only partially electrically compatible. Walnut Pi CM2 specifications: SoC – Allwinner T527 CPU Octa-core Arm Cortex-A55 processor with four cores @ 1.80 GHz and four cores @ 1.42GHz E906 RISC-V core up [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/09/29/walnut-pi-cm2-a-cheaper-raspberry-pi-cm5-alternative-based-on-allwinner-t527-octa-core-soc/\">Walnut Pi CM2 &#8211; A cheaper Raspberry Pi CM5 alternative based on Allwinner T527 octa-core SoC<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "MathWorks Releases MATLAB and Simulink R2026b", "source": "Embedded.com", "date": "2026-09-29", "url": "https://www.embedded.com/mathworks-releases-matlab-and-simulink-r2026b/", "summary": "<p>MathWorks has released MATLAB and Simulink Release 2026b (R2026b), introducing new products and enhancements for engineering teams developing increasingly complex systems that combine software, electronics, and artificial intelligence. The release expands capabilities for system configuration, simulation, verification, visual inspection, perception, embedded software, aerospace, and data analysis, aiming to streamline workflows from design and modeling through [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/mathworks-releases-matlab-and-simulink-r2026b/\">MathWorks Releases MATLAB and Simulink R2026b<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "EU Cyber Resilience Act: Secure-By-Design vs. Bolt-On Security", "source": "Embedded.com", "date": "2026-09-29", "url": "https://www.embedded.com/eu-cyber-resilience-act-secure-by-design-vs-bolt-on-security/", "summary": "<p>Making the right security choices for the EU Cyber Resilience Act and why this matters now.<\/p>\n<p>The post <a href=\"https://www.embedded.com/eu-cyber-resilience-act-secure-by-design-vs-bolt-on-security/\">EU Cyber Resilience Act: Secure-By-Design vs. Bolt-On Security<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "CEA-Leti and Quobly Strengthen Their Collaboration to Accelerate the  Development of Next-Generation Silicon Quantum Technologies", "source": "EE Journal", "date": "2026-09-29", "url": "https://www.eejournal.com/industry_news/cea-leti-and-quobly-strengthen-their-collaboration-to-accelerate-the-development-of-next-generation-silicon-quantum-technologies/", "summary": "Quobly, a French company developing silicon-based quantum computers, and CEA-Leti, a leading research institute in microelectronics and information technologies, are strengthening their long-standing collaboration through access to the FAMES Pilot Line, which complements Quobly’s industrial collaboration with STMicroelectronics and supports its technology roadmap. At FAMES, a pioneering initiative promoting semiconductor technologies in Europe by supporting &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/cea-leti-and-quobly-strengthen-their-collaboration-to-accelerate-the-development-of-next-generation-silicon-quantum-technologies/\">Read More &#8594;<span class=\"screen-reader-text\"> \"CEA-Leti and Quobly Strengthen Their Collaboration to Accelerate the  Development of Next-Generation Silicon Quantum Technologies\"<\/span><\/a>"}, {"title": "Bernier’s CMA series stainless-steel circular connectors delivering reliable connectivity in harsh defence and industrial environments now available through Powell Electronics", "source": "EE Journal", "date": "2026-09-29", "url": "https://www.eejournal.com/industry_news/berniers-cma-series-stainless-steel-circular-connectors-delivering-reliable-connectivity-in-harsh-defence-and-industrial-environments-now-available-through-powell-electronics/", "summary": "Powell Electronics, the supplier of connectors and more for high-rel applications including defence, aerospace and industrial, stocks Bernier’s CMA series of stainless-steel circular connectors. The versatile components are designed to provide reliable signal and data connectivity in harsh and demanding environments like industrial equipment, land defense, aeronautics, radio systems, tactical equipment, ruggedized PCs and displays, &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/berniers-cma-series-stainless-steel-circular-connectors-delivering-reliable-connectivity-in-harsh-defence-and-industrial-environments-now-available-through-powell-electronics/\">Read More &#8594;<span class=\"screen-reader-text\"> \"Bernier’s CMA series stainless-steel circular connectors delivering reliable connectivity in harsh defence and industrial environments now available through Powell Electronics\"<\/span><\/a>"}, {"title": "Critical Link MitySOM-AM62x/A/P – TI Sitara AM62 SO-DIMM SoMs for edge AI and industrial automation", "source": "CNX Software", "date": "2026-09-28", "url": "https://www.cnx-software.com/2026/09/28/critical-link-mitysom-am62x-a-p-ti-sitara-am62-so-dimm-soms-for-edge-ai-and-industrial-automation/", "summary": "<div><img alt=\"MitySOM AMxx Dev Kit\" class=\"attachment-medium size-medium wp-post-image\" height=\"480\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/09/MitySOM-AMxx-Dev-Kit-720x480.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Critical Link MitySOM-AM62x/A/P is a family of TI Sitara AM62-based industrial SO-DIMM SoMs designed for embedded Linux systems, industrial automation, HMI, and other embedded applications. The family includes the general-purpose MitySOM-AM62, AI-focused MitySOM-AM62A, and multimedia-oriented MitySOM-AM62P system-on-modules. The standard AM62 modules feature up to a quad-core Arm Cortex-A53 processor at 1.4 GHz, along with a 400 MHz Cortex-M4F MCU and dual programmable real-time units (PRUs). The AM62A adds a C7x DSP with Matrix Multiply Accelerator supporting up to 2 TOPS and an image signal processor (ISP), while the AM62P includes a 3D GPU rated above 50 GFLOPS and a four-lane MIPI DSI output. MitySOM-AM62x / AM62Ax / AM62Px specifications: SoM options MitySOM-AM62x – Texas Instruments Sitara AM62x Application CPU – Up to Quad-core Arm Cortex-A53 up to 1.4 GHz Real-time cores Arm Cortex-M4F up to 400 MHz Dual-core Programmable Real-Time Unit (PRU-SS) up to 333 MHz GPU – 3D Graphics [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/09/28/critical-link-mitysom-am62x-a-p-ti-sitara-am62-so-dimm-soms-for-edge-ai-and-industrial-automation/\">Critical Link MitySOM-AM62x/A/P &#8211; TI Sitara AM62 SO-DIMM SoMs for edge AI and industrial automation<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Up2Stream spins off from Arylic as a dedicated DIY audio brand (Sponsored)", "source": "CNX Software", "date": "2026-09-28", "url": "https://www.cnx-software.com/2026/09/28/up2stream-spins-off-from-arylic-as-a-dedicated-diy-audio-brand/", "summary": "<div><img alt=\"Up2stream DIY audio website\" class=\"attachment-medium size-medium wp-post-image\" height=\"555\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/09/Up2stream-DIY-audio-website-720x555.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Up2Stream started as Arylic’s DIY audio board line and has now been spun off as its own brand. The split is not a rebadge or a clone of Arylic’s finished consumer streamers and amplifiers. It is a deliberate move to put the maker community first: boards, accessories, documentation, and support aimed at people who build speakers, restore vintage gear, or design custom multiroom systems. Many long-time users still treat “Up2Stream” and “Arylic” as the same storefront. Others assume the boards are a copy of Arylic’s boxed products. They are related in history, but they serve different jobs. Arylic’s consumer line is complete hardware you plug in. Up2Stream is the modular stack you drop into a cabinet, a plate amp, a passive pair, or a 2.1 build and wire yourself. Same streaming DNA, different product mission. The lineup is built around a few core modules and a set of add-ons that [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/09/28/up2stream-spins-off-from-arylic-as-a-dedicated-diy-audio-brand/\">Up2Stream spins off from Arylic as a dedicated DIY audio brand (Sponsored)<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "EU Cyber Resilience Act Shifts Secure-by-Design for Embedded Developers", "source": "Embedded.com", "date": "2026-09-28", "url": "https://www.embedded.com/eu-cyber-resilience-act-shifts-secure-by-design-for-embedded-developers/", "summary": "<p>The EU CRA is changing what secure-by-design means for embedded developers.<\/p>\n<p>The post <a href=\"https://www.embedded.com/eu-cyber-resilience-act-shifts-secure-by-design-for-embedded-developers/\">EU Cyber Resilience Act Shifts Secure-by-Design for Embedded Developers<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "Leopard Imaging, Lumotive Launch 3D Perception Platform for Edge AI and Robotics", "source": "Embedded.com", "date": "2026-09-28", "url": "https://www.embedded.com/leopard-imaging-lumotive-launch-3d-perception-platform-for-edge-ai-and-robotics/", "summary": "<p>Leopard Imaging and Lumotive have introduced Sirius Max, a long-range, software-defined 3D perception platform designed for robotics, industrial automation, autonomous machines, automotive systems, and edge AI applications. The LI-AR0234-AF0130-TX10-GMSL2-140H combines RGB imaging, intelligent indirect time-of-flight (iToF) depth sensing, embedded processing, synchronization, and programmable beam-steered illumination in a compact GMSL2 camera module. Sirius Max uses Lumotive's [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/leopard-imaging-lumotive-launch-3d-perception-platform-for-edge-ai-and-robotics/\">Leopard Imaging, Lumotive Launch 3D Perception Platform for Edge AI and Robotics<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "LILYGO T-Dongle-C5 – An ESP32-C5 USB dongle with microSD card slot, optional 0.96-inch OLED", "source": "CNX Software", "date": "2026-09-27", "url": "https://www.cnx-software.com/2026/09/27/lilygo-t-dongle-c5-an-esp32-c5-usb-dongle-with-microsd-card-slot-optional-0-96-inch-oled/", "summary": "<div><img alt=\"LILYGO T-Dongle-C5\" class=\"attachment-medium size-medium wp-post-image\" height=\"565\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/09/LILYGO-T-Dongle-C5-720x565.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>LILYGO T-Dongle-C5 is an ESP32-C5 dual-band WiFi 6, BLE, and 802.15.4 USB dongle that builds upon the earlier ESP32-S3-based T-Dongle-S3 board. The new board still features an optional 0.96-inch color display, a microSD card slot, and a USB-A male port. The main differences are support for dual-band WiFi 6, 16MB flash, 8MB PSRAM, and the addition of a Qwiic expansion connector. T-Dongle-C5 specifications: Wireless SoC – Espressif Systems ESP32-C5HR8 CPU Single-core 32-bit RISC-V processor @ up to 240 MHz Low-power RISC-V core @ 40 MHz acting as the main processor for power-sensitive applications Memory – 384 KB SRAM on-chip, 8MB PSRAM Storage – 320 KB ROM Wireless Connectivity Dual-band (2.4GHz/5 GHz) 802.11ax WiFi 6, with 802.11b/g/n WiFi 4 standard fallback Bluetooth 5.0 Low Energy (LE) 802.15.4 radio for Zigbee 3.0 and Thread 1.3 Storage 16MB flash MicroSD card socket integrated in the USB connector Fitted with a &#8220;virtual TF card&#8221;, a [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/09/27/lilygo-t-dongle-c5-an-esp32-c5-usb-dongle-with-microsd-card-slot-optional-0-96-inch-oled/\">LILYGO T-Dongle-C5 &#8211; An ESP32-C5 USB dongle with microSD card slot, optional 0.96-inch OLED<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "KryonOS turns ESP32 boards into JavaScript-powered mini computer", "source": "CNX Software", "date": "2026-09-26", "url": "https://www.cnx-software.com/2026/09/26/kryonos-turns-esp32-boards-into-javascript-powered-mini-computer/", "summary": "<div><img alt=\"KryonOS running on two ESP32 based devices\" class=\"attachment-medium size-medium wp-post-image\" height=\"480\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/09/KryonOS-running-on-two-ESP32-based-devices-720x480.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>KryonOS is a small JavaScript-powered OS that turns a supported ESP32 development board with a touchscreen into a standalone computer with its own graphical interface, application launcher, and file storage. It provides the basic software environment needed to use the board without writing and flashing a separate firmware program for every application. Unlike traditional ESP32 firmware, KryonOS keeps applications separate from the main system and runs them through its built-in JavaScript runtime. It also includes an App Store that allows users to download and install applications and updates over Wi-Fi without reflashing the device. KryonOS key features: Supported MCUs – ESP32 (WROOM-32), ESP32-S2, ESP32-S3, and ESP32-C3 Storage – MicroSD card support via HSPI bus Display ILI9341 display controller with XPT2046 resistive touch controller connected via VSPI Experimental support for some other display controllers, e.g., ST7789V2 JavaScript Engine – Duktape 2.x (ES5/ES5.1 compliant). Graphics Engine – Direct-to-glass 16-bit RGB565 rendering with hardware [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/09/26/kryonos-turns-esp32-boards-into-javascript-powered-mini-computer/\">KryonOS turns ESP32 boards into JavaScript-powered mini computer<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Compact Long-Wave Infrared camera pairs STM32N6 MCU with Lynred ATI320 thermal sensor", "source": "CNX Software", "date": "2026-09-25", "url": "https://www.cnx-software.com/2026/09/25/compact-long-wave-infrared-camera-pairs-stm32n6-mcu-with-lynred-ati320-thermal-sensor/", "summary": "<div><img alt=\"8Sight T100 is a compact LWIR thermal camera for drones and other embedded systems\" class=\"attachment-medium size-medium wp-post-image\" height=\"480\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/09/8Sight-T100-is-a-compact-LWIR-thermal-camera-for-drones-and-other-embedded-systems-720x480.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>8devices 8Sight T100 is a compact Long-Wave Infrared (thermal imaging) camera for UAS, robotics, and industrial applications. It combines a Lynred ATI320 LWIR sensor with an STM32N6 Arm Cortex-M55 microcontroller featuring a Neural-ART NPU and a hardware ISP for edge AI inference and real-time thermal image processing. The camera delivers 320&#215;240 thermal video at 60 fps and operates completely offline, allowing you to deploy custom AI models for object detection, anomaly detection, or temperature-triggered events without relying on cloud resources. 8devices 8Sight T100 specifications: MCU – STMicro STM32N657X0H3Q with an Arm Cortex-M55 core up to 800MHz with a 600 GOPS Neural-ART Accelerator (NPU) and hardware ISP System Memory – 256 Mbit (32 MB) RAM @ 200 MHz (16-bit) Storage – 512 Mbit (64 MB) NOR flash Thermal Camera &#8211; Lynred ATI320 LWIR (Long-Wave Infrared) sensor Spectral range – 8 to 14 µm Resolution – 320 x 240 pixels Frame rate – [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/09/25/compact-long-wave-infrared-camera-pairs-stm32n6-mcu-with-lynred-ati320-thermal-sensor/\">Compact Long-Wave Infrared camera pairs STM32N6 MCU with Lynred ATI320 thermal sensor<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "MemBrowse continuously tracks firmware memory footprint, is free for open-source projects", "source": "CNX Software", "date": "2026-09-25", "url": "https://www.cnx-software.com/2026/09/25/membrowse-continuously-tracks-firmware-memory-footprint-is-free-for-open-source-projects/", "summary": "<div><img alt=\"MemBrowse Dashboard\" class=\"attachment-medium size-medium wp-post-image\" height=\"345\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/09/MemBrowse-Dashboard-720x345.png\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>MemBrowse tool allows embedded software developers to track the RAM and flash footprint of their firmware in continuous integration, with support for GitHub Actions, GitLab CI/CD, and other CI solutions. Engineers can monitor footprint changes in a granular way each time code is submitted to their project, instead of finding out when the firmware image stops fitting into the target&#8217;s flash, or can&#8217;t run due to excessive RAM usage. MemBrowse also provides the full history showing how memory usage progressed over time, and how much is left for extra features. MemBrowse key features: Integrates with CI/CD &#8211; It works with GitHub Actions, GitLab CI, Jenkins, and other CI systems. Automatic memory tracking on every commit to your main branch. The open-source MemBrowse CLI parses the project&#8217;s ELF file and linker script, extracts memory usage data, and uploads a report to the MemBrowse Portal. PR comments show how much memory each [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/09/25/membrowse-continuously-tracks-firmware-memory-footprint-is-free-for-open-source-projects/\">MemBrowse continuously tracks firmware memory footprint, is free for open-source projects<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "The Hidden Cost of Embedded Databases on NAND Flash, Security in SDVs, Embedded SW Development: Embedded Week Insights", "source": "Embedded.com", "date": "2026-09-25", "url": "https://www.embedded.com/the-hidden-cost-of-embedded-databases-on-nand-flash-security-in-sdvs-embedded-sw-development-embedded-week-insights/", "summary": "<p>Here's a roundup of this week's must-read articles. We'll cover the latest developments on the hidden cost of embedded databases on NAND flash memory, security in SDVs, choosing a cross-platform IDE for embedded SW development, and a lot more. Also, check News Archives - Embedded and Technical Articles Archives - Embedded for the complete list of news and articles [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/the-hidden-cost-of-embedded-databases-on-nand-flash-security-in-sdvs-embedded-sw-development-embedded-week-insights/\">The Hidden Cost of Embedded Databases on NAND Flash, Security in SDVs, Embedded SW Development: Embedded Week Insights<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "Ezurio Unveils BL54LM20 Bluetooth LE Modules", "source": "Embedded.com", "date": "2026-09-25", "url": "https://www.embedded.com/ezurio-unveils-bl54lm20-bluetooth-le-modules/", "summary": "<p>Ezurio has launched the BL54LM20 Series of Bluetooth LE modules. The new family includes the BL54LM20A with Bluetooth LE Core 6.x, 802.15.4 (Thread/Matter), and NFC; the BL54LM20B with Bluetooth LE, 802.15.4, NFC, and an edge AI neural processing unit (NPU); and the BL54LM20B USB-C adapter for Bluetooth LE and 802.15.4 connectivity. The BL54LM20 Series, built [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/ezurio-unveils-bl54lm20-bluetooth-le-modules/\">Ezurio Unveils BL54LM20 Bluetooth LE Modules<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "EdgeCortix Launches Scalable RAIDEN AI Chiplet Platform", "source": "Embedded.com", "date": "2026-09-24", "url": "https://www.embedded.com/edgecortix-launches-scalable-raiden-ai-chiplet-platform/", "summary": "<p>EdgeCortix Inc. has introduced RAIDEN, a scalable AI chiplet platform designed for energy-efficient physical AI applications deployed outside centralized data centers. The architecture combines compute, memory, bandwidth, connectivity, and software within a common platform that scales from a single compute die to a four-die configuration. The flagship RAIDEN-X4 delivers up to 3.36 PFLOPS of FP4 [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/edgecortix-launches-scalable-raiden-ai-chiplet-platform/\">EdgeCortix Launches Scalable RAIDEN AI Chiplet Platform<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "Why Software-Defined Vehicles Need a New Security Foundation", "source": "Embedded.com", "date": "2026-09-24", "url": "https://www.embedded.com/why-software-defined-vehicles-need-a-new-security-foundation/", "summary": "<p>SDVs expand the attack surface with continuously updated software across centralized compute and always-on connectivity, requiring a rethink in security architecture.<\/p>\n<p>The post <a href=\"https://www.embedded.com/why-software-defined-vehicles-need-a-new-security-foundation/\">Why Software-Defined Vehicles Need a New Security Foundation<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}], "papers": [{"title": "Physis-Lang: Self-Evolving Language as a Physical Representation for Video World Model", "authors": ["Liming Lu", "Xianzheng Ma", "Wenkun He", "Guanqi Zhan", "Yilin Zhao", "Junyu Chen", "Mengyao Xu", "Jiaojiao Fan", "Wenhang Ge", "Yuchao Gu", "Yunze Liu", "Boyi Li", "Zhen Dong", "Victor Prisacariu", "Ming-Yu Liu", "Song Han", "Han Cai"], "published": "2026-09-30", "summary": "Video world models are expected to predict how the physical world evolves, yet they often produce visually plausible videos that violate basic physical principles. Existing approaches commonly assume that natural language is insufficient to represent the physical knowledge required for reliable generation, and therefore introduce additional visual, latent, numerical, or planning-based signals. We revisit this assumption and introduce Physis-Lang, a self-evolving framework that treats physical language as a shared and optimizable representation across data curation, model training, and video generation. Physis-Lang represents physical processes through language that describes their relevant entities, causes, interactions, governing principles, temporal evolution, and effects. To improve this representation, we construct PhysCapBench, which decomposes physical processes into atomic assertions and evaluates captions using recall and precision. An agentic loop iteratively analyzes assertion-level errors and refines the instruction used to produce physical captions. Physis-Lang further converts model deficiencies into textual descriptions and uses language-guided retrieval to identify visually diverse videos that cover missing physical processes. Experiments on four widely used physical video benchmarks with Wan and Cosmos backbones demonstrate consistent improvements in physical plausibility. Notably, starting from open-source Cosmos3-Nano backbones, our Physis-Lang-enhanced models surpass the leading proprietary Veo 3.1 model.", "pdf_url": "https://arxiv.org/pdf/2609.40358v1"}, {"title": "AssemblyWorld: Rethinking 3D Assembly with General-Purpose Agents", "authors": ["Jiahao Zhang", "Yeying Fan", "Moitreya Chatterjee", "Suhas Lohit", "Bernhard Egger", "Tim K. Marks", "Anoop Cherian", "Stephen Gould"], "published": "2026-09-30", "summary": "The task of 3D assembly requires translating an understanding of parts and their relationships into precise spatial arrangements. Can pretrained general-purpose agents assemble objects through visual interaction without additional assembly-specific fine-tuning? To investigate this question, we introduce AssemblyWorld, an interactive 3D environment in which agents inspect rendered views and manipulate supplied rigid parts, guided by images or assembly manuals when available. Agents perceive part geometry through 2D views rather than direct access to mesh vertices or faces, while their resulting assemblies are evaluated geometrically. Building on this environment, we construct AssemblyWorldBench, comprising 100 assembly tasks across 80 objects spanning furniture, industrial assembly, and fracture reassembly. Evaluating eight agent systems reveals substantial differences in their capabilities. The strongest system achieves 80.9% part accuracy but 59.4% complete-assembly success. The evaluated open-source systems lag substantially behind their stronger closed-source peers in both execution reliability and assembly accuracy. Analyses of visual references, interaction trajectories, and failures show how agents revise assemblies while leaving residual positioning errors. AssemblyWorld provides a common setting for both assessing the capabilities of interactive assembly agents and characterizing the gap between approximate structure recovery and precise reconstruction.", "pdf_url": "https://arxiv.org/pdf/2609.40353v1"}, {"title": "Image Classifiers are Efficient Self-Supervised Video Representation Learners", "authors": ["Owais Iqbal", "Sudipta Sarkar", "Shyam Marjit", "Omprakash Chakraborty", "Anirban Chakraborty", "Abir Das"], "published": "2026-09-30", "summary": "We introduce VideoMSN, a Masked Siamese Network framework for efficient self-supervised spatio-temporal representation learning in videos. Instead of relying on heavy 3D architectures or reconstruction-based autoencoders for learning with unlabeled data, we repurpose standard image Vision Transformers by representing videos as super images which are grids composed of frames sampled from videos. From each super image, we construct two views: one with spatial patch masking and the other with temporal frame masking, ensuring no information leakage across frames. A shared Vision Transformer (ViT) encoder aligns their embeddings using a masked Siamese loss, capturing both motion and appearance cues without reconstruction. Our decoder-free formulation leverages an image foundation model towards efficient video representation learning. Starting from pretrained DINO-v3 and DeiT-v3 image encoders, VideoMSN achieves state-of-the-art performance on Kinetics-400, UCF101, and HMDB51 while requiring up to $32\\times$ fewer and $160\\times$ fewer video pretraining epochs compared to prior video self-supervised learning methods. Our proposed approach also shows strong performance in low-shot classification, confirming the transferability of the learned representations in a label-scarce scenario. Project Page: https://cvir.github.io/projects/videomsn.", "pdf_url": "https://arxiv.org/pdf/2609.40347v1"}, {"title": "Ego4WAM: What Matters When Scaling Egocentric Human Data for Robot Learning?", "authors": ["Zhihao Sun", "Liu Liu", "Xinjiang Wang", "Haoyi Jiang", "Wei Feng", "Huiqiang Zhang", "Xiaosong Jia", "Zhizhong Su", "Zuxuan Wu"], "published": "2026-09-30", "summary": "Egocentric human data provides a scalable source of experience for robot learning, but varies substantially in human-robot alignment, behavioral coverage, and available supervision. Existing work shows favorable scaling with increasing human data, but it remains unclear which data properties drive downstream robot gains and how to use such data throughout the training pipeline. We present a systematic study of egocentric human data with different alignment and supervision under a unified world-action model framework. With the model backbone fixed, we disentangle the effects of human-robot alignment, data duration and task diversity, action supervision, and data usage strategies. We find that aligned human demonstrations substantially improve out-of-distribution generalization and reduce target-task robot data requirements; data duration and task diversity affect downstream capabilities differently; and video-only supervision remains effective without action labels, providing a strong foundation for subsequent video-action training. We validate these findings through closed-loop policy evaluation on both real robots and RoboDojo. Rather than treating data duration as the sole scaling axis, Ego4WAM shows how alignment, task diversity, available supervision, and usage strategy jointly shape the value of egocentric human data for robot learning.", "pdf_url": "https://arxiv.org/pdf/2609.40341v1"}, {"title": "WorldAuditBench: Interactive 3D World Auditing with Multimodal Agents", "authors": ["Ziyan Jiang", "Jingbo Yang", "Jiabao Ji", "Yujian Liu", "Qiucheng Wu", "Tommi Jaakkola", "Yang Zhang", "Shiyu Chang"], "published": "2026-09-30", "summary": "As interactive 3D worlds are increasingly used to study intelligent behavior, it becomes important to develop efficient pipelines for identifying anomalies in these simulated environments, such as floating objects, traversable walls, or objects inconsistent with the surrounding scene. Multimodal AI systems, including vision-language models (VLMs) and vision-language-action models (VLAs), have shown potential for automating this task. However, 3D world auditing is complex, requiring the close coupling of two distinct capabilities: action, to navigate the 3D world and search for anomalies systematically and efficiently; and visual reasoning, to understand the environment and identify anomalies from multimodal observations. It remains largely unexplored whether multimodal agents can effectively couple these two capabilities, using visual reasoning to identify potential anomalies while taking actions to validate them. In this paper, we introduce WorldAuditBench, a benchmark for 3D world auditing comprising 213 anomaly tasks across 13 environments built with Unreal Engine 5 and Three.js, spanning five anomaly families. We evaluate five frontier models under a fixed exploration budget using two auditing paradigms: VLA-based exploration followed by VLM-based anomaly identification, and an end-to-end VLM agent in which visual reasoning directly guides action selection. Across the evaluated models and two paradigms, success rates range from 6.6% to 42.3%, substantially below human performance (83.4%). Through the task of world auditing, WorldAuditBench provides a testbed for studying how multimodal agents couple action and visual reasoning in interactive 3D environments, while highlighting current limitations in their ability to gather and interpret evidence during exploration.", "pdf_url": "https://arxiv.org/pdf/2609.40325v1"}, {"title": "DynaHarness: A Dynamic Physical Harness for Self-Evolving Robot Agents", "authors": ["Haoyuan Deng", "Jiebin Liu", "Tengxiao Zhang", "Langning Yan", "Hongye Cao", "Ziwei Wang"], "published": "2026-09-30", "summary": "Pretrained robot policies provide useful action priors, but long-horizon manipulation still requires coordination between semantic reasoning and physical execution. Semantic reasoning operates at a coarser timescale than physical interaction, while episode-level failures provide limited guidance on which system component should be revised. We propose DynaHarness, a dynamic physical harness that couples semantic reasoning with physical governance through a shared execution contract and turns failure evidence into validated capability revisions. To be more specific, the slow brain proposes capabilities and symbolic arguments, while the fast brain grounds and monitors commands, refuses unresolved actions, substitutes capabilities, and requests replans when needed. The physical execution contract bounds each accepted command and records execution evidence across analytic skills, recovery skills, and the frozen VLA. Failure attribution localizes faults in these records and directs targeted revisions of reusable capabilities or execution mechanisms. Paired regression checks govern admission or rejection, closing the self-evolution loop. On LIBERO-Pro, DynaHarness achieves 75.2% on 800 newly sampled initial states, compared with 17.5% for the frozen policy. With the same capability library, full dynamic execution reaches 74.0% versus 63.9% under nominal one-step replanning. This demonstrates the value of DynaHarness as a dynamic physical harness that governs how existing capabilities are grounded, monitored, and coordinated during execution. Our project page is at https://denghaoyuan123.github.io/Dynaharness_page/.", "pdf_url": "https://arxiv.org/pdf/2609.40306v1"}, {"title": "GPU-Accelerated Path-Dependent Marginal Information Gain for Autonomous Exploration", "authors": ["João Félix Mendes", "Rodrigo Ventura", "Meysam Basiri"], "published": "2026-09-30", "summary": "Autonomous exploration demands that robots continuously evaluate candidate viewpoints based on their expected information gain and execution cost. Sampling-based planners estimate this gain by volumetric raycasting and, due to its computational cost, evaluate candidates under an assumption of mutual independence, ignoring the overlap between viewpoints along the same path. This work presents a GPU-accelerated method for computing path-dependent marginal information gain, where instead of storing and merging the observed unknown voxels along each candidate path, previous observations are represented using depth buffers. Candidate rays are projected into the depth buffers of their ancestors to identify observation overlap and exclude regions expected to be observed. The planning tree is evaluated in depth order to maintain the dependency between viewpoints and their optimized yaws, while candidate nodes and rays at each level are processed in parallel on the GPU. The proposed method stays within 5-10% of the exact marginal gain computed using voxel hash maps, with speed-ups of up to 118x on a desktop GPU and 28x on an NVIDIA Jetson Orin NX. The method was integrated into two sampling-based exploration planners and evaluated in three simulation environments, where marginal gain reduced the time to 95% coverage in five of the six evaluated planner-environment combinations. Real-world experiments also showed a 30% reduction in the time to 95% coverage, as well as earlier exploration termination times.", "pdf_url": "https://arxiv.org/pdf/2609.40297v1"}, {"title": "Belief-Aware Multi-Agent Path Finding under Map Uncertainty", "authors": ["Viraj Parimi", "Shao-Hung Chan", "Han Zhang", "Jingkai Chen", "Brian Williams"], "published": "2026-09-30", "summary": "Multi-Agent Path Finding (MAPF) aims to find collision-free paths for multiple agents in a shared environment. Classical MAPF assumes that all static obstacles are known in advance, but real-world environments can change unexpectedly due to fallen objects, spills, or other local disturbances. When such changes are spatially correlated, an observation can inform traversability estimates beyond the observed location. Prior approaches address uncertainty in traversability through contingent plans or replanning based on direct observations, but do not leverage this spatial dependence to infer the traversability of nearby unobserved locations. As a result, they cannot use one observation to anticipate nearby unobserved obstacles that may cause costly rerouting later. We focus on Belief-Aware MAPF, where map discrepancies are fixed during execution but initially unknown, and observations can be informative beyond the observed location. We propose Multi-Agent Gaussian belief Inference for Coordination (MAGIC), a framework that updates a shared belief about traversability online based on agents' observations. MAGIC uses a Gaussian Markov Random Field and Gaussian Belief Propagation to approximately infer traversability and construct detour-aware costs for standard MAPF planners. Our experiments on MAPF benchmarks show that MAGIC reduces the executed sum of costs compared to existing approaches on 96.3% of instances, across several planner families and teams of up to 800 agents, demonstrating its applicability to large-scale MAPF problems.", "pdf_url": "https://arxiv.org/pdf/2609.40269v1"}, {"title": "OpenTSLM TeeMoE: A Unified Time-Series Language Model for Forecasting, Contextual Prediction, and Reasoning", "authors": ["Tony Chen", "Timo Stoffregen", "Maxwell Xu", "Thomas Kaar", "Martin Maritsch", "Geremia Pompei", "Nicolas Zumarraga", "Robert Jakob", "Paul Schmiedmayer", "Patrick Langer", "Juncheng Liu"], "published": "2026-09-30", "summary": "Real-world time-series applications increasingly require models that can handle time series forecasting, context-conditioned prediction, and language-based temporal reasoning. Yet current time-series foundation models remain fragmented across these capabilities: numerical specialists often provide the strongest forecasts, while language-based models offer broader contextual understanding and analysis. A central challenge is to unify these heterogeneous capabilities without reducing their individual performance. We introduce OpenTSLM TeeMoE, a generalist time-series language model that can forecast directly from observed time series, reason over textual context and temporal patterns, and synthesize and refine predictions from external numerical forecasting specialists. We independently train three low-rank experts for forecast aggregation, native forecasting, and temporal analysis over a shared backbone. A learned LoRA mixture-of-experts controller then weights their frozen parameter updates for each request. Our proposed model achieves strong performance on widely used benchmarks for time series forecasting, context-conditioned prediction, and language-based temporal reasoning, ranking among the top three on GIFT-Eval by mean MASE rank, Context is Key by RCRPS, and TimeSeriesExam by accuracy.", "pdf_url": "https://arxiv.org/pdf/2609.40265v1"}, {"title": "STARS: From Spatiotemporal Dynamics to Social Representations in Human-Robot Interaction", "authors": ["Nathan Tsoi", "Michael J. Munje", "Tejas Oberoi", "Rishab Maheshwari", "Pengen Zheng", "Tanush Chauhan", "Peter Stone", "Joydeep Biswas"], "published": "2026-09-30", "summary": "Robot navigation in dynamic, human-centered environments requires socially-compliant decisions grounded in robust scene understanding. Recent Vision-Language Models (VLMs) exhibit promising capabilities such as object recognition, common-sense reasoning, and contextual understanding, capabilities that align with the nuanced requirements of social robot navigation. However, it remains unclear whether VLMs can accurately understand complex social navigation scenes (e.g., inferring the spatial-temporal relations among agents and human intentions), which is essential for safe and socially compliant robot navigation. While some recent works have explored the use of VLMs in social robot navigation, no existing work systematically evaluates their ability to meet these necessary conditions. In this paper, we introduce the Social Navigation Scene Understanding Benchmark (SocialNav-SUB), a Visual Question Answering (VQA) dataset and benchmark designed to evaluate VLMs for scene understanding in real-world social robot navigation scenarios. SocialNav-SUB provides a unified framework for evaluating VLMs against human and rule-based baselines across VQA tasks requiring spatial, spatiotemporal, and social reasoning in social robot navigation. Through experiments with state-of-the-art VLMs, we find that while the best-performing VLM achieves an encouraging probability of agreeing with human answers, it still underperforms simpler rule-based approach and human consensus baselines, indicating critical gaps in social scene understanding of current VLMs. Our benchmark sets the stage for further research on foundation models for social robot navigation, offering a framework to explore how VLMs can be tailored to meet real-world social robot navigation needs. An overview of this paper along with the code and data can be found at https://larg.github.io/socialnav-sub.", "pdf_url": "https://arxiv.org/pdf/2609.40245v1"}, {"title": "StreamRig: Exploiting Intra-Rig Geometry for Streaming Multi-Camera Odometry", "authors": ["Yufei Wei", "Shuhao Ye", "Qi Wang", "Xin Zheng", "Qing Huang", "Rong Xiong", "Yue Wang"], "published": "2026-09-30", "summary": "Mobile robots and vehicles carry synchronized multi-camera rigs, yet many streaming 3D foundation models are designed for monocular input, leaving efficient use of rig geometry a challenge. We present StreamRig, a freeze-and-stream framework that builds causal streaming odometry for calibrated rigs on a frozen multi-view 3D foundation model. The frozen front-end jointly perceives the synchronized views using rig calibration. A Rig-Resampler compresses their features, a CausalBridge applies causal attention with a key-value cache, and a lightweight head regresses rig poses. A periodic re-anchoring protocol supports stable pose estimation over long sequences. Only these modules are trained, 74.6M parameters in total, with relative poses as the sole supervision. Our two-stage training strategy combines group relocalization pretraining with causal rig training to transfer the geometric priors of the frozen front-end and the alignment ability of the pretrained modules to streaming odometry. We evaluate on NCLT, TartanGround, KITTI-360, and our self-collected humanoid-robot dataset ZJH, where training uses only simulation and real-world evaluation is zero-shot. Across all four datasets, StreamRig achieves lower translation and rotation drift than the evaluated non-oracle monocular streaming and rig-aware offline models, while maintaining low inference cost. Ablations and controlled camera-count experiments identify the sources of these gains. We further examine how longer training windows affect inference over longer horizons. Code has been released at https://github.com/WeiYuFei0217/StreamRig.", "pdf_url": "https://arxiv.org/pdf/2609.40244v1"}, {"title": "LOCI: Spatial Linear Memory for Streaming World Models", "authors": ["Ji Xia", "Tingting Liao", "Xuezhi Liang", "Hao Li", "Guangyi Liu"], "published": "2026-09-30", "summary": "When a camera revisits a previously observed region, a video world model should reproduce what was there before. This requires both remembering past observations and retrieving the right one for the current viewpoint. Key-value caches preserve visual detail but grow with video length; recurrent memory is compact but compresses history into a fixed-size state, so individual past observations are no longer directly accessible. We introduce LOCI, a hybrid spatial-memory architecture that keeps both representations. In half of the transformer blocks, main attention keeps a key-value cache of past observations; in the other half, it is restricted to the current chunk and complemented by a recurrent linear-attention memory whose reads and writes are conditioned on projective camera geometry, so viewpoint enters both memory addressing and stored content. Recurrent readouts flow into subsequent cache-backed blocks and supply their queries with accumulated scene context. On the public MIND memory benchmark and on held-out recorded trajectories, LOCI reproduces revisited content more faithfully than representative world models and a same-recipe full-softmax model; with full history, it lowers peak memory at equal length by about 30% relative to full softmax. With a bounded bank of retained observations, it streams long videos at constant memory and remains more faithful than full softmax under the same budget.", "pdf_url": "https://arxiv.org/pdf/2609.40222v1"}, {"title": "Centralized Multi-UAV Exploration and 3D Reconstruction Using Single-UAV Planners", "authors": ["João Félix Mendes", "Meysam Basiri", "Rodrigo Ventura"], "published": "2026-09-30", "summary": "Extending single Unmanned Aerial Vehicles (UAVs) exploration methods to multi-UAV teams can improve coverage speed and robustness, but introduces challenges such as consistent mapping, safe navigation, and deployment strategy. In this work, we present a centralized multi-UAV exploration framework that enables the use of existing single-UAV sampling-based planners in a multi-UAV setting. The proposed architecture allows multiple UAVs to collaboratively explore unknown environments using a shared global Truncated Signed Distance Field (TSDF) map and centralized planning. Building on the voxblox library, we adapt its mapping pipeline to support real-time fusion of depth measurements from multiple UAVs into a common TSDF representation. In addition, inter-UAV collision avoidance and robot self-filtering mechanisms are integrated into the system to ensure safe navigation and prevent reconstruction of other UAVs as static obstacles. The framework is evaluated in simulation using four sampling-based exploration planners - RH-NBVP, KRH-NBVP, AEP, and KAEP - whose core sampling logic is preserved, with only system-level adaptations for multi-UAV operation. Experiments are conducted across multiple environments and under two deployment configurations: Joint Start (JS), where UAVs are initialized in close proximity, and Separated Start (SS), where UAVs are initialized in distinct locations. Results show that SS deployments consistently achieve faster exploration and improved coverage across all planners, highlighting the importance of the deployment strategy in multi-UAV exploration performance.", "pdf_url": "https://arxiv.org/pdf/2609.40208v1"}, {"title": "Non-Invasive Inspection of Water Canals Using Dronar", "authors": ["Michael Zielinski", "Zhizhan Wang", "Benjamin Dymond", "Reza Razavian", "Zhongwang Dou"], "published": "2026-09-30", "summary": "Open concrete canals play a vital role in water transportation, serving as primary water infrastructure for millions of people across the Phoenix, Arizona, metro area. Over time, the concrete canals can experience a range of issues, including canal lining deformation, cracked concrete, and sediment buildup on the canal floor. Identifying such critical issues is a resource-intensive process, which currently happens only during four-year dry-up cycles. This prevents the maintenance crew from prioritizing operations on the most affected canal segments. To address this issue, the research team has developed and verified an easily deployable and non-invasive method to inspect canal beds without draining the water. This inspection system integrates affordable, off-the-shelf drone and sonar technology (termed dronar). This dronar system includes a consumer-grade sonar system integrated into an unmanned surface vehicle (USV) that carries the sonar transducer just under the surface of the canal water. This paper presents a proof-of-concept demonstration of the dronar system across three field tests on the Arizona Canal in Phoenix. DownScan depth profiles from the sedimented canal segment were consistently shallower than profiles from the same segment after cleaning, with offsets of up to 15 cm observed along the track. Repeated runs over the clean segment produced closely overlapping DownScan depth profiles, confirming that the dronar yields repeatable measurements across the natural variation of the canal bed. These results establish the dronar as a viable proof-of-concept tool for non-invasive canal bed inspection.", "pdf_url": "https://arxiv.org/pdf/2609.40178v1"}, {"title": "Social-WM: Safety-Aware Latent World Models for Robot Social Navigation", "authors": ["Zhihao Zheng", "Mooi Choo Chuah"], "published": "2026-09-30", "summary": "Safe social navigation requires a robot to anticipate not only the future consequences of its actions, but also whether a nominal action can actually be executed under surrounding physical and social constraints. We present Social-WM, an efficient latent world-model planning framework trained from egocentric RGB video sequences. Our key observation is that social-navigation experience contains a systematic discrepancy between the nominal action and the realizable action: a nominal forward action may be fully executed in free space, but needs to be constrained when heading towards a pedestrian or obstacle. Social-WM learns these safety-relevant consequences directly through action-conditioned future prediction, where the target is the actual observed future following each command. We further introduce a realizable inverse-dynamics objective that associates observed latent transitions with the action actually realized rather than the nominal one. At deployment, candidate actions are imagined through the latent world model, and the inverse dynamics model estimates their realizability; nominal--realizable discrepancy then provides a safety signal before execution. The learned dynamics and realizability model remain goal-independent and support both position- and image-goal navigation. On Social-HM3D, Social-WM achieves 63.77% success while reducing human collisions to 21.67%, and maintains strong performance under zero-shot transfer to Social-MP3D, without explicit pedestrian tracking, privileged human state, or online reinforcement learning.", "pdf_url": "https://arxiv.org/pdf/2609.40177v1"}, {"title": "PrefPI: Preference-Guided Steering into Out-of-Distribution Behaviors", "authors": ["Seungeun Rho", "Wontaek Kim", "Danfei Xu", "Sehoon Ha"], "published": "2026-09-30", "summary": "We present PrefPI (Preference-Guided Policy Iteration), an iterative framework for steering pretrained generative robot policies using only relative preferences over self-generated trajectories. Unlike prior preference-learning methods that primarily sharpen modes already represented by the policy, we study steering beyond the initial effective support, where desired behaviors are rarely or never observed under the initial policy. Our key idea is to formulate preference learning as preference-conditioned generative modeling: preferred trajectories define a conditional distribution, whose density ratio with the broader behavior prior provides an implicit preference signal amplified by classifier-free guidance (CFG). Repeating this preference-conditioned modeling and guidance step yields a form of preference-guided policy iteration, turning incremental improvements toward previously inaccessible behaviors. Across diffusion policies and the PI0.5 flow- matching VLA in simulation and the real world, PrefPI produces substantial behavioral shifts with limited feedback. In particular, PrefPI increases object transport height from 10.7 cm to 19.8 cm on real hardware with only 150 preference-labeled trajectories.", "pdf_url": "https://arxiv.org/pdf/2609.40165v1"}, {"title": "Rethinking Legibility in Social Robot Hallway Navigation: Impact of Intent Representation and Human Distraction", "authors": ["Pranav Goyal", "Andrew Stratton", "Christoforos Mavrogiannis"], "published": "2026-09-30", "summary": "We focus on legible robot motion generation in social navigation settings. Legibility in human-robot interaction (HRI) is often described as the property of robot motion that enables an observer to confidently infer the robot's intent. While mature frameworks exist for generating legible motion in front of static observers, social robot navigation presents a new challenge: the robot must clearly convey its intent while ensuring human safety in dynamic pedestrian environments where human attention is often divided. With the goal of enabling robots to generate legible motion in dynamic and constrained spaces, we investigate how the choice of representation and the level of human attention shape navigation performance and human impressions. Focusing on the ubiquitous and demanding scenario of hallway navigation, we conduct two controlled user studies involving alternative legibility formulations implemented within a shared model predictive control framework. Study 1 (N = 45) investigates the role of intent representation, showing that passing-side legibility, particularly when adaptively updated, leads to smoother human motion and is perceived as more competent and less mentally and physically demanding than destination-based and non-legible baselines. Study 2 (N = 45) examines the effect of pedestrian attention, demonstrating that legible motion allows for smooth human motion even under distraction, even if this is not consistently reflected in subjective ratings. Together, these findings suggest that effective legible motion in social robot navigation benefits from interaction-level intent representations that support coordination, with some effects persisting even when human attention is divided. Code is available at https://github.com/fluentrobotics/Legible_MPPI.", "pdf_url": "https://arxiv.org/pdf/2609.40158v1"}, {"title": "Dream4ACT: A Shared Visual Action Interface for Multi-Embodiment Video-Action Modeling", "authors": ["Xiangyu Zhu", "Jin Xu", "Yue Guo", "Xin Wu", "Yifan Sun", "Xiancong Ren", "Jianxin Sun", "Yong Dai", "Xiaozhu Ju"], "published": "2026-09-30", "summary": "Video generation models (VGMs) offer strong spatiotemporal priors for embodied observation--action modeling. However, joint-space action vectors lack explicit image-space structure and vary in dimensionality and semantics across embodiments, making it challenging to directly leverage the rich spatiotemporal priors of VGMs. End-effector visualizations provide an alternative but do not specify the full articulated configuration needed for robot execution. We present Dream4ACT, a world model built for joint video-action modeling across embodiments. To unify action representations across embodiments, we introduce a shared visual action interface, called action views, which render target joint configurations from four prescribed virtual cameras using URDF-based forward kinematics. This shared visual representation preserves embodiment-specific articulated geometry while allowing observation and action sequences to share a video autoencoder and diffusion transformer. Through masked flow-matching, our model supports forward dynamics, inverse dynamics, and joint observation--action generation within a single jointly trained model by varying which future sequences are corrupted. To recover executable action sequences from predicted action views, we propose a training-free, URDF-constrained multiview recovery mechanism, without a learned embodiment-specific decoder. Dream4ACT achieves an average success rate of 88.98\\% on RoboTwin~2.0 and an overall score of 65.66 on TriWorldBench, supporting effective closed-loop manipulation and competitive action-conditioned multiview prediction through the visual action interface.", "pdf_url": "https://arxiv.org/pdf/2609.40153v1"}, {"title": "Game-Guided Skill Discovery through Self-Play for Playable Agent Control", "authors": ["Seungeun Rho", "Jeonghwan Kim", "Xue Bin Peng", "Sehoon Ha"], "published": "2026-09-30", "summary": "We present Game-Guided Skill Discovery (GGSD), a framework that uses self-play in games to discover motor skills that are directly playable by humans. Playable skills provide a compact abstraction for controlling embodied agents through a small set of learned behaviors rather than low-level actions. To be effective, these skills should be semantically distinct, interpretable, and expressive; properties that existing unsupervised skill-discovery methods often fail to achieve simultaneously. GGSD achieves these desiderata by grounding skill discovery in competitive gameplay. A hierarchical agent competes against its past selves, with a high-level policy selecting from a small discrete skill set and a skill-conditioned low-level policy learning the corresponding behaviors. After training, a human can replace the high-level policy and directly control the agent through the same discrete skills. Despite the small number of high-level actions, skill transitions give rise to emergent combo behaviors, expanding expressivity beyond individual primitives. Across Ant, Franka-arm, and Unitree G1 environments, we show that GGSD produces human-playable skills that humans can compose to solve unseen tasks, such as Maze and CubePush, without additional training. An interactive demo is available at https://ggsd-demo.github.io.", "pdf_url": "https://arxiv.org/pdf/2609.40137v1"}, {"title": "Tactile Curiosity Drives Robot Interaction", "authors": ["Klemens Iten", "Alexander Proshkin", "Bhavya Sukhija", "Stelian Coros", "Andreas Krause", "Pieter Abbeel", "Carmelo Sferrazza"], "published": "2026-09-30", "summary": "Mastering robot manipulation skills via reinforcement learning (RL) remains largely sample-inefficient. The most common RL algorithms rely on random action sampling to discover new strategies, resulting in agents that allocate most of their training budget to motions in free space, away from the contacts from which manipulation skills emerge. Existing intrinsic motivation methods based on model disagreement or epistemic uncertainty improve on isotropic noise, but they can also reward uncertainty in functionally irrelevant transitions, such as erratic motions in free space. In this work, we argue that tactile feedback provides a natural signal for exploration, and introduce TacEx, a framework that incorporates touch into epistemic uncertainty-driven exploration by decomposing model uncertainty across sensory modalities and directing curiosity toward the tactile channel. By anchoring curiosity to the sense of touch, TacEx drives the robot to discover complex contact dynamics, learning to manipulate and grasp objects without task rewards or expert demonstrations during exploration. The interaction-dense dataset collected through this tactile-driven curiosity supports offline learning of downstream pick-and-place policies without additional environment interaction. We further use tactile-driven exploration to post-train vision-language-action (VLA) models. Although the VLAs are initially pre-trained without tactile feedback, post-training with TacEx substantially improves downstream performance while remaining highly sample-efficient.", "pdf_url": "https://arxiv.org/pdf/2609.40134v1"}, {"title": "Passive Stiffness Shaping in Cable-Suspended Aerial Manipulation via Movable Compliant Anchors", "authors": ["Antonio Franchi", "Amr Afifi"], "published": "2026-09-30", "summary": "Cable-suspended aerial manipulation offers a lightweight architecture for cooperative transportation and physical interaction, yet the passive mechanical response perceived at the load remains insufficiently understood and systematically exploited. This work interprets aerial vehicles as movable compliant anchors and develops a gravity-aware quasi-static theory for predicting and shaping the passive Cartesian stiffness of a suspended load. The formulation applies to an arbitrary number of aerial vehicles connected to a point load by taut, straight, inextensible cables. At a selected gravity-loaded equilibrium, aerial-anchor compliance and transverse cable geometric compliance combine in series within each leg, while the leg stiffnesses act in parallel on the load. For isotropic aerial-anchor behavior, each leg is exactly equivalent to a virtual unilateral elastic cable, revealing an axial--transverse stiffness decomposition governed by the equilibrium tension. These results define a nonlinear map from commanded-anchor configuration to passive load stiffness, whose differential enables local constraint-preserving shaping through anchor repositioning. A dynamic rigid-body validation framework with nonlinear vehicle control, elastic-damped tendons, and environmental contact is defined to assess when and to what extent the derived stiffness remains predictive beyond the assumptions of the analytical model.", "pdf_url": "https://arxiv.org/pdf/2609.40102v1"}, {"title": "BatSLAM 2.0: Sequence-Verified Sonar Place Recognition in a Robust Pose Graph", "authors": ["Jan Steckel"], "published": "2026-09-30", "summary": "Echolocating bats can navigate dark and cluttered spaces using echolocation. Over a decade ago, BatSLAM showed that a robot with a biomimetic binaural sonar can build a topological map of the environment, by recognizing places from the received acoustic signals. Sonar place recognition, however, is ambiguous by nature: corridors produce nearly identical echo trains, and wrong loop closure can collapse the topological map. In this paper, we introduce BatSLAM 2.0, a novel sonar-only SLAM system built from three elements: an updated acoustic front-end, a sequence verifier that tracks and verifies loop closure candidates and a pose graph implemented on a high performance factor graph framework. The system was thoroughly evaluated both in simulated as well as real world recordings. In both cases, the BatSLAM2.0 algorithm shows the capability of robust topological map creation, countering map collapse, and robust scaling of map size.", "pdf_url": "https://arxiv.org/pdf/2609.40085v1"}, {"title": "Tissue Detection Determines False Positives in Diffusion-Based Histopathology Artifact Detection", "authors": ["Konstantinos Moutselos", "Ilias Maglogiannis"], "published": "2026-09-30", "summary": "One-class artifact detectors for whole-slide images learn normal tissue from a clean training pool and flag departures from it. The pool is built by a preprocessing pipeline whose tissue-detection step is usually treated as neutral. We tested whether it is. On 16 annotated TCGA slides, we rebuilt the clean pool of a diffusion-based detector with different tissue detection methods and compared the resulting models in a four-fold cross-validation. Per-slide saturation-Otsu detection excluded normal tissue, chiefly tissue with large clear spaces such as adipose tissue and alveolar parenchyma, and on slides with thick marker ink kept the ink while excluding ordinary tissue. Replacing it with entropy-based detection reduced the false-positive fraction on held-out clean slides from 0.102 to 0.016, in every fold and with a second training seed, without loss of sensitivity; the gain came from the composition of the pool, not its size. Across three tissue detection methods, false positives followed the fraction of such clear-space tissue in the pool, a statistic that needs no labels or training (0.103, 0.016 and 0.009). The effect did not carry over at the same size to a nearest-neighbour detector on foundation-model features. On an external cohort, the curated pool lowered clean-control false positives by about 20%, far less than within TCGA, and the remaining cross-center loss was not explained by stain differences. For one-class quality control, tissue detection decides what the model learns as normal and should be chosen and reported accordingly.", "pdf_url": "https://arxiv.org/pdf/2609.40083v1"}, {"title": "Grounding Time-Series Foundation Models in Digital Twin Topology for Predictive Maintenance", "authors": ["Sizhe Ma", "Katherine A. Flanigan", "Mario Bergés"], "published": "2026-09-30", "summary": "Digital twins increasingly support downstream analytical tasks that depend on time-series data, motivating interest in time-series foundation models (TSFMs) as scalable backbones. However, TSFMs are primarily pretrained for temporal continuation and often underperform on unseen tasks such as regression, and systematic empirical comparisons against state-of-the-art dedicated models in digital twin contexts remain limited. This paper makes three contributions. First, we benchmark five well-known TSFMs with frozen backbones on remaining useful life (RUL) prediction using the C-MAPSS dataset, finding that multivariate architectures substantially outperform univariate ones, particularly under varying operating conditions. This raises a deeper question: when cross-channel dependencies can be modeled through pretrained weights, target-task adaptation, and digital twin-derived representations, how much does each contribute, and are they complementary? Second, we propose a topology-informed fusion approach in which topological constraints, derived from the asset structure the digital twin stores among its information models, explicitly shape cross-attention, so that fused representations respect the physical system's local connectivity rather than relying on unconstrained all-to-all interactions. Third, we conduct an ablation study across C-MAPSS subsets of varying operational complexity that isolates the three sources and their interactions. The sources prove complementary rather than redundant, and topology-constrained attention outperforms unconstrained fusion, though by a small margin, enabling a frozen TSFM informed by digital twin representations to remain competitive or in some cases exceed state-of-the-art performance on this regression task.", "pdf_url": "https://arxiv.org/pdf/2609.40071v1"}, {"title": "A latent-space extrapolation grade built into graph atomic cluster expansion foundation potentials", "authors": ["Yury Lysogorskiy", "Anton Bochkarev", "Ralf Drautz"], "published": "2026-09-30", "summary": "Foundation machine-learning interatomic potentials cover broad configurational and chemical spaces, but their reliability can vary across the atomic environments encountered during a simulation. Here we introduce the calibrated Mahalanobis (CALM) extrapolation grade $γ$, a piecewise differentiable per-atom quantity integrated into GRACE foundation models and evaluated alongside energies and forces in a single model pass. We define $γ$ from nearest-cluster Mahalanobis distances in latent feature space, setting $γ=1$ from the training-distance distribution separately for each element and cluster. Controlled tests show that a normalized random projection of the invariant many-body basis detects structural and chemical extrapolation. On different foundation datasets, OMat24 and SMAX, $γ$ correlates with atomic force errors and separates structures with different error distributions. The CALM grade adds percent-level computational cost, and its spatial gradient guides uncertainty-biased data collection toward configurations with larger absolute force errors.", "pdf_url": "https://arxiv.org/pdf/2609.40060v1"}, {"title": "Enhancing Autoregressive Video Generation via Representation Adversarial Distillation", "authors": ["Fangyu Lin", "Xingtong Ge", "Lunjie Zhu", "Yi Zhang", "Zhening Liu", "Tianhang Wang", "Mengfei Li", "Yumeng Zhang", "Guanglu Song", "Yu Liu", "Jun Zhang"], "published": "2026-09-30", "summary": "Few-step autoregressive video generation enables efficient streaming synthesis, but errors introduced in early temporal blocks are reused as context and can propagate through subsequent rollouts, leading to detail degradation, structural drift, and unstable motion. Existing distribution matching distillation (DMD) primarily aligns student and teacher distributions in diffusion latent space, but provides no direct supervision over the perceptual quality of decoded videos. We introduce Radian, a representation-space adversarial distillation framework that complements on-policy DMD with real-data adversarial supervision in the feature space defined by a frozen visual foundation model (VFM). During training, Radian sparsely decodes frames from autoregressive student rollouts, e
