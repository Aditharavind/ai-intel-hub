output) and FSP3200-21HE (54V output). Designed specifically for next-generation data centers, edge AI servers, and high-density workstations, FSP&#8217;s dual-voltage architecture (12V &#38; &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/fsp-launches-next-gen-3200w-crps-power-solutions-to-fully-power-ai-edge-and-next-generation-data-centers/\">Read More &#8594;<span class=\"screen-reader-text\"> \"FSP Launches Next-Gen 3200W CRPS Power Solutions to Fully Power AI Edge and Next-Generation Data Centers\"<\/span><\/a>"}, {"title": "OMC introduces new high-performance laboratory-grade polish finish for its industrial fibre optic cables", "source": "EE Journal", "date": "2026-08-28", "url": "https://www.eejournal.com/industry_news/omc-introduces-new-high-performance-laboratory-grade-polish-finish-for-its-industrial-fibre-optic-cables/", "summary": "OMC, a pioneer in optoelectronics design &#38; manufacture, has introduced a new ultra-performance laboratory-grade polish finish for its industrial fibre optic cables and datalinks, designed to serve the most demanding applications. The use of a combination of highly skilled human operators and custom-trained, calibrated and tooled cobots has enabled a new, unprecedented quality of finish to be &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/omc-introduces-new-high-performance-laboratory-grade-polish-finish-for-its-industrial-fibre-optic-cables/\">Read More &#8594;<span class=\"screen-reader-text\"> \"OMC introduces new high-performance laboratory-grade polish finish for its industrial fibre optic cables\"<\/span><\/a>"}, {"title": "STL takes a major leap towards Decarbonisation; enabling Eco-friendly product portfolio by transitioning to 100% ‘Green power’", "source": "EE Journal", "date": "2026-08-28", "url": "https://www.eejournal.com/industry_news/stl-takes-a-major-leap-towards-decarbonisation-enabling-eco-friendly-product-portfolio-by-transitioning-to-100-green-power/", "summary": "Reduction of ~80% carbon emission for G.657.A2 Fibre to 0.9 Kg from 4.7Kg Transition of key manufacturing facilities in India to 100% ‘Green Power’ energy source Shift to 100% Green Hydrogen manufacturing in India  STL [NSE: STLTECH], a leading connectivity solutions provider for AI-ready digital infrastructure, today announced significant progress on its journey towards decarbonisation and its Net-Zero ambitions. Transitioning to 100% Green Power &#8211; STL, recently, has moved &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/stl-takes-a-major-leap-towards-decarbonisation-enabling-eco-friendly-product-portfolio-by-transitioning-to-100-green-power/\">Read More &#8594;<span class=\"screen-reader-text\"> \"STL takes a major leap towards Decarbonisation; enabling Eco-friendly product portfolio by transitioning to 100% ‘Green power’\"<\/span><\/a>"}, {"title": "From Lab to Battlefield: Navigating Hardware, TRLs, and the Edge in Defense", "source": "EE Journal", "date": "2026-08-28", "url": "https://www.eejournal.com/fish_fry/from-lab-to-battlefield-navigating-hardware-trls-and-the-edge-in-defense/", "summary": "<img alt=\"\" class=\"webfeedsFeaturedVisual wp-post-image\" height=\"300\" src=\"https://www.eejournal.com/wp-content/uploads/2026/08/AD-082826-300x300.jpg\" style=\"display: block; margin-bottom: 5px; clear: both;\" width=\"300\" />My podcast guest this week is David Jedynak, Vice President of Strategic Planning at Curtiss-Wright Defense Solutions. David and I chat about the complexities of &#8220;New Defense&#8221; innovation and what founders must understand about translating tech to the tactical environment. We also examine the similarities and differences between the defense sector and the tech industry &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/fish_fry/from-lab-to-battlefield-navigating-hardware-trls-and-the-edge-in-defense/\">Read More &#8594;<span class=\"screen-reader-text\"> \"From Lab to Battlefield: Navigating Hardware, TRLs, and the Edge in Defense\"<\/span><\/a>"}, {"title": "Engineering Embedded Systems for Aerospace and Defense", "source": "Embedded.com", "date": "2026-08-27", "url": "https://www.embedded.com/engineering-embedded-systems-for-aerospace-and-defense/", "summary": "<p>For years, electronics for military and aerospace applications have been built around hardware that could tolerate harsh environments far beyond those encountered by commercial and industrial machinery. Such systems include satellites, planetary rovers, combat vehicles, naval platforms, avionics, and electronic warfare equipment. Ruggedized packaging, military-grade components, and rigorous qualification testing ensured that systems remained operational [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/engineering-embedded-systems-for-aerospace-and-defense/\">Engineering Embedded Systems for Aerospace and Defense<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "RAIN Alliance Launches RFID Sensor Working Group", "source": "Embedded.com", "date": "2026-08-27", "url": "https://www.embedded.com/rain-alliance-launches-rfid-sensor-working-group/", "summary": "<p>The RAIN Alliance has established a new RFID Sensor Working Group to support the development and adoption of sensor-enabled RAIN RFID technologies. The group will bring together technology providers, end users, and industry stakeholders to address emerging applications, deployment challenges, and standards requirements across industrial IoT, asset management, and digital product passport (DPP) use cases. [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/rain-alliance-launches-rfid-sensor-working-group/\">RAIN Alliance Launches RFID Sensor Working Group<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "Infineon supplies silicon carbide technology to Fox ESS, enhancing efficiency of residential energy storage systems", "source": "EE Journal", "date": "2026-08-27", "url": "https://www.eejournal.com/industry_news/infineon-supplies-silicon-carbide-technology-to-fox-ess-enhancing-efficiency-of-residential-energy-storage-systems/", "summary": "Infineon Technologies AG (FSE: IFX / OTCQX: IFNNY) supplies silicon carbide (SiC) power semiconductors to Fox ESS, a leading provider of renewable energy solutions, to enhance the efficiency of its residential energy storage systems (ESS). Leveraging Infineon&#8217;s CoolSiC™ MOSFETs 1200 V G2 in the Q-DPAK package, Fox ESS has reduced switching losses by 70 percent. &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/infineon-supplies-silicon-carbide-technology-to-fox-ess-enhancing-efficiency-of-residential-energy-storage-systems/\">Read More &#8594;<span class=\"screen-reader-text\"> \"Infineon supplies silicon carbide technology to Fox ESS, enhancing efficiency of residential energy storage systems\"<\/span><\/a>"}, {"title": "Altera Expands Agilex 9 Direct RF FPGA Ecosystem for Defense", "source": "Embedded.com", "date": "2026-08-26", "url": "https://www.embedded.com/altera-expands-agilex-9-direct-rf-fpga-ecosystem-for-defense/", "summary": "<p>Altera Corp. has recently expanded its Agilex 9 Direct RF FPGA ecosystem through collaborations with Mercury Systems and VadaTech, introducing commercial off-the-shelf (COTS) solutions for next-generation defense platforms. The partnerships combine Agilex 9 medium-band Direct RF FPGAs with open-architecture hardware to help defense system developers reduce size, weight, power, and cost; shorten development cycles; and deploy more [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/altera-expands-agilex-9-direct-rf-fpga-ecosystem-for-defense/\">Altera Expands Agilex 9 Direct RF FPGA Ecosystem for Defense<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}], "papers": [{"title": "Facet-0: A Robotic Foundation Model for Contact-Rich Precise Manipulation", "authors": ["Haoyuan Deng", "Haichao Liu", "Wenkai Guo", "Yuan Ling", "Zaijia Yang", "Yuanjiang Xue", "Haosheng Sun", "Liangzi Wang", "Ziwei Wang"], "published": "2026-09-01", "summary": "Real-world robotic assembly at sub-millimeter tolerances demands spatial precision, compliant interaction, and robustness to contact failures. We present Facet-0, a robotic foundation model that predicts and values the contact consequences of its actions. Facet-0 unifies multimodal representation learning and reinforcement learning (RL) post-training around a joint action-wrench proposal: a causal wrench history is aligned with vision-language semantics and kinematic state, and flow matching generates each action chunk together with the future wrist-wrench profile it is expected to induce. Deployment rollouts train a distributional Action-Wrench Critic to distinguish motions with similar task progress but different contact outcomes, while phase-aware rewards and contact-selective credit concentrate policy improvement on decisive interactions. To accommodate part-specific dynamics, a lightweight bounded actor reuses the frozen representation for on-robot adaptation; RL remains defined over executable Cartesian actions, while an auxiliary wrench head preserves predictive, non-commanded action-contact coupling. Trained on ManuFacet-1K, a 1,000-hour force-synchronized corpus spanning three embodiments and multiple manufacturing cells, the bounded task-adapted system reaches 82% mean success on five sub-millimeter computer-assembly tasks, compared with 15% for the strongest baseline, with 0.5 mm placement accuracy and 50 ms command latency.", "pdf_url": "https://arxiv.org/pdf/2609.01596v1"}, {"title": "SG-AMP: Scene-Graph-Guided Active Perception and Semantics-Aware Motion Planning for Pepper Plants", "authors": ["Rohit Menon", "Shiva Rudra Lolla", "Niklas Mueller-Goldingen", "Gokul Chenchani", "Ribana Roscher", "Maren Bennewitz"], "published": "2026-09-01", "summary": "We present SG-AMP, integrating robust depth completion with input-conditioned uncertainty, persistent panoptic mapping, plant scene-graph reasoning, and semantics-aware active view-motion planning. Beyond inspecting uncertain observed regions, the scene graph explicitly hypothesizes unobserved pepper--peduncle attachments and directs close-range sensing toward them. Candidate views are selected according to expected information gain, while class-dependent motion costs distinguish protected peppers, peduncles, and stems from conditionally traversable foliage. On pepper data, the perception network achieves $55.27\\%$ semantic mIoU, $38.67\\%$ PQ, and $40.62\\,\\mathrm{mm}$ depth RMSE, while input-conditioned uncertainty improves NYUv2 NLL from $-1.6518$ to $-1.6925$ and AUSE from $0.0102$ to $0.0087$.", "pdf_url": "https://arxiv.org/pdf/2609.01579v1"}, {"title": "H3-World: Turning Language Understanding into World Control", "authors": ["Danze Chen", "Zeqing Wang", "Ziyue Lin", "Xingyi Yang", "Yeying Jin"], "published": "2026-09-01", "summary": "We present H3-World, an efficient framework that turns the 33B MiniMax-H3 video generator into an interactive world model. Our key finding is that, as large video generators become more capable, language is emerging as a natural interface for control. MiniMax-H3, for example, already supports zero-shot control of character behavior and camera motion through natural-language instructions. Building on this, H3-World turns this coarse language interface into precise, temporally grounded world control, without introducing dedicated action modules. Specifically, we represent each action as a structured combination of character and camera instructions, and align them with the corresponding temporal video latents. To make the control temporally precise, we further introduce temporal attention routing, which restricts each instruction to its intended time interval and reduces control leakage across actions. Importantly, H3-World directly reuses the semantic representations learned during large-scale video pretraining and requires only lightweight adaptation. With only 8,000 gameplay samples, 10,000 LoRA optimization steps, and 0.199% trainable parameters, H3-World achieves effective character and camera control while preserving strong generation quality. It also generalizes to unseen scenarios. These results show that the control capabilities emerging in large video generators can be efficiently transformed into interactive world control.", "pdf_url": "https://arxiv.org/pdf/2609.01560v1"}, {"title": "What, Where, and How: Probing Spatiotemporal Representations in Video Foundation Models", "authors": ["Sharon S. Musa", "Fereshteh Forghani", "Harrish Thasarathan", "Sonia Joseph", "Matthew Kowal", "Konstantinos G. Derpanis"], "published": "2026-09-01", "summary": "Self-supervised video foundation models learn rich spatiotemporal representations, yet it remains unclear what visual concepts these representations encode, where they emerge across transformer layers, and how they are geometrically organized. In this work, we tackle these three questions through a systematic layer-wise analysis of V-JEPA 2 and VideoMAE-v2. We leverage lightweight probes trained to discover three temporally grounded properties: (i) camera motion understanding, (ii) intuitive physics, and (iii) anomaly detection. Both models encode camera motion, with best results ($>90$ ROC AUC) emerging at 60-70% of network depth, and achieve moderate anomaly detection performance ($>60$ ROC AUC), but remain near chance on intuitive-physics tasks, suggesting a limited encoding of deeper physical reasoning. Beyond classification, we find that temporal features from individual videos form smooth low-dimensional trajectories in representation space, suggesting that camera motion is not only linearly decodable but also geometrically organized. Based on these results, we apply geometry-aware spline-based steering in the model's latent representations to interpolate camera motion, yielding steered videos with smoother trajectories and more coherent temporal progression than linear interpolation.", "pdf_url": "https://arxiv.org/pdf/2609.01551v1"}, {"title": "A System for Fast, Resilient, and Adaptable Loco-Manipulation Behaviors on Humanoid Robots", "authors": ["Duncan Calvert", "Luigi Penco", "Dexton Anderson", "Tomasz Bialek", "Arghya Chatterjee", "Beomyeong Park", "Robert Griffin"], "published": "2026-09-01", "summary": "There is tremendous value in humanoid robots taking on physically demanding, hazardous, and repetitive work in spaces built for humans. However, a useful robot for these spaces must coordinate locomotion, whole-body motion, perception, contact, and operator supervision. We present a robot-local, runtime-editable behavior authoring and runtime system that addresses these challenges. We argue that behavior architecture can be a primary enabler of capability, speed, and reliability, and that runtime editability enables fast behavior creation, adaptation, extension, and combination. Our behavior architecture combines object-centric Affordance Templates, a tree structure that provides organization and logic, and runtime-editable perception through a behavior scene and primitive scene actions. Our operator interface remains continuously synchronized to the robot for runtime authoring, monitoring, and repair. Action primitives execute through a whole-body controller that supports concurrent body motions and walking. Demonstrations of our system cover six task variants on Unitree H1-2 and Alex. We execute a push door traversal in 34 seconds and sort six balls by color in 45 seconds under human disturbance. Timed authoring sessions show scratch creation of new loco-manipulation behaviors and adaptation of existing ones in hours. Comparison against the literature finds our approach to be competitive with recent learned systems.", "pdf_url": "https://arxiv.org/pdf/2609.01518v1"}, {"title": "Better Situational Awareness in AR-HRC? A Comparative Study of Augmented Reality and Mobile Interfaces for Human-Robot Collaboration", "authors": ["Zhehan Qu", "Christian Fronk", "Jaewoong Jeong", "Pavel Manakhov", "Maria Gorlatova"], "published": "2026-09-01", "summary": "Augmented reality (AR) facilitates human-robot collaboration (HRC) by enabling in-situ spatial visualizations of the robot and the joint task. However, in safety-critical HRC scenarios such as search-and-rescue, spatial visualizations may also reshape visual attention in ways that create competing situational awareness (SA) demands, potentially introducing new safety concerns. While prior AR-HRC work suggests potential benefits for SA, rigorous evaluations that jointly consider robot and environmental awareness across multiple levels of SA remain limited. We address this through a between-subjects study with 30 participants comparing custom AR and mobile interfaces presenting equivalent information, measuring robot and environmental SA with the Situation Awareness Global Assessment Technique (SAGAT) across all three levels, with concurrent eye tracking to identify the attentional mechanisms underlying any SA differences. Both interfaces achieved high usability; relative to the mobile baseline, AR improved perception-level awareness of the robot but yielded no gains in higher-level robot awareness or in environmental awareness at any level. Gaze analysis explained this: AR freed attention from the map, but that attention was re-invested in the conformal visuals rather than the physical environment. Freeing the eyes from a screen is not the same as directing them to the world, a distinction AR interfaces for safety-critical HRC must design around.", "pdf_url": "https://arxiv.org/pdf/2609.01461v1"}, {"title": "Does Imitation Learning Preserve Temporal Robustness in Dexterous Manipulation? An Expert-Learner Comparison Across Task Execution Speeds", "authors": ["Clinton Enwerem", "John S. Baras", "Calin Belta"], "published": "2026-09-01", "summary": "Dexterous manipulation policies learned by imitation are typically evaluated for robustness to variation in scenes, objects, or instructions, but their performance across task execution speeds is less often examined. This leaves open how much temporal robustness a learner retains relative to the expert it imitates. We compare an expert and learner under the same task conditions, initial-condition draws, and speedup factors. We instantiate the evaluation in ParcelStow, a contact-rich task in which the robot acquires, reorients, and inserts a parcel. The demonstrations span the speedup range for the manipulation phases after parcel acquisition. A scripted expert and an Action Chunking with Transformers (ACT) policy trained from the expert's demonstrations both achieve 100 percent task success at nominal speed. Their success rates diverge within the demonstrated range: at its maximum, expert success is 84 percent and ACT success is 53 percent. Two ACT policies with different parameter initializations show similar degradation, decreasing by 34 and 48 percentage points from nominal speed to the maximum demonstrated speed, compared with 16 points for the expert. Stage-level analysis shows that 35 of ACT's 47 failures at the maximum demonstrated speed are insertion misalignments. Under the relative-motion handoff, every ACT acquisition retains the parcel through reorientation and transfer in free space, but only 64 percent complete the overall task, compared with 95 percent after expert acquisition. Across all evaluated policies and speeds, none of the 414 acquisitions without force closure completes the task. Equal nominal task success therefore does not imply preservation of expert performance across execution speeds. Code, data, and evaluation scripts are available at https://github.com/coenwerem/parcelstow.", "pdf_url": "https://arxiv.org/pdf/2609.01453v1"}, {"title": "Vision-Based Leader-Follower Formation Control for Cooperative UAVs in GPS-Degraded Environments", "authors": ["Deekshitha Angadi", "Naveena Budda", "Vikas Agarwal", "Rojesh Arunkumar Mulasa", "Ravi Killamsetty", "Mohamed Samshad", "Narsimlu Kemsaram"], "published": "2026-09-01", "summary": "Cooperation in multi-UAV systems requires reliable relative perception so that follower vehicles can maintain formation and continue their mission safely even when absolute positioning sensors degrade or fail. This paper presents a vision-based cooperative formation framework running on a follower UAV that uses a front-facing RGB-D camera to detect, track, and localize a leader UAV in real-time. A lightweight YOLO-based detector is trained on a dedicated drone dataset and deployed onboard to predict leader bounding boxes, which are then fused with depth information via a pinhole camera model to estimate the leader's relative pose. These estimates provide a leader-follower position controller and can also be used as a backup when GPS or external localization is unavailable. This framework is implemented as a set of ROS nodes and evaluated in a physics-based multi-UAV simulation built on XTDrone, with sensor noise and communication dropouts. We evaluate detection accuracy, runtime, and formation-keeping error under nominal conditions and under simulated failures of the positioning sensors. The results show that the proposed framework maintains stable leader-follower formations with reasonable computational cost and provides a practical basis for extending vision-based cooperative formation control to real-world multi-UAV systems.", "pdf_url": "https://arxiv.org/pdf/2609.01420v1"}, {"title": "Provably Safe Sim-to-Real Transfer", "authors": ["Tingting Ni", "Maryam Kamgarpour"], "published": "2026-09-01", "summary": "To mitigate the sample complexity of real-world reinforcement learning (RL), a common practice is to first train a policy in a simulator, where samples are cheap, and then deploy the learned policy in the real world with the hope that it generalizes effectively. Such direct sim-to-real transfer is not guaranteed to succeed: simulator-trained policies can be suboptimal in the real world due to sim-to-real mismatch. Correcting this mismatch requires collecting data from the real system, but in many applications, such as robotics and healthcare, this data-collection process is itself subject to safety constraints. This gives rise to the problem of safe sim-to-real transfer: how can an agent exploit an imperfect simulator while ensuring safe real-world data collection and learning a near-optimal feasible policy for the target system? We address this problem by formulating safe sim-to-real transfer within the framework of reward-free safe RL. We design a computationally efficient algorithm that exploits simulator information to provably reduce real-world interaction while ensuring safe exploration and enabling the computation of a near-optimal feasible policy for any potential reward function. Our real-world sample complexity bound characterizes the benefit of using the simulator in terms of the sim-to-real mismatch.", "pdf_url": "https://arxiv.org/pdf/2609.01418v1"}, {"title": "Neuro-Symbolic Geometric Abstraction (NeuSOGA): From Observations to Symbolic Mathematical Representations", "authors": ["Qingde Li", "Qingqi Hong", "Jie Tian"], "published": "2026-09-01", "summary": "A fundamental challenge in artificial intelligence is the transformation of observations into explicit symbolic representations suitable for abstraction, interpretation, and reasoning. While modern AI systems achieve remarkable perceptual capabilities through large-scale statistical learning, the resulting knowledge is typically encoded within latent parameters that are difficult to inspect or manipulate analytically. Inspired by Neuro-Symbolic AI and theories of human abstraction, this paper investigates the formation of symbolic mathematical representations from geometric observations. We propose NeuSOGA (Neuro-Symbolic Geometric Abstraction), a framework that progressively transforms observations into topological abstractions, geometric abstractions, and ultimately symbolic mathematical representations. The architecture combines topology-guided structural discovery using Euclidean Distance Transforms, foundation-model perception using Segment Anything, adaptive multi-scale geometric abstraction, and symbolic synthesis through Implicit Area Splines. The resulting representation is an analytical implicit model supporting arbitrary-order smoothness, additive composition, and closed-form evaluation. Unlike neural latent encodings, the generated representation remains interpretable, editable, and mathematically explicit. Experiments on ModelNet40 point clouds, arbitrary-view projections, and segmented optical observations demonstrate that NeuSOGA transforms diverse observations into compact symbolic representations while preserving essential geometric and topological structure across sensing modalities and viewing directions. NeuSOGA provides an interpretable and explainable pathway from observation to symbol and establishes", "pdf_url": "https://arxiv.org/pdf/2609.01408v1"}, {"title": "Evaluating Multimodal LLMs as Generalist Vision-Language-Action Agents for Drone Control: Commanding, Approaching, Tracking and Searching", "authors": ["Jaewoo Park", "Minyoung Lee", "Sukmin Seo", "Moonbin Yim", "Hyunwook Yoon", "Dohoon Ryu", "Daehee Kim", "Myungseo Song", "Jihyuk Byun", "Seunggyu Chang", "Taeho Kil", "Jiseob Kim", "Bado Lee", "Geewook Kim"], "published": "2026-09-01", "summary": "Multimodal Large Language Models (MLLMs) are strong perceivers of images and video. We ask how far that reach extends into acting: dropping an MLLM directly into a drone's control loop, with its entire action space declared solely in the prompt. Recent systems approach this setting but increasingly narrow the model's decision-making. We widen it back. We introduce DroneCATS-Agent, an architecture where the MLLM is a swappable component, and DroneCATS, a benchmark treating the model as the independent variable. Beyond merely flying toward a pixel, our agent entrusts the model to yaw and search, deliberate when unsure, and self-declare arrival---all without fine-tuning or function-calling schemas. Evaluating frontier and open models across four core capabilities---approaching a visible target, tracking a moving one, searching outside the initial view, and commanding a multi-drone fleet---reveals that even the simplest embodied settings are far from solved. Crucially, to identify what breaks first at the edge, our roster scales down to 2B parameters. The findings expose a stark paradox: it is not the flying that fails. Small open models often navigate into the success radius more reliably than frontier models, yet lose the episode by declaring arrival prematurely or not at all. Multi-drone commanding amplifies this divide, with small models failing by blindly copying a single coordinate across distinct views. Viewed as vision-language-action agents, the models' spatial perception holds up, but their action protocol does not. What separates a deployable edge model from a frontier model is not navigation, but the discipline to sustain a declared protocol and emit the correct terminating action. The open problem is closing this gap at onboard compute costs---yielding a fast model that plans persistently and knows exactly when it is done---and DroneCATS is built to measure that distance.", "pdf_url": "https://arxiv.org/pdf/2609.01404v1"}, {"title": "Autonomous robotic bridging using distributed swarm control without inter-agent communication", "authors": ["Vishwaak C. Thamaraiselvan", "Cody L. Lundberg", "Michail Theofandis", "Suhas Chelian", "Nicholas R. Gans"], "published": "2026-09-01", "summary": "We describe SCARAB--Swarm-Capable Autonomous Robotic Aquatic Bridging. Using distributed swarm control and multi-model sensing of agents and docking targets, agents can localize themselves, join into formations and proceed to desired target locations. Our technologies would eventually allow the Army to perform unpredictable, dispersed river crossings, enhance crew survivability, and minimize the logistics footprint compared to the current Improved Ribbon Bridge. Our methods operate without GPS or RF communications, though these can be used in non-contested environments (e.g., civilian disaster relief for flooding, etc.). We demonstrate our system via physics-engine-based simulation of several agents using unmanned surface vehicles (USVs) in the presence of currents and wind.", "pdf_url": "https://arxiv.org/pdf/2609.01394v1"}, {"title": "Obstacle-Aware Autonomous Coverage and Navigation for Outdoor Robots", "authors": ["Leonardo Gargani", "Matteo Frosi", "Matteo Matteucci"], "published": "2026-09-01", "summary": "Long-duration outdoor coverage with autonomous platforms remains challenging beyond classical planning: deployments face localization drift in open spaces, obstacles in cluttered sites, controller feasibility in turn-heavy maneuvers, and persistent autonomy with energy management. We propose a unified ROS 2 architecture for outdoor coverage that combines coverage planning, robust localization, and Nav2-based execution. A dual-antenna RTK-GNSS fused in an EKF keeps the robot pose, both position and heading, accurate across long missions; three controller-aware refinements are added to a mature coverage planner; a Behavior-Tree mission manager coordinates multi-goal execution, layered recovery, cost-aware goal management, and autonomous docking for return-to-charge. We validate the stack through simulation and real-world trials across multiple outdoor areas with varying geometries and obstacle densities. Overall, these results show that the proposed stack can reliably complete outdoor coverage missions across varied areas, sweeping 93.1% to 96.1% of the planned coverage area.", "pdf_url": "https://arxiv.org/pdf/2609.01384v1"}, {"title": "Scalable Rao-Blackwellized Online Planning for High-Dimensional POMDPs", "authors": ["Jiho Lee", "Nisar Ahmed", "Kyle Hollins Wray", "Zachary Sunberg"], "published": "2026-09-01", "summary": "Online planning under uncertainty remains a fundamental challenge for robotic systems operating in partially observable environments with high-dimensional state spaces. While sampling-based POMDP solvers enable approximate decision-making in large or continuous domains, their performance degrades as belief dimensionality increases due to the high variance inherent in Monte Carlo-based estimation. In this work, we extend the Rao-Blackwellized online POMDP (RB-POMDP) framework to improve its generalizability in high-dimensional settings through hybrid continuous-discrete belief representations. By analytically propagating uncertainty associated with marginalized state components during tree-based planning, the proposed approach reduces sampling-induced variance in value estimation. We demonstrate the effectiveness of this framework in a robotic search-and-rescue task by integrating it with FastSLAM 2.0. Experimental results show that the proposed planner achieves higher cumulative rewards using significantly fewer particles and planning simulations than purely sampling-based methods under equivalent computational budgets. These results suggest that structured high-dimensional robotic problems admitting tractable sufficient statistics can be effectively leveraged within the RB-POMDP framework for computationally feasible online decision-making.", "pdf_url": "https://arxiv.org/pdf/2609.01351v1"}, {"title": "Integrating Traffic Noise Emission Modelling into Variable Speed Limit Control", "authors": ["Jiawen Meng", "John Pravin Arockiasamy", "Alexey Vinel"], "published": "2026-09-01", "summary": "Road traffic noise remains a major environmental challenge, yet most speed management strategies are static and do not respond to short-term variations in traffic noise emissions. Although variable speed limit (VSL) systems are widely deployed for safety and congestion mitigation, traffic noise is rarely treated as an explicit operational control objective. This paper proposes a noise-aware VSL framework that integrates aggregated traffic-state estimation with a simplified CNOSSOS-EU-based emission indicator. A stage-based controller with time-varying reference thresholds dynamically adjusts discrete speed-limit levels in response to estimated emission conditions. The framework is evaluated using microscopic traffic simulation calibrated with empirical motorway data and replicated across multiple stochastic realisations. Over a 24-hour evaluation period, the adaptive strategy reduces the receiver-based equivalent sound level by 2.9 dB(A) relative to unrestricted traffic conditions, while maintaining an average vehicle speed approximately 11.3 km/h higher than a permanently imposed low-speed regime. Period-wise analysis shows that speed reductions are activated selectively when emission levels approach calibrated targets, rather than enforcing a constant intermediate limit. Traffic stability indicators reveal moderate increases in speed variability compared with unrestricted operation, but substantially lower braking intensity than under uniform low-speed enforcement. These results demonstrate the feasibility of integrating environmental performance indicators into operational speed control, providing a practical complement to conventional infrastructure-based noise mitigation measures.", "pdf_url": "https://arxiv.org/pdf/2609.01339v1"}, {"title": "Bandits in Prod: Hyperparameter Optimization at Inference Time", "authors": ["Louis Abraham", "Tuan-Anh Nguyen", "Nicolas Devatine"], "published": "2026-09-01", "summary": "Many production systems can assess a configuration only by using it on live requests and observing noisy feedback. Modern agentic systems are a prominent example, with inference-time choices such as model selection, retrieval depth, prompting strategy, and decoding temperature, yet often with no representative validation data. We formalize this setting as Online Hyperparameter Optimization (OHPO) and cast it as an infinitely many-armed bandit over mixed and conditional search spaces. We introduce IMABO, a general framework that combines any bandit policy for choosing among already sampled configurations with any oracle for proposing new ones. We instantiate it with IMOSS, a restart-free anytime policy whose active set grows as $t^β$, and prove an expected cumulative quantile-regret bound of $O(p_ρ^{-1/β} + T^{(1+β)/2})$, where $β\\in(0,1)$ controls active-set growth and $p_ρ$ lower-bounds the probability that a proposed configuration falls in the top-$ρ$ fraction of the search space. We combine IMOSS with three practical oracles: a Tree-structured Parzen Estimator, an incumbent-mutation oracle driven by a per-coordinate bandit, and a pretrained tabular foundation model, all three improving over the uniform random oracle baseline. IMABO obtains the lowest cumulative regret across diverse OHPO settings, from tuning classical machine-learning models to configuring LLM-based agents.", "pdf_url": "https://arxiv.org/pdf/2609.01335v1"}, {"title": "A Composable Evaluation System for Reproducible Omni-Modal Foundation Model Evaluation", "authors": ["Hodong Lee", "Sanghee Park", "Dohoon Ryu", "Jungwhan Kim", "Junyeob Kim", "Soyoon Kim", "Geewook Kim"], "published": "2026-09-01", "summary": "Building an omni-modal foundation model means evaluating it across text, image, video, and audio. Excellent evaluation toolkits exist for each modality, but their inference engines, prompt conventions, and metric implementations are mutually incompatible, so practitioners end up maintaining separate environments for every toolchain and still struggle to compare results across them. OmniEvaluator grew out of this need in our own model development: rather than reimplementing benchmarks, it connects existing inference engines and curated evaluation libraries at a higher level, exposing four inference backends, four evaluation frameworks, and over a thousand benchmarks through a single interface. Every run is recorded as an artifact capturing the full configuration for exact reproduction, and results flow into a shared dashboard for cross-model comparison. A federated mode shares GPU inference servers across concurrent evaluations, and a built-in verifier, small enough to run on CPU, keeps its score stable across engines and prompts where rule-based scoring fluctuates under configuration mismatch, matching cost-efficient commercial LLM judges without their recurring API cost. The system, demo video, and dashboard are publicly available. (https://github.com/naver-ai/omni-evaluator)", "pdf_url": "https://arxiv.org/pdf/2609.01315v1"}, {"title": "CMRVision: A Foundation Model for Cardiac MR Image Analysis", "authors": ["Athira J. Jacob", "Puneet Sharma", "Daniel Rueckert"], "published": "2026-09-01", "summary": "Cardiac magnetic resonance (CMR) imaging provides complementary information on cardiac anatomy, function, and tissue characterization across multiple sequences and views. In this work, we investigate foundation model pretraining for 2D CMR and introduce CMRVision, a CMR-specific foundation model trained using DINOv3-style self-supervised learning on a multi-center, multi-sequence cohort of 36 million CMR images. We systematically evaluate architectural and training design choices for domain-specific pretraining. CMRVision is evaluated on two downstream tasks: multi-task segmentation across cine, late gadolinium enhancement (LGE), and mapping sequences, and cine view classification. Our experiments show that CMR-specific pretraining, smaller patch sizes, and patch-level objectives consistently improve downstream performance. Across a multi-task segmentation benchmark, CMRVision achieved the strongest overall performance, outperforming prior natural-image (NI), medical-image, supervised, and CMR foundation model baselines. Improvements were modest but consistent across structures and sequences, with Dice scores ranging from 0.940-0.967 for LV and 0.855-0.905 for myocardium, and reaching 0.929 for RV, 0.920 for LA, and 0.931 for RA. The largest gains were observed for myocardium segmentation in LGE and mapping images. In a zero-shot segmentation task on unseen LGE long-axis views, the model achieved an average Dice score of 0.692, demonstrating cross-view generalization. For cine view classification, CMRVision achieved the highest average accuracy (0.906), compared to prior methods reported in the literature. These results highlight the potential of CMRVision to support robust and generalizable cardiac MRI analysis across multiple sequences and views.", "pdf_url": "https://arxiv.org/pdf/2609.01308v1"}, {"title": "EmbodiedSkills: A Unified Framework for Orchestrating, Training, and Deploying VLA Agents", "authors": ["Wei Wang", "Wenqiao Zhang", "Yutong Lin", "Yuqian Yuan", "Tianwei Lin", "Jinhao Mao", "Zhenxuan Fan", "Mingjian Gao", "Yang Dai", "Wentong Li", "Zheqi Lv", "Zheng Dong", "Yingjie Niu", "Jiaqi Zhu", "Jun Xiao", "Chao Li", "Yueting Zhuang"], "published": "2026-09-01", "summary": "Vision-language-action (VLA) models map visual observations and language instructions directly to robot actions, but long-horizon tasks require more than action prediction. An agent must coordinate perception, planning, execution, progress verification, and recovery as the physical state evolves. An action prediction or a model-generated skill decision does not, by itself, guarantee that the proposed operation is valid in the current state or that its outcome will be verified. We propose EmbodiedSkills, a unified framework that treats each skill decision as an execution proposal: the runtime checks its prerequisites before execution and verifies the outcome afterward. A shared executable-skill interface connects high-level skill selection, bounded low-level VLA execution, and post-action verification within a single agent loop. Because this interface remains fixed, low-level VLA policies can be replaced or adapted without changing the agent loop. The interface also records planning, execution, verification, and recovery events as structured trajectories, which provide supervision for individual components and can support optional online adaptation when interactive feedback is available. We instantiate EmbodiedSkills with Qwen3-VL and OpenPI/pi0.5 on RoboTwin 2.0 and LIBERO. Task-adapted low-level VLA policies achieve an average success rate of 86.20% across 50 RoboTwin 2.0 tasks and 97.40% across the four LIBERO suites. These results establish the execution performance of the task-adapted low-level VLA policies used in EmbodiedSkills. On four memory-dependent RMBench tasks, the same task-adapted execution approach achieves 12.5% average success. The framework provides a trainable and inspectable agent layer for turning these policies into closed-loop embodied systems.", "pdf_url": "https://arxiv.org/pdf/2609.01281v1"}, {"title": "Seeing the World and the Self from Egocentric Video", "authors": ["Kai Guan", "Minchao Jiang", "Ruichen WangLi", "Wentao Zhu", "Lei Zhang"], "published": "2026-09-01", "summary": "Complete 3D perception from egocentric video requires recovering the surrounding scene and the wearer's full-body motion in a shared metric frame. Existing methods typically address scene reconstruction and motion estimation separately: scene reconstruction methods ignore the wearer, whereas motion estimation methods lack explicit scene geometry and often depend on external trajectories. Joint recovery is challenging because the two tasks exhibit asymmetric visibility and require different prediction paradigms. The largely visible scene supports deterministic geometric regression, whereas the severely occluded body requires generative motion inference. We therefore propose RESELF (REconstructing the Scene and the sELF), a unified framework that couples deterministic metric geometry reconstruction with geometry-conditioned motion generation. RESELF adapts a geometry foundation model pre-trained on large-scale exocentric data to egocentric video using frame-wise scale and relative-pose consistency objectives. The resulting camera trajectory and latent geometric features condition a diffusion model that recovers the wearer's motion. A subsequent closed-loop kinematic feedback stage further refines the camera head while preserving the reconstructed scene geometry. To support training and evaluation, we curate EE4D-JSM from EgoExo4D by aligning egocentric video, sparse metric scene geometry, camera trajectories, and full-body motion annotations. Experiments show that RESELF outperforms state-of-the-art methods designed for the individual tasks across depth estimation, camera tracking, and full-body motion estimation. Code, models, and datasets will be available at https://ka1guan.github.io/RESELF/.", "pdf_url": "https://arxiv.org/pdf/2609.01276v1"}, {"title": "Dual Process Motion Planning", "authors": ["Jiayi Yan", "Francesco Fabiano", "Alessandro Abate"], "published": "2026-09-01", "summary": "Robotic systems are deeply embedded in both industry and everyday life, where they are expected to act with speed, precision, and reliability. Classical control and planning methods have long delivered strong guarantees, but often at the cost of computational efficiency and adaptability. More recently, learning-based approaches have shown promise in overcoming these limitations, enabling agents to leverage experience to accelerate decision-making and address previously intractable problems. In this work, we bridge these two approaches through a neuro-symbolic perspective on nonlinear motion planning. Inspired by the Thinking Fast and Slow paradigm, we introduce a dual-process architecture that combines the strengths of robust reasoning and learning. Our framework integrates state-of-the-art symbolic solvers as a ``System-2'' component with experience-driven ``System-1'' modules. A metacognitive controller dynamically orchestrates their interaction, selecting when to rely on fast intuition versus slower, more precise reasoning. By evaluating the framework across diverse nonlinear benchmark environments, we demonstrate that this architecture yields consistent gains in planning efficiency, accuracy, and generalization, while promoting reuse across tasks. The results suggest that tightly coupling learning with structured reasoning offers a scalable path toward more capable and adaptive robotic systems.", "pdf_url": "https://arxiv.org/pdf/2609.01260v1"}, {"title": "MeRoPE: Metric Rotary Position Embedding for Camera-Controlled Video Generation", "authors": ["Zhijian Qiao", "Xinjiang Wang", "Jiajie Chen", "Haoming Huang", "Meng Li", "Chih-Chung Chou", "Jing Wang", "Shaojie Shen"], "published": "2026-09-01", "summary": "In camera-controlled video generation, geometry-aware positional encodings condition tokens on camera extrinsics and per-token viewing rays. Existing schemes, however, have a scale-dependent failure mode on real-world metric camera trajectories: homogeneous projective encodings cause attention logits and feature norms to grow unbounded with physical translation baselines. We propose MeRoPE (Metric Rotary Position Embedding), a norm-preserving relative camera encoding for attention. MeRoPE encodes relative orientations between calibrated viewing rays with orthogonal rotation blocks, maps raw metric displacements into multi-frequency rotary phases, and adds a disparity-anchored correspondence prior along the epipolar arc. This design strictly preserves feature norms, bounds pre-softmax attention logits regardless of the physical translation scale, and maintains exact invariance to global rigid coordinate changes. Across nuScenes and PanShot, which cover large-baseline trajectories and diverse camera optics, respectively, MeRoPE achieves stronger camera control than prior encodings, with the best consistency between generated camera motion and conditioning poses in both rotation and translation. Code will be made publicly available.", "pdf_url": "https://arxiv.org/pdf/2609.01252v1"}, {"title": "One Prompt Is Enough: Watermark Laundering Through Foundation Image Models", "authors": ["Jidong Yang", "Qi Li", "Wei Zong", "Yang-Wai Chow", "Willy Susilo", "Huaike Yu", "Chunpeng Wang", "Suo Gao"], "published": "2026-09-01", "summary": "Invisible watermarks are typically evaluated against predefined perturbations such as compression, blur, noise, cropping, and denoising. Public foundation image models expose a distinct threat: an attacker can submit a watermarked image with a single reconstruction prompt and obtain a visually faithful output from which the invisible watermark can no longer be decoded reliably. We formalize this failure mode as watermark laundering and evaluate it using a joint payload-fidelity profile that combines bit error rate (BER) with visual and semantic preservation. Across six OpenAI and Google image editing models, three representative watermarking schemes, and 1,800 reconstructed outputs, we identify two complementary laundering regimes: OpenAI models produce the strongest payload disruption across the evaluated schemes, whereas Nano Banana 2 shows that DwtDct remains vulnerable under high-fidelity reconstruction. Prompt ablations show that no single removal-oriented instruction is necessary for payload disruption, indicating that the effect is primarily induced by the reconstruction pathway rather than by explicit attack wording. Comparisons with conventional attacks further show that prompt-conditioned reconstruction constitutes a distinct operational attack interface. These findings motivate foundation-model reconstruction as a missing robustness condition in invisible watermark evaluation.", "pdf_url": "https://arxiv.org/pdf/2609.01249v1"}, {"title": "REFACTOR-VLA: Unsupervised Library Learning of Typed Motor Programs", "authors": ["Riyaaz Shaik", "Chandru Venkataraman"], "published": "2026-09-01", "summary": "Most vision-language-action (VLA) models -- OpenVLA, $π_0$, RT-2, RDT-1B -- are monolithic: they emit raw motor commands or short action chunks without organizing behavior into reusable abstractions, so they degrade on long-horizon tasks and resist interpretation. Existing skill-discovery methods sidestep the core question of when two action sequences are behaviorally equivalent, either clustering contrastive embeddings or delegating the judgment to a language model uncalibrated to the robot's dynamics. We introduce REFACTOR-VLA, a wake/sleep system for learning reusable skills. Its sleep phase clusters motor-program fragments under a Behavioral-Equivalence Kernel (BEK) computed from rollouts of a learned latent world model $M_φ$; its wake phase emits typed lambda terms over a Hindley--Milner-inspired vocabulary, consumed by a library-conditioned rectified-flow action decoder. Abstractions are admitted only if they pass Minimum Description Length and return-preservation gates. On LIBERO we report two findings. First, enlarging the world model from 188M to 430M parameters worsened performance on 4 of 4 suites, so capacity alone does not help. Second, the training objective matters far more: adding an auxiliary supervised contrastive (InfoNCE) loss during world-model warmup substantially improves sleep-phase clustering, giving Normalized Mutual Information at $n=3$ seeds of $0.462 \\pm 0.021$ (object), $0.867 \\pm 0.025$ (spatial), $0.915 \\pm 0.013$ (goal) and $0.754 \\pm 0.010$ (LIBERO-10), and beating the strongest published baseline on all 4 suites by a mean $Δ= +0.184$. Across providers ($n=12$) the 95% bootstrap confidence interval for mean pairwise NMI is $[0.683, 0.729]$ (mean $0.705$). The sleep phase also yields the first real-LIBERO task-language library: the decoder uses 2 of 3 admitted abstractions and rewrites all 256 sampled demonstrations.", "pdf_url": "https://arxiv.org/pdf/2609.01215v1"}, {"title": "On Global Regulatability of Robot Manipulators by Classical PID", "authors": ["Cheng Zhao", "Jingru Zhu", "Lei Guo"], "published": "2026-09-01", "summary": "This paper studies a class of uncertain multi-input multi-output (MIMO) nonlinear systems using extended PID (EPID) control. We focus on systems possessing a well-defined vector relative degree whose components may vary across channels, a setting that received limited attention in the existing literature on PID-type control. We develop a channel-wise EPID controller, where each control input is constructed from the proportional, integral, and derivative terms of the corresponding tracking error, and the highest derivative order is selected according to the relative degree of that channel. Under suitable growth conditions on the unknown nonlinearities, we construct an admissible set of EPID parameters specified by prescribed initial-state bounds, the uncertainties and the reference signal. We show that any parameter choice from this set guarantees semiglobal stability of the closed-loop system and achieves the desired setpoint regulation. These results indicate that the EPID parameters can be designed independently for each channel, justifying the common engineering practice of channel-by-channel tuning in strongly coupled and uncertain MIMO systems, including flight control systems.", "pdf_url": "https://arxiv.org/pdf/2609.01207v1"}, {"title": "Monocular Depth Estimation from a Single Image: Progress and Opportunities", "authors": ["Muxin Liu", "Xiaoyang Lyu", "Yang-Tian Sun", "Yi-Hua Huang", "Ziyi Yang", "Peng Dai", "Xiaojuan Qi"], "published": "2026-09-01", "summary": "Monocular depth estimation has long stood as a fundamental challenge in computer vision, enabling a wide range of applications including 3D reconstruction, robotics, autonomous driving, and augmented reality. This survey traces the field's evolution from early learning-based methods to the emergence of transformative foundation models. We begin by framing the problem, distinguishing between relative and metric depth estimation, and highlighting the key challenges that have shaped a decade of research. We then present common problem formulations and introduce the most widely used datasets, covering indoor, outdoor, and synthetic data. Following this, we review major advances prior to the foundation model era, distilling core insights from influential methods that contributed to improvements in accuracy, efficiency, and robustness. The survey then turns to the recent surge of foundation-model-based approaches, categorizing them into discriminative and generative paradigms and emphasizing the critical roles of large-scale pretraining (e.g., DINOv3) and synthetic data. We compare representative models using both quantitative benchmarks and qualitative examples, and discuss natural extensions to video-based depth estimation. Further, to illustrate real-world impact, we highlight the integration of depth estimation into applications such as visual SLAM, content generation, and robot perception. Finally, we outline open challenges and promising research directions as the field advances further into the era of foundation models.", "pdf_url": "https://arxiv.org/pdf/2609.01172v1"}, {"title": "DNC-IMM: Early Lane-Change Intention Recognition via Neural Calibration Based on Driving Context Information", "authors": ["Woong-Chan Byun", "Seung-Hyun Kong"], "published": "2026-09-01", "summary": "Early recognition of lane-change intention is essential for proactive decision-making in autonomous driving and advanced driver assistance systems. This paper proposes a Dual Neural-Calibrated Interacting Multiple Model (DNC-IMM) that improves adaptability to driving context while preserving the probabilistic structure and interpretability of a conventional IMM. The proposed method encodes driving-context information, including target-vehicle motion, gaps to surrounding vehicles, and relative velocities, with a neural network that calibrates both the transition-probability matrix and measurement likelihoods. The final intention is determined from the calibrated IMM mode posterior rather than from a separate direct classifier. Experiments on the highD dataset demonstrate that the proposed method reliably recognizes lane-change intentions before lane crossing and provides particularly strong performance at the earlier 2-3 s prediction horizons.", "pdf_url": "https://arxiv.org/pdf/2609.01120v1"}, {"title": "Modelpedia: A Catalog of Model Findings for the Meta-Science of AI", "authors": ["Franciszek Bernat", "Dawid Płudowski", "Michał Jan Włodarczyk", "Luca Longo", "Jianlong Zhou", "Andreas Holzinger", "Riccardo Guidotti", "Wojciech Samek", "Przemysław Biecek"], "published": "2026-09-01", "summary": "Scientific knowledge about AI models is produced faster than the community can organize it. Every few months a new foundation model reshapes the field and hundreds of papers, blogs, and technical reports document how each behaves or fails. Yet, these findings remain scattered and effectively unretrievable. To address this gap we present Modelpedia, an automated, LLM-assisted framework that extracts findings about models from published papers, links it to the model, dataset, method, and concept it concerns, and aggregates the result into a searchable public catalog. Applying the prototype to accepted ICLR 2024 and 2025 papers, we extract over a thousand findings and, treating the catalog itself as an object of study, run a meta-analysis of how the community investigates models. Now, we invite the community to explore, contribute to, and build on the open catalog, and to help establish model findings as a shared foundation for the meta-science of AI.", "pdf_url": "https://arxiv.org/pdf/2609.01090v1"}, {"title": "Adaptive Depth-Map-Guided Bundle Adjustment for Correspondence-Free Multi-View Point Cloud Registration", "authors": ["Yiran Zhou", "Yingyu Wang", "Shoudong Huang", "Liang Zhao"], "published": "2026-09-01", "summary": "Robotic processing of irregular steel scrap requires dense 3-D measurement to replace manual visual assessment in hazardous cutting workcells. The reconstructed map is used to estimate piece dimensions, boundary geometry, feasible preheating and cutting regions, and collision-aware torch paths. The reconstruction errors therefore propagate directly to downstream measurement and planning. Existing multi-view registration methods commonly rely on feature extraction and data association to establish correspondences between views. In workcells with smooth metallic surfaces, repeated structures, occlusions, and partial overlaps, however, wrong correspondences may be established, leading to inaccurate pose estimation and distorted reconstruction. This paper presents an adaptive layered depth-map-guided bundle adjustment framework for correspondence-free multi-view point cloud registration. The scene is represented by a global 2.5-D grid, where each cell can adaptively maintain multiple depth hypotheses. Raw depth observations are directly projected into the global map to form depth constraints without explicit feature correspondences. At grid cells where multiple surfaces produce conflicting depths, a softmax-based layer assignment links each observation to compatible depth hypotheses. The resulting nonlinear least-squares formulation jointly refines sensor poses and the layered depth map, with correspondences implicitly induced by the depth-map representation and projection model. Experiments on self-collected industrial datasets show that the proposed method achieves consistently competitive reconstruction accuracy while maintaining robustness and low computational cost in challenging industrial scenarios. We release the open-source code implementation at: https://github.com/YiranZhou-Robotics/ADM-BA.git", "pdf_url": "https://arxiv.org/pdf/2609.01089v1"}, {"title": "World Model-Guided Reinforcement Learning via Counterfactual User Engagement Simulation", "authors": ["Ang Li", "Xin Xu", "Bin Liang", "Yue Ma", "Fubang Zhao", "Yangyang Kang", "Kam-Fai Wong"], "published": "2026-09-01", "summary": "Reinforcement learning for user-centric agents is limited by the cost, latency, and risk of collecting online feedback, as well as by the lack of counterfactual comparisons under the same user state. In this paper, we propose World Model-Guided Reinforcement Learning via counterfactual user engagement simulation (WMG-RL), a framework in which a frozen user simulator provides reward supervision before real user exposure. Motivated by language world models, we instantiate the simulator as a User Engagement World Model (UEWM), which treats a recommended item as the agent action and the user's heterogeneous feedback as the environment observation. Rather than learning one fixed environment transition, UEWM learns to infer user-specific dynamics from engagement history and apply them to candidate items. In WMG-RL, a downstream policy proposes multiple candidate items for the same history; UEWM predicts the corresponding engagement feedback in parallel; and the simulated feedback is converted into dense rewards for policy optimization. Experiments show that UEWM provides reliable and transferable reward signals across domains, and that WMG-RL enables a compact 1.7B student policy to match or surpass much larger LLMs on downstream recommendation tasks.", "pdf_url": "https://arxiv.org/pdf/2609.01067v1"}, {"title": "Accelerating Reinforcement Learning via MPC Solver-Gradient Guidance for Weights-varying MPC", "authors": ["Baha Zarrouki", "Arslan Thobani", "Jasper Hoffmann", "Mattia Piccinini", "Rudolf Reiter", "Felix Jahncke", "Sébastien Gros", "Davide Scaramuzza", "Johannes Betz"], "published": "2026-09-01", "summary": "In Model Predictive Control (MPC), cost-function weights shape closed-loop behavior, yet changing conditions often make fixed parametrizations suboptimal and motivate context-dependent online adaptation. Learning such policies is difficult because behavior depends implicitly on numerical MPC solutions, producing nonlinear, potentially nonsmooth, long-horizon dependencies on policy parameters. This creates a bias-variance tradeoff: Reinforcement Learning (RL) optimizes realized closed-loop return from environment samples but is sample-inefficient, whereas Gradient-Based Policy Learning (GB-PL) uses low-variance solver gradients from differentiable MPC to optimize surrogate losses on predicted trajectories but can be biased under model mismatch. We propose Solver-Gradient Guided Reinforcement Learning (SG-RL), a solver-sensitivity augmentation for RL-based online MPC cost-weight adaptation. SG-RL keeps sampled closed-loop return as the objective and uses bounded solver-derived gradients as auxiliary guidance to improve stability and sample efficiency. We instantiate SG-RL in Proximal Policy Optimization (PPO) with four modular algorithms that inject solver-gradient guidance into actor-update scaling, policy loss, advantage estimation, and value-function learning. On two full-scale autonomous racing platforms with intentional model mismatch, SG-RL reaches PPO's best closed-loop return with up to 70.6% fewer samples, outperforms GB-PL baselines by at least 54% in closed-loop return, and generalizes zero-shot to unseen environments.", "pdf_url": "https://arxiv.org/pdf/2609.01061v1"}, {"title": "AgentFactory: Towards Automated Agentic System Design and Optimization", "authors": ["Enci Zhang", "Haofeng Wang", "Yuesheng Zhu", "Xiaole Cui", "Guibo Luo"], "published": "2026-09-01", "summary": "Large Language Models (LLMs) have demonstrated remarkable capabilities as powerful components in agentic systems, enabling sophisticated reasoning and complex task execution. However, current approaches to manually designing and optimizing agentic systems heavily rely on manual effort, limiting their adaptability and scalability. Recent work has explored the automated optimization of workflow designs. However, these approaches often overlook the crucial role of model capabilities and focus on single performance metrics, failing to address real-world deployment constraints. In this paper, we present AgentFactory, a framework that jointly optimizes both foundation models and workflow structures in agentic systems while considering multiple objectives including performance, cost, and efficiency. AgentFactory leverages advanced LLMs as optimizers to navigate the vast search space of possible configurations, employing a three-stage optimization pipeline to automatically discover effective combinations of fine-tuned models and optimized workflows. Through an iterative optimization process, our framework systematically explores and evaluates different agentic system designs, adapting to task-specific requirements while maintaining operational efficiency. We evaluate AgentFactory across eight benchmarks spanning five domains, including general reasoning, coding, mathematics, medicine, and finance. Our experiments demonstrate that AgentFactory consistently outperforms both manually designed methods and existing automated approaches, achieving an average improvement of 9.1% across all benchmarks, with particularly significant gains in domain-specific tasks (19.6% on MedQA and 18.7% on FinEval). These results establish AgentFactory as a promising approach for developing more capable and efficient agentic systems through automated optimization.", "pdf_url": "https://arxiv.org/pdf/2609.01045v1"}, {"title": "ReFlowSET: Representation-Aligned Latent Flow Matching for SAR-to-EO Image Translation", "authors": ["Jeonghyeok Do", "Seungchul Lee", "Munchurl Kim"], "published": "2026-09-01", "summary": "SAR-to-EO image translation aims to generate electro-optical (EO) imagery from synthetic aperture radar (SAR) observations. Existing latent diffusion approaches typically inherit a predetermined autoencoder, although reconstruction fidelity can vary substantially across codecs and modalities. Because the latent codec affects the round-trip preservation of both SAR conditions and EO targets, codec selection constitutes a fundamental design choice; nevertheless, existing methods largely rely on codecs pretrained on natural images. To remedy this, we introduce ReFlowSET, a conditional latent flow-matching framework that selects its codec through a joint SAR--EO reconstruction audit. Rather than inheriting a heavyweight pretrained generator, ReFlowSET trains a substantially smaller conditional DiT from scratch in the selected latent space, using dual-stream SAR conditioning followed by joint feature refinement. To provide semantic guidance for this from-scratch training, intermediate noisy-EO features are aligned with clean target-EO representations extracted by a frozen vision foundation model. This alignment is used only during training and introduces no additional inference cost. Experiments on QXS-SAROPT and SAR2Opt demonstrate state-of-the-art performance across diverse perceptual fidelity and distributional metrics. Code and pretrained weights are publicly available at https://github.com/KAIST-VICLab/ReFlowSET.", "pdf_url": "https://arxiv.org/pdf/2609.00968v1"}, {"title": "HitMem: Hierarchical Temporal 3D Memory with Multi-Modal Context-Aware Retrieval for Dynamic Environments", "authors": ["Ruijie Tang", "Chenye Zou", "Guoquan Wu", "Jun Wei", "Wei Chen", "Jiaxin Zhu"], "published": "2026-09-01", "summary": "Executing long-term tasks in dynamic environments requires embodied agents to maintain robust and adaptive 3D scene representations. However, most existing 3D memory frameworks rely on static world assumptions. When objects are displaced by human activities or unobserved events, agents encounter memory-observation conflicts and often require costly geometric recomputations or inefficient global re-exploration. To address this, we propose HitMem, a hierarchical temporal 3D memory framework with a multi-modal context-aware retrieval mechanism. Through continuous perception, HitMem unifies semantic and spatial information into a lightweight topological graph that captures support relationships, while a temporal decay mechanism dynamically regulates memory activeness to mitigate the impact of stale representations. In addition, the multi-modal context-aware retrieval mechanism defaults to filtering candidates using integrated semantic, spatial, and temporal memory features, and activates a specialized two-stage retrieval process when object displacement is detected. This process combines spatial constraints inferred from external agent trajectories with semantic common sense grounded in class affinities, efficiently identifying high-probability candidate regions. Extensive evaluations on our constructed Dyna-THOR benchmark demonstrate that HitMem significantly improves object relocation accuracy, reduces exploration costs, and enhances task execution performance in dynamic environments.", "pdf_url": "https://arxiv.org/pdf/2609.00950v1"}, {"title": "ProxPI: Proximal Prior Injection for Sampling-Based MPC under Learned-Prior Mismatch", "authors": ["Euncheol Im", "Myotaeg Lim", "Yisoo Lee"], "published": "2026-09-01", "summary": "Combining learned policies with model predictive control can leverage learned task priors while retaining online adaptation to new objectives and constraints, but performance degrades when the policy is out of distribution. In policy-guided model predictive path integral (MPPI) control, a policy-centered warm-start approach centers the sampling distribution on the policy output. When the prior is mismatched, centering the sampling distribution on the policy output restricts exploration around an unsuitable solution and prevents recovery toward the task optimum. We propose Proximal Prior Injection (ProxPI), which retains nominal-centered MPPI sampling and incorporates the policy through a soft proximity cost. This matches the in-distribution performance of existing prior-injection schemes while enabling the optimizer to escape an inaccurate policy and recover vanilla MPPI-level performance. We theoretically show that re-centering on the prior discards the optimizer's correction at every update, whereas nominal-centered sampling retains it and converges to a solution set by both the task cost and the prior, and that this failure is not removed by a larger rollout budget. Simulations and real-robot experiments demonstrate robust performance under both in-distribution and out-of-distribution tasks.", "pdf_url": "https://arxiv.org/pdf/2609.00941v1"}, {"title": "VerNav: Verifier-First Low-Latency Vision-and-Language Navigation", "authors": ["Zhixin Wang", "Chengzheyi Yao", "Leyuan Liu", "Xiaosong Zhang", "Yongzhao Zhang"], "published": "2026-09-01", "summary": "Vision-and-Language Navigation (VLN) requires an agent to navigate through unseen 3D environments according to natural-language instructions. Explicit reasoning can improve instruction understanding and semantic grounding, but autoregressive generation at every step accumulates large decision-stage latency over multi-step navigation. We propose VerNav, a verifier-first framework for low-latency LLM-based VLN. The verifier reduces decision-stage latency by replacing per-step autoregressive generation with batched action verification, while an entropy-based adaptive generator is invoked only for uncertain decisions to produce compact state evidence. To further improve navigation performance with the verifier, we introduce a two-stage alignment scheme: (i) VPO improves local action-preference alignment in static verifier training, and (ii) step-level reinforcement fine-tuning provides dense progress rewards over multi-step navigation rollouts during dynamic task execution. Experiments on the Room-to-Room (R2R) benchmark show that the verifier-only decision path of VerNav achieves competitive navigation performance among representative LLM-based VLN agents while reducing average decision-stage LLM latency per step by more than $10\\times$ compared with autoregressive methods.", "pdf_url": "https://arxiv.org/pdf/2609.00920v1"}], "repos": [{"repo": "PetoiCamp/OpenCat-Quadruped-Robot", "stars": 5246, "language": "C++", "description": "An open source quadruped robot pet framework for developing Boston Dynamics-style four-legged robots that are perfect for STEM, coding & robotics education, IoT robotics applications, AI-enhanced robotics application services, research, and DIY robotics kit development. ", "url": "https://github.com/PetoiCamp/OpenCat-Quadruped-Robot", "date": "2026-09-02", "topic": "physical-ai", "score": 2098.5}, {"repo": "NVIDIA/skills", "stars": 3178, "language": "Python", "description": "Agent Skills for NVIDIA products — install into Claude Code, Codex, and other coding agents to run Physical AI, robotics, simulation, CUDA, and RAG workflows end to end.", "url": "https://github.com/NVIDIA/skills", "date": "2026-09-02", "topic": "physical-ai", "score": 1271.3}, {"repo": "copper-project/copper-rs", "stars": 1478, "language": "Rust", "description": "Copper is an operating system for robots -  build, run, and replay your entire robot deterministically.", "url": "https://github.com/copper-project/copper-rs", "date": "2026-09-02", "topic": "physical-ai", "score": 591.3}, {"repo": "PetoiCamp/OpenCat-Old", "stars": 1372, "language": "C++", "description": "A programmable and highly maneuverable robotic cat for STEM education and AI-enhanced services.", "url": "https://github.com/PetoiCamp/OpenCat-Old", "date": "2026-09-02", "topic": "physical-ai", "score": 548.9}, {"repo": "NVlabs/alpasim", "stars": 1209, "language": "Python", "description": "AlpaSim is an open-source autonomous vehicle simulation platform designed for development and testing of end-to-end AV policies", "url": "https://github.com/NVlabs/alpasim", "date": "2026-09-02", "topic": /* ── constants ── */
const SRC_COLOR = {
  all:'#818cf8',starred:'#fbbf24',aiNews:'#38bdf8',physicalAiNews:'#a78bfa',
  roboticsNews:'#fbbf24',embeddedNews:'#22d3ee',papers:'#34d399',repos:'#60a5fa',
  models:'#fb923c',funding:'#a3e635',companies:'#f472b6',jobs:'#2dd4bf',
};
const SRC_ICON = {
  all:'⚡',starred:'⭐',aiNews:'📰',physicalAiNews:'🦾',roboticsNews:'🤖',embeddedNews:'🔌',
  papers:'📄',repos:'💻',models:'🧠',funding:'💰',companies:'🏢',jobs:'💼',
};
const SRC_LABEL = {
  all:'All Intelligence',starred:'⭐ Starred',aiNews:'AI News',physicalAiNews:'Physical AI',
  roboticsNews:'Robotics',embeddedNews:'Embedded & Chips',papers:'Research Papers',repos:'GitHub Repos',
  models:'HF Models',funding:'Funding',companies:'Companies',jobs:'Jobs',
};
const TOPICS = {
  vla:{ label:'VLA Models',    icon:'🎯', color:'#818cf8', kw:['vla','vision-language-action','vision language action'] },
  wam:{ label:'World Action',  icon:'🌍', color:'#a78bfa', kw:['wam','world action model','world-action','world model'] },
  robotPolicy:{ label:'Robot Policy',  icon:'🦿', color:'#2dd4bf', kw:['robot polic','manipulation polic','dexterous','locomotion','loco-manipul'] },
  rlPolicy:{    label:'RL Policy',     icon:'🧮', color:'#fbbf24', kw:['reinforcement learning','reward function','policy gradient','actor-critic','ppo ','rl agent'] },
  simulation:{  label:'Simulation',    icon:'🖥️', color:'#60a5fa', kw:['sim-to-real','simulation','simulator','simulated env','mujoco','isaac','sapien','robotwin','libero'] },
};

const state = { ds:'all',page:1,size:20,q:'',sort:'newest',view:'grid',dr:'all',advMod:null };

/* ── helpers ── */
const esc = v => String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const plain = v => { const d=document.createElement('div'); d.innerHTML=String(v??''); return d.textContent||''; };
const titleOf = x => x.title||x.repo||x.model||x.company||'Untitled';
const dateOf  = x => x.date||x.published||x.posted||'';
const srcOf   = x => { const s=x.source; if (s && !/^https?:\/\//.test(s)) return s; return x.company||x.language||x.topic||x.category||''; };
const scoreOf = x => Number(x.score||x.stars||x.downloads||0);
const isSeed  = x => { const u=x.url||x.pdf_url||''; return u.includes('example.com')||(x.title||'').toLowerCase().startsWith('example'); };
const fmt = n => n>=1e6?(n/1e6).toFixed(1)+'M':n>=1000?(n/1000).toFixed(1)+'K':String(n);
const truncWords=(t,n=100)=>{if(!t)return'';const w=t.trim().split(/\s+/);return w.length<=n?t:w.slice(0,n).join(' ')+'…';};

/* ── stars (persist across data refreshes via localStorage, keyed by URL) ── */
const keyOf = x => x.url||x.pdf_url||titleOf(x);
let STARS = new Set(JSON.parse(localStorage.getItem('hub-stars')||'[]'));
const isStarred = x => STARS.has(keyOf(x));
function toggleStar(k) {
  if (STARS.has(k)) STARS.delete(k); else STARS.add(k);
  localStorage.setItem('hub-stars', JSON.stringify([...STARS]));
}
function starredRows() { return allRows().filter(isStarred); }


function hrefOf(x) {
  if (x.pdf_url) {
    const m=x.pdf_url.match(/arxiv\.org\/(?:pdf|abs)\/([0-9]+\.[0-9]+)/);
    if (m) return 'https://arxiv.org/abs/'+m[1];
  }
  if (x.url) return x.url;
  if (x.pdf_url) return x.pdf_url;
  if (x.source && /^https?:\/\//.test(x.source)) return x.source;
  return '#';
}

function cutoff(r) {
  if (r==='all') return '';
  const d=new Date();
  if (r==='today') d.setHours(0,0,0,0);
  else if (r==='7d')  d.setDate(d.getDate()-7);
  else if (r==='30d') d.setDate(d.getDate()-30);
  else if (r==='90d') d.setDate(d.getDate()-90);
  return d.toISOString().slice(0,10);
}

function colorOf(k) { return SRC_COLOR[k]||(TOPICS[k]&&TOPICS[k].color)||'#818cf8'; }
function labelOf(k) { return SRC_LABEL[k]||(TOPICS[k]&&TOPICS[k].label)||k; }
function iconOf(k)  { return SRC_ICON[k]||(TOPICS[k]&&TOPICS[k].icon)||'•'; }

/* ── rows ── */
function allRows() {
  return Object.entries(data).flatMap(([k,rows])=>rows.filter(x=>!isSeed(x)).map(x=>( {...x,_k:k} )));
}
function rowsFor(ds) {
  if (ds==='starred') return starredRows();
  if (TOPICS[ds]) {
    const t=TOPICS[ds];
    return (data.papers||[]).filter(x=>{
      if (isSeed(x)) return false;
      const txt=(x.title+' '+(x.summary||'')).toLowerCase();
      return t.kw.some(k=>txt.includes(k));
    }).map(x=>( {...x,_k:ds} ));
  }
  return ds==='all'?allRows():(data[ds]||[]).filter(x=>!isSeed(x)).map(x=>( {...x,_k:ds} ));
}
function filtered() {
  const q=state.q.trim().toLowerCase(), from=cutoff(state.dr);
  let rows=rowsFor(state.ds);
  if (q) rows=rows.filter(x=>JSON.stringify(x).toLowerCase().includes(q));
  if (from) rows=rows.filter(x=>dateOf(x)>=from);
  return rows.sort((a,b)=>{
    if (state.sort==='score') return scoreOf(b)-scoreOf(a);
    if (state.sort==='alpha') return titleOf(a).localeCompare(titleOf(b));
    return dateOf(b).localeCompare(dateOf(a));
  });
}

/* ── render nav ── */
function renderNav() {
  const mk = (k,lbl,ico,n) => `
    <button class="nav-btn${state.ds===k?' active':''}" data-k="${k}">
      <span class="nav-ico">${ico}</span>
      <span class="nav-lbl">${esc(lbl)}</span>
      <span class="nav-cnt">${n}</span>
    </button>`;
  document.getElementById('navMain').innerHTML =
    [['all',allRows().length],['starred',starredRows().length],...Object.entries(data).map(([k,r])=>[k,r.length])]

let lastDs='';
function renderStats() {
  const rows=rowsFor(state.ds);
  const scored=rows.filter(x=>scoreOf(x)>0).length;
  const jobs=rows.filter(x=>x._k==='jobs').length;
  const latest=rows.map(dateOf).filter(Boolean).sort().pop()||'—';
  const items=[
    ['⚡','Total Signals',rows.length,'#818cf8'],
    ['🎯','Scored Items',scored,'#38bdf8'],
    ['💼','Job Postings',jobs,'#34d399'],
    ['📅','Latest',latest,'#fbbf24'],
  ];
  document.getElementById('stats').innerHTML = items.map(([ico,lbl,val,col])=>`
    <div class="stat" style="--sc:${col}">
      <span class="stat-ico">${ico}</span>
      <div class="stat-lbl">${lbl}</div>
      <div class="stat-num" data-target="${typeof val==='number'?val:''}"
           style="${String(val).length>8?'font-size:15px;margin-top:8px':''}">
        ${typeof val==='number'?'0':esc(String(val))}
      </div>
    </div>`).join('');

  /* stat hover handled by CSS lift */

  /* count-up */
  const doCount = state.ds!==lastDs;
  lastDs=state.ds;
  document.querySelectorAll('.stat-num[data-target]').forEach(el=>{
    const t=Number(el.dataset.target);
    if (!t) return;
    if (!doCount) { el.textContent=t.toLocaleString(); return; }
    const dur=1400, s=performance.now();
    const tick=now=>{
      const p=Math.min((now-s)/dur,1), ease=1-Math.pow(1-p,3);
      el.textContent=Math.round(ease*t).toLocaleString();
      if (p<1) requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  });
}

/* ── pagination ── */
function pageWin(c,t) {
  const s=Math.max(1,c-2),e=Math.min(t,c+2);
  const ps=[];
  for(let p=s;p<=e;p++) ps.push(p);
  if(!ps.includes(1)){ if(ps[0]>2) ps.unshift('…'); ps.unshift(1); }
  if(!ps.includes(t)){ if(ps[ps.length-1]<t-1) ps.push('…'); ps.push(t); }
  return ps;
}
function renderPag(tot) {
  const el=document.getElementById('pages');
  el.innerHTML=[
    `<button class="pgb" data-p="${state.page-1}" ${state.page===1?'disabled':''}>‹ Prev</button>`,
    ...pageWin(state.page,tot).map(p=>p==='…'
      ?`<button class="pgb" disabled>…</button>`
      :`<button class="pgb${p===state.page?' on':''}" data-p="${p}">${p}</button>`),
    `<button class="pgb" data-p="${state.page+1}" ${state.page===tot?'disabled':''}>Next ›</button>`,
  ].join('');
  el.querySelectorAll('.pgb:not([disabled])').forEach(b=>b.addEventListener('click',()=>{
    const p=Number(b.dataset.p);
    if(p&&p!==state.page){ state.page=p; render(); document.querySelector('.panel').scrollIntoView({behavior:'smooth',block:'start'}); }
  }));
}
