vites engineers to choose products they want to test", "source": "EE Journal", "date": "2026-07-20", "url": "https://www.eejournal.com/industry_news/element14-community-invites-engineers-to-choose-products-they-want-to-test/", "summary": "PHOENIX – July 14, 2026: element14, an Avnet community, has launched a new initiative within its RoadTest program, inviting engineers to apply to test and review a product of their choosing. The initiative allows participants to request any product priced at $175 or less from Newark, Farnell or element14 online stores. Ten selected applicants will receive their chosen product at &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/element14-community-invites-engineers-to-choose-products-they-want-to-test/\">Read More &#8594;<span class=\"screen-reader-text\"> \"element14 Community invites engineers to choose products they want to test\"<\/span><\/a>"}, {"title": "TDK introduces HVC 5422C embedded motor controller for silent BLDC applications up to 1A", "source": "EE Journal", "date": "2026-07-20", "url": "https://www.eejournal.com/industry_news/tdk-introduces-hvc-5422c-embedded-motor-controller-for-silent-bldc-applications-up-to-1a/", "summary": "&#8211;  Single-chip solution with integrated LIN transceiver, MCU, and motor driver help reduce system complexity and BOM cost &#8211;  64 K Flash and 4 KB EEPROM support over-the-air (OTA) software updates and sophisticated control algorithms &#8211;  Advanced Field Oriented Control (FOC) capabilities enable smooth motor operation while reducing acoustic noise to a minimum &#8211;  Cyber &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/tdk-introduces-hvc-5422c-embedded-motor-controller-for-silent-bldc-applications-up-to-1a/\">Read More &#8594;<span class=\"screen-reader-text\"> \"TDK introduces HVC 5422C embedded motor controller for silent BLDC applications up to 1A\"<\/span><\/a>"}, {"title": "MathWorks Enables AI Agents to Execute and Validate Engineering Workflows within MATLAB", "source": "EE Journal", "date": "2026-07-20", "url": "https://www.eejournal.com/industry_news/mathworks-enables-ai-agents-to-execute-and-validate-engineering-workflows-within-matlab/", "summary": "MathWorks, the leading developer of mathematical computing software for designing engineered systems, announced new capabilities that let AI agents run and refine MATLAB® workflows through two new open-source tools—MATLAB MCP Server and MATLAB Agentic Toolkit—using Model Context Protocol. With these tools, agents can write MATLAB code, run it in a live session, examine outputs or errors, and iterate toward &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/mathworks-enables-ai-agents-to-execute-and-validate-engineering-workflows-within-matlab/\">Read More &#8594;<span class=\"screen-reader-text\"> \"MathWorks Enables AI Agents to Execute and Validate Engineering Workflows within MATLAB\"<\/span><\/a>"}, {"title": "TANAKA Commences Operation of “TANAKA H2 Nexus”, One of Japan’s Largest 500 kW Pure Hydrogen Fuel Cell Power Generation Facilities", "source": "EE Journal", "date": "2026-07-20", "url": "https://www.eejournal.com/industry_news/tanaka-commences-operation-of-tanaka-h2-nexus-one-of-japans-largest-500-kw-pure-hydrogen-fuel-cell-power-generation-facilities/", "summary": "TANAKA PRECIOUS METAL TECHNOLOGIES Co., Ltd. (Head Office: Chuo-ku, Tokyo; Representative Director &#38; CEO: Koichiro Tanaka), a company engaged in the industrial precious metals business of TANAKA, today announced that &#8220;TANAKA H2 Nexus&#8221;, one of Japan&#8217;s largest 500 kW pure hydrogen fuel cell power generation facilities, began operation on July 8, 2026, at the TANAKA &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/tanaka-commences-operation-of-tanaka-h2-nexus-one-of-japans-largest-500-kw-pure-hydrogen-fuel-cell-power-generation-facilities/\">Read More &#8594;<span class=\"screen-reader-text\"> \"TANAKA Commences Operation of &#8220;TANAKA H2 Nexus&#8221;, One of Japan&#8217;s Largest 500 kW Pure Hydrogen Fuel Cell Power Generation Facilities\"<\/span><\/a>"}, {"title": "VÆRIDION selects Drive System Design to advance the Microliner electric propulsion system", "source": "EE Journal", "date": "2026-07-20", "url": "https://www.eejournal.com/industry_news/vaeridion-selects-drive-system-design-to-advance-the-microliner-electric-propulsion-system/", "summary": "DSD to develop, build and test the Microliner’s high-tech propeller drive system in the UK ahead of Copper Bird integration Microliner propulsion system development will draw on DSD’s aerospace transmission expertise, integrated engineering and advanced physical testing capabilities Programme advances VÆRIDION’s proprietary multi-engine, single-propeller architecture towards first flight and certification VÆRIDION, the all-electric aircraft manufacturer, &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/vaeridion-selects-drive-system-design-to-advance-the-microliner-electric-propulsion-system/\">Read More &#8594;<span class=\"screen-reader-text\"> \"VÆRIDION selects Drive System Design to advance the Microliner electric propulsion system\"<\/span><\/a>"}, {"title": "Beelink EQi 304 review – Part 3: Ubuntu 26.04 on a Wildcat Lake mini PC", "source": "CNX Software", "date": "2026-07-19", "url": "https://www.cnx-software.com/2026/07/19/beelink-eqi-304-review-part-3-ubuntu-26-04-on-a-wildcat-lake-mini-pc/", "summary": "<div><img alt=\"Beelink EQi Wildcat Lake mini PC Ubuntu 26.04 review\" class=\"attachment-medium size-medium wp-post-image\" height=\"551\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/07/Beelink-EQi-Wildcat-Lake-mini-PC-Ubuntu-26.04-review-720x551.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>After checking out the hardware with an unboxing and a teardown of the Beelink EQi Wildcat Lake mini PC, we reviewed the Intel Core 3 304 computer with Windows 11 in detail. We&#8217;ve now had time to test the Beelink EQi mini PC running Ubuntu 26.04 with Linux 7.0/7.1 kernels. We&#8217;ll report our experience with feature testing, benchmark results, 2.5GbE, 10GbE, and WiFi 6 networking evaluation, storage and USB/Thunderbolt tests, and more, including power consumption measurements. Ubuntu 26.04 installation and system information I&#8217;d usually resize the Windows partition to install Ubuntu alongside it in dual boot configuration. However, since the Beelink EQi mini PC also comes with two PCIe Gen4 x1/x2 sockets, I installed Ubuntu 26.04 on a 256GB NVMe (PCIe Gen3 x4) SSD fitted into the PCIe x2 socket and left the Windows 11 partition on the UFS storage alone. Despite the Intel Core 3 304 chip being a [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/07/19/beelink-eqi-304-review-part-3-ubuntu-26-04-on-a-wildcat-lake-mini-pc/\">Beelink EQi 304 review &#8211; Part 3: Ubuntu 26.04 on a Wildcat Lake mini PC<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "The Protocol Wars in Factories, Nvidia's Thor Modules for Robotics and Edge AI, 'Mind of the Engineer' survey: Embedded Week Insights", "source": "Embedded.com", "date": "2026-07-17", "url": "https://www.embedded.com/the-protocol-wars-in-factories-nvidias-thor-modules-for-robotics-and-edge-ai-mind-of-the-engineer-survey-embedded-week-insights/", "summary": "<p>Here's a roundup of this week's must-read articles. We look into the latest developments on the challenges of using different protocols in factories, Nvidia's latest Thor modules for scalable robotics and edge AI, AI-powered custom test development, the Mind of the Engineer survey, and more. Also, check News Archives - Embedded and Technical Articles Archives - Embedded for the [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/the-protocol-wars-in-factories-nvidias-thor-modules-for-robotics-and-edge-ai-mind-of-the-engineer-survey-embedded-week-insights/\">The Protocol Wars in Factories, Nvidia&#8217;s Thor Modules for Robotics and Edge AI, ‘Mind of the Engineer’ survey: Embedded Week Insights<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "The CMMC Pause: The DoD Suspends Phase 2 Requirements", "source": "Embedded.com", "date": "2026-07-17", "url": "https://www.embedded.com/the-cmmc-pause-the-dod-suspends-phase-2-requirements/", "summary": "<p>What 60 days of review means for the defense industrial base.<\/p>\n<p>The post <a href=\"https://www.embedded.com/the-cmmc-pause-the-dod-suspends-phase-2-requirements/\">The CMMC Pause: The DoD Suspends Phase 2 Requirements<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "Vector Photonics Develops New PCSEL Packaging Technology", "source": "Embedded.com", "date": "2026-07-17", "url": "https://www.embedded.com/vector-photonics-develops-new-pcsel-packaging-technology/", "summary": "<p>Vector Photonics has launched the Accelerated Manufacturing for PCSEL Packaging Solutions (AMPPS) program, an initiative aimed at addressing a key barrier to the commercial adoption of photonic crystal surface-emitting lasers (PCSELs): scalable, thermally efficient device packaging. By adding advanced packaging capabilities to its manufacturing process, the company intends to accelerate the deployment of PCSEL technology [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/vector-photonics-develops-new-pcsel-packaging-technology/\">Vector Photonics Develops New PCSEL Packaging Technology<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "Securing the Silicon: The Seismic Shift to Hardware Security", "source": "EE Journal", "date": "2026-07-17", "url": "https://www.eejournal.com/fish_fry/securing-the-silicon-the-seismic-shift-to-hardware-security/", "summary": "<img alt=\"\" class=\"webfeedsFeaturedVisual wp-post-image\" height=\"300\" src=\"https://www.eejournal.com/wp-content/uploads/2026/07/AD-071726-300x300.png\" style=\"display: block; margin-bottom: 5px; clear: both;\" width=\"300\" />My podcast guest this week is Jason Oberg from Arteris. Jason and I discuss this profound transition toward hardware security, explore how Cycuity&#8217;s integration into Arteris is changing the game for system-level security and discuss how teams can address the emerging risks in our era of distributed systems, chiplets, and constant data movement. &#160; &#160; &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/fish_fry/securing-the-silicon-the-seismic-shift-to-hardware-security/\">Read More &#8594;<span class=\"screen-reader-text\"> \"Securing the Silicon: The Seismic Shift to Hardware Security\"<\/span><\/a>"}, {"title": "The Protocol Wars: The Factory Floor's Fragmentation Problem", "source": "Embedded.com", "date": "2026-07-16", "url": "https://www.embedded.com/the-protocol-wars-the-factory-floors-fragmentation-problem/", "summary": "<p>By consolidating PLC monitoring into a single platform, factories can detect and resolve issues faster, while improving efficiency.<\/p>\n<p>The post <a href=\"https://www.embedded.com/the-protocol-wars-the-factory-floors-fragmentation-problem/\">The Protocol Wars: The Factory Floor’s Fragmentation Problem<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}], "papers": [{"title": "Masked Visual Actions for Unified World Modeling", "authors": ["Hadi Alzayer", "Wenlong Huang", "Haonan Chen", "Christopher Luey", "Lvmin Zhang", "Maneesh Agrawala", "Gordon Wetzstein", "Li Fei-Fei", "Yilun Du", "Jiajun Wu", "Jia-Bin Huang"], "published": "2026-07-21", "summary": "Video models absorb rich priors over how the visual world moves, interacts, and responds to contact, making them promising substrates for robotic world modeling. The central challenge is how to communicate action to such models in a form aligned with the visual space in which they learned these interaction priors, yet still grounded in physical manipulation. We introduce Masked Visual Actions, a pixel-space control interface that expresses action as a partially revealed trajectory of an arbitrary entity in a video. Revealing robot motion makes the model act as a forward dynamics model that predicts the scene's response to low-level robot actions, while revealing desired object motion makes the same model recover robot behavior consistent with that outcome. Finetuned with only 15 hours of masked examples from real videos and simulation, a single checkpoint achieves strong visual fidelity and controllability across diverse scenes and multiple embodiments. In downstream manipulation settings, the model produces imagined rollouts whose outcomes correlate with real-world execution for policy evaluation, improves decision making by ranking candidate futures in model-based planning, and supports inverse modeling by synthesizing robot motion from desired object motion.", "pdf_url": "https://arxiv.org/pdf/2607.19343v1"}, {"title": "InstructMixup: Instruction-Guided Salient Patch Editing for Robust Data Augmentation", "authors": ["Khawar Islam", "Arif Mahmood", "Xin Jin", "Naveed Akhtar"], "published": "2026-07-21", "summary": "In image and video technologies, data augmentation is widely used to improve the generalization of deep visual models, and mixup-based strategies that interpolate between samples have become the dominant approach. However, computing informative mixing regions adds substantial overhead, and blending content across different images frequently disrupts the semantic integrity of the resulting sample. We propose \\our{}, a data augmentation method that constructs challenging yet label-consistent training samples entirely within a single visual sample. \\our{} first extracts multi-scale salient patches from the sample using a lightweight saliency detector, refines each patch with an instruction-guided generative model, and blends the edited patch back into the non-salient regions of the same sample; because the generative edits are computed once and cached offline, this step adds negligible training cost. To further diversify the learned representation, \\our{} injects self-similar fractal structure into the same salient regions at an adaptive ratio, so each training sample carries both fractal and non-fractal structure. We derive a second-order approximation of the resulting vicinal risk, showing that the method simultaneously enforces invariance to the generative edit and suppresses curvature along the perturbed salient directions, and we verify both predictions empirically. We evaluate on small to large backbones for instance Convolutional Neural Networks (CNNs), Vision Transformers (ViTs) and Vision-Language Foundational Models (VLMs) across seven benchmarks covering coarse- and fine-grained classification, robustness to corruption and occlusion, calibration, and transfer and self-supervised learning, InstructMixup outperforms nine competing augmentation methods, surpassing the strongest baseline across all benchmarks.", "pdf_url": "https://arxiv.org/pdf/2607.19324v1"}, {"title": "From Distances to Trajectories: Real-Time Signed Distance Function Mapping and Distance-Accelerated Motion Planning for UAVs", "authors": ["Jason Stanley", "Zhirui Dai", "Qihao Qian", "Tzu-Chin Ho", "Tianxing Fan", "Siddharth Saha", "Christopher Barngrover", "Ki Myung Brian Lee", "Nikolay Atanasov"], "published": "2026-07-21", "summary": "Autonomous flight in cluttered environments requires a robot to build a geometric map of its surroundings and plan safe, dynamically feasible trajectories, all onboard and in real time. Conventional approaches treat mapping and planning as separate stages and often rely on binary occupancy for collision checking. We argue that these two stages should be co-designed around a single representation: a signed distance function (SDF). By encoding distance to the nearest obstacle, an SDF provides richer information for planning and trajectory optimization than occupancy alone. We develop an Octree REsidual Network (OREN) that pairs an explicit octree prior with an implicit neural residual to reconstruct SDFs online from point cloud observations with the efficiency of volumetric methods and the accuracy and differentiability of neural methods. In tandem, we develop Bubble$^\\star$, a search-based planner that exploits the distance information to grow maximal collision-free balls, which we call bubbles, with formal guarantees of termination, completeness, and failure detection. Planning over a graph of bubbles significantly reduces collision checks compared to a grid-based A$^\\star$ search and returns a bubble sequence that forms a safe corridor for trajectory optimization. We demonstrate the integrated OREN-Bubble$^\\star$ approach onboard a quadrotor, navigating unseen indoor environments in real time under tight compute constraints. OREN improves SDF estimation by $22$% compared to baselines, while Bubble$^\\star$ finds trajectories spanning $\\approx 90$ m through a cluttered environment in $1$-$3$ sec., whereas baselines take up to $10$ sec. in the same environment.", "pdf_url": "https://arxiv.org/pdf/2607.19306v1"}, {"title": "No Training, Better Flights: Test-Time Scaled VLMs for UAV Navigation", "authors": ["Feinan Cheng", "Dongliang Xu", "Wenli Nong", "Zhiheng Zhang", "Ang Liu", "Tianyu Wang", "Yue Yao"], "published": "2026-07-21", "summary": "Test-time scaling offers a promising method to improve the inference performance of Vision-Language Models (VLMs) without additional training. Existing approaches to vision-language navigation (VLN) for Unmanned Aerial Vehicle (UAV) typically relies on a single inference pass, which can falter in complex environments by producing suboptimal or unsafe trajectories. In this paper, we explore a simple and effective approach to apply test-time scaling to VLN for UAV. We enhance navigation reasoning through an iterative refinement process that requires no extra model training, guiding the model to re-evaluate its initial navigation plan for better accuracy and safety. Our method first prompts the model to generate multiple parallel candidates and then performs a self-correction step, achieving deeper and more robust planning without changing the underlying model. To further strengthen decision-making, we design a multi-criteria scoring function to evaluate the refined candidates based on safety, goal alignment, and forward-progress. This simple yet powerful combination enables a frozen UAV navigation VLMs to self-correct and generate more accurate and reliable flight plans, achieving SOTA performance in this task.", "pdf_url": "https://arxiv.org/pdf/2607.19288v1"}, {"title": "Stochastic Multi-Objective Kinodynamic Planning Against Adversaries", "authors": ["Thomas Marshall Vielmetti", "Daniel Cherenson", "Dimitra Panagou"], "published": "2026-07-21", "summary": "This paper addresses multi-objective kinodynamic planning in environments with stochastic hybrid adversaries that probabilistically transition to adversarial modes based on the ego state. The goal is to construct the Pareto-front of paths that trade off execution cost and the probability of safety constraint violation (risk). Existing chance-constrained planners evaluate risk over open-loop trajectories, yielding overly conservative solutions that fail to account for ego-agent reactivity. To address this limitation, we shift the planning space to sequences of closed-loop policies, and integrate sample-based risk evaluation directly into tree construction via Monte-Carlo particle rollouts. We first introduce Stochastic Multi-Objective RRT (SMO-RRT), for which we prove probabilistic completeness, followed by Stochastic Multi-Objective Stable Sparse RRT (SMO-SST), which leverages selective pruning to improve numerical performance at the cost of completeness. For both algorithms, we derive a finite-sample bound on the probability of chance constraint violation for systems with non-Gaussian, state-dependent uncertainty, enabling probabilistically safe planning in a broad class of environments applicable to multi-agent systems, social navigation, and autonomous driving.", "pdf_url": "https://arxiv.org/pdf/2607.19284v1"}, {"title": "Eversion-based robots can enable safe access,steering and endoscopic imaging within the spinal subarachnoid space", "authors": ["Zicong Wu", "Panagiotis Kalozoumis", "S. M. Hadi Sadati", "Aminul I. Ahmed", "Jonathan Shapey", "Christian Baker", "Thomas Booth", "Wenfeng Xia", "Sebastien Ourselin", "Panagiotis Vartholomeos", "Christos Bergeles"], "published": "2026-07-21", "summary": "Safe navigation within the spinal subarachnoid space is constrained by its narrow, compliant, and delicate anatomy. Conventional catheters and continuum robots rely on proximal pushing, generating friction and shear along the tissue device interface that limit distal controllability and increase the risk of neural injury. Here, we present a 2 mm diameter eversion-growing robotic platform that enables friction minimised extension and steering within the human spinal subarachnoid space, validated through computational modelling, phantom experiments, and intact human cadaver studies. The robot integrates a miniature endoscope for real time intrathecal visualisation and advances by pressure driven tip eversion, localising motion to the distal tip while minimising translational sliding of the deployed body. Phantom experiments demonstrated reductions of 65.2% in mean interaction force and 48.0% in peak interaction force compared with matched push-based insertion. Physics based modelling showed that eversion based growth redistributed tissue loading, reducing local stress concentrations and interfacial shear relative to conventional insertion. In an intact human cadaver, the system achieved 150 mm of controlled intrathecal extension with concurrent fluoroscopic and endoscopic visualisation, providing access across multiple vertebral levels from a standard lumbar entry point. Postprocedural laminectomy and durotomy revealed no observable macroscopic disruption of the dura mater or surrounding neural structures. These results provide the first mechanically characterised and multimodally validated demonstration of eversion-based robotic navigation in intact human spinal anatomy, establishing a quantitative and procedural foundation for future intrathecal interventions. Further validation in larger anatomical cohorts and under physiological conditions will be required before clinical translation.", "pdf_url": "https://arxiv.org/pdf/2607.19274v1"}, {"title": "DBMol: Design of High-Affinity, Target-Specific Small Molecules through Structure Prediction Models", "authors": ["Yiming Qin", "Kai Yi", "Miruna Cretu", "Sjors H. W. Scheres", "Pietro Liò", "Pascal Frossard"], "published": "2026-07-21", "summary": "Designing small molecule ligands that bind with high affinity to specific protein pockets is a fundamental goal in drug discovery, as small molecules constitute a major fraction of approved therapeutics. Recent breakthroughs in structure prediction, such as AlphaFold-3 and Boltz-2, enable accurate biomolecular interaction prediction and show promise as foundation models for downstream tasks, including binding affinity prediction. We propose to leverage these models and introduce DBMol, a new structure predictor-guided framework for de novo small molecule design. DBMol formulates an alternating optimization and projection process. In the optimization stage, DBMol starts from an initial molecule and uses gradient-based optimization to improve pocket-specific interactions and predicted binding affinity using a structure prediction model. In the projection stage, a flow-matching model maps the optimized molecular graph to discrete and chemically valid molecules. Experiments show that DBMol effectively optimizes the Boltz-2 affinity proxy and generates molecules with strong predicted affinity and specificity under Boltz-2 evaluation. To reduce self-confirmation bias, we further evaluate generated molecules using held-out metrics, including AF3-based evaluation. DBMol substantially improves pocket coverage while maintaining molecular diversity over unconditional generation, and is competitive under held-out metrics despite the absence of reference-ligand supervision. These results support the promise of structure prediction models as effective optimization signals for de novo molecular design.", "pdf_url": "https://arxiv.org/pdf/2607.19237v1"}, {"title": "In-Context Time Series Classification with Random Convolutional Features", "authors": ["Joscha Cüppers", "Jilles Vreeken"], "published": "2026-07-21", "summary": "Time series classification is central to domains like medical signal analysis, industrial monitoring, and sensor-based activity recognition, where class information manifests as localized shapes, specific frequencies, temporal shifts, or complex cross-channel interactions. Random convolutional transforms efficiently map these sequences to fixed-dimensional tabular features but are traditionally paired with simple linear classifiers. We investigate whether a pretrained tabular foundation model can more effectively harness these rich representations. We propose MASHT, a pipeline that marries MultiRocket and Hydra features with the power of in-context tabular foundation models. By leveraging a pretrained tabular foundation model, our approach completely bypasses task-specific model training, requiring only feature extraction and direct inference. Extensive experiments demonstrate that MASHT matches state-of-the-art time series classification baselines on univariate tasks, achieving a lower average rank than HIVE-COTE 2.0. On multivariate datasets, MASHT remains highly competitive with the strongest reference methods.", "pdf_url": "https://arxiv.org/pdf/2607.19234v1"}, {"title": "IGGT4D: Streaming 4D Instance-Grounded Geometry Transformer", "authors": ["Zhengyu Zou", "Hao Li", "Kuixuan Jiao", "Liu Liu", "Tingyang Xiao", "Xiaolin Zhou", "Fangzhou Hong", "Zhizhong Su", "Dingwen Zhang", "Ziwei Liu"], "published": "2026-07-21", "summary": "Real-world spatial intelligence requires agents to understand scenes from continuous video streams, where objects move, persist, disappear, and reappear over time. While recent spatial foundation models have enabled generalizable feed-forward 3D reconstruction, most streaming methods remain geometry-centric and lack temporally consistent object-level understanding. Meanwhile, existing semantic reconstruction and 3D-aware vision-language methods largely rely on externally extracted 2D semantic cues or loosely coupled geometry inputs, limiting unified geometry-instance learning in long dynamic scenes. In this paper, we propose IGGT4D, a streaming instance-grounded geometry Transformer for online 4D scene understanding. IGGT4D processes video frames sequentially, reuses historical context through causal spatial-temporal modeling, and incrementally updates a unified representation of camera motion, geometry, and object identity. This enables long-sequence feed-forward reconstruction with geometry-instance consistency in dynamic environments. To address the lack of high-quality 4D supervision, we further construct InsScene4D-147K, a large-scale dataset spanning real/synthetic and static/dynamic scenes, with RGB images, depth, poses, and temporally consistent instance masks generated by an automated geometry-guided annotation pipeline. Experiments on 3D reconstruction, pose estimation, instance spatial tracking, and open-vocabulary segmentation demonstrate that IGGT4D outperforms existing streaming baselines while maintaining scalable online inference for long dynamic sequences.", "pdf_url": "https://arxiv.org/pdf/2607.19228v1"}, {"title": "Computing on the Fly: Navigating a Vision for the Future of Drone Computing", "authors": ["Kevin Butler", "Christopher Stewart", "Nils Aschenbruck", "Alina Gerall", "Weisong Shi", "Deborah Silver", "Ufuk Topcu"], "published": "2026-07-21", "summary": "The report envisions a decade in which drones move goods, medical supplies, and information at a scale comparable to national infrastructure investments like highways and the electric grid. Potential applications include natural disaster detection drones that spot wildfire sources within minutes, medical supply chains that bypass ground congestion to reach rural hospitals, and nationwide fleets that continuously inspect bridges and power lines. Realizing this future, however, requires closing what report authors call a \"capability gap,\" where hardware and aspirations are outpacing the software and systems needed to operate safely at scale. The report identifies twelve technical challenges that must be addressed to realize the transformative potential of drone technology: Scaling to millions of drones; AI intelligence and assurance; Edge-cloud continuum and real-time coordination; AI autonomy and agentic systems; Data, training, and validation infrastructure; Critical infrastructure protection; Building reliable fleets from non-deterministic agents; Trust, security, and distributed authentication; Next-generation drone networks; Human-AI partnership and scalable insight; Standards, certification, and regulation; and Workforce development and education. These twelve challenges and proposed approaches to them form the basis of the report, laying out a multifaceted path forward for the evolution of done technology.", "pdf_url": "https://arxiv.org/pdf/2607.19213v1"}, {"title": "ATLAS: A Foundation Neural Sampler for Amorphous Materials", "authors": ["Mouyang Cheng", "Denis Blessing", "Botao Yu", "Gerhard Neumann", "Mingda Li", "Carles Domingo-Enrich", "Yuanqi Du"], "published": "2026-07-21", "summary": "Amorphous materials exhibit exceptional mechanical and functional properties, yet their rugged energy landscapes are notoriously difficult to sample. Below the glass-transition temperature, conventional molecular dynamics and Monte Carlo become inefficient because equilibration relies on rare barrier-crossing events, while data-driven generative models are constrained by scarce and biased reference ensembles. Here, we introduce ATLAS, an efficient sampler that learns a diffusion process to generate Boltzmann-distributed amorphous structures directly from a target energy function. Parameterized by an equivariant graph neural network, ATLAS generalizes across system size, temperature, and composition. By exploiting the time reversal of the diffusion process, it enables efficient estimation of thermodynamic quantities and steering toward target observables. In two-dimensional Kob-Andersen systems, ATLAS reproduces parallel tempering Markov chain Monte Carlo structural distributions, free energies and entropies, achieving below 0.2% free energy error in the low-temperature glass regime with over 500-fold fewer energy evaluations. In Cu-Zr and Cr-Co-Ni metallic glasses, ATLAS recovers experimentally observed short-range-order trends and steers structures toward prescribed order parameters and optimized bulk moduli. Moreover, composition-amortized pretraining outperforms composition-specific training from scratch, reduces inverse-design costs by several hundred-fold, and enables sampling with expensive universal machine learning interatomic potentials. Coupled to a large language model agent, ATLAS searches an eight-element space for high-entropy metallic glasses balancing stiffness and ductility, identifying a converged Pareto frontier within 480 oracle evaluations. Together, these results establish ATLAS as a foundation model for sampling, steering and designing amorphous materials.", "pdf_url": "https://arxiv.org/pdf/2607.19198v1"}, {"title": "STL-GCS: A Planner-Controller Framework for Signal Temporal Logic via Graphs of Time-varying Convex Sets", "authors": ["Nicola De Carli", "Gregorio Marchesini", "Dimos Dimarogonas"], "published": "2026-07-21", "summary": "We present a unified trajectory planning and control framework for the satisfaction of Signal Temporal Logic (STL) specifications defined over convex predicates. At the planning layer, STL tasks are encoded as time-varying convex sets in configuration space, specifically designed so that forward invariance of the system with respect to these sets implies satisfaction of the specification with a prescribed robustness margin. This representation is then lifted to the joint time--configuration space and combined with the Graphs of Convex Sets (GCS) framework, yielding a shortest-path formulation of the planning problem over convex spatio-temporal sets. Trajectories are parameterized by B-splines, which enable continuous-time enforcement of STL satisfaction, collision avoidance, and smoothness constraints. At the control layer, the same time-varying sets used for planning are exploited to design a feedback controller that tracks the planned trajectory while prioritizing satisfaction of the STL specification during execution in the presence of tracking errors and model mismatch. We validate the proposed approach in simulation and in real-world experiments on space robotic platforms.", "pdf_url": "https://arxiv.org/pdf/2607.19196v1"}, {"title": "Cognitive Dual-Process Planning for Autonomous Driving with Structured Scene Knowledge and Verifiable Reasoning-Action Consistency", "authors": ["Zhongyao Yang", "Haoyu Li", "Yu Yan", "Zhuangxuan Yu", "Jiangfeng Nan", "Jinrui Nan"], "published": "2026-07-21", "summary": "High-level planning for autonomous driving is a knowledge-intensive engineering decision task that requires accurate scene understanding, timely inference, and internally consistent action selection. Vision-language models (VLMs) can make intermediate reasoning explicit, but their use in deployed planners is constrained by costly structured supervision, unnecessary reasoning in routine scenes, and possible inconsistencies between generated rationales and driving actions. We present a cognitive dual-process planning framework that represents planning-relevant scene knowledge in a machine-parsable structured chain-of-thought (S-CoT) schema. An automated data engine integrates perception foundation models, critical-path filtering, and an expert VLM to generate S-CoT supervision without manual annotation of individual rationales. A lightweight visual Arbiter estimates scene complexity from multilevel vision-encoder features before language decoding and routes each input to either fast meta-action prediction or slow structured reasoning. For slow-path outputs, a deterministic rule-based validator checks whether the parsed S-CoT fields are consistent with the final meta-action and provides verifiable rewards for Group Relative Policy Optimization (GRPO). In a 195-scene manual audit, the generated annotations achieve 91.8\\% CoT accuracy and a 98.5\\% Logical Consistency Score (LCS). On 574 manually verified NAVSIM test samples, the planner achieves 80.14\\% planning accuracy and 97.20\\% LCS while reducing average latency by 17.39\\% relative to applying slow reasoning to every scene. Evaluation on external long-tail subsets further identifies conditions under which routing and planning performance degrade. Together, these results show how explicit scene knowledge can be operationalized through adaptive reasoning and rule-based verification to support high-level VLM planning decisions.", "pdf_url": "https://arxiv.org/pdf/2607.19194v1"}, {"title": "ABot-World-0: Infinite Interactive World Rollout on a Single Desktop GPU", "authors": ["Fan Jiang", "Zhaoxu Sun", "Mengchao Wang", "Ziyu Zhu", "Chiyu Wang", "Yunpeng Zhang", "Wenlin Liu", "Yun Wang", "Xue Zheng", "Rui Sun", "Junfeng Ni", "Hongyu Pan", "Zhongxu Sun", "Fei Yu", "Zengye Ge", "Mengmeng Du", "Nianfei Fan", "Mingchao Sun", "Yu Liu", "Yongchang", "Yanqing Zhu", "Jiahang Wang", "Ning Ying", "Yuze Xuan", "Di Yang", "Zhicheng Liu", "Zhe Gao", "Tingbing Xu", "Jiacheng Sui", "Wenjin Yang", "Junnan Lai", "Shufeng Liu", "Yuan Liu", "Zheng Zhou", "Yingliang Peng", "Dawei Cao", "Kaifeng Sheng", "Yuxiang Cai", "Fei Lu", "Mu Xu", "Ning Guo"], "published": "2026-07-21", "summary": "We present ABot-World-0, an action-conditioned video world model for real-time, long-horizon closed-loop interaction, supported by a multi-source data infrastructure spanning AAA games, simulation engines, and internet videos to learn controllable world dynamics. WorldExplorer performs agent-driven collection guided by training feedback, while a unified pipeline applies 14 deterministic quality checks, VLM-based assessment, and synchronized action and text annotation. We progressively distill a bidirectional action-conditioned teacher into a causal student through teacher forcing and ODE distillation, and introduce LongForcing to align long student self-rollouts with an extended-horizon teacher, mitigating accumulated distribution shift and autoregressive drift. Raw keyboard actions provide a unified control interface for scene roaming and third-person character interaction, while reference-character memory provides persistent appearance cues for identity consistency during third-person rollouts. For deployment, we co-design a streaming inference stack with a lightweight VAE decoder, efficient attention, memory-aware scheduling, and low-bit DiT inference. Across optimized low-bit configurations, ABot-World-0 streams 720P video at up to 16 FPS on a single NVIDIA RTX 5090 desktop GPU, with 1.2s action-to-first-frame latency and approximately 19GiB peak VRAM. Experiments on WorldRoamBench and extended interactive rollouts demonstrate competitive controllability and coherent long-horizon world evolution.", "pdf_url": "https://arxiv.org/pdf/2607.19191v1"}, {"title": "Agentic Real2Sim: Physics-based World Modeling with Vision-Language Agents", "authors": ["Guanxiong Chen", "Qianjun Xia", "Jiawei Peng", "Heng Zhang", "Bole Ma", "Justin Qian", "Ziyi Jiao", "Bingyang Zhou", "Luoxin Ye", "Kaifeng Zhang", "Kunyi Wang", "Weijia Zeng", "Yunuo Chen", "Pengzhi Yang", "Ziqiu Zeng", "Huamin Wang", "Chao Liu", "Alan Yuille", "Fan Shi", "Changxi Zheng", "Yunzhu Li", "Chenfanfu Jiang", "Peter Yichen Chen"], "published": "2026-07-21", "summary": "Real-to-sim conversion for robotic interaction with objects remains labor-intensive because it requires more than visual reconstruction: a streamlined real2sim process must recover scene geometries and object states, infer physical parameters, and assemble actors, objects, cameras, poses, and trajectories into a runnable physical simulation. Today this process still depends on manual tuning of visual foundation models, mesh cleanup, coordinate-frame alignment, and brittle workflow glue across visual perception tools and simulators. We introduce \\textit{Agentic Real2Sim}, a framework for generalized physical world modeling with vision-language agents, converting a real-world recording of object-robot interaction into a simulatable episodic twin which preserves observations, geometries, robot interactions, and object states. We evaluate Agentic Real2Sim on rigid-object manipulation, deformable-object interaction, and humanoid motion scenes, spanning domains that are usually handled by separate Real2Sim pipelines, marking a first step toward scalable conversion. The framework's agentic decisions can be driven by an open-weight VLM backend at a small fraction of the cost of frontier models, while attaining comparable conversion success rate. We aim to use the resulting real-world-aligned twins for downstream robotics tasks, specifically policy learning and evaluation. The project site is available at https://ericchen321.github.io/agentic_real2sim.github.io/.", "pdf_url": "https://arxiv.org/pdf/2607.19190v1"}, {"title": "Bayesian Retraction Optimization for Tissue Attachment Mapping in Surgical Dissection", "authors": ["Shing-Hei Ho", "Bao Thach", "Toan Vo", "James M. Ferguson", "Alan Kuntz"], "published": "2026-07-21", "summary": "With growing surgeon shortages, automating surgical sub-tasks such as tissue dissection offers a promising step toward reducing workload and expanding patient access. Prior work has relied on hand-crafted incision policies that cannot quantify uncertainty or has relied on simulation-based methods that require strong modeling assumptions. We instead view tissue attachment identification as an inherently probabilistic problem and propose a Bayesian approach that avoids explicit tissue modeling. Our method uses a Sequential Bayesian Hilbert Map (SBHM) to represent the likelihood that each tissue point is attached to the underlying resection surface. An ensemble of learned classifiers predicts attachment likelihoods from spatial data acquired during robotic tissue retraction, with each classifier serving as a noisy information source to update the SBHM. To plan the next retraction, we devise Bayesian Retraction Optimization (BRO) to select the most informative action under safety constraints. As the SBHM refines over time, regions with high attachment likelihood are selectively incised. We validate our method in simulation across diverse tissue geometries and acquisition strategies, and demonstrate zero-shot transfer to real robotic dissection experiments.", "pdf_url": "https://arxiv.org/pdf/2607.19174v1"}, {"title": "Latent Riemannian Flow Matching for Geometry-Grounded 3D Foundation Models", "authors": ["Lisa Weijler", "Irene Ballester", "Guofeng Mei", "Tolga Birdal", "Pedro Hermosilla"], "published": "2026-07-21", "summary": "Geometric foundation models, such as the Visual Geometry Grounded Transformer (VGGT), provide strong 3D priors from unposed images. However, such models operate purely in a feed-forward, deterministic regime, \\ie~they cannot generate plausible geometry beyond what the input views directly support. Generative models for 3D scenes, on the other hand, must rely on strong geometric priors to produce coherent outputs from sparse inputs. We bridge these two paradigms by performing flow matching directly in VGGT's latent space, leveraging its learned 3D priors without committing to any explicit downstream representation such as Gaussians, meshes, or video-VAE latents. This requires respecting the latent geometry: VGGT tokens occupy a product of high-dimensional hyperspheres on which standard Euclidean flow matching fails. We address this with a Riemannian Flow Matching framework defined on a product manifold of four hyperspheres, aligned with VGGT's multi-scale encoder, which keeps generated tokens on the valid data manifold required by the frozen decoding heads. On RealEstate10K, ScanNet++ and ETH3D, our method achieves strong performance against recent scene generation baselines in both per-view appearance and aggregated 3D geometry, establishing latent-space flow matching on geometric foundation models as a viable paradigm for 3D generation. The project page can be found $\\href{https://lisaweijler.github.io/geometry-grounded-rfm/}{\\text{here}}$.", "pdf_url": "https://arxiv.org/pdf/2607.19120v1"}, {"title": "Delineate Anything v2: A Global Foundation Model for Field Delineation", "authors": ["Mykola Lavreniuk", "Nataliia Kussul", "Andrii Shelestov", "Yevhenii Salii", "Volodymyr Kuzin", "Charlotte Julia Li-Xing Wang", "Zoltan Szantoi"], "published": "2026-07-21", "summary": "Accurate agricultural field boundary delineation at large scale is a foundational task for food security, supply chain transparency, and carbon accounting. While vision foundation models like SAM show remarkable zero-shot capabilities, they frequently fail in geospatial domains due to topological complexity, cropland texturing patterns, and a lack of physical scale awareness. In this work, we introduce Delineate Anything v2, a globally scalable foundation model designed specifically for wide-area field boundary mapping. We construct FBIS-73M, a 73-million-instance multi-resolution dataset spanning 61 countries. To address the pervasive issue of multi-field administrative parcel merging, we introduce a resolution-specific data curation pipeline that leverages topological image-space adaptation to homogenize merged parcels and strengthen weak physical boundaries. Furthermore, we establish a novel, manually curated evaluation benchmark covering 100 countries to assess independent zero-shot generalization. Our results show that Delineate Anything v2 surpasses the current state-of-the-art, including the Delineate Anything framework, by 0.284 mAP@0.5 (+103.3% relative gain), while maintaining execution speeds suitable for rapid national- and global-scale deployment, as demonstrated by nationwide mapping of Ukraine (603,000 km^2) in 5.4 hours on a consumer-grade workstation. Code, pre-trained weights, the FBIS-73M dataset, and ready-to-use national-scale vector boundary products are publicly available at https://github.com/Lavreniuk/Delineate-Anything.", "pdf_url": "https://arxiv.org/pdf/2607.19069v1"}, {"title": "Mage-Flow: An Efficient Native-Resolution Foundation Model for Image Generation and Editing", "authors": ["Xinjie Zhang", "Peng Zhang", "Shicheng Zheng", "Jinghao Guo", "Zhaoyang Jia", "Yifei Shen", "Xun Guo", "Yuxuan Luo", "Jiahao Li", "Wenxuan Xie", "Fanyi Pu", "Xiaoyi Zhang", "Kaichen Zhang", "Zongyu Guo", "Tianci Bi", "Dongnan Gui", "Zhening Liu", "Zimo Wen", "Zihan Zheng", "Senqiao Yang", "Xiao Li", "Jinglu Wang", "Bin Li", "Yan Lu"], "published": "2026-07-21", "summary": "Large-scale visual generators are increasingly capable but costly to train, fine-tune, and deploy. We introduce Mage-Flow, a compact 4B-scale generative stack for efficient text-to-image generation and instruction-based image editing. The stack is built from two co-designed components: Mage-VAE, a lightweight high-fidelity latent tokenizer, and a Native-Resolution Multimodal Diffusion Transformer trained with rectified flow matching. Mage-VAE uses one-step diffusion-style encoding and decoding with anchor-latent regularization, preserving the reconstruction quality of strong public VAEs while reducing tokenization cost by more than an order of magnitude. Together with native-resolution packing and stack-level CUDA kernel fusion, the stack supports flexible-resolution training and improves end-to-end training throughput by about $2.5\\times$. Built on this foundation, we develop a complete model family with Base, RL-aligned, and Turbo variants for both generation and editing. Diffusion-NFT improves prompt following, text rendering, aesthetic quality, and editing fidelity, while few-step distillation with adversarial perceptual guidance produces 4-step Turbo models for low-latency inference. Despite its compact scale, Mage-Flow and Mage-Flow-Edit achieves competitive performance across standard generation and editing benchmarks. More importantly, the Turbo variants make high-resolution generation and editing practical for interactive use: at $1024^2$ resolution on a single NVIDIA A100 GPU, Mage-Flow-Turbo generates an image in 0.59s, and Mage-Flow-Edit-Turbo edits an image in 1.02s, while maintaining a small memory footprint. These results show that careful tokenizer--backbone--system co-design can deliver strong high-resolution generation and editing within an efficient 4B model family.", "pdf_url": "https://arxiv.org/pdf/2607.19064v1"}, {"title": "Deep learning-based prediction of time-resolved adhesive forces in viscoelastic Hertzian contacts", "authors": ["Ali Maghami", "Merten Stender", "Michele Ciavarella", "Antonio Papangelo"], "published": "2026-07-21", "summary": "Fast prediction of the response of adhesive soft viscoelastic contacts represents a current challenge in soft robotics and for gripping and manipulation tasks. Determining the complete time-resolved force trajectory requires full numerical simulations, whose computational cost is strongly parameter-dependent, making them impractical for real-time application or design-optimization loops. In this work, we overcome this limitation by training a scalar-conditioned, stateful, sequence-to-sequence deep learning model to predict the full force evolution from a prescribed displacement history for both short- and long-range adhesion regimes. The data set spans four orders of magnitude in loading and unloading rates and includes varied dwell times, with the Tabor parameter ranging from $0.2$ to $3.2$. To enable learning across these heterogeneous time scales, we introduce a fixed-measurement-step (FMS) representation that converts variable-length trajectories into fixed-length sequences while preserving their physical-time information. Different architectures were trained, including long short-term memory (LSTM) networks, temporal convolutional neural (TCN) networks, and time-distributed dense layers with three different Tabor-conditioning mechanisms. The models were compared using global waveform and error metrics. We found that the best-performing model has an LSTM architecture with concatenated conditioning, which achieves a held-out mean-squared error of $5.0\\times10^{-4}$, a median pull-off-force error of $\\approx2.2\\%$, and a median hysteresis error of $\\approx1.1\\%$. For the held-out protocols, the model predicts a complete force trajectory with a median inference time of $0.16$ s. The model is tested across unseen parameter combinations and against analytical limiting cases, providing a rapid surrogate for repeated numerical evaluations with potential use in control-oriented applications.", "pdf_url": "https://arxiv.org/pdf/2607.19060v1"}, {"title": "FilmWorld: Agentic Novel-to-Film Generation through Dynamic Cinematic World Modeling", "authors": ["Jialong Zuo", "Haotong Zuo", "Shiwei Zhang", "Xiang Wang", "Chen Li", "Nong Sang", "Changxin Gao", "Xiang Bai"], "published": "2026-07-21", "summary": "Translating novels into films poses a grand challenge for generative artificial intelligence, requiring conversion of abstract literary prose into long-form, multi-scene visual narratives. While current video generation models excel at short, single-scene clips within narrow temporal and spatial contexts, novel-to-film generation operates in a more complex regime, demanding long-duration content across diverse scenes with dynamically evolving entity states. To address this, we formalize novel-to-film generation as dynamic cinematic world modeling, decomposed into two phases: construction, which grounds abstract, underspecified literary narratives into concrete, stateful, and persistent world entities; and evolution, which governs how these entities dynamically update under plot progression to maintain causal consistency across scenes. We propose FilmWorld, an end-to-end agentic system where two groups of specialized agents collaborate to instantiate these phases. Construction-side agents perform narrative structured translation, world entity state modeling with visual anchoring, and state-driven shot planning, progressively projecting literary language into a cinematic blueprint. Evolution-side agents perform state-anchored visual generation, cross-shot dynamic state propagation, and closed-loop state verification to maintain causal consistency and visual coherence. To address the evaluation gap in long-form generation, we introduce FilmEval, a systematic evaluation framework that couples a difficulty-graded benchmark of 15 representative novels with an automated protocol of nine objective metrics spanning three dimensions: cinematic presentation, film consistency, and novel fidelity. Experiments demonstrate that FilmWorld consistently outperforms state-of-the-art video generation agent systems, with particularly pronounced improvements in narrative fidelity and cross-scene consistency.", "pdf_url": "https://arxiv.org/pdf/2607.19038v1"}, {"title": "Athena-Brain Technical Report: An Efficient Robot Brain for General Intelligence and Embodied Interactio", "authors": ["Jialian Li", "Junhong Liu", "Yuchen Cao", "Weiran Guo", "Jiaming Song", "Xutao Wang", "Yi Zhao", "Jiangpin Liu", "Jie Chen"], "published": "2026-07-21", "summary": "Large language models (LLMs) have demonstrated remarkable capabilities in language understanding, reasoning, and world knowledge. As embodied agents become increasingly capable, there is a growing demand for compact models that can serve as an on-device brain, preserving the broad general intelligence of LLMs while enabling effective high-level interaction with embodied environments. Existing approaches, however, often prioritize either general-purpose intelligence or specialized embodied capabilities, making it challenging to satisfy both requirements within a single model. We present \\textbf{Athena-Brain-8B}, an 8B LLM designed to serve as an on-device brain for embodied intelligence for embodied intelligence. Through a multi-stage post-training pipeline consisting of General Supervised Fine-Tuning, General Reinforcement Learning, Embodied Expert training, and Model Merge, Athena-Brain-8B maintains strong general capabilities while acquiring strong high-level embodied interaction capabilities and generating concise responses for efficient embodied interaction. Experimental results demonstrate the effectiveness of Athena across both general and embodied evaluations. Compared with the corresponding Qwen3-8B thinking model, Athena-Brain-8B achieves comparable performance on general language and reasoning benchmarks while generating substantially shorter responses. On in-domain embodied benchmarks, Athena-Brain-8B consistently outperforms models of similar scale and surpasses several substantially larger frontier models evaluated zero-shot, demonstrating that compact language models can effectively integrate strong general intelligence with embodied capabilities.", "pdf_url": "https://arxiv.org/pdf/2607.18985v1"}, {"title": "Design and stability analysis of an underactuated hand with passively rotating fingers", "authors": ["Léonie Plancoulaine", "Sylvain Guégan", "Franck Plestan", "Damien Chablat"], "published": "2026-07-21", "summary": "This paper presents an innovative design and stability analysis of an underactuated robotic finger with spatial mobility, designed to enhance gripping dexterity in robotic hands. The finger architecture incorporates a revolute joint at its base, enabling passive spatial rotation that facilitates both cylindrical and spherical grasping. With only two phalanges per finger, the design simplifies kinematic complexity while supporting precision and enveloping grasps. Stability criteria, based on the moment at the finger base joint induced by contact forces, are introduced to ensure reliable object gripping and prevent ejection during manipulation. The study also examines a differential mechanism that distributes a single actuation torque across multiple fingers, allowing adaptive and coordinated motion. This mechanism enhances the hand's ability to grasp diverse object shapes with minimal pre-grasp adjustments, leveraging passivity for autonomous adaptation. Theoretical findings are experimentally validated using a fully mechanical prototype, demonstrating versatility in performing cylindrical, spherical, parallel, and enveloping grasps. The integration of underactuation-both within individual fingers and among multiple fingers-reduces mechanical complexity, cost, and control demands while preserving functional adaptability. This work advances the development of compliant robotic hands suitable for applications requiring dexterity and robustness, such as agricultural robotics, logistics, assistive technologies, and waste sorting. Future research will focus on automating actuation and refining control strategies to further improve grasp stability and precision, paving the way for autonomous manipulation in unstructured environments.", "pdf_url": "https://arxiv.org/pdf/2607.18950v1"}, {"title": "The Twist Decomposition of Serial Robots Under Lower-Mobility Tasks", "authors": ["Luc Baron", "Damien Chablat"], "published": "2026-07-21", "summary": "This paper introduces a twist decomposition framework for serial manipulators performing lower mobility tasks. Rather than relying on Jacobian null-space projections, the method separates the end-effector twist into task and redundant components using geometrically defined twist projectors. This formulation provides a direct and intuitive distinction between task-relevant and task-irrelevant motions in operational space, enabling a compact inverse kinematics scheme that naturally handles both manipulator and task redundancy.", "pdf_url": "https://arxiv.org/pdf/2607.18940v1"}, {"title": "NGPS: GPS-Denied Aerial Geo-Localization and 2.5D Reconstruction via Deep Satellite Image Matching and Multi-Rate Sensor Fusion", "authors": ["Sanket Sharma"], "published": "2026-07-21", "summary": "We present NGPS (Next-Generation Positioning System), a visual geo-localization framework for high-altitude UAVs that provides GPS-free absolute positioning by matching down-facing images to georeferenced satellite imagery with deep features. The system combines (1) adaptive confidence-weighted UKF fusion, where NGPS covariance is modulated by RANSAC inlier ratio, reprojection error, and match confidence; (2) velocity-predictive kernel extraction, using VIO velocity to predict the satellite search region; and (3) an asynchronous multi-rate temporal priority queue that interleaves absolute position (1-2 Hz), VIO (10-20 Hz), and IMU (100-200 Hz) updates in chronological order. Globally optimized poses from VINS pose-graph optimization, anchored by NGPS corrections, further enable real-time 2.5D georeferenced orthomosaic reconstruction. On five flight sequences (60-150 m AGL), NGPS achieves 2.94 m position RMSE, with worst-case ATE 6.04 m at 150 m AGL and 2 m/s, yielding a 3.5x improvement over standalone monocular VIO. The system runs in real time on an NVIDIA Jetson Orin NX. Part of the implementation is open-sourced at https://github.com/snktshrma/ngps_flight.", "pdf_url": "https://arxiv.org/pdf/2607.18936v1"}, {"title": "NaviAIS: A Scenario-Level Vessel Trajectory Prediction Dataset withVectorized Lane Priors and the NaviLane Forecasting Framework", "authors": ["Yuan Gui", "Hongchen Luo", "Liqi Qu", "Longyue Fu", "Jiao Wang"], "published": "2026-07-21", "summary": "Vessel trajectory prediction in complex maritime environments is essential for traffic management, collision warning, route planning, and autonomous navigation. Although AIS-based learning methods have progressed rapidly, existing datasets are often released as raw message streams or irregular time series, with inconsistent sampling rates, noisy observations, heterogeneous coordinate systems, and non-unified scenario protocols. Most public AIS resources also lack structured representations of navigational lanes, waterway geometry, and navigable-region constraints, limiting reproducible, environment-aware forecasting. To address this, we introduce NaviAIS, a standardized scenario-level AIS dataset for vessel trajectory prediction. It organizes multi-vessel historical-future trajectories within unified temporal windows and local coordinate systems, and provides rasterized navigable maps, vectorized lane priors, lane graphs, and structured map representations. Compared with existing datasets, it jointly supports vectorized lanes, multi-scenario coverage, vectorized maps, open accessibility, and processed trajectories. Built on this dataset, we propose NaviLane, a hierarchical macro-action framework for map-aware prediction. NaviLane first performs trajectory-map joint encoding for a unified scene representation, then uses a discrete macro-action codebook to generate multimodal candidates coarse-to-refined. A residual refinement module improves local geometric and dynamical consistency, and a world-model-based consequence-aware evaluator ranks candidates by interaction risk and environmental feasibility. Experiments show NaviLane outperforms representative baselines in both single-modal and multimodal settings, confirming the value of structured navigational priors, hierarchical multimodal generation, and consequence-aware evaluation.", "pdf_url": "https://arxiv.org/pdf/2607.18887v1"}, {"title": "Pose-Parameterized Motion Planning and CBF-QP Self-Collision Filtering for a Long-Reach Drilling Boom", "authors": ["Mehdi Heydari Shahna", "Tuomo Kivelä", "Jouni Mattila"], "published": "2026-07-21", "summary": "Long-reach drilling booms must reach successive poses without self-collision. Moving from operator-supervised control toward autonomy requires collision-aware motion planning and execution. For the Sandvik SB60, this study adapts established methods by integrating pose-parameterized planning with a capsule-based control barrier function quadratic program (CBF-QP) in measured-state inverse kinematics (IK). A fixed task-specific parameter set within each task generates waypoints, detours, timed references, and chained motion without target-specific retuning. The offline detour planner screens candidate waypoints using 23 selected rod-segment-to-body-region distances, whereas the online CBF-QP filters joint velocities using 14 configured capsule-pair constraints from a nine-primitive whole-body capsule model. Evaluation considers two drilling tasks in a manufacturer-developed SB60 Simscape Multibody model: a five-target restricted-orientation tour and a three-target full-pose tour. Across several hundred thousand samples, the method produced zero IK failures, generated several detour waypoints, achieved millimetre-level mean final-position error, and recorded no sampled CBF margins below the reported thresholds.", "pdf_url": "https://arxiv.org/pdf/2607.18855v1"}, {"title": "WorldScape Policy 2.0: Empowering Steerable World Action Modeling with Reasoning-Augmented Memory", "authors": ["Haisheng Su", "Zongdai Liu", "Xin Jin", "Haoxuan Dou", "Chengming Hu", "Baorun Li", "Zhanwang Liu", "Ruiyan Xu", "Jianjie Fang", "Xin Zhang", "Zhenjie Yang", "Xue Yang", "Chen Gao", "Junchi Yan", "Yong Li", "Wei Wu"], "published": "2026-07-21", "summary": "World Action Models (WAMs) offer a promising paradigm for robotic manipulation by jointly modeling visual state transitions and robot actions. However, existing WAMs are constrained by limited temporal context, coarse episode-level language supervision, and predominantly text-only conditioning, which hinder task-progress tracking and fine-grained language-video-action grounding while limiting visual-context reasoning and cross-embodiment transfer. In this paper, we introduce WorldScape Policy 2.0, a controllable WAM with reasoning-augmented long short-term memory. Its causal short-term visual memory supplies recent observations as DiT prefill to preserve local interaction dynamics, while its long short-term event memory organizes historical VLM outputs into global-history, local-active, and event-boundary representations for progress-aware retrieval. The retrieved history augments perception and autoregressively generated planning tokens, yielding an implicit subgoal condition for autonomous planning; semantic forcing further transfers event-level instruction semantics into this latent planning pathway. To establish fine-grained multimodal controllability, we construct ManipEvent-5M, an event-grounded embodied pretraining dataset containing nearly 5 million event segments with aligned action trajectories, episode-level task instructions, segment-level subtask captions, goal images, and video demonstrations. These designs provide a unified interface for autonomous planning from high-level instructions and controllable execution from fine-grained text, goal-image, or video-context prompts. Experiments in both simulation and real-world platforms demonstrate superior capabilities in long-horizon autonomous planning, fine-grained instruction following and in-context adaptation.", "pdf_url": "https://arxiv.org/pdf/2607.18840v1"}, {"title": "Beyond Transformers: Linear Attention Policy for Open-Vocabulary Object Goal Navigation", "authors": ["Jiahong Zhang", "Yifan Lin", "Yandong Zhang", "Sijun Shen", "Kexin Wang", "Yuqi Pan", "Hongjuan Pei", "Wei Wang", "Guoqi Li"], "published": "2026-07-21", "summary": "Open-Vocabulary Object Goal Navigation (OVON) requires agents to operate under partial observability, making effective internal state updates critical for navigation performance. This update is implemented by the policy network, where recent approaches adopt Transformer-based backbones with self-attention over a context window to integrate temporal information. However, our controlled experiments show that performance does not scale with context length under Transformer-based policies, questioning the suitability of self-attention for state integration in navigation. To this end, we propose Linear Attention-based Navigation (LANav), which adopts linear attention (LA) as the policy backbone to maintain a structured state update rather than self-attention over the context window. Across multiple LA variants evaluated under identical settings, LANav consistently outperforms Transformer-based baselines. Performance improves as state update mechanisms become more structured and regulated, highlighting the importance of state update design. To improve state update effectiveness, we introduce Weighted State-Expansion Linear Attention (WSLA), which expands each attention head's state into multiple sub-states and uses learnable weighted readout to aggregate expanded sub-states. Equipped with WSLA, LANav achieves 36.4% average success rate (SR) on HM3D-OVON, outperforming Transformer-based counterparts by 6.3 percentage points in macro-averaged SR, while maintaining computational efficiency. Distance-stratified results show larger gains in long-distance episodes, while HSSD transfer and fine-tuning demonstrate robustness across scene distributions. Real-world deployment on a Unitree Go2 further achieves an 82% success rate over 50 trials, supporting the practical feasibility and sim-to-real transfer of LANav.", "pdf_url": "https://arxiv.org/pdf/2607.18794v1"}, {"title": "GLID: Gated Local Intrinsic Dimension Repairs the Blind Spots of Face-Forgery Detectors", "authors": ["Guang Yang", "Fengchen Liu"], "published": "2026-07-21", "summary": "Fine-tuned foundation-model detectors dominate face-forgery benchmarks, yet they stay blind to generator families absent from training. We present GLID, a detector that repairs this blind spot with geometry instead of data. GLID treats the patch tokens of a single image as a sample from a manifold and estimates their local intrinsic dimension (LID) at several depths of a frozen vision transformer. This 12-dimensional, training-free signal enters a fine-tuned detector through a confidence gate whose strength is calibrated purely in-distribution. On a 16-axis cross-generator benchmark, GLID reaches 0.805 mean AUC, first among retrained state-of-the-art baselines and never significantly behind the strongest of them on any axis. It lifts the generation axes by +0.084 AUC while moving reenactment by only -0.005. Two empirical laws explain the design. First, forged faces bend the token manifold at family-specific depths: GAN artifacts peak at the last layer, diffusion artifacts peak mid-network, and the pattern survives four backbones, three dimension estimators, and non-face imagery. Second, fine-tuning absorbs auxiliary gains exactly where training data covers: injecting 1% target-family images erases a +0.100 gain, so geometric signals matter precisely where data is unavailable. The deterministic signal also cuts the cross-seed spread of accuracy 5.5x. Code, preregistered analysis gates, and per-image scores accompany the paper.", "pdf_url": "https://arxiv.org/pdf/2607.18770v1"}, {"title": "Koopman DCM: Unstable Eigenfunctions as Data-driven Representations for Legged Balancing", "authors": ["Stéphane Caron"], "published": "2026-07-21", "summary": "In legged locomotion, divergent components of motion (DCMs) have emerged as characteristic states for balance control. They isolate the unstable mode of the dynamics but, in existing formulations, apply only to reduced models such as the linear inverted pendulum. In this study, we show how DCMs can be more generally formulated as Koopman eigenfunctions. Whereas Koopman analysis typically targets eigenvalues near zero, which capture conserved or slowly varying quantities, our investigation leads us to deliberately search for unstable eigenpairs with large eigenvalues. The resulting Koopman DCMs are data-driven observables trained using only real-robot data. On a real biped, DCMs learned from one hour of robot data improve tracking of reference walking patterns. We further show how learned DCMs provide state-based viability constraints when combined with model predictive control.", "pdf_url": "https://arxiv.org/pdf/2607.18760v1"}, {"title": "Motion Primitive Discovery in a Humanoid Robot via Self-Organising Maps for Phase Recognition", "authors": ["Radovan Gregor", "Igor Farkaš"], "published": "2026-07-21", "summary": "Understanding the computational basis of action recognition is a central challenge in social cognition as well as in human-robot interaction. Inspired by the Mirror Neuron System (MNS), we propose a two-level architecture for motor primitive discovery and online phase recognition applied to the NICO humanoid robot. At the first level, two Self-Organising Maps (SOMs) learn topographic representations of arm kinematics (A-SOM) and hand kinematics (H-SOM) from simulated trials covering seven motor actions. The maps are trained on non-redundant features identified through hierarchical correlation analysis of motion trajectories. The results show that the two SOMs encode complementary aspects of motor behaviour. At the second level, an Echo State Network (ESN) evaluates whether temporal trajectories of SOM activations, represented by consecutive best-matching units, are sufficient for online recognition of the currently executed movement phase. The results show that SOM-based trajectories preserve the dominant phase-discriminative structure of the movement, while contextual information provides only a secondary refinement. Our contribution is the integration of established SOM and ESN methods within an MNS-inspired architecture for motor primitive representation and online phase recognition. The results are compatible with the computational hypothesis that self-organised motor representations, when temporally integrated, can support accurate online recognition of ongoing movement phases.", "pdf_url": "https://arxiv.org/pdf/2607.18737v1"}, {"title": "Correct-by-Construction Behavior Tree Synthesis from Signal Temporal Logic Specifications with Application to Robotic Missions", "authors": ["Jiaheng Dong", "Jingyi Huang", "Liang Han"], "published": "2026-07-21", "summary": "Behavior Trees (BTs) are widely adopted for complex task execution in robotics, providing modular, reactive control but lacking formal guarantees. However, existing correct-by-construction synthesis from Linear Temporal Logic (LTL) cannot express quantitative timing constraints. This letter synthesizes correct-by-construction BTs from Signal Temporal Logic (STL) specifications. The workspace is modeled as a timed transition system and abstracted into a zone graph, and an augmented state space tracking both logical progress and timing constraints is introduced. A hierarchical fixed-point algorithm computes winning sets for an STL fragment encompassing safety, reachability, response, recurrence, and persistence, yielding BT subtrees with a runtime constraint function. Correctness guarantees are proven and complexity bounds are derived. Simulations demonstrate specification satisfaction with strictly positive robustness, and a physical quadrotor experiment with six STL specifications validates practical deployability.", "pdf_url": "https://arxiv.org/pdf/2607.18731v1"}, {"title": "DWM: Separating World Effects from Actions in Latent World Models", "authors": ["Yi-Ge Zhang", "Tianqi Du", "Qi Zhang", "Yisen Wang"], "published": "2026-07-21", "summary": "Latent world models underpin much of modern model-based control, yet current action-conditioned formulations supervise the next-latent transition with a single, undifferentiated target, forcing a monolithic learning signal to absorb every source of state change. In real world, however, transitions arise from two heterogeneous sources: an action-driven component induced by the agent, and an action-invariant world effect -- the change that would still occur under a null action, dictated by the environment's intrinsic dynamics (e.g., gravity-driven sliding, inertia, contact rebound, and persistent drift). Fusing them into a single target entangles the two inside the latent transition, prevents the model from attributing observed changes to their underlying causes, and undermines the transferability of the learned dynamics. We introduce DWM (Decomposed World Model), a supervision-level framework that operationalizes this decomposition. DWM augments the predictor of a latent world model with an auxiliary world head, regularized by a normalized world-contrastive objective to be action-invariant, while the original pred head is coupled to it via an orthogonality constraint; together, the two signals induce an explicit additive decomposition of the predicted transition into an action-invariant and a complementary action-driven component, without altering the underlying architecture or inference pipeline. To evaluate DWM under persistent world effects, we construct W-variants of three standard control benchmarks -- PushT-W, Reacher-W, and TwoRoom-W -- each instantiating a distinct action-invariant dynamic. DWM matches strong baselines on the flat counterparts and delivers a mean absolute improvement of 13.1% in CEM planning success across the W-variants.", "pdf_url": "https://arxiv.org/pdf/2607.18715v1"}, {"title": "Confidence-Gated Vision-Only Heading Alignment for UAV-UGV Cooperative Systems", "authors": ["Reza Ahmari", "Vahid Hemmati", "Parham Kebria", "Olusola Odeyomi", "Kaushik Roy", "Abdollah Homaifar"], "published": "2026-07-21", "summary": "Vision-based heading prediction is useful for UAV--UGV cooperation, but accurate prediction alone does not guarantee that every predicted heading should be issued directly as a control command. This paper investigates the decision problem of when and how a fixed vision-based heading predictor should be trusted for command issuance. A lightweight confidence-gated framework is proposed in which execution decisions are made using two interpretable reliability proxies derived from the perception stream: bounding-box area as a visibility-related proxy and short-window variation in predicted heading as a stability-related proxy. During low-confidence intervals, the framework compares the baseline freeze-HOLD policy with a bounded-blend fallback that updates the issued command conservatively. The method is evaluated on a real UAV--UGV dataset under clean and perturbed conditions. The results show that confidence gating creates a clear trade-off among execution rate, executed-frame accuracy, issued-command accuracy, and smoothness. The results further show that sparse execution can cause severe stale-command error under the baseline freeze-HOLD policy, whereas the bounded-blend fallback substantially improves command-level behavior under the same gate decisions. These findings highlight that reliable perception-driven autonomy depends not only on prediction accuracy, but also on decision-aware command issuance during low-confidence", "pdf_url": "https://arxiv.org/pdf/2607.18713v1"}, {"title": "RoboInter1.5: A Holistic Intermediate Representation Suite for Embodied World Modeling and Robotic Manipulation", "authors": ["Ziqin Wang", "Hao Li", "Weijun Wang", "Junhao Cai", "Jia Zeng", "Yilun Chen", "Jiangmiao Pang", "Si Liu"], "published": "2026-07-21", "summary": "Existing robot datasets remain expensive to curate, embodiment-specific, and insufficiently annotated with the fine-grained structure required for generalizable reasoning, execution, or long-horizon environment dynamics simulation. Building on our prior work, RoboInter1.0, we present RoboInter1.5, an extended and holistic suite of intermediate representations for both robotic manipulation and embodied world modeling. RoboInter1.5 provides a unified resource of data, benchmarks, and models centered on dense manipulation-oriented intermediate representations. Specifically, RoboInter-Data contains over 230k manipulation episodes across 571 scenes with dense per-frame annotations covering more than ten types of intermediate representations, including subtasks, primitive skills, object and gripper grounding, segmentation, affordance, grasp poses, contact points, motion traces, etc. Built upon these annotations, RoboInter-VQA introduces spatial and temporal embodied VQA tasks to benchmark and improve the intermediate-representation reasoning capabilities of our RoboInter-VLM. RoboInter-VLA further studies how such representations benefit action execution through implicit, explicit, and modular plan-then-execute paradigms. To better model the physical world, we further introduce RoboInter-World, which leverages intermediate representations as structured conditioning signals for controllable prediction of future world states. Extensive evaluations demonstrate that RoboInter1.5 provides a unified spatiotemporal scaffolding for intermediate representations. Rather than treating intermediate representations merely as interpretable signals, RoboInter1.5 conceptualizes them as a bidirectional interface that both regularizes low-level action spaces and constrains the latent rollouts of open-world physical simulators.", "pdf_url": "https://arxiv.org/pdf/2607.18709v1"}], "repos": [{"repo": "NVIDIA/skills", "stars": 2646, "language": "Python", "description": "Agent Skills for NVIDIA products — install into Claude Code, Codex, and other coding agents to run Physical AI, robotics, simulation, CUDA, and RAG workflows end to end.", "url": "https://github.com/NVIDIA/skills", "date": "2026-07-22", "topic": "physical-ai", "score": 1058.5}, {"repo": "copper-project/copper-rs", "stars": 1421, "language": "Rust", "description": "Copper is an operating system for robots -  build, run, and replay your entire robot deterministically.", "url": "https://github.com/copper-project/copper-rs", "date": "2026-07-22", "topic": "physical-ai", "score": 568.5}, {"repo": "mosaico-labs/mosaico", "stars": 892, "language": "Python", "description": "Mosaico - The data platform for Physical AI", "url": "https://github.com/mosaico-labs/mosaico", "date": "2026-07-22", "topic": "physical-ai", "score": 356.9}, {"repo": "RobotecAI/rai", "stars": 555, "language": "Python", "description": "RAI is a vendor agnostic agentic framework for Physical AI robotics, utilizing ROS 2 tools to perform complex actions, defined scenarios, free interface execution, log summaries, voice interaction and more.", "url": "https://github.com/RobotecAI/rai", "date": "2026-07-22", "topic": "physical-ai", "score": 222.1}, {"repo": "awslabs/awsome-distributed-ai", "stars": 465, "language": "Shell", "description": "Collection of best practices, reference architectures, model training examples and utilities to train large models on AWS. ", "url": "https://github.com/awslabs/awsome-distributed-ai", "date": "2026-07-22", "topic": "physical-ai", "score": 186.1}, {"repo": "ros-claw/rosclaw", "stars": 170, "language": "Python", "description": "Self-evolving runtime infrastructure for Physical AI and embodied agents. Ground AI agents into robot bodies with e-URDF, sandbox safety, capability routing,
