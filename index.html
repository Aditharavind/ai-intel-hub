<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Physical AI Intelligence Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
  /* ═══════════════ VARIABLES ═══════════════ */
  :root {
    --bg:#06090f; --glass:rgba(12,17,28,.58); --glass2:rgba(10,15,24,.72);
    --glass3:rgba(8,12,20,.88); --gb:rgba(255,255,255,.055);
    --gb2:rgba(255,255,255,.09); --blur:blur(22px) saturate(1.6);
    --blur2:blur(28px) saturate(1.4);
    --text:#e8f0fa; --t2:#9ab5cc; --t3:#5a7d96; --muted:#304d62;
    --sb:rgba(4,7,14,.92); --sb-text:#7aa0be; --sb-muted:#2e4a60;
    --sb-hover:rgba(255,255,255,.04); --sb-active:rgba(124,58,237,.14);
    --sb-active-t:#c4b5fd;
    --acc:#818cf8; --acc2:#6366f1; --acc3:#7c3aed;
    --apale:rgba(129,140,248,.12); --apale2:rgba(129,140,248,.2);
    --sh:0 4px 24px rgba(0,0,0,.4),0 1px 3px rgba(0,0,0,.3);
    --sh-md:0 8px 40px rgba(0,0,0,.5),0 2px 6px rgba(0,0,0,.35);
    --sh-lg:0 16px 60px rgba(0,0,0,.6),0 4px 12px rgba(0,0,0,.4);
    --r:14px; --rsm:9px; --rxs:7px;
    --c-all:#818cf8; --c-aiNews:#38bdf8; --c-physicalAiNews:#a78bfa;
    --c-roboticsNews:#fbbf24; --c-embeddedNews:#22d3ee; --c-papers:#34d399; --c-repos:#60a5fa;
    --c-models:#fb923c; --c-funding:#a3e635; --c-companies:#f472b6; --c-jobs:#2dd4bf;
    --c-vla:#818cf8; --c-wam:#a78bfa; --c-robotPolicy:#2dd4bf;
    --c-rlPolicy:#fbbf24; --c-simulation:#60a5fa;
  }
  [data-theme="light"] {
    --bg:#f0f4f8; --glass:rgba(255,255,255,.92); --glass2:rgba(248,250,252,.96);
    --glass3:rgba(255,255,255,.98); --gb:rgba(0,0,0,.07); --gb2:rgba(0,0,0,.1);
    --blur:none; --blur2:none;
    --text:#0f172a; --t2:#334155; --t3:#64748b; --muted:#94a3b8;
    --sb:rgba(10,18,32,.96); --sb-text:#8ba5c4; --sb-muted:#2e4a60;
    --sh:0 1px 4px rgba(0,0,0,.07),0 2px 8px rgba(0,0,0,.05);
    --sh-md:0 4px 16px rgba(0,0,0,.1); --sh-lg:0 8px 32px rgba(0,0,0,.13);
    --acc:#6366f1; --acc2:#4f46e5; --acc3:#7c3aed;
    --apale:rgba(99,102,241,.08); --apale2:rgba(99,102,241,.16);
    --c-all:#6366f1; --c-aiNews:#0284c7; --c-physicalAiNews:#7c3aed;
    --c-roboticsNews:#d97706; --c-embeddedNews:#0891b2; --c-papers:#059669; --c-repos:#2563eb;
    --c-models:#ea580c; --c-funding:#65a30d; --c-companies:#db2777; --c-jobs:#0d9488;
    --c-vla:#6366f1; --c-wam:#7c3aed; --c-robotPolicy:#0d9488;
    --c-rlPolicy:#d97706; --c-simulation:#2563eb;
  }

  /* ═══════════════ RESET ═══════════════ */
  *,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
  html { scroll-behavior:smooth; }
  body {
    font-family:'Inter',ui-sans-serif,system-ui,sans-serif;
    background:var(--bg); color:var(--text); line-height:1.5; min-height:100vh;
    overflow-x:hidden;
  }
  a { color:inherit; text-decoration:none; }

  /* ═══════════════ BACKGROUND ═══════════════ */
  #bgCanvas {
    position:fixed; inset:0; z-index:0; pointer-events:none;
    width:100%; height:100%; opacity:.55;
  }
  [data-theme="light"] #bgCanvas { opacity:.1; }

  .orb {
    position:fixed; border-radius:50%;
    pointer-events:none; z-index:0;
    filter:blur(100px); opacity:.12;
    animation:floatOrb 22s ease-in-out infinite;
  }
  .orb1 {
    width:600px; height:600px; top:-180px; left:-150px;
    background:radial-gradient(circle,#7c3aed 0%,transparent 70%);
    animation-duration:22s;
  }
  .orb2 {
    width:500px; height:500px; bottom:-100px; right:-120px;
    background:radial-gradient(circle,#0ea5e9 0%,transparent 70%);
    animation-duration:28s; animation-direction:reverse;
  }
  .orb3 {
    width:360px; height:360px; top:45%; left:55%;
    background:radial-gradient(circle,#6366f1 0%,transparent 70%);
    animation-duration:18s; opacity:.07;
  }
  [data-theme="light"] .orb { opacity:.03; }

  @keyframes floatOrb {
    0%,100% { transform:translate(0,0) scale(1); }
    25%      { transform:translate(40px,-30px) scale(1.05); }
    50%      { transform:translate(-25px,50px) scale(.96); }
    75%      { transform:translate(30px,20px) scale(1.03); }
  }

  /* ═══════════════ LAYOUT ═══════════════ */
  .layout {
    display:grid; grid-template-columns:268px minmax(0,1fr);
    min-height:100vh; position:relative; z-index:2;
  }

  /* ═══════════════ SIDEBAR ═══════════════ */
  .sidebar {
    background:var(--sb); backdrop-filter:var(--blur2);
    -webkit-backdrop-filter:var(--blur2);
    position:sticky; top:0; height:100vh;
    display:flex; flex-direction:column; overflow:hidden;
    border-right:1px solid var(--gb2);
    box-shadow:4px 0 40px rgba(0,0,0,.4);
    z-index:20;
  }
  .brand {
    padding:22px 18px 16px; flex-shrink:0;
    background:linear-gradient(180deg,rgba(124,58,237,.18) 0%,transparent 100%);
    border-bottom:1px solid rgba(124,58,237,.2);
  }
  .brand-row { display:flex; align-items:center; gap:12px; }
  .brand-logo {
    width:44px; height:44px; border-radius:12px; flex-shrink:0;
    background:linear-gradient(135deg,#7c3aed 0%,#4f46e5 100%);
    display:flex; align-items:center; justify-content:center; font-size:22px;
    box-shadow:0 0 24px rgba(124,58,237,.55),0 4px 14px rgba(0,0,0,.4);
  }
  .brand-name { font-size:14.5px; font-weight:800; color:#f0f6fc; letter-spacing:-.015em; }
  .brand-sub  { font-size:11px; color:var(--sb-text); margin-top:2px; }

  .nav-scroll { flex:1; overflow-y:auto; padding:8px 8px; }
  .nav-scroll::-webkit-scrollbar { width:0; }
  .nav-sec {
    font-size:9.5px; font-weight:700; letter-spacing:.09em; text-transform:uppercase;
    color:var(--sb-muted); padding:10px 10px 3px;
  }
  .nav-btn {
    display:flex; align-items:center; gap:9px; width:100%;
    border:none; background:transparent; color:var(--sb-text);
    font:inherit; font-size:13.5px; font-weight:500;
    padding:8px 10px; border-radius:9px; cursor:pointer;
    text-align:left; transition:all .15s; margin-bottom:2px;
    position:relative;
  }
  .nav-btn::before {
    content:''; position:absolute; left:0; top:50%;
    transform:translateY(-50%) scaleY(0);
    width:3px; height:65%; border-radius:0 3px 3px 0;
    background:var(--acc); transition:transform .2s cubic-bezier(.34,1.56,.64,1);
  }
  .nav-btn:hover { background:var(--sb-hover); color:#d0e4f4; }
  .nav-btn.active {
    background:var(--sb-active); color:var(--sb-active-t); font-weight:600;
    box-shadow:inset 0 0 0 1px rgba(129,140,248,.15);
    text-shadow:0 0 20px rgba(196,181,253,.4);
  }
  .nav-btn.active::before { transform:translateY(-50%) scaleY(1); }
  .nav-ico { font-size:15px; width:20px; text-align:center; flex-shrink:0; }
  .nav-lbl { flex:1; }
  .nav-cnt {
    font-size:10.5px; font-weight:700; padding:1px 7px;
    border-radius:999px; background:rgba(255,255,255,.05); color:var(--sb-muted);
  }
  .nav-btn.active .nav-cnt {
    background:rgba(129,140,248,.18); color:var(--sb-active-t);
  }

  .sb-foot {
    padding:12px 18px 14px; border-top:1px solid var(--gb);
    font-size:11px; color:var(--sb-muted); flex-shrink:0;
    display:flex; flex-direction:column; gap:3px;
  }
  .sb-foot strong { color:var(--t3); font-weight:600; }
  .sb-about {
    margin-top:12px; padding-top:10px; border-top:1px solid var(--gb);
    display:flex; flex-direction:column; gap:2px;
  }
  .sb-about-lbl {
    font-size:9px; font-weight:700; letter-spacing:.12em; text-transform:uppercase;
    color:var(--sb-muted); margin-bottom:2px;
  }
  .sb-about-by { font-size:11px; color:var(--sb-text); }
  .sb-about-by strong { color:var(--acc); font-weight:700; }
  .sb-about-mail { font-size:10.5px; color:var(--sb-muted); text-decoration:none; word-break:break-all; }
  .sb-about-mail:hover { color:var(--acc); text-decoration:underline; }
  .refresh-bar {
    margin-top:8px; height:2px; border-radius:1px;
    background:rgba(255,255,255,.06); overflow:hidden;
  }
  .refresh-prog {
    height:100%; border-radius:1px;
    background:linear-gradient(90deg,var(--acc3),var(--acc));
    transition:width .5s ease;
  }

  /* ═══════════════ MAIN ═══════════════ */
  .main { min-width:0; display:flex; flex-direction:column; }

  /* ═══════════════ TOPBAR ═══════════════ */
  .topbar {
    background:var(--glass2); backdrop-filter:var(--blur);
    -webkit-backdrop-filter:var(--blur);
    border-bottom:1px solid var(--gb);
    padding:0 28px; height:64px;
    display:flex; align-items:center; justify-content:space-between; gap:14px;
    position:sticky; top:0; z-index:25;
    box-shadow:0 2px 20px rgba(0,0,0,.3);
  }
  .topbar::after {
    content:''; position:absolute; bottom:0; left:0; right:0; height:1px;
    background:linear-gradient(90deg,#7c3aed,#6366f1 35%,#0ea5e9 70%,transparent);
    opacity:.8;
  }
  .topbar-l { display:flex; align-items:center; gap:13px; min-width:0; }
  .pg-title {
    font-size:18px; font-weight:900; letter-spacing:-.025em;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    background:linear-gradient(135deg,var(--text),var(--acc));
    -webkit-background-clip:text; -webkit-text-fill-color:transparent;
    background-clip:text;
  }
  [data-theme="light"] .pg-title {
    background:linear-gradient(135deg,#0f172a,#6366f1);
    -webkit-background-clip:text; background-clip:text;
  }
  .upd-badge {
    font-size:11px; color:var(--muted); background:var(--glass);
    border:1px solid var(--gb); border-radius:999px;
    padding:3px 10px; flex-shrink:0; white-space:nowrap;
  }
  .topbar-r { display:flex; align-items:center; gap:7px; flex-shrink:0; }
  .btn {
    display:inline-flex; align-items:center; gap:5px;
    height:36px; padding:0 14px;
    border:1px solid var(--gb2); border-radius:var(--rsm);
    background:var(--glass); backdrop-filter:var(--blur);
    color:var(--t2); font:inherit; font-size:13px; font-weight:600;
    cursor:pointer; text-decoration:none; transition:all .15s; white-space:nowrap;
  }
  .btn:hover { background:var(--glass2); border-color:var(--acc); color:var(--text); box-shadow:0 0 12px rgba(129,140,248,.15); }
  .btn-acc {
    background:linear-gradient(135deg,var(--acc3),var(--acc2));
    border-color:transparent; color:#fff;
    box-shadow:0 2px 12px rgba(124,58,237,.4),0 0 0 1px rgba(129,140,248,.2);
  }
  .btn-acc:hover {
    background:linear-gradient(135deg,#6d28d9,var(--acc3));
    box-shadow:0 4px 20px rgba(124,58,237,.5); color:#fff;
    border-color:transparent;
  }
  .ico-btn { width:36px; padding:0; justify-content:center; font-size:16px; }

  /* ═══════════════ CONTENT ═══════════════ */
  .content { padding:22px 28px 52px; flex:1; }

  /* ═══════════════ STATS ═══════════════ */
  .stats {
    display:grid; grid-template-columns:repeat(4,minmax(0,1fr));
    gap:12px; margin-bottom:20px;
  }
  .stat {
    background:var(--glass); backdrop-filter:var(--blur);
    -webkit-backdrop-filter:var(--blur);
    border:1px solid var(--gb); border-radius:var(--r);
    padding:18px 20px 15px; position:relative; overflow:hidden;
    box-shadow:var(--sh);
    transition:transform .3s ease,box-shadow .3s ease;
    cursor:default; transform-style:preserve-3d;
  }
  .stat::before {
    content:''; position:absolute; top:0; left:0; right:0;
    height:2px; background:var(--sc,var(--acc));
    box-shadow:0 0 12px var(--sc,var(--acc));
  }
  .stat::after {
    content:''; position:absolute; inset:0;
    background:radial-gradient(ellipse at top left, rgba(var(--sc-rgb,129,140,248),.06), transparent 60%);
    pointer-events:none;
  }
  .stat-ico { font-size:24px; line-height:1; margin-bottom:10px; display:block;
               filter:drop-shadow(0 0 8px rgba(255,255,255,.2)); }
  .stat-lbl {
    font-size:10.5px; font-weight:700; letter-spacing:.06em;
    text-transform:uppercase; color:var(--t3);
  }
  .stat-num {
    font-size:28px; font-weight:900; letter-spacing:-.04em;
    color:var(--text); line-height:1; margin-top:5px;
  }

  /* ═══════════════ PANEL ═══════════════ */
  .panel {
    background:var(--glass); backdrop-filter:var(--blur);
    -webkit-backdrop-filter:var(--blur);
    border:1px solid var(--gb); border-radius:var(--r);
    box-shadow:var(--sh); overflow:hidden;
  }

  /* ═══════════════ TOOLBAR ═══════════════ */
  .toolbar {
    display:flex; align-items:center; gap:8px; flex-wrap:wrap;
    padding:12px 14px; border-bottom:1px solid var(--gb);
    background:var(--glass2);
  }
  .srch-wrap { position:relative; flex:1; min-width:200px; }
  .srch-ico {
    position:absolute; left:12px; top:50%; transform:translateY(-50%);
    font-size:13px; color:var(--muted); pointer-events:none;
  }
  .srch-inp {
    width:100%; height:38px;
    border:1px solid var(--gb2); border-radius:var(--rsm);
    padding:0 12px 0 34px; background:var(--glass);
    backdrop-filter:var(--blur); color:var(--text);
    font:inherit; font-size:13.5px;
    transition:border-color .15s,box-shadow .15s;
  }
  .srch-inp::placeholder { color:var(--muted); }
  .srch-inp:focus {
    outline:none; border-color:var(--acc);
    box-shadow:0 0 0 3px rgba(129,140,248,.15),0 0 12px rgba(129,140,248,.1);
  }
  .ctrl {
    height:38px; border:1px solid var(--gb2); border-radius:var(--rsm);
    padding:0 10px; background:var(--glass);
    backdrop-filter:var(--blur); color:var(--text);
    font:inherit; font-size:13px; cursor:pointer; flex-shrink:0;
    transition:border-color .15s;
  }
  .ctrl:focus { outline:none; border-color:var(--acc); }
  .vt { display:flex; border:1px solid var(--gb2); border-radius:var(--rsm); overflow:hidden; flex-shrink:0; }
  .vt-b {
    width:36px; height:38px; border:none;
    background:var(--glass); color:var(--muted); font-size:15px;
    cursor:pointer; display:flex; align-items:center; justify-content:center;
    transition:all .13s;
  }
  .vt-b:not(:last-child) { border-right:1px solid var(--gb2); }
  .vt-b.on { background:var(--acc3); color:#fff; box-shadow:inset 0 0 10px rgba(0,0,0,.2); }

  /* ═══════════════ RESULTS BAR ═══════════════ */
  .res-bar {
    display:flex; align-items:center; justify-content:space-between;
    padding:9px 16px; font-size:12.5px; color:var(--muted);
    border-bottom:1px solid var(--gb); background:var(--glass2);
  }
  .res-n { font-weight:700; color:var(--t2); }

  /* ═══════════════ FEED — GRID ═══════════════ */
  .feed.grid-v {
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
    gap:14px; padding:16px;
  }
  .feed.grid-v .fi {
    background:var(--glass); backdrop-filter:var(--blur);
    -webkit-backdrop-filter:var(--blur);
    border:1px solid var(--gb); border-top:2px solid var(--ic,var(--acc));
    border-radius:var(--r); padding:18px;
    box-shadow:var(--sh); cursor:pointer;
    transform-style:preserve-3d; will-change:transform;
    transition:transform .3s ease,box-shadow .3s ease;
    position:relative; overflow:hidden;
  }
  .feed.grid-v .fi::before {
    content:''; position:absolute; top:0; left:0; right:0; height:80px;
    background:linear-gradient(180deg,rgba(var(--ic-r,129,140,248),.06) 0%,transparent 100%);
    pointer-events:none;
  }
  .feed.grid-v .fi-stripe { display:none; }
  .feed.grid-v .fi-body { display:flex; flex-direction:column; height:100%; }
  .feed.grid-v .fi-hdr { margin-bottom:10px; display:flex; align-items:flex-start; justify-content:space-between; gap:8px; }

  /* ═══════════════ FEED — LIST ═══════════════ */
  .feed.list-v .fi {
    padding:16px 20px; border-bottom:1px solid var(--gb);
    transition:background .12s; position:relative;
  }
  .feed.list-v .fi:last-child { border-bottom:none; }
  .feed.list-v .fi:hover { background:var(--glass2); }
  .feed.list-v .fi-wrap { display:flex; gap:14px; align-items:flex-start; }
  .feed.list-v .fi-stripe {
    width:3px; border-radius:3px; flex-shrink:0;
    align-self:stretch; min-height:40px;
    background:var(--ic,var(--acc));
    box-shadow:0 0 8px var(--ic,var(--acc));
    transition:width .15s;
  }
  .feed.list-v .fi:hover .fi-stripe { width:4px; }
  .feed.list-v .fi-body { flex:1; min-width:0; }
  .feed.list-v .fi-hdr {
    display:flex; align-items:flex-start;
    justify-content:space-between; gap:10px;
  }

  /* ═══════════════ ITEM SHARED ═══════════════ */
  .i-cat {
    display:inline-flex; align-items:center; gap:5px;
    font-size:10.5px; font-weight:700; padding:3px 9px;
    border-radius:999px; color:#fff; margin-bottom:8px;
    letter-spacing:.02em;
    box-shadow:0 2px 8px rgba(0,0,0,.3);
  }
  .star-btn {
    flex-shrink:0; background:none; border:none; cursor:pointer;
    font-size:17px; line-height:1; padding:2px 3px; border-radius:6px;
    color:var(--t3); transition:transform .12s, color .12s; margin-top:-2px;
  }
  .star-btn:hover { color:#fbbf24; transform:scale(1.18); }
  .star-btn.on { color:#fbbf24; }
  .i-title {
    font-size:14.5px; font-weight:700; line-height:1.42;
    color:var(--text); display:block; transition:color .13s;
  }
  .i-title:hover { color:var(--acc); }
  .i-score { flex-shrink:0; text-align:right; padding-top:2px; }
  .sc-val {
    font-size:19px; font-weight:900; letter-spacing:-.03em;
    color:var(--acc); line-height:1; display:block;
    text-shadow:0 0 20px rgba(129,140,248,.4);
  }
  .sc-lbl { font-size:10px; color:var(--muted); margin-top:2px; white-space:nowrap; }
  .i-authors {
    display:flex; flex-wrap:wrap; gap:4px;
    margin:6px 0 8px;
  }
  .au { font-size:11px; padding:2px 7px; border-radius:5px;
          background:rgba(255,255,255,.05); border:1px solid var(--gb2);
          color:var(--t3); font-weight:500; }
  [data-theme="light"] .au { background:var(--glass2); }
  .i-sum {
    font-size:13px; color:var(--t2); line-height:1.65;
    margin:6px 0 10px;
  }
  .i-tags {
    display:flex; flex-wrap:wrap; gap:5px; align-items:center;
    margin-top:auto; padding-top:10px;
  }
  .tag {
    display:inline-flex; align-items:center; font-size:11px; font-weight:600;
    padding:2px 9px; border-radius:999px; white-space:nowrap;
  }
  .t-d,.t-s {
    background:rgba(255,255,255,.05); border:1px solid var(--gb2); color:var(--t3);
  }
  [data-theme="light"] .t-d,[data-theme="light"] .t-s {
    background:var(--glass2); border-color:rgba(0,0,0,.09);
  }
  .i-acts { display:flex; gap:6px; margin-top:10px; flex-wrap:wrap; }
  .act {
    display:inline-flex; align-items:center; gap:4px;
    font-size:12px; font-weight:600; padding:5px 12px;
    border-radius:var(--rxs); border:1px solid var(--gb2);
    background:rgba(255,255,255,.04); color:var(--t2);
    text-decoration:none; cursor:pointer; transition:all .13s;
    backdrop-filter:var(--blur);
  }
  .act:hover { background:var(--glass2); color:var(--text); border-color:var(--muted); }
  .act-p {
    background:var(--apale); border-color:rgba(129,140,248,.25); color:var(--acc);
  }
  .act-p:hover {
    background:var(--acc2); border-color:var(--acc2); color:#fff;
    box-shadow:0 2px 12px rgba(99,102,241,.4);
  }

  /* ═══════════════ ENTRY ANIMATIONS ═══════════════ */
  @keyframes cardIn {

s://www.therobotreport.com/boston-dynamics-veterans-launch-dynamic-creatures-to-bring-characters-to-life-with-robotics/", "summary": "<p>Dynamic Creatures plants to create its own line of characters, and to re-create characters for specific brands and environments.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/boston-dynamics-veterans-launch-dynamic-creatures-to-bring-characters-to-life-with-robotics/\">Boston Dynamics veteran launches Dynamic Creatures to bring characters to life with robotics<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Agility Robotics reports $1.8M revenue ahead of humanoid SPAC", "source": "Robotics Business Review", "date": "2026-09-07", "url": "https://www.therobotreport.com/agility-robotics-reports-18m-revenue-ahead-of-humanoid-spac/", "summary": "<p>Agility Robotics’ S-4 filing reveals $1.8 million in 2025 revenue, a $140 million operating loss and plans to scale its Digit humanoid robot business.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/agility-robotics-reports-18m-revenue-ahead-of-humanoid-spac/\">Agility Robotics reports $1.8M revenue ahead of humanoid SPAC<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Video Friday: Digit Redecorates", "source": "IEEE Spectrum Robotics", "date": "2026-09-04", "url": "https://spectrum.ieee.org/video-friday-agility-robotics-digit", "summary": "<img src=\"https://spectrum.ieee.org/media-library/humanoid-robot-tidies-an-orange-couch-while-a-person-watches-in-a-modern-living-room.gif?id=67725697&amp;width=1245&amp;height=700&amp;coordinates=0%2C0%2C0%2C0\" /><br /><br /><p><span>Video Friday is your weekly selection of awesome robotics videos, collected by your friends at <\/span><em>IEEE Spectrum<\/em><span> robotics. We also post a weekly calendar of upcoming robotics events for the next few months. Please <\/span><a href=\"mailto:automaton@ieee.org?subject=Robotics%20event%20suggestion%20for%20Video%20Friday\">send us your events<\/a><span> for inclusion.<\/span><\/p><h5><a href=\"https://humanoidssummit.com/\">Humanoids Summit Seoul<\/a>: 22–23 September 2026, SEOUL<\/h5><h5><a href=\"https://2026.ieee-iros.org/\">IROS 2026<\/a>: 27 September–1 October 2026, PITTSBURGH<\/h5><h5><a href=\"https://www.corl.org/\">CoRL 2026<\/a>: 9–12 November 2026, AUSTIN<\/h5><p>Enjoy today’s videos!<\/p><div class=\"horizontal-rule\"><\/div><div><span style=\"display: none;\"> <\/span><\/div><p class=\"rm-anchors\" id=\"ozpzi8vhgsg\">I know these videos from <a href=\"https://spectrum.ieee.org/digit-agility-robotics\" target=\"_blank\">Agility<\/a> can be a little bit silly, but the couch drag in this one is impressive.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.agilityrobotics.com/\">Agility Robotics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"hbynm1gcxbu\"><em>Stabilizing unsecured payloads against the inherent oscillations of dynamic bipedal locomotion remains a critical engineering bottleneck for humanoids in unstructured environments. To solve this, we introduce ReST-RL, a hierarchical reinforcement-learning architecture that explicitly decouples locomotion from payload stabilization. Successfully deployed on the Unitree G1 humanoid hardware, this modular approach demonstrates highly reliable zero-shot sim-to-real generalization across various objects and external force disturbances.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://steadytray.github.io/\">SteadyTray<\/a> ]<\/p><p>Thanks, Ioana!<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"qbuixdvviv4\"><a href=\"https://spectrum.ieee.org/figure-new-humanoid-robot\" target=\"_blank\">Figure<\/a> is scaling compute so that its robots can...uh...have their compute scaled, I guess?<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>Solving for a robot in every home is not a data-and-compute problem, it’s a safety-and-cost problem.<\/p><p>[ <a href=\"https://www.figure.ai/\">Figure<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"lg0lq7s69g4\">The most important thing to know about this gripper is that koalas have two thumbs on each hand.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://rai-inst.com/resources/blog/handheld-robotic-data-collection/\">RAI Institute<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"frfad-zunfy\">DARPA Triage Challenge Finals are in November!<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.darpa.mil/research/challenges/darpa-triage-challenge\">DARPA<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"ezcbwdvd_ya\"><em>Online, humanoid robots are very impressive to watch, but behind the scenes, most of those movements are carefully choreographed. Researchers in Carnegie Mellon University’s Safe AI Lab are instead teaching robots how to adapt. Their system, called APEX, allows a humanoid robot to navigate obstacles using adaptive, full-body maneuvers.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://engineering.cmu.edu/news-events/news/2026/09/02-robot-human-collaboration.html\">CMU<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"7dl-f9sbnek\"><em>Researchers from North Carolina State University have created teardrop-shaped soft robots that leap upward or forward when exposed to infrared light—and will keep jumping as long as the light is present. <\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><blockquote><em>The robots are made of a liquid-crystal elastomer ribbon shaped like a teardrop, with a thin aluminum tube shaped like a V at one end. When exposed to light from an infrared lamp, the surface of the ribbon contracts, causing the ribbon to rotate. The stiff V at one end of the robot prevents the ribbon from simply rolling in place, causing the ribbon to twist tighter and tighter. This stores energy until the twist reaches a critical point when the ribbon releases that energy, causing the V at one end of the teardrop to snap downward and strike the surface. This launches the teardrop into the air.<\/em><\/blockquote><p>[ <a href=\"https://news.ncsu.edu/2026/08/soft-robots-jumping-forever/\">NC State<\/a> ]<\/p><p>Thanks, Ship!<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"ws6boq4yeaq\">I’ll be honest—I was prepared to be underwhelmed by the DARPA Lift Challenge, but there was such creativity in the heavy-lift drone designs that I’m excited for it to come back in 2028.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.darpaliftchallenge.com/\">DARPA Lift Challenge<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"nh47n7cbx7s\">Thank you, Christian, for attempting to talk some sense into the internet.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.christianhubicki.com/\">Christian Hubicki<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"l9xu2wmkrrg\"><em>Humans use not only muscle signals but also stretched skin around joints as a cue for proprioception. To mimic this biological mechanism, we developed a three-layer joint-covering skin with 44 pressure- and stretch-sensitive elements for the musculoskeletal humanoid Musashi-W.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>It’s not a replicant, but one day, it will be.<\/p><p>[ <a href=\"https://poyotamu000.github.io/musashiw-joint-covering-skin/\">University of Tokyo<\/a> ]<\/p><p>Thanks, Akihiro!<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"8kdxnt-4zl0\">Having mobility issues with your robot? Just staple it to the end of an industrial robotic arm. Problem solved!<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.limxdynamics.com/en/products/tron2\">LimX Dynamics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"_kytnzqoe4k\">But what if I am the sort of person who needs to speak to a manager?<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.sharpa.com/pages/north-at-work\">Sharpa<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"gzxkmyjh5py\"><em>In Turpan, China—known as the City of Fire—summer ground temperatures can exceed 50 °C. During the grape harvest, farmers traditionally carry heavy baskets back and forth under the intense heat, while every extra minute in the sun can affect the freshness of the fruit. This year, the DEEP Robotics Lynx M20S joined the harvest. <\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.deeprobotics.cn/en\">DEEP Robotics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"_uav5s18cwq\"><em>This video showcases the achievements of the first OH! GYM! Project cohort, a group of university and graduate students who explored, developed, and deployed their own humanoid behaviors using the open-source AI Sapiens K1 platform. Over the course of one month, the students experienced the complete process of humanoid development—from creating motions in simulation to transferring them onto a physical robot through repeated Sim2Real experiments.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://docs.robotis.com/docs/common/oh_project/\">ROBOTIS<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div>"}, {"title": "Skild AI unveils S1 flagship robot foundation model", "source": "Robotics Business Review", "date": "2026-08-31", "url": "https://www.therobotreport.com/skild-ai-unveils-s1-flagship-robot-foundation-model/", "summary": "<p>Skild AI says its S1 robot foundation model enables robots to learn new tasks just by seeing a video of it being performed.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/skild-ai-unveils-s1-flagship-robot-foundation-model/\">Skild AI unveils S1 flagship robot foundation model<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Video Friday: Meet Microduck", "source": "IEEE Spectrum Robotics", "date": "2026-08-28", "url": "https://spectrum.ieee.org/video-friday-microduck-robot", "summary": "<img src=\"https://spectrum.ieee.org/media-library/colorful-desk-robots-posed-among-books-beside-an-open-laptop-in-an-office.png?id=67687638&amp;width=1245&amp;height=700&amp;coordinates=101%2C0%2C101%2C0\" /><br /><br /><p><span>Video Friday is your weekly selection of awesome robotics videos, collected by your friends at <\/span><em>IEEE Spectrum<\/em><span> robotics. We also post a weekly calendar of upcoming robotics events for the next few months. Please <\/span><a href=\"mailto:automaton@ieee.org?subject=Robotics%20event%20suggestion%20for%20Video%20Friday\">send us your events<\/a><span> for inclusion.<\/span><\/p><h5><a href=\"https://humanoidssummit.com/\">Humanoids Summit Seoul<\/a>: 22–23 September 2026, SEOUL<\/h5><h5><a href=\"https://2026.ieee-iros.org/\">IROS 2026<\/a>: 27 September–1 October 2026, PITTSBURGH<\/h5><h5><a href=\"https://www.corl.org/\">CoRL 2026<\/a>: 9–12 November 2026, AUSTIN, TEXAS<\/h5><p>Enjoy today’s videos!<\/p><div class=\"horizontal-rule\"><\/div><div><span style=\"display: none;\"> <\/span><\/div><p class=\"rm-anchors\" id=\"ratzeygbgfu\">Nvidia just paid US $12.9 billion for the company that acquired Pollen Robotics, and this must be why.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><blockquote>Meet Microduck. 🦆 The 25-centimeter, 780-gram robot that waddles, falls, gets back up, and learns new tricks.<br /><br />Packed inside: 15 degrees of freedom, a front camera, an 8x8 lidar, two IMUs, mics, a speaker, NFC, Wi-Fi, and Bluetooth.<br /><br />Out of the box, Microduck already walks, sits, crouches, roller skates, picks up objects with its articulated beak, and recovers from falls on its own. Drive it with a game controller, plug-in accessories, and NFC tagged objects, run autonomous behaviors, or gather several Microducks for races and football. <br /><br />Software fully open source. Ready for whatever you throw at it.<\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"> <span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p><span>On pre-order for an astonishingly low $399, and ships before Christmas.<\/span><\/p><p>[ <a href=\"https://pollen-robotics.com/microduck/\">Microduck<\/a> ]<\/p><p>Thanks, Matthieu!<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"tbgy6brdxqu\">If you’ve chosen to ignore all the earlier <a href=\"https://spectrum.ieee.org/video-friday-darpa-heavy-lift-challenge\" target=\"_blank\">DARPA Lift Challenge<\/a> videos that we’ve posted, now you can get all caught up in about five minutes.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.darpa.mil/research/challenges/lift\">DARPA<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"uzv-96uhiqc\">You had me at “54-gram robot that out-jumps a kangaroo.”<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://ieeexplore.ieee.org/document/11553415\"><em>IEEE Transactions on Robotics<\/em><\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"vwen7knkzk4\">Sometimes, you just need a video like this.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><blockquote><em>Most fish-inspired robots are built for one size and one job, so scaling them up or down usually means starting from scratch. A team of engineers says it has found a way to solve that problem. They’ve unveiled ScaFi, a robot modeled on fish like cod and mackerel.<\/em><\/blockquote><p>[ <a href=\"https://engineering.nyu.edu/news/robot-grows-fish-not-machine\">New York University<\/a> ]<\/p><p>Thanks, Leah!<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"8qlvfdpz4qq\">Martin writes, “We’re a small robotics team in Czechia, Europe, building practical hardware around the <a href=\"https://spectrum.ieee.org/unitree-g1\" target=\"_blank\">Unitree G1<\/a>. Here’s a short demo of our lightweight gripper picking up a strawberry; the gripper weighs under 200 grams and is designed for simple, sensitive manipulation without adding a complex multifinger hand.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://sentiorobotix.com/gripper\">Sentio Robotix<\/a> ]<\/p><p>Thanks, Martin!<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"3kzjnb42dnm\">Hybrid visual markers that are useful for both cameras and lidar is a neat idea.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://binitshah.github.io/blog/stretch-4-autodocking/\">Hello Robot<\/a> ]<\/p><p>Thanks, Binit!<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"j_rrgxeaxfc\"><em>EmoLo brings emotion-inspired expressive locomotion to Open Duck Mini V2, a low-cost, open-source bipedal robot inspired by Disney’s BDX droids. With a single reinforcement learning policy, the robot can generate distinct walking styles associated with different emotional expressions, showing how characterful and expressive whole-body motion can be achieved on an accessible robotic platform.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://mertcookimg.github.io/emolo/\">EmoLo<\/a> ]<\/p><p>Thanks, Masato!<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"3c2s1zhuvum\">If it’s possible for a robot with a completely immobile face to look frustrated, this robot absolutely does, starting at three minutes into this video.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://elib.dlr.de/218609/\">DLR RM<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"zvumtotghu0\"><em>Noble Machines deployed its first general-purpose robots to a Fortune Global 500 industrial customer within 18 months of the company’s launch and met its first delivery milestone, made possible by its AI-driven whole-body control and industry-leading end-to-end autonomy.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.businesswire.com/news/home/20260303533339/en/Noble-Machines-Emerges-from-Stealth-Ships-and-Deploys-General-Purpose-Robots-for-Industrys-Toughest-Jobs\">Noble Machines<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"u3hru7dacvy\"><em>We’ve reduced the time it takes to go from physical prompt → robot behavior. The faster anyone can teach a robot to do something new, the easier it becomes to scale physical work.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://generalistai.com/blog/gen-1.5\">Generalist<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"3hrjrztzkni\">I know this video is mostly a gimmick, but I would totally rent a moderately heavy lift quadruped for a couple of days to help with a move.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.deeprobotics.cn/en\">DEEP Robotics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"4u52yao8g3a\">Is taking two minutes to excellently fold a shirt too long, or do we even care how long it takes, as long as it’s a robot doing it?<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://robotics.tokyo/\">Tokyo Robotics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"npovvg-8yoe\"><em>TRON 2 × Wuji Hand 2 handles TCM pharmacy work: picking, weighing, grinding, and packaging. The omnidirectional base frees the hands, while precise gripping and dual-arm force control enable midair operations.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.limxdynamics.com/en\">LimX Dynamics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"forsxxxit4i\">Person who genuinely knows things about robots, Christian Hubicki, explains everything about robots smashing into walls.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.christianhubicki.com/\">Christian Hubicki<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div>"}, {"title": "Video Friday: Do We Need Superhuman Humanoid Robots?", "source": "IEEE Spectrum Robotics", "date": "2026-08-21", "url": "https://spectrum.ieee.org/video-friday-unitree-superhuman", "summary": "<img src=\"https://spectrum.ieee.org/media-library/humanoid-robot-leaps-over-200-centimeter-height-board-beside-person-in-warehouse.png?id=67655329&amp;width=1245&amp;height=700&amp;coordinates=0%2C0%2C0%2C0\" /><br /><br /><p><span>Video Friday is your weekly selection of awesome robotics videos, collected by your friends at <\/span><em>IEEE Spectrum<\/em><span> robotics. We also post a weekly calendar of upcoming robotics events for the next few months. Please <\/span><a href=\"mailto:automaton@ieee.org?subject=Robotics%20event%20suggestion%20for%20Video%20Friday\">send us your events<\/a><span> for inclusion.<\/span><\/p><h5><a href=\"https://humanoidssummit.com/\">Humanoids Summit Seoul<\/a>: 22–23 September 2026, SEOUL<\/h5><h5><a href=\"https://2026.ieee-iros.org/\">IROS 2026<\/a>: 27 September–1 October 2026, PITTSBURGH<\/h5><h5><a href=\"https://www.corl.org/\">CoRL 2026<\/a>: 9–12 November 2026, AUSTIN<\/h5><p>Enjoy today’s videos!<\/p><div class=\"horizontal-rule\"><\/div><div><span style=\"display: none;\"> <\/span><\/div><p class=\"rm-anchors\" id=\"o7okizfils4\">This is very, very cool. But I’m trying to think of what the commercial use case will be, you know? I guess, high speed, incredibly dangerous package delivery to second-floor windows or something...?<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.unitree.com/\">Unitree<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"1cllcvk-9lo\"><em>Humans have a remarkable ability to perform new physical skills from only one or a few examples. Our latest robot foundation model, GEN-1.5, exhibits the beginnings of that same ability: It can learn a new task in seconds, from a single example, without gradient updates or fine-tuning. It displays broad capabilities across one-shot and few-shots learning from demonstration, as well as zero-shot physical generalization. Although the tasks are simple and short-horizon, this is the first model we know for which one-shot and few-shots learning of physical skills have emerged at scale. We view these results as a significant step toward our mission of building general intelligence for the physical world.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>I will make the cautionary point that for many of these “the model figured it out” tasks, the blog post can only say that there was no relevant pretraining data “to the best of our knowledge.”<\/p><p>[ <a href=\"https://generalistai.com/blog/gen-1.5\">Generalist<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"hwpuyegnujs\">BeanBot is a robot inspired by Mexican jumping beans, and I need say no more.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://bsr.iit.it/\">IIT<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"rcbpit1--0w\">As a professional bagpiper who definitely pays very close attention to whatever that annoying tapping noise is coming from the back of the band, I can attest to this group of <a href=\"https://spectrum.ieee.org/cybernetic-third-arm-makes-drummers-even-more-annoying\" target=\"_blank\">robot drummers<\/a> being absolutely top-notch.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://global.agilex.ai/\">AgileX Robotics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"1zzj64jxb1m\"><em>What does it take for an aerial robot to move through a sequence of arbitrary poses—fast, precisely, and continuously? Rather than teaching the robot a behavior from data, we asked how far a first-principles analytical model could take us. Through a collaboration between the AIMS Group at the Hong Kong Polytechnic University and DRAGON Lab at the University of Tokyo, we developed the first sequential-convex-programming-based trajectory-optimization framework for generalized <a href=\"https://spectrum.ieee.org/caltech-and-jpl-firing-quadrotors-out-of-cannons\" target=\"_blank\">multirotors<\/a>, covering both conventional and omnidirectional platforms.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.dragon.t.u-tokyo.ac.jp/\">DRAGON Lab<\/a> ]<\/p><p>Thanks, Moju!<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"tqx_y8ehahc\">This is a nifty idea that adapts a kind of interface frequently used for robot training and uses it for human training instead.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://news.mit.edu/2026/mit-engineers-design-better-controller-operating-construction-diggers-0820\">MIT<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"gc54o6bzcgw\"><em>Gravis Robotics brings robotic intelligence to heavy construction machines. Our retrofit kit, the Gravis Rack, turns off-the-shelf hydraulic machines into robots. Cameras, lidar, and onboard compute lets your machine see and understand its surroundings, and learning-based control lets it work close to its limits, moving more dirt with full, fast cycles.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.gravisrobotics.com/\">Gravis Robotics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"kczc9sjylno\"><em>Robust brachiation requires precise hand movements to grasp and release bars together with highly coordinated whole-body motion. To address this challenge, we propose a learning-based framework centered on waypoint-guided reinforcement learning (WGRL). WGRL guides the end effector through waypoints while allowing RL to explore and generate dynamic whole-body behaviors. With this approach, the learned policy demonstrated robust brachiation across diverse courses with different bar heights, spacings, and orientations in sim-to-sim experiments. In the real world, our life-size dual-arm robot successfully traversed four consecutive bars.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.eva.ai.u-tokyo.ac.jp/team/\">EVARL<\/a> ]<\/p><p>Thanks, Ayumu!<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"qulo_xmvsw4\">Well, here’s a different approach to <a href=\"https://spectrum.ieee.org/persona-ai-humanoid-robot-welding\" target=\"_blank\">welding in shipyards with robots<\/a>.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://kawasakirobotics.com/applications/arc-welding/\">Kawasaki<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"p55r7gn8xi8\">We should have a lot more robots in agriculture, if only they’d lettuce.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.flexiv.com/\">Flexiv<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"ghfcvlu_iku\">We’ve all had refs like these.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.phybot.tech/en/home\">PHYBOT<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"roxyluaqabq\">I got stuck after the first 15 seconds of this video trying to imagine what any of these home humanoids would usefully do if they dropped a glass.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://en.zhejianglab.com/institutescenters/researchunits/interdisciplinaryresearchcenters/researchcenterforintelligentrobot/\">Zhejiang Humanoid<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"4oggdyyo45i\"><a href=\"https://spectrum.ieee.org/sri-shakey-robot-honored-as-ieee-milestone\" target=\"_blank\">Shakey the Robot<\/a> doesn’t get enough love.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.sri.com/\">SRI<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"qtd7zwk3mq4\"><em>This work introduces a novel approach to physical human-robot interaction (pHRI) by leveraging the joint torque sensors of standard collaborative robots. By mounting a passive, uninstrumented plexiglass touchpad to the robot’s flange, we transform the robot into a handwriting-based input interface.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://ts-robotics.github.io/pHRI-CHAR-TACT/\">TS-Robotics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div>"}, {"title": "What does Unitree Robotics’ IPO mean for the humanoid industry?", "source": "Robotics Business Review", "date": "2026-08-19", "url": "https://www.therobotreport.com/what-does-unitree-robotics-ipo-mean-for-humanoid-industry/", "summary": "<p>Now that Unitree Robotics has made its IPO, which humanoid robotics companies will follow in its footsteps?<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/what-does-unitree-robotics-ipo-mean-for-humanoid-industry/\">What does Unitree Robotics&#8217; IPO mean for the humanoid industry?<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Experts to discuss the state of humanoid robots at RoboBusiness", "source": "Robotics Business Review", "date": "2026-08-13", "url": "https://www.therobotreport.com/experts-discuss-state-humanoid-robots-robobusiness-2026/", "summary": "<p>The RoboBusiness panel will include insights on humanoid robots from Agility, Apptronik, Persona AI, and PSYONIC experts.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/experts-discuss-state-humanoid-robots-robobusiness-2026/\">Experts to discuss the state of humanoid robots at RoboBusiness<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "RoboStore launches Robo Inc. to help U.S. organizations deploy robots", "source": "Robotics Business Review", "date": "2026-08-10", "url": "https://www.therobotreport.com/robostore-launches-robo-inc-to-help-u-s-organizations-deploy-robots/", "summary": "<p>RoboStore, a distributor of Unitree's legged robots, has launched Robo Inc. to serve as a U.S.-based manufacturer and integrator.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/robostore-launches-robo-inc-to-help-u-s-organizations-deploy-robots/\">RoboStore launches Robo Inc. to help U.S. organizations deploy robots<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "What Robotics Companies Think About the U.S. Foreign Robot Ban", "source": "IEEE Spectrum Robotics", "date": "2026-08-04", "url": "https://spectrum.ieee.org/fcc-covered-list-mobile-robots", "summary": "<img src=\"https://spectrum.ieee.org/media-library/photo-collage-of-humanoid-quadruped-and-unmanned-ground-vehicle-robots.jpg?id=67563239&amp;width=1245&amp;height=700&amp;coordinates=0%2C469%2C0%2C469\" /><br /><br /><p>The U.S. Federal Communications Commission (FCC) “Covered List,” originally published in 2021, identifies communications equipment and services that it says pose a threat to national security. <span>On 28 July, the FCC added <\/span><a href=\"https://www.fcc.gov/document/fcc-adds-foreign-produced-power-inverters-and-robots-covered-list-0\" target=\"_blank\">mobile, communicating robots weighing more than 2 kilograms and power inverters<\/a><span> commonly used in solar panels to the list, meaning that new products from any foreign country in these categories are no longer eligible for import.<\/span><\/p><p>The move is a Department of Defense–driven expansion of scattered federal efforts to <a href=\"https://spectrum.ieee.org/chinese-robots-us-ban\" target=\"_self\">further limit U.S. exposure<\/a> to potentially sensitive Chinese technology, but it may impose major changes on the robotics industry in allied countries, too. <\/p><p>The FCC’s <a href=\"https://www.fcc.gov/sites/default/files/robots-nsd.pdf\" target=\"_blank\">announcement<\/a> says:<\/p><blockquote>All foreign-produced advanced robotic devices pose an unacceptable risk to the national security of the United States and to the safety and security of U.S. persons…unless the [Department of Defense determines that] a given foreign-produced advanced robotic device, or a class of such devices, does not pose such risks.<\/blockquote><p>There are two <a href=\"https://docs.fcc.gov/public/attachments/DA-26-786A1.pdf\" target=\"_blank\">important definitions<\/a> here. The first is what an “advanced robotic device” is, and the second is what “unacceptable risk” means. Drones already went through their own round of this sort of regulation, so they’re exempt from this particular restriction, as are connected vehicles and medical devices. As far as the FCC is concerned, “advanced robotic devices” are <em><em>mobile<\/em><\/em> systems that incorporate on-board sensing and communications and have some amount of autonomy. There are a couple of loopholes, including systems weighing under 2 kilograms and any system that communicates at less than 200 kilobits per second, which opens up some creative possibilities. It’s important to note that this applies to <em><em>new<\/em><\/em> devices; those already certified are not restricted for sale or use.<\/p><p>As to the risks, the U.S. government says that foreign advanced robotic devices represent “a cybersecurity risk that threatens the security of critical infrastructure and thus the safety and security of U.S. persons.” There seem to be two main points to the justification, <a href=\"https://docs.fcc.gov/public/attachments/DA-26-786A1.pdf\" target=\"_blank\">found in Appendix C<\/a>. The first is that mobile robots are important to both the economy and the military, so the United States needs its own supply chain and industrial base rather than relying on foreign manufacturers. And second, mobile robots monitor critical infrastructure in sensitive locations, making them a security risk.<\/p><h2>The Country That Must Not Be Named<\/h2><p>As part of <a href=\"https://www.fcc.gov/sites/default/files/robots-nsd.pdf\" rel=\"noopener noreferrer\" target=\"_blank\">its justification<\/a> for why foreign robots are a security risk, the DOD cites <a href=\"https://spectrum.ieee.org/unitree-robot-exploit\" target=\"_self\"><em><em>IEEE Spectrum’s<\/em><\/em> article on a critical vulnerability in robots from Unitree<\/a>, based in Hangzhou, China, along with several other news articles and reports about Chinese robotics. And despite the FCC <a href=\"https://www.fcc.gov/covered-list-faqs-robots-inverters\" rel=\"noopener noreferrer\" target=\"_blank\">swearing<\/a> up and down that this action is “country neutral” and “not targeted at any country or countries,” U.S. national security sources told <em><em>Spectrum<\/em><\/em> that the perceived threat is obviously China. That’s how China feels about it, too, per a Chinese Ministry of Commerce 29 July <a href=\"https://za.china-embassy.gov.cn/eng/fyrth/202607/t20260729_11994715.htm\" rel=\"noopener noreferrer\" target=\"_blank\">press conference<\/a> (<a href=\"https://sinocism.notion.site/MOFCOM-Spokesperson-Answers-Reporters-Questions-on-the-US-FCC-Adding-Foreign-Power-Inverters-and-Ad-3ad84ece41d781ca8e46d4ec2a45c96c\" rel=\"noopener noreferrer\" target=\"_blank\">translation of the first quote here<\/a>):<\/p><blockquote>On the surface, the FCC’s measures fly the banner of “non-discrimination,” but in substance they discriminate against and suppress Chinese enterprises and products…<br /><br />China firmly opposes the U.S. overstretching the concept of national security and going after Chinese companies. Protectionism does not make the U.S. more competitive and will only hurt the interests of U.S. companies and consumers. China will continue to do what is necessary to firmly defend the legitimate and lawful rights and interests of Chinese companies.<\/blockquote><p>It’s unclear what China is going to do about this—but how about the rest of the world? How can foreign companies that make advanced robotic devices get them cleared for FCC authorization? Among <a href=\"https://www.fcc.gov/sites/default/files/robots-ca.pdf\" rel=\"noopener noreferrer\" target=\"_blank\">many, many other things<\/a>, you’ll need to provide “a detailed, time-bound plan to establish or expand manufacturing in the United States for the advanced robotic device.” <\/p><p>Because China also produces a large fraction of robot components, even for robots assembled in the United States, it will have strong leverage in any related negotiations until U.S. robotics companies further diversify their supply chains.<\/p><p class=\"ieee-inbody-related\">RELATED: <a href=\"https://spectrum.ieee.org/chinese-robots-us-ban\" target=\"_self\">Proposed Chinese Robot Ban Is Latest U.S. Tech Sovereignty Move<\/a><\/p><p>Applicants must also submit their applications to the DOD and FCC by 1 January 2028, which is unfortunate for anyone who wants to develop an advanced robotic device after that point. <\/p><h2>Robotics Industry Reactions<\/h2><p>This is all very new, and reactions from the robotics community have been mixed. <\/p><p>Some American robotics companies may benefit in the local market from the newfound lack of competition in the commercial market. <a href=\"https://www.linkedin.com/in/brendanschulman/\" rel=\"noopener noreferrer\" target=\"_blank\">Brendan Schulman,<\/a> <a href=\"https://bostondynamics.com/\" rel=\"noopener noreferrer\" target=\"_blank\">Boston Dynamics<\/a>’ vice president of policy, wrote an enthusiastic <a href=\"https://www.linkedin.com/posts/brendanschulman_after-months-of-increasing-calls-from-industry-activity-7488070496488435712-8LE-?utm_source=share&amp;utm_medium=member_desktop&amp;rcm=ACoAAADzTX0B_X82L2FL9GS1Qib6fNoMXJQlPzA\" rel=\"noopener noreferrer\" target=\"_blank\">endorsement of the ban on LinkedIn<\/a>: “I sense that this is just the first round in a series of policies that will define the success and growth of the industry for decades to come.” On the other hand, third-country buyers <a href=\"https://www.linkedin.com/feed/update/urn:li:activity:7488293386664292355/\" rel=\"noopener noreferrer\" target=\"_blank\">may just stick to Chinese products<\/a>, as they generally have for drones and electric cars. <\/p><p>But not all companies expect major changes from the new regulation. American customers “need to know they can audit the technology, get support quickly, and keep the system operating without depending on a fragile overseas supply chain,” <a href=\"https://www.linkedin.com/in/nicolaus-radford/\" rel=\"noopener noreferrer\" target=\"_blank\">Nic Radford<\/a>, the CEO of the U.S. humanoid robotics company <a href=\"https://spectrum.ieee.org/persona-ai-radford-pratt/\" target=\"_self\">Persona<\/a>, tells <em><em>IEEE Spectrum<\/em><\/em>. In other words, he figures some customers wouldn’t have wanted Chinese humanoids anyway.<\/p><p><a href=\"https://www.linkedin.com/in/phfrey/\" rel=\"noopener noreferrer\" target=\"_blank\">Philipp Frey<\/a>, vice president of strategy for the Swiss quadruped company <a href=\"https://www.anybotics.com/\" rel=\"noopener noreferrer\" target=\"_blank\">ANYbotics<\/a>, agrees. He says their enterprise customers in the United States “increasingly evaluate robots on long-term reliability, cybersecurity, software capability, safety certification, serviceability, and ecosystem integration, not on hardware cost alone.” <\/p><p>ANYbotics also plans to apply for conditional approval of future products, Frey says. That will involve a national-security review by the DOD or the Department of Homeland Security, disclosing company beneficial ownership, supply-chain risks, and declaring a plan for establishing a significant manufacturing presence in the United States.<\/p><p><a href=\"https://www.linkedin.com/in/gavin-kenneally-321a3833/\" target=\"_blank\">Gavin Kenneally<\/a>, CEO of the U.S. quadruped company <a href=\"https://www.ghostrobotics.io/\" target=\"_blank\">Ghost Robotics<\/a>, is more explicit about the risks that Chinese robot strategy poses to the United States. “Active and purposeful spyware is deployed inside the U.S. on Chinese robots. Examples of predatory pricing abound. And this isn’t just a competition between U.S. and Chinese robotics companies; it’s between private U.S. companies and China’s coordinated national strategy,” Kenneally tells <em><em>Spectrum<\/em><\/em>. “If today’s announcement encourages stronger cybersecurity and a more level competitive environment, that’s good for customers and good for the robotics industry.”<\/p><p>So is an industry-wide ban the best way to guard against threats? American approaches to Chinese technology security risks have been “ad hoc and fragmented,” wrote the Brookings Institution sociologist <a href=\"https://www.brookings.edu/people/kyle-chan/\" rel=\"noopener noreferrer\" target=\"_blank\">Kyle Chan<\/a> in a <a href=\"https://www.brookings.edu/articles/a-new-risk-framework-for-chinese-technology-products-and-investments/\" rel=\"noopener noreferrer\" target=\"_blank\">report<\/a> published 9 July. Chan called for the Bureau of Industry and Security, part of the Department of Commerce, to centralize federal information gathering and decision-making on how to handle risky foreign devices. He also called for better public input mechanisms for these issues, and a continuous, proportionate process that tightened or relaxed targeted import restrictions in response to well-defined risks. <\/p><p>That would allow American industry to continue benefiting from partnerships with Chinese manufacturers in less sensitive links of the supply chain, Chan argues. Those links will evolve over time, requiring continued assessment, but without those partnerships, crude bans “could make it more difficult for American startups and researchers to develop new software and end up slowing innovation across the U.S. robotics ecosystem,” he writes.<\/p>"}, {"title": "Walden Robotics Partners With Toyota on Practical Humanoids", "source": "IEEE Spectrum Robotics", "date": "2026-08-03", "url": "https://spectrum.ieee.org/humanoid-robots-walden-robotics-toyota", "summary": "<img src=\"https://spectrum.ieee.org/media-library/humanoid-orange-and-white-robot-using-two-finger-gripper-hands-to-work-with-metal-tool-components.jpg?id=67568024&amp;width=1245&amp;height=700&amp;coordinates=0%2C62%2C0%2C63\" /><br /><br /><p>For a while there, it seemed as though robotics as a whole was stuck in a <a href=\"https://spectrum.ieee.org/top-robotics-stories-2024\" target=\"_self\">mad rush<\/a> towards building <a href=\"https://spectrum.ieee.org/topic/robotics/humanoid-robots/\" target=\"_self\">humanoid robots<\/a> mostly because it was very possible (and very lucrative) to do so, even without near-term goals that were necessarily realistic. Some of the magic of those first couple of years of the humanoid explosion has stuck around, but there’s also been an industry-wide sobering leading to <a href=\"https://spectrum.ieee.org/humanoid-robot-scaling\" target=\"_self\">pointed questions about practicality and value<\/a>. In other words, starting a commercial humanoid company <em><em>now<\/em><\/em> is a much different proposition than it would have been just a few years ago. <\/p><p>On 15 July, <a href=\"https://www.waldenrobotics.com/news/walden-robotics-launches-from-stealth\" rel=\"noopener noreferrer\" target=\"_blank\">Walden Robotics emerged from stealth<\/a> with US $300 million in funding at a valuation of $1.1 billion. Walden is a spinout of <a href=\"https://spectrum.ieee.org/toyota-to-invest-1-billion-in-ai-and-robotics-rd\" target=\"_self\">Toyota Research Institute<\/a> (TRI), and it’s spent the last 10 or so years working on hard problems in robotics with the goal of transitioning from research to real-world applications. That seems like the amount of time and experience that it might reasonably take to develop a <a href=\"https://spectrum.ieee.org/humanoid-robot-scaling\" target=\"_self\">practical and value-driven approach<\/a> to deploying general-purpose humanoid robots, and Walden has chosen an excellent starting point by skipping the legs.<\/p><p>“It’s ironic,” says Walden cofounder and CEO <a href=\"https://www.linkedin.com/in/russ-tedrake-88648a4a/\" rel=\"noopener noreferrer\" target=\"_blank\">Russ Tedrake<\/a>. “I thought about legs for 20 years; that’s the class I teach at MIT. There are many reasons to build a robot with legs. But the question is, what’s the addressable market? And what percentage of it is covered by a wheeled base?” It’s this focused, practical thinking that sets Walden somewhat apart from many (if not most) of the other companies in this space. Rather than <a href=\"https://spectrum.ieee.org/boston-dynamics-spot-robot-dog-now-available\" target=\"_self\">developing a robot first and searching for a viable commercial use case second<\/a>, Walden instead identified applications where robots can provide value now, and designed a robot that could safely and efficiently meet those needs.<\/p><p class=\"shortcode-media shortcode-media-youtube\"> <span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span> <small class=\"image-media media-photo-credit\">Walden Robotics<\/small> <\/p><h2>Walden Robotics’ Manufacturing Focus<\/h2><p class=\"shortcode-media shortcode-media-rebelmouse-image rm-float-left rm-resized-container rm-resized-container-25\" style=\"float: left;\"> <img alt=\"A smiling man in a blue shirt\" class=\"rm-shortcode\" id=\"f545c\" src=\"https://spectrum.ieee.org/media-library/a-smiling-man-in-a-blue-shirt.jpg?id=67568051&amp;width=980\" /> <small class=\"image-media media-caption\">Russ Tedrake is the CEO and cofounder of Walden Robotics.<\/small><small class=\"image-media media-photo-credit\">Walden Robotics<\/small><\/p><p>Tedrake is light on the details about what specific applications Walden is targeting at this point (citing confidentiality with current commercial partners). Manufacturing and logistics environments where there are a lot of <a href=\"https://www.youtube.com/watch?v=F_7IPm7f1vI\" target=\"_blank\">relatively simple<\/a> and <a href=\"https://www.youtube.com/watch?v=tv90GFM9RAo\" target=\"_blank\">repetitive tasks<\/a> that aren’t friendly to conveyor belts and preprogrammed robot arms are a good bet. Even in these environments, however, robots still have to find a useful niche because they’re going up against human workers who are more flexible while also cheaper to employ. So the question is: How do you make an argument to a customer that a robot is actually a better solution than their existing human workers?<\/p><p>“You need to find applications with high utilization—where the robot is used 24 hours a day, 7 days a week,” says Tedrake. “Manufacturing is a global imperative right now, and it makes the economics work.” Economic viability is a necessary condition, but it’s not a sufficient one for Walden, or for their partnership with Toyota. People are a big part of Walden’s plan, too.<\/p><p>One of Walden’s major strengths is the company’s partnership with Toyota, which is not all that surprising given that Walden is a spinout from TRI, which is <a href=\"https://spectrum.ieee.org/toyota-to-invest-1-billion-in-ai-and-robotics-rd\" target=\"_self\">Toyota’s Silicon Valley–based R&amp;D arm<\/a>. “Toyota was very proud of the work we had done at TRI, and was ready to go big in this space,” says Tedrake. “Part of the excitement of having Toyota as a partner is that their culture is deeply people-first. When talking to Toyota’s leadership, I was never asked how much money this is going to make, but I was asked how it will improve the quality of life for all people.”<\/p><p class=\"shortcode-media shortcode-media-rebelmouse-image\"> <img alt=\"A white and orange humanoid robot manipulates an object in its two-finger grippers.\" class=\"rm-shortcode\" id=\"209d4\" src=\"https://spectrum.ieee.org/media-library/a-white-and-orange-humanoid-robot-manipulates-an-object-in-its-two-finger-grippers.jpg?id=67568030&amp;width=980\" /> <small class=\"image-media media-caption\">The robot’s chonky design allows it to meet the high-payload requirements of useful manufacturing work.<\/small><small class=\"image-media media-photo-credit\">Walden Robotics<\/small><\/p><p>In this context, at least in the short term, Walden’s approach to improving the quality of life for people is to take over those aforementioned repetitive manufacturing tasks with robots. Tedrake hopes that this will lead to workplaces where skilled craftspeople are able to do even more with their hard-earned expertise, increasing their efficiency, productivity, and happiness all at the same time—a noble goal, although there’s only so much Walden itself can do to make this happen, and not all customers will share Toyota’s priorities.<\/p><h2>Wheeled Humanoid Robots in Factories<\/h2><p>Many other <a href=\"https://www.agilityrobotics.com/\" target=\"_blank\">humanoid<\/a> <a href=\"https://www.figure.ai/\" target=\"_blank\">robotics<\/a> <a href=\"https://apptronik.com/\" target=\"_blank\">companies<\/a> are also targeting these logistics and manufacturing spaces with general-purpose robots, and they’re doing so by making robots that are as humanlike as possible. The theory is that a humanoid form factor is necessary when operating in human environments. And there are certainly arguments in favor of a humanoid with legs—stairs exist, for one, and legged robots have a smaller footprint compared with ones that have wheels.<\/p><p>But a large wheeled base offers some significant advantages, as Tedrake points out. You’re incentivized to cram the base full of batteries, since more weight near the floor keeps the robot stable, which also solves the problem of running out of power during the middle of the workday. More importantly, a statically stable robot that moves around on a wheeled base can bypass the <a href=\"https://spectrum.ieee.org/humanoid-robot-scaling\" target=\"_self\">safety challenges<\/a> that are currently keeping legged humanoids physically separated from real humans—most prominently, the fact that legged robots can fall over. “Factories already have autonomous mobile [wheeled] robots,” explains Tedrake. “They already have safety cases built around AMRs. You can piggyback on that with a wheeled base.”<\/p><p class=\"shortcode-media shortcode-media-rebelmouse-image\"> <img alt=\"A close-up of a robotic gripper grasping a metallic object in a vise.\" class=\"rm-shortcode\" id=\"f600c\" src=\"https://spectrum.ieee.org/media-library/a-close-up-of-a-robotic-gripper-grasping-a-metallic-object-in-a-vise.jpg?id=67568022&amp;width=980\" /> <small class=\"image-media media-caption\">Simple, rugged grippers make the robot suitable for commercial deployment.<\/small><small class=\"image-media media-photo-credit\">Walden Robotics<\/small><\/p><p>Walden’s perspective on manipulation is similar. Many humanoid companies are using five-fingered hands that are highly dexterous but also highly complex, which Tedrake believes is not a pragmatic approach in the context of commercial deployments. “There’s a question of what you need to do the tasks, but the real question is just durability,” Tedrake says. “We have been deployed in a Toyota factory, and at the end of the week, the hands take a beating, so we built hands that can take that. I have not seen a more dexterous hand that could have done the work our hand has done.”<\/p><p>Walden’s long-term plan is to build “general-purpose robots.” It’s not always clear what a general-purpose robot is, because (I would argue) nobody is quite sure what “general purpose” means. It’s certainly not referring to robots that can do <em><em>everything<\/em><\/em>; I think the closest we can get are robots that can be taught to do a useful number of different skills, which is why I prefer the term “multipurpose.” It’s a little pedantic, I know, but I think the distinction is important because it moderates expectations in the near term.<\/p><p>Part of where Walden’s optimism towards general purposeness comes from is TRI’s earlier research on <a href=\"https://medium.com/toyotaresearch/tris-robots-learn-new-skills-in-an-afternoon-here-s-how-2c30b1a8c573\" target=\"_blank\">diffusion policy<\/a>, which helps robots learn new skills more quickly by leveraging previously learned skills as a foundation. “Fundamentally, multitasking is a way to get to a general-purpose robot,” Tedrake says. “I believe there is a single platform that can do a lot of tasks that are of high value for real customers. That will give us the experience we need to give birth to this deployed general-purpose capability.”<\/p>"}, {"title": "Video Friday: Meet Google DeepMind’s Gemini Robotics 2", "source": "IEEE Spectrum Robotics", "date": "2026-07-31", "url": "https://spectrum.ieee.org/video-robot-gemini2-ai-robot", "summary": "<img src=\"https://spectrum.ieee.org/media-library/humanoid-robot-and-robotic-arm-labeled-gemini-robotics-er-2-in-a-workshop-setting.webp?id=67560022&amp;width=1245&amp;height=700&amp;coordinates=0%2C0%2C0%2C0\" /><br /><br /><p><span>Video Friday is your weekly selection of awesome robotics videos, collected by your friends at <\/span><em>IEEE Spectrum<\/em><span> robotics. We also post a weekly calendar of upcoming robotics events for the next few months. Please <\/span><a href=\"mailto:automaton@ieee.org?subject=Robotics%20event%20suggestion%20for%20Video%20Friday\">send us your events<\/a><span> for inclusion.<\/span><\/p><h5><a href=\"https://actuate.foxglove.dev/\">Actuate 2026<\/a>: 18–19 August 2026, SAN FRANCISCO<\/h5><h5><a href=\"https://2026.ieee-iros.org/\">IROS 2026<\/a>: 27 September–1 October 2026, PITTSBURGH<\/h5><h5><a href=\"https://humanoidssummit.com/\">Humanoids Summit Seoul<\/a>: 22–23 September 2026, SEOUL<\/h5><p>Enjoy today’s videos!<\/p><div class=\"horizontal-rule\"><\/div><div><span style=\"display: none;\"> <\/span><\/div><blockquote class=\"rm-anchors\" id=\"4lsqnrmc6ny\"><em>Introducing Gemini Robotics 2—the intelligence layer powering the next generation of truly adaptable robots. As it takes its first literal steps, this major advance unlocks intelligent whole-body control, advanced dexterity, and multirobot collaboration. <\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p class=\"shortcode-media shortcode-media-youtube\"> <span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p class=\"shortcode-media shortcode-media-youtube\"> <span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://deepmind.google/blog/gemini-robotics-2-brings-whole-body-intelligence-to-robots/\">Google DeepMind<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"vzwytn3fw1w\">THE ROADMAP! NOOOOO!<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.agilityrobotics.com/\">Agility<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"xha2tj_1c6q\">Videos like this always make me wonder how <a href=\"https://spectrum.ieee.org/robot-with-liquid-metal-tendons-can-heal-itself\" target=\"_blank\">repairable<\/a> these robots are. Very, I would hope.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.unitree.com/As2-W\">Unitree<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"m81_7rggdxm\"><em>Humans routinely communicate through abstractions of their bodies, including shadows, silhouettes, and reflections. Here, we present a robotic system capable of dynamic shadow expression using a 21-degrees-of-freedom <a href=\"https://spectrum.ieee.org/video-friday-robotic-hand-dexterity\" target=\"_blank\">dexterous hand<\/a> with compliant soft skin and a learned shadow self-model.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://generalroboticslab.com/shadow\">General Robotics Lab<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"n20cvjhmzh8\">Human-to-quadruped motion transfer is an odd concept, but I’m here for it.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://studios.disneyresearch.com/2026/07/30/two2four-generative-quadruped-puppeteering-from-human-motion/\">Disney Research<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"alc1aon3a4i\"><em>Meet Stretch 4.0<\/em>—t<em>he one-armed, three-wheeled robot that can navigate your home safely. Would you rather a humanoid robot or Stretch?<\/em><\/blockquote><p class=\"shortcode-media
