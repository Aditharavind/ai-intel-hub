tics<\/a>.<\/em><\/p><p>A field technician on a wind turbine, harness clipped, both hands on a wrench, needs to send a command to the diagnostic device hanging at her belt. A logistics worker on a loading dock, gloves on, eyes on the pallet, needs to redirect a connected lift. A person using an assistive mobility device on a crowded street wants to nudge it forward without taking out a phone or speaking aloud. None of these moments call for a smarter robot. They call for a smarter way to be heard by the machines that already exist.<\/p><h2>The industry has been building from one side<\/h2><p>The past three years of Physical AI have been a story of remarkable progress on the robot side of the loop. Companies like Boston Dynamics, Figure, and Unitree have advanced actuators, locomotion, and dexterity to a level that would have seemed implausible a decade ago. Google DeepMind’s Gemini Robotics has redefined what vision-language-action models can do in unstructured settings. The trajectory of the hardware and the foundation models is real, and it is accelerating.<\/p><p>But there is another side to this loop, and it has been treated as a solved problem for too long. The interface between humans and machines has defaulted, for 40 years, to three input modalities: screens, buttons, and voice. Each of those assumes the user can stop, look down, and translate intent into structured commands. That assumption breaks the moment the work moves into a real environment. On a turbine. On a dock. On a sidewalk. In any setting where hands are occupied, eyes are committed, or speaking is impractical, the conventional interface stack quietly fails.<\/p><p class=\"pull-quote\">Spatial Intent Fusion is the simultaneous processing of three streams of human-centered information, namely spatial position, visual context, and gestural intent: Your body is the interface.<br /><\/p><p>The bottleneck on the human side of the loop is becoming as important as the one on the machine side. And solving it requires a different question. Not how do we make the robot more capable, but how do we let the human participate in the computing system as naturally as the robot already does.<\/p><h2>Wetour Robotics’ bet: put the human back into the computing loop<\/h2><p><a href=\"https://wetourrobotics.com/\" target=\"_blank\">Wetour Robotics<\/a> is betting that the next architectural leap in Physical AI is not about making the robot more capable. It is about making the human a first-class node in the computing network, with the same kind of low-latency, high-fidelity participation that connected devices already enjoy.<\/p><p>Wetour Robotics’ engineers frame the problem this way: a wristband that recognizes a gesture is not enough. A camera that recognizes a scene is not enough. The information a human carries about what they are about to do is distributed across multiple channels, including where their body is in space, what their eyes are attending to, and what their muscles are preparing to do, and any single channel observed in isolation is ambiguous. Reconstructing intent reliably means fusing those channels at the operating system level, with latency low enough that the loop feels closed rather than mediated.<\/p><p>This approach has a name. Wetour Robotics calls it Spatial Intent Fusion: the simultaneous processing of three streams of human-centered information, namely spatial position, visual context, and gestural intent, fused into a single real-time command for any connected physical device. It is the technical implementation behind a simpler positioning statement the company uses externally: your body is the interface.<\/p><p class=\"shortcode-media shortcode-media-rebelmouse-image\"> <img alt=\"Sleek silver rectangular electronic device labeled \\u201cORCHESTRA\\u201d on a light gray background.\" class=\"rm-shortcode\" id=\"1af08\" src=\"https://spectrum.ieee.org/media-library/sleek-silver-rectangular-electronic-device-labeled-u201corchestra-u201d-on-a-light-gray-background.png?id=66718892&amp;width=980\" /> <small class=\"image-media media-caption\">Orchestra is a portable intelligent hub running the operating system that handles sensor fusion, intent inference, command translation, and safety arbitration. The reference compute platform is NVIDIA Jetson Orin Nano Super, which provides enough on-device inference capacity to keep the entire control loop at the edge, with no cloud dependency on the critical path. <\/small><small class=\"image-media media-photo-credit\">Wetour Robotics<\/small><\/p><h2>The architecture: three layers, four engines, one loop<\/h2><p>Orchestra is not a single device but a layered platform, designed from the start to be sensor-flexible and actuator-agnostic. The architecture decomposes into three perception layers and four coordination engines.<\/p><p><strong>Orchestra<\/strong> itself is the local compute and orchestration core: a portable intelligent hub running the operating system that handles sensor fusion, intent inference, command translation, and safety arbitration. The reference compute platform is NVIDIA Jetson Orin Nano Super, which provides enough on-device inference capacity to keep the entire control loop at the edge, with no cloud dependency on the critical path. Edge inference is non-negotiable for this application. Full-chain latency from biosignal acquisition to actuator command is held under 100 milliseconds, the envelope inside which closed-loop control feels natural rather than laggy.<\/p><p><strong>VisionLink<\/strong> handles visual and spatial perception. Cameras feed into vision models that identify objects, estimate distances, and track environmental context. VisionLink is designed not as a passive recognition layer but as a real-time command generator: its outputs feed directly into Orchestra OS to be fused with biosignal data.<\/p><p><strong>Conductor<\/strong> is the biosignal pipeline. It ingests raw surface electromyographic (sEMG) data from a wrist-worn device, classifies temporal patterns into discrete gestures or continuous control signals, and outputs actuator commands. The technically interesting property of sEMG for this use case is that the signal precedes visible motion. Motor unit action potentials appear at the skin surface roughly 50 to 80 milliseconds before a finger completes the corresponding gesture. Wetour Robotics calls this property pre-motion intent sensing, and it is what allows Orchestra to anticipate user intent rather than react to it.<\/p><p>On top of the three perception layers, Orchestra OS runs four coordination engines. The <strong>Perception Engine<\/strong> ingests and normalizes raw sensor streams. The <strong>Intent Engine <\/strong>performs Spatial Intent Fusion across modalities, resolving what the user is trying to do given where they are, what they are looking at, and what their hand is signaling. The <strong>Orchestration Engine<\/strong> translates intent into device-specific command sequences for any connected actuator. The <strong>Safety Engine<\/strong> arbitrates conflicting commands, enforces operational envelopes, and gates execution against runtime safety conditions.<\/p><p class=\"shortcode-media shortcode-media-youtube\"> <span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><h2>The trade-offs we’re honest about<\/h2><p>No system that bridges the human body and the digital world is finished. Three engineering challenges remain open, and the company addresses each with a deliberate trade-off rather than a claim of having fully solved it.<\/p><p><strong>Baseline stability of sEMG under motion.<\/strong> In a stationary user, continuous gesture recognition from sEMG is reliable. Once the user is walking, climbing, or otherwise moving, motion artifacts and electrode drift degrade the signal in ways that are difficult to fully compensate for. Rather than overpromise on continuous control in dynamic settings, Orchestra defaults to a smaller set of robust discrete gestures in complex operating environments, and reserves continuous control modes for contexts where the signal-to-noise ratio supports them.<\/p><p><strong>Miniaturization of edge AI compute.<\/strong> Running the Orchestra control loop entirely at the edge requires real on-device inference, which has historically meant trading off between compute capacity, battery life, and form factor. Wetour Robotics’ approach has been a compact carrier board paired with a thermal design and a battery module sized for all-day wearability. The result is a hub that travels with the user rather than tethering them to a desk, and that performs the full perception-to-actuation loop without offloading to the cloud.<\/p><p><strong>Heterogeneity of third-party device protocols.<\/strong> The actuator side of the loop is a fragmented landscape. Different manufacturers expose different command interfaces, different communication stacks, and different safety conventions, and a Physical AI operating system has to integrate with all of them. Wetour Robotics uses an AI-agent layer to negotiate connection and protocol translation adaptively, so that Orchestra OS can ingest data from a wide range of devices, run them through neural network models that infer human intent, and emit the right command on the right protocol for the device on the other end.<\/p><h2>Why this matters, and why it helps the rest of the field<\/h2><p>The history of computing is a history of interface revolutions. Command lines gave way to graphical user interfaces, which gave way to touch, which gave way to voice. Each transition expanded who could participate in the system and what they could do with it. The next transition is not about a new screen or a new microphone. It is about treating the human body itself as a participant in the computing network, capable of contributing intent at the same speed and fidelity that any other connected node can.<\/p><p class=\"pull-quote\">The history of computing is a history of interface revolutions. The next transition is not about a new screen or a new microphone — it is about treating the human body itself as a participant in the computing network.<\/p><p>This path is not a competitor to the work being done on humanoid robots, foundation models for embodied AI, and dexterous manipulation. It is the missing complement to that work. The hardest open problem for humanoid systems is the data: every natural interaction between a human and the physical world is a potential training signal, and most of those interactions are currently invisible to any computing system. As more humans become first-class nodes in the loop, those interactions become observable, structured, and ultimately useful for training the next generation of embodied AI, including the humanoid robots being developed today.<\/p><p>In other words: putting the human back into the computing loop is not just about better interfaces for individual users. It is about generating the kind of grounded, in-the-wild human-machine interaction data that the broader Physical AI ecosystem will need to keep advancing. The robot side and the human side of the loop are not two competing futures. They are two halves of the same one.<\/p><p>That is what Wetour Robotics means when it says: <em>Your body is the interface.<\/em><\/p><p>Learn more at <a href=\"https://wetourrobotics.com/\" target=\"_blank\">wetourrobotics.com<\/a>.<\/p>"}, {"title": "Will Robotics Have a ChatGPT Moment?", "source": "IEEE Spectrum Robotics", "date": "2026-05-20", "url": "https://spectrum.ieee.org/robotics-ai-breakthrough", "summary": "<img src=\"https://spectrum.ieee.org/media-library/a-collection-of-5-robots-against-colored-backgrounds.jpg?id=66734221&amp;width=1245&amp;height=700&amp;coordinates=0%2C88%2C0%2C88\" /><br /><br /><p>Over the next few decades, billions of autonomous, AI-powered robots will work alongside people in factories, perform tedious tasks in warehouses, care for the elderly, <a href=\"https://spectrum.ieee.org/collections/darpa-subterranean-challenge/\" target=\"_blank\">assist in unsafe disaster areas<\/a>, deliver packages and food to our doorsteps, and eventually help out in our homes. Some will look like us, and many won’t. What is certain is that regardless of form factor, robots will all rely heavily on AI in order to deliver real-world value.<\/p><div class=\"rm-embed embed-media\"><\/div><p><span>In 2025, total investments in robotics companies reached <\/span><a href=\"https://www.cbinsights.com/research/report/venture-trends-2025/\" target=\"_blank\">a record US $40.7 billion, accounting for 9 percent of all venture funding<\/a><span>. The multibillion dollar question therefore is this: What will it take for AI-powered robots to begin to have a serious economic impact? Many of today’s robotics and AI companies are making bold claims, such as that humanoid robots will <\/span><a href=\"https://www.1x.tech/\" target=\"_blank\">soon be coming into our homes<\/a><span>, but there’s still a big gap between promise and reality.<\/span><\/p><p><span><\/span><span>The promise of robots that live and work alongside us has been the stuff of science fiction for a very long time. And while many programmers have tried to make that promise a reality, the physical world is just too complicated for traditional computer programs to handle the endless complexity it presents. Thanks to AI, robots are no longer being programmed—instead, they learn to operate in the real world. With enough practice, they can learn to perceive and understand the world around them, reason about that world, and use that reason and understanding to perform tasks that are useful, reliable, and safe.<\/span><\/p><p>The two of us have worked at the forefront of AI and robotics for the last decade, as a <a href=\"https://engineering.oregonstate.edu/people/jonathan-hurst\" target=\"_blank\">Professor in Robotics at Oregon State University<\/a> and <a href=\"https://www.agilityrobotics.com/about/leadership\" target=\"_blank\">Co-Founder of Agility Robotics<\/a>, and as <a href=\"https://www.linkedin.com/in/hanspeter/\" rel=\"noopener noreferrer\" target=\"_blank\">former CEO<\/a> of the <a href=\"https://everydayrobots.ai/\" rel=\"noopener noreferrer\" target=\"_blank\">Everyday Robots moonshot at Google X<\/a>. Our experience deploying AI-powered robots in real-world settings has given us a perspective on where AI can be used to great benefit in complex robotic systems in the near term and where we are still on the frontier of science fiction. We believe AI will enable an inflection point in robotics advances, but that it will be through the well-engineered application of coordinated systems of different AI tools rather than a single ChatGPT-style breakthrough.<\/p><p>As the excitement around AI is matched only by the uncertainty of what will be possible, here are five hard truths that will define AI in robotics.<\/p><h2>1. The YouTube-to-Reality Gap Is Real<\/h2><p>For years, we have been seeing videos on YouTube with humanoid robots performing amazing moves on everything from a dance floor to an obstacle course. The inside knowledge in robotics is to “never trust a YouTube robot video.” The gap between real robots that can perform real work in unstructured human environments and carefully scripted and edited robot performances remains significant. The latest performance to get a lot of attention was a <a href=\"https://www.youtube.com/watch?v=mUmlv814aJo\" rel=\"noopener noreferrer\" target=\"_blank\">martial arts show<\/a> featuring Unitree humanoid robots performing with children at the Chinese 2026 Spring Festival Gala. While impressive, this falls into a long lineage of tightly scripted robotic performances, where everything has been carefully choreographed and planned in advance. The low-level controls, synchronization, and choreography were stunning, yet the Spring Gala robot performance showed a level of autonomy and intelligence much closer to industrial robots building cars in a factory than something that will show up in your living room any time soon. <\/p><p class=\"shortcode-media shortcode-media-youtube\"> <span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span> <\/p><p><span>Seeing these kinds of demos nevertheless raises questions about where robotics really is. If robots can perform kung fu moves and do backflips and dance, why aren’t they also showing up on factory floors yet? And why can’t they do the dishes in my home after dinner? The simple answer is this: Making AI-powered robots capable of performing general tasks in varied human environments is still <\/span><em><em>really<\/em><\/em><span> hard. While impressive technological feats like those at the Spring Festival may make it look like we could be very close, the use of AI in these demos is only for low-level motor control (to keep the robots from falling over) and therefore is only a small part of the solution for robots to be general purpose in the real, unstructured spaces where we humans live and work.<\/span><\/p><h2>2. Data Is An Unsolved Challenge<\/h2><p>Large Language Models (LLMs) like OpenAI’s ChatGPT and Anthropic’s Claude were initially trained on an internet-scale database of text. The world woke up one day in late 2022 to ChatGPT demonstrating that AI computers could suddenly “speak” to us in prose or verse and about seemingly any topic. LLMs have turned out to generalize well and are now able to take multimodal input (text, images, video) and produce multimodal output. Importantly, the corpus of training data was both enormous and human-generated, which are characteristics that form the gold standard for AI training.<\/p><p class=\"shortcode-media shortcode-media-rebelmouse-image rm-float-left rm-resized-container rm-resized-container-25\" style=\"float: left;\"> <img alt=\"A series of four images, including robots working in a contained factory space, in an open indoor factory, outdoors in the real world delivering a package, and working with a human to move a couch in an apartment.\" class=\"rm-shortcode\" id=\"a0903\" src=\"https://spectrum.ieee.org/media-library/a-series-of-four-images-including-robots-working-in-a-contained-factory-space-in-an-open-indoor-factory-outdoors-in-the-real.jpg?id=66734272&amp;width=980\" /> <small class=\"image-media media-caption\">The fastest path to robots as part of everyday life may emerge through a range of robot forms performing increasingly sophisticated applications and employing a range of AI tools.<\/small><small class=\"image-media media-photo-credit\">Agility Robotics<\/small><\/p><p>Giving AI a body (in the form of a robot), so that it can engage with people in the physical world, continues to be a very difficult and broadly unsolved problem. AI models for general-purpose robotics must simultaneously satisfy multiple, often conflicting, physical, geometric, and temporal limitations while operating in unstructured, dynamic environments. In order to generalize, robot models need to be trained on data gathered in a high-dimensional configuration space, where “dimensions” represent text, lighting conditions, degrees of freedom, joint limits, velocities, force, and safety boundaries, just to mention a few. Importantly, this must be <em><em>good<\/em><\/em> data—it must contain many examples from what amounts to an infinite number of possible configurations in the physical world.<\/p><p>Since there are very few existing sources of data like this, approaches like teleoperation, video analysis, motion capture of humans, and self-exploration in simulation and in the real world are all seen as important ways to collect data. It’s a herculean task. For example, at Everyday Robots at Google X, we ran 240 million robot instances in our simulator over the course of 2022 to collect training data, mostly to train a trash-sorting model. Similar amounts of data will be needed for every skill to get to a similar level of capability, which is not yet human level.<\/p><h2>3. There Will Be No Single Robot AI<\/h2><p>We are far away from a moment where a single AI model might allow general-purpose robots to live and work alongside us. <\/p><p>General-purpose robots can have wheels or legs. They can have one, two, three, or more arms. Some have propellers and can fly, while others may be designed to operate under water. Some will drive on busy roads. The physical world is infinitely varied and complex. And then there are all the people and other animals that will be surrounding the robots. How do you train a model to operate a robot safely and reliably in all of these settings? The simple answer is: You don’t. At least not for quite some time.<\/p><p>We believe the winning AI architecture leading to the next big breakthroughs in general-purpose robotics will be “agentic AI” for robots, which are high-level coordinating models that can reason, plan, use tools, and learn from outcomes to execute complex tasks with limited supervision. Agentic, high-level models running on robots will invoke a system of specialized ones for different types of tasks. We will likely soon see multiple robots collaborating and coordinating with each other through their onboard agentic AI models.<\/p><p>AI tools are unlocking new and powerful capabilities in robotics, which in turn will enable new solutions and new markets. It’s encouraging to see these new models being made broadly available, some even as open-source solutions. This availability is akin to what happened with the internet: Real progress occurred when it became ubiquitous. We anticipate an inevitable democratization of complex behaviors in robotics with wide access to these AI tools and technologies.<\/p><h2>4. Hardware Is Still Very Hard<\/h2><p>Robots are complex systems with many parts that all need to work together with great precision. For a robot to be useful and safe, every part of it must be coordinated, from its perception systems to the computer controlling it, all the way down to its individual actuators.<\/p><p>Actuators—that is, the motors and gears—are a good example of an important part of the robot where what got us here won’t get us there. The actuators used at scale by most industrial robots will not work for robots that will operate in human environments. If these robots accidentally collide with an obstacle, the resulting impacts are harsh, forces are high, and things break. Humans don’t move in this way. We are far more compliant in how we interact with the world, and we’re constantly making contact with our environment and using that contact to help us accomplish things. <\/p><p>Consider the challenge of inserting a key in a lock: Humans typically don’t do this by aligning the key perfectly with the keyhole. Instead, we just feel for the edge of the keyhole and jiggle the key in. Robots need to be able to operate in novel ways to achieve comparable capabilities by using a new class of actuators that are sensitive to force and able to have a compliant interaction with the environment. While these kinds of actuators do exist, they are not yet generally available at scale for robot systems designed to operate around people.<\/p><h2>5. Real Value Comes From “Easy” Tasks<\/h2><p>There’s a big difference between tasks that look impressive and real-world tasks that provide value. Robotics is a perfect example of <a href=\"https://en.wikipedia.org/wiki/Moravec%27s_paradox\" target=\"_blank\">Moravec’s paradox<\/a>, which states that tasks that are hard for humans are easy for computers (like multiplying two big numbers), and tasks easy for humans (like a toddler’s movements) are extremely difficult for computers and robots.<\/p><p>Serving customers is an unforgiving reality check, because customers only care about solving the real problems they have. If we are to deploy AI-based robot solutions, they must outperform the way things are currently done while demonstrating reliable performance metrics and safety. Agility Robotics’ early work to deploy our humanoid robot Digit in customer locations led to the realization that our first obstacle was safety: Robots that balance and manipulate objects in human spaces bring new types of risk to the workplace. In the first <a href=\"https://www.youtube.com/watch?v=AJpTpUqjgrY\" target=\"_blank\">humanoid deployments<\/a>, physical barriers were necessary, and Agility kicked off a multi-year engineering effort to solve the safety challenge, touching nearly every aspect of robot design and relying heavily on new AI-based approaches to human detection and behavior control.<\/p><p class=\"shortcode-media shortcode-media-youtube\"> <span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span> <\/p><p><a href=\"https://everydayrobots.ai/vision\" target=\"_blank\">Everyday Robots<\/a> at Google deployed robots in 2019 that worked autonomously in office buildings doing chores like cleaning cafe tables and sorting trash. We quickly learned how “messy” and difficult the real world is for a robot. This experience informed the architecture and deployment of our AI systems while also gathering real-world data that could be combined with simulation data for training and improving models.<\/p><p>This focus on creating a product to meet specific customer needs and deploying robots in real-world settings is the only way to inform the structure of the AI tools and infrastructure for near-term utility on a path towards long-term broader capability and generality. There will be no “aha” moment, no silver bullet algorithm, and no volume of data sufficient to produce a general-purpose robot without extensive real-world experience. <\/p><h2>AI Robots Are Coming, One Step at a Time<\/h2>As we look to the future, there is no doubt that the world is bringing AI into the physical world through robots. We are at the beginning of a “<a href=\"https://spectrum.ieee.org/is-a-cambrian-explosion-coming-for-robotics\" target=\"_self\">Cambrian explosion<\/a>“ of useful, intelligent machines. We believe AI is not one tool, but a huge frontier of technical approaches that is unlocking new capabilities so powerful, they will define our economy moving forward. This will happen not in one single definitive moment, but as an ongoing set of small and large breakthroughs, where AI-driven robots begin to provide real value in a few tasks, and then a few more, with impacts unfolding across numerous $100 billion-plus markets that will dramatically improve the quality of our lives."}], "roboticsNews": [{"title": "Atlas Robot’s New Hand May Outperform Human-Like Designs", "source": "IEEE Spectrum Robotics", "date": "2026-10-01", "url": "https://spectrum.ieee.org/robust-robot-hand", "summary": "<img src=\"https://spectrum.ieee.org/media-library/close-up-of-a-robotic-hand-with-three-fingers-and-a-thumb-making-a-gesture-similar-to-the-sign-of-the-horns.jpg?id=67879402&amp;width=1245&amp;height=700&amp;coordinates=0%2C260%2C0%2C261\" /><br /><br /><p><span>Today, <\/span><a href=\"https://bostondynamics.com/\" target=\"_blank\">Boston Dynamics<\/a><span> is <a href=\"https://bostondynamics.com/blog/robot-hands-for-modern-ai-and-real-work/\" target=\"_blank\">announcing<\/a> a redesigned hand for its <\/span><a href=\"https://spectrum.ieee.org/atlas-humanoid-robot\" target=\"_self\">Atlas robot<\/a><span>. The previous generation could do some <\/span><a href=\"https://spectrum.ieee.org/robots-ces-2026\" target=\"_self\">crazy superhuman<\/a><span> things with its three fingers, but it was never intended for mass production in the tens or hundreds of thousands. Switching from research hardware to a scalable product makes previously ignorable questions suddenly paramount: how can you make a hand that does everything you need it to do, but is also rugged and reliable and cost effective? It’s questions like these that drove the design of the new Atlas hand, and while it doesn’t look much like a human hand, it might be a hand that makes it out into the real world.<\/span><\/p><p class=\"shortcode-media shortcode-media-youtube\"> <span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span> <small class=\"image-media media-caption\">- YouTube<\/small> <small class=\"image-media media-photo-credit\"> <a href=\"https://www.youtube.com/watch?v=4whgw2gLBS8\" target=\"_blank\">www.youtube.com<\/a> <\/small> <\/p><p>Compared to the almost <a href=\"https://clonerobotics.com/hand\" target=\"_blank\">eerily human-like hands<\/a> designed by a litany of other <a href=\"https://www.1x.tech/discover/neos-hands\" target=\"_blank\">humanoid<\/a> <a href=\"https://www.unitree.com/Dex5-S\" rel=\"noopener noreferrer\" target=\"_blank\">robotics<\/a> <a href=\"https://www.figure.ai/\" rel=\"noopener noreferrer\" target=\"_blank\">companies<\/a>, Atlas’ new hand does look awfully clunky. We’ve certainly seen some of those robots with much more human-like hands perform dexterous manipulation tasks that are, speaking as someone who has personally witnessed robots haplessly fumble their way through the world for nearly two decades now, nothing short of incredible. And it’s not just what these hands can do—it’s how they look while doing it, as slim, graceful mechanical copies of our own hands. They seem like science fiction, and to some extent, that’s exactly what they are.<\/p><p>“Hands are a ruthless design tradeoff,” <a href=\"https://www.linkedin.com/in/alberto-rodriguez-5457661a8/\" rel=\"noopener noreferrer\" target=\"_blank\">Alberto Rodriguez<\/a>, Director of Robot Behavior at Boston Dynamics, tells IEEE Spectrum. “There’s no way around it, you’re always giving up on something. And many of the current designs are giving up on things like reliability and manufacturability.” This is what invariably happens when you try and cram everything necessary to make a robotic hand function into the form factor of a human hand: it’s going to be either very fragile or very expensive, and likely both at the same time. The unfortunate reality is that for now, and likely for the immediate future, all that these sorts of hands are good for are research and demos.<\/p><p>With Atlas’ new hand, Boston Dynamics is making the design tradeoffs necessary to achieve a hand that, according to the press release: is capable of a vast array of useful tasks, including using tools; is strong and rugged; can be cleanly simulated; can be mass manufactured and repaired at reliably low cost, and is close enough in form factor to a human hand that human demonstrations can be used to train it.<\/p><p>You’ll notice that “looks cosmetically like a human hand” is nowhere on that list, and this new hand doesn’t. Rodriguez explains that getting rid of the pinky was a straightforward decision, agreed on after his team spent a day with their pinkies taped to their ring fingers. But why even add a fourth finger, when the previous generation of Atlas’ hand seemed to do well with only three? It’s not just the extra finger, but a complete redesign that almost doubled the degrees of freedom between the old hand and the new, going from 7 to 13. <\/p><p class=\"shortcode-media shortcode-media-rebelmouse-image\"> <img alt=\"Close-up of a splayed robotic hand with three fingers and a thumb.\" class=\"rm-shortcode\" id=\"8b02e\" src=\"https://spectrum.ieee.org/media-library/close-up-of-a-splayed-robotic-hand-with-three-fingers-and-a-thumb.jpg?id=67879501&amp;width=980\" /> <small class=\"image-media media-photo-credit\">Boston Dynamics<\/small><\/p><p>“We also added the ability for the fingers to splay open, because we knew that it was important for one finger to be able to move against another, and we also knew that we needed to be able to hold the handle of a tool with a trigger,” Rodriguez says, which includes many common tools like drills or welding torches. “We’re convinced that from a product perspective, this hand should be able to do everything we need it to do for the foreseeable horizon.” And that ability to finger splay goes beyond what human hands are capable of. According to Rodriguez, “with reinforcement learning we can discover uses for these superhuman extra motions, and exploit them.”<\/p><p>Reliability, manufacturability, and cost are all closely related. By reducing the degrees of freedom relative to other more anthropomorphic hand designs down to just 13, Boston Dynamics can use fewer, larger, and more powerful actuators. The actuators are embedded directly into the joints themselves in a direct drive configuration, with a transmission that allows the motors to be back-driven and react to force and contact. Each actuator pack is a single unit that can be easily replaced, and there are no delicate tendons or cables across joints to stretch and break. “What we’re working on right now is figuring out what needs to change in the fine details of our design if we want to make 100,000 of these hands a year,” Rodriguez says.<\/p><p>Not every humanoid company will make the tradeoffs that Boston Dynamics has done here, and there’s still plenty of room for creativity when it comes to hand design. But if humanoids with hands are going to scale, some difficult decisions will have to be made, and it’ll take some compromise to deliver on the promises that the humanoid industry has committed to.<\/p>"}, {"title": "How Maven Robotics plans to automate industrial work, one task at a time", "source": "Robotics Business Review", "date": "2026-10-01", "url": "https://www.therobotreport.com/how-maven-robotics-plans-automate-industrial-work-one-task-at-a-time/", "summary": "<p>With the $100 million it raised earlier this month, Maven Robotics is looking towards mass producing its mobile manipulator robot.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/how-maven-robotics-plans-automate-industrial-work-one-task-at-a-time/\">How Maven Robotics plans to automate industrial work, one task at a time<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "ANYbotics launches Shift to streamline robot fleet operations, scale inspections", "source": "Robotics Business Review", "date": "2026-10-01", "url": "https://www.therobotreport.com/anybotics-launches-shift-streamline-robot-fleet-operations-scale-autonomous-inspections/", "summary": "<p>ANYbotics designed Shift to help maintenance teams run industrial inspections, detect failing equipment, and turn data into work orders.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/anybotics-launches-shift-streamline-robot-fleet-operations-scale-autonomous-inspections/\">ANYbotics launches Shift to streamline robot fleet operations, scale inspections<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Tackling construction labor shortages: ASI and SoftBank partner on autonomous fleets", "source": "Robotics Business Review", "date": "2026-09-30", "url": "https://www.therobotreport.com/tackling-construction-labor-shortages-asi-softbank-partner-autonomous-fleets/", "summary": "<p>ASI and SoftBank join forces with $225M to scale brand-agnostic autonomous heavy equipment across infrastructure projects.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/tackling-construction-labor-shortages-asi-softbank-partner-autonomous-fleets/\">Tackling construction labor shortages: ASI and SoftBank partner on autonomous fleets<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "The Robot Report parent Arrowfly launches AI for Engineers platform, events for engineers navigating AI", "source": "Robotics Business Review", "date": "2026-09-30", "url": "https://www.therobotreport.com/robot-report-parent-arrowfly-launches-ai-for-engineers-platform-events-engineers-navigating-ai/", "summary": "<p>The initiative for engineers includes a news desk, a conference, research, and an advisory board, grounded in trusted editorial brands.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/robot-report-parent-arrowfly-launches-ai-for-engineers-platform-events-engineers-navigating-ai/\">The Robot Report parent Arrowfly launches AI for Engineers platform, events for engineers navigating AI<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Innodata opens motion-capture lab to help humanoids move more like people", "source": "Robotics Business Review", "date": "2026-09-30", "url": "https://www.therobotreport.com/innodata-opens-motion-capture-lab-help-humanoids-move-more-like-people/", "summary": "<p>Innodata uses Vicon cameras to measure movements with sub-millimeter accuracy and to collect real-world training data for robots.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/innodata-opens-motion-capture-lab-help-humanoids-move-more-like-people/\">Innodata opens motion-capture lab to help humanoids move more like people<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Meet Flourish One, the Raspberry Pi-powered humanoid built for busy parents", "source": "Robotics Business Review", "date": "2026-09-29", "url": "https://www.therobotreport.com/meet-flourish-one-raspberry-pi-powered-humanoid-built-busy-parents/", "summary": "<p>Flourish is releasing a $3,555 phone-trainable home robot, targeting busy parents with personalized, cloud-trained chore automation.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/meet-flourish-one-raspberry-pi-powered-humanoid-built-busy-parents/\">Meet Flourish One, the Raspberry Pi-powered humanoid built for busy parents<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "State of Robots in Manufacturing", "source": "Robotics Business Review", "date": "2026-09-29", "url": "https://www.therobotreport.com/state-of-robots-in-manufacturing/", "summary": "<p>The Robot Report looks at recent advances in automation for manufacturing, from improvements in technologies and use cases to the potential of humanoids and AI.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/state-of-robots-in-manufacturing/\">State of Robots in Manufacturing<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "ForceN to give a crash course on force and torque sensing for humanoids at RoboBusiness", "source": "Robotics Business Review", "date": "2026-09-29", "url": "https://www.therobotreport.com/forcen-gives-crash-course-force-torque-sensing-humanoids-robobusiness-2026/", "summary": "<p>Attendees will learn about the many ways they can use force and torque sensors in humanoids and how to avoid breaking them while doing it.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/forcen-gives-crash-course-force-torque-sensing-humanoids-robobusiness-2026/\">ForceN to give a crash course on force and torque sensing for humanoids at RoboBusiness<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Gecko Robotics works with NVIDIA to add AI agent security and control", "source": "Robotics Business Review", "date": "2026-09-28", "url": "https://www.therobotreport.com/gecko-robotics-works-with-nvidia-adds-ai-agent-security-and-control/", "summary": "<p>Gecko Robotics is using the new NVIDIA Open Agent Safety Platform to ensure the secure autonomous control of systems.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/gecko-robotics-works-with-nvidia-adds-ai-agent-security-and-control/\">Gecko Robotics works with NVIDIA to add AI agent security and control<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Raise Robotics to discuss scaling field robots at RoboBusiness", "source": "Robotics Business Review", "date": "2026-09-28", "url": "https://www.therobotreport.com/raise-robotics-discuss-scaling-field-robots-robobusiness/", "summary": "<p>Raise Robotics said attendees will learn a decision rule for allocating engineering capacity and a vocabulary for two hidden failure modes.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/raise-robotics-discuss-scaling-field-robots-robobusiness/\">Raise Robotics to discuss scaling field robots at RoboBusiness<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "A Day in the Life of a Roboticist: Charlie Kemp", "source": "IEEE Spectrum Robotics", "date": "2026-09-28", "url": "https://robotsguide.com/learn/a-day-in-the-life-of-a-roboticist-charlie-kemp", "summary": "<img src=\"https://spectrum.ieee.org/media-library/man-standing-beside-a-tall-wheeled-robot-smiling-and-waving-at-the-camera.jpg?id=67880303&amp;width=1245&amp;height=700&amp;coordinates=0%2C187%2C0%2C188\" /><br /><br /><p>Building useful robots starts with understanding the people who use them. For Charlie Kemp, cofounder and chief technology officer of Hello Robot, that means developing assistive robots that can help people with everyday tasks and support greater independence.<\/p><p>In this <a href=\"https://robotsguide.com/\" target=\"_blank\">Robots Guide<\/a> profile, Kemp shares his path from studying artificial intelligence at MIT to building Stretch, explains how working with people with disabilities has shaped his approach, and offers advice for aspiring roboticists. <a href=\"https://robotsguide.com/learn/a-day-in-the-life-of-a-roboticist-charlie-kemp\" rel=\"noopener noreferrer\" target=\"_blank\">Read the full profile on IEEE’s Robots Guide.<\/a><\/p>"}, {"title": "Robonomics on the threshold: Economic autonomy, smart cities, and crypto wallets for humanoids", "source": "Robotics Business Review", "date": "2026-09-28", "url": "https://www.therobotreport.com/robotics-threshold-economic-autonomy-crypto-wallets-humanoids/", "summary": "<p>Economics is both a robotics impetus and a constraint, as systems make deliveries on streets or do chores in households.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/robotics-threshold-economic-autonomy-crypto-wallets-humanoids/\">Robonomics on the threshold: Economic autonomy, smart cities, and crypto wallets for humanoids<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Asimov’s laws are not enough to keep robotics and AI safe", "source": "Robotics Business Review", "date": "2026-09-27", "url": "https://www.therobotreport.com/asimovs-laws-are-not-enough-keep-robotics-ai-safe/", "summary": "<p>Asimov's fictional Three Laws of Robotics famously set safeguards, and tech observers today raise similar concerns about AI.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/asimovs-laws-are-not-enough-keep-robotics-ai-safe/\">Asimov&#8217;s laws are not enough to keep robotics and AI safe<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "From 14 cities to 15,000: What it will take to scale robotaxis?", "source": "Robotics Business Review", "date": "2026-09-26", "url": "https://www.therobotreport.com/from-14-cities-to-15000-what-it-will-take-to-scale-robotaxis/", "summary": "<p>While robotaxis prove their driving ability, scaling the industry globally requires solving the unglamorous challenge of fast, local vehicle servicing.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/from-14-cities-to-15000-what-it-will-take-to-scale-robotaxis/\">From 14 cities to 15,000: What it will take to scale robotaxis?<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Farmers are facing more pressure; CNH says robotics can help", "source": "Robotics Business Review", "date": "2026-09-25", "url": "https://www.therobotreport.com/farmers-are-facing-more-pressure-cnh-says-robotics-can-help/", "summary": "<p>Labor availability, costs, productivity, and efficiency are common concerns of farmers that technology can address, according to CNH. <\/p>\n<p>The post <a href=\"https://www.therobotreport.com/farmers-are-facing-more-pressure-cnh-says-robotics-can-help/\">Farmers are facing more pressure; CNH says robotics can help<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Video Friday: Life’s Better With a Little Robot Goose", "source": "IEEE Spectrum Robotics", "date": "2026-09-25", "url": "https://spectrum.ieee.org/video-friday-goose-household-robots", "summary": "<img src=\"https://spectrum.ieee.org/media-library/mobile-assistive-robot-with-articulated-arm-beside-coffee-table-in-cozy-living-room.png?id=67853191&amp;width=1245&amp;height=700&amp;coordinates=0%2C0%2C0%2C0\" /><br /><br /><p><span>Video Friday is your weekly selection of awesome robotics videos, collected by your friends at <\/span><em>IEEE Spectrum<\/em><span> robotics. We also post a weekly calendar of upcoming robotics events for the next few months. Please <\/span><a href=\"mailto:automaton@ieee.org?subject=Robotics%20event%20suggestion%20for%20Video%20Friday\">send us your events<\/a><span> for inclusion.<\/span><\/p><h5><a href=\"https://2026.ieee-iros.org/\">IROS 2026<\/a>: 27 September–1 October 2026, PITTSBURGH<\/h5><h5><a href=\"https://www.corl.org/\">CoRL 2026<\/a>: 9–12 November 2026, AUSTIN, TEXAS<\/h5><h5><a href=\"https://2026.ieee-humanoids.org/\">Humanoids 2026<\/a>: 6–9 December 2026, SANTA CLARA, CALIF.<\/h5><p>Enjoy today’s videos!<\/p><div class=\"horizontal-rule\"><\/div><div><span style=\"display: none;\"> <\/span><\/div><blockquote class=\"rm-anchors\" id=\"e502xyw7e1g\"><em>Life’s better with a little Goose.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.therobotworks.ai/\">The Robot Works<\/a> ]<\/p><p>Thanks, Dave!<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"mai4evtj4dm\">Skydio has introduced the F10, a charmingly lopsided <a href=\"https://spectrum.ieee.org/skydio-camera-drone-autonomous-flying\" target=\"_blank\">fixed-wing drone<\/a>, that uses a robot arm for autonomous launch and capture.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>Unfortunately, based on the frequency of that flashing LED on the drone, this video appears to have sped up the capture (and likely the launch) by a substantial amount.<\/p><p>[ <a href=\"https://www.skydio.com/f10\">Skydio<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"lqdeoreu6bi\">I want a bunch of these little guys. I don’t know what I’d do with them. But I want them.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://freeformrobotics.org/publications/\">Freeform Robotics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"lfkoi0mvwos\"><em>Walking robots are everywhere now…. But 30 years ago, they were brand new. The first ever robot that could walk by itself was the <a href=\"https://spectrum.ieee.org/honda-p2-robot-ieee-milestone\" target=\"_blank\">Honda P2<\/a>. The P2 featured motors and hydraulics in the hips, knees, and ankles to walk around, and weighed over 300 pounds.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://spectrum.ieee.org/honda-p2-robot-ieee-milestone\">IEEE Spectrum<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"lat2rikjhto\"><em>Precision biomimetic dexterous hand, priced from US $6,500.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.unitree.com/Dex2-5\">Unitree<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"jimw_ligkvq\">What if all it took to train a drone to do acrobatics was to tell it whether you like the way it flies?<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://rpg.ifi.uzh.ch/docs/IROS26_Geles_PbRL.pdf\">UZH Robotics and Perception Group<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"ktncpptpsqe\">Why build a <a href=\"https://spectrum.ieee.org/video-friday-robotic-hands-2674168909\" target=\"_blank\">humanoid hand<\/a> when a <a href=\"https://spectrum.ieee.org/aussies-win-amazon-robotics-challenge\" target=\"_blank\">robot hand<\/a> can do stuff like this?<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://generalroboticslab.com/cartesian_handv1\">General Robotics Lab<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"etzdogql56c\"><em>Diane Heinle, a mechanical engineer at Boston Dynamics, answers questions about endurance testing for Stretch, how her team simulates years of wear on robot parts over a brief time in the lab, and why there are bird heads on them.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://bostondynamics.com/blog/ask-a-roboticist-meet-diane/\">Boston Dynamics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"0qus7bzzkas\"><em>ULOHA brings learning from demonstrations to two robot arms working underwater. We developed custom leader–follower hardware and software extending LeRobot to connect teleoperation, demonstration collection, and autonomous manipulation. The video shows the robots lifting objects together, passing objects between arms, opening a container, and catching a sponge as it rises through the water. We also explore how bubbles and action-execution timing affect learned behaviors.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://mertcookimg.github.io/uloha/\">ULOHA<\/a> ]<\/p><p>Thanks, Masato!<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"n6cl5gi0c0u\">Usually, ballbots rely on an internal pendulum, but here’s a different approach.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://generalroboticslab.com/MARBLE\">General Robotics Lab<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"hnlfompekgk\"><em>From long-horizon manipulation to tactile-guided actions, this video highlights selected collaborations that explore what Astribot robots can do.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.astribot.com/en/product\">Astribot<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"vu5w9_nmet4\">This is one of those tasks that looks a little boring but is actually both very tricky and very useful.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://arxiv.org/abs/2509.10979\">HiPeR Lab<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"5u0rzdl7jvi\">That tiny little excavator playing in flour is adorbs.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://arxiv.org/abs/2609.12677v1\">ETH Zurich Robotic Systems Lab<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"vh9ucogdwcm\">How do you fit a humanoid robot into a box?<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.limxdynamics.com/en/products/luna\">LimX Dynamics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"bykyz9qwqcw\">And now, this.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><blockquote><em>At the Opening Ceremony of WorldSkills Shanghai 2026 on 22 September, 19 Unitree humanoid robots performed alongside 120 dancers, presenting the world’s largest-scale performance featuring full-size general-purpose humanoid robots before an audience of more than 10,000 people, with a fully AI-driven autonomous robot cluster performance live-streamed worldwide in real time.<\/em><\/blockquote><p>[ <a href=\"https://unitree.com/\">Unitree<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"fd9mleerkpg\"><em>A microwave box creates a surprisingly tricky vision system challenge: there’s a picture of a microwave on the side of the box, and that microwave has a window. From the camera’s perspective, it’s a box inside a box inside a box.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.picklerobot.com/\">Pickle Robot Company<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"l6bsqc5cccw\">What exactly is Physical AI? Personally I think it’s just what robotics has always been, more or less, except that everything has to have “AI” in it now, so here we are.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.csail.mit.edu/news/\">MIT CSAIL<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"dx_dlmrlh60\"><em>As the evolution of the UR Series, the g‑Series is designed to accelerate how robots are integrated into complete automation systems. It connects more directly with cameras, higher power EOATs, and control systems, eliminating external cabling and hardware to streamline integration. This enables cleaner and faster deployment of advanced automation.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.universal-robots.com/news-and-media/news-center/universal-robots-unveils-gen-7-new-platform-industrial-automation-physical-ai/\">Universal Robots<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div>"}, {"title": "Agility Robotics, maker of Digit humanoid, exploring wheeled robots", "source": "Robotics Business Review", "date": "2026-09-25", "url": "https://www.therobotreport.com/agility-robotics-maker-of-digit-humanoid-exploring-wheeled-robots/", "summary": "<p>Agility Robotics is exploring a range of robot designs and form factors, including wheels, to address different operating environments and customer needs.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/agility-robotics-maker-of-digit-humanoid-exploring-wheeled-robots/\">Agility Robotics, maker of Digit humanoid, exploring wheeled robots<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Amazon to invest $100M in new Indiana manufacturing facility", "source": "Robotics Business Review", "date": "2026-09-25", "url": "https://www.therobotreport.com/amazon-to-invest-100m-in-new-indiana-manufacturing-facility/", "summary": "<p>The new facility will produce products that power Amazon's fulfillment and robotics network across North America.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/amazon-to-invest-100m-in-new-indiana-manufacturing-facility/\">Amazon to invest $100M in new Indiana manufacturing facility<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "General Robotics is betting on modular intelligence, not one robot brain", "source": "Robotics Business Review", "date": "2026-09-25", "url": "https://www.therobotreport.com/general-robotics-is-betting-on-modular-intelligence-not-one-robot-brain/", "summary": "<p>Rather than training one model to do everything, General Robotics composes specialized capabilities—helping robots adapt across tasks and form factors.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/general-robotics-is-betting-on-modular-intelligence-not-one-robot-brain/\">General Robotics is betting on modular intelligence, not one robot brain<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Why you should look beyond the spec sheet when choosing motion architecture", "source": "Robotics Business Review", "date": "2026-09-24", "url": "https://www.therobotreport.com/why-you-should-look-beyond-spec-sheet-when-choosing-motion-architecture/", "summary": "<p>Choosing the right motion architecture is about understanding how the entire system will behave in use, explains Kollmorgen.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/why-you-should-look-beyond-spec-sheet-when-choosing-motion-architecture/\">Why you should look beyond the spec sheet when choosing motion architecture<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Epson introduces AX6 cobot with compact design, no-code programming", "source": "Robotics Business Review", "date": "2026-09-24", "url": "https://www.therobotreport.com/epson-introduces-ax6-cobot-compact-design-no-code-programming/", "summary": "<p>Epson Robots has expanded its six-axis robot line with the AX6, a lightweight force- and power-limited arm.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/epson-introduces-ax6-cobot-compact-design-no-code-programming/\">Epson introduces AX6 cobot with compact design, no-code programming<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "ANYbotics opens the door for inspections with ANYmal robots", "source": "Robotics Business Review", "date": "2026-09-24", "url": "https://www.therobotreport.com/anybotics-opens-the-door-for-inspections-with-anymal-robots/", "summary": "<p>ANYbotics partnered with dormakaba and LEGIC Identsystems to enable the ANYmal quadruped to gain access like a badged employee.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/anybotics-opens-the-door-for-inspections-with-anymal-robots/\">ANYbotics opens the door for inspections with ANYmal robots<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Mexican EPICS in IEEE Team Builds Portable Educational Platform", "source": "IEEE Spectrum Robotics", "date": "2026-09-24", "url": "https://spectrum.ieee.org/epics-in-ieee-portable-educational", "summary": "<img src=\"https://spectrum.ieee.org/media-library/four-young-adult-students-laugh-together-while-one-of-them-holds-a-robot-shaped-like-a-hexagonal-cylinder.jpg?id=67845427&amp;width=1245&amp;height=700&amp;coordinates=0%2C156%2C0%2C157\" /><br /><br /><p>In Guadalajara, Mexico, many high schools have motivated teachers and talented students with an interest in science, technology, engineering, and mathematics, but they lack access to advanced tools such as robotics laboratories. The resources shortfall limits the students’ opportunities for hands-on learning on cutting-edge applications.<\/p><p>A team from <a href=\"https://apps.iteso.mx/web/iteso/inicio\" rel=\"noopener noreferrer\" target=\"_blank\">ITESO, Universidad Jesuita de Guadalajara<\/a>, is working to change that. Through the <a href=\"https://epics.ieee.org\" rel=\"noopener noreferrer\" target=\"_blank\">EPICS in IEEE<\/a> initiative, a multidisciplinary group of 15 engineering students, faculty advisors, and <a href=\"https://www.ieeegdl.org/\" rel=\"noopener noreferrer\" target=\"_blank\">IEEE Guadalajara Section<\/a> volunteers developed RoboMeshA. The portable, self-contained educational platform brings robotics and AI experiences into classrooms.<\/p><p><a href=\"https://spectrum.ieee.org/epics-in-ieee-15th-anniversary\" target=\"_self\">EPICS<\/a> is administered by <a href=\"https://ea.ieee.org\" rel=\"noopener noreferrer\" target=\"_blank\">IEEE Educational Activities<\/a> and funded by the <a href=\"https://www.ieee-ras.org/\" rel=\"noopener noreferrer\" target=\"_blank\">IEEE Robotics and Automation Society<\/a>.<\/p><h2>A mobile laboratory<\/h2><p>Rather than requiring a school to build a dedicated computer lab or install complex software, RoboMeshA<em> <\/em>operates as an all-in-one mobile learning network.<\/p><p>“RoboMeshA brings robotics and AI to students who don’t have access to specialized facilities or preinstalled software,” says team member Fernando Vidal Luna, an IEEE student member and a mechatronics engineering major at ITESO.<\/p><p>Students connect directly to the platform from a user-friendly web browser. They can interact with the robot manually or use its control modes to watch it move and detect and avoid obstacles.<\/p><p>“The project combines mechanical design, embedded systems, control engineering, computer vision, and AI into a single robotic system that functions as a mobile learning laboratory,” says faculty advisor <a href=\"https://www.linkedin.com/in/jorgealizarraga/\" rel=\"noopener noreferrer\" target=\"_blank\">Jorge A. Lizarraga<\/a>.<\/p><p>The team says young students are interested in technology, programming, and robotics but don’t have an opportunity to work with systems that combine mechanics, electronics, software, and control.<\/p><p>“RoboMeshA allows students to see how all these disciplines work together in a tangible and understandable way,” says team member José S. González, who also is studying mechatronics engineering.<\/p><p>The team has built two units and is developing a modular coupling framework to expand the system’s capabilities for research and classroom demonstrations. The structured system design approach connects independent software components while minimizing internal dependencies, enabling four RobotMeshA robots to operate together.<\/p><h2>Overcoming design challenges<\/h2><p>The team faced significant hurdles while designing the project.<\/p><p>“One key challenge involved the robot’s structural design,” Luna says. “It wasn’t only about making a chassis where all the components fit and the design had sufficient stability, rigidity, and weight distribution. It was also about ensuring that the electronics were protected while still being accessible for maintenance, testing, and modifications.”<\/p><p>“It was also challenging to design a platform that could be used by students with different levels of experience,” González adds.<\/p><p class=\"pull-quote\">“When students realize the technology they develop can inspire others and improve lives, engineering becomes far more meaningful.” <strong>—Luis Fernando Luque-Vega<\/strong><\/p><p>The team partnered with the <a href=\"https://www.colomos.ceti.mx/\" target=\"_blank\">CETI Colomos<\/a> and <a href=\"https://prepa.iteso.mx/\" rel=\"noopener noreferrer\" target=\"_blank\">Prepa ITESO<\/a> high schools to validate the platform in classroom settings.<\/p><p>“We wanted the first interactions with the robot to be simple and intuitive,” González says, “such that students could simply power the robot, connect to its network, and begin interacting with it, rather than having to deal with software installation, extensive configuration, or troubleshooting.”<\/p><h2>Engineering with social impact<\/h2><p>Many of the students who participated were from ITESO’s applied professional projects program. The experience offered them <a href=\"https://spectrum.ieee.org/hands-on-projects-career-advice\" target=\"_self\">practical training<\/a> in project management, system integration, and user-centered design.<\/p><p>The team also presented a research paper and a project poster in May at the <a href=\"https://congresossuj.mx/congresos/3er-congreso-de-ingenierias-suj/\" rel=\"noopener noreferrer\" target=\"_blank\">Engineering Congress of the Jesuit University System<\/a>.<\/p><p>“Seeing a design move from a digital model to a physical system was invaluable,” González says. “Working with students from different backgrounds taught us to listen to end users and design for their actual needs.”<\/p><p>Project lead <a href=\"https://www.linkedin.com/in/luis-fernando-luque-vega-289aa348/\" rel=\"noopener noreferrer\" target=\"_blank\">Luis Fernando Luque-Vega<\/a>, an IEEE member, says he’d like the venture to serve as a blueprint for engineering education.<\/p><p>“I hope RoboMeshA<em> <\/em>is adopted by schools, universities, and IEEE student branches across Mexico and internationally as a model for integrating technical innovation with community engagement,” Luque-Vega says.<\/p><p>By pairing engineering talent with community service, initiatives such as EPICS in IEEE demonstrate how targeted support can turn academic concepts into real-world solutions.<\/p><p>“When students realize the technology they develop can inspire others and improve lives, engineering becomes far more meaningful,” Luque-Vega says.<\/p><p>For more information on service-learning opportunities, visit the <a href=\"https://epics.ieee.org/\" rel=\"noopener noreferrer\" target=\"_blank\">EPICS website<\/a>.<\/p>"}, {"title": "5 million robots are now at work in factories worldwide, reports the IFR", "source": "Robotics Business Review", "date": "2026-09-24", "url": "https://www.therobotreport.com/5-million-robots-now-working-factories-worldwide-ifr-reports/", "summary": "<p>China still leads the world in industrial robot installations, but the U.S. and Germany are also significant markets, found the IFR.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/5-million-robots-now-working-factories-worldwide-ifr-reports/\">5 million robots are now at work in factories worldwide, reports the IFR<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Qualcomm to acquire PickNik Robotics and keep MoveIt open-source", "source": "Robotics Business Review", "date": "2026-09-23", "url": "https://www.therobotreport.com/qualcomm-acquires-picknik-robotics-keep-moveit-open-source/", "summary": "<p>Qualcomm plans to integrate the Dragonwing and Arduino platforms with the MoveIt open-source manipulation framework.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/qualcomm-acquires-picknik-robotics-keep-moveit-open-source/\">Qualcomm to acquire PickNik Robotics and keep MoveIt open-source<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Helicon brings automation to high-volume composites manufacturing", "source": "Robotics Business Review", "date": "2026-09-23", "url": "https://www.therobotreport.com/helicon-brings-automation-high-volume-composites-manufacturing/", "summary": "<p>Helicon has obtained seed funding to use automation to cut composite manufacturing lead times from months to weeks.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/helicon-brings-automation-high-volume-composites-manufacturing/\">Helicon brings automation to high-volume composites manufacturing<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "State of Humanoids keynote brings industry leaders to RoboBusiness", "source": "Robotics Business Review", "date": "2026-09-23", "url": "https://www.therobotreport.com/state-of-humanoids-keynote-brings-industry-leaders-robobusiness/", "summary": "<p>At RoboBusiness, industry leaders will discuss the state of humanoids as the robots transition from demos to real industrial deployments.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/state-of-humanoids-keynote-brings-industry-leaders-robobusiness/\">State of Humanoids keynote brings industry leaders to RoboBusiness<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "With the new VENTUNO Q board, Arduino hopes to make robotics development easier", "source": "Robotics Business Review", "date": "2026-09-23", "url": "https://www.therobotreport.com/new-ventuno-q-board-arduino-hopes-make-robotics-development-easier/", "summary": "<p>While this is the first intentional step by Arduino into robotics, the company has over 20 years of experience working with robotics developers.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/new-ventuno-q-board-arduino-hopes-make-robotics-development-easier/\">With the new VENTUNO Q board, Arduino hopes to make robotics development easier<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Barbara Mazzolai Wants to Build a New Field of Robotics", "source": "IEEE Spectrum Robotics", "date": "2026-09-22", "url": "https://spectrum.ieee.org/sustainability-robotics-barbara-mazzolai", "summary": "<img src=\"https://spectrum.ieee.org/media-library/photo-of-a-woman-standing-in-front-of-greenery-holding-a-device-shaped-like-a-small-octopus-arm.png?id=67787635&amp;width=1245&amp;height=700&amp;coordinates=0%2C0%2C0%2C0\" /><br /><br /><p>Throughout her career, roboticist <a href=\"https://www.iit.it/people-details/-/people/barbara-mazzolai\" rel=\"noopener noreferrer\" target=\"_blank\">Barbara Mazzolai<\/a> has turned to nature for inspiration. Now she wants to ensure the technology she builds gives back to the environment, too.<\/p><p>After starting her career as a biologist, a chance opportunity saw Mazzolai switch streams to engineering and become an early pioneer of <a href=\"https://spectrum.ieee.org/tag/bioinspired-robots\" target=\"_blank\">bioinspired robotics<\/a>. Building on her knowledge of biology’s ability to solve a diverse set of problems, she has developed robots based on octopuses, plant roots, <a href=\"https://opentalk.iit.it/en/iit-the-first-biodegradable-seed-robot-able-to-change-shape-in-response-to-humidity/\" rel=\"noopener noreferrer\" target=\"_blank\">and even seeds<\/a>. “I’ve always been fascinated by living organisms, [and] by the extraordinary variety of solutions in nature, selected by the evolutionary process,” she says.<\/p><h3>Barbara Mazzolai<\/h3><br /><p><strong><\/strong><strong>Employer:<\/strong><\/p><p> Italian Institute of Technology<\/p><p><strong>Occupation: <\/strong><\/p><p>Associate director for robotics; director of the Bioinspired Soft Robotics Laboratory<\/p><p><strong>Education: <\/strong><\/p><p>Master’s degree in biology, University of Pisa; master’s degree in eco-management and audit schemes, Scuola Superiore Sant’Anna; Ph.D. in microsystems engineering, University of Rome Tor Vergata<\/p><p>But Mazzolai, now the associate director for robotics at the <a href=\"https://www.iit.it/\" rel=\"noopener noreferrer\" target=\"_blank\">Italian Institute of Technology, in Genoa<\/a>, also believes engineering needs to <a href=\"https://spectrum.ieee.org/robotics-climate-change\" target=\"_blank\">reckon with its own impact<\/a> on the natural world. That’s why she is advocating for a new field of research she calls “sustainability robotics.”<\/p><p>In a manifesto <a href=\"https://www.nature.com/articles/s42256-026-01260-6\" rel=\"noopener noreferrer\" target=\"_blank\">published in<em><em> Nature Machine Intelligence<\/em><\/em><\/a> in July, she and her collaborators outline a vision for a new approach to designing robots that’s meant to improve the relationship between nature, humanity, and technology.<\/p><p>“We need to reduce the footprint of our technology,” she says. “It’s really about thinking in a different way to open new possibilities for robotics [and] for society.” In this new mode of thinking, Mazzolai considers sustainability a core component of the design.<\/p><h2>A child of nature<\/h2><p>Mazzolai traces her fascination with the living world back to her childhood growing up on Italy’s Tuscan coast, close to the port city Livorno. Her father was a public-health inspector and a professional mycologist, and the family spent a lot of time exploring forests and learning about the local fungi and plants.<\/p><p>After toying with the prospect of pursuing art, her other major passion, Mazzolai ultimately decided to enroll at the <a href=\"https://www.unipi.it/en/\" rel=\"noopener noreferrer\" target=\"_blank\">University of Pisa<\/a> in 1987 to study biology. She was particularly drawn to marine biology, but shortly before graduating with a master’s degree in 1995, she secured a research position at the <a href=\"https://www.cnr.it/en/institute/008/institute-of-biophysics-ibf\" rel=\"noopener noreferrer\" target=\"_blank\">Italian National Research Council’s Institute of Biophysics<\/a> studying the cycles of heavy metals like mercury through both living and nonliving parts of the environment.<\/p><p>This involved collecting and analyzing samples from water, soil, vegetables, and even humans to understand the impact these metals have on health and the environment. She balanced this work with studying environmental management at the <a href=\"https://www.santannapisa.it/it\" rel=\"noopener noreferrer\" target=\"_blank\">Scuola Superiore Sant’Anna<\/a>, in Pisa, graduating with a master’s degree in 1998.<\/p><p>During that time, however, she learned that the university was recruiting biologists to help design new devices for environmental monitoring. She applied for and got the job in 1999 and began working as a research assistant under renowned bioroboticist <a href=\"https://www.embs.org/tbme/past-editorial-board-members/paolo-dario/\" rel=\"noopener noreferrer\" target=\"_blank\">Paolo Dario<\/a>, first developing sensors and then robots meant to monitor air, water, and soil.<\/p><p>Even before entering a doctoral program, Mazzolai was promoted to assistant professor in 2004 and shortly afterward made her first foray into bioinspired robotics. In collaboration with colleagues at Sant’Anna, she helped design a soft robot inspired by the octopus. “We proposed it as a paradigm for launching this idea of soft robotics: demonstrating that [robots] can be soft, but at the same time apply strong force to the environment, like the animal does,” she says.<\/p><h2>Back to school<\/h2><p>In 2007 Mazzolai enrolled in a Ph.D. in microsystems engineering at <a href=\"https://web.uniroma2.it/\" rel=\"noopener noreferrer\" target=\"_blank\">Tor Vergata University of Rome<\/a>, which she balanced with her role at Sant’Anna. She was already relying heavily on microfabrication techniques to develop sensors for her robots, and she was keen to push that part of the field forward.<\/p><p>While robots frequently feature sensors designed for perception, such as tactile or proprioceptive sensors, these systems typically focus on understanding the robot’s position in its environment, she says. “But there are few robots that integrate physical or chemical sensors to really understand the environment they move in,” she adds.<\/p><p class=\"pull-quote\"><span>“I’ve always been fascinated by living organisms, [and] by the extraordinary variety of solutions in nature.”<\/span><\/p><p>Mazzolai was appointed as a team leader at the Center for Micro-BioRobotics of the Italian Institute of Technology in 2009, where she continued her work on the emerging field of bioinspired robotics. Two years later, she completed her Ph.D. and was promoted to director of the center.<\/p><h2>Planting the seeds<\/h2><p>Around this time Mazzolai says she became interested in using plants as a model for new kinds of robots, expanding bioinspiration beyond just animals. In particular, she was captivated by the ability of roots to efficiently explore the underground environment, and she imagined machines with the same deftness could have applications in both environmental modeling and <a href=\"https://spectrum.ieee.org/fertilizer-shortage-precision-agricultur\" target=\"_blank\">precision agriculture<\/a>.<\/p><p class=\"shortcode-media shortcode-media-rebelmouse-image\"> <img alt=\"photo of silver metallic coil wrapped around a green plant vine\" class=\"rm-shortcode\" id=\"305e3\" src=\"https://spectrum.ieee.org/media-library/photo-of-silver-metallic-coil-wrapped-around-a-green-plant-vine.jpg?id=67787644&amp;width=980\" /> <small class=\"image-media media-caption\">While many bioinspired robots mimic animals, plants also serve as a muse for Mazzolai. This tendril-like bot can coil around other structures like a vine. <\/small><small class=\"image-media media-photo-credit\">Italian Institute of Technology<\/small><\/p><p>When she first proposed the idea, colleagues were somewhat skeptical of robots based on seemingly static organisms. But in reality, she says, plants move nonstop through a process known as indeterminate growth. “They really grow for their entire life,” she says. “They adapt their morphology, their behavior to the external environment; they repair, they sense, they communicate.”<\/p><p>Trying to mimic a system that operates on such different principles to conventional robotics required some serious thinking, however. Mazzolai says that working in bioinspired robotics sometimes requires you to have “two separate brains”—one of a biologist and one of an engineer.<\/p><p>The process often involves deep study of the target organism to learn the underlying principles that shape how it operates before trying to engineer a robot capable of mimicking them. “It’s not a copy of natural organisms,” says Mazzolai, because a living organism is both difficult to replicate and has different goals.<\/p><p>In the case of plant roots, what makes them so efficient at exploring the soil is that they reduce friction by growing only at the very fine tip of the structure, while the thicker base of the root remains static. This significantly reduces the amount of energy required to push through the earth compared to that of a more conventional drill, which must push the entire structure from above.<\/p><p>To realize this principle in a robot, her team developed a miniaturized 3D printer that sits at the machine’s tip and feeds thermoplastic filament through a heated nozzle to build a snakelike body behind it. This allows the robot to push through the soil efficiently. The tip also contains sensors that allow it to avoid obstacles and detect nearby nutrients or water.<\/p><h2>Making robotics sustainable<\/h2><p>After spending so much of her career borrowing from nature, Mazzolai is now eager to return the favor. Many modern technologies, including plastics and car batteries, have been developed with little thought about how they will affect the environment at the end of their life cycles, she says.<\/p><p>She wants to ensure that robotics doesn’t follow the same path. This is the inspiration for what she and collaborators now call sustainability robotics. The approach has three central pillars: ensuring that robots have minimal impact on the environment; that they’re available to people from across the world and all socioeconomic backgrounds; and that they’re “symbiotic,” providing benefits to both humans and nature.<\/p
