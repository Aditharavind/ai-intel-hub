nown as &#8216;color temperatures&#8217;): warm white, cool white and amber, great for excellent lighting effects that want pure [&#8230;]"}, {"title": "LIVE! 3D Hangouts with Noe and Pedro", "source": "Adafruit", "date": "2026-10-14", "url": "https://blog.adafruit.com/2026/10/14/live-3d-hangouts-with-noe-and-pedro-88/", "summary": "3D Hangouts – USB Desk Hub, Marquee and Knight Cat https://youtube.com/live/aq4mvEwK7MM?feature=share This week @adafruit special guest Brent Rubell joins to chat about the Adafruit Marquee interface builder for e-ink displays and supported hardware.  Noe is showcasing his built-in USB hub for the Ikea MITTZON desk. Pedro releases a video on Adafruit Marquee. Checking out this [&#8230;]"}, {"title": "RECOM and CELUS Partner to Bring RECOM Power Designs to the CELUS Design Platform", "source": "EE Journal", "date": "2026-10-14", "url": "https://www.eejournal.com/industry_news/recom-and-celus-partner-to-bring-recom-power-designs-to-the-celus-design-platform/", "summary": "RECOM Power, the Austrian designer and manufacturer of power conversion solutions, and CELUS, an industry leader in cloud-based electronics design automation, today announced a partnership that brings a first set of RECOM power designs to the CELUS Design Platform. Under the partnership, these designs are represented as reusable, application-ready design content within CELUS. Engineers can evaluate [&#8230;]"}, {"title": "TDK introduces new dual-die, stray-field robust motor position sensor for ASIL D fail operational applications", "source": "EE Journal", "date": "2026-10-14", "url": "https://www.eejournal.com/industry_news/tdk-introduces-new-dual-die-stray-field-robust-motor-position-sensor-for-asil-d-fail-operational-applications/", "summary": "&#8211;  Full redundancy through two independent dies stacked in a compact QFN24 4×4 mm² package &#8211;  ASIL D ready as a Safety Element out of Context (SEooC), with integrated diagnostics and independent fault detection for each die &#8211;  Stray-field compensation per ISO 11452-8:2015 via an array of six horizontal Hall plates per die &#8211;  High-speed analog [&#8230;]"}, {"title": "Siemens’ Tessent ecosystem enables direct test pattern execution via PCIe and USB", "source": "EE Journal", "date": "2026-10-14", "url": "https://www.eejournal.com/industry_news/siemens-tessent-ecosystem-enables-direct-test-pattern-execution-via-pcie-and-usb/", "summary": "New Tessent Silicon Executable (TSE) software seamlessly delivers test data from the test equipment ecosystem to the Tessent In-System Test on-chip hardware Enables consistent test application across automated test equipment, system-level test, bench, and in-system environments Empowers new functional capability and ease of use in production test and device debug Siemens today announced Tessent™ Silicon [&#8230;]"}, {"title": "STMicroelectronics reveals high-accuracy two-in-one altitude and underwater depth sensor for wearables and sports cameras", "source": "EE Journal", "date": "2026-10-14", "url": "https://www.eejournal.com/industry_news/stmicroelectronics-reveals-high-accuracy-two-in-one-altitude-and-underwater-depth-sensor-for-wearables-and-sports-cameras/", "summary": "STMicroelectronics has combined altitude and underwater-depth monitoring over 50 meters in a single MEMS sensor that saves space, simplifies circuitry, and trims bill-of-materials costs in wearables and outdoor equipment. By providing two selectable full scales in one compact package, the LPS27DEWO is suitable for sports cameras, smart rings, smartwatches, and other outdoor and underwater equipment. [&#8230;]"}, {"title": "Antaira Delivers BABA Phase 2–Compliant Industrial Ethernet Switch, Unveils 100W PoE++ Model for Q1 2027", "source": "EE Journal", "date": "2026-10-14", "url": "https://www.eejournal.com/industry_news/antaira-delivers-baba-phase-2-compliant-industrial-ethernet-switch-unveils-100w-poe-model-for-q1-2027/", "summary": "Antaira Technologies today announced that its LMX-1204G-SFP-T-BABA Managed Gigabit Ethernet Switch is fully compliant with Phase 2 of the Build America, Buy America (BABA) Act, which took effect October 1, 2026. The switch is manufactured in the USA and available now. System integrators, contractors, and agencies can deploy it on federally funded infrastructure projects without [&#8230;]"}, {"title": "Microchip MTCH3380P and MTCH3240P capacitive touch controllers support up to 64 buttons with parallel sensing", "source": "CNX Software", "date": "2026-10-13", "url": "https://www.cnx-software.com/2026/10/13/microchip-mtch3380p-and-mtch3240p-capacitive-touch-controllers-support-up-to-64-buttons-with-parallel-sensing/", "summary": "<div><img alt=\"Microchip MTCH3380P and MTCH3240P turnkey touch controllers\" class=\"attachment-medium size-medium wp-post-image\" height=\"480\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/10/Microchip-MTCH3380P-and-MTCH3240P-turnkey-touch-controllers-720x480.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Microchip Technology has introduced the MTCH3380P and MTCH3240P, two new capacitive touch controllers that handle touch detection internally, making it easier to build display-free HMI devices with touch-sensitive buttons, sliders, and wheels. The main difference between the two controllers is the number of supported touch sensors. The MTCH3380P supports up to 38 self-capacitance or 64 mutual-capacitance keys, while the smaller MTCH3240P supports up to 24 self-capacitance or 32 mutual-capacitance keys. Both controllers use parallel sensing with 12 on-chip ADCs to improve touch response times and noise immunity. They also support touch detection through thick cover materials and when users are wearing gloves, making them suitable for home appliances, industrial control panels, EV chargers, and outdoor kiosks. Both also support IEC/UL 60730 Class B functional safety requirements. Microchip MTCH3380P and MTCH3240P specifications: Controller engine – Microchip patented charge-transfer acquisition engine with pipelined analog sensing and digital processing. Touch sensing Mutual capacitance [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/10/13/microchip-mtch3380p-and-mtch3240p-capacitive-touch-controllers-support-up-to-64-buttons-with-parallel-sensing/\">Microchip MTCH3380P and MTCH3240P capacitive touch controllers support up to 64 buttons with parallel sensing<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Dragonwing FWA Gen 6 Elite Platform combines 5G Advanced, NR-NTN, and tri-band Wi-Fi 8", "source": "CNX Software", "date": "2026-10-13", "url": "https://www.cnx-software.com/2026/10/13/dragonwing-fwa-gen-6-elite-platform-combines-5g-advanced-nr-ntn-and-tri-band-wi-fi-8/", "summary": "<div><img alt=\"Qualcomm DragonWing FWA Gen 6\" class=\"attachment-medium size-medium wp-post-image\" height=\"614\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/10/Qualcomm-DragonWing-FWA-Gen-6-720x614.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Unveiled at Network X 2026, the Qualcomm Dragonwing FWA Gen 6 Elite Platform combines 5G Advanced (3GPP Rel-19), NR-NTN (New Radio – Non-Terrestrial Networks) satellite communication, and tri-band Wi-Fi 8 with a 5&#215;5 radio configuration. The new Fixed Wireless Access (FWA) solution features a Qualcomm X105 Modem-RF with 5G NR over satellite support, quad-frequency GNSS (L1, L2, L5, and L6), Qualcomm Turbo DSDA for 60% higher throughput compared to Gen 5, a quad-core CPU, an integrated 10 TOPS NPU, LPDDR4x and LPDDR5/5x, and quantum security (CNSA 2.0 compliant). It offers 500 MHz of aggregated bandwidth, 6- and 8-layer MIMO, peak download and upload speeds of 14.8 Gbps and 4.2 Gbps, respectively. Dragonwing FWA Gen 6 Elite Platform (QMX105) specifications: CPU &#8211; Quad-core CPU AI accelerator &#8211; Up to 10 TOPS, 5th-generation Qualcomm 5G AI processor handling OTT traffic detection for apps (chatbots, social media)  5G gaming traffic prioritization Smooth 5G-to-Wi-Fi [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/10/13/dragonwing-fwa-gen-6-elite-platform-combines-5g-advanced-nr-ntn-and-tri-band-wi-fi-8/\">Dragonwing FWA Gen 6 Elite Platform combines 5G Advanced, NR-NTN, and tri-band Wi-Fi 8<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Designing Edge AI for Real-Time Systems", "source": "Embedded.com", "date": "2026-10-13", "url": "https://www.embedded.com/designing-edge-ai-for-real-time-systems/", "summary": "<p>Bringing AI directly into embedded systems is much more than just running a model on the device. When a decision must come within milliseconds, every element of the chain becomes decisive. The sensors, correctly sized memory, optimized models, processor, AI accelerators, operating system, and software must be designed together to achieve adequate scheduling and predictable [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/designing-edge-ai-for-real-time-systems/\">Designing Edge AI for Real-Time Systems<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "TI unveils 3-GSPS ADC for AI Data Centers at OCP", "source": "Embedded.com", "date": "2026-10-13", "url": "https://www.embedded.com/ti-unveils-3-gsps-adc-for-ai-data-centers-at-ocp/", "summary": "<p>Texas Instruments Inc. (TI) has claimed the industry's first analog-to-digital converter (ADC) to enable 24/7 event-based remote monitoring at nanosecond resolution for AI data centers. Introduced at the Open Compute Project (OCP) Global Summit, TI will demo the ADC34DSO75 ADC, along with the new LMI800PS hot-swap controller and LMK6B bulk acoustic wave (BAW)-based oscillator, addressing the [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/ti-unveils-3-gsps-adc-for-ai-data-centers-at-ocp/\">TI unveils 3-GSPS ADC for AI Data Centers at OCP<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "TI unveils new ADC to enable nanosecond-level telemetry and minimize downtime in AI data centers", "source": "EE Journal", "date": "2026-10-13", "url": "https://www.eejournal.com/industry_news/ti-unveils-new-adc-to-enable-nanosecond-level-telemetry-and-minimize-downtime-in-ai-data-centers/", "summary": "At the Open Compute Project (OCP) Global Summit, Texas Instruments (TI) (Nasdaq: TXN) debuted the first analog-to-digital converter (ADC) to enable 24/7, low-power, event-based remote monitoring at nanosecond resolution. As AI workloads rapidly increase, data center operators face significant challenges around power instability, inadequate real-time monitoring and signal degradation, all of which can lead to [&#8230;]"}, {"title": "FLIR Introduces A8481 Compact HD MWIR Science Camera", "source": "EE Journal", "date": "2026-10-13", "url": "https://www.eejournal.com/industry_news/flir-introduces-a8481-compact-hd-mwir-science-camera/", "summary": "Teledyne FLIR today announced the launch of the A8481, a new compact HD MWIR science camera designed for researchers and engineers who need significantly more thermal detail without changing the workflows, optics, software, and infrastructure they already use. Built around a 1280 × 1024 HOT MWIR SLS detector, the A8481 delivers four times the pixels [&#8230;]"}, {"title": "Navitas Collaborates with NVIDIA on 800 V-to-12 V Power Delivery Board for Next-Generation AI Infrastructure", "source": "EE Journal", "date": "2026-10-13", "url": "https://www.eejournal.com/industry_news/navitas-collaborates-with-nvidia-on-800-v-to-12-v-power-delivery-board-for-next-generation-ai-infrastructure/", "summary": "Navitas Semiconductor (Nasdaq: NVTS), a leader in next-generation power semiconductors and power delivery solutions, pioneering GaN, high-voltage and ultra-high-voltage SiC, and IVR technologies, today announced its latest 24 kW, 800 V-to-12 V DC-DC power delivery board (PDB), powered by GaNFast™ technology and developed in collaboration with NVIDIA, to support the NVIDIA MGX ecosystem and advance [&#8230;]"}, {"title": "TDK PositionSenseTM offers ‘Smart Perception’ for wearables, mobile, robots, and other Physical AI devices", "source": "EE Journal", "date": "2026-10-13", "url": "https://www.eejournal.com/industry_news/tdk-positionsensetm-offers-smart-perception-for-wearables-mobile-robots-and-other-physical-ai-devices/", "summary": "&#8211;  Now available for worldwide distribution, PositionSense is a 2-chip 9-axis sensor solution for absolute orientation detection and fast sensor calibration &#8211;  Enables the ultimate positioning accuracy for smart glasses, smartphones, AI wearables, humanoid robots, drones, and any device requiring precise location &#8211;  Integrates TDK’s ultra-low power 6-axis IMU and 3-axis TMR-based magnetometer with on-chip [&#8230;]"}, {"title": "Now ANY Bluetooth Device Can Enjoy Satellite Connectivity", "source": "EE Journal", "date": "2026-10-13", "url": "https://www.eejournal.com/article/now-any-bluetooth-device-can-enjoy-satellite-connectivity/", "summary": "<img alt=\"\" class=\"webfeedsFeaturedVisual wp-post-image\" height=\"169\" src=\"https://www.eejournal.com/wp-content/uploads/2026/10/max-0526-image-for-home-page-hubble-300x169.jpg\" style=\"display: block; margin-bottom: 5px; clear: both;\" width=\"300\" />I find it hard to wrap my brain around how something as innocuous as Bluetooth can suddenly start impinging on my consciousness (and my Bluetooth-equipped devices) from all directions, including—it now turns out—from satellites whizzing around above our heads in low Earth Orbit (LEO). Just to ensure we’re all tap-dancing to the same skirl of [&#8230;]"}, {"title": "PlugMate and PlugClaw Review – Thumb-sized Android-based private computers with optional Ubuntu/OpenClaw support", "source": "CNX Software", "date": "2026-10-12", "url": "https://www.cnx-software.com/2026/10/12/plugmate-and-plugclaw-review-thumb-sized-android-based-private-computers-with-optional-ubuntu-openclaw-support/", "summary": "<div><img alt=\"PlugMate/PlugClaw review\" class=\"attachment-medium size-medium wp-post-image\" height=\"540\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/10/u-adapter-through-phone-case-720x540.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>We received two unusual little devices for review this month: the PlugMate and the PlugClaw, both built by TrustKernel, a security company better known for the trusted-execution tech inside other people&#8217;s phones than for consumer gadgets. Each is a complete, self-contained computer the size of a USB stick (its own processor, memory, and encrypted storage) that runs a private, hardened Android system called PlugOS. You plug one into your phone, tablet, or computer, and that host lends it a screen, a keyboard, and a network connection. Nothing of yours crosses over. The easiest way to picture it: it&#8217;s a little computer (or more accurately, the hardware of a small phone) that borrows your screen, mouse, keyboard, and other peripherals to interact with you. IT folks will be tempted to compare it to a virtual machine, and the analogy isn&#8217;t bad, except that nothing here is virtual. It&#8217;s real, separate silicon; [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/10/12/plugmate-and-plugclaw-review-thumb-sized-android-based-private-computers-with-optional-ubuntu-openclaw-support/\">PlugMate and PlugClaw Review – Thumb-sized Android-based private computers with optional Ubuntu/OpenClaw support<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Facebook releases Muse Gadgets SDK for ESP32 and Raspberry Pi/Linux-based devices", "source": "CNX Software", "date": "2026-10-12", "url": "https://www.cnx-software.com/2026/10/12/facebook-releases-muse-gadgets-sdk-for-esp32-and-raspberry-pi-linux-based-devices/", "summary": "<div><img alt=\"Muse Gadgets\" class=\"attachment-medium size-medium wp-post-image\" height=\"421\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/10/Muse-Gadgets-720x421.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Meta, Facebook&#8217;s parent company, has released the open-source Muse Gadgets SDK, designed to work with ESP32 boards or Linux-based SBCs like a Raspberry Pi. This requires some explanation&#8230; I&#8217;ve been on holiday for a while, so I&#8217;m not up to date on everything, but apparently Meta released Muse on September 6, yet another personal AI agent&#8230; Earlier this month, Nat Friedman, head of product at Meta Superintelligence Labs, shared an X post about the Muse Gadgets &#8220;side project&#8221; that aims to make ESP32 and Linux devices work with Muse, basically enabling hardware AI monitors and Physical AI with Muse. The Muse Gadgets SDK has been released on GitHub under an Apache 2.0 license (for most of the code) with two main directories: ESP32 Device SDK &#8211; It can show images, supports audio input and output, and can interface with sensors, actuators, buttons, etc&#8230; Linux Device SDK &#8211; Works with Raspberry [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/10/12/facebook-releases-muse-gadgets-sdk-for-esp32-and-raspberry-pi-linux-based-devices/\">Facebook releases Muse Gadgets SDK for ESP32 and Raspberry Pi/Linux-based devices<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Marvell Introduces Six-Channel CXL 3.2 Memory Expanders", "source": "Embedded.com", "date": "2026-10-12", "url": "https://www.embedded.com/marvell-introduces-six-channel-cxl-3-2-memory-expanders/", "summary": "<p>Marvell Technology Inc. has introduced the Structera X 3406 and 3506, second-generation CXL 3.2 memory expansion controllers designed to increase memory capacity, bandwidth, and utilization in AI servers and data center infrastructure. The new devices target memory-intensive workloads, including large language model (LLM) inference and deep learning recommendation models (DLRM), where memory availability can limit [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/marvell-introduces-six-channel-cxl-3-2-memory-expanders/\">Marvell Introduces Six-Channel CXL 3.2 Memory Expanders<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "Designing AI Data Center Fabrics with PCIe 6.0 High-Radix Switches", "source": "Embedded.com", "date": "2026-10-12", "url": "https://www.embedded.com/designing-ai-data-center-fabrics-with-pcie-6-0-high-radix-switches/", "summary": "<p>Artificial intelligence is reshaping data center architecture by changing where system bottlenecks occur. For years, networking discussions focused primarily on scale-out communication between servers and racks using Ethernet and InfiniBand. Traditional enterprise and cloud applications generated predictable north-south traffic patterns that scaled effectively as long as the external network infrastructure improved. AI workloads have fundamentally [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/designing-ai-data-center-fabrics-with-pcie-6-0-high-radix-switches/\">Designing AI Data Center Fabrics with PCIe 6.0 High-Radix Switches<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "Wireless-Tag WT32P4C5-43S – A fully integrated 4.3-inch ESP32-P4 and ESP32-C5 touch display devkit", "source": "CNX Software", "date": "2026-10-11", "url": "https://www.cnx-software.com/2026/10/11/wireless-tag-wt32p4c5-43s-a-fully-integrated-4-3-inch-esp32-p4-and-esp32-c5-touch-display-devkit/", "summary": "<div><img alt=\"4.3 inch dual chip ESP32 P4 and ESP32 C5 Wi Fi6 integrated touch display\" class=\"attachment-medium size-medium wp-post-image\" height=\"480\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/10/4.3-inch-dual-chip-ESP32-P4-and-ESP32-C5-Wi-Fi6-integrated-touch-display-720x480.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Wireless-Tag WT32P4C5-43S (ZX4D30CE405-V1.3)  is a fully integrated 4.3-inch touch display development board that combines an ESP32-P4 MCU with an ESP32-C5 wireless module supporting dual-band WiFi 6 (2.4/5 GHz), Bluetooth LE, and 802.15.4 connectivity. Unlike previous ESP32-P4 + ESP32-C5 solutions, this one comes with a built-in touchscreen, so you don&#8217;t need to connect a separate display. Designed for industrial automation, smart control panels, and edge AI vision terminals, the board also integrates a 15-pin MIPI CSI camera interface, a microSD card slot, two USB Type-C ports (USB 2.0 High-Speed and Debug/JTAG), and a 14-pin GPIO expansion header. Wireless-Tag WT32P4C5-43S (ZX4D30CE405-V1.3) specifications: Core module – Wireless Tag WT0132P4-A1-N16R32 SoC – Espressif Systems ESP32-P4 CPU Dual-core 32-bit RISC-V HP (High-performance) CPU @ up to 400 MHz with AI instructions extension and single-precision FPU Single-RISC-V LP (Low-power) MCU core @ up to 40 MHz with 8KB of zero-wait TCM RAM Memory 768 KB HP [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/10/11/wireless-tag-wt32p4c5-43s-a-fully-integrated-4-3-inch-esp32-p4-and-esp32-c5-touch-display-devkit/\">Wireless-Tag WT32P4C5-43S &#8211; A fully integrated 4.3-inch ESP32-P4 and ESP32-C5 touch display devkit<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "M5Stack ToughC5 weatherproof ESP32-C5 IoT controller offers dual-band Wi-Fi 6, BLE 5, and Zigbee/Thread", "source": "CNX Software", "date": "2026-10-10", "url": "https://www.cnx-software.com/2026/10/10/m5stack-toughc5-weatherproof-esp32-c5-iot-controller-offers-dual-band-wi-fi-6-ble-5-and-zigbee-thread/", "summary": "<div><img alt=\"M5Stack ToughC5 IoT Dev Kit with ESP32 C5\" class=\"attachment-medium size-medium wp-post-image\" height=\"480\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/10/M5Stack-ToughC5-IoT-Dev-Kit-with-ESP32-C5-720x480.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>M5Stack has just introduced the ToughC5, a rugged, weatherproof outdoor IoT controller built around the ESP32-C5. The device features a bright 2.0-inch capacitive touch IPS display and RS485 connectivity. The ToughC5 is an upgrade to the ESP32-base3d M5Stack TOUGH introduced in 2021, with the upgraded model featuring a more modern ESP32-C5 MCU with dual-band (2.4/5 GHz) Wi-Fi 6, Bluetooth 5 LE, and an IEEE 802.15.4 radio for Zigbee and Thread. Other changes include faster Octal PSRAM, an upgraded RTC chip with a dedicated coin cell backup battery, a passive buzzer replacing the previous 1W speaker, and a custom power management system (M5PM1 + M5IOE1) replacing the AXP192 PMU. These features make it suitable for industrial field control, outdoor edge data collection, and smart building applications. M5Stack ToughC5 specifications: Wireless SoC – Espressif Systems ESP32-C5HR8 CPU Single-core 32-bit RISC-V processor @ up to 240 MHz Low-power RISC-V core @ 40 MHz [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/10/10/m5stack-toughc5-weatherproof-esp32-c5-iot-controller-offers-dual-band-wi-fi-6-ble-5-and-zigbee-thread/\">M5Stack ToughC5 weatherproof ESP32-C5 IoT controller offers dual-band Wi-Fi 6, BLE 5, and Zigbee/Thread<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Open-source ESP32-C3 DNS ad blocker supports up to over 500,000 domains without PSRAM", "source": "CNX Software", "date": "2026-10-09", "url": "https://www.cnx-software.com/2026/10/09/open-source-esp32-c3-dns-ad-blocker-supports-up-to-over-500000-domains-without-psram/", "summary": "<div><img alt=\"ESP32 C3 SuperMini DNS ad blocker in a 3D printed enclosure with a USB A adapter for direct connection to a router\" class=\"attachment-medium size-medium wp-post-image\" height=\"480\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/10/ESP32-C3-SuperMini-DNS-ad-blocker-in-a-3D-printed-enclosure-with-a-USB-A-adapter-for-direct-connection-to-a-router-720x480.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Developed by Zed (M-Abozaid), the esp32-c3-adblock is an open-source, Pi-hole-style DNS ad blocker that runs on a $2 ESP32-C3 microcontroller board/module without requiring PSRAM. It blocks ads and tracking domains across devices on a home or small office network by filtering DNS requests. Instead of storing domain strings in RAM, the project stores them as sorted 40-bit FNV-1a hashes in flash memory and uses binary search to check DNS requests. When a UDP DNS query comes in, the C++ firmware extracts the domain, hashes it (including parent suffixes), and performs a binary search against the flash hash table. If the domain is on the blocklist, the ESP32-C3 returns 0.0.0.0 to block the request. Otherwise, it forwards the query to an upstream DNS server and returns the response to the client. This method fits over 140,000 domains into ~0.7 MB of flash memory while using only ~50 KB of RAM. A [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/10/09/open-source-esp32-c3-dns-ad-blocker-supports-up-to-over-500000-domains-without-psram/\">Open-source ESP32-C3 DNS ad blocker supports up to over 500,000 domains without PSRAM<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Chiplets at the Edge, Physical Edge Computing, Engineering Cyber-Resilient SDVs: Embedded Week Insights", "source": "Embedded.com", "date": "2026-10-09", "url": "https://www.embedded.com/chiplets-at-the-edge-physical-edge-computing-engineering-cyber-resilient-sdvs-embedded-week-insights/", "summary": "<p>Here's a roundup of this week's must-read articles. We'll look into the latest developments on chiplets at the edge, engineering cyber-resilient software-defined vehicles, physical edge computing, the benefits of local PCB prototyping, and more. Also, check News Archives - Embedded and Technical Articles Archives - Embedded for the complete list of news and articles from our website. NEWS Silicon [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/chiplets-at-the-edge-physical-edge-computing-engineering-cyber-resilient-sdvs-embedded-week-insights/\">Chiplets at the Edge, Physical Edge Computing, Engineering Cyber-Resilient SDVs: Embedded Week Insights<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "Microchip Adds Parallel Sensing to Touch Controllers", "source": "Embedded.com", "date": "2026-10-09", "url": "https://www.embedded.com/microchip-adds-parallel-sensing-to-touch-controllers/", "summary": "<p>Microchip Technology Inc. has launched its first turnkey touch controllers with parallel sensing for buttons, sliders, and wheels in appliances and outdoor and industrial applications. The two new additions to the capacitive-touch family offer enhanced touch sensitivity and noise immunity, enabling touch detection through thick cover materials and gloves. The MTCH3380P and MTCH3240P controllers target [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/microchip-adds-parallel-sensing-to-touch-controllers/\">Microchip Adds Parallel Sensing to Touch Controllers<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "Sipeed SLogic32U3 – A high-speed 10 Gbps USB 3.2 logic analyzer (Crowdfunding)", "source": "CNX Software", "date": "2026-10-08", "url": "https://www.cnx-software.com/2026/10/09/sipeed-slogic32u3-high-speed-10-gbps-usb-3-2-logic-analyzer/", "summary": "<div><img alt=\"Sipeed SLogic32U3\" class=\"attachment-medium size-medium wp-post-image\" height=\"470\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/10/Sipeed-SLogic32U3-720x470.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Sipeed has just launched what they claim is the world&#8217;s first 10 Gbps USB 3.2 logic analyzer. The SLogic32U3 is the successor to the SLogic16U3 3.2 Gbps logic analyzer launched in 2025. The SLogic32U3 USB-C logic analyzer supports up to 32 channels via four mini HDMI connectors, 350 MHz signal bandwidth, up to 1400 MS/s per channel with four channels, or 200 MS/s per channel with 32 channels, and is offered with an optional ADC module. SLogic32U3 specifications: FPGA – Not mentioned (potentially from GOWIN) Input channels – 32 digital channels via 4x mini HDMI ports, each with 8 channels Sample rates 1400MS/s @ 4 channels 800MS/s @ 8 channels 400MS/s @ 16 channels 200MS/s @ 32 channels Digital signal bandwidth – 350 MHz Stream FIFO buffer &#8211; 2 Gbit DDR3 Capture mode &#8211; Stream (real-time readback); depth limited by PC memory/disk Signal input voltage – 0–10 V Adjustable threshold [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/10/09/sipeed-slogic32u3-high-speed-10-gbps-usb-3-2-logic-analyzer/\">Sipeed SLogic32U3 &#8211; A high-speed 10 Gbps USB 3.2 logic analyzer (Crowdfunding)<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Q8botOne – A palm-sized open-source quadruped robot with ESP32-C3, DYNAMIXEL smart actuators (Crowdfunding)", "source": "CNX Software", "date": "2026-10-08", "url": "https://www.cnx-software.com/2026/10/08/q8botone-a-palm-sized-open-source-quadruped-robot-with-esp32-c3-dynamixel-smart-actuators/", "summary": "<div><img alt=\"Q8botOne A Serious Quadruped That Fits in Your Hand\" class=\"attachment-medium size-medium wp-post-image\" height=\"480\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/10/Q8botOne-A-Serious-Quadruped-That-Fits-in-Your-Hand-720x480.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>ZeroWire Robotics Q8botOne is an open-source, palm-sized quadruped robot built around an ESP32-C3 MCU and ROBOTIS DYNAMIXEL smart actuators. Designed with a unique wire-free architecture, the robot integrates all components onto a central printed circuit board also used as the structural chassis. The robot is roughly the size of a smartphone and can jog, jump, and carry up to twice its 250-gram weight. The main PCB uses a dedicated 6V/16A step-down converter for motor power and includes a battery management system for two 14500 Li-ion cells. For control, the kit includes a separate ESP32-C3 controller PCB with an Adafruit Mini I2C Gamepad. Q8botOne specifications: Wireless module – Espressif Systems ESP32-C3-MINI-1-N4 module with: ESP32-C3 (ESP32-C3FN4) SoC CPU &#8211; 32-bit RISC-V single-core processor up to 160 MHz Memory &#8211; 400 KB SRAM (16 KB for cache), 8 KB SRAM in RTC Storage &#8211; 4 MB embedded flash, 384 KB ROM Connectivity – [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/10/08/q8botone-a-palm-sized-open-source-quadruped-robot-with-esp32-c3-dynamixel-smart-actuators/\">Q8botOne &#8211; A palm-sized open-source quadruped robot with ESP32-C3, DYNAMIXEL smart actuators (Crowdfunding)<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Efinix Sapphire RV64 SoC – Configurable RISC-V soft-cores with DDR3, LPDDR4x, and HyperRAM for Efinix FPGAs", "source": "CNX Software", "date": "2026-10-08", "url": "https://www.cnx-software.com/2026/10/08/efinix-sapphire-rv64-soc-configurable-risc-v-soft-cores-with-ddr3-lpddr4x-and-hyperram-for-efinix-fpgas/", "summary": "<div><img alt=\"Sapphire RV64 SoC block diagram. The VexiiRiscv cores, caches, and peripherals are built in the FPGA\" class=\"attachment-medium size-medium wp-post-image\" height=\"480\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/10/Sapphire-RV64-SoC-block-diagram.-The-VexiiRiscv-cores-caches-and-peripherals-are-built-in-the-FPGA-720x480.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Efinix has introduced the Sapphire RV64 SoC, a configurable 64-bit RISC-V soft-core processor designed for its Titanium and Trion FPGAs. It is based on the VexiiRiscv core and can be configured with one to four RISC-V cores running at up to 400 MHz. The Sapphire RV64 has a seven-stage pipeline, configurable L1 caches, optional 64–512 KB L2 cache, and 4–512 KB of on-chip RAM. It supports DDR3, LPDDR4x, and HyperRAM with up to 512-bit AXI interfaces and external memory from 4 MB to 8 GB. Other features include an optional FPU, branch predictor, prefetchers, SV39 MMU, up to 32 GPIOs, five I²C, three SPI, three UARTs, timers, watchdog, and up to eight user interrupts. Efinix Sapphire RV64 SoC specifications: CPU 1 to 4x VexiiRiscv 64-bit cores with a 7-stage pipeline (fetch, align-decompress, decode, issue, execute, memory, and writeback) Configurable system clock frequency from 20 MHz to 400 MHz Supports RV64IMACFD_Zba_Zbc_Zbs extensions [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/10/08/efinix-sapphire-rv64-soc-configurable-risc-v-soft-cores-with-ddr3-lpddr4x-and-hyperram-for-efinix-fpgas/\">Efinix Sapphire RV64 SoC &#8211; Configurable RISC-V soft-cores with DDR3, LPDDR4x, and HyperRAM for Efinix FPGAs<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Qorvo Introduces X-Band RFFE Targeting AESA Radar Designs", "source": "Embedded.com", "date": "2026-10-08", "url": "https://www.embedded.com/qorvo-introduces-x-band-rffe-targeting-aesa-radar-designs/", "summary": "<p>Qorvo Inc. has introduced an X-band RF front-end solution designed for active electronically scanned array (AESA) radar systems. The architecture combines transmit drive, receive performance, and RF front-end control within the constrained space of an array lattice, reducing the number of external components required around each antenna element. At the center of the solution is [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/qorvo-introduces-x-band-rffe-targeting-aesa-radar-designs/\">Qorvo Introduces X-Band RFFE Targeting AESA Radar Designs<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "Chiplets at the Edge: How Modular SoCs Redefine Performance Per Watt", "source": "Embedded.com", "date": "2026-10-08", "url": "https://www.embedded.com/chiplets-at-the-edge-how-modular-socs-redefine-performance-per-watt/", "summary": "<p>The evolution of edge systems is shifting the focus from computing power alone to how efficiently each watt is transformed into useful performance. Chiplets and modular system-on-chips (SoCs) enable the combination of CPUs, accelerators, memory, and I/O based on specific needs, creating new possibilities for designing more compact, flexible, and efficient platforms. From silicon scalability [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/chiplets-at-the-edge-how-modular-socs-redefine-performance-per-watt/\">Chiplets at the Edge: How Modular SoCs Redefine Performance Per Watt<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}], "papers": [{"title": "ChunkAct: Action Chunking for Agentic Robotics", "authors": ["Bingxin Xu", "Wenrui Bao", "Xinxin Liu", "Jiawei Zhou", "Yuzhang Shang", "Emilio Ferrara"], "published": "2026-10-13", "summary": "Agentic robotics places a large language model (LLM) agent in the robot control loop, where it composes perception, motion, and vision-language-action (VLA) tools under the guidance of a memory and thereby generalizes to new tasks without retraining. This generality comes at a steep price in efficiency. Every primitive requires a round of LLM reasoning over the full interaction history, so the cost of an episode grows with the number of primitives. We find this reasoning largely redundant: once a sub-goal is chosen, its primitives follow a routine already prescribed by memory. We present ChunkAct, which introduces action chunking to agentic robotics. Online, a single call launches a chunk of chained primitives, which executes autonomously and returns control only upon failure. Offline, ChunkAct compiles the memory into these chunks, so execution is memory-free at test time and the planner is reserved for decisions that require reasoning. LLM computation therefore scales with the number of decisions rather than the number of primitives. On LIBERO-Pro, ChunkAct improves task success by 5.0 points over the state of the art in agentic robotics while requiring 2.9x fewer LLM calls, 4.4x fewer input tokens, and 2.3x fewer output tokens.", "pdf_url": "https://arxiv.org/pdf/2610.18874v1"}, {"title": "LoopWAM: Closed-Loop Generalist Policy Improvement from Deployment Rollouts", "authors": ["Wenxuan Guo", "Yingping Liang", "Zhaoguo Wang", "Ziyuan Li", "Angyuan Ma", "Zhenyu Wu", "Chengkun Wang", "Bingyao Yu", "Ze Chen", "Borui Zhang", "Xiuwei Xu", "Meng Zhang", "Erjin Zhou", "Jiwen Lu"], "published": "2026-10-13", "summary": "Scaling expert demonstrations alone does not enable generalist robot policies to improve from deployment. Real-world rollouts contain successes, suboptimal behavior, and failures: imitating every recorded action can reinforce poor behavior, while filtering out failures discards evidence of physical interactions and their consequences. We introduce \\textbf{LoopWAM}, a closed-loop world-action model that learns directly from this full quality spectrum, using rollouts from both itself and other deployed policies. Source-dependent noise sampling unifies behavior learning and action-conditioned world modeling, while quality steering and quality-weighted supervision retain full video supervision across qualities and regulate action imitation. Video and action tokens interact throughout parallel denoising, allowing learned consequences to inform action generation directly. On RoboChallenge Table30-V2, three deployment-and-training rounds raise success from 23.67\\% to 43.33\\%, a 19.7-percentage-point gain, with a final score of 56.80. LoopWAM also achieves 94.5\\% average success on RoboTwin~2.0 and 49.5\\% overall success on RoboCasa365 without additional embodied pretraining, obtaining the best overall results among the compared methods across all three benchmarks. On challenging shirt folding task, two rounds of deployment-driven improvement after single-task post-training raise success from 13.20\\% to 55.56\\%. These results demonstrate closed-loop improvement from mixed-quality experience under both multi-task learning and single-task post-training. \\href{https://loop-wam.github.io/}{\\textcolor{orange}{Project Page}}", "pdf_url": "https://arxiv.org/pdf/2610.18873v1"}, {"title": "EgoExplorer: A Vision-Motion-Touch Observatory for Human Loco-Manipulation In Situ", "authors": ["Yunsong Zhou", "Xuekun Jiang", "Haiqi Shen", "Hangxu Liu", "Chaojian Shi", "Yujie Liu", "Jingyuan Li", "Haoran Yang", "Jiafei Cao", "Dongzhan Zhou", "Dong Wang", "Yao Mu", "Chunhua Shen", "Weinan Zhang"], "published": "2026-10-13", "summary": "Learning humanoid loco-manipulation from human demonstrations rests on observing how locomotion, posture, and object interaction evolve together as tasks unfold. Scaling collection across diverse environments, in turn, favors lightweight, portable capture systems. Yet, existing datasets provide only partial views of this coordination. Thus, we introduce EgoExplorer, a 100-hour vision-motion-touch observatory of human loco-manipulation built with a wearable system. With an emphasis on professional activities, its continuous recordings align egocentric video with reconstructed whole-body motion, fine-grained finger articulation, and tactile observations, accompanied by step-level descriptions. To achieve this coverage with sparse body sensing, we develop the Calibrate-Complete-Constrain pipeline. Concretely, reusable calibration fixes participant geometry and sensor attachments before motion inference to disentangle mounting offsets from articulation. A temporal prior then completes unobserved joint motion, while layered constraints promote measurement agreement, temporal continuity, and geometric consistency, properties that motion plausibility alone does not guarantee. Against tracker-fitted references, the method reduces body-point error by 71.9% relative to the strongest baseline; matched evaluations also show gains in hand stability and contact estimation. Preliminary studies explore multimodal generation and conditioning alongside humanoid retargeting with whole-body control in simulation.", "pdf_url": "https://arxiv.org/pdf/2610.18872v1"}, {"title": "Cepheid: Decoupling Scale from Structure for Cross-Family Motion Completion", "authors": ["Chih-Hai Su", "Tsung-Wei Ke", "Yu-Lun Liu"], "published": "2026-10-13", "summary": "Sparse-to-dense motion completion recovers dense mesh motion from sparse vertex displacements. Residual priors trained on one geometry family frequently fail to beat parameter-free harmonic extension off-family. Moreover, cross-family training meets a scaling barrier: residual amplitude varies by more than an order of magnitude across geometry families and collapses as observations become denser. Since this scale depends on unknown target motion, it cannot be measured directly at test time. We decouple residual structure from physical scale by learning a dimensionless prior, estimating amplitude from observables and a lightweight correction fitted only on training sources. Our unified model surpasses harmonic extension across all evaluated families, including unseen cloth and legged bodies, without skeletons, registration, or cross-mesh correspondence. The same prior applies without retraining to point-tracked animal video and a robot grasping a soft body. Project page: https://su-terry.github.io/cepheid-website/", "pdf_url": "https://arxiv.org/pdf/2610.18871v1"}, {"title": "What Matters in Quality-Aware VLA Pretraining: A Benchmark and Empirical Study", "authors": ["Mingxuan Yan", "Litian Gong", "Dihong Huang", "Zhixu Li", "Tianyu Zhang", "Wenqian Zhang", "Hefeifei Jiang", "Peihao Li", "Jian Zhang", "Mengfei Zhao", "Yikai Tang", "Hai Zhai", "Zehao Wang", "Ruijian Liang", "Yanjia Huang", "Lin Shao", "Changliu Liu", "Kaiyu Hang", "Zhiwen Fan", "Masayoshi Tomizuka", "Jianfei Yang", "Jiachen Li"], "published": "2026-10-13", "summary": "How should demonstration quality be used during vision-language-action (VLA) pretraining to improve performance after target-task fine-tuning? We compare weighting, filtering, and conditioning across reward definitions and label granularities using 5,000 naturally suboptimal human demonstrations and 24 target tasks. Within each VLA, we match demonstrations and training budgets. Additional comparisons examine pretraining data size and the roles of quality tags during fine-tuning and inference. Across three VLAs, we find that approach-aware episode conditioning improves mean success over plain behavioral cloning; conditioning and filtering favor episode and chunk labels, respectively, on average, with model-dependent reversals; and constant-tag fine-tuning improves mean success after conditioned pretraining with either tagged or untagged inference. We introduce AXIS-Bench to support these controlled comparisons. Built on crowdsourced simulation demonstrations, it provides recorded object and contact states for recomputing quality labels on shared trajectories. Replayable trajectories support workspace-aligned rendering and user-defined real-world target tasks. In our real-world experiment, simulation pretraining raises success from 9.6\\% to 31.7\\%. Project page: https://axis-bench.github.io/.", "pdf_url": "https://arxiv.org/pdf/2610.18869v1"}, {"title": "EmbodiedEvo: Self-improving Coding Agents for Physical Intelligence", "authors": ["Wenyi Li", "Yizhe Chi", "Youjie Zheng", "Chunyu Liu", "Xiaoqiu Wang", "Mingju Gao", "Zheng Jiang", "Deyao Hong", "Calvin Xiao", "Kaisen Yang", "Qinhuai Na"], "published": "2026-10-13", "summary": "Bringing general-purpose agents into the physical world calls for an executable representation of physical intelligence. Compared with vision-language-action (VLA) models, which map observations and language instructions directly to actions, code makes control logic explicit and reusable. Code can serve not only as a policy representation but also as the workspace in which the agent solves a task. Rather than following a prescribed workflow of planning, execution, and verification, the agent can autonomously inspect the state, revise and execute code, and use feedback to choose the next step. The success of this SWE-style loop in digital environments motivates its extension to physical tasks. Yet physical execution remains prone to recurring failures. To retain and refine experience for later scenes, we introduce EmbodiedEvo, where a coding agent evolves reusable Skills and Lessons through feedback on a single Playground scene, then freezes the resulting harness for diverse new scenes. On RoboDojo-Sim, EmbodiedEvo achieves an average score of 44.48 and a success rate of 37.82\\%, surpassing all officially verified results. Paired tests show the largest gains on memory-dependent tasks and successful reuse of coordinated procedures, while fine contact control remains difficult. Experience from stronger models also improves weaker executors: Astra's experience raises Sol and Luna's success rates by 8.86 and 5.50 percentage points over no experience. Compared with raw interaction history, Skills and Lessons achieve comparable task performance at 53.0\\% lower execution cost.", "pdf_url": "https://arxiv.org/pdf/2610.18867v1"}, {"title": "AutoAgent0: An Agentic Runtime for Safe Closed-Loop Driving", "authors": ["Jiageng Liu", "Seth Z. Zhao", "Zewei Zhou", "Alejandro Huerta", "Aidan Bayer-Calvert", "Yuxin Bao", "Haotian Lin", "Robert Spataru", "Zijun Cui", "Yining Hong", "Bolei Zhou", "Jiaqi Ma"], "published": "2026-10-13", "summary": "Safe autonomous driving requires more than accurate planning at a single frame: it demands reliable closed-loop execution in dynamic environments. Although end-to-end driving policies have advanced rapidly, the accumulated closed-loop errors, especially in unseen scenarios, can push vehicles into states from which the same policy struggles to recover. We address the challenge by treating closed-loop driving safety as a test-time execution problem. We introduce AutoAgent0, an agentic runtime and harness framework that augments existing driving experts with complementary detection skills, rule-based action verification, and feedback-driven recovery. To address inaccurate scene perception, an independent detection module constructs scene context using complementary perception skills, and a rule-based verifier checks proposed trajectories against this context before execution. When the nominal trajectories are unreliable, the orchestrator of the runtime activates Recovery Planning, where an agentic loop constructs alternative action proposals from action primitives and iteratively refines them using verification feedback. This design combines independent scene assessment with feasibility checks and online recovery, addressing both perception errors and the limited recovery capabilities of individual experts. Evaluations on Fail2Drive and NavSafe-$\\infty$ demonstrate improved closed-loop robustness over single-expert execution in long-tail and safety-critical scenarios. These results demonstrate that runtime supervision can improve closed-loop robustness across multiple driving experts without retraining the underlying policies.", "pdf_url": "https://arxiv.org/pdf/2610.18866v1"}, {"title": "Interaction Latents as Actions for Contact-Rich Manipulation", "authors": ["Yuhang Zheng", "Yujie Zang", "Yuchen Liu", "Yupeng Zheng", "Zhennan Jiang", "Zebin Xing", "Shuai Tian", "Songen Gu", "Jingxiang Guo", "Chen Gao", "Zhongpu Xia", "Shuicheng Yan"], "published": "2026-10-13", "summary": "Contact-rich manipulation requires robots to coordinate not only where to move, but also how contact and force should evolve throughout an interaction. Yet most robot policies represent actions primarily as motion trajectories, using tactile signals as inputs or auxiliary prediction targets without explicitly encoding contact dynamics in the action representation. We propose ILA (Interaction Latents as Actions), which uses decodable interaction latents that jointly capture the evolution of motion, contact, and force application as policy action units, providing a shared representation for action generation, evaluation, and offline improvement. We learn these latents through visually conditioned joint action-tactile reconstruction with a time-conditioned implicit decoder. Using them as flow-matching generation targets supports post-training of pretrained vision-language-action models (VLAs) and world action models (WAMs), as well as training flow-matching policies from scratch. A shared decoder maps generated latents to executable actions. For offline improvement, we learn a tactile-conditioned expert reference model from interaction latents encoded from expert demonstrations. The resulting expert-consistency rewards guide weighted learning from successful rollouts, while observation-compatible expert references guide correction of low-reward predictions from failed rollouts. Across three policy families, ILA improves success rates averaged over four real-world tasks by 21.0-36.5 percentage points relative to tactile-conditioned direct-action baselines. Ablations highlight the benefit of encoding contact evolution in action targets beyond tactile conditioning, while the same latent space supports expert-guided offline improvement. Project website: https://mrsecant.github.io/ILA/.", "pdf_url": "https://arxiv.org/pdf/2610.18855v1"}, {"title": "ForceWAM: Decoupling Future and Response Learning from Demo and Play Data for Contact-Rich Manipulation", "authors": ["Zijun Xu", "Wendi Chen", "Xinkai Wang", "Jiachen Zou", "Hongjin Chen", "Hairuo Liu", "Bokai Lin", "Shihao Ma", "Ke Ma", "Zhiwei Zhang", "Zhuohao Yan", "Ke Wu", "Haoming Song", "Xueqi Li", "Chuan Wen", "Jieru Zhao", "Wenchao Ding", "Cewu Lu", "Lixin Yang"], "published": "2026-10-13", "summary": "Expert demonstrations show how to complete contact-rich tasks, but provide limited coverage of how interaction forces respond to different actions. Task-agnostic play provides broader experience of contact dynamics without specifying task goals. To fully leverage these two types of data, we introduce ForceWAM, a force world action model that decouples knowledge of task-compatible interaction outcomes from knowledge of how local actions change contact. A world model learns from successful demonstrations to jointly predict future video and six-axis force/torque trajectories. Together, these futures describe the expected evolution of motion and contact during the task. A separate inverse dynamics model (IDM) learns from both task and play, mapping current observations and recorded visual-wrench futures to their associated robot actions. Play data thus provide knowledge of force responses for goal-directed execution. At deployment, the IDM reactively translates generated futures into actions, reusing them with fresh wrench feedback between world-model updates. Across real-robot force-regulated sliding, box flipping with and without disturbances, and ring placement, ForceWAM achieves $85$-$95\\%$ mean success, surpassing world-modeling and reactive baselines. Our experiments further show that adding task-agnostic play data improves success by $15$-$45$ percentage points, demonstrating its value for learning contact-rich execution. Project page and code are available at https://force-wam.github.io/.", "pdf_url": "https://arxiv.org/pdf/2610.18852v1"}, {"title": "Collaborative Planning for UAV-UGV Teams under Operational Constraints via Masked Error-bounded Neuro-Symbolic Diffusion", "authors": ["Zihao Deng", "Qianhuang Li", "Maggie Wigness", "John Rogers", "Donghyun Kim", "Hao Zhang"], "published": "2026-10-13", "summary": "Collaborative planning under operational constraints is essential for heterogeneous robot teams in large-scale missions. Unmanned Aerial Vehicles (UAVs) provide rapid area coverage but are limited by onboard energy, while Unmanned Ground Vehicles (UGVs) can serve as mobile recharging stations yet are constrained by road-network traversability. Effective collaboration must enforce operational constraints during execution while enabling parallel, coordinated actions. Masked Diffusion Models (MDMs) have shown promise through token unmasking but have two key limitations: entropy-guided scheduling assumes distributional alignment and reliance on differentiable constraints for diffusion-time optimization. We propose Masked Error-bounded Neuro-Symbolic Diffusion (MEND), which formulates collaborative planning as a conditional masked generative process to generate context-aware action sequences for UAV-UGV teams. MEND introduces a neuro-symbolic diffusion paradigm that constrains conditional masked diffusion policies at execution by reweighting the learned action distribution with a logic-induced admissibility indicator, thereby enforcing compliance with operational constraints. MEND introduces an error-bounded inference scheduling at execution that constructs the unmasking schedule by selecting positions with minimal predictive entropy over the constraint-aware action distribution, enhancing collaborative planning optimality under operational constraints. Extensive experimental results in simulation, on real-world maps, and with physical robot teams demonstrate that MEND advances UAV-UGV collaborative planning under operational constraints.", "pdf_url": "https://arxiv.org/pdf/2610.18850v1"}, {"title": "Contact Trajectory Prompting: In-Context Transfer of Contact-Rich Behaviors from a Single Demonstration", "authors": ["Xian Nie", "Yujie Zang", "Yuhang Zheng", "Yupeng Zheng", "Songen Gu", "Wendi Chen", "Chuan Wen", "Cewu Lu", "Wenchao Ding", "Junchi Yan", "Shuicheng Yan"], "published": "2026-10-13", "summary": "In-context robot learning enables robots to acquire new behaviors from demonstrations without test-time parameter updates. However, visual and kinematic specifications alone may not distinguish contact-rich behaviors that share similar motions but require different interaction intensities or patterns. We propose Contact Trajectory Prompting (CTP), a framework for one-shot transfer of contact-rich manipulation behaviors. CTP encodes motion and contact information from a single demonstration into an ordered contact trajectory prompt that captures their temporal evolution and specifies the desired physical interaction behavior. During execution, the policy uses online sensory feedback to retrieve interaction-relevant information from the prompt, conditioning closed-loop action generation on the demonstrated contact behavior. Across real-world wiping, rotation, and insertion tasks on objects excluded from training, CTP achieves 78.7% overall success, outperforming the strongest evaluated baseline by 13.0 percentage points. Changing only the reference demonstration enables CTP to follow contact specifications for both intensity and direction, including an intermediate wiping force level and clockwise or counterclockwise cap rotation. These results demonstrate that contact trajectories serve as effective behavioral specifications, extending in-context robot learning beyond motion imitation to physical interaction transfer. Project website: https://ctp-robotics.github.io/project_page.", "pdf_url": "https://arxiv.org/pdf/2610.18848v1"}, {"title": "LIBERO-RIG: A Hardware-Setup Robustness Benchmark for Vision-Language-Action Models", "authors": ["Andrea Yaoyun Cui", "Hanyu Wang", "Xinyi Wang", "Bangzheng Li", "Lin Zhang", "Zhenggang Tang", "Shyamal Buch", "Dejia Xu", "Matthew Tancik"], "published": "2026-10-13", "summary": "Robot policies are expected to generalize across deployment environments, including variations in the robot itself: cameras are bumped and remounted, calibrations drift, controllers run at different rates, and end-effector pads wear down. We present LIBERO-RIG, a benchmark that perturbs only the robot's hardware and setup while holding every LIBERO task fixed. The benchmark spans eleven perturbation axes, including camera mounting and optics, camera-to-arm calibration, actuation gain, control rate, proprioceptive noise, base pose, table height, and gripper pads. Each axis has five severity levels, yielding 210 conditions across the four LIBERO suites. We evaluate nine recent vision-language-action models using 500 episodes per condition and substantiate each finding with rigorous statistical tests. Pooled success falls from 0.932 to 0.767 at the middle severity and 0.509 at the highest severity. Performance degradation varies substantially across perturbation axes and action interfaces, and training on visual perturbations does not mitigate faults that leave camera images unchanged. We release the benchmark together with manifests specifying the fixed perturbation parameters for each episode.", "pdf_url": "https://arxiv.org/pdf/2610.18843v1"}, {"title": "Who Improves the Robot? Toward Physical Recursive Self-Improvement", "authors": ["Hai Zhou", "Fan Yang", "Zeyi Chen", "Lejun Zhang", "Chenyang Fu", "Jianping Li", "Jiayi Zhu", "Xianyang Liu", "Yingxuan Yang", "Lili Meng", "Lu Wang", "Xinyang Han", "Jiankai Sun", "Weirui Ye", "Guanchu Wang", "Wanhua Li", "Ming Zhou", "Boyi Li", "Ming Jin", "Kun Shao", "Muhao Chen", "Guang Chen", "Lei Ma", "Joey Tianyi Zhou", "Costas Spanos", "Xia Hu", "Mac Schwager", "Weinan Zhang", "Qian Feng", "Shangding Gu"], "published": "2026-10-13", "summary": "Robots are increasingly autonomous in task execution, yet their improvement remains largely human-driven. This study investigates Physical Recursive Self-Improvement (Physical RSI), in which physical experience guides lasting updates to both a robot's capabilities and its improvement procedure, making subsequent improvement more effective across tasks. Physical RSI faces challenges from noisy observations, continuous dynamics, costly trials, and irreversible consequences. We present an L0-L5 framework that differentiates capability-level from meta-level updates and within-task from across-task gains, reserving L5 for independently verified recursive gain. We study existing methods around harness adaptation and model training, alongside safety and control mechanisms that govern execution and successive updates. Our analysis reveals that, despite substantial progress in self-improvement, the surveyed literature does not yet demonstrate Physical RSI as defined by our framework. We identify research priorities in reliable feedback, causal attribution, safety preservation, and benchmarking, outlining a path toward robots that autonomously improve how they learn while ensuring safety. The GitHub repository for Physical RSI is available at https://github.com/SAIL-Research-Lab/Physical-RSI.", "pdf_url": "https://arxiv.org/pdf/2610.18842v1"}, {"title": "Plan-Bench: Can Existing VLMs Go Well Beyond Perception to Reason and Plan in Embodied Worlds?", "authors": ["Juntong Feng", "Qingan Liu", "Jingru Dong", "Yue Zhu", "Weiming Zheng", "Yujie Cheng", "Xinzhe Han", "Shuai Hao", "Yunzhi Zhuge", "Haiwen Diao", "Huchuan Lu"], "published": "2026-10-13", "summary": "Vision-Language Models (VLMs) have achieved strong performance in visual perception and spatial reasoning, leading to growing interest in using them as high-level planners for embodied AI. However, physical tasks require models to integrate spatial information, reason over temporal states, and generate multi-step plans under various constraints, raising the question of whether current VLMs can reliably support such reasoning and planning independently of execution. We introduce Plan-Bench, a benchmark for evaluating the high-level reasoning and multi-step planning capabilities of VLMs relevant to embodied worlds, while isolating the influence of action execution. It covers three complementary dimensions, spanning 16 subclasses and 699 curated samples. Extensive evaluation of 28 VLMs reveals room for improvement, with even the strongest model achieving only 75.0% accuracy. We further find that model scaling generally improves these capabilities. Ablation studies also indicate larger models show increasing potential as high-level planners. Overall, Plan-Bench provides a lightweight probe for evaluating VLMs' reasoning and planning capabilities relevant to embodied environments and assessing their potential as decision makers for physical tasks. Our benchmark and code are available at https://github.com/MinneFeng/Plan-Bench.", "pdf_url": "https://arxiv.org/pdf/2610.18836v1"}, {"title": "RoboSimStudio: An Interactive Toolkit for Rapid Real2Sim of Robot Manipulation Tasks", "authors": ["Kaiyuan Chen", "Shuangyu Xie", "Uksang Yoo", "Xinyue Zhu", "Cael Magner", "Alvin Zhu", "Daehwa Kim", "Eric Heiden", "Erwin Coumans", "Miles Macklin", "Spencer Huang", "Ken Goldberg"], "published": "2026-10-13", "summary": "It is difficult to accurately model the physics of the interaction between a robot and the objects it manipulates, including contact mechanics, coupled contact dynamics, deformations, stiffness and friction. We present RoboSimStudio (RSS), an interactive toolkit that makes choices of solver, contact model, and physical parameters explicit and editable, allowing both humans and coding agents to iteratively refine simulations based on observed physical behavior. We implement RSS with the open Newton physics simulation system and describe experiments with human-guided real2sim using (1) visual evaluation, (2) force-feedback and (3) agentic Real2Sim2Real. Code, video and additional information can be found on the project website.", "pdf_url": "https://arxiv.org/pdf/2610.18835v1"}, {"title": "WorldOracle: Benchmarking Action-Conditioned World Models against Real-World Executions", "authors": ["Haoyi Duan", "Liliang Chen", "Nan Wang", "Yang Zhang", "Yuhang Lu", "Xiaotong Chen", "Wei-Cheng Tseng", "Shenyuan Gao", "Zhaoshuo Li", "Jingyi Jin", "Pooya Jannaty", "Dhruv Shah", "Yuke Zhu", "Ming-Yu Liu", "Maoqing Yao", "Guanghui Ren"], "published": "2026-10-13", "summary": "We introduce WorldOracle, a benchmark specifically designed to evaluate action-conditioned world models (ACWMs) against paired real-world executions. Given the same initial observation and low-level action sequence, WorldOracle asks whether a predicted rollout reproduces what happens in the real world, including physical consequences and task-state transitions. We evaluate models along four complementary dimensions: physical state correctness, interaction spatial alignment, key interaction area fidelity, and multi-view action coherence. To support this evaluation, we curate real-world training and evaluation suites that cover different interaction dynamics and embodiments. The evaluation suite contains long, multi-segment episodes with both successful and failed executions, enabling evaluation across varied action outcomes and behavior distributions. Experiments on seven representative ACWMs reveal distinct model strengths and failure modes. WorldOracle provides a systematic foundation for measuring and advancing action-conditioned world modeling for manipulation. We will release the datasets, evaluation code, and leaderboard.", "pdf_url": "https://arxiv.org/pdf/2610.18826v1"}, {"title": "EgoMatrix: Physically Faithful Dexterous Robot Demonstrations from Egocentric Human Videos", "authors": ["Ziheng Wang", "Yanming Shao", "Ting Mao", "Kaihan Chen", "Yiqun Wang", "Xuanye Wu", "Yao Mu"], "published": "2026-10-13", "summary": "Egocentric human videos offer a scalable alternative to robot teleoperation for collecting dexterous manipulation data. However, two challenges limit their use as reliable training data: accurate hand-object interaction (HOI) reconstruction from monocular RGB and high-quality robot demonstrations, especially visual observations. We present EgoMatrix, an end-to-end data engine that converts monocular egocentric human videos into bimanual dexterous trajectories and paired robot observation videos, with the trajectories directly replayable on real robots. It reconstructs HOI with emphasis on relative geometry and contact rather than exact metric scene recovery, then uses retargeting and reinforcement learning (RL) to reproduce the demonstrated tasks in simulation. We jointly render robot hands and objects from these simulated trajectories to produce physically faithful observations synchronized with state and control records. Rendering the same trajectories in diverse, task-compatible backgrounds expands paired training data while preserving robot-object motion and contact. Across TACO, OakInk2, and self-collected data, EgoMatrix achieves 54.84% end-to-end success in simulation versus 14.52% for the strongest baseline. Reconstruction reaches state-of-the-art performance on most metrics of the two public benchmarks. Qualitative results show more faithful hand-object interactions than prior methods, while feature-space analysis shows closer alignment with real-robot observations than GPT-6 Astra. Our project page is available at https://spikew726.github.io/EgoMatrix/.", "pdf_url": "https://arxiv.org/pdf/2610.18822v1"}, {"title": "Optimizing Team Behavior via Extremum-seeking Control in Multi-agent Reinforcement Learning", "authors": ["Svar Rajankumar Patel", "Kshitij Jerath"], "published": "2026-10-13", "summary": "In cooperative Multi-Agent Reinforcement Learning (MARL), agents must learn to coordinate their actions to achieve shared objectives. A key indicator of effective coordination is behavioral diversity, i.e., the agents' potential to enact distinct yet complementary control policies given the same set of observations. Although behavioral diversity can enable role specialization and richer joint behaviors, its appropriate level is highly context- and task-dependent and often costly to tune. We propose Adaptive Diversity Control (ADiCo), a two-timescale framework that adapts behavioral diversity online during training. On a fast timescale, Diversity Control (DiCo) regulates system diversity toward a target value. On a slower timescale, an Extremum Seeking Controller (ESC) adjusts this target using only mean episodic returns, without requiring an explicit model or analytical gradient of the diversity-performance landscape. We evaluate ADiCo on six configurations across two cooperative MARL tasks, where it maintains task-appropriate diversity levels: low diversity when homogeneous policies are beneficial and higher diversity when heterogeneous policies are required. Through this adaptation, ADiCo matches or exceeds the mean performance of DiCo (best grid-searched diversity target) and Unconstrained DiCo (diversity allowed to emerge without target regulation). These results demonstrate that incorporating classical feedback control into MARL training enables effective coordination by providing a systematic alternative to task-specific manual selection of the diversity target.", "pdf_url": "https://arxiv.org/pdf/2610.18808v1"}, {"title": "Registration is a Representation Problem: Solving Whole-Body PET/CT Registration", "authors": ["Neel Dey", "Adrian V. Dalca"], "published": "2026-10-13", "summary": "Raw image intensities are a poor surrogate for similarity across images in correspondence problems. Further, while auxiliary segmentation labels can provide semantic identification and improve matching, they can assign only coarse identities to fine-grained anatomy and often cover only a subset of structures, particularly in whole-body settings. We present an approach that instead establishes correspondence using complementary representations of anatomy and demonstrate its utility for longitudinal whole-body PET/CT registration in the Learn2Reg 2026 PSMAReg Challenge. Our 3D foundation model, anatomix, is used to derive fine-grained, per-voxel semantic representations that are consistent across volumes, and we further employ off-the-shelf segmentation models to obtain coarse anatomical identities. Together, these representations drive a GPU-accelerated iterative registration solver (FireANTs) in a hybrid multistage framework: the first stage estimates alignment from dense multi-channel features, after which a second refines the deformation using both anatomix- and segmentation-based losses. Lastly, because registration should not introduce non-biological tumor volume changes across time, we develop lesion-specific component-wise volume preservation schemes. Without any task-specific training, our system won first place in the PSMAReg Challenge leaderboard. Code and interactive visualizations are available at http://www.neeldey.com/reps-for-reg.", "pdf_url": "https://arxiv.org/pdf/2610.18804v1"}, {"title": "SEAR: Self-Evolving Agentic Robotics", "authors": ["Xinyi Wang", "Bangzheng Li", "Hanyu Wang", "Lin Zhang", "Andrea Yaoyun Cui", "Zhenggang Tang", "Shyamal Buch", "Dejia Xu"], "published": "2026-10-13", "summary": "Frontier language-model agents can now improve robots on their own: they write control code, test it, and keep what works as skills and memories for the next task. We introduce SEAR (Self-Evolving Agentic Robotics), a framework and benchmark built around two questions. Is the agent really learning, or just trying more often? And does what it learns still help on new tasks, in a new simulator, and on a real robot? The framework runs an agent in three modes: it writes code that becomes the policy (code-as-policy), acts live in the control loop (agent-as-policy), or works as a researcher that fine-tunes a vision-language-action model (auto-research). The benchmark adds controls that separate retained experience from repeated attempts, familiar tasks, privileged simulator state, larger budgets, and luck. Across seven frontier language models, 330 simulated and five physical tasks, and over four years of agent runtime, we highlight three findings. First, the learning curve of a robotic agent depends both on the overall time budget and the task difficulty relative to model capability. Harder tasks make longer sessions worthwhile; on easier tasks, re-rolling short attempts does just as well. Second, control code and shared routines transfer across tasks and simulators, while task-specific solutions do not. On a real robot, we observe a performance gap between agent-designed practice and novel human-designed scenes. Third, different models evolve more effectively in different ways. Some do best acting live, others writing code first. And a text-only model keeps pace with a comparable multimodal one: perception helps with error assessment, but agentic reasoning and tool use can matter more. We release the benchmark and codebase to support future research.", "pdf_url": "https://arxiv.org/pdf/2610.18792v1"}, {"title": "EqC: Equilibrium Energy Control for Introspective Lifelong Robot Learning", "authors": ["Haodong Yang", "Runhan Huang", "Bowen Zhang", "Iofai Lei", "Zunzhe Zhang", "Xiangcheng Zhang", "Shaoting Zhu", "Linzhan Mou", "Yicheng Liu", "Hang Zhao"], "published": "2026-10-13", "summary": "Long-term robot autonomy depends on more than effective action generation: a policy must recognize when its behavior is no longer sufficiently supported and use assistance to improve. We introduce Equilibrium Energy Control (EqC), a framework for introspective lifelong robot learning built around an explicit conditional energy landscape. EqC casts generative action refinement as equilibrium-seeking optimization, while the geometry of the refinement process reveals whether the generated behavior remains consistent with the learned landscape. This competence signal enables Energy-Gated DAgger, where persistent energy-consistency violations trigger expert takeover and the resulting recovery trajectories are aggregated for subsequent policy updates. EqC integrates naturally into both Diffusion Transformer policies and flow-matching-based vision-language-action (VLA) policies. Across simulation and real-world bimanual manipulation, EqC matches or improves control performance and robustness while enabling timely intervention near the policy's competence boundary. A real-world study further shows how these interventions progressively expand the range of situations handled autonomously, providing a practical path from static generative controllers toward self-improving robot systems.", "pdf_url": "https://arxiv.org/pdf/2610.18790v1"}, {"title": "GreenWAM: A World Foundation Model for Robotics", "authors": ["Gennady Sidorov", "Valerii Kornilov", "Denis Grankin", "Polina Fedotova", "Aleksey Postnikov"], "published": "2026-10-13", "summary": "A robot needs a world model that predicts how its actions will change the scene and a policy that chooses those actions. Models are usually built and evaluated for only one of these roles, and every robot records its actions in its own format. We ask whether one robot world model can serve both roles across different bodies, and what makes this work. We present GreenWAM, a world foundation model for robotics, together with the recipe that produces it: (1) a shared anatomical action space that describes 20 robot families, from bimanual arms to dexterous humanoids, in common joint coordinates; (2) joint training on these families in visual, action-conditioned and world-action modes; and (3) policies that split an action expert off the generator. As a world model, GreenWAM attains top-tier trajectory, depth and 3D accuracy on WorldArena 1.0, ahead of every world-action model and video generator in our comparison. As a policy, it scores among the top entries of the RoboTwin 2.0 leaderboard, reaches the highest zero-shot LIBERO-plus success among the compared methods and is competitive with dedicated vision-language-action and world-action policies on CALVIN and LIBERO. We further adapt GreenWAM to a real humanoid, where it succeeds more often than policies adapted from $π_{0.5}$ and from Cosmos 3 Edge, and distill it into a single-step policy for real-time control. Controlled experiments yield three findings: robot specialization improves world prediction and control together; an action expert helps when split off at the start of adaptation; and keeping world-model modes during policy adaptation preserves robustness to scene changes.", "pdf_url": "https://arxiv.org/pdf/2610.18774v1"}, {"title": "Code-Switching Detection via Language-Selective Dimensions in Speech Foundation Models", "authors": ["Jie Chi", "Zakaria Aldeneh", "Masha Fedzechkina", "Maureen de Seyssel", "Natalie Schluter"], "published": "2026-10-13", "summary": "Code-switching (CS), the alternation between languages within an utterance, is common in multilingual speech but underrepresented in pretraining corpora. Increasing CS coverage requires finding relevant utterances in large speech collections so that they can be included in training data. One way to find such utterances is to transcribe the speech and detect language alternation in the text, but this depends on obtaining accurate multilingual transcriptions. We propose a lightweight method that detects CS directly from speech. It uses frame-level language information in pretrained speech encoders to determine whether both languages are present within an utterance. Specifically, we identify language-selective hidden-state dimensions using monolingual recordings and aggregate their frame-level activations into a CS prediction. With a small CS set used to tune a decision rule, we show that the Whisper-small encoder achieves a mean F1 of $0.798$ across 14 language pairs in CS-FLEURS, compared with $0.776$ for a CNN and $0.751$ for a HuBERT linear baseline trained for monolingual language identification. Our findings suggest that pretrained speech encoders already encode the information needed to identify CS utterances, and they provide a lightweight tool for building more representative multilingual corpora.", "pdf_url": "https://arxiv.org/pdf/2610.18726v1"}, {"title": "Steertuning Policies from a Few Human Videos", "authors": ["Billy Yan", "Isaac Tu", "Kelly Lee", "Blake Chang", "Kenny Ma", "Kanad Patel", "Dhawal Kabra", "Neer Patel", "Kevin Wu", "Lerrel Pinto", "Irmak Guzey"], "published": "2026-10-13", "summary": "Current recipes for robot learning require massive amounts of robot demonstrations to obtain robust and adaptive policies. In this work, we introduce Steertuning, a system that enables robots to learn new tasks in new environments from 5 human demonstrations in under 5 Steertuning consists of two parts. (1) We pretrain a 400M-parameter diffusion policy on our egocentric human dataset, which consists of 100 hours of densely annotated random interactions. This pretraining makes Steertuning robust to background differences and enables spatial and object generalization when deployed on new tasks. (2) Given 5 demonstrations of a new task, we finetune our model for only 2 minutes (2000 training updates) and steer the policy's actions during reverse sampling using the demonstration whose observation is closest to that of the deployment environment. Together with a carefully designed data processing pipeline for embodiment transfer, this enables Steertuning to achieve a 71% success rate across 12 tasks in 12 new environments, ranging from lab settings to kitchens in new homes. The entire process, from data collection for a new task to robot policy deployment, takes less than 5 minutes. Our full dataset, model weights, codebase, and robot videos will be made available at our website: https://steertuning.github.io.", "pdf_url": "https://arxiv.org/pdf/2610.18711v1"}, {"title": "RoboFQE: Rollout-Free Evaluation of Visual Robot Policies from Offline Trajectories", "authors": ["Yunfu Deng", "Sangwoo Shin", "Brahma S. Pavse", "Josiah P. Hanna"], "published": "2026-10-13", "summary": "Evaluating robot policies before deployment typically requires producing new trajectories through real-world execution, simulators, or learned world models. These rollout-based approaches impose infrastructure requirements; simulator and world-model evaluators additionally face prediction errors that can compound over the evaluation horizon. In this paper, we study off-policy evaluation as an alternative to rollout-based robot-policy evaluation methods. Specifically, we introduce RoboFQE, an evaluator that estimates the discounted expected return of a target policy from offline robot trajectories without estimating a behavior-policy density, combining fitted Q-evaluation with a pretrained vision foundation model and learned terminal success annotation to bridge the gap between standard OPE benchmarks and continuous-control visual manipulation. Controlled experiments across simulated and real-world manipulation tasks show that RoboFQE produces accurate discounted-return estimates and preserves policy rankings even on long-horizon manipulation tasks where video world-model evaluators are degraded by autoregressive prediction errors. Ablation experiments show that pretrained vision encoders substantially outperform from-scratch alternatives, particularly on long-horizon tasks, and that learned terminal success annotation enables evaluation without ground-truth reward labels with only slight reduction of accuracy.", "pdf_url": "https://arxiv.org/pdf/2610.18699v1"}, {"title": "UniW(A)M: A Unified Mixture-of-Experts Framework for World and World-Action Models", "authors": ["Jingbo Xu", "Jianjie Fang", "Zhuohang Li", "Zihao Song", "Zhaolu Wang", "Xvyuan Li
