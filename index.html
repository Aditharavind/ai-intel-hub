ite and orange humanoid robot manipulates an object in its two-finger grippers.\" class=\"rm-shortcode\" id=\"209d4\" src=\"https://spectrum.ieee.org/media-library/a-white-and-orange-humanoid-robot-manipulates-an-object-in-its-two-finger-grippers.jpg?id=67568030&amp;width=980\" /> <small class=\"image-media media-caption\">The robot’s chonky design allows it to meet the high-payload requirements of useful manufacturing work.<\/small><small class=\"image-media media-photo-credit\">Walden Robotics<\/small><\/p><p>In this context, at least in the short term, Walden’s approach to improving the quality of life for people is to take over those aforementioned repetitive manufacturing tasks with robots. Tedrake hopes that this will lead to workplaces where skilled craftspeople are able to do even more with their hard-earned expertise, increasing their efficiency, productivity, and happiness all at the same time—a noble goal, although there’s only so much Walden itself can do to make this happen, and not all customers will share Toyota’s priorities.<\/p><h2>Wheeled Humanoid Robots in Factories<\/h2><p>Many other <a href=\"https://www.agilityrobotics.com/\" target=\"_blank\">humanoid<\/a> <a href=\"https://www.figure.ai/\" target=\"_blank\">robotics<\/a> <a href=\"https://apptronik.com/\" target=\"_blank\">companies<\/a> are also targeting these logistics and manufacturing spaces with general-purpose robots, and they’re doing so by making robots that are as humanlike as possible. The theory is that a humanoid form factor is necessary when operating in human environments. And there are certainly arguments in favor of a humanoid with legs—stairs exist, for one, and legged robots have a smaller footprint compared with ones that have wheels.<\/p><p>But a large wheeled base offers some significant advantages, as Tedrake points out. You’re incentivized to cram the base full of batteries, since more weight near the floor keeps the robot stable, which also solves the problem of running out of power during the middle of the workday. More importantly, a statically stable robot that moves around on a wheeled base can bypass the <a href=\"https://spectrum.ieee.org/humanoid-robot-scaling\" target=\"_self\">safety challenges<\/a> that are currently keeping legged humanoids physically separated from real humans—most prominently, the fact that legged robots can fall over. “Factories already have autonomous mobile [wheeled] robots,” explains Tedrake. “They already have safety cases built around AMRs. You can piggyback on that with a wheeled base.”<\/p><p class=\"shortcode-media shortcode-media-rebelmouse-image\"> <img alt=\"A close-up of a robotic gripper grasping a metallic object in a vise.\" class=\"rm-shortcode\" id=\"f600c\" src=\"https://spectrum.ieee.org/media-library/a-close-up-of-a-robotic-gripper-grasping-a-metallic-object-in-a-vise.jpg?id=67568022&amp;width=980\" /> <small class=\"image-media media-caption\">Simple, rugged grippers make the robot suitable for commercial deployment.<\/small><small class=\"image-media media-photo-credit\">Walden Robotics<\/small><\/p><p>Walden’s perspective on manipulation is similar. Many humanoid companies are using five-fingered hands that are highly dexterous but also highly complex, which Tedrake believes is not a pragmatic approach in the context of commercial deployments. “There’s a question of what you need to do the tasks, but the real question is just durability,” Tedrake says. “We have been deployed in a Toyota factory, and at the end of the week, the hands take a beating, so we built hands that can take that. I have not seen a more dexterous hand that could have done the work our hand has done.”<\/p><p>Walden’s long-term plan is to build “general-purpose robots.” It’s not always clear what a general-purpose robot is, because (I would argue) nobody is quite sure what “general purpose” means. It’s certainly not referring to robots that can do <em><em>everything<\/em><\/em>; I think the closest we can get are robots that can be taught to do a useful number of different skills, which is why I prefer the term “multipurpose.” It’s a little pedantic, I know, but I think the distinction is important because it moderates expectations in the near term.<\/p><p>Part of where Walden’s optimism towards general purposeness comes from is TRI’s earlier research on <a href=\"https://medium.com/toyotaresearch/tris-robots-learn-new-skills-in-an-afternoon-here-s-how-2c30b1a8c573\" target=\"_blank\">diffusion policy<\/a>, which helps robots learn new skills more quickly by leveraging previously learned skills as a foundation. “Fundamentally, multitasking is a way to get to a general-purpose robot,” Tedrake says. “I believe there is a single platform that can do a lot of tasks that are of high value for real customers. That will give us the experience we need to give birth to this deployed general-purpose capability.”<\/p>"}, {"title": "Video Friday: Meet Google DeepMind’s Gemini Robotics 2", "source": "IEEE Spectrum Robotics", "date": "2026-07-31", "url": "https://spectrum.ieee.org/video-robot-gemini2-ai-robot", "summary": "<img src=\"https://spectrum.ieee.org/media-library/humanoid-robot-and-robotic-arm-labeled-gemini-robotics-er-2-in-a-workshop-setting.webp?id=67560022&amp;width=1245&amp;height=700&amp;coordinates=0%2C0%2C0%2C0\" /><br /><br /><p><span>Video Friday is your weekly selection of awesome robotics videos, collected by your friends at <\/span><em>IEEE Spectrum<\/em><span> robotics. We also post a weekly calendar of upcoming robotics events for the next few months. Please <\/span><a href=\"mailto:automaton@ieee.org?subject=Robotics%20event%20suggestion%20for%20Video%20Friday\">send us your events<\/a><span> for inclusion.<\/span><\/p><h5><a href=\"https://actuate.foxglove.dev/\">Actuate 2026<\/a>: 18–19 August 2026, SAN FRANCISCO<\/h5><h5><a href=\"https://2026.ieee-iros.org/\">IROS 2026<\/a>: 27 September–1 October 2026, PITTSBURGH<\/h5><h5><a href=\"https://humanoidssummit.com/\">Humanoids Summit Seoul<\/a>: 22–23 September 2026, SEOUL<\/h5><p>Enjoy today’s videos!<\/p><div class=\"horizontal-rule\"><\/div><div><span style=\"display: none;\"> <\/span><\/div><blockquote class=\"rm-anchors\" id=\"4lsqnrmc6ny\"><em>Introducing Gemini Robotics 2—the intelligence layer powering the next generation of truly adaptable robots. As it takes its first literal steps, this major advance unlocks intelligent whole-body control, advanced dexterity, and multirobot collaboration. <\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p class=\"shortcode-media shortcode-media-youtube\"> <span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p class=\"shortcode-media shortcode-media-youtube\"> <span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://deepmind.google/blog/gemini-robotics-2-brings-whole-body-intelligence-to-robots/\">Google DeepMind<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"vzwytn3fw1w\">THE ROADMAP! NOOOOO!<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.agilityrobotics.com/\">Agility<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"xha2tj_1c6q\">Videos like this always make me wonder how <a href=\"https://spectrum.ieee.org/robot-with-liquid-metal-tendons-can-heal-itself\" target=\"_blank\">repairable<\/a> these robots are. Very, I would hope.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.unitree.com/As2-W\">Unitree<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"m81_7rggdxm\"><em>Humans routinely communicate through abstractions of their bodies, including shadows, silhouettes, and reflections. Here, we present a robotic system capable of dynamic shadow expression using a 21-degrees-of-freedom <a href=\"https://spectrum.ieee.org/video-friday-robotic-hand-dexterity\" target=\"_blank\">dexterous hand<\/a> with compliant soft skin and a learned shadow self-model.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://generalroboticslab.com/shadow\">General Robotics Lab<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"n20cvjhmzh8\">Human-to-quadruped motion transfer is an odd concept, but I’m here for it.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://studios.disneyresearch.com/2026/07/30/two2four-generative-quadruped-puppeteering-from-human-motion/\">Disney Research<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"alc1aon3a4i\"><em>Meet Stretch 4.0<\/em>—t<em>he one-armed, three-wheeled robot that can navigate your home safely. Would you rather a humanoid robot or Stretch?<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://hello-robot.com/\">Hello Robot<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"cjytikq4dum\">And now, this, for some reason.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.pndbotics.com/\">PNDbotics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"k4wzqzblkry\">I’m not sure we’re allowed to be impressed if you resize a badminton court to accommodate your robot.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.phybot.tech/en/home\">PHYBOT<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"rnrf8fc47qm\">Golden eagles care not for <a href=\"https://spectrum.ieee.org/dutch-police-training-eagles-to-take-down-drones\" target=\"_blank\">drones<\/a>. <\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.team-blacksheep.com/\">Team BlackSheep<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"1tzmvkf7x10\"><em>University of Southern California researchers work with NASA and others to train robot dogs for planetary exploration on Mars, the moon, and beyond!<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.radlab.us/\">Research in Applied Decisions: RAD Lab<\/a> ]<\/p><p>Thanks, Cristina!<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"lzphwt2wwv8\"><a href=\"https://spectrum.ieee.org/humanoid-robots-japan\" target=\"_blank\">WABOT-1<\/a> was arguably the birth of the humanoid robot in Japan. We’ve come a long way, and it’s good to be reminded where we started.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"http://www.takanishi.mech.waseda.ac.jp/top/index.htm\">Takanishi Lab<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"1eplnnhbqbs\">If only this video was at 1x instead of 5x we could have had 15 hours of Memo folding laundry.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.sunday.ai/\">Sunday Robotics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div>"}, {"title": "Boston Dynamics to discuss the art behind human-robot interaction", "source": "Robotics Business Review", "date": "2026-07-20", "url": "https://www.therobotreport.com/boston-dynamics-discuss-art-behind-human-robot-interaction/", "summary": "<p>Boston Dynamics experts will share insights into design considerations for safe human-robot interaction in a webinar.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/boston-dynamics-discuss-art-behind-human-robot-interaction/\">Boston Dynamics to discuss the art behind human-robot interaction<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Video Friday: Your Robot Surgeon Will See You Now", "source": "IEEE Spectrum Robotics", "date": "2026-07-17", "url": "https://spectrum.ieee.org/video-friday-robotic-surgery", "summary": "<img src=\"https://spectrum.ieee.org/media-library/two-humanoid-robots-perform-a-surgical-procedure-on-a-patient-in-a-dark-lab.png?id=67494478&amp;width=1245&amp;height=700&amp;coordinates=0%2C0%2C0%2C0\" /><br /><br /><p><span>Video Friday is your weekly selection of awesome robotics videos, collected by your friends at <\/span><em>IEEE Spectrum<\/em><span> robotics. We also post a weekly calendar of upcoming robotics events for the next few months. Please <\/span><a href=\"mailto:automaton@ieee.org?subject=Robotics%20event%20suggestion%20for%20Video%20Friday\">send us your events<\/a><span> for inclusion.<\/span><\/p><h5><a href=\"https://mrs.fel.cvut.cz/summer-school-2026/\">Summer School on Multi-Robot Systems<\/a>: 29 July–4 August 2026, PRAGUE<\/h5><h5><a href=\"https://actuate.foxglove.dev/\">Actuate 2026<\/a>: 18–19 August 2026, SAN FRANCISCO<\/h5><h5><a href=\"https://2026.ieee-iros.org/\">IROS 2026<\/a>: 27 September–1 October 2026, PITTSBURGH<\/h5><h5><a href=\"https://humanoidssummit.com/\">Humanoids Summit Seoul<\/a>: 22–23 September 2026, SEOUL<\/h5><p>Enjoy today’s videos!<\/p><div class=\"horizontal-rule\"><\/div><div><span style=\"display: none;\"> <\/span><\/div><blockquote class=\"rm-anchors\" id=\"qp0eiql6vb8\"><em>In this work, we present a systematic evaluation of contemporary humanoid technology for laparoscopic surgical tasks. We develop a humanoid-based laparoscopic teleoperation framework using general-purpose instruments and assess its capabilities through benchtop characterization, dry-lab user studies spanning diverse surgical experience levels, and in vivo porcine studies. Across these evaluations, we quantify technical feasibility, task performance, and clinical readiness relative to established surgical platforms. Together, our study provides an evidence-based assessment of the current capabilities and limitations of humanoids for surgical applications, highlighting both their promise and the key technical challenges that must be addressed before clinical deployment.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://humanoid-surgeon.github.io/\">UC San Diego<\/a> ]<\/p><p>Thanks, Ioana!<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"d7i1wj0gkik\"><em>Today, we preview ACT-2, the first robotics model to achieve reliability by unifying broad generalization with high performance.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>Sunday also has this 3-hour video (!) of Memo <a href=\"https://spectrum.ieee.org/is-there-a-future-for-laundry-folding-robots\" target=\"_blank\">folding laundry<\/a> in “never seen environments.” Let’s just not ask, because we almost certainly don’t want to know.<\/p><p class=\"shortcode-media shortcode-media-youtube\"> <span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.sunday.ai/\">Sunday Robotics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"ei1zfxlvkrs\">Spot is not the first quadruped to try its legs at last few meters <a href=\"https://spectrum.ieee.org/boston-dynamics-spot-robot-dog-now-available\" target=\"_blank\">package delivery<\/a>, but the challenge is not really those last few meters—it’s going to be not driving the human coworker nuts, is my guess.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://bostondynamics.com/blog/bridging-the-porch-gap/\">Boston Dynamics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"vrmcnnekti0\"><em>Quadrupedal locomotion in complex environments requires multiple motor skills, stable gait transitions, and perceptive control over a broad range of speeds. APT-RL (Action Pretrained Transformer-based Reinforcement Learning) is a unified framework for high-speed, multiskill locomotion. A single policy selects and transitions between gaits and motor skills using only onboard perception and computation. In real-world experiments, KAIST HOUND traversed stairs, hurdles, stepping-stones, gaps, and fallen branches. It reached an instantaneous peak speed of 4.25 meters per second while traversing a 60-centimeter step and 6 m/s during a drop-down transition on a three-step staircase.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://skillquadsr.github.io/\">KAIST DRCD Lab<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"fewvzrcka5c\">We will have much more on this next week.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.waldenrobotics.com/\">Walden Robotics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"q0wmudf3jki\"><em>Today, we introduce Lumo-2, our next-generation latent world-action model for generalist embodied robot learning.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.astribot.com/en/research/Lumo2\">Astribot<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"ccnkgd3qxvg\">Following Atlas’s first-of-its-kind live performance at the FIFA World Cup 2026, we caught up with Seth Davis, senior program manager, to learn how this demonstration came together and what it takes to succeed in the field (and <a href=\"https://spectrum.ieee.org/video-friday-humanoid-robot-running\" target=\"_blank\">on the pitch<\/a>).<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://bostondynamics.com/\">Boston Dynamics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"vxfnou7kf6y\"><em>No teleoperation. No cuts. Long take. One of the world’s few complete demonstrations of long-horizon mobile manipulation, bringing fully autonomous humanoid robots another step closer to us.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.limxdynamics.com/en\">LimX<\/a> ]<\/p><p>Thanks, Jinyan!<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"ytq2o5gcu3w\">Impressive. But get a job.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.magiclab.top/en/\">MagicLab<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"w3n009ayfhq\">We saw some footage of this <a href=\"https://spectrum.ieee.org/video-friday-robot-world-cup\" target=\"_blank\">last week<\/a>, but here’s a much better video.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><blockquote><em>Wing-propelled diving birds flap their wings to move through air and water, yet the wing morphology and kinematics that enable this behavior remain poorly understood because of the difficulty of collecting in situ data. The impact of flapping frequency, wing size, and stiffness on locomotion in—and transition between—the two media are still unknown. We compared data from diving birds against experiments using a flapping-wing robot capable of flying, swimming, plunge diving, and exiting the water. We show that frequency adaptation, flexible wings, and powerful actuation enable seamless transitions without folding wings or legs, that large wings enhance flight without substantially reducing underwater efficiency, and that tail-body distance and egress angle affect water exit. These results clarify how birds (and robots) balance multifluid locomotion constraints.<\/em><\/blockquote><p>[ <a href=\"https://dspace.mit.edu/entities/publication/a8ca74c5-9e2a-42f3-9ddf-636701e91ae2\">EPFL LIS<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div>"}, {"title": "Video Friday: A World Cup for Robots", "source": "IEEE Spectrum Robotics", "date": "2026-07-10", "url": "https://spectrum.ieee.org/video-friday-robot-world-cup", "summary": "<img src=\"https://spectrum.ieee.org/media-library/humanoid-robots-play-soccer-as-a-ball-flies-toward-the-goal-in-a-tournament-arena.jpg?id=67119515&amp;width=980\" /><br /><br /><p><span><a href=\"https://spectrum.ieee.org/tag/video-friday\" target=\"_blank\">Video Friday<\/a> is your weekly selection of <a href=\"https://spectrum.ieee.org/video-friday-robot-grippers\" target=\"_blank\">awesome robotics videos<\/a>, collected by your friends at <\/span><em>IEEE Spectrum<\/em><span> robotics. We also post a weekly calendar of upcoming robotics events for the next few months. Please <\/span><a href=\"mailto:automaton@ieee.org?subject=Robotics%20event%20suggestion%20for%20Video%20Friday\">send us your events<\/a><span> for inclusion.<\/span><\/p><h5><a href=\"https://roboticsconference.org/\">RSS 2026<\/a>: 13–17 July 2026, SYDNEY<\/h5><h5><a href=\"https://mrs.fel.cvut.cz/summer-school-2026/\">Summer School on Multi-Robot Systems<\/a>: 29 July–4 August 2026, PRAGUE<\/h5><h5><a href=\"https://actuate.foxglove.dev/\">Actuate 2026<\/a>: 18–19 August 2026, SAN FRANCISCO<\/h5><h5><a href=\"https://2026.ieee-iros.org/\">IROS 2026<\/a>: 27 September–1 October 2026, PITTSBURGH<\/h5><h5><a href=\"https://humanoidssummit.com/\">Humanoids Summit Seoul<\/a>: 22–23 September 2026, SEOUL<\/h5><p>Enjoy today’s videos!<\/p><div class=\"horizontal-rule\"><\/div><div><span style=\"display: none;\"> <\/span><\/div><blockquote class=\"rm-anchors\" id=\"xuedf0fmame\"><em>For the first time, two full teams of humanoid robots played an 11-vs-11 soccer match on hardware, bringing one of robotics’ most ambitious long-term visions closer to reality. Never before have two full-sized humanoid robot teams played a soccer game against each other.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.robocup.org/news/192\">RoboCup<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"9xjhrkpcbgi\"><em>Engineers at MIT and EPFL in Lausanne, Switzerland, have designed a robot that can swim underwater and flap out of the water to continue flying through the air, much like a diving bird. The robot can help scientists study the mechanics that enable these actions in aquatic aviators and may help launch a new class of aerial-aquatic drones and vehicles.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://news.mit.edu/2026/new-flapping-robot-swims-and-flies-like-diving-bird-0709\">MIT<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"qryxv3csrea\"><em>We’re excited to announce our breakthrough robotic hands for the NEO platform: hands that match or exceed human-level dexterity, strength, safety, and reliability. Designed from the ground up, these 25-DoF hands combine 25 fully actuated degrees of freedom with a tendon-driven system, rich tactile sensing, and built-in compliance. The result is a hand capable of true in-hand manipulation, precision tool use, and delicate interaction.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.1x.tech/discover/neos-hands\">1X<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"zjlr7m91yue\"><em>This match, Tech United played against IRIS at the midsize league at RoboCup 2026 in Incheon, South Korea.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://techunited.nl/?page_id=2135&amp;lang=en\">Tech United<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"ezplxk78cfk\"><em>Atlas arrived pitchside at NYNJ Stadium in front of 80,000 people gathered to see Brazil vs. Norway. After performing some of the sport’s most memorable player celebrations, Atlas helped kick off the second half by delivering the match ball!<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://bostondynamics.com/blog/can-football-teach-a-robot-to-move/\">Boston Dynamics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"k7_acxnvrdi\"><em>Navigating discrete terrain such as stepping stones remains a major challenge for legged robots. Conventional approaches often rely on dense environment reconstruction from cameras or lidar, which can be affected by latency, occlusions, and significant computational overhead. We show that proximity sensors integrated into the bottom of a quadruped’s feet enable safe, terrain-seeking autonomous locomotion.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://arxiv.org/abs/2606.31912\">Paper<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"xsrc3tdzqv4\"><em>On this holiday, Digit is on grill duty. It turns out precise force control is good for more than payload handling. Happy 4th of July from all of us at Agility.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.agilityrobotics.com/\">Agility<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"yyjmb-lgp8o\"><em>We’ve created GEN-1, our latest milestone in scaling robot learning. We believe it to be the first general-purpose AI model that crosses a new performance threshold: mastery of simple physical tasks. It improves average success rates to 99 percent on tasks where previous models achieve 64 percent, completes tasks roughly 3x faster than state-of-the-art, and requires only one hour of robot data for each of these results. GEN-1 unlocks commercial viability across a broad range of applications—and while it cannot solve all tasks today, it is a significant step toward our mission of creating generalist intelligence for the physical world.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://generalistai.com/blog/gen-1\">Generalist<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"_wgnmkmvels\">Four years at Figure.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.figure.ai/news\">Figure<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"cmcvaclf9bm\"><em>Reachy Mini is becoming your real AI companion. The Conversation App makes it able to talk fluently with you, help you with your to-do list, remind you of important tasks, and even chat about music. Long-term memory, voice interaction, always ready to help.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://huggingface.co/reachy-mini\">Reachy Mini<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"p8u_4v8suoq\">Is this sort of thing now a real job for humanoid robots, then?<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://shop.unitree.com/collections/humanoid-robot\">Unitree<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"lad1wzntj6e\">Quite a story, but is it a real job?<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://en.engineai.com.cn/product-t800\">EngineAI<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"tsdjodthhnk\">If you have a cute animal logo for your research, I will always share it.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://patripfr.github.io/bievr-lio/\">BIEVR-LIO<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"kg3hwbaioda\">This is very delicate work, although the real challenge would be picking those nuts out of a jumbled bin full of randomly sized nuts, which is how most of us live our lives.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://sanctuary.ai/\">Sanctuary<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"wdf3borclra\">Not for me, thank you, although I’m not saying that most of the other humanoid robots out there are any better looking, fundamentally.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.ubtrobot.com/en/\">UBTECH<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"jqi_ucwhe2c\"><em>Robotics professor Dr. Christian Hubicki judges robot soccer skills while knowing very little about soccer himself.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.optimalroboticslab.com/\">ORL<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"qbm9xvrq7tg\"><em>In this presentation, Brendan Schulman, vice president of policy at Boston Dynamics, outlines the critical role of government engagement in driving the success of the humanoid robotics industry. He demonstrates how legged robots like the Spot quadruped and Atlas humanoid are moving beyond factory settings to deliver real-world value in infrastructure inspection, industrial manufacturing, and public safety. Schulman highlights the intersection of AI and robotics, showcasing how large behavioral models and reinforcement learning enable robots to navigate slippery floors and autonomously avoid workplace hazards. Ultimately, he calls for a proactive national robotics strategy focused on workforce training, safety standards, and ethical frameworks to support supply chain resilience and global competitiveness.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://humanoidssummit.com/\">Humanoids Summit<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div>"}, {"title": "NVIDIA and Hugging Face bring new models and frameworks to LeRobot", "source": "Robotics Business Review", "date": "2026-07-08", "url": "https://www.therobotreport.com/nvidia-hugging-face-bring-new-models-frameworks-lerobot/", "summary": "<p>Hugging Face LeRobot is an open-source robotics library for training, running, and sharing robot datasets, models, policies, and workflows.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/nvidia-hugging-face-bring-new-models-frameworks-lerobot/\">NVIDIA and Hugging Face bring new models and frameworks to LeRobot<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "NVIDIA and Hugging Face Bring New Models and Frameworks to LeRobot for the Open Robotics Community", "source": "NVIDIA Robotics", "date": "2026-07-07", "url": "https://blogs.nvidia.com/blog/hugging-face-lerobot-models-frameworks-open-robotics/", "summary": "Open source AI has shown how quickly developers can innovate when models, data and tools are shared. Robotics has the same opportunity, but advancements in physical AI development can still be gated by costly and fragmented resources, from large datasets and robot foundation models to simulation, compute and validation tools. NVIDIA and Hugging Face are [&#8230;]"}, {"title": "Boston Dynamics brings its legged robots to the FIFA World Cup", "source": "Robotics Business Review", "date": "2026-07-06", "url": "https://www.therobotreport.com/boston-dynamics-brings-its-legged-robots-to-the-fifa-world-cup/", "summary": "<p>Around the 2026 FIFA World Cup, Hyundai and Boston Dynamics have taught footwork to the Atlas humanoid, while the Spot robot is on patrol.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/boston-dynamics-brings-its-legged-robots-to-the-fifa-world-cup/\">Boston Dynamics brings its legged robots to the FIFA World Cup<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Japan Pioneered Humanoid Robots—Can It Now Catch China?", "source": "IEEE Spectrum Robotics", "date": "2026-07-04", "url": "https://spectrum.ieee.org/humanoid-robots-japan", "summary": "<img src=\"https://spectrum.ieee.org/media-library/a-middle-aged-asian-man-seated-next-to-an-uncannily-similar-humanoid-robot-with-the-same-hairstyle-glasses-and-clothing.jpg?id=67080305&amp;width=1200&amp;height=800&amp;coordinates=0%2C83%2C0%2C84\" /><br /><br /><p>“In the future, the relationship between humans and robots will deepen, and the distinction between them will probably disappear.” This prediction, from one of the attendees at the recent <a href=\"https://humanoidssummit.com/agenda-2\" rel=\"noopener noreferrer\" target=\"_blank\">Humanoids Summit in Tokyo<\/a>, might have been unremarkable had it not come directly from an android that was first introduced to the world 20 years ago. <\/p><p><a href=\"https://eng.irl.sys.es.osaka-u.ac.jp/robot\" rel=\"noopener noreferrer\" target=\"_blank\">Geminoid HI-6<\/a> is the sixth-generation of a robot originally designed in 2006. The mechanical twin of Osaka University professor <a href=\"https://spectrum.ieee.org/the-amazing-androids-of-hiroshi-ishiguro\" target=\"_self\">Hiroshi Ishiguro<\/a>, Geminoid HI-6 is now equipped with a large language model trained on Ishiguro’s own writings and interviews. It has advanced conversational skills and can even have a chat with its creator, an eerie spectacle. But at the Humanoids Summit, Geminoid was one of the few humanoid robots from Japan, the country that pioneered the form factor.<\/p><p>While the event in Tokyo had only about 40 robots on display, Chinese systems outnumbered Japanese by roughly three to one. Some Japanese robotics firms were even using Chinese robots in their own technology demonstrations, something that would have been unthinkable in the recent past—one Japanese engineer described the situation as “sad.” The conference was a stark reminder of how Japan has ceded its early lead in humanoid robot development to overseas competitors, and the challenge it now faces to secure a place in an ecosystem increasingly dominated by general-purpose robots powered by AI. <\/p><p>Twenty-five years ago, Japan was turning out <a href=\"https://www.youtube.com/watch?v=ESLc26fNAe8\" target=\"_blank\">groundbreaking humanoids that were showstopping in their abilities<\/a>, but they were not commercialized as <a href=\"https://spectrum.ieee.org/japan-earthquake-more-robots-to-the-rescue\" target=\"_blank\">practical machines<\/a> in any meaningful way. Heavily influenced by science fiction and lacking practical applications, they were mostly expensive technology demonstrations that were eventually mothballed. What Japan retains, however, is robotics design and know-how, which it must leverage to be a key player in the rapidly evolving humanoid ecosystem. <\/p><h3>Learning to Walk—Then Standing Still<\/h3><p>To anyone who has seen recent videos of Chinese humanoids doing <a href=\"https://www.youtube.com/watch?v=R6T-Ea5CfRE\" rel=\"noopener noreferrer\" target=\"_blank\">kung-fu and synchronized acrobatics<\/a>, as well as<a href=\"https://www.bbc.com/news/videos/cz0e54yrppno\" rel=\"noopener noreferrer\" target=\"_blank\"> half-marathon races<\/a>, China’s remarkable progress in the field is nothing new. At the Humanoids Summit, Toyota showed a video of its <a href=\"http://toyotatimes.jp/en/newscast/188.html\" target=\"_blank\">latest basketball-playing robot<\/a>, and Honda exhibited its <a href=\"https://global.honda/jp/RandD/field/hgrx/honda-multi-fingered-hand/\" target=\"_blank\">latest robot hand<\/a>, but the full-scale humanoids on the floor were mostly Chinese–the kid-size <a href=\"https://www.booster.tech/booster-k1/\" rel=\"noopener noreferrer\" target=\"_blank\">K1 machines from Booster Robotics<\/a> of Beijing were dancing to Michael Jackson tunes. The full-scale <a href=\"https://robotsguide.com/robots/unitree-g1\" rel=\"noopener noreferrer\" target=\"_blank\">G1 humanoid from Unitree Robotics<\/a> of Hangzhou was also doing demos. <\/p><p>“You cannot sell these bipedal systems in Japan for safety and compliance reasons,” says Shuichi Nagao, a frequent visitor to China as CTO of <a href=\"https://www.omakase.ai/robotics\" rel=\"noopener noreferrer\" target=\"_blank\">Omakase Robotics<\/a>, a division of Zeals, a Japanese humanoid robot developer. Omakase was exhibiting a G1 modified with an external PC controller, a dextrous hand, a suction-cup manipulator and a sensor “hat” with an extra speaker, mic, and camera. <\/p><p>“In China, the government is pushing humanoid development. They didn’t have an industry 20 years ago. The people pushing it are young, in their 20s and 30s. It’s a really different mentality out there,” says Nagao. “Big players in Japan are still looking for use cases for humanoids. In China, they’re already doing mass production and reducing the cost, so other countries can’t compete with them anymore.”<\/p><p>Another Japanese company showing off G1 bots was summit sponsor GMO AI & Robotics, a subsidiary of Japanese internet company <a href=\"https://en.wikipedia.org/wiki/GMO_Internet\" rel=\"noopener noreferrer\" target=\"_blank\">GMO<\/a>. It’s using the robots in partnership with Japan Airlines to <a href=\"https://group.gmo/en/news/article/850/\" rel=\"noopener noreferrer\" target=\"_blank\">load and unload cargo containers<\/a> at Tokyo’s Haneda airport. The cargo project is a trial—like <a href=\"https://www.tokyoweekender.com/entertainment/tech-trends/ai-powered-robot-monk-buddharoid/\" rel=\"noopener noreferrer\" target=\"_blank\">many other humanoid experiments<\/a>—but the fact that Chinese machines have penetrated so far into Japan’s ecosystem <a href=\"https://www.amazon.com/dp/B001SARCOI?lv=shuf&amp;channelId=500&amp;plpRedirect=mhFallback\" rel=\"noopener noreferrer\" target=\"_blank\">upends a long history<\/a>. <\/p><p>In 1973, scientists at Waseda University in Tokyo built <a href=\"https://www.humanoid.waseda.ac.jp/booklet/kato_2.html\" rel=\"noopener noreferrer\" target=\"_blank\">WABOT-1<\/a>, considered the first full-scale humanoid robot, which was capable of slow bipedal locomotion, grasping objects, and simple communication. It inspired Honda’s groundbreaking Asimo humanoid, but Asimo was never commercialized. It was eventually retired in 2022, the year ChatGPT was released. Two years later, Unitree’s G1 went on sale for US $16,000.<\/p><p class=\"shortcode-media shortcode-media-rebelmouse-image\"> <img alt=\"A 65 centimeter tall bipedal robot, its design features the head of an anime-style girl with legs directly underneath.\" class=\"rm-shortcode\" id=\"706b9\" src=\"https://spectrum.ieee.org/media-library/a-65-centimeter-tall-bipedal-robot-its-design-features-the-head-of-an-anime-style-girl-with-legs-directly-underneath.jpg?id=67080329&amp;width=980\" /> <small class=\"image-media media-caption\">China’s High Torque Technology Co. showed off its Mini Pi biped, customized with an anime-inspired head, at Humanoids Summit in Tokyo. The regular version is priced at $3,500. <\/small><small class=\"image-media media-photo-credit\">Tim Hornyak<\/small><\/p><h3>Supply and Demand<\/h3><p>Japan’s development of humanoids happened before practical applications or widespread demand were in place, but bad timing is only part of the story—Japan also has a history of developing technologies that might appeal to domestic consumers but not necessarily those overseas. For example, decades after its highly engineered multifunction toilets first appeared, they have only recently found a <a href=\"https://www.nytimes.com/2025/05/29/business/toto-toilet-japan-bidet.html\" target=\"_blank\">following abroad<\/a>. <\/p><p>Japan’s humanoid prowess was partly built on the back of its legendary industrial automation, yet even that stronghold has eroded. Ani Kelkar, a partner from McKinsey & Company in Boston who produces analytical reports about the robotics industry, told the summit audience that while Japan occupied the top spot in the world in manufacturing robot density (the number of multipurpose industrial robots in operation per 10,000 employees) from at least 1994 to 2009, it then slipped to second in 2014, third in 2019, and fifth in 2024. In that year, South Korea was at the top of the leaderboard with a robot density of 1,220 compared to Japan’s 446. <\/p><p>The International Federation of Robotics <a href=\"https://ifr.org/ifr-press-releases/news/robot-density-surges-in-europe-asia-and-americas\" target=\"_blank\">estimates<\/a> China now has the most operational industrial robots in the world, with around 2 million total units, approximately 4.5 times more than Japan. “The annual installation numbers are impressive too: 54 percent of all robots installed worldwide in 2024 were deployed in China,” the IFR said in a release in April 2026. <\/p><p>“I think the loss of Japanese leadership is more to do with the rise of China as a manufacturing powerhouse including for sectors that Japan had high export levels,” Kelkar said in an email interview. “The recovery has not yet happened as Japan “missed” the rapid acceleration in AI for robotics and is now playing catch-up.”<\/p><h3>How Japan Can Adapt <\/h3><p>Kelkar believes Japan has a $100 billion opportunity in general-purpose robotics, which are machines that can perform a wide variety of tasks, and it cannot rely on the slower-growing industrial robot market, which is centered on factory machines that do one simple and predictable task like welding car parts. He points to a McKinsey <a href=\"https://www.mckinsey.com/industries/industrials/our-insights/japans-100-billion-opportunity-in-general-purpose-robotics#/\" target=\"_blank\">white paper<\/a> suggesting that while Japan has much of the hardware and technology experience needed to support general-purpose robot development, it must change its strategy to capture a larger share in AI, software, data collection, and robotics platforms.<\/p><p><a href=\"https://ogata-lab.jp/member/ogata.html\" target=\"_blank\">Tetsuya Ogata<\/a> is a professor of engineering and director of the Institute for AI and Robotics at Waseda University, the birthplace of humanoids in Japan. He briefed the summit on how a nonprofit he chairs, the AI Robot Association (<a href=\"https://www.airoa.org/\" rel=\"noopener noreferrer\" target=\"_blank\">AIRoA<\/a>), is working with Toyota and other members to develop foundational technologies for collaborative use. <\/p><p>For instance, AIRoA has collected some 80,000 hours of data on remote operation of mobile manipulators, which Ogata believes is the largest dataset of its kind. Using the data, it built and verified vision-language-action (VLA) models, and it has also started data collection for dual-arm mobile manipulation. In an interview, Ogata acknowledged Japan’s struggle to find its place in the changing landscape. <\/p><p>“The world of AI is inherently a game of scale,” says Ogata. “Therefore, Japan’s absolute prerequisite is to secure a competitive baseline of scale—in data, computing resources, and talent. Beyond that, what I consider most critical is a mind-set shift: Rather than trying to hoard scale within a single nation or company, we must grow stronger by collaborating with a diverse ecosystem of domestic and international players.” <\/p><p>Specifically, this means creating a “collaborative domain” to address data—the single biggest bottleneck—through industry-wide cooperation rather than data siloing. By collectively nurturing a precompetitive, shared data infrastructure and foundation model, individual companies can then compete on top of it with their own applications. “By offering this open ‘data ecosystem’ to the world, we can engage global players and establish a ‘third pole’ alongside the U.S. and China,” says Ogata. “I believe this is how Japan can reclaim its global presence.”<\/p><p>In 1999, Japan introduced the <a href=\"https://www.eurotechnology.com/2015/02/22/i-mode-mobile-internet-docomo/\" rel=\"noopener noreferrer\" target=\"_blank\">world’s first mobile internet services platform<\/a>. But being first didn’t turn Japan into a smartphone manufacturing or design center—it’s now merely a supplier of parts to other countries that are leading the smartphone industry. If Japan can avoid a repeat of that experience and successfully deregulate, diversity, and commercialize its original humanoid dreams, it stands a better chance of influencing the direction of the industry and reaping billions in value. As automobiles and electronics were pillars of Japan’s industrial strategy in the last century, Japan could make humanoid robots one of its key value generators in the 21st century, an approach that would not only deliver economic benefits but give Japan greater clout in how the industry will evolve. Just like Japanese cars, electronics, and even toilets, Japanese humanoids could stand for craftsmanship and reliability. It’s a legacy that Japan can’t afford to give up. <\/p>"}, {"title": "Video Friday: An Earthbound Mars Rover for the Moon", "source": "IEEE Spectrum Robotics", "date": "2026-07-03", "url": "https://spectrum.ieee.org/video-friday-nasa-lunar-rover", "summary": "<img src=\"https://spectrum.ieee.org/media-library/mars-style-rover-prototype-on-rugged-ground-under-a-clear-sky-with-the-moon-visible.png?id=67083121&amp;width=1245&amp;height=700&amp;coordinates=0%2C0%2C0%2C0\" /><br /><br /><p><span><a href=\"https://spectrum.ieee.org/tag/video-friday\" target=\"_blank\">Video Friday<\/a> is your weekly selection of awesome robotics videos, collected by your friends at <\/span><em>IEEE Spectrum<\/em><span> robotics. We also post a weekly calendar of upcoming robotics events for the next few months. Please <\/span><a href=\"mailto:automaton@ieee.org?subject=Robotics%20event%20suggestion%20for%20Video%20Friday\">send us your events<\/a><span> for inclusion.<\/span><\/p><h5><a href=\"https://roboticsconference.org/\">RSS 2026<\/a>: 13–17 July 2026, SYDNEY<\/h5><h5><a href=\"https://mrs.fel.cvut.cz/summer-school-2026/\">Summer School on Multi-Robot Systems<\/a>: 29 July–4 August 2026, PRAGUE<\/h5><h5><a href=\"https://actuate.foxglove.dev/\">Actuate 2026<\/a>: 18–19 August 2026, SAN FRANCISCO<\/h5><h5><a href=\"https://2026.ieee-iros.org/\">IROS 2026<\/a>: 27 September–1 October 2026, PITTSBURGH<\/h5><p>Enjoy today’s videos!<\/p><div class=\"horizontal-rule\"><\/div><div><span style=\"display: none;\"> <\/span><\/div><blockquote class=\"rm-anchors\" id=\"fmxmym6bj-y\"><em>NASA is considering a mission concept for an advanced, nuclear-powered rover to be deployed to the Moon’s South Pole as part of the agency’s Moon Base plans. The PROMISE (Polar Rover for Observation, Mapping, and In-Situ Exploration) mission concept relies on the <\/em><em>Curiosity<\/em><em> Mars rover mission’s testbed rover. Some elements of the Perseverance Mars testbed rover shown in this video could be used as well. As exact duplicates of Curiosity and Perseverance, the testbed rovers are equipped with flight-proven engineering systems capable of carrying technology as well as science instruments that would advance Moon Base efforts.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>A Mars rover for the Moon? That’s some <a href=\"https://science.nasa.gov/resource/improved-optimism/\" target=\"_blank\">OPTIMISM<\/a> right there.<\/p><p>[ <a href=\"https://science.nasa.gov/resource/improved-optimism/\">JPL<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"6qrzc1kf7kc\">This is the absolute best thing since <a href=\"https://spectrum.ieee.org/festos-fantastical-flying-robots\" target=\"_blank\">Festo’s AirPenguin<\/a>.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><blockquote><em>The project explores soft, lightweight robots that can gently float around people in indoor environments and invite playful, affectionate, and everyday interactions. Unlike conventional drones, our robot is designed to be quiet, soft, touch-safe, and socially approachable. Through this work, we ask what future indoor companion robots might feel like if they were not rigid machines, but gentle floating beings that share space with us.<\/em><\/blockquote><p>[ <a href=\"https://dl.acm.org/doi/10.1145/3800645.3813051\">Paper<\/a> ]<\/p><p>Thanks, Mingyang!<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"m7pzr90bqw4\"><em>Today, we’re launching our home robot, Isaac 1. Deliveries will begin this fall.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>US $500 per month, with some basic task autonomy, plus teleoperation.<\/p><p>[ <a href=\"https://www.weaverobotics.com/isaac-1\">Weave Robotics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"tv90gfm9rao\">A couple of things from this new Figure video: Thing one is that the cart-pulling is a good illustration of how clumsy humanoid robots still are at basic tasks relative to humans. Thing two is that there are absolutely no humans anywhere near these robots. You can see one guy at 0:19, which I can only assume is an accident, because these robots are not safe to be around from an industrial safety perspective.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.figure.ai/news/f-03-at-bmw\">Figure<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"5mhop2g4e4u\">Our very own Kohava Mendelsohn met some robots at ICRA in Vienna, and only one of them was murderous.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://2026.ieee-icra.org/\">ICRA 2026<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"ipyxwelid9q\"><em>Welcome to Robot Park, where we’re building the future with Apollo 2. Robot Park is where Apollo learns today, getting the experience needed to make a difference tomorrow. Today we’re announcing Robot Park, our nearly 90,000-square-foot facility where Apollo 2 is collecting real-world training data needed to advance autonomous humanoid robots. <\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://apptronik.com/news-collection/welcome-to-robot-park-where-apptroniks-apollo-goes-to-work\">Apptronik<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"mrlbqt5tkh4\"><em>UBTech Robotics, the world’s first publicly traded humanoid robot-maker, has launched a humanlike robot that features lifelike silicone skin and “emotional AI,” as Chinese tech firms increasingly transition robots from the factory floor to the family living room.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.scmp.com/tech/tech-trends/article/3358884/ubtechs-lifelike-humanoid-robots-built-companionship-arriving-homes-across-china\">SCMP<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"xdq8yzehviy\"><em>Spherephones are redefining how we experience sound. Created at Georgia Tech, this wearable uses spatial audio to alert users to movement from every direction—including behind and below. Built for safer human-robot collaboration, the technology is expanding into gaming and accessibility applications. See how music is becoming a new language for awareness and interaction.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://research.gatech.edu/feature/spherephones\">Georgia Tech<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"6dme3jyj3hg\"><em>Humanoid robots are meant to carry out long-horizon autonomous missions in a world built for humans. This is hard. These missions consist of many steps, each of which requires them to perceive, navigate, and interact with the environment. This is exactly Flexion’s goal: building the general-purpose intelligence that turns any robot into a useful helper.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://flexion.ai/news/flexion-reflect-v1.0\">Flexion<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"lttnht-y47m\"><em>We’re introducing KinetIQ Ascend—our reinforcement-learning approach designed to reach 99.9 percent manipulation reliability at human speed and beyond.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://thehumanoid.ai/technology/kinetiq-ascend/\">Humanoid<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"hsmj7__elk0\"><em>Dr. Sebastian “Basti” Scherer has worked in field robotics since the first DARPA Grand Challenge in 2004. He runs the AirLab at Carnegie Mellon’s Robotics Institute and is the director of safe embodied AI at FieldAI. While much of the industry is focused on local skills like tabletop manipulation, Dr. Scherer sees the greatest value in solving dirty, dull, and dangerous tasks that require operating in uncertain environments where the robot needs to “just work.” When robots “just work,” they become less like robots and more like tools. “That’s the big challenge that we have to overcome,” he says. “And that’s the challenge that FieldAI is really primed to solve.”<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.fieldai.com/\">FieldAI<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"omzfvmtwsjc\">Look, I really appreciate how valuable robots like ElliQ can be, and robots that do good work and offer a financial benefit are incredibly important, especially in the context of family care. But in my opinion, you really shouldn’t suggest that a robot with FaceTime or whatever is an equal replacement for in-person human companionship, nor should you suggest that AI can replace a human wellness coach. If you can’t afford those things, then sure, ElliQ can offer some of those capabilities in a very limited way, but that’s all.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://elliq.com/\">ElliQ<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"gz4frehicfe\">Very cool moves! Now get a job!<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.deeprobotics.cn/en\">DEEP Robotics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"r6f8bztjqfg\"><em>Drawing inspiration from restaurant waiters in Morocco and Turkey, among other places, we equip a robot with a hanging tray to transport objects from one location to another without dropping them or spilling their contents. We incorporate this approach into an interactive robot waiter demonstration, which uses computer vision and visual servoing to steer toward a person with a raised hand to serve them.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://arxiv.org/abs/2606.10039\">Paper<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"qfsmncdh9lu\">If you’re going to make robots wear skirts or shorts or pants, you have to give them butts, or it’s just not going to work. That is all.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://techshare.co.jp/product/unitree/g1/\">TechShare<\/a> ] via [ <a href=\"https://www.youtube.com/@KazumichiMoriyama\">Kazumichi Moriyama<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"kfy7d-qiyjw\"><em>It’s Los Alamos, so of course we have robots. Some work inside gloveboxes, while others probe unexploded ordnance in the field and aid with repetitive lifting, Doc Ock–style. Legend has it there’s a fro-yo robot in the cafeteria.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.lanl.gov/media/publications/national-security-science/1224-sniffing-out-radiation\">LANL<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"8aiznj4cciu\">Here are a couple of talks from the recent Humanoids Summit in Japan, from Ali Agha of FieldAI as well as Hiroshi Ishiguro.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p class=\"shortcode-media shortcode-media-youtube\"> <span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span> <\/p><p>[ <a href=\"https://humanoidssummit.com/agenda-2\">Humanoids Summit<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div>"}, {"title": "Apptronik unveils Apollo 2 and a flagship data collection and training facility", "source": "Robotics Business Review", "date": "2026-07-01", "url": "https://www.therobotreport.com/apptronik-unveils-apollo-2-flagship-data-collection-training-facility/", "summary": "<p>Built as a data collection and training platform, Apollo 2 enables continuous learning through deployment, Apptronik said.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/apptronik-unveils-apollo-2-flagship-data-collection-training-facility/\">Apptronik unveils Apollo 2 and a flagship data collection and training facility<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "We know how to build smarter robots. Now, we need to learn smarter ways to test them", "source": "Robotics Business Review", "date": "2026-06-27", "url": "https://www.therobotreport.com/we-know-how-to-build-smarter-robots-now-we-need-to-learn-smarter-ways-to-test-them/", "summary": "<p>Atharv Kolhar, a staff test automation engineer at Figure AI, says the robotics industry needs a testing philosophy that scales alongside autonomy. <\/p>\n<p>The post <a href=\"https://www.therobotreport.com/we-know-how-to-build-smarter-robots-now-we-need-to-learn-smarter-ways-to-test-them/\">We know how to build smarter robots. Now, we need to learn smarter ways to test them<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Video Friday: Give Robots a Hand", "source": "IEEE Spectrum Robotics", "date": "2026-06-26", "url": "https://spectrum.ieee.org/video-friday-robot-grippers", "summary": "<img src=\"https://spectrum.ieee.org/media-library/three-fingered-robotic-gripper-arm-crawls-upright-on-a-white-table.gif?id=67036633&amp;width=1245&amp;height=700&amp;coordinates=0%2C0%2C0%2C0\" /><br /><br /><p><span>Video Friday is your weekly selection of awesome robotics videos, collected by your friends at <\/span><em>IEEE Spectrum<\/em><span> robotics. We also post a weekly calendar of upcoming robotics events for the next few months. Please <\/span><a href=\"mailto:automaton@ieee.org?subject=Robotics%20event%20suggestion%20for%20Video%20Friday\">send us your events<\/a><span> for inclusion.<\/span><\/p><h5><a href=\"https://roboticsconference.org/\">RSS 2026<\/a>: 13–17 July 2026, SYDNEY<\/h5><h5><a href=\"https://mrs.fel.cvut.cz/summer-school-2026/\">Summer School on Multi-Robot Systems<\/a>: 29 July–4 August 2026, PRAGUE<\/h5><h5><a href=\"https://actuate.foxglove.dev/\">Actuate 2026<\/a>: 18–19 August 2026, SAN FRANCISCO<\/h5><h5><a href=\"https://2026.ieee-iros.org/\">IROS 2026<\/a>: 27 September–1 October 2026, PITTSBURGH<\/h5><p>Enjoy today’s videos!<\/p><div class=\"horizontal-rule\"><\/div><div><span style=\"display: none;\"> <\/span><\/div><p class=\"rm-anchors\" id=\"yfjuag9w2hg\">The best way of introducing a new <a href=\"https://spectrum.ieee.org/dlr-super-robust-robot-hand\" target=\"_blank\">robot hand<\/a> is to have a disembodied one crawling across a table.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.tangentrobotics.ai/\">Tangent Robotics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"auamgssnyqm\"><em>MIT CSAIL’s Improbable AI Lab Director Pulkit Agrawal explains his “SoftMimic” approach to making robots safer around humans.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://arxiv.org/abs/2510.17792\">SoftMimic<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"uskdotwb0k4\">I now have absolutely no interest in a humanoid robot for my home unless it can do this.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.pndbotics.com/\">PNDbotics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"ueon0tm0jzs\"><em>The <a href=\"https://spectrum.ieee.org/video-friday-heavy-lift-drones\" target=\"_blank\">DARPA Lift Challenge<\/a> is open to the public August 6-9, 2026, at the National Museum of the US Air Force.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.darpa.mil/research/challenges/lift\">DARPA<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"76cusj01dn8\"><em>Getting Digit to step and shuffle around an obstacle on the floor is a real test of reactive footstep planning. Digit has to spot something small and moving, recalculate where to place each foot, and keep working—all without breaking stride or losing balance. That’s the same dynamic footwork Digit uses to navigate clutter and foot traffic on a real warehouse floor.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.agilityrobotics.com/\">Agility Robotics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"9lgujrgb_kq\">This is the most aggressive <a href=\"https://spectrum.ieee.org/firefighting-robot-snake-flies-on-jets-of-water\" target=\"_blank\">firefighting robot<\/a> I’ve ever seen.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.deeprobotics.cn/en\">DEEP Robotics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"rio7kurb53o\">Wait a sec, Dusty can print things on floors besides construction layouts? How is this not in every city, making sidewalks exciting and fun everywhere?!<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.dustyrobotics.com/\">Dusty<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"mtmyfvd4zcw\">I am the first to admit that for US $4,900, the performance of the Unitree R1 is very impressive. But what is it going to do out in the world such that it will give you some sort of return on that investment?<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.unitree.com/R1\">Unitree R1<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"ij93ftr3hqe\">Event cameras are extraordinarily powerful because they can see motion, but what if everything is moving because your camera is moving? Oh no!<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://rpg.ifi.uzh.ch/\">University of Zurich Robotics & Perception Group<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"hleaklk4ixm\"><em>Can we understand whale behavior and language? Harvard SEAS Professor Stephanie Gil explains the possibility of understanding animal language and behavior using AI-driven robots and machine learning.  With ongoing whale research and advancements in artificial intelligence, the potential for animal communication with whales could become a tangible reality.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://react.seas.harvard.edu/\">Harvard SEAS<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"upxxhr8r7-a\"><em>Rodney Brooks, founder and chief technology officer of Robust.AI, sits down with Forbes Assistant Managing Editor Kerry Dolan to discuss how he came up with the idea of the Roomba vacuum cleaner and the future of robotics.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.linkedin.com/posts/rodney-brooks-1a137517_how-ants-inspired-this-founder-to-build-a-activity-7475766254587387904-ZsL9/\">LinkedIn<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"h_dtuu5jl3g\">Here are a couple of interesting presentations from UIST 2025, including everyday objects that move around your home with a mind of their own and a project featuring teamwork between helium balloons and ground robots called Buoyancé.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p class=\"shortcode-media shortcode-media-youtube\"> <span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://programs.sigchi.org/uist/2025\">UIST 2025<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div>"}, {"title": "Humanoid maker Agility Robotics to go public through SPAC merger", "source": "Robotics Business Review", "date": "2026-06-24", "url": "https://www.therobotreport.com/humanoid-maker-agility-robotics-go-public-through-spac-merger/", "summary": "<p>Agility Robotics will merge with Churchill Capital Corp XI, raising $620 million to advance Digit v5 and fulfill growing customer orders.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/humanoid-maker-agility-robotics-go-public-through-spac-merger/\">Humanoid maker Agility Robotics to go public through SPAC merger<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "The Secret to Marathon-Winning Humanoid Robots", "source": "IEEE Spectrum Robotics", "date": "2026-06-17", "url": "https://spectrum.ieee.org/china-humanoid-robot-marathon", "summary": "<img src=\"https://spectrum.ieee.org/media-library/a-red-and-black-humanoid-runs-alone-through-a-marathon-course.jpg?id=66940897&amp;width=1245&amp;height=700&amp;coordinates=0%2C66%2C0%2C66\" /><br /><br /><p>On 19 April 2026, the <a href=\"https://www.cnn.com/2026/04/19/china/china-robot-half-marathon-intl-hnk\" rel=\"noopener noreferrer\" target=\"_blank\">Honor Lightning humanoid robot ran a half-marathon in 50 minutes and 26 seconds<\/a>, beating the human world record by 7 minutes and the best robot time from 2025 by almost 2 hours.<\/p><p>How did Honor do it? Is there some magical technology or technique that unlocked this performance? How did the company beat the significantly better-known Unitree (which reportedly had to supply its robot with an ice backpack to try and complete the race without overheating)? My doctoral thesis involved <a href=\"https://www.avikde.me/p/phd-defense\" rel=\"noopener noreferrer\" target=\"_blank\">building and controlling hopping and running robots<\/a>, and <a href=\"https://www.avikde.me/p/ghost-robotics-minitaur\" rel=\"noopener noreferrer\" target=\"_blank\">since then I’ve tried to design and build efficient commercial legged robots<\/a>, giving me a decent idea of the constraints involved. In this article, we take a look at the fundamental underlying constraints to try and answer these questions.<\/p><h3>The Physics of Running<\/h3><p><a href=\"https://spectrum.ieee.org/ai-institute\" target=\"_blank\">Running<\/a> consists of alternating phases of a leg pushing against the ground (“stance phase”) and the body flying through the air (“aerial phase”). In the aerial phase, the body falls due to gravity, losing vertical momentum. The leg in stance phase pushes against the ground to redirect the vertical momentum upward, while the other leg swings forward to reposition for the next foothold.<\/p><p><a href=\"https://spectrum.ieee.org/ev-motor\" target=\"_blank\">Electric motors<\/a> use energy to produce torque—the higher the torque, the more energy is lost as heat. Adding a gear train after the motor amplifies its torque and reduces its speed. A large reduction helps with torque production, but since the rotor of the motor itself has to spin faster, it becomes very sluggish at accelerating its output. This is obviously bad for the swing phase described above. These competing effects mean that for a particular motor, there is usually a sweet spot for the gear ratio:<\/p><p class=\"shortcode-media shortcode-media-rebelmouse-image\"> <img alt=\"A graph showing the relationship between gearing and motor efficiency, with an optimal gearing ratio in the relationship between stance and swing.\" class=\"rm-shortcode\" id=\"10bd7\" src=\"https://spectrum.ieee.org/media-library/a-graph-showing-the-relationship-between-gearing-and-motor-efficiency-with-an-optimal-gearing-ratio-in-the-relationship-between.jpg?id=66940901&amp;width=980\" /> <small class=\"image-media media-caption\">The power consumed by a robot leg is minimized at an optimal gear ratio (30:1 in this example).<\/small><small class=\"image-media media-photo-credit\">Avik De/Datawrapper<\/small><\/p><h3>How Honor Did It<\/h3><p>While the Lightning’s motor specifications are not published, the hip and knee motors roughly have a 110-to-150-millimeter outer diameter. For an approximate set of motor parameters, I looked to the <a href=\"https://www.tq-group.com/en/products/tq-robodrive/servo-kits/ilm115x25/\" target=\"_blank\">ILM115x25 motor<\/a> due to its relevant size and detailed specifications.<\/p><p>We can use a simple physics model to estimate the power consumption for running at 7 meters per second (the Lightning’s average half-marathon speed) as gear ratio varies:<\/p><p class=\"shortcode-media shortcode-media-rebelmouse-image\"> <img alt=\"A graph showing that optimal gearing for a robot\\u2019s motor dissipates the amount of heat that the motor generates.\" class=\"rm-shortcode\" id=\"185f3\" src=\"https://spectrum.ieee.org/media-library/a-graph-showing-that-optimal-gearing-for-a-robot-u2019s-motor-dissipates-the-amount-of-heat-that-the-motor-generates.jpg?id=66940912&amp;width=980\" /><small class=\"image-media media-caption\">The light blue curve shows how to pick the optimal gearing (45:1). The dark blue curve shows how much heat will be produced in the knee motor, ~150W for the optimal gearing.<\/small><small class=\"image-media media-photo-credit\">Avik De/Datawrapper<\/small><\/p><p>We see that the drivetrain is not magical: with a gear ratio <em><em>chosen for this task<\/em><\/em> (we’ll return to this below), the approximate robot power consumption would be a very reasonable 400 watts.<\/p><p>However, the dissipated knee power ( typically the main thermal limiting factor) is approximately 150 W. This is almost an unavoidable consequence—running at human speeds with a humanoid-size robot will inevitably generate this amount of heat! Over a prolonged period, keeping the motor from overheating would be a challenge, but the Lightning has a <a href=\"https://eu.36kr.com/en/p/3775418378027520\" target=\"_blank\">trick up its sleeve<\/a>:<\/p><blockquote>According to Honor, the liquid-cooling pipes penetrate deep into the motors like capillaries. The high-power liquid pump has a heat-exchange flow rate of more than 4 liters per minute. Each of the four drive motors in the lower limbs is equipped with an independent liquid-cooling circuit.<\/blockquote><p>Liquid cooling is not new, but it’s definitely not a commodity. It has shown up in research periodically, and on the commercial side <a href=\"https://apptronik.com/news-collection/apptronik-readies-its-humanoid-robot-for-a-summer-unveil\" target=\"_blank\">Apptronik tried it for a few of its prototypes<\/a> but (to my knowledge) does not use it on its main <a href=\"https://apptronik.com/apollo\" target=\"_blank\">Apollo<\/a> platform. Basic air-convection-based cooling would not continuously be able to extract 150 W out of the knee motor, and so the cooling technology is a key enabler of this type of performance.<\/p><h3>Why Others Couldn’t Compete<\/h3><p>Why did Honor’s competitors, including more <a href=\"https://www.forbes.com/sites/johnkoetsier/2026/01/09/top-10-humanoid-robot-companies-by-shipments-revealed/\" target=\"_blank\">established and widely shipped humanoids<\/a> such as from <a href=\"https://www.unitree.com/g1\" target=\"_blank\">Unitree<\/a> or <a href=\"https://www.agibot.com/\" target=\"_blank\">Agibot<\/a>, not compete as well?<\/p><p>We can use the same model to generate an equivalent energetics plot for walking at 1.5 m/s, a much more modest but potentially more common activity for a commercial humanoid robot:<\/p><p class=\"shortcode-media shortcode-media-rebelmouse-image\"> <img alt=\"A graph showing that robots with gear ratios optimized for running or walking are inefficient when walking or running respectively.\" class=\"rm-shortcode\" id=\"616f5\" src=\"https://spectrum.ieee.org/media-library/a-graph-showing-that-robots-with-gear-ratios-optimized-for-running-or-walking-are-inefficient-when-walking-or-running-respective.jpg?id=66940939&amp;width=980\" /> <small class=\"image-media media-caption\">The solid and dashed light blue lines show a running-optimized design, while green lines show a walking-optimized design. The optimal ratio for walking is much lower (30:1 vs. 45:1). However, the power dissipated in the knee motor while running [dark blue] is much higher at 30:1 vs. 45:1—the price to pay for running with a walking-optimized design.<\/small><small class=\"image-media media-photo-credit\">Avik De/Datawrapper<\/small><\/p><p>The plot adds a new green curve for the walking power, and the optimal gearing is significantly different!<\/p><p>Let’s say you design your robot to excel at the normal walking task and choose the green design with 30:1 gearing. The knee motor power to run a half marathon is over 300 W (red arrow), more than two times what we had with the running-optimized design. It wouldn’t be so surprising to need ice packs!<\/p><p>Conversely, visually following the green curve shows that the running-optimized robot wastes more power for walking. Using larger motors sized for running increases the weight of the robot and wastes power when it is standing or walking. The larger motors also pose practical issues like bumping into objects while operating in homes or factories.<\/p><h3>Closing Thoughts<\/h3><p>Honor’s half-marathon performance was an impressive engineering effort and result. It didn’t need any magical leaps in technology, but
