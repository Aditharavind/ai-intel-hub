d <a href=\"https://spectrum.ieee.org/video-friday-humanoid-robot-running\" target=\"_blank\">on the pitch<\/a>).<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://bostondynamics.com/\">Boston Dynamics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"vxfnou7kf6y\"><em>No teleoperation. No cuts. Long take. One of the world’s few complete demonstrations of long-horizon mobile manipulation, bringing fully autonomous humanoid robots another step closer to us.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.limxdynamics.com/en\">LimX<\/a> ]<\/p><p>Thanks, Jinyan!<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"ytq2o5gcu3w\">Impressive. But get a job.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.magiclab.top/en/\">MagicLab<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"w3n009ayfhq\">We saw some footage of this <a href=\"https://spectrum.ieee.org/video-friday-robot-world-cup\" target=\"_blank\">last week<\/a>, but here’s a much better video.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><blockquote><em>Wing-propelled diving birds flap their wings to move through air and water, yet the wing morphology and kinematics that enable this behavior remain poorly understood because of the difficulty of collecting in situ data. The impact of flapping frequency, wing size, and stiffness on locomotion in—and transition between—the two media are still unknown. We compared data from diving birds against experiments using a flapping-wing robot capable of flying, swimming, plunge diving, and exiting the water. We show that frequency adaptation, flexible wings, and powerful actuation enable seamless transitions without folding wings or legs, that large wings enhance flight without substantially reducing underwater efficiency, and that tail-body distance and egress angle affect water exit. These results clarify how birds (and robots) balance multifluid locomotion constraints.<\/em><\/blockquote><p>[ <a href=\"https://dspace.mit.edu/entities/publication/a8ca74c5-9e2a-42f3-9ddf-636701e91ae2\">EPFL LIS<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div>"}, {"title": "Weave Robotics launches Isaac, its first mobile humanoid robot", "source": "Robotics Business Review", "date": "2026-07-17", "url": "https://www.therobotreport.com/weave-robotics-launches-isaac-first-mobile-humanoid-robot/", "summary": "<p>Weave Robotics has listed the features of its Isaac wheeled bimanual manipulator robot for household and office use.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/weave-robotics-launches-isaac-first-mobile-humanoid-robot/\">Weave Robotics launches Isaac, its first mobile humanoid robot<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "This Graduate Student Equips NASA’s Robots With Assembly Skills", "source": "IEEE Spectrum Robotics", "date": "2026-07-17", "url": "https://spectrum.ieee.org/graduate-student-nasas-robots-assembly", "summary": "<img src=\"https://spectrum.ieee.org/media-library/a-young-woman-with-blonde-hair-softly-smiling-next-to-a-pair-of-collaborative-robot-arms.jpg?id=67499761&amp;width=1245&amp;height=700&amp;coordinates=0%2C156%2C0%2C157\" /><br /><br /><p>Like many engineers, <a href=\"https://www.linkedin.com/in/sarahdownsprofile\" rel=\"noopener noreferrer\" target=\"_blank\">Sarah Downs<\/a> says she knew she wanted to pursue a STEM career from a young age. As a teenager, she discovered <a href=\"https://spectrum.ieee.org/topic/robotics/\" target=\"_self\">robotics<\/a> through her Tulsa, Okla., middle school’s <a href=\"https://www.firstlegoleague.org/\" rel=\"noopener noreferrer\" target=\"_blank\">First Lego League<\/a> team, and she fell in love with the field, she says. Downs participated in the international robotics program from 2014 to 2016.<\/p><p>Watching <a href=\"https://www.pbs.org/\" rel=\"noopener noreferrer\" target=\"_blank\">PBS<\/a> specials on <a href=\"https://www.nasa.gov/\" rel=\"noopener noreferrer\" target=\"_blank\">NASA<\/a> Mars rovers <a href=\"https://spectrum.ieee.org/mars-for-the-rest-of-us\" target=\"_self\"><em><em>Spirit<\/em><\/em><\/a><em> <\/em>and <a href=\"https://spectrum.ieee.org/video-friday-opportunity-celebrates-10-years-on-mars\" target=\"_self\"><em><em>Opportunity<\/em><\/em><\/a>, and seeing the live broadcast of the <a href=\"https://spectrum.ieee.org/if-necessary-mars-rover-curiosity-could-rip-its-own-wheels-off-to-stay-mobile\" target=\"_self\"><em><em>Curiosity<\/em><\/em><\/a> rover launch in 2011, inspired the teen to dream of a career working with NASA.<\/p><h3>Sarah Downs<\/h3><br /><p><strong>MEMBER GRADE<\/strong><\/p><p>Graduate student member<\/p><p><strong>UNIVERSITY <\/strong><\/p><p>Texas A&amp;M University in College Station<\/p><p><strong>MAJOR <\/strong><\/p><p>Electric engineering<\/p><h3><\/h3><br /><p>This year the IEEE graduate student member achieved that dream. For her final project as a master’s degree candidate in electrical engineering at the <a href=\"https://utulsa.edu/\" target=\"_blank\">University of Tulsa<\/a>, she worked on an algorithm in collaboration with NASA and the U.S. <a href=\"https://www.airforce.com/en\" target=\"_blank\">Air Force<\/a>.<\/p><p>The algorithm she developed enables a robot assembling satellites in space to insert an antenna into the correct spot, addressing robotics’s classic peg-in-hole problem of inserting an object into its corresponding hole.<\/p><p>Now a Ph.D. student in electrical engineering at <a href=\"https://www.tamu.edu/index.html\" target=\"_blank\">Texas A&amp;M University<\/a> in College Station, Downs is continuing her research on satellite assembly and manipulation “but on a much larger scale,” she says.<\/p><h2>Following a childhood passion<\/h2><p>Downs grew up in the Tulsa area. Her father, who died from a heart attack in 2015 when she was 13, was a safety advisor in the oil and gas industry. Her mother stayed home to take care of her brother, who has autism. After her father died, her mother went back to college to earn a bachelor’s degree in business so she could support the family.<\/p><p>“We didn’t have much income, and my mom was always worried about money,” Downs says. “That made me more aware of having a successful career, in a monetary sense.”<\/p><p>From then on, whenever she considered her future career, having a decent salary to support the family was high on her list.<\/p><p>By pursuing a career in robotics, she says, she can follow her passion while obtaining financial security.<\/p><p>In high school, Downs joined the <a href=\"https://www.firstinspires.org/\" rel=\"noopener noreferrer\" target=\"_blank\">First<\/a> robotics club, where she found herself drawn to the electrical components used in the machines she and her classmates built.<\/p><p>During her final two years of high school, she participated in an <a href=\"https://tulsatech.edu/full-time-programs/science-technology-engineering-and-mathematics/pre-engineering/\" rel=\"noopener noreferrer\" target=\"_blank\">extension program<\/a> at <a href=\"https://tulsatech.edu/\" rel=\"noopener noreferrer\" target=\"_blank\">Tulsa Tech<\/a>, a training school. She spent half her day in high school classes and the other half taking engineering courses at the vocational school.<\/p><p>After graduating in 2020, she accepted scholarships to attend the University of Tulsa. She began her freshman year at UTulsa not knowing whether she wanted to major in electrical or mechanical engineering, she says, adding that her love of working with small systems helped her choose EE.<\/p><p>For her <a href=\"https://utulsa.edu/news/celebrating-student-innovation-tus-role-in-tasms-new-exhibits/\" rel=\"noopener noreferrer\" target=\"_blank\">senior year capstone project<\/a>, she and two of her classmates designed a lunar lander exhibit for the <a href=\"https://www.tulsamuseum.org/\" rel=\"noopener noreferrer\" target=\"_blank\">Tulsa Air and Space Museum<\/a>. They created an interactive game that simulates missions on lunar and martian surfaces. Four celestial bodies—the moon, Venus, Mars, and Titan—are listed across three computer monitors. Using a game controller, museum visitors can explore the virtual surface of each one. The <a href=\"https://www.linkedin.com/feed/update/urn:li:activity:7207091982790266880/\" rel=\"noopener noreferrer\" target=\"_blank\">exhibit<\/a> is still on display.<\/p><p>Downs earned her bachelor’s degree in electrical engineering in 2024 and continued her education at the university’s EE master’s degree program.<\/p><h2>Both more and less complicated than people think<\/h2><p>When Downs began her graduate studies, she was supposed to be part of a NASA robotics project for two years. But when a delay in government funding postponed the project’s start, she instead spent her first year in the school’s <a href=\"https://utulsa.edu/research/robotics-institute/\" rel=\"noopener noreferrer\" target=\"_blank\">Institute for Robotics and Autonomy<\/a>, then newly launched. Its main focus is developing robots to assist people who have mobility challenges.<\/p><p>Inspired by her grandmother, who was wheelchair-bound due to severe arthritis, Downs developed a robotic arm that helps older people and wheelchair users live independently. The arm was able to identify and place objects in the appropriate locations inside the home, such as unloading certain groceries from a shopping bag and placing them on a shelf or in separate containers.<\/p><p>Before the start of her sophomore year in 2025, the NASA project finally secured government funding. She developed a robot that achieves the peg-in-hole task without using any vision systems. Typically, cameras help guide robots’ satellite-assembly work. But in the harsh, remote environment of outer space, cameras might malfunction or encounter delays.<\/p><h3><\/h3><br /><p>“Don’t stop asking questions. Especially in engineering, don’t pretend like you know everything, because science is about constantly wanting to learn and listen.”<\/p><h3><\/h3><br /><p>Rather than using cameras, Downs’s robotic arm deploys a force-based insertion process to sense position and orientation of objects in the arm’s environment. The robot loosely grips an antenna and, with a torque sensor on its gripper, “feels” the force feedback of where the satellite and antenna are in relation to each other. The robot then guides the antenna assembly into a target opening on its satellite and maintains the position during adhesion.<\/p><p>Adding to the complexity, the robot performs its task in zero gravity.<\/p><p>“Without gravity, you now have to consider the arm’s reaction torques on the satellite to avoid flinging it into space,” Downs says. Any motion from the arm during the insertion process, especially from increased forces, could cause the satellite to continue movement in that direction.<\/p><p>To combat that, Downs is performing calculations for the project to direct targeted reverse thrusts and counter the force of the robot’s motions.<\/p><p>Her graduate project captures the simple yet complex nature of robotics that she finds fascinating, she says.<\/p><p>“I think robots are both more and also less complicated than people think,” she says. “Really, all you need to start programming a robot is its <a href=\"https://www.universal-robots.com/developer/hardware-and-motion/robot-motion-dh-parameters/\" target=\"_blank\">Denavit-Hartenberg parameters<\/a>, and you can do a lot with that,” she says, referencing the four values used to describe the position and orientation of a robotic arm and manipulators. Even with different grippers and degrees of freedom, “fundamentally, all robot manipulators start there,” she says.<\/p><p>“But,” she adds, “we’re still learning so much about how robots interact with their environment. Even something simple to us, like manipulating a pen, is still incredibly complex for robots.”<\/p><p>Downs is completing her doctoral thesis in the <a href=\"https://rad.engr.tamu.edu/robotic-space-simulator/\" rel=\"noopener noreferrer\" target=\"_blank\">Robotic Space Simulator<\/a> project at Texas A&amp;M’s <a href=\"https://rad.engr.tamu.edu/\" rel=\"noopener noreferrer\" target=\"_blank\">Robotics and Automation Design (RAD) Lab<\/a>, which specializes in developing machines that can survive in extreme environments. It collaborates with NASA.<\/p><p>Her thesis advisor is <a href=\"https://spectrum.ieee.org/video-friday-punch-out\" target=\"_self\">Robert Ambrose<\/a>, a NASA veteran who launched the RAD Lab in 2022. The IEEE member is set to serve as associate director of the school’s Space Institute, due to open this year in Houston. The research facility is being built next to the <a href=\"https://www.nasa.gov/johnson/\" rel=\"noopener noreferrer\" target=\"_blank\">Johnson Space Center<\/a>.<\/p><p>After earning her Ph.D., Downs says, she hopes to one day work for NASA, developing rovers that collect samples from Mars or robotic arms that perform tasks on space stations.<\/p><p>To learn more about robots, check out <em>IEEE Spectrum<\/em>’s <a href=\"https://robotsguide.com/about\" rel=\"noopener noreferrer\" target=\"_blank\">guide<\/a>.<\/p><h2>Getting out of the engineering bubble<\/h2><p>Downs joined <a href=\"https://www.ieee.org/\" rel=\"noopener noreferrer\" target=\"_blank\">IEEE<\/a> in 2020 as a freshman at UTulsa to get more involved in electrical engineering events on campus. At the time, the <a href=\"https://spectrum.ieee.org/tag/covid-19\" target=\"_self\">COVID-19 pandemic<\/a> kept clubs and organizations from meeting in person.<\/p><p>She was active in her school’s <a href=\"https://utulsa.edu/academics/engineering-computer-science/academics/departments/electrical-computer-engineering/institute-of-electronics-and-electrical-engineers-ieee/\" rel=\"noopener noreferrer\" target=\"_blank\">IEEE student branch<\/a> and was elected as its 2022–2024 president. Under her leadership, the branch went from having a few events to hosting one every two weeks.<\/p><p>They included lunch-and-learn sessions and dinners that connected students with professional engineers and the university’s alumni. Downs also organized hands-on workshops on soldering, <a href=\"https://spectrum.ieee.org/lunar-base-3d-printing\" target=\"_self\">3D printing<\/a>, CAD modeling, and <a href=\"https://spectrum.ieee.org/be-a-polarizing-job-seeker\" target=\"_self\">résumé-building<\/a>.<\/p><p>Her efforts helped increase the branch’s executive board membership from roughly five students to 25 in 2023. The same year, her soldering workshop attracted about 80 students.<\/p><p>She says she enjoyed working with IEEE, especially “engaging with alumni and learning from engineers.”<\/p><p>IEEE is a great resource for networking opportunities, she says, noting that “during the COVID-19 pandemic, engineering students stayed in their bubbles.” IEEE events helped the students make connections that could serve them well, she says.<\/p><p>“Networking is very important, especially in today’s tough job market,” she says. “It’s a lot about who you know and how people observe your work ethic.”<\/p><p>Downs, who now serves as an IEEE graduate advisor for UTulsa’s student branch, says she has seen firsthand how the school’s student branch network has benefited its student members.<\/p><p>“A lot of them have found jobs” because of IEEE, she says.<\/p><h3>The working and networking of an engineer<\/h3><br /><p>As the IEEE graduate advisor for UTulsa’s student branch, Downs noticed that many engineering undergraduates finish college without any <a href=\"https://spectrum.ieee.org/hands-on-projects-career-advice\" target=\"_self\">hands-on experience<\/a>, whether it be a project or an internship.<\/p><p>“Their résumés are very sparse, and they have no proof of their technical skills,” she says. She herself completed a facilities engineering internship at <a href=\"https://flytulsa.com/\" target=\"_blank\">Tulsa International Airport<\/a>’s <a href=\"https://www.google.com/aclk?sa=L&amp;ai=DChsSEwiakeLTiIqVAxWRzsIEHX4aO3UYACICCAEQABoCcHY&amp;ae=2&amp;co=1&amp;ase=2&amp;gclid=CjwKCAjwxb7RBhA5EiwAQ-AAdIuO_CE21RKvxNvZKxWXCYpo9d0-vpx3D3XClr2XRTWwP13SUuMbKhoCzuIQAvD_BwE&amp;ei=RV4waqKnFs-G0PEPpMyjoAg&amp;cid=CAASZuRoVbgIgx56926ScONp0UCppyfOxCgiUjlNwIYIyRNwiPfCRnB-35o-3qx5zfez3l5RTJDkwOw_SW-pvC4ORqwKrbj2g4yojyTEu490Veitl0o0gJG9sB38UMie-GYDrIURjI2CPw&amp;cce=2&amp;category=acrcp_v1_71&amp;sig=AOD64_2LzW3O1QygURf8h7S57YqN5jIk3A&amp;q&amp;sqi=2&amp;nis=4&amp;adurl&amp;ved=2ahUKEwji3dfTiIqVAxVPAzQIHSTmCIQQ0Qx6BAgNEAE\" rel=\"noopener noreferrer\" target=\"_blank\">American Airlines<\/a> maintenance facility after her sophomore year of college. And she was an electrical engineering intern at <a href=\"https://www.flightsafety.com/\" rel=\"noopener noreferrer\" target=\"_blank\">Flight Safety International<\/a> outside Tulsa after her junior year and after she graduated. The company designs, builds, and maintains its own flight simulators.<\/p><p>Her advice to undergraduates is to hone and demonstrate both their hard and soft skills by working on research projects or even personal passion projects.<\/p><p>“A <a href=\"https://www.raspberrypi.com/\" rel=\"noopener noreferrer\" target=\"_blank\">Raspberry Pi<\/a> doesn’t cost that much, and you can start working with that immediately,” she says. Students also can take part in engineering interest groups and professional organizations at their school, she adds.<\/p><p>“Put yourself out there and join a research team,” she says. “It’s a great way to show people that you’re a good person to work with and you’d do a good job in the field.”<\/p><p>She adds that it’s also a fine way to keep learning—which is what drew her to a field that has developed only within the past century.<\/p><p>“We’re still constantly learning about robots,” she says.<\/p><p>“Don’t stop asking questions,” she advises students. “Especially in engineering, don’t pretend like you know everything, because science is about constantly wanting to learn and listen.”<\/p>"}, {"title": "Founder of Maximo discusses how robotics is accelerating solar construction", "source": "Robotics Business Review", "date": "2026-07-17", "url": "https://www.therobotreport.com/transforming-solar-construction-through-robotics-deise-yumi-asami-maximo/", "summary": "<p>Maximo founder Deise Yumi Asami discusses the process of automating solar construction with robotics.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/transforming-solar-construction-through-robotics-deise-yumi-asami-maximo/\">Founder of Maximo discusses how robotics is accelerating solar construction<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Lockheed Martin taps Machina’s robots for mission-critical missile parts", "source": "Robotics Business Review", "date": "2026-07-16", "url": "https://www.therobotreport.com/lockheed-martin-taps-machinas-robots-for-mission-critical-missile-parts/", "summary": "<p>Machina Labs secured a Lockheed Martin contract to qualify robotically formed metal components for the JASSM missile program.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/lockheed-martin-taps-machinas-robots-for-mission-critical-missile-parts/\">Lockheed Martin taps Machina’s robots for mission-critical missile parts<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Xpanner rolls out X1 Panel Lift for automated solar panel installation", "source": "Robotics Business Review", "date": "2026-07-16", "url": "https://www.therobotreport.com/xpanner-rolls-out-x1-panel-lift-automated-solar-panel-installation/", "summary": "<p>X1 Panel Lift uses existing excavators and a single workflow so solar installation crews can focus on alignment, fastening, and quality.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/xpanner-rolls-out-x1-panel-lift-automated-solar-panel-installation/\">Xpanner rolls out X1 Panel Lift for automated solar panel installation<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "How to Make an Invisible Drone", "source": "IEEE Spectrum Robotics", "date": "2026-07-16", "url": "https://spectrum.ieee.org/invisible-spinning-drone", "summary": "<img src=\"https://spectrum.ieee.org/media-library/low-visibility-drone-flying-in-front-of-an-office-plant.jpg?id=67480624&amp;width=1245&amp;height=700&amp;coordinates=0%2C62%2C0%2C63\" /><br /><br /><p><span>There are many words that I would never, ever use to describe a drone. Stealthy. Subtle. Whatever the opposite of obnoxious is. Much of this is because of the giant angry bee sound that drones tend to make, but it’s also the way that they look in flight: With uncannily linear movements and an even less canny ability to hover perfectly still, they tend to draw the eye as affronts to nature.<\/span><\/p><p>In a paper presented this week at <a href=\"https://roboticsconference.org/\" target=\"_blank\">Robotics Science and Systems 2026<\/a> in Sydney, roboticists from Northwestern University, Evanston, Ill., demonstrated a drone called Phantom Twist that is essentially invisible to humans, being an order of magnitude more difficult to see in flight than a typical quadrotor. They accomplished this with the aid of computational design, and while the resulting hardware is, I would argue, also an order of magnitude more of an affront to nature than a typical quadrotor represents, it’s pretty amazing how well it works.<\/p><p class=\"shortcode-media shortcode-media-youtube\"> <span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span> <small class=\"image-media media-caption\">Phantom Twist spins so fast, it’s practically invisible.<\/small><small class=\"image-media media-photo-credit\">Michael Rubenstein/Northwestern University<\/small><\/p><p><span>The trick here is easy to see, even if the drone isn’t. By spinning in flight at between 15 and 25 hertz, Phantom Twist takes advantage of humans’ decidedly mediocre visual system to turn a solid spinning object into an opaque smear. Human eyes take some amount of time (typically about 100 milliseconds) to integrate what we see before sending the full scene off to our brains for processing. Moving objects can cause problems for this system, because if the movement is fast enough, our eyes are forced to average that motion across the scene, combining it with whatever is in the background and resulting in a transparent blur. This effect is called persistence of vision. For something that spins like Phantom Twist, that motion blur comes from the drone’s rapid rotation, and it works because most of the drone is cleverly designed to be empty space.<\/span><\/p><p>Drones that spin in flight are nothing new—we’ve covered a bunch of them in the past, including <a href=\"https://www.modlabupenn.org/piccolissimo/\" target=\"_blank\">Picolissimo<\/a> and any number of <a href=\"https://spectrum.ieee.org/spinning-drone\" target=\"_self\">samara<\/a> <a href=\"https://spectrum.ieee.org/foldable-monocopter-drone\" target=\"_self\">drones<\/a> inspired by the spinning flight of maple seeds. What makes Phantom Twist unique, and also very odd, is that the design was computationally optimized for low visibility. <\/p><h2>Controlling how drones like this fly<\/h2><p>Before we get into that, though, a quick note about how drones like this can even fly controllably, because it’s not at all obvious. With just a single motor and no control surfaces, the only possible control input is through the motor itself, and by pulsing the motor speed up or down at just the right time during each rotation, the drone can translate in any direction. Altitude control comes from changing overall motor thrust, and the drone‘s spinning nature makes it passively stable.<\/p><p class=\"shortcode-media shortcode-media-rebelmouse-image rm-float-left rm-resized-container rm-resized-container-25\" style=\"float: left;\"> <img alt=\"A minimalist drone made of a few thin rods, wires and a miniature circuit board.\" class=\"rm-shortcode\" id=\"b2caf\" src=\"https://spectrum.ieee.org/media-library/a-minimalist-drone-made-of-a-few-thin-rods-wires-and-a-miniature-circuit-board.jpg?id=67480639&amp;width=980\" /> <small class=\"image-media media-caption\">Carbon fiber rods connect batteries, a controller, some counterweights, and a motor and propeller. The research robot also includes optical tracking tags.<\/small><small class=\"image-media media-photo-credit\">Michael Rubenstein/Northwestern University<\/small><\/p><p>The bits that you need for this kind of drone include the motor and propeller, a couple of batteries, a controller, some counterweights (which could be replaced with more batteries or payload), 0.8-mm carbon fiber rods to tie it all together, and a connector for the handheld launcher that gets the whole thing up to speed. The actual <em><em>arrangement<\/em><\/em> of these components is surprisingly flexible, and that’s where the invisibility comes in. <\/p><p>“The design space is high dimensional,” explains Northwestern’s <a href=\"https://www.mccormick.northwestern.edu/research-faculty/directory/profiles/rubenstein-michael.html\" target=\"_blank\">Michael Rubenstein<\/a>. “It’s very difficult for a human to reason through all the trade-offs between the physical constraints required for stable flight and the visual appearance of the spinning drone, and I don’t think we would have easily arrived at this low-visibility design ourselves.”<\/p><p>The visibility (or not) of Phantom Twist is primarily driven by the extent to which different components line up with each other from the perspective of someone looking at the drone. The more components that line up with each other as the drone flies, the less background you see through the spinning drone, and the more visible the drone becomes. Because you might be looking at the drone from a number of different angles, and also because the drone has to be stable enough for controlled flight, there are a bunch of different things that need to be optimized all at once, which is why computational design is effective here.<\/p><p>Phantom Twist’s final design was generated using an iterative optimizer which had a goal of minimizing a metric called <a href=\"https://eureka.patsnap.com/article/what-is-lpips-and-how-it-measures-perceptual-similarity\" target=\"_blank\">learned perceptual image patch similarity<\/a>, or LPIPS, while making sure that the design could still physically work. LPIPS is the difference between two images: a background image, and a background image with an overlay of the simulated spinning drone. The smaller that difference is, the more invisible that design is. It’s tricky for a human to consider all of the variables at once, but Rubenstein says that the final design does make intuitive sense, because “the automated pipeline prefers placements where components don’t visually overlap as it spins, or where the components are too close to the center of rotation.”<\/p><p class=\"shortcode-media shortcode-media-rebelmouse-image\"> <img alt=\"Two variations of minimalist drones made from a few thin rods, wires and a miniature circuit board. Both are barely visible when in-flight.\" class=\"rm-shortcode\" id=\"394e6\" src=\"https://spectrum.ieee.org/media-library/two-variations-of-minimalist-drones-made-from-a-few-thin-rods-wires-and-a-miniature-circuit-board-both-are-barely-visible-when.jpg?id=67480677&amp;width=980\" /> <small class=\"image-media media-caption\">Two iterations of Phantom Twist drones are shown with their handheld launching mechanisms. The better-optimized version [bottom row] relocates the launcher interface to remove components that are too close to the central axis, making them more visible.<\/small><small class=\"image-media media-photo-credit\">Michael Rubenstein/Northwestern University<\/small><\/p><p>Out of a starting set of around 20,000 feasible Phantom Twist configurations, the optimized design (the one that you see or don’t see in the pictures and videos) has a LPIPS score of 0.0104. A human-designed Phantom Twist is about twice as visible, with a LPIPS score of around 0.2, and a conventional quadrotor (of the same size) would be over 10 times more visible. And there’s still a bit more optimization that could be done with the electrical wiring as well as increasing the baseline transparency of the components themselves.<\/p><p>Phantom Twist is currently controlled using an optical tracking system, which means that it’s not yet capable of flying outside of a controlled environment. But Rubenstein has built <a href=\"https://www.roboticsproceedings.org/rss20/p102.pdf\" target=\"_blank\">other drones along similar principles<\/a> in the past, which have successfully flown outside, and he’s optimistic about using those techniques to break Phantom Twist out of the lab. The spinning behavior might even enable some useful sensing capabilities, he says. “An interesting possibility is mounting a camera on the spinning body. As the vehicle rotates, it could capture imagery in every direction, effectively creating a 360-degree view of its surroundings that could be used for onboard navigation and control.”<\/p><p>As for what a drone like Phantom Twist could be used for—assuming that the sound can be mitigated somewhat (and there are <a href=\"https://spectrum.ieee.org/pennysized-ionocraft-flies-with-no-moving-parts\" target=\"_self\">potential approaches to making that happen<\/a>), a stealthy microdrone could do all sorts of things with covert surveillance being the most obvious application. For his part, Rubenstein says that he’s personally excited about the potential for watching wildlife, “where a less-intrusive drone could observe animals while minimizing its impact on their natural behavior.” The elephants in particular <a href=\"https://spectrum.ieee.org/research-proves-drones-sound-like-bees-which-is-good-news-for-elephants\" target=\"_self\">would certainly appreciate that<\/a>.<\/p><p>For a deeper dive into all the particulars of this project, read the paper: <a href=\"https://arxiv.org/html/2605.11296v1\" target=\"_blank\"><em><em>Computational Design of a Low-Visibility UAV Using a Human-Aligned Perceptual Metric<\/em><\/em><\/a>, by Jingxian Wang, Chen Yu, David Matthews, Emma Alexander, Sam Kriegman, and Michael Rubenstein from Northwestern University, which is being presented this week at <a href=\"https://roboticsconference.org/\" target=\"_blank\">RSS 2026 in Sydney<\/a>.<\/p>"}, {"title": "TerraFirma raises $115M to build robotic infrastructure for construction", "source": "Robotics Business Review", "date": "2026-07-16", "url": "https://www.therobotreport.com/terrafirma-raises-115m-build-robotic-infrastructure-construction/", "summary": "<p>TerraFirma has developed a platform that combines AI-enabled software, a remote command-and-control center, and retrofitted heavy machinery.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/terrafirma-raises-115m-build-robotic-infrastructure-construction/\">TerraFirma raises $115M to build robotic infrastructure for construction<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Agility outlines six recommendations for U.S. humanoid robot policies", "source": "Robotics Business Review", "date": "2026-07-15", "url": "https://www.therobotreport.com/agility-outlines-six-recommendations-for-u-s-humanoid-robot-policies/", "summary": "<p>Peggy Johnson, CEO of Agility, said the U.S. needs a policy framework that can strengthen what's already working for the humanoid industry.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/agility-outlines-six-recommendations-for-u-s-humanoid-robot-policies/\">Agility outlines six recommendations for U.S. humanoid robot policies<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Vicarious Surgical board seeks to dissolve company", "source": "Robotics Business Review", "date": "2026-07-15", "url": "https://www.therobotreport.com/vicarious-surgical-board-seeks-to-dissolve-company/", "summary": "<p>The board is asking shareholders to approve their plan to dissolve and liquidate the business at a special meeting scheduled for July 21, but said it can not predict how much (if anything) investors would recover or when.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/vicarious-surgical-board-seeks-to-dissolve-company/\">Vicarious Surgical board seeks to dissolve company<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Icarus Robotics uses KULR technology to power JOY free-flying space robot", "source": "Robotics Business Review", "date": "2026-07-15", "url": "https://www.therobotreport.com/icarus-robotics-uses-kulr-technology-to-power-joy-free-flying-space-robot/", "summary": "<p>Under the agreement, KULR will supply its KULR ONE Space battery systems to power JOY’s onboard systems on the ISS.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/icarus-robotics-uses-kulr-technology-to-power-joy-free-flying-space-robot/\">Icarus Robotics uses KULR technology to power JOY free-flying space robot<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Walden Robotics launches at $1.1B valuation for general-purpose robots", "source": "Robotics Business Review", "date": "2026-07-15", "url": "https://www.therobotreport.com/walden-robotics-launches-1-1b-valuation-general-purpose-robots/", "summary": "<p>Leading technology companies have invested in Walden Robotics, which emerged from stealth as it develops full-stack physical AI.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/walden-robotics-launches-1-1b-valuation-general-purpose-robots/\">Walden Robotics launches at $1.1B valuation for general-purpose robots<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "NVIDIA Introduces New Jetson Thor Computers to Advance Mainstream Robotics and Edge AI", "source": "NVIDIA Robotics", "date": "2026-07-15", "url": "https://blogs.nvidia.com/blog/jetson-thor-robotics-edge-ai-agent/", "summary": "General-purpose robots and autonomous machines are moving from research labs to real-world mass-market deployment, creating demand for compact, power-efficient AI supercomputers capable of running foundation models at the edge.  To meet that need, NVIDIA today introduced the T3000 and T2000, new modules based on the NVIDIA Thor architecture that enable mass-market robotics and edge AI [&#8230;]"}, {"title": "NVIDIA shares how to evaluate general-purpose robot policies for real-world deployment", "source": "Robotics Business Review", "date": "2026-07-14", "url": "https://www.therobotreport.com/nvidia-shares-how-evaluate-general-purpose-robot-policies-real-world-deployment/", "summary": "<p>RoboLab research powers NVIDIA Isaac Lab-Arena, an open-source simulation framework for large-scale policy setup and evaluation. <\/p>\n<p>The post <a href=\"https://www.therobotreport.com/nvidia-shares-how-evaluate-general-purpose-robot-policies-real-world-deployment/\">NVIDIA shares how to evaluate general-purpose robot policies for real-world deployment<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Key to Humanoid Progress: Managing the Power Behind the Robots", "source": "Robotics Business Review", "date": "2026-07-14", "url": "https://www.therobotreport.com/key-to-humanoid-progress-managing-the-power-behind-the-robots/", "summary": "<p>Murata Power Solutions' John Quinlan on how advanced robotics converts, distributes and controls on-board power from battery to actuator. <\/p>\n<p>The post <a href=\"https://www.therobotreport.com/key-to-humanoid-progress-managing-the-power-behind-the-robots/\">Key to Humanoid Progress: Managing the Power Behind the Robots<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "The Robot Report parent company, WTWH Media, rebrands as Arrowfly", "source": "Robotics Business Review", "date": "2026-07-13", "url": "https://www.therobotreport.com/the-robot-report-parent-company-wtwh-media-rebrands-as-arrowfly/", "summary": "<p>The Arrowfly name unifies more than 40 brands under a new identity built for the future of B2B content and events.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/the-robot-report-parent-company-wtwh-media-rebrands-as-arrowfly/\">The Robot Report parent company, WTWH Media, rebrands as Arrowfly<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Yaskawa America gets information security certification", "source": "The Robot Report", "date": "2026-07-13", "url": "https://www.therobotreport.com/yaskawa-america-gets-information-seccurity-certification/", "summary": "<p>Yaskawa America said that independent ISO/IEC 27001:2022 certification shows its focus on protecting customer information.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/yaskawa-america-gets-information-seccurity-certification/\">Yaskawa America gets information security certification<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Ondas acquires DZYNE for $875.8M, expanding its defense capabilities", "source": "Robotics Business Review", "date": "2026-07-13", "url": "https://www.therobotreport.com/ondas-acquires-dzyne-875-8m-expanding-its-defense-capabilities/", "summary": "<p>DZYNE Technologies specializes in long-endurance autonomous aircraft, counter-drone systems, and autonomous effects.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/ondas-acquires-dzyne-875-8m-expanding-its-defense-capabilities/\">Ondas acquires DZYNE for $875.8M, expanding its defense capabilities<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Building a Foundation Stack for General-Purpose Robots", "source": "IEEE Spectrum Robotics", "date": "2026-07-13", "url": "https://spectrum.ieee.org/x-square-robot-embodied-ai-stack", "summary": "<img src=\"https://spectrum.ieee.org/media-library/humanoid-robot-folding-laundry-on-a-neatly-made-bed-in-a-sunlit-bedroom.png?id=67111698&amp;width=1245&amp;height=700&amp;coordinates=4%2C0%2C4%2C0\" /><br /><br /><p><em>This article is brought to you by <a href=\"https://x2robot.com/\" target=\"_blank\">X Square Robot<\/a>.<\/em><\/p><p>Large language models gave artificial intelligence a working recipe. Pretrain a large model on broad data, and general capability follows. Robotics has no such recipe. Robotics systems have long been assembled from separate perception, planning, and control parts that rarely add up to intelligence a robot can carry from one task to another, or one machine to another. The central problem in embodied AI is to find the equivalent recipe, and the field does not yet agree on what it is.<\/p><p><a href=\"https://x2robot.com/\" target=\"_blank\">X Square Robot<\/a>, a Chinese embodied-AI company, has made an unusually explicit bet. It argues that the recipe is an integrated stack, spanning the data a robot learns from, a world model for predicting changes in the physical world, and an action model that brings together perception, planning, reasoning, and decision-making to generate executable robot behavior. The company also believes that the stack should be built and <a href=\"https://x2robot.com/en/research\" target=\"_blank\">released in the open<\/a>.<\/p><p class=\"shortcode-media shortcode-media-youtube\"> <span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span> <small class=\"image-media media-caption\">X Square Robot shares its vision of bringing robots into real homes.<\/small><small class=\"image-media media-photo-credit\">X Square Robot<\/small><\/p><h2>X Square Robot’s embodied AI stack<\/h2><p>What holds the stack together is a small set of principles rather than a single overarching model.<\/p><ul><li>The first is that the basic unit of robot data is an interaction, not a trajectory; a demonstration is successful only if it changes the world as intended, not simply because the joints moved. <\/li><li>The second is that pretraining should yield usable capability, not just an initialization for later fine-tuning. <\/li><li>The third is that behavior should be modeled around physical events rather than fixed slices of time. <\/li><\/ul><p>These principles make the layers interdependent, since the same robot-free data that trains the action model is also structured to feed the world model. It is worth being precise, though. The company describes the world model and the action model as complementary but independent model families that share a code base. Both sit within its broader World Unified Model, which it has presented as an architecture for training vision, language, action, and physical prediction together.<\/p><h2>Robot learning data: Engineering for quality and cost, not scale<\/h2><p>For the X Square Robot team, one of the biggest constraints on general-purpose robots is the cost and quality of interaction data, not the number of parameters. To address that, the company built its Universal Manipulation Interface (UMI) data collection system, <a href=\"https://x2robot.com/en/news/6a46341cc7feadddbc603a33\" target=\"_blank\">QUANXTA Zero Series<\/a>. It works by collecting demonstrations from people wearing a rig with dual grippers rather than teleoperating a robot. This approach is not itself new, and builds on established methods for robot-free data capture. What sets it apart are two engineering choices.<\/p><div class=\"ieee-sidebar-medium\"><p class=\"shortcode-media shortcode-media-rebelmouse-image rm-float-left rm-resized-container rm-resized-container-25\" style=\"float: left;\"> <img alt=\"Person using VR headset and handheld controllers to teleoperate a dishwashing robot system\" class=\"rm-shortcode\" id=\"75dbc\" src=\"https://spectrum.ieee.org/media-library/person-using-vr-headset-and-handheld-controllers-to-teleoperate-a-dishwashing-robot-system.png?id=67111747&amp;width=980\" /> <small class=\"image-media media-caption\">X Square Robot emphasizes data quality control, recording trajectories and replaying them on a real robot, with only those that actually complete the task counted as valid.<\/small><small class=\"image-media media-photo-credit\">X Square Robot<\/small><\/p><\/div><p>The first is quality control, and it is the most distinctive part. Rather than accepting recorded trajectories as they are, the system runs a closed inspection loop, and its notable step is physical playback. A sample of trajectories is replayed on the real robot, and only those that actually complete the task count as valid. That makes the validity rate a measured quantity rather than an assumption. For example, a gripper that closes a fraction of a second too early still looks like a grasp in the data, yet it has pushed the object away, so it shouldn’t be classified as valid. A smaller clean dataset can be worth more than a larger noisy one.<\/p><p>The second choice is how lower-cost human data and scarce robot data are combined. The company pretrains on a large volume of robot-free demonstrations to build general representations, then adds a small amount of real-robot data as an anchor to the specific machine’s dynamics. It reports that this reaches performance comparable to an all-robot dataset at roughly a 20-fold lower cost of collection, driven mainly by how much cheaper the wearable rig is than a teleoperation setup. <\/p><p>The resulting dataset is deliberately model-agnostic, formatted to feed both action models and world models. The caveat is that the strongest results are measured on the company’s own robots and data-collection pipelines. Broader independent testing will help confirm and extend these promising results across a wider range of settings.<\/p><h2>A world model organized around events<\/h2><p>In developing its world model, called <a href=\"https://x2robot.com/en/pages/wm\" target=\"_blank\">WALL-WM<\/a>, X Square Robot took a differentiated approach. Most action models predict a fixed-length chunk of motion from the current image and instruction. That is convenient, but it segments behavior into fixed-duration windows, so the boundaries fall where elapsed time dictates rather than where one action ends and the next begins. WALL-WM instead treats an action-grounded semantic event as its unit: a coherent piece of behavior such as reaching, grasping, or placing, something that can be named in language, seen in video, and executed as motion.<\/p><div class=\"ieee-sidebar-large\"><p class=\"shortcode-media shortcode-media-rebelmouse-image\"> <img alt=\"Collage of robot arms manipulating kitchen objects with charts of multimodal AI performance\" class=\"rm-shortcode\" id=\"67705\" src=\"https://spectrum.ieee.org/media-library/collage-of-robot-arms-manipulating-kitchen-objects-with-charts-of-multimodal-ai-performance.png?id=67111750&amp;width=980\" /> <small class=\"image-media media-caption\">X Square Robot’s world model, called WALL-WM, treats an action-grounded semantic event as its unit: a coherent piece of behavior such as reaching, grasping, or placing, something that can be named in language, seen in video, and executed as motion.<\/small><small class=\"image-media media-photo-credit\">X Square Robot<\/small><\/p><\/div><p><span>WALL-WM’s design reflects a specific concern about not discarding what large video models already know. To achieve that, a text-to-video model is coupled to a freshly initialized action network that reads from the video features without overwriting them, which preserves the visual prior. From that one process, it offers two modes. An event mode runs in variable-length segments and suits reasoning over long horizons, while a fixed-length mode produces the steady, real-time output a controller needs. That places WALL-WM between mainstream chunk-based action models and pure video world models, keeping the predictive character of a world model while still yielding executable control.<\/span><\/p><p>In a series of experiments, the company relied on a generalization test that is more specific than most. A model trained on a limited dataset was evaluated on long-horizon tasks in unseen settings and, on the company’s real-robot benchmark, reportedly outscored baselines that had been fine-tuned on related data. That is a meaningful result if it holds. For now, it is measured on the company’s own benchmark. With the code now being released, the broader community will have the opportunity to test, reproduce, and build on them across more settings.<\/p><h2>A policy that runs before fine-tuning, and action tokens with meaning<\/h2><p>The action layer carries two connected ideas. The first is a requirement the company sets for itself with <a href=\"https://x2robot.com/en/oss\" target=\"_blank\">Wall-OSS-0.5<\/a>, its vision-language-action model: The pretrained model should run on a real robot before any task-specific fine-tuning. <\/p><p>The interest is less in the scores than in the design behind them. The model trains three objectives together, namely discrete action tokens, language grounding, and continuous action generation. And it keeps gradients flowing through all of them rather than freezing parts of the network as some rival designs do. It’s also a more strict method, since it reports untuned behavior such as approaching, grasping, and recovering, including on a deformable task held out of training.<\/p><div class=\"ieee-sidebar-large\"><p class=\"shortcode-media shortcode-media-rebelmouse-image\"> <img alt=\"Dashboard of robot training metrics with charts and photos of a robot sorting objects\" class=\"rm-shortcode\" id=\"2d02b\" src=\"https://spectrum.ieee.org/media-library/dashboard-of-robot-training-metrics-with-charts-and-photos-of-a-robot-sorting-objects.png?id=67111753&amp;width=980\" /> <small class=\"image-media media-caption\">As part of X Square Robot’s Wall-OSS-0.5 vision-language-action model design, the pretrained model should run on a real robot before any task-specific fine-tuning. <\/small><small class=\"image-media media-photo-credit\">X Square Robot<a href=\"https://spectrum.ieee.org/r/entryeditor/2677167058#/\" target=\"_self\"><\/a><\/small><\/p><\/div><p>The second idea is the action interface itself, called X-Tokenizer. Most systems that turn continuous motion into discrete tokens produce codes that the language model cannot interpret. X-Tokenizer reframes tokenization as learning a semantic interface, so that the top-level code stands for the intent of a motion while lower-level codes carry finer detail, all aligned with the language model’s own features. <\/p><p>A useful consequence is stability. Adding noise to an action barely moves the intent code, which is what lets one tokenizer to be reused across robots without re-tuning. The tokenizer inside the production action model is a related variant of this approach. Together, the two ideas give the action layer something rather powerful: capability that transfers.<\/p><h2>The future of embodied AI stacks<\/h2><p>X Square Robot is betting that its unique approach combining three layers, each specialized in solving a key part of the problem, will stand out from other embodied AI stacks. The physical-playback step that grounds data quality is uncommon and sensible. The reframing of world modeling around events, with one backbone serving both reasoning and control, is a genuinely distinct approach. And the pairing of a deployable pretraining standard with a tokenizer designed as a semantic interface gives the action layer unusual coherence. <\/p><p class=\"pull-quote\">X Square Robot’s valuation has climbed above 20 billion yuan (about US $2.9 billion), suggesting that investors increasingly view data infrastructure, foundation models, and scalable training systems as long-term differentiators in embodied AI.<\/p><p>The next phase will bring broader validation. Much of the current evidence comes from X Square’s own robots and benchmarks. With the world model code now being made public, and as the community begins to test, reproduce, and build on the work, the reported capabilities will be tested across more robots, tasks, and settings.<\/p><p><span>X Square Robot’s recent funding rounds reflect similar confidence. The company’s valuation has climbed above 20 billion yuan (about US $2.9 billion), suggesting that investors increasingly view data infrastructure, foundation models, and scalable training systems as long-term differentiators in embodied AI.<\/span><\/p><h2>What’s next for X Square Robot<\/h2><p>To learn more about its future plans, the following Q&amp;A with the X Square Robot team further explores the company’s technology, strategy, and vision.<\/p><p><strong>What made now the right moment, technically, to commit to this stack? What recently became possible that wasn’t possible a couple of years ago?<\/strong><\/p><p>It is not one breakthrough but several trends maturing together. Foundation models gave us a shared representation across vision, language, and action, so we can model what a robot sees, what it is asked to do, and how its actions change the world in one framework, rather than as separate perception, planning, and control modules. <\/p><p>Compute and infrastructure are finally sufficient for large-scale pretraining over long-horizon, multi-embodiment data. Just as importantly, we realized that data, not model size, is the real bottleneck for general robots—what is scarce is diverse, high-quality, reproducible interaction data. And world modeling has become practical. The useful question is no longer how to predict a few seconds of video, but how to understand the ways actions change objects, contacts, and task states. Two years ago these ingredients existed separately. Today they are mature enough to work as one system.<\/p><p class=\"pull-quote\">“We realized that data, not model size, is the real bottleneck for general robots—what is scarce is diverse, high-quality, reproducible interaction data. And world modeling has become practical.”<\/p><p><strong>Your data system captures demonstrations with a wearable VR rig and custom grippers rather than teleoperating robots. What was wrong with standard teleoperation?<\/strong><\/p><p>Teleoperation is built around controlling the robot. It forces the operator to work within the machine’s kinematics, latency, and viewpoint, and the resulting demonstrations are slower, stiffer, and less diverse. <span>We built our system around capturing human skill instead. Manipulation is really about contact, timing, finger coordination, and recovery, not just the path the hand takes, and a wearable rig records those before the behavior is compressed onto one particular robot. It also breaks teleoperation’s expensive scaling law, in which every demonstration needs a robot. <\/span><\/p><p>People can generate rich data independently of any robot, and the crucial property is that those demonstrations can still be replayed and executed on a physical robot through the model. Mobility is convenient, but that replay is the real point, because it is what lets the same data be reused across different platforms.<\/p><p class=\"shortcode-media shortcode-media-rebelmouse-image\"> <img alt=\"Robot and person loading a washing machine together in a modern laundry room.\" class=\"rm-shortcode\" id=\"3283b\" src=\"https://spectrum.ieee.org/media-library/robot-and-person-loading-a-washing-machine-together-in-a-modern-laundry-room.png?id=67111806&amp;width=980\" /> <small class=\"image-media media-caption\">In X Square Robot’s approach, demonstrations can be replayed and executed on a physical robot through the AI model, allowing the same data to be reused across different platforms.<\/small><small class=\"image-media media-photo-credit\">X Square Robot<a href=\"https://spectrum.ieee.org/r/entryeditor/2677167058#/\" target=\"_self\"><\/a><\/small><\/p><p><strong>X Square Robot reports that its pipeline has roughly an 85 percent data-validity rate. Why is quality control such an underrated bottleneck?<\/strong><\/p><p>Because errors in robot data are far more expensive than in language data. A small timing or contact error can change what a demonstration means. If a gripper closes a fraction of a second too early, the motion still looks like a grasp, but physically it has pushed the object away. A dataset that mixes failures and accidental successes teaches ambiguity, not skill, because the real unit is the interaction, not the trajectory. <\/p><p>So we run automated inspection, kinematic checks, and physical replay, where we play a sample of trajectories back on the real robot and count only the ones that actually complete the task. Data quality sets the ceiling on how good a policy can be. In our experience a smaller, cleaner dataset often beats a much larger, noisier one, which is why we treat quality control as part of the model, not a preprocessing afterthought.<\/p><p><strong>The model runs in both “event mode” and “chunk mode.” When does each matter?<\/strong><\/p><p>Both matter, for different reasons. The physical world changes through events—when contact occurs, a grasp forms, or an object slips—not in fixed-frame windows. Event mode concentrates the model’s attention on those moments, and it matters most for long-horizon tasks, like clearing a table, where progress is a sequence of semantic events rather than a smooth stream. It runs in variable-length segments that follow the task rather than a clock. Chunk mode matters for deployment. Real controllers need a stable, real-time interface, and fixed-length chunks integrate cleanly with existing control systems. <\/p><p>We organize learning around events in the first place because a fixed window can split one motion in half or merge two together, which turns training into short-horizon pattern matching and weakens the model on long tasks. So the world model’s job is to connect event-level understanding, which is where the reasoning happens, with a fixed-length output a real robot can actually run.<\/p><p><strong>Why make “deployable before fine-tuning” the criterion?<\/strong><\/p><p>Pretraining should produce capability, not just a good starting point. If a model is only useful after heavy fine-tuning, then most of the intelligence still lives in the downstream supervision, not in the foundation model. Deployable before fine-tuning is a more honest test of what pretraining actually learned. A well-pretrained robot should already know how to approach, grasp, move, avoid obstacles, and correct itself. Fine-tuning should adapt it to a specific task or robot, not create the ability from nothing. It is also a practical requirement. A robot in a home or a workplace shouldn’t need a brand-new dataset and a new policy every time the task changes, so a foundation model that already carries general skill, and some ability to recover, is the minimum bar for something genuinely useful in the real world.<\/p><p><strong>What is the most challenging part of cross-embodiment learning?<\/strong><\/p><p>Robots differ in control frequency, delay, compliance, sensing precision, and contact dynamics, so the same instruction can require different action decompositions and recovery strategies, and a behavior that works on one arm cannot simply be copied to another. Cross-embodiment learning needs an intermediate abstraction, lower than language but higher than joint angles: how you approach an object, how you make contact, how you apply force, and how you recover from a mistake. <\/p><p>When we say cross-embodiment, the main capability we mean is multi-embodiment generalization: transferring across robots, training on many embodiments at once, and adapting to different kinematics. Human-to-robot transfer and other techniques are specific approaches to that goal.<\/p><p class=\"pull-quote\">“A robot in a home or workplace shouldn’t need a new dataset and policy every time the task changes. A useful foundation model should already carry general skills and the ability to recover.”<\/p><p><strong><span><\/span>What would you most like to see other researchers attempt to reproduce or stress-test?<\/strong><\/p><p>Three things, above all. Whether event-level representations really generalize beyond our own datasets, across more tasks, scenes, objects, embodiments, and failure conditions. Whether pretraining stays effective on robots the model never saw during training, or whether its capability is still too tightly coupled to what it has already seen. And whether real-robot evaluation can become a shared language for the field, so that we compare not just success rates but the reasons systems fail, where an instruction was misread, where perception broke down, or where recovery fell short. Robotics has been driven too often by impressive demonstrations, and real progress comes from results that are reproducible and diagnosable.<\/p><p><strong>What capability is still missing before robots become dependable in homes?<\/strong><\/p><p>Benchmarks measure competence, like whether a model can finish a task. Homes demand reliability, safe and consistent operation over time in a place that changes every day, with objects moving, instructions that are vague, and people interrupting. The missing piece is not a higher one-time success rate: it is robust recovery. A dependable home robot has to know when it is uncertain, when to slow down, when to ask for help, and how to bring the world back to a safe state after it drops something or misunderstands a request. <\/p><p>In a real home, failure recovery matters more than raw success, because the home does not reset itself. Homes also demand careful personalization, learning a household’s routines and preferences over time, with safety and trust as first principles. That combination, not any single skill, separates a capable demonstration from a robot people can live with.<\/p><p class=\"shortcode-media shortcode-media-rebelmouse-image\"> <img alt=\"Humanoid service robot stands by a table in a modern living room.\" class=\"rm-shortcode\" id=\"169cf\" src=\"https://spectrum.ieee.org/media-library/humanoid-service-robot-stands-by-a-table-in-a-modern-living-room.jpg?id=67111807&amp;width=980\" /> <small class=\"image-media media-caption\">X Square Robot’s approach is that, in a real home, failure recovery matters more than raw success, because the home does not reset itself and it demands careful personalization, with safety and trust as first principles. <\/small><small class=\"image-media media-photo-credit\">X Square Robot<a href=\"https://spectrum.ieee.org/r/entryeditor/2677167058#/\" target=\"_self\"><\/a><\/small><\/p><p><strong>How do the open-source components fit into X Square Robot’s World Unified Model direction?<\/strong><\/p><p>We see these releases as layers of the World Unified Model direction rather than isolated projects. <a href=\"https://x2robot.com/en/oss\" target=\"_blank\">Wall-OSS-0.5<\/a>, the action model, asks whether an open vision-language-action model can gain directly measurable capability from large-scale pretraining, so it is the capability layer. <span>WALL-WM, the world model, asks how a robot should understand change in the world, shifting from fixed windows to event-level modeling, so it is the representation layer. The data system supplies the interaction data that both of them learn from. <\/span><\/p><p>Together they form a loop in which models produce capability, world models organize understanding, and the open-source community drives reproduction and improvement. World Unified Model is the broader architecture those layers support, bringing vision, language, action, and physical prediction together. <\/p><p>We are releasing these pieces openly because embodied intelligence cannot be solved by one organization; it needs many embodiments, many real tasks, and broad feedback, and the long-term goal is a stack that keeps learning and ultimately moves robots from laboratory demonstrations toward reliable everyday use.<\/p>"}, {"title": "STEM education in the classroom, introducing BotBall", "source": "Robotics Business Review", "date": "2026-07-12", "url": "https://www.therobotreport.com/stem-education-classroom-introducing-botball/", "summary": "<p>Botball addresses STEM education with autonomous robotics, real coding, and a level playing field driven entirely by students.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/stem-education-classroom-introducing-botball/\">STEM education in the classroom, introducing BotBall<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Are suppliers ready for new robot safety standards?", "source": "Robotics Business Review", "date": "2026-07-11", "url": "https://www.therobotreport.com/are-suppliers-ready-for-new-robot-safety-standards/", "summary": "<p>Suppliers that are well prepared for standard changes will benefit, while underprepared companies may face market access disruption.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/are-suppliers-ready-for-new-robot-safety-standards/\">Are suppliers ready for new robot safety standards?<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Why robotics teams need virtual gyms before deployment", "source": "Robotics Business Review", "date": "2026-07-11", "url": "https://www.therobotreport.com/why-robotics-teams-need-virtual-gyms-before-deployment/", "summary": "<p>To address environmental and task variability, robots can benefit from 'virtual gyms' to bridge the sim-to-real gap, says SoftServe.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/why-robotics-teams-need-virtual-gyms-before-deployment/\">Why robotics teams need virtual gyms before deployment<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Ground Robots Inherit the Kill Zone", "source": "IEEE Spectrum Robotics", "date": "2026-07-10", "url": "https://spectrum.ieee.org/ukraine-ground-drones", "summary": "<img src=\"https://spectrum.ieee.org/media-library/an-unmanned-ground-vehicle-moving-through-a-sparse-forest-landscape.jpg?id=67114838&amp;width=1245&amp;height=700&amp;coordinates=0%2C156%2C0%2C157\" /><br /><br /><p><a href=\"https://itarena.ua/speaker/borys-drozhak/\" rel=\"noopener noreferrer\" target=\"_blank\">Borys Drozhak<\/a> has a vision: a front line almost free of humans, patrolled by <a href=\"https://spectrum.ieee.org/autonomous-drone-warfare\" target=\"_self\">flying drones<\/a> and ground robots, and continuously monitored by AI-controlled sensor networks. And it’s not a pipe dream. Ukrainian roboticists have made major strides in that direction over the past four years. Remotely controlled ground vehicles fitted with machine guns and grenade launchers now patrol the no-man’s-land straddling the front, part of a robotic legion that has stymied Russia’s territorial ambitions so far this year.<\/p><p>Drozhak is a co-founder and CEO of <a href=\"https://rovertech.co.ua/en/\" rel=\"noopener noreferrer\" target=\"_blank\">RoverTech<\/a>, which manufactures the Zmiy, one of Ukraine’s most successful ground robots. Zmiy, Ukrainian for snake, is an 800-kilogram (1,700-pound) rover, 2.15 by 1.5 meters in size, with 75-centimeter diameter wheels. The Zmiy comes in various configurations—for demining, logistics, fighting fires, firing a machine gun, or launching grenades. <\/p><p>According to Drozhak, the uncrewed ground vehicle (UGV) is a record-breaker among Ukrainian ground robots. It’s engineered to be nearly noiseless and emit as little heat as possible, helping it to elude Russia’s intelligence, surveillance, and reconnaissance (ISR) drones. As a result, a <a href=\"https://oboronka.mezha.ua/en/virobnictvo-nrk-zmiy-311311/\" rel=\"noopener noreferrer\" target=\"_blank\">Zmiy rover<\/a> completes on average 57 missions across the kill zone before being destroyed. The kill zone is the roughly 35-kilometer-wide swath of land that straddles the front line; its width is variable and determined mainly by the growing range of the drones.<\/p><p>“Usually, a UGV on the battlefield lasts about seven missions,” Drozhak says. “The Zmiy is quite a bit bigger and stronger” in comparison with most other UGVs, “and can make it back even if two of its wheels get destroyed.”<\/p><p>Drozhak is a software engineer turned roboticist whose story is echoed everywhere in the Ukrainian defense establishment. Before the Russian invasion, he was living a quiet life in Ireland, working for an international software development firm. He returned home shortly after the war began to help defend his homeland. Together with his friend, Vasyl Korenovskyi, who had been a mining engineer, he founded RoverTech with the goal of building robots to perform some of the most dangerous tasks in the war zone. In 2023, they rolled out their first product—the Zmiy de-miner. Earlier this year, one of RoverTech’s assault UGVs was part of a <a href=\"https://www.cnn.com/2026/04/20/europe/robots-ukraine-battlefield-drones-intl-cmd\" rel=\"noopener noreferrer\" target=\"_blank\">widely reported<\/a> operation that forced a group of Russian soldiers to surrender without the presence of any Ukrainian troops. Such feats, Drozhak insists, are not rare on Ukrainian battlefields these days.<\/p><p>UGVs are the latest chapter in the military-technology race spurred by the war in Ukraine. <a href=\"https://www.defensenews.com/unmanned/2026/04/24/ukraine-to-field-25000-ground-robots-in-push-to-replace-soldiers-for-frontline-logistics/\" rel=\"noopener noreferrer\" target=\"_blank\">Scores of Ukrainian startups<\/a> have developed dozens of different small ground robots, each with typically multiple variants, over the past three years. They’re mostly replacing human-driven tanks and other military vehicles that used to crisscross the war zone. These remotely controlled robotic vehicles cost a few tens of thousands of dollars apiece compared to millions for a traditional tank, and they can be tweaked and modified in frontline workshops to serve the most urgent needs. <\/p><h2>Zelenskyy Orders Up 50,000 More UGVs<\/h2><p>In April, Ukraine’s President Volodymyr Zelenskyy <a href=\"https://www.pravda.com.ua/eng/news/2026/04/27/8032079/\" rel=\"noopener noreferrer\" target=\"_blank\">signed an order<\/a> for the government to procure 50,000 UGVs for Ukraine’s military forces by the end of 2026. That’s more than three times as many as the government purchased in 2025 and a massive increase from the 2,000 procured in 2024, according to defense analyst <a href=\"https://www.linkedin.com/in/marcclange/?locale=de\" rel=\"noopener noreferrer\" target=\"_blank\">Marc C. Lange<\/a>.<\/p><p>The rise of UGVs, Lange explains, is a direct response to the warfighting revolution ushered in by the speedy evolution of uncrewed aerial vehicles that came to define the war in Ukraine.<\/p><p>As the number of drones zooming above the front line rose and their range increased, the battlefield became completely transparent. Today, anything that enters the kill zone gets hit by a first-person view (FPV) kamikaze drone within minutes.<\/p><p>“Any armored formation, any resupply and logistics vehicle, and any manned formation anywhere near the edge of the battle area has between seconds to a low amount of minutes before it gets turned to dust,” Lange says. “The Ukrainians were losing drivers. Traditional methods of evacuating injured soldiers became impossible. That space is basically unsurvivable.”<\/p><p>Ukraine, suffering from a <a href=\"https://www.longwarjournal.org/archives/2026/06/analysis-ukraine-unveils-reforms-to-address-manpower-shortage.php\" rel=\"noopener noreferrer\" target=\"_blank\">shortage of infantry<\/a>, has taken that problem more seriously than Russia, which has a larger pool of fresh recruits to draw from. UGVs began ferrying supplies to troops at frontline positions in 2024. Gradually, they took over the complex and risky evacuations of the wounded, using special enclosures to protect the soldier being transported. But this year, Lange says, is “the year of the assault UGV.”<\/p><p>Emerging Ukrainian tactics combine UGVs with real-time reconnaissance and surveillance from aerial drones, which discover enemy troops, often under cover of night. The reconnaissance data are then used by remote operators who guide UGVs as they stalk, corner, and shoot to kill. <a href=\"https://www.linkedin.com/in/oleg-fedoryshyn-a1045819/\" rel=\"noopener noreferrer\" target=\"_blank\">Oleg Fedoryshyn<\/a>, the head of research and design at <a href=\"https://devdroid.tech/en/\" rel=\"noopener noreferrer\" target=\"_blank\">DevDroid<\/a>, another prominent Ukrainian UGV developer, said the ground robots can be controlled from as far as 100 kilometers away using Starlink connectivity, LTE networks, or mesh-networked military radio systems. The UGVs can also carry strike UAVs (uncrewed aerial vehicles), serve as communication relays for drones, or carry and launch communication relay drones that further extend the range of the attack vehicles. The UGV can lurk in position for up to one week without needing a battery charge, Fedoryshyn said, and wait for the enemy to move closer.<\/p><p>“It’s better than to put people there,” he notes. “A guy with a machine gun is always the first target for the enemy.”<\/p><p class=\"shortcode-media shortcode-media-rebelmouse-image\"> <img alt=\"An Ukrainian soldier adjusting an unmanned ground vehicle\\u2019s machine gun.\" class=\"rm-shortcode\" id=\"e136b\" src=\"https://spectrum.ieee.org/media-library/an-ukrainian-soldier-adjusting-an-unmanned-ground-vehicle-u2019s-machine-gun.jpg?id=67114858&amp;width=980\" /> <small class=\"image-media media-caption\">The Droid TW 12.7, by DevDroid, is shown here outfitted with a 0.50-caliber M2 Browning machine gun that can be aimed and fired by a remote operator using a tablet and an encrypted communications link.<\/small><small class=\"image-media media-photo-credit\">DevDroid<\/small><\/p><p>Fedoryshyn estimates that UGVs could eventually help cut the number of soldiers needed along the front line by 30 to 40 percent. Drozhak is even more ambitious. He envisions a future front line that’s entirely automated, relying on sensors and other systems that are only occasionally serviced by humans.<\/p><p class=\"pull-quote\">A guy with a machine gun is always the first target for the enemy.<\/p><p>“Right now, we need a lot of UGVs because there are people on the front line and we need to deliver supplies to them,” he says. “But we can substitute many of them with sensor systems, servicing robots, and UGVs, and then we will not need that many for logistics. At some point, we could have only robots in the kill zone.”<\/p><p>Ukraine, with a prewar population of around 41 million, has lost over 150,000 fighters in the war since 2022, according to <a href=\"https://www.csis.org/analysis/russias-grinding-war-ukraine\" target=\"_blank\">estimates<\/a> by the <a href=\"https://www.csis.org/\" target=\"_blank\">Center for Strategic and International Studies<\/a> and others. Many thousands of others have been mutilated or permanently disabled. Even those who return without physical injuries suffer lasting <a href=\"https://balticsentinel.eu/8046076/war-at-home-the-psychological-toll-on-ukraine-s-returning-soldiers\" target=\"_blank\">psychological trauma<\/a>. Drozhak dreams that a future robot army would put an end to the ability of autocratic regimes worldwide to brutalize their neighbors. <\/p><p>“There will be no need to push people on the battlefield anymore,” says Drozhak, the RoverTech CEO. “Once we achieve that in Ukraine, any country with a decent economy would be able to defend themselves just with technology.”<\/p><p><a href=\"https://www.pravda.com.ua/eng/news/2026/06/01/8037264/\" target=\"_blank\">RoverTech’s Tarantula<\/a> active-protection system, which uses acoustic and visual sensors combined with AI algorithms to detect approaching killer drones, is the first step in that direction, he declares.<\/p><p>“The future battlefield will rely on networks of robotic sensors and autonomous systems that can continuously monitor dangerous areas, provide early warning, and reduce the need for soldiers to expose themselves to direct threats,” he says. “Human operators will remain responsible for critical decisions, but increasingly advanced sensing technologies will help move people away from the most dangerous positions on the battlefield.”<\/p><h2>Why UGVs Are Vulnerable<\/h2><p>Militaries around the world were looking at UGVs prior to Russia’s 2022 invasion of Ukraine. But those were quite different, explains <a href=\"https://www.cna.org/our-experts/bendett-samuel\" target=\"_blank\">Samuel Bendett<\/a>, a defense analyst at the consultancy <a href=\"https://www.cna.org/\" target=\"_blank\">CNA<\/a>. They were larger, more complex, and conceived to operate in smaller numbers. The more compact forms now seen in Ukraine are the result of an evolution that paralleled that of the first-person view (FPV) attack drones. Both needed to be cheap as they don’t last long and small to be less conspicuous. Now, the West is trying to understand the overall role of UGVs in <a href=\"https://youtu.be/0nhQjpRnBHs?si=43FvJ9ykWv2967eP\" rel=\"noopener noreferrer\" target=\"_blank\">future warfare<\/a>. So far, in Bendett’s view, the impact of UGVs on warfare isn’t as profound as that of the FPVs and other aerial drones.<\/p><p>“Not every terrain would be applicable to using a UGV,” Bendett explains. “So far, a lot fewer countries are seeking to integrate them into their combat operations than UAVs, which very much democratized the way of enabling short-range to mid-range strikes against adversaries.”<\/p><p>UGVs, he points out, are much more susceptible to communication disruptions than UAVs, while being less suitable for autonomous operations and swarming due to the complexity of ground terrain.<\/p><p>“With UAVs, communication is much easier,” according to Bendett. “There are no interferences between the ground station and the UAV save the distance, Earth’s curvature, and the radio horizon. But on Earth, there’s lots of different obstacles that interfere with radio signals.”<\/p><p>Most UGVs rely on <a href=\"https://starlink.com/\" rel=\"noopener noreferrer\" target=\"_blank\">Starlink<\/a> as the first choice for operator control, but even that comes with problems. Starlink signals are easily disrupted by trees and buildings. And Russia, having been cut off from Starlink, is working hard to find ways to <a href=\"https://en.defence-ua.com/news/how_russians_try_to_jam_starlink_using_a_15_million_system_why_its_barely_working-18830.html\" rel=\"noopener noreferrer\" target=\"_blank\">jam the system<\/a>.<\/p><p>On top of that, Lange says, as UAV autonomy progresses, UGVs could be left behind. The reason is that UGVs are likely to remain dependent on operator communication links for some time and will therefore be vulnerable to <a href=\"https://spectrum.ieee.org/ukraine-killer-drones\" target=\"_self\">enemy UAVs that can’t be stopped by jamming<\/a> systems that still provide some protection today.<\/p><p>“The low production cost of strike drones will mean that UGVs will have to endure a barrage of strikes that might be too much,” Lange says. “The question is whether you can make UGVs more survivable on the front line both in terms of command and control and the actual survivability of that many strikes.”<\/p><p>Still, he thinks there’s “no path back from UGVs.” The idea of distributing a whole range of tasks, performed in the past by a single large and expensive tank, to a fleet of small, cheap UGVs provides more resilience against the omnipresent drones. Moreover, although many international commentators now say that Russia appears to be losing, the war grinds on—and so does the cat-and-mouse game of lethal innovation.<\/p>"}, {"title": "Video Friday: A World Cup for Robots", "source": "IEEE Spectrum Robotics", "date": "2026-07-10", "url": "https://spectrum.ieee.org/video-friday-robot-world-cup", "summary": "<img src=\"https://spectrum.ieee.org/media-library/humanoid-robots-play-soccer-as-a-ball-flies-toward-the-goal-in-a-tournament-arena.jpg?id=67119515&amp;width=1245&amp;height=700&amp;coordinates=0%2C312%2C0%2C313\" /><br /><br /><p><span><a href=\"https://spectrum.ieee.org/tag/video-friday\" target=\"_blank\">Video Friday<\/a> is your weekly selection of <a href=\"https://spectrum.ieee.org/video-friday-robot-grippers\" target=\"_blank\">awesome robotics videos<\/a>, collected by your friends at <\/span><em>IEEE Spectrum<\/em><span> robotics. We also post a weekly calendar of upcoming robotics events for the next few months. Please <\/span><a href=\"mailto:automaton@ieee.org?subj
