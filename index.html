ew AI-ready tool flange, and more. <\/p>\n<p>The post <a href=\"https://www.therobotreport.com/universal-robots-launches-its-seventh-generation-robot-platform-at-imts/\">Universal Robots launches its seventh generation robot platform at IMTS<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Arm to discuss scaling physical AI at RoboBusiness", "source": "Robotics Business Review", "date": "2026-09-14", "url": "https://www.therobotreport.com/arm-to-discuss-scaling-physical-ai-at-robobusiness/", "summary": "<p>Dermot O'Driscoll, the VP of go-to-market for physical AI at Arm, will examine key compute principles behind trusted physical AI.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/arm-to-discuss-scaling-physical-ai-at-robobusiness/\">Arm to discuss scaling physical AI at RoboBusiness<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Why RaaS needs more than a subscription model", "source": "Robotics Business Review", "date": "2026-09-14", "url": "https://www.therobotreport.com/why-raas-needs-more-than-a-subscription-model/", "summary": "<p>At RoboBusiness 2026, a panel of robotics business leaders will examine the practical playbook behind Robots-as-a-Service or RaaS offerings. <\/p>\n<p>The post <a href=\"https://www.therobotreport.com/why-raas-needs-more-than-a-subscription-model/\">Why RaaS needs more than a subscription model <\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Report covers advances in surgical robots, deploying warehouse automation in the real world", "source": "Robotics Business Review", "date": "2026-09-14", "url": "https://www.therobotreport.com/report-covers-surgical-robot-advances-deploying-warehouse-automation-real-world/", "summary": "<p>Learn from a surgical robotics case study and a discussion of how to best deploy mobile robots in the warehouse in this issue.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/report-covers-surgical-robot-advances-deploying-warehouse-automation-real-world/\">Report covers advances in surgical robots, deploying warehouse automation in the real world<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "How autonomous fleets are changing what’s possible in American agriculture", "source": "Robotics Business Review", "date": "2026-09-13", "url": "https://www.therobotreport.com/how-autonomous-fleets-are-changing-whats-possible-american-agriculture/", "summary": "<p>Autonomous tractors can help American agriculture, as exemplified in ASI's collaboration with U.S. Sugar and Everglades Equipment.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/how-autonomous-fleets-are-changing-whats-possible-american-agriculture/\">How autonomous fleets are changing what&#8217;s possible in American agriculture<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Ultrasound offers a scalable path to tactile intelligence for physical AI", "source": "Robotics Business Review", "date": "2026-09-12", "url": "https://www.therobotreport.com/ultrasound-offers-scalable-path-tactile-intelligence-physical-ai/", "summary": "<p>Ultrasound sensing can provide tactile perception for robotic hands while avoiding wear and tear, says UltraSense.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/ultrasound-offers-scalable-path-tactile-intelligence-physical-ai/\">Ultrasound offers a scalable path to tactile intelligence for physical AI<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "How to select the right rack and pinion system for high-precision linear motion", "source": "Robotics Business Review", "date": "2026-09-11", "url": "https://www.therobotreport.com/how-to-select-the-right-rack-and-pinion-system-for-high-precision-linear-motion/", "summary": "<p>GAM explains why robotics designers should consider pinion size when thinking about motion control for high-precision applications. <\/p>\n<p>The post <a href=\"https://www.therobotreport.com/how-to-select-the-right-rack-and-pinion-system-for-high-precision-linear-motion/\">How to select the right rack and pinion system for high-precision linear motion<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "How drone developers are navigating changing regulatory landscapes to help farmers", "source": "Robotics Business Review", "date": "2026-09-11", "url": "https://www.therobotreport.com/how-hylio-drone-developers-navigate-changing-regulatory-landscape-help-farmers/", "summary": "<p>Before the FCC put restrictions on foreign-made robots, it had already set similar restrictions on drones last year, noted Hylio.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/how-hylio-drone-developers-navigate-changing-regulatory-landscape-help-farmers/\">How drone developers are navigating changing regulatory landscapes to help farmers<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Video Friday: Humanoid Robot Takes On Monkey Bars", "source": "IEEE Spectrum Robotics", "date": "2026-09-11", "url": "https://spectrum.ieee.org/video-friday-disaster-response-robots", "summary": "<img src=\"https://spectrum.ieee.org/media-library/humanoid-robot-moves-across-scaffolding-rigged-as-playground-monkey-bars-in-a-lab-while-trying-to-keep-its-balance.gif?id=67756707&amp;width=1200&amp;height=800&amp;coordinates=0%2C67%2C0%2C68\" /><br /><br /><p><span>Video Friday is your weekly selection of awesome robotics videos, collected by your friends at <\/span><em>IEEE Spectrum<\/em><span> robotics. We also post a weekly calendar of upcoming robotics events for the next few months. Please <\/span><a href=\"mailto:automaton@ieee.org?subject=Robotics%20event%20suggestion%20for%20Video%20Friday\">send us your events<\/a><span> for inclusion.<\/span><\/p><h5><a href=\"https://humanoidssummit.com/\">Humanoids Summit Seoul<\/a>: 22–23 September 2026, SEOUL<\/h5><h5><a href=\"https://2026.ieee-iros.org/\">IROS 2026<\/a>: 27 September–1 October 2026, PITTSBURGH<\/h5><h5><a href=\"https://www.corl.org/\">CoRL 2026<\/a>: 9–12 November 2026, AUSTIN<\/h5><p>Enjoy today’s videos!<\/p><div class=\"horizontal-rule\"><\/div><div><span style=\"display: none;\"> <\/span><\/div><blockquote class=\"rm-anchors\" id=\"ky2mqam4lq8\"><em>Traversing sparse 3D structures requires humanoid robots to perceive thin, overhanging geometry while executing agile, accurate whole-body motions. We study this problem through monkey-bar traversal, where the robot must jump to the structure, traverse it through sparse bar interactions, and land safely.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>The list of obstacles that you can traverse to escape a robot is getting shorter.<\/p><p>[ <a href=\"https://nemantor.github.io/sparse-3d-traversal-website/\">ETH Zurich Robotic Systems Lab<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"tkmazhql58o\">YES GIVE ROBOTS TWO HEADS I LOVE IT!<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://generalroboticslab.com/DukeHumanoidv2\">General Robotics Lab<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"wpg0va81l7g\"><em>9/11 was the first documented use of <a href=\"https://spectrum.ieee.org/japan-earthquake-more-robots-to-the-rescue\" target=\"_blank\">robots for urban search and rescue<\/a> and helped create the field of disaster robotics. Personnel began assembling on the afternoon of September 11 and worked the pile from late on  September 11 through October 2, when the last available robot failed. The robots found no survivors, but they located remains and helped search for routes through the rubble toward basements and stairwells where trapped firefighters might have gone.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"http://crasar.org/\">CRASAR<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"ghysqmmria4\"><em>Unitree majorly fully open-sources the UnifoLM-WLA-1.0 embodied foundation model, achieving new SOTA results across multiple benchmarks among open-source models worldwide. A single model coordinates desktop and whole-body mobile manipulation, supporting cross-task and cross-end-effector generalization, driven by one model, whole-body coordination.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://unigen-x.github.io/unifolm-wla.github.io/\">Unitree<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"bsvwmcv60xo\"><em>Compliance is very important in physical interaction. In this work, we show how a multi-lined aerial robot uses its centroid and joint motion to achieve hybrid impedance—admittance control in contact-rich aerial manipulation tasks such as surface sliding. This work will be presented in IEEE IROS 2026.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.dragon.t.u-tokyo.ac.jp/\">DRAGON Lab<\/a> ]<\/p><p>Thanks, Moju!<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"xvuwficd5g0\">Remind me not to get too close to this.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://railab.kaist.ac.kr/\">RaiLab Kaist<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"ypkcijt_nuw\">Welcome to this edition of Things That Really Seem Like They Should Not Fly.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://avfl.engr.tamu.edu/\">Texas A&amp;M University Advanced Vertical Flight Lab<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"fna1crvtbls\"><em>Achieving agile and generalized <a href=\"https://spectrum.ieee.org/quadruped-robot-benchmark-barkour\" target=\"_blank\">legged locomotion<\/a> across terrains requires tight integration of perception and control, especially under occlusions and sparse footholds. Existing methods have demonstrated agility on parkour courses but often rely on end-to-end sensorimotor models with limited generalization and interpretability. By contrast, methods targeting generalized locomotion typically exhibit limited agility and struggle with visual occlusions. We introduce a unified reinforcement learning (RL) framework for agile and generalized locomotion that incorporates a novel attention-based map encoder in the control policy.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://sites.google.com/leggedrobotics.com/ame-2\">ETH Zurich Robotic Systems Lab<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"qkijeldgula\">Finally, the killer app for humanoid robots! But we probably shouldn’t call it that.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.unitree.com/\">Unitree<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"p3bftreqwks\">I suspect that this demo avoids many of the things that are actually difficult about doing dishes. Not just the water and the slippery soapiness, but also identifying when a dish is dirty as well as when it is actually clean.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.flexiv.com/\">Flexiv<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"broo89hfta4\">Sure, I guess I might want a robot to deliver a burrito to me while I’m hiking to the top of a mountain in the rain...?<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.deeprobotics.cn/en\">DEEP Robotics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"k9uhqymng9i\"><em>AI has transformed the digital world. It writes our code, generates our images, reasons in our language. But the physical world—the plants that make our power, our fuel, our steel, and chemicals—it has barely touched. ANYbotics CEO and co-founder Péter Fankhauser on the bet behind the company: Why legged robots turned out to be the way into the world’s most demanding industrial plants, what it took to certify one for explosive atmospheres after experts called it impossible, and where autonomous industrial work goes next.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.anybotics.com/\">ANYbotics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div>"}, {"title": "One brick at a time: How Monumental uses robotics to build walls", "source": "Robotics Business Review", "date": "2026-09-11", "url": "https://www.therobotreport.com/one-brick-at-a-time-how-monumental-uses-robotics-to-build-walls/", "summary": "<p>CEO Salar al Khafaji introduces podcast listeners to how Monumental is using robotics to build walls.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/one-brick-at-a-time-how-monumental-uses-robotics-to-build-walls/\">One brick at a time: How Monumental uses robotics to build walls<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Learn how AVs and robotics are laying the groundwork for field deployments at RoboBusiness", "source": "Robotics Business Review", "date": "2026-09-11", "url": "https://www.therobotreport.com/learn-how-avs-robotics-are-laying-groundwork-field-deployments-robobusiness/", "summary": "<p>ASI CEO Mel Torrie will explore why the intersection of autonomous vehicles and robotics will further revolutionize field deployments.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/learn-how-avs-robotics-are-laying-groundwork-field-deployments-robobusiness/\">Learn how AVs and robotics are laying the groundwork for field deployments at RoboBusiness<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Skild AI Taps NVIDIA Physical AI to Teach Robots New Tasks From a Single Video", "source": "NVIDIA Robotics", "date": "2026-09-10", "url": "https://blogs.nvidia.com/blog/skild-ai-s1-physical-ai/", "summary": "Manufacturing floors, warehouses and production lines rarely stay fixed — tasks change, layouts shift and new products arrive, and most robots can’t keep up without significant reprogramming. Skild AI’s new S1 robot foundation model helps address this, designed to learn previously unseen, long-horizon tasks from a single video demonstration. The model, launched last week, uses [&#8230;]"}, {"title": "Swarmer to acquire Ukrainian UGV maker Ratel Robotics for up to $224M", "source": "Robotics Business Review", "date": "2026-09-10", "url": "https://www.therobotreport.com/swarmer-to-acquire-ukrainian-ugv-maker-ratel-robotics-for-up-to-224m/", "summary": "<p>Swarmer, which has developed swarm software, plans to work with Ratel Robotics' unmanned ground vehicles in Ukraine.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/swarmer-to-acquire-ukrainian-ugv-maker-ratel-robotics-for-up-to-224m/\">Swarmer to acquire Ukrainian UGV maker Ratel Robotics for up to $224M<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Comau automates picking, handling, and palletizing for Decathlon", "source": "Robotics Business Review", "date": "2026-09-10", "url": "https://www.therobotreport.com/comau-automates-picking-handling-and-palletizing-for-decathlon/", "summary": "<p>Comau's system incorporates its MyCo cobot, ROS2 software architecture, AI-powered vision systems, and a modular gripper.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/comau-automates-picking-handling-and-palletizing-for-decathlon/\">Comau automates picking, handling, and palletizing for Decathlon<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Robots Are Learning to Feel", "source": "IEEE Spectrum Robotics", "date": "2026-09-10", "url": "https://spectrum.ieee.org/tactile-data-robots", "summary": "<img src=\"https://spectrum.ieee.org/media-library/image.jpg?id=67745231&amp;width=980\" /><br /><br /><p>Dexterous manipulation remains one of the biggest barriers keeping robots from successfully tackling a wide range of everyday tasks. A sense of touch could be the key, but a lack of quality data has held back progress. This is now starting to change as academic labs and startups race to build new tactile datasets and techniques to put them to use.<\/p><p>Over the last few years, <a href=\"https://spectrum.ieee.org/gemini-robotics\" target=\"_self\">vision-language-action (VLA) models<\/a> have significantly improved the ability of robots to carry out complex tasks involving objects and environments they’ve never encountered before. Pretrained on huge amounts of images, video, and text, and then fine-tuned on a smaller number of teleoperated robot demonstrations, these VLAs can guide robots through a growing range of everyday jobs—<a href=\"https://www.pi.website/blog/pistar06\" rel=\"noopener noreferrer\" target=\"_blank\">like folding laundry, tidying living rooms, and even operating kitchen gadgets<\/a>—using just a video feed and natural language instructions.<\/p><p>But robots still struggle with tasks that require fine-grained hand control, such as handling deformable materials or manipulating small objects—plugging in a USB cable or turning a key in a lock, for example. That’s partly because VLAs ignore one of the primary sources of information humans rely on in these situations: tactile feedback.<\/p><h2>Manipulating Like Humans<\/h2><p>“Most dexterous manipulation can be done by humans with their eyes closed,” says <a href=\"https://people.eecs.berkeley.edu/~trevor/\" rel=\"noopener noreferrer\" target=\"_blank\">Trevor Darrell<\/a>, professor of computer science at the University of California, Berkeley. “Understanding force, slip, and precise grasping is not something that can be done well with traditional vision sensors.”<\/p><p>However, making effective use of tactile sensors is difficult. Tactile sensor data has very different characteristics to the image data VLAs are normally trained on, and tactile datasets lag far behind the internet-scale of many vision and language datasets. To get around this, Darrell’s team devised a way to first pretrain a model on existing datasets before giving it a sense of touch by training a specialist submodel on <a href=\"https://arxiv.org/abs/2606.17055\" rel=\"noopener noreferrer\" target=\"_blank\">100 hours of specially collected, high-quality tactile data<\/a>, including demonstrations of common actions like wiping, grasping, twisting, or pouring using more than 200 different household objects.<\/p><h3><\/h3><br />\n<p class=\"caption\">Explore an interactive visualizer of a small portion of the T-Rex dataset. <span class=\"image-media media-photo-credit\"><a href=\"https://tactile-reactive-dexterous.github.io/#citation\" target=\"_blank\">T-Rex<\/a><\/span><\/p><p>Putting the tactile data to use was not straightforward. The goal was for a robot to be able to use the tactile signal to correct its grip in real time as it manipulated objects. But this requires reaction times faster than most vision-language models operate at. This mismatch is a significant challenge, Darrell says, so the team used separate submodels, known as “experts,” to handle high-level actions and low-level tactile control in a way that’s quick enough for the tactile feedback to be useful.<\/p><p>The action expert produces motion plans, while the tactile expert, which operates four times faster, uses tactile feedback to adjust the motion plan in real time based on what the robot is feeling as it goes. The model was then fine-tuned on about 100 teleoperated demonstrations of relatively complex manipulation tasks, such as screwing in a light bulb, applying toothpaste to a toothbrush, or transferring an egg between trays, where it averaged a success rate of 65 percent across 12 tasks—nearly double the best VLA model.<\/p><h2>Data Diversity<\/h2><p>One limitation, admits Darrell, is that his data comes from a single instance of robotic hardware. Robot hands range from fully articulated five-finger designs to simple pincer grippers, and tactile sensors can rely on fundamentally different physics, from measuring changes in resistance to recording images of a soft gel pad deforming. That makes most tactile AI research sensor-specific, says <a href=\"https://michaelyuancb.github.io/\" target=\"_blank\">Chengbo Yuan<\/a>, a master’s student at Tsinghua University in Beijing, and makes it hard to share data and transfer learnings between groups.<\/p><p>Yuan recently set out to tackle this problem by <a href=\"https://arxiv.org/pdf/2606.13102\" rel=\"noopener noreferrer\" target=\"_blank\">aggregating more than 3,000 hours<\/a> of tactile robotic data from publicly available datasets, covering 21 sensor types and a variety of robot embodiments. Yuan says they were inspired by efforts like the <a href=\"https://spectrum.ieee.org/global-robotic-brain\" target=\"_self\">Open X-Embodiment collaboration<\/a>, which pooled data from many robots and led to models that generalize to hardware not used in training. Yuan’s team then designed a hardware-agnostic model that can train on this diverse data by converting each sensor’s output into a shared format and mapping it onto labeled positions on a template of a human hand. This model was much more successful than a baseline model, even on hardware it had never encountered before. Yuan puts that down to it acquiring “some kind of common sense of tactile knowledge,” by training on such diverse setups.<\/p><h2>Chasing Scale<\/h2><p>Despite the promising results, Yuan thinks more tactile data is needed, and his group is now leading an 80-institution collaboration to collate a larger set of teleoperated demonstrations using a standardized approach to tactile data collection and processing. In the meantime, Fudan University in Shanghai and its spin-out <a href=\"https://baike.baidu.com/en/item/NeoteAI/1682418\" rel=\"noopener noreferrer\" target=\"_blank\">NeoteAI<\/a> have already produced <a href=\"https://research.neoteai.com/assets/n0-foundation-report.pdf\" rel=\"noopener noreferrer\" target=\"_blank\">a tactile dataset<\/a> an order of magnitude larger than previous efforts. Using <a href=\"https://neoteai.com/\" rel=\"noopener noreferrer\" target=\"_blank\">a proprietary sensor<\/a> attached to a variety of robotic arms and a handheld gripper operated by humans, they have collected more than 30,000 hours of demonstrations with synchronized visual and tactile data.<\/p><p>The researchers used this data to <a href=\"https://research.neoteai.com/n0-twam/\" rel=\"noopener noreferrer\" target=\"_blank\">train a model<\/a> that doesn’t just react to touch, but also proactively predicts what the robot should be feeling to help guide and assess actions, significantly improving performance. <a href=\"https://shunlinlu.github.io/\" rel=\"noopener noreferrer\" target=\"_blank\">Shunlin Lu<\/a>, a postdoc researcher at Fudan University and CTO of NeoteAI, says the results are clear evidence that access to large-scale and diverse tactile data leads to significant performance gains.<\/p><p class=\"shortcode-media shortcode-media-youtube\"> <span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><small class=\"image-media media-caption\">Robot manipulation policies with a tactile component offer improved performance on a variety of real-world tasks.<\/small><small class=\"image-media media-photo-credit\">NeoteAI<\/small><\/p><p>Another approach to scaling tactile data could be to piggyback on the vast quantities of visual robotics data already collected. Researchers at the University of Southern California, in Los Angeles, recently <a href=\"https://arxiv.org/pdf/2607.20683\" rel=\"noopener noreferrer\" target=\"_blank\">released a model<\/a> that learned to infer tactile information from visual data, by training it on more than 2,700 demonstrations of everyday manipulation using a handheld gripper that records both tactile data and images from a camera on the device. The model learned associations between images of the gripper coming into contact with objects and the amount of pressure felt by the tactile sensors at that moment, giving even robots without tactile sensors a rudimentary sense of touch that the researchers showed to be particularly useful for contact-rich manipulation tasks. But their broader ambition is to use the generator to add tactile data to existing vision datasets.<\/p><p>How much tactile data will be required for breakthroughs in dexterous tasks remains unclear. So far, tactile training’s main contribution has been to make robots more efficient learners at tasks already within reach like picking and placing objects, says Yuan, and he suspects new algorithms may be required to tackle problems truly impossible without touch.<\/p><p><a href=\"https://people.ucas.ac.cn/~chenglong?language=en\" rel=\"noopener noreferrer\" target=\"_blank\">Long Cheng<\/a> of the Chinese Academy of Sciences in Beijing also thinks raw data is no panacea. “Data is good,” he says. “But how to use them correctly is another issue.” The problem, he notes, is that vision provides a continuous, high-bandwidth stream of pixels, while tactile signals are sparse and intermittent, so models learn to ignore them. His solution, being presented at <a href=\"https://2026.ieee-iros.org/\" rel=\"noopener noreferrer\" target=\"_blank\">IROS 2026<\/a> later this month, is a model that predicts what a robot will feel from vision alone and then compares it against real tactile input. A large gap between the two means the sensor is detecting something the robot would otherwise miss, so these surprising signals are amplified while predictable ones are dampened. Across five contact-rich tasks, the approach averaged 62.8 percent success against 28.2 percent for the same model without touch.<\/p><p>Lu is more confident that data scaling could have similar benefits to those seen in areas like language and vision. He guesses closer to 100,000 hours, collected in varied, real-world settings rather than in the lab, could unlock new capabilities. Either way, the field now has some early signs that larger tactile datasets and smarter ways to use them can give robots a significant boost on some of the most challenging tasks. “I think tactile intelligence is actually the next step for physical AI,” Lu says.<\/p>"}, {"title": "Teradyne Robotics sues JAKA over 3 Universal Robots patents", "source": "Robotics Business Review", "date": "2026-09-10", "url": "https://www.therobotreport.com/teradyne-robotics-sues-jaka-over-3-universal-robots-patents/", "summary": "<p>New details reveal the lawsuit involves three Universal Robots patents about robot interfaces, safety brakes, and joints.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/teradyne-robotics-sues-jaka-over-3-universal-robots-patents/\">Teradyne Robotics sues JAKA over 3 Universal Robots patents<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "AGIBOT to explain how to scale humanoids from the lab to the real world at RoboBusiness", "source": "Robotics Business Review", "date": "2026-09-09", "url": "https://www.therobotreport.com/agibot-share-plans-scale-humanoids-from-lab-to-real-world-at-robobusiness/", "summary": "<p>AGIBOT plans to give attendees actionable insights on identifying high-value robotics use cases and building sustainable developer ecosystems.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/agibot-share-plans-scale-humanoids-from-lab-to-real-world-at-robobusiness/\">AGIBOT to explain how to scale humanoids from the lab to the real world at RoboBusiness<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Vention opens Physical AI Lab for manufacturing in Montreal", "source": "Robotics Business Review", "date": "2026-09-09", "url": "https://www.therobotreport.com/vention-opens-physical-ai-lab-manufacturing-montreal/", "summary": "<p>Vention's new Physical AI Lab will focus on advancing robotic manipulation from research to scalable production-line deployment.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/vention-opens-physical-ai-lab-manufacturing-montreal/\">Vention opens Physical AI Lab for manufacturing in Montreal<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Unitree shares down 53% from IPO debut", "source": "Robotics Business Review", "date": "2026-09-09", "url": "https://www.therobotreport.com/unitree-shares-down-53-from-ipo-debut/", "summary": "<p>The market is pulling back on Unitree's $66 billion valuation from its debut on the Shanghai Stock Exchange just last month.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/unitree-shares-down-53-from-ipo-debut/\">Unitree shares down 53% from IPO debut<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "What bricklaying has taught Monumental about robots in construction", "source": "Robotics Business Review", "date": "2026-09-09", "url": "https://www.therobotreport.com/what-bricklaying-has-taught-monumental-about-robots-construction/", "summary": "<p>The construction industry is rife with opportunity for robotics, but the technology hasn't broken in at scale yet. <\/p>\n<p>The post <a href=\"https://www.therobotreport.com/what-bricklaying-has-taught-monumental-about-robots-construction/\">What bricklaying has taught Monumental about robots in construction<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Why vision AI is the safety backbone of the automated job site", "source": "Robotics Business Review", "date": "2026-09-08", "url": "https://www.therobotreport.com/why-vision-ai-is-safety-backbone-of-automated-job-site/", "summary": "<p>Vision AI doesn't replace robots or human judgement; it provides the continuous perception that allows both to operate safely together.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/why-vision-ai-is-safety-backbone-of-automated-job-site/\">Why vision AI is the safety backbone of the automated job site<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Boston Dynamics veteran launches Dynamic Creatures to bring characters to life with robotics", "source": "Robotics Business Review", "date": "2026-09-08", "url": "https://www.therobotreport.com/boston-dynamics-veterans-launch-dynamic-creatures-to-bring-characters-to-life-with-robotics/", "summary": "<p>Dynamic Creatures plants to create its own line of characters, and to re-create characters for specific brands and environments.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/boston-dynamics-veterans-launch-dynamic-creatures-to-bring-characters-to-life-with-robotics/\">Boston Dynamics veteran launches Dynamic Creatures to bring characters to life with robotics<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "AI can’t outrun a humanoid’s hardware", "source": "Robotics Business Review", "date": "2026-09-08", "url": "https://www.therobotreport.com/ai-cant-outrun-a-humanoids-hardware/", "summary": "<p>The remarkable progress in AI has brought robotics closer to machines capable of determining what they should do. The next major advance may depend on whether their physical systems can execute those decisions efficiently, precisely and safely.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/ai-cant-outrun-a-humanoids-hardware/\">AI can’t outrun a humanoid&#8217;s hardware<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "This Robot Will Draw Your Blood Now", "source": "IEEE Spectrum Robotics", "date": "2026-09-07", "url": "https://spectrum.ieee.org/blood-draw-robot-vitestro-aletta", "summary": "<img src=\"https://spectrum.ieee.org/media-library/an-older-silver-haired-woman-seated-at-automated-medical-device-with-a-robotic-arm-drawing-blood.jpg?id=67726417&amp;width=1200&amp;height=800&amp;coordinates=0%2C83%2C0%2C84\" /><br /><br /><p>You sit down and put your arm in the cradle. You press a button. The machine takes it from there.<\/p><p>A <a href=\"https://spectrum.ieee.org/tag/near-infrared-light\" target=\"_self\">near-infrared light<\/a> sweeps your inner elbow, hunting for a vein. A puff of alcohol hits your skin. An <a href=\"https://spectrum.ieee.org/tag/ultrasound\" target=\"_self\">ultrasound<\/a> probe glides across your arm, mapping how deep the vessel runs and which way it bends. Doppler captures the direction of blood flow to rule out the artery.<\/p><p>The cuff tightens around your upper arm. The needle comes down and pierces the skin. Your blood flows into the collection tubes, each one tipped end over end nine times—no more, no less. The needle withdraws. You get a bandage. No human ever touched you.<\/p><p>This is what it’s like to have blood taken by <a href=\"https://vitestro.com/aletta/\" rel=\"noopener noreferrer\" target=\"_blank\">Aletta<\/a>, the first <a href=\"https://spectrum.ieee.org/profile-veebot\" target=\"_self\">autonomous blood-draw device<\/a> authorized for use in the United States. Developed by the Dutch medical robotics firm <a href=\"https://vitestro.com/\" rel=\"noopener noreferrer\" target=\"_blank\">Vitestro<\/a>, the system combines imaging technologies with advanced robotics and AI to do by algorithm what a human phlebotomist—a trained health care professional who finds veins and draws blood by hand—does by feel.<\/p><p>The U.S. Food and Drug Administration <a href=\"https://www.fda.gov/news-events/press-announcements/fda-authorizes-first-its-kind-robotic-blood-draw-device\" rel=\"noopener noreferrer\" target=\"_blank\">gave Aletta the go-ahead<\/a> on 19 August for use on adults in nonhospitalized settings. The decision follows the lead of European regulators, who <a href=\"https://www.prnewswire.com/news-releases/vitestro-achieves-ce-marking-for-autonomous-blood-drawing-device-302231939.html\" rel=\"noopener noreferrer\" target=\"_blank\">authorized the device two years earlier<\/a>.<\/p><p>“You have to tip your cap to them,” says <a href=\"https://www.linkedin.com/in/maxbalter/\" rel=\"noopener noreferrer\" target=\"_blank\">Max Balter<\/a>, a surgical-robotics specialist at Medtronic who <a href=\"https://ieeexplore.ieee.org/document/7169572\" rel=\"noopener noreferrer\" target=\"_blank\">worked<\/a> on <a href=\"https://ieeexplore.ieee.org/document/7457657\" rel=\"noopener noreferrer\" target=\"_blank\">autonomous<\/a> blood-draw <a href=\"https://www.worldscientific.com/doi/10.1142/S2339547819500067\" rel=\"noopener noreferrer\" target=\"_blank\">systems<\/a> during grad school in the mid-2010s. “The engineering that they have is incredible…and with their FDA clearance, it moves the whole industry forward.”<\/p><h2>Aletta Boosts Lab Capacity Amid Shortages<\/h2><p>In a clinical trial involving more than 1,600 people in the Netherlands, Aletta successfully drew blood on the first attempt in <a href=\"https://doi.org/10.1093/clinchem/hvag029\" rel=\"noopener noreferrer\" target=\"_blank\">94.5 percent of cases<\/a>, even among those with hard-to-access veins, people with obesity, and the elderly. When Aletta failed to identify a suitable vein, the patient was referred for conventional phlebotomy.<\/p><p>“It’s exceptional performance,” says <a href=\"https://medicine.yale.edu/profile/joe-el-khoury/\" rel=\"noopener noreferrer\" target=\"_blank\">Joe El-Khoury<\/a>, a clinical chemist at Yale who was not involved in the Dutch trial. “It’s definitely as good if not better” than a typical professional phlebotomist.<\/p><p>Complications were minimal, with multiple built-in safeguards to detect problems, such as sensors that track arm movement and needle position, and to halt the process should something go awry. And for those whose veins proved too challenging, a phlebotomist remains on hand to take over when needed.<\/p><p>Notably, because a single phlebotomist can supervise up to three Aletta machines, the system should go a long way toward “helping clinical labs address the critical operational challenges related to the staffing shortages of phlebotomists,” says <a href=\"https://www.linkedin.com/in/luuk-giesen/\" rel=\"noopener noreferrer\" target=\"_blank\">Luuk Giesen<\/a>, chief medical officer of Vitestro.<\/p><p>That’s no small challenge in a profession with a <a href=\"https://aplm.kglmeridian.com/doi/10.5858/arpa.2019-0140-CP\" rel=\"noopener noreferrer\" target=\"_blank\">median annual turnover rate of nearly 25 percent<\/a> and a <a href=\"https://academic.oup.com/ajcp/article/164/5/759/8267738\" rel=\"noopener noreferrer\" target=\"_blank\">vacancy rate of close to 10 percent<\/a>, according to surveys of medical laboratories that draw mostly from U.S. institutions. The resulting staffing shortages can limit labs’ capacity to meet demand for routine diagnostic testing of blood counts, cholesterol, metabolic markers, and more. Aletta could address that bottleneck.<\/p><h2>Addressing Skin Tone Bias in Blood Draw AI<\/h2><p>The promise of greater capacity, however, comes with a caveat: Aletta still fails in roughly one case out of 20. Who are those people?<\/p><p>Some may simply have elusive or unusually deep veins. But a more significant obstacle could be skin pigmentation. In particular, the melanin in darker skin can interfere with the near-infrared light Aletta uses to first map the veins near the skin’s surface and identify promising puncture sites. The technique relies on hemoglobin absorbing the light differently from surrounding tissue, and darker skin tones can absorb more of that light before it reaches the camera, thereby reducing the contrast.<\/p><p class=\"shortcode-media shortcode-media-rebelmouse-image\"> <img alt=\"A smiling dark skinned woman holds a bandaid onto her arm while sitting next to a large machine.\" class=\"rm-shortcode\" id=\"9138e\" src=\"https://spectrum.ieee.org/media-library/a-smiling-dark-skinned-woman-holds-a-bandaid-onto-her-arm-while-sitting-next-to-a-large-machine.jpg?id=67726420&amp;width=980\" /> <small class=\"image-media media-caption\">Some experts have raised concerns that Aletta’s infrared sensors will perform poorly for people with darker skin tones, but Vitestro says that its machine also includes an ultrasound sensor, in part to mitigate that risk.<\/small><small class=\"image-media media-photo-credit\">Vitestro<\/small><\/p><p>Giesen recognizes that the issue could affect first-pass imaging, but notes that the main determinant of vein selection and needle placement is the ultrasound system, which relies on sound rather than light and should not be affected by skin pigmentation in the same way. “Ultrasound is skin-tone agnostic,” he says, adding that Vitestro has unpublished data showing no effect of skin tone on the system’s performance.<\/p><p>The company thus <a href=\"https://vitestro.com/aletta/patients/\" target=\"_blank\">claims on its website<\/a> that the “technology works well for all skin tones,” an assertion <a href=\"https://www.fda.gov/news-events/press-announcements/fda-authorizes-first-its-kind-robotic-blood-draw-device\" rel=\"noopener noreferrer\" target=\"_blank\">echoed in the FDA press release<\/a> announcing the authorization of Vitestro’s device.<\/p><p>But given the history of racial disparities in medical devices—particularly optical technologies such as pulse oximeters, which can be <a href=\"https://spectrum.ieee.org/pulse-oximeters-encode-racial-bias-with-clear-consequences-for-covid-19-patients\" target=\"_self\">less accurate in people with darker skin<\/a> and went largely unrecognized as a problem for decades—such claims warrant evidence, says El-Khoury, who has <a href=\"https://academic.oup.com/clinchem/article-lookup/doi/10.1093/clinchem/hvag045\" rel=\"noopener noreferrer\" target=\"_blank\">written about the issue<\/a>.<\/p><p><a href=\"https://www.mayoclinic.org/biographies/katzman-brooke-m-ph-d/bio-20514695\" rel=\"noopener noreferrer\" target=\"_blank\">Brooke Katzman<\/a>, a clinical chemist at the Mayo Clinic who is collaborating with Vitestro, also wants more evidence that samples collected by the robot are as suitable for testing as those drawn by hand.<\/p><p>The Dutch trial reported little damage to red blood cells, but other measures of sample quality, including clotted tubes, insufficient blood, and proper tube filling, still need to be assessed, as do the results of routine laboratory tests themselves. Katzman plans to launch a U.S.-based trial next year to collect just that sort of data.<\/p><p>“We’re going to do our due diligence,” she says. “Like any instrument we would bring into the lab, we’re going to put it through its paces before using it clinically.”<\/p><h2>The Future of Automated Blood Testing<\/h2><p>Aletta takes its name from the 19th-century physician <a href=\"https://pmc.ncbi.nlm.nih.gov/articles/PMC11151697/\" rel=\"noopener noreferrer\" target=\"_blank\">Aletta Jacobs<\/a>, the first female doctor in the Netherlands and founder of what is widely considered the world’s first birth-control clinic.<\/p><p>That nod to history is fitting for a technology that builds on decades of research in robotic phlebotomy by groups in <a href=\"https://ieeexplore.ieee.org/document/826854/\" rel=\"noopener noreferrer\" target=\"_blank\">Europe<\/a>, the <a href=\"https://www.researchgate.net/publication/309480332_Robotic_Assistive_Device_for_Phlebotomy\" rel=\"noopener noreferrer\" target=\"_blank\">United States<\/a>, and <a href=\"https://haoyangli16.github.io/pdf/venibot.pdf\" rel=\"noopener noreferrer\" target=\"_blank\">China<\/a>, and <a href=\"https://doi.org/10.3389/fmed.2023.1251963\" rel=\"noopener noreferrer\" target=\"_blank\">MagicNurse<\/a>. Yet few pushed the concept as far as biomedical engineer <a href=\"https://bme.rutgers.edu/martin-l-yarmush\" rel=\"noopener noreferrer\" target=\"_blank\">Martin Yarmush<\/a> of Rutgers University in New Jersey, in whose lab Medtronic’s Balter completed his Ph.D.<\/p><p>In one version of their platform, the Rutgers team even <a href=\"https://ieeexplore.ieee.org/document/7759102/\" rel=\"noopener noreferrer\" target=\"_blank\">coupled their robot to a benchtop blood analyzer<\/a>, allowing it to draw samples and then measure levels of infection-fighting immune cells and oxygen-carrying red blood cells—all within minutes.<\/p><p>That all-in system never made it out of laboratory testing. And VascuLogic, the company spun out to commercialize the platform, is long defunct—though others, including <a href=\"https://rophai.net/\" rel=\"noopener noreferrer\" target=\"_blank\">ROPHAI<\/a>, <a href=\"https://bhealthcare.com/\" rel=\"noopener noreferrer\" target=\"_blank\">BHealthCare<\/a>, and <a href=\"https://doi.org/10.3389/fmed.2023.1251963\" rel=\"noopener noreferrer\" target=\"_blank\">MagicNurse<\/a>, continue to work in the space. But the Rutgers proof-of-concept demonstration points toward the tantalizing possibility of fully automated blood testing at the point of care, with robots handling everything from the needle stick to the analysis.<\/p><p>It is, in some ways, the promise that Theranos made—but built on conventional, validated laboratory technology rather than the <a href=\"https://www.goodreads.com/en/book/show/37976541-bad-blood\" rel=\"noopener noreferrer\" target=\"_blank\">dubious science and deception<\/a> that brought that particular company down.<\/p><p>“I have no doubt that is the future,” says <a href=\"https://www.feinberg.northwestern.edu/faculty-profiles/az/profile.html?xid=22300\" rel=\"noopener noreferrer\" target=\"_blank\">Gregory Retzinger<\/a>, a clinical pathologist at the Northwestern University Feinberg School of Medicine, in Chicago, who <a href=\"https://vitestro.com/news/northwestern-medicine-and-vitestro-collaborate-to-advance-autonomous-robotic-phlebotomy/\" rel=\"noopener noreferrer\" target=\"_blank\">collaborates with Vitestro<\/a> and has tried the Aletta device himself. (“It was painless, it was fast,” he says.)<\/p><p>For now, Giesen says Vitestro is keeping its ambitions—and its machine—focused on the blood-collection process itself, though he believes Aletta could ultimately do far more. The company plans to launch Aletta in Europe next year, with the U.S. market to follow. <\/p>"}, {"title": "Inbolt to discuss physical AI’s deployment problem at RoboBusiness", "source": "Robotics Business Review", "date": "2026-09-07", "url": "https://www.therobotreport.com/inbolt-ceo-to-discuss-physical-ais-deployment-problem-at-robobusiness/", "summary": "<p>Rudy Cohen, the co-founder and CEO of Inbolt, will reframe where physical AI pays off at RoboBusiness this fall.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/inbolt-ceo-to-discuss-physical-ais-deployment-problem-at-robobusiness/\">Inbolt to discuss physical AI&#8217;s deployment problem at RoboBusiness<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Agility Robotics reports $1.8M revenue ahead of humanoid SPAC", "source": "Robotics Business Review", "date": "2026-09-07", "url": "https://www.therobotreport.com/agility-robotics-reports-18m-revenue-ahead-of-humanoid-spac/", "summary": "<p>Agility Robotics’ S-4 filing reveals $1.8 million in 2025 revenue, a $140 million operating loss and plans to scale its Digit humanoid robot business.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/agility-robotics-reports-18m-revenue-ahead-of-humanoid-spac/\">Agility Robotics reports $1.8M revenue ahead of humanoid SPAC<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}], "embeddedNews": [{"title": "Upgrading An iPhone Lens To The Max", "source": "Hackaday", "date": "2026-10-07", "url": "https://hackaday.com/2026/10/06/upgrading-an-iphone-lens-to-the-max/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"450\" src=\"https://hackaday.com/wp-content/uploads/2026/10/iphone-camera-featured.jpg?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>The camera in a typical mobile phone is now at a standard at which it can be considered a serious device rather than a toy, such has been the effort <a class=\"read-more\" href=\"https://hackaday.com/2026/10/06/upgrading-an-iphone-lens-to-the-max/\">&#8230;read more<\/a>"}, {"title": "NuMaker-IoT-MA35D0-A2 (Chili Pro) ultra-compact evaluation board features MA35D0K Cortex-A35/M4 MPU", "source": "CNX Software", "date": "2026-10-07", "url": "https://www.cnx-software.com/2026/10/07/numaker-iot-ma35d0-a2-chili-pro-ultra-compact-evaluation-board-features-ma35d0k-cortex-a35-m4-mpu/", "summary": "<div><img alt=\"NuMaker IoT MA35H0 A2 evaluation board\" class=\"attachment-medium size-medium wp-post-image\" height=\"480\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/10/NuMaker-IoT-MA35H0-A2-evaluation-board-720x480.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Nuvoton has added MA35D05KH67C, MA35D05KI67C, and MA35D05KJ67C, three new LQFP128 MPUs, to the NuMicro MA35D0 series, along with the NuMaker-IoT-MA35D0-A2 (Chili Pro) evaluation board. Designed for industrial AI, smart gateways, and renewable energy systems, this heterogeneous MPU has two 64-bit Arm Cortex-A35 cores at up to 650 MHz, plus a dedicated 180 MHz Arm Cortex-M4 for real-time work. Nuvoton’s press release calls Chili Pro the “industry’s smallest Linux platform,” but the board is 45 × 45 mm, which is bigger than other boards we wrote about previously, like the VoCore2 (25.4 × 25.4 × 2.8 mm), the Milk-V Duo 256M (51 × 21 mm), NanoPi NEO (40 × 40 mm), and even the Raspberry Pi Zero 2 W (65 × 30 mm). Still, considering that it fits full-sized RJ45 and USB ports along with the other interfaces, it is a pretty compact and capable board. Nuvoton NuMaker-IoT-MA35D0-A2 evaluation board specifications: [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/10/07/numaker-iot-ma35d0-a2-chili-pro-ultra-compact-evaluation-board-features-ma35d0k-cortex-a35-m4-mpu/\">NuMaker-IoT-MA35D0-A2 (Chili Pro) ultra-compact evaluation board features MA35D0K Cortex-A35/M4 MPU<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Top Ten SiC Producers", "source": "Electronics Weekly", "date": "2026-10-07", "url": "https://www.electronicsweekly.com/blogs/mannerisms/ten-best/top-ten-sic-producers-2026-10/", "summary": "<p>Thanks to Mordor Intelligence for this one &#8211; the top ten SiC producers: &#160; Infineon  ST Wolfspeed onsemi  ROHM  Mitsubishi Electric:  Fuji Electric Microchip Toshiba Semikron Danfoss<\/p>\n<p>The post <a href=\"https://www.electronicsweekly.com/blogs/mannerisms/ten-best/top-ten-sic-producers-2026-10/\">Top Ten SiC Producers<\/a> appeared first on <a href=\"https://www.electronicsweekly.com\">Electronics Weekly<\/a>.<\/p>"}, {"title": "DIY Algae Biodiesel is Harder Than You Think", "source": "Hackaday", "date": "2026-10-06", "url": "https://hackaday.com/2026/10/06/diy-algae-biodiesel-is-harder-than-you-think/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"450\" src=\"https://hackaday.com/wp-content/uploads/2026/10/algae-biodiesel-feat.jpg?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>There&#8217;s one thing [Silent H] wants you to know before you watch his video about making biodiesel, embedded below: he started this project before he&#8217;d even heard of the Strait <a class=\"read-more\" href=\"https://hackaday.com/2026/10/06/diy-algae-biodiesel-is-harder-than-you-think/\">&#8230;read more<\/a>"}, {"title": "SmallTV Hacking With Surprisingly Little Fuss", "source": "Hackaday", "date": "2026-10-06", "url": "https://hackaday.com/2026/10/06/smalltv-hacking-with-surprisingly-little-fuss/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"288\" src=\"https://hackaday.com/wp-content/uploads/2026/10/smalltv_feat.png?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>We&#8217;ve seen the GeekMagic SmallTV line of devices before &#8212; these cheap gadgets combine a microcontroller and a display in a little plastic case that can be used to show <a class=\"read-more\" href=\"https://hackaday.com/2026/10/06/smalltv-hacking-with-surprisingly-little-fuss/\">&#8230;read more<\/a>"}, {"title": "Scientists Create Hexagonal Packed Ice at Extreme Pressures", "source": "Hackaday", "date": "2026-10-06", "url": "https://hackaday.com/2026/10/06/scientists-create-hexagonal-packed-ice-at-extreme-pressures/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"450\" src=\"https://hackaday.com/wp-content/uploads/2018/02/neptune.jpg?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>One of the problems with planetary science is that you generally cannot easily investigate the exact conditions in their interior, so you&#8217;re left to extrapolate what is happening inside them <a class=\"read-more\" href=\"https://hackaday.com/2026/10/06/scientists-create-hexagonal-packed-ice-at-extreme-pressures/\">&#8230;read more<\/a>"}, {"title": "A Headset Fit For A Hackaday Writer", "source": "Hackaday", "date": "2026-10-06", "url": "https://hackaday.com/2026/10/06/a-headset-fit-for-a-hackaday-writer/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"450\" src=\"https://hackaday.com/wp-content/uploads/2026/09/jennys-headset-featured.jpg?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>I started writing this from a commuter train passing at speed through the outskirts of London, and my headset had just broken. The flexible joint that attaches one earpiece to <a class=\"read-more\" href=\"https://hackaday.com/2026/10/06/a-headset-fit-for-a-hackaday-writer/\">&#8230;read more<\/a>"}, {"title": "The EDG C++ Compiler Frontend has been Open Sourced", "source": "Hackaday", "date": "2026-10-06", "url": "https://hackaday.com/2026/10/06/the-edg-c-compiler-frontend-has-been-open-sourced/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"484\" src=\"https://hackaday.com/wp-content/uploads/2017/05/c.jpg?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>Recently [John Spicer] of the EDG C++ compiler front-end project announced that the project will be made open source, from now on managed by the non-profit C++ Alliance. Related source <a class=\"read-more\" href=\"https://hackaday.com/2026/10/06/the-edg-c-compiler-frontend-has-been-open-sourced/\">&#8230;read more<\/a>"}, {"title": "Using LineageOS for Phones and DIY Smart TVs is Pretty Nifty", "source": "Hackaday", "date": "2026-10-06", "url": "https://hackaday.com/2026/10/06/using-lineageos-for-phones-and-diy-smart-tvs-is-pretty-nifty/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"534\" src=\"https://hackaday.com/wp-content/uploads/2026/10/lineage_stacked_teal.png?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>Although Android is essentially just another Linux distribution, most people only experience it in the form of the rather restrictive and proprietary versions found on smartphones, tablets and smart TVs. <a class=\"read-more\" href=\"https://hackaday.com/2026/10/06/using-lineageos-for-phones-and-diy-smart-tvs-is-pretty-nifty/\">&#8230;read more<\/a>"}, {"title": "XIMEA MU003TG-SY-UC – A miniature, modular 0.3MP USB 3.0 ToF Sensor based on Sony IMX556", "source": "CNX Software", "date": "2026-10-06", "url": "https://www.cnx-software.com/2026/10/06/ximea-mu003tg-sy-uc-a-miniature-modular-0-3mp-usb-3-0-tof-sensor-based-on-sony-imx556/", "summary": "<div><img alt=\"XIMEA MU003TG SY UC A miniature 0.3MP Sony IMX556 ToF Sensor with USB 3.0 interface\" class=\"attachment-medium size-medium wp-post-image\" height=\"480\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/10/XIMEA-MU003TG-SY-UC-A-miniature-0.3MP-Sony-IMX556-ToF-Sensor-with-USB-3.0-interface-720x480.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>The XIMEA MU003TG-SY-UC is a miniature industrial Time-of-Flight (ToF) camera with a 0.3MP Sony IMX556 CMOS sensor, global shutter, 640 × 480 resolution, and a 60 FPS frame rate. Its compact 26.4 × 26.4 × 28.67 mm enclosure and 31-gram weight make it suitable for space-limited embedded vision systems, robotics, UAVs, kiosks, 3D scanning, face recognition, and other machine-vision applications. The module uses a USB 3.2 Gen 1 interface through a 14-pin I-PEX Cabline SS connector for data, power, and control. A separate 10-pin Cabline V connector provides synchronization with external VCSEL illumination. The camera does not include an illumination source or optical band-pass filter, so these components must be provided separately for depth sensing. XIMEA MU003TG-SY-UC specifications: Sensor &#8211; Sony IMX556 CMOS Time-of-Flight sensor, global shutter, no on-sensor filter Resolution &#8211; 0.3 megapixels (640 × 480); active area 6.4 × 4.8 mm Pixel Size &#8211; 10 µm x 10 [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/10/06/ximea-mu003tg-sy-uc-a-miniature-modular-0-3mp-usb-3-0-tof-sensor-based-on-sony-imx556/\">XIMEA MU003TG-SY-UC &#8211; A miniature, modular 0.3MP USB 3.0 ToF Sensor based on Sony IMX556<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Save $70 on GEEKOM A5 Pro 2026 Edition mini PC during Prime Day Sale (Sponsored)", "source": "CNX Software", "date": "2026-10-06", "url": "https://www.cnx-software.com/2026/10/06/save-70-on-geekom-a5-pro-2026-edition-mini-pc-for-prime-day-sale/", "summary": "<div><img alt=\"GEEKOM mini PC Prime Day 2026 deals\" class=\"attachment-medium size-medium wp-post-image\" height=\"405\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/10/GEEKOM-mini-PC-Prime-Day-2026-deals p-you-find-out-circuitplayground/", "summary": "This is a fun and simple beginner project that turns the Circuit Playground into a cold temperature indicator. It uses the on board temperature sensor to read the current temperature. The coldest temperature measured is indicated on the NeoPixels. An additional sketch is provided which turns the Circuit Playground into a temperature data logger. This [&#8230;]"}, {"title": "LED Jellyfish Costume", "source": "Adafruit", "date": "2026-10-06", "url": "https://blog.adafruit.com/2026/10/06/led-jellyfish-costume/", "summary": "&#160; image via Instructables, deadinsect &#160; Instructables user deadinsect made this glowing jellyfish costume with a helmet, bowl and LED rope lights! Check out their write up on Instructables. This project is giving us major Jellyfish Umbrella vibes! HAPPY HALLOWEEN! All month on the Adafruit Blog we&#8217;ll be bringing you ideas and projects for an [&#8230;]"}, {"title": "Queens Public Library’s Hispanic Heritage Month Booklists", "source": "Adafruit", "date": "2026-10-06", "url": "https://blog.adafruit.com/2026/10/06/queens-public-librarys-hispanic-heritage-month-booklists/", "summary": "The folks at Queens Public Library have put together 6 fantastic book lists to celebrate Hispanic Heritage Month: For Adults For Teens For Children Libros Para Adultos Libros Para Adolescentes Libros Para Niños"}, {"title": "Qorvo® Sets Benchmark with New X-Band RF Front-end Solution Tailored for Radar Systems", "source": "EE Journal", "date": "2026-10-06", "url": "https://www.eejournal.com/industry_news/qorvo-sets-benchmark-with-new-x-band-rf-front-end-solution-tailored-for-radar-systems/", "summary": "Qorvo® (Nasdaq: QRVO), a leading global provider of connectivity and power solutions, today announced an X-band front-end solution that combines high transmit output with low-noise, high-linearity receive performance for active electronically scanned array (AESA) radar. Developed around a quad architecture, the solution reduces RF content inside the array lattice. System Level X-Band Architecture X-band radar [&#8230;]"}, {"title": "OMNIVISION Launches Industry’s First 2.2-micron Global Shutter HDR Sensor for Flagship Industrial and Robotics Machine Vision Cameras", "source": "EE Journal", "date": "2026-10-06", "url": "https://www.eejournal.com/industry_news/omnivision-launches-industrys-first-2-2-micron-global-shutter-hdr-sensor-for-flagship-industrial-and-robotics-machine-vision-cameras/", "summary": "OMNIVISION, a leading global developer of semiconductor solutions, including advanced digital imaging, analog, and display technology, today announced the industry’s first 2.2-micron (µm) 5-megapixel (MP) global shutter (GS) high dynamic range (HDR) CMOS image sensor that is purpose-built for industrial machine vision applications, such as barcode scanners, factory automation, compact AI cameras and humanoid robotics, [&#8230;]"}, {"title": "Infineon completes acquisition of C2i Semiconductors to expand innovation capabilities in AI data center power management solutions", "source": "EE Journal", "date": "2026-10-06", "url": "https://www.eejournal.com/industry_news/infineon-completes-acquisition-of-c2i-semiconductors-to-expand-innovation-capabilities-in-ai-data-center-power-management-solutions/", "summary": "Acquisition strengthens Infineon’s leadership in power solutions for AI data centers and accelerates software-defined power architectures from grid to core C2i Semiconductors adds highly differentiated expertise in intelligent digital power management, multiphase controllers and system-level power architectures, including next-generation vertical power delivery solutions Transaction expands Infineon’s innovation footprint in India and further strengthens its global [&#8230;]"}, {"title": "Saelig Introduces MegiQ RMS For Full 3D Antenna Radiation Measurements for Labs", "source": "EE Journal", "date": "2026-10-06", "url": "https://www.eejournal.com/industry_news/saelig-introduces-megiq-rms-for-full-3d-antenna-radiation-measurements-for-labs/", "summary": "Saelig Company, Inc. announces the MegiQ RMS 3D Antenna Measurement System. Engineered for wireless product developers, antenna designers, and IoT engineers, the RMS 3D system delivers full spherical radiation pattern analysis, Total Radiated Power (TRP) calculations, and multi-frequency sweeps directly on an engineer&#8217;s workbench or standard lab environment. The incorporated turntable system lets RMS users measure [&#8230;]"}, {"title": "TASKING Joins SDVerse to Advance Safety-Critical Embedded Software Development for Software-Defined Vehicles", "source": "EE Journal", "date": "2026-10-06", "url": "https://www.eejournal.com/industry_news/tasking-joins-sdverse-to-advance-safety-critical-embedded-software-development-for-software-defined-vehicles/", "summary": "TASKING, a global leader in high-performance embedded software development tools, today announced that it has joined SDVerse, the automotive industry’s first B2B marketplace for automotive software. Through its participation in SDVerse, TASKING will make its automotive software development capabilities more accessible to OEMs and Tier 1 suppliers developing safe, secure and increasingly complex software-defined vehicles. [&#8230;]"}, {"title": "Meet Phonely, the AI That Talks Like a Person", "source": "EE Journal", "date": "2026-10-06", "url": "https://www.eejournal.com/article/meet-phonely-the-ai-that-talks-like-a-person/", "summary": "<img alt=\"\" class=\"webfeedsFeaturedVisual wp-post-image\" height=\"300\" src=\"https://www.eejournal.com/wp-content/uploads/2026/10/max-0524-image-for-home-page-phonely-300x300.jpg\" style=\"display: block; margin-bottom: 5px; clear: both;\" width=\"300\" />Imagine your father is a vet in a rural area. (If only I had a coconut for every time someone has said that to me… I wouldn’t have many coconuts… but that’s not important right now.) Also assume your father is essentially a one-man show. Unlike James Alfred Wight and Donald Sinclair (better known as [&#8230;]"}, {"title": "DEBIX M8391-01 industrial SBC features MediaTek Genio 720 SoC with 9 TOPS NPU, dual-display support", "source": "CNX Software", "date": "2026-10-05", "url": "https://www.cnx-software.com/2026/10/05/debix-m8391-01-industrial-sbc-features-mediatek-genio-720-soc-with-9-tops-npu-dual-display-support/", "summary": "<div><img alt=\"DEBIX M8391 01 SBC with MediaTek Genio 720 SoCjpg\" class=\"attachment-medium size-medium wp-post-image\" height=\"480\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/10/DEBIX-M8391-01-SBC-with-MediaTek-Genio-720-SoCjpg-720x480.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>The DEBIX M8391-01 is a compact industrial SBC built around the MediaTek MT8391 (Genio 720) processor, designed for edge AI, computer vision, robotics, and intelligent IoT applications. The SoC&#8217;s 9-TOPS NPU enables local AI inference without relying on cloud processing. The board features up to 16GB LPDDR4 memory and up to 64GB eMMC storage, with M.2 PCIe 2.0 NVMe SSD and MicroSD card expansion. It also offers a 4-lane MIPI CSI camera input, MIPI DSI up to 2.5K and eDP 1.4 display interfaces, Gigabit Ethernet with PoE, Wi-Fi 6, Bluetooth 5.4, five USB ports, and a 40-pin expansion header. With an industrial operating temperature range (-40°C to 85°C), this credit card-sized, Raspberry Pi-inspired SBC can be used for edge AI vision, robotics, industrial IoT, and other embedded systems. DEBIX M8391-01 specifications: MediaTeck Genio 720 (MT8391) CPU Commercial-grade (default) – 2x Arm Cortex-A78 cores @ up to 2.6 GHz, 6x Arm [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/10/05/debix-m8391-01-industrial-sbc-features-mediatek-genio-720-soc-with-9-tops-npu-dual-display-support/\">DEBIX M8391-01 industrial SBC features MediaTek Genio 720 SoC with 9 TOPS NPU, dual-display support<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Geekworm UPS Scap 5V5A – A supercapacitor UPS HAT for Raspberry Pi 5", "source": "CNX Software", "date": "2026-10-05", "url": "https://www.cnx-software.com/2026/10/05/geekworm-ups-scap-5v5a-a-supercapacitor-ups-hat-for-raspberry-pi-5/", "summary": "<div><img alt=\"Geekworm’s Raspberry Pi 5 supercapacitor UPS HAT\" class=\"attachment-medium size-medium wp-post-image\" height=\"480\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/10/Geekworms-Raspberry-Pi-5-supercapacitor-UPS-HAT-720x480.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Geekworm, in collaboration with Mcuzone, has launched the UPS Scap 5V5A, a new supercapacitor UPS HAT for the Raspberry Pi 5 designed to keep the Raspberry Pi running long enough (a few seconds to a few minutes) to save data and shut down safely, rather than provide hours of backup power. Available in 100F, 60F, and 22F versions, the HAT has a built-in PD chip that negotiates a true 5V/5A output. This gives the Raspberry Pi 5 enough power to run properly without triggering the low-voltage warnings that can happen with some power supplies. The module connects to the Raspberry Pi 5 through pogo pins to detect power loss and supports I2C for checking voltage and current in real time. It also features dual independent power inputs, so you can power it with either a wide-voltage DC barrel jack or a standard USB-C PD charger. Geekworm UPS Scap 5V5A supercapacitor [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/10/05/geekworm-ups-scap-5v5a-a-supercapacitor-ups-hat-for-raspberry-pi-5/\">Geekworm UPS Scap 5V5A &#8211; A supercapacitor UPS HAT for Raspberry Pi 5<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "TI Integrates Zephyr Across Its Embedded and Wireless Portfolio", "source": "Embedded.com", "date": "2026-10-05", "url": "https://www.embedded.com/ti-integrates-zephyr-across-its-embedded-and-wireless-portfolio/", "summary": "<p>Texas Instruments Inc. (TI) has expanded support for the Zephyr Project across its embedded semiconductor portfolio, covering microcontrollers (MCUs), microprocessors (MPUs), and wireless connectivity devices. The integration provides developers with a common real-time operating system (RTOS) environment across different TI platforms, allowing existing Zephyr-based software workflows to be reused when moving between devices. Zephyr is [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/ti-integrates-zephyr-across-its-embedded-and-wireless-portfolio/\">TI Integrates Zephyr Across Its Embedded and Wireless Portfolio<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "ICYMI – Adafruit IoT Monthly: Off-Grid Message Board, UDP in IPv6, and more!", "source": "Adafruit", "date": "2026-10-05", "url": "https://blog.adafruit.com/2026/10/05/icymi-adafruit-iot-monthly-off-grid-message-board-udp-in-ipv6-and-more/", "summary": "ICYMI (In case you missed it) – the IoT Monthly Newsletter from AdafruitDaily.com went out this morning! If you missed it, subscribe now! – You’ll get one newsletter each month. The next newsletter will be out in a month, and being subscribed is the best way to keep up with all things Internet of Things. There is no spam, no selling lists, and [&#8230;]"}, {"title": "Eye Pendant V2", "source": "Adafruit", "date": "2026-10-05", "url": "https://blog.adafruit.com/2026/10/05/eye-pendant-v2/", "summary": "A followup to last year&#8217;s Soul Cage vishalsoniindia has another entry in the spooky wearable category. The Eye Pendant is a wearable electronic pendant with a small round display that shows an animated eye. The eye moves around the screen, looking in different directions and creating the illusion of a realistic eye watching you. It [&#8230;]"}, {"title": "The Smallest Internet Radio (probably)", "source": "Adafruit", "date": "2026-10-05", "url": "https://blog.adafruit.com/2026/10/05/the-smallest-internet-radio-probably/", "summary": "There&#8217;s something about when someone claims to have made a supper small (or even the smallest version of something) that immediately draws me in. This build by maker Milen is no exception! He cites yoradio as his inspiration. The radio is designed by simple assembling of two small boards. The first one is ESP32 C3 [&#8230;]"}, {"title": "Building a Lava Lamp Reef Tank", "source": "Adafruit", "date": "2026-10-05", "url": "https://blog.adafruit.com/2026/10/05/building-a-lava-lamp-reef-tank/", "summary": "Sydney Reefing turns a lava lamp into a reef tank in this video on YouTube. Follow along on YouTube to see the process and problem solving involved with this project. Ranjib Dey wrote an awesome reef-pi project for the Adafruit Learning System. Check it out here!"}, {"title": "A picnic table, binaural birdsong and double forest POTA ATNO action! – EI3LH", "source": "Adafruit", "date": "2026-10-05", "url": "https://blog.adafruit.com/2026/10/05/a-picnic-table-binaural-birdsong-and-double-forest-pota-atno-action-ei3lh/", "summary": "EI3LH wrote up two days of Parks on the Air activations in County Kilkenny, Ireland, on ei3lh.eu. Both parks were ATNOs, or all time new ones, meaning nobody had activated them before. The first was Coill an Fhailtaigh National Forest, IE-0056, one of Ireland&#8217;s 16 Millennium Forests. With the park close to closing, the setup [&#8230;]"}, {"title": "Wideband RF Solutions for Next-Gen Wireless Applications — Qorvo and Mouser Electronics", "source": "EE Journal", "date": "2026-10-05", "url": "https://www.eejournal.com/chalk_talks/wideband-rf-solutions-for-next-gen-wireless-applications-qorvo-and-mouser-electronics/", "summary": "&#160; In this episode of Chalk Talk, Jeff Gengler, Suma Kapilavai from Qorvo and Amelia Dalton explore how wideband RF solutions from Qorvo are helping address the demanding requirements of modern drone applications. They also examine the RF building blocks that make these systems possible, including amplifiers, filters, mixers, switches, and other key technologies and [&#8230;]"}, {"title": "Contactron Speed Starter — Phoenix Contact and Mouser Electronics", "source": "EE Journal", "date": "2026-10-05", "url": "https://www.eejournal.com/chalk_talks/contactron-speed-starter-phoenix-contact-and-mouser-electronics/", "summary": "&#160; In this episode of Chalk Talk, Parker Tribble from Phoenix Contact and Amelia Dalton take a closer look at the Contactron Speed Starter from Phoenix Contact and explore about how this compact solution can give you multiple speeds, ramped starts and stops, emergency stopping with Safe Torque Off, and straight forward commissioning, all without [&#8230;]"}, {"title": "Saelig Introduces Weather-Ready RF Shielded Tents for Outdoor Deployment", "source": "EE Journal", "date": "2026-10-05", "url": "https://www.eejournal.com/industry_news/saelig-introduces-weather-ready-rf-shielded-tents-for-outdoor-deployment/", "summary": "Saelig Company, Inc. has introduced SelectFab Weather-Ready RF Shielded Tents for Outdoor Deployment. Designed specifically for defense, law enforcement, and emergency response sectors, these military-grade enclosures bridge the gap between rapid field setup and high-performance RF isolation. Historically, organizations needing secure RF isolation relied on hard-wall RF chambers, which are difficult or impossible to transport [&#8230;]"}, {"title": "TakeMe2Space to launch MOI-1A on October 2 to enable AI processing of Earth observation data in orbit", "source": "EE Journal", "date": "2026-10-05", "url": "https://www.eejournal.com/industry_news/takeme2space-to-launch-moi-1a-on-october-2-to-enable-ai-processing-of-earth-observation-data-in-orbit/", "summary": "TakeMe2Space is scheduled to launch  its MOI-1A satellite aboard SpaceX’s Transporter-18 rideshare mission on October 2. The  mission will enable customers to run AI models on Earth-observation data directly in orbit,  processing imagery before transmitting the resulting insights to the ground.  The 14 kg satellite carries 117 trillion operations per second (TOPS) of onboard computing  [&#8230;]"}, {"title": "ESP-SDR firmware turns ESP32 into a 2.4/5 GHz Software-Defined Radio (SDR)", "source": "CNX Software", "date": "2026-10-04", "url": "https://www.cnx-software.com/2026/10/04/esp-sdr-firmware-turns-esp32-into-a-2-4-5-ghz-software-defined-radio-sdr/", "summary": "<div><img alt=\"ESP WebSDR showing the live 2.4 GHz spectrum and waterfall using raw I Q data captured from an ESP32 S3\" class=\"attachment-medium size-medium wp-post-image\" height=\"480\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/10/ESP-WebSDR-showing-the-live-2.4-GHz-spectrum-and-waterfall-using-raw-I-Q-data-captured-from-an-ESP32-S3-720x480.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>We have seen ESP32s used for everything from simple IoT devices to AI, audio, and vision projects. But while looking for a new project, I found out about ESP-SDR firmware, which turns the ESP32 into a native Software-Defined Radio (SDR) without additional hardware. This open-source firmware bypasses the ESP32’s fixed-function Wi-Fi and Bluetooth modems and taps directly into the internal ADC signal chain to capture raw I/Q baseband samples. It then sends these samples to a computer over USB or UART, where they can be processed and viewed as a radio spectrum or waterfall display, turning supported ESP32 chips into low-cost software-defined radio receivers without requiring additional SDR hardware. Key features and supported hardware: Supported chips &#8211; ESP32, ESP32-C3, ESP32-C5 (dual-band 2.4/5 GHz), ESP32-C6, ESP32-C61, ESP32-S2, ESP32-S3, and the preview ESP32-S31 Tuning range &#8211; Nominally 2.4 GHz ISM (2.2–2.7 GHz on some chips) and 5 GHz (4.8–6.0 GHz on ESP32-C5); The [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/10/04/esp-sdr-firmware-turns-esp32-into-a-2-4-5-ghz-software-defined-radio-sdr/\">ESP-SDR firmware turns ESP32 into a 2.4/5 GHz Software-Defined Radio (SDR)<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "UUNA TEK iAuto review – A professional handwriting and drawing machine", "source": "CNX Software", "date": "2026-10-03", "url": "https://www.cnx-software.com/2026/10/03/uuna-tek-iauto-review-a-professional-handwriting-and-drawing-machine/", "summary": "<div><img alt=\"uuna tek iauto review\" class=\"attachment-medium size-medium wp-post-image\" height=\"405\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/09/uunatekiauto_00_coveri_mage-720x405.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Hello, today I am going to review the UUNA TEK iAuto, an automatic handwriting machine designed to reproduce physical handwriting using a real pen on real paper. It also supports wireless connectivity, spreadsheet-based mail merge, custom fonts, and font variation features that can make the writing look more natural. The machine can handle paper sizes up to A3 and supports pens with a diameter of up to 18 mm. The UUNA TEK iAuto works with the manufacturer’s free iAuto software, which is available for Windows on both x64 and Arm-based systems, as well as for macOS on Apple M1, M2, M3, and Intel-based Macs. Most of the following review focuses on the machine’s writing capabilities, including tests with text, SVG graphics, different writing speeds, various pens, and different paper types. Unboxing The parcel was shipped from China by land transportation and took around six days to arrive at my office [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/10/03/uuna-tek-iauto-review-a-professional-handwriting-and-drawing-machine/\">UUNA TEK iAuto review &#8211; A professional handwriting and drawing machine<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "UP Xtreme PTL Edge Air Panther Lake Mini PC gets AirJet solid-state active cooling solution", "source": "CNX Software", "date": "2026-10-02", "url": "https://www.cnx-software.com/2026/10/02/up-xtreme-ptl-edge-air-panther-lake-mini-pc-gets-airjet-solid-state-active-cooling-solution/", "summary": "<div><img alt=\"UP Xtreme PTL Edge Air\" class=\"attachment-medium size-medium wp-post-image\" height=\"374\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/10/UP-Xtreme-PTL-Edge-Air-720x374.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>AAEON has introduced a new version of its UP Xtreme PTL Edge Panther Lake mini PC with the &#8220;Air&#8221; variant featuring Frore Systems AirJet solid-state active cooling solution. The company says the AirJet passive cooling technology makes the Panther Lake mini PC 35% thinner, 43% lighter, and capable of operating silently at under 21 dBA. This is mostly achieved by removing the thick (and heavy) heatsink found on the original design. The mini PC still benefits from up to an Intel Core Ultra X7 358H with 180 TOPS of AI performance, a 40-pin GPIO header, two RS-232/422/485 COM ports, and a wide 19 to 36V DC input range. UP Xtreme PTL Edge Air specifications: Intel Core Ultra Series 3 Panther Lake SoC (one or the other) Intel Core Ultra X7 Processor 358H CPU &#8211; 16-core (4P + 8E + 4LPE) @ 1.9/1.5/1.5 GHz Base frequency, 4.8/3.5/3.5 GHz Turbo frequency Cache [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/10/02/up-xtreme-ptl-edge-air-panther-lake-mini-pc-gets-airjet-solid-state-active-cooling-solution/\">UP Xtreme PTL Edge Air Panther Lake Mini PC gets AirJet solid-state active cooling solution<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Avaota F2 – Allwinner V861 RISC-V SBC targets AI cameras with PTZ and audio support", "so
