s logistics, automation and robotics, &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/idss-nion-3d-tof-camera-goes-into-series-production/\">Read More &#8594;<span class=\"screen-reader-text\"> \"IDS&#8217;s Nion 3D ToF camera goes into series production\"<\/span><\/a>"}, {"title": "IBM and Arm: Expanding the Arm ecosystem for the next era of enterprise computing", "source": "EE Journal", "date": "2026-08-25", "url": "https://www.eejournal.com/industry_news/ibm-and-arm-expanding-the-arm-ecosystem-for-the-next-era-of-enterprise-computing/", "summary": "The industry is converging on Arm as the platform for modern cloud computing, reflected in the next-generation cloud and AI infrastructure being built and deployed by companies including AWS, Google, Meta, Microsoft, NVIDIA and OpenAI. That momentum – reinforced by a software ecosystem of more than 22 million developers worldwide – is now extending into &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/ibm-and-arm-expanding-the-arm-ecosystem-for-the-next-era-of-enterprise-computing/\">Read More &#8594;<span class=\"screen-reader-text\"> \"IBM and Arm: Expanding the Arm ecosystem for the next era of enterprise computing\"<\/span><\/a>"}, {"title": "Can Metaspectral Analysis Help Save the Planet?", "source": "EE Journal", "date": "2026-08-25", "url": "https://www.eejournal.com/article/can-metaspectral-analysis-help-save-the-planet/", "summary": "<img alt=\"\" class=\"webfeedsFeaturedVisual wp-post-image\" height=\"300\" src=\"https://www.eejournal.com/wp-content/uploads/2026/08/max-0512-image-for-home-page-eco-crisis-300x300.jpg\" style=\"display: block; margin-bottom: 5px; clear: both;\" width=\"300\" />I think it’s fair to say that I’ve been blessed with a cheerful and optimistic disposition. I fully relate to the classic Always Look on the Bright Side of Life song from Monty Python’s Life of Brian movie. If you ever wondered about the origin of this song, I recommend Always Look on the Bright &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/article/can-metaspectral-analysis-help-save-the-planet/\">Read More &#8594;<span class=\"screen-reader-text\"> \"Can Metaspectral Analysis Help Save the Planet?\"<\/span><\/a>"}, {"title": "Jetway PIC-TWL1 Intel N150 Pico-ITX motherboard is made for industrial automation and embedded systems", "source": "CNX Software", "date": "2026-08-24", "url": "https://www.cnx-software.com/2026/08/25/jetway-pic-twl1-intel-n150-pico-itx-motherboard-is-made-for-industrial-automation-and-embedded-systems/", "summary": "<div><img alt=\"Jetway PIC-TWL1\" class=\"attachment-medium size-medium wp-post-image\" height=\"454\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/08/Jetway-PIC-TWL1-720x454.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Jetway PIC-TWL1 is a compact (100&#215;72 mm) fanless Pico-ITX motherboard powered by an Intel N150 Twin Lake processor and engineered for industrial control, factory automation, facial recognition, and edge embedded systems. The board supports up to 32GB DDR5 SO-DIMM memory and NVMe SSD storage, and features HDMI and LVDS/eDP display interfaces, two USB 3.2 ports, two Gigabit Ethernet ports, an M.2 E-Key socket for WiFi and Bluetooth, and several headers for GPIOs, RS232/RS485, USB 2.0, audio, SMBUs, and front panel connections. It takes 12V DC power and can operate in a -20°C ~ 60°C temperature range. Jetway PIC-TWL1 specifications: SoC &#8211; Intel Processor N150 CPU &#8211; Quad-core Twin Lake processor @ 800 MHz / 3.6 GHz (Turbo) with 6MB cache GPU &#8211; 24EU Intel UHD graphics @ 1.0 GHz TDP &#8211; 6W System Memory –  Up to 32GB DDR5 4800 MT/s via single-channel SO-DIMM slot Storage &#8211; NVMe SSD via M.2 [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/08/25/jetway-pic-twl1-intel-n150-pico-itx-motherboard-is-made-for-industrial-automation-and-embedded-systems/\">Jetway PIC-TWL1 Intel N150 Pico-ITX motherboard is made for industrial automation and embedded systems<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "MNT Station fanless, modular open-hardware computer supports a choice of 10+ Arm CPU or FPGA modules (Crowdfunding)", "source": "CNX Software", "date": "2026-08-24", "url": "https://www.cnx-software.com/2026/08/24/mnt-station-fanless-modular-open-hardware-computer-supports-a-choice-of-10-arm-cpu-or-fpga-modules/", "summary": "<div><img alt=\"MNT Station fanless open hardware modular computer\" class=\"attachment-medium size-medium wp-post-image\" height=\"480\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/08/MNT-Station-fanless-open-hardware-modular-computer-720x480.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>MNT Research, the Berlin-based team behind the MNT Reform, MNT Pocket Reform, Reform 2, and MNT Reform Next, has launched the MNT Station, a fanless, open-hardware modular computer designed for use as a desktop PC, home server, NAS, router, edge device, or low-power media center. The MNT Station is built around the MNT Reform mainboard ecosystem and designed for those who want to reuse an existing MNT Reform mainboard (versions 2.0, 2.5, or 3.0) as a stationary computer, as well as those building a modular Arm (or FPGA-based) desktop from scratch using the new MNT Reform Mainboard 3.0. Like other MNT systems, it&#8217;s fully open-source hardware, and the 200-pin processor module connector supports different processor modules, including the Rockchip RK3588, NXP Layerscape LS1028A, and Raspberry Pi CM4, among others. MNT Station specifications: SoC/Processor and Memory options (via 200-pin module) Rockchip RK3588 (MNT RCORE V2) — 4× Cortex-A76 + 4× Cortex-A55 [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/08/24/mnt-station-fanless-modular-open-hardware-computer-supports-a-choice-of-10-arm-cpu-or-fpga-modules/\">MNT Station fanless, modular open-hardware computer supports a choice of 10+ Arm CPU or FPGA modules (Crowdfunding)<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "$60+ Nordic Semi nRF93M1 Development Kit (DK) targets LTE Cat 1 bis IoT applications", "source": "CNX Software", "date": "2026-08-24", "url": "https://www.cnx-software.com/2026/08/24/60-nordic-semi-nrf93m1-development-kit-dk-targets-lte-cat-1-bis-iot-applications/", "summary": "<div><img alt=\"Nordic Semi nRF93M1 Development Kit\" class=\"attachment-medium size-medium wp-post-image\" height=\"478\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/08/Nordic-Semi-nRF93M1-Development-Kit-720x478.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Nordic Semiconductor has launched the nRF93M1 DK (Development Kit) based on the nRF93M1-LABA LTE Cat 1 bis with Wi-Fi and cellular location and a Nordic Semi nRF54L15 host microcontroller. The nRF93M1 module was first introduced at Embedded World 2026 last March, and the company has now announced general availability of the nRF93M1-LABA smart modem module for Europe, Asia, the Middle East, Africa, and sampling of the nRF93M1-LACA module for global markets, scheduled to become available in Q3 2026. The announcement also covers the launch of the nRF93M1 Development Kit, which was teased last March with limited details. Time to have a closer look. nRF93M1 DK specifications: Host MCU &#8211; Nordic Semiconductor nRF54L15 MCU cores Arm Cortex-M33 with Arm TrustZone @ 128MHz RISC-V coprocessor for software-defined peripheral Memory – 256KB SRAM Storage – 1.5MB non-volatile memory Wireless Bluetooth 6.0 Data rates – 2Mbps, 1Mbps, 500kbps, 125kbps Features (TBC in built-in firmware) AoA [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/08/24/60-nordic-semi-nrf93m1-development-kit-dk-targets-lte-cat-1-bis-iot-applications/\">$60+ Nordic Semi nRF93M1 Development Kit (DK) targets LTE Cat 1 bis IoT applications<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Completing the Audit Trail: Why Embedded Teams Need Runtime Observability", "source": "Embedded.com", "date": "2026-08-24", "url": "https://www.embedded.com/completing-the-audit-trail-why-embedded-teams-need-runtime-observability/", "summary": "<p>Reproducible builds have become a cornerstone of modern embedded development. They provide confidence that a specific source-code baseline and toolchain produce a known firmware artifact, creating a traceable path from source code to deployed software. For many organizations, this forms an essential part of the engineering audit trail. Teams can determine what software was built, [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/completing-the-audit-trail-why-embedded-teams-need-runtime-observability/\">Completing the Audit Trail: Why Embedded Teams Need Runtime Observability<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "Mikroe Releases RTLS UWB Click Board", "source": "Embedded.com", "date": "2026-08-24", "url": "https://www.embedded.com/mikroe-releases-rtls-uwb-click-board/", "summary": "<p>Mikroe has launched its latest Click board addition, the real-time location system (RTLS) ultra-wideband (UWB) add-on board for high-precision real-time location, distance measurement, and motion-aware tracking. The new board is suited for applications such as asset tracking, indoor positioning, personnel and equipment localization, smart logistics, and industrial monitoring. It can be used for indoor navigation [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/mikroe-releases-rtls-uwb-click-board/\">Mikroe Releases RTLS UWB Click Board<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "Anomalous Charging Current (ACC) in Polymer Tantalum Capacitors — KYOCERA and Mouser Electronics", "source": "EE Journal", "date": "2026-08-24", "url": "https://www.eejournal.com/chalk_talks/anomalous-charging-current-acc-in-polymer-tantalum-capacitors-kyocera-and-mouser-electronics/", "summary": "&#160; In this episode of Chalk Talk, Hannah Hairston from KYOCERA AVX and Amelia Dalton explore the what, where and how of anomalous charging current. They also investigate the potential effects of ACC in switching power supplies and satellite power conversion, and KYOCERA AVX capacitor solutions that have made ACC concerns a thing of the &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/chalk_talks/anomalous-charging-current-acc-in-polymer-tantalum-capacitors-kyocera-and-mouser-electronics/\">Read More &#8594;<span class=\"screen-reader-text\"> \"Anomalous Charging Current (ACC) in Polymer Tantalum Capacitors &#8212; KYOCERA and Mouser Electronics\"<\/span><\/a>"}, {"title": "eCAV: Electric Commercial Agricultural Vehicles — onsemi and Mouser Electronics", "source": "EE Journal", "date": "2026-08-24", "url": "https://www.eejournal.com/chalk_talks/ecav-electric-commercial-agricultural-vehicles-onsemi-and-mouser-electronics/", "summary": "&#160; In this episode of Chalk Talk, Youssef Bouguerba from onsemi and Amelia Dalton explore the eCAV landscape, break down the core architecture that distinguishes these vehicles from standard EVs, and check out how onsemi’s portfolio of power modules, image sensors, and connectivity solutions can help you optimize your next design. Click here for more &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/chalk_talks/ecav-electric-commercial-agricultural-vehicles-onsemi-and-mouser-electronics/\">Read More &#8594;<span class=\"screen-reader-text\"> \"eCAV: Electric Commercial Agricultural Vehicles &#8212; onsemi and Mouser Electronics\"<\/span><\/a>"}, {"title": "TDK acquires assets from OQmented to advance AR display technologies", "source": "EE Journal", "date": "2026-08-24", "url": "https://www.eejournal.com/industry_news/tdk-acquires-assets-from-oqmented-to-advance-ar-display-technologies/", "summary": "&#8211; TDK acquired assets from OQmented to strengthen AR display technology portfolio. &#8211; The acquisition adds valuable IP, engineering expertise, and MEMS-based laser beam scanning technology. &#8211; Purchase supports TDK’s strategy to develop advanced, vertically integrated display solutions for future smart glasses, combining TDK’s eye intent technology, Full-color Laser Module (FCLM), MEMS mirror, and other &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/tdk-acquires-assets-from-oqmented-to-advance-ar-display-technologies/\">Read More &#8594;<span class=\"screen-reader-text\"> \"TDK acquires assets from OQmented to advance AR display technologies\"<\/span><\/a>"}, {"title": "New Xteink X3 eReader Launch Offers a Distraction-Free Solution for All Book Lovers", "source": "EE Journal", "date": "2026-08-24", "url": "https://www.eejournal.com/industry_news/new-xteink-x3-ereader-launch-offers-a-distraction-free-solution-for-all-book-lovers/", "summary": "Millions of people love to read. Being able to pick up a book and fall into a story of unrequited love or fantasy realms is a wonderful break from the hustle and bustle of daily living. The trouble is, not everyone can fit a library of books in their backpack. That is, until products like &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/new-xteink-x3-ereader-launch-offers-a-distraction-free-solution-for-all-book-lovers/\">Read More &#8594;<span class=\"screen-reader-text\"> \"New Xteink X3 eReader Launch Offers a Distraction-Free Solution for All Book Lovers\"<\/span><\/a>"}, {"title": "Rockchip RV1126B-based Forlinx FCU3101 fanless edge AI system targets IIoT and smart security applications", "source": "CNX Software", "date": "2026-08-23", "url": "https://www.cnx-software.com/2026/08/24/rockchip-rv1126b-based-forlinx-fcu3101-fanless-edge-ai-system-targets-iiot-and-smart-security-applications/", "summary": "<div><img alt=\"Forlinx FCU3101 RV1126B fanless edge AI system\" class=\"attachment-medium size-medium wp-post-image\" height=\"480\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/08/Forlinx-FCU3101-RV1126B-fanless-edge-AI-system-720x480.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Forlinx has just introduced the FCU3101, a fanless Edge AI system based on the Rockchip RV1126B/RV1126BJ SoC and designed for Industrial IoT (IIoT) and smart security applications, such as video surveillance, license plate recognition, intrusion detection, industrial inspection, and material counting. It ships with up to 4GB of DDR4, up to 64GB of eMMC storage, and includes dual Ethernet, Wi-Fi 4, Bluetooth 4.2, optional 4G LTE, RS485, RS232, digital I/O, relay outputs, HDMI, and USB ports. It supports up to 9–36V DC input and operates in the -40°C to +85°C temperature range in its industrial configuration. Forlinx FCU3101 specifications: SoC – Rockchip RV1126B or RV1126BJ (industrial-grade version) CPU – Quad-core Arm Cortex-A53 up to 1.6 GHz with 32KB L1 I-Cache and 32KB L1 D-Cache, unified 512KB L2 Cache GPU – 2D Graphics Engine VPU Video Decoder – H.265/H.264 up to 3840×2160 @ 30fps Video Encoder  – H.265, H.264, JPEG up to [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/08/24/rockchip-rv1126b-based-forlinx-fcu3101-fanless-edge-ai-system-targets-iiot-and-smart-security-applications/\">Rockchip RV1126B-based Forlinx FCU3101 fanless edge AI system targets IIoT and smart security applications<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Openterface KeyMod turns your smartphone into a USB keyboard, mouse, gamepad, or SSH client (Crowdfunding)", "source": "CNX Software", "date": "2026-08-23", "url": "https://www.cnx-software.com/2026/08/24/openterface-keymod-turns-your-smartphone-into-a-usb-keyboard-mouse-gamepad-or-ssh-client/", "summary": "<div><img alt=\"Openterface KeyMod mini and plus Pocket USB multi toole for tech, professionals and gaming\" class=\"attachment-medium size-medium wp-post-image\" height=\"480\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/08/Openterface-KeyMod-mini-and-plus-Pocket-USB-multi-toole-for-tech-professionals-and-gaming-720x480.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>After successfully launching the Openterface Mini-KVM and Openterface KVM-GO, TechxArtisan has just introduced the Openterface KeyMod pocket-sized USB multi-tool that turns an Android or iOS smartphone into a wireless keyboard, mouse, gamepad, presentation remote, or an SSH terminal for controlling PCs, servers, kiosks, Raspberry Pi boards, and other USB hosts. It comes in two variants: the KeyMod Mini with a USB-C port, and the KeyMod Plus with a USB-A port. KeyMod Mini connects to the phone through Bluetooth 5.3, while KeyMod Plus relies on a wired USB connection for higher bandwidth. It provides USB HID keyboard and mouse functions that work even in BIOS, along with a USB CDC-ECM network bridge for SSH, VNC, SCP, rsync, and other TCP-based tools. The hardware uses a CH32V208 HID controller and USB composite architecture and is powered directly from the target&#8217;s USB port. It is designed for IT support, server administration, embedded development, [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/08/24/openterface-keymod-turns-your-smartphone-into-a-usb-keyboard-mouse-gamepad-or-ssh-client/\">Openterface KeyMod turns your smartphone into a USB keyboard, mouse, gamepad, or SSH client (Crowdfunding)<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Framework Laptop 12 repairable, convertible laptop gets Wildcat Lake motherboard, ships with Fedora 44 or Windows 11", "source": "CNX Software", "date": "2026-08-23", "url": "https://www.cnx-software.com/2026/08/23/framework-laptop-12-repairable-convertible-laptop-gets-wildcat-lake-motherboard-ships-with-fedora-44-or-windows-11/", "summary": "<div><img alt=\"Framework Laptop 12\" class=\"attachment-medium size-medium wp-post-image\" height=\"540\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/08/Framework-Laptop-12-720x540.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>First introduced in 2025, the Framework Laptop 12 upgradable and repairable laptop has just gotten a new motherboard offered with a choice of Wildcat Lake (Intel Core Series 3) processors from the Core 3 304 up to the Core 7 350. The Wildcat Lake-based convertible Laptop 12 features a 12.2-inch display with 1920 x 1200 resolution, a SO-DIMM slot supporting up to 64GB DDR5, an M.2 2230 NVMe SSD slot, and high-speed connectivity with Thunderbolt 4, WiFi 7, and more. Framework Laptop 12 (Intel Core Series 3) specifications: Wildcat Lake SoC (one or the other) Intel Core 3 304 5-core CPU – 1x P-cores @ 1.5/4.3 GHz (Turbo) + 4x LPE-cores @ 1.4/3.3 GHz (Turbo) GPU – 1-core Intel Xe3 Graphics @ 2.3 GHz (9 TOPS) NPU – 15 TOPS Intel Core 5 320 6-core CPU – 2x P-cores @ 1.5/4.6 GHz (Turbo) + 4x LPE-cores @ 1.4/3.4 GHz (Turbo) [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/08/23/framework-laptop-12-repairable-convertible-laptop-gets-wildcat-lake-motherboard-ships-with-fedora-44-or-windows-11/\">Framework Laptop 12 repairable, convertible laptop gets Wildcat Lake motherboard, ships with Fedora 44 or Windows 11<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Espressif Systems releases a Linux BSP developer preview for ESP32-S31 RISC-V microprocessor", "source": "CNX Software", "date": "2026-08-22", "url": "https://www.cnx-software.com/2026/08/22/espressif-systems-releases-a-linux-bsp-developer-preview-for-esp32-s31-risc-v-microprocessor/", "summary": "<div><img alt=\"ESP32-S31 Linux\" class=\"attachment-medium size-medium wp-post-image\" height=\"432\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/08/ESP32-S31-Linux-720x432.png\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>The ESP32-S31 microprocessor is getting Linux support from Espressif Systems. The ESP32-S31 dual-core RISC-V microprocessor was first unveiled in March, two ESP32-S31 development boards followed in May, and mass production was announced a few weeks ago. The new RISC-V chip features an MMU (Memory Management Unit), which makes Linux much easier to handle, and the development boards also come with 16MB PSRAM, so a minimal Linux image is possible. Moving from theory to practice, Espressif Systems has now released a developer preview version of the ESP Linux BSP for ESP32-S31, and some community Linux ports are also in the works (more on that at the end of the article). Let&#8217;s focus on the official ESP Linux BSP. The aforementioned repo only contains the image layout and packaging tools used by the ESP32-S31 Buildroot integration, and the core of the project can be found in the esp-buildroot-external repo with ESP32-S31 NOR boot [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/08/22/espressif-systems-releases-a-linux-bsp-developer-preview-for-esp32-s31-risc-v-microprocessor/\">Espressif Systems releases a Linux BSP developer preview for ESP32-S31 RISC-V microprocessor<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Advanced RF Systems, Agilex FPGAs, a Neuromorphic Chip for AI Optical Inspection: Embedded Week Insights", "source": "Embedded.com", "date": "2026-08-21", "url": "https://www.embedded.com/advanced-rf-systems-agilex-fpgas-a-neuromorphic-chip-for-ai-optical-inspection-embedded-week-insights/", "summary": "<p>Here's a roundup of this week's must-read articles. We'll cover the latest developments on advanced RF systems for mil-aero communications, Agilex FPGAs, and a neuromorphic chip for AI optical inspection. Also, check News Archives - Embedded and Technical Articles Archives - Embedded for the complete list of news and articles from our website. NEWS Aetina Introduces Palm-Sized In-Vehicle Edge [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/advanced-rf-systems-agilex-fpgas-a-neuromorphic-chip-for-ai-optical-inspection-embedded-week-insights/\">Advanced RF Systems, Agilex FPGAs, a Neuromorphic Chip for AI Optical Inspection: Embedded Week Insights<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "Vector Brings Natural-Language AI Automation to CANoe", "source": "Embedded.com", "date": "2026-08-21", "url": "https://www.embedded.com/vector-brings-natural-language-ai-automation-to-canoe/", "summary": "<p>Vector Informatik GmbH has expanded its CANoe development and testing environment with AI agents and Model Context Protocol (MCP) capabilities. The new functions allow users to describe development, analysis, and testing tasks using natural-language prompts, after which specialized AI agents can determine the required steps and execute complete workflows automatically. The CANoe AI Package and [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/vector-brings-natural-language-ai-automation-to-canoe/\">Vector Brings Natural-Language AI Automation to CANoe<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "Basler, Syslogic Deliver Industrial Machine Vision Solutions", "source": "Embedded.com", "date": "2026-08-20", "url": "https://www.embedded.com/basler-syslogic-deliver-industrial-machine-vision-solutions/", "summary": "<p>Basler and Syslogic are expanding their partnership to enable machine vision and edge AI in industrial applications that require high-performance cameras and rugged AI computing platforms. The partnership leverages Basler's ace 2 GMSL cameras and Syslogic's rugged computers to deliver machine vision to applications such as autonomous mobile robots, agricultural vehicles, construction equipment, and intelligent [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/basler-syslogic-deliver-industrial-machine-vision-solutions/\">Basler, Syslogic Deliver Industrial Machine Vision Solutions<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "Advanced RF Systems Power Next-Gen Mil-Aero Comms", "source": "Embedded.com", "date": "2026-08-19", "url": "https://www.embedded.com/advanced-rf-systems-power-next-gen-mil-aero-comms/", "summary": "<p>The radio-frequency (RF) industry, relying on established technologies for many years, is entering a significant phase of growth, driving the need for advanced solutions. Rising investment in defense and security systems and the expansion of the space economy are the two key drivers behind this growth. On the defense side, there is the demand for [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/advanced-rf-systems-power-next-gen-mil-aero-comms/\">Advanced RF Systems Power Next-Gen Mil-Aero Comms<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "Aetina Introduces Palm-Sized In-Vehicle Edge AI Platforms", "source": "Embedded.com", "date": "2026-08-19", "url": "https://www.embedded.com/aetina-introduces-palm-sized-in-vehicle-edge-ai-platforms/", "summary": "<p>Aetina Corporation introduced the DeviceEdge AIE-VN34/44 and AIE-VO24/34, its first palm-sized in-vehicle edge AI systems. Based on the Nvidia Jetson Orin NX and Jetson Orin Nano modules, the platforms provide up to 100 TOPS and 67 TOPS of AI performance, respectively, and support four GMSL2 camera connections. The systems target smart transportation, autonomous mobile robots [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/aetina-introduces-palm-sized-in-vehicle-edge-ai-platforms/\">Aetina Introduces Palm-Sized In-Vehicle Edge AI Platforms<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}], "papers": [{"title": "Do Robotic World Models Really Follow Actions? Diagnosing and Aligning Action-Conditioned Generation for Policy Learning", "authors": ["Sixiang Chen", "Jiaming Liu", "Jixian Wu", "Yichen Guo", "Tinghao Wang", "Siyuan Qian", "Hao Chen", "Jiajun Cao", "Jian Tang", "Shanghang Zhang"], "published": "2026-08-25", "summary": "Action-conditioned world models are increasingly used as learned simulators for policy evaluation and improvement, yet their effectiveness rests on an unverified assumption: generated futures faithfully reflect arbitrary valid actions. Existing benchmarks are typically confined to expert demonstrations, leaving off-expert action following inadequately evaluated. To address this gap, we introduce WorldEcho, which probes action following over a broader action distribution using visual integrity and SE(3) trajectory alignment. Our diagnosis shows that current world models reasonably execute expert actions but struggle with diverse off-expert trajectories, either ignoring the commanded actions or producing visually invalid rollouts. We further propose WorldSync, which strengthens action following along three complementary axes: distributional coverage, representational grounding, and intervention-effect alignment. It broadens the training distribution over action consequences, grounds intermediate video representations in action-induced robot dynamics through an Action-Forcing Expert, and aligns predicted changes under action interventions with the corresponding changes in ground-truth futures. Experiments on RoboTwin benchmarks and real-robot tasks show that WorldSync improves WorldEcho metrics and serves as a more reliable simulator for iterative policy improvement, enabling policies to achieve higher success rates.", "pdf_url": "https://arxiv.org/pdf/2608.24885v1"}, {"title": "Latent Action as Intention Enables Efficient Future Imagination for World Action Models", "authors": ["Xiang Li", "Yupeng Zheng", "Songen Gu", "Huailiang Ma", "Feng Yu", "Xian Nie", "Shanshuai Yuan", "Yujie Zang", "Weize Li", "Shuai Tian", "Moyang Liu", "Ya-Qin Zhang", "Wenchao Ding"], "published": "2026-08-25", "summary": "World action models (WAMs) improve robot control by modeling how observations evolve, but generating future observations at test time incurs substantial latency. Fast-WAM removes this process for efficiency; however, our matched implementations show lower generalization for Fast-WAM than for future-aware alternatives, especially with scarce robot demonstrations and in out-of-distribution scenarios. To bridge this gap, we introduce **LAWA**, a WAM architecture that uses compact latent actions as an operational representation of future intentions, enabling efficient test-time future imagination without generating future observations. Specifically, a discrete tokenizer enhanced by action-free pre-training produces manipulation-centric codebook targets. LAWA jointly denoises a continuous latent state anchored to these targets with executable action chunks while omitting the future-video branch at inference. On RoboCasa, LAWA achieves state-of-the-art average success rates of 65.6% and 80.8% in the few-shot and full data settings, improving over the matched Fast-WAM baseline by 9.6 and 4.5 points, respectively. It also preserves the performance level of the matched Joint-WAM variant while requiring 42.9% lower inference latency. LAWA also demonstrates competitive zero-shot robustness on LIBERO-Plus and superior performance on real-world tasks. These results show that future imagination need not be discarded: retaining it with compact latent actions yields an effective trade-off among performance, generalization, and latency. Code and models will be released.", "pdf_url": "https://arxiv.org/pdf/2608.24882v1"}, {"title": "LeFlow: Generative Latent Flow Planning for World Models", "authors": ["Hsiang-Wei Huang", "Jianxu Shangguan", "Junbin Lu", "Jenq-Neng Hwang"], "published": "2026-08-25", "summary": "Latent world models are inherently strong encoders that transform image pixel to latent embedding, yet existing world models still rely on online trajectory optimization for action planning: for every state-goal pair, an iterative optimizer is run from scratch to search for optimal action sequences, treating the world model as a black-box simulator. This approach pays the full iterative optimization cost anew at every replanning step and reuses no planning experience across queries. In this work, we ask whether planning itself can be amortized once a latent world model has been learned. We present LeFlow, which learns a reusable latent trajectory prior operating directly in the latent dynamics space from the world model. LeFlow recasts planning as conditional latent trajectory generation: a rectified-flow model imagines a future latent path between the current and goal embeddings, an inverse dynamics decoder turns latent transitions into action chunks, and the frozen world model verifies each candidate by autoregressive rollout. Across four major goal-conditioned pixel-control benchmarks, LeFlow replaces iterative action-space optimization with amortized latent planning and fixed-budget rollout selection, achieving consistent success-rate gains with an order-of-magnitude reduction in planning time. Our results argue that latent world models should support not only prediction but reusable planning priors. Our code is available at https://github.com/hsiangwei0903/LeFlow.", "pdf_url": "https://arxiv.org/pdf/2608.24855v1"}, {"title": "$(\\text{DNN})^2$: Doubly Non-Negative Relaxations for Deep Neural Networks", "authors": ["Hanna Jiamei Zhang", "Alan Papalia", "Michael Everett", "David M. Rosen"], "published": "2026-08-25", "summary": "Existing linear program (LP) and semidefinite program (SDP) relaxations for rectified linear unit (ReLU) neural network (NN) verification yield overly-conservative safety guarantees due to significant relaxation gaps. While the completely positive program (CPP) formulation closes this gap, it is NP-hard to solve. Its cheapest tractable relaxation, the doubly non-negative program (DNN), retains critical constraints as an SDP, but one whose size exceeds the reach of interior-point methods at practical scale. While Burer-Monteiro (BM) factorization has been applied to make SDP-based verification scalable, no such result exists for the strictly tighter DNN formulation. A key obstacle is that additional non-negativity constraints in the DNN cause dual multipliers for optimality certification to be non-unique, making standard certification methods inapplicable. We propose a novel eigenvalue maximization procedure that searches the non-unique multiplier space for a valid certificate, i.e. a global optimality guarantee. Experiments demonstrate that our approach $(\\text{DNN})^2$ produces bounds consistently tighter than the standard SDP method, often matching the exact solution, and that our certification procedure confirms global optimality when a valid certificate exists. These results are a key step toward providing tight, certifiable, and computationally scalable verification guarantees needed to deploy neural network controllers and perception modules in safety-critical autonomous systems.", "pdf_url": "https://arxiv.org/pdf/2608.24743v1"}, {"title": "One-Shot Learning from Demonstration of Contact-Rich Robotic Manipulation by Identifying Physical Interactions", "authors": ["A. H. G. Overbeek", "H. van der Kooij", "M. Vlutters"], "published": "2026-08-25", "summary": "Learning from Demonstration (LfD) allows robots to learn manipulation tasks directly from humans, thereby supporting the versatile application of robots. Most LfD methods do not explicitly model the physical interactions between a robot and its environment, such as the making and breaking of contact, while these are crucial during manipulation tasks. Because the same basic physical interactions recur often, they can be a basis for robust, generalizable, and adaptive task reproduction. We propose an LfD method that explicitly uses what physical interactions take place where and when. Using that information, a hybrid position-force controller tracks demonstrated trajectories until contact-based transition conditions from the demonstrations are met. We evaluate our method in real robot experiments consisting of opening doors and locks, bolt picking and screwing, dislodging, and surface contouring. We show that explicitly modeling physical interactions benefits LfD in four ways. First, by allowing reproduction of complex, sequential, and contact-rich manipulation tasks using only a single demonstration and no prior knowledge of the task. Second, by facilitating robustness to unknown geometric variations in the environment. Third, by facilitating generalization when geometric variations are known. Fourth, by facilitating online adaptation using geometric information explored during task reproduction. We discuss how robustness, generalization, and adaptivity can be explicitly implemented, which is generally lacking in the LfD literature. Thereby, our work aims to close a gap in interpretable few-shot LfD of robotic manipulation.", "pdf_url": "https://arxiv.org/pdf/2608.24741v1"}, {"title": "Parameter-Efficient Self-Supervised Adaptation for EEG-FM under Fixed Computational Budgets", "authors": ["Meghal Dani", "Stefanie Liebe"], "published": "2026-08-25", "summary": "EEG foundation models pretrained via self-supervised learning promise transferable representations, but their generalization remains limited, especially across diverse clinical datasets. Full fine-tuning is impractical for resource-constrained clinical settings due to high computational requirements. In this work, we investigate whether parameter-efficient self-supervised adaptation, updating only 9% of parameters suffices to align representations to target tasks. We evaluate our method on two state-of-the-art models with different pretraining objectives: BIOT (contrastive) and CBraMod (masked reconstruction), and evaluate on three clinical EEG datasets for abnormality detection (TUAB), event classification (TUEV), and seizure detection (CHB-MIT) under both in-distribution and out-of-distribution conditions. SSL adaptation yields consistent gains over linear probing, up to 20x AUCPR. Under a fixed compute budget, peak performance requires only 20--50% of available unlabeled data. Critically, when total window count is fixed, performance remains invariant to patient count, suggesting that performance is dependent on overall temporal window diversity only. Our findings demonstrate that parameter-efficient adaptation enables effective deployment of EEG Foundation models (EEG-FM) with minimal computational overhead and data collection burden. Code available at: https://github.com/c3n-group/efficient-eeg-adapt", "pdf_url": "https://arxiv.org/pdf/2608.24727v1"}, {"title": "Fiber Bragg Grating Whiskers for Bioinspired Hydrodynamic Perception on Underwater Robots", "authors": ["Hao Li", "Tianyu Tu", "Siyue Yao", "Ziyang Chang", "Juhyun Jung", "Xiaochi Xie", "Long Yin Chung", "Tian-Ao Ren", "Genliang Chen", "Mark Cutkosky"], "published": "2026-08-25", "summary": "Harbor seals track hydrodynamic trails with their vibrissae, enabling passive perception of moving targets in dark or turbid water. Inspired by this capability, we present compact fiber Bragg grating (FBG) whiskers for underwater robots. Like seal whiskers, they have a non-uniform taper and elliptical cross-section. Controlled towing experiments show a monotonic relative-flow response from 0.1 to 0.6 m/s, a strong reduction of self-induced oscillation relative to a cylindrical baseline, and a pronounced dependence on angle of attack. Experiments with a pitching foil show that the whiskers can detect the characteristic vortices shed by a stationary or moving source, detectable several seconds after the source has passed. Using this information, a single front-mounted whisker enabled a small underwater robot to distinguish between continuing straight and executing a turn, selecting the correct branch in 17 of 20 trials (85.0%) from whisker signals alone. These results connect bioinspired hydrodynamic sensing to robot action and suggest the utility of whiskers for tracking underwater objects.", "pdf_url": "https://arxiv.org/pdf/2608.24724v1"}, {"title": "GaussianWAM: Distilling Geometry and Semantics from 3D Gaussian Fields into World-Action Models", "authors": ["Zijian Zhang", "Yuqing Jiang", "Weitao Zhou", "Minglei Li", "Jinhao Zhang", "Yao Mu", "Xiaofan Li", "Hao Zhao", "Haibao Yu"], "published": "2026-08-25", "summary": "World-Action Models (WAMs) jointly learn future visual prediction and action generation, using video dynamics as a representation-learning signal for robotic manipulation. However, their video latents are primarily optimized for visual prediction and are not explicitly encouraged to preserve cross-view geometric structure or spatially localized, object-relevant semantics. We propose \\textbf{GaussianWAM}, a training-time representation-enhancement framework that organizes geometric and semantic supervision through a 3D Gaussian field. Given synchronized multi-view observations, frozen geometry and vision foundation models provide depth, camera parameters, and dense semantic features. GaussianWAM binds these heterogeneous signals to shared Gaussian primitives and renders spatially aligned semantic, depth, and coverage targets, which are distilled into the current-observation representations of the WAM. All teacher models, Gaussian components, and auxiliary prediction heads are removed after training, leaving the original WAM inference path without additional modules or forward computation. On LIBERO-Plus, GaussianWAM improves FastWAM from 52.05\\% to 71.29\\% and Cosmos Policy from 71.52\\% to 77.30\\%. Direct CLIP and VGGT distillation already establishes a strong FastWAM baseline of 69.37\\%, while Gaussian-field unification further improves it to 71.29\\%, supporting the benefit of spatially organizing heterogeneous teacher signals. GaussianWAM also improves performance on standard LIBERO and shows positive transfer trends on RoboTwin and real-world manipulation. These results suggest that training-time Gaussian distillation provides a practical way to inject geometry- and semantics-related supervision into WAM representations without changing their deployment architecture.", "pdf_url": "https://arxiv.org/pdf/2608.24714v1"}, {"title": "A Multimodal Foundation Model for Longitudinal Patient Representation and Scalable Insight Generation in Oncology", "authors": ["Eugene Vorontsov", "Yi Kan Wang", "Alican Bozkurt", "Adam Casson", "Ludmila Tydlitatova", "Michal Zelechowski", "Ezra E. W. Cohen", "Jyoti D. Patel", "Max Banaszak", "Caitlin McWilliams", "Shane Colley", "Kate Sasser", "Ryan Fukushima", "Eric Lefkofsky", "Razik Yousfi", "Siqi Liu"], "published": "2026-08-25", "summary": "Precision oncology necessitates a longitudinal model of patient state that captures cancer evolution and treatment over time, integrating multimodal observations. We introduce the oFM, a foundation model developed on a real-world oncology cohort of 1.67 million cancer patients that integrates clinical trajectories with DNA, RNA, and H&E pathology. Patient-level partitions were reserved for training, validation, and testing, with over one million patients used for training. The oFM encodes daily clinical and molecular episodes and, along with pathology images, integrates them over time to produce a patient state embedding. We evaluate frozen oFM embeddings against expert-curated clinical and molecular baseline features. In prognostic benchmarks, the oFM improved AUC for treatment response, progression-free survival, and overall survival (0.774 vs. 0.563 for overall survival). Across 11 comparative-treatment cohorts, the oFM embeddings achieved a three-fold higher pooled and scale-normalized treatment-benefit AUTOC than baseline features with improved benefit ranking in 9 of 11 cohorts, and provided stronger prognostic discrimination within both treatment arms. We also evaluated a mechanism discovery framework that interprets downstream models built on oFM embeddings by linking their predicted outcomes to clinically and biologically grounded mechanisms through an evidence-grounded temporal graph, enabling evaluation in clinical and drug-development applications.", "pdf_url": "https://arxiv.org/pdf/2608.24688v1"}, {"title": "Game2World Engine: Unlocking In-the-Wild Gameplay Videos for World Model Training", "authors": ["Wenxuan Shen", "Dongna Jin", "Dongping Chen"], "published": "2026-08-25", "summary": "Video games provide a scalable source of training data for video world models, offering diverse environments, complex interactions, and abundant in-the-wild gameplay videos. However, raw gameplay footage entangles the game world with screen-space interfaces, introducing game-specific biases and irrelevant dynamics that hinder world-model training. To address this problem, we introduce GameUI-Taxonomy and G2WEngine, a full-stack framework that formalizes gameplay UI grounding and removal. G2WEngine automatically extracts reusable UI assets from real gameplay videos and synthesizes temporally coherent UI overlays on clean footage. Using this engine, we construct Game2World, comprising 96K synthetic paired videos with precise reconstruction targets and 1,079 in-the-wild clips from 303 games for realistic evaluation. Its asset library contains 5,132 verified UI elements across 21 taxonomy categories, collected from 1,010 representative gameplay frames. Based on Game2World, we propose GameCleaner, a mask-free gameplay UI removal model that combines multimodal semantic understanding with video editing capabilities. Unlike mask-based methods, GameCleaner directly identifies and removes diverse HUD elements while preserving the underlying scene content and temporal dynamics. In a controlled pilot, world models trained on UI-free gameplay improve overall VideoReward by 6.83% over those trained on UI-overlaid data. On UI-removal evaluation, GameCleaner achieves an average AAR of 95.36 on synthetic videos, outperforming the strongest temporal mask baseline by 57.3%, and obtains the best in-the-wild AAR of 80.05 with 99.8 background preservation. These results demonstrate the scalable potential of transforming Internet gameplay videos into high-quality world-model training data. Code, dataset, and model will be available at https://github.com/Dongping-Chen/Game2World.", "pdf_url": "https://arxiv.org/pdf/2608.24680v1"}, {"title": "Data Leakage Inflates Generalizability of Power Outage Prediction Models", "authors": ["Yamil Essus", "Ranga Raju Vatsavai", "Benjamin Rachunok"], "published": "2026-08-25", "summary": "Power outage prediction models are increasingly used in assessments of climate-driven infrastructure risk, yet current evaluation practices obscure whether these models generalize to the novel conditions such applications require. We identify three common methodological choices in power outage prediction models that influence their ability to generalize across spatial, temporal, and event-based settings. We compare the predictive performance impacts of different methodological decisions using publicly available data for the U.S. East Coast from 2018 to 2023 and feature sets derived from weather reanalysis and land-cover data, and embeddings from a GeoAI foundation model (Prithvi WxC). Specifically, we assess model performance under multiple test selection strategies, including unfiltered random splits, leave-one-state-out, and leave-one-event-out designs, which increasingly approximate real-world deployment conditions. While random train-test splits yield strong performance, we show that these results are inflated by spatial and temporal autocorrelation. Under spatial and temporal holdout experiments, predictive accuracy degrades substantially, with models often failing to outperform a simple null baseline. Incorporating GeoAI foundation model embeddings yields limited and inconsistent improvements, primarily for spatial generalization, and does not resolve poor event-level transferability. These findings suggest that, given current data availability and evaluation practices, publicly trained outage prediction models offer limited and uncertain operational value. Progress will likely require improved data coverage, more realistic evaluation protocols, and a shift in focus from marginal modeling advances toward addressing structural data constraints.", "pdf_url": "https://arxiv.org/pdf/2608.24665v1"}, {"title": "Investigating voiced and unvoiced regions of speech for audio deepfake detection", "authors": ["Ganesh Sivaraman", "Hemlata Tak", "Elie Khoury"], "published": "2026-08-25", "summary": "Deep neural network based deepfake detection systems have achieved high levels of accuracy on benchmark datasets and competitions. However, most models lack interpretability. It is challenging to extract reasoning from the network that can convince the human evaluator to trust the decision. Humans often rely on acoustic cues like unnatural pitch jitter, robotic intonation, acoustic artifacts, and unnatural sounding fricatives to judge the quality of the synthetic audio. This study explores the role played by the voiced and unvoiced regions of speech in discriminating synthetic from bonafide speech. A measure of signal periodicity is used to analyze speech into voiced and unvoiced components. Then, the graph attention based AASIST detection system is trained independently on each component. This work compares the accuracy of deepfake detection system using voiced and unvoiced components and analyzes the results on the MLAAD dataset. Our results show that unvoiced regions are particularly more effective in distinguishing synthetic (deepfake) speech from bonafide, and achieves an equal error rate of 6.62%. When combined with voice regions through score-level fusion, the overall performance improves further, yielding a 5.82% EER, a relative improvement of 49% over the baseline system that uses the full audio.", "pdf_url": "https://arxiv.org/pdf/2608.24639v1"}, {"title": "VIP: Variation-based Iterative-learning Planning for Robotic Navigation", "authors": ["Shuli Lv", "Pengda Mao", "Chen Min", "Li Hong", "Runxiao Liu", "Shuai Wang", "Quan Quan"], "published": "2026-08-25", "summary": "Over the past decade, autonomous robotic systems have been increasingly deployed in applications such as surveying, search and rescue, and last-mile delivery. These applications require robots to generate safe and efficient motion plans in large, complex, and obstacle-dense environments, often under limited onboard computing resources. However, conventional planning methods commonly rely on finite-dimensional trajectory parameterization or increasingly long prediction horizons, leading to rapidly growing computational costs, particularly in multi-robot scenarios. This paper presents a novel variation-based iterative-learning planning (VIP) framework for efficient motion planning of both single robots and robotic swarms. Instead of optimizing a large number of discrete trajectory variables, VIP directly updates the planning command as a continuous function in an infinite-dimensional function space. The same variation-based update can be implemented in a model-in-the-loop manner for offline planning or in a robot-in-the-loop manner between online physical executions. By avoiding the computational burden associated with horizon expansion and high-dimensional trajectory discretization, VIP maintains a per-iteration computational complexity of $\\mathcal{O}(n)$, where $n$ denotes the number of spatial discretization points. Extensive simulations and real-world experiments demonstrate that the proposed framework can efficiently generate and iteratively improve motion plans for different planning objectives, robotic platforms, and swarm configurations, highlighting its effectiveness, computational efficiency, and scalability as a general planning methodology.", "pdf_url": "https://arxiv.org/pdf/2608.24618v1"}, {"title": "Gripper-aware Vision Language Action Models", "authors": ["Hanyi Zhang", "Zihong Luo", "Tianyu Li", "Khang Nguyen", "Basu Hela", "Shreyas Kumar", "Ngoc Duy Tran", "Feng Dai", "Charith Munasinghe", "Jorge Peña Queralta", "Giovanni Toffetti", "Khoa Vo", "Ngan Le", "Ravi Prakash", "Quan Vuong", "Tung D. Ta", "Long Hu", "Anh Nguyen", "Baoru Huang"], "published": "2026-08-25", "summary": "Vision language action models (VLAs) have advanced general purpose robotic grasping and manipulation by enabling robots to interpret visual observations and natural language instructions to generate executable action sequences. However, existing VLAs often implicitly assume gripper invariance, despite grasping strategies being inherently embodiment-dependent. Different gripper types, such as parallel-jaw and suction, usually require distinct interaction strategies to achieve the same grasping objective. Moreover, current datasets for VLAs predominantly rely on parallel-jaw grippers, limiting gripper-aware learning. To address this gap, we introduce MiGA, a multi-gripper-aware dataset spanning five distinct gripper types across multiple robots with 103,000 demonstrations, explicitly capturing strategy divergence under shared task objectives. We further propose GVLA, which combines a new multi-gripper tokenizer with adapter-based policy routing. Our new gripper encoding induces structured embedding information that balances parameter sharing and strategy differentiation, while layer-wise probing confirms meaningful gripper-conditioned representations for VLAs. Intensive experiments in both simulation and real-world robots show that our GVLA outperforms the current baselines across evaluated settings. Our method also improves zero-shot generalization or few-shot adaptation to new objects or unseen tasks, and enable more efficient gripper adaptation.", "pdf_url": "https://arxiv.org/pdf/2608.24603v1"}, {"title": "Taming foundation model with invariance-oriented pre-training for broad-spectrum EEG analysis across signal-level, brain-state, and brain-health tasks", "authors": ["Yulong Dou", "Han Wu", "Guo Chen", "Fangmao Ju", "Zhiming Cui", "Dinggang Shen"], "published": "2026-08-25", "summary": "Electroencephalography (EEG) is a widely used window into human brain function, but most EEG models remain tied to a one-dataset-one-model supervised paradigm. Recent EEG foundation models offer a route toward reusable representations, but most remain reconstruction-centered, assuming that EEG content predictable from local context is necessarily transferable neural information. Here we present INCEPT, an invariance-oriented EEG foundation model trained on over 11,000 hours of unlabelled clinical EEG. Rather than prioritizing signal recovery alone, INCEPT learns representation-level stability across correlated EEG observations, separating stable neural structure and essential subject-sensitive information from the nuisance variability that dominates scalp recordings while preserving subject-, state- and condition-discriminative information. We evaluate INCEPT on a broad-spectrum benchmark of ten datasets spanning three levels of post-acquisition EEG analysis: signal-level assessment, brain-state decoding, and brain-health evaluation. INCEPT ranks first among recent EEG foundation models on 26 of 30 linear-probing metrics and 24 of 30 fine-tuning metrics, and also surpasses strong task-specific specialist encoders across diverse downstream settings. Objective ablations and representation analyses further show that invariance-oriented pre-training improves transfer and organizes subject-sensitive neural representations beyond reconstruction alone. These results establish invariance learning as a promising principle for building reusable EEG foundation models.", "pdf_url": "https://arxiv.org/pdf/2608.24597v1"}, {"title": "Pivot-and-Station Multi-Agent Path Finding: Solvability, Complexity, and Algorithms", "authors": ["Andrea Di Nezza", "Mihir Patel", "Fabio Fagnani", "Sara Bernardini"], "published": "2026-08-25", "summary": "Automated high-density storage systems (warehouses, robotic parking, plant logistics, etc.) require fleets of agents to move through scarce task-critical resources and then park without obstructing future operations. We introduce Pivot-and-Station Multi-Agent Path Finding (PS-MAPF), a MAPF variant in which a subset of tasked agents must each visit one of a set of interchangeable pivots (e.g., workstations) before the entire fleet terminates at anonymous stations, one agent per station. We characterize solvability completely: every instance on a 2-edge-connected graph is solvable, and, on arbitrary connected graphs, a structural effective-distance measure relative to the number of unoccupied vertices gives a necessary and sufficient condition. We prove that minimizing station-makespan or station-flowtime is NP-hard already with a single pivot. We present three algorithms, a complete baseline, a SAT-based optimal solver, and Pivot-Prioritized Planning (PPP), the last solving 74-89% of benchmark instances with makespan and flowtime orders of magnitude below the baseline.", "pdf_url": "https://arxiv.org/pdf/2608.24585v1"}, {"title": "Fiber Optic Sensing Glove for High Performance Dexterous Manipulation Capture", "authors": ["J. D. Peiffer", "Taylor Niehues", "Li Guan", "Ziyi Kou", "Ergys Ristani"], "published": "2026-08-25", "summary": "Capturing hand pose during dexterous manipulation remains difficult: vision-based methods degrade under occlusion and challenging lighting, while sensorized gloves, though occlusion-free, are prone to drift and magnetic interference and rarely match motion-capture accuracy. We introduce a fiber optic sensing glove for full hand pose tracking that targets these failure modes, using multi-core shape-sensing fibers that capture each fiber's full 3D shape rather than curvature alone. A novel pipeline registers each reconstructed fiber shape to a common hand reference frame, and a new inverse-kinematics solver reconstructs full hand pose at 60 Hz using curve constraints. Benchmarked on a 2-hour dataset of dexterous object manipulation tasks across 5 subjects, the glove achieves 7.2 mm mean fingertip position error against motion capture ground truth, reduced to 4.9 mm by a one-time factory calibration of the fiber routing hub that transfers across users and sessions. These capabilities enable high-fidelity data capture and bimanual virtual teleoperation - both essential to advancing the robotics field.", "pdf_url": "https://arxiv.org/pdf/2608.24572v1"}, {"title": "X-MULTI: VLM-based Imaging Factor Disentanglement for Factor-Aware Image Synthesis", "authors": ["Sonali Godavarthy", "Matthias Neuwirth-Trapp", "Tim-Felix Faasch", "Maarten Bieshaar", "Michael Moeller", "Kristof Van Laerhoven", "Danda Pani Paudel"], "published": "2026-08-25", "summary": "Imaging factor disentanglement in text-to-image generation aims to independently control image acquisition properties such as types of camera lenses, sensor types, viewpoints, and domains to enable combinatorial generalization. This should let the model synthesize novel factor combinations unobserved in the training data, such as pairing a fisheye lens with an event sensor never observed in training data. Recent work, MULTI, introduced learnable, factor-specific embeddings to disentangle imaging factors, along with the Factor Alignment Accuracy (FAA) metric to evaluate disentanglement quality. We identify and address two independent limitations. First, MULTI's pixel-level reconstruction objective supervises the model only on observed imaging factor combinations, providing no direct training signal for novel combinations. We therefore propose X-MULTI, which uses a pretrained vision-language model (VLM) to supervise novel factor combinations synthesized during training. Second, we show the FAA metric exhibits severe cross-factor correlation leakage, misrepresenting true disentanglement quality. We therefore propose Improved-FAA (I-FAA), which employs factor-specific augmentation strategies to break these correlations and enables more rigorous evaluation. Experiments demonstrate that X-MULTI achieves improved factor alignment on novel combinations compared to MULTI. Moreover, we show that correlation leakage in FAA distorts the evaluation of true factor disentanglement and I-FAA reduces this leakage and therefore provides a more robust assessment of factor alignment.", "pdf_url": "https://arxiv.org/pdf/2608.24563v1"}, {"title": "Hierarchical Prototype-Memory Adaptation of SAM for Surgical Instrument Segmentation", "authors": ["Xinning Yao", "Jingjing Wang", "Jinghua Yue", "Xiaoyan Luo", "Fugen Zhou", "Bo Liu"], "published": "2026-08-25", "summary": "Surgical instrument segmentation (SIS) is fundamental for computer-assisted surgery, where reliable instrument masks enable precise scene understanding and clinical assistance. Recently, adapting foundation models like the Segment Anything Model (SAM) to the surgical domain via prompt-learning has shown encouraging results. However, the performance of these adapted models under challenging surgical conditions is constrained by suboptimal adaptation mechanisms. Specifically, optimizing prompts or prototypes purely via downstream segmentation loss tends to cause them to degenerate into task-specific parameters rather than serving as persistent, stable category memory, thereby degrading their robustness against complex intraoperative variations. Moreover, routing multi-scale visual cues through a single prompt pathway creates a bottleneck that hinders effective scale-matched coupling. To address these limitations, we propose HPMA, a Hierarchical Prototype-Memory Adaptation framework for SAM. Specifically, HPMA constructs a frozen, multi-scale visual prototype memory bank from annotated surgical scenes and integrates it into SAM's feature space using lightweight adapters to preserve stable category evidence. To maximize the utility of multi-scale cues, we introduce a scale-matched coupling mechanism where global prototypes calibrate class-level prompt features, structural prototypes guide decoder object queries, and local prototypes align high-resolution feature maps through a local alignment objective. Extensive experiments on the public EndoVis2017 and EndoVis2018 datasets demonstrate that our approach achieves state-of-the-art performance, outperforming existing foundation model adaptation methods.", "pdf_url": "https://arxiv.org/pdf/2608.24541v1"}, {"title": "Neurosymbolic Alignment for Physiologically-Safe Clinical Language Models", "authors": ["Abdulhady Abas Abdullah", "Erik Cambria", "Milena Zivkovic"], "published": "2026-08-25", "summary": "Clinical LLMs can generate recommendations that are factually plausible yet physiologically unsafe. We investigate whether safety alignment can be improved by grounding preference optimization in structured physiological knowledge rather than text-only supervision. Methods: We propose Neurosymbolic Alignment, a training-time framework that couples a 7B clinical LLM with an HGNN-based Physiological World Model over an 847K-node biomedical knowledge graph. Candidate responses are scored using homeostatic constraints, multi-hop path plausibility, and drug-interaction penalties, and the resulting rankings drive iterative on-policy ORPO updates. Evaluation is performed on the Clinical Safety Benchmark (CSB), a 2,500-scenario benchmark for physiological constraint violations in generative clinical reasoning. Results: Relative to ORPO, the proposed method improves CSS from 69.5% to 90.8% (+21.3 pp), reduces physician-evaluated HR from 14.1% to 5.1% on the blinded subset, and improves DID from 72.8% to 91.6%. These gains are corroborated by an HGNN-independent Rule-Engine Safety Score (RSS: 86.4%, +21.2 pp over ORPO; r=0.97 concordance with CSS). The method also exceeds GPT-4 (5-shot) on all safety metrics despite a 10x parameter disadvantage, and outperforms an inference-time self-correction pipeline (SFT+SelfCorrect) by 11.4 pp CSS. Under synthetic EHR-style noise, 84.2% CSS is retained. Ablation analysis shows that HGNN scoring (-16.2 pp) and iterative training (-11.5 pp) are the dominant contributors. PhysioScore calibration against 200 clinician labels yielded ECE = 0.038 and kappa = 0.91. Conclusion: Training-time physiological grounding produces measurable and independently verifiable safety improvements in open-weight clinical LLMs under controlled evaluation. External validation on real clinical data is required to determine whether these gains transfer to deployment settings", "pdf_url": "https://arxiv.org/pdf/2608.24534v1"}, {"title": "RoG-DAgger: Rollout-Guided Post-Training for End-to-End Driving", "authors": ["Liangyu Zhong", "Joachim Sicking", "Fabian Hueger", "Hanno Gottschalk"], "published": "2026-08-25", "summary": "Recent end-to-end driving systems demonstrate strong performance on closed-loop benchmarks, yet are still predominantly trained on fixed expert-collected data using open-loop imitation learning. This training-inference mismatch leaves the policy vulnerable in policy-induced states, where accumulated errors can lead to safety-critical failures. A promising post-training approach to overcome this issue is Dataset Aggregation (DAgger), which gathers expert demonstrations in policy-induced states and subsequently fine-tunes the policy on the resulting aggregated dataset. Existing driving DAgger pipelines, however, face three challenges: i) the expert is restricted to a limited trajectory-and-speed solution space, ii) takeover may occur too early or too late relative to impending failures, and iii) privileged expert decisions may rely on information unavailable to the student. To address this, we introduce RoG-DAgger, a post-training framework that uses short-horizon kinematic rollouts to construct high-quality expert demonstrations in safety-critical states. Specifically, RoG-DAgger expands the expert's trajectory-and-speed solution space and evaluates candidate plans through rollout to construct preventive supervision. Moreover, it uses rollout solvability to time the takeover near the estimated point of no return. Lastly, it aligns the expert's field of view with that of the student to provide student-compatible supervision. Across in-distribution (including long-horizon) and out-of-distribution evaluations, RoG-DAgger improves the end-to-end model SimLingo by 5.3 driving-score points and 6.2 percentage points in success rate on Bench2Drive, doubles its driving score from 22 to 44 on Longest6 v2, and improves out-of-distribution success rate from 55\\% to 66\\% on Fail2Drive.", "pdf_url": "https://arxiv.org/pdf/2608.24525v1"}, {"title": "Probing the Three-Dimensional Structure of a Jet with Faraday Tomography", "authors": ["Sawera Gull", "Masaya Kurogi", "Keitaro Takahashi"], "published": "2026-08-25", "summary": "Magnetic fields play a fundamental role in the dynamics and radiation of jets associated with active galactic nuclei (AGNs), where they accelerate and collimate the relativistic plasma and produce the observed synchrotron emission. Faraday tomography is a powerful technique for probing the three-dimensional distribution of magnetic fields and synchrotron-emitting plasma along the line of sight, by reconstructing the Faraday Dispersion Function (FDF) from the observed polarization spectrum. To explore what aspects of AGN-jet structure can be revealed by Faraday tomography, we construct a simple three-dimensional model of an AGN jet that captures its essential features, and compute the resulting FDF for a range of model parameters. The jet is represented as a cylindrical region of uniform thermal-electron density threaded by a coherent helical magnetic field, to which a random turbulent component can optionally be added. The parameters varied include the inclination angle θ between the jet axis and the line of sight, the wavenumber of the helical field, and the amplitude of the random magnetic-field component. By systematically varying these parameters, we examine how the underlying magnetic geometry and turbulence are encoded in the observable Faraday and polarization structures. The main observational signatures identified by our model include top-bottom asymmetry across the jet, curved or double peaked FDF profiles and increasingly fragmented Faraday depth structure along longer lines of sight, providing potential diagnostics of large scale helical magnetic fields and small scale turbulent components. These signatures providing a physical framework for interpreting future polarimetric observations of AGN jets from instruments such as LOFAR, MeerKAT, and the VLA.", "pdf_url": "https://arxiv.org/pdf/2608.24490v1"}, {"title": "NeuralParker: A Reinforcement Learning Planner for Irregular Parking Environments", "authors": ["Zihan Wang", "Bai Huang", "Yang Guan", "Xiao Li", "Haoyu Xu", "Naizheng Wang", "Shengbo Eben Li"], "published": "2026-08-25", "summary": "Automated parking commonly assumes marked slots and short approach maneuvers. Delivery and service vehicles, however, may need to reach an operator-specified pose in an irregular bounded environment from a distant start. Existing learning-based parking planners often rely on local observations, which can restrict long-range route reasoning. To address this problem, we present NeuralParker, a reinforcement learning-based hybrid planner for arbitrary-pose parking. NeuralParker encodes full-environment obstacle and boundary geometry in a target-relative vertex representation, allowing the policy to retain route-defining context throughout the approach. It further couples a learned curvature--length arc policy with an in-loop terminal ensemble that selects from diverse cubic Hermite connections using a curvature-regularized cost. We also establish factorial and long-range route-choice benchmarks to evaluate planning success and trajectory quality. Experiments on these benchmarks show that NeuralParker achieves higher planning success and better overall trajectory quality than the evaluated baselines, while ablation studies support the benefits of the target-relative global representation and terminal ensemble. Finally, a real-vehicle evaluation confirms that the planner transfers effectively to real delivery-vehicle perception at a working parking site, planning successfully at low computational cost.", "pdf_url": "https://arxiv.org/pdf/2608.24485v1"}, {"title": "Emergence of Stigmergic Transport in Granular Environments", "authors": ["F. Wéry", "F. N. Pinan Basualdo", "B. Gorissen", "N. Vandewalle"], "published": "2026-08-25", "summary": "We show that stigmergic path formation emerges in a deformable environment through the interplay between environmental memory and geometrical crowding. Using experiments with robotic random walkers together with a minimal stochastic model, we demonstrate the onset of persistent self-reinforced transport pathways above a critical packing fraction $φ_c$, where environmental memory enhances walker mobility. As the jamming transition $φ_J$ is approached, increasing crowding progressively suppresses this transport enhancement despite the persistence of environmental memory. The resulting non-monotonic behavior reveals an optimal transport regime well below jamming. More generally, our work establishes how active agents can collectively build transport networks through purely mechanical interactions with a deformable substrate.", "pdf_url": "https://arxiv.org/pdf/2608.24383v1"}, {"title": "Predicting Only from Selected Evidence: A Tempered Product-of-Experts Bottleneck for Auditable EEG Diagnosis", "authors": ["Yinghao Wang", "Shujian Yu", "Duc Han Le", "Zhikai Yu", "Changming Wang", "Van-Tam Nguyen"], "published": "2026-08-25", "summary": "Pretrained EEG backbones improve transfer performance, but downstream diagnosis heads remain hard to audit: predictions are made from unrestricted hidden states, whereas explanations are usually produced only after the decision. We introduce tPoE-EIB, an evidence-information bottleneck head for adapting EEG backbones under an evidence-only prediction constraint. tPoE-EIB selects temporal and channel evidence, maps the selected summaries to Gaussian experts over a shared latent variable, and fuses them with a tempered product-of-experts posterior. The classifier observes only this latent, so the decision path is explicit and rate-limited by the expected posterior KL. This gives a tractable supervised objective with an information-rate penalty, while the closed-form tempered posterior mitigates overconfident fusion from correlated evidence axes. We evaluate tPoE-EIB on pretrained EEG foundation-model backbones across six diagnosis settings: event-type classification, abnormality detection, seizure detection, cognitive-decline staging, depression screening, and cerebrovascular-disease classification. The evaluation spans public benchmarks and in-house clinical cohorts, binary screening and fine-grained staging, and sparse and dense montages. tPoE-EIB preserves competitive balanced accuracy and improves over representative post-hoc explanations on selection-faithfulness audits, including insertion-deletion and gate-causality tests. Its structured posterior further enables integration-faithfulness audits, including expert-drop, posterior-reliance, and expert-disagreement tests. Overall, these results suggest that evidence-only, rate-limited fusion is a practical route to auditable diagnosis on top of frozen EEG foundation backbones.", "pdf_url": "https://arxiv.org/pdf/2608.24377v1"}, {"title": "Variance-Guided Spatial Attention Fusion for Robust End-to-End Driving under Asymmetric Sensor Degradation", "authors": ["Weizhi Tao", "Zengwang Jin", "Xiao Wang", "Hailong Huang"], "published": "2026-08-25", "summary": "End-to-end multimodal driving has progressed rapidly by fusing camera and LiDAR streams. Existing pipelines remain fragile under asymmetric sensor degradation, where either an entire modality or only a localized region is corrupted while other regions remain useful. The key difficulty is not simply to add an uncertainty head, but to obtain dense reliability supervision, calibrate this reliability against physical fault severity, and use it before unreliable features bias the planner. We propose Variance-Guided Spatial Attention Fusion (VG-SAF), in which dense heteroscedastic reliability estimates act as interpretable spatial gates. The framework couples three components. First, a physically grounded augmentor simulates representative camera and LiDAR failures and emits a continuous spatial mask, providing dense supervision without additional annotation. Second, modality-specific experts predict per-pixel reliability scales through cross-branch dense distillation in log space, enforcing a monotone severity-to-scale response. Third, calibrated reliability maps drive a hybrid attention mechanism that suppresses unreliable cells with a local spatial gate and arbitrates between modalities through a cross-modal trust softmax. A Laplace uncertainty head emits a systemic waypoint uncertainty scale that signals severe or combined sensor degradation, including severities outside the training ranges. On the CARLA Longest6 benchmark, VG-SAF consistently improves closed-loop robustness over the baselines across camera-only, LiDAR-only, and joint degradation regimes, as measured by driving score, route completion, and infraction score.", "pdf_url": "https://arxiv.org/pdf/2608.24366v1"}, {"title": "Metadata-Aware Adaptation of a Generative Foundation Model for Conditional CMR Synthesis", "authors": ["Marc Rodríguez", "Grzegorz Skorupko", "Nay Aung", "Steffen E Petersen", "Karim Lekadir", "Polyxeni Gkontra"], "published": "2026-08-25", "summary": "Synthetic image generation is a promising strategy to address data scarcity and the underrepresentation of clinically important phenotypes in medical imaging, yet generating images that faithfully reflect meaningful patient characteristics remains challenging. In this work, we investigate metadata-conditioned cardiac magnetic resonance (CMR) synthesis using a pretrained latent diffusion model, encoding structured clinical metadata and slice position as textual prompts to guide CMR generation. To improve metadata adherence and address the imbalance of clinical attributes, we integrate three strategies: Metadata-Free Classifier-Free Guidance (CFG), Contrastive Batching, and Inverse-Frequency Sampling. The framework was fine-tuned and evaluated on 59,058 short-axis CMR from the UK Biobank using paired image similarity, distributional fidelity, and subgroup-level analyses. The combined approach achieved a Fréchet Inception Distance (FID) of 37.47, improving by 57.04\\% over the same model fine-tuned without these strategies and by 28.68\\% over a previous text-conditioned CMR diffusion baseline requiring cardiac geometry as additional input, while relying solely on patient metadata. This distributional gain, driven mainly by Metadata-Free CFG, came with a modest reduction in paired similarity, suggesting that the model prioritizes population-level realism over exact image reproduction. Subgroup analyses demonstrated improved alignment across demographic and acquisition-related metadata, with disease-specific conditioning being the most challenging task. These findings demonstrate the potential of generative foundation models for clinically meaningful CMR synthesis while highlighting the need for more effective metadata-aware conditioning strategies. Our code is available at https://github.com/rodriguezmarc/conditional-cmr.", "pdf_url": "https://arxiv.org/pdf/2608.24342v1"}, {"title": "Speech-to-SOAP: End-to-End Summarization of Medical Dialogues: KIT@BeTraC 2026", "authors": ["Enes Yavuz Ugan", "Fabian Retkowski", "Yuka Ko", "Thai-Binh Nguyen", "Maike Züfle", "Jan Niehues", "Alexander Waibel"], "published": "2026-08-25", "summary": "With the advent of Large Language Models and its instruction following capabilities a promising application is the task of summarization. Within this domain of task the extractive sub-task of clinical protocolling has emerged as a topic of particular interest as it can significantly reduce the downtime and protocolling burden of health-care workers thus enabling them to focus on their core work helping humans. A further step towards automation is the direct generation of clinical notes from speech without intermediate transcripts, reducing processing time while preserving information such as coughing or other paralinguistic cues that may be lost in transcript-based systems. To this end, we present KIT's submission to this years BeTraC challenge in the lightweight track. Our main contribution is a scalable data augmentation pipeline that unifies heterogeneous medical dialogue datasets through synthetic speech generation and automatically generated SOAP supervision, enabling robust adaptation of a speech foundation model for end-to-end speech-to-SOAP generation.", "pdf_url": "https://arxiv.org/pdf/2608.24327v1"}, {"title": "Causal Analysis for Time Series Foundation Models", "authors": ["Mathis Jander", "Wouter van Heeswijk", "Martijn Mes"], "published": "2026-08-25", "summary": "Transitioning from bespoke time series models towards time series foundation models changes the relationship of model and application from one-to-one to one-to-many. This shift introduces concentration risk as many, potentially high-risk, forecasting applications are exposed to the same biases and failure modes of a single time series foundation model. At the same time, this centralization allows for economies of scale in model development and validation. In this study we investigate how biases and failure modes of time series foundation models can be identified before deployment. We propose a causal analysis framework to investigate the ability of a time series foundation model to preserve time series patterns. To achieve this, we intervene on parameterized synthetic time series generators and measure the corresponding change in model output under ceteris paribus conditions. We apply our causal analysis framework to Chronos-2 and TimesFM-2.5 and test them across six distinct time series patterns. We find safe configurations for trend and harmonic oscillation patterns. The results also indicate a bias in both models towards overestimating persistence, sudden failures for both models against the regime switch pattern and failure for TimesFM-2.5 against the energy-release pattern. Our review of the original works for both models indicates that the findings might be explained by the data used for pretraining. We conclude our study with suggestions for further model development, recommendations for application-specific model selection, and a discussion of limitations and further research directions.", "pdf_url": "https://arxiv.org/pdf/2608.24303v1"}, {"title": "CARE: Camera-Residual Reserves for First Sightings in Adaptive LiDAR Sensing", "authors": ["Jiachen Gong", "Yun Li", "Ehsan Javanmardi", "Wencan Mao", "Manabu Tsukada"], "published": "2026-08-25", "summary": "Adaptive LiDAR scanning concentrates a limited sensing budget on regions of interest predicted from past object tracks, lowering data volume in autonomous driving while maintaining detection accuracy. However, existing scanning policies face three challenges. First, history-driven approaches depend on past tracks, so unseen objects are detected late or missed. Second, random or uniform sampling outside
