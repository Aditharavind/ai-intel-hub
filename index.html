calendar events, shipment tracking, stock market, or Zigbee integrations. Partial-refresh optimization for responsive dashboard-style updates. Full GitHub repository with sample code. Requires minimum soldering skills. [&#8230;]"}, {"title": "Astrolight and ATMOS Space Cargo Aim for First In-Flight Laser Link Between Re-Entry Vehicle and Satellite", "source": "EE Journal", "date": "2026-08-13", "url": "https://www.eejournal.com/industry_news/astrolight-and-atmos-space-cargo-aim-for-first-in-flight-laser-link-between-re-entry-vehicle-and-satellite/", "summary": "August 10, 2026. Astrolight, a Lithuanian space and defense company developing laser communication solutions across space, ground, and maritime domains, and ATMOS Space Cargo, a European company developing space return logistics, have signed a memorandum of understanding to jointly demonstrate what they aim to make the first in-flight optical communications link between a re-entry spacecraft and an &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/astrolight-and-atmos-space-cargo-aim-for-first-in-flight-laser-link-between-re-entry-vehicle-and-satellite/\">Read More &#8594;<span class=\"screen-reader-text\"> \"Astrolight and ATMOS Space Cargo Aim for First In-Flight Laser Link Between Re-Entry Vehicle and Satellite\"<\/span><\/a>"}, {"title": "EIZO Rugged Solutions Launches SOSA® Aligned 3U VPX Single Board Computer Powered by NVIDIA IGX Thor for Tactical AI Edge Processing", "source": "EE Journal", "date": "2026-08-13", "url": "https://www.eejournal.com/industry_news/eizo-rugged-solutions-launches-sosa-aligned-3u-vpx-single-board-computer-powered-by-nvidia-igx-thor-for-tactical-ai-edge-processing/", "summary": "Orlando, Florida, August 10, 2026 – EIZO Rugged Solutions Inc., a leading provider of ruggedized, high-performance embedded computing solutions, announced the Condor T5-IOX, a next-generation SOSA® aligned 3U VPX single board computer (SBC) powered by the NVIDIA IGX T5000 system-on-module. Engineered for mission-critical applications, the Condor T5-IOX enables rapid deployment of AI-driven capabilities at the tactical edge, supporting real-time &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/eizo-rugged-solutions-launches-sosa-aligned-3u-vpx-single-board-computer-powered-by-nvidia-igx-thor-for-tactical-ai-edge-processing/\">Read More &#8594;<span class=\"screen-reader-text\"> \"EIZO Rugged Solutions Launches SOSA® Aligned 3U VPX Single Board Computer Powered by NVIDIA IGX Thor for Tactical AI Edge Processing\"<\/span><\/a>"}, {"title": "Peraso Targets Defense and UAV Markets with New PRM2145 Jam-Resistant Communications Module", "source": "EE Journal", "date": "2026-08-13", "url": "https://www.eejournal.com/industry_news/peraso-targets-defense-and-uav-markets-with-new-prm2145-jam-resistant-communications-module/", "summary": "Peraso Inc. (NASDAQ: PRSO) (&#8220;Peraso&#8221; or the &#8220;Company&#8221;), a pioneer in mmWave wireless technology solutions, today announced the introduction of the “PRM2145,” a new wireless communications module specifically designed to address the requirements of unmanned aerial vehicles (UAV), autonomous systems, and defense communications applications. The launch of the PRM2145 marks an important expansion of Peraso&#8217;s product portfolio &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/peraso-targets-defense-and-uav-markets-with-new-prm2145-jam-resistant-communications-module/\">Read More &#8594;<span class=\"screen-reader-text\"> \"Peraso Targets Defense and UAV Markets with New PRM2145 Jam-Resistant Communications Module\"<\/span><\/a>"}, {"title": "Hackster launches Build the Autodesk University 2027 Product design challenge", "source": "EE Journal", "date": "2026-08-13", "url": "https://www.eejournal.com/industry_news/hackster-launches-build-the-autodesk-university-2027-product-design-challenge/", "summary": "Hackster.io, an Avnet community, in partnership with Autodesk, Arduino, Qualcomm and PCBWay, has launched a new competition challenging developers, engineers and makers to design the next official product for Autodesk University 2027. The winning concept will be manufactured and distributed to approximately 750 attendees at Autodesk University 2027. Using Autodesk Fusion, the Arduino® UNO™ Q &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/hackster-launches-build-the-autodesk-university-2027-product-design-challenge/\">Read More &#8594;<span class=\"screen-reader-text\"> \"Hackster launches Build the Autodesk University 2027 Product design challenge\"<\/span><\/a>"}, {"title": "Verific Is Even More Terrific Than You Thought", "source": "EE Journal", "date": "2026-08-13", "url": "https://www.eejournal.com/article/verific-is-even-more-terrific-than-you-thought/", "summary": "<img alt=\"\" class=\"webfeedsFeaturedVisual wp-post-image\" height=\"300\" src=\"https://www.eejournal.com/wp-content/uploads/2026/08/max-0509-image-for-home-page-verific-300x300.jpg\" style=\"display: block; margin-bottom: 5px; clear: both;\" width=\"300\" />If you cast your mind back to the 1980s and 1990s, the electronic design automation (EDA) landscape was a very different place to the one we find ourselves in today. There were lots and lots of small EDA companies, each beavering away on some clever new tool or technology. It was an exciting time to &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/article/verific-is-even-more-terrific-than-you-thought/\">Read More &#8594;<span class=\"screen-reader-text\"> \"Verific Is Even More Terrific Than You Thought\"<\/span><\/a>"}, {"title": "Apollo Automation launches $40 official ESPHome Starter Kit with ESP32-C6 board, four FPC modules", "source": "CNX Software", "date": "2026-08-12", "url": "https://www.cnx-software.com/2026/08/12/apollo-automation-official-esphome-starter-kit-with-esp32-c6-board-four-fpc-modules/", "summary": "<div><img alt=\"Official ESPHome Starter Kit\" class=\"attachment-medium size-medium wp-post-image\" height=\"687\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/08/Official-ESPHome-Starter-Kit-720x687.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Apollo Automation&#8217;s ESPHome Starter Kit is the first official ESPHome starter kit designed and engineered by Apollo Automation in partnership with the Open Home Foundation. It features the ESPHome C6 board with the ESP32-C6-MINI-1 wireless module and two FPC expansion connectors for four modules part of the kit for PIR motion, temperature, and humidity sensing, as well as a button, a buzzer, and ten RGB LEDs. ESPHome Starter Kit highlights and specifications: Main board &#8211; ESPHome C6 Board Wireless Module &#8211; ESP32-C6-MINI-1 with 2.4GHz Wi-Fi 6, Bluetooth LE, and Thread/Zigbee connectivity Expansion &#8211; 2x 14-pin FPC connectors Misc Reset and Boot buttons RGB LED Power Supply 5V via USB-C port Optional rechargeable LiPo battery Dimensions  &#8211; TBD Modules MH-SR602 PIR motion module with 0 to 3.5 m range AHT20F temperature and humidity module with ±0.3 °C and ±2% RH accuracy 10x RGB LEDs and a piezo buzzer via ESPHome Casita [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/08/12/apollo-automation-official-esphome-starter-kit-with-esp32-c6-board-four-fpc-modules/\">Apollo Automation launches $40 official ESPHome Starter Kit with ESP32-C6 board, four FPC modules<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "TI Unveils CAN XL Transceiver", "source": "Embedded.com", "date": "2026-08-12", "url": "https://www.embedded.com/ti-unveils-can-xl-transceiver/", "summary": "<p>Texas Instruments (TI) has claimed the industry's first commercially-available controller area network (CAN) extended data-field length (XL) transceiver for industrial systems including humanoid robots, industrial robots, and HMI systems that require more data at faster speeds. The TCAN6062 CAN XL transceiver supports payloads up to 2,048 bytes per frame and data rates as high as [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/ti-unveils-can-xl-transceiver/\">TI Unveils CAN XL Transceiver<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "Microchip Upgrades PolarFire FPGA Ethernet Sensor Bridge", "source": "Embedded.com", "date": "2026-08-12", "url": "https://www.embedded.com/microchip-upgrades-polarfire-fpga-ethernet-sensor-bridge/", "summary": "<p>Microchip Technology Inc. has introduced Revision 2.0 PolarFire FPGA Ethernet Sensor Bridge for Ethernet-based AI inferencing at the edge. The smaller, production-ready board for standardized sensor integration, leveraging Nvidia Holoscan Sensor Bridge (HSB) technology, supports twice the number of cameras and offers a lower price point than the first generation. Thanks to the power efficiency, security, and reliability [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/microchip-upgrades-polarfire-fpga-ethernet-sensor-bridge/\">Microchip Upgrades PolarFire FPGA Ethernet Sensor Bridge<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "Mouser Explores the Future of Quantum Computing and Its Potential to Transform Engineering", "source": "EE Journal", "date": "2026-08-12", "url": "https://www.eejournal.com/industry_news/mouser-explores-the-future-of-quantum-computing-and-its-potential-to-transform-engineering/", "summary": "Mouser Electronics, Inc., the authorized global distributor with the newest electronic components and industrial automation products, today announced the latest installment of its Empowering Innovation Together (EIT) technology series, A Quantum Leap in Computer Processing. This installment explores the emerging field of quantum computing and examines how the principles of quantum mechanics could unlock new &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/mouser-explores-the-future-of-quantum-computing-and-its-potential-to-transform-engineering/\">Read More &#8594;<span class=\"screen-reader-text\"> \"Mouser Explores the Future of Quantum Computing and Its Potential to Transform Engineering\"<\/span><\/a>"}, {"title": "Aalyria and ALL.SPACE bring Spacetime-Orchestrated Hydra MAX terminals into operational deployment for U.S. Government hybrid architectures", "source": "EE Journal", "date": "2026-08-12", "url": "https://www.eejournal.com/industry_news/aalyria-and-all-space-bring-spacetime-orchestrated-hydra-max-terminals-into-operational-deployment-for-u-s-government-hybrid-architectures/", "summary": "Deployment marks Hydra MAX’s move from strategic collaboration to operational demonstration in U.S. Government environments Terminals will run Aalyria’s Spacetime orchestration software integrated directly with the Hydra MAX platform Deployment supports U.S. Government  an expanding set of initiatives aligned to U.S. missile-defense and joint-force data-transport architectures Spacetime is hardware-agnostic and already runs across multiple terminal &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/aalyria-and-all-space-bring-spacetime-orchestrated-hydra-max-terminals-into-operational-deployment-for-u-s-government-hybrid-architectures/\">Read More &#8594;<span class=\"screen-reader-text\"> \"Aalyria and ALL.SPACE bring Spacetime-Orchestrated Hydra MAX terminals into operational deployment for U.S. Government hybrid architectures\"<\/span><\/a>"}, {"title": "Cinch-Fibreco JCON Junior Bulkhead Expanded Beam Adapter now available from Lane Electronics", "source": "EE Journal", "date": "2026-08-12", "url": "https://www.eejournal.com/industry_news/cinch-fibreco-jcon-junior-bulkhead-expanded-beam-adapter-now-available-from-lane-electronics/", "summary": "Specialist connector distributor Lane Electronics has announced availability of the newly released Cinch-Fibreco JCON series. The JCON Junior Bulkhead Expanded Beam Adapter is designed to simplify panel-mounted fibre-optic connectivity by enabling standard patchcords to be used between the adapter and the transceiver. Until now, high-performance expanded beam connector panel adapters have not offered the same straightforward installation &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/cinch-fibreco-jcon-junior-bulkhead-expanded-beam-adapter-now-available-from-lane-electronics/\">Read More &#8594;<span class=\"screen-reader-text\"> \"Cinch-Fibreco JCON Junior Bulkhead Expanded Beam Adapter now available from Lane Electronics\"<\/span><\/a>"}, {"title": "TDK introduces programmable DIN-rail mount isolated DC-DC converters with 120 W and 240 W outputs and wide conversion ratios", "source": "EE Journal", "date": "2026-08-12", "url": "https://www.eejournal.com/industry_news/tdk-introduces-programmable-din-rail-mount-isolated-dc-dc-converters-with-120-w-and-240-w-outputs-and-wide-conversion-ratios/", "summary": "TDK Corporation (TSE:6762) announces the introduction of the TDK-Lambda DDSM 120 W and 240 W programmable DC-DC converters. These products feature a wide input and output voltage range with an isolated design. The DDSM series also offers remote control and real time monitoring via Modbus over USB using the PowerCMC control and monitoring center. In &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/tdk-introduces-programmable-din-rail-mount-isolated-dc-dc-converters-with-120-w-and-240-w-outputs-and-wide-conversion-ratios/\">Read More &#8594;<span class=\"screen-reader-text\"> \"TDK introduces programmable DIN-rail mount isolated DC-DC converters with 120 W and 240 W outputs and wide conversion ratios\"<\/span><\/a>"}, {"title": "Nordic nRF9151 Enables Cellular and Satellite IoT Devices", "source": "Embedded.com", "date": "2026-08-11", "url": "https://www.embedded.com/nordic-nrf9151-enables-cellular-and-satellite-iot-devices/", "summary": "<p>Nordic Semiconductor is simplifying the development of IoT devices that require connectivity across both terrestrial cellular and satellite networks. LooUQ's MTC2-N9151 embedded modem has received Skylo non-terrestrial network (NTN) certification, building on the certification of Nordic's nRF9151 cellular IoT module. This enables developers to use a pre-certified hardware foundation for products that can switch between [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/nordic-nrf9151-enables-cellular-and-satellite-iot-devices/\">Nordic nRF9151 Enables Cellular and Satellite IoT Devices<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "Simplifying Embedded System Design with a Modern Software Ecosystem", "source": "Embedded.com", "date": "2026-08-11", "url": "https://www.embedded.com/simplifying-embedded-system-design-with-a-modern-software-ecosystem/", "summary": "<p>ADI details how an open, modular software ecosystem, using its CodeFusion Studio, can reduce development effort in embedded system design.<\/p>\n<p>The post <a href=\"https://www.embedded.com/simplifying-embedded-system-design-with-a-modern-software-ecosystem/\">Simplifying Embedded System Design with a Modern Software Ecosystem<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "Silicon Motion Unveils PerformaShape Technology for AI SSDs", "source": "Embedded.com", "date": "2026-08-11", "url": "https://www.embedded.com/silicon-motion-unveils-performashape-technology-for-ai-ssds/", "summary": "<p>Silicon Motion Technology Corp. has introduced its MonTitan SSD reference design kit (RDK), incorporating the company's next-generation PerformaShape technology. Presented at FMS2026, the platform is designed for agentic AI infrastructure, where enterprise SSDs are increasingly required to operate as a persistent memory tier for applications such as key-value (KV) cache offload. The solution targets predictable [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/silicon-motion-unveils-performashape-technology-for-ai-ssds/\">Silicon Motion Unveils PerformaShape Technology for AI SSDs<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "HBM, Agentic AI Platform for PCB Design, Ku-Band RFoF Transmitter: Embedded Week Insights", "source": "Embedded.com", "date": "2026-08-07", "url": "https://www.embedded.com/hbm-agentic-ai-platform-for-pcb-design-ku-band-rfof-transmitter-embedded-week-insights/", "summary": "<p>Here's a roundup of this week's must-read articles. We'll look into the latest developments in high-bandwidth memory, Cadence's agentic AI platform for PCB Design, and a Ku-Band RFoF transmitter. Also, check News Archives - Embedded and Technical Articles Archives - Embedded for the complete list of news and articles from our website. NEWS Partnership Delivers AI-Powered Design to Engineers [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/hbm-agentic-ai-platform-for-pcb-design-ku-band-rfof-transmitter-embedded-week-insights/\">HBM, Agentic AI Platform for PCB Design, Ku-Band RFoF Transmitter: Embedded Week Insights<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}], "papers": [{"title": "Generation-Powered Inference for Distribution-Valued Outcomes", "authors": ["Yijiao Zhang", "Hongzhe Li"], "published": "2026-08-14", "summary": "Modern generative models increasingly produce distribution-valued outputs, such as predicted cellular responses to genetic perturbations in single-cell genomics. While these models provide valuable auxiliary information, they are inherently imperfect, creating a need for statistical methods that leverage their predictions without relying on their correctness. We propose generation-powered inference (GPI), a general framework for improving inference on distribution-valued parameters using auxiliary generative models. Focusing on Wasserstein barycenters and related distributional functionals, we introduce a function-valued bridge representation that transforms inference in the nonlinear Wasserstein space into estimation of a mean function in a Hilbert space, enabling an augmented estimation framework analogous to prediction-powered inference. We develop a family of GPI estimators with optimal information borrowing, establish consistency, asymptotic normality, and simultaneous confidence bands, and derive valid inference for linear functionals and Wasserstein distances. Simulation studies demonstrate efficiency gains over labeled-data-only methods and robust performance under generative model misspecification. We illustrate the proposed framework using a Perturb-seq study of K562 cells, where synthetic perturbation responses generated by the State foundation model are used to improve inference for pathway-level consensus gene expression distributions associated with perturbations of the 40S ribosome module.", "pdf_url": "https://arxiv.org/pdf/2608.14542v1"}, {"title": "Spatiotemporal Tube-Based Safety-Certificate for Autonomous Navigation of Articulated Vehicles", "authors": ["Mohd. Faizuddin Faruqui", "Ratnangshu Das", "Ravi Kumar L", "Pushpak Jagtap"], "published": "2026-08-14", "summary": "Articulated vehicles are the workhorses of freight transportation, and their autonomous navigation is challenging. Their physical characteristics and motion constraints pose significant challenges in manoeuvring these vehicles on narrow routes. This paper presents a spatiotemporal tube-based approach to plan autonomous navigation of vehicles like tractor semi-trailers, truck/ tractor trailers, towing Automated Guided Vehicles (AGVs), and road trains. This planning approach provides a certified path plan for the truck or tractor, ensuring that the towed series of trailers always remains within the road corridor, limited by permissible corrections. The planning leverages the kinematics of the linked elements along with sway constraints to arrive at a safe tube for the actuated prime mover. We modify the spatiotemporal tube using permissible corrections to provide a route safety certificate to the vehicle for the given route. The proposed planning method is verified on a truck-trailer navigation simulation for a complex route.", "pdf_url": "https://arxiv.org/pdf/2608.14531v1"}, {"title": "Marionette: Predicting World States, Rendering Geometry, Painting Appearance", "authors": ["Zian Meng", "Zhen Li", "Chuanhao Li", "Qiang Li", "Kaipeng Zhang"], "published": "2026-08-14", "summary": "Interactive game world models typically autoregress visual observations directly in pixel or latent space, forcing structured properties such as pose, geometry, and occlusion to be implicitly maintained by the same generative sequence. Over long horizons, errors in these latent world properties accumulate, making consistency and controllability fragile. We explicitly model the evolving world state, delegate exact geometric computation to a fixed, zero-parameter renderer, and leave the neural model to synthesize appearance. We instantiate this idea as Marionette, a world model for interactive games with articulated characters. First, a two-stage autoregressive dynamics model predicts an explicit and interpretable 276-dimensional 3D world state comprising multi-entity articulated skeletons, metric root trajectories, and rotations. Second, a zero-parameter graphics bridge converts the predicted state into pose-control videos, computing world-space geometry and occlusion in closed form. Third, a control-conditioned video-diffusion observation model synthesizes photorealistic RGB observations from the resulting structured controls. Our experiments establish two properties of Marionette. First, the predicted world state is directly controllable. Forcing a mismatched action stream changes root-aligned joint error by 31% across 48 held-out segments. Second, long-horizon behaviour is determined in the state, and can be repaired there. Left free, the two generated characters drift to 21.2 m apart (recorded sessions stay near 5 m) and a third of frames show ground penetration. Two rules imposed on the explicit state, a terrain collider and a separation cap, cut penetration by 66% and keep the pair engaged, with no change to the observation model. Routing appearance through the predicted state costs no fidelity we can detect, at an FVD of 831 against 799 for recorded pose.", "pdf_url": "https://arxiv.org/pdf/2608.14530v1"}, {"title": "Twin: Playing an Unknown Game with a Test-Time Digital Twin", "authors": ["Alexy Skoutnev", "Kirill Acharya", "Gaston Longhitano", "Madeleine Udell", "Kevin Ellis", "Iddo Drori"], "published": "2026-08-14", "summary": "We present a Test-time World-model Inference (Twin) system, in which a frontier coding agent writes an executable world model for completing continual learning tasks, such as ARC-AGI-3 games. Traditional approaches hand-engineer such models, one custom design per task. Each game hides its rules and goal, and our system constructs them from simulation and interaction alone. Its inductive prior over grid games is strong enough to recover the true transitions of the game and the goal on nearly all levels. Replay validation happens in a twin world model. The harness enforces that an action is not made until the program reproduces every previous observed game transition. Each mismatch between a world model prediction and the actual action result becomes a counterexample that is used to repair the world model. Twin clears 179 out of 183 levels (97.8%), and does so more efficiently than humans in 158 out of 179 levels (88.3%). The system infers the goal before any reward on 156 of the levels it clears (87.2%), and in the remaining levels automatically discovers the goal by search. The benchmark scores completion and action efficiency, between 0 and 100, against humans playing each game for the first time. Played directly, the base model scores only 7.8%; an off-the-shelf harness increases it to 61.1%, whereas our twin world model increases the same base model to 93.3%, clearing 23 out of 25 games. Building a usable world model is simpler than anticipated, whereas the harder problem is inferring the right goal.", "pdf_url": "https://arxiv.org/pdf/2608.14490v1"}, {"title": "Ensuring Safe Physical AI in Urban Mobility via Hazard-Informed Synthesized Envelopes", "authors": ["Alexei Odinokov", "Rostislav Yavorskiy"], "published": "2026-08-14", "summary": "As heterogeneous robotic systems deploy across diverse urban zones, maintaining safety amid complex human-robot interactions remains a critical challenge. We present a unified framework that bridges systematic hazard analysis and runtime enforcement using hazard-informed safety envelopes. Rather than treating safety as a static constraint isolated within individual software modules, we introduce a cross-layer safety transformation process spanning symbolic, spatial, and dynamic world models. We show how this representation naturally interfaces with physical AI runtime harnesses to guarantee safe urban mobility.", "pdf_url": "https://arxiv.org/pdf/2608.14481v1"}, {"title": "Expected Free Energy-based Informative Path Planning for Robotic Mars Exploration", "authors": ["Ajith Anil Meera", "Pablo Lanillos", "Wouter Kouw"], "published": "2026-08-14", "summary": "An autonomous robot efficiently exploring an unknown environment, such as looking for water sources on Mars, faces two simultaneous demands: building an accurate information map while quickly finding the regions of greatest value, and paying for every meter of travel and the cost of every measurement it takes. Classical information-seeking and reward-seeking criteria address only one of these objectives at a time. Here, we propose Expected Free Energy (EFE), the principled action-selection objective from active inference, as a unifying criterion for budgeted robotic informative path planning. Maintaining a Gaussian-process belief over the information field, our agent plans continuous trajectories that minimize expected free energy under hard path-length constraints. The results from multiple realizations show that EFE-based planning yields accurate posterior maps and locates the highest-value regions simultaneously, outperforming information-theoretic baselines under the same settings. In robotic exploration, these unified, easy-to-tune principled information-gathering strategies facilitate autonomous deployment while enforcing efficiency and resource constraints.", "pdf_url": "https://arxiv.org/pdf/2608.14466v1"}, {"title": "THRIVE: Therapeutic Humanoid Robot In Virtual Environment", "authors": ["Jin Xu", "Yu-Ping Chen", "Ayanna Howard"], "published": "2026-08-14", "summary": "This paper presents THRIVE (Therapeutic Humanoid Robot In Virtual Environment), an at-home rehabilitation platform that integrates a suite of virtual-reality upper-body rehabilitation games, a real-time camera-based motion-tracking system, and a socially interactive robot therapist. The system is designed for therapy and intervention in children with upper-limb motor impairments, which can be improved through consistent, task-specific practice. THRIVE features a set of newly designed, engaging games that target functional reaching, grasping, and object-manipulation movements through customizable popping, hitting, catching, and grabbing tasks, while the camera-based tracking system captures the child's kinematic performance during play. A robot therapist - deployable either as a physical robotic coach or as a remote-presence virtual agent - delivers adaptive, dynamic feedback to motivate the child and guide their movements toward therapeutic goals. THRIVE decouples the therapeutic games from the robot embodiment, extending the platform to support various embodiments and different robots within one modular system. This robot-agnostic design makes THRIVE affordable, scalable, and readily adaptable for sustained use in the home, offering a practical pathway to more consistent and engaging upper-limb therapy for children with motor function impairments.", "pdf_url": "https://arxiv.org/pdf/2608.14462v1"}, {"title": "Control-Informed Constraint Adaptation in Minimum-Time Trajectory Planning for Autonomous Racing", "authors": ["Ann-Kathrin Schwehn", "Alexander Langmann", "Mattia Piccinini", "Johannes Betz"], "published": "2026-08-14", "summary": "Autonomous racecars operate at the limits of vehicle dynamics, where small control errors translate into safety-critical behavior and lost performance. Trajectory planners assume perfect tracking and remain blind to execution errors. To guarantee safety, trajectory planners therefore restrict themselves to conservative spatial margins, leaving usable track space untapped. To overcome these issues, we introduce a control-informed online trajectory planning framework that learns from its own execution errors. By measuring systematic tracking deviations during runtime, we dynamically adapt spatial track constraints and iteratively expand the free-space planning area. The planner remains time-optimal while compensating for accumulated execution errors. This method was analyzed in a high-fidelity closed-loop simulation environment with autonomous racecars. The results demonstrate that our approach reduces lap time by 1.8\\,s without increasing computational burden, maintaining a median runtime of 25 ms. Our finding indicates that feeding control-induced deviations back into the planning layer unlocks performance previously inaccessible to modular architectures and enables autonomous vehicles to exploit track limits systematically.", "pdf_url": "https://arxiv.org/pdf/2608.14448v1"}, {"title": "Surface Roughness and Filler Restructuring in Magneto-Active Elastomers: Magnetically Hard versus Magnetically Soft Particles", "authors": ["Júlio P. A. Santos", "Mehdi Hasanzade", "Chaitanya Doifode", "Raphael Kriegl", "Alexander Kovalev", "Mikhail Shamonin", "Stanislav N. Gorb", "Sofia Kantorovich"], "published": "2026-08-14", "summary": "Magneto-active elastomers (MAEs) -- composites of magnetic nano-/micro-particles embedded in a soft polymer matrix -- are promising for soft robotics, as their shape and mechanical properties can be controlled by an applied magnetic field. Most MAEs are filled with magnetically soft (MS) micro-particles, such as carbonyl iron powder (CIP). We employ molecular dynamics to study the differences between thin MAE layers with MS and magnetically hard (MH) filler particles having the same saturation magnetization. We find that both MH and MS elastomers converge to the same high-field state -- a labyrinth of bundled, field-aligned chains -- but do so through distinct pathways: MH MAEs break their zero-field chains, which lie parallel to the MAE layer plane (in-plane), and rotate them into alignment with an external magnetic field, whereas MS MAEs gradually build up field-aligned chains from neighboring particles. We show that the MS model reproduces the magnetization curves and surface roughness of CIP-based MAEs for magnetic fields close to saturation, while maintaining the observed qualitative features at lower field strengths. The mismatch between simulation and experimental results at low fields suggests the need for a MS model that accounts for the multi-domain nature of carbonyl iron microparticles.", "pdf_url": "https://arxiv.org/pdf/2608.14433v1"}, {"title": "CytoBERT: A Foundation Model for Cytometry Data", "authors": ["Syed Abdul Haseeb Qadri", "Bjarne C. Hiller", "Felix Blanke", "Vanja Sophie Cangalovic", "Kutalmış Coşkun", "Amin Mirzaei", "Tom Siegl", "Sebastian Bader", "Thomas Kirste", "Martin Becker"], "published": "2026-08-14", "summary": "Cytometry measures the complex characteristics of single cells (e.g., counts and protein expression of immune cells) and is widely used across immunological research and clinical settings. However, cytometry data is highly heterogeneous and unstandardized due to experimental protocols and the choice of measured features. While machine learning methods hold the potential to gain deeper insights into cell biology, these challenges make them difficult to apply and transfer across studies. Recent advances in foundation models can alleviate these issues, but corresponding approaches are still scarce in this field. To address this, we provide CytoBERT, a publicly available, open-source, open-weight foundation model for single-cell cytometry data with variable marker panels. CytoBERT is pretrained in a self-supervised manner on a large-scale cytometry corpus (15 human datasets with heterogeneous marker panels and more than 50 million cells) curated through marker standardization, enabling it to learn transferable inter-marker relationships within cells. Fine-tuning CytoBERT for sample-level classification demonstrates that transfer learning across heterogeneous cytometry datasets is feasible, providing a starting point for scalable, generalizable cytometry analysis. Code is available at GitHub.", "pdf_url": "https://arxiv.org/pdf/2608.14414v1"}, {"title": "The Past and Future of AI Scientists", "authors": ["Ross D. King"], "published": "2026-08-14", "summary": "We present a survey of the past and future of AI Scientists: machines capable of automating science. AI Scientists can originate hypotheses, deduce their consequences, design and execute experiments, interpret their results, and revise their beliefs. Such systems are integrated scientific agents, connected to the literature, formal knowledge, mathematical models, simulations, data-analysis systems and physical laboratories. Adam was the first machine to make novel scientific discoveries through cycles of hypothesis formation and physical experimentation. Eve established the architecture of the modern self-driving laboratory. Foundation models, autonomous agents and laboratory robotics now make it possible to build systems far more general than either Adam or Eve. The central problem is no longer whether individual components of science can be automated. They can. The problem is integration. AI Scientists must combine neural learning with logic, probability, mathematics, causal reasoning, simulation, experimental design, robotics and formal scientific records. AI Scientists have the potential to transform science: to make science faster, cheaper, more systematic and more reproducible. AI Scientists could investigate systems too complicated for unaided human science, and enable thousands of AI scientists to work together on single problems. The Nobel Turing Challenge sets the goal of developing by 2050 AI systems capable of automating Nobel-quality discoveries. Progress is ahead of schedule. When we succeed it will create a new form of science and transform the world.", "pdf_url": "https://arxiv.org/pdf/2608.14407v1"}, {"title": "Effect of Twisted-Yarn Architecture on Pressure and Proximity Sensing Characteristics of Textile Capacitive Sensors for Robotic Skin", "authors": ["Ishtia Zahir", "Eslam Saleh", "Maryam Rezayati", "Güunter Grabher", "Gaffar Hossain"], "published": "2026-08-14", "summary": "Textile-integrated capacitive sensors offer flexible and conformable tactile sensing for wearable electronics and human-robot interaction; however, the influence of yarn-level architecture on capacitive transduction characteristics remains insufficiently quantified. This work presents a textile capacitive sensing platform based on silver-coated yarns coated with polydimethylsiloxane and assembled into one-, two-, and four-layer twisted configurations. The influence of effective electrode overlap area and inter-fiber separation on the capacitive response is systematically investigated, enabling architecture-dependent tuning of pressure and proximity sensing characteristics. Pressure was calculated using the localized single-fiber contact area, corresponding to stresses of 0.4-3.9 MPa. Increasing the layer number improved mechanical strength and sensing performance: elongation at break increased from 37.5% to 62.5% and 85.0%, while the maximum load increased from 23.3 to 42.7 and 89.7 N. Sensitivity increased with layer number and frequency, reaching 0.1331 MPa$^{-1}$ for the four-layer sensor at 100 kHz. The four-layer configuration also exhibited low hysteresis, minimal thermal drift from 25 to 90 $^\\circ$C, and stable operation over 15,000 cycles. Proximity detection ranges of 60, 50, and 40 mm were obtained for the one-, two-, and four-layer sensors, respectively, revealing an architecture-dependent sensitivity-range trade-off. A 4$\\times$4 textile sensing array enabled spatial contact mapping, while robotic-arm integration demonstrated real-time touch and proximity detection with an end-to-end robotic system latency (from detection to robot reaction) of 403 ms. The results establish yarn architecture as a tunable design parameter governing the measurement characteristics of textile-integrated capacitive sensing systems.", "pdf_url": "https://arxiv.org/pdf/2608.14406v1"}, {"title": "Reflex: Enabling Fast and Predictive Vision-Language-Action Models for Reaction-Critical Manipulation", "authors": ["Yuxuan Chen", "Wanruo Zhang", "Xiao Li"], "published": "2026-08-14", "summary": "Vision-Language-Action (VLA) models have recently achieved promising performance in robotic manipulation. However, existing benchmarks mainly evaluate generalization on static manipulation tasks and largely overlook dynamic interaction scenarios. To address this gap, we present ReflexBench, a benchmark for reaction-critical manipulation. ReflexBench contains six dynamic tasks and introduces an evaluation framework that decouples simulator stepping from robot control while supporting configurable latency under synchronous and asynchronous inference. Building upon ReflexBench, we propose ReflexVLA, an efficient VLA model designed for reaction-critical manipulation without large-scale robot-data pretraining. ReflexVLA enhances temporal reasoning through latent future prediction and multi-frame temporal fusion within the vision backbone, while reducing deployment latency through batched visual encoding and CUDA Graph replay. Experiments show that ReflexVLA consistently improves dynamic manipulation performance while maintaining competitive accuracy on standard static manipulation benchmarks, and real-world experiments further demonstrate its effectiveness under practical deployment conditions. Project website: https://reflexvla.github.io", "pdf_url": "https://arxiv.org/pdf/2608.14379v1"}, {"title": "Catching the Imposter: Self-Supervised Learning of Physical Coherence with Cross-Entity Feature Permutations", "authors": ["Aleksei Rozanov", "Arvind Renganathan", "Vipin Kumar"], "published": "2026-08-14", "summary": "Scientific data often describe entities whose features are jointly governed by the laws of physics, yet existing self-supervised learning (SSL) objectives largely ignore this physical coherence. We introduce imposter, a discriminative pretext task that replaces subsets of an entity's features with real observations donated by another entity and trains the encoder to identify the swapped features. Because every donated value is individually plausible, the task can only be solved by learning cross-feature physical dependencies. We evaluate the proposed objectives on global ERA5-Land reanalysis data using 21 environmental variables and assess the learned representations on seven downstream tasks spanning climate classification, carbon flux estimation, and streamflow prediction. Our study includes, to our knowledge, the first systematic comparison of self-supervised objectives for land-surface modeling under a shared architecture and pre-training budget. We find that the most effective pretext task depends on the downstream task family rather than any single objective's superiority, and that imposter provides complementary information when combined with existing SSL objectives. These results suggest that physical coherence is a valuable new source of self-supervision for scientific foundation models.", "pdf_url": "https://arxiv.org/pdf/2608.14372v1"}, {"title": "Disentangled Shared Representations Improve Morpho-Transcriptomic Integration", "authors": ["Julian Ostermaier", "Swann Ruyter", "Reuben Dorent", "Daniel Racoceanu"], "published": "2026-08-14", "summary": "Spatial transcriptomics (ST) enables the simultaneous profiling of gene expression and tissue morphology, creating an opportunity to learn multimodal representations capturing shared morpho-transcriptomic structure. However, standard multimodal models often compress modalities into a common latent space without explicitly separating shared and modality-specific sources of variation, which may limit downstream utility. We investigate whether explicit disentanglement of shared and private latent components improves multimodal representation learning for paired Hematoxylin \\& Eosin (H\\&E) and ST data. We compare VAE-based and contrastive approaches, each in standard and disentangled variants, across two cancer cohorts under matched experimental conditions. Representations are evaluated using cross-modal reconstruction, downstream probing and cross-modal probe transfer. The experiments suggest two main trends. First, contrastive objectives yield higher downstream probing performance than VAE-based models. Second, disentangled variants improve the selected reconstruction and probing metrics, although the gains depend on the model family, task, direction, and disentanglement strength. Overall, our results suggest that explicitly factorizing shared and modality-specific information can improve multimodal representation learning for spatial transcriptomics and provides a useful evaluation framework for future foundation models.", "pdf_url": "https://arxiv.org/pdf/2608.14355v1"}, {"title": "CORAL: Curriculum-Optimized Reward Adaptation for LiDAR-Based Goal-Directed Urban Driving", "authors": ["Anisa Saleem", "Duksu Kim"], "published": "2026-08-14", "summary": "Reinforcement learning is promising for autonomous urban driving, but long-horizon goal-directed navigation asks a policy to acquire several competing behaviors at once--reaching a distant goal, tracking a route, avoiding obstacles, obeying signals--and a fixed objective gives no order in which to learn them. This paper presents CORAL, which advances two schedules together: a five-stage curriculum that progressively lengthens routes and tightens behavioral constraints, and a stage-aware reward whose component weights shift emphasis from mission progress toward route following, safety, smoothness, and rule compliance as the task hardens. The policy is a multi-stream actor-critic network trained with Proximal Policy Optimization (PPO) in CARLA on a compact 99-dimensional state pairing a polar LiDAR histogram with vehicle telemetry, ego-frame route geometry, and traffic-rule indicators--no point-cloud encoder, no bird's-eye-view rasterization. Against two PPO baselines under an identical protocol, CORAL reaches the goal in all twenty evaluation episodes on the longest routes under the full set of behavioral constraints, where the baselines reach 5% and 10%; a factorial ablation shows that neither schedule alone matches their combination: removing either lowers both success and route completion, and disabling both drops success to 55%. Trained in one town, the policy transfers zero-shot to seven unseen towns, succeeding in 68-98% of episodes on routes of the same 100-150 m length, with mean lateral deviation below 0.35 m.", "pdf_url": "https://arxiv.org/pdf/2608.14332v1"}, {"title": "Intern-S2-Mobius: Foundation Model with Decoupled Knowledge and Reasoning", "authors": ["Kai Chen", "Jifeng Ding", "Ning Ding", "Jiaye Ge", "Lixin Gu", "Yicheng Gu", "Qipeng Guo", "Ermo Hua", "Haian Huang", "Haozheng Hou", "Jie Hou", "Xiangyu Hong", "Che Jiang", "Minxi Jin", "Cheng Liang", "Dahua Lin", "Dawei Liu", "Kuikun Liu", "Chengqi Lv", "Haijun Lv", "Han Lv", "Ningsheng Ma", "Biqing Qi", "Jianmin Qian", "Shiya Su", "Youbang Sun", "Huanze Tang", "Zhongbo Tian", "Hanjing Wang", "Rui Wang", "Ting Wang", "Yi Wang", "Baiting Wu", "Jun Xu", "Bowen Yang", "Hui Wang", "Weida Wang", "Haochen Ye", "Jiashuo Yu", "Shan Yu", "Xiaoyi Yu", "Qirui Zeng", "Qi Zhang", "Ming Zhang", "Wenwei Zhang", "Bowen Zhou", "Xinyu Zhou"], "published": "2026-08-14", "summary": "We introduce Mobius-v0, an architecture that comprises a globally shared Memory (FFN) that stores knowledge vectors and multiple Reasoners (Self-Attn) that iteratively achieve compositional reasoning. Using hidden states as cache and carrier, reasoners repeatedly query memory for required knowledge-vectors, while the knowledge is transmitted back to reasoning operators. Through this knowledge-reasoning-separation architecture, Mobius achieves better knowledge compression and reasoning efficiency. Built upon Mobius-v0 architecture: 1) Our 7B model trained-from-scratch achieves similar downstream score as a 7B Transformer baseline with 62.6% of baseline's training data. 2) Our Intern-S2-Mobius, continually-pretrained from Qwen3.5-35B, achieves similar downstream score while delivering nearly 4x end-to-end inference speedup.", "pdf_url": "https://arxiv.org/pdf/2608.14290v1"}, {"title": "PRM-as-a-Judge 1.5: A Toolkit for Robot Process Assessment", "authors": ["Yuyang Liu", "Yanqing Shen", "Ruike Chen", "Jifan Zhao", "Yuxuan Tian", "Yichi Zhang", "Tianfeng Long", "Zixuan Yin", "Yipu Wang", "Ziheng Qin", "Wenxing Tan", "Yang Shi", "Mingyu Cao", "Runze Xiao", "Ziqi Wang", "Zhixin Yin", "Shiwei Chu", "Yi-Fan Zhang", "Yao Mu", "Yuheng Ji", "Yihao Wang", "Jun Yan", "Zhongyuan Wang", "Pengwei Wang", "Xiaolong Zheng"], "published": "2026-08-14", "summary": "Fine-grained robotic evaluation matters for understanding embodied models, going beyond binary success rates and rule-based process scores. We present PRM-as-a-Judge 1.5, a toolkit for robot process assessment that turns rollout videos into dense progress curves and derives multiple fine metrics. PRM-as-a-Judge 1.5 introduces three metrics, building on version 1.0, that characterize failure-side progress, post-drawdown recovery, and success-side execution quality, helping users understand embodied model capability. Based on the rollout videos from benchmarks, we perform a comprehensive assessment of the embodied models, providing some fine-grained metric results and key findings. We further introduce RoboPulse++ to evaluate the reliability of process reward models (PRM), providing evaluators with a more accurate testing platform. Moreover, we release a user-friendly assessment suite, including the benchmark, metric implementation, and visualization tools, to support reproducible manipulation process evaluation. We call on the community to rethink how robots are evaluated and establish transparent, procedural, and reproducible assessment as a foundation for the next generation of embodied intelligence.", "pdf_url": "https://arxiv.org/pdf/2608.14284v1"}, {"title": "Accelerating Large-scale Bundle Adjustment for LiDAR Mapping via Parallel Computing", "authors": ["Yixi Cai", "Rundong Li", "Yuhan Xie", "Qingwen Zhang", "Patric Jensfelt", "Fu Zhang"], "published": "2026-08-14", "summary": "LiDAR bundle adjustment is widely utilized in mapping to construct globally consistent point cloud maps. In this paper, we propose the first fully parallel computing framework to accelerate LiDAR bundle adjustment for large-scale mapping, incorporating three key techniques. First, we design an adaptive, asynchronous data loading strategy to efficiently process large-scale point cloud datasets on memory-constrained GPUs. Secondly, we present a novel bottom-up voxelization method for extracting planar features, enabling fully parallelized pre-processing. Thirdly, we build upon a majorization-minimization formulation to accelerate compute-intensive tasks in the optimization via parallel computation, including the computation of residuals, Jacobian and Hessian matrices, and a parallel increment solver. To support our design, we provide both theoretical and experimental analysis of the time complexity of our approach. Extensive benchmarking on large-scale public datasets across various computational platforms validates the robustness and adaptability of our approach, achieving up to a tenfold improvement in computational efficiency while preserving mapping accuracy comparable to state-of-the-art methods. To benefit future research, the implementation code is available on GitHub.", "pdf_url": "https://arxiv.org/pdf/2608.14266v1"}, {"title": "Vibration Suppression in Collaborative Flexible Payload Manipulation Using Passive Force Control", "authors": ["Alaa Abderrahim", "Antonio Rosales", "Ferdinando Milella", "Markku Suomalainen", "Shuai Li"], "published": "2026-08-14", "summary": "In large and heavy structures, vibrations arise during motion, posing significant challenges for precise manipulation. To accomplish the desired motion, control algorithms must effectively suppress these structural vibrations. In cutting edge projects, such as remote maintenance of future fusion energy reactors (tokamaks), the manipulation of this type of structure is defined as a crucial task. This paper presents a control strategy to suppress transverse vibrations in flexible payloads during motion using a collaborative payload manipulation approach. Two different industrial robot arms are arranged in a leader follower configuration for the manipulation strategy. The leader robot guides the motion with shaped velocity commands, while the follower robot ensures compliance with the estimated external forces applied by the leader on the payload through an admittance controller. Unlike existing methods, the proposed approach enables collaborative manipulation of heavier and larger flexible objects, addressing additional challenges such as vibration suppression and heterogeneous robot specifications. The dynamics of the leader follower payload system are modeled using an equivalent mass spring damper model, and it is shown that, with appropriate admittance parameters, the total energy of the system is passively dissipated. A stability proof is also provided. Numerical simulations validate the proposed method, and experimental results demonstrate its effectiveness.", "pdf_url": "https://arxiv.org/pdf/2608.14244v1"}, {"title": "Zero-Shot Skeleton-Based Action Anticipation", "authors": ["Hongsong Wang", "Pengbo Yan", "Yang Zhang", "Qiuxia Lai"], "published": "2026-08-14", "summary": "Action anticipation (AA) aims to recognize ongoing human or humanoids actions from partial observations, enabling robots to predict intentions before the actions are completed. Although skeleton-based AA offers efficiency advantages, existing approaches assume that all action classes are seen during training, which limits their deployment in real-world scenarios where novel actions inevitably arise. To address this gap, we study the new task of Zero-Shot Skeleton-Based Action Anticipation (ZS-SkAA). This task requires recognizing unseen action classes using only limited early-stage skeleton sequences, combining the challenges of partial observations, temporal dynamics, and zero-shot generalization. To establish foundational research for ZS-SkAA, we introduce:(1) A baseline model comprising a spatio-temporal feature extractor and a mutual information estimation and maximization module. This baseline model explicitly aligns partial visual features with semantic class embeddings across modalities by estimating and maximizing their mutual information, enhancing generalization to unseen classes.(2) A benchmark protocol using the NTU RGB+D dataset, which is adapted for rigorous ZS-SkAA evaluation. Experiments demonstrate the effectiveness of our model as a strong baseline for ZS-SkAA, achieving high zero-shot accuracy on NTU RGB+D. This work establishes ZS-SkAA as a vital research direction for real-world systems requiring generalization to novel actions.", "pdf_url": "https://arxiv.org/pdf/2608.14243v1"}, {"title": "A Temporal Barrier Framework for Collision Avoidance in Multi-Agent Autonomous Aerial Vehicles", "authors": ["Benedikt Barthel Sorensen", "Mitchell Black", "Erfaun Noorani", "Themistoklis Sapsis"], "published": "2026-08-14", "summary": "Operating teams of autonomous aircraft in dynamic, uncertain, and potentially adversarial environments requires safety protocols that are reliable yet selective, and allow agents to fly in close proximity while making progress toward mission objectives. We introduce adversarial time-to-collision (aTTC), a risk metric that quantifies, for a given agent, how quickly any surrounding agent could reach it assuming adversarial intent. We embed aTTC into the control barrier function (CBF) framework, defining the barrier directly in time rather than distance or velocity. The resulting aTTC-CBF is inherently anticipatory: agents modulate their own velocity based not on whether a peer is on a collision course, but on how quickly one could reach collision given its dynamical constraints. A differentiable neural-network surrogate makes the aTTC computable in real time within a standard CBF quadratic program. Across long time-horizon simulations of 3D independent-pursuit and formation-flight scenarios, the aTTC-CBF achieves up to twice the waypoint progress at half the collision rate of a higher-order distance-based CBF baseline.", "pdf_url": "https://arxiv.org/pdf/2608.14239v1"}, {"title": "Attributing Preprocessing Invariance in Spectral Foundation Models", "authors": ["Dongjun Wei", "Hongyi Wu", "Yinuo Zou"], "published": "2026-08-14", "summary": "Preprocessing invariance is an appealing goal for spectral foundation models: a frozen model should remain useful when laboratories preprocess spectra differently. It is usually measured by training a classifier under one preprocessing pipeline and testing it under another, with preserved accuracy read as evidence of learning. We revisit that reading, using a Raman foundation model as a case study. Such models normalize their inputs before any learned parameter is applied. If that normalization maps two differently preprocessed spectra to the same vector, the encoder receives identical inputs, so the invariance cannot be attributed to learning. For a normalization that uses each spectrum's own statistics, this happens exactly when one spectrum is a positive multiple of the other plus a constant. Several standard preprocessing operations take that form. The encoder should therefore be measured against the normalization alone, which has no learned parameters. On six Raman evaluation datasets, the model does not measurably outperform its own normalization. It improves on raw spectra, but so does the normalization alone. Training does improve the encoder over random initialization, and a controlled experiment shows that it learns to ignore a transformation only when that transformation reaches it. A numerical test settles which transformations a given normalization removes. Across released systems in five modalities, most normalizations already remove transformations of that form, and several of those systems claim that invariance as learned. Replicating the comparison on two of them shows no gain either.", "pdf_url": "https://arxiv.org/pdf/2608.14227v1"}, {"title": "Training Fair Tabular Foundation Models", "authors": ["Patrik Kenfack", "Jesse C. Cresswell", "Anthony L. Caterini", "Samira Ebrahimi Kahou", "Ulrich Aïvodji"], "published": "2026-08-14", "summary": "Tabular Foundation Models (TFMs) have emerged as leading methods for tabular predictive tasks, leveraging in-context learning to predict on new data without task-specific training. Despite the increased use of TFMs in high-stakes decision-making, their fairness properties remain largely unexplored. In this work, we incorporate fairness constraints directly into TFM training, enabling fair predictions in a single forward pass. Our approach addresses two key challenges: limited access to sensitive attributes in training data, and the incompatibility of existing fairness techniques with the in-context learning paradigm. We propose FairTFM, a scalable training strategy based on synthetic fairness tasks and a fairness-aware architecture using a gradient reversal layer, which encourages the model to learn representations invariant to sensitive attributes. Experiments on 132 fairness tasks show consistent improvements in fairness while maintaining competitive accuracy.", "pdf_url": "https://arxiv.org/pdf/2608.14211v1"}, {"title": "Foundation Neural Effective Hamiltonian for Strongly Correlated Quantum Materials", "authors": ["Lixing Zhang", "Hongjie Jiang", "Di Luo"], "published": "2026-08-14", "summary": "Simulating strongly correlated quantum materials often involves not a single Hamiltonian, but a family of Hamiltonians whose ground states evolve across experimentally tunable couplings. Foundation neural quantum states (FNQS) offer a promising route to amortizing many-body calculations across such families, but can lose accuracy near phase transitions and still incur non-negligible sampling costs that grow with the number of target couplings. We introduce the Foundation Neural Effective Hamiltonian (FNEH), which projects a Hamiltonian family onto a compact subspace spanned by FNQS sampled at selected couplings. By variationally combining FNQS across parameter space, FNEH systematically improves their ground-state approximation and can recover phase boundaries that the foundation model misidentifies. Once the required operator matrix elements are sampled, FNEH enables sweeps over couplings, observables, and phase boundaries at a cost governed by the small effective-Hamiltonian dimension, without repeated neural-network sampling at every target coupling. We demonstrate FNEH in strongly correlated moiré materials, where it accurately resolves competing phases, enables high-resolution multidimensional phase scans, and substantially reduces the computational cost of exploring many target Hamiltonians. The results open a new avenue for studying strongly correlated quantum materials with foundation models.", "pdf_url": "https://arxiv.org/pdf/2608.14208v1"}, {"title": "MMUSV-Sim: A Perception-Oriented Simulation and Data-Generation Platform for Multi-USV Cooperative Perception", "authors": ["Ziao Li", "Jianxiong Ye", "Biao Tang", "Leping Zhang", "Kun Zuo", "Siyu Huang", "Chenqiang Gao"], "published": "2026-08-14", "summary": "Cooperative perception among multiple unmanned surface vehicles (USVs) combines complementary observations to extend maritime target sensing beyond the view range and field of a single platform. Developing such systems at scale calls for a unified workflow for configurable multi-USV scenarios, multimodal acquisition, and shared annotations. We present MMUSV-Sim, a perception-oriented maritime simulation and data-generation platform built on Unreal Engine 5 and Project AirSim. It provides island, open-sea, and port environments; configurable weather, time of day, and wave conditions; a diverse vessel asset library; and spline-based multi-vessel motion. MMUSV-Sim acquires RGB, depth, semantic, LiDAR, and radar observations across multiple USVs and captures a common world state for per-agent annotation export. Experiments verify that the configured wave settings produce the intended changes in vessel heave, roll, and pitch, and evaluate the geometric consistency between projected annotations and semantic renderings. In LiDAR-based cooperative BEV vessel detection experiments on the generated multi-USV dataset, Early Fusion achieves an AP@0.5 of 72.74, compared with 45.54 using a single USV.", "pdf_url": "https://arxiv.org/pdf/2608.14207v1"}, {"title": "MINT: A Universal Zero-Shot Predictor for Transaction Data", "authors": ["Parameswaran Kamalaruban", "Viktor Drobnyi", "Maeve Madigan", "Julia Rozanova", "David Sutton", "Stuart Burrell"], "published": "2026-08-14", "summary": "Banks analyse sequential financial transaction data to perform many tasks, including fraud prevention, credit risk assessment and offer personalization. To improve the predictive accuracy of these tasks, Payments Foundation Models encode transaction sequence data as rich contextual embeddings, which can then be provided to task-specific models as features. However, these Foundation Models are not designed for flexible zero-shot reasoning across novel downstream prediction tasks, limiting their adaptability and utility. Existing LLM-based approaches to zero-shot prediction often fail to fully exploit the predictive signal within transaction data, while relying on costly text serialization or task-specific architectures that scale poorly. To address these limitations, we present the Multimodal Instruction Network for Transactions (MINT), a framework that connects a pretrained transaction sequence encoder to a decoder-only LLM through lightweight embedding injection, transaction-language alignment, and instruction tuning. We find that MINT achieves state-of-the-art predictive question-answering performance in both in-distribution and out-of-distribution questions, while substantially reducing input tokens, latency, and memory consumption compared to text-serialization baselines. Through comprehensive analyses of representations, alignment strategies, training data, and history length, we establish that compact transaction embeddings are a superior approach to transaction representation than text serialization for multimodal reasoning and zero-shot prediction tasks.", "pdf_url": "https://arxiv.org/pdf/2608.14198v1"}, {"title": "OccPlanner: Goal-Aware Occupancy-Conditioned Diffusion Planner for Pixel-Goal Navigation", "authors": ["Binling Huang", "Nianjin Ye", "Xi Yang", "Liang Hu", "Zhou Huang", "Shuang Wei", "Longrui Yang", "Yanchi Chen", "Lanpeng Jia"], "published": "2026-08-14", "summary": "Pixel-goal navigation specifies targets directly in the agent's camera view, but a target pixel provides neither metric depth nor traversability, making 3D goal grounding and collision-free continuous planning challenging. We present OccPlanner, a goal-aware occupancy-conditioned diffusion planner that grounds pixel goals in egocentric metric space and sequentially conditions the goal representation on temporal visual context and learned local 3D occupancy features. To provide occupancy supervision at scale, we introduce L3ROcc, which converts monocular RGB navigation videos into robot-centric local 3D occupancy annotations through geometric reconstruction and ray-based visibility reasoning. We train OccPlanner on InternData-N1 and evaluate it in closed-loop simulation across four unseen scene categories from InternScenes and two goal-distance ranges. In the 5-8 m setting, OccPlanner increases the average success rate (SR) over NavDP from 20.81% to 71.55% across the four categories, reaching 86.20% and 84.92% in cluttered-easy and cluttered-hard scenes, respectively. Real-world open-loop experiments on a Unitree Go2 further provide initial evidence of sim-to-real transfer and adaptation with L3ROcc-generated supervision.", "pdf_url": "https://arxiv.org/pdf/2608.14160v1"}, {"title": "AgilePE: Autonomous UAV Pursuit-Evasion via Self-Play Reinforcement Learning", "authors": ["Wenhao Tang", "Tianyang Chen", "Zhejun Cui", "Boyuan An", "Jiayu Chen", "Ruize Zhang", "Huidong Liu", "Tianyue Wu", "Qingmin Liao", "Fei Gao", "Yu Wang", "Chao Yu"], "published": "2026-08-14", "summary": "Autonomous pursuit-evasion is a fundamental challenge for Unmanned Aerial Vehicles (UAVs), requiring rapid decision-making under tightly coupled dynamics and continuously changing opponent behaviors. Traditional rule-based or differential-game approaches often struggle with high-dimensional aerial interactions and agile maneuvering. We present AgilePE, a complete system for autonomous UAV pursuit-evasion via self-play reinforcement learning. AgilePE integrates agile low-level control, competitive policy optimization, and sim-to-real deployment in a unified framework. The policy directly maps onboard state observations to Collective Thrust and Body Rates (CTBR) commands, enabling end-to-end agile maneuvering without intermediate trajectory planners or waypoint controllers. For training, we use competitive self-play with Prioritized Fictitious Self-Play (PFSP) and a diversified opponent pool, enabling agents to improve against historical policies while stabilizing optimization and reducing policy oscillation. This process leads to the emergence of sophisticated pursuit and evasion strategies. For real-world deployment, we develop a hardware-aligned simulation pipeline that models actuator-response dynamics, communication latency, and domain randomization. The learned policies transfer zero-shot to real quadrotors without task-specific tuning. Real-world experiments reproduce pursuit-evasion tactics observed in simulation, including rapid dodging and flanking, and demonstrate interactive two-agent zero-shot deployment.", "pdf_url": "https://arxiv.org/pdf/2608.14135v1"}, {"title": "Traj-LeWM: Path-Aware World-Model Planning via Latent Trajectory Cost", "authors": ["Xiaodi Huang", "Ziyi Ding", "Jingtian Wan", "Yuchen Liu", "Yuan Zhang", "Xiao-Ping Zhang", "Jiayu Chen", "Zhang Zhang", "Tao Huang"], "published": "2026-08-14", "summary": "LeWM is a lightweight visual world model that learns latent dynamics end-to-end from pixels and ranks candidate action sequences by the distance between their predicted endpoints and the goal. However, LeWM has two limitations. First, during training, it learns local next-step transitions without evaluating complete trajectories relative to the task goal. Second, during planning, it ranks candidates solely by predicted endpoint distance. Because model predictions may differ from actual execution outcomes, the candidate whose predicted endpoint is closest to the goal may not perform best when executed in the environment. The evolution of the complete predicted trajectory can therefore provide complementary information beyond endpoint distance. To address these limitations, we propose Traj-LeWM, which retains LeWM's local-dynamics objective and endpoint score while introducing a goal-conditioned latent trajectory cost (LTC) that aggregates trajectory-level information as a complementary signal. During training, LTC-based trajectory-preference supervision complements next-step prediction in shaping the shared representation. During planning, LTC is combined with endpoint distance to incorporate intermediate-path information into candidate ranking. With joint endpoint-plus-LTC scoring, Traj-LeWM outperforms LeWM on Push-T, OGBench-Cube, Reacher, and Two-Room by $3$, $14$, $7$, and $7$ percentage points, respectively. Controlled experiments and ablations further verify the complementary roles of trajectory-level representation shaping and path-aware candidate ranking.", "pdf_url": "https://arxiv.org/pdf/2608.14125v1"}, {"title": "Forecast Collapse in Time-Series Foundation Models", "authors": ["Shu Wan", "Miles Ma", "Hank Zhu", "Guangqi Liu", "Stephen Wang", "Qingsong Wen", "Huan Liu"], "published": "2026-08-14", "summary": "When forecasting hourly returns for 1,000 US equities, we observe an unexpected phenomenon: predictions become nearly flat and show poor stock ranking, as measured by cross-sectional correlation. We call this forecast collapse. Surprisingly, the phenomenon largely disappears when forecasting trading volume under the same setting. We investigate forecast collapse across time-series foundation models (TSFMs), twelve deep-learning forecasting models, and 97 public benchmark configurations, and find that it is closely tied to target predictability. We identify two distinct reasons behind it: low predictability limits the amplitude of calibrated point forecasts, while per-series objectives leave cross-series structure unidentified. These findings reveal a calibration-ranking tradeoff: optimizing squared error leads to flat predictions, whereas directly optimizing cross-sectional correlation improves ranking but can inflate forecast amplitude by more than an order of magnitude. To address this tradeoff, we introduce CalibRank, a simple objective that balances calibration and ranking. On Finance1K, CalibRank nearly triples cross-sectional correlation while keeping amplitude close to the target, and improves correlation on all tested models. Our results reveal a blind spot in conventional time-series evaluation: per-series metrics can hide failures in cross-series structure needed by downstream decisions.", "pdf_url": "https://arxiv.org/pdf/2608.14106v1"}, {"title": "PILOT: Privileged Imitation Learning for End-to-End Motion Planning of Autonomous UAVs under Partial Observability", "authors": ["Qingrui Zhang", "Feng Xue", "Xiang Zhou", "Chenghao Yu"], "published": "2026-08-14", "summary": "Autonomous navigation in cluttered environments is hampered by partial observability and dynamic constraints. This paper presents PILOT, a constraint-aware privileged imitation learning framework for vision-based end-to-end UAV motion planning under partial observability. The framework distills planning strategies from a computationally intensive optimal control expert into a student policy regularized toward safety and dynamic requirements via a dual-objective loss function. To mitigate partial observability, a spatiotemporal perception fusion module using a Temporal Convolutional Network (TCN) is developed to integrate historical depth images and odometry. This module infers task-relevant latent context from historical observations, enhancing spatial awareness beyond the instantaneous FOV without maintaining persistent map memory. A trajectory parameterization layer mapping network outputs to a structured trajectory, while enabling explicit continuity, dynamic-consistency, and obstacle soft penalties during training, encouraging constraint satisfaction for unseen observations without formal guarantees. Simulations on quadrotor and fixed-wing aircraft demonstrate that PILOT achieves performance comparable to the privileged expert while reducing computational overhead by over 80\\%. Successful indoor and outdoor zero-shot deployment confirms the practical feasibility and cross-domain generalization of the planner.", "pdf_url": "https://arxiv.org/pdf/2608.14082v1"}, {"title": "Model-agnostic Retrieval-Augmented Extended Forecasting for time series", "authors": ["Juan Pablo Villa Serna", "Rohan Asthana", "Vasileios Belagiannis"], "published": "2026-08-14", "summary": "Time series forecasting with pretrained foundation models has demonstrated strong zero-shot capabilities. However, achieving optimal performance on time series with short or negligible historical data in domain-specific applications typically requires adaptation via either fine-tuning or RAG. While fine-tuning is effective, it incurs substantial computational costs. This work explores RAG within univariate time series (Retrieval Augmented Generation) as a more efficient alternative, in particular RAF (Retrieval Augmented Forecasting), and introduces RAEF (Retrieval-Augmented Extended Forecasting), a model-agnostic method built upon RAF. RAEF incorporates key refinements to the retrieval and aggregation mechanisms: (1) direct retrieval in input-space rather than embedding-space, reducing inference overhead, and (2) concatenation-based aggregation that preserves temporal structure instead of averaging. Empirical evaluation across multiple benchmark datasets demonstrates that RAEF outperforms RAF in both accuracy and inference overhead. Furthermore, comprehensive comparisons with zero-shot and fine-tuned foundation models show that RAEF achieves competitive or superior performance to fine-tuning while avoiding its computational burden, establishing it as a practical and scalable approach for domain adaptation in time series forecasting.", "pdf_url": "https://arxiv.org/pdf/2608.14054v1"}, {"title": "FlatLab: A Unified Methodology Framework and Simulation-Based Benchmark for Robotic Manipulation of Flat Objects", "authors": ["Xingyu Zhu", "Wenshuo Han", "Zhouyu Wang", "Yuran Wang", "Ruihai Wu", "Hao Dong", "Fan Tang", "Hechang Chen", "Hyung Jin Chang", "Yixing Gao"], "published": "2026-08-14", "summary": "Robotic manipulation of flat objects is challenging due to the ungraspable configurations and strong variations in object geometry and material. Existing methods rely on heuristic pre-manipulation and are often evaluated in closed settings with limited generalization. We propose a unified framework that decouples the manipulation into a strategy generator and an action execution module. The strategy generator predicts appropriate manipulation strategies from object point clouds by learning strategy-centric, object-invariant representations via simulated data transformation and contrastive learning. Conditioned on the predicted strategy, the execution module decomposes long-horizon manipulation into reusable action primitives and dynamically composes them to generate stable trajectories. To enable systematic evaluation, we introduce FlatLab, a comprehensive simulation benchmark for robotic flat object manipulation. FlatLab provides high-fidelity physical simulation of diverse rigid and deformable flat objects, automated multi-modal data collection, and standardized task definitions and evaluation protocols. Experiments conducted in FlatLab demonstrate that our approach generalizes effectively to unseen objects and categories, outperforming existing baselines. The project page and the code are provided at https://flatlab-web.github.io/.", "pdf_url": "https://arxiv.org/pdf/2608.14049v1"}, {"title": "Evolve Vision-Language-Action Model into an Agent with On-the-fly Tool-use", "authors": ["Yi Ding", "Yanzhao Yu", "Xili Dai", "Xianbiao Qi", "Peiwen Sun", "Xueqian Wang", "Xiangyu Yue", "Jianan Wang"], "published": "2026-08-14", "summary": "This paper integrates end-to-end Visual-Language-Action (VLA) models with agentic tool-use to propose Agentic Robot with Tool-use (ART). ART is a tool-injection framework that tunes any VLA model to leverage off-the-shelf tool modules for low-level vision, high-level affordance, and embodiment enhancement. Compared to vanilla VLA models with a whole continuous action solution space, ART reduces the complexity of the action solution space through tool-use, which not only improves generalizability across different tasks but also reduces data dependency. To demonstrate the advantages (high generalizability and low data dependency) of this framework, we first built a dataset of 30K tool-use trajectories and action demonstrations, which is much smaller than those used by baseline methods. We then designed a training regimen for long-trajectory tool-use reasoning in challenging environments. Experiments show that ART achieves a 20% higher success rate than mainstream baselines on simulation and real-world tasks, such as pick-and-place in the dark at novel viewpoints. Empirical results highlight the benefits of an agent-based approach: modular tool utilization enables more efficient training, lightweight deployment, and scalable integration of new tools. This design fosters robustness, adaptability, and extensibility, paving the way for the practical deployment of VLA systems in complex real-world scenarios.", "pdf_url": "https://arxiv.org/pdf/2608.14047v1"}, {"title": "Demonstration of Space Robot Teleoperation over a Lossy and Delayed Network using ATMOS", "authors": ["Inkyu Jang", "Gregorio Marchesini", "Nicola De Carli", "Byeongjun Kim", "Sunwoo Hwang", "Dabin Kim", "Elias Krantz", "Youngkyoung Kong", "Frank J. Jiang", "Annika Wong", "Pedro Roque", "Prasetyo W. L. Sanjaya", "Nicola Bastianello", "Mani H. Dhullipalla", "Karl H. Johansson", "Hyungbo Shim", "Dimos V. Dimarogonas", "H. Jin Kim"], "published": "2026-08-14", "summary": "We present a demonstration showcasing the Autonomy Testbed for Multi-purpose Orbiting Systems (ATMOS), a planar spacecraft-analog robot designed for hardware-in-the-loop evaluation of guidance and control strategies in microgravity-like conditions. Using ATMOS as the physical test platform, we investigate the design, analysis, and performance evaluation of control architectures for remotely operated spacecraft under round-trip communication delays. In this work, we develop and experimentally validate a control strategy that combines state prediction and trajectory tracking control to perform a docking maneuver, accounting for time-varying random communication latency between ground operators and the ATMOS system. The demonstration includes a long-distance remote control experiment between Seoul and Stockholm, introducing realistic intercontinental delays and variability. The results highlight the capability of ATMOS to support rapid, reliable, and cost-effective testing of spacecraft teleoperation concepts, establishing a first step toward robust validation of on-orbit operations in microgravity-like environments.", "pdf_url": "https://arxiv.org/pdf/2608.14031v1"}], "repos": [{"repo": "NVIDIA/skills", "stars": 2981, "language": "Python", "description": "Agent Skills for NVIDIA products — install into Claude Code, Codex, and other coding agents to run Physical AI, robotics, simulation, CUDA, and RAG workflows end to end.", "url": "https://github.com/NVIDIA/skills", "date": "2026-08-17", "topic": "physical-ai", "score": 1192.5}, {"repo": "Edgenesis/shifu", "stars": 1431, "language": "Go", "description": "Kubernetes-native IoT gateway", "url": "https://github.com/Edgenesis/shifu", "date": "2026-08-17", "topic": "physical-ai", "score": 572.5}, {"repo": "commaa
