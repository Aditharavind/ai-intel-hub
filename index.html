es mechanical stress — like pulling or squeezing shape memory alloys such as [&#8230;]<\/p>\n<p>The post <a href=\"https://www.electronicsweekly.com/news/business/elastocaloric-cooling-could-replace-aircon-2026-08/\">Elastocaloric cooling could replace aircon<\/a> appeared first on <a href=\"https://www.electronicsweekly.com\">Electronics Weekly<\/a>.<\/p>"}, {"title": "A solid H1 for China chips", "source": "Electronics Weekly", "date": "2026-08-31", "url": "https://www.electronicsweekly.com/news/business/a-solid-h1-for-china-chips-2026-08/", "summary": "<p>Chinese chip companies which had reported Q2 results by last Thursday showed a 12.8% rise in H1 revenue y-o-y with a 99% rise in profit, according to China’s National Development [&#8230;]<\/p>\n<p>The post <a href=\"https://www.electronicsweekly.com/news/business/a-solid-h1-for-china-chips-2026-08/\">A solid H1 for China chips<\/a> appeared first on <a href=\"https://www.electronicsweekly.com\">Electronics Weekly<\/a>.<\/p>"}, {"title": "Teledyne imager in Meteosat gen3 satellite", "source": "Electronics Weekly", "date": "2026-08-31", "url": "https://www.electronicsweekly.com/news/business/teledyne-imager-in-meteosat-gen3-satellite-2026-08/", "summary": "<p>Teledyne Space Imaging has announced the successful launch of the Meteosat Third Generation Imager-2 (MTG-I2) satellite, which carries a Teledyne Space Imaging CIS111 detector within its Flexible Combined Imager (FCI) [&#8230;]<\/p>\n<p>The post <a href=\"https://www.electronicsweekly.com/news/business/teledyne-imager-in-meteosat-gen3-satellite-2026-08/\">Teledyne imager in Meteosat gen3 satellite<\/a> appeared first on <a href=\"https://www.electronicsweekly.com\">Electronics Weekly<\/a>.<\/p>"}, {"title": "Ed Spots A Space-Based Datacentre Gig", "source": "Electronics Weekly", "date": "2026-08-31", "url": "https://www.electronicsweekly.com/blogs/mannerisms/ed-the-serial-ceo/ed-spots-a-space-based-datacentre-gig-2026-08/", "summary": "<p>Space-based datacentres are one of the many NBTs these days and I’ve stumbled across a goldmine approach to this. A major cost in launching these datacentre satellites is the weight [&#8230;]<\/p>\n<p>The post <a href=\"https://www.electronicsweekly.com/blogs/mannerisms/ed-the-serial-ceo/ed-spots-a-space-based-datacentre-gig-2026-08/\">Ed Spots A Space-Based Datacentre Gig<\/a> appeared first on <a href=\"https://www.electronicsweekly.com\">Electronics Weekly<\/a>.<\/p>"}, {"title": "An NFC energy-harvesting PCB business card with a microcontroller", "source": "Adafruit", "date": "2026-08-31", "url": "https://blog.adafruit.com/2026/08/31/an-nfc-energy-harvesting-pcb-business-card-with-a-microcontroller/", "summary": "Wilson Harper set out to learn KiCad and ended up with a battery-free PCB business card that lights up 21 LEDs when tapped against a phone, powered entirely by harvested NFC energy. The card pairs an NXP NTAG I2C Plus, which routes excess DC voltage out to external hardware, with a 3mm x 3mm ATtiny816 [&#8230;]"}, {"title": "ESP32-WROOM-32 Pinout: GPIOs, strapping pins, ADC", "source": "Adafruit", "date": "2026-08-31", "url": "https://blog.adafruit.com/2026/08/31/esp32-wroom-32-pinout-gpios-strapping-pins-adc/", "summary": "Picking the wrong GPIO on an ESP32 can turn a perfectly good project into a board that refuses to boot, and figuring out which pins are safe usually means digging through datasheets and forum posts. ESP32 Pinout Studio is a free interactive pinout reference covering the whole ESP32 family, and it puts each pin&#8217;s real-world [&#8230;]"}, {"title": "Ben Eater’s Digital Clock", "source": "Adafruit", "date": "2026-08-31", "url": "https://blog.adafruit.com/2026/08/31/ben-eaters-digital-clock/", "summary": "Bust out the breadboards because Ben Eater is showing you how to build a really cool digital clock."}, {"title": "UPDATED GUIDE: Adafruit MAX98357 I2S Class-D Amps – Stereo and Mono #AdafruitLearningSystem @Adafruit", "source": "Adafruit", "date": "2026-08-31", "url": "https://blog.adafruit.com/2026/08/31/updated-guide-adafruit-max98357-i2s-class-d-amps-stereo-and-mono-adafruitlearningsystem-adafruit/", "summary": "The Adafruit MAX98357 I2S Class-D Amps &#8211; Stereo and Mono guide has been updated with information about the new Adafruit Stereo I2S 3W Amplifier Breakout &#8211; Dual MAX98357A breakout. The same drivers and examples can be used with this board for all of your I2S audio output needs &#8211; now in stereo! Read more at [&#8230;]"}, {"title": "Talk To the Playaphone #BurningMan2026 #AxisMundi", "source": "Adafruit", "date": "2026-08-31", "url": "https://blog.adafruit.com/2026/08/31/talk-to-the-playaphone-burningman2026-axismundi/", "summary": "&#160; Dial into Burning Man with this phone booth on the Playa. The Playa Phone sends and receives calls and Burning Man runs till the 7th, so still time to get chatting. Via Reddit: My phone booth is on playa again this year at 3:30 and C at the Temple of the Flying Spaghetti Monster. [&#8230;]"}, {"title": "The Python on Microcontrollers Newsletter: subscribe for free", "source": "Adafruit", "date": "2026-08-31", "url": "https://blog.adafruit.com/2026/08/31/the-python-on-microcontrollers-newsletter-subscribe-for-free-8-31/", "summary": "The Python for Microcontrollers Newsletter is the place for the latest news involving Python on hardware (microcontrollers AND single board computers like Raspberry Pi). This ad-free, spam-free weekly email is filled with CircuitPython, MicroPython, and Python information that you may have missed, all in one place! You get a summary of all the software, events, projects, and the latest hardware worldwide once a week, no [&#8230;]"}, {"title": "CircuitPython 10.3.0 Released!", "source": "Adafruit", "date": "2026-08-31", "url": "https://blog.adafruit.com/2026/08/31/circuitpython-1030-released/", "summary": "From the GitHub release page: This is CircuitPython 10.3.0, a minor revision of CircuitPython, and is a new stable release. Notable additions, changes, and fixes in 10.3.0 from 10.2.1 Gaming and Display picogame game engine module, a performant game-oriented alternative to displayio. E-ink display quality improvements, including on MagTag 2025. Audio audio.AudioOut, using DAC, now [&#8230;]"}, {"title": "A history of Matrox graphics cards", "source": "Adafruit", "date": "2026-08-31", "url": "https://blog.adafruit.com/2026/08/31/a-history-of-matrox-graphics-cards/", "summary": "Bradford Morgan White&#8217;s latest company history at Abort Retry Fail covers Matrox, and it&#8217;s a good one for anyone who remembers shopping for a video card in the 1990s. Lorne Trottier and Branko Matić founded the company in Dorval, Quebec in 1976. Trottier was running it out of his family home with a second phone [&#8230;]"}, {"title": "GentleOS/32 is a hobby OS for vintage PCs with a retro-style GUI", "source": "Adafruit", "date": "2026-08-31", "url": "https://blog.adafruit.com/2026/08/31/gentleos-32-is-a-hobby-os-for-vintage-pcs-with-a-retro-style-gui/", "summary": "GentleOS/32 is a nostalgic hobby OS for vintage 32-bit PCs with a retro-style GUI, a handful of built-in apps, and a selection of classic games. Its minimal requirements are an i386 CPU with 640KB of RAM, a mouse, and a VGA display supporting 640x480x16 mode. It&#8217;s built specifically for tinkering with old hardware on the [&#8230;]"}, {"title": "tmp.0ut Issue 5 is out", "source": "Adafruit", "date": "2026-08-31", "url": "https://blog.adafruit.com/2026/08/31/tmp-0ut-issue-5-is-out/", "summary": "The binary-research zine tmp.0ut dropped its fifth issue on August 23 with 21 articles on ELF internals, x86-64, and low-level Linux, wrapped in the ANSI art the zine is known for. Contributors include elfmaster, netspooky, dominikr, febnug, and TMZ, with a mixtape closing things out as usual. The piece with the broadest appeal is an [&#8230;]"}, {"title": "Bringing Sierra Adventures to the Commodore 64", "source": "Adafruit", "date": "2026-08-31", "url": "https://blog.adafruit.com/2026/08/31/bringing-sierra-adventures-to-the-commodore-64/", "summary": "Mean Hamster Software announced AGI-64, a long-awaited AGI interpreter for the Commodore 64. It is currently around 75% complete for Space Quest 1, which is completely playable now, and the engine aims to support most AGI games of the era. The interpreter is in testing and already supports most standard AGI operations. AGI-64 will be [&#8230;]"}, {"title": "RISC-V is now officially supported by CPython", "source": "Adafruit", "date": "2026-08-31", "url": "https://blog.adafruit.com/2026/08/31/risc-v-is-now-officially-supported-by-cpython/", "summary": "Over the last few months, Stan Ulbrych has been working on improving CPython’s support for the RISC-V architecture. I’m thrilled to announce that RISC-V is now officially supported by CPython as a tier 3 platform! RISC-V support in CPython has developed over time with people testing on real hardware, fixing architecture-specific issues, improving build support, reporting [&#8230;]"}, {"title": "Fujitsu establishes cyber defense lifecycle strategy for AI era", "source": "EE Journal", "date": "2026-08-31", "url": "https://www.eejournal.com/industry_news/fujitsu-establishes-cyber-defense-lifecycle-strategy-for-ai-era/", "summary": "Fujitsu Limited today announced the establishment of a cybersecurity strategy to continuously evolve corporate cyber defense capabilities in response to the advancement of generative AI and the increasing complexity of enterprise systems. This strategy implements cybersecurity not merely as an operational measure after IT system construction, but as a cyber defense lifecycle that encompasses strategic &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/fujitsu-establishes-cyber-defense-lifecycle-strategy-for-ai-era/\">Read More &#8594;<span class=\"screen-reader-text\"> \"Fujitsu establishes cyber defense lifecycle strategy for AI era\"<\/span><\/a>"}, {"title": "Syslogic Announces New AI-Enabled Embedded Computers", "source": "EE Journal", "date": "2026-08-31", "url": "https://www.eejournal.com/industry_news/syslogic-announces-new-ai-enabled-embedded-computers/", "summary": "With the Jetson Orin Nano 2, NVIDIA is introducing the second generation of its compact edge AI module. The new SoM (system-on-module) delivers twice the inference performance of its predecessor while consuming 40 percent less power at the same performance level. Embedded computing specialist Syslogic is announcing several rugged embedded computers based on the Jetson &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/syslogic-announces-new-ai-enabled-embedded-computers/\">Read More &#8594;<span class=\"screen-reader-text\"> \"Syslogic Announces New AI-Enabled Embedded Computers\"<\/span><\/a>"}, {"title": "Aetina Launches MegaEdge AIP-RQ87 2U Edge AI System for Private LLMs, AI Agents and Intelligent Automation", "source": "EE Journal", "date": "2026-08-31", "url": "https://www.eejournal.com/industry_news/aetina-launches-megaedge-aip-rq87-2u-edge-ai-system-for-private-llms-ai-agents-and-intelligent-automation/", "summary": "Aetina Corporation, a leading provider of edge AI solutions and accelerator of edge AI infrastructure, today announced the launch of MegaEdge AIP-RQ87, a ready-to-deploy 2U edge agentic AI system designed to help enterprises and system integrators (SIs) rapidly implement AI agent, private LLM, RAG application, multimodal AI, and AI-driven intelligent automation. Powered by Intel® Core™ &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/aetina-launches-megaedge-aip-rq87-2u-edge-ai-system-for-private-llms-ai-agents-and-intelligent-automation/\">Read More &#8594;<span class=\"screen-reader-text\"> \"Aetina Launches MegaEdge AIP-RQ87 2U Edge AI System for Private LLMs, AI Agents and Intelligent Automation\"<\/span><\/a>"}, {"title": "Renesas Establishes Physical AI & Robotics Lab in Beijing to Accelerate Next-Generation Robotics Innovation", "source": "EE Journal", "date": "2026-08-31", "url": "https://www.eejournal.com/industry_news/renesas-establishes-physical-ai-robotics-lab-in-beijing-to-accelerate-next-generation-robotics-innovation/", "summary": "Renesas Electronics Corporation (TSE: 6723), a premier supplier of advanced semiconductor solutions, today announced the official opening of its Physical AI &#38; Robotics Lab in Beijing, China. The new dedicated facility will enable customers to demonstrate, validate and jointly develop next-generation robotic systems and serve as a hub for executing Renesas’ physical AI strategy from proof-of-concept to deployment at scale. &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/renesas-establishes-physical-ai-robotics-lab-in-beijing-to-accelerate-next-generation-robotics-innovation/\">Read More &#8594;<span class=\"screen-reader-text\"> \"Renesas Establishes Physical AI &#038; Robotics Lab in Beijing to Accelerate Next-Generation Robotics Innovation\"<\/span><\/a>"}, {"title": "AIR Partners with Elmo Motion Control to Enhance Uncrewed Cargo Aircraft Platform", "source": "EE Journal", "date": "2026-08-31", "url": "https://www.eejournal.com/industry_news/air-partners-with-elmo-motion-control-to-enhance-uncrewed-cargo-aircraft-platform/", "summary": "AIR, the leading manufacturer and developer of Smart Aircraft, today announced a strategic partnership with Elmo Motion Control (Elmo), a global leader in motion control technology. Elmo will integrate high-performance motion control solution into AIR’s Heavy Lift UAS – a VTOL-capable uncrewed cargo aircraft capable of 550lb payloads. The partnership brings together Elmo’s compact, high-power density servo &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/air-partners-with-elmo-motion-control-to-enhance-uncrewed-cargo-aircraft-platform/\">Read More &#8594;<span class=\"screen-reader-text\"> \"AIR Partners with Elmo Motion Control to Enhance Uncrewed Cargo Aircraft Platform\"<\/span><\/a>"}, {"title": "Radxa Linkr – A USB drive-sized IP KVM with USB-C, Ethernet, and WiFi support", "source": "CNX Software", "date": "2026-08-30", "url": "https://www.cnx-software.com/2026/08/30/radxa-linkr-a-usb-drive-sized-ip-kvm-with-usb-c-ethernet-and-wifi-support/", "summary": "<div><img alt=\"Radxa Linkr IP KVM\" class=\"attachment-medium size-medium wp-post-image\" height=\"424\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/08/Radxa-Linkr-IP-KVM-720x424.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Radxa Linkr is a compact, USB flash drive-sized IP KVM that connects to the target through HDMI and USB for video, keyboard, and mouse emulation. The user can control it over USB-C, Ethernet, or WiFi client/access point, even before the OS is booted. The device does not require any specific apps, since all you need is a web browser. The company also highlights support for Tailscale VPN, two-factor authentication, and  AI agents such as OpenClaw and Hermes. Radxa Linkr specifications: SoC – Rockchip RV1106G3 CPU – Arm Cortex A7 @ 1.2GHz with an integrated RISC-V co-processor. NPU – 1 TOPS 4th-gen Rockchip NPU with hybrid quantization (int4, int8, int16) ISP – 3rd-gen 5MP high-performance ISP VPU – 3072×1728 (5MP) @ 30fps H.265/H.264 encoding, 16MP @ 60FPS JPEG snapshot System Memory –  256MB DDR3L on-chip memory Storage for OS and virtual media images Optional 16 GB eMMC flash MicroSD card slot Display Input &#8211; [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/08/30/radxa-linkr-a-usb-drive-sized-ip-kvm-with-usb-c-ethernet-and-wifi-support/\">Radxa Linkr &#8211; A USB drive-sized IP KVM with USB-C, Ethernet, and WiFi support<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "ACEMAGIC Kron Mini K5 (Core 3 304) review – Part 1: Specifications, unboxing, teardown, and first boot", "source": "CNX Software", "date": "2026-08-29", "url": "https://www.cnx-software.com/2026/08/29/acemagic-kron-mini-k5-core-3-304-review-part-1-specifications-unboxing-teardown-and-first-boot/", "summary": "<div><img alt=\"ACEMAGIC Kron Mini K5 Intel Core 3 304 unboxing review\" class=\"attachment-medium size-medium wp-post-image\" height=\"479\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/08/ACEMAGIC-Kron-Mini-K5-Intel-Core-3-304-unboxing-review-720x479.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>ACEMAGIC sent us a sample of the Kron Mini K5 Wildcat Lake mini PC for review. The computer is offered with either an Intel Core 3 304 or Core 5 320 CPU, and features triple display output, 2.5GbE and WiFi 6 networking, and several USB ports, but, interestingly, no Thunderbolt/USB4 ports. The company provided us with the entry-level variant pairing an Intel Core 3 304 penta-core processor with 12GB of RAM and 512GB of storage. In this first part of the review, we&#8217;ll list the mini PC&#8217;s specifications, go through an unboxing and a teardown, before booting it into Windows 11. In the next parts, we&#8217;ll review it using Windows 11 and Ubuntu 26.04 in depth with feature testing and benchmarks. ACEMAGIC Kron Mini K5 (Intel Core 3 304) specifications The company hasn&#8217;t put up a product page for this exact model just yet, so we gathered specifications from our [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/08/29/acemagic-kron-mini-k5-core-3-304-review-part-1-specifications-unboxing-teardown-and-first-boot/\">ACEMAGIC Kron Mini K5 (Core 3 304) review &#8211; Part 1: Specifications, unboxing, teardown, and first boot<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Fanless AMD Ryzen Embedded 8840U/8640U Edge AI Computer supports up to 256GB DDR5 SO-DIMM memory", "source": "CNX Software", "date": "2026-08-28", "url": "https://www.cnx-software.com/2026/08/28/fanless-amd-ryzen-embedded-8840u-8640u-edge-ai-computer-supports-up-to-256gb-ddr5-so-dimm-memory/", "summary": "<div><img alt=\"Fanless AMD Ryzen Embedded 8000 Edge AI computer\" class=\"attachment-medium size-medium wp-post-image\" height=\"433\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/08/Fanless-AMD-Ryzen-Embedded-8000-Edge-AI-computer-720x433.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>IBASE AA400-N is an &#8220;ultra-compact&#8221; fanless edge AI computer powered by an AMD Ryzen Embedded 8840U/8640U processor with up to 8 cores, 16 threads, and a combined 39 TOPS of AI performance for machine and robotic vision, autonomous inspection, smart retail, industrial automation, and other data-intensive, space-constrained applications. The most intriguing part of the specs and announcement is the claim of up to 256GB DDR5 capacity through two SO-DIMM modules, implying availability of 128GB DDR5 SO-DIMM memory modules. The system also comes with a 256GB M.2 NVMe SSD, features 8K-capable HDMI and DisplayPort video interfaces, two 2.5GbE jacks, M.2 sockets for optional WiFi, Bluetooth and 4G/5G cellular connectivity, a few USB ports and a COM port. &#160; IBASE AA400-N specifications: AMD Ryzen Embedded 8000 Series processors AA400-NM  – AMD Ryzen Embedded 8840U CPU – 8-core/16-thread Zen4 &#8220;Hawk Point&#8221; processor up to 3.3 GHz / 5.1 GHz (Turbo) GPU – AMD [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/08/28/fanless-amd-ryzen-embedded-8840u-8640u-edge-ai-computer-supports-up-to-256gb-ddr5-so-dimm-memory/\">Fanless AMD Ryzen Embedded 8840U/8640U Edge AI Computer supports up to 256GB DDR5 SO-DIMM memory<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Spark Solder one-handed USB-C soldering iron supports TS100 tips, integrates solder feeder (Crowdfunding)", "source": "CNX Software", "date": "2026-08-28", "url": "https://www.cnx-software.com/2026/08/28/spark-solder-one-handed-usb-c-soldering-iron-ts100-tips-automated-solder-feeder/", "summary": "<div><img alt=\"Spark Solder one handed soldering iron\" class=\"attachment-medium size-medium wp-post-image\" height=\"480\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/08/Spark-Solder-one-handed-soldering-iron-720x480.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Spark Solder is a compact, USB-C-powered one-handed soldering iron with a built-in motorized solder feeder for convenient one-handed operation. It supports standard TS100 tips, delivers up to 45W of heating power, and features a 1-inch LCD for adjusting the temperature and solder feed speed. While smart, portable soldering irons are very common these days, using one can still be tricky when you have to handle the iron, solder wire, and components at the same time. Spark Solder solves this by adding a replaceable solder capsule and a two-axis motorized feeding system to the handle, leaving one hand free for easier assembly, prototyping, and repairs. Spark Solder specifications: Display – 1-inch TFT display for adjusting temperature, solder extrusion speed, and tip profiles Soldering Power output – Up to 45W Temperature Range – 200°C to 450°C Heat-Up Time – Reaches 300°C in 6 seconds Temperature Stability – ±2°C (via PID control) Tip [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/08/28/spark-solder-one-handed-usb-c-soldering-iron-ts100-tips-automated-solder-feeder/\">Spark Solder one-handed USB-C soldering iron supports TS100 tips, integrates solder feeder (Crowdfunding)<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Microduck – A duck-like biped robot designed for physical AI experimentation and fun", "source": "CNX Software", "date": "2026-08-28", "url": "https://www.cnx-software.com/2026/08/28/microduck-a-duck-like-biped-robot-designed-for-physical-ai-experimentation-and-fun/", "summary": "<div><img alt=\"Microduck\" class=\"attachment-medium size-medium wp-post-image\" height=\"388\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/08/Microduck-720x388.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Pollen Robotics and Hugging Face have unveiled the Microduck, a 25 cm tall biped robot with 15 motors, a camera, a depth sensor, two motion sensors, and an articulated beak that can pick up objects. This follows the launch of the Reachy Mini desktop robot earlier this year that featured a Raspberry Pi CM4 module or could interface to a computer instead. In some ways, we may think of the Microduck as a Reachy Mini with legs, but the company says both are different products. The Reachy Mini targets human-robot interaction, while the Microduck focuses on motion/action, although it also features a microphone and a speaker for audio interaction. Microduck specifications: SoC – Rockchip RK3566 CPU – Quad-core Cortex-A55 processor @ up to 1.8 GHz GPU – Arm Mali-G52 NPU – 0.8 TOPS AI accelerator VPU 4Kp60 H.265/H.264/VP9 video decoder 1080p60 H.264/H.265 video encoder System Memory – 1GB RAM Storage [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/08/28/microduck-a-duck-like-biped-robot-designed-for-physical-ai-experimentation-and-fun/\">Microduck &#8211; A duck-like biped robot designed for physical AI experimentation and fun<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Embedded Systems Runtime Observability, Sensor Fusion for Drones, Embedded Design for Mil/Aero: Embedded Week Insights", "source": "Embedded.com", "date": "2026-08-28", "url": "https://www.embedded.com/embedded-systems-runtime-observability-sensor-fusion-for-drones-embedded-design-for-mil-aero-embedded-week-insights/", "summary": "<p>Here's a roundup of this week's must-read articles. We cover the latest developments on why embedded teams require runtime observability, sensor fusion for drones, and embedded systems design for aerospace and defense. Also, check News Archives - Embedded and Technical Articles Archives - Embedded for the complete list of news and articles from our website. NEWS RAIN Alliance Launches [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/embedded-systems-runtime-observability-sensor-fusion-for-drones-embedded-design-for-mil-aero-embedded-week-insights/\">Embedded Systems Runtime Observability, Sensor Fusion for Drones, Embedded Design for Mil/Aero: Embedded Week Insights<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "Seco Introduces SMARC Module for Industrial Edge AI", "source": "Embedded.com", "date": "2026-08-28", "url": "https://www.embedded.com/seco-introduces-smarc-module-for-industrial-edge-ai/", "summary": "<p>Seco has announced the SOM-SMARC-Dragonwing-IQ8, a SMARC Rel. 2.1.1 system-on-module (SOM) designed to help OEMs transition from Arduino-based prototyping to production-oriented industrial edge AI systems. Early hardware samples are available to select customers and partners for evaluation of AI-enabled robotics, smart machines, industrial vision, human-machine interfaces (HMIs), and machine-control applications. The module is based on [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/seco-introduces-smarc-module-for-industrial-edge-ai/\">Seco Introduces SMARC Module for Industrial Edge AI<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "Earth Observation satellite market develops to $155.9bn by 2035", "source": "Electronics Weekly", "date": "2026-08-28", "url": "https://www.electronicsweekly.com/news/business/earth-observation-satellite-market-develops-to-155-9bn-by-2035-2026-08/", "summary": "<p>Novaspace, the space consulting and market intelligence firm, has released the 19th edition of its Earth Observation Satellite Systems report. This covers Earth observation (EO) satellite supply and demand, and [&#8230;]<\/p>\n<p>The post <a href=\"https://www.electronicsweekly.com/news/business/earth-observation-satellite-market-develops-to-155-9bn-by-2035-2026-08/\">Earth Observation satellite market develops to $155.9bn by 2035<\/a> appeared first on <a href=\"https://www.electronicsweekly.com\">Electronics Weekly<\/a>.<\/p>"}, {"title": "FSP Launches Next-Gen 3200W CRPS Power Solutions to Fully Power AI Edge and Next-Generation Data Centers", "source": "EE Journal", "date": "2026-08-28", "url": "https://www.eejournal.com/industry_news/fsp-launches-next-gen-3200w-crps-power-solutions-to-fully-power-ai-edge-and-next-generation-data-centers/", "summary": "FSP Group, a global leading power supply manufacturer, leverages its deep R&#38;D capabilities and forward-looking insights into computing architectures to announce two new 3200W Common Redundant Power Supply (CRPS) modules: the FSP3200-20HM (12V output) and FSP3200-21HE (54V output). Designed specifically for next-generation data centers, edge AI servers, and high-density workstations, FSP&#8217;s dual-voltage architecture (12V &#38; &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/fsp-launches-next-gen-3200w-crps-power-solutions-to-fully-power-ai-edge-and-next-generation-data-centers/\">Read More &#8594;<span class=\"screen-reader-text\"> \"FSP Launches Next-Gen 3200W CRPS Power Solutions to Fully Power AI Edge and Next-Generation Data Centers\"<\/span><\/a>"}, {"title": "OMC introduces new high-performance laboratory-grade polish finish for its industrial fibre optic cables", "source": "EE Journal", "date": "2026-08-28", "url": "https://www.eejournal.com/industry_news/omc-introduces-new-high-performance-laboratory-grade-polish-finish-for-its-industrial-fibre-optic-cables/", "summary": "OMC, a pioneer in optoelectronics design &#38; manufacture, has introduced a new ultra-performance laboratory-grade polish finish for its industrial fibre optic cables and datalinks, designed to serve the most demanding applications. The use of a combination of highly skilled human operators and custom-trained, calibrated and tooled cobots has enabled a new, unprecedented quality of finish to be &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/omc-introduces-new-high-performance-laboratory-grade-polish-finish-for-its-industrial-fibre-optic-cables/\">Read More &#8594;<span class=\"screen-reader-text\"> \"OMC introduces new high-performance laboratory-grade polish finish for its industrial fibre optic cables\"<\/span><\/a>"}, {"title": "STL takes a major leap towards Decarbonisation; enabling Eco-friendly product portfolio by transitioning to 100% ‘Green power’", "source": "EE Journal", "date": "2026-08-28", "url": "https://www.eejournal.com/industry_news/stl-takes-a-major-leap-towards-decarbonisation-enabling-eco-friendly-product-portfolio-by-transitioning-to-100-green-power/", "summary": "Reduction of ~80% carbon emission for G.657.A2 Fibre to 0.9 Kg from 4.7Kg Transition of key manufacturing facilities in India to 100% ‘Green Power’ energy source Shift to 100% Green Hydrogen manufacturing in India  STL [NSE: STLTECH], a leading connectivity solutions provider for AI-ready digital infrastructure, today announced significant progress on its journey towards decarbonisation and its Net-Zero ambitions. Transitioning to 100% Green Power &#8211; STL, recently, has moved &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/stl-takes-a-major-leap-towards-decarbonisation-enabling-eco-friendly-product-portfolio-by-transitioning-to-100-green-power/\">Read More &#8594;<span class=\"screen-reader-text\"> \"STL takes a major leap towards Decarbonisation; enabling Eco-friendly product portfolio by transitioning to 100% ‘Green power’\"<\/span><\/a>"}, {"title": "From Lab to Battlefield: Navigating Hardware, TRLs, and the Edge in Defense", "source": "EE Journal", "date": "2026-08-28", "url": "https://www.eejournal.com/fish_fry/from-lab-to-battlefield-navigating-hardware-trls-and-the-edge-in-defense/", "summary": "<img alt=\"\" class=\"webfeedsFeaturedVisual wp-post-image\" height=\"300\" src=\"https://www.eejournal.com/wp-content/uploads/2026/08/AD-082826-300x300.jpg\" style=\"display: block; margin-bottom: 5px; clear: both;\" width=\"300\" />My podcast guest this week is David Jedynak, Vice President of Strategic Planning at Curtiss-Wright Defense Solutions. David and I chat about the complexities of &#8220;New Defense&#8221; innovation and what founders must understand about translating tech to the tactical environment. We also examine the similarities and differences between the defense sector and the tech industry &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/fish_fry/from-lab-to-battlefield-navigating-hardware-trls-and-the-edge-in-defense/\">Read More &#8594;<span class=\"screen-reader-text\"> \"From Lab to Battlefield: Navigating Hardware, TRLs, and the Edge in Defense\"<\/span><\/a>"}, {"title": "USB-C Deskradar – An ESP32-C3 ADS-B flight tracker with a 1.28-inch round display", "source": "CNX Software", "date": "2026-08-27", "url": "https://www.cnx-software.com/2026/08/27/usb-c-deskradar-an-esp32-c3-ads-b-flight-tracker-with-a-1-28-inch-round-display/", "summary": "<div><img alt=\"USB C Deskradar, Live ADS B Flight Tracker\" class=\"attachment-medium size-medium wp-post-image\" height=\"480\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/08/USB-C-Deskradar-Live-ADS-B-Flight-Tracker-720x480.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>The USB-C Deskradar is an ESP32-C3-based, aviation-themed ADS-B flight tracker that tracks and displays live aircraft positions around your location on a sonar-style circular grid. A 1.28-inch round display and a 3D-printed enclosure provide a real-time view of flights around a configured location. As we&#8217;ll see further below, it appears to be an open-source project that was picked up by Chinese vendors and started popping up on AliExpress as an inexpensive desk gadget. USB-C Deskradar specifications: Wireless module –16-pin ESP32-C3 Super Mini module SoC – Espressif Systems ESP32-C3FH4, single-core 32-bit RISC-V microcontroller @ up to 160 MHz; 400 KB SRAM; 4MB flash USB – USB Type-C port for programming Ceramic antenna Display – 1.28-inch round TFT color LCD with GC9A01 controller; 240×240 resolution; driven via SPI Misc Hardware button (connected to GPIO 9 / BOOT pin, active LOW) Short tap – Cycles radar range presets (e.g., 5, 10, 15, 25 [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/08/27/usb-c-deskradar-an-esp32-c3-ads-b-flight-tracker-with-a-1-28-inch-round-display/\">USB-C Deskradar &#8211; An ESP32-C3 ADS-B flight tracker with a 1.28-inch round display<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Opener is an open-source reference implementation of the DECT NR+ massive IoT, low-latency standard", "source": "CNX Software", "date": "2026-08-27", "url": "https://www.cnx-software.com/2026/08/27/opener-open-source-reference-implementation-of-the-dect-nr-massive-iot-standard/", "summary": "<div><img alt=\"Opener open-source DECT NR+ implementation\" class=\"attachment-medium size-medium wp-post-image\" height=\"342\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/08/Opener-open-source-DECT-NR-implementation-720x342.png\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Opener is an open-source reference implementation of the DECT NR+ protocol stack, formally known as DECT-2020 NR, used for massive IoT (mMTC) and low-latency (URLLC) machine-to-machine communication applications. It is developed by the Opener Initiative, supported by the OpenDECT-X project, and funded by the German Federal Ministry of Research, Technology and Space (BMFTR). The standard itself supports up to one million devices per km², years of battery life for low-power sensors,  non-IP and IPv6 traffic, mesh networking, and random-access operation. It is also designed for ultra-reliable low-latency communications (URLLC) with sub-millisecond air-interface latency, a 99.999% reliability target, and scheduled access for bounded latency. Contrary to 3GPP cellular communication networks, DECT NR+ does not rely on centralized infrastructure and uses context-based rather than fixed device roles. It operates in the license-exempt spectrum in the 1880–1930 MHz range (1.9 GHz), and will be extended to the 3.8–4.2 GHz band, at least in [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/08/27/opener-open-source-reference-implementation-of-the-dect-nr-massive-iot-standard/\">Opener is an open-source reference implementation of the DECT NR+ massive IoT, low-latency standard<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "LUNYEE 3020 Nova review – A desktop CNC router with 710W spindle tested with UGS and Easel software", "source": "CNX Software", "date": "2026-08-27", "url": "https://www.cnx-software.com/2026/08/27/lunyee-3020-nova-review-a-desktop-cnc-router-with-710w-spindle-tested-with-ugs-and-easel-software/", "summary": "<div><img alt=\"LUNYEE 3020 Nova CNC 710w review\" class=\"attachment-medium size-medium wp-post-image\" height=\"463\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/08/LUNYEE-3020-Nova-CNC-710w-review-720x463.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>We&#8217;ve gotten a sample of the LUNYEE 3020 Nova desktop CNC router for review. The machine features a 710W trim router spindle suitable for carving wood, acrylic, and aluminum. The drive system relies on dual HG15 linear guides and 1204 ball screws for enhanced rigidity and motion accuracy, and the machine integrates NEMA 17 stepper motors with 0.89 N·m torque. It supports Windows, Linux, and Mac systems and works with GRBL-compatible CNC software such as UGS, Fusion 360, VCarve, Easel, and LightBurn. LUNYEE sent us the CNC router with a dust shoe and a CNC vise worktable for review. We will cover the specifications, go through an unboxing, and show how to assemble and set up the machine before testing it with UGS and Easel programs using wood and acrylic as test materials suitable for the bits provided by the company. LUNYEE 3020 Nova desktop CNC router specifications Control Board [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/08/27/lunyee-3020-nova-review-a-desktop-cnc-router-with-710w-spindle-tested-with-ugs-and-easel-software/\">LUNYEE 3020 Nova review &#8211; A desktop CNC router with 710W spindle tested with UGS and Easel software<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Engineering Embedded Systems for Aerospace and Defense", "source": "Embedded.com", "date": "2026-08-27", "url": "https://www.embedded.com/engineering-embedded-systems-for-aerospace-and-defense/", "summary": "<p>For years, electronics for military and aerospace applications have been built around hardware that could tolerate harsh environments far beyond those encountered by commercial and industrial machinery. Such systems include satellites, planetary rovers, combat vehicles, naval platforms, avionics, and electronic warfare equipment. Ruggedized packaging, military-grade components, and rigorous qualification testing ensured that systems remained operational [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/engineering-embedded-systems-for-aerospace-and-defense/\">Engineering Embedded Systems for Aerospace and Defense<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "RAIN Alliance Launches RFID Sensor Working Group", "source": "Embedded.com", "date": "2026-08-27", "url": "https://www.embedded.com/rain-alliance-launches-rfid-sensor-working-group/", "summary": "<p>The RAIN Alliance has established a new RFID Sensor Working Group to support the development and adoption of sensor-enabled RAIN RFID technologies. The group will bring together technology providers, end users, and industry stakeholders to address emerging applications, deployment challenges, and standards requirements across industrial IoT, asset management, and digital product passport (DPP) use cases. [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/rain-alliance-launches-rfid-sensor-working-group/\">RAIN Alliance Launches RFID Sensor Working Group<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "Infineon supplies silicon carbide technology to Fox ESS, enhancing efficiency of residential energy storage systems", "source": "EE Journal", "date": "2026-08-27", "url": "https://www.eejournal.com/industry_news/infineon-supplies-silicon-carbide-technology-to-fox-ess-enhancing-efficiency-of-residential-energy-storage-systems/", "summary": "Infineon Technologies AG (FSE: IFX / OTCQX: IFNNY) supplies silicon carbide (SiC) power semiconductors to Fox ESS, a leading provider of renewable energy solutions, to enhance the efficiency of its residential energy storage systems (ESS). Leveraging Infineon&#8217;s CoolSiC™ MOSFETs 1200 V G2 in the Q-DPAK package, Fox ESS has reduced switching losses by 70 percent. &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/infineon-supplies-silicon-carbide-technology-to-fox-ess-enhancing-efficiency-of-residential-energy-storage-systems/\">Read More &#8594;<span class=\"screen-reader-text\"> \"Infineon supplies silicon carbide technology to Fox ESS, enhancing efficiency of residential energy storage systems\"<\/span><\/a>"}, {"title": "HomeMaster MiniPLC – An ESP32 DIN-rail PLC controller for Home Assistant", "source": "CNX Software", "date": "2026-08-26", "url": "https://www.cnx-software.com/2026/08/26/homemaster-miniplc-an-esp32-din-rail-plc-controller-for-home-assistant/", "summary": "<div><img alt=\"MiniPLC — ESP32 DIN Rail PLC for Home Assistant\" class=\"attachment-medium size-medium wp-post-image\" height=\"480\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/08/MiniPLC-—-ESP32-DIN-Rail-PLC-for-Home-Assistant-720x480.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>The HomeMaster MiniPLC is an ESP32 PLC controller in a compact DIN-rail form factor with ESPHome pre-installed for Home Assistant integration, and designed for residential and light industrial automation. The device features relay outputs, four isolated 24V digital inputs, 0–10V analog inputs, one 0–10V analog output, PT100/PT1000 RTD channels, 1-Wire buses, and an RS-485 Modbus RTU interface. It also includes a 128 × 64 OLED display, four buttons, 12 LEDs, a buzzer, RTC, microSD slot, and optional 10/100Mbps Ethernet, with support for 24 V DC or 85–265 V AC power. HomeMaster MiniPLC specifications: Wireless Module  – ESP32-WROOM-32D-N16 (soldered on the backside of the PCB) SoC –  ESP32 dual-core wireless microcontroller CPU – Dual-core Xtensa 32-bit microprocessor @ 240MHz Memory –  520KB internal SRAM Storage – 16 MB flash Wireless – Wi-Fi 802.11b/g/n, and Bluetooth (4.2 and BLE) External Wi-Fi antenna (SMA) Storage – MicroSD card slot Display – 128 × 64 [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/08/26/homemaster-miniplc-an-esp32-din-rail-plc-controller-for-home-assistant/\">HomeMaster MiniPLC &#8211; An ESP32 DIN-rail PLC controller for Home Assistant<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Altera Expands Agilex 9 Direct RF FPGA Ecosystem for Defense", "source": "Embedded.com", "date": "2026-08-26", "url": "https://www.embedded.com/altera-expands-agilex-9-direct-rf-fpga-ecosystem-for-defense/", "summary": "<p>Altera Corp. has recently expanded its Agilex 9 Direct RF FPGA ecosystem through collaborations with Mercury Systems and VadaTech, introducing commercial off-the-shelf (COTS) solutions for next-generation defense platforms. The partnerships combine Agilex 9 medium-band Direct RF FPGAs with open-architecture hardware to help defense system developers reduce size, weight, power, and cost (SWaP-C), shorten development cycles, [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/altera-expands-agilex-9-direct-rf-fpga-ecosystem-for-defense/\">Altera Expands Agilex 9 Direct RF FPGA Ecosystem for Defense<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "Nvidia Unveils Jetson Orin Nano 2 for Robotics and Edge AI", "source": "Embedded.com", "date": "2026-08-25", "url": "https://www.embedded.com/nvidia-unveils-jetson-orin-nano-2-for-robotics-and-edge-ai/", "summary": "<p>Nvidia claims to redefine entry-level edge AI with the launch of the Jetson Orin Nano 2 robotics computer, making frontier-class AI models available to millions of developers. Advancing generative AI at the edge, the new AI supercomputer targets applications such as robots, delivery and inspection drones, and vision AI systems that need small, energy-efficient robotics [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/nvidia-unveils-jetson-orin-nano-2-for-robotics-and-edge-ai/\">Nvidia Unveils Jetson Orin Nano 2 for Robotics and Edge AI<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "Why Sensor Fusion Matters for Drone Navigation and Detection", "source": "Embedded.com", "date": "2026-08-25", "url": "https://www.embedded.com/why-sensor-fusion-matters-for-drone-navigation-and-detection/", "summary": "<p>A variety of sensors are used on drones for spatial awareness, terrain and target mapping, obstacle navigation, and optimizing flight paths to the target. Anti-drone defense systems similarly rely on many sensors for detection, flight-path tracking, and drone classification. Each sensor has its strengths and weaknesses. Sensor fusion involves merging the multiple sensor data input [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/why-sensor-fusion-matters-for-drone-navigation-and-detection/\">Why Sensor Fusion Matters for Drone Navigation and Detection<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "Viavi Vertex 6.0 Targets 6G and Wi-Fi 7/8 RF Testing", "source": "Embedded.com", "date": "2026-08-25", "url": "https://www.embedded.com/viavi-vertex-6-0-targets-6g-and-wi-fi-7-8-rf-testing/", "summary": "<p>Viavi Solutions has introduced Vertex 6.0, an enhanced version of its channel emulation platform designed to reproduce real-world RF propagation conditions in laboratory environments. The new platform targets next-generation cellular, Wi-Fi, military, and aerospace technologies and is well-positioned to test emerging 6G and Wi-Fi 7/8 systems. Vertex 6.0 provides 400 MHz of instantaneous bandwidth and [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/viavi-vertex-6-0-targets-6g-and-wi-fi-7-8-rf-testing/\">Viavi Vertex 6.0 Targets 6G and Wi-Fi 7/8 RF Testing<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}], "papers": [{"title": "Aero Hand Open: A Simulation-Ready Tendon-Driven Hand for Dexterous Manipulation Learning", "authors": ["Nan Wang", "Mohit Yadav", "Jonathan Wulff", "Aidan Rosenbaum", "Kezhou Chen", "Yuvan Sharma", "Xu Dong", "Yiwei Tao"], "published": "2026-08-28", "summary": "Tendon-driven hands are anthropomorphic, and moving the actuators off the joints is what makes a hand of this capability affordable to build. Two effects produce that saving. Routing force through a cable removes the requirement that a motor fit inside the joint it drives, so smaller and cheaper motors suffice, and one motor can drive several joints through a single cable, so fewer motors are needed. They are also harder to learn on than a direct-drive hand. The underactuated transmission that produces the saving is itself difficult to represent in a simulator, and the joints one cable drives are not independently commandable. We present Aero Hand Open, a tendon-driven anthropomorphic hand that is released simulation-ready. Three things ship with it. A simulation model reproduces the cable transmission itself. An identified actuation map connects that model to the motor commands in both directions, including the three-way coupling of the thumb. A reinforcement learning package trains policies for the hand. Together they let a policy be trained entirely in simulation and run on the hand with no fine-tuning and no state estimation. We release the mechanical design, the simulation model, the identified mapping, the training environment and the deployment stack.", "pdf_url": "https://arxiv.org/pdf/2608.28578v1"}, {"title": "ChainSplat: A Physics-Inspired Screw-Theoretic Model for Learning Deformable Linear Object Dynamics from Multi-View RGB Videos", "authors": ["Seungyeon Kim", "Noémie Jaquier"], "published": "2026-08-28", "summary": "Identifying the underlying dynamics and 3D geometry of deformable linear objects (DLOs), such as cables, ropes, and hoses, is essential for accurate robotic manipulation, but remains challenging due to their high-dimensional configuration spaces and diverse behaviors arising from varying material properties. Existing methods often rely on multi-stage pipelines and auxiliary depth inputs, which are prone to errors under dynamic interactions, while their high-dimensional state representations make model-based control computationally expensive. In this paper, we introduce ChainSplat, a physics-inspired framework that jointly learns the 3D geometry, appearance, kinematics, and dynamics of DLOs solely from multi-view RGB videos. ChainSplat represents a DLO as an open-chain structure of rigid links connected by revolute joints, yielding an analytic, screw-theoretic model with a compact state representation parameterized by joint configurations. By integrating this formulation with Gaussian splatting, ChainSplat jointly recovers DLO dynamics, kinematics-aware 3D geometry, and appearance, while enabling high-fidelity RGB rendering from arbitrary states. Through real-world experiments, we demonstrate that ChainSplat achieves state-of-the-art performance in dynamics predictions, 3D geometry reconstruction, and RGB rendering across dynamic interactions. ChainSplat further enables real-time state and force estimation, as well as accurate model-based trajectory optimization, highlighting its practical utility for real-world robotic manipulation of DLOs. Accompanying source code and video are available at: https://chainsplat.github.io.", "pdf_url": "https://arxiv.org/pdf/2608.28570v1"}, {"title": "GeBDA: Building Damage Assessment as Text-Based Sequence Prediction", "authors": ["Olivier Dietrich", "Krishna Sapkota", "Konrad Schindler", "Genady Beryozkin"], "published": "2026-08-28", "summary": "Conventionally, Building Damage Assessment (BDA) is tackled either with dedicated network architectures or by fine-tuning geospatial image foundation models. In this work, we ask whether a general-purpose Vision-Language Model (VLM) can localize buildings and grade their damage through autoregressive sequence generation alone. We cast BDA as predicting a variable-length set of bounding boxes, each specified by its coordinates and a damage label. Our preliminary implementation, based on the open Gemma model, achieves promising damage mapping results from only bi-temporal satellite images and a suitable text prompt.", "pdf_url": "https://arxiv.org/pdf/2608.28567v1"}, {"title": "An Enclosed Mode Is a Gauge Choice: Topology Relative to Reach in Certified Code World Models", "authors": ["Javier Aguilar Martín"], "published": "2026-08-28", "summary": "A code world model accepted by a sampling gate can be exactly right on everything the gate can see and arbitrarily wrong beyond it. We characterize what a certified model can know, and what its errors can cost, when the omission is an annular freeze mode enclosing an unreachable interior. The gate quotient makes the question precise: acceptance-with-certainty determines the model exactly on the reachable query set; beyond reach is gauge. On a minimal ring instrument we prove the extreme case (a wrong-topology filled-disc artifact unfalsifiable by any sampling gate and bitwise harmless at play) and measure, with LLM synthesis across three model families, how one knob (a channel of width gamma) walks the same artifact through three regimes: unfalsifiable-and-harmless, falsifiable-and-costly, and instantly falsified. Three principles organize the empirics. First, danger is topology relative to reach: a channel the planner can use collapses the blind model's exploitation (play cost 1.09 to ~0 over a knee at gamma ~ 0.1), while a hidden channel with the same first Betti number keeps it at full strength (1.12). Second, repair is parameter-bound and sensor-bound: no family recovers the region from outside evidence; from inside, models pose the right topology but cannot pin its parameters, and the posed topology tracks the guiding persistent-homology summary's wrong beta_1 (a sensor with a measured geometric resolution limit), not the truth. Third, mitigation must match the error's dimension and direction: point fences fail against the one-dimensional boundary, a dimension-matched persisted fence collapses exploitation to a two-lesson transient (0.999 to 0.058), and the dual freedom certificate collapses the invented-mode failure symmetrically (1.769 to 0.029). In n dimensions the shell makes misidentification near-certain while the danger stays fully exploitable: the two axes are independent.", "pdf_url": "https://arxiv.org/pdf/2608.28541v1"}, {"title": "When Robots Mishear Us: Mapping the Safety Risks of Voice-Controlled Embodied AI", "authors": ["Sihan Jia", "Oliver Lemon"], "published": "2026-08-28", "summary": "We investigate whether automatic speech recognition (ASR) errors in user input can lead to unsafe outputs from Embodied AI (EAI) models. We find that ASR errors can lead to harmful instructions being accepted and executed by EAI models, thereby reducing safety. We simulate ASR errors and combine them with existing safety benchmarks (SafeAgentBench and POEX) to evaluate how different errors affect embodied AI safety. We find that some of them preserve semantic structure but increase harmful ambiguity, while others weaken the model refusal behaviour and allow unsafe plans to be generated and executed. We show that in some cases automatic correction of ASR errors can reduce the risk, but this is not always effective. Overall, we show that ASR errors lead to significant safety risks for embodied AI.", "pdf_url": "https://arxiv.org/pdf/2608.28518v1"}, {"title": "AcrossVAM1.0: Particle World Modeling for Text-Assisted Robot Video Prediction", "authors": ["Yafei Zhang", "Nan Wu"], "published": "2026-08-28", "summary": "Predicting robot videos requires both precise motion reasoning and preservation of high-frequency appearance, yet monolithic pixel models entangle these objectives and often conceal their progress behind a strong last-frame baseline. We present AcrossVAM1.0, a lightweight, text-assisted video action model that factorizes future prediction into object-centric motion and dense appearance. A frozen SAM3-DLP codec decomposes four context frames into semantic particles for the robot, arm, and gripper, together with a background latent. A 0.28M-parameter spatio-temporal Transformer aligns particle identities, rolls their states forward, and is modulated by a frozen OpenCLIP instruction embedding through FiLM. A causal dual-stream decoder combines particle-rendered motion with appearance encoded exclusively from the last observed frame; a residual refiner and learned delivery mask produce five future frames without access to future appearance. On our VRS benchmark constructed from diverse real-robot trajectories, particle dynamics reduce trajectory error by 21.0\\% over persistence. Across three delivery-mask seeds, AcrossVAM1.0 improves future-frame PSNR/SSIM from 19.97/0.796 to 20.573/0.8004, while raw particle generation improves motion-region PSNR from 11.89 to 13.23. The delivered model does not yet beat persistence in LPIPS, and correct-versus- shuffled language changes trajectory error by only 2.8--3.1%. We report these limitations alongside oracle, negative-control, multi-seed, and per-robot analyses. The results show that explicit particle dynamics are a promising low-dimensional interface for robot video prediction, while robust language grounding and appearance delivery remain the principal open challenges.", "pdf_url": "https://arxiv.org/pdf/2608.28491v1"}, {"title": "Prompt-Guided Interactive Segmentation of Interstitial Lung Disease in Thoracic CT", "authors": ["Vasilis Dedousis", "Lubnaa Abdur Rahman", "Lorenzo Brigatο", "Ethan Dack", "Andreas Christe", "Christoph Frank", "Manuela Funke-Chambour", "Justus Roos", "Adrian Huber", "Lukas Ebner", "Stavroula Mougiakakou"], "published": "2026-08-28", "summary": "Accurate segmentation of interstitial lung disease (ILD) patterns is essential for quantitative disease assessment and longitudinal monitoring. However, existing approaches remain limited by relying on dense annotations and producing static predictions that cannot be refined, motivating interactive approaches. While promptable models show promise in interactive segmentation, their adaptation to ILDs remains largely unexplored. To address this gap, we investigate prompt-guided foundation models for ILD refinement and present, to the best of our knowledge, the first adaptation of MedSAM2 for interactive 3D ILD segmentation on thoracic CT. We investigate three fine-tuning strategies and multiple clinically motivated prompts: bounding-boxes (BBox), point, lasso, and scribble. On a dataset spanning seven ILD patterns and healthy lung tissue, full model fine-tuning performed best, improving the average Dice score by 4.7 percentage points over MedSAM2.While BBox prompts achieve the strongest performance, non-native MedSAM2 interactions such as lasso and scribble prompts also prove effective. Finally, we present and evaluate a proof-of-concept end-to-end workflow in which MedSAM2 is initialized from an automatic segmentation prior and subsequently refined using radiologist prompts. Model weights and plug-ins made available at: https://github.com/AIHNlab/ILD-SemiSegTool.", "pdf_url": "https://arxiv.org/pdf/2608.28453v1"}, {"title": "LUCID: An Agentic AI Framework on Digital-Twin in the Loop for QoS-Guaranteeing Robotic Control", "authors": ["Hyeonsu Lyu", "Minwoo Kim", "Sehyun Ryu", "Hyun Jong Yang"], "published": "2026-08-28", "summary": "Cloud robotics relies on the timely uplink of high-volume sensing streams, yet dynamic environments continually shift the feasible combinations of trajectories, active-robot count, and per-robot QoS. Because existing approaches formulate trajectory planning (TP) and radio resource management (RRM) as a single fixed optimization problem, they cannot reconfigure these coupled decisions as conditions evolve, resulting in transient QoS violations. However, evolving operator intents change which quantities-such as the active-robot count and per-robot QoS-are fixed, optimized, or relaxed. Furthermore, the computational cost of evaluating trajectory-dependent wireless conflicts has made it difficult to build large-scale Digital-Twin-in-the-Loop (DITL) testbeds responsive enough for such dynamic orchestration. We present LUCID, an LLM-agent--orchestrated, uplink-aware cloud-robotics pipeline that moves TP--RRM from solving a fixed formulation to dynamically orchestrating optimization problem schemas within a DITL environment. Driven by the operator's high-level intent, LUCID treats the TP--RRM formulation as a bounded template whose variables, objectives, and constraints are dynamically configured, while SimBridge enables repeated ray-tracing evaluation by converting large-scale robotics scenes into wireless-ready DTs. By integrating collision-free path planning with a spectral-radius RRM validator, LUCID identifies wireless bottlenecks and restructures the problem schema on the fly to efficiently find the verified feasible state. Experiments confirm that LUCID robustly adapts to changing intents, active-robot counts, and scenes, while a multimodal surrogate model, FastConfigNet, reduces planning latency.", "pdf_url": "https://arxiv.org/pdf/2608.28437v1"}, {"title": "Linear Temporal Logic Translation via Human-Inspired Self-Constrained Reasoning for Robot Task Specification", "authors": ["Haofei Hou", "Fanxu Meng", "Shunyi Zhao", "Kairui Yang", "Mengchen Cai", "Lecheng Ruan", "Qining Wang"], "published": "2026-08-28", "summary": "Many robotic tasks are temporally extended and demand precise specifications of subgoals, constraints, and their temporal ordering. Yet human operators typically communicate such tasks in natural language, which is inherently ambiguous, underspecified, and context dependent. Translating human instructions into formal task specifications, such as Linear Temporal Logic (LTL), is therefore essential for verifiable and safe robotic execution. Existing LLM-based translators attempt to bridge this gap through open-ended reasoning or post-hoc constraint enforcement, but the former may violate domain constraints, whereas the latter can disrupt the reasoning needed for novel instructions. This paper proposes Self-Constrained Reasoning (SCR), a framework that mitigates this trade-off by internalizing structural knowledge into the model's decision-making process rather than imposing it as an external filter. By combining a structural constraint representation with a hierarchical decision-making formulation, SCR guides reasoning within a formally grounded space while preserving adaptability to unseen instructions. Experiments show that SCR improves both domain-constraint satisfaction and generalization, providing an effective and interpretable approach for translating human intent into verifiable specifications for robotic execution.", "pdf_url": "https://arxiv.org/pdf/2608.28435v1"}, {"title": "Cooperative Risk-Aware Exploration in Heterogeneous Multi-Robot Systems Using Algorithmic Altruism", "authors": ["Brooks A. Butler", "Jair Certório", "João P. Hespanha", "Magnus Egerstedt"], "published": "2026-08-28", "summary": "Multi-robot systems are well-positioned for exploration in hazardous environments, but effective deployment requires deciding not only where robots should gather information, but also how risk should be distributed across heterogeneous team members. This paper develops a game-theoretic framework for cooperative risk-aware exploration based on ecologically inspired altruistic behavior. Each robot selects a finite-horizon trajectory to maximize information gain while penalizing redundant exploration and expected hazard exposure. Heterogeneity is introduced through agent-specific value parameters for encoding altruistic coupling, which is modeled through relatedness weights inspired by Hamilton's rule. We introduce a game-theoretic structure for trajectory planning that defines a Social Nash Equilibrium, which modifies the utility of agent actions according to agent relatedness. This utility shaping causes agents to internalize the effect of their trajectory choices on teammates, encouraging lower-valued robots to accept risk when doing so benefits higher-valued agents and improves team performance. We define an exploration utility for agents that rewards area coverage and uncertainty reduction, while also penalizing redundancy and risk, enabling projected gradient-based waypoint optimization in a receding-horizon planner. Simulations show that altruistic planning reduces redundant exploration, improves inter-robot separation, and reallocates risk according to agent value while maintaining comparable map coverage. We further demonstrate the approach in hardware experiments, where planned waypoints are tracked by wheeled robots using single-integrator controllers and barrier certificates.", "pdf_url": "https://arxiv.org/pdf/2608.28409v1"}, {"title": "PanelShield: Verifiable Closed-Loop Safe Planning for Robotic Industrial Panel Operation", "authors": ["Guipeng Xin", "Jiahe Xu", "Chenhui Wan", "Jie Liu", "Youmin Hu", "Zhongxu Hu"], "published": "2026-08-28", "summary": "Industrial panel operation is knowledge-intensive and safety-critical. Beyond control recognition and action generation, execution must satisfy constraints in operation manuals and safety regulations. While foundation-model-based planners show strong semantic capability, they typically lack computable, localizable, and reproducible mechanisms for violation detection and repair. To address this, we propose PanelShield, a verifiable closed-loop safety planning framework for manual-guided industrial panel operation. The framework generates parameterized action primitive sequences from task-relevant manual evidence and applies dual formal verification with LTL and a Safety FSM to enforce cross-step temporal correctness and local transition legality. When violations occur, it outputs a structured counterexample with the earliest violating step and cause, enabling targeted repair and re-verification. We build a multi-level long-horizon planning benchmark covering three representative industrial device panels, and evaluate the framework in simulation and real-world robotic experiments. Results show that PanelShield improves complex safety-constrained task performance over foundation-model-only planning baselines while reducing the violation rate to 2.7%, with 4.1 s total latency. Real-world experiments demonstrate end-toend feasibility. Overall, PanelShield offers a verifiable approach to robotic panel operation that balances flexibility, safety, and auditability.", "pdf_url": "https://arxiv.org/pdf/2608.28305v1"}, {"title": "MaCoPlanner: LLM-Assisted Manual-Compiled Task Planning with Proactive Safety Verification for Robotic Industrial Panel Operation", "authors": ["Guipeng Xin", "Jiahe Xua", "Mohammad Deghat", "Chenhui Wan", "Jie Liu", "Youmin Hu", "Zhongxu Hu"], "published": "2026-08-28", "summary": "Robotic industrial panel operation requires not only accurate control localization but also compliance with operating procedures, safety rules, and device-state constraints distributed across heterogeneous manuals. This study presents MaCoPlanner, a task-planning framework built on knowledge compiled from equipment manuals that converts equipment manuals into a typed intermediate representation, retrieves task- and state-relevant evidence, and uses it to support plan generation. Before actuation, candidate plans are symbolically rolled out and checked against procedural and state-transition constraints; detected violations are localized and returned for targeted repair, while unresolved plans are rejected. A separate execution interface grounds verified symbolic actions to physical controls and updates the device state. Under an independent evaluation oracle, MaCoPlanner achieves a final violation rate of 2.7%, and 26.3% of the runs in the repair analysis are rejected after exhausting the refinement budget. Compared with Raw-Manual, task success increases from 62.8% to 84.4% on Level-2 tasks and from 25.9% to 43.2% on Level-3 tasks. Experiments on a controller-panel simulator without an attached industrial load further demonstrate integrated execution feasibility under representative interaction conditions, without claiming industrial deployment readiness.", "pdf_url": "https://arxiv.org/pdf/2608.28300v1"}, {"title": "STEGNav: Spatio-Temporal Event Graph Reasoning for Multimodal Lifelong Object Navigation", "authors": ["Yang Chen", "Zhenyu Huang", "Wenbo Fu", "Danyang Peng", "Shi-Yu Tian", "Kun-Yang Yu", "Lan-Zhe Guo"], "published": "2026-08-28", "summary": "Multimodal lifelong navigation requires an agent to autonomously explore unseen environments while sequentially completing navigation tasks specified by object categories, language descriptions, or reference images. Existing methods primarily accomplish these tasks by constructing state-centric semantic scene graphs. By treating scene graphs as persistent repositories of semantic observations, these methods struggle to distinguish similar instances, jointly represent semantic targets and exploration frontiers, and effectively exploit navigation memory and trajectory experience. To address these limitations, we propose Spatio-Temporal Event Graph Navigation (STEGNav), a training-free framework that extends conventional scene graphs into spatio-temporal event graphs along complementary spatial and temporal axes. The spatial axis performs query-conditioned instance grounding and jointly represents semantic targets and occupancy-aware exploration frontiers characterized by reachability, path cost, and exploration utility. The temporal axis employs trajectory-aware dual-window memory to retain recent decision--trajectory events and verified cross-subtask navigation outcomes. A VLM-based navigation agent reasons over the resulting spatio-temporal event graph and selects either a target instance or an exploration frontier as its next navigation goal. STEGNav achieves 66.3% SR and 39.7 SPL on GOAT-Bench, as well as SR scores of 64.0% and 69.4% on HM3Dv1 and HM3Dv2, respectively. Ablation studies and error analyses validate the complementary effects of the two axes, demonstrating that event-driven spatio-temporal representations improve navigation reliability and cross-subtask experience reuse.", "pdf_url": "https://arxiv.org/pdf/2608.28279v1"}, {"title": "Spatial-Semantic Reasoning using Large Language Models for Efficient UAV Search Operations", "authors": ["Marin Maletic", "Marijana Peti", "Tamara Petrovic", "Stjepan Bogdan"], "published": "2026-08-28", "summary": "We present a real-time semantic navigation framework for Unmanned Aerial Vehicles (UAVs) focused on improving time efficiency in the Object Goal Navigation (ObjectNav) task. Central to our approach is a Large Language Model (LLM) that interprets user-provided natural language instructions and performs semantic reasoning over detected objects and spatial context to prioritize high-probability search regions. The system combines real-time object detection, 3D spatial mapping, and polynomial spline interpolation for smooth and feasible UAV trajectory planning. Unlike prior methods that rely on offline reasoning or simulator-constrained action spaces, our framework can operate in real time, continuously updating semantic relevance based on new observations. Experiments in both simulated and real-world settings demonstrate reductions in mission duration while maintaining high search accuracy, underscoring the effectiveness of LLM-guided reasoning for time- efficient UAV-based ObjectNav.", "pdf_url": "https://arxiv.org/pdf/2608.28270v1"}, {"title": "CoCoBench: A Cooperative Coordination Benchmark for Embodied Multi-Agent Task Planning", "authors": ["Yang Chen", "Ye-Xin Xie", "Lirong Che", "Danyang Peng", "Yuzhe Yang", "Peiwen Lin", "Xu Cao", "Chuang Wang", "Lei Yuan", "Jian Su", "Lan-Zhe Guo"], "published": "2026-08-28", "summary": "Agent systems powered by multimodal large language models (MLLMs) have advanced rapidly in recent years, yet existing embodied-agent benchmarks still lack fine-grained diagnostics for multi-agent coordination. Most benchmarks either focus on single-agent task completion or summarize multi-agent behavior with overall task success rates, which can obscure coordination failures such as duplicated work, violations of ordering constraints, resource contention, and desynchronized handoffs. In this paper, we introduce CoCoBench, a construct-level benchmark for evaluating multi-agent embodied coordination in executable household tasks. CoCoBench contains 897 oracle-validated instances organized around four recurring coordination constructs: task allocation, sequential ordering, mutual exclusion, and handoff coordination. In addition to task success rate, CoCoBench provides construct-level scores that measure whether agents coordinate effectively. We evaluate 11 leading MLLMs across different coordination modes, observation inputs, and numbers of agents. The results show that coordination ability is highly construct-specific: strong overall performance does not imply balanced competence across different coordination types. These findings point to new directions for designing targeted model architectures and improving multi-agent coordination ability.", "pdf_url": "https://arxiv.org/pdf/2608.28266v1"}, {"title": "Training-free Suction Grasp Detection for Deformed Aseptic Cartons Using Vision-Language Models and Geometric Surface Scoring", "authors": ["Marin Maletic", "Goran Vasiljevic"], "published": "2026-08-28", "summary": "Robotic sorting of recyclable waste is challenging due to the deformable and geometrically inconsistent nature of target objects. We present a training-free suction grasping system for sorting deformed aseptic beverage cartons, decoupling target identification from grasp-point selection. An open-vocabulary vision-language model detects cartons from a text prompt, SAM2 refines each detection into an instance mask, and a geometric scoring method selects the suction point by combining surface flatness with normal alignment. Three geometric methods are compared: k-nearest-neighbour PCA, Sobel cross-product, and RANSAC plane fitting. Evaluated on a real robot across three deformation levels and 35 cluttered scenes, single-object grasp success reaches 88.2% and end-to-end retrieval in clutter is 72.6%.", "pdf_url": "https://arxiv.org/pdf/2608.28246v1"}, {"title": "Efficient Online Continual Foundation Model Fine-Tuning for Predictive Process Monitoring", "authors": ["Sjoerd van Straten", "Marwan Hassani"], "published": "2026-08-28", "summary": "Predictive Process Monitoring (PPM) models are increasingly deployed in dynamic environments where concept drift causes the underlying process distribution to shift over time. While recent work has moved toward online continual learning, existing methods train compact, task-specific networks entirely from scratch, leaving a persistent cold-start problem. Foundation Models (FMs) offer a compelling solution to this problem, but their continual fine-tuning in the process mining domain remains unexplored. We propose COMPASS (Continual Online foundation Model-based PPM with Adaptive SubSpaces), the first framework for online continual fine-tuning of FMs for PPM. COMPASS adapts loss-plateau drift detection to autonomously identify task boundaries in event streams and maintains a unified knowledge subspace including both pre-trained and task-specific directions. We evaluate our approach on nine event streams covering synthetic and real-world concept drift scenarios, across task-free and task-aware settings with multiple backbones and with consistent hyperparameter tuning across all methods. Our approach outperforms three SOTA non-FM competitors and two update strategy baselines, with particularly strong gains on streams exhibiting recurrent drift and complex, long-running cases, while incurring acceptable computational overhead compared to the non-FM competitors.", "pdf_url": "https://arxiv.org/pdf/2608.28237v1"}, {"title": "D-TAIA: Domain-Aware LLM Adaptation for Multi-Task Predictive Process Monitoring", "authors": ["Sjoerd van Straten", "Christine Jacob", "Marwan Hassani"], "published": "2026-08-28", "summary": "Predictive Process Monitoring (PPM) enables organizations to forecast future process behavior, such as the next activity and remaining time of ongoing cases. In practice, three conditions cause existing methods to degrade, namely data scarcity, high process entropy and distributional shift. While Foundation Models (FMs), especially Large Language Models (LLMs), offer a new paradigm through broad sequential reasoning, adapting them to multi-task PPM under these conditions remains an open challenge. Existing FM-based approaches either lack mechanisms for handling distributional shift or rely on direct regression heads that can be structurally misaligned with continuous time prediction tasks. This paper introduces D-TAIA (Domain-aware Training and Attention-based Inference Architecture), a framework for a joint next activity and remaining time prediction task via parameter-efficient fine-tuning of an FM backbone. Our approach combines domain-aware triplet loss (DATL) pre-training with FAISS-based nearest neighbor retrieval for remaining time prediction, and adopts the TAIA inference strategy to preserve pre-trained sequential reasoning during fine-tuning. Evaluated across four real-world event logs, D-TAIA consistently shows SOTA or competitive performance compared to a fine-tuned LLM and a recurrent neural network baseline. Ablation studies confirm that techniques from NLP and computer vision can be transferred effectively to PPM with only a 10M-parameter backbone, though component contributions vary by dataset entropy.", "pdf_url": "https://arxiv.org/pdf/2608.28236v1"}, {"title": "WALDO: One-Shot Exemplar-Conditioned Object Detection in Cluttered Scenes", "authors": ["Kishor Datta Gupta", "Ahmed Rafi Hasan", "Md. Mahfuzur Rahman", "Md. Sadman Haque", "Mohd Ariful Haque"], "published": "2026-08-28", "summary": "Locating a specific object instance in a cluttered scene using a single reference image and a short description, and reporting when that instance is absent, large vision-language models usually address this task. We ask whether the same capability is available far more cheaply, from representations already learned by a world-model pretraining objective. We present WALDO, a one-shot exemplar- and language-conditioned detection head with 3.4M trainable parameters that reads frozen V-JEPA 2.1 features to jointly predict object localization and target presence, with no gradient on the backbone. Because exemplar-conditioned supervision is scarce, we synthesize training episodes from instance annotations, mining exemplars from ground-truth boxes and constructing absence cases that exclude the referenced instance while leaving same-category distractors in view. This is easy to get wrong: in the obvious implementation, crop size alone predicts the label, and a head trained on it reaches 0.9998 absence AUROC without ever consulting the exemplar, and we report the negative controls that close the shortcut. On 35 held-out cluttered scenes, WALDO achieves a 0.461 catalogue AP@50, compared to 0.306 for a prompted Grounding DINO baseline under an identical scorer. Substituting DINOv3 for V-JEPA under a matched 576-token grid drops within-category absence AUROC from 0.880 to 0.726 and instance AP@50 from 0.201 to 0.141, isolating the pretraining objective rather than input resolution as the source of the gain. Instance-level Success@1, however, reaches only 0.190 against a 0.190 category-chance floor: world-model features transfer to localization precision and absence detection but not to instance identity.", "pdf_url": "https://arxiv.org/pdf/2608.28216v1"}, {"title": "Probabilistic Multi-Robot Gas Source Localization with Uncalibrated Sensors: A Distributed Estimation Approach", "authors": ["Wanting Jin", "Marc Zoel Arias Mitjà", "Alcherio Martinoli"], "published": "2026-08-28", "summary": "Estimating environmental states with multi-robot systems becomes particularly challenging when robots are equipped with uncalibrated and therefore heterogeneous sensors, whose nonlinear and inconsistent responses prevent reliable information fusion. In this paper, we propose a distributed probabilistic framework for source localization tasks that enables calibration-free estimation in the presence of sensor heterogeneity. The key idea is that each robot independently estimates a local belief using a rank-based feature that captures the relative evolution of observations and is invariant to sensor scaling and nonlinearities. These local beliefs are then fused through a product of experts formulation to obtain a consistent global estimate across the team. To further improve the efficiency of team coordination, we introduce an informative region allocation and path planning strategy that reduces redundant exploration while balancing exploration and exploitation. We validate the proposed framework using high-fidelity simulations with realistic gas sensor models. Results demonstrate that our method significantly outperforms a benchmark method based on standard measurement aggregation, achieving reliable source localization accuracy despite strong sensor heterogeneity. More broadly, this work demonstrates how calibration-free sensing representations can be effectively extended to distributed robotic systems, paving the way for their application to other estimation tasks involving heterogeneous sensors.", "pdf_url": "https://arxiv.org/pdf/2608.28214v1"}, {"title": "PAMoR: Parameterized Affective Motion Generation in Real Time for Humanoid Robots", "authors": ["Yan Pan", "Lingfan Bao", "Tianhu Peng", "Chengxu Zhou"], "published": "2026-08-28", "summary": "People read a humanoid robot's motion in social settings not only for the action performed but for the affect conveyed. Motion carrying that affect has so far been generated for human avatars, where style is taken from a reference clip or an emotion word, neither of which can be quantitatively parameterized. We present PAMoR, which turns affect into a measured control parameter: a valence-arousal (V-A) coordinate computed natively on robot kinematics. It is obtained in closed form from postural expansion and movement energy, and these measurements serve directl
