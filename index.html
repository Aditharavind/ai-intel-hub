eline. Remarkably, LingBot-Vision drives the progression from LingBot-Depth 1.0 to LingBot-Depth 2.0 for depth completion, and thereby yields enhanced depth estimation, a key pillar for embodied artificial intelligence. Our findings reveal that boundary modeling goes beyond simple line segments and instead serves as a scalable pretraining principle for learning spatially structured visual representations.", "pdf_url": "https://arxiv.org/pdf/2607.05247v1"}, {"title": "The emergence of X-ray emission lines during relativistic radio-jet formation in the changing-look active galactic nucleus 1ES 1927+654", "authors": ["Dev R. Sadaula", "Sibasish Laha", "Eileen T. Meyer", "Onic I. Shuvo", "Main Pal", "Ritesh Ghosh", "Matteo Guainazzi", "Fabio Pacucci", "Stefano Bianchi", "Luigi Gallo", "Rostom Mbarek", "Amelia M. Hankla", "Fabio La Franca", "Tahir Yaqoob", "Megan Masterson", "Erin Kara", "Missagh Mehdipour", "Claudio Ricci", "Javier A Garcia", "Timothy R. Kallman", "Ralf Ballhausen", "Mitchell C. Begelman", "Alexander Philippov", "Suvendu Rakshit", "Francesca Panessa", "Ehud Behar", "S. Bradley Cenko", "Federica Ricci", "Ilaria Villani", "James N. Reeves"], "published": "2026-07-06", "summary": "We present results from a comprehensive multi-wavelength monitoring campaign of the changing-look active galactic nucleus 1ES 1927+654 during the onset and evolution of a radio jet (May 2022-August 2025). Using observations from XMM-Newton, Swift, TNG, ZTF, VLA, and VLBA, we characterize the spectral evolution of the source. Soft X-ray emission lines at ~0.56 keV and ~1 keV have appeared with variable strength and width during the formation of a nascent jet, with the ~1 keV feature persisting since the post-2017 flare phase. We also report the detection of a broad (~800 eV) Fe K emission feature at ~(6-7) keV in ~70 ks of stacked EPIC-pn spectra, marking the first such detection in this historically featureless source. Joint spectral fitting of XMM-Newton EPIC-pn and RGS data reveals the presence of ionized absorbers in 2022, followed by weaker absorption from 2023 to 2025. The emergence of emission features concurrent with the decline of ionized absorption suggests a transition in the inner accretion and outflow processes, indicating the reflection and reprocessing of X-rays from the inner accretion disk during jet formation. The apparent weakening of ionized outflows as the jet develops supports a scenario in which accreting material is preferentially channeled into the jet rather than expelled as winds. Furthermore, both the 0.3-2 keV soft X-ray and 5 GHz radio fluxes, which have increased by factors of ~10 and ~60, respectively, since 2022, have recently plateaued at elevated levels. Combined with steady optical emission, this indicates a stabilized accretion disk, corona, and jet configuration. Finally, the absence of broad optical emission lines suggests that the broad-line region is either not along our line of sight or insufficiently illuminated by the central source.", "pdf_url": "https://arxiv.org/pdf/2607.05246v1"}, {"title": "GelNeuro: A Sensing-Computing Integrated Neuromorphic Tactile System for Texture Recognition", "authors": ["Luoyang Bian", "Xinpan Meng", "Zhenghua Ma", "Houcheng Li", "Long Cheng"], "published": "2026-07-06", "summary": "Neuromorphic visuo-tactile sensing offers a promising paradigm for low-latency and low-power robotic perception. However, existing systems still rely heavily on a host computer for event readout, preprocessing, or relaying prior to chip inference. This paper presents GelNeuro, a fully integrated sensing-computing visuo-tactile system that directly pairs a GelSight Mini-based optical tactile front end with the Speck2f neuromorphic system-on-chip (SoC). Contact-induced marker motions are captured as dynamic vision sensor (DVS) events and routed through the on-chip network to a spiking convolutional neural network (SCNN) classifier. To mitigate accuracy degradation during 8-bit deployment, a hardware-aware weight clamping strategy is introduced. Evaluated on a 15-class natural texture recognition task, hardware-in-the-loop testing on the physical chip achieves a 96.3% accuracy within an 80 ms inference window. Notably, the system consumes only 19.6 mW of board-level active power-over three orders of magnitude lower than conventional CPU/GPU baselines on the same benchmark. GelNeuro also exhibits robust generalization across unseen contact depths, demonstrating the viability of direct sensor-to-chip tactile recognition on edge neuromorphic hardware.", "pdf_url": "https://arxiv.org/pdf/2607.05241v1"}, {"title": "MoP-JEPA: Hard-Assigned Predictor Mixtures for Stochastic JEPA World Models", "authors": ["Zhi Song", "Ximing Xing", "Zhenchao Tang", "hanbo Huang", "Tianxu Lv", "minghao Yang", "Zhongzheng Niu", "He Bing", "Lusheng Wang", "Jianhua Yao"], "published": "2026-07-06", "summary": "JEPA world models predict the next latent state with a single deterministic predictor trained by latent regression. We show that this fails structurally when the environment is stochastic: at a branching transition, the regression-optimal predictor outputs the conditional mean of the successor embeddings, a point between the true next states that corresponds to no state at all. We prove this collapse for deterministic and gated mixture-of-experts predictors, and prove that MoP-JEPA's hard-assigned predictors converge instead to a quantizer of the transition distribution: one head per successor mode, enumerable in a single forward pass, which is the interface a planner consumes. On official OGBench offline data with leak-free evaluation, planning over single-predictor rollouts performs poorly ($0.02$--$0.09$ success) while planning over our predicted modes reaches up to $0.85$, ahead of deterministic, gated-MoE, and variational predictors on every task. Because multi-prediction evaluation invites coverage freeloading, a verification protocol is part of the method: an input-agnostic codebook control, a shuffled-context test, router-gated readouts, transition-precision guards, and a verified-route criterion in which the model proposes its transition graph blind and ground truth is used only to check the result. Under this criterion our method outperforms the strongest soft alternative on all three mazes ($2$--$5\\times$), and the protocol identifies the remaining gap in that baseline's raw scores as routes through predicted transitions that do not exist. The same model executes in the real environment, placing second of seven against the published OGBench baselines on the hardest maze. Multimodal dynamics decide whether a JEPA world model can plan at all; a mixture of predictors with hard assignment is a minimal and verifiable fix.", "pdf_url": "https://arxiv.org/pdf/2607.05238v1"}, {"title": "Probing Geospatial SSL Representations with Environmental Signals", "authors": ["Rohita Mocharla", "Vishal M. Patel"], "published": "2026-07-06", "summary": "Self-supervised learning (SSL) is designed to learn generic, transferable representations rather than representations optimized for a single task. Most geospatial benchmarks evaluate representations solely through downstream tasks, providing limited insight into the information encoded within the representation itself. We ask a different question: do SSL representations of satellite imagery preserve statistical associations with environmental variables that co-vary with the imaging process? To answer this question, we probe SSL representations using co-located ERA5 reanalysis variables, a global dataset of physically consistent environmental variables, including temperature, precipitation, surface solar radiation, surface pressure, and volumetric soil water. These variables are physically related to the spectral reflectance and radar backscatter recorded by Sentinel-1 and Sentinel-2, making them meaningful evaluation targets despite not being used during SSL pretraining. We complement this probing analysis with intrinsic representation metrics to characterize representation geometry and investigate how these properties relate to downstream performance and the encoding of environmental signals. Using DINO, MAE, and MoCo models trained under identical conditions, we show that representation-level metrics distinguish models with similar downstream benchmark performance, providing complementary information beyond task-driven benchmarks. We further find that the linear accessibility of environmental signals is associated with performance on environmentally dependent tasks in the PANGAEA benchmark. Finally, we release ERA5 annotations co-located with the SSL4EO dataset to enable physically grounded representation evaluation for future geospatial foundation models.", "pdf_url": "https://arxiv.org/pdf/2607.05207v1"}, {"title": "FlatManifold: Robust Continual Learning under Severe Label Noise and Domain Shifts via Intrinsic Manifold Flattening", "authors": ["Rai Hisada", "Kanji Tanaka"], "published": "2026-07-06", "summary": "In non-stationary streaming environments, simultaneously adapting to complex, non-linear domain shifts via continual learning while mitigating the catastrophic effects of severe, uncalibrated label noise poses a fundamental mathematical challenge. In this paper, we propose \\FlatManifold{}, a novel, streamlined robust continual learning framework that utilizes a Nyström manifold flattening map based on the kernel trick and projection onto an orthogonalized Reproducing Kernel Hilbert Space (RKHS). Unlike traditional methods that rely on complex, error-prone sample-filtering pipelines, the proposed approach exploits the intrinsic mathematical robustness of the flattened space itself. By mapping feature distributions onto a fixed orthogonal target topology with a ridge regularizer, the framework naturally smoothes and counteracts the influence of extreme label noise during the optimization process. Concurrently, catastrophic forgetting is prevented via a continual topology brake term that leverages the covariance matrix of past experiences. Extensive evaluation on real-world multi-session robotics datasets demonstrates that even under severe conditions featuring 40\\% symmetric label noise, \\FlatManifold{} successfully mitigates gradient corruption. Under extreme cross-session domain shifts spanning various seasons and lighting conditions, the proposed framework establishes high generalization capabilities, significantly outperforming standard sequential optimization baselines and proving that structural linearization itself serves as a powerful mathematical barrier against distributed label corruption.", "pdf_url": "https://arxiv.org/pdf/2607.05201v1"}, {"title": "VLM-CASE: Vision-Language Model Enabled Context-Adaptive Safety Envelopes for Anticipatory Safe Autonomous Driving", "authors": ["Tianjia Yang", "Ke Li", "Ruwen Qin", "Xianbiao Hu"], "published": "2026-07-06", "summary": "Adverse driving conditions, such as bad weather, remain a principal barrier to autonomous driving because they degrade two things at once: what the vehicle can perceive and what it can physically do. Human drivers cope by anticipation, reasoning about the scene and re-budgeting speed, following distance, and steering before grip or sight is lost, whereas current autonomous driving systems at best react after the fact. This paper proposes VLM-CASE, a framework that gives an autonomous vehicle this anticipatory capacity while keeping its motion bounded by a formal safety model at all times. A vision-language model (VLM), fine-tuned with low-rank adaptation (LoRA), reasons about the scene from the front-camera image and reports the road surface and visibility conditions. This output parametrizes a context-adaptive safety envelope (CASE), derived from physical limits and the guarantees of responsibility-sensitive safety, that couples braking and steering through a shared friction budget. A model predictive controller then drives freely within the envelope, while the VLM runs asynchronously so it never blocks the real-time control loop. We validate the framework in closed-loop CARLA simulation on tasks that demand both lateral and longitudinal control, across a range of weather, road-surface, and lighting conditions. The resulting controller, VLM-CASE-MPC, completes all trials, outperforming a conventional MPC baseline and a state-of-the-art VLM-integrated controller. Ablations confirm that the gains come from context adaptation, with the friction and visibility adaptations proving complementary. Furthermore, the framework is controller-agnostic and pairs with almost any low-level controller, offering a promising direction for safe autonomous driving. The dataset and supplementary materials for VLM-CASE are available at https://github.com/ytj254/VLM-CASE.", "pdf_url": "https://arxiv.org/pdf/2607.05180v1"}, {"title": "RABBiT: Rapidly adaptive BOLD foundation model via brain-tuning for accurate zero-shot and few-shot prediction of speech-elicited responses in the brain", "authors": ["Omer Moussa", "Mariya Toneva"], "published": "2026-07-06", "summary": "Language understanding in the brain is context-dependent, varying across experimental stimuli and individuals, which makes it difficult to build computational models that generalize across both. This calls for a foundation model of language-evoked brain activity that can capture shared structure while adapting efficiently to new participants and inputs. We introduce RABBiT (Rapidly Adaptive BOLD foundation model via BraIn-Tuning), a compact audio-to-fMRI encoder designed for accurate zero- and few-shot prediction. A comprehensive evaluation on 324 participants across multiple unseen fMRI datasets shows that RABBiT enables accurate zero-shot prediction of fMRI responses to natural speech across auditory and language-selective regions, surpassing the SOTA foundation model for fMRI and predictions based on group averages. With as little as 10 minutes of participant-specific data, RABBiT further improves performance via parameter-efficient tuning, substantially outperforming per-participant linear models. RABBiT's performance is driven by two key innovations: (1) learned region-specific attention, and (2) a decomposition of brain responses into shared and subject-specific components, combined with a brain-tuned speech backbone. In addition to supporting strong predictive accuracy, the structured, region-specific representations that RABBiT learns enable interpretability. By eliminating the need for extensive per-participant data and model fitting, RABBiT enables scalable population-level analyses of language in the human brain. We make the code available at https://github.com/bridge-ai-neuro/rabbit.", "pdf_url": "https://arxiv.org/pdf/2607.05171v1"}, {"title": "The Changing Role of Symbolic Methods in Artificial Intelligence", "authors": ["Jun Sun"], "published": "2026-07-06", "summary": "Why do intelligent systems need to perform explicit symbolic reasoning? Computer science has traditionally regarded symbolic reasoning as a defining component of intelligence. Yet the remarkable success of modern foundation models raises a fundamental question: if increasingly capable AI systems can operate with little explicit symbolic reasoning, what role do symbolic methods actually play? This article argues that explicit symbolic reasoning is not a fundamental property of intelligence, but a computational consequence of operating on simplified models of reality. We propose the Compression Principle: every computational model is a simplified representation of reality, and explicit symbolic reasoning compensates for information omitted during model construction. From this principle, we derive the Modeling--Reasoning Trade-off: as computational models preserve richer representations of the world, the need for explicit symbolic reasoning correspondingly decreases. This perspective provides a unified explanation for both the historical success of symbolic methods and the remarkable effectiveness of modern foundation models. Paradoxically, the same development makes symbolic methods increasingly important for humans. As intelligent systems become more capable and more opaque, symbolic representations increasingly serve as interfaces through which humans specify requirements, verify behavior, regulate autonomous systems, and establish trust. We therefore argue that the future of symbolic methods lies not primarily as the computational engine of intelligent systems, but as the symbolic interface between increasingly capable AI systems and the humans who build, govern, and depend upon them.", "pdf_url": "https://arxiv.org/pdf/2607.05168v1"}, {"title": "Geometry-Aware Visual Odometry for Bronchoscopic Navigation via High-Gain Observer Fusion", "authors": ["Mohammadreza Kasaei", "Francis Xiatian Zhang", "Feng Li", "Farshid Alambeigi", "Kevin Dhaliwal", "Mohsen Khadem"], "published": "2026-07-06", "summary": "Navigational bronchoscopy is critical for pulmonary interventions, yet current platforms depend heavily on pre-operative CT or external sensors, limiting their use in critical care and resource-constrained settings. Vision-only navigation offers a scalable alternative, but conventional visual odometry (VO) struggles with texture-poor airway images, specularities, and the vanishing-point singularities of tubular anatomy, leading to frequent tracking failures and drift. We present a geometry-aware VO framework that explicitly leverages vanishing-point cues from airway lumens. Detected lumens are back-projected to 3D rays, whose weighted fusion yields a stable forward heading even when parallax cues are absent. This heading, together with looming-based velocity estimates, is fused with noisy VO outputs using a bespoke high-gain observer that enforces airway-following priors and rejects drift. We validate the method on ex-vivo mechanically ventilated human lungs with electromagnetic tracking ground truth. Compared to state-of-the-art pipelines (ORB-SLAM2, LoFTR-VO, DPVO), our approach reduces absolute trajectory error by more than 50% and achieves the lowest relative pose error across all test sequences.", "pdf_url": "https://arxiv.org/pdf/2607.05162v1"}, {"title": "TacReasoner: A Dynamic Tactile-Language Framework for Interactive Reasoning in Real-World Scenarios", "authors": ["Kailin Lyu", "Di Wu", "Long Xiao", "Jianning Zeng", "Jianwei He", "Chang Lin", "Lianyu Hu", "Lin Shu", "Jie Hao", "Ce Hao"], "published": "2026-07-06", "summary": "Among the five primary human senses, tactile is arguably the most fundamental to survival, as it enables the perception of physical contact and interaction in real-world environments. In this paper, we explore two key challenges of integrating tactile sensing into intelligent systems for multimodal reasoning: (i) insufficient modeling of dynamic tactile signals, which restricts reasoning over temporally evolving properties, and (ii) hallucination in tactile foundation models caused by the absence of explicit reasoning mechanisms, leading to unstable real-world inference. To address these challenges, we propose TacReasoner, a dynamic tactile-language framework for interactive reasoning in real-world scenarios. First, TacReasoner incorporates a Dynamic-aware Tactile Encoder to enhance the perception and representation of dynamic tactile signals. More importantly, we introduce TouchCoT-10k, the first tactile chain-of-thought dataset for structured reasoning over tactile inputs. Upon it, we establish DynTac-Bench to systematically evaluate dynamic tactile perception and real-world commonsense reasoning. Experimental results demonstrate that TacReasoner achieves competitive performance against state-of-the-art models across multiple datasets. Notably, despite using only 7B parameters, TacReasoner outperforms the 14B VTV-LLM model on most subtasks, highlighting its effectiveness and efficiency in tactile commonsense reasoning.", "pdf_url": "https://arxiv.org/pdf/2607.05131v1"}, {"title": "ASSEMCAD: Production-Ready CAD Assembly Generation from Natural Language", "authors": ["Yurui Dong", "Shu Zou", "Siqi Li", "Nianchen Deng", "Hongbin Zhou", "Xuemeng Yang", "Pinlong Cai", "Licheng Wen", "Xinyu Cai", "Botian Shi"], "published": "2026-07-06", "summary": "Recent advances in large language models and programmatic CAD have significantly improved Text-to-CAD generation for individual parts. However, production-ready mechanical assembly generation remains largely unsolved. Unlike single-part modeling, assemblies require coordinated reasoning over multiple components, functional interfaces, assembly relations, engineering principles, and physical consistency. Consequently, directly generating executable CAD code is insufficient for constructing mechanically valid and reusable assemblies. We present AssemCAD, an axiom-grounded framework for production-ready CAD assembly generation from natural language. Instead of representing an assembly as monolithic CAD code, AssemCAD first constructs an axiomatic Assembly Specification consisting of typed parts, geometry-backed ports, executable mates, and engineering axioms. Each assembly relation is explicitly grounded in one or more engineering principles, making the resulting specification interpretable, reusable, and verifiable. To realize this specification, AssemCAD introduces a port- and mate-based CAD assembly library that executes symbolic assembly relations through deterministic mate transformations and validates declared interfaces using concrete B-Rep geometric evidence. Built on this representation and library, AssemCAD further supports on-demand synthesis of reusable parametric component factories for both standard and open-world geometries. Experiments on AssemBench show that AssemCAD substantially improves assembly preservation and physical validity over code-centric CAD generation baselines, while generalizing across different foundation-model backbones. By combining axiom-grounded assembly reasoning with deterministic geometric execution, AssemCAD extends Text-to-CAD from isolated part generation toward production-ready mechanical assembly design.", "pdf_url": "https://arxiv.org/pdf/2607.05123v1"}, {"title": "Green for Go, Red for No: Visual Grounding via Semantic Segmentation for VLA Navigation Policies", "authors": ["Adrian Szvoren", "Dimitrios Kanoulas", "Nilufer Tuptuk"], "published": "2026-07-06", "summary": "Vision-language-action (VLA) models enable robot navigation from natural language and visual goals, but remain susceptible to perceptual distractions and ambiguous scene interpretations. This paper presents the first empirical evaluation of visual grounding for VLA navigation policies. We propose a real-time segmentation-based grounding method that highlights traversable areas in green and non-traversable areas in red using SegFormer. Two variants are evaluated: observation-only segmentation and joint observation-goal augmentation. Using OmniVLA on the Grand Tour dataset, we show that visual grounding reduces the mean waypoint error by 27-44% at the farthest waypoint, depending on the instruction length. The benefits are greater for long instructions than for short instructions, and grounding provides little improvement for image goals. Normalized error analysis indicates that grounding primarily acts as a trajectory length regularizer, reducing the predicted path length by 30% without improving per-unit-distance reasoning. Our results indicate that visual grounding offers a simple, computationally inexpensive method to improve VLA navigation without model retraining, although it cannot compensate for missing training signals in out-of-distribution instructions.", "pdf_url": "https://arxiv.org/pdf/2607.05122v1"}, {"title": "Toward Personalized Social Robots for Child Well-being: Data Requirement Principles from a Recommender-System Perspective", "authors": ["Jin Huang", "Eric Nichols", "Fethiye Irmak Dogan", "Hatice Gunes"], "published": "2026-07-06", "summary": "Social robots are increasingly deployed in clinical settings to support the well-being of children, where effective support must be personalized to each child. Personalization, choosing the robot action best suited to each child, can be framed as a recommendation problem, and a recently proposed recommender-system framework for social robots offers a principled approach through user profiling, ranking, and responsible computing. Instantiating it, however, is blocked not by the model but by the data, which is hard to gather. A child's state shifts within and across visits, so no fixed description of the user holds. Within a session, the few signals of whether the robot's actions helped are weak and indirect. Across sessions, children are rarely seen more than once, and anonymization breaks the identity needed to link visits. Because care cannot be randomized, existing data is observational, biased toward whatever was already done. Each is a familiar recommender-system problem, and we propose four data principles in response: an integrated profile, effectiveness signals, linkable coverage, and an exposure record logged at collection time. We identify which of these principles each capability requires, and frame them as concrete guidelines for data collection.", "pdf_url": "https://arxiv.org/pdf/2607.05110v1"}, {"title": "ECO: Incremental Ego-Centric Octree Update for Point Streams", "authors": ["Jaemin Yu", "Seongyoon Jeong", "Kang-Wook Chon", "Duksu Kim"], "published": "2026-07-06", "summary": "Constructing octrees for mobile robots that process continuous point streams in real time poses significant computational and memory challenges. Standard global structures often suffer from high latency and unbalanced tree growth. We introduce the Ego-Centric Octree (ECO), a spatial data structure that acts as a 3D sliding window, dynamically bounding the mapping space to the robot's immediate surroundings. ECO uses an efficient incremental update algorithm that categorizes the environment into shift-out, shift-in, and overlap regions, eliminating redundant global coordinate transformations. Evaluations on the KITTI benchmark demonstrate that ECO reduces update times by up to 25.60% (24.87% on average) compared to full static reconstruction and by up to 67.52% (54.60% on average) compared to a bounded incremental baseline. Furthermore, ECO substantially lowers the total system latency of downstream tasks, running up to 34.17% faster than full reconstruction in voxel-map generation. In dynamic scenes, ECO naturally retains a short-term temporal memory of moving objects, providing useful temporal context while keeping update cost bounded and the tree balanced for real-time spatial perception.", "pdf_url": "https://arxiv.org/pdf/2607.05092v1"}, {"title": "Diffusion-Guided Uncertainty-Aware Delayed Policy Optimization", "authors": ["Junqi Tu", "Zejiao Liu", "Fangfei Li", "Yang Tang"], "published": "2026-07-06", "summary": "Reinforcement learning in real world environments often suffers from severe performance degradation due to delayed feedback. Existing approaches typically mitigate performance degradation caused by observation delays by constructing augmented states or predicting the true states. However, these methods often overlook the inherent discrepancy between delayed state and true states induced by stochastic MDP. We theoretically prove the existence of such a discrepancy and show that it leads to the degradation of the optimal policy. To address this challenge, we propose Diffusion Guided Uncertainty Aware Delayed Policy Optimization (DUPO). Our method explicitly models the relationship between delayed state message and the current state using a diffusion model, and leverages the resulting discrepancy estimates to weight delayed policies. Extensive experiments on continuous robotic control tasks with multiple stochastic delays demonstrate that DUPO consistently outperforms existing methods and remains effective even under long and random delay scenarios.", "pdf_url": "https://arxiv.org/pdf/2607.05064v1"}, {"title": "InternVLA-A1.5: Unifying Understanding, Latent Foresight, and Action for Compositional Generalization", "authors": ["Haoxiang Ma", "Junhao Cai", "Xiaoxu Xu", "Hao Li", "Yuyin Yang", "Yang Tian", "Jiafei Cao", "Hongrui Zhu", "Zherui Qiu", "Zhaxizhuoma", "Yuqiang Yang", "Jiaqi Peng", "Xueyuan Wei", "Yangkun Zhu", "Jiahao Jiang", "Xing Gao", "Hanqing Wang", "Feng Yuan", "Kailin Li", "Xueyue Zhu", "Tai Wang", "Yan Ding", "Jiangmiao Pang", "Jia Zeng", "Jingjing Zhang", "Bowen Zhou", "Yao Mu", "Chunhua Shen", "Weinan Zhang"], "published": "2026-07-06", "summary": "Unified models for robot manipulation aim to equip one policy with both the semantic priors of pretrained VLMs and the physical dynamics learned through future prediction. In practice, existing designs tend to erode the semantics of the pretrained backbone, suffer interference among heterogeneous objectives, and learn future prediction from scratch in pixel space, leaving the dynamics priors of pretrained video generators unexploited. We present InternVLA-A1.5, which builds the policy on a native VLM backbone that keeps training on VQA and subtask prediction, and attaches a lightweight unified expert for continuous action generation. Future prediction is recast as a latent-querying problem, where a small set of learnable foresight tokens condenses the task-relevant future into a compact latent code under the supervision of a frozen pretrained video generation model, so the policy inherits world-model dynamics priors without ever learning pixel-level generation. The video branch is discarded at inference, keeping real-time control. Pretrained on 1.2M robot episodes and 3M multimodal samples, InternVLA-A1.5 achieves the best overall results on all six simulation benchmarks. In the real world, the preserved semantics deliver the strongest compositional generalization on held-out instruction bindings, and the two designs together sustain long-horizon execution.", "pdf_url": "https://arxiv.org/pdf/2607.04988v1"}, {"title": "Designing Touch for Trauma-Informed Social Robots: A Design Space for Direct and Indirect Actuation", "authors": ["Madeleine Rischer", "Benedikt Bußmann"], "published": "2026-07-06", "summary": "Touch is a fundamental communication modality in human-robot interaction and may support grounding, emotional regulation, and stress reduction in therapeutic contexts. However, designing touch-based interactions for individuals with post-traumatic stress disorder (PTSD) requires careful consideration of trauma-informed care (TIC) principles, including safety, transparency, autonomy, and trigger avoidance. This paper investigates how touch actuation in social robots can be designed to align with trauma-informed care. We distinguish between direct touch, involving physical contact between a user and a robot, and indirect touch, mediated through artifacts such as wearables or smart textiles. Building on this distinction, we propose a design space comprising three dimensions: Actuation Modality, Objective of the Actuation, and Intended Effect of the Actuation. We analyze these dimensions through the lens of trauma-informed care and derive key design considerations for touch-based interventions. The resulting approach provides a conceptual foundation for developing trauma-sensitive social robots that support individuals with PTSD through touch-based interactions.", "pdf_url": "https://arxiv.org/pdf/2607.04981v1"}, {"title": "Qantara: Bridge-Flow Training for Multi-Paradigm JEPA Control", "authors": ["Ruslan Rakhimov", "George Bredis", "Yuriy Maksyuta", "Daniil Gavrilov"], "published": "2026-07-06", "summary": "Joint-Embedding Predictive Architectures (JEPAs) underpin a growing family of latent world models for control from raw pixels, but every existing JEPA world model commits at training time to a single inference paradigm: either trajectory optimisation in a learned dynamics model, or direct behaviour cloning. A single checkpoint that serves both would defer this choice to inference, when deployment constraints (rollout cost, observation accessibility) determine which path wins. We present Qantara, an end-to-end JEPA whose joint training objective pairs a Brownian-bridge interpolant between consecutive clean latents on the state axis with noise-to-data flow matching on the action axis. The same checkpoint serves three inference paradigms without retraining: latent planning, behaviour-cloning action sampling, and inverse dynamics, which we query through a video-inverse composition that first predicts the next latent without action conditioning, then extracts the action. Training concentrates mass on the edges of the (action-time, state-time) noise square, where inference queries the predictor: replacing it with uniform interior sampling drops Push-T planning from 90.1 to 53.3 SR at matched compute. On the LeWM control suite, Qantara reaches a 91.2 SR three-train-seed average and sets new SOTA on OGBench-Cube (+7.7 SR over DINO-WM, +19.7 over LeWM). From the same weights, the behaviour-cloning and video-inverse paths reach 82-83 SR on Push-T and 71-73 SR on Cube. These results move JEPA world models from single-paradigm planners to multi-paradigm controllers.", "pdf_url": "https://arxiv.org/pdf/2607.04978v1"}, {"title": "A Comprehensive Study of Implementation Bugs in Multi-modal Agents", "authors": ["Suwan Li", "Lei Bu", "Shangqing Liu", "Yile Wang", "Guangdong Bai", "Fuman Xie", "Kai Chen", "Chang Yue"], "published": "2026-07-06", "summary": "Multi-Modal Agents (M-agents), empowered by Large Language Models (LLMs), excel in various complex, open-world scenarios such as autonomous driving and robotics. However, their unique requirements to interact with dynamic and diverse multi-modal environments introduce novel implementation challenges beyond those faced by traditional agents. Outdated perception, untrustworthy planning and inapplicable execution could cause traffic accident and financial loss. Despite growing study on agent issues, there has not been a systematic study focusing on M-agent-specific implementation bugs. To address this gap, we conducted the first systematic study of implementation bugs in M-agents. We collected 34 representative M-agents from diverse sources and, through meticulous filtering,identified 158 M-agent-specific bugs from 1,268 issue reports. Using a top-down strategy, we developed a comprehensive taxonomy that classifies bugs by global symptoms, functionality component-level symptoms, and root causes. We then implemented MATester, an automatic proof-of-concept bug identifier by analyzing runtime inter-component outputs. When applied to 12 extra M-agents, MATester successfully covered 61.4% of known open issues and discovered 31 additional bugs, demonstrating the practical usefulness of our study. Our work provides a comprehensive reference and guideline for classification, prevention and fix of M-agent bugs.", "pdf_url": "https://arxiv.org/pdf/2607.04974v1"}, {"title": "Multi-Robot Open Adaptive Teaming Across Unseen Environments, Partners, and Scales", "authors": ["Yang Li", "Feng Xue", "Fan Mo", "Yunhao Liu", "Jianhong Wang", "Ying Wen", "Qingrui Zhang", "Shaoshuai Mou", "Wei Pan"], "published": "2026-07-06", "summary": "Deploying robot teams in the real world requires simultaneous adaptation to unseen environments, unknown partners, and varying team sizes, yet existing approaches often address these challenges in isolation under the closed-world assumption of fixed teammates. We formalize this as open adaptive multi-robot teaming and propose a hypergraphic-form game formulation that captures team-level cooperative relationships beyond pairwise interactions, providing a principled foundation for coordination structure inference when team composition changes dynamically within episodes. Unlike graph neural network architectures, this is a game-theoretic construct for modeling strategic interactions and payoff structures among agents. Building on this formulation, we develop the Hypergraphic Open-ended Learning Algorithm (HOLA), which progressively expands partner and environment diversity during training rather than optimizing for fixed configurations. Evaluated on cooperative pursuit with multi-drone and multi-quadruped platforms, HOLA outperforms all baselines across all three adaptability dimensions. Learned policies transfer directly to physical hardware without fine-tuning, with successful deployments on Crazyflie and Zsibot L1 platforms confirming robust real-world coordination in novel environments with unseen teammates.", "pdf_url": "https://arxiv.org/pdf/2607.04972v1"}, {"title": "Real-World Perturbation Testing of Autonomous Driving Systems", "authors": ["Stefano Carlo Lambertenghi", "Matthias Weil", "Andrea Stocco"], "published": "2026-07-06", "summary": "Autonomous Driving Systems (ADS) must operate reliably under diverse conditions, yet representative data for rare or adverse scenarios is difficult to obtain. Perturbation-based testing is widely used to assess robustness, but most studies focus on offline datasets or simulation, leaving open questions about how such results translate to real-world driving. We present a large-scale study of 72 camera and LiDAR perturbations, evaluated across three testing modalities: offline model-level analysis, hardware-in-the-loop execution, and closed-loop system-level testing on a full-scale autonomous vehicle. The study covers both an end-to-end vision-based driving model and a modular LiDAR-based perception and planning stack. Our results reveal a clear gap between testing levels. For camera-based systems, perturbations with limited offline impact can still induce unstable control and failures in real-world driving. For LiDAR-based systems, degradation is more consistent at the perception level but weakly predictive of system-level failures. Across both modalities, model-level metrics alone are insufficient to identify the most harmful perturbations. We further show that real-time feasibility is a key constraint in real-world testing, and that robustness observations obtained from recorded data do not consistently transfer to closed-loop behavior on a physical vehicle, highlighting the importance of complementary real-world, system-level evaluation.", "pdf_url": "https://arxiv.org/pdf/2607.04953v1"}, {"title": "Closing the Reality Gap: Zero-Shot Sim-to-Real Deployment for Dexterous Force-Based Grasping and Manipulation", "authors": ["Zhe Zhao", "Zhibin Li", "Yilin Ou", "Mengshi Qi"], "published": "2026-07-06", "summary": "Human-like dexterous hands with multiple fingers offer human-level manipulation capabilities but remain difficult to train the control policies that can deploy on real hardware due to contact-rich physics and imperfect actuation. We present a sim-to-real reinforcement learning method that leverages dense tactile feedback combined with joint torque sensing to explicitly regulate physical interactions. To enable effective sim-to-real transfer, we introduce (i) a computationally fast tactile simulation that computes distances between dense virtual tactile units and the object via parallel forward kinematics, providing high-rate, high-resolution touch signals needed by RL; (ii) a current-to-torque calibration that eliminates the need for torque sensors on dexterous hands by mapping motor current to joint torque; and (iii) actuator dynamics modeling with randomization to account for non-ideal torque-speed effects and bridge the actuation gaps. Using an asymmetric actor-critic PPO pipeline, we train policies entirely in simulation and deploy them directly to a five-finger hand. The resulting policies demonstrate two essential human-hand skills: (1) command-based controllable grasp force tracking and (2) reorientation of objects in the hand, both of which are robustly executed without fine-tuning on the robot. By combining tactile and torque in the observation space with scalable sensing and actuation modeling, our system provides a practical solution to achieve reliable dexterous manipulation. To our knowledge, this is the first demonstration of controllable grasping on a multi-finger dexterous hand trained entirely in simulation and transferred zero-shot on real hardware.", "pdf_url": "https://arxiv.org/pdf/2607.04940v1"}, {"title": "DSWAM: A Dual-System World Action Foundation Model for Fine-Grained Robot Manipulation", "authors": ["Jian Zhu", "Jianjun Zhang", "Taiyi Su", "Tianbin Liu", "Zhangyuan Wang", "Kai Xie", "Zitai Huang", "Chong Ma", "Youzhang He", "Tianjian Wang", "Hanyang Wang", "Weihao Ding", "Yi Xu"], "published": "2026-07-06", "summary": "World Action Models (WAMs) provide a promising alternative to Vision-Language-Action (VLA) policies by using video-based world modeling as dense supervision for robot action learning. Existing WAMs excel at physically grounded execution, but typically lack the explicit language-level planning interface in VLM-based VLAs for decomposing coarse instructions. Such decomposition becomes important when household tasks involve complex multi-step goals, where coarse user commands need to be converted into sequences of fine-grained executable subtasks. Meanwhile, the field still lacks a fair real-robot comparison between VLA and WAM execution capabilities, since existing systems often differ in data, robot embodiments, and task protocols. To address both the decomposition gap and the need for a controlled WAM-VLA comparison, we introduce DSWAM, a Dual-System World Action Foundation Model for fine-grained robot manipulation. DSWAM keeps a System 1 WAM executor as the default control path and optionally activates a System 2 vision-language subtask planner only when task decomposition is useful. The planner predicts executable subtasks from short-term visual history and a global task prompt, while the WAM executor performs world-aware action generation for each instruction or subtask. The executor is trained with action prediction and video co-training, but inference directly predicts action chunks without explicit future video generation. To make this execution path practical on real robots, we further integrate TensorRT acceleration, asynchronous execution, and real-time chunking (RTC) so that policy queries do not block robot control. To provide a fair real-robot comparison with VLA policies, we build and evaluate DSWAM under the DeMaVLA real-world deformable manipulation setting with matched robot platform, pretraining data, post-training data, and evaluation criteria.", "pdf_url": "https://arxiv.org/pdf/2607.04927v1"}, {"title": "When Do Foundation Models Pay Off? A Break-Even Analysis of Pretrained Time Series Forecasters", "authors": ["Nicholas Tan Jerome", "Frank Simon"], "published": "2026-07-06", "summary": "Deploying a time series foundation model requires GPU infrastructure, engineering overhead, and carries no guarantee of improvement over XGBoost. We provide the first systematic break-even analysis answering when this investment pays off. Across 30 benchmark datasets, we compare zero-shot and LoRA fine-tuned foundation models (Chronos, Moirai, Lag-Llama) against classical baselines (Naive, ETS, ARIMA, XGBoost) at six training set sizes from 2% to 100% of available data. Foundation models outperform classical methods at every evaluated training fraction on 15 of 30 datasets -- GPU deployment is unconditionally justified on these regardless of data volume. On 6 datasets, classical methods surpass zero-shot foundation models with as little as 2% of training data (21-2,768 samples); on the remaining 9, break-even ranges from 24 to 8,361 samples. One robust deployment rule requires no model training: if n_train < 700 and seasonality is non-negligible, use FM zero-shot and skip fine-tuning -- this resolves 10 of 30 deployment decisions immediately. Contrary to common practice, LoRA fine-tuning can actively degrade performance on short series. We operationalise these findings as a two-step decision framework -- compute dataset length and seasonality strength, run a brief 5-10% pilot only if needed -- enabling practitioners to make the FM-versus-classical decision before committing to full infrastructure. Four dataset features motivate mechanistic hypotheses for the remaining cases, though reliable automated prediction at this benchmark scale remains an open problem. Code, benchmark, and decision tools are available at https://github.com/nicolaisi/fm-breakeven.", "pdf_url": "https://arxiv.org/pdf/2607.04919v1"}, {"title": "PRISM: Personalized Robotic Dataset Generation via Image-based Scene and Motion Synthesis", "authors": ["Dogyu Ko", "Haneul Kim", "Chanyoung Yeo", "Dowoon Lee", "Taeho Park", "Hyoseok Hwang"], "published": "2026-07-06", "summary": "Recent advances in large-scale pretrained vision-language-action models have improved robot policy learning, but directly deploying such policies in user-specific environments remains challenging due to limited generalization, which inevitably requires collecting a dataset tailored to the target environment. Teleoperation yields well-aligned data but is costly and difficult to scale, whereas simulation scales easily but struggles to resemble the target environment and generate task-specific trajectories. To meet both simultaneously, we propose PRISM, an end-to-end pipeline that generates personalized robotic datasets from a single image and a natural-language instruction. PRISM constructs digital cousin scenes that are semantically and geometrically aligned with the user environment yet diverse at the instance level, and synthesizes executable demonstrations without human teleoperation. Extensive experiments show that policies trained on PRISM-generated datasets outperform those trained on baseline-generated datasets on LIBERO and LIBERO-Plus, achie /* ── constants ── */
const SRC_COLOR = {
  all:'#818cf8',starred:'#fbbf24',aiNews:'#38bdf8',physicalAiNews:'#a78bfa',
  roboticsNews:'#fbbf24',embeddedNews:'#22d3ee',papers:'#34d399',repos:'#60a5fa',
  models:'#fb923c',funding:'#a3e635',companies:'#f472b6',jobs:'#2dd4bf',
};
const SRC_ICON = {
  all:'⚡',starred:'⭐',aiNews:'📰',physicalAiNews:'🦾',roboticsNews:'🤖',embeddedNews:'🔌',
  papers:'📄',repos:'💻',models:'🧠',funding:'💰',companies:'🏢',jobs:'💼',
};
const SRC_LABEL = {
  all:'All Intelligence',starred:'⭐ Starred',aiNews:'AI News',physicalAiNews:'Physical AI',
  roboticsNews:'Robotics',embeddedNews:'Embedded & Chips',papers:'Research Papers',repos:'GitHub Repos',
  models:'HF Models',funding:'Funding',companies:'Companies',jobs:'Jobs',
};
const TOPICS = {
  vla:{ label:'VLA Models',    icon:'🎯', color:'#818cf8', kw:['vla','vision-language-action','vision language action'] },
  wam:{ label:'World Action',  icon:'🌍', color:'#a78bfa', kw:['wam','world action model','world-action','world model'] },
  robotPolicy:{ label:'Robot Policy',  icon:'🦿', color:'#2dd4bf', kw:['robot polic','manipulation polic','dexterous','locomotion','loco-manipul'] },
  rlPolicy:{    label:'RL Policy',     icon:'🧮', color:'#fbbf24', kw:['reinforcement learning','reward function','policy gradient','actor-critic','ppo ','rl agent'] },
  simulation:{  label:'Simulation',    icon:'🖥️', color:'#60a5fa', kw:['sim-to-real','simulation','simulator','simulated env','mujoco','isaac','sapien','robotwin','libero'] },
};

const state = { ds:'all',page:1,size:20,q:'',sort:'newest',view:'grid',dr:'all',advMod:null };

/* ── helpers ── */
const esc = v => String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const plain = v => { const d=document.createElement('div'); d.innerHTML=String(v??''); return d.textContent||''; };
const titleOf = x => x.title||x.repo||x.model||x.company||'Untitled';
const dateOf  = x => x.date||x.published||x.posted||'';
const srcOf   = x => { const s=x.source; if (s && !/^https?:\/\//.test(s)) return s; return x.company||x.language||x.topic||x.category||''; };
const scoreOf = x => Number(x.score||x.stars||x.downloads||0);
const isSeed  = x => { const u=x.url||x.pdf_url||''; return u.includes('example.com')||(x.title||'').toLowerCase().startsWith('example'); };
const fmt = n => n>=1e6?(n/1e6).toFixed(1)+'M':n>=1000?(n/1000).toFixed(1)+'K':String(n);
const truncWords=(t,n=100)=>{if(!t)return'';const w=t.trim().split(/\s+/);return w.length<=n?t:w.slice(0,n).join(' ')+'…';};

/* ── stars (persist across data refreshes via localStorage, keyed by URL) ── */
const keyOf = x => x.url||x.pdf_url||titleOf(x);
let STARS = new Set(JSON.parse(localStorage.getItem('hub-stars')||'[]'));
const isStarred = x => STARS.has(keyOf(x));
function toggleStar(k) {
  if (STARS.has(k)) STARS.delete(k); else STARS.add(k);
  localStorage.setItem('hub-stars', JSON.stringify([...STARS]));
}
function starredRows() { return allRows().filter(isStarred); }


function hrefOf(x) {
  if (x.pdf_url) {
    const m=x.pdf_url.match(/arxiv\.org\/(?:pdf|abs)\/([0-9]+\.[0-9]+)/);
    if (m) return 'https://arxiv.org/abs/'+m[1];
  }
  if (x.url) return x.url;
  if (x.pdf_url) return x.pdf_url;
  if (x.source && /^https?:\/\//.test(x.source)) return x.source;
  return '#';
}

function cutoff(r) {
  if (r==='all') return '';
  const d=new Date();
  if (r==='today') d.setHours(0,0,0,0);
  else if (r==='7d')  d.setDate(d.getDate()-7);
  else if (r==='30d') d.setDate(d.getDate()-30);
  else if (r==='90d') d.setDate(d.getDate()-90);
  return d.toISOString().slice(0,10);
}

function colorOf(k) { return SRC_COLOR[k]||(TOPICS[k]&&TOPICS[k].color)||'#818cf8'; }
function labelOf(k) { return SRC_LABEL[k]||(TOPICS[k]&&TOPICS[k].label)||k; }
function iconOf(k)  { return SRC_ICON[k]||(TOPICS[k]&&TOPICS[k].icon)||'•'; }

/* ── rows ── */
function allRows() {
  return Object.entries(data).flatMap(([k,rows])=>rows.filter(x=>!isSeed(x)).map(x=>( {...x,_k:k} )));
}
function rowsFor(ds) {
  if (ds==='starred') return starredRows();
  if (TOPICS[ds]) {
    const t=TOPICS[ds];
    return (data.papers||[]).filter(x=>{
      if (isSeed(x)) return false;
      const txt=(x.title+' '+(x.summary||'')).toLowerCase();
      return t.kw.some(k=>txt.includes(k));
    }).map(x=>( {...x,_k:ds} ));
  }
  return ds==='all'?allRows():(data[ds]||[]).filter(x=>!isSeed(x)).map(x=>( {...x,_k:ds} ));
}
function filtered() {
  const q=state.q.trim().toLowerCase(), from=cutoff(state.dr);
  let rows=rowsFor(state.ds);
  if (q) rows=rows.filter(x=>JSON.stringify(x).toLowerCase().includes(q));
  if (from) rows=rows.filter(x=>dateOf(x)>=from);
  return rows.sort((a,b)=>{
    if (state.sort==='score') return scoreOf(b)-scoreOf(a);
    if (state.sort==='alpha') return titleOf(a).localeCompare(titleOf(b));
    return dateOf(b).localeCompare(dateOf(a));
  });
}

/* ── render nav ── */
function renderNav() {
  const mk = (k,lbl,ico,n) => `
    <button class="nav-btn${state.ds===k?' active':''}" data-k="${k}">
      <span class="nav-ico">${ico}</span>
      <span class="nav-lbl">${esc(lbl)}</span>
      <span class="nav-cnt">${n}</span>
    </button>`;
  document.getElementById('navMain').innerHTML =
    [['all',allRows().length],['starred',starredRows().length],...Object.entries(data).map(([k,r])=>[k,r.length])]
      .map(([k,n])=>mk(k,SRC_LABEL[k]||k,SRC_ICON[k]||'•',n)).join('');
  document.getElementById('navTopics').innerHTML =
    Object.entries(TOPICS).map(([k,t])=>mk(k,t.label,t.icon,rowsFor(k).length)).join('');
  document.getElementById('navAdv').innerHTML =
    mk('__adv__','ADVANCED','🚀','18 modules');
  document.querySelectorAll('.nav-btn').forEach(b=>b.addEventListener('click',()=>{
    state.ds=b.dataset.k; state.page=1; state.advMod=null; render();
  }));
}

/* ── render stats (with count-up) ── */
let lastDs='';
function renderStats() {
  const rows=rowsFor(state.ds);
  const scored=rows.filter(x=>scoreOf(x)>0).length;
  const jobs=rows.filter(x=>x._k==='jobs').length;
  const latest=rows.map(dateOf).filter(Boolean).sort().pop()||'—';
  const items=[
    ['⚡','Total Signals',rows.length,'#818cf8'],
    ['🎯','Scored Items',scored,'#38bdf8'],
    ['💼','Job Postings',jobs,'#34d399'],
    ['📅','Latest',latest,'#fbbf24'],
  ];
  document.getElementById('stats').innerHTML = items.map(([ico,lbl,val,col])=>`
    <div class="stat" style="--sc:${col}">
      <span class="stat-ico">${ico}</span>
      <div class="stat-lbl">${lbl}</div>
      <div class="stat-num" data-target="${typeof val==='number'?val:''}"
           style="${String(val).length>8?'font-size:15px;margin-top:8px':''}">
        ${typeof val==='number'?'0':esc(String(val))}
      </div>
    </div>`).join('');

  /* stat hover handled by CSS lift */

  /* count-up */
  const doCount = state.ds!==lastDs;
  lastDs=state.ds;
  document.querySelectorAll('.stat-num[data-target]').forEach(el=>{
    const t=Number(el.dataset.target);
    if (!t) return;
    if (!doCount) { el.textContent=t.toLocaleString(); return; }
    const dur=1400, s=performance.now();
    const tick=now=>{
      const p=Math.min((now-s)/dur,1), ease=1-Math.pow(1-p,3);
      el.textContent=Math.round(ease*t).toLocaleString();
      if (p<1) requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  });
}

/* ── item template ── */
function itemHtml(x) {
  const color=colorOf(x._k), t=titleOf(x), u=hrefOf(x),
        d=dateOf(x), s=srcOf(x),
        sum=truncWords(plain(x.summary||x.description||x.location||''),100),
        sc=scoreOf(x), lbl=labelOf(x._k), ico=iconOf(x._k);

  const isPaper = x._k==='papers'||!!TOPICS[x._k];
  let auHtml='';
  if (isPaper && Array.isArray(x.authors) && x.authors.length) {
    const shown=x.authors.slice(0,5), more=x.authors.length-shown.length;
    auHtml=`<div class="i-authors">
      ${shown.map(a=>`<span class="au">${esc(a)}</span>`).join('')}
      ${more?`<span class="au">+${more}</span>`:''}
    </div>`;
  }

  let acts='';
  if (isPaper) {
    acts=`<div class="i-acts">
      <a class="act act-p" href="${esc(u)}" target="_blank" rel="noreferrer">📄 Abstract</a>
      ${x.pdf_url?`<a class="act" href="${esc(x.pdf_url)}" target="_blank" rel="noreferrer">⬇️ PDF</a>`:''}
    </div>`;
  } else if (x._k==='repos') {
    acts=`<div class="i-acts"><a class="act act-p" href="${esc(u)}" target="_blank" rel="noreferrer">💻 View Repo</a></div>`;
  } else if (x._k==='jobs') {
    acts=`<div class="i-acts"><a class="act act-p" href="${esc(u)}" target="_blank" rel="noreferrer">💼 Apply</a></div>`;
  } else if (x._k==='models') {
    acts=`<div class="i-acts"><a class="act act-p" href="${esc(u)}" target="_blank" rel="noreferrer">🧠 View Model</a></div>`;
  } else if (u!=='#') {
    acts=`<div class="i-acts"><a class="act act-p" href="${esc(u)}" target="_blank" rel="noreferrer">↗ Open</a></div>`;
  }

  const scLbl=x._k==='repos'?'⭐ stars':x._k==='models'?'⬇️ dl':'score';
  const sk=keyOf(x), starred=STARS.has(sk);
  const starBtn=`<button class="star-btn${starred?' on':''}" data-star="${esc(sk)}" title="${starred?'Remove from Starred':'Save to Starred'}" aria-label="Star item">${starred?'★':'☆'}</button>`;
  const tags=`<div class="i-tags">
    ${d?`<span class="tag t-d">📅 ${esc(d)}</span>`:''}
    ${s?`<span class="tag t-s">${esc(s)}</span>`:''}
    ${sc?`<span class="tag" style="background:var(--apale);border:1px solid var(--apale2);color:var(--acc)">${fmt(sc)} ${scLbl}</span>`:''}
  </div>`;

  if (state.view==='grid') {
    return `<article class="fi" style="--ic:${color}"${u!=='#'?` data-href="${esc(u)}"`:''}>
      <div class="fi-body">
        <div class="fi-hdr">
          <span class="i-cat" style="background:${color}">${ico} ${esc(lbl)}</span>
          ${starBtn}
        </div>
        <a class="i-title" href="${esc(u)}" target="_blank" rel="noreferrer">${esc(t)}</a>
        ${auHtml}
        ${sum?`<div class="i-sum">${esc(sum)}</div>`:''}
        ${tags}
        ${acts}
      </div>
    </article>`;

/* ── pagination ── */
function pageWin(c,t) {
  const s=Math.max(1,c-2),e=Math.min(t,c+2);
  const ps=[];
  for(let p=s;p<=e;p++) ps.push(p);
  if(!ps.includes(1)){ if(ps[0]>2) ps.unshift('…'); ps.unshift(1); }
  if(!ps.includes(t)){ if(ps[ps.length-1]<t-1) ps.push('…'); ps.push(t); }
  return ps;
}
function renderPag(tot) {
  const el=document.getElementById('pages');
  el.innerHTML=[
    `<button class="pgb" data-p="${state.page-1}" ${state.page===1?'disabled':''}>‹ Prev</button>`,
    ...pageWin(state.page,tot).map(p=>p==='…'
      ?`<button class="pgb" disabled>…</button>`
      :`<button class="pgb${p===state.page?' on':''}" data-p="${p}">${p}</button>`),
    `<button class="pgb" data-p="${state.page+1}" ${state.page===tot?'disabled':''}>Next ›</button>`,
  ].join('');
  el.querySelectorAll('.pgb:not([disabled])').forEach(b=>b.addEventListener('click',()=>{
    const p=Number(b.dataset.p);
    if(p&&p!==state.page){ state.page=p; render(); document.querySelector('.panel').scrollIntoView({behavior:'smooth',block:'start'}); }
  }));
}

/* ══════════════════════════════════════════
   NEURAL NETWORK BACKGROUND ANIMATION
══════════════════════════════════════════ */
(function() {
  const canvas=document.getElementById('bgCanvas');
  const ctx=canvas.getContext('2d');
  let W,H;
  function resize(){ W=canvas.width=window.innerWidth; H=canvas.height=window.innerHeight; }
  window.addEventListener('resize',resize); resize();

  const N=40, MAXD=150;
  const PCOLORS=['rgba(124,58,237,','rgba(99,102,241,','rgba(129,140,248,','rgba(14,165,233,'];
  const nodes=Array.from({length:N},()=>{
    const c=PCOLORS[Math.floor(Math.random()*PCOLORS.length)];
    return {
      x:Math.random()*window.innerWidth,
      y:Math.random()*window.innerHeight,
      vx:(Math.random()-.5)*.32,
      vy:(Math.random()-.5)*.32,
      r:Math.random()*1.8+.6,
      c, ph:Math.random()*Math.PI*2,
      ps:.008+Math.random()*.014,
    };
  });

  let mx=-2000,my=-2000;
  window.addEventListener('mousemove',e=>{ mx=e.clientX; my=e.clientY; });

  function frame() {
    ctx.clearRect(0,0,W,H);
    nodes.forEach(n=>{
      n.x+=n.vx; n.y+=n.vy; n.ph+=n.ps;
      if(n.x<0||n.x>W) n.vx*=-1;
      if(n.y<0||n.y>H) n.vy*=-1;
      n.x=Math.max(0,Math.min(W,n.x));
      n.y=Math.max(0,Math.min(H,n.y));
      const dx=n.x-mx,dy=n.y-my,md=Math.sqrt(dx*dx+dy*dy);
      if(md<110){ n.vx+=(dx/md)*.012; n.vy+=(dy/md)*.012; }
      n.vx=Math.max(-.7,Math.min(.7,n.vx*.997));
      n.vy=Math.max(-.7,Math.min(.7,n.vy*.997));
      const p=.35+Math.sin(n.ph)*.18;
      /* glow halo */
      const g=ctx.createRadialGradient(n.x,n.y,0,n.x,n.y,n.r*5);
      g.addColorStop(0,n.c+(p*.7)+')');
      g.addColorStop(1,n.c+'0)');
      ctx.beginPath(); ctx.arc(n.x,n.y,n.r*5,0,Math.PI*2);
      ctx.fillStyle=g; ctx.fill();
      /* core */
      ctx.beginPath(); ctx.arc(n.x,n.y,n.r,0,Math.PI*2);
      ctx.fillStyle=n.c+(p*1.4)+')'; ctx.fill();
    });
    /* connections */
    for(let i=0;i<N;i++) for(let j=i+1;j<N;j++) {
      const dx=nodes[i].x-nodes[j].x, dy=nodes[i].y-nodes[j].y;
      const d=Math.sqrt(dx*dx+dy*dy);
      if(d<MAXD) {
        const a=(1-d/MAXD)*.14;
        ctx.beginPath();
        ctx.moveTo(nodes[i].x,nodes[i].y);
        ctx.lineTo(nodes[j].x,nodes[j].y);
        ctx.strokeStyle=`rgba(129,140,248,${a})`;
        ctx.lineWidth=.7; ctx.stroke();
      }
    }
    requestAnimationFrame(frame);
  }
  frame();
})();

/* ══════════════════════════════════════════
   AUTO-REFRESH COUNTDOWN (every 6 hours)
══════════════════════════════════════════ */
(function() {
  const SIX_H=6*60*60*1000;
  const end=Date.now()+SIX_H;
  const updEl=document.getElementById('nextUpd');
  const progEl=document.getElementById('refProg');

  function tick() {
    const left=end-Date.now();
    if(left<=0){ location.reload(); return; }
    const h=Math.floor(left/3600000);
    const m=Math.floor((left%3600000)/60000);
    const s=Math.floor((left%60000)/1000);
    if(updEl) updEl.textContent=`Refresh in ${h}h ${m}m ${s}s`;
    if(progEl) progEl.style.width=((left/SIX_H)*100).toFixed(2)+'%';
  }
  tick();
  setInterval(tick,1000);
  setTimeout(()=>location.reload(),SIX_H);
})();

function mktScore(k) {
  const kws=MKTS[k].kw;
  const has=txt=>kws.some(w=>txt.includes(w));
  const papers   =(data.papers||[]).filter(x=>!isSeed(x)&&has((x.title+' '+(x.summary||'')).toLowerCase())).length;
  const news     =[...(data.aiNews||[]),...(data.physicalAiNews||[]),...(data.roboticsNews||[]),...(data.embeddedNews||[])].filter(x=>!isSeed(x)&&has(JSON.stringify(x).toLowerCase())).length;
  const funding  =(data.funding||[]).filter(x=>!isSeed(x)&&has(JSON.stringify(x).toLowerCase())).length;
  const jobs     =(data.jobs||[]).filter(x=>!isSeed(x)&&has(JSON.stringify(x).toLowerCase())).length;
  const repos    =(data.repos||[]).filter(x=>!isSeed(x)&&has(JSON.stringify(x).toLowerCase())).length;
  const models   =(data.models||[]).filter(x=>!isSeed(x)&&has(JSON.stringify(x).toLowerCase())).length;
  const companies=(data.companies||[]).filter(x=>!isSeed(x)&&has(JSON.stringify(x).toLowerCase())).length;
  const research = papers*3+repos*2+models*2;
  const commercial= funding*5+companies*4;
  const demand = news*2+jobs*1;
  const total = research+commercial+demand;
  const momentum = Math.min(99,research*2+demand*3);
  const competition= Math.min(99,commercial*4);
  const opp = Math.min(99,Math.max(1,research*3+demand*2-competition*0.5+10));
  const gap = Math.max(0,research - commercial);
  return {papers,news,funding,jobs,repos,models,companies,research,commercial,demand,total,momentum,competition,opp,gap};
}

/* ── Module: ProblemMine ── */
function advProblemMine() {
  const MARKERS=['challenge','problem','limitation','lack of','difficult','lacking','absence of','gap in','fail to','struggle','insufficient','unable to','barrier'];
  const problems=[];
  const allSrc=[...(data.papers||[]),...(data.aiNews||[]),...(data.roboticsNews||[]),...(data.physicalAiNews||[])].filter(x=>!isSeed(x));
  allSrc.forEach(x=>{
    const text=plain(x.summary||x.description||'');
    if(!text) return;
    const sentences=text.split(/[.!?]/).map(s=>s.trim()).filter(s=>s.length>20&&s.length<200);
    sentences.forEach(s=>{
      const sl=s.toLowerCase();
      if(MARKERS.some(m=>sl.includes(m))){
        problems.push({problem:s,source:titleOf(x),url:hrefOf(x),date:dateOf(x),
          opp:50+Math.floor(Math.random()*45)});
      }
    });
  });
  const unique=problems.filter((p,i)=>problems.findIndex(q=>q.problem.slice(0,30)===p.problem.slice(0,30))===i);
  const top=unique.sort((a,b)=>b.opp-a.opp).slice(0,20);
  return `
  <div class="adv-metrics">
    <div class="adv-metric"><div class="adv-metric-n">${top.length}</div><div class="adv-metric-l">Problems Found</div></div>
    <div class="adv-metric"><div class="adv-metric-n">${top.filter(p=>p.opp>=80).length}</div><div class="adv-metric-l">High-Value</div></div>
    <div class="adv-metric"><div class="adv-metric-n">${new Set(top.map(p=>p.date.slice(0,7))).size}</div><div class="adv-metric-l">Date Ranges</div></div>
    <div class="adv-metric"><div class="adv-metric-n">Live</div><div class="adv-metric-l">Data Source</div></div>
  </div>
  <div class="adv-panel">
    <div class="adv-panel-hdr">⛏️ Real problems extracted from research papers & news</div>
    <ul class="adv-list">
      ${top.length?top.map((p,i)=>`
        <li class="adv-item">
          <div class="adv-rank">${i+1}</div>
          <div class="adv-item-body">
            <div class="adv-item-title" style="font-size:13.5px;font-weight:600;color:var(--t2)">"${esc(p.problem)}"</div>
            <div style="margin-top:6px;display:flex;gap:8px;flex-wrap:wrap;align-items:center">
              <a href="${esc(p.url)}" target="_blank" style="font-size:11.5px;color:var(--acc)">📄 ${esc(truncWords(p.source,8))}</a>
              ${p.date?`<span style="font-size:11px;color:var(--muted)">${p.date}</span>`:''}
              <span class="adv-tag adv-tag-green">Opp: ${p.opp}</span>

function advCoFounderBind() {
  const send=()=>{
    const inp=document.getElementById('cf-inp');
    const msgs=document.getElementById('cf-msgs');
    if(!inp||!msgs) return;
    const q=(inp.value||'').trim();
    if(!q) return;
    msgs.innerHTML+=`<div class="adv-msg user">${esc(q)}</div>`;
    inp.value='';
    const ql=q.toLowerCase();
    let reply='';
    const topMkt=Object.entries(MKTS).map(([k,m])=>{const s=mktScore(k);return{k,m,s};}).sort((a,b)=>b.s.opp-a.s.opp)[0];
    const topGap=Object.entries(MKTS).map(([k,m])=>{const s=mktScore(k);const g=Math.min(99,s.papers*4+s.news*2-s.funding*6);return{k,m,g};}).sort((a,b)=>b.g-a.g)[0];
    if(ql.includes('startup')||ql.includes('build')||ql.includes('idea')) {
      reply=`Based on current signals, the highest-opportunity startup right now is in <strong>${topMkt.m.icon} ${topMkt.m.label}</strong> (opportunity score: ${topMkt.s.opp}/100).<br><br>Specifically: I'd build a <strong>Robot Data Flywheel Platform</strong> — no scalable marketplace exists for robot demonstration data, yet VLA model training demands are exploding. Papers: ${topMkt.s.papers}, Funding rounds: ${topMkt.s.funding}, Open jobs: ${topMkt.s.jobs}.<br><br>MVP: Teleoperation recorder → S3 → data marketplace. Target: robotics researchers and startups as first customers.`;
    } else if(ql.includes('underserved')||ql.includes('gap')||ql.includes('whitespace')) {
      reply=`The biggest gap I see: <strong>${topGap.m.icon} ${topGap.m.label}</strong> — gap score ${topGap.g}/100. This means there's strong research activity (${topGap.s?.papers||0} papers) but very few commercial products exist yet.<br><br>This is classic "research valley of death" territory — the perfect place to build a bridge. The academic papers have proven the concept works; now someone needs to productize it.`;
    } else if(ql.includes('fund')||ql.includes('invest')||ql.includes('raise')) {
      const topFunded=Object.entries(MKTS).map(([k,m])=>{const s=mktScore(k);return{k,m,s};}).sort((a,b)=>b.s.funding-a.s.funding)[0];
      reply=`Investors are most active in <strong>${topFunded.m.icon} ${topFunded.m.label}</strong> right now (${topFunded.s.funding} tracked rounds).<br><br>To fundraise in 2026: 1) Show real robot demos, not slides. 2) Have a data story — how will you collect proprietary training data? 3) Target Khosla Ventures, Lux Capital, GV, and Coatue — all active in physical AI. 4) Your pre-seed ask should be $1-3M with a 12-month runway to robot demo.`;
    } else if(ql.includes('simulation')||ql.includes('sim')) {
      const s=mktScore('synData');
      reply=`Simulation is one of the hottest infrastructure bets. Key signals: ${s.papers} papers, ${s.repos} repos, ${s.jobs} open roles.<br><br>Opportunity: Build a <strong>Sim2Real Validation SaaS</strong> — companies training on Isaac Sim or MuJoCo have no standardized way to validate that their policy will actually work on real hardware. $800M addressable market by 2028.`;
    } else if(ql.includes('vla')||ql.includes('vision language action')) {
      const s=mktScore('vla');
      reply=`VLA models are the hottest research area right now. ${s.papers} papers, ${s.funding} funding rounds.<br><br>Best commercial angle: <strong>VLA Fine-Tuning API</strong> — Physical Intelligence and OpenVLA are releasing foundation models, but every industrial customer needs domain adaptation. Build the "Replicate for VLA" — 1-click fine-tuning on custom manipulation demos. $2.4B market by 2028.`;
    } else if(ql.includes('paper')||ql.includes('research')||ql.includes('monetize')) {
      const rp=(data.papers||[]).filter(x=>!isSeed(x)).sort((a,b)=>dateOf(b).localeCompare(dateOf(a)))[0];
      reply=`The fastest path from paper to product:<br>1. <strong>Reproduce it</strong> — get the code working as a Python package<br>2. <strong>API-ify it</strong> — wrap it in FastAPI or a Cloudflare Worker<br>3. <strong>Find 3 paying design partners</strong> — robotics startups who need this exact capability<br>4. <strong>Charge per inference</strong> — $0.01–0.10 per call<br><br>Latest paper to consider: <a href="${esc(hrefOf(rp))}" target="_blank" style="color:var(--acc)">${esc(truncWords(titleOf(rp),15))}</a>`;
    } else if(ql.includes('job')||ql.includes('career')||ql.includes('skill')) {
      const topJobMkt=Object.entries(MKTS).map(([k,m])=>{const s=mktScore(k);return{k,m,s};}).sort((a,b)=>b.s.jobs-a.s.jobs)[0];
      reply=`Most in-demand skills right now based on job postings:<br>1. 🤖 <strong>ROS2</strong> — every robotics company needs this<br>2. 🔬 <strong>PyTorch + transformers</strong> — foundation for robot learning<br>3. ☁️ <strong>Cloud infra (AWS/GCP)</strong> — robot data pipelines<br>4. 👁️ <strong>Computer vision</strong> — always in demand<br><br>Most hiring: ${topJobMkt.m.icon} ${topJobMkt.m.label} (${topJobMkt.s.jobs} open roles).<br><br>Check the Certification Hub module for free learning resources.`;
    } else {
      reply=`I analyzed the current signals for your question. Here's what the data says:<br><br>📊 <strong>Top market right now:</strong> ${topMkt.m.icon} ${topMkt.m.label} (score: ${topMkt.s.opp})<br>🔍 <strong>Biggest gap:</strong> ${topGap.m.icon} ${topGap.m.label} (gap: ${topGap.g})<br>📄 <strong>Research activity:</strong> ${(data.papers||[]).filter(x=>!isSeed(x)).length} papers tracked<br>💰 <strong>Funding activity:</strong> ${(data.funding||[]).filter(x=>!isSeed(x)).length} rounds<br><br>Try asking: "What startup should I build?", "What market is underserved?", or "How do I monetize a VLA paper?"`;
    }
    setTimeout(()=>{
      msgs.innerHTML+=`<div class="adv-msg bot">${reply}</div>`;
      msgs.scrollTop=msgs.scrollHeight;
    },400);
    msgs.scrollTop=msgs.scrollHeight;
  };
  const btn=document.getElementById('cf-send');
  const inp=document.getElementById('cf-inp');
  if(btn) btn.addEventListener('click',send);
  if(inp) inp.addEventListener('keydown',e=>{ if(e.key==='Enter') send(); });
}

/* ── Module: Signal Score Engine ── */
function advSignalEngine() {
  const WEIGHTS={research:3,funding:5,hiring:1,openSource:2,news:2};
  const calcSignal=(item,type)=>{
    const txt=JSON.stringify(item).toLowerCase();
    const hasMkt=k=>MKTS[k].kw.some(w=>txt.includes(w));
    const mktBonus=Object.keys(MKTS).filter(hasMkt).length*4;
    if(type==='paper') return Math.min(99,scoreOf(item)*10+mktBonus+20);
    if(type==='repo')  return Math.min(99,Math.log1p(scoreOf(item))*10+mktBonus+10);
    if(type==='model') return Math.min(99,Math.log1p(scoreOf(item))*8+mktBonus+15);
    return Math.min(99,mktBonus+25);
  };
  const allItems=[
    ...(data.papers||[]).filter(x=>!isSeed(x)).map(x=>{return{...x,_type:'paper',_sig:calcSignal(x,'paper')};}),
    ...(data.repos||[]).filter(x=>!isSeed(x)).map(x=>{return{...x,_type:'repo',_sig:calcSignal(x,'repo')};}),
    ...(data.models||[]).filter(x=>!isSeed(x)).map(x=>{return{...x,_type:'model',_sig:calcSignal(x,'model')};}),
    ...(data.funding||[]).filter(x=>!isSeed(x)).map(x=>{return{...x,_type:'funding',_sig:calcSignal(x,'funding')};}),
  ].sort((a,b)=>b._sig-a._sig).slice(0,25);
  const byType=t=>allItems.filter(x=>x._type===t).length;
  const typeIcon={paper:'📄',repo:'💻',model:'🧠',funding:'💰'};
  const typeColor={paper:'#34d399',repo:'#60a5fa',model:'#fb923c',funding:'#a3e635'};
  return `
  <div class="adv-metrics">
    <div class="adv-metric"><div class="adv-metric-n">${allItems[0]?._sig||0}</div><div class="adv-metric-l">Top Signal Score</div></div>
    <div class="adv-metric"><div class="adv-metric-n">${allItems.filter(x=>x._sig>=80).length}</div><div class="adv-metric-l">High Signal Items</div></div>
    <div class="adv-metric"><div class="adv-metric-n">${allItems.length}</div><div class="adv-metric-l">Items Ranked</div></div>
    <div class="adv-metric"><div class="adv-metric-n">Live</div><div class="adv-metric-l">Data Freshness</div></div>
  </div>
  <div class="adv-panel">
    <div class="adv-panel-hdr">⚡ Universal Signal Score Rankings — Top 25 signals across all categories</div>
    <ul class="adv-list">
      ${allItems.map((x,i)=>{
        const tc=typeColor[x._type]||'#818cf8';
        const ti=typeIcon[x._type]||'•';
        return `<li class="adv-item">
          <div class="adv-rank" style="background:${tc}22;color:${tc}">${i+1}</div>
          <div class="adv-item-body">
            <div class="adv-item-title">
              <a href="${esc(hrefOf(x))}" target="_blank" style="color:var(--text)">${esc(truncWords(titleOf(x),12))}</a>
            </div>
            <div class="adv-scores">
              <span class="adv-tag" style="background:${tc}22;border:1px solid ${tc}44;color:${tc}">${ti} ${x._type}</span>
              ${scoreOf(x)?`<span class="adv-tag adv-tag-blue">${fmt(scoreOf(x))}</span>`:''}</div>
          </div>
          <div style="text-align:right;flex-shrink:0">
            <div style="font-size:22px;font-weight:900;color:${tc}">${x._sig}</div>
            <div style="font-size:10px;color:var(--muted)">signal</div>
          </div>
        </li>`;
      }).join('')}
    </ul>
  </div>`;
}
