purpose robots to live and work alongside us. <\/p><p>General-purpose robots can have wheels or legs. They can have one, two, three, or more arms. Some have propellers and can fly, while others may be designed to operate under water. Some will drive on busy roads. The physical world is infinitely varied and complex. And then there are all the people and other animals that will be surrounding the robots. How do you train a model to operate a robot safely and reliably in all of these settings? The simple answer is: You don’t. At least not for quite some time.<\/p><p>We believe the winning AI architecture leading to the next big breakthroughs in general-purpose robotics will be “agentic AI” for robots, which are high-level coordinating models that can reason, plan, use tools, and learn from outcomes to execute complex tasks with limited supervision. Agentic, high-level models running on robots will invoke a system of specialized ones for different types of tasks. We will likely soon see multiple robots collaborating and coordinating with each other through their onboard agentic AI models.<\/p><p>AI tools are unlocking new and powerful capabilities in robotics, which in turn will enable new solutions and new markets. It’s encouraging to see these new models being made broadly available, some even as open-source solutions. This availability is akin to what happened with the internet: Real progress occurred when it became ubiquitous. We anticipate an inevitable democratization of complex behaviors in robotics with wide access to these AI tools and technologies.<\/p><h2>4. Hardware Is Still Very Hard<\/h2><p>Robots are complex systems with many parts that all need to work together with great precision. For a robot to be useful and safe, every part of it must be coordinated, from its perception systems to the computer controlling it, all the way down to its individual actuators.<\/p><p>Actuators—that is, the motors and gears—are a good example of an important part of the robot where what got us here won’t get us there. The actuators used at scale by most industrial robots will not work for robots that will operate in human environments. If these robots accidentally collide with an obstacle, the resulting impacts are harsh, forces are high, and things break. Humans don’t move in this way. We are far more compliant in how we interact with the world, and we’re constantly making contact with our environment and using that contact to help us accomplish things. <\/p><p>Consider the challenge of inserting a key in a lock: Humans typically don’t do this by aligning the key perfectly with the keyhole. Instead, we just feel for the edge of the keyhole and jiggle the key in. Robots need to be able to operate in novel ways to achieve comparable capabilities by using a new class of actuators that are sensitive to force and able to have a compliant interaction with the environment. While these kinds of actuators do exist, they are not yet generally available at scale for robot systems designed to operate around people.<\/p><h2>5. Real Value Comes From “Easy” Tasks<\/h2><p>There’s a big difference between tasks that look impressive and real-world tasks that provide value. Robotics is a perfect example of <a href=\"https://en.wikipedia.org/wiki/Moravec%27s_paradox\" target=\"_blank\">Moravec’s paradox<\/a>, which states that tasks that are hard for humans are easy for computers (like multiplying two big numbers), and tasks easy for humans (like a toddler’s movements) are extremely difficult for computers and robots.<\/p><p>Serving customers is an unforgiving reality check, because customers only care about solving the real problems they have. If we are to deploy AI-based robot solutions, they must outperform the way things are currently done while demonstrating reliable performance metrics and safety. Agility Robotics’ early work to deploy our humanoid robot Digit in customer locations led to the realization that our first obstacle was safety: Robots that balance and manipulate objects in human spaces bring new types of risk to the workplace. In the first <a href=\"https://www.youtube.com/watch?v=AJpTpUqjgrY\" target=\"_blank\">humanoid deployments<\/a>, physical barriers were necessary, and Agility kicked off a multi-year engineering effort to solve the safety challenge, touching nearly every aspect of robot design and relying heavily on new AI-based approaches to human detection and behavior control.<\/p><p class=\"shortcode-media shortcode-media-youtube\"> <span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span> <\/p><p><a href=\"https://everydayrobots.ai/vision\" target=\"_blank\">Everyday Robots<\/a> at Google deployed robots in 2019 that worked autonomously in office buildings doing chores like cleaning cafe tables and sorting trash. We quickly learned how “messy” and difficult the real world is for a robot. This experience informed the architecture and deployment of our AI systems while also gathering real-world data that could be combined with simulation data for training and improving models.<\/p><p>This focus on creating a product to meet specific customer needs and deploying robots in real-world settings is the only way to inform the structure of the AI tools and infrastructure for near-term utility on a path towards long-term broader capability and generality. There will be no “aha” moment, no silver bullet algorithm, and no volume of data sufficient to produce a general-purpose robot without extensive real-world experience. <\/p><h2>AI Robots Are Coming, One Step at a Time<\/h2>As we look to the future, there is no doubt that the world is bringing AI into the physical world through robots. We are at the beginning of a “<a href=\"https://spectrum.ieee.org/is-a-cambrian-explosion-coming-for-robotics\" target=\"_self\">Cambrian explosion<\/a>“ of useful, intelligent machines. We believe AI is not one tool, but a huge frontier of technical approaches that is unlocking new capabilities so powerful, they will define our economy moving forward. This will happen not in one single definitive moment, but as an ongoing set of small and large breakthroughs, where AI-driven robots begin to provide real value in a few tasks, and then a few more, with impacts unfolding across numerous $100 billion-plus markets that will dramatically improve the quality of our lives."}], "roboticsNews": [{"title": "Dream Labs raises $90M and launches Dream API", "source": "Robotics Business Review", "date": "2026-10-22", "url": "https://www.therobotreport.com/dream-labs-raises-90m-and-launches-dream-api/", "summary": "<p>Dream Labs says its Dream-1 AI model works across robots from different manufacturers and will allow robots to transfer their learning.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/dream-labs-raises-90m-and-launches-dream-api/\">Dream Labs raises $90M and launches Dream API<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "AGCO to deploy Agility Digit humanoid in Kansas factory", "source": "Robotics Business Review", "date": "2026-10-21", "url": "https://www.therobotreport.com/agco-to-deploy-agility-digit-humanoid-in-kansas-factory/", "summary": "<p>The Agility pilot, which is expected to begin in 2027, will begin at an AGCO production facility for agricultural equipment.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/agco-to-deploy-agility-digit-humanoid-in-kansas-factory/\">AGCO to deploy Agility Digit humanoid in Kansas factory<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "A guide to Day 2 of RoboBusiness 2026", "source": "Robotics Business Review", "date": "2026-10-21", "url": "https://www.therobotreport.com/a-guide-to-day-2-of-robobusiness-2026/", "summary": "<p>Day 2 of RoboBusiness 2026, the 20th anniversary of the event, will include interesting keynotes around humanoids and social robots.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/a-guide-to-day-2-of-robobusiness-2026/\">A guide to Day 2 of RoboBusiness 2026<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Avenda Health expands Unfold AI platform to support intraoperative prostate cancer care", "source": "Robotics Business Review", "date": "2026-10-20", "url": "https://www.therobotreport.com/avenda-health-expands-unfold-ai-platform-support-intraoperative-prostate-cancer-care/", "summary": "<p>Surgery Mode in Unfold AI brings patient-specific 3D maps to give an enhanced view of cancer anatomy during robotic prostate procedures.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/avenda-health-expands-unfold-ai-platform-support-intraoperative-prostate-cancer-care/\">Avenda Health expands Unfold AI platform to support intraoperative prostate cancer care<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "A guide to Day 1 of RoboBusiness 2026", "source": "Robotics Business Review", "date": "2026-10-20", "url": "https://www.therobotreport.com/a-guide-to-day-1-of-robobusiness-2026/", "summary": "<p>We've compiled a schedule for everything happening on the first day of RoboBusiness 2026 in Santa Clara, Calif.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/a-guide-to-day-1-of-robobusiness-2026/\">A guide to Day 1 of RoboBusiness 2026<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Gecko Robotics secures $300M contract with the U.S. Navy", "source": "Robotics Business Review", "date": "2026-10-20", "url": "https://www.therobotreport.com/gecko-robotics-earns-300m-contract-with-the-u-s-navy/", "summary": "<p>Gecko claimed this signals the Pentagon’s confidence that it is a core military capability that is delivering results.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/gecko-robotics-earns-300m-contract-with-the-u-s-navy/\">Gecko Robotics secures $300M contract with the U.S. Navy<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "RoboBusiness rebrands as Robotics Summit & Expo West", "source": "Robotics Business Review", "date": "2026-10-20", "url": "https://www.therobotreport.com/robobusiness-rebrands-as-robotics-summit-expo-west/", "summary": "<p>Robotics Summit &#038; Expo West sharpens focus on deploying robotics and AI in the real world, complementing the East Coast flagship event.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/robobusiness-rebrands-as-robotics-summit-expo-west/\">RoboBusiness rebrands as Robotics Summit &#038; Expo West<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "2027 TRR50 Robotics Innovation Awards open nominations", "source": "Robotics Business Review", "date": "2026-10-20", "url": "https://www.therobotreport.com/2027-trr50-robotics-innovation-awards-open-nominations/", "summary": "<p>The TRR50 winners will be celebrated at an awards gala during the Robotics Summit &#038; Expo, which will be held on June 2-3, 2027 in Boston.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/2027-trr50-robotics-innovation-awards-open-nominations/\">2027 TRR50 Robotics Innovation Awards open nominations<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Reservoir launches new agricultural robotics incubator for Washington growers", "source": "Robotics Business Review", "date": "2026-10-20", "url": "https://www.therobotreport.com/reservoir-launches-new-agricultural-robotics-incubator-for-washington-growers/", "summary": "<p>Reservoir hopes to put agricultural robotics startups to work in the orchards, vineyards and berry fields alongside researchers and growers.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/reservoir-launches-new-agricultural-robotics-incubator-for-washington-growers/\">Reservoir launches new agricultural robotics incubator for Washington growers<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "The Robot I Didn’t Expect to Build", "source": "IEEE Spectrum Robotics", "date": "2026-10-19", "url": "https://spectrum.ieee.org/agility-robotics-digit-5-redesign", "summary": "<img src=\"https://spectrum.ieee.org/media-library/author-jonathan-hurst-a-tall-slim-white-man-wearing-a-black-long-sleeve-shirt-and-dark-jeans-stands-next-to-his-digit-5-humano.jpg?id=68441166&amp;width=1245&amp;height=700&amp;coordinates=0%2C1422%2C0%2C1423\" /><br /><br /><p><strong><a href=\"https://www.agilityrobotics.com/\" rel=\"noopener noreferrer\" target=\"_blank\"><span>Agility Robotics<\/span><\/a>, the <\/strong>company I cofounded out of <a href=\"https://mime.engineering.oregonstate.edu/research/drl/\" target=\"_blank\">my robotics lab at Oregon State University<\/a> in 2015, has just launched <a href=\"https://spectrum.ieee.org/humanoid-robot-safety\" target=\"_self\">Digit 5<\/a>. It’s designed to be the first humanoid robot that can safely and economically do useful work at scale, allowing us to bring tens of thousands of humanoid workers into the real world. Engineered to lift 23-kilogram bins onto high shelves and with a battery that can run for 90 minutes on a 9-minute charge, Digit 5’s goal is to handle heavy warehouse tasks shift after shift, filling the need for labor in jobs that are too physically stressful or too dull for humans to want to do.<\/p><div class=\"rm-embed embed-media\"><\/div><p><span>Digit 5 is what Agility has been working toward for over a decade. But the robot is heavy and bulky, lacking the graceful natural motion of its predecessors, and it’s farther than I thought possible from the robot I dreamed of building when I started this company. To deliver a useful commercial product, Agility has taken a path that is very different from what I first imagined.<\/span><\/p><h2>From ATRIAS to Digit<\/h2><p>My dream has always been to build robots that combine locomotion and manipulation to move through the world and interact with it as people do. I seek a mastery of motion, achieved through devices designed to navigate the constraints of physics with elegance. When I started the <a href=\"https://mime.engineering.oregonstate.edu/research/drl/\" target=\"_blank\">Dynamic Robotics Laboratory<\/a> at Oregon State in 2008, we began with a theory derived from decades of work in biomechanics: that a simple “spring-mass” model (a body supported by legs that act like springs) should be able to reproduce every known walking and running gait found in animals.<\/p><p>We put theory into practice by building the bipedal robot <a href=\"https://spectrum.ieee.org/atrias-robot-dodgeball-barrage\" target=\"_self\">ATRIAS<\/a>—short for “Assume The Robot Is A Sphere,” a <a href=\"https://en.wikipedia.org/wiki/Spherical_cow\" target=\"_blank\">joke among physicists<\/a> about reducing a complex system to its simplest possible form. ATRIAS looked like a large microwave on stilts because it was only intended to demonstrate the physics of human walking and running. This was the first glimmer of achieving my dream; even though ATRIAS wasn’t designed to look like us, it still seemed natural, and even somehow alive, when it settled into a walking gait.<\/p><p>With the success of ATRIAS, the barriers to progress shifted from scientific to engineering and organizational, and a startup company seemed like the way to bridge the gap from a one-off research concept to an actual robotic product. I felt confident of two things: that I would be able to build robots that could go where people go, and that this capability would be incredibly useful. This combination of ambition and naivete is necessary for anyone to found a new company—how hard could it be?<\/p><p class=\"shortcode-media shortcode-media-youtube\"> <span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>Good advice for starting a company is to understand a customer problem, and then find a way to solve it using your unique capabilities. My cofounders, <a href=\"https://www.linkedin.com/in/damion-shelton/\" target=\"_blank\">Damion Shelton<\/a> and <a href=\"https://www.linkedin.com/in/mikhail-jones-5674a22b/\" rel=\"noopener noreferrer\" target=\"_blank\">Mikhail Jones<\/a>, and I did not do this. We relied on our belief that this technology would enable new possibilities and trusted ourselves to figure out the business as we went. So we simply focused on building our first product: the bipedal robot <a href=\"https://robotsguide.com/robots/cassie\" rel=\"noopener noreferrer\" target=\"_blank\">Cassie<\/a>.<\/p><p>Cassie was the first dynamic bipedal robot that researchers could buy, able to maintain its balance through active, fluid motion rather than careful, rigid steps. It had ostrichlike legs, not because we were imitating ground-running birds, but as a result of engineering strictly for performance. It was not intended to be commercially useful, and had no torso, arms, or head. We sold Cassie robots to Harvard, Caltech, the University of Michigan, the University of California, Berkeley, and a handful of other research institutions, ultimately saturating the market for US $250,000 bipedal research robots after having sold a total of 10 of them.<\/p><p class=\"shortcode-media shortcode-media-rebelmouse-image\"> <img alt=\"Three bipedal robots lined up in a warehouse, showing their evolving designs.\" class=\"rm-shortcode\" id=\"f749f\" src=\"https://spectrum.ieee.org/media-library/three-bipedal-robots-lined-up-in-a-warehouse-showing-their-evolving-designs.jpg?id=68441028&amp;width=980\" /><small class=\"image-media media-caption\">ATRIAS, Cassie, and Digit 4 EVT [left to right] are on display at Agility Robotics’ RoboFab in Salem, Ore. The 70,000-square-foot facility has the capacity to produce more than 10,000 Digit 5 robots per year.<\/small><small class=\"image-media media-photo-credit\">Agility Robotics<\/small><\/p><p>Because Cassie’s hardware enabled research into the physics of walking and running, the legged-robot research frontier shifted to control software. Traditionally, engineers controlled legged robots with detailed mathematical models that determined how the machines should move. With Cassie, researchers pioneered the new approach of reinforcement learning for bipedal legged locomotion: A simulated robot learns through trial and error, and the resulting neural network controls the physical machine. This approach is what enables virtually all of the dynamic behaviors that you see on legged robots today, and Cassie looked alive as it recovered from stumbles while climbing stairs, ran 5 kilometers across the Oregon State campus, and <a href=\"https://news.oregonstate.edu/news/bipedal-robot-developed-oregon-state-achieves-guinness-world-record-100-meters\" target=\"_blank\">broke the robot world record<\/a> for a 100-meter dash.<\/p><p>Cassie got us closer to being able to move through the world with confidence and grace, but to make it useful, we needed manipulation. After exhaustively exploring different configurations, we found that an upright torso helped the robot balance, while two arms mounted near the top of the torso allowed it to pick up large objects and to catch itself when it fell. <a href=\"https://robotsguide.com/robots/digit\" target=\"_blank\">Digit 1<\/a>, which added a torso and arms to the Cassie legs, was our first mobile manipulation robot, and another step on the path toward a product that could do useful work for commercial customers.<\/p><h2>Why Digit Began With Warehouse Bins<\/h2><p>As we explored the first applications for Digit, potential customers kept asking us: Why legs? And why a humanoid? These were tough questions for me to answer, because they exposed a core business reality: It didn’t matter to Agility Robotics if we solved a cool science problem in a beautiful way. What mattered to the business was solving real problems for customers.<\/p><p class=\"shortcode-media shortcode-media-youtube\"> <span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>After years of engagement with industry partners, we found one answer in warehouses and manufacturing facilities: moving <a href=\"https://spectrum.ieee.org/agility-robotics-digit\" target=\"_self\">bins<\/a>. Bin handling is a clearly defined task where two arms are needed to lift large bins up high and legs are the best way to balance and move in narrow spaces. Because the task can vary widely from one deployment to another, it hasn’t been broadly addressed by single-purpose automation. Yet it was constrained enough to give Digit an economically viable first job while it developed a broader set of skills.<\/p><p>In 2019, Digit began demonstrating its capabilities to do real work. <a href=\"https://spectrum.ieee.org/ford-self-driving-vans-will-use-legged-robots-to-make-deliveries\" target=\"_self\">With Ford Motor Company<\/a>, we showed how Digit 1 could carry packages from an autonomous vehicle to a front porch. We developed Digit 2 and 3 while working with a certain global package delivery company on moving and sorting cardboard boxes. <a href=\"https://spectrum.ieee.org/humanoid-robots\" target=\"_self\">Amazon<\/a> tested Digit 4 on moving and stacking bins, and it became the world’s first commercially deployed humanoid <a href=\"https://www.agilityrobotics.com/content/digit-moves-over-100k-totes\" target=\"_blank\">at the logistics provider GXO<\/a>. In 2024, Digit appeared on the cover of <em><em>Time<\/em><\/em> magazine.<\/p><p class=\"shortcode-media shortcode-media-youtube\"> <span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>Despite Digit’s apparent success, we began to run into conflicts between my dream and the needs of actual customers. We were no longer working with relatively patient university research labs. Agility has to sell robots to survive, and customers will only purchase robots that provide value. If bins weren’t moving, our customers were losing money. We spent a huge amount of time and effort keeping our first deployments operational, which arguably eliminated any profit we made. Yet this also kept our company learning and alive the way no lab demo ever could.<\/p><p>I had no idea how hard it would be, or that running a company would involve so many things that have nothing to do with solving technical problems: deployments across the country; shipping, service, and customer support; fundraising and investor relations; more fundraising; human resources and IT; developing fleet-management software; managing a supply chain; and even more fundraising. I had no experience with any of these things. My career had focused on solving the technical challenges of robots interacting with the world, and it turned out that was only a tiny piece of building a successful robotics company. But Agility was the only path I saw to continuing the technical work and having an impact.<\/p><h2>Turning Digit Into a Product<\/h2><p>I knew that Agility needed to focus more on robots as a product, but I didn’t know how to make that happen. Hiring the people we needed to run the company meant giving up an immense amount of control, but we had no other choice. We recruited a new executive team with the experience required to commercialize this new technology, and they quickly made changes that were both painful and necessary.<\/p><p class=\"shortcode-media shortcode-media-rebelmouse-image\"> <img alt=\"A series of images showing three headless humanoid robots with each one getting somewhat bulkier and less graceful.\" class=\"rm-shortcode\" id=\"1db2c\" src=\"https://spectrum.ieee.org/media-library/a-series-of-images-showing-three-headless-humanoid-robots-with-each-one-getting-somewhat-bulkier-and-less-graceful.jpg?id=68441280&amp;width=980\" /><small class=\"image-media media-caption\">Digit versions 1, 2, and 3 [left to right] show the evolution of the robot from a dynamic walking platform into a useful mobile manipulator. <\/small><small class=\"image-media media-photo-credit\">Agility<\/small><\/p><p>We had intended the next revision of Digit, <a href=\"https://www.youtube.com/watch?v=6x28vlbfA-k\" target=\"_blank\">Digit 4 EVT<\/a> (Engineering Validation and Test), to be a relatively minor upgrade. But Agility’s new leadership insisted that the robot was missing key features that were essential if Digit was going to become a real product. So Digit 4 EVT instead incorporated a series of major changes in a highly compressed timeline, such as larger batteries and system-wide upgrades for safety and regulatory compliance, which added enough mass to dramatically alter the robot’s appearance and capabilities.<\/p><p class=\"shortcode-media shortcode-media-rebelmouse-image rm-float-left rm-resized-container rm-resized-container-25\" style=\"float: left;\"> <img alt=\"A relatively bulky humanoid robot worker with a white head, simple grippers, and reversed legs stands for a portrait looking directly at the camera.\" class=\"rm-shortcode\" id=\"e15b4\" src=\"https://spectrum.ieee.org/media-library/a-relatively-bulky-humanoid-robot-worker-with-a-white-head-simple-grippers-and-reversed-legs-stands-for-a-portrait-looking-dir.jpg?id=68441369&amp;width=980\" /><small class=\"image-media media-caption\">While early Digits were headless, Agility Robotics was able to justify a head for Digit 4 to optimize antenna and camera placement, and it turned out to be surprisingly useful for human-robot interaction.<\/small><small class=\"image-media media-photo-credit\">Christie Hemm Klok<\/small><\/p><p> I could only watch as others brought their own talents to bear to make Digit into a successful product, in gut-wrenching ways that didn’t always align with my vision. There were some especially difficult times when I felt like there were compromises made that didn’t seem necessary, but making those decisions was no longer my sole responsibility. I had to accept that Digit had grown far beyond me, and look for ways of influencing decisions rather than directing them. In the moment, it was incredibly frustrating, as Digit 4 EVT took a few steps backward from my vision of how humanoids should look and move.<\/p><p>Agility is in our name because agility is core to the future of the company. I want Digit to be lithe and graceful. When people see Digit, I want them to like the robot, to understand what it can do at a glance, and to feel that it’s there to help. But with Digit 4 EVT, all of that was sacrificed to functionality, because of course it had to be—the customer just needs the robot to do the work. The design process became a ruthless triage, with aesthetics and elegance of movement being delayed over and over again in favor of brutal functionality. For an engineer whose mind lives more in the future than in the present, it has been hard for me to accept this trajectory. And yet, through Digit 4 EVT’s commercial deployments, we began to really understand specific applications and what they required. We mapped the first 10 use cases Digit would perform, and then began designing Digit 5 from scratch based on everything we had learned.<\/p><h2>Digit 5<\/h2><p>Digit 5 will be Agility’s first real step toward a general-purpose robot. It marks our transition from imagining what a future humanoid robot should be to designing a product around the realities of customer deployments. These realities include things like European CE regulatory compliance, North American UL electrical-safety certifications, and Federal Communications Commission limits for electromagnetic radiation—all of which felt tangential to my dream for Digit, but were absolute requirements.<\/p><p class=\"shortcode-media shortcode-media-rebelmouse-image rm-float-left rm-resized-container rm-resized-container-25\" style=\"float: left;\"> <img alt=\"A strong and bulky humanoid robot with a teal torso and legs, silver arms, and a black head stands with its arms upraised.\" class=\"rm-shortcode\" id=\"6b948\" src=\"https://spectrum.ieee.org/media-library/a-strong-and-bulky-humanoid-robot-with-a-teal-torso-and-legs-silver-arms-and-a-black-head-stands-with-its-arms-upraised.jpg?id=68441384&amp;width=980\" /><small class=\"image-media media-caption\">Digit 5 is designed to be the first humanoid robot that can operate safely next to human coworkers while working 20 hours a day and lifting more than a human can.<\/small><small class=\"image-media media-photo-credit\">Christie Hemm Klok<\/small><\/p><p>Customer requirements helped us realize that safety in particular was one of the most critical barriers to scaling. In Digit 4’s commercial deployments, the robots had to work behind physical barriers, separated from humans at all times, to meet insurance and regulatory demands. This seemed silly to me, because I’ve never felt that our robots were dangerous, but we have to <em><em>prove<\/em><\/em> that they’re safe. And since keeping the robots in safety cages severely limited their usefulness, enabling Digit 5 to operate safely around people became a primary design goal. We spent two years on this challenge.<\/p><p>Digit 5 is designed to be the first humanoid robot that can operate safely next to human coworkers. It will rely on an array of sensors to locate nearby people in a manner that’s certifiably safe, and then take actions based on that information. As a person approaches, Digit 5 is programmed to stop what it’s doing, set down its payload, sit on the floor, and cut power to its motors before the person gets close enough to touch the robot. This conservative approach reduces the risk to nearby people in a verifiable way, and we believe it’s the only approach that makes sense as a first step toward working alongside humans.<\/p><p class=\"shortcode-media shortcode-media-youtube\"> <span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>Yet this strategy also feels like a massive slowdown on the path toward robots becoming part of everyday life. Enabling coexistence with humans has influenced almost every aspect of Digit 5’s design: the shape of the legs and the body, the safety-rated sensors within protective housings, the isolated computers dedicated to safety, and more. All of these features increase the robot’s complexity, power consumption, mass, and physical size.<\/p><p class=\"shortcode-media shortcode-media-rebelmouse-image rm-float-left rm-resized-container rm-resized-container-25\" style=\"float: left;\"> <img alt=\"Turquoise humanoid robot with labeled safety, battery, cooling, and mobility features\" class=\"rm-shortcode\" id=\"62692\" src=\"https://spectrum.ieee.org/media-library/turquoise-humanoid-robot-with-labeled-safety-battery-cooling-and-mobility-features.png?id=68441430&amp;width=980\" /> <small class=\"image-media media-caption\">Digit 5 is Agility’s largest, heaviest, strongest, and most capable humanoid robot worker.<\/small><\/p><p class=\"shortcode-media shortcode-media-rebelmouse-image rm-float-left rm-resized-container rm-resized-container-25\" style=\"float: left;\"> <img alt=\"Turquoise humanoid robot with cameras, swappable grippers, and lifting-optimized legs\" class=\"rm-shortcode\" id=\"ca796\" src=\"https://spectrum.ieee.org/media-library/turquoise-humanoid-robot-with-cameras-swappable-grippers-and-lifting-optimized-legs.png?id=68441429&amp;width=980\" /> <small class=\"image-media media-caption\">The robot’s design was driven by safety, with integrated protection for the robot and for the humans it will work around.<\/small><small class=\"image-media media-photo-credit\">Agility Robotics<\/small><\/p><p>Weighing over 120 kg, Digit 5 is a <em><em>huge<\/em><\/em> robot. It needed to achieve the lifting limits recommended under the U.S. National Institute for Occupational Safety and Health guidelines for human workers, which include repeatedly lifting 23-kg bins and reaching shelves 1.75 meters high. Digit is designed to perform tasks like these for 20 hours a day—something no human can do. This requires motors with enough power and torque to lift the load, but also enough precision to delicately control the force Digit applies when it makes contact with the world. To power those motors, we needed a large battery and a dock for rapid autonomous charging. The dock will deliver 240 amperes at 48 volts, which is enough current to make its thick charging cables visibly wiggle under the induced magnetic forces, while powerful fans blow air through cooling channels in the robot’s torso to keep the battery from overheating. The battery and cooling system takes up about 75 percent of Digit’s torso, but it will allow the robot to operate for 90 minutes and fully recharge during a 9-minute break, enabling near-continuous work.<\/p><p>All of this extra bulk means that Digit 5 can no longer run or jump the way previous generations could, and the svelte form I imagined has become physically impossible. In some ways, Digit 5 feels more like a forklift than the graceful humanoid I set out to build. But looking at the situation rationally, I believe this trade-off is necessary for any company that claims its humanoid can do this kind of work today: If you see a robot that looks like a human working in a factory or warehouse, it either can’t lift the required weight or can’t make it through the whole shift. And if it’s not covered with sensors, it’s likely not safe to stand next to.<\/p><p>The most visible change with Digit 5 is that humanlike legs replace the ostrichlike legs of our earlier versions. While the “backward” leg configuration was <a href=\"https://spectrum.ieee.org/building-robots-that-can-go-where-we-go\" target=\"_self\">optimized for walking and running<\/a>, we discovered that it created <a href=\"https://youtu.be/OBRppKPXKuU?t=79\" rel=\"noopener noreferrer\" target=\"_blank\">problems<\/a> with squatting because the ankle will strike the ground. Digit 5 will spend a lot of time lifting heavy objects from near the floor, so we used a humanoid leg configuration with knee and hip motors that both contribute torque to help the robot stand up again.<\/p><p class=\"shortcode-media shortcode-media-rebelmouse-image rm-float-left rm-resized-container rm-resized-container-25\" style=\"float: left;\"> <img alt=\"Small teal robot sitting on factory floor as a worker walks past in the background\" class=\"rm-shortcode\" id=\"889db\" src=\"https://spectrum.ieee.org/media-library/small-teal-robot-sitting-on-factory-floor-as-a-worker-walks-past-in-the-background.jpg?id=68441553&amp;width=980\" /> <small class=\"image-media media-caption\">When Digit detects an approaching human, the robot will lower itself to the floor and cut power to its motors. Agility believes this is the only near-term approach to verifiably reduce risk when the robot is working near people.<\/small><small class=\"image-media media-photo-credit\">Agility Robotics<\/small><\/p><p>Other companies building humanoid robots have copied the human form without ever understanding its purpose. It’s very frustrating that, to an outside observer, it now looks like we discarded Agility’s distinctive leg design and simply did what everyone else was doing. Yet I know that we arrived at this shape based purely on functional engineering choices. Making a robot look like a human is the easy part—without the function to match, and the understanding of the physics underlying that function, the whole point of the human form may be lost.<\/p><p>With the power, battery life, and safety features that we are designing into Digit 5, we will have a truly useful robot. But it also compromises on some things that are core to my vision and mission. I understand why we made the choices we did and can justify them all, but together they leave me unsatisfied. It’s the curse of the engineer.<\/p><h2>What Comes After Digit 5<\/h2><p>I believe Digit 5 will be the scaling moment for Agility Robotics, the inflection point where we can begin deploying robots in large numbers. While the robot will continue carrying bins, our road map includes many more tasks, from picking individual items and tending machines, to preparing parts for assembly and shipping, and eventually doing assembly work itself. Its interchangeable tool interfaces and modular design will enable us to gradually upgrade its subsystems. It will be a platform for improvement, a source of data for future behavior training, and a viable product all at the same time.<\/p><p class=\"shortcode-media shortcode-media-rebelmouse-image\"> <img alt=\"Author Jonathan Hurst, a tall slim white man wearing a black long sleeve shirt and dark jeans, stands in between a smaller slimmer humanoid robot with a white head and a larger bulkier humanoid robot with a black head.\" class=\"rm-shortcode\" id=\"f53db\" src=\"https://spectrum.ieee.org/media-library/author-jonathan-hurst-a-tall-slim-white-man-wearing-a-black-long-sleeve-shirt-and-dark-jeans-stands-in-between-a-smaller-slimm.jpg?id=68441550&amp;width=980\" /> <small class=\"image-media media-caption\">Hurst stands between the previous version of Digit, Digit 4 EVT [left], and Digit 5.<\/small><small class=\"image-media media-photo-credit\">Christie Hemm Klok<\/small><\/p><p>But I cannot love Digit 5. It’s the largest, heaviest, most <a href=\"https://spectrum.ieee.org/humanoid-robot-safety\" target=\"_self\">expensive<\/a> robot Agility will ever build, full of design compromises that enable it to be exactly the robot it needs to be right now rather than the robot I dreamed of. In the beginning, I envisioned steady progress on agility and dexterity, with each version becoming more dynamically capable. Instead, developing Digit 5 has required large detours to incorporate requirements that seemed unrelated to my original vision. However, I now recognize that tackling these challenges was always necessary. Customers and product requirements didn’t ruin my vision; they revealed what my vision was missing. This is how robots will achieve commercial success and make a real-world impact, which will bring me closer to my scientific dream as well.<\/p><p>We won’t have a humanoid that matches the capabilities of humans until it achieves that mastery of motion that inspired me to found Agility over a decade ago. I saw glimmers of it with the spring-mass locomotion of ATRIAS, and more glimmers with Cassie’s running gait.<\/p><p>I know that such mastery is physically possible with the tools and hardware that we have right now, and despite all of its compromises, Digit 5 will give us a practical foundation for pursuing that dream. I want every future version of Digit to be lighter and more graceful, to interact more naturally with humans, and to be better at manipulating objects and moving through the world, enabling robots to enter aspects of our lives that they haven’t been able to help with before. By the time I’m old enough to need assistance at home, I expect Digit will be up to the task.<\/p><p>With Digit 5, Agility has built a robot that will be useful in our world. Now I’m getting back to work to make it beautiful, too. <span class=\"ieee-end-mark\"><\/span><\/p><p><em>This article appears in the November 2026 print issue.<\/em><\/p>"}, {"title": "A guide to everything happening at RoboBusiness 2026", "source": "Robotics Business Review", "date": "2026-10-19", "url": "https://www.therobotreport.com/a-guide-to-everything-happening-at-robobusiness-2026/", "summary": "<p>RoboBusiness 2026 will start tomorrow, so we're putting together an overview of everything happening at the show over the next two days.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/a-guide-to-everything-happening-at-robobusiness-2026/\">A guide to everything happening at RoboBusiness 2026<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Unleash AI Innovation: The Power of NVIDIA RTX PRO 6000 Blackwell Workstation Edition Fueled by PNY-Supplied GPUs", "source": "Robotics Business Review", "date": "2026-10-19", "url": "https://www.therobotreport.com/unleash-ai-innovation-the-power-of-nvidia-rtx-pro-6000-blackwell-workstation-edition-fueled-by-pny-supplied-gpus/", "summary": "<p>As robotics systems grow more capable — faster, more precise, and increasingly reliant on AI-driven vision and control — the humble interconnect is being asked to do more than ever.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/unleash-ai-innovation-the-power-of-nvidia-rtx-pro-6000-blackwell-workstation-edition-fueled-by-pny-supplied-gpus/\">Unleash AI Innovation: The Power of NVIDIA RTX PRO 6000 Blackwell Workstation Edition Fueled by PNY-Supplied GPUs<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Daimon Robotics building the infrastructure layer for tactile intelligence", "source": "Robotics Business Review", "date": "2026-10-19", "url": "https://www.therobotreport.com/daimon-robotics-building-the-infrastructure-layer-for-tactile-intelligence/", "summary": "<p>The company is connecting tactile sensing, real-world data collection, simulation, and AI models to help robots perform physical tasks more reliably.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/daimon-robotics-building-the-infrastructure-layer-for-tactile-intelligence/\">Daimon Robotics building the infrastructure layer for tactile intelligence <\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Kodama raises $7M to bring robotics to forestry", "source": "Robotics Business Review", "date": "2026-10-19", "url": "https://www.therobotreport.com/kodama-raises-7m-bring-robotics-forestry/", "summary": "<p>Kodama is working on automating forestry and logging equipment, starting with teleoperation and collecting valuable data on the way.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/kodama-raises-7m-bring-robotics-forestry/\">Kodama raises $7M to bring robotics to forestry<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "How to choose a BLDC motor for robotic arms and mobile robots", "source": "Robotics Business Review", "date": "2026-10-18", "url": "https://www.therobotreport.com/how-to-choose-bldc-motor-robotic-arms-mobile-robots/", "summary": "<p>Several factors, from sensors to safety and robotic arms or mobile platforms, help determine the selection of a brushless DC or BLDC motor.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/how-to-choose-bldc-motor-robotic-arms-mobile-robots/\">How to choose a BLDC motor for robotic arms and mobile robots<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "The rise of the machines is canceled: Why humanoids with AI are helpers, not enemies", "source": "Robotics Business Review", "date": "2026-10-17", "url": "https://www.therobotreport.com/rise-machines-canceled-why-humanoids-ai-are-helpers-not-enemies/", "summary": "<p>Humans play a key role in developing humanoid robots and training AI models, so we can maintain control, writes a columnist.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/rise-machines-canceled-why-humanoids-ai-are-helpers-not-enemies/\">The rise of the machines is canceled: Why humanoids with AI are helpers, not enemies<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "ADI explains the race to make AI physical", "source": "Robotics Business Review", "date": "2026-10-17", "url": "https://www.therobotreport.com/adi-explains-the-race-to-make-ai-physical/", "summary": "<p>A new ADI whitepaper examines the challenges and opportunities in moving physical AI out of labs into production machinery.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/adi-explains-the-race-to-make-ai-physical/\">ADI explains the race to make AI physical<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Video Friday: When Two Robots Become One", "source": "IEEE Spectrum Robotics", "date": "2026-10-16", "url": "https://spectrum.ieee.org/video-friday-reconfigurable-robots", "summary": "<img src=\"https://spectrum.ieee.org/media-library/two-small-robots-with-long-limbs-and-bodies-linked-by-a-wire-join-connect-to-form-one-four-wheeled-robot-on-a-paved-pathway.gif?id=68443843&amp;width=1245&amp;height=700&amp;coordinates=0%2C7%2C0%2C7\" /><br /><br /><p><span>Video Friday is your weekly selection of awesome robotics videos, collected by your friends at <\/span><em>IEEE Spectrum<\/em><span> robotics. We also post a weekly calendar of upcoming robotics events for the next few months. Please <\/span><a href=\"mailto:automaton@ieee.org?subject=Robotics%20event%20suggestion%20for%20Video%20Friday\">send us your events<\/a><span> for inclusion.<\/span><\/p><h5><a href=\"https://www.corl.org/\">CoRL 2026<\/a>: 9–12 November 2026, AUSTIN<\/h5><h5><a href=\"https://2026.ieee-humanoids.org/\">Humanoids 2026<\/a>: 6–9 December 2026, SANTA CLARA, CA<\/h5><p>Enjoy today’s videos!<\/p><div class=\"horizontal-rule\"><\/div><div><span style=\"display: none;\"> <\/span><\/div><p class=\"rm-anchors\" id=\"45-ypqogpiu\">When one robot loves another robot very much, and they’re connected by a wire, they can get together and make a brand new robot! SFW.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://shin0805.github.io/twinx-bridging/\">JSK Lab<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"zssoymcggpu\"><em>What happens when Microducks meet? They start to sing together. Each Microduck syncs with its neighbors over Bluetooth, then they compose a song on the fly, in harmony and in perfect time. There’s no score and no conductor. Two, three, or four ducks are enough for a choir to break out.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>If Pollen isn’t selling <a href=\"https://spectrum.ieee.org/video-friday-microduck-robot\" target=\"_blank\">Microducks<\/a> in four packs for this exact reason, WHAT ARE THEY EVEN DOING!?<\/p><p>[ <a href=\"https://pollen-robotics.com/microduck/\">Pollen<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"9picemtfpwu\"><em>In an internal test, Google DeepMind robotics researchers instructed Gemini 4 Argon to watch a video of a human playing cornhole. Using its video understanding and advanced reasoning capabilities, Gemini 4 built a virtual simulation in MuJoCo and accurately calculated the physics and whole-body control required for Apptronik’s Apollo 2 humanoid to sink seven consecutive shots in the real world. This Video-to-Sim-to-Real pipeline compresses weeks of manual modeling into a few hours, transforming ordinary videos into an infinite training ground for physical AI.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://blog.google/innovation-and-ai/models-and-research/gemini-models/introducing-gemini-4-argon/\">Google DeepMind<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"xaxuv6tsib4\"><em>As of 11 October 2026, NASA’s Perseverance rover has driven 28.10 miles (45.22 kilometers), becoming the new off-world record-holder for total distance driven by any vehicle on the surface of another world. The previous record of 28.06 miles (45.16 kilometers) was held by NASA’s Opportunity rover. Perseverance reached that mark on the 2,006th Martian day, or sol, of its mission, covering in five and a half years a distance that took Opportunity almost 15.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.jpl.nasa.gov/missions/mars-2020-perseverance-rover/\">JPL<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"afotkkjjbky\">Let’s not argue about whether these are robots or not and just agree that they’re cool.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://daehwakim.com/oat/\">OATs<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"j9kfpi-hjx4\">If one cute little robot can clean up one block, how many blocks can 40 cute little robots clean up? Science has the answers!<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://arxiv.org/abs/2610.05677\">Paper<\/a> ]<\/p><p>Thanks, Keisuke!<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"ry5caexgbk0\"><em>Before <a href=\"https://spectrum.ieee.org/4-missions-will-search-the-martian-atmosphere-and-soil-for-signs-of-life\" target=\"_blank\">Rosalind Franklin<\/a> can explore Mars, it has to get off its lander. Engineers are rehearsing that first journey on Earth, using a full-size rover model and Mars-like terrain. The test recreates some of the challenges Rosalind Franklin will face on the Red Planet, from reduced gravity and a 20-degree incline to uneven ground and obstacles beneath its ramps.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.esa.int/Science_Exploration/Human_and_Robotic_Exploration/ExoMars_rover_twin_rehearses_first_drive\">European Space Agency<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"dp_i7hrvgpe\"><em>From custom part to running robot, the Atlas shop floor is built on precision, rapid assembly, and real-time collaboration. By machining parts in-house and streamlining assembly and repair under one roof, we are driving the manufacturing velocity needed to turn complex designs into walking hardware at scale.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://bostondynamics.com/\">Boston Dynamics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"jp79jzwmo4k\"><em>What can a quadruped robot do beyond the lab? Deep in China’s Ailao Mountains, DEEP Robotics Lynx M20S joined a team of researchers on a biodiversity field expedition—navigating rugged terrain, scouting routes ahead, carrying research equipment, and capturing wildlife in areas that are difficult to access on foot.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.deeprobotics.us/\">DEEP Robotics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"_eyarcc8d9y\"><em>The Kamino simulation software is a GPU-accelerated physics solver designed for accurate simulation of complex mechanical systems with kinematic loops, such as parallel manipulators, planar and spatial linkages, and multi-limbed robots with coupled joints, without requiring simplified approximations.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://disneyresearch.github.io/kamino-site/\">Disney Research<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"3h4mk2zcm3w\">The original Kawasaki <a href=\"https://spectrum.ieee.org/unimation-robot\" target=\"_blank\">UNIMATE<\/a> robot as featured in (remember this show?) <em>The MacNeil/Lehrer Report<\/em> in 1982.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://kawasakirobotics.com/\">Kawasaki Robotics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"95dsrzgzuhy\"><em>WildOS enables autonomous robots to perform long-range, open-vocabulary object search in previously unmapped and unstructured outdoor environments by unifying geometric safety with semantic visual reasoning. Through a vision-scored navigation graph and beyond-horizon target localization, the system demonstrates more efficient and robust exploration than conventional geometric or purely vision-based approaches in extensive field experiments.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://leggedrobotics.github.io/wildos/\">ETH Zurich Robotics Systems Lab<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"a5oyvvkspva\">Who needs an AI-generated person when you can have an actual robot that looks exactly like an AI-generated person instead?<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.ubtrobot.com/en/humanoid/products/u1-pro\">UBTECH Robotics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"8lc7x7c_sju\">The recovery behaviors here are impressive, but the robot is far slower than a human would be, suggesting that the value it generates is primarily in novelty. Which is fine for now, but novelty wears off, and then what?<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.sharpa.com/pages/sharpa-dq\">Sharpa<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"umohqodj_pi\">Here are a couple of good panels from ICRA 2026 in Vienna, including one on “Impact and Return on Investment on Humanoid Robots” and a second on “Advancing Sustainability in Robotics.”<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p class=\"shortcode-media shortcode-media-youtube\"> <span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://2026.ieee-icra.org/program/panels/\">ICRA 2026<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div>"}, {"title": "MassRobotics opens applications for Healthcare Robotics Startup Catalyst Program", "source": "Robotics Business Review", "date": "2026-10-16", "url": "https://www.therobotreport.com/massrobotics-opens-applications-healthcare-robotics-startup-catalyst-program/", "summary": "<p>The cohort will run February through June 2027, concluding with company showcases at the Robotics Summit and Expo in Boston. <\/p>\n<p>The post <a href=\"https://www.therobotreport.com/massrobotics-opens-applications-healthcare-robotics-startup-catalyst-program/\">MassRobotics opens applications for Healthcare Robotics Startup Catalyst Program<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Why opportunity charging is winning as robot fleets scale", "source": "Robotics Business Review", "date": "2026-10-16", "url": "https://www.therobotreport.com/why-opportunity-charging-is-winning-as-robot-fleets-scale/", "summary": "<p>Ben Waters explains why opportunity charging is becoming essential for keeping autonomous robot fleets moving, scalable, and operationally efficient.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/why-opportunity-charging-is-winning-as-robot-fleets-scale/\">Why opportunity charging is winning as robot fleets scale<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Agility chooses Nyobolt for ultra-fast charging for Digit 5 humanoid", "source": "Robotics Business Review", "date": "2026-10-15", "url": "https://www.therobotreport.com/agility-robotics-chooses-nyobolt-ultra-fast-charging-digit-5-humanoid/", "summary": "<p>Nyobolt is providing power technology for Digit 5 that enables Agility's humanoid to work up to 20 hours a day.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/agility-robotics-chooses-nyobolt-ultra-fast-charging-digit-5-humanoid/\">Agility chooses Nyobolt for ultra-fast charging for Digit 5 humanoid<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Stryker invests $400M into CMR Surgical", "source": "Robotics Business Review", "date": "2026-10-15", "url": "https://www.therobotreport.com/stryker-invests-400m-into-cmr-surgical/", "summary": "<p>Stryker plans to serve as the exclusive sales agent in the U.S. for the Versius robotics portfolio from CMR Surgical.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/stryker-invests-400m-into-cmr-surgical/\">Stryker invests $400M into CMR Surgical<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "How ADI is helping robotics startups scale", "source": "Robotics Business Review", "date": "2026-10-15", "url": "https://www.therobotreport.com/how-adi-is-helping-robotics-startups-scale-2/", "summary": "<p>Robotics businesses need help keeping up with innovations as they scale. Analog Devices Inc. or ADI is offering its Emerging Tech Hub.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/how-adi-is-helping-robotics-startups-scale-2/\">How ADI is helping robotics startups scale<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Timken Precision Drives puts the motion challenge first in humanoid robots", "source": "Robotics Business Review", "date": "2026-10-14", "url": "https://www.therobotreport.com/timken-precision-drives-puts-motion-challenge-first-humanoid-robots/", "summary": "<p>Timken combines the expertise of Cone Drive, SPINEA, CGI Motion, and Timken Encoders to develop application-specific motion systems.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/timken-precision-drives-puts-motion-challenge-first-humanoid-robots/\">Timken Precision Drives puts the motion challenge first in humanoid robots<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "RoboBusiness 2026 panel to discuss reshoring with robots", "source": "Robotics Business Review", "date": "2026-10-14", "url": "https://www.therobotreport.com/robobusiness-2026-panel-discusses-reshoring-with-robots/", "summary": "<p>While reshoring manufacturing is a high priority for policymakers and technologists, RoboBusiness panelists will examine how to promote it.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/robobusiness-2026-panel-discusses-reshoring-with-robots/\">RoboBusiness 2026 panel to discuss reshoring with robots<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Q&A: Mars Perseverance Rover Sets a Distance Record", "source": "IEEE Spectrum Robotics", "date": "2026-10-13", "url": "https://spectrum.ieee.org/mars-rover-distance-record", "summary": "<img src=\"https://spectrum.ieee.org/media-library/a-long-trail-of-tire-tracks-left-across-mars-dusty-surface-by-a-space-rover.jpg?id=68423735&amp;width=1245&amp;height=700&amp;coordinates=0%2C312%2C0%2C312\" /><br /><br /><p><a href=\"https://www.jpl.nasa.gov/news/nasas-perseverance-sets-off-world-record-for-total-distance-driven/\" target=\"_blank\"><em><\/em>On 11 October<\/a>, the <em>Perseverance<\/em> rover completed a drive that brought its <a href=\"https://science.nasa.gov/mission/mars-2020-perseverance/location-map/\" target=\"_blank\">total distance traveled<\/a> on Mars to 28.10 miles (45.22 kilometers). This is a new record for Mars rovers, enabled in large part by <em>Perseverance<\/em>’s ability to drive with much more autonomy than its predecessors. Over the past five years, <em>Perseverance<\/em>’s autonomy software has been steadily upgraded, and to learn more about how the record was broken and what the future holds for the rover, we spoke with <a href=\"https://www.linkedin.com/in/mark-maimone-490505317/\" rel=\"noopener noreferrer\" target=\"_blank\">Mark Maimone<\/a><span>, the <em>Perseverance<\/em> Robotic Operations Deputy Team Chief at NASA’s Jet Propulsion Laboratory, who designed and developed the self-driving software for Mars rovers <em>Spirit, Opportunity, Curiosity,<\/em> and <em>Perseverance.<\/em><\/span><\/p><hr /><p>Before we talk about <em>Perseverance,<\/em> let’s pour one out for the previous record holder, <em><a href=\"https://science.nasa.gov/mission/mer-opportunity/\" target=\"_blank\">Opportunity<\/a>, <\/em>which landed on Mars in January 2004 for a three-month mission and ended its epic journey 15 years later in February 2019. This NASA video compresses <em>Opportunity<\/em>’s entire mission into four minutes and gives a poignant sense of the incredible distance that this little rover traveled over its 15-year life on Mars, doing science as it went:<\/p> <p class=\"shortcode-media shortcode-media-youtube\"> <span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span> <small class=\"image-media media-photo-credit\"><a href=\"https://www.youtube.com/watch?v=1Ll-VHYxWXU\" target=\"_blank\">NASA Jet Propulsion Laboratory/YouTube<\/a><\/small> <\/p> <p><span><em>Opportunity<\/em> drove 45.16 kilometers until a planetary-scale dust storm stopped it in its tracks, appropriately enough, in Perseverance Valley.<\/span><\/p><p>On 18 February 2021, <em>Perseverance<\/em> joined <a href=\"https://spectrum.ieee.org/curiosity-rover-jpl-mars-science\" target=\"_self\">NASA’s <em>Curiosity<\/em> rover<\/a> on the red planet, carrying the <a href=\"https://spectrum.ieee.org/nasa-designed-perseverance-helicopter-rover-fly-autonomously-mars\" target=\"_self\">Ingenuity helicopter<\/a> tucked under its belly. <em>Curiosity<\/em> and <em>Perseverance<\/em> both ditched <em>Opportunity’<\/em>s solar panels for a <a href=\"https://science.nasa.gov/planetary-science/programs/radioisotope-power-systems/power-radioisotope-thermoelectric-generators/\" target=\"_blank\">radioisotope thermoelectric generator<\/a>. <a href=\"https://spectrum.ieee.org/curiosity-rover-jpl-mars-science\" target=\"_self\"><em>Curiosity<\/em> has been active on Mars since 2012<\/a>.<\/p><p>Despite <em>Curiosity’<\/em>s nearly 10-year head start, <em>Perseverance<\/em> is the rover to first break <em>Opportunity<\/em>’s record. There are several reasons for <em>Perseverance<\/em> overtaking <em>Opportunity<\/em>—<a href=\"https://spectrum.ieee.org/if-necessary-mars-rover-curiosity-could-rip-its-own-wheels-off-to-stay-mobile\" target=\"_self\">ruggedized wheels for one<\/a>—but the biggest contributor is that <a href=\"https://spectrum.ieee.org/perseverance-mars-rover-autonomous-driving\" target=\"_self\"><em>Perseverance<\/em> was built for autonomy<\/a>. <\/p><p><span>Maimone shares how <span><span><a href=\"https://spectrum.ieee.org/tag/jpl\" target=\"_self\">JPL<\/a><\/span><\/span> added enough autonomy for its Mars rover to drive itself from 225 million km away without crashing<\/span><span>.<\/span><\/p><p class=\"shortcode-media shortcode-media-youtube\"> <span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span> <small class=\"image-media media-caption\">This animation shows Perseverance’s point of view during a drive of 807 feet (246 meters) along the rim of Jezero Crater on 10 December 2025, the 1,709th Martian day, or sol, of the mission. Captured over 2 hours and 35 minutes, 53 Navigation Camera (Navcam) image pairs were combined with rover data on orientation, wheel speed, and steering angle, as well as data from Perseverance’s Inertial Measurement Unit, and placed into a 3D virtual environment. The result is this reconstruction with virtual frames inserted about every 4 inches (0.1 meters) of drive progress.<\/small> <small class=\"image-media media-photo-credit\">JPL-Caltech/NASA<\/small> <\/p><p><strong>Let’s talk about rover autonomy on Mars. Even before <em>Perseverance,<\/em> rovers were driving themselves, right?<\/strong><\/p><p><strong>Mark Maimone:<\/strong> Yes! <em>Sojourner<\/em> [in 1997] had an early kind of autonomous behavior—for sensing, it used four <a href=\"https://www.jpl.nasa.gov/images/pia04316-sol-8/\" rel=\"noopener noreferrer\" target=\"_blank\">laser stripes<\/a> projected onto the surface, which it used to measure the height of 20 points in the terrain in front of it. It could steer around big obstacles, or even thread the needle between two things. It was a real autonomy system, which is very impressive considering its CPU was less than one megahertz. <\/p><p>With <em>Spirit<\/em> and <em>Opportunity,<\/em> I developed the autonomy for those rovers. Every time they drove, they would use 256 x 256 pixel stereo pairs to map the geometry of the terrain and find a safe route forward. <em>Spirit<\/em> actually ended up driving itself 23 percent of the time, which I was frankly shocked by, since it drove much more slowly in that mode. But using autonomy helped <em>Spirit<\/em> travel 50 percent faster than it otherwise could have<span>. <em>Opportunity<\/em> and <em>Curiosity<\/em> both only used autonomous driving about 5 percent of the time. <em>Perseverance<\/em> is the first Mars rover that drives itself 90 percent of the time, with its enhanced autonomy system that includes a second processor with <\/span><a href=\"https://spectrum.ieee.org/fpga-chip-ieee-milestone\" target=\"_self\">an FPGA<\/a><span> to speed up extra image processing operations.<\/span><\/p><p><strong>What was it like to let <em>Perseverance<\/em> drive itself for the first time?<\/strong><\/p><p><strong>Maimone:<\/strong> <em>Perseverance<\/em> is the culmination of decades of work on Mars rover autonomy, so seeing <em>Perseverance<\/em> use its AutoNav system to drive itself basically at full speed, up to 120 meters an hour, was incredible.<\/p><p class=\"shortcode-media shortcode-media-rebelmouse-image\"> <img alt=\"View of Mars' rocky surface as-captured by cameras installed on the undercarriage of a space rover.\" class=\"rm-shortcode\" id=\"245ba\" src=\"https://spectrum.ieee.org/media-library/view-of-mars-rocky-surface-as-captured-by-cameras-installed-on-the-undercarriage-of-a-space-rover.jpg?id=67675990&amp;width=980\" /> <small class=\"image-media media-caption\">These two images taken by Perseverance’s hazard avoidance and navigation cameras show (at left) the very first AutoNav drive on Mars where the rover autonomously stopped before running into a rock pile, and (at right) the second AutoNav drive where the rover successfully steered around a rock.<\/small><small class=\"image-media media-photo-credit\">JPL-Caltech/NASA<\/small><\/p><p><strong>Where are the humans in this process?<\/strong><\/p><p><strong>Maimone: <\/strong>The plan of where to go is specified by the science team, and then on the engineering side, the strategic route planning team develops a path to get us to that goal by guessing, based on lower-resolution maps from orbit, what the terrain is going to look like for the rover. Each day, a tactical operations team combines the strategic overall route with that day’s science goals to pick the actual route the rover will follow.<\/p><p>We want humans to keep doing long-range planning because that avoids wasting time. For example, we’ve learned that if we see sandy areas with intersecting waves or crests—not just ripples blown in one direction, but cross-ripples going in multiple directions—the rover tends to sink into terrain like that, so we tell the rover to keep out of those areas. The onboard autonomy only measures terrain shape, not terrain type, so it benefits from those location-based annotations.<\/p><p>We now have years of experience correlating images taken from orbit with images taken by the rover, and understanding how different kinds of terrain affect the drive. With the current orbiters at Mars, we sometimes get 25 centimeters resolution on orbital images. That’s still not quite enough to see all obstacles; there could be a big rock that doesn’t really show up on a scale of more than one or two pixels, making it very hard to notice. That is why you want to have autonomy on the rover, but the greater help we can give it at a high level, the faster we can reach our goals and the fewer potential delays we’ll encounter.<\/p><p class=\"shortcode-media shortcode-media-rebelmouse-image\"> <img alt=\"A map of Mars' surface featuring the Perseverance rover's planned path for autonomous navigation, alongside its final executed route which was diverted due to hazardous terrain. \" class=\"rm-shortcode\" id=\"2f1aa\" src=\"https://spectrum.ieee.org/media-library/a-map-of-mars-surface-featuring-the-perseverance-rover-s-planned-path-for-autonomous-navigation-alongside-its-final-executed-r.jpg?id=67675967&amp;width=980\" /> <small class=\"image-media media-caption\">This orbital view shows a region of complex Martian terrain that Perseverance could not navigate autonomously. The blue line shows the path that human planners estimated, while the white line shows the path taken by the rover. The inset image, from Perseverance’s hazard avoidance camera, shows the rocky, sandy, and sloped terrain.<\/small><small class=\"image-media media-photo-credit\">Source images: <a href=\"https://ieeexplore.ieee.org/document/11265757\" target=\"_blank\">Olivier Toupet, Masahiro Ono, et al.<\/a>; JPL-Caltech/University of Arizona/NASA <\/small><\/p><p><strong>What happens when the autonomy system on <em>Perseverance<\/em> fails?<\/strong><\/p><p><strong>Maimone: <\/strong>We ended up not using the autonomy at all for about two months in more complex terrain while we tuned things and wrote new software to deal with that new terrain we hadn’t encountered before. Some of those changes were relatively quick, and some required months of study. For example, one parameter is the maximum amount of slope that the robot is allowed to climb, because on steep slopes, there is a risk of the rover slipping sideways. <\/p><p>We landed inside Jezero Crater, which was very flat, and so for the first three years, most of our driving was at less than 14 degrees of slope. When we finally decided to leave the crater, we began to encounter other terrain at higher tilts with greater rock density, and the experience we gained allowed us to re-tune the parameters to allow the rover to traverse those more difficult terrains, with slopes of up to 24 degrees.<\/p><h2>Rover autonomy in the age of AI<\/h2><p><strong>Late last year, you let <a href=\"https://spectrum.ieee.org/perseverance-rover-nasa-anthropic-ai\" target=\"_self\">Anthropic’s Claude AI plan a 400-meter drive for <em>Perseverance<\/em><\/a>. How did that go?<\/strong><\/p><p><strong>Maimone: <\/strong>We had the AI look at the orbital images and pick out a path for us, which became the starting point of the day’s rover planning operations. Typically, that starting path comes from the human rover planner team, but in this case, it was generated by AI. Humans were still in the loop; the team reviewed it and made a couple of adjustments. AI gave us a solid starting point that allowed us to make rapid progress, because it’s much easier to validate a path than to pick one from scratch.<\/p><p class=\"shortcode-media shortcode-media-rebelmouse-image\"> <img alt=\"Selfie taken by NASA\\u2019s Perseverance rover on the planet Mars.\" class=\"rm-shortcode\" id=\"c04cd\" src=\"https://spectrum.ieee.org/media-library/selfie-taken-by-nasa-u2019s-perseverance-rover-on-the-planet-mars.jpg?id=67685143&amp;width=980\" /> <small class=\"image-media media-caption\">NASA’s Perseverance Mars rover took this selfie on July 23, 2024. The selfie is composed of 62 images taken by the WATSON (Wide Angle Topographic Sensor for Operations and eNgineering) camera on the end of the rover’s robotic arm.<\/small><small class=\"image-media media-photo-credit\">JPL-Caltech/MSSS/NASA<\/small><\/p><p><strong>Do you think humans will remain a necessary part of rover operations, or do you see the next generation of Mars rovers operating for weeks at a time without human assistance?<\/strong><\/p><p><strong>Maimone:<\/strong> One of the things that has held us back from driving very long distances autonomously is that as we drive, the rover accumulates uncertainty in its position. When the uncertainty grows, it means we have to stay farther away from areas that human rover planners have identified as being potentially dangerous, called “keep-out zones.” In some cases, the uncertainty gets high enough that the rover can’t plan a safe path, because the keep-out zones (which grow with the rover’s uncertainty) get too big.<\/p><p>We now have a new capability that we’ve added to <em>Perseverance<\/em> called <a href=\"https://www.nasa.gov/missions/mars-2020-perseverance/perseverance-rover/nasas-perseverance-now-autonomously-pinpoints-its-location-on-mars/\" target=\"_blank\">Mars Global Localization<\/a>. With this new technology  that can shrink our uncertainty, we theoretically have the ability to go as long as we have resources to keep driving safely based on our maps and keep-out zones.<\/p><p>But to truly run a mission for weeks, you need to not only drive long distances, but also execute science operations autonomously. We have people here also looking at automating science operations by doing image processing onboard the rover to get a better understanding of what’s out there and where to focus the instruments’ attention. So I do think we are getting to the point where we can support long-period autonomous operations. It has been a slow evolution, but we have great capabilities now and a good understanding of what’s needed to make it work well.<\/p><p><strong>As someone who has been involved with all of these Mars rovers—<a href=\"https://www.jpl.nasa.gov/news/nasa-to-begin-attempts-to-free-sand-trapped-mars-rover/\" target=\"_blank\">including one that got stuck<\/a>—do you fundamentally trust <em>Perseverance<\/em> to operate autonomously?<\/strong><\/p><p><strong>Maimone: <\/strong>I do. We built the software, tested it, ran millions of simulations, and did lots of work in the field in many different test environments. It hasn’t steered us wrong yet. We’re looking forward to setting even bigger records.<\/p>"}, {"title": "Promise Robotics partners with D.R. Horton on physical AI for homebuilding", "source": "Robotics Business Review", "date": "2026-10-13", "url": "https://www.therobotreport.com/promise-robotics-partners-d-r-horton-physical-ai-homebuilding/", "summary": "<p>Promise Robotics has signed a multi-year partnership with America's largest homebuilder by volume to bring physical AI to construction.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/promise-robotics-partners-d-r-horton-physical-ai-homebuilding/\">Promise Robotics partners with D.R. Horton on physical AI for homebuilding<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Hello Robot, A&K Robotics to discuss how robots navigate crowded indoor spaces at RoboBusiness", "source": "Robotics Business Review", "date": "2026-10-13", "url": "https://www.therobotreport.com/hello-robot-ak-robotics-discuss-how-robots-navigate-crowded-indoor-spaces-robobusiness/", "summary": "<p>As robots move beyond warehouses and other controlled environments and into everyday life, navigation challenges will be critical.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/hello-robot-ak-robotics-discuss-how-robots-navigate-crowded-indoor-spaces-robobusiness/\">Hello Robot, A&#038;K Robotics to discuss how robots navigate crowded indoor spaces at RoboBusiness<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "NYSOFA expands partnership with Intuition Robotics to bring ElliQ to more seniors", "source": "Robotics Business Review", "date": "2026-10-13", "url": "https://www.therobotreport.com/nysofa-expands-partnership-intuition-robotics-bring-elliq-more-seniors/", "summary": "<p>With the expansion, NYSOFA and Intuition Robotics established a new three-year, $2.1 million agreement to keep rolling out ElliQ.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/nysofa-expands-partnership-intuition-robotics-bring-elliq-more-seniors/\">NYSOFA expands partnership with Intuition Robotics to bring ElliQ to more seniors<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Closing the reality gap: Why real-time execution has become the new competitive advantage", "source": "Robotics Business Review", "date": "2026-10-12", "url": "https://www.therobotreport.com/closing-reality-gap-why-real-time-execution-has-become-new-competitive-advantage/", "summary": "<p>Daifuku's Cecile Dick-Calmes said success is no longer measured solely by automation density or equipment utilization.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/closing-reality-gap-why-real-time-execution-has-become-new-competitive-advantage/\">Closing the reality gap: Why real-time execution has become the new competitive advantage<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Will ‘boring’ robots win in the real world? Why robotic form should follow workflow", "source": "Robotics Business Review", "date": "2026-10-11", "url": "https://www.therobotreport.com/will-boring-robots-win-in-the-real-world-why-robotic-form-should-follow-workflow/", "summary": "<p>If we want to move physical AI from social media feeds to a sustained commercial level, we must reverse our current approach.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/will-boring-robots-win-in-the-real-world-why-robotic-form-should-follow-workflow/\">Will &#8216;boring&#8217; robots win in the real world? Why robotic form should follow workflow<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Why dexterity is physical AI’s real bottleneck", "source": "Robotics Business Review", "date": "2026-10-10", "url": "https://www.therobotreport.com/why-dexterity-is-physical-ai-real-bottleneck/", "summary": "<p>The next major challenge in robotic dexterity is making the entire system reliable enough to turn capabilities into useful work.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/why-dexterity-is-physical-ai-real-bottleneck/\">Why dexterity is physical AI&#8217;s real bottleneck<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Video Friday: Robot Decommissioning Takes a Fun Turn", "source": "IEEE Spectrum Robotics", "date": "2026-10-09", "url": "https://spectrum.ieee.org/video-friday-reachy-mini-raps", "summary": "<img src=\"https://spectrum.ieee.org/media-library/an-ai-generated-image-of-a-smiling-humanoid-robot-in-robe-free-falls-into-deep-pit-filled-with-colorful-balls.jpg?id=68398684&amp;width=1245&am
