ne robot fleet operations, scale inspections", "source": "Robotics Business Review", "date": "2026-10-01", "url": "https://www.therobotreport.com/anybotics-launches-shift-streamline-robot-fleet-operations-scale-autonomous-inspections/", "summary": "<p>ANYbotics designed Shift to help maintenance teams run industrial inspections, detect failing equipment, and turn data into work orders.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/anybotics-launches-shift-streamline-robot-fleet-operations-scale-autonomous-inspections/\">ANYbotics launches Shift to streamline robot fleet operations, scale inspections<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Boston Dynamics drops pinkie on new humanoid hand", "source": "Robotics Business Review", "date": "2026-10-01", "url": "https://www.therobotreport.com/boston-dynamics-drops-pinkie-on-new-humanoid-hand/", "summary": "<p>Boston Dynamics engineers taped their pinkies and ring fingers together for a day to learn what they weren’t able to do.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/boston-dynamics-drops-pinkie-on-new-humanoid-hand/\">Boston Dynamics drops pinkie on new humanoid hand<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Precision In Motion. Vishay Precision Group, Inc. (VPG) to Showcase Custom Sensing Capabilities for Humanoid Robotics at RoboBusiness 2026", "source": "Robotics Business Review", "date": "2026-10-01", "url": "https://www.therobotreport.com/precision-in-motion-vishay-precision-group-inc-vpg-to-showcase-custom-sensing-capabilities-for-humanoid-robotics-at-robobusiness-2026/", "summary": "<p>As humanoid robots move from research labs into factories, warehouses, homes, and other shared spaces, accurate physical feedback becomes crucial.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/precision-in-motion-vishay-precision-group-inc-vpg-to-showcase-custom-sensing-capabilities-for-humanoid-robotics-at-robobusiness-2026/\">Precision In Motion. Vishay Precision Group, Inc. (VPG) to Showcase Custom Sensing Capabilities for Humanoid Robotics at RoboBusiness 2026<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Your Robot’s Safety Functions Already Work. What If the Input Lies?", "source": "Robotics Business Review", "date": "2026-10-01", "url": "https://www.therobotreport.com/your-robots-safety-functions-already-work-what-if-the-input-lies/", "summary": "<p>A robot can follow its safety rules and still act on manipulated information. See what this means for robot safety and how teams can strengthen their testing and evidence.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/your-robots-safety-functions-already-work-what-if-the-input-lies/\">Your Robot’s Safety Functions Already Work. What If the Input Lies?<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Top 10 robotics stories of September 2026", "source": "Robotics Business Review", "date": "2026-10-01", "url": "https://www.therobotreport.com/top-10-robotics-stories-of-september-2026/", "summary": "<p>In September 2026, live events such as IMTS, ROSCon, and iROS brought a flood of robotics developments.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/top-10-robotics-stories-of-september-2026/\">Top 10 robotics stories of September 2026<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Tackling construction labor shortages: ASI and SoftBank partner on autonomous fleets", "source": "Robotics Business Review", "date": "2026-09-30", "url": "https://www.therobotreport.com/tackling-construction-labor-shortages-asi-softbank-partner-autonomous-fleets/", "summary": "<p>ASI and SoftBank join forces with $225M to scale brand-agnostic autonomous heavy equipment across infrastructure projects.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/tackling-construction-labor-shortages-asi-softbank-partner-autonomous-fleets/\">Tackling construction labor shortages: ASI and SoftBank partner on autonomous fleets<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "The Robot Report parent Arrowfly launches AI for Engineers platform, events for engineers navigating AI", "source": "Robotics Business Review", "date": "2026-09-30", "url": "https://www.therobotreport.com/robot-report-parent-arrowfly-launches-ai-for-engineers-platform-events-engineers-navigating-ai/", "summary": "<p>The initiative for engineers includes a news desk, a conference, research, and an advisory board, grounded in trusted editorial brands.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/robot-report-parent-arrowfly-launches-ai-for-engineers-platform-events-engineers-navigating-ai/\">The Robot Report parent Arrowfly launches AI for Engineers platform, events for engineers navigating AI<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Innodata opens motion-capture lab to help humanoids move more like people", "source": "Robotics Business Review", "date": "2026-09-30", "url": "https://www.therobotreport.com/innodata-opens-motion-capture-lab-help-humanoids-move-more-like-people/", "summary": "<p>Innodata uses Vicon cameras to measure movements with sub-millimeter accuracy and to collect real-world training data for robots.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/innodata-opens-motion-capture-lab-help-humanoids-move-more-like-people/\">Innodata opens motion-capture lab to help humanoids move more like people<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Meet Flourish One, the Raspberry Pi-powered humanoid built for busy parents", "source": "Robotics Business Review", "date": "2026-09-29", "url": "https://www.therobotreport.com/meet-flourish-one-raspberry-pi-powered-humanoid-built-busy-parents/", "summary": "<p>Flourish is releasing a $3,555 phone-trainable home robot, targeting busy parents with personalized, cloud-trained chore automation.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/meet-flourish-one-raspberry-pi-powered-humanoid-built-busy-parents/\">Meet Flourish One, the Raspberry Pi-powered humanoid built for busy parents<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "State of Robots in Manufacturing", "source": "Robotics Business Review", "date": "2026-09-29", "url": "https://www.therobotreport.com/state-of-robots-in-manufacturing/", "summary": "<p>The Robot Report looks at recent advances in automation for manufacturing, from improvements in technologies and use cases to the potential of humanoids and AI.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/state-of-robots-in-manufacturing/\">State of Robots in Manufacturing<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "ForceN to give a crash course on force and torque sensing for humanoids at RoboBusiness", "source": "Robotics Business Review", "date": "2026-09-29", "url": "https://www.therobotreport.com/forcen-gives-crash-course-force-torque-sensing-humanoids-robobusiness-2026/", "summary": "<p>Attendees will learn about the many ways they can use force and torque sensors in humanoids and how to avoid breaking them while doing it.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/forcen-gives-crash-course-force-torque-sensing-humanoids-robobusiness-2026/\">ForceN to give a crash course on force and torque sensing for humanoids at RoboBusiness<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Gecko Robotics works with NVIDIA to add AI agent security and control", "source": "Robotics Business Review", "date": "2026-09-28", "url": "https://www.therobotreport.com/gecko-robotics-works-with-nvidia-adds-ai-agent-security-and-control/", "summary": "<p>Gecko Robotics is using the new NVIDIA Open Agent Safety Platform to ensure the secure autonomous control of systems.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/gecko-robotics-works-with-nvidia-adds-ai-agent-security-and-control/\">Gecko Robotics works with NVIDIA to add AI agent security and control<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Raise Robotics to discuss scaling field robots at RoboBusiness", "source": "Robotics Business Review", "date": "2026-09-28", "url": "https://www.therobotreport.com/raise-robotics-discuss-scaling-field-robots-robobusiness/", "summary": "<p>Raise Robotics said attendees will learn a decision rule for allocating engineering capacity and a vocabulary for two hidden failure modes.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/raise-robotics-discuss-scaling-field-robots-robobusiness/\">Raise Robotics to discuss scaling field robots at RoboBusiness<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "A Day in the Life of a Roboticist: Charlie Kemp", "source": "IEEE Spectrum Robotics", "date": "2026-09-28", "url": "https://robotsguide.com/learn/a-day-in-the-life-of-a-roboticist-charlie-kemp", "summary": "<img src=\"https://spectrum.ieee.org/media-library/man-standing-beside-a-tall-wheeled-robot-smiling-and-waving-at-the-camera.jpg?id=67880303&amp;width=1200&amp;height=800&amp;coordinates=0%2C83%2C0%2C84\" /><br /><br /><p>Building useful robots starts with understanding the people who use them. For Charlie Kemp, cofounder and chief technology officer of Hello Robot, that means developing assistive robots that can help people with everyday tasks and support greater independence.<\/p><p>In this <a href=\"https://robotsguide.com/\" target=\"_blank\">Robots Guide<\/a> profile, Kemp shares his path from studying artificial intelligence at MIT to building Stretch, explains how working with people with disabilities has shaped his approach, and offers advice for aspiring roboticists. <a href=\"https://robotsguide.com/learn/a-day-in-the-life-of-a-roboticist-charlie-kemp\" rel=\"noopener noreferrer\" target=\"_blank\">Read the full profile on IEEE’s Robots Guide.<\/a><\/p>"}, {"title": "Robonomics on the threshold: Economic autonomy, smart cities, and crypto wallets for humanoids", "source": "Robotics Business Review", "date": "2026-09-28", "url": "https://www.therobotreport.com/robotics-threshold-economic-autonomy-crypto-wallets-humanoids/", "summary": "<p>Economics is both a robotics impetus and a constraint, as systems make deliveries on streets or do chores in households.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/robotics-threshold-economic-autonomy-crypto-wallets-humanoids/\">Robonomics on the threshold: Economic autonomy, smart cities, and crypto wallets for humanoids<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Asimov’s laws are not enough to keep robotics and AI safe", "source": "Robotics Business Review", "date": "2026-09-27", "url": "https://www.therobotreport.com/asimovs-laws-are-not-enough-keep-robotics-ai-safe/", "summary": "<p>Asimov's fictional Three Laws of Robotics famously set safeguards, and tech observers today raise similar concerns about AI.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/asimovs-laws-are-not-enough-keep-robotics-ai-safe/\">Asimov&#8217;s laws are not enough to keep robotics and AI safe<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "From 14 cities to 15,000: What it will take to scale robotaxis?", "source": "Robotics Business Review", "date": "2026-09-26", "url": "https://www.therobotreport.com/from-14-cities-to-15000-what-it-will-take-to-scale-robotaxis/", "summary": "<p>While robotaxis prove their driving ability, scaling the industry globally requires solving the unglamorous challenge of fast, local vehicle servicing.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/from-14-cities-to-15000-what-it-will-take-to-scale-robotaxis/\">From 14 cities to 15,000: What it will take to scale robotaxis?<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Farmers are facing more pressure; CNH says robotics can help", "source": "Robotics Business Review", "date": "2026-09-25", "url": "https://www.therobotreport.com/farmers-are-facing-more-pressure-cnh-says-robotics-can-help/", "summary": "<p>Labor availability, costs, productivity, and efficiency are common concerns of farmers that technology can address, according to CNH. <\/p>\n<p>The post <a href=\"https://www.therobotreport.com/farmers-are-facing-more-pressure-cnh-says-robotics-can-help/\">Farmers are facing more pressure; CNH says robotics can help<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Video Friday: Life’s Better With a Little Robot Goose", "source": "IEEE Spectrum Robotics", "date": "2026-09-25", "url": "https://spectrum.ieee.org/video-friday-goose-household-robots", "summary": "<img src=\"https://spectrum.ieee.org/media-library/mobile-assistive-robot-with-articulated-arm-beside-coffee-table-in-cozy-living-room.png?id=67853191&amp;width=1200&amp;height=800&amp;coordinates=150%2C0%2C150%2C0\" /><br /><br /><p><span>Video Friday is your weekly selection of awesome robotics videos, collected by your friends at <\/span><em>IEEE Spectrum<\/em><span> robotics. We also post a weekly calendar of upcoming robotics events for the next few months. Please <\/span><a href=\"mailto:automaton@ieee.org?subject=Robotics%20event%20suggestion%20for%20Video%20Friday\">send us your events<\/a><span> for inclusion.<\/span><\/p><h5><a href=\"https://2026.ieee-iros.org/\">IROS 2026<\/a>: 27 September–1 October 2026, PITTSBURGH<\/h5><h5><a href=\"https://www.corl.org/\">CoRL 2026<\/a>: 9–12 November 2026, AUSTIN, TEXAS<\/h5><h5><a href=\"https://2026.ieee-humanoids.org/\">Humanoids 2026<\/a>: 6–9 December 2026, SANTA CLARA, CALIF.<\/h5><p>Enjoy today’s videos!<\/p><div class=\"horizontal-rule\"><\/div><div><span style=\"display: none;\"> <\/span><\/div><blockquote class=\"rm-anchors\" id=\"e502xyw7e1g\"><em>Life’s better with a little Goose.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.therobotworks.ai/\">The Robot Works<\/a> ]<\/p><p>Thanks, Dave!<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"mai4evtj4dm\">Skydio has introduced the F10, a charmingly lopsided <a href=\"https://spectrum.ieee.org/skydio-camera-drone-autonomous-flying\" target=\"_blank\">fixed-wing drone<\/a>, that uses a robot arm for autonomous launch and capture.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>Unfortunately, based on the frequency of that flashing LED on the drone, this video appears to have sped up the capture (and likely the launch) by a substantial amount.<\/p><p>[ <a href=\"https://www.skydio.com/f10\">Skydio<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"lqdeoreu6bi\">I want a bunch of these little guys. I don’t know what I’d do with them. But I want them.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://freeformrobotics.org/publications/\">Freeform Robotics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"lfkoi0mvwos\"><em>Walking robots are everywhere now…. But 30 years ago, they were brand new. The first ever robot that could walk by itself was the <a href=\"https://spectrum.ieee.org/honda-p2-robot-ieee-milestone\" target=\"_blank\">Honda P2<\/a>. The P2 featured motors and hydraulics in the hips, knees, and ankles to walk around, and weighed over 300 pounds.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://spectrum.ieee.org/honda-p2-robot-ieee-milestone\">IEEE Spectrum<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"lat2rikjhto\"><em>Precision biomimetic dexterous hand, priced from US $6,500.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.unitree.com/Dex2-5\">Unitree<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"jimw_ligkvq\">What if all it took to train a drone to do acrobatics was to tell it whether you like the way it flies?<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://rpg.ifi.uzh.ch/docs/IROS26_Geles_PbRL.pdf\">UZH Robotics and Perception Group<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"ktncpptpsqe\">Why build a <a href=\"https://spectrum.ieee.org/video-friday-robotic-hands-2674168909\" target=\"_blank\">humanoid hand<\/a> when a <a href=\"https://spectrum.ieee.org/aussies-win-amazon-robotics-challenge\" target=\"_blank\">robot hand<\/a> can do stuff like this?<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://generalroboticslab.com/cartesian_handv1\">General Robotics Lab<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"etzdogql56c\"><em>Diane Heinle, a mechanical engineer at Boston Dynamics, answers questions about endurance testing for Stretch, how her team simulates years of wear on robot parts over a brief time in the lab, and why there are bird heads on them.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://bostondynamics.com/blog/ask-a-roboticist-meet-diane/\">Boston Dynamics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"0qus7bzzkas\"><em>ULOHA brings learning from demonstrations to two robot arms working underwater. We developed custom leader–follower hardware and software extending LeRobot to connect teleoperation, demonstration collection, and autonomous manipulation. The video shows the robots lifting objects together, passing objects between arms, opening a container, and catching a sponge as it rises through the water. We also explore how bubbles and action-execution timing affect learned behaviors.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://mertcookimg.github.io/uloha/\">ULOHA<\/a> ]<\/p><p>Thanks, Masato!<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"n6cl5gi0c0u\">Usually, ballbots rely on an internal pendulum, but here’s a different approach.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://generalroboticslab.com/MARBLE\">General Robotics Lab<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"hnlfompekgk\"><em>From long-horizon manipulation to tactile-guided actions, this video highlights selected collaborations that explore what Astribot robots can do.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.astribot.com/en/product\">Astribot<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"vu5w9_nmet4\">This is one of those tasks that looks a little boring but is actually both very tricky and very useful.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://arxiv.org/abs/2509.10979\">HiPeR Lab<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"5u0rzdl7jvi\">That tiny little excavator playing in flour is adorbs.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://arxiv.org/abs/2609.12677v1\">ETH Zurich Robotic Systems Lab<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"vh9ucogdwcm\">How do you fit a humanoid robot into a box?<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.limxdynamics.com/en/products/luna\">LimX Dynamics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"bykyz9qwqcw\">And now, this.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><blockquote><em>At the Opening Ceremony of WorldSkills Shanghai 2026 on 22 September, 19 Unitree humanoid robots performed alongside 120 dancers, presenting the world’s largest-scale performance featuring full-size general-purpose humanoid robots before an audience of more than 10,000 people, with a fully AI-driven autonomous robot cluster performance live-streamed worldwide in real time.<\/em><\/blockquote><p>[ <a href=\"https://unitree.com/\">Unitree<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"fd9mleerkpg\"><em>A microwave box creates a surprisingly tricky vision system challenge: there’s a picture of a microwave on the side of the box, and that microwave has a window. From the camera’s perspective, it’s a box inside a box inside a box.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.picklerobot.com/\">Pickle Robot Company<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"l6bsqc5cccw\">What exactly is Physical AI? Personally I think it’s just what robotics has always been, more or less, except that everything has to have “AI” in it now, so here we are.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.csail.mit.edu/news/\">MIT CSAIL<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"dx_dlmrlh60\"><em>As the evolution of the UR Series, the g‑Series is designed to accelerate how robots are integrated into complete automation systems. It connects more directly with cameras, higher power EOATs, and control systems, eliminating external cabling and hardware to streamline integration. This enables cleaner and faster deployment of advanced automation.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.universal-robots.com/news-and-media/news-center/universal-robots-unveils-gen-7-new-platform-industrial-automation-physical-ai/\">Universal Robots<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div>"}, {"title": "Agility Robotics, maker of Digit humanoid, exploring wheeled robots", "source": "Robotics Business Review", "date": "2026-09-25", "url": "https://www.therobotreport.com/agility-robotics-maker-of-digit-humanoid-exploring-wheeled-robots/", "summary": "<p>Agility Robotics is exploring a range of robot designs and form factors, including wheels, to address different operating environments and customer needs.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/agility-robotics-maker-of-digit-humanoid-exploring-wheeled-robots/\">Agility Robotics, maker of Digit humanoid, exploring wheeled robots<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Amazon to invest $100M in new Indiana manufacturing facility", "source": "Robotics Business Review", "date": "2026-09-25", "url": "https://www.therobotreport.com/amazon-to-invest-100m-in-new-indiana-manufacturing-facility/", "summary": "<p>The new facility will produce products that power Amazon's fulfillment and robotics network across North America.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/amazon-to-invest-100m-in-new-indiana-manufacturing-facility/\">Amazon to invest $100M in new Indiana manufacturing facility<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "General Robotics is betting on modular intelligence, not one robot brain", "source": "Robotics Business Review", "date": "2026-09-25", "url": "https://www.therobotreport.com/general-robotics-is-betting-on-modular-intelligence-not-one-robot-brain/", "summary": "<p>Rather than training one model to do everything, General Robotics composes specialized capabilities—helping robots adapt across tasks and form factors.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/general-robotics-is-betting-on-modular-intelligence-not-one-robot-brain/\">General Robotics is betting on modular intelligence, not one robot brain<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Why you should look beyond the spec sheet when choosing motion architecture", "source": "Robotics Business Review", "date": "2026-09-24", "url": "https://www.therobotreport.com/why-you-should-look-beyond-spec-sheet-when-choosing-motion-architecture/", "summary": "<p>Choosing the right motion architecture is about understanding how the entire system will behave in use, explains Kollmorgen.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/why-you-should-look-beyond-spec-sheet-when-choosing-motion-architecture/\">Why you should look beyond the spec sheet when choosing motion architecture<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Epson introduces AX6 cobot with compact design, no-code programming", "source": "Robotics Business Review", "date": "2026-09-24", "url": "https://www.therobotreport.com/epson-introduces-ax6-cobot-compact-design-no-code-programming/", "summary": "<p>Epson Robots has expanded its six-axis robot line with the AX6, a lightweight force- and power-limited arm.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/epson-introduces-ax6-cobot-compact-design-no-code-programming/\">Epson introduces AX6 cobot with compact design, no-code programming<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "ANYbotics opens the door for inspections with ANYmal robots", "source": "Robotics Business Review", "date": "2026-09-24", "url": "https://www.therobotreport.com/anybotics-opens-the-door-for-inspections-with-anymal-robots/", "summary": "<p>ANYbotics partnered with dormakaba and LEGIC Identsystems to enable the ANYmal quadruped to gain access like a badged employee.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/anybotics-opens-the-door-for-inspections-with-anymal-robots/\">ANYbotics opens the door for inspections with ANYmal robots<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Mexican EPICS in IEEE Team Builds Portable Educational Platform", "source": "IEEE Spectrum Robotics", "date": "2026-09-24", "url": "https://spectrum.ieee.org/epics-in-ieee-portable-educational", "summary": "<img src=\"https://spectrum.ieee.org/media-library/four-young-adult-students-laugh-together-while-one-of-them-holds-a-robot-shaped-like-a-hexagonal-cylinder.jpg?id=67845427&amp;width=1200&amp;height=800&amp;coordinates=156%2C0%2C156%2C0\" /><br /><br /><p>In Guadalajara, Mexico, many high schools have motivated teachers and talented students with an interest in science, technology, engineering, and mathematics, but they lack access to advanced tools such as robotics laboratories. The resources shortfall limits the students’ opportunities for hands-on learning on cutting-edge applications.<\/p><p>A team from <a href=\"https://apps.iteso.mx/web/iteso/inicio\" rel=\"noopener noreferrer\" target=\"_blank\">ITESO, Universidad Jesuita de Guadalajara<\/a>, is working to change that. Through the <a href=\"https://epics.ieee.org\" rel=\"noopener noreferrer\" target=\"_blank\">EPICS in IEEE<\/a> initiative, a multidisciplinary group of 15 engineering students, faculty advisors, and <a href=\"https://www.ieeegdl.org/\" rel=\"noopener noreferrer\" target=\"_blank\">IEEE Guadalajara Section<\/a> volunteers developed RoboMeshA. The portable, self-contained educational platform brings robotics and AI experiences into classrooms.<\/p><p><a href=\"https://spectrum.ieee.org/epics-in-ieee-15th-anniversary\" target=\"_self\">EPICS<\/a> is administered by <a href=\"https://ea.ieee.org\" rel=\"noopener noreferrer\" target=\"_blank\">IEEE Educational Activities<\/a> and funded by the <a href=\"https://www.ieee-ras.org/\" rel=\"noopener noreferrer\" target=\"_blank\">IEEE Robotics and Automation Society<\/a>.<\/p><h2>A mobile laboratory<\/h2><p>Rather than requiring a school to build a dedicated computer lab or install complex software, RoboMeshA<em> <\/em>operates as an all-in-one mobile learning network.<\/p><p>“RoboMeshA brings robotics and AI to students who don’t have access to specialized facilities or preinstalled software,” says team member Fernando Vidal Luna, an IEEE student member and a mechatronics engineering major at ITESO.<\/p><p>Students connect directly to the platform from a user-friendly web browser. They can interact with the robot manually or use its control modes to watch it move and detect and avoid obstacles.<\/p><p>“The project combines mechanical design, embedded systems, control engineering, computer vision, and AI into a single robotic system that functions as a mobile learning laboratory,” says faculty advisor <a href=\"https://www.linkedin.com/in/jorgealizarraga/\" rel=\"noopener noreferrer\" target=\"_blank\">Jorge A. Lizarraga<\/a>.<\/p><p>The team says young students are interested in technology, programming, and robotics but don’t have an opportunity to work with systems that combine mechanics, electronics, software, and control.<\/p><p>“RoboMeshA allows students to see how all these disciplines work together in a tangible and understandable way,” says team member José S. González, who also is studying mechatronics engineering.<\/p><p>The team has built two units and is developing a modular coupling framework to expand the system’s capabilities for research and classroom demonstrations. The structured system design approach connects independent software components while minimizing internal dependencies, enabling four RobotMeshA robots to operate together.<\/p><h2>Overcoming design challenges<\/h2><p>The team faced significant hurdles while designing the project.<\/p><p>“One key challenge involved the robot’s structural design,” Luna says. “It wasn’t only about making a chassis where all the components fit and the design had sufficient stability, rigidity, and weight distribution. It was also about ensuring that the electronics were protected while still being accessible for maintenance, testing, and modifications.”<\/p><p>“It was also challenging to design a platform that could be used by students with different levels of experience,” González adds.<\/p><p class=\"pull-quote\">“When students realize the technology they develop can inspire others and improve lives, engineering becomes far more meaningful.” <strong>—Luis Fernando Luque-Vega<\/strong><\/p><p>The team partnered with the <a href=\"https://www.colomos.ceti.mx/\" target=\"_blank\">CETI Colomos<\/a> and <a href=\"https://prepa.iteso.mx/\" rel=\"noopener noreferrer\" target=\"_blank\">Prepa ITESO<\/a> high schools to validate the platform in classroom settings.<\/p><p>“We wanted the first interactions with the robot to be simple and intuitive,” González says, “such that students could simply power the robot, connect to its network, and begin interacting with it, rather than having to deal with software installation, extensive configuration, or troubleshooting.”<\/p><h2>Engineering with social impact<\/h2><p>Many of the students who participated were from ITESO’s applied professional projects program. The experience offered them <a href=\"https://spectrum.ieee.org/hands-on-projects-career-advice\" target=\"_self\">practical training<\/a> in project management, system integration, and user-centered design.<\/p><p>The team also presented a research paper and a project poster in May at the <a href=\"https://congresossuj.mx/congresos/3er-congreso-de-ingenierias-suj/\" rel=\"noopener noreferrer\" target=\"_blank\">Engineering Congress of the Jesuit University System<\/a>.<\/p><p>“Seeing a design move from a digital model to a physical system was invaluable,” González says. “Working with students from different backgrounds taught us to listen to end users and design for their actual needs.”<\/p><p>Project lead <a href=\"https://www.linkedin.com/in/luis-fernando-luque-vega-289aa348/\" rel=\"noopener noreferrer\" target=\"_blank\">Luis Fernando Luque-Vega<\/a>, an IEEE member, says he’d like the venture to serve as a blueprint for engineering education.<\/p><p>“I hope RoboMeshA<em> <\/em>is adopted by schools, universities, and IEEE student branches across Mexico and internationally as a model for integrating technical innovation with community engagement,” Luque-Vega says.<\/p><p>By pairing engineering talent with community service, initiatives such as EPICS in IEEE demonstrate how targeted support can turn academic concepts into real-world solutions.<\/p><p>“When students realize the technology they develop can inspire others and improve lives, engineering becomes far more meaningful,” Luque-Vega says.<\/p><p>For more information on service-learning opportunities, visit the <a href=\"https://epics.ieee.org/\" rel=\"noopener noreferrer\" target=\"_blank\">EPICS website<\/a>.<\/p>"}, {"title": "5 million robots are now at work in factories worldwide, reports the IFR", "source": "Robotics Business Review", "date": "2026-09-24", "url": "https://www.therobotreport.com/5-million-robots-now-working-factories-worldwide-ifr-reports/", "summary": "<p>China still leads the world in industrial robot installations, but the U.S. and Germany are also significant markets, found the IFR.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/5-million-robots-now-working-factories-worldwide-ifr-reports/\">5 million robots are now at work in factories worldwide, reports the IFR<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Qualcomm to acquire PickNik Robotics and keep MoveIt open-source", "source": "Robotics Business Review", "date": "2026-09-23", "url": "https://www.therobotreport.com/qualcomm-acquires-picknik-robotics-keep-moveit-open-source/", "summary": "<p>Qualcomm plans to integrate the Dragonwing and Arduino platforms with the MoveIt open-source manipulation framework.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/qualcomm-acquires-picknik-robotics-keep-moveit-open-source/\">Qualcomm to acquire PickNik Robotics and keep MoveIt open-source<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Helicon brings automation to high-volume composites manufacturing", "source": "Robotics Business Review", "date": "2026-09-23", "url": "https://www.therobotreport.com/helicon-brings-automation-high-volume-composites-manufacturing/", "summary": "<p>Helicon has obtained seed funding to use automation to cut composite manufacturing lead times from months to weeks.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/helicon-brings-automation-high-volume-composites-manufacturing/\">Helicon brings automation to high-volume composites manufacturing<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "State of Humanoids keynote brings industry leaders to RoboBusiness", "source": "Robotics Business Review", "date": "2026-09-23", "url": "https://www.therobotreport.com/state-of-humanoids-keynote-brings-industry-leaders-robobusiness/", "summary": "<p>At RoboBusiness, industry leaders will discuss the state of humanoids as the robots transition from demos to real industrial deployments.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/state-of-humanoids-keynote-brings-industry-leaders-robobusiness/\">State of Humanoids keynote brings industry leaders to RoboBusiness<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}], "embeddedNews": [{"title": "The Oldest Windows App To Still Run On WIndows 11", "source": "Hackaday", "date": "2026-10-27", "url": "https://hackaday.com/2026/10/26/the-oldest-windows-app-to-still-run-on-windows-11/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"450\" src=\"https://hackaday.com/wp-content/uploads/2026/10/oldest-winapp-featured.jpg?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>In the open source world we are used to software being compiled from source for our particular distro, so while in a few cases an ancient release may still be <a class=\"read-more\" href=\"https://hackaday.com/2026/10/26/the-oldest-windows-app-to-still-run-on-windows-11/\">&#8230;read more<\/a>"}, {"title": "In Praise Of A Legendary Power Transistor", "source": "Hackaday", "date": "2026-10-27", "url": "https://hackaday.com/2026/10/26/in-praise-of-a-legendary-power-transistor/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"450\" src=\"https://hackaday.com/wp-content/uploads/2026/10/2n3055-featured.jpg?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>There are some devices which achieve electronic immortality, it&#8217;s likely that you have used a few of them yourself. The 555 timer of course, or the 741 op-amp. [ElectronicsNotes] is <a class=\"read-more\" href=\"https://hackaday.com/2026/10/26/in-praise-of-a-legendary-power-transistor/\">&#8230;read more<\/a>"}, {"title": "Rockchip RK3576-powered SMARC 2.2 system-on-module and development board target Edge AI applications", "source": "CNX Software", "date": "2026-10-27", "url": "https://www.cnx-software.com/2026/10/27/rockchip-rk3576-powered-smarc-2-2-system-on-module-and-development-board-target-edge-ai-applications/", "summary": "<div><img alt=\"MYIR MYC-JR3576 system-on-module\" class=\"attachment-medium size-medium wp-post-image\" height=\"432\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/10/MYIR-JR3576-system-on-module-720x432.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>MYIR MYC-JR3576 is a SMARC 2.2 system-on-module (SoM) powered by a Rockchip RK3576/RK3576J octa-core Cortex-A72/A53 SoC with a 6 TOPS NPU designed for Edge AI applications. It features up to  8GB LPDDR5, up to 64GB eMMC flash, an optional WiFI 6E and Bluetooth 5.4 module, and exposes all I/Os through a 314-pin MXM connector as defined in the SMARC 2.2 standard. The company says it&#8217;s the socketed counterpart to its LGA-packaged MYC-LR3576 (43 x 45 mm) module introduced in 2024, so the same processor is now available in both solder-down and standard form factors from MYiR. MYC-JR3576 &#8211; Rockchip RK3576 SMARC 2.2 module MYIR MYC-JR3576 specifications: SoC – Rockchip RK3576 (commercial) or RK3576J (industrial) CPU 4x Cortex-A72 cores @ 2.2GHz, four Cortex-A53 cores @ 1.8GHz Arm Cortex-M0 MCU at 400MHz GPU – ARM Mali-G52 MC3 GPU with support for OpenGL ES 1.1, 2.0 and 3.2, OpenCL up to 2.0 and [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/10/27/rockchip-rk3576-powered-smarc-2-2-system-on-module-and-development-board-target-edge-ai-applications/\">Rockchip RK3576-powered SMARC 2.2 system-on-module and development board target Edge AI applications<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Exploiting Piezoelectricity", "source": "Electronics Weekly", "date": "2026-10-27", "url": "https://www.electronicsweekly.com/blogs/mannerisms/memory-lane/the-inexplicability-of-piezoelectricity-2026-10/", "summary": "<p>&#160; A PROPERTY of many semiconductors which so far has not been exploited is that of piezoelectricity. So, 65 years ago, started a story in the ‘Tomorrow’s Thinking’ column of [&#8230;]<\/p>\n<p>The post <a href=\"https://www.electronicsweekly.com/blogs/mannerisms/memory-lane/the-inexplicability-of-piezoelectricity-2026-10/\">Exploiting Piezoelectricity<\/a> appeared first on <a href=\"https://www.electronicsweekly.com\">Electronics Weekly<\/a>.<\/p>"}, {"title": "Enable Resizable BAR on Unsupported Motherboards", "source": "Hackaday", "date": "2026-10-26", "url": "https://hackaday.com/2026/10/26/enable-resizable-bar-on-unsupported-motherboards/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"459\" src=\"https://hackaday.com/wp-content/uploads/2026/10/arc-rebar_fix_rod_burlamaqui_github.png?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>Recently [Rod Burlamaqui] released the arc-rebar project on GitHub, enabling Intel GPUs to work significantly more efficiently if the system&#8217;s mainboard does not support resizable BAR. It does require a <a class=\"read-more\" href=\"https://hackaday.com/2026/10/26/enable-resizable-bar-on-unsupported-motherboards/\">&#8230;read more<\/a>"}, {"title": "Practice Japanese on an Inkplate 4Tempera eInk Device", "source": "Hackaday", "date": "2026-10-26", "url": "https://hackaday.com/2026/10/26/practice-japanese-on-an-inkplate-4tempera-eink-device/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"432\" src=\"https://hackaday.com/wp-content/uploads/2026/10/enkiplate_epaper_virpo_peter_hraska_github.jpg?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>Learning a new natural language can be a daunting proposition at the best of times, with repetition and immersion generally considered to be the best ways to build up not <a class=\"read-more\" href=\"https://hackaday.com/2026/10/26/practice-japanese-on-an-inkplate-4tempera-eink-device/\">&#8230;read more<\/a>"}, {"title": "Arduino Engine Runs Many Games", "source": "Hackaday", "date": "2026-10-26", "url": "https://hackaday.com/2026/10/26/arduino-engine-runs-many-games/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"450\" src=\"https://hackaday.com/wp-content/uploads/2026/10/zx-arduino-main.jpg?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>A few years ago, [Smashcat] ported a ZX Spectrum game called Manic Miner to the Arduino Uno. The Arduino has less memory than the original Spectrum did, so doing all this <a class=\"read-more\" href=\"https://hackaday.com/2026/10/26/arduino-engine-runs-many-games/\">&#8230;read more<\/a>"}, {"title": "BMW i3 Mod Brings Small Trucks to the EV Future", "source": "Hackaday", "date": "2026-10-26", "url": "https://hackaday.com/2026/10/26/bmw-i3-mod-brings-small-trucks-to-the-ev-future/", "summary": "<div><img alt=\"A two door pickup or ute in white with a black hood and blue accents. It&#039;s built from a chopped up BMW i3 REX EV.\" class=\"attachment-large size-large wp-post-image\" height=\"450\" src=\"https://hackaday.com/wp-content/uploads/2026/10/Gas-Prices-Are-Insane-So-I-Built-My-Own-Electric-Truck-0-39-45.jpeg?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>Trucks are handy, especially if you&#8217;ve got messy or dirty loads, but there aren&#8217;t a lot of options if you want a small electric pickup yet. [Michael Pick] decided to <a class=\"read-more\" href=\"https://hackaday.com/2026/10/26/bmw-i3-mod-brings-small-trucks-to-the-ev-future/\">&#8230;read more<\/a>"}, {"title": "The Fascinating World of IrDA and Other Infrared Protocols", "source": "Hackaday", "date": "2026-10-26", "url": "https://hackaday.com/2026/10/26/the-fascinating-world-of-irda-and-other-infrared-protocols/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"484\" src=\"https://hackaday.com/wp-content/uploads/2026/10/Optical_IR.jpg?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>Infrared (IR) communication technologies are probably one of the most influential, yet also one of the least flashiest. The fact that IR communication tends to be highly directional and often <a class=\"read-more\" href=\"https://hackaday.com/2026/10/26/the-fascinating-world-of-irda-and-other-infrared-protocols/\">&#8230;read more<\/a>"}, {"title": "Adafruit Metro ESP32-P4 Hydra – An Arduino UNO-shaped ESP32-P4 + ESP32-C6 board with WiFi 6, MIPI interfaces", "source": "CNX Software", "date": "2026-10-26", "url": "https://www.cnx-software.com/2026/10/26/adafruit-metro-esp32-p4-hydra-an-arduino-uno-shaped-esp32-p4-esp32-c6-board-with-wifi-6-mipi-interfaces/", "summary": "<div><img alt=\"Adafruit Metro ESP32 P4 Hydra with 16 MB PSRAM v1 Chipset\" class=\"attachment-medium size-medium wp-post-image\" height=\"480\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/10/Adafruit-Metro-ESP32-P4-Hydra-with-16-MB-PSRAM-v1-Chipset-720x480.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Adafruit has launched the Metro ESP32-P4 Hydra, an Arduino UNO-shaped development board with ESP32-P4, 16MB PSRAM, and 16MB NOR flash, and an ESP32-C6 for WiFi 6, Bluetooth 5.3 LE, Thread, and Zigbee connectivity. Other features include Raspberry Pi-compatible MIPI DSI and CSI interfaces, a USB 2.0 High-Speed host port, a microSD card slot, and Arduino UNO expansion headers. The board also includes a STEMMA QT connector, LiPo battery charging, and multiple power input options, making it suitable for HMI, camera, and IoT applications. Adafruit Metro ESP32-P4 Hydra specifications: Microcontroller – Espressif Systems ESP32-P4 (v1 chipset) CPU Dual-core 32-bit RISC-V HP (High-performance) CPU @ up to 360 MHz with AI instructions extension and single-precision FPU Single-RISC-V LP (Low-power) MCU core @ up to 40 MHz with 8KB of zero-wait TCM RAM Memory 768 KB HP L2MEM (for dual-core CPU), 32 KB LP SRAM, 8 KB TCM (for LP MCU core) 16MB PSRAM GPU [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/10/26/adafruit-metro-esp32-p4-hydra-an-arduino-uno-shaped-esp32-p4-esp32-c6-board-with-wifi-6-mipi-interfaces/\">Adafruit Metro ESP32-P4 Hydra &#8211; An Arduino UNO-shaped ESP32-P4 + ESP32-C6 board with WiFi 6, MIPI interfaces<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Renesas RX74M and RX74N – 600MHz industrial MCUs with RXv3e core, embedded MRAM, 22nm process", "source": "CNX Software", "date": "2026-10-26", "url": "https://www.cnx-software.com/2026/10/26/renesas-rx74m-and-rx74n-600mhz-industrial-mcus-with-rxv3e-core-embedded-mram-22nm-process/", "summary": "<div><img alt=\"Renesas RX74M and RX74N 600MHz MCUs with 22nm process and MRAM\" class=\"attachment-medium size-medium wp-post-image\" height=\"480\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/10/Renesas-RX74M-and-RX74N-600MHz-MCUs-with-22nm-process-and-MRAM-720x480.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Renesas has introduced the RX74M and RX74N, two new 32-bit RX family MCUs built on a 22nm process with embedded MRAM. Both MCUs integrate a 600MHz RXv3e core and are designed for industrial automation, motor control, robotics, and energy management applications. The MCUs feature up to 1MB of code MRAM, 1.5MB SRAM, and 256KB of zero-wait-state local RAM for real-time processing. The RX74M adds an integrated EtherCAT slave controller, dual Gigabit Ethernet MACs with TSN support, and an Ethernet switch for industrial networking, while the RX74N offers a single Gigabit Ethernet interface for general industrial applications. Other features include CAN FD, USB 2.0, I3C, high-resolution PWM timers, and hardware-based security with Renesas Protect Zone. Renesas RX74M and RX74N specifications: MCU – 32-bit RXv3e core clocked at 300/480/600MHz Up to 3,604 CoreMark at 600MHz Single- and double-precision floating-point support Trigonometric function accelerator Register bank save function for faster interrupt response 32KB [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/10/26/renesas-rx74m-and-rx74n-600mhz-industrial-mcus-with-rxv3e-core-embedded-mram-22nm-process/\">Renesas RX74M and RX74N &#8211; 600MHz industrial MCUs with RXv3e core, embedded MRAM, 22nm process<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Cadence Launches Maestro AI Models for Chip and System Design", "source": "Embedded.com", "date": "2026-10-26", "url": "https://www.embedded.com/cadence-launches-maestro-ai-models-for-chip-and-system-design/", "summary": "<p>Cadence Design Systems Inc. has introduced the Maestro AI Model Portfolio, a collection of domain-specialized artificial intelligence models designed to power agentic workflows across semiconductor and system design. The portfolio integrates specialized models with Cadence AI Super Agents, electronic design automation (EDA) and system design automation (SDA) tools, and reinforcement learning (RL) to improve engineering [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/cadence-launches-maestro-ai-models-for-chip-and-system-design/\">Cadence Launches Maestro AI Models for Chip and System Design<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "Streamlined Development Platforms Are Now Critical to Edge AI Deployment", "source": "Embedded.com", "date": "2026-10-26", "url": "https://www.embedded.com/streamlined-development-platforms-are-now-critical-to-edge-ai-deployment/", "summary": "<p>Streamlining development platforms has become a trend in the embedded industry, as the demand for deploying larger AI and machine-learning (ML) models at the edge increases development complexity, time, and, thereby, cost. The architectural diversity of embedded edge devices means that models must be converted, quantized or otherwise optimized, compiled for the target runtime, and [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/streamlined-development-platforms-are-now-critical-to-edge-ai-deployment/\">Streamlined Development Platforms Are Now Critical to Edge AI Deployment<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "Tearing down the Apple iPhone Duo", "source": "Electronics Weekly", "date": "2026-10-26", "url": "https://www.electronicsweekly.com/blogs/gadget-master/consumer-electronics/tearing-down-the-apple-iphone-duo-2026-10/", "summary": "<p>Apple will take 25% of the Foldable Smartphone market in 2026, according to Counterpoint Research. But how repairable will the iPhone Duo prove to be?<\/p>\n<p>The post <a href=\"https://www.electronicsweekly.com/blogs/gadget-master/consumer-electronics/tearing-down-the-apple-iphone-duo-2026-10/\">Tearing down the Apple iPhone Duo<\/a> appeared first on <a href=\"https://www.electronicsweekly.com\">Electronics Weekly<\/a>.<\/p>"}, {"title": "The Elusive AI Killer App", "source": "Electronics Weekly", "date": "2026-10-26", "url": "https://www.electronicsweekly.com/blogs/mannerisms/dilemmas/the-elusive-ai-killer-app-2026-10/", "summary": "<p>A note from a partner in Apollo Global Management who is also the company’s Chief Economist, Torsten Slok (pictured) reinforces the flaw in the AI proposition: Where’s the killer app? [&#8230;]<\/p>\n<p>The post <a href=\"https://www.electronicsweekly.com/blogs/mannerisms/dilemmas/the-elusive-ai-killer-app-2026-10/\">The Elusive AI Killer App<\/a> appeared first on <a href=\"https://www.electronicsweekly.com\">Electronics Weekly<\/a>.<\/p>"}, {"title": "KOA Speer heat shock resistors feature metal glaze resistance film", "source": "Electronics Weekly", "date": "2026-10-26", "url": "https://www.electronicsweekly.com/news/products/passives/koa-speer-heat-shock-resistors-feature-metal-glaze-resistance-film-2026-10/", "summary": "<p>A new family of heat shock resistors from KOA Speer Electronics feature a metal glaze resistance film to provide improved high heat and weather resistance. The RK73B-AT resistors also feature [&#8230;]<\/p>\n<p>The post <a href=\"https://www.electronicsweekly.com/news/products/passives/koa-speer-heat-shock-resistors-feature-metal-glaze-resistance-film-2026-10/\">KOA Speer heat shock resistors feature metal glaze resistance film<\/a> appeared first on <a href=\"https://www.electronicsweekly.com\">Electronics Weekly<\/a>.<\/p>"}, {"title": "CScale exits stealth mode with $145m funding for gigawatt-scale AI", "source": "Electronics Weekly", "date": "2026-10-26", "url": "https://www.electronicsweekly.com/news/products/connectors/cscale-exits-stealth-with-145m-funding-for-gigawatt-scale-ai-2026-10/", "summary": "<p>CScale, a Palo Alto startup for optical interconnects, has exited stealth mode with the announcement of $145 million in Series C funding. Nvidia and Intel Capital were among the investors. [&#8230;]<\/p>\n<p>The post <a href=\"https://www.electronicsweekly.com/news/products/connectors/cscale-exits-stealth-with-145m-funding-for-gigawatt-scale-ai-2026-10/\">CScale exits stealth mode with $145m funding for gigawatt-scale AI<\/a> appeared first on <a href=\"https://www.electronicsweekly.com\">Electronics Weekly<\/a>.<\/p>"}, {"title": "What caught your eye? Apprenticeships, Flapping Airplanes, SAR Satellites", "source": "Electronics Weekly", "date": "2026-10-26", "url": "https://www.electronicsweekly.com/blogs/electro-ramblings/latest-news/what-caught-your-eye-apprenticeships-flapping-airplanes-sar-satellites-2026-10/", "summary": "<p>What caught our eye this last week? The launch of the Apprenticeship Talent Bridge, the Flapping Airplanes startup story, and Iceye continuing to expand its SAR satellite constellation...<\/p>\n<p>The post <a href=\"https://www.electronicsweekly.com/blogs/electro-ramblings/latest-news/what-caught-your-eye-apprenticeships-flapping-airplanes-sar-satellites-2026-10/\">What caught your eye? Apprenticeships, Flapping Airplanes, SAR Satellites<\/a> appeared first on <a href=\"https://www.electronicsweekly.com\">Electronics Weekly<\/a>.<\/p>"}, {"title": "Government to set up Biosecurity Lab for biological AI threats", "source": "Electronics Weekly", "date": "2026-10-26", "url": "https://www.electronicsweekly.com/news/business/government-to-set-up-biosecurity-lab-for-ai-threats-2026-10/", "summary": "<p>The government is to invest £100m in an AI Biosecurity Lab (AIBL) to counter biological risks posed by AI. Anthropic and OpenAI will contribute £200m in compute and model credits. [&#8230;]<\/p>\n<p>The post <a href=\"https://www.electronicsweekly.com/news/business/government-to-set-up-biosecurity-lab-for-ai-threats-2026-10/\">Government to set up Biosecurity Lab for biological AI threats<\/a> appeared first on <a href=\"https://www.electronicsweekly.com\">Electronics Weekly<\/a>.<\/p>"}, {"title": "Anti-matter particle trapped in Illinois cage", "source": "Electronics Weekly", "date": "2026-10-26", "url": "https://www.electronicsweekly.com/news/business/anti-matter-particle-trapped-in-cage-2026-10/", "summary": "<p>Northwestern University physicists have trapped a particle of anti-matter in a cage (pictured) and are preparing to take measurements of its properties and compare them with the properties of matter. [&#8230;]<\/p>\n<p>The post <a href=\"https://www.electronicsweekly.com/news/business/anti-matter-particle-trapped-in-cage-2026-10/\">Anti-matter particle trapped in Illinois cage<\/a> appeared first on <a href=\"https://www.electronicsweekly.com\">Electronics Weekly<\/a>.<\/p>"}, {"title": "Atomera and IQE hook up to advance RF GaN", "source": "Electronics Weekly", "date": "2026-10-26", "url": "https://www.electronicsweekly.com/news/business/atomera-and-iqe-hook-up-for-rf-gan-2026-10/", "summary": "<p>Atomera, a semiconductor transistor materials and technology licensing company, has entered into a Joint Development Agreement (JDA) with IQE to bring high-performance, cost-effective RF GaN to market. The collaboration leverages [&#8230;]<\/p>\n<p>The post <a href=\"https://www.electronicsweekly.com/news/business/atomera-and-iqe-hook-up-for-rf-gan-2026-10/\">Atomera and IQE hook up to advance RF GaN<\/a> appeared first on <a href=\"https://www.electronicsweekly.com\">Electronics Weekly<\/a>.<\/p>"}, {"title": "Lab-grown muscles power robots", "source": "Electronics Weekly", "date": "2026-10-26", "url": "https://www.electronicsweekly.com/news/business/lab-grown-muscles-power-robots-2026-10/", "summary": "<p>Lab-grown skeletal muscle tissue can contract, but the movement is often so slight that it is barely visible. This poses a problem for biohybrid robots designed to move using living [&#8230;]<\/p>\n<p>The post <a href=\"https://www.electronicsweekly.com/news/business/lab-grown-muscles-power-robots-2026-10/\">Lab-grown muscles power robots<\/a> appeared first on <a href=\"https://www.electronicsweekly.com\">Electronics Weekly<\/a>.<\/p>"}, {"title": "A wakeboarding winch build log", "source": "Adafruit", "date": "2026-10-26", "url": "https://blog.adafruit.com/2026/10/26/a-wakeboarding-winch-build-log/", "summary": "Gal, writing at Mare &#38; Gal Electronics, documented an electric drum winch built to tow a wakeboarder. The 12 kW motor and the 24S10P battery pack, about 100 V charged, were pulled from a scrapped Awake board. The frame, drum, belt drive, rope guide, electronics and firmware are all his own work. The drum core [&#8230;]"}, {"title": "GitHub – ankur608/ArduinoUnoQ_AdafruitTouch", "source": "Adafruit", "date": "2026-10-26", "url": "https://blog.adafruit.com/2026/10/26/github-ankur608-arduinounoq_adafruittouch-2/", "summary": "ankur608 published an Arduino library on GitHub for using the Adafruit 2.8&#8243; TFT Touch Shield v2 with capacitive touch (PID 1947) on the Arduino UNO Q, specifically the arduino_uno_q_stm32u585xx core. The shield routes SPI through the 6-pin ICSP header rather than pins 11 through 13. On the UNO Q&#8217;s STM32U585, those land on MOSI 23, [&#8230;]"}, {"title": "EInk launches latest version of color ePaper platform E Ink Kaleido 4", "source": "Adafruit", "date": "2026-10-26", "url": "https://blog.adafruit.com/2026/10/26/eink-launches-latest-version-of-color-epaper-platform-e-ink-kaleido-4/", "summary": "E Ink announced Kaleido 4, the newest generation of its color ePaper platform, in a press release from Billerica, Massachusetts. Compared to the previous generation, Kaleido 4 doubles color gamut volume to more than 40K, raises white reflectance by 15%, and improves contrast by 50%. New algorithms push video playback to 18 frames per second. [&#8230;]"}, {"title": "A pixel art fish tank for the Interstate 75 matrix LED controller for two panel displays", "source": "Adafruit", "date": "2026-10-26", "url": "https://blog.adafruit.com/2026/10/26/a-pixel-art-fish-tank-for-the-interstate-75-matrix-led-controller-for-two-panel-displays/", "summary": "NickyMoo has published an animated pixel art aquarium on GitHub that runs on the Pimoroni Interstate 75 W (RP2350) and drives two 64 x 64 HUB75 panels side by side for a 128 x 64 scene. It needs no internet, no account, and no network code. The tank holds resident fish and visitors, jellyfish, a [&#8230;]"}, {"title": "keybytes: a truly modular keyboard", "source": "Adafruit", "date": "2026-10-26", "url": "https://blog.adafruit.com/2026/10/26/keybytes-a-truly-modular-keyboard/", "summary": "Nathan, @NotARoomba on GitHub, designed Keybytes, a keyboard where each key is its own board. Everything was designed in KiCad. There are two board types, both 1u at 19.05mm x 19.05mm. The Keybit holds one Cherry MX switch and a CH32V003 microcontroller. Pogo pins on all four sides carry 3.3V, ground and I2C, so a [&#8230;]"}, {"title": "Making 1,750 programmable PCB badges for Canada’s biggest hackathon", "source": "Adafruit", "date": "2026-10-26", "url": "https://blog.adafruit.com/2026/10/26/making-1750-programmable-pcb-badges-for-canadas-biggest-hackathon/", "summary": "Nick Ficara, writing at va3ndf.com, documented how his team replaced the cardstock name tag at Hack the North with a programmable circuit board. Each badge carries an ESP32, a color screen, buttons, an NFC reader, a WS2812B LED and two AA cells. A Lua runtime, a browser-based code editor and an on-device shell let attendees [&#8230;]"}, {"title": "The Lightbulb Computer: reimagining spatial & ambient computing", "source": "Adafruit", "date": "2026-10-26", "url": "https://blog.adafruit.com/2026/10/26/the-lightbulb-computer-reimagining-spatial-ambient-computing/", "summary": "A design project published at lightbulbcomputer.com proposes an alternative to smart glasses and headsets: a speculative device called the Lightbulb Computer. It combines a projector with computer vision in the shape of a large light bulb, so it can screw into any Edison socket in a wall or ceiling, or sit in a portable lamp [&#8230;]"}, {"title": "Amateur astronomer harnesses AI to find a possible hidden exoplanet", "source": "Adafruit", "date": "2026-10-26", "url": "https://blog.adafruit.com/2026/10/26/amateur-astronomer-harnesses-ai-to-find-a-possible-hidden-exoplanet/", "summary": "Adam Kovac, writing for Scientific American, reports on an amateur astronomer who used AI agents to pull a possible exoplanet out of public NASA data. Pavel Rabtsevich, a product manager based in Spain, ran a custom machine learning setup over more than 126,000 target stars observed by the Transiting Exoplanet Survey Satellite. It flagged TIC [&#8230;]"}, {"title": "An Atari Steeplechase arcade cabinet restoration", "source": "Adafruit", "date": "2026-10-26", "url": "https://blog.adafruit.com/2026/10/26/an-atari-steeplechase-arcade-cabinet-restoration/", "summary": "Tony at The Arcade Blogger has posted a follow-up on an Atari Steeplechase cabinet he pulled out of a condemned building in France during a group rescue trip with other arcade collectors. The machine is the Atari Europe version, which uses a different cabinet shape than the more angular USA release. Tony cleaned it up [&#8230;]"}, {"title": "ESP_MOVIE: Movie playback library for ESP32 series", "source": "Adafruit", "date": "2026-10-26", "url": "https://blog.adafruit.com/2026/10/26/esp_movie-movie-playback-library-for-esp32-series/", "summary": "Tomino Shun has published ESP_MOVIE on GitHub, a movie playback library for the ESP32 series. It plays Motion JPEG video from AVI files along with MP3 audio. The library drives displays over an Intel 8080 8-bit parallel interface using DMA transfer. SPI is not supported. Color formats are RGB565 and BGR565. A handful of display [&#8230;]"}, {"title": "Boar BBS: a telnet and SSH bulletin board with mail, boards, chat and door games", "source": "Adafruit", "date": "2026-10-26", "url": "https://blog.adafruit.com/2026/10/26/boar-bbs-a-telnet-and-ssh-bulletin-board-with-mail-boards-chat-and-door-games/", "summary": "BBS Developer rh1tech has published Boar BBS on GitHub, a bulletin board system that callers reach over telnet or SSH. It has ANSI color, CP437 block art, hotkey menus, private mail, public message boards, live chat, door games and a oneliner wall, along with sysop tools. Boar is written in Go and builds to a [&#8230;]"}, {"title": "Implementation of the HDA Link interface on RP2040", "source": "Adafruit", "date": "2026-10-26", "url": "https://blog.adafruit.com/2026/10/26/implementation-of-the-hda-link-interface-on-rp2040/", "summary": "A post on habr.com documents an RP2040 driving an Intel High Definition Audio codec directly, with no chipset and no FPGA. HDA, also called Azalia, uses four wires and supports up to 15 channels in and 15 out, well past the two in, two out that I²S usually gives you. The hard part is timing. [&#8230;]"}, {"title": "Data Centers: Sensirion Sensor Solutions — Sensirion and Mouser Electronics", "source": "EE Journal", "date": "2026-10-26", "url": "https://www.eejournal.com/chalk_talks/data-centers-sensirion-sensor-solutions-sensirion-and-mouser-electronics/", "summary": "In this episode of Chalk Talk, Sebastian Schnoz from Sensirion and Amelia Dalton explore the challenges facing data center operations; from thermal management and energy efficiency to environmental monitoring, leak detection, and battery safety. They also investigate how Sensirion helps data center designers monitor critical conditions, identify problems earlier, and make more informed decisions. Click [&#8230;]"}, {"title": "TASKING Launches Industry’s First Single-Vendor Unified Toolchain for the NXP S32K5 Automotive MCU Family", "source": "EE Journal", "date": "2026-10-26", "url": "https://www.eejournal.com/industry_news/tasking-launches-industrys-first-single-vendor-unified-toolchain-for-the-nxp-s32k5-automotive-mcu-family/", "summary": "TASKING, a leading provider of embedded software development tools, today announced the first and only single-vendor unified toolchain for NXP® Semiconductors’ S32K5 microcontroller family. Developed in close collaboration with NXP, this toolchain brings compilation, debugging, and verification together in one workflow, accelerating development of next-generation zonal architectures and electrification systems while significantly reducing cost, complexity [&#8230;]"}, {"title": "Antaira Launches LanoSync™ Q-Series Industrial Network Switches Combining Precision Timing and Rugged Reliability", "source": "EE Journal", "date": "2026-10-26", "url": "https://www.eejournal.com/industry_news/antaira-launches-lanosync-q-series-industrial-network-switches-combining-precision-timing-and-rugged-reliability/", "summary": "Antaira Technologies, a developer and manufacturer of industrial networking solutions, today introduced the LanoSync™ Q-Series Industrial Network Switches. The five-model LanoSync Q-Series delivers advanced data transmission with Precise Time Protocol (PTP) synchronization for applications where networks must coordinate actions, correlate measurements, or reconstruct events with exact timing, such as factory automation, electrical substations, robotics and [&#8230;]"}, {"title": "Add USB C power with USB-C Sink 5 Click board from MIKROE", "source": "EE Journal", "date": "2026-10-26", "url": "https://www.eejournal.com/industry_news/add-usb-c-power-with-usb-c-sink-5-click-board-from-mikroe/", "summary": "USB-C Sink 5 Click from MIKROE, the embedded solutions company that dramatically cuts development time by providing innovative hardware and software products based on proven standards, is a compact add-on Click board™ designed for USB Type-C Power Delivery sink applications, enabling embedded systems to receive, negotiate, and manage power from USB-C PD-capable sources. This board [&#8230;]"}, {"title": "Siemens expands agentic AI collaboration to tackle 3D IC power and thermal challenges with NVIDIA", "source": "EE Journal", "date": "2026-10-26", "url": "https://www.eejournal.com/industry_news/siemens-expands-agentic-ai-collaboration-to-tackle-3d-ic-power-and-thermal-challenges-with-nvidia/", "summary": "Builds on agentic AI capabilities introduced at DAC 2026, extending them to 3D integrated circuits (3D IC) electrothermal codesign Orchestrates nine automated workflow stages across seven of Siemens’ electronic design automation (EDA) tools, reducing setup effort by up to 95 percent Enables evaluation of up to 50x as many design alternatives to address power and [&#8230;]"}, {"title": "Renesas Launches RX74M and RX74N Flagship 32-bit MCUs, First RX Family Built on 22nm Process and Featuring MRAM", "source": "EE Journal", "date": "2026-10-26", "url": "https://www.eejournal.com/industry_news/renesas-launches-rx74m-and-rx74n-flagship-32-bit-mcus-first-rx-family-built-on-22nm-process-and-featuring-mram/", "summary": "Up to 600 MHz RXv3e core and high-speed MRAM deliver fast, reliable real-time performance. RX74M supports major industrial networks—including EtherCAT, TSN-capable Gigabit Ethernet, and CAN FD on a single device. Hardware-based security features address next-generation security requirements such as compliance with the Cyber Resilience Act and support for post-quantum cryptography. Renesas Electronics Corporation (TSE:6723), a [&#8230;]"}, {"title": "Deki Engine – ESP32 gets an open source Unity-style editor and C++ 2D game engine", "source": "CNX Software", "date": "2026-10-25", "url": "https://www.cnx-software.com/2026/10/25/deki-engine-esp32-gets-an-open-source-unity-style-editor-and-c-2d-game-engine/", "summary": "<div><img alt=\"Deki demo on LILYGO T-Display S3 Touch\" class=\"attachment-medium size-medium wp-post-image\" height=\"375\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/10/Deki-demo-on-LILYGO-T-Display-S3-Touch-720x375.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Deki Engine is an open-source modular C++ engine with a Unity-style visual editor for embedded devices, currently optimized for ESP32 platforms such as LilyGO T-Deck Plus, T-Display S3 AMOLED, and soon Elecrow CrowPanel Advanced 7&#8243; ESP32-P4. The editor is available for Windows and Linux with a compiler for the 2D graphics engine, and everything is released under an Apache 2.0 license on GitHub. The project also works on desktop through SDL3, which may be convenient during development. Some of the highlights of the Deki Engine project: Workflow Build scenes visually (sprites, text, particles, tilemaps, state machines, tweens) Pick a board in the editor&#8217;s Build panel Flash it. The project also runs on desktop through SDL3, or headless with no renderer Performance &#8211; 60 FPS on ESP32-S3 (See demo video below) Package-based solution Hardware packages LilyGO T-Deck Plus with support for display, touch, keyboard, trackball, SD card, GPS and LoRa (SX1262) [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/10/25/deki-engine-esp32-gets-an-open-source-unity-style-editor-and-c-2d-game-engine/\">Deki Engine &#8211; ESP32 gets an open source Unity-style editor and C++ 2D game engine<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "ZOTAC ZBOX PRO CM5-PICO – A compact Raspberry Pi CM5-based fanless industrial mini PC", "source": "CNX Software", "date": "2026-10-24", "url": "https://www.cnx-software.com/2026/10/24/zotac-zbox-pro-cm5-pico-a-compact-raspberry-pi-cm5-based-fanless-industrial-mini-pc/", "summary": "<div><img alt=\"Zotac ZBOX PRO CM5 PICO\" class=\"attachment-medium size-medium wp-post-image\" height=\"480\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/10/Zotac-ZBOX-PRO-CM5-PICO-720x480.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>ZOTAC ZBOX PRO CM5-PICO is a compact fanless industrial mini PC built around the Raspberry Pi Compute Module 5 (CM5) with up to 16 GB LPDDR4x memory, optional WiFi 5 and Bluetooth 5.0 wireless connectivity. The mini PC measures 114.8 x 76 x 31.3 mm and features two 4K HDMI outputs, Gigabit Ethernet, and M.2 expansion for NVMe storage or AI accelerators, along with an internal 40-pin GPIO header, camera interfaces, and a wide 5V to 20V DC input for industrial automation, digital signage, and IoT gateway applications. All I/O ports are placed on a single side to simplify cable management and stacking. ZOTAC ZBOX PRO CM5-PICO specifications: SoM – Raspberry Pi Compute Module 5 (CM5) SoC – Broadcom BCM2712 CPU – Quad-core Arm Cortex-A76 @ 2.4 GHz GPU &#8211; VideoCore VII @ 800 MHz with H.265 hardware video decoding Memory &#8211; 2GB, 4GB, 8GB, or 16GB LPDDR4x RAM Storage [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/10/24/zotac-zbox-pro-cm5-pico-a-compact-raspberry-pi-cm5-based-fanless-industrial-mini-pc/\">ZOTAC ZBOX PRO CM5-PICO &#8211; A compact Raspberry Pi CM5-based fanless industrial mini PC <\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "LILYGO T-Halow P4 – An M.2 2280 board with ESP32-P4, WiFi HaLow, and ESP32-C6", "source": "CNX Software", "date": "2026-10-23", "url": "https://www.cnx-software.com/2026/10/23/lilygo-t-halow-p4-a-m-2-2280-board-with-esp32-p4-wifi-halow-and-esp32-c6/", "summary": "<div><img alt=\"LILYGO T Halow P4\" class=\"attachment-medium size-medium wp-post-image\" height=\"480\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/10/LILYGO-T-Halow-P4-720x480.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>LILYGO T-Halow P4 is a compact M.2 development board that combines an ESP32-P4 MCU, an ESP32-C6 wireless co-processor, and a Taixin TX-AH WiFi HaLow module for long-range wireless connectivity. The board measures just 80 x 22mm (M.2 2280) and uses an M.2 B-key connector to expose GPIO pins and other interfaces for integration into custom carrier boards. It also supports MIPI CSI cameras and MIPI DSI displays, along with hardware H.264 video encoding at up to 1080p30, making it suitable for compact IoT gateways, remote cameras, and industrial monitoring applications. LILYGO T-Halow P4 specifications: SoC – Espressif Systems ESP32-P4NRW32X  CPU Dual-core RISC-V @ 400 MHz with AI instruction extensions and single-precision FPU Single-core RISC-V LP (low-power) MCU @ up to 40 MHz GPU – 2D Pixel Processing Accelerator (PPA) VPU – H.264 and JPEG codec support Memory – 768 KB HP L2MEM, 32 KB LP SRAM, 8 KB TCM, 32MB [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/10/23/lilygo-t-halow-p4-a-m-2-2280-board-with-esp32-p4-wifi-halow-and-esp32-c6/\">LILYGO T-Halow P4 &#8211; An M.2 2280 board with ESP32-P4, WiFi HaLow, and ESP32-C6<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "RoboParty RP1 (ROBOTO 01) – A full-stack open-source humanoid robot with up to 30 degrees of freedom", "source": "CNX Software", "date": "2026-10-23", "url": "https://www.cnx-software.com/2026/10/23/roboparty-rp1-roboto-01-a-full-stack-open-source-humanoid-robot-with-up-to-30-degrees-of-freedom/", "summary": "<div><img alt=\"RoboParty RP1(ROBOTO 01), an open source humanoid robot\" class=\"attachment-medium size-medium wp-post-image\" height=\"480\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/10/RoboParty-RP1ROBOTO-01-an-open-source-humanoid-robot-720x480.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Shanghai-based RoboParty has introduced the RP1 (ROBOTO 01), an open-source humanoid robot designed for robotics research, embodied AI development, and motion-control experiments. The robot is available in two configurations: the standard RP1 with 24 active degrees of freedom (DoF) and the RP1 Pro with 30 DoF. The robot stands 1.35 meters (~4.43 feet) tall and is built around a Rockchip RK3588 processor, with the Pro model adding an Allwinner A733 processor and an NVIDIA Jetson Orin NX development computing module. Other features include in-house ROMOMO joint actuators with up to 160 N·m peak torque, interchangeable head modules, optional dexterous hands, and a 10Ah battery rated for up to three hours of operation. A separate 480MHz MCU handles real-time motion control, while a dual-voltage battery system supports hot-swapping without shutting down the robot. RoboParty RP1 specifications: Computing RP1 – Rockchip RK3588 processor with a 6 TOPS NPU, 8GB LPDDR4x RAM, and [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/10/23/roboparty-rp1-roboto-01-a-full-stack-open-source-humanoid-robot-with-up-to-30-degrees-of-freedom/\">RoboParty RP1 (ROBOTO 01) &#8211; A full-stack open-source humanoid robot with up to 30 degrees of freedom<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "How Agentic AI Accelerates Edge AI Software Development, Industrial Edge Analytics, Agilex FPGAs: Embedded Week Insights", "source": "Embedded.com", "date": "2026-10-23", "url": "https://www.embedded.com/how-agentic-ai-accelerates-edge-ai-software-development-industrial-edge-analytics-agilex-fpgas-embedded-week-insights/", "summary": "<p>Here's a roundup of this week's must-read articles. We cover the latest developments on how agentic AI accelerates edge AI software development, the benefits of industrial edge Analytics, Altera's expansion of its defense-grade Agilex FPGAs, and more. Also, check News Archives - Embedded and Technical Articles Archives - Embedded for the complete list of news and articles from our [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/how-agentic-ai-accelerates-edge-ai-software-development-industrial-edge-analytics-agilex-fpgas-embedded-week-insights/\">How Agentic AI Accelerates Edge AI Software Development, Industrial Edge Analytics, Agilex FPGAs: Embedded Week Insights<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "Real-Time Sensing Prevents Catastrophic Infrastructure Failures", "source": "Embedded.com", "date": "2026-10-23", "url": "https://www.embedded.com/real-time-sensing-prevents-catastrophic-infrastructure-failures/", "summary": "<p>Cooling failures remain the second-leading cause of data center outages. Downtime is now more costly than hardware loss, making early detection critical. The ability to detect leaks at the source and over wide areas via telemetry will vastly improve uptime. Compatibility with newer cooling fluid variants is essential, but legacy conductometric sensing falls short. The ability to [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/real-time-sensing-prevents-catastrophic-infrastructure-failures/\">Real-Time Sensing Prevents Catastrophic Infrastructure Failures<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "Navitas Unveils Next-Generation Ultra-High-Voltage SiC Power Module to Advance Energy and Grid Infrastructure Efficiency", "source": "EE Journal", "date": "2026-10-23", "url": "https://www.eejournal.com/industry_news/navitas-unveils-next-generation-ultra-high-voltage-sic-power-module-to-advance-energy-and-grid-infrastructure-efficiency/", "summary": "Navitas Semiconductor (Nasdaq: NVTS), a leader in next-generation power semiconductors and power delivery solutions, pioneering GaN, high-voltage and ultra-high-voltage SiC, and IVR technologies, today announced an ultra-high-voltage (UHV) SiC power module family for advanced energy and grid infrastructure. The new G4H08MT23GB4 2300 V
