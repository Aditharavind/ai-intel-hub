spections with ANYmal robots", "source": "Robotics Business Review", "date": "2026-09-24", "url": "https://www.therobotreport.com/anybotics-opens-the-door-for-inspections-with-anymal-robots/", "summary": "<p>ANYbotics partnered with dormakaba and LEGIC Identsystems to enable the ANYmal quadruped to gain access like a badged employee.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/anybotics-opens-the-door-for-inspections-with-anymal-robots/\">ANYbotics opens the door for inspections with ANYmal robots<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Mexican EPICS in IEEE Team Builds Portable Educational Platform", "source": "IEEE Spectrum Robotics", "date": "2026-09-24", "url": "https://spectrum.ieee.org/epics-in-ieee-portable-educational", "summary": "<img src=\"https://spectrum.ieee.org/media-library/four-young-adult-students-laugh-together-while-one-of-them-holds-a-robot-shaped-like-a-hexagonal-cylinder.jpg?id=67845427&amp;width=1245&amp;height=700&amp;coordinates=0%2C156%2C0%2C157\" /><br /><br /><p>In Guadalajara, Mexico, many high schools have motivated teachers and talented students with an interest in science, technology, engineering, and mathematics, but they lack access to advanced tools such as robotics laboratories. The resources shortfall limits the students’ opportunities for hands-on learning on cutting-edge applications.<\/p><p>A team from <a href=\"https://apps.iteso.mx/web/iteso/inicio\" rel=\"noopener noreferrer\" target=\"_blank\">ITESO, Universidad Jesuita de Guadalajara<\/a>, is working to change that. Through the <a href=\"https://epics.ieee.org\" rel=\"noopener noreferrer\" target=\"_blank\">EPICS in IEEE<\/a> initiative, a multidisciplinary group of 15 engineering students, faculty advisors, and <a href=\"https://www.ieeegdl.org/\" rel=\"noopener noreferrer\" target=\"_blank\">IEEE Guadalajara Section<\/a> volunteers developed RoboMeshA. The portable, self-contained educational platform brings robotics and AI experiences into classrooms.<\/p><p><a href=\"https://spectrum.ieee.org/epics-in-ieee-15th-anniversary\" target=\"_self\">EPICS<\/a> is administered by <a href=\"https://ea.ieee.org\" rel=\"noopener noreferrer\" target=\"_blank\">IEEE Educational Activities<\/a> and funded by the <a href=\"https://www.ieee-ras.org/\" rel=\"noopener noreferrer\" target=\"_blank\">IEEE Robotics and Automation Society<\/a>.<\/p><h2>A mobile laboratory<\/h2><p>Rather than requiring a school to build a dedicated computer lab or install complex software, RoboMeshA<em> <\/em>operates as an all-in-one mobile learning network.<\/p><p>“RoboMeshA brings robotics and AI to students who don’t have access to specialized facilities or preinstalled software,” says team member Fernando Vidal Luna, an IEEE student member and a mechatronics engineering major at ITESO.<\/p><p>Students connect directly to the platform from a user-friendly web browser. They can interact with the robot manually or use its control modes to watch it move and detect and avoid obstacles.<\/p><p>“The project combines mechanical design, embedded systems, control engineering, computer vision, and AI into a single robotic system that functions as a mobile learning laboratory,” says faculty advisor <a href=\"https://www.linkedin.com/in/jorgealizarraga/\" rel=\"noopener noreferrer\" target=\"_blank\">Jorge A. Lizarraga<\/a>.<\/p><p>The team says young students are interested in technology, programming, and robotics but don’t have an opportunity to work with systems that combine mechanics, electronics, software, and control.<\/p><p>“RoboMeshA allows students to see how all these disciplines work together in a tangible and understandable way,” says team member José S. González, who also is studying mechatronics engineering.<\/p><p>The team has built two units and is developing a modular coupling framework to expand the system’s capabilities for research and classroom demonstrations. The structured system design approach connects independent software components while minimizing internal dependencies, enabling four RobotMeshA robots to operate together.<\/p><h2>Overcoming design challenges<\/h2><p>The team faced significant hurdles while designing the project.<\/p><p>“One key challenge involved the robot’s structural design,” Luna says. “It wasn’t only about making a chassis where all the components fit and the design had sufficient stability, rigidity, and weight distribution. It was also about ensuring that the electronics were protected while still being accessible for maintenance, testing, and modifications.”<\/p><p>“It was also challenging to design a platform that could be used by students with different levels of experience,” González adds.<\/p><p class=\"pull-quote\">“When students realize the technology they develop can inspire others and improve lives, engineering becomes far more meaningful.” <strong>—Luis Fernando Luque-Vega<\/strong><\/p><p>The team partnered with the <a href=\"https://www.colomos.ceti.mx/\" target=\"_blank\">CETI Colomos<\/a> and <a href=\"https://prepa.iteso.mx/\" rel=\"noopener noreferrer\" target=\"_blank\">Prepa ITESO<\/a> high schools to validate the platform in classroom settings.<\/p><p>“We wanted the first interactions with the robot to be simple and intuitive,” González says, “such that students could simply power the robot, connect to its network, and begin interacting with it, rather than having to deal with software installation, extensive configuration, or troubleshooting.”<\/p><h2>Engineering with social impact<\/h2><p>Many of the students who participated were from ITESO’s applied professional projects program. The experience offered them <a href=\"https://spectrum.ieee.org/hands-on-projects-career-advice\" target=\"_self\">practical training<\/a> in project management, system integration, and user-centered design.<\/p><p>The team also presented a research paper and a project poster in May at the <a href=\"https://congresossuj.mx/congresos/3er-congreso-de-ingenierias-suj/\" rel=\"noopener noreferrer\" target=\"_blank\">Engineering Congress of the Jesuit University System<\/a>.<\/p><p>“Seeing a design move from a digital model to a physical system was invaluable,” González says. “Working with students from different backgrounds taught us to listen to end users and design for their actual needs.”<\/p><p>Project lead <a href=\"https://www.linkedin.com/in/luis-fernando-luque-vega-289aa348/\" rel=\"noopener noreferrer\" target=\"_blank\">Luis Fernando Luque-Vega<\/a>, an IEEE member, says he’d like the venture to serve as a blueprint for engineering education.<\/p><p>“I hope RoboMeshA<em> <\/em>is adopted by schools, universities, and IEEE student branches across Mexico and internationally as a model for integrating technical innovation with community engagement,” Luque-Vega says.<\/p><p>By pairing engineering talent with community service, initiatives such as EPICS in IEEE demonstrate how targeted support can turn academic concepts into real-world solutions.<\/p><p>“When students realize the technology they develop can inspire others and improve lives, engineering becomes far more meaningful,” Luque-Vega says.<\/p><p>For more information on service-learning opportunities, visit the <a href=\"https://epics.ieee.org/\" rel=\"noopener noreferrer\" target=\"_blank\">EPICS website<\/a>.<\/p>"}, {"title": "5 million robots are now at work in factories worldwide, reports the IFR", "source": "Robotics Business Review", "date": "2026-09-24", "url": "https://www.therobotreport.com/5-million-robots-now-working-factories-worldwide-ifr-reports/", "summary": "<p>China still leads the world in industrial robot installations, but the U.S. and Germany are also significant markets, found the IFR.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/5-million-robots-now-working-factories-worldwide-ifr-reports/\">5 million robots are now at work in factories worldwide, reports the IFR<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Qualcomm to acquire PickNik Robotics and keep MoveIt open-source", "source": "Robotics Business Review", "date": "2026-09-23", "url": "https://www.therobotreport.com/qualcomm-acquires-picknik-robotics-keep-moveit-open-source/", "summary": "<p>Qualcomm plans to integrate the Dragonwing and Arduino platforms with the MoveIt open-source manipulation framework.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/qualcomm-acquires-picknik-robotics-keep-moveit-open-source/\">Qualcomm to acquire PickNik Robotics and keep MoveIt open-source<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Helicon brings automation to high-volume composites manufacturing", "source": "Robotics Business Review", "date": "2026-09-23", "url": "https://www.therobotreport.com/helicon-brings-automation-high-volume-composites-manufacturing/", "summary": "<p>Helicon has obtained seed funding to use automation to cut composite manufacturing lead times from months to weeks.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/helicon-brings-automation-high-volume-composites-manufacturing/\">Helicon brings automation to high-volume composites manufacturing<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "State of Humanoids keynote brings industry leaders to RoboBusiness", "source": "Robotics Business Review", "date": "2026-09-23", "url": "https://www.therobotreport.com/state-of-humanoids-keynote-brings-industry-leaders-robobusiness/", "summary": "<p>At RoboBusiness, industry leaders will discuss the state of humanoids as the robots transition from demos to real industrial deployments.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/state-of-humanoids-keynote-brings-industry-leaders-robobusiness/\">State of Humanoids keynote brings industry leaders to RoboBusiness<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "With the new VENTUNO Q board, Arduino hopes to make robotics development easier", "source": "Robotics Business Review", "date": "2026-09-23", "url": "https://www.therobotreport.com/new-ventuno-q-board-arduino-hopes-make-robotics-development-easier/", "summary": "<p>While this is the first intentional step by Arduino into robotics, the company has over 20 years of experience working with robotics developers.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/new-ventuno-q-board-arduino-hopes-make-robotics-development-easier/\">With the new VENTUNO Q board, Arduino hopes to make robotics development easier<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Barbara Mazzolai Wants to Build a New Field of Robotics", "source": "IEEE Spectrum Robotics", "date": "2026-09-22", "url": "https://spectrum.ieee.org/sustainability-robotics-barbara-mazzolai", "summary": "<img src=\"https://spectrum.ieee.org/media-library/photo-of-a-woman-standing-in-front-of-greenery-holding-a-device-shaped-like-a-small-octopus-arm.png?id=67787635&amp;width=1245&amp;height=700&amp;coordinates=0%2C0%2C0%2C0\" /><br /><br /><p>Throughout her career, roboticist <a href=\"https://www.iit.it/people-details/-/people/barbara-mazzolai\" rel=\"noopener noreferrer\" target=\"_blank\">Barbara Mazzolai<\/a> has turned to nature for inspiration. Now she wants to ensure the technology she builds gives back to the environment, too.<\/p><p>After starting her career as a biologist, a chance opportunity saw Mazzolai switch streams to engineering and become an early pioneer of <a href=\"https://spectrum.ieee.org/tag/bioinspired-robots\" target=\"_blank\">bioinspired robotics<\/a>. Building on her knowledge of biology’s ability to solve a diverse set of problems, she has developed robots based on octopuses, plant roots, <a href=\"https://opentalk.iit.it/en/iit-the-first-biodegradable-seed-robot-able-to-change-shape-in-response-to-humidity/\" rel=\"noopener noreferrer\" target=\"_blank\">and even seeds<\/a>. “I’ve always been fascinated by living organisms, [and] by the extraordinary variety of solutions in nature, selected by the evolutionary process,” she says.<\/p><h3>Barbara Mazzolai<\/h3><br /><p><strong><\/strong><strong>Employer:<\/strong><\/p><p> Italian Institute of Technology<\/p><p><strong>Occupation: <\/strong><\/p><p>Associate director for robotics; director of the Bioinspired Soft Robotics Laboratory<\/p><p><strong>Education: <\/strong><\/p><p>Master’s degree in biology, University of Pisa; master’s degree in eco-management and audit schemes, Scuola Superiore Sant’Anna; Ph.D. in microsystems engineering, University of Rome Tor Vergata<\/p><p>But Mazzolai, now the associate director for robotics at the <a href=\"https://www.iit.it/\" rel=\"noopener noreferrer\" target=\"_blank\">Italian Institute of Technology, in Genoa<\/a>, also believes engineering needs to <a href=\"https://spectrum.ieee.org/robotics-climate-change\" target=\"_blank\">reckon with its own impact<\/a> on the natural world. That’s why she is advocating for a new field of research she calls “sustainability robotics.”<\/p><p>In a manifesto <a href=\"https://www.nature.com/articles/s42256-026-01260-6\" rel=\"noopener noreferrer\" target=\"_blank\">published in<em><em> Nature Machine Intelligence<\/em><\/em><\/a> in July, she and her collaborators outline a vision for a new approach to designing robots that’s meant to improve the relationship between nature, humanity, and technology.<\/p><p>“We need to reduce the footprint of our technology,” she says. “It’s really about thinking in a different way to open new possibilities for robotics [and] for society.” In this new mode of thinking, Mazzolai considers sustainability a core component of the design.<\/p><h2>A child of nature<\/h2><p>Mazzolai traces her fascination with the living world back to her childhood growing up on Italy’s Tuscan coast, close to the port city Livorno. Her father was a public-health inspector and a professional mycologist, and the family spent a lot of time exploring forests and learning about the local fungi and plants.<\/p><p>After toying with the prospect of pursuing art, her other major passion, Mazzolai ultimately decided to enroll at the <a href=\"https://www.unipi.it/en/\" rel=\"noopener noreferrer\" target=\"_blank\">University of Pisa<\/a> in 1987 to study biology. She was particularly drawn to marine biology, but shortly before graduating with a master’s degree in 1995, she secured a research position at the <a href=\"https://www.cnr.it/en/institute/008/institute-of-biophysics-ibf\" rel=\"noopener noreferrer\" target=\"_blank\">Italian National Research Council’s Institute of Biophysics<\/a> studying the cycles of heavy metals like mercury through both living and nonliving parts of the environment.<\/p><p>This involved collecting and analyzing samples from water, soil, vegetables, and even humans to understand the impact these metals have on health and the environment. She balanced this work with studying environmental management at the <a href=\"https://www.santannapisa.it/it\" rel=\"noopener noreferrer\" target=\"_blank\">Scuola Superiore Sant’Anna<\/a>, in Pisa, graduating with a master’s degree in 1998.<\/p><p>During that time, however, she learned that the university was recruiting biologists to help design new devices for environmental monitoring. She applied for and got the job in 1999 and began working as a research assistant under renowned bioroboticist <a href=\"https://www.embs.org/tbme/past-editorial-board-members/paolo-dario/\" rel=\"noopener noreferrer\" target=\"_blank\">Paolo Dario<\/a>, first developing sensors and then robots meant to monitor air, water, and soil.<\/p><p>Even before entering a doctoral program, Mazzolai was promoted to assistant professor in 2004 and shortly afterward made her first foray into bioinspired robotics. In collaboration with colleagues at Sant’Anna, she helped design a soft robot inspired by the octopus. “We proposed it as a paradigm for launching this idea of soft robotics: demonstrating that [robots] can be soft, but at the same time apply strong force to the environment, like the animal does,” she says.<\/p><h2>Back to school<\/h2><p>In 2007 Mazzolai enrolled in a Ph.D. in microsystems engineering at <a href=\"https://web.uniroma2.it/\" rel=\"noopener noreferrer\" target=\"_blank\">Tor Vergata University of Rome<\/a>, which she balanced with her role at Sant’Anna. She was already relying heavily on microfabrication techniques to develop sensors for her robots, and she was keen to push that part of the field forward.<\/p><p>While robots frequently feature sensors designed for perception, such as tactile or proprioceptive sensors, these systems typically focus on understanding the robot’s position in its environment, she says. “But there are few robots that integrate physical or chemical sensors to really understand the environment they move in,” she adds.<\/p><p class=\"pull-quote\"><span>“I’ve always been fascinated by living organisms, [and] by the extraordinary variety of solutions in nature.”<\/span><\/p><p>Mazzolai was appointed as a team leader at the Center for Micro-BioRobotics of the Italian Institute of Technology in 2009, where she continued her work on the emerging field of bioinspired robotics. Two years later, she completed her Ph.D. and was promoted to director of the center.<\/p><h2>Planting the seeds<\/h2><p>Around this time Mazzolai says she became interested in using plants as a model for new kinds of robots, expanding bioinspiration beyond just animals. In particular, she was captivated by the ability of roots to efficiently explore the underground environment, and she imagined machines with the same deftness could have applications in both environmental modeling and <a href=\"https://spectrum.ieee.org/fertilizer-shortage-precision-agricultur\" target=\"_blank\">precision agriculture<\/a>.<\/p><p class=\"shortcode-media shortcode-media-rebelmouse-image\"> <img alt=\"photo of silver metallic coil wrapped around a green plant vine\" class=\"rm-shortcode\" id=\"305e3\" src=\"https://spectrum.ieee.org/media-library/photo-of-silver-metallic-coil-wrapped-around-a-green-plant-vine.jpg?id=67787644&amp;width=980\" /> <small class=\"image-media media-caption\">While many bioinspired robots mimic animals, plants also serve as a muse for Mazzolai. This tendril-like bot can coil around other structures like a vine. <\/small><small class=\"image-media media-photo-credit\">Italian Institute of Technology<\/small><\/p><p>When she first proposed the idea, colleagues were somewhat skeptical of robots based on seemingly static organisms. But in reality, she says, plants move nonstop through a process known as indeterminate growth. “They really grow for their entire life,” she says. “They adapt their morphology, their behavior to the external environment; they repair, they sense, they communicate.”<\/p><p>Trying to mimic a system that operates on such different principles to conventional robotics required some serious thinking, however. Mazzolai says that working in bioinspired robotics sometimes requires you to have “two separate brains”—one of a biologist and one of an engineer.<\/p><p>The process often involves deep study of the target organism to learn the underlying principles that shape how it operates before trying to engineer a robot capable of mimicking them. “It’s not a copy of natural organisms,” says Mazzolai, because a living organism is both difficult to replicate and has different goals.<\/p><p>In the case of plant roots, what makes them so efficient at exploring the soil is that they reduce friction by growing only at the very fine tip of the structure, while the thicker base of the root remains static. This significantly reduces the amount of energy required to push through the earth compared to that of a more conventional drill, which must push the entire structure from above.<\/p><p>To realize this principle in a robot, her team developed a miniaturized 3D printer that sits at the machine’s tip and feeds thermoplastic filament through a heated nozzle to build a snakelike body behind it. This allows the robot to push through the soil efficiently. The tip also contains sensors that allow it to avoid obstacles and detect nearby nutrients or water.<\/p><h2>Making robotics sustainable<\/h2><p>After spending so much of her career borrowing from nature, Mazzolai is now eager to return the favor. Many modern technologies, including plastics and car batteries, have been developed with little thought about how they will affect the environment at the end of their life cycles, she says.<\/p><p>She wants to ensure that robotics doesn’t follow the same path. This is the inspiration for what she and collaborators now call sustainability robotics. The approach has three central pillars: ensuring that robots have minimal impact on the environment; that they’re available to people from across the world and all socioeconomic backgrounds; and that they’re “symbiotic,” providing benefits to both humans and nature.<\/p><p>More concretely, Mazzolai would like to incorporate the concept of a life cycle into the design of robots, so that at the end of their useful life these machines can be reused, recycled, or even biodegraded.<\/p><p>While that might sound ambitious, she’s confident that all the ingredients to make it a reality are in place. And it’s a vision that she is certain will inspire future roboticists. “There are younger people who want to really work in this field because this is the future, their future,” she says. Facing the threat of ongoing environmental damage, “they want to develop something that can help.”<\/p>"}, {"title": "Intrinsic open sources key parts of its platform for easier development", "source": "Robotics Business Review", "date": "2026-09-22", "url": "https://www.therobotreport.com/intrinsic-open-sources-key-parts-platform-easier-development/", "summary": "<p>With Intrinsic Core, the company is making key parts of its manipulation platform available to robotics developers. <\/p>\n<p>The post <a href=\"https://www.therobotreport.com/intrinsic-open-sources-key-parts-platform-easier-development/\">Intrinsic open sources key parts of its platform for easier development<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "NVIDIA Isaac ROS 5.0 Advances Agentic, Open Source Robotics Development", "source": "NVIDIA Robotics", "date": "2026-09-22", "url": "https://blogs.nvidia.com/blog/isaac-ros-5-0-agentic-open-source-robotics/", "summary": "To build and deploy sophisticated robotics applications that can perceive, reason and act in dynamic environments, developers need new physical AI models and tools. The ROS open framework is a project from Open Robotics that helps humans build robots. NVIDIA Isaac ROS 5.0 — a collection of GPU-accelerated packages built on ROS, released today at [&#8230;]"}, {"title": "Isaac ROS 5.0 brings AI agents to robotics development, says NVIDIA", "source": "Robotics Business Review", "date": "2026-09-22", "url": "https://www.therobotreport.com/isaac-ros-5-0-brings-ai-agents-robotics-development-says-nvidia/", "summary": "<p>The release brings new agentic workflows and platform support to NVIDIA Isaac ROS to help developers deploy robotics applications faster. <\/p>\n<p>The post <a href=\"https://www.therobotreport.com/isaac-ros-5-0-brings-ai-agents-robotics-development-says-nvidia/\">Isaac ROS 5.0 brings AI agents to robotics development, says NVIDIA<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Intel to discuss the infrastructure needed to scale physical AI at RoboBusiness", "source": "Robotics Business Review", "date": "2026-09-22", "url": "https://www.therobotreport.com/intel-discusses-infrastructure-needed-to-scale-physical-ai-robobusiness/", "summary": "<p>Intel's Nagesh Puppala will discuss why the next phase of robotics innovation depends on more than bigger models or better simulations.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/intel-discusses-infrastructure-needed-to-scale-physical-ai-robobusiness/\">Intel to discuss the infrastructure needed to scale physical AI at RoboBusiness<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Why outdoor robots fail (and how to build systems that survive)", "source": "Robotics Business Review", "date": "2026-09-22", "url": "https://www.therobotreport.com/why-outdoor-robots-fail-how-to-build-systems-that-survive/", "summary": "<p>Learn practical strategies for building reliable outdoor robots from WiBotic, Burro, and Nextpower at RoboBusiness in Silicon Valley.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/why-outdoor-robots-fail-how-to-build-systems-that-survive/\">Why outdoor robots fail (and how to build systems that survive)<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Boston Dynamics opens Metaplant Application Center to train Atlas humanoids", "source": "Robotics Business Review", "date": "2026-09-21", "url": "https://www.therobotreport.com/boston-dynamics-opens-metaplant-application-center-train-atlas-humanoid-robots/", "summary": "<p>The new Robotics Metaplant Application Center is training humanoids as part of Hyundai's Metaplant America in Georgia.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/boston-dynamics-opens-metaplant-application-center-train-atlas-humanoid-robots/\">Boston Dynamics opens Metaplant Application Center to train Atlas humanoids<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}], "embeddedNews": [{"title": "Restoring a Soviet ES-4001 Mainframe Control Panel", "source": "Hackaday", "date": "2026-10-23", "url": "https://hackaday.com/2026/10/22/restoring-a-soviet-es-4001-mainframe-control-panel/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"455\" src=\"https://hackaday.com/wp-content/uploads/2026/10/es-4001_control_panel_chornobyl_family_youtube.jpg?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>Recently the [Chornobyl Family] got their hands on an ES-4001 control panel for a 1970s-era Soviet mainframe, with the intention to restore it to full working order. Not just because <a class=\"read-more\" href=\"https://hackaday.com/2026/10/22/restoring-a-soviet-es-4001-mainframe-control-panel/\">&#8230;read more<\/a>"}, {"title": "NASA Batteries Survive Extreme Cold and Heat", "source": "Hackaday", "date": "2026-10-23", "url": "https://hackaday.com/2026/10/22/nasa-batteries-survive-extreme-cold-and-heat/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"572\" src=\"https://hackaday.com/wp-content/uploads/2026/10/cold-battery-main.jpg?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>One of the major limits of mass-produced batteries is the electrolyte. From lead-acid to lithium ion, there&#8217;s some temperature where the electrolyte will freeze and cause all sorts of problems, <a class=\"read-more\" href=\"https://hackaday.com/2026/10/22/nasa-batteries-survive-extreme-cold-and-heat/\">&#8230;read more<\/a>"}, {"title": "RoboParty RP1 (ROBOTO 01) – A full-stack open-source humanoid robot with up to 30 degrees of freedom", "source": "CNX Software", "date": "2026-10-23", "url": "https://www.cnx-software.com/2026/10/23/roboparty-rp1-roboto-01-a-full-stack-open-source-humanoid-robot-with-up-to-30-degrees-of-freedom/", "summary": "<div><img alt=\"RoboParty RP1(ROBOTO 01), an open source humanoid robot\" class=\"attachment-medium size-medium wp-post-image\" height=\"480\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/10/RoboParty-RP1ROBOTO-01-an-open-source-humanoid-robot-720x480.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Shanghai-based RoboParty has introduced the RP1 (ROBOTO 01), an open-source humanoid robot designed for robotics research, embodied AI development, and motion-control experiments. The robot is available in two configurations: the standard RP1 with 24 active degrees of freedom (DoF) and the RP1 Pro with 30 DoF. The robot stands 1.35 meters (~4.43 feet) tall and is built around a Rockchip RK3588 processor, with the Pro model adding an Allwinner A733 processor and an NVIDIA Jetson Orin NX development computing module. Other features include in-house ROMOMO joint actuators with up to 160 N·m peak torque, interchangeable head modules, optional dexterous hands, and a 10Ah battery rated for up to three hours of operation. A separate 480MHz MCU handles real-time motion control, while a dual-voltage battery system supports hot-swapping without shutting down the robot. RoboParty RP1 specifications: Computing RP1 – Rockchip RK3588 processor with a 6 TOPS NPU, 8GB LPDDR4x RAM, and [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/10/23/roboparty-rp1-roboto-01-a-full-stack-open-source-humanoid-robot-with-up-to-30-degrees-of-freedom/\">RoboParty RP1 (ROBOTO 01) &#8211; A full-stack open-source humanoid robot with up to 30 degrees of freedom<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Electronics production growth accelerating, says SI", "source": "Electronics Weekly", "date": "2026-10-23", "url": "https://www.electronicsweekly.com/news/electronics-production-growth-accelerating-says-si-2026-10/", "summary": "<p>Growth in electronics production has been accelerating in 2026, says Semiconductor  Intelligence. Three-month-average change versus a year ago for electronics production in isition. The platform has optional cloud and cellular [&#8230;]<\/p>\n<p>The post <a href=\"https://www.electronicsweekly.com/news/business/mouser-signs-controlbyweb-2026-10/\">Mouser signs ControlByWeb<\/a> appeared first on <a href=\"https://www.electronicsweekly.com\">Electronics Weekly<\/a>.<\/p>"}, {"title": "China Q3 phone market down 10% YoY", "source": "Electronics Weekly", "date": "2026-10-23", "url": "https://www.electronicsweekly.com/news/business/china-q3-phone-market-down-10-yoy-2026-10/", "summary": "<p>China’s smartphone shipments fell 10% YoY in Q3 2026, marking the lowest Q3 level since 2012, according to Counterpoint Research. Huawei and Apple captured 40% of shipments, widening their lead [&#8230;]<\/p>\n<p>The post <a href=\"https://www.electronicsweekly.com/news/business/china-q3-phone-market-down-10-yoy-2026-10/\">China Q3 phone market down 10% YoY<\/a> appeared first on <a href=\"https://www.electronicsweekly.com\">Electronics Weekly<\/a>.<\/p>"}, {"title": "Apple To Take 25% Of 2026 Foldables Market", "source": "Electronics Weekly", "date": "2026-10-23", "url": "https://www.electronicsweekly.com/blogs/mannerisms/markets/apple-to-take-25-of-foldables-market-2026-10/", "summary": "<p>&#160; Apple is expected to take a 25% share of the 2026 foldables market despite shipping its first foldable this week, says Counterpoint Research. Nonetheless Samsung is expected to remain [&#8230;]<\/p>\n<p>The post <a href=\"https://www.electronicsweekly.com/blogs/mannerisms/markets/apple-to-take-25-of-foldables-market-2026-10/\">Apple To Take 25% Of 2026 Foldables Market<\/a> appeared first on <a href=\"https://www.electronicsweekly.com\">Electronics Weekly<\/a>.<\/p>"}, {"title": "Raspberry Pi 5 Case – Pimoroni NVMe Base + Noctua 40×10mm Fan #3DThursday #3DPrinting", "source": "Adafruit", "date": "2026-10-23", "url": "https://blog.adafruit.com/2026/10/22/raspberry-pi-5-case-pimoroni-nvme-base-noctua-40x10mm-fan-3dthursday-3dprinting/", "summary": "user_258400175 shares: A Pi 5 case for the Pimoroni NVMe Base (M.2 SSD) + a Noctua 40×10mm 5Vdc fan. Two versions share the same lid: one with M3 threaded inserts (Ruthex RX-M3×5.7 brass), one that uses M3 screws directly without inserts. Both use M3 countersunk screws. Includes a PDF guide (Raspberry Pi5 Case.pdf) linked on [&#8230;]"}, {"title": "Car’s Camera Footage Backed up to NAS", "source": "Hackaday", "date": "2026-10-22", "url": "https://hackaday.com/2026/10/22/cars-camera-footage-backed-up-to-nas/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"450\" src=\"https://hackaday.com/wp-content/uploads/2026/10/glovebox-main.png?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>For as many sensors, cameras, and computers as there are on modern cars, they ought to be a dream to poke around in and customize to one&#8217;s liking. Unfortunately they&#8217;re <a class=\"read-more\" href=\"https://hackaday.com/2026/10/22/cars-camera-footage-backed-up-to-nas/\">&#8230;read more<\/a>"}, {"title": "An Open Source Linear Capacitive Encoder", "source": "Hackaday", "date": "2026-10-22", "url": "https://hackaday.com/2026/10/22/an-open-source-linear-capacitive-encoder/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"450\" src=\"https://hackaday.com/wp-content/uploads/2026/10/Screenshot-2026-10-22-214534-e1792665961677.png?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>If you&#8217;ve ever pulled apart a set of digital calipers, you&#8217;ve probably marvelled at the capacitive encoder that does all the measuring work. There&#8217;s nothing stopping you from using the <a class=\"read-more\" href=\"https://hackaday.com/2026/10/22/an-open-source-linear-capacitive-encoder/\">&#8230;read more<\/a>"}, {"title": "Keeping Old Wi-Fi Radios Alive With Stream Conversion", "source": "Hackaday", "date": "2026-10-22", "url": "https://hackaday.com/2026/10/22/keeping-old-wi-fi-radios-alive-with-stream-conversion/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"450\" src=\"https://hackaday.com/wp-content/uploads/2026/10/itsthabigolboondogglah.webp?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>There are plenty of Wi-Fi radios out there that were built over the last two decades or so. However, many older models are now becoming less useful because many internet <a class=\"read-more\" href=\"https://hackaday.com/2026/10/22/keeping-old-wi-fi-radios-alive-with-stream-conversion/\">&#8230;read more<\/a>"}, {"title": "KiCad… In The Browser?", "source": "Hackaday", "date": "2026-10-22", "url": "https://hackaday.com/2026/10/22/kicad-in-the-browser/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"450\" src=\"https://hackaday.com/wp-content/uploads/2026/10/Screenshot-2026-10-21-161936-e1792560000590.png?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>KiCad is a useful tool for designing printed circuit boards, but it&#8217;s of no use to you if you can&#8217;t install it on the computer you&#8217;re on. To get around <a class=\"read-more\" href=\"https://hackaday.com/2026/10/22/kicad-in-the-browser/\">&#8230;read more<\/a>"}, {"title": "Japan Launches Mission to Study Martian Moon", "source": "Hackaday", "date": "2026-10-22", "url": "https://hackaday.com/2026/10/22/japan-launches-mission-to-study-martian-moon/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"450\" src=\"https://hackaday.com/wp-content/uploads/2026/10/marsmoons_feat.jpg?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>Humanity has been sending robotic explorers to Mars since the 1970s, and for our efforts we&#8217;ve been rewarded with not only incredible imagery of the Red Planet&#8217;s magnificent desolation, but <a class=\"read-more\" href=\"https://hackaday.com/2026/10/22/japan-launches-mission-to-study-martian-moon/\">&#8230;read more<\/a>"}, {"title": "GL.iNet Mango 2 mini travel router features AC1300 WiFi 5 and dual Gigabit Ethernet", "source": "CNX Software", "date": "2026-10-22", "url": "https://www.cnx-software.com/2026/10/22/gl-inet-mango-2-mini-travel-router-features-ac1300-wifi-5-and-dual-gigabit-ethernet/", "summary": "<div><img alt=\"GL.iNet Mango 2 (GL MG1300) Dual band Mini Travel Router\" class=\"attachment-medium size-medium wp-post-image\" height=\"480\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/10/GL.iNet-Mango-2-GL-MG1300-Dual-band-Mini-Travel-Router-720x480.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>GL.iNet Mango 2 (GL-MG1300) mini dual-band WiFi 5 travel router is built around the MediaTek MT7621A dual-core processor. It is designed to share hotel WiFi, wired Ethernet, or mobile internet connections with multiple devices. The router measures just 89 x 63 x 15mm and weighs 100 grams. It supports WiFi speeds of up to 400 Mbps on the 2.4 GHz band and 866 Mbps on the 5 GHz band, along with WireGuard VPN speeds of up to 184 Mbps and OpenVPN speeds of up to 95 Mbps with DCO. Other features include dual  Gigabit Ethernet ports, USB 3.0, USB-C power, and others. GL.iNet Mango 2 (GL-MG1300) specifications: Processor – Mediatek MT7621A dual core MIPS 1004Kc processor @ 880Mhz Memory – 128MB DDR3L RAM Storage – 128MB SPI NAND flash + 2MB SPI NOR flash Networking 2x Gigabit Ethernet ports (WAN/LAN) Dual-band 802.11a/b/g/n/ac WiFi 5 2.4 GHz – Up to 400 [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/10/22/gl-inet-mango-2-mini-travel-router-features-ac1300-wifi-5-and-dual-gigabit-ethernet/\">GL.iNet Mango 2 mini travel router features AC1300 WiFi 5 and dual Gigabit Ethernet<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Rotary encoder with 1.8-inch touch display gets upgrade to ESP32-S31 SoC", "source": "CNX Software", "date": "2026-10-22", "url": "https://www.cnx-software.com/2026/10/22/rotary-encoder-with-1-8-inch-touch-display-gets-upgrade-to-esp32-s31-soc/", "summary": "<div><img alt=\"ESP32-S31 rotary encoder\" class=\"attachment-medium size-medium wp-post-image\" height=\"673\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/10/ESP32-S31-rotary-encoder-720x673.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Following our coverage of a 4.3-inch ESP32-S31 display development board, a Facebook reader pointed out the GUITION JC3636F118C-I-YR1 rotary encoder with a built-in 1.8-inch touchscreen display. It appears to be an update to an earlier ESP32-S3 model, now equipped with an ESP32-S31NRV16 WiFi 6, Bluetooth 5.4, and 802.15.4 SoC with 16MB of PSRAM. The rotary knob also includes 16MB SPI flash, a speaker, a microphone, and an optional rechargeable battery. GUITION JC3636F118C-I-YR1 specifications: SoC – ESP32-S31NRV16 CPU RISC-V HP (High-performance) RV32IMAFCP CPU @ 320 MHz with FPU, SIMD, etc. RISC-V LP (Low-power) MCU core Memory – 512 KB SRAM, 32 KB low-power SRAM, 16MB PSRAM Wireless 2.4 GHz WiFi 6 (802.11ax) Bluetooth 5.4 with support for LE Audio, direction finding, Bluetooth Mesh 1.1, and Classic (BR/EDR) 802.15.4 radio for Zigbee, Thread, and Matter Storage 16 MB flash MicroSD card slot (for WiFi configuration, music or MJPEG video playback, etc.) Display 1.8-inch [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/10/22/rotary-encoder-with-1-8-inch-touch-display-gets-upgrade-to-esp32-s31-soc/\">Rotary encoder with 1.8-inch touch display gets upgrade to ESP32-S31 SoC<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Socionext, Cadence Advance AI-Driven 3-nm SoC Design", "source": "Embedded.com", "date": "2026-10-22", "url": "https://www.embedded.com/socionext-cadence-advance-ai-driven-3-nm-soc-design/", "summary": "<p>Socionext Inc. is expanding its use of agentic artificial intelligence (AI) across system-on-chip (SoC) development, extending AI-driven workflows from front-end design and verification to the physical design of large-scale chips manufactured using advanced process technologies. The initiative includes a collaboration with Cadence Design Systems Inc. and the deployment of its InnoStack AI Super Agent for [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/socionext-cadence-advance-ai-driven-3-nm-soc-design/\">Socionext, Cadence Advance AI-Driven 3-nm SoC Design<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "How Agentic AI Accelerates Edge AI Software Development", "source": "Embedded.com", "date": "2026-10-22", "url": "https://www.embedded.com/how-agentic-ai-accelerates-edge-ai-software-development/", "summary": "<p>Deploying an AI model on edge hardware involves much more than generating application code. The model needs to be compressed or quantized to fit available memory, compiled for a specific processor, integrated with a runtime, and tested for latency, power consumption, and accuracy. Developers must also make the software work with the surrounding embedded components [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/how-agentic-ai-accelerates-edge-ai-software-development/\">How Agentic AI Accelerates Edge AI Software Development<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "Fable: The CEO Who Cut The Cr*p", "source": "Electronics Weekly", "date": "2026-10-22", "url": "https://www.electronicsweekly.com/blogs/mannerisms/fable/fable-the-ceo-who-cut-the-crp-2026-10/", "summary": "<p>There was once a company expecting to lose $17 billion one year who bought in a new CEO. He mortgaged all the assets of the company to raise a $23.5 [&#8230;]<\/p>\n<p>The post <a href=\"https://www.electronicsweekly.com/blogs/mannerism  a $6 billion valuation before it has put a product on the market. ‘Neolab’ denotes an [&#8230;]<\/p>\n<p>The post <a href=\"https://www.electronicsweekly.com/news/business/flapping-airplanes-raises-1bn-2026-10/\">Flapping Airplanes raises $1bn<\/a> appeared first on <a href=\"https://www.electronicsweekly.com\">Electronics Weekly<\/a>.<\/p>"}, {"title": "#3DThursday #3DPrinting", "source": "Adafruit", "date": "2026-10-22", "url": "https://blog.adafruit.com/2026/10/22/3dthursday-3dprinting-6/", "summary": "Shared by m@ on MakerWorld: Add cozy holiday glow and charm to your space with this unique Christmas Light Bulb Tea Light! It&#8217;s inspired by classic holiday bulbs and scaled up to make the perfect LED tea light! They make for a great display on the mantel, a bookshelf, table centerpiece, or even as an [&#8230;]"}, {"title": "Meshed Christmas Ornaments – Tea Light Compatible Shadows #3DThursday #3DPrinting", "source": "Adafruit", "date": "2026-10-22", "url": "https://blog.adafruit.com/2026/10/22/meshed-christmas-ornaments-tea-light-compatible-shadows-3dthursday-3dprinting/", "summary": "Maxx_Design shares: Meshed Christmas tree ornaments. A light placed inside casts shadows and creates a mood effect. Fits tea lights up to ~40mm diameter × 52mm height (designer says &#8216;electric tea light&#8217; — battery-powered). Alternative Christmas intro pick — hold for Nov batches as ramp builds. By Maxx Design download the files on: https://makerworld.com/en/models/777746-meshed-christmas-ornaments-tea-light-compatible Every [&#8230;]"}, {"title": "Monitor Riser – with drawers #3DThursday #3DPrinting", "source": "Adafruit", "date": "2026-10-22", "url": "https://blog.adafruit.com/2026/10/22/monitor-riser-with-drawers-3dthursday-3dprinting/", "summary": "Shared by Frank3d on MakerWorld: This model is designed to create a shelf with sliding drawers, perfect for optimizing desk space and improving organization. The design has been developed with a strong focus on easy and fast printing, ensuring reduced print times without compromising aesthetics and functionality. Download the files and learn more Every Thursday [&#8230;]"}, {"title": "Modern Ring Lamp HALO – E27 Bulb #3DThursday #3DPrinting", "source": "Adafruit", "date": "2026-10-22", "url": "https://blog.adafruit.com/2026/10/22/modern-ring-lamp-halo-e27-bulb-3dthursday-3dprinting/", "summary": "pascobeck shares: A minimalist modern ring table lamp with a wide, ribbed ring shape for even light + subtle presence. Suited to bedside, living room, or desk. Compatible with E27 lamp holder with switch, OR Bambu LED Lamp Kit 001. Base + shade print separately, no AMS. Base: matte black PLA with FuzzySkin texture. Shade: [&#8230;]"}, {"title": "Meshtastic Lilygo T-Deck Case – 2-Piece Snap-Together with Internal Ribbon Antenna #3DThursday #3DPrinting", "source": "Adafruit", "date": "2026-10-22", "url": "https://blog.adafruit.com/2026/10/22/meshtastic-lilygo-t-deck-case-2-piece-snap-together-with-internal-ribbon-antenna-3dthursday-3dprinting/", "summary": "A 2-piece snap-together case for the LilyGo T-Deck. Designed around an internal ribbon antenna. No hardware required. Keeps the factory power switch usable. Designer tested with small + medium batteries (NOT a 6000mAh — fit unknown for that size); battery taped to interior back panel. 0.2mm layer, 2 walls, 15% infill, ~1.3h, 35g PLA, 1 [&#8230;]"}, {"title": "John Park’s Workshop — LIVE TODAY 10/22/26", "source": "Adafruit", "date": "2026-10-22", "url": "https://blog.adafruit.com/2026/10/22/john-parks-workshop-live-today-10-22-26/", "summary": "It&#8217;s JOHN PARK’S WORKSHOP — LIVE! &#8212; Coming up at 4pm ET / 1pm PT Today (the usual time, no change to the Workshop show schedule)!  LIVE TEXT CHAT IS HERE in the Adafruit Discord chat! Projects: CG Turbo Demos CircuitPython Parsec: Self Naming Boards Learn Guides Gear Report Tool Tips CAD: Adafruit Circuit Designer Retro Gear Coupon [&#8230;]"}, {"title": "16×16 WLED LED Matrix – ESP8266/ESP32 with 4× 8×8 WS2812 Panels #3DThursday #3DPrinting", "source": "Adafruit", "date": "2026-10-22", "url": "https://blog.adafruit.com/2026/10/22/16x16-wled-led-matrix-esp8266-esp32-with-4x-8x8-ws2812-panels-3dthursday-3dprinting/", "summary": "HotPotato shares: A 3D-printable frame for a 16×16 LED matrix — larger version of the designer&#8217;s 8×8 model. Runs on WLED. &#8216;NO programming skills&#8217; needed, though WLED matrix + panel-orientation setup is more involved. Target: ESP8266 (ESP32 works too). LEDs: four 8×8 WS2812 (5050 RGB) matrix panels. Power: 2-pin USB Type-C 5A socket, or cable [&#8230;]"}, {"title": "The Python on Microcontrollers Newsletter: subscribe for free", "source": "Adafruit", "date": "2026-10-22", "url": "https://blog.adafruit.com/2026/10/22/the-python-on-microcontrollers-newsletter-subscribe-for-free-10-22-2/", "summary": "The Python for Microcontrollers Newsletter is the place for the latest news involving Python on hardware (microcontrollers AND single board computers like Raspberry Pi). This ad-free, spam-free weekly email is filled with CircuitPython, MicroPython, and Python information that you may have missed, all in one place! You get a summary of all the software, events, projects, and the latest hardware worldwide once a week, no [&#8230;]"}, {"title": "Clamp Holder – Six-Up Workbench Clamp Storage #3DThursday #3DPrinting", "source": "Adafruit", "date": "2026-10-22", "url": "https://blog.adafruit.com/2026/10/22/clamp-holder-six-up-workbench-clamp-storage-3dthursday-3dprinting/", "summary": "A free holder for storing clamps near a workbench. Mounts to a surface with double-sided tape. The clamp grips the holder while stored. Keeps clamps out of the way while staying within quick reach. Listed file is a 6-up plate: 0.2mm layer, 2 walls, 15% infill, ~42 min, 19g PLA. CC BY-SA 4.0 (commercial use [&#8230;]"}, {"title": "Gridfinity Precision Tool Holder #3DThursday #3DPrinting", "source": "Adafruit", "date": "2026-10-22", "url": "https://blog.adafruit.com/2026/10/22/gridfinity-precision-tool-holder-3dthursday-3dprinting/", "summary": "PrintMeister shares: A custom Gridfinity box with dedicated spaces for precision measuring tools: precision angle (square), tape measure in the center, protractor. Base follows the standard Gridfinity grid and is compatible with other Gridfinity boxes. Suits small to medium-sized tools. 0.2mm layer, 2 walls, 10% infill, ~2.9h, 89g PLA, 1 plate. CC BY-NC-SA 4.0. Rotates [&#8230;]"}, {"title": "3D Hangouts – USB Desk Hub, Holiday Wreath and Caroline", "source": "Adafruit", "date": "2026-10-22", "url": "https://blog.adafruit.com/2026/10/22/3d-hangouts-usb-desk-hub-holiday-wreath-and-caroline/", "summary": "3D Hangouts – USB Desk Hub, Holiday Wreath and Caroline https://youtube.com/live/_yM1B3QA7ok?feature=share This week @adafruit Noe is showcasing his guide for his built-in USB hub for the Ikea MITTZON desk. Pedro is working on a new project inspired by the Apple HomeView. Checking out this week’s Timelapse Tuesday model of Caroline. USB hub for Ikea Mittzon [&#8230;]"}, {"title": "STMicroelectronics adds MasterGaN7 devices to integrated high-efficiency power family", "source": "EE Journal", "date": "2026-10-22", "url": "https://www.eejournal.com/industry_news/stmicroelectronics-adds-mastergan7-devices-to-integrated-high-efficiency-power-family/", "summary": "STMicroelectronics has extended its MasterGaN integrated transistor/driver family with new MasterGaN7 devices that contain 650V enhancement-mode GaN transistors with 6A maximum current rating. The new series helps designers boost efficiency and power density in applications such as power adapters, chargers, industrial lighting equipment, and solar microinverters. MasterGaN7 connects the two 650V GaN transistors in half-bridge [&#8230;]"}, {"title": "Robotiq Launches the 2FC Physical AI Gripper", "source": "EE Journal", "date": "2026-10-22", "url": "https://www.eejournal.com/industry_news/robotiq-launches-the-2fc-physical-ai-gripper/", "summary": "<img alt=\"\" class=\"webfeedsFeaturedVisual wp-post-image\" height=\"300\" src=\"https://www.eejournal.com/wp-content/uploads/2026/10/Robotiq_2FC_physical_AI_gripper_1-300x300.png\" style=\"display: block; margin-bottom: 5px; clear: both;\" width=\"300\" /> Robotiq today launched the 2FC physical AI gripper, a production-ready adaptive gripper with tactile sensing and embedded intelligence, helping robots learn from physical interaction and act reliably on what they learn, from the lab to production. Pre-orders open today, with shipping in Q1 2027. Physical AI has a blind spot: touch The industry is investing heavily [&#8230;]"}, {"title": "TDK introduces compact Y1 safety capacitors for operations up to 500 V (AC) and +125 °C", "source": "EE Journal", "date": "2026-10-22", "url": "https://www.eejournal.com/industry_news/tdk-introduces-compact-y1-safety-capacitors-for-operations-up-to-500-v-ac-and-125-c/", "summary": "TDK Corporation (TSE: 6762) has introduced the compact B3201*A5/B5/C5 series of Y1 safety capacitors designed to suppress EMI in demanding automotive and industrial applications. The metallized polypropylene (MKP) film capacitors are rated for AC voltages of 500 V and DC voltages of up to 1500 V. Featuring a maximum operating temperature of up to +125 °C (with derating), they combine [&#8230;]"}, {"title": "ODVA Specifies ix Industrial® as a New Ethernet/IP Interface", "source": "EE Journal", "date": "2026-10-22", "url": "https://www.eejournal.com/industry_news/odva-specifies-ix-industrial-as-a-new-ethernet-ip-interface/", "summary": "The ODVA (Open DeviceNet Vendor Association) has officially specified the compact, industrial-grade ix Industrial® mating interface for Ethernet/IP network applications. This completes the standardization and referencing process for the smaller, more rugged alternative to the classic RJ45 connector. In addition to Ethernet/IP, the ix Industrial is already integrated into leading industry standards including PROFINET, CC-Link IE [&#8230;]"}, {"title": "The Rising Tide of Haptic Interfaces", "source": "EE Journal", "date": "2026-10-22", "url": "https://www.eejournal.com/article/the-rising-tide-of-haptic-interfaces/", "summary": "<img alt=\"\" class=\"webfeedsFeaturedVisual wp-post-image\" height=\"149\" src=\"https://www.eejournal.com/wp-content/uploads/2026/10/max-0529-image-for-home-page-titan-haptics-300x149.jpg\" style=\"display: block; margin-bottom: 5px; clear: both;\" width=\"300\" />I have a feeling that we’ll be hearing (and feeling) a lot about haptics in the not-so-distant future. With this in mind, it behooves us to prepare ourselves for the onslaught to come. Let’s start with the word “haptic” itself, which comes from the Ancient Greek haptikos, meaning &#8220;able to come into contact with&#8221; or [&#8230;]"}, {"title": "ESP-Mosaico – An ESP32-S31-based modular development platform for AI-assisted hardware creation", "source": "CNX Software", "date": "2026-10-21", "url": "https://www.cnx-software.com/2026/10/21/esp-mosaico-an-esp32-s31-based-modular-development-platform-for-ai-assisted-hardware-creation/", "summary": "<div><img alt=\"ESP-Mosaico\" class=\"attachment-medium size-medium wp-post-image\" height=\"430\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/10/ESP-Mosaico-720x430.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Espressif Systems ESP-Mosaico is an ESP32-S31 development platform with a 480 × 480 OLED touchscreen, haptic feedback, a built-in battery, USB Type-C connectivity, and expansion I/O. It&#8217;s specifically designed for AI &#60;-&#62; hardware integration and targets magnetic expansion toys, motion sensing, square touch display HMI, and edge voice/multimedia applications. ESP-Mosaico specifications: CoreBoard SoC – ESP32-S31NRV16 CPU RISC-V HP (High-performance) RV32IMAFCP CPU @ 320 MHz with FPU, SIMD, etc. RISC-V LP (Low-power) MCU core Memory – 512 KB SRAM, 32 KB low-power SRAM, 16MB PSRAM Wireless 2.4 GHz WiFi 6 (802.11ax) Bluetooth 5.4 with support for LE Audio, direction finding, Bluetooth Mesh 1.1, and Classic (BR/EDR) 802.15.4 radio for Zigbee, Thread, and Matter Storage 1 Gbit (128 MB) SPI NAND flash for asset storage. 16 MB (128 Mbit) SPI NOR flash (GD25Q128EWIGR) for program and data storage. Display &#8211; 2.16-inch QSPI touch display with 480 x 480 resolution; CO5300 driver + CST9220 [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/10/21/esp-mosaico-an-esp32-s31-based-modular-development-platform-for-ai-assisted-hardware-creation/\">ESP-Mosaico &#8211; An ESP32-S31-based modular development platform for AI-assisted hardware creation<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Raytron SE5 1280: 1280×1024 Uncooled Thermal Imaging Module for OEM Applications (Sponsored)", "source": "CNX Software", "date": "2026-10-21", "url": "https://www.cnx-software.com/2026/10/21/raytron-se5-1280-1280x1024-uncooled-thermal-imaging-module-for-oem-applications/", "summary": "<div><img alt=\"Raytron SE5 1280 LWIR Thermal Sensor\" class=\"attachment-medium size-medium wp-post-image\" height=\"480\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/09/Raytron-SE5-1280-LWIR-Thermal-Sensor-720x480.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>The Raytron SE5 1280 is a high-resolution uncooled infrared module designed for integration into OEM thermal imaging systems. Based on a 1280 × 1024 uncooled VOx infrared detector with a 12 μm pixel pitch, the module delivers more than 1.3 million infrared pixels in a compact form factor measuring no more than 29 × 29 × 15.7 mm and weighing less than 26 g. 1280 × 1024 VOx Detector for High-Resolution Thermal Imaging At the core of the SE5 1280 is a 1280 × 1024 uncooled VOx infrared detector with a 12 μm pixel pitch, operating in the 8–14 μm long-wave infrared (LWIR) band. With more than 1.3 million infrared pixels, the detector provides a substantially higher spatial resolution than conventional 640 × 512 thermal imaging configurations. This can help thermal imaging systems capture finer temperature patterns and spatial details, particularly when identifying relatively small thermal targets or distinguishing objects [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/10/21/raytron-se5-1280-1280x1024-uncooled-thermal-imaging-module-for-oem-applications/\">Raytron SE5 1280: 1280×1024 Uncooled Thermal Imaging Module for OEM Applications (Sponsored)<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Variscite, SecEdge Add Firmware TPM 2.0 Security to i.MX SoMs", "source": "Embedded.com", "date": "2026-10-21", "url": "https://www.embedded.com/variscite-secedge-add-firmware-tpm-2-0-security-to-i-mx-soms/", "summary": "<p>Variscite and SecEdge Inc. have announced the availability of firmware-based Trusted Platform Module (TPM) 2.0 security across Variscite's i.MX system-on-modules (SoMs). The solution integrates SecEdge's SEC-TPM firmware implementation into the application processor's security architecture, enabling device authentication and cryptographic key protection without requiring a separate TPM chip. TPM 2.0, defined by the Trusted Computing Group [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/variscite-secedge-add-firmware-tpm-2-0-security-to-i-mx-soms/\">Variscite, SecEdge Add Firmware TPM 2.0 Security to i.MX SoMs<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "Siemens Adds Self-Verification for Long-Running EDA Agents", "source": "Embedded.com", "date": "2026-10-21", "url": "https://www.embedded.com/siemens-adds-self-verification-for-long-running-eda-agents/", "summary": "<p>Self-verifying agents can manage extended semiconductor design workflows, but deterministic EDA tools and human engineers still determine whether results are valid.<\/p>\n<p>The post <a href=\"https://www.embedded.com/siemens-adds-self-verification-for-long-running-eda-agents/\">Siemens Adds Self-Verification for Long-Running EDA Agents<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "CR-8000 2026 Streamlines PCB Development With New Automation and Reuse Capabilities", "source": "EE Journal", "date": "2026-10-21", "url": "https://www.eejournal.com/industry_news/cr-8000-2026-streamlines-pcb-development-with-new-automation-and-reuse-capabilities/", "summary": "Zuken announced CR-8000 2026, a new release of its PCB design platform that adds automation, placement analysis, and design reuse capabilities to support engineering productivity across schematic development and PCB layout. Enhancements include automated schematic routing in Design Gateway, CR-8000’s schematic capture tool, and a new Main Path View in Design Force, its PCB layout [&#8230;]"}, {"title": "Impulse Embedded Ltd Relaunches VELA: Powered by Advantech", "source": "EE Journal", "date": "2026-10-21", "url": "https://www.eejournal.com/industry_news/impulse-embedded-ltd-relaunches-vela-powered-by-advantech/", "summary": "Impulse Embedded Ltd, a leading UK provider of industrial computing solutions, has announced VELA: Powered by Advantech, a series of in-stock industrial PCs, GPU systems and servers that are in stock and ready to build from the UK. Designed to give customers greater flexibility without the long lead times often associated with custom computing, VELA [&#8230;]"}, {"title": "SECO to showcase SOM-SMARC-Dragonwing-IQ8 module and Edge AI technologies at electronica 2026", "source": "EE Journal", "date": "2026-10-21", "url": "https://www.eejournal.com/industry_news/seco-to-showcase-som-smarc-dragonwing-iq8-module-and-edge-ai-technologies-at-electronica-2026/", "summary": "SECO will present its SOM-SMARC-Dragonwing-IQ8 module and Edge AI technologies at electronica 2026, held from 10 to 13 November in Munich, Germany. Through Edge Lab LIVE! demonstrations, partner showcases across multiple halls and two conference sessions, visitors can learn more about how SECO’s modular hardware, AI development tools and lifecycle software support OEMs developing intelligent [&#8230;]"}, {"title": "Hirose Introduces Compact Floating Board-to-Board Connector for High-heat, High-Vibration Environments", "source": "EE Journal", "date": "2026-10-21", "url": "https://www.eejournal.com/industry_news/hirose-introduces-compact-floating-board-to-board-connector-for-high-heat-high-vibration-environments/", "summary": "Hirose has expanded its FunctionMAX™ family of floating board-to-board connectors to include a high-density version designed for space-constrained, harsh-environment applications. Featuring a 0.5 mm pitch, the FX36 Series supports high-density mounting, improves design flexibility, and contributes to application miniaturization, weight reduction, and more efficient automated assembly processes. With a high-heat resistance of 125°C, the board-to-board [&#8230;]"}, {"title": "Semtech LR2021 LoRa chip gets the SDR treatment, supports 100 MHz to 2.74 GHz", "source": "CNX Software", "date": "2026-10-20", "url": "https://www.cnx-software.com/2026/10/20/semtech-lr2021-lora-chip-gets-the-sdr-treatment-supports-100-mhz-to-2-74-ghz/", "summary": "<div><img alt=\"Semtech LR2021 LoRa transceiver used as an SDR for raw I Q capture and signal analysis (Image AI generated)\" class=\"attachment-medium size-medium wp-post-image\" height=\"480\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/10/Semtech-LR2021-LoRa-transceiver-used-as-an-SDR-for-raw-I-Q-capture-and-signal-analysis-Image-AI-generated-720x480.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Earlier this month, we saw how the humble ESP32-S3 could be turned into an SDR transmitter and receiver; then we saw developer h0m3us3r release the w1700k-sdr project, which turns a Gemtek W1700K Wi-Fi 7 router into a wideband SDR receiver. The LR2021-SDR open-source project by Samuel Reynolds (SAMS0N1TE) follows the same principle and turns the Semtech LR2021 LoRa transceiver into a software-defined radio (SDR) capable of receiving signals from 100 MHz to 2.74 GHz. Using an undocumented command in the chip&#8217;s ROM, this project exposes raw 16-bit I/Q samples, allowing software to decode P25 Phase 1 digital voice, POCSAG pager messages, and analog FM signals without an external SDR dongle. LR2021-SDR firmware features: Supported hardware &#8211; Semtech LR2021 running ROM 1.24; not compatible with the SX1262 variant for raw I/Q access. Receive frequency range &#8211; 100 MHz to 2.74 GHz (experimentally tested), extending beyond the datasheet&#8217;s specified 150–960 MHz and 1.5–2.5 [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/10/20/semtech-lr2021-lora-chip-gets-the-sdr-treatment-supports-100-mhz-to-2-74-ghz/\">Semtech LR2021 LoRa chip gets the SDR treatment, supports 100 MHz to 2.74 GHz<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Altera Expands Defense-Grade Agilex FPGA Portfolio", "source": "Embedded.com", "date": "2026-10-20", "url": "https://www.embedded.com/altera-expands-defense-grade-agilex-fpga-portfolio/", "summary": "<p>Altera Corp. is extending defense-grade capabilities across its Agilex FPGA and SoC FPGA portfolio to support aerospace and defense systems requiring high performance, reliability, and long-term availability. The expanded offering covers applications ranging from embedded processing and edge computing to high-bandwidth communications, sensing, and electronic warfare. Defense-grade Agilex devices are designed to operate across temperatures [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/altera-expands-defense-grade-agilex-fpga-portfolio/\">Altera Expands Defense-Grade Agilex FPGA Portfolio<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "Synaptics Claims a New Class of Edge AI Processors, Expands Coralboard Platform", "source": "Embedded.com", "date": "2026-10-20", "url": "https://www.embedded.com/synaptics-claims-a-new-class-of-edge-ai-processors-expands-coralboard-platform/", "summary": "<p>Synaptics Inc. has claimed a new class of microcontrollers (MCUs), the xMCU, for multimodal edge AI. Announced at its annual tech day, the new Astra SR200 series combines heterogeneous, AI-native compute and acceleration with integrated high-bandwidth custom DRAM. It was designed to enable device-native and real-time experiences that combine modalities such as voice, vision, audio, [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/synaptics-claims-a-new-class-of-edge-ai-processors-expands-coralboard-platform/\">Synaptics Claims a New Class of Edge AI Processors, Expands Coralboard Platform<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "Neural Concept Launches MCP Bridge, Augmenting AI Agents to Operate Industrial Engineering Software", "source": "EE Journal", "date": "2026-10-20", "url": "https://www.eejournal.com/industry_news/neural-concept-launches-mcp-bridge-augmenting-ai-agents-to-operate-industrial-engineering-software/", "summary": "AI agents can now operate commercial CAD and simulation software such as CATIA, NX and Abaqus, inside enterprise environments. Neural Concept benchmarked AI models on real engineering tasks and tuned them to each one, so every step of the design and simulation workflow runs on the best-suited model. MCP Bridge is already deployed by leading [&#8230;]"}, {"title": "Linux 7.3 release – Main Changes, Arm, RISC-V, and MIPS architectures", "source": "CNX Software", "date": "2026-10-19", "url": "https://www.cnx-software.com/2026/10/20/linux-7-3-release-main-changes-arm-risc-v-and-mips-architectures/", "summary": "<div><img alt=\"Linux 7.3\" class=\"attachment-medium size-medium wp-post-image\" height=\"450\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/10/Linux-7.3-720x450.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Linus Torvalds announced the release of Linux 7.3 on LKML last Sunday: It&#8217;s Sunday afternoon, and this week I somehow kept my wits together long enough to keep track of the day of the week, so the release isn&#8217;t randomly delayed. Will wonders never cease? Anyway, nothing very special seems to have happened this last week, so as expected the final 7.3 is out, and thus tomorrow the merge window for 7.4 opens. Except I&#8217;m on my annual family vacation, so instead of merging anything first thing in the morning, I&#8217;ll spend most of the day on a boat and under water. I&#8217;ll get back to merging in the afternoon, but I expect my schedule to be a bit unusual for a while. I hope I can still complete the merge window in the usual two weeks, but it may be that I&#8217;ll end up with an extra week of merging [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/10/20/linux-7-3-release-main-changes-arm-risc-v-and-mips-architectures/\">Linux 7.3 release &#8211; Main Changes, Arm, RISC-V, and MIPS architectures<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "BIOSTAR BIWCL-PAT – A 3.5-inch industrial Wildcat Lake SBC with dual 2.5GbE, triple display support", "source": "CNX Software", "date": "2026-10-19", "url": "https://www.cnx-software.com/2026/10/19/biostar-biwcl-pat-a-3-5-inch-industrial-wildcat-lake-sbc-with-dual-2-5gbe-triple-display-support/", "summary": "<div><img alt=\"BIWCL PAT industrial motherboard\" class=\"attachment-medium size-medium wp-post-image\" height=\"480\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/10/BIWCL-PAT-industrial-motherboard-720x480.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>BIOSTAR BIWCL-PAT is a 3.5-inch industrial SBC built around the Intel Core Series 3 &#8220;Wildcat Lake&#8221; SoC family, ranging from the Core 3 304 to the Core 7 360. The board supports up to 64GB DDR5-6400 memory, three independent displays, and dual 2.5GbE networking. It also features three M.2 slots for NVMe storage, Wi-Fi/Bluetooth, and 4G/5G cellular connectivity, along with USB 3.2 ports, four serial interfaces, and an 8-bit digital I/O header. The compact 148 x 102mm form factor makes it suitable for industrial automation, edge computing, AIoT, human-machine interfaces (HMI), and POS/kiosk applications. BIOSTAR BIWCL-PAT specifications: Wildcat Lake SoC (one or the other) Intel Core 3 304 penta-core CPU with 1x P core @ 1.5 GHz / 4.3 GHz (Turbo) and 4x LPE cores, 1-core Intel Xe3 Graphics @ 2.3 GHz; TDP: 15W Intel Core 3 305 hexa-core CPU with 2x P cores @ 1.5 GHz / 4.3 GHz [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/10/19/biostar-biwcl-pat-a-3-5-inch-industrial-wildcat-lake-sbc-with-dual-2-5gbe-triple-display-support/\">BIOSTAR BIWCL-PAT &#8211; A 3.5-inch industrial Wildcat Lake SBC with dual 2.5GbE, triple display support<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Axera AX8860P 16-core Cortex-A55 SoC takes on NVIDIA DGX Spark at fraction of the cost", "source": "CNX Software", "date": "2026-10-19", "url": "https://www.cnx-software.com/2026/10/19/axera-ax8860p-16-core-cortex-a55-soc-takes-on-nvidia-dgx-spark-at-fraction-of-the-cost/", "summary": "<div><img alt=\"Axera AX8860 products\" class=\"attachment-medium size-medium wp-post-image\" height=\"654\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/10/Axera-AX8860-products-720x654.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Axera AX8860P is a new 16-core Cortex-A55 SoC with up to 128 TOPS/256 TOPS (FP4) NPU, 256-bit LPDDR5/5X memory, and PCIe 5.0 connectivity, aiming to power desktop AI solutions competing with NVIDIA DGX Spark at a fraction of the cost. Dr. Qiu Xiaoxin, founder and CEO of Axera, unveiled the new AX8860/AX8860P processor a few days ago at the China International Industrial Fair, along with upcoming products from Sipeed and Radxa. Axera AX8860P key features and specifications: CPU &#8211; 16x Arm Cortex-A55 processor AI &#8211; Up to 256 TOPS VPU &#8211; 64-channel decode, 16-channel encode Memory &#8211; Up to 128GB 256-bit LPDDR5x with 273GB/s bandwidth Interconnect &#8211; PCIe 5.0 + AXLink (C2C) cascading with 80% efficiency for multi-chip cards and systems Power Consumption &#8211; About 40 Watts under load Package &#8211; 78 × 78 mm module Process &#8211; 6nm The AX8860P SoC is said to support vLLM, SGLang, PyTorch, ONNX, [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/10/19/axera-ax8860p-16-core-cortex-a55-soc-takes-on-nvidia-dgx-spark-at-fraction-of-the-cost/\">Axera AX8860P 16-core Cortex-A55 SoC takes on NVIDIA DGX Spark at fraction of the cost<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Seco Modular Vision 10.1 MX95 Enters Mass Production", "source": "Embedded.com", "date": "2026-10-19", "url": "https://www.embedded.com/seco-modular-vision-10-1-mx95-enters-mass-production/", "summary": "<p>Seco has moved its Modular Vision 10.1 MX95 industrial human-machine interface (HMI) platform into mass production, making it available to original equipment manufacturers (OEMs) and system integrators developing new industrial interfaces or upgrading existing machine designs. Based on NXP's i.MX 95 applications processor, the platform integrates computing, display, industrial connectivity, and software into a single [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/seco-modular-vision-10-1-mx95-enters-mass-production/\">Seco Modular Vision 10.1 MX95 Enters Mass Production<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "Industrial Edge Analytics: Detect Issues Faster and Improve Maintenance", "source": "Embedded.com", "date": "2026-10-19", "url": "https://www.embedded.com/industrial-edge-analytics-detect-issues-faster-and-improve-maintenance/", "summary": "<p>Edge computing processes data locally, transforming sensor data into decision-making inference close to the source. It delivers lower latency, higher accuracy, and faster decision-making for real-time industrial analytics at the edge. Embedded monitoring systems comprise sensors, DC/DC converters, and other signal-conditioning circuits, as well as microcontrollers (MCUs) or processors and communication interfaces. Edge computing provides [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/industrial-edge-analytics-detect-issues-faster-and-improve-maintenance/\">Industrial Edge Analytics: Detect Issues Faster and Improve Maintenance<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "M5Stack PaperDIY Kits pair an ESP32-S3 MCU with a 4.7-inch e-Paper display", "source": "CNX Software", "date": "2026-10-18", "url": "https://www.cnx-software.com/2026/10/18/m5stack-paperdiy-kits-pair-an-esp32-s3-mcu-with-a-4-7-inch-e-paper-display/", "summary": "<div><img alt=\"PaperDIY Complete Kit\" class=\"attachment-medium size-medium wp-post-image\" height=\"480\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/10/PaperDIY-Complete-Kit-720x480.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>M5Stack has released the PaperDIY series, an updated version of its 2020 M5Paper ESP32 development kit, featuring an ESP32-S3 MCU and a 4.7-inch e-paper display with 16 levels of gray. It comes in two versions: the PaperDIY Complete Kit, which ships factory-assembled in a 3D-printed enclosure, and the PaperDIY Assembly Kit, which is designed to be integrated into custom projects. Both boards also include a microSD card slot for extended storage, a built-in 140mAh battery, and a custom M5PM1 low-power management chip. M5Stack PaperDIY specifications: Core module – Espressif Systems ESP32-S3-WROOM-1-N16R8 SoC – ESP32-S3 CPU – Dual-core LX7 processor with up to 240MHz Memory – 512KB SRAM, 8MB Octal PSRAM Storage – 384KB ROM Wireless – WiFi 4 802.11b/g/n and Bluetooth 5.0 LE Storage – 16MB flash PCB antenna Storage – MicroSD card slot Display – 4.7-inch (960 × 540) ED047TC1 e-paper display with 16-level grayscale and an 8-bit parallel interface for direct display control, [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/10/18/m5stack-paperdiy-kits-pair-an-esp32-s3-mcu-with-a-4-7-inch-e-paper-display/\">M5Stack PaperDIY Kits pair an ESP32-S3 MCU with a 4.7-inch e-Paper display<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Seeed Studio XIAO IPS display series features ESP32-S3 or nRF52840 SoC with 0.96-inch to 1.47-inch LCD options", "source": "CNX Software", "date": "2026-10-17", "url": "https://www.cnx-software.com/2026/10/17/seeed-studio-xiao-ips-display-series-features-esp32-s3-or-nrf52840-soc-with-0-96-inch-to-1-47-inch-lcd-options/", "summary": "<div><img alt=\"XIAO IPS Display Series\" class=\"attachment-medium size-medium wp-post-image\" height=\"480\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/09/XIAO-IPS-Display-Series-720x480.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Seeed Studio has introduced the XIAO IPS touch display series, a family of six compact development boards built around the XIAO ESP32-S3 Plus or XIAO nRF52840 Plus MCU, with 0.96-inch, 1.14-inch, and 1.47-inch IPS color displays. All six boards include a 6-axis IMU, a PDM digital microphone, user buttons, and LiPo battery support. The larger 1.47-inch version adds capacitive touch and a microSD card slot, whereas the 1.14-inch model includes a Grove I2C connector for connecting external sensors. The ESP32-S3 versions support Wi-Fi and Bluetooth LE connectivity, while the nRF52840 models focus on lower-power Bluetooth LE applications. The boards are designed for portable dashboards, smart home controllers, wearable devices, sensor monitoring, and other small IoT projects. XIAO IPS Display Series specifications: Wireless board (one or the other) XIAO nRF52840 Plus Wireless MCU –  Nordic nRF52840 Arm Cortex-M4F microcontroller @ up to 64 MHz with 1 MB flash, 256 KB SRAM, Bluetooth 5.0, [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/10/17/seeed-studio-xiao-ips-display-series-features-esp32-s3-or-nrf52840-soc-with-0-96-inch-to-1-47-inch-lcd-options/\">Seeed Studio XIAO IPS display series features ESP32-S3 or nRF52840 SoC with 0.96-inch to 1.47-inch LCD options<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Xerxes Pi 2026 and Xerxes Nano carrier boards offer NVMe, PoE, and OCuLink for Raspberry Pi and Jetson modules (Crowdfunding)", "source": "CNX Software", "date": "2026-10-16", "url": "https://www.cnx-software.com/2026/10/16/xerxes-pi-2026-and-xerxes-nano-carrier-boards-offer-nvme-poe-and-oculink-for-raspberry-pi-and-jetson-modules/", "summary": "<div><img alt=\"Xerxes Pi 2026\" class=\"attachment-medium size-medium wp-post-image\" height=\"480\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/10/Xerxes-Pi-2026-720x480.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>After a successful campaign for Xerxes Pi back in 2025, Rapid Analysis has returned with a Xerxes Home Lab ecosystem that includes the Xerxes Pi 2026 and Xerxes Nano carrier board. The upgrade includes M.2 NVMe storage support on the bottom of the board, an I2S Qwiic connector for digital audio, and added debug and boot jumper pins for easier headless deployment. Designed for home labs, edge AI developers, and small businesses, the Xerxes Pi 2026 supports Raspberry Pi CM4/CM5 and other CM modules, Gigabit Ethernet, optional PoE+, and CSI/HDMI expansion. The larger Xerxes Nano supports NVIDIA Jetson Orin Nano and Turing RK1 modules, adding M.2 PCIe, OCuLink, and SPI/UART connectivity. Both boards support active cooling and compact 1U rack installations. Xerxes Pi 2026 Xerxes Pi 2026 specifications: Supported SoMs – Raspberry Pi CM4, CM5, and compatible alternatives via 2x 100-pin high-density mezzanine connectors Storage M.2 M-key PCIe Gen 2 [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/10/16/xerxes-pi-2026-and-xerxes-nano-carrier-boards-offer-nvme-poe-and-oculink-for-raspberry-pi-and-jetson-modules/\">Xerxes Pi 2026 and Xerxes Nano carrier boards offer NVMe, PoE, and OCuLink for Raspberry Pi and Jetson modules (Crowdfunding)<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Edge AI for Real-Time Systems, the Edge Computing Energy Problem, PCIe 6.0 High-Radix Switches: Embedded Week Insights", "source": "Embedded.com", "date": "2026-10-16", "url": "https://www.embedded.com/edge-ai-for-real-time-systems-the-edge-computing-energy-problem-pcie-6-0-high-radix-switches-embedded-week-insights/", "summary": "<p>Here's a roundup of this week's must-read articles. We cover the latest developments on designing edge AI for real-time systems, solving the edge computing energy problem, PCIe 6.0 high-radix switches for AI data centers, and more. Also, check News Archives - Embedded and Technical Articles Archives - Embedded for the complete list of news and articles from our website. [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/edge-ai-for-real-time-systems-the-edge-computing-energy-problem-pcie-6-0-high-radix-switches-embedded-week-insights/\">Edge AI for Real-Time Systems, the Edge Computing Energy Problem, PCIe 6.0 High-Radix Switches: Embedded Week Insights<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\
