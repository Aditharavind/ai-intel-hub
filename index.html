ded users of domestic care robots, yet whose movement patterns and cognitive states are not directly embedded in the standards process.<\/p><p>In other words, this revision acknowledges the hardest problems but pushes unresolved issues into advisory language, nonbinding guidance, or future revision scopes. That can be useful, but it also delays the real question: What counts as safe relational behavior in the home?<\/p><p><strong>What are the stakes?<\/strong><br /><strong>Lee: <\/strong>The risk is not only injury, though that is the obvious concern. The deeper risk is that safety assumptions get baked into products and standards before the market, regulators, and users have a chance to question them. Once deployment patterns harden, it becomes much harder to revise the baseline.<\/p><p><strong>What should the engineers on the standards bodies do about it?<\/strong><br /><strong>Lee: <\/strong>The engineers on the standards body should ask not just, “What are the robot’s outputs, and do they stay within safe thresholds?” but “What states does this robot engage with, and does that engagement remain safe across the full range of those states?” That shift sounds subtle, but it changes the design brief. It moves safety from machine-centric measurement toward system-level relational assurance.<\/p><p>Domestic humanoid safety cannot be solved by machine engineering alone. It requires a framework that treats the human not as background noise, but as part of the system, part of the definition of the safety envelope. <\/p>"}, {"title": "Into the Omniverse: Manufacturing’s Simulation-First Era Has Arrived", "source": "NVIDIA Robotics", "date": "2026-04-28", "url": "https://blogs.nvidia.com/blog/manufacturing-simulation-first/", "summary": "Manufacturing’s traditional design-build-test cycle rested on a single assumption: Real-world testing was the only reliable test environment."}, {"title": "NVIDIA and Partners Showcase the Future of AI-Driven Manufacturing at Hannover Mess ps://hackaday.com/wp-content/uploads/2026/06/crt_void_electronics_youtube.jpg?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>For most of us the abbreviation &#8220;CRT&#8221; brings to mind a monitor or TV. But at its core it&#8217;s about the special vacuum tube that makes the images appear. Regardless <a class=\"read-more\" href=\"https://hackaday.com/2026/06/21/how-to-bias-a-crt-after-installation/\">&#8230;read more<\/a>"}, {"title": "Bernoulli Disk Goes “Wii!” When Plugged Into WiiU", "source": "Hackaday", "date": "2026-06-21", "url": "https://hackaday.com/2026/06/20/bernoulli-disk-goes-wii-when-plugged-into-wiiu/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"450\" src=\"https://hackaday.com/wp-content/uploads/2026/06/BernoulliBoxWiiU.jpg?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>The Bernoulli disk was a wild piece of 1980s hardware. Take a big floppy. Spin the platter at 1500 RPM just a micron or so from a read head. The <a class=\"read-more\" href=\"https://hackaday.com/2026/06/20/bernoulli-disk-goes-wii-when-plugged-into-wiiu/\">&#8230;read more<\/a>"}, {"title": "Autopsy of a Freshly Cooked 10Gbit SFP+ Network Adapter", "source": "Hackaday", "date": "2026-06-21", "url": "https://hackaday.com/2026/06/20/autopsy-of-a-freshly-cooked-10gbit-sfp-network-adapter/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"495\" src=\"https://hackaday.com/wp-content/uploads/2026/06/10gbit_sfp_adapter_pcb_back_this_does_not_compute_youtube.jpg?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>With the advent of affordable 2.5 Gbit, 5 Gbit, and 10 Gbit consumer networking gear, more and more people are taking advantage of these higher networking speeds, with [This Does <a class=\"read-more\" href=\"https://hackaday.com/2026/06/20/autopsy-of-a-freshly-cooked-10gbit-sfp-network-adapter/\">&#8230;read more<\/a>"}, {"title": "Adafruit New Products this Week", "source": "Adafruit", "date": "2026-06-21", "url": "https://blog.adafruit.com/2026/06/20/adafruit-new-products-this-week-2/", "summary": "We&#8217;ve got the New nEw NEW for you right here This week we debuted 2 New Products. Keep up with all the new at Adafruit.com/NEW. Want to get new products info beamed straight into your inbox? New nEw NEWs From Adafruit is an email newsletter sent once a week to subscribers only. It features new [&#8230;]"}, {"title": "Defeat Blood-Sucking Mosquitoes by Becoming the Bug Zapper", "source": "Hackaday", "date": "2026-06-20", "url": "https://hackaday.com/2026/06/20/defeat-blood-sucking-mosquitoes-by-becoming-the-bug-zapper/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"464\" src=\"https://hackaday.com/wp-content/uploads/2026/06/bug_zapper_suit_stun_gun_testing_dani_cruster_diwhy_youtube.jpg?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>Few things are more satisfying during a Summer night than hearing the crackle and pop of another mosquito hurling itself against a bug zapper and knowing that it won&#8217;t be <a class=\"read-more\" href=\"https://hackaday.com/2026/06/20/defeat-blood-sucking-mosquitoes-by-becoming-the-bug-zapper/\">&#8230;read more<\/a>"}, {"title": "Seeing the World in Radio Waves with the QuadRF", "source": "Hackaday", "date": "2026-06-20", "url": "https://hackaday.com/2026/06/20/seeing-the-world-in-radio-waves-with-the-quadrf/", "summary": "<div><img alt=\"A drone is shown flying above some trees and a building. A pink cloud of dots appears above the drone, and a purple cloud below the drone. Grey crosshairs are to the right of the drone.\" class=\"attachment-large size-large wp-post-image\" height=\"450\" src=\"https://hackaday.com/wp-content/uploads/2026/06/quadrf_drone_demo.png?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>Although the basic principle of radio direction finding is easy to understand (measure the phase difference between different antennas, then calculate the angle of arrival from this difference), the radio <a class=\"read-more\" href=\"https://hackaday.com/2026/06/20/seeing-the-world-in-radio-waves-with-the-quadrf/\">&#8230;read more<\/a>"}, {"title": "Tricking a Bike Counter", "source": "Hackaday", "date": "2026-06-20", "url": "https://hackaday.com/2026/06/20/tricking-a-bike-counter/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"450\" src=\"https://hackaday.com/wp-content/uploads/2026/06/looparrow.jpg?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>Some municipalities implement bike counters on cycling routes in order to monitor traffic. [nullpxl] recently investigated how these counters work, and explored methods that can be used to trick the <a class=\"read-more\" href=\"https://hackaday.com/2026/06/20/tricking-a-bike-counter/\">&#8230;read more<\/a>"}, {"title": "Home Automation: Simple vs Easy", "source": "Hackaday", "date": "2026-06-20", "url": "https://hackaday.com/2026/06/20/home-automation-simple-vs-easy/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"400\" src=\"https://hackaday.com/wp-content/uploads/2021/06/2021-hackaday-prize-challenge-home-featured.png?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>We’ve been talking a bunch of home automation on the Podcast lately, and this week, in the Mailbag segment, a reader asked us about our setups. Neither Kristina nor I <a class=\"read-more\" href=\"https://hackaday.com/2026/06/20/home-automation-simple-vs-easy/\">&#8230;read more<\/a>"}, {"title": "Pine64 Pinevoice – A $50 RISC-V Smart Speaker for Home Assistant based on Bouffalo Lab BL606P MCU", "source": "CNX Software", "date": "2026-06-20", "url": "https://www.cnx-software.com/2026/06/20/pine64-pinevoice-a-50-risc-v-smart-speaker-for-home-assistant-based-on-bouffalo-lab-bl606p-mcu/", "summary": "<div><img alt=\"PineVoice RISC V Smart Speaker\" class=\"attachment-medium size-medium wp-post-image\" height=\"542\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/06/PineVoice-RISC-V-Smart-Speaker-720x542.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>After over two years in the making, Pine64 has now launched the PineVoice (previously PineVox) smart speaker based on the Bouffalo Lab BL606P RISC-V wireless microcontroller with WiFi, Bluetooth, and Zigbee radio interfaces. The device also features two microphones, a speaker, a USB 2.0 OTG port, volume buttons, a mute button with LED, a start/stop button, and four RGB LEDs. The PineVoice smart speaker is mainly designed to work with Home Assistant. PineVoice specifications: SoC &#8211; Bouffalo Lab BL606P CPU D0 core &#8211; T-Head C906 64-bit RISC-V (RV64IMAFCV) CPU @ 480 MHz M0 core &#8211; T-Head E907 32-bit RISC-V (RV32IMAFCP) CPU @ 320 MHz Memory &#8211; 544KB RAM (788KB SRAM listed on the Pine64 store), 16MB embedded PSRAM Storage &#8211; 128KB ROM, 4KB eFuse Wireless 2.4 GHz 802.11 b/g/n 1T1R WiFi 4 Bluetooth 5.x Dual-mode (Classis + BLE) 802.15.4 radio (Zigbee) Storage &#8211;  128Mbit (16MB) SPI NOR flash Audio 2x [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/06/20/pine64-pinevoice-a-50-risc-v-smart-speaker-for-home-assistant-based-on-bouffalo-lab-bl606p-mcu/\">Pine64 Pinevoice &#8211; A $50 RISC-V Smart Speaker for Home Assistant based on Bouffalo Lab BL606P MCU<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Rotary Mouse puts a rotary wheel into a standard desktop mouse (Crowdfunding)", "source": "CNX Software", "date": "2026-06-19", "url": "https://www.cnx-software.com/2026/06/19/rotary-mouse-puts-a-rotary-wheel-into-a-standard-desktop-mouse/", "summary": "<div><img alt=\"Rotary mouse standard vertical\" class=\"attachment-medium size-medium wp-post-image\" height=\"402\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/06/Rotary-mouse-standard-vertical-720x402.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>While mouse sensors have improved a lot over time, the scroll wheel has mostly stayed the same. Normal scrolling requires you to keep flicking your finger up and down, which can get uncomfortable during long sessions like coding or video editing. To change this, Airra Labs has introduced the Rotary Mouse, which uses a rotary wheel in place of the scroll wheel to let you scroll with a simple circular motion. It comes in two variants: a standard and a vertical version. The standard variant features a larger circular, jog-wheel-like dial on top that lets you scroll by rotating your finger. The vertical variant also comes with the same wheel but is designed so you can scroll like a regular mouse by flicking your finger up and down, while still using the same circular motion. This provides a wider range of movement and can make scrolling faster and easier than with [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/06/19/rotary-mouse-puts-a-rotary-wheel-into-a-standard-desktop-mouse/\">Rotary Mouse puts a rotary wheel into a standard desktop mouse (Crowdfunding)<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Matter 1.6 specification adds NFC-based commissioning, thermostat suggestions, various core enhancements", "source": "CNX Software", "date": "2026-06-19", "url": "https://www.cnx-software.com/2026/06/19/matter-1-6-specification-adds-nfc-based-commissioning-thermostat-suggestions-various-core-enhancements/", "summary": "<div><img alt=\"Matter 1.6\" class=\"attachment-medium size-medium wp-post-image\" height=\"418\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/06/Matter-1.6-720x418.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Connectivity Standards Alliance (CSA) has recently released the Matter 1.6 specification with new features such as NFC-based commissioning, Thermostat Suggestions for smarter climate control, and a range of core enhancements designed to improve device communication, safety devices visibility, and ecosystem security. The last time we wrote about a Matter release was for Matter 1.4.2, which added Wi-Fi-only provisioning and improved security, and we somehow missed the Matter 1.5 release that introduced cameras, closures (window shades, drapes, awnings, gates, garage doors&#8230;), and enhanced energy management capabilities. Let&#8217;s have a closer look at the new Matter 1.6 release. Matter 1.6 highlights: NFC-based commissioning &#8211; Commissioning can be challenging for devices like ceiling fixtures and in-wall switches, since they may need to be configured before they are installed. Matter 1.6 addresses this issue by allowing a Matter device to be commissioned through bi-directional NFC communication before the device is fully powered on. That&#8217;s [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/06/19/matter-1-6-specification-adds-nfc-based-commissioning-thermostat-suggestions-various-core-enhancements/\">Matter 1.6 specification adds NFC-based commissioning, thermostat suggestions, various core enhancements<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Qualcomm promises a major reset with upstream-first, Qualcomm Linux 2.0 for Dragonwing IoT platforms", "source": "CNX Software", "date": "2026-06-19", "url": "https://www.cnx-software.com/2026/06/19/qualcomm-promises-a-major-reset-with-upstream-first-qualcomm-linux-2-0-for-dragonwing-iot-platforms/", "summary": "<div><img alt=\"Qualcomm Linux 2.0 upstream kernel Dragonwing platforms\" class=\"attachment-medium size-medium wp-post-image\" height=\"409\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/06/Qualcomm-Linux-2.0-upstream-kernel-Dragonwing-platforms-720x409.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Linux on Qualcomm SoCs has been a roller coaster, with hope often followed by disappointment, at least for the Snapdragon family. The company aims to change that with Qualcomm Linux 2.0 for Dragonwing IoT platforms, as announced on LinkedIn: With Qualcomm Linux 2.0, we’re shifting to an upstream-first, open development model that is unified and scalable across all Qualcomm Dragonwing IoT platforms. This means an upstream‑first model with a BSP that tracks mainline to minimize friction and enables you to make more predictable builds. Tune in to see our first-ever live demo, along with a lifecycle and release strategy, core architecture and Yocto changes, and practical migration paths from previous versions The video is embedded below, but will only be live on June 30. In the meantime, the description provides a few more details: If you’ve dealt with fragmented BSPs, platform-specific kernel forks, or painful bring‑up across Qualcomm SoCs, this [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/06/19/qualcomm-promises-a-major-reset-with-upstream-first-qualcomm-linux-2-0-for-dragonwing-iot-platforms/\">Qualcomm promises a major reset with upstream-first, Qualcomm Linux 2.0 for Dragonwing IoT platforms<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Smart Robots, ChipStack AI Super Agent, Building Simulink Models with Agentic AI: Embedded Week Insights", "source": "Embedded.com", "date": "2026-06-19", "url": "https://www.embedded.com/smart-robots-chipstack-ai-super-agent-building-simulink-models-with-agentic-ai-embedded-week-insights/", "summary": "<p>Here's a roundup of this week's must-read articles. We'll look into the latest developments on smart robots, simplifying audio complexity, building Simulink models with agen y ended and freed Black people [&#8230;]"}, {"title": "WLED 16: What’s New #LED Matrices #AdafruitLearningSystem @Adafruit", "source": "Adafruit", "date": "2026-06-19", "url": "https://blog.adafruit.com/2026/06/19/wled-16-whats-new-led-matrices-adafruitlearningsystem-adafruit/", "summary": "WLED 16 is the biggest LED control software upgrade in years, bringing powerful new creative tools to your LEDs. If you’ve been happily using WLED 0.14 or 0.15, this update adds major improvements for LED strips, matrices, wearables, sculptures, and interactive art. This guide is an overview of the new features in WLED 16 — [&#8230;]"}, {"title": "John Park’s CircuitPython Parsec: LCD Character Marquee Scroll", "source": "Adafruit", "date": "2026-06-19", "url": "https://blog.adafruit.com/2026/06/19/john-parks-circuitpython-parsec-lcd-character-marquee-scroll/", "summary": "#circuitpythonparsec Scroll text on the LCD Character display with the move_left and move_right commands. code example To learn about CircuitPython: https://circuitpython.org &#160;"}, {"title": "Anacostia Community Museum Expanded Juneteenth Celebration #Juneteenth2026", "source": "Adafruit", "date": "2026-06-19", "url": "https://blog.adafruit.com/2026/06/19/anacostia-community-museum-expanded-juneteenth-celebration-juneteenth2026/", "summary": "The Smithsonian&#8217;s Anacostia Community Museum will host its largest-ever Juneteenth Freedom Celebration today from 10 a.m. to 10 p.m. Via Smithsonian The Smithsonian’s Anacostia Community Museum will host its largest-ever Juneteenth Freedom Celebration Friday, June 19, anchored by a high-energy nighttime roller rink experience alongside live music and family activities. The free, full-day event, “Power [&#8230;]"}, {"title": "Drones in Detroit #makerbusiness", "source": "Adafruit", "date": "2026-06-19", "url": "https://blog.adafruit.com/2026/06/19/drones-in-detroit-makerbusiness/", "summary": "A recent article in The New York Times reports on Michigan’s effort to pivot Detroit’s manufacturing legacy into the would-be fast growing U.S. drone industry. The piece follows Birdstop, a drone startup that moved into the former United Auto Workers training facility and examines how incentives, auto suppliers, and local investors are trying to make [&#8230;]"}, {"title": "The Python on Microcontrollers Newsletter: subscribe for free", "source": "Adafruit", "date": "2026-06-19", "url": "https://blog.adafruit.com/2026/06/19/the-python-on-microcontrollers-newsletter-subscribe-for-free-6-19-3/", "summary": "The Python for Microcontrollers Newsletter is the place for the latest news involving Python on hardware (microcontrollers AND single board computers like Raspberry Pi). This ad-free, spam-free weekly email is filled with CircuitPython, MicroPython, and Python information that you may have missed, all in one place! You get a summary of all the software, events, projects, and the latest hardware worldwide once a week, no [&#8230;]"}, {"title": "Broadway Celebrates Juneteenth #Juneteenth2026", "source": "Adafruit", "date": "2026-06-19", "url": "https://blog.adafruit.com/2026/06/19/broadway-celebrates-juneteenth-juneteenth2026/", "summary": "Checkout the sixth annual Broadway Celebrates Juneteenth event, this is a free outdoor concert happening Today, June 19, from 4:00 PM to 5:30 PM in Times Square! The Broadway Celebrates Juneteenth concert will feature soon to be announced cast members from: Aladdin; &#38; Juliet; Buena Vista Social Club; CATS: The Jellicle Ball; The Great Gatsby; [&#8230;]"}, {"title": "#Juneteenth2026 Events at NYPL", "source": "Adafruit", "date": "2026-06-19", "url": "https://blog.adafruit.com/2026/06/19/juneteenth2026-events-at-nypl/", "summary": "&#160; NYPL is always the first place we check when looking for high quality, incredibly thoughtful events. Explore upcoming NYPL events celebrating Juneteenth here. image via NYPL &#160;"}, {"title": "Juneteenth with NYC Parks #Juneteenth2026", "source": "Adafruit", "date": "2026-06-19", "url": "https://blog.adafruit.com/2026/06/19/juneteenth-with-nyc-parks-juneteenth2026/", "summary": "&#160; Juneteenth is recognized as a federal holiday commemorating the day in 1865 when federal troops arrived in Galveston, Texas to enforce the Emancipation Proclamation. The NYC Parks Department has activities event and more planned throughout the city. Year round you can visit Juneteenth Grove inside Brooklyn&#8217;s Cadman Plaza Park. &#160; Juneteenth Grove image via [&#8230;]"}, {"title": "Loki style cat helmet #3DPrinting #3DThursday", "source": "Adafruit", "date": "2026-06-19", "url": "https://blog.adafruit.com/2026/06/18/loki-style-cat-helmet-3dprinting-3dthursday/", "summary": "GenX3d77 shares: Here is my next addition to the cat helmet series. This version of the Loki helmet is a pretty natural fit for a cat download the files on: https://makerworld.com/en/models/2873592-loki-style-cat-helmet Every Thursday is #3dthursday here at Adafruit! The DIY 3D printing community has passion and dedication for making solid objects from digital models. Recently, [&#8230;]"}, {"title": "Gliding Manta Ray #3DPrinting #3DThursday", "source": "Adafruit", "date": "2026-06-19", "url": "https://blog.adafruit.com/2026/06/18/gliding-manta-ray-3dprinting-3dthursday/", "summary": "Every week we&#8217;ll 3D print designs from the community and showcase slicer settings, use cases and of course, Time-lapses! This Week: Gliding Manta Ray By Armengol13 makerworld.com/en/models/2909692-gliding-manta-ray-just-drop-go Bambu X1C PolyMaker PLA 6hr 38mins X:154 Y:155 Z:21mm .2mm layer / .4mm Nozzle 10% Infill / 1mm Retraction 200C / 60C 68g 230mm/s Every Thursday is #3dthursday [&#8230;]"}, {"title": "Innatera and CYRAN AI Expand Collaboration to Advance Neuromorphic Edge AI for Wearables and Intelligent Devices", "source": "EE Journal", "date": "2026-06-19", "url": "https://www.eejournal.com/industry_news/innatera-and-cyran-ai-expand-collaboration-to-advance-neuromorphic-edge-ai-for-wearables-and-intelligent-devices/", "summary": "Nice, France – June 15, 2026 – Innatera, a leader in brain-like computing for ultra-low-power edge AI, and CYRAN AI, a specialist in intelligent sensing and embedded AI solutions, today announced an expanded collaboration at Bharat Innovates 2026 aimed at accelerating the development of next-generation intelligent edge devices. Building on a successful established partnership, the &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/innatera-and-cyran-ai-expand-collaboration-to-advance-neuromorphic-edge-ai-for-wearables-and-intelligent-devices/\">Read More &#8594;<span class=\"screen-reader-text\"> \"Innatera and CYRAN AI Expand Collaboration to Advance Neuromorphic Edge AI for Wearables and Intelligent Devices\"<\/span><\/a>"}, {"title": "How We Can Leverage Digital Twins and AI for Next Generation Model-Based Systems Engineering", "source": "EE Journal", "date": "2026-06-19", "url": "https://www.eejournal.com/fish_fry/leveraging-digital-twins-and-ai-for-modern-model-based-systems-engineering/", "summary": "<img alt=\"\" class=\"webfeedsFeaturedVisual wp-post-image\" height=\"300\" src=\"https://www.eejournal.com/wp-content/uploads/2026/06/AD-061926.jpg\" style=\"display: block; margin-bottom: 5px; clear: both;\" width=\"300\" />In this week&#8217;s podcast, I explore the evolution of model-based systems engineering with Becky Petteys from MathWorks. We chat about how high-fidelity digital twins help teams catch issues early, the growing importance of data science in modern design, and the practical ways AI is transforming MBSE workflows today. &#160; &#160; Links for June 19, 2026 &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/fish_fry/leveraging-digital-twins-and-ai-for-modern-model-based-systems-engineering/\">Read More &#8594;<span class=\"screen-reader-text\"> \"How We Can Leverage Digital Twins and AI for Next Generation Model-Based Systems Engineering\"<\/span><\/a>"}, {"title": "UP WCL – A credit card-sized Wildcat Lake SBC with up to 24GB LPDDR5, 256GB UFS", "source": "CNX Software", "date": "2026-06-18", "url": "https://www.cnx-software.com/2026/06/18/up-wcl-a-credit-card-sized-wildcat-lake-sbc-with-up-to-24gb-lpddr5-256gb-ufs/", "summary": "<div><img alt=\"UP WCL Wildcat Lake SBC\" class=\"attachment-medium size-medium wp-post-image\" height=\"463\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/06/UP-WCL-Wildcat-Lake-SBC-720x463.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>AAEON&#8217;s UP WCL is an upcoming credit card-sized single board computer (SBC) powered by an Intel Wildcat Lake processor up to the Core 7 350 hexa-core CPU paired with up to 24GB LPDDR5 and 256GB UFS storage. The board also features an HDMI 2.1 video output, a 2.5GbE RJ45 jack, an M.2 Key-E socket for optional WiFi and Bluetooth connectivity, three USB 3.2 ports, and a few wafers for I/O expansion. AAEON UP WCL specifications: Wildcat Lake SoC (one or the other) Intel Core 3 304 5-core CPU – 1x P-cores @ 1.5/4.3 GHz (Turbo) + 4x LPE-cores @ 1.4/3.3 GHz (Turbo) GPU – 1-core Intel Xe3 Graphics @ 2.3 GHz (9 TOPS) NPU – 15 TOPS Intel Core 5 320 6-core CPU – 2x P-cores @ 1.5/4.6 GHz (Turbo) + 4x LPE-cores @ 1.4/3.4 GHz (Turbo) GPU – 2-core Intel Xe3 Graphics @ 2.5 GHz (20 TOPS) NPU – [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/06/18/up-wcl-a-credit-card-sized-wildcat-lake-sbc-with-up-to-24gb-lpddr5-256gb-ufs/\">UP WCL &#8211; A credit card-sized Wildcat Lake SBC with up to 24GB LPDDR5, 256GB UFS<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Broadcom unveils fully-integrated quad-core Wi-Fi 8 access point SoCs, 5G FWA router reference platform", "source": "CNX Software", "date": "2026-06-18", "url": "https://www.cnx-software.com/2026/06/18/broadcom-fully-integrated-quad-core-wi-fi-8-access-point-socs-5g-fwa-router-reference-platform/", "summary": "<div><img alt=\"Broadcom Wave 5 BCM6772 BCM6774 BCM6776 WiFi 8 SoC family\" class=\"attachment-medium size-medium wp-post-image\" height=\"367\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/06/Broadcom-Wave-5-BCM6772-BCM6774-BCM6776-WiFi-8-SoC-family-720x367.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Broadcom has launched three new Wi-Fi 8 access point SoCs: the BCM6772 for mass-market Ethernet routers, extenders, and repeaters, the BCM6774 for high-volume Ethernet routers and extenders, and the BCM6776 for premium Ethernet tri-band routers and extenders. The latter is also part of a 5G FWA router platform based on Samsung B1320 5G Modem. Broadcom&#8217;s first Wi-Fi 8 chips were introduced in May 2025 for clients and access points, and the company followed up with BCM6714 and BCM6719 dual-band radios earlier this year, and the BCM67142, BCM67192, and BCM68565 chips for low-cost Wi-Fi 8 10 Gbps fiber access points last month. So far, all the Broadcom Wi-Fi 8 chips enable multi-chip solutions with an application processor connected to one or more Wi-Fi 8 chipsets over a PCIe connection. The new BCM677x chips are fully-integrated SoCs with (Armv8&#62;) application cores and 802.11bn connectivity in a single chip, except for 6 GHz [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/06/18/broadcom-fully-integrated-quad-core-wi-fi-8-access-point-socs-5g-fwa-router-reference-platform/\">Broadcom unveils fully-integrated quad-core Wi-Fi 8 access point SoCs, 5G FWA router reference platform<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Rockchip RK3539 quad-core Cortex-A55 SoC shows up in low-cost Android 14 4K TV stick with AV1 codec support", "source": "CNX Software", "date": "2026-06-18", "url": "https://www.cnx-software.com/2026/06/18/rockchip-rk3539-quad-core-cortex-a55-soc-low-cost-android-14-4k-tv-stick/", "summary": "<div><img alt=\"Rockchip RK3539 TV Stick with Voice Remote Remote Control\" class=\"attachment-medium size-medium wp-post-image\" height=\"714\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/06/Rockchip-RK3539-TV-Stick-with-Voice-Remote-Remote-Control-720x714.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>HS89 T15 4K Android TV stick is powered by the new Rockchip RK3539 quad-core Cortex-A55 SoC with AV1 and H.265 video codecs and HDR10 support, and is equipped with up to 4GB of RAM and a 32GB eMMC flash. The device features a male HDMI 2.1 port, WiFi 6 and Bluetooth 5.4 connectivity, a USB Type-A host port, and a USB-C port for power only, either directly from the TV or through a 5V/2A power adapter. The device also ships with a Bluetooth voice remote control. Let&#8217;s have a look at both the streaming device and the RK3539 chip itself since the datasheet is available. HS89 T15 TV stick Let&#8217;s start with the HS89 T15 TV stick&#8217;s specifications: SoC &#8211; Rockchip RK3539 CPU &#8211; Quad-core Cortex-A55 @ 1920 MHz GPU &#8211; Mali-310 VPU &#8211; 4Kp60 AV1, H.265, H.264 video decoding System Memory/Storage options 2GB RAM, 16GB eMMC flash 4GB RAM, [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/06/18/rockchip-rk3539-quad-core-cortex-a55-soc-low-cost-android-14-4k-tv-stick/\">Rockchip RK3539 quad-core Cortex-A55 SoC shows up in low-cost Android 14 4K TV stick with AV1 codec support<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "What Level 5 Autonomy Could Mean for Chip Design Engineers", "source": "Embedded.com", "date": "2026-06-18", "url": "https://www.embedded.com/what-level-5-autonomy-could-mean-for-chip-design-engineers/", "summary": "<p>Cadence Design Systems Inc. introduced its Level 5 ChipStack AI Super Agent at Computex 2026. The company describes it as the industry's first fully autonomous virtual agentic AI design engineer for chip design. The release builds on the recent announcement of Level 4 autonomy in electronic design automation (EDA). Cadence said the rapid transition to [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/what-level-5-autonomy-could-mean-for-chip-design-engineers/\">What Level 5 Autonomy Could Mean for Chip Design Engineers<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "Synopsys Launches Multiphysics Fusion Solutions", "source": "Embedded.com", "date": "2026-06-18", "url": "https://www.embedded.com/synopsys-launches-multiphysics-fusion-solutions/", "summary": "<p>Synopsys Inc. has announced the availability of its first Multiphysics Fusion solutions, a new family of electronic design automation (EDA) tools that integrates multiphysics analysis directly into key semiconductor design workflows. The portfolio combines Synopsys' AI-enabled EDA technologies with signoff analysis technologies acquired through Ansys, addressing the growing design challenges associated with advanced process nodes, [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/synopsys-launches-multiphysics-fusion-solutions/\">Synopsys Launches Multiphysics Fusion Solutions<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "Honeywell launches compact navigation system for uncrewed aerial systems", "source": "EE Journal", "date": "2026-06-18", "url": "https://www.eejournal.com/industry_news/honeywell-launches-compact-navigation-system-for-uncrewed-aerial-systems/", "summary": "Honeywell (NASDAQ: HON) today announced the launch of Kestrel, a compact navigation solution designed to help uncrewed aerial systems (UAS) operate reliably in contested environments where GPS signals may be degraded, jammed or spoofed. Built to support the growing demand for smaller, more affordable and highly efficient platforms, Kestrel combines Honeywell Aerospace’s HG3900 MEMS Inertial &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/honeywell-launches-compact-navigation-system-for-uncrewed-aerial-systems/\">Read More &#8594;<span class=\"screen-reader-text\"> \"Honeywell launches compact navigation system for uncrewed aerial systems\"<\/span><\/a>"}, {"title": "Efinix® Launches Titanium Edge™ FPGA Family, Solving the Demanding Requirements of Edge AI", "source": "EE Journal", "date": "2026-06-18", "url": "https://www.eejournal.com/industry_news/efinix-launches-titanium-edge-fpga-family-solving-the-demanding-requirements-of-edge-ai/", "summary": "Efinix® Inc., the FPGA pioneer accelerating edge AI innovation, today announced the Titanium Edge™ family of FPGAs, purpose-built for the most demanding edge AI applications. Built on the company’s proven Titanium architecture, Efinix’s latest suite of devices is optimized for next-generation edge AI deployments across several high-growth markets. “In edge AI applications, every milliwatt, every square millimeter, &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/efinix-launches-titanium-edge-fpga-family-solving-the-demanding-requirements-of-edge-ai/\">Read More &#8594;<span class=\"screen-reader-text\"> \"Efinix® Launches Titanium Edge™ FPGA Family, Solving the Demanding Requirements of Edge AI\"<\/span><\/a>"}, {"title": "STMicroelectronics’ multiplier-less PFC controller enhances cost-sensitive, energy-efficient applications", "source": "EE Journal", "date": "2026-06-18", "url": "https://www.eejournal.com/industry_news/stmicroelectronics-multiplier-less-pfc-controller-enhances-cost-sensitive-energy-efficient-applications/", "summary": "STMicroelectronics’ L6462A transition-mode (TM) power-factor correction (PFC) controller cuts bill-of-materials (BOM) costs while enhancing efficiency, enabling consumer products and power supplies up to 250W to meet stringent eco-design norms. The L6462A uses a current generator and shaper to produce a sinusoidal reference, instead of a conventional voltage sensor and analog multiplier, permitting boost-PFC converters without external voltage-divider &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/stmicroelectronics-multiplier-less-pfc-controller-enhances-cost-sensitive-energy-efficient-applications/\">Read More &#8594;<span class=\"screen-reader-text\"> \"STMicroelectronics’ multiplier-less PFC controller enhances cost-sensitive, energy-efficient applications\"<\/span><\/a>"}, {"title": "Imec achieves breakthroughs in ferroelectric memory research for next-generation memory solutions to meet AI-era data needs", "source": "EE Journal", "date": "2026-06-18", "url": "https://www.eejournal.com/industry_news/imec-achieves-breakthroughs-in-ferroelectric-memory-research-for-next-generation-memory-solutions-to-meet-ai-era-data-needs/", "summary": "This week, at the 2026 IEEE / JSAP symposium on VLSI Technology &#38; Circuits, imec, a world-leading research and innovation hub in advanced semiconductor technologies, presents two advances in ferroelectric memory research, targeting both ferroelectric capacitors and ferroelectric field-effect transistors as emerging candidates to enable low-voltage operation and high-density integration. Ferroelectric memory is drawing increasing &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/imec-achieves-breakthroughs-in-ferroelectric-memory-research-for-next-generation-memory-solutions-to-meet-ai-era-data-needs/\">Read More &#8594;<span class=\"screen-reader-text\"> \"Imec achieves breakthroughs in ferroelectric memory research for next-generation memory solutions to meet AI-era data needs\"<\/span><\/a>"}, {"title": "Addressing the Disconnect Between AI Speed and Wet Lab Reality", "source": "EE Journal", "date": "2026-06-18", "url": "https://www.eejournal.com/article/addressing-the-disconnect-between-ai-speed-and-wet-lab-reality/", "summary": "<img alt=\"\" class=\"webfeedsFeaturedVisual wp-post-image\" height=\"300\" src=\"https://www.eejournal.com/wp-content/uploads/2026/06/max-0493-image-for-home-page-labos-300x300.jpg\" style=\"display: block; margin-bottom: 5px; clear: both;\" width=\"300\" />In some cases, AI can speed things up tremendously; in other cases, not so much. Take protein folding, for example. A highly simplistic view of the way things work is that human DNA contains roughly 20,000 protein-encoding genes, and the proteins encoded by these genes serve as the molecular machines that drive the chemistry of &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/article/addressing-the-disconnect-between-ai-speed-and-wet-lab-reality/\">Read More &#8594;<span class=\"screen-reader-text\"> \"Addressing the Disconnect Between AI Speed and Wet Lab Reality\"<\/span><\/a>"}, {"title": "Zhihe A210 octa-core RISC-V SoC with 12 TOPS NPU powers SoM-based development board", "source": "CNX Software", "date": "2026-06-17", "url": "https://www.cnx-software.com/2026/06/17/zhihe-a210-octa-core-risc-v-soc-with-12-tops-npu-powers-som-based-development-board/", "summary": "<div><img alt=\"Zhihe A210 block diagram\" class=\"attachment-medium size-medium wp-post-image\" height=\"549\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/06/Zhihe-A210-block-diagram-720x549.png\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Last year, we noted three upcoming high-performance RISC-V SoCs to watch out for: Zhihe A210, SpacemiT K3, and UltraRISC UR-DP1000. The K3 has already been launched, and I&#8217;ll work on the K3-Pico-ITX SBC/mini PC review this coming weekend, while the UR-DP1000 is (still?) expected on the Milk-V Titan motherboard. However, we did not have that many details about the Zhihe A210 so far. This has now changed since documentation has surfaced for the Zhihe A210 and a development kit (A210 SODIMM V2) based on a carrier board and a system-on-module itself powered by the octa-core RISC-V processor. Let&#8217;s have a look at both. Zhihe A210 octa-core RISC-V SoC Zhihe A210 specifications: CPU  &#8211; Octa-core RISC-V RV64GCV processor 4x 64-bit RISC-V C920 cores @ up to 2.3 GHz with 64 KB I Cache and 64 KB D Cache for each core, 1 MB L2 cache; note: 1.9 GHz is also shown [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/06/17/zhihe-a210-octa-core-risc-v-soc-with-12-tops-npu-powers-som-based-development-board/\">Zhihe A210 octa-core RISC-V SoC with 12 TOPS NPU powers SoM-based development board<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Amlogic A311Y3 octa-core Edge AI SoC features Cortex-A78/A55 cores, 8 TOPS NPU, LPDDR5 support", "source": "CNX Software", "date": "2026-06-17", "url": "https://www.cnx-software.com/2026/06/17/amlogic-a311y3-octa-core-edge-ai-soc-features-cortex-a78-a55-cores-8-tops-npu-lpddr5-support/", "summary": "<div><img alt=\"Amlogic A311Y3 Octa Core Edge AI SoC\" class=\"attachment-medium size-medium wp-post-image\" height=\"480\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/06/Amlogic-A311Y3-Octa-Core-Edge-AI-SoC-720x480.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Amlogic has introduced the A311Y3 Edge AI SoC, which seems to be an upgrade over earlier designs such as the A311D and A311D2 used in boards like the Khadas VIM3 and Khadas VIM4. Although not listed on the official Amlogic website, documentation from vendors such as Shenzhen Tomato Technology indicates that the A311Y3 SoC is built around a 6nm process node and features a newer CPU architecture based on Arm Cortex-A78/A55 cores. The SoC integrates an NPU with up to 8 TOPS of compute performance and supports LPDDR5/LPDDR5X memory, which can be used in both processing and Edge AI, compared to earlier A311-series chips. Amlogic A311Y3 specifications CPU 2x Arm Cortex-A78 cores (64KB L1 I-cache, 64KB L1 D-cache, 256KB L2 cache) 6x Arm Cortex-A55 cores (32KB L1 I-cache, 32KB L1 D-cache, 128KB L2 cache) with a shared 2MB L3 cache Neon and Crypto extensions included Co-processors – RISC-V core for system control processing; Built-in [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/06/17/amlogic-a311y3-octa-core-edge-ai-soc-features-cortex-a78-a55-cores-8-tops-npu-lpddr5-support/\">Amlogic A311Y3 octa-core Edge AI SoC features Cortex-A78/A55 cores, 8 TOPS NPU, LPDDR5 support<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "SCINTIX P4 ESP32-P4 Compute Module works with (some) Raspberry Pi CM4/CM5 carrier boards (Crowdfunding)", "source": "CNX Software", "date": "2026-06-17", "url": "https://www.cnx-software.com/2026/06/17/scintix-p4-esp32-p4-compute-module-raspberry-pi-cm4-cm5-carrier-boards/", "summary": "<div><img alt=\"ESP32-P4 compute module Raspberry Pi CM5 form factor\" class=\"attachment-medium size-medium wp-post-image\" height=\"465\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/06/ESP32-P4-compute-module-Raspberry-Pi-CM5-form-factor-720x465.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>SCINTIX P4 is an ESP32-P4 RISC-V Compute Module with an ESP32-C6 for wireless connectivity that&#8217;s compatible with Raspberry Pi CM4/CM5 carrier boards, at least partially. It should be the first MCU-based system-on-module in Raspberry Pi CM4/CM5 form factor, and RELOC says the SCINTIX P4 gives access to displays, cameras, Ethernet, USB, and all the peripherals the ESP32-P4 exposes when connected to a carrier board. It can also be programmed in standalone mode through its built-in USB Type-C port. SCINTIX P4 (RM-CMP4) specifications: SoC &#8211; Espressif Systems ESP32-P4NRW32X  CPU Dual-core RISC-V @ 400 MHz with AI instruction extensions and single-precision FPU Single-core RISC-V LP (low-power) MCU @ up to 40 MHz GPU &#8211; 2D Pixel Processing Accelerator (PPA) VPU &#8211; H.264 and JPEG codecs support Memory &#8211; 768 KB HP L2MEM, 32 KB LP SRAM, 8 KB TCM, 32MB PSRAM Storage &#8211; 128 KB HP ROM, 16 KB LP ROM Storage [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/06/17/scintix-p4-esp32-p4-compute-module-raspberry-pi-cm4-cm5-carrier-boards/\">SCINTIX P4 ESP32-P4 Compute Module works with (some) Raspberry Pi CM4/CM5 carrier boards (Crowdfunding)<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "MIPI SWI3S: Simplifying Embedded Audio Complexity", "source": "Embedded.com", "date": "2026-06-17", "url": "https://www.embedded.com/mipi-swi3s-simplifying-embedded-audio-complexity/", "summary": "<p>MIPI SWI3S, supporting two PHY options, enables scalable audio architectures, while simplifying system design and optimizing power efficiency.<\/p>\n<p>The post <a href=\"https://www.embedded.com/mipi-swi3s-simplifying-embedded-audio-complexity/\">MIPI SWI3S: Simplifying Embedded Audio Complexity<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "Efinix Launches Titanium Edge FPGA Family", "source": "Embedded.com", "date": "2026-06-17", "url": "https://www.embedded.com/efinix-launches-titanium-edge-fpga-family/", "summary": "<p>Efinix has announced the Titanium Edge family of field-programmable gate arrays (FPGAs), a new product line developed specifically for edge artificial intelligence applications that require low power consumption, compact form factors, and high levels of reliability and security. Based on the company's Titanium architecture, the new devices are designed to address the increasing performance and [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/efinix-launches-titanium-edge-fpga-family/\">Efinix Launches Titanium Edge FPGA Family<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "Mouser Electronics Highlights LoRa Resource Hub for Scalable, Low-Power IoT Design", "source": "EE Journal", "date": "2026-06-17", "url": "https://www.eejournal.com/industry_news/mouser-electronics-highlights-lora-resource-hub-for-scalable-low-power-iot-design/", "summary": "June 17, 2026 – Mouser Electronics, Inc., the industry&#8217;s leading New Product Introduction (NPI) distributor with the widest selection of semiconductors and electronic components™, highlights its comprehensive LoRa® resource center as global adoption of low-power, wide-area IoT networks accelerates. Engineers designing network infrastructure, industrial automation, and smart-sensing applications can access the latest technologies and design insights to shape next-generation wireless &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/mouser-electronics-highlights-lora-resource-hub-for-scalable-low-power-iot-design/\">Read More &#8594;<span class=\"screen-reader-text\"> \"Mouser Electronics Highlights LoRa Resource Hub for Scalable, Low-Power IoT Design\"<\/span><\/a>"}, {"title": "Optimizing Your Design with Sona™ Wi-Fi 6/6E: – Ezurio and Mouser Electronics", "source": "EE Journal", "date": "2026-06-17", "url": "https://www.eejournal.com/chalk_talks/optimizing-your-design-with-sona-wi-fi-6-6e-ezurio-and-mouser-electronics/", "summary": "In this episode of Chalk Talk, Andy Ross from Ezurio and Amelia Dalton explore why a one-size-fits-all approach doesn&#8217;t work for Wi-Fi 6, the specific benefits of the IF573 and IF513 series Wi-Fi 6E Modules, and how to choose the right radio for your next design. Click here for more information about Ezurio Sona™ Wi-Fi® &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/chalk_talks/optimizing-your-design-with-sona-wi-fi-6-6e-ezurio-and-mouser-electronics/\">Read More &#8594;<span class=\"screen-reader-text\"> \"Optimizing Your Design with Sona™ Wi-Fi 6/6E: – Ezurio and Mouser Electronics\"<\/span><\/a>"}, {"title": "Compact 240W GaN-based desktop adapters simplify integration into medical and industrial applications", "source": "EE Journal", "date": "2026-06-17", "url": "https://www.eejournal.com/industry_news/compact-240w-gan-based-desktop-adapters-simplify-integration-into-medical-and-industrial-applications/", "summary": "XP Power introduces the APM240 series of 240W external desktop AC-DC power supplies that simplify integration in medical, home healthcare, and industrial applications. The adapters are designed for engineers developing patient treatment, patient monitoring, and surgical robots, as well as industrial robotics and process control equipment. The series combines high power density, global compliance, and high energy &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/compact-240w-gan-based-desktop-adapters-simplify-integration-into-medical-and-industrial-applications/\">Read More &#8594;<span class=\"screen-reader-text\"> \"Compact 240W GaN-based desktop adapters simplify integration into medical and industrial applications\"<\/span><\/a>"}, {"title": "$4,000 AMD Ryzen AI Halo Developer Platform features 126 TOPS Ryzen AI Max+ 395 processor", "source": "CNX Software", "date": "2026-06-16", "url": "https://www.cnx-software.com/2026/06/16/4000-amd-ryzen-ai-halo-developer-platform-features-126-tops-ryzen-ai-max-395-processor/", "summary": "<div><img alt=\"AMD Ryzen AI Halo Developer Platform Ryzen AI Max+ 395\" class=\"attachment-medium size-medium wp-post-image\" height=\"414\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/06/AMD-Ryzen-AI-Halo-Developer-Platform-Ryzen-AI-Max-395-720x414.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Last month, AMD introduced the Ryzen AI Halo Developer Platform based on the Ryzen AI Max+ 395 processor, delivering up to 126 TOPS, and pre-orders are now available for $3,999.99 at MicroCenter (US only, in-store pickup). The computer ships with 128GB LPDDR5x memory and a 2TB NVMe SSD. It offers 10GbE and WiFi 7 networking, HDMI 2.1 and USB-C DisplayPort video output, and a few extra USB-C ports Ryzen AI Halo developer kit specifications: SoC &#8211; AMD Ryzen AI Max+ 395 CPU &#8211; 16 cores, 32 threads, “Zen 5” Architecture clocked up to 5.1 GHz GPU &#8211; AMD Radeon 8060S Integrated Graphics with 40 CUs, RDNA 3.5 architecture NPU &#8211; AMD XDNA™ 2 NPU TDP &#8211; 120W Process &#8211; TSMC 4nm FinFET Memory &#8211; 128GB LPDDR5x up to 8,000 MT/s speed, 256GB/s bandwidth Storage &#8211; 2TB M.2 SSD Video Output HDMI 2.1b DisplayPort via USB-C port Networking 10GbE RJ45 port [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/06/16/4000-amd-ryzen-ai-halo-developer-platform-features-126-tops-ryzen-ai-max-395-processor/\">$4,000 AMD Ryzen AI Halo Developer Platform features 126 TOPS Ryzen AI Max+ 395 processor<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "ADLINK COM-HPC-mPTL COM-HPC Mini computer-on-module features up to 180 TOPS Intel Core Ultra Series 3 CPU", "source": "CNX Software", "date": "2026-06-16", "url": "https://www.cnx-software.com/2026/06/16/adlink-com-hpc-mptl-com-hpc-mini-computer-on-module-features-up-to-180-tops-intel-core-ultra-series-3-cpu/", "summary": "<div><img alt=\"COM-HPC Mini module based on Intel Core Ultra Series 3 Panther Lake\" class=\"attachment-medium size-medium wp-post-image\" height=\"457\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/06/COM-HPC-Mini-Intel-Core-Ultra-Series-3-Panther-Lake-720x457.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>ADLINK COM-HPC-mPTL is a COM-HPC R1.3 Mini computer-on-module powered by the Intel Core Ultra Processor Series 3 &#8220;Panther Lake&#8221; family, up to the 180 TOPS 16-core Core Ultra X7 358H processor. The module supports up to 64GB LPDDR5x and optional NVMe SSD BGA storage, and features two 2.5GbE controllers, optional MIPI CSI camera connectors,  and a 40-pin  debug connector. All I/Os are exposed through a standard 400-pin high-density board-to-board connector, including four display interfaces (HDMI, DP, USB4, eDP), and up to 16x PCIe Gen4/Gen5 lanes. COM-HPC-mPTL specifications: SoC – Intel Core Ultra Series 3 Panther Lake-H processors (one or the other) Intel Core Ultra 5 325 8-core (4P+0E+4LPE) processor up to 2.1 GHz / 4.5 GHz (Turbo) with 12MB cache, 4-core Xe3 graphics (40 TOPS), 47 TOPS NPU; PBP: 25W Intel Core Ultra 7 356H 16-core (4P+8E+4LPE) processor up to 1.9 GHz / 4.7 GHz (Turbo) with 18MB cache, 4-core [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/06/16/adlink-com-hpc-mptl-com-hpc-mini-computer-on-module-features-up-to-180-tops-intel-core-ultra-series-3-cpu/\">ADLINK COM-HPC-mPTL COM-HPC Mini computer-on-module features up to 180 TOPS Intel Core Ultra Series 3 CPU<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "How to Build Simulink Models with Agentic AI", "source": "Embedded.com", "date": "2026-06-16", "url": "https://www.embedded.com/how-to-build-simulink-models-with-agentic-ai/", "summary": "<p>MathWorks demonstrates a simple experiment for building grounded Simulink models using agentic AI and the MATLAB MCP Server.<\/p>\n<p>The post <a href=\"https://www.embedded.com/how-to-build-simulink-models-with-agentic-ai/\">How to Build Simulink Models with Agentic AI<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "Altera Introduces Agilex 9 Direct RF-Series SoC FPGA", "source": "Embedded.com", "date": "2026-06-16", "url": "https://www.embedded.com/altera-introduces-agilex-9-direct-rf-series-soc-fpga/", "summary": "<p>Altera has announced the availability of engineering samples for its Agilex 9 Direct RF-Series SoC FPGA, a new addition to the company's Direct RF portfolio, designed for wideband radio-frequency applications in aerospace, defense and advanced communications systems. Introduced at IMS 2026, the device addresses increasing requirements for bandwidth, real-time processing, and system integration while helping [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/altera-introduces-agilex-9-direct-rf-series-soc-fpga/\">Altera Introduces Agilex 9 Direct RF-Series SoC FPGA<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "ESD eBook June 2026: Building Blocks of Robotics Design", "source": "Embedded.com", "date": "2026-06-15", "url": "https://www.embedded.com/esd-ebook-june-2026-building-blocks-of-robotics-design/", "summary": "<p>Physical AI, machine learning, and edge computing are some of the latest technologies that are reshaping robotics and autonomous system design, enabling these systems to interact more intelligently and be more adaptable. Beyond these emerging trends, embedded systems and components such as sensors, processors, motors and controllers, and real-time operating systems (RTOSes) are still the [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/esd-ebook-june-2026-building-blocks-of-robotics-design/\">ESD eBook June 2026: Building Blocks of Robotics Design<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "Smart Robots: Can They Evolve into Real-Time Intelligent Systems?", "source": "Embedded.com", "date": "2026-06-15", "url": "https://www.embedded.com/smart-robots-can-they-evolve-into-real-time-intelligent-systems/", "summary": "<p>The common phrase \"smart robot\" has undergone nuanced shifts over the years. Take robot first: It derives from the Czech word robota, introduced in Karel Čapek's 1920 science‑fiction drama, \"R.U.R.\" It means \"compulsory labor,\" mirroring the concept of a machine as a docile substitute for human work, albeit not executing tasks autonomously, as the word [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/smart-robots-can-they-evolve-into-real-time-intelligent-systems/\">Smart Robots: Can They Evolve into Real-Time Intelligent Systems?<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}], "papers": [{"title": "MemoryWAM: Efficient World Action Modeling with Persistent Memory", "authors": ["Sizhe Yang", "Juncheng Mu", "Tianming Wei", "Chenhao Lu", "Xiaofan Li", "Linning Xu", "Zhengrong Xue", "Zhecheng Yuan", "Dahua Lin", "Jiangmiao Pang", "Huazhe Xu"], "published": "2026-06-18", "summary": "Robust robotic manipulation in the real world requires not only an understanding of the current observation, but also memory and dynamics modeling. World action models (WAMs) possess these capabilities by jointly modeling visual foresight and actions conditioned on both current and historical observations, making them a promising paradigm for robotic manipulation. However, existing WAMs face a fundamental trade-off: methods with efficient inference typically condition only on a bounded window of recent observations and therefore struggle in non-Markovian environments, whereas methods that preserve long histories incur time and space costs that grow substantially with sequence length. To address this challenge, we introduce MemoryWAM, a world action model with efficient persistent memory. MemoryWAM uses a hybrid memory design that combines recent frames, event-boundary anchor frames, and compact gist tokens that summarize long-range history. A tailored attention mechanism enables retrieval of both detailed short-term context and compressed long-term context, supporting memory-dependent decision-making with reduced inference latency and GPU memory usage. Across long-horizon, memory-dependent manipulation tasks in both simulation and the real world, MemoryWAM outperforms strong vision-language-action (VLA) and WAM baselines while maintaining favorable computational efficiency.", "pdf_url": "https://arxiv.org/pdf/2606.20562v1"}, {"title": "UNIEGO: Proxies as Mediators for Unified Egocentric Video Representation Learning", "authors": ["Wenhao Chi", "Arkaprava Sinha", "Dominick Reilly", "Hieu Le", "Srijan Das"], "published": "2026-06-18", "summary": "Egocentric video understanding is inherently limited by the narrow perspective of wearable cameras: a single viewpoint, a single modality, a single model cannot capture the full richness of human action. We argue that a truly expressive egocentric representation must subsume complementary knowledge across viewpoints, modalities, and foundation model representations, yet remain deployable from egocentric video alone. To this end, we introduce a hierarchical multi-teacher distillation framework that produces UNIEGO, a unified egocentric encoder trained with nine teachers spanning ego-exo viewpoints, RGB, depth, and skeleton modalities, and four foundation models. Rather than distilling directly from heterogeneous teachers whose incompatible architectures and feature geometries induce conflicting gradients, our framework interposes a layer of representation-specific Proxy models that translate diverse teacher knowledge into a homogeneous egocentric space. A second distillation stage, Selective Proxy Distillation (SPD), then adaptively selects, for each training sample, the subset of proxies that are both correct and confident, distilling exclusively from reliable supervision and suppressing erroneous signals. SPD is further stabilized by initializing UNIEGO as a learned convex combination of proxy parameters, placing the unified model in a well-conditioned region of the loss landscape before distillation begins. UNIEGO achieves state-of-the-art performance across three egocentric video understanding tasks - action recognition, video retrieval, and action segmentation on three challenging ego-exo benchmarks, outperforming naive multi-teacher distillation baselines and demonstrating that structured, proxy-mediated knowledge transfer yields richer and more discriminative egocentric representations.", "pdf_url": "https://arxiv.org/pdf/2606.20559v1"}, {"title": "Generating Robot Hands from Human Demonstrations", "authors": ["Sha Yi", "Nicklas Hansen", "Xueqian Bai", "Carmelo Sferrazza", "Michael T. Tolley", "Xiaolong Wang"], "published": "2026-06-18", "summary": "Robot learning has advanced rapidly in learning control, but learning the physical body of a robot remains much more difficult because jointly searching over design and control creates a very large combinatorial problem. Here, we present a data-driven framework for generating robot hands from human demonstrations. Instead of learning a complex controller together with each candidate design, we generate robot hand designs using the same simple control policy used after fabrication: matching fingertip positions through inverse kinematics. Using more than 4 million frames of human fingertip motion from everyday manipulation, our algorithm optimizes tree-structured robot hands to reproduce desired target motions. The framework produced both a 6-degree-of-freedom (DoF) general-purpose hand and lower-DoF task-specific hands with spatial four-bar mimic joints. To accelerate the search over designs, we trained a reinforcement-learning (RL) actor to propose good hand designs and joint angles, reducing search time from hours to minutes. We fabricated the mechanisms directly as one-piece articulated structures with print-in-place joints. In real-world experiments, the 6-DoF hand achieved highly accurate teleoperated fingertip tracking better than available commercial robot hands, whereas the specialized 3-DoF hands reproduced structured human and synthetic trajectories with reduced mechanical complexity. These results showed that large-scale human motion data can be used not only to train robot controllers but also as a reference for optimizing and generating the physical embodiment of robots.", "pdf_url": "https://arxiv.org/pdf/2606.20549v1"}, {"title": "The Token Is a Group Element: On Lie-Algebra Attention over Matrix Lie Groups", "authors": ["Przemyslaw Musialski"], "published": "2026-06-18", "summary": "We place the attention token on the group: a token is an element $g_i$ of a matrix Lie group $G$ -- a bare transformation, with no feature payload and no external action $ρ(g)$ carrying it. To our knowledge this is the first attention construction whose tokens are bare matrix Lie group elements: their score is the closed-form algebra norm of the relative pose rather than a learned kernel, and it reaches the affine full-frame groups that every irrep- or surjective-exp-based method must exclude. We call it Lie-Algebra Attention. Once tokens are group elements, the rest follows with none of the usual representation-theoretic machinery. The relative geometry of a pair is canonical, $g_i^{-1} g_j$, so the pairwise invariant $w_{ij} = \\log(g_i^{-1} g_j)$ is intrinsic rather than designed; equivariance under the diagonal $G$-action is tautological, and the cocycle condition holds automatically. The attention score is the negative squared algebra norm, $s_{ij} = -\\|\\log(g_i^{-1} g_j)\\|_λ^2/τ$: the canonical proximity kernel under a block-weighted Frobenius inner product, with no irreducible representations, spherical harmonics, Clebsch-Gordan products, or learned kernel. The construction applies to any matrix Lie group on a chosen logarithm chart containing the relative poses, including the non-compact non-abelian affine groups with scale and shear that no vector-token attention method reaches: neither the irrep tradition nor surjective-exp methods. Three sequence-completion experiments, on SE(2), SO(3), and Aff(2), bear this out: the closed-form score matches a learned MLP kernel on the same invariant and outperforms it on SE(2), using 50 to 80x fewer score parameters, while a vector-token baseline breaks invariance by five to twelve orders of magnitude.", "pdf_url": "https://arxiv.org/pdf/2606.20547v1"}, {"title": "Current World Models Lack a Persistent State Core", "authors": ["Jinpeng Lu", "Dexu Zhu", "Haoyuan Shi", "Linghan Cai", "Guo Tang", "Yinda Chen", "Jie Cao", "Duyu Tang", "Yi Zhang", "Yong Dai", "Xiaozhu Ju"], "published": "2026-06-18", "summary": "World models are increasingly regarded as a decisive step toward artificial general intelligence, yet modeling the physical world demands more than rendering convincing frames on demand: it requires an internal world state that keeps evolving over time, decoupled from observation, so that objects endure and events run to their conclusions whether or not a camera is watching, much as the moon holds to its orbit when no one is looking. This requirement is a blind spot of existing benchmarks, which reward surface properties such as fidelity, motion, and camera controllability while never asking whether a generated world keeps evolving once it is unobserved. We introduce \\textbf{WRBench}, the first systematic diagnostic benchmark that treats camera motion as an intervention on observability and resolves evaluation into a human-calibrated chain that asks whether the camera executes the requested interaction, whether the scene stays continuous and identifiable while in view, and whether a returning target remains consistent with the event that was set in motion. Across 9{,}600 videos from 23 models spanning four control paradigms, one finding proves stubborn: current systems maintain the observed world as a tracking shot, resuming a returning target in the state at which it was abandoned rather than advancing the event while it went unseen. Because this failure recurs across control paradigms, model families, and increments of scale, robust world-state evolution does not follow from cleaner imagery, tighter control, richer geometric priors, or sheer parameter count We therefore argue that the stability of the physical state kernel and the consistency of worldlines under viewpoint intervention should become first-class objectives of world-model design, so that a world model captures how the world will unfold rather than how the next frame appears.", "pdf_url": "https://arxiv.org/pdf/2606.20545v1"}, {"title": "Execution-State Capsules: Graph-Bound Execution-State Checkpoint and Restore for Low-Latency, Small-Batch, On-Device Physical-AI Serving", "authors": ["Liang Su"], "published": "2026-06-18", "summary": "Mainstream LLM serving systems reuse prefix work mainly through paged or radix key-value (KV) caches. This is highly effective for high-throughput, high-concurrency serving, but it manages only one positional fragment of execution state: the KV cache. We study the opposite regime: low-latency, small-batch, on-device physical-AI serving, where interactive LLM agents, speech systems, and robot policies repeatedly branch, reset, interrupt, and re-enter under tight responsiveness budgets. We introduce execution-state capsules, a graph-bound checkpoint and restore mechanism for the complete restorable state at a committed boundary. FlashRT is a white-box, backend-facing kernel runtime whose evaluated NVIDIA CUDA backend runs captured graph plans over contiguous static buffers with no block-table indirection. Because the live state is a closed set of named buffers, a capsule can snapshot, restore, fork, or roll back the whole execution boundary, including KV, recurrent state, convolution state, MTP state, and metadata. This moves reuse from token-addressed KV fragments to graph-bound execution-state boundaries. On an RTX 5090, capsule restore is byte-exact at the stored-state level and token-identical under greedy decode. A KV-only ablation diverges, showing that recurrent state is load-bearing. GPU-resident snapshot and restore are sub-millisecond, and TTFT speedup over cold prefill grows from 3.9x at 2k tokens to 27x at 16k tokens. On Jetson AGX Thor and DGX Spark, the same correctness and structural properties hold. Capsules are not a replacement for high-throughput KV-cache serving; they define a complementary latency-first serving point for explicit execution-state reuse.", "pdf_url": "https://arxiv.org/pdf/2606.20537v1"}, {"title": "SARLO-80: Worldwide Slant SAR Language Optic Dataset 80cm", "authors": ["Solène Debuysère", "Nicolas Trouvé", "Nathan Letheule", "Elise Colin", "Georgia Channing"], "published": "2026-06-18", "summary": "Multimodal foundation models have advanced rapidly thanks to large optical benchmarks, but comparable resources for synthetic aperture radar (SAR) remain limited. Existing SAR--optical datasets largely rely on low-resolution, intensity-only Ground Range Detected~(GRD) products and do not preserve complex-valued SAR measurements or native acquisition geometry, which restricts physically grounded multimodal learning. In particular, large-scale public datasets combining very-high-resolution (VHR) SAR SLC, aligned optical imagery, and natural-language descriptions are still lacking. We present a VHR SAR--optical--text dataset built from open-access Umbra spotlight acquisitions distributed as Sensor Independent Complex Data (SICD). From around 2,500 worldwide scenes (VV/HH, 20cm--2m native resolution), we standardize all SAR data to an 80cm slant-range grid via band-limited FFT resampling and tile the imagery into 1024 by 1024 patches. For each SAR patch, we retrieve a high-resolution optical tile and warp it into the SAR grid using local coordinate correspondences for local pixel-level alignment. We further generate three caption variants (SHORT/MID/LONG) per sample to support vision--language training and evaluation. Our dataset contains 119,566 triplets (complex and amplitude slant-range SAR patch, aligned optical patch, natural-language description) covering 257 locations across 72 countries and a broad range of land types and infrastructures. We release fixed train/validation/test splits and the full preprocessing and baseline code to enable reproducible benchmarks for multimodal alignment on cross-modal retrieval and conditional generation in native SAR geometry. The dataset is publicly available on the Hugging Face Hub at https://huggingface.co/datasets/ONERA/SARLO-80.", "pdf_url": "https://arxiv.org/pdf/2606.20523v1"}, {"title": "HumanScale: Egocentric Human Video Can Outperform Real-Robot Data for Embodied Pretraining", "authors": ["Juncheng Ma", "Jianxin Bi", "Yufan Deng", "Xuanran Zhai", "Kewei Zhang", "Ye Huang", "Bo Liang", "Shukai Gong", "Jiankai Tu", "Xiaotian Tang", "Jiaxin Li", "Kaiqi Chen", "Duomin Wang", "Yuqi Wang", "Bingyi Kang", "Eric Huang", "Zhiyang Dou", "Zhen Dong", "Enze Xie", "Wojciech Matusik", "Tat-Seng Chua", "Daquan Zhou"], "published": "2026-06-18", "summary": "Embodied foundation models are expected to benefit from data scaling like large language models, but face a much tighter data bottleneck. Teleoperated real-robot trajectories remain the dominant pretraining source due to their precise action supervision and embodiment alignment, yet their scalability is limited by high collection cost, acquisition difficulty, and low behavioral and environmental diversity. These limitations have sparked interest in egocentric human video as a scalable, substantially lower-cost, and more diverse alternative for embodied model pretraining. However, its effectiveness compared to teleoperated real-robot data remains underexplored. To address this question, we conduct a systematic study comparing egocentric human video and teleoperated real-robot trajectories as pretraining data sources for embodied foundation models, under fixed post-training and validation protocols. Surprisingly, we find that egocentric data, when processed through a carefully designed filtering and labeling pipeline, is not merely a viable substitute for model pretraining but can lead to superior performance. With the same amount of pretraining data, models pretrained on egocentric data achieve a 24% lower validation loss on real-robot action prediction, as well as 52.5% and 90% higher success rates on in-distribution and out-of-distribution real-robot task execution, respectively. This finding verifies a scalable paradigm for embodied foundation models: pretrain on egocentric human video to learn diverse world representations, then adapt with a small amount of labeled real-robot data for action-space alignment. We hope this study encourages broader exploration of egocentric data and offers guidance for data quality assessment before costly robot data collection.", "pdf_url": "https://arxiv.org/pdf/2606.20521v1"}, {"title": "Approximation and interactive design with exact 3D elastic curves", "authors": ["David Brander", "Jens Gravesen", "Marc Isern"], "published": "2026-06-18", "summary": "An elastic space curve is a critical point of the bending energy subject to appropriate constraints. An analytic representation, equivalent to the spherical pendulum equation, leads to an 11-parameter description of the space of 3D elastic curve segments. We give a numerically stable method for recovering the 11 parameters from a given elastic curve segment. Using this, we give a fast and stable method to approximate an arbitrary space curve segment by a 3D elastica. Applications include interactive design with exact elastic curves and CAD surface rationalization for robotic hot-blade cutting.", "pdf_url": "https://arxiv.org/pdf/2606.20516v1"}, {"title": "CLUSTER: Derivative-free optimization of smooth functions with parameter-change costs", "authors": ["Serena Landers", "Sahil Pontula", "Shiekh Zia Uddin", "Sachin Vaidya", "Marin Soljačić", "Steven G. Johnson"], "published": "2026-06-18", "summary": "We introduce the CLUSTER algorithm (\\textbf{c}oordinate-\\textbf{l}evel \\textbf{u}pdate \\textbf{s}trategy for \\textbf{t}rust-region step \\textbf{e}valuation \\textbf{r}efinement) for local derivative-free optimization problems where there is a cost to changing each parameter (or clusters of parameters). For example, this type of cost model is appropriate for optimizing robot-controlled laboratory experiments, in which a robot may incur a separate motion for each parameter cluster to be adjusted. We build off of a class of quadratic-interpolation optimization algorithms by Powell and Conn that are known to perform well for twice-differentiable objectives (e.g. low-noise experiments), and show that the CLUSTER variants improve performance on a variety of test problems (including an optics laboratory experiment) by around 50$\\%$, and greatly outperform common competing algorithms for laboratory optimization (Bayesian optimization and Nelder--Mead). We also adapt the convergence proof of the Conn algorithm to obtain a similar convergence guarantee for CLUSTER-Conn.", "pdf_url": "https://arxiv.org/pdf/2606.20498v1"}, {"title": "Increasing Resilience of Continuum Robots via Motion Planning Algorithms", "authors": ["Oxana Shamilyan", "Ievgen Kabin", "Zoya Dyka", "Oleksandr Sudakov", "Peter Langendoerfer"], "published": "2026-06-18", "summary": "This paper presents an experimental study of motion planning for resilient continuum robots. In this study we mainly focused on multi-criteria decision-making, its application for path-planning algorithms, impact on the generated path and execution time. To do this, we used two well-known algorithms for path planning, namely Genetic algorithm and A star algorithm, and modified them by adding the Analytical Hierarchy Process algorithm to evaluate the quality of the paths generated. In our experiment the Analytical Hierarchy Process considers four different criteria, i.e. distance, motors damage, mechanical damage of the robot's arm and accuracy, each considered to contribute to the resilience of a continuum robot. The use of different criteria is necessary to increase the time to maintenance operations of the continuum robot. We conducted the experiments using two different simulated environments of the robot. Although we significantly simplified the robot's model and its environment, we still implemented some of the features of the environment based on the real robot prototype. In particular, one of the environments has single- as well as multi-path points, and other consists of the multi-path points only. The results show that, in contrast to A star, the performance time of Genetic algorithm does not depend on the environment's cardinality. It generates more diverse paths, which increases the robot's resilience.", "pdf_url": "https://arxiv.org/pdf/2606.20495v1"}, {"title": "Fast Human Attention Prediction for Fixation-guided Active Perception in Autonomous Navigation", "authors": ["Fatma Youssef Mohammed", "Grzegorz Malczyk", "Kostas Alexis"], "published": "2026-06-18", "summary": "Human visual attention relies on structured scanpaths to efficiently process scenes, yet instilling this behavior into robot autonomy is in its infancy and hindered by the high,computational costs of existing predictive models. To address this, we introduce GazeLNN, a computationally lightweight,scanpath prediction model that leverages Liquid Neural Networks as its recurrent engine and employs MobileNetV3 for feature extraction. Operating auto-regressively, the architecture predicts sequential fixation heatmaps conditioned on the current visual stimulus and fixation history. Despite requiring only 0.61 GFLOPs, GazeLNN achieves state-of-the-art performance on the MIT Low Resolution dataset achieving 0.47 ScanMatch score. It outperforms existing recurrent baselines across diverse evaluation metrics, while reducing computational costs by 99.40% and accelerating inference by up to six times. To investigate the role of human attention modeling in robot autonomy and demonstrate the practical utility of this highly efficient architecture, we integrate GazeLNN into an active camera-robot control policy trained via Reinforcement Learning. This integration enables human-fixation-guided perception during autonomous navigation, validated through successful real-world deployments on an aerial robot.", "pdf_url": "https://arxiv.org/pdf/2606.20491v1"}, {"title": "GroundControl: Anticipating Navigation Failures in Vision-Language Agents via Trajectory-Consistent Uncertainty Estimates", "authors": ["Nastaran Darabi", "Divake Kumar", "Sina Tayebati", "Devashri Naik", "Amit Ranjan Trivedi"], "published": "2026-06-18", "summary": "Vision-language navigation agents achieve competitive average success on benchmark tasks, yet failures often arise through predictable trajectory-level breakdowns such as oscillation, stagnation, or inefficient detours. Reliable deployment, therefore, requires uncertainty signals that anticipate emerging failure dynamics during execution rather than reflect only instantaneous action entropy. We introduce \\emph{GroundControl}, a trajectory-consistent uncertainty estimator defined as statistical deviation from nominal goal-directed distance-to-goal dynamics aggregated over an episode. GroundControl models distance evolution using a constant-velocity Kalman filter and combines normalized innovation statistics with complementary trajectory features capturing progress, monotonicity, path efficiency, and oscillatory behavior. The resulting uncertainty score reflects geometric and temporal inconsistency in navigation behavior rather than local prediction dispersion. To evaluate uncertainty quality independently of task success, we formalize \\emph{Selective Risk--Coverage Navigation (SRCN)}, a protocol that measures how effectively an uncertainty score ranks episodes by failure or inefficiency using risk--coverage curves and AURC / E-AURC summaries. Across five EB-Navigation splits ($N=300$ episodes), trajectory-consistent uncertainty achieves near-oracle ordering under success-based selective risk, with weighted-average $\\mathrm{E\\text{-}AURC}_{\\mathrm{SR}}=0.0024$ for the GPT-4o model, substantially outperforming entropy-, conformal-, and heuristic baselines. Under SPL-based selective evaluation, GroundControl consistently achieves the lowest AURC and E-AURC across models and navigation splits. These results show that modeling deviation from goal-directed dynamics provides an interpretable and robust signal for anticipating navigation failures in vision-language agents.", "pdf_url": "https://arxiv.org/pdf/2606.20479v1"}, {"title": "Slow Brain, Fast Planner: Latency-Resilient VLM-Augmented Urban Navigation", "authors": ["Zhenghao \"Mark'' Peng", "Honglin He", "Quanyi Li", "Yukai Ma", "Bolei Zhou"], "published": "2026-06-18", "summary": "Learning-based planners for sidewalk navigation can generate diverse candidate trajectories in real time, yet their scoring functions often fail to select the best trajectory in challenging situations, outputting trajectories that make the mobile robot drive onto grass, toward pedestrians, or in the wrong direction, even when better candidates exist in the same set. We call this the trajectory scoring gap: in real-world sidewalk navigation, the gap between an anchor-based planner's top choice and the best possible candidate is substantial, likely due to limited high-level scene understanding capability of the planner. Rather than replacing the planner with an end-to-end Vision-Language-Action model, we propose a VLM-Planner interface that uses a VLM to select a candidate index from the planner's proposal set and then fuse it with the planner's initial output. However, VLMs take 1--3s per query and so cannot directly drive a 5--20Hz control loop. We contribute a training-free, latency-resilient trajectory-level fusion layer that turns a stale VLM selection into real-time planner scoring via geometric similarity with exponential decay. On $\\sim$2,000 challenging real-world scenarios (e.g., junctions, pedestrian encounters), VLM selection achieves 30% ADE reduction versus the planner's best selection, while the planner remains competitive in routine situations. In simulation, Score Fusion maintains >80% success rate with delays up to 5s. We demonstrate the full system on a mobile robot navigating challenging campus sidewalks with varied network latency.", "pdf_url": "https://arxiv.org/pdf/2606.20458v1"}, {"title": "ARC
