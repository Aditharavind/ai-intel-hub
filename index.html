e-distance.jpg?id=67776745&amp;width=980\" /> <small class=\"image-media media-caption\">In this rendering, Digit 5 robots work in a factory with humans nearby, no safety barriers needed. When a human approaches, the robot puts down what it’s carrying and squats down so it can’t fall on anybody.<\/small><small class=\"image-media media-photo-credit\">Agility<\/small><\/p><p>Arguably less important than the per-robot cost is how Agility (and its customers) will profit from Digit 5. In the filing, <a href=\"https://www.sec.gov/Archives/edgar/data/2074973/000121390026071287/ea029548401_ex99-2img41.jpg\" target=\"_blank\">Agility estimates<\/a> (using “rounded estimates” which are “purely illustrative”) that Digit 5 robots will be offered to customers as a service at something like $8,500 per month. Based on 20 hours per day of work, and assuming that the total cost of a human worker to their employer is $30.50 per hour, Digit 5 as a service could save employers $100,000 per year, per robot. <\/p><p>It’s important to note that all of these numbers are just estimates, and that all kinds of things (many of them not under Agility’s control) could cause them to change. They’re most useful as an illustration of Agility’s broad approach to making Digit 5 profitable. It’s also important to note the assumption here with such a direct comparison is that Digit 5 will be a more or less effortless drop-in replacement for human labor, which is not something that I’m entirely sure has ever happened with any robot, anywhere.<\/p><p>Where does Digit 5 go from here? Today’s press release says that “as of May 2026, Agility had more than $300 million in multi-year customer orders for Digit 5, with a sales pipeline of prospective customers across manufacturing, warehousing, and logistics.” That works out to comfortably under 1,000 robots, one-tenth of the full capacity of <a href=\"https://spectrum.ieee.org/agility-humanoid-robotics-factory\" target=\"_self\">Agility’s RoboFab factory<\/a> in Oregon.<\/p><p>Between now and all those robots, however, lies an unpredictable entry into the stock market through what’s called a <a href=\"https://www.agilityrobotics.com/content/agility-robotics-to-go-public-through-merger-with-churchill-capital-corp-xi\" target=\"_blank\">SPAC (special purpose acquisition company) merger<\/a>. That’s expected to close within the next few months. Agility hopes to raise more than $620 million through the merger, and it will primarily spend the money to scale production of Digit 5 and get it to customers. Those in the European Union and United Kingdom should be able to buy the bots in 2027.<\/p>"}, {"title": "InOrbit.AI releases OpenRobOps ISO 21423 reference implementation", "source": "Robotics Business Review", "date": "2026-09-15", "url": "https://www.therobotreport.com/inorbit-ai-releases-openrobops-iso-21423-reference-implementation/", "summary": "<p>OpenRobOps gives robotics developers a foundation to deliver a fleet manager with support for the upcoming interoperability standard. <\/p>\n<p>The post <a href=\"https://www.therobotreport.com/inorbit-ai-releases-openrobops-iso-21423-reference-implementation/\">InOrbit.AI releases OpenRobOps ISO 21423 reference implementation<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Heart of the Matter: How a Major Children’s Hospital Uses Open Source NVIDIA AI for Cardiac Care", "source": "NVIDIA Robotics", "date": "2026-09-15", "url": "https://blogs.nvidia.com/blog/childrens-hospital-open-source-ai-cardiac-care/", "summary": ""}, {"title": "Universal Robots launches its seventh generation robot platform at IMTS", "source": "Robotics Business Review", "date": "2026-09-14", "url": "https://www.therobotreport.com/universal-robots-launches-its-seventh-generation-robot-platform-at-imts/", "summary": "<p>Universal Robots has released three new robot arms, a rebuilt core controller, a new AI-ready tool flange, and more. <\/p>\n<p>The post <a href=\"https://www.therobotreport.com/universal-robots-launches-its-seventh-generation-robot-platform-at-imts/\">Universal Robots launches its seventh generation robot platform at IMTS<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Arm to discuss scaling physical AI at RoboBusiness", "source": "Robotics Business Review", "date": "2026-09-14", "url": "https://www.therobotreport.com/arm-to-discuss-scaling-physical-ai-at-robobusiness/", "summary": "<p>Dermot O'Driscoll, the VP of go-to-market for physical AI at Arm, will examine key compute principles behind trusted physical AI.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/arm-to-discuss-scaling-physical-ai-at-robobusiness/\">Arm to discuss scaling physical AI at RoboBusiness<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Why RaaS needs more than a subscription model", "source": "Robotics Business Review", "date": "2026-09-14", "url": "https://www.therobotreport.com/why-raas-needs-more-than-a-subscription-model/", "summary": "<p>At RoboBusiness 2026, a panel of robotics business leaders will examine the practical playbook behind Robots-as-a-Service or RaaS offerings. <\/p>\n<p>The post <a href=\"https://www.therobotreport.com/why-raas-needs-more-than-a-subscription-model/\">Why RaaS needs more than a subscription model <\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Report covers advances in surgical robots, deploying warehouse automation in the real world", "source": "Robotics Business Review", "date": "2026-09-14", "url": "https://www.therobotreport.com/report-covers-surgical-robot-advances-deploying-warehouse-automation-real-world/", "summary": "<p>Learn from a surgical robotics case study and a discussion of how to best deploy mobile robots in the warehouse in this issue.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/report-covers-surgical-robot-advances-deploying-warehouse-automation-real-world/\">Report covers advances in surgical robots, deploying warehouse automation in the real world<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "How autonomous fleets are changing what’s possible in American agriculture", "source": "Robotics Business Review", "date": "2026-09-13", "url": "https://www.therobotreport.com/how-autonomous-fleets-are-changing-whats-possible-american-agriculture/", "summary": "<p>Autonomous tractors can help American agriculture, as exemplified in ASI's collaboration with U.S. Sugar and Everglades Equipment.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/how-autonomous-fleets-are-changing-whats-possible-american-agriculture/\">How autonomous fleets are changing what&#8217;s possible in American agriculture<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Ultrasound offers a scalable path to tactile intelligence for physical AI", "source": "Robotics Business Review", "date": "2026-09-12", "url": "https://www.therobotreport.com/ultrasound-offers-scalable-path-tactile-intelligence-physical-ai/", "summary": "<p>Ultrasound sensing can provide tactile perception for robotic hands while avoiding wear and tear, says UltraSense.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/ultrasound-offers-scalable-path-tactile-intelligence-physical-ai/\">Ultrasound offers a scalable path to tactile intelligence for physical AI<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "How to select the right rack and pinion system for high-precision linear motion", "source": "Robotics Business Review", "date": "2026-09-11", "url": "https://www.therobotreport.com/how-to-select-the-right-rack-and-pinion-system-for-high-precision-linear-motion/", "summary": "<p>GAM explains why robotics designers should consider pinion size when thinking about motion control for high-precision applications. <\/p>\n<p>The post <a href=\"https://www.therobotreport.com/how-to-select-the-right-rack-and-pinion-system-for-high-precision-linear-motion/\">How to select the right rack and pinion system for high-precision linear motion<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "How drone developers are navigating changing regulatory landscapes to help farmers", "source": "Robotics Business Review", "date": "2026-09-11", "url": "https://www.therobotreport.com/how-hylio-drone-developers-navigate-changing-regulatory-landscape-help-farmers/", "summary": "<p>Before the FCC put restrictions on foreign-made robots, it had already set similar restrictions on drones last year, noted Hylio.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/how-hylio-drone-developers-navigate-changing-regulatory-landscape-help-farmers/\">How drone developers are navigating changing regulatory landscapes to help farmers<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Video Friday: Humanoid Robot Takes On Monkey Bars", "source": "IEEE Spectrum Robotics", "date": "2026-09-11", "url": "https://spectrum.ieee.org/video-friday-disaster-response-robots", "summary": "<img src=\"https://spectrum.ieee.org/media-library/humanoid-robot-moves-across-scaffolding-rigged-as-playground-monkey-bars-in-a-lab-while-trying-to-keep-its-balance.gif?id=67756707&amp;width=1200&amp;height=800&amp;coordinates=0%2C67%2C0%2C68\" /><br /><br /><p><span>Video Friday is your weekly selection of awesome robotics videos, collected by your friends at <\/span><em>IEEE Spectrum<\/em><span> robotics. We also post a weekly calendar of upcoming robotics events for the next few months. Please <\/span><a href=\"mailto:automaton@ieee.org?subject=Robotics%20event%20suggestion%20for%20Video%20Friday\">send us your events<\/a><span> for inclusion.<\/span><\/p><h5><a href=\"https://humanoidssummit.com/\">Humanoids Summit Seoul<\/a>: 22–23 September 2026, SEOUL<\/h5><h5><a href=\"https://2026.ieee-iros.org/\">IROS 2026<\/a>: 27 September–1 October 2026, PITTSBURGH<\/h5><h5><a href=\"https://www.corl.org/\">CoRL 2026<\/a>: 9–12 November 2026, AUSTIN<\/h5><p>Enjoy today’s videos!<\/p><div class=\"horizontal-rule\"><\/div><div><span style=\"display: none;\"> <\/span><\/div><blockquote class=\"rm-anchors\" id=\"ky2mqam4lq8\"><em>Traversing sparse 3D structures requires humanoid robots to perceive thin, overhanging geometry while executing agile, accurate whole-body motions. We study this problem through monkey-bar traversal, where the robot must jump to the structure, traverse it through sparse bar interactions, and land safely.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>The list of obstacles that you can traverse to escape a robot is getting shorter.<\/p><p>[ <a href=\"https://nemantor.github.io/sparse-3d-traversal-website/\">ETH Zurich Robotic Systems Lab<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"tkmazhql58o\">YES GIVE ROBOTS TWO HEADS I LOVE IT!<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://generalroboticslab.com/DukeHumanoidv2\">General Robotics Lab<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"wpg0va81l7g\"><em>9/11 was the first documented use of <a href=\"https://spectrum.ieee.org/japan-earthquake-more-robots-to-the-rescue\" target=\"_blank\">robots for urban search and rescue<\/a> and helped create the field of disaster robotics. Personnel began assembling on the afternoon of September 11 and worked the pile from late on  September 11 through October 2, when the last available robot failed. The robots found no survivors, but they located remains and helped search for routes through the rubble toward basements and stairwells where trapped firefighters might have gone.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"http://crasar.org/\">CRASAR<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"ghysqmmria4\"><em>Unitree majorly fully open-sources the UnifoLM-WLA-1.0 embodied foundation model, achieving new SOTA results across multiple benchmarks among open-source models worldwide. A single model coordinates desktop and whole-body mobile manipulation, supporting cross-task and cross-end-effector generalization, driven by one model, whole-body coordination.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://unigen-x.github.io/unifolm-wla.github.io/\">Unitree<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"bsvwmcv60xo\"><em>Compliance is very important in physical interaction. In this work, we show how a multi-lined aerial robot uses its centroid and joint motion to achieve hybrid impedance—admittance control in contact-rich aerial manipulation tasks such as surface sliding. This work will be presented in IEEE IROS 2026.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.dragon.t.u-tokyo.ac.jp/\">DRAGON Lab<\/a> ]<\/p><p>Thanks, Moju!<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"xvuwficd5g0\">Remind me not to get too close to this.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://railab.kaist.ac.kr/\">RaiLab Kaist<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"ypkcijt_nuw\">Welcome to this edition of Things That Really Seem Like They Should Not Fly.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://avfl.engr.tamu.edu/\">Texas A&amp;M University Advanced Vertical Flight Lab<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"fna1crvtbls\"><em>Achieving agile and generalized <a href=\"https://spectrum.ieee.org/quadruped-robot-benchmark-barkour\" target=\"_blank\">legged locomotion<\/a> across terrains requires tight integration of perception and control, especially under occlusions and sparse footholds. Existing methods have demonstrated agility on parkour courses but often rely on end-to-end sensorimotor models with limited generalization and interpretability. By contrast, methods targeting generalized locomotion typically exhibit limited agility and struggle with visual occlusions. We introduce a unified reinforcement learning (RL) framework for agile and generalized locomotion that incorporates a novel attention-based map encoder in the control policy.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://sites.google.com/leggedrobotics.com/ame-2\">ETH Zurich Robotic Systems Lab<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"qkijeldgula\">Finally, the killer app for humanoid robots! But we probably shouldn’t call it that.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.unitree.com/\">Unitree<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"p3bftreqwks\">I suspect that this demo avoids many of the things that are actually difficult about doing dishes. Not just the water and the slippery soapiness, but also identifying when a dish is dirty as well as when it is actually clean.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.flexiv.com/\">Flexiv<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"broo89hfta4\">Sure, I guess I might want a robot to deliver a burrito to me while I’m hiking to the top of a mountain in the rain...?<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.deeprobotics.cn/en\">DEEP Robotics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"k9uhqymng9i\"><em>AI has transformed the digital world. It writes our code, generates our images, reasons in our language. But the physical world—the plants that make our power, our fuel, our steel, and chemicals—it has barely touched. ANYbotics CEO and co-founder Péter Fankhauser on the bet behind the company: Why legged robots turned out to be the way into the world’s most demanding industrial plants, what it took to certify one for explosive atmospheres after experts called it impossible, and where autonomous industrial work goes next.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.anybotics.com/\">ANYbotics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div>"}, {"title": "One brick at a time: How Monumental uses robotics to build walls", "source": "Robotics Business Review", "date": "2026-09-11", "url": "https://www.therobotreport.com/one-brick-at-a-time-how-monumental-uses-robotics-to-build-walls/", "summary": "<p>CEO Salar al Khafaji introduces podcast listeners to how Monumental is using robotics to build walls.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/one-brick-at-a-time-how-monumental-uses-robotics-to-build-walls/\">One brick at a time: How Monumental uses robotics to build walls<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Learn how AVs and robotics are laying the groundwork for field deployments at RoboBusiness", "source": "Robotics Business Review", "date": "2026-09-11", "url": "https://www.therobotreport.com/learn-how-avs-robotics-are-laying-groundwork-field-deployments-robobusiness/", "summary": "<p>ASI CEO Mel Torrie will explore why the intersection of autonomous vehicles and robotics will further revolutionize field deployments.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/learn-how-avs-robotics-are-laying-groundwork-field-deployments-robobusiness/\">Learn how AVs and robotics are laying the groundwork for field deployments at RoboBusiness<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Skild AI Taps NVIDIA Physical AI to Teach Robots New Tasks From a Single Video", "source": "NVIDIA Robotics", "date": "2026-09-10", "url": "https://blogs.nvidia.com/blog/skild-ai-s1-physical-ai/", "summary": "Manufacturing floors, warehouses and production lines rarely stay fixed — tasks change, layouts shift and new products arrive, and most robots can’t keep up without significant reprogramming. Skild AI’s new S1 robot foundation model helps address this, designed to learn previously unseen, long-horizon tasks from a single video demonstration. The model, launched last week, uses [&#8230;]"}, {"title": "Swarmer to acquire Ukrainian UGV maker Ratel Robotics for up to $224M", "source": "Robotics Business Review", "date": "2026-09-10", "url": "https://www.therobotreport.com/swarmer-to-acquire-ukrainian-ugv-maker-ratel-robotics-for-up-to-224m/", "summary": "<p>Swarmer, which has developed swarm software, plans to work with Ratel Robotics' unmanned ground vehicles in Ukraine.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/swarmer-to-acquire-ukrainian-ugv-maker-ratel-robotics-for-up-to-224m/\">Swarmer to acquire Ukrainian UGV maker Ratel Robotics for up to $224M<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Comau automates picking, handling, and palletizing for Decathlon", "source": "Robotics Business Review", "date": "2026-09-10", "url": "https://www.therobotreport.com/comau-automates-picking-handling-and-palletizing-for-decathlon/", "summary": "<p>Comau's system incorporates its MyCo cobot, ROS2 software architecture, AI-powered vision systems, and a modular gripper.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/comau-automates-picking-handling-and-palletizing-for-decathlon/\">Comau automates picking, handling, and palletizing for Decathlon<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Robots Are Learning to Feel", "source": "IEEE Spectrum Robotics", "date": "2026-09-10", "url": "https://spectrum.ieee.org/tactile-data-robots", "summary": "<img src=\"https://spectrum.ieee.org/media-library/image.jpg?id=67745231&amp;width=980\" /><br /><br /><p>Dexterous manipulation remains one of the biggest barriers keeping robots from successfully tackling a wide range of everyday tasks. A sense of touch could be the key, but a lack of quality data has held back progress. This is now starting to change as academic labs and startups race to build new tactile datasets and techniques to put them to use.<\/p><p>Over the last few years, <a href=\"https://spectrum.ieee.org/gemini-robotics\" target=\"_self\">vision-language-action (VLA) models<\/a> have significantly improved the ability of robots to carry out complex tasks involving objects and environments they’ve never encountered before. Pretrained on huge amounts of images, video, and text, and then fine-tuned on a smaller number of teleoperated robot demonstrations, these VLAs can guide robots through a growing range of everyday jobs—<a href=\"https://www.pi.website/blog/pistar06\" rel=\"noopener noreferrer\" target=\"_blank\">like folding laundry, tidying living rooms, and even operating kitchen gadgets<\/a>—using just a video feed and natural language instructions.<\/p><p>But robots still struggle with tasks that require fine-grained hand control, such as handling deformable materials or manipulating small objects—plugging in a USB cable or turning a key in a lock, for example. That’s partly because VLAs ignore one of the primary sources of information humans rely on in these situations: tactile feedback.<\/p><h2>Manipulating Like Humans<\/h2><p>“Most dexterous manipulation can be done by humans with their eyes closed,” says <a href=\"https://people.eecs.berkeley.edu/~trevor/\" rel=\"noopener noreferrer\" target=\"_blank\">Trevor Darrell<\/a>, professor of computer science at the University of California, Berkeley. “Understanding force, slip, and precise grasping is not something that can be done well with traditional vision sensors.”<\/p><p>However, making effective use of tactile sensors is difficult. Tactile sensor data has very different characteristics to the image data VLAs are normally trained on, and tactile datasets lag far behind the internet-scale of many vision and language datasets. To get around this, Darrell’s team devised a way to first pretrain a model on existing datasets before giving it a sense of touch by training a specialist submodel on <a href=\"https://arxiv.org/abs/2606.17055\" rel=\"noopener noreferrer\" target=\"_blank\">100 hours of specially collected, high-quality tactile data<\/a>, including demonstrations of common actions like wiping, grasping, twisting, or pouring using more than 200 different household objects.<\/p><h3><\/h3><br />\n<p class=\"caption\">Explore an interactive visualizer of a small portion of the T-Rex dataset. <span class=\"image-media media-photo-credit\"><a href=\"https://tactile-reactive-dexterous.github.io/#citation\" target=\"_blank\">T-Rex<\/a><\/span><\/p><p>Putting the tactile data to use was not straightforward. The goal was for a robot to be able to use the tactile signal to correct its grip in real time as it manipulated objects. But this requires reaction times faster than most vision-language models operate at. This mismatch is a significant challenge, Darrell says, so the team used separate submodels, known as “experts,” to handle high-level actions and low-level tactile control in a way that’s quick enough for the tactile feedback to be useful.<\/p><p>The action expert produces motion plans, while the tactile expert, which operates four times faster, uses tactile feedback to adjust the motion plan in real time based on what the robot is feeling as it goes. The model was then fine-tuned on about 100 teleoperated demonstrations of relatively complex manipulation tasks, such as screwing in a light bulb, applying toothpaste to a toothbrush, or transferring an egg between trays, where it averaged a success rate of 65 percent across 12 tasks—nearly double the best VLA model.<\/p><h2>Data Diversity<\/h2><p>One limitation, admits Darrell, is that his data comes from a single instance of robotic hardware. Robot hands range from fully articulated five-finger designs to simple pincer grippers, and tactile sensors can rely on fundamentally different physics, from measuring changes in resistance to recording images of a soft gel pad deforming. That makes most tactile AI research sensor-specific, says <a href=\"https://michaelyuancb.github.io/\" target=\"_blank\">Chengbo Yuan<\/a>, a master’s student at Tsinghua University in Beijing, and makes it hard to share data and transfer learnings between groups.<\/p><p>Yuan recently set out to tackle this problem by <a href=\"https://arxiv.org/pdf/2606.13102\" rel=\"noopener noreferrer\" target=\"_blank\">aggregating more than 3,000 hours<\/a> of tactile robotic data from publicly available datasets, covering 21 sensor types and a variety of robot embodiments. Yuan says they were inspired by efforts like the <a href=\"https://spectrum.ieee.org/global-robotic-brain\" target=\"_self\">Open X-Embodiment collaboration<\/a>, which pooled data from many robots and led to models that generalize to hardware not used in training. Yuan’s team then designed a hardware-agnostic model that can train on this diverse data by converting each sensor’s output into a shared format and mapping it onto labeled positions on a template of a human hand. This model was much more successful than a baseline model, even on hardware it had never encountered before. Yuan puts that down to it acquiring “some kind of common sense of tactile knowledge,” by training on such diverse setups.<\/p><h2>Chasing Scale<\/h2><p>Despite the promising results, Yuan thinks more tactile data is needed, and his group is now leading an 80-institution collaboration to collate a larger set of teleoperated demonstrations using a standardized approach to tactile data collection and processing. In the meantime, Fudan University in Shanghai and its spin-out <a href=\"https://baike.baidu.com/en/item/NeoteAI/1682418\" rel=\"noopener noreferrer\" target=\"_blank\">NeoteAI<\/a> have already produced <a href=\"https://research.neoteai.com/assets/n0-foundation-report.pdf\" rel=\"noopener noreferrer\" target=\"_blank\">a tactile dataset<\/a> an order of magnitude larger than previous efforts. Using <a href=\"https://neoteai.com/\" rel=\"noopener noreferrer\" target=\"_blank\">a proprietary sensor<\/a> attached to a variety of robotic arms and a handheld gripper operated by humans, they have collected more than 30,000 hours of demonstrations with synchronized visual and tactile data.<\/p><p>The researchers used this data to <a href=\"https://research.neoteai.com/n0-twam/\" rel=\"noopener noreferrer\" target=\"_blank\">train a model<\/a> that doesn’t just react to touch, but also proactively predicts what the robot should be feeling to help guide and assess actions, significantly improving performance. <a href=\"https://shunlinlu.github.io/\" rel=\"noopener noreferrer\" target=\"_blank\">Shunlin Lu<\/a>, a postdoc researcher at Fudan University and CTO of NeoteAI, says the results are clear evidence that access to large-scale and diverse tactile data leads to significant performance gains.<\/p><p class=\"shortcode-media shortcode-media-youtube\"> <span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><small class=\"image-media media-caption\">Robot manipulation policies with a tactile component offer improved performance on a variety of real-world tasks.<\/small><small class=\"image-media media-photo-credit\">NeoteAI<\/small><\/p><p>Another approach to scaling tactile data could be to piggyback on the vast quantities of visual robotics data already collected. Researchers at the University of Southern California, in Los Angeles, recently <a href=\"https://arxiv.org/pdf/2607.20683\" rel=\"noopener noreferrer\" target=\"_blank\">released a model<\/a> that learned to infer tactile information from visual data, by training it on more than 2,700 demonstrations of everyday manipulation using a handheld gripper that records both tactile data and images from a camera on the device. The model learned associations between images of the gripper coming into contact with objects and the amount of pressure felt by the tactile sensors at that moment, giving even robots without tactile sensors a rudimentary sense of touch that the researchers showed to be particularly useful for contact-rich manipulation tasks. But their broader ambition is to use the generator to add tactile data to existing vision datasets.<\/p><p>How much tactile data will be required for breakthroughs in dexterous tasks remains unclear. So far, tactile training’s main contribution has been to make robots more efficient learners at tasks already within reach like picking and placing objects, says Yuan, and he suspects new algorithms may be required to tackle problems truly impossible without touch.<\/p><p><a href=\"https://people.ucas.ac.cn/~chenglong?language=en\" rel=\"noopener noreferrer\" target=\"_blank\">Long Cheng<\/a> of the Chinese Academy of Sciences in Beijing also thinks raw data is no panacea. “Data is good,” he says. “But how to use them correctly is another issue.” The problem, he notes, is that vision provides a continuous, high-bandwidth stream of pixels, while tactile signals are sparse and intermittent, so models learn to ignore them. His solution, being presented at <a href=\"https://2026.ieee-iros.org/\" rel=\"noopener noreferrer\" target=\"_blank\">IROS 2026<\/a> later this month, is a model that predicts what a robot will feel from vision alone and then compares it against real tactile input. A large gap between the two means the sensor is detecting something the robot would otherwise miss, so these surprising signals are amplified while predictable ones are dampened. Across five contact-rich tasks, the approach averaged 62.8 percent success against 28.2 percent for the same model without touch.<\/p><p>Lu is more confident that data scaling could have similar benefits to those seen in areas like language and vision. He guesses closer to 100,000 hours, collected in varied, real-world settings rather than in the lab, could unlock new capabilities. Either way, the field now has some early signs that larger tactile datasets and smarter ways to use them can give robots a significant boost on some of the most challenging tasks. “I think tactile intelligence is actually the next step for physical AI,” Lu says.<\/p>"}, {"title": "Teradyne Robotics sues JAKA over 3 Universal Robots patents", "source": "Robotics Business Review", "date": "2026-09-10", "url": "https://www.therobotreport.com/teradyne-robotics-sues-jaka-over-3-universal-robots-patents/", "summary": "<p>New details reveal the lawsuit involves three Universal Robots patents about robot interfaces, safety brakes, and joints.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/teradyne-robotics-sues-jaka-over-3-universal-robots-patents/\">Teradyne Robotics sues JAKA over 3 Universal Robots patents<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "AGIBOT to explain how to scale humanoids from the lab to the real world at RoboBusiness", "source": "Robotics Business Review", "date": "2026-09-09", "url": "https://www.therobotreport.com/agibot-share-plans-scale-humanoids-from-lab-to-real-world-at-robobusiness/", "summary": "<p>AGIBOT plans to give attendees actionable insights on identifying high-value robotics use cases and building sustainable developer ecosystems.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/agibot-share-plans-scale-humanoids-from-lab-to-real-world-at-robobusiness/\">AGIBOT to explain how to scale humanoids from the lab to the real world at RoboBusiness<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Vention opens Physical AI Lab for manufacturing in Montreal", "source": "Robotics Business Review", "date": "2026-09-09", "url": "https://www.therobotreport.com/vention-opens-physical-ai-lab-manufacturing-montreal/", "summary": "<p>Vention's new Physical AI Lab will focus on advancing robotic manipulation from research to scalable production-line deployment.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/vention-opens-physical-ai-lab-manufacturing-montreal/\">Vention opens Physical AI Lab for manufacturing in Montreal<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Unitree shares down 53% from IPO debut", "source": "Robotics Business Review", "date": "2026-09-09", "url": "https://www.therobotreport.com/unitree-shares-down-53-from-ipo-debut/", "summary": "<p>The market is pulling back on Unitree's $66 billion valuation from its debut on the Shanghai Stock Exchange just last month.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/unitree-shares-down-53-from-ipo-debut/\">Unitree shares down 53% from IPO debut<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "What bricklaying has taught Monumental about robots in construction", "source": "Robotics Business Review", "date": "2026-09-09", "url": "https://www.therobotreport.com/what-bricklaying-has-taught-monumental-about-robots-construction/", "summary": "<p>The construction industry is rife with opportunity for robotics, but the technology hasn't broken in at scale yet. <\/p>\n<p>The post <a href=\"https://www.therobotreport.com/what-bricklaying-has-taught-monumental-about-robots-construction/\">What bricklaying has taught Monumental about robots in construction<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Why vision AI is the safety backbone of the automated job site", "source": "Robotics Business Review", "date": "2026-09-08", "url": "https://www.therobotreport.com/why-vision-ai-is-safety-backbone-of-automated-job-site/", "summary": "<p>Vision AI doesn't replace robots or human judgement; it provides the continuous perception that allows both to operate safely together.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/why-vision-ai-is-safety-backbone-of-automated-job-site/\">Why vision AI is the safety backbone of the automated job site<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Boston Dynamics veteran launches Dynamic Creatures to bring characters to life with robotics", "source": "Robotics Business Review", "date": "2026-09-08", "url": "https://www.therobotreport.com/boston-dynamics-veterans-launch-dynamic-creatures-to-bring-characters-to-life-with-robotics/", "summary": "<p>Dynamic Creatures plants to create its own line of characters, and to re-create characters for specific brands and environments.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/boston-dynamics-veterans-launch-dynamic-creatures-to-bring-characters-to-life-with-robotics/\">Boston Dynamics veteran launches Dynamic Creatures to bring characters to life with robotics<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}], "embeddedNews": [{"title": "2026 Retrocomputing Challenge: Retro Terminal Bartop Arcade Topper", "source": "Hackaday", "date": "2026-10-08", "url": "https://hackaday.com/2026/10/08/2026-retrocomputing-challenge-retro-terminal-bartop-arcade-topper/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"450\" src=\"https://hackaday.com/wp-content/uploads/2026/10/Retro-Terminal-for-Bartop-Arcade-1.png?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>Retrocomputing is more than just hardware. It&#8217;s also a feel, a vibe, and [valkyrie0528]&#8217;s Retro Terminal Bartop Arcade Topper has it in spades. Here&#8217;s how it happened. The gorgeous device <a class=\"read-more\" href=\"https://hackaday.com/2026/10/08/2026-retrocomputing-challenge-retro-terminal-bartop-arcade-topper/\">&#8230;read more<\/a>"}, {"title": "Solve Your TTL Video Woes With An RP2350", "source": "Hackaday", "date": "2026-10-08", "url": "https://hackaday.com/2026/10/07/solve-your-ttl-video-woes-with-an-rp2350/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"450\" src=\"https://hackaday.com/wp-content/uploads/2026/10/ttl2dvi-featured.jpg?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>Before HDMI and DVI there was VGA, and before that? TTL RGB, in which instead of analogue voltages, the connector carried TTL logic voltages. TTL monitors used to be ten <a class=\"read-more\" href=\"https://hackaday.com/2026/10/07/solve-your-ttl-video-woes-with-an-rp2350/\">&#8230;read more<\/a>"}, {"title": "Keep That Old Radio Alive With An ESP32", "source": "Hackaday", "date": "2026-10-08", "url": "https://hackaday.com/2026/10/07/keep-that-old-radio-alive-with-an-esp32/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"450\" src=\"https://hackaday.com/wp-content/uploads/2026/10/am-tx-featured.jpg?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>As the legacy AM broadcast bands fade away, what happens to the millions of devices built to receive them? Many of them will go into e-waste, but with a century <a class=\"read-more\" href=\"https://hackaday.com/2026/10/07/keep-that-old-radio-alive-with-an-esp32/\">&#8230;read more<\/a>"}, {"title": "Q8botOne – A palm-sized open-source quadruped robot with ESP32-C3, DYNAMIXEL smart actuators (Crowdfunding)", "source": "CNX Software", "date": "2026-10-08", "url": "https://www.cnx-software.com/2026/10/08/q8botone-a-palm-sized-open-source-quadruped-robot-with-esp32-c3-dynamixel-smart-actuators/", "summary": "<div><img alt=\"Q8botOne A Serious Quadruped That Fits in Your Hand\" class=\"attachment-medium size-medium wp-post-image\" height=\"480\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/10/Q8botOne-A-Serious-Quadruped-That-Fits-in-Your-Hand-720x480.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>ZeroWire Robotics Q8botOne is an open-source, palm-sized quadruped robot built around an ESP32-C3 MCU and ROBOTIS DYNAMIXEL smart actuators. Designed with a unique wire-free architecture, the robot integrates all components onto a central printed circuit board also used as the structural chassis. The robot is roughly the size of a smartphone and can jog, jump, and carry up to twice its 250-gram weight. The main PCB uses a dedicated 6V/16A step-down converter for motor power and includes a battery management system for two 14500 Li-ion cells. For control, the kit includes a separate ESP32-C3 controller PCB with an Adafruit Mini I2C Gamepad. Q8botOne specifications: Wireless module – Espressif Systems ESP32-C3-MINI-1-N4 module with: ESP32-C3 (ESP32-C3FN4) SoC CPU &#8211; 32-bit RISC-V single-core processor up to 160 MHz Memory &#8211; 400 KB SRAM (16 KB for cache), 8 KB SRAM in RTC Storage &#8211; 4 MB embedded flash, 384 KB ROM Connectivity – [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/10/08/q8botone-a-palm-sized-open-source-quadruped-robot-with-esp32-c3-dynamixel-smart-actuators/\">Q8botOne &#8211; A palm-sized open-source quadruped robot with ESP32-C3, DYNAMIXEL smart actuators (Crowdfunding)<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Efinix Sapphire RV64 SoC – Configurable RISC-V soft-cores with DDR3, LPDDR4x, and HyperRAM for Efinix FPGAs", "source": "CNX Software", "date": "2026-10-08", "url": "https://www.cnx-software.com/2026/10/08/efinix-sapphire-rv64-soc-configurable-risc-v-soft-cores-with-ddr3-lpddr4x-and-hyperram-for-efinix-fpgas/", "summary": "<div><img alt=\"Sapphire RV64 SoC block diagram. The VexiiRiscv cores, caches, and peripherals are built in the FPGA\" class=\"attachment-medium size-medium wp-post-image\" height=\"480\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/10/Sapphire-RV64-SoC-block-diagram.-The-VexiiRiscv-cores-caches-and-peripherals-are-built-in-the-FPGA-720x480.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Efinix has introduced the Sapphire RV64 SoC, a configurable 64-bit RISC-V soft-core processor designed for its Titanium and Trion FPGAs. It is based on the VexiiRiscv core and can be configured with one to four RISC-V cores running at up to 400 MHz. The Sapphire RV64 has a seven-stage pipeline, configurable L1 caches, optional 64–512 KB L2 cache, and 4–512 KB of on-chip RAM. It supports DDR3, LPDDR4x, and HyperRAM with up to 512-bit AXI interfaces and external memory from 4 MB to 8 GB. Other features include an optional FPU, branch predictor, prefetchers, SV39 MMU, up to 32 GPIOs, five I²C, three SPI, three UARTs, timers, watchdog, and up to eight user interrupts. Efinix Sapphire RV64 SoC specifications: CPU 1 to 4x VexiiRiscv 64-bit cores with a 7-stage pipeline (fetch, align-decompress, decode, issue, execute, memory, and writeback) Configurable system clock frequency from 20 MHz to 400 MHz Supports RV64IMACFD_Zba_Zbc_Zbs extensions [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/10/08/efinix-sapphire-rv64-soc-configurable-risc-v-soft-cores-with-ddr3-lpddr4x-and-hyperram-for-efinix-fpgas/\">Efinix Sapphire RV64 SoC &#8211; Configurable RISC-V soft-cores with DDR3, LPDDR4x, and HyperRAM for Efinix FPGAs<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Qualcomm vs Arm (day 3)", "source": "Electronics Weekly", "date": "2026-10-08", "url": "https://www.electronicsweekly.com/news/business/qualcomm-vs-arm-day-3-2026-10/", "summary": "<p>Yesterday the Qualcomm vs Arm case covered the struggle for leverage, differing architectural interpretations and good faith (or not) in the negotiations regarding Arm&#8217;s v10 technology. A major focus was [&#8230;]<\/p>\n<p>The post <a href=\"https://www.electronicsweekly.com/news/business/qualcomm-vs-arm-day-3-2026-10/\">Qualcomm vs Arm (day 3)<\/a> appeared first on <a href=\"https://www.electronicsweekly.com\">Electronics Weekly<\/a>.<\/p>"}, {"title": "Intel and Applied hook up on process", "source": "Electronics Weekly", "date": "2026-10-08", "url": "https://www.electronicsweekly.com/news/business/intel-and-applied-hook-up-on-process-2026-10/", "summary": "<p>Intel and Applied are getting together for a multi-site, multi-technology collaboration on process technology. The work will cover front-end and back-end, transistor development, packaging, interconnect and power delivery. The work [&#8230;]<\/p>\n<p>The post <a href=\"https://www.electronicsweekly.com/news/business/intel-and-applied-hook-up-on-process-2026-10/\">Intel and Applied hook up on process<\/a> appeared first on <a href=\"https://www.electronicsweekly.com\">Electronics Weekly<\/a>.<\/p>"}, {"title": "Wolfspeed gets $1.5bn loan from US government", "source": "Electronics Weekly", "date": "2026-10-08", "url": "https://www.electronicsweekly.com/news/business/wolfspeed-gets-1-5bn-loan-from-us-government-2026-10/", "summary": "<p>Wolfspeed has received a conditional loan commitment letter from the U.S. Department of War (&#8220;DoW&#8221;), through its Office of Strategic Capital (&#8220;OSC&#8221;), for up to $1.5 billion. The money will [&#8230;]<\/p>\n<p>The post <a href=\"https://www.electronicsweekly.com/news/business/wolfspeed-gets-1-5bn-loan-from-us-government-2026-10/\">Wolfspeed gets $1.5bn loan from US government<\/a> appeared first on <a href=\"https://www.electronicsweekly.com\">Electronics Weekly<\/a>.<\/p>"}, {"title": "Infineon and ZuriQ to scale qubits", "source": "Electronics Weekly", "date": "2026-10-08", "url": "https://www.electronicsweekly.com/news/infineon-and-zuriq-to-scale-qubits-2026-10/", "summary": "<p>Infineon and ZuriQ, the Swiss quantum computing company spun out of ETH Zurich, are to expand their collaboration to scale qubits. The partnership combines ZuriQ’s trapped-ion quantum computing architecture with [&#8230;]<\/p>\n<p>The post <a href=\"https://www.electronicsweekly.com/news/infineon-and-zuriq-to-scale-qubits-2026-10/\">Infineon and ZuriQ to scale qubits<\/a> appeared first on <a href=\"https://www.electronicsweekly.com\">Electronics Weekly<\/a>.<\/p>"}, {"title": "100V E-mode GaN-based discrete power transistors", "source": "Electronics Weekly", "date": "2026-10-08", "url": "https://www.electronicsweekly.com/news/business/100v-enhancement-mode-e-mode-gan-based-discrete-power-transistors-2026-10/", "summary": "<p>Renesas has expanded its GaN portfolio into low-voltage applications with its first family of 100V enhancement mode GaN-based discrete power transistors. The RTP100E005G1FL, RTP100E2P6G1FL, RTP100E1P8G1FL-DSC and RTP100E1P2G1FL-DSC low-voltage GaN FETs [&#8230;]<\/p>\n<p>The post <a href=\"https://www.electronicsweekly.com/news/business/100v-enhancement-mode-e-mode-gan-based-discrete-power-transistors-2026-10/\">100V E-mode GaN-based discrete power transistors<\/a> appeared first on <a href=\"https://www.electronicsweekly.com\">Electronics Weekly<\/a>.<\/p>"}, {"title": "Apple’s Fading Support Acts", "source": "Electronics Weekly", "date": "2026-10-08", "url": "https://www.electronicsweekly.com/blogs/mannerisms/markets/the-fading-impact-of-apples-support-acts-2026-10/", "summary": "<p>Apple’s supporting cast, including smart home products. Apple Watch, AirPods and the Apple Vision Pro, has struggled to keep up with the growth of the rest of the company in [&#8230;]<\/p>\n<p>The post <a href=\"https://www.electronicsweekly.com/blogs/mannerisms/markets/the-fading-impact-of-apples-support-acts-2026-10/\">Apple’s Fading Support Acts<\/a> appeared first on <a href=\"https://www.electronicsweekly.com\">Electronics Weekly<\/a>.<\/p>"}, {"title": "ESP32-CYD Modular Case with GPS/NFC/IR/RF/CC1101/NRF24L01 Bays #3DThursday #3DPrinting", "source": "Adafruit", "date": "2026-10-08", "url": "https://blog.adafruit.com/2026/10/08/esp32-cyd-modular-case-with-gps-nfc-ir-rf-cc1101-nrf24l01-bays-3dthursday-3dprinting/", "summary": "Rousie shares: A robust portable enclosure that transforms an ESP32-based Cheap Yellow Display into a multifunctional handheld. Holds 4× 18650 batteries, space for a power bank board (charging functionality), SMA connectors for multiple antennas. Dedicated bays: GPS, NFC, IR, RF (315/433MHz), CC1101, NRF24L01, and speaker modules. PETG-CF recommended at 0.2mm layer, 25–30% infill. Designed for [&#8230;]"}, {"title": "Castle Cat House #3DThursday #3DPrinting", "source": "Adafruit", "date": "2026-10-08", "url": "https://blog.adafruit.com/2026/10/08/castle-cat-house-3dthursday-3dprinting/", "summary": "BenBurnski shares: Model is divided into multiple individual parts and can be printed on printers with a min. build volume of 220x220x220mm download the files on: https://www.printables.com/model/1863268-small-castle-cat-house-3d-printed-pet-castle Every Thursday is #3dthursday here at Adafruit! The DIY 3D printing community has passion and dedication for making solid objects from digital models. Recently, we have noticed electronics [&#8230;]"}, {"title": "Magnetic PCB Holder – Snap-On Steel Print Surface Work Holder #3DThursday #3DPrinting", "source": "Adafruit", "date": "2026-10-08", "url": "https://blog.adafruit.com/2026/10/08/magnetic-pcb-holder-snap-on-steel-print-surface-work-holder-3dthursday-3dprinting/", "summary": "TYnextnext shares: A magnetic work-holding solution that snaps onto any steel print surface (or any ferrous work surface) to securely hold PCBs for soldering, probing, rework, and photos. Adjustable clamps and low-profile form factor. Requires M4×12mm bolts, M4 nuts, and 8×2mm or 10×2mm neodymium disc magnets. Recommended: PETG or ABS for heat resistance (PLA OK [&#8230;]"}, {"title": "Melting Ghost Figure – Shelf-Edge Halloween Decoration #3DThursday #3DPrinting", "source": "Adafruit", "date": "2026-10-08", "url": "https://blog.adafruit.com/2026/10/08/melting-ghost-figure-shelf-edge-halloween-decoration-3dthursday-3dprinting/", "summary": "Fierro_3D shares: A spooky shelf-edge decoration featuring a ghostly figure that appears to drip and melt over the edge — artistic aesthetic suited for Halloween displays. Requires supports for the hanging position and overhangs (careful orientation matters). Two print profiles: standard version (1.7 hours) and a larger version (5.1 hours) designed to accommodate an LED [&#8230;]"}, {"title": "From the mail bag…", "source": "Adafruit", "date": "2026-10-08", "url": "https://blog.adafruit.com/2026/10/08/from-the-mail-bag-808/", "summary": "From the mail bag! Hello Adafruit team, Your CircuitPython introduction makes a lovely point: after a board is set up, saving an edited file is enough to run the change. That short distance between an idea and its result makes experimentation feel approachable. Thank you for explaining the process so clearly and for building a [&#8230;]"}, {"title": "Haunted House — A Halloween Scene with LED Illumination #3DThursday #3DPrinting", "source": "Adafruit", "date": "2026-10-08", "url": "https://blog.adafruit.com/2026/10/08/haunted-house-a-halloween-scene-with-led-illumination-3dthursday-3dprinting/", "summary": "Daniel4d shares: A full-scale centerpiece Halloween build: illuminated haunted house surrounded by pumpkins, lanterns, and a gargoyle. Multi-colored components for perfect color control and easy assembly — no soldering required. Three lighting options: basic LED kit, extended multi-point illumination, or no lighting. Powerbank slot accommodates the extended setup. Main file: 32 hours / 12 plates. [&#8230;]"}, {"title": "Streaming Games Means the Nintendo DSi Will Never Be Obsolete", "source": "Hackaday", "date": "2026-10-07", "url": "https://hackaday.com/2026/10/07/streaming-games-means-the-nintendo-dsi-will-never-be-obsolete/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"450\" src=\"https://hackaday.com/wp-content/uploads/2026/10/DSi-gamestream.jpg?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>There comes a point where you have to acknowledge that your beloved console is out of date and&#8211; barring the odd homebrew title&#8211; won&#8217;t be playing new games ever again. <a class=\"read-more\" href=\"https://hackaday.com/2026/10/07/streaming-games-means-the-nintendo-dsi-will-never-be-obsolete/\">&#8230;read more<\/a>"}, {"title": "Handheld Atari 2600 Packs a CRT", "source": "Hackaday", "date": "2026-10-07", "url": "https://hackaday.com/2026/10/07/handheld-atari-2600-packs-a-crt/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"450\" src=\"https://hackaday.com/wp-content/uploads/2026/10/utari-featured.jpg?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>We covered [Nick Bild]&#8217;s mini Atari console using original devices not so long ago, and today he&#8217;s back with the same console wrapped up with a CRT as a handheld. <a class=\"read-more\" href=\"https://hackaday.com/2026/10/07/handheld-atari-2600-packs-a-crt/\">&#8230;read more<\/a>"}, {"title": "Repairing a Couple of Very Expensive Registered DDR5 RAM Sticks", "source": "Hackaday", "date": "2026-10-07", "url": "https://hackaday.com/2026/10/07/repairing-a-couple-of-very-expensive-registered-ddr5-ram-sticks/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"478\" src=\"https://hackaday.com/wp-content/uploads/2026/10/unified_ddr_flasher_ui_northwestrepair_youtube.jpg?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>It&#8217;s definitely a sign of the times when repair shops get handed sticks of registered ECC DDR5 RAM by businesses to try and fix, rather than just tossing the defective <a class=\"read-more\" href=\"https://hackaday.com/2026/10/07/repairing-a-couple-of-very-expensive-registered-ddr5-ram-sticks/\">&#8230;read more<\/a>"}, {"title": "2026 Retrocomputing Challenge: Dungeons of Daggorath, But Without Quite So Much Typing", "source": "Hackaday", "date": "2026-10-07", "url": "https://hackaday.com/2026/10/07/2026-retrocomputing-challenge-dungeons-of-daggorath-but-without-quite-so-much-typing/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"450\" src=\"https://hackaday.com/wp-content/uploads/2026/10/Dungeons-of-Doom-banner.png?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>People mod games all the time, but it&#8217;s not every day someone mods Dungeons of Daggorath for the TRS-80. [Nick Bild] did exactly that, adding joystick support and a couple <a class=\"read-more\" href=\"https://hackaday.com/2026/10/07/2026-retrocomputing-challenge-dungeons-of-daggorath-but-without-quite-so-much-typing/\">&#8230;read more<\/a>"}, {"title": "DSPi firmware turns Raspberry Pi RP2040/RP2350 into a USB sound card with an onboard DSP engine", "source": "CNX Software", "date": "2026-10-07", "url": "https://www.cnx-software.com/2026/10/07/dspi-firmware-turns-raspberry-pi-rp2040-rp2350-into-a-usb-sound-card-with-an-onboard-dsp-engine/", "summary": "<div><img alt=\"Raspberry Pi Pico configuration in DSPi Console\" class=\"attachment-medium size-medium wp-post-image\" height=\"539\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/10/Raspberry-Pi-Pico-configuration-in-DSPi-Console-720x539.webp\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>DSPi is a full-featured audio DSP firmware for the Raspberry Pi Pico, Pico 2, and other Raspberry Pi RP2040/RP2350 boards, which turns them into a USB sound card with an integrated DSP. It allows users to make use of essential tools like room correction, active crossovers, parametric EQ, time alignment, and more, and essentially works as a regular sound card on your computer. DSPi firmware’s capabilities: Dual-Core DSP &#8211; EQ processing is split across both cores on both RP2040 and RP2350. USB Audio Interface &#8211; Supports 16-bit and 24-bit PCM input at 44.1, 48, and 96 kHz, working on macOS, Windows, Linux, and iOS. S/PDIF Input &#8211; 24-bit PCM stereo audio at 44.1 or 48kHz. 24-bit S/PDIF or I2S Outputs &#8211; Up to 4x independent stereo output slots (8x channels on RP2350, 4x channels on RP2040). Subwoofer Output &#8211; Dedicated mono PDM output channel with a high-performance 2nd-order delta-sigma modulator, [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/10/07/dspi-firmware-turns-raspberry-pi-rp2040-rp2350-into-a-usb-sound-card-with-an-onboard-dsp-engine/\">DSPi firmware turns Raspberry Pi RP2040/RP2350 into a USB sound card with an onboard DSP engine<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "NuMaker-IoT-MA35D0-A2 (Chili Pro) ultra-compact evaluation board features MA35D0K Cortex-A35/M4 MPU", "source": "CNX Software", "date": "2026-10-07", "url": "https://www.cnx-software.com/2026/10/07/numaker-iot-ma35d0-a2-chili-pro-ultra-compact-evaluation-board-features-ma35d0k-cortex-a35-m4-mpu/", "summary": "<div><img alt=\"NuMaker IoT MA35H0 A2 evaluation board\" class=\"attachment-medium size-medium wp-post-image\" height=\"480\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/10/NuMaker-IoT-MA35H0-A2-evaluation-board-720x480.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Nuvoton has added MA35D05KH67C, MA35D05KI67C, and MA35D05KJ67C, three new LQFP128 MPUs, to the NuMicro MA35D0 series, along with the NuMaker-IoT-MA35D0-A2 (Chili Pro) evaluation board. Designed for industrial AI, smart gateways, and renewable energy systems, this heterogeneous MPU has two 64-bit Arm Cortex-A35 cores at up to 650 MHz, plus a dedicated 180 MHz Arm Cortex-M4 for real-time work. Nuvoton’s press release calls Chili Pro the “industry’s smallest Linux platform,” but the board is 45 × 45 mm, which is bigger than other boards we wrote about previously, like the VoCore2 (25.4 × 25.4 × 2.8 mm), the Milk-V Duo 256M (51 × 21 mm), NanoPi NEO (40 × 40 mm), and even the Raspberry Pi Zero 2 W (65 × 30 mm). Still, considering that it fits full-sized RJ45 and USB ports along with the other interfaces, it is a pretty compact and capable board. Nuvoton NuMaker-IoT-MA35D0-A2 evaluation board specifications: [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/10/07/numaker-iot-ma35d0-a2-chili-pro-ultra-compact-evaluation-board-features-ma35d0k-cortex-a35-m4-mpu/\">NuMaker-IoT-MA35D0-A2 (Chili Pro) ultra-compact evaluation board features MA35D0K Cortex-A35/M4 MPU<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Silicon Labs Expands AI Tools for Embedded IoT Development", "source": "Embedded.com", "date": "2026-10-07", "url": "https://www.embedded.com/silicon-labs-expands-ai-tools-for-embedded-iot-development/", "summary": "<p>Silicon Labs has expanded its developer platform with new tools for AI-assisted embedded development, hardware and software validation, open-source collaboration, and edge AI lifecycle management. Announced at the company's Works With Summit, the initiatives extend the Simplicity platform from conventional IoT development toward workflows in which AI tools can interact with device-specific software, hardware configurations, [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/silicon-labs-expands-ai-tools-for-embedded-iot-development/\">Silicon Labs Expands AI Tools for Embedded IoT Development<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "From Silicon to Cloud: Engineering Cyber-Resilient Software-Defined Vehicles", "source": "Embedded.com", "date": "2026-10-07", "url": "https://www.embedded.com/from-silicon-to-cloud-engineering-cyber-resilient-software-defined-vehicles/", "summary": "<p>As electric and autonomous vehicles evolve into networked computing platforms, lasting protection starts with hardware-rooted trust and extends through firmware, connectivity, and the cloud.<\/p>\n<p>The post <a href=\"https://www.embedded.com/from-silicon-to-cloud-engineering-cyber-resilient-software-defined-vehicles/\">From Silicon to Cloud: Engineering Cyber-Resilient Software-Defined Vehicles<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "Get Mannerisms, Gadget Master, the Daily and the Weekly, in newsletter form", "source": "Electronics Weekly", "date": "2026-10-07", "url": "https://www.electronicsweekly.com/blogs/electro-ramblings/site-update/get-mannerisms-gadget-master-daily-weekly-newsletter-form-2026-10/", "summary": "<p>Let our content come straight to you! Easily digestible newsletter emails straight to your inbox. And all the newsletters are mobile optimised.<\/p>\n<p>The post <a href=\"https://www.electronicsweekly.com/blogs/electro-ramblings/site-update/get-mannerisms-gadget-master-daily-weekly-newsletter-form-2026-10/\">Get Mannerisms, Gadget Master, the Daily and the Weekly, in newsletter form<\/a> appeared first on <a href=\"https://www.electronicsweekly.com\">Electronics Weekly<\/a>.<\/p>"}, {"title": "Teradyne Magnum E2 addresses advanced DRAM and high-speed NAND flash", "source": "Electronics Weekly", "date": "2026-10-07", "url": "https://www.electronicsweekly.com/news/products/test-measurement-products/magnum-e2-addresses-advanced-dram-and-high-speed-nand-flash-2026-10/", "summary": "<p>The Teradyne Magnum E2 is a high-speed memory test system for advanced DRAM and flash interfaces. Its design, says the company, matches the test demands driven by AI and high-performance [&#8230;]<\/p>\n<p>The post <a href=\"https://www.electronicsweekly.com/news/products/test-measurement-products/magnum-e2-addresses-advanced-dram-and-high-speed-nand-flash-2026-10/\">Teradyne Magnum E2 addresses advanced DRAM and high-speed NAND flash<\/a> appeared first on <a href=\"https://www.electronicsweekly.com\">Electronics Weekly<\/a>.<\/p>"}, {"title": "Queen’s University opens Advanced Manufacturing Innovation Centre", "source": "Electronics Weekly", "date": "2026-10-07", "url": "https://www.electronicsweekly.com/news/business/manufacturing/queens-university-opens-advanced-manufacturing-innovation-centre-2026-10/", "summary": "<p>Queen’s University has officially opened the Advanced Manufacturing Innovation Centre (AMIC), a £100m investment through the Belfast Region City Deal to support innovation and growth for manufacturing in Northern Ireland. [&#8230;]<\/p>\n<p>The post <a href=\"https://www.electronicsweekly.com/news/business/manufacturing/queens-university-opens-advanced-manufacturing-innovation-centre-2026-10/\">Queen’s University opens Advanced Manufacturing Innovation Centre<\/a> appeared first on <a href=\"https://www.electronicsweekly.com\">Electronics Weekly<\/a>.<\/p>"}, {"title": "An Orderly De-Frothing?", "source": "Electronics Weekly", "date": "2026-10-07", "url": "https://www.electronicsweekly.com/blogs/mannerisms/dilemmas/an-orderly-de-frothing-2026-10/", "summary": "<p>There’s a chance that the de-frothing of the AI market could be an orderly retreat rather than a sudden bust. Anthropic’s two largest customers are weaning themselves off Anthropic products [&#8230;]<\/p>\n<p>The post <a href=\"https://www.electronicsweekly.com/blogs/mannerisms/dilemmas/an-orderly-de-frothing-2026-10/\">An Orderly De-Frothing?<\/a> appeared first on <a href=\"https://www.electronicsweekly.com\">Electronics Weekly<\/a>.<\/p>"}, {"title": "Integrating Electronics With Human Cells", "source": "Adafruit", "date": "2026-10-07", "url": "https://blog.adafruit.com/2026/10/07/integrating-electronics-with-human-cells/", "summary": "Researchers from the University of Massachusetts Amherst have designed a flexible mesh that integrates electronics with human cells. The mesh is capable of providing a continuous electrical supply. The study was recently published in Science Advances. Their ‘biohybrid mesh harvester’ could change the way wearables and implantable electronics are powered. Harvesting that cellular power requires [&#8230;]"}, {"title": "The Hexa-Bouncer ball juggling robot", "source": "Adafruit", "date": "2026-10-07", "url": "https://blog.adafruit.com/2026/10/07/the-hexa-bouncer-ball-juggling-robot/", "summary": "T-Kuhn has built the Hexa-Bouncer, a ball juggling machine published on Electron Dust and the successor to the Octo-Bouncer. It is a rotary hexapod that uses universal joints on all six arms instead of ball joints. An IK simulation in Unity showed the upper joint also needed to rotate around the end link&#8217;s axis, so [&#8230;]"}, {"title": "Easy Flash: Flash your ESP32 from the browser", "source": "Adafruit", "date": "2026-10-07", "url": "https://blog.adafruit.com/2026/10/07/easy-flash-flash-your-esp32-from-the-browser/", "summary": "Easy Flash is a browser based tool for writing firmware to ESP32 boards. Pick a hardware project from the list on the page, connect the board, and the flashing happens in the browser with no toolchain to install. It uses the Web Serial API, so it needs Google Chrome, Microsoft Edge, or another Chromium-based browser. [&#8230;]"}, {"title": "Enigma: the machine and its history", "source": "Adafruit", "date": "2026-10-07", "url": "https://blog.adafruit.com/2026/10/07/enigma-the-machine-and-its-history/", "summary": "A website called enigma.design puts a working 3D model of a German Enigma machine in the browser, with lessons on how it was used and how it was broken. The German military used Enigma during World War II to send encrypted messages. Polish, British, and French cryptanalysts exploited weaknesses in the machine and in the [&#8230;]"}, {"title": "A Pi-hole-class DNS ad-blocker on an ESP32-C3 (no PSRAM)", "source": "Adafruit", "date": "2026-10-07", "url": "https://blog.adafruit.com/2026/10/07/a-pi-hole-class-dns-ad-blocker-on-an-esp32-c3-no-psram/", "summary": "Zed (@M-Abozaid) published a DNS ad-blocker on GitHub that runs on a $2 ESP32-C3 with no PSRAM. Most ESP32 DNS sinkholes load blocklist domain strings into RAM, which is why they need PSRAM. This one stores each domain as a sorted 40-bit FNV-1a hash in flash and binary-searches it. Over 140,000 domains fit in about [&#8230;]"}, {"title": "Watch Vectrex Doom via the UVMC2 Multicart", "source": "Adafruit", "date": "2026-10-07", "url": "https://blog.adafruit.com/2026/10/07/watch-vectrex-doom-via-the-uvmc2-multicart/", "summary": "Kris Moyse, writing at Time Extension, covered new footage of DOOM appearing on the Vectrex, Milton Bradley&#8217;s vector-display tabletop console from 1982. E1M1 is recognizable, with id Software&#8217;s 1993 shooter redrawn as moving vector lines instead of pixels. The demo is the work of modder Jason Kopp, known as ArcadeJason. It uses the UVMC2, the [&#8230;]"}, {"title": "TDK expands multilayer inductors for automotive power over-coax circuits", "source": "EE Journal", "date": "2026-10-07", "url": "https://www.eejournal.com/industry_news/tdk-expands-multilayer-inductors-for-automotive-power-over-coax-circuits/", "summary": "&#8211;  Delivers high impedance at frequencies up to 2 GHz &#8211;  Provides 1.7 to 2 times higher impedance than conventional components &#8211;  Compact 1608 size using multilayer processing technologies TDK Corporation (TSE:6762) expands the MLJ1608-G series (1.6 x 0.8 x 0.8 mm; L x W x T) of multilayer inductors for automotive power-over-coax (PoC) circuits. [&#8230;]"}, {"title": "Renesas Expands GaN Portfolio with First Low-Voltage GaN FETs for AI Data Centers and Robotics", "source": "EE Journal", "date": "2026-10-07", "url": "https://www.eejournal.com/industry_news/renesas-expands-gan-portfolio-with-first-low-voltage-gan-fets-for-ai-data-centers-and-robotics/", "summary": "Renesas Electronics Corporation (TSE:6723), a premier supplier of advanced semiconductor solutions, has expanded its GaN portfolio into low-voltage applications with its first family of 100V enhancement mode (E&#8211;mode) GaN-based discrete power transistors. The RTP100E005G1FL, RTP100E2P6G1FL, RTP100E1P8G1FL-DSC and RTP100E1P2G1FL-DSC low-voltage GaN FETs deliver ultra-fast switching speeds and enhanced thermal performance in efficiency-critical, high power density applications, [&#8230;]"}, {"title": "Zapata Quantum Joins IBM Quantum Network to Accelerate Mission-Driven Quantum Application Development", "source": "EE Journal", "date": "2026-10-07", "url": "https://www.eejournal.com/industry_news/zapata-quantum-joins-ibm-quantum-network-to-accelerate-mission-driven-quantum-application-development/", "summary": "Zapata Quantum (OTCQB: ZPTA) (“Zapata” or the “Company”) today announced it has joined the IBM Quantum Network with plans to use IBM’s world-class quantum computers with Zapata’s deep expertise in use-case discovery and application development. The Company’s effort aims to help close the quantum application gap by translating advances in quantum computing into mission-critical applications [&#8230;]"}, {"title": "Userful Expands Infinity Platform With Four New Applications  for Mission-Critical Operations", "source": "EE Journal", "date": "2026-10-07", "url": "https://www.eejournal.com/industry_news/userful-expands-infinity-platform-with-four-new-applications-for-mission-critical-operations/", "summary": "Userful Corporation today announced four new applications for its Infinity Platform, expanding how mission-critical operations teams automate workflows, communicate during incidents and interact with operational data. The new applications include React, a no-code workflow automation engine; Notifications, an omnichannel communications capability; uTouch, a touchscreen interface for frontline operations; and uConduct 2.0, an operator workstation with [&#8230;]"}, {"title": "Keysight and Research Institutions Simplify Testing of Next-Generation Semiconductor Devices", "source": "EE Journal", "date": "2026-10-07", "url": "https://www.eejournal.com/industry_news/keysight-and-research-institutions-simplify-testing-of-next-generation-semiconductor-devices/", "summary": "Keysight Technologies, Inc. (NYSE: KEYS) has collaborated with the University of Glasgow, the National Physical Laboratory (NPL), and MPI Corporation to develop a new approach to broadband characterization of next-generation sub-terahertz (sub-THz) semiconductor devices. Together, the organizations demonstrated continuous on-wafer characterization of indium phosphide high-electron-mobility transistors (InP HEMTs) from near DC to 250 GHz in [&#8230;]"}, {"title": "XIMEA MU003TG-SY-UC – A miniature, modular 0.3MP USB 3.0 ToF Sensor based on Sony IMX556", "source": "CNX Software", "date": "2026-10-06", "url": "https://www.cnx-software.com/2026/10/06/ximea-mu003tg-sy-uc-a-miniature-modular-0-3mp-usb-3-0-tof-sensor-based-on-sony-imx556/", "summary": "<div><img alt=\"XIMEA MU003TG SY UC A miniature 0.3MP Sony IMX556 ToF Sensor with USB 3.0 interface\" class=\"attachment-medium size-medium wp-post-image\" height=\"480\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/10/XIMEA-MU003TG-SY-UC-A-miniature-0.3MP-Sony-IMX556-ToF-Sensor-with-USB-3.0-interface-720x480.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>The XIMEA MU003TG-SY-UC is a miniature industrial Time-of-Flight (ToF) camera with a 0.3MP Sony IMX556 CMOS sensor, global shutter, 640 × 480 resolution, and a 60 FPS frame rate. Its compact 26.4 × 26.4 × 28.67 mm enclosure and 31-gram weight make it suitable for space-limited embedded vision systems, robotics, UAVs, kiosks, 3D scanning, face recognition, and other machine-vision applications. The module uses a USB 3.2 Gen 1 interface through a 14-pin I-PEX Cabline SS connector for data, power, and control. A separate 10-pin Cabline V connector provides synchronization with external VCSEL illumination. The camera does not include an illumination source or optical band-pass filter, so these components must be provided separately for depth sensing. XIMEA MU003TG-SY-UC specifications: Sensor &#8211; Sony IMX556 CMOS Time-of-Flight sensor, global shutter, no on-sensor filter Resolution &#8211; 0.3 megapixels (640 × 480); active area 6.4 × 4.8 mm Pixel Size &#8211; 10 µm x 10 [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/10/06/ximea-mu003tg-sy-uc-a-miniature-modular-0-3mp-usb-3-0-tof-sensor-based-on-sony-imx556/\">XIMEA MU003TG-SY-UC &#8211; A miniature, modular 0.3MP USB 3.0 ToF Sensor based on Sony IMX556<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Save $70 on GEEKOM A5 Pro 2026 Edition mini PC during Prime Day Sale (Sponsored)", "source": "CNX Software", "date": "2026-10-06", "url": "https://www.cnx-software.com/2026/10/06/save-70-on-geekom-a5-pro-2026-edition-mini-pc-for-prime-day-sale/", "summary": "<div><img alt=\"GEEKOM mini PC Prime Day 2026 deals\" class=\"attachment-medium size-medium wp-post-image\" height=\"405\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/10/GEEKOM-mini-PC-Prime-Day-2026-deals-720x405.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>The GEEKOM A5 Pro 2026 Edition is a pocket-sized 0.47L mini PC available at a $70 discount for the company&#8217;s Prime Day Sale until October 7. Powered by the 6-core Ryzen 5 7530U (up to 4.5GHz), it handles browsing, documents, video calls, and AI-agent tasks such as drafting, summarizing, and planning with ease. Dual HDMI 2.0 and dual USB-C ports support up to four displays (or one 8K display), enabling efficient multi-window workflows. Meanwhile, dual SO-DIMM slots (up to 64GB) and dual M.2 slots (up to 5TB total) provide plenty of room for future upgrades. With 2.5GbE, Wi-Fi 6E, six USB ports, an SD card reader, and VESA mounting support, along with an aluminum body that has passed 339 reliability tests, the A5 Pro is a quiet, clutter-free desktop companion for offices and home workspaces running Windows 11 Pro or Linux. Backed by GEEKOM’s 3-year warranty, the A5 Pro is [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/10/06/save-70-on-geekom-a5-pro-2026-edition-mini-pc-for-prime-day-sale/\">Save $70 on GEEKOM A5 Pro 2026 Edition mini PC during Prime Day Sale (Sponsored)<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Innodisk Unveils Industrial DDR5 8000 RDIMM", "source": "Embedded.com", "date": "2026-10-06", "url": "https://www.embedded.com/innodisk-unveils-industrial-ddr5-8000-rdimm/", "summary": "<p>Innodisk Corp. has introduced an industrial-grade DDR5 8000 RDIMM designed for compute-intensive applications including edge AI, enterprise servers, and high-performance computing. The module operates at data transfer rates of up to 8000 MT/s, representing an 11.1% increase over the previous generation, and is available in capacities from 16 GB to 64 GB. The higher transfer [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/innodisk-unveils-industrial-ddr5-8000-rdimm/\">Innodisk Unveils Industrial DDR5 8000 RDIMM<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "Why Physical Edge Computing Could Be AI's Next Frontier", "source": "Embedded.com", "date": "2026-10-06", "url": "https://www.embedded.com/why-physical-edge-computing-could-be-ais-next-frontier/", "summary": "<p>Artificial intelligence is rapidly moving from the data center to the edge. Personal electronic devices, industrial controllers, cameras, vehicles, and a multitude of connected devices more frequently perform AI inference locally rather than delegating the relevant tasks to the cloud. The next step of the journey is even more impactful: bringing intelligence to the physical [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/why-physical-edge-computing-could-be-ais-next-frontier/\">Why Physical Edge Computing Could Be AI’s Next Frontier<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "Qorvo® Sets Benchmark with New X-Band RF Front-end Solution Tailored for Radar Systems", "source": "EE Journal", "date": "2026-10-06", "url": "https://www.eejournal.com/industry_news/qorvo-sets-benchmark-with-new-x-band-rf-front-end-solution-tailored-for-radar-systems/", "summary": "Qorvo® (Nasdaq: QRVO), a leading global provider of connectivity and power solutions, today announced an X-band front-end solution that combines high transmit output with low-noise, high-linearity receive performance for active electronically scanned array (AESA) radar. Developed around a quad architecture, the solution reduces RF content inside the array lattice. System Level X-Band Architecture X-band radar [&#8230;]"}, {"title": "OMNIVISION Launches Industry’s First 2.2-micron Global Shutter HDR Sensor for Flagship Industrial and Robotics Machine Vision Cameras", "source": "EE Journal", "date": "2026-10-06", "url": "https://www.eejournal.com/industry_news/omnivision-launches-industrys-first-2-2-micron-global-shutter-hdr-sensor-for-flagship-industrial-and-robotics-machine-vision-cameras/", "summary": "OMNIVISION, a leading global developer of semiconductor solutions, including advanced digital imaging, analog, and display technology, today announced the industry’s first 2.2-micron (µm) 5-megapixel (MP) global shutter (GS) high dynamic range (HDR) CMOS image sensor that is purpose-built for industrial machine vision applications, such as barcode scanners, factory automation, compact AI cameras and humanoid robotics, [&#8230;]"}, {"title": "Infineon completes acquisition of C2i Semiconductors to expand innovation capabilities in AI data center power management solutions", "source": "EE Journal", "date": "2026-10-06", "url": "https://www.eejournal.com/industry_news/infineon-completes-acquisition-of-c2i-semiconductors-to-expand-innovation-capabilities-in-ai-data-center-power-management-solutions/", "summary": "Acquisition strengthens Infineon’s leadership in power solutions for AI data centers and accelerates software-defined power architectures from grid to core C2i Semiconductors adds highly differentiated expertise in intelligent digital power management, multiphase controllers and system-level power architectures, including next-generation vertical power delivery solutions Transaction expands Infineon’s innovation footprint in India and further strengthens its global [&#8230;]"}, {"title": "Saelig Introduces MegiQ RMS For Full 3D Antenna Radiation Measurements for Labs", "source": "EE Journal", "date": "2026-10-06", "url": "https://www.eejournal.com/industry_news/saelig-introduces-megiq-rms-for-full-3d-antenna-radiation-measurements-for-labs/", "summary": "Saelig Company, Inc. announces the MegiQ RMS 3D Antenna Measurement System. Engineered for wireless product developers, antenna designers, and IoT engineers, the RMS 3D system delivers full spherical radiation pattern analysis, Total Radiated Power (TRP) calculations, and multi-frequency sweeps directly on an engineer&#8217;s workbench or standard lab environment. The incorporated turntable system lets RMS users measure [&#8230;]"}, {"title": "TASKING Joins SDVerse to Advance Safety-Critical Embedded Software Development for Software-Defined Vehicles", "source": "EE Journal", "date": "2026-10-06", "url": "https://www.eejournal.com/industry_news/tasking-joins-sdverse-to-advance-safety-critical-embedded-software-development-for-software-defined-vehicles/", "summary": "TASKING, a global leader in high-performance embedded software development tools, today announced that it has joined SDVerse, the automotive industry’s first B2B marketplace for automotive software. Through its participation in SDVerse, TASKING will make its automotive software development capabilities more accessible to OEMs and Tier 1 suppliers developing safe, secure and increasingly complex software-defined vehicles. [&#8230;]"}, {"title": "DEBIX M8391-01 industrial SBC features MediaTek Genio 720 SoC with 9 TOPS NPU, dual-display support", "source": "CNX Software", "date": "2026-10-05", "url": "https://www.cnx-software.com/2026/10/05/debix-m8391-01-industrial-sbc-features-mediatek-genio-720-soc-with-9-tops-npu-dual-display-support/"
