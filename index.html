ieee.org/ukraine-killer-drones\" target=\"_self\">enemy UAVs that can’t be stopped by jamming<\/a> systems that still provide some protection today.<\/p><p>“The low production cost of strike drones will mean that UGVs will have to endure a barrage of strikes,” Lange says, “That might be too much. The question is whether you can make UGVs more survivable on the frontline both in terms of command and control and the actual survivability of that many strikes.”<\/p><p>Still, he thinks there’s “no path back from UGVs.” The idea of distributing a whole range of tasks in the past performed by a single large and expensive tank to a fleet of small, cheap UGVs provides more resilience against the omnipresent drones. Moreover, although many international commentators now say that Russia appears to be losing, the war grinds on—and so does the cat-and-mouse game of lethal innovation.<\/p>"}, {"title": "Video Friday: A World Cup for Robots", "source": "IEEE Spectrum Robotics", "date": "2026-07-10", "url": "https://spectrum.ieee.org/video-friday-robot-world-cup", "summary": "<img src=\"https://spectrum.ieee.org/media-library/humanoid-robots-play-soccer-as-a-ball-flies-toward-the-goal-in-a-tournament-arena.jpg?id=67119515&amp;width=1245&amp;height=700&amp;coordinates=0%2C312%2C0%2C313\" /><br /><br /><p><span><a href=\"https://spectrum.ieee.org/tag/video-friday\" target=\"_blank\">Video Friday<\/a> is your weekly selection of <a href=\"https://spectrum.ieee.org/video-friday-robot-grippers\" target=\"_blank\">awesome robotics videos<\/a>, collected by your friends at <\/span><em>IEEE Spectrum<\/em><span> robotics. We also post a weekly calendar of upcoming robotics events for the next few months. Please <\/span><a href=\"mailto:automaton@ieee.org?subject=Robotics%20event%20suggestion%20for%20Video%20Friday\">send us your events<\/a><span> for inclusion.<\/span><\/p><h5><a href=\"https://roboticsconference.org/\">RSS 2026<\/a>: 13–17 July 2026, SYDNEY<\/h5><h5><a href=\"https://mrs.fel.cvut.cz/summer-school-2026/\">Summer School on Multi-Robot Systems<\/a>: 29 July–4 August 2026, PRAGUE<\/h5><h5><a href=\"https://actuate.foxglove.dev/\">Actuate 2026<\/a>: 18–19 August 2026, SAN FRANCISCO<\/h5><h5><a href=\"https://2026.ieee-iros.org/\">IROS 2026<\/a>: 27 September–1 October 2026, PITTSBURGH<\/h5><h5><a href=\"https://humanoidssummit.com/\">Humanoids Summit Seoul<\/a>: 22–23 September 2026, SEOUL<\/h5><p>Enjoy today’s videos!<\/p><div class=\"horizontal-rule\"><\/div><div><span style=\"display: none;\"> <\/span><\/div><blockquote class=\"rm-anchors\" id=\"xuedf0fmame\"><em>For the first time, two full teams of humanoid robots played an 11-vs-11 soccer match on hardware, bringing one of robotics’ most ambitious long-term visions closer to reality. Never before have two full-sized humanoid robot teams played a soccer game against each other.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.robocup.org/news/192\">RoboCup<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"9xjhrkpcbgi\"><em>Engineers at MIT and EPFL in Lausanne, Switzerland, have designed a robot that can swim underwater, and flap out of the water to continue flying through air, much like a diving bird. The robot can help scientists study the mechanics that enable these actions in aquatic aviators and may help launch a new class of aerial-aquatic drones and vehicles.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://news.mit.edu/2026/new-flapping-robot-swims-and-flies-like-diving-bird-0709\">MIT<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"qryxv3csrea\"><em>We’re excited to announce our breakthrough robotic hands for the NEO platform: hands that match or exceed human-level dexterity, strength, safety, and reliability. Designed from the ground up, these 25-DoF hands combine 25 fully actuated degrees of freedom with a tendon-driven system, rich tactile sensing, and built-in compliance. The result is a hand capable of true in-hand manipulation, precision tool use, and delicate interaction.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.1x.tech/discover/neos-hands\">1X<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"zjlr7m91yue\"><em>This match, Tech United played against IRIS at the mid size league at RoboCup 2026 in Incheon South-Korea.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://techunited.nl/?page_id=2135&amp;lang=en\">Tech United<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"ezplxk78cfk\"><em>Atlas arrived pitchside at NYNJ Stadium in front of 80,000 people gathered to see Brazil vs Norway. After performing some of the sport’s most memorable player celebrations, Atlas helped kick-off the second half by delivering the match ball!<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://bostondynamics.com/blog/can-football-teach-a-robot-to-move/\">Boston Dynamics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"k7_acxnvrdi\"><em>Navigating discrete terrain such as stepping stones remains a major challenge for legged robots. Conventional approaches often rely on dense environment reconstruction from cameras or LiDAR, which can be affected by latency, occlusions, and significant computational overhead. We show that proximity sensors integrated into the bottom of a quadruped’s feet enable safe, terrain-seeking autonomous locomotion.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://arxiv.org/abs/2606.31912\">Paper<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"xsrc3tdzqv4\"><em>On this holiday, Digit is on grill duty. It turns out precise force control is good for more than payload handling. Happy 4th of July from all of us at Agility.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.agilityrobotics.com/\">Agility<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"yyjmb-lgp8o\"><em>We’ve created GEN-1, our latest milestone in scaling robot learning. We believe it to be the first general-purpose AI model that crosses a new performance threshold: mastery of simple physical tasks. It improves average success rates to 99% on tasks where previous models achieve 64%, completes tasks roughly 3x faster than state of the art, and requires only 1 hour of robot data for each of these results. GEN-1 unlocks commercial viability across a broad range of applications—and while it cannot solve all tasks today, it is a significant step towards our mission of creating generalist intelligence for the physical world.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://generalistai.com/blog/gen-1\">Generalist<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"_wgnmkmvels\">4 years at Figure.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.figure.ai/news\">Figure<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"cmcvaclf9bm\"><em>Reachy Mini is becoming your real AI companion. The Conversation App makes it able to talk fluently with you, help you with your to-do list, remind you of important tasks, and even chat about music. Long-term memory, voice interaction, always ready to help.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://huggingface.co/reachy-mini\">Reachy Mini<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"p8u_4v8suoq\">Is this sort of thing now a real job for humanoid robots, then?<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://shop.unitree.com/collections/humanoid-robot\">Unitree<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"lad1wzntj6e\">Quite a story, but is it a real job?<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://en.engineai.com.cn/product-t800\">EngineAI<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"tsdjodthhnk\">If you have a cute animal logo for your research I will always share it.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://patripfr.github.io/bievr-lio/\">BIEVR-LIO<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"kg3hwbaioda\">This is very delicate work, although the real challenge would be picking those nuts out of a jumbled bin full of randomly sized nuts, which is how most of us live our lives.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://sanctuary.ai/\">Sanctuary<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"wdf3borclra\">Not for me, thank you, although I’m not saying that most of the other humanoid robots out there are any better looking, fundamentally.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.ubtrobot.com/en/\">UBTECH<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"jqi_ucwhe2c\"><em>Robotics professor, Dr. Christian Hubicki, judges robot soccer skills while knowing very little about soccer himself.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.optimalroboticslab.com/\">ORL<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"qbm9xvrq7tg\"><em>In this presentation, Brendan Schulman, Vice President of Policy at Boston Dynamics, outlines the critical role of government engagement in driving the success of the humanoid robotics industry. He demonstrates how legged robots like the Spot quadruped and Atlas humanoid are moving beyond factory settings to deliver real-world value in infrastructure inspection, industrial manufacturing, and public safety. Schulman highlights the intersection of AI and robotics, showcasing how large behavioral models and reinforcement learning enable robots to navigate slippery floors and autonomously avoid workplace hazards. Ultimately, he calls for a proactive national robotics strategy focused on workforce training, safety standards, and ethical frameworks to support supply chain resilience and global competitiveness.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://humanoidssummit.com/\">Humanoids Summit<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div>"}, {"title": "AI² Robotics raises $735M at $3B valuation for wheeled humanoid robots", "source": "Robotics Business Review", "date": "2026-07-10", "url": "https://www.therobotreport.com/ai%c2%b2-robotics-raises-735m-3b-valuation-wheeled-humanoid-robots/", "summary": "<p>Shenzhen’s Ai2 Robotics raised $735 million at a $2.8 billion valuation, backed by state, corporate, and financial giants.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/ai%c2%b2-robotics-raises-735m-3b-valuation-wheeled-humanoid-robots/\">AI² Robotics raises $735M at $3B valuation for wheeled humanoid robots<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "XTEND secures U.S. patent for autonomous navigation technology", "source": "Robotics Business Review", "date": "2026-07-10", "url": "https://www.therobotreport.com/xtend-secures-u-s-patent-autonomous-navigation-technology/", "summary": "<p>XTEND said the newly granted patent expands its portfolio supporting autonomous navigation, operator assistance, and mission execution.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/xtend-secures-u-s-patent-autonomous-navigation-technology/\">XTEND secures U.S. patent for autonomous navigation technology<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "How Path Robotics uses AI to optimize robotic welding", "source": "Robotics Business Review", "date": "2026-07-10", "url": "https://www.therobotreport.com/how-path-robotics-uses-ai-optimize-robotic-welding/", "summary": "<p>CEO Andy Lonsberry explains how Path Robotics applies AI to welding, and UC San Diego professor Michael Yip discusses robot learning.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/how-path-robotics-uses-ai-optimize-robotic-welding/\">How Path Robotics uses AI to optimize robotic welding<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Beyond da Vinci: Why versatile humanoid robots are the next frontier in surgery", "source": "Robotics Business Review", "date": "2026-07-09", "url": "https://www.therobotreport.com/beyond-da-vinci-why-versatile-humanoid-robots-are-next-frontier-surgery/", "summary": "<p>For the first time, teleoperated humanoid robots successfully performed surgeries during a UC San Diego preclinical trial.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/beyond-da-vinci-why-versatile-humanoid-robots-are-next-frontier-surgery/\">Beyond da Vinci: Why versatile humanoid robots are the next frontier in surgery<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Rollon launches two telescopic rails with integrated magnets", "source": "Robotics Business Review", "date": "2026-07-09", "url": "https://www.therobotreport.com/rollon-launches-two-telescopic-rails-integrated-magnets/", "summary": "<p>Rollon said the magnets deliver improved load management, smoother extension, and increased durability, even under intensive operating conditions.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/rollon-launches-two-telescopic-rails-integrated-magnets/\">Rollon launches two telescopic rails with integrated magnets<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Calling all robotics startups: apply to RoboBusiness Startup Alley", "source": "Robotics Business Review", "date": "2026-07-09", "url": "https://www.therobotreport.com/calling-all-robotics-startups-apply-to-robobusiness-startup-alley/", "summary": "<p>We're looking for robotics startups that are creating a full system, component, or software system to show off their work at RoboBusiness.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/calling-all-robotics-startups-apply-to-robobusiness-startup-alley/\">Calling all robotics startups: apply to RoboBusiness Startup Alley<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "ForSight Robotics’ road to performing a fully robotic cataract surgery", "source": "Robotics Business Review", "date": "2026-07-09", "url": "https://www.therobotreport.com/forsight-robotics-road-to-performing-a-fully-robotic-cataracts-surgery/", "summary": "<p>ForSight Robotics' JASPER Platform assists surgeons with cataract surgeries, while still leaving the power in the surgeon's hands.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/forsight-robotics-road-to-performing-a-fully-robotic-cataracts-surgery/\">ForSight Robotics&#8217; road to performing a fully robotic cataract surgery<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "ENCY Software and Stäubli Robotics partner to simplify robot programming", "source": "Robotics Business Review", "date": "2026-07-08", "url": "https://www.therobotreport.com/ency-software-staubli-robotics-partner-simplify-robot-programming/", "summary": "<p>ENCY Software and Stäubli Robotics have signed a global agreement to make robot programming more intuitive, faster, and more accessible.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/ency-software-staubli-robotics-partner-simplify-robot-programming/\">ENCY Software and Stäubli Robotics partner to simplify robot programming<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "NVIDIA and Hugging Face bring new models and frameworks to LeRobot", "source": "Robotics Business Review", "date": "2026-07-08", "url": "https://www.therobotreport.com/nvidia-hugging-face-bring-new-models-frameworks-lerobot/", "summary": "<p>Hugging Face LeRobot is an open-source robotics library for training, running, and sharing robot datasets, models, policies, and workflows.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/nvidia-hugging-face-bring-new-models-frameworks-lerobot/\">NVIDIA and Hugging Face bring new models and frameworks to LeRobot<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Tickets, geofences, and 1M miles: The new reality of California AV compliance", "source": "Robotics Business Review", "date": "2026-07-08", "url": "https://www.therobotreport.com/tickets-geofences-1m-miles-new-reality-california-av-compliance/", "summary": "<p>Guident CEO Harald Braun breaks down the new AV mandates in California mandates and how they will affect the driverless industry.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/tickets-geofences-1m-miles-new-reality-california-av-compliance/\">Tickets, geofences, and 1M miles: The new reality of California AV compliance<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "NVIDIA and Hugging Face Bring New Models and Frameworks to LeRobot for the Open Robotics Community", "source": "NVIDIA Robotics", "date": "2026-07-07", "url": "https://blogs.nvidia.com/blog/hugging-face-lerobot-models-frameworks-open-robotics/", "summary": "Open source AI has shown how quickly developers can innovate when models, data and tools are shared. Robotics has the same opportunity, but advancements in physical AI development can still be gated by costly and fragmented resources, from large datasets and robot foundation models to simulation, compute and validation tools. NVIDIA and Hugging Face are [&#8230;]"}, {"title": "Tesollo initiates IPO process while developing humanoid hands", "source": "Robotics Business Review", "date": "2026-07-07", "url": "https://www.therobotreport.com/tesollo-initiates-ipo-process-developing-humanoid-hands/", "summary": "<p>Tesollo, a South Korean robotic hand specialist, has officially begun preparations for its initial public offering.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/tesollo-initiates-ipo-process-developing-humanoid-hands/\">Tesollo initiates IPO process while developing humanoid hands<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "HIVE brings in $15M to build physical AI for industrial machines", "source": "Robotics Business Review", "date": "2026-07-07", "url": "https://www.therobotreport.com/hive-brings-in-15m-to-build-physical-ai-for-industrial-machines/", "summary": "<p>HIVE has deployed its technology across several sites in Scandinavia, operating autonomously across different machines.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/hive-brings-in-15m-to-build-physical-ai-for-industrial-machines/\">HIVE brings in $15M to build physical AI for industrial machines<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "ABB Robotics includes vSLAM navigation in F712 autonomous forklift", "source": "Robotics Business Review", "date": "2026-07-07", "url": "https://www.therobotreport.com/abb-robotics-includes-vslam-navigation-f712-autonomous-forklift/", "summary": "<p>The Flexley Stacy F712 forklift uses vision to navigate, works with other robots, and complies with safety standards, says ABB Robotics.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/abb-robotics-includes-vslam-navigation-f712-autonomous-forklift/\">ABB Robotics includes vSLAM navigation in F712 autonomous forklift<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "IEEE Honors Robotics Pioneer Toshio Fukuda", "source": "IEEE Spectrum Robotics", "date": "2026-07-07", "url": "https://spectrum.ieee.org/ieee-honors-toshio-fukuda", "summary": "<img src=\"https://spectrum.ieee.org/media-library/three-men-in-suits-onstage-smiling-as-one-presents-an-award-medal-in-a-box.jpg?id=67107362&amp;width=1245&amp;height=700&amp;coordinates=0%2C469%2C0%2C469\" /><br /><br /><p><a href=\"https://ethw.org/Toshio_Fukuda\" rel=\"noopener noreferrer\" target=\"_blank\">Toshio Fukuda<\/a> has been blazing trails for most of his career. He is considered to be one of the most prolific scholars in <a href=\"https://spectrum.ieee.org/topic/robotics/\" target=\"_self\">robotics<\/a>, writing more than 2,000 research papers and authoring several books on the field. He’s an influential figure thanks to his pioneering work developing biomedical robotic systems, industrial robots, micro-nano robotics, mechatronics, and AI-driven automation.<\/p><p>Fukuda launched one of the first robotics conferences, the <a href=\"https://www.ieee-ras.org/conferences-workshops/financially-co-sponsored/iros/\" rel=\"noopener noreferrer\" target=\"_blank\">IEEE/RSJ International Conference on Intelligent Robots and Systems<\/a> (IROS). It is still popular almost 40 years later.<\/p><h3>Toshio Fukuda<\/h3><br /><p><strong>Employer<\/strong><\/p><p>Egypt-Japan University of Science and Technology, in Alexandria<\/p>\n<p><strong>Title<\/strong><\/p><p>Professor and vice president of research<\/p>\n<p><strong>Member grade<\/strong><\/p><p>Life Fellow<\/p>\n<p><strong>Alma maters<\/strong><\/p><p>Waseda University, in Tokyo; University of Tokyo <\/p><p>An IEEE Life Fellow, he is a professor emeritus in the department of micro-nano systems engineering and a visiting professor at <a href=\"https://en.nagoya-u.ac.jp/\" rel=\"noopener noreferrer\" target=\"_blank\">Nagoya University<\/a>, in Japan, where he taught for nearly 25 years. Currently, he is a vice president of research at the <a href=\"https://ejust.edu.eg/\" rel=\"noopener noreferrer\" target=\"_blank\">Egypt-Japan University of Science and Technology<\/a>, in Alexandria, Egypt.<\/p><p>Within IEEE, Fukuda has held top volunteer positions including the organization’s highest office: He served as <a href=\"https://spectrum.ieee.org/u/toshio-fukuda\" target=\"_self\">IEEE president<\/a> in 2020, becoming the first person of Asian descent to hold the role.<\/p><p>He’s a former program director of Japan’s <a href=\"https://www.jst.go.jp/moonshot/en/about.html\" rel=\"noopener noreferrer\" target=\"_blank\">Moonshot program<\/a>, which by 2050 intends to develop advanced AI robots.<\/p><p>Born in Japan, Fukuda has been recognized by the country for his contributions to science with two of its highest awards: the <a href=\"https://en.wikipedia.org/wiki/Medals_of_Honor_(Japan)\" rel=\"noopener noreferrer\" target=\"_blank\">Medal of Honor with a purple ribbon<\/a> in 2015 and the <a href=\"https://en.wikipedia.org/wiki/Order_of_the_Sacred_Treasure\" rel=\"noopener noreferrer\" target=\"_blank\">Order of the Sacred Treasure<\/a> in 2022.<\/p><p>IEEE honored him with this year’s <a href=\"https://corporate-awards.ieee.org/award/ieee-richard-m-emberson-award/\" rel=\"noopener noreferrer\" target=\"_blank\">Richard M. Emberson Award<\/a> for “distinguished service advancing the technical objectives of IEEE, especially in the area of robotics.” The IEEE Board-level award is sponsored by the <a href=\"https://ta.ieee.org/technical-activities-board\" rel=\"noopener noreferrer\" target=\"_blank\">IEEE Technical Activities Board<\/a>. Fukuda received the award on 24 April at a <a href=\"https://spectrum.ieee.org/ieee-celebrates-honors-ceremony-2026\" target=\"_self\">ceremony<\/a> in New York City.<\/p><p>As a former IEEE president who has served as a master of ceremonies at several of the organization’s major award events, Fukuda noted that he is more accustomed to bestowing awards than receiving them.<\/p><p>“It’s very interesting to be on the receiving end,” he says.<\/p><h2>The journey into robotics research<\/h2><p>As a teenager, Fukuda spent his summer breaks teaching himself how to build things including transistor radios and steam engines.<\/p><p>“It was very nice to have a hands-on hobby and make these kinds of things myself,” he says. His experimentation led him to study engineering.<\/p><p>He earned a bachelor’s degree in engineering in 1971 from <a href=\"https://www.waseda.jp/top/en/\" rel=\"noopener noreferrer\" target=\"_blank\">Waseda University<\/a>, in Tokyo. He says one of his professors there—<a href=\"https://www.humanoid.waseda.ac.jp/history.html\" rel=\"noopener noreferrer\" target=\"_blank\">Ichiro Kato<\/a>, regarded as the father of Japanese robotics research—was a good mentor who made a positive impact.<\/p><p>Fukuda’s research interests were robotics and mechatronics, a field that combines robotics, electronics, computer science, and control systems.<\/p><p>He went on to earn a master’s degree and a doctorate in science from the <a href=\"https://www.u-tokyo.ac.jp/en/\" rel=\"noopener noreferrer\" target=\"_blank\">University of Tokyo<\/a>, in 1971 and 1977. During those years, he also attended <a href=\"https://www.yale.edu/\" rel=\"noopener noreferrer\" target=\"_blank\">Yale<\/a>, where he conducted research on advanced control theory in 1973.<\/p><p>He reflects fondly on his time at Yale: “It was a very nice environment and a kind of free-thinking atmosphere. It motivated me to study more.”<\/p><p class=\"pull-quote\">“IEEE doesn’t care who you are, what you do, what country you are from, or whether you are male or female. IEEE accepts people who have energy and passion.”<\/p><p>While at Yale, Fukuda served as an assistant to his advisor—which led him to consider a career in academia, he says, because he enjoyed the freedom that research work afforded him.<\/p><p>But he realized that such freedom comes with a price. University researchers are expected to raise the money that funds their work. He compares researchers to small-business owners who have to bring in money to keep their enterprise afloat.<\/p><p>That realization led him to select robotics as his field because he intended to develop technologies useful to industry, he says.<\/p><p>After earning his doctorate, he returned to Japan in 1977 to work as a research scientist at the government’s Mechanical Engineering Laboratory, later renamed the <a href=\"https://www.aist.go.jp/aist_e/about_aist/\" target=\"_blank\">National Institute of Advanced Industrial Science and Technology<\/a>, in Tsukuba.<\/p><p>“There was a lot of research going on at the lab, including practical robotics and theory,” he says.<\/p><p>He left Japan in 1979 to become a visiting research fellow at the <a href=\"https://www.uni-stuttgart.de/en/\" rel=\"noopener noreferrer\" target=\"_blank\">University of Stuttgart<\/a>, in Germany. During his year there, he studied systems, software problems, and related topics.<\/p><p>He returned to Japan and was hired as an associate professor of mechanical engineering at the <a href=\"https://www.tus.ac.jp/en/\" rel=\"noopener noreferrer\" target=\"_blank\">Tokyo University of Science<\/a>. He conducted research into practical uses for robots by visiting industrial plants. He decided to develop robots that inspect industrial equipment such as those used in assembly plants, oil refineries, and power stations—places that “can be hostile environments for humans,” he says.<\/p><p>His work drew interest from chemical, oil, and utility companies.<\/p><p>“I got a lot of money from them for this very practical application, which funded my research,” he says, laughing.<\/p><h2>Developing popular robotic systems<\/h2><p>Fukuda grew tired of making those robots, he says, so he switched to creating ones for scientific applications. He developed many techniques, but he probably is best known for his modular, <a href=\"https://www.sciencedirect.com/science/article/abs/pii/004579069290029D\" rel=\"noopener noreferrer\" target=\"_blank\">cellular robotic systems<\/a> (CEBOTs), which he introduced in 1985.<\/p><p>He has described how <a href=\"https://ieeexplore.ieee.org/search/searchresult.jsp?newsearch=true&amp;queryText=CEBOT\" rel=\"noopener noreferrer\" target=\"_blank\">CEBOTs work<\/a> in numerous papers published in the <a href=\"https://ieeexplore.ieee.org/Xplore/home.jsp\" rel=\"noopener noreferrer\" target=\"_blank\">IEEE Xplore Digital Library<\/a>.<\/p><p>The CEBOT system is composed of a number of autonomous robotic cells that stick together like interlocking <a href=\"https://www.lego.com/en-us\" rel=\"noopener noreferrer\" target=\"_blank\">Lego<\/a> plastic bricks, he says.<\/p><p>Each cell is a fundamental modular unit that has a function. When a simple task is given, the system can analyze it and generate the structure of the cellular manipulator. The cells connect to and detach from each other through connection mechanisms and cooperate mutually, creating complex structures and configurations.<\/p><p>“You start developing from the component-wise to the cell-wise to a small functional unit—and then you come up with clusters that make bigger systems. We can make a society of robot beings like that,” he explained in his <a href=\"https://ethw.org/Oral-History:Toshio_Fukuda\" rel=\"noopener noreferrer\" target=\"_blank\">oral history<\/a> published on the <a href=\"https://ethw.org/Main_Page\" rel=\"noopener noreferrer\" target=\"_blank\">Engineering and Technology History Wiki<\/a>. “It’s a distributed robotic system, a self-organized robotic system, and also an evolutionary robotic system.<\/p><p>“It’s also a fault-tolerant robot system because if something is wrong, you just remove those things and make a new one. You keep the system working. That’s a great thing.”<\/p><p>Today CEBOTs are used for a variety of tasks such as delivering medication in hospitals, assisting with planting crops, and transporting products in distribution centers. Check out <a href=\"https://spectrum.ieee.org/\" target=\"_self\"><em><em>IEEE Spectrum<\/em><\/em><\/a>’s <a href=\"https://robotsguide.com/\" rel=\"noopener noreferrer\" target=\"_blank\">Robots Guide<\/a> for news from the world of robotics.<\/p><p>In 1989 Fukuda joined Nagoya University as a professor of mechanical engineering and micro-nano systems engineering. During his 24-year career there, he was director of the university’s <a href=\"https://en.nagoya-u.ac.jp/assets/pdf/pages/about/communications/schools/about_communications_schools_7.pdf\" rel=\"noopener noreferrer\" target=\"_blank\">Center for Micro-Nano Mechatronics<\/a>. He developed a long list of technologies at the university, including many for medical applications. He also conducted groundbreaking research into intelligent robotic systems and micro- and nano-robotics.<\/p><p>Another technology he is known for is <a href=\"https://ieeexplore.ieee.org/document/240556\" rel=\"noopener noreferrer\" target=\"_blank\">brachiation robots<\/a>, which he helped develop in 1988. He calls them <em><em>monkey robots<\/em><\/em> because they’re based on the pendulum-like movement of monkeys swinging from tree to tree. The gravity-based locomotion enables continuous movement.<\/p><p>Brachiation robots now are inspecting high-voltage transmission towers and bridges, searching damaged buildings for survivors, and performing maintenance on pipelines and cables.<\/p><p>Fukuda retired from the university in 2013 and was named professor emeritus.<\/p><p>He didn’t stay retired for long, though. He next held a teaching appointment at <a href=\"https://www.meijo-u.ac.jp/english/\" rel=\"noopener noreferrer\" target=\"_blank\">Meijo University<\/a>, in Nagoya, until he left in 2022 to join the Egypt-Japan University.<\/p><h2>A prominent volunteer<\/h2><p>He joined IEEE in 1980 at the encouragement of one of his research advisors, Professor <a href=\"https://ethw.org/Fumio_Harashima\" rel=\"noopener noreferrer\" target=\"_blank\">Fumio Harashima<\/a>, now an IEEE Life Fellow. After attending conferences and reading the organization’s publications, Fukuda says, he looked forward to becoming more involved.<\/p><p>“I wanted to know how to organize a conference and how to edit a paper for one of its <em><em>Transactions<\/em><\/em>,” he says. “I wanted to know what was going on from inside the organization, not just the outside.”<\/p><p>In 1988 he was the founding chair and organizer of IROS, in Tokyo. The conference had 330 attendees that year, and was supported by Harashima. Today it is one of the largest and most prestigious conferences on the topic, attracting more than 9,000 people annually. Out of 120,000 conferences, it was the only conference in the <a href=\"https://www.nature.com/nature-index/faq\" rel=\"noopener noreferrer\" target=\"_blank\">Nature Index<\/a> database for this year, Fukuda says.<\/p><p>In 1996 he and other members launched <a href=\"https://ieeexplore.ieee.org/xpl/RecentIssue.jsp?punumber=3516\" rel=\"noopener noreferrer\" target=\"_blank\"><em><em>IEEE Transactions on Mechatronics<\/em><\/em><\/a>.<\/p><p>He was the founding president of the <a href=\"https://ieeenano.org/\" rel=\"noopener noreferrer\" target=\"_blank\">IEEE Nanotechnology Council<\/a>, which was established in 2002. He is considered a pioneer in nanotechnology research, particularly regarding how it relates to robotics.<\/p><p>Over the years, he has held numerous volunteer positions on IEEE editorial boards and committees.<\/p><p>He was the 1998–1999 president of the <a href=\"https://www.ieee-ras.org/\" rel=\"noopener noreferrer\" target=\"_blank\">IEEE Robotics and Automation Society<\/a>, becoming the first non-U.S. member to hold the title.<\/p><p>He was director of <a href=\"https://ta.ieee.org/society-council-resources/society-and-council-operations/divisions-society-groupings\" rel=\"noopener noreferrer\" target=\"_blank\">IEEE Division X<\/a> (2001–2002 and 2017–2018), which covers intelligent systems, biological engineering, robotics, control systems, and photonic technologies. He served as the 2013–2014 director of <a href=\"https://www.ieeer10.org/\" rel=\"noopener noreferrer\" target=\"_blank\">IEEE Region 10<\/a> (Asia-Pacific).<\/p><p>As the 2020 IEEE president, Fukuda saw the organization through the early part of the <a href=\"https://spectrum.ieee.org/ieee-presidents-column-strength-and-solidarity-in-responding-to-the-challenges-of-covid19\" target=\"_self\">COVID-19 pandemic<\/a>. Because of travel restrictions, he realized IEEE should change how it offered its in-person services, specifically educational programs. He encouraged <a href=\"https://ea.ieee.org/ea-programs\" rel=\"noopener noreferrer\" target=\"_blank\">IEEE Educational Activities<\/a> to develop an online learning platform. The <a href=\"https://spectrum.ieee.org/ieee-president-lets-focus-on-continuing-education\" target=\"_self\">IEEE Learning Network<\/a> started with just three courses and now offers nearly 2,000 courses, webinars, and learning materials.<\/p><h2>An award-winning member<\/h2><p>The Emberson Award joins a slew of other recognitions Fukuda has received from IEEE. They include several from the IEEE Robotics and Automation Society: a 2004 <a href=\"https://www.ieee-ras.org/awards-recognition/society-awards/pioneer-in-robotics-and-automation-award/\" rel=\"noopener noreferrer\" target=\"_blank\">Pioneer Award<\/a>, a 2009 <a href=\"https://www.ieee-ras.org/2026-ieee-ras-award-recipients-announced/\" rel=\"noopener noreferrer\" target=\"_blank\">Saridis Leadership Award<\/a>, and the 2011 <a href=\"https://www.ieee-ras.org/awards-recognition/conference-awards/iros-harashima-award-for-innovative-technologies/\" rel=\"noopener noreferrer\" target=\"_blank\">Harashima Award for Innovative Technologies<\/a>. He is also a recipient of the Board-level 2010 IEEE Robotics and Automation <a href=\"https://www.ieee-ras.org/awards-recognition/ieee-awards/ieee-robotics-and-automation-technical-field-award-tfa/\" rel=\"noopener noreferrer\" target=\"_blank\">Technical Field Award<\/a>.<\/p><p>He says he feels strongly that IEEE should be a diverse organization that is welcoming to all. As IEEE president, he led efforts to devise a <a href=\"https://spectrum.ieee.org/ieee-diversity-and-inclusion-efforts\" target=\"_self\">diversity, equity, and inclusion program<\/a>. Several policies, procedures, and bylaws were revised to give members a safe, inclusive place for discourse.<\/p><p>“It’s important for IEEE to make everyone feel comfortable,” he says. “DEI programs are important. All people should be equal. IEEE doesn’t care who you are, what you do, what country you are from, or whether you are male or female. IEEE accepts people who have energy and passion.<\/p><p>“It accepted me, from the Far East. That’s why I like it.”<\/p><p>You can learn more about Fukuda and his career from the <a href=\"https://ethw.org/Oral-History:Toshio_Fukuda\" rel=\"noopener noreferrer\" target=\"_blank\">oral history<\/a> conducted by the <a href=\"https://www.ieee.org/about/history-center\" rel=\"noopener noreferrer\" target=\"_blank\">IEEE History Center<\/a>.<\/p>"}, {"title": "RoboBusiness 2026 call for speakers closes soon", "source": "Robotics Business Review", "date": "2026-07-06", "url": "https://www.therobotreport.com/robobusiness-2026-opens-call-for-speakers/", "summary": "<p>RoboBusiness 2026, the premier event for developers of commercial robotics and those building robotics businesses, is seeking expert speakers.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/robobusiness-2026-opens-call-for-speakers/\">RoboBusiness 2026 call for speakers closes soon<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Quantum Systems raises $1.2B to expand drone production and deployments", "source": "Robotics Business Review", "date": "2026-07-06", "url": "https://www.therobotreport.com/quantum-systems-raises-1-2b-expand-drone-production-deployments/", "summary": "<p>Quantum plans to use the proceeds to expand production capacity, strengthen supply chain resilience, and more.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/quantum-systems-raises-1-2b-expand-drone-production-deployments/\">Quantum Systems raises $1.2B to expand drone production and deployments<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Kraken Robotics acquires Covelya Group for $615M", "source": "Robotics Business Review", "date": "2026-07-06", "url": "https://www.therobotreport.com/kraken-robotics-acquires-covelya-group-for-615m/", "summary": "<p>Covelya Group expands Kraken Robotics' product offerings and total addressable market in subsea technology.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/kraken-robotics-acquires-covelya-group-for-615m/\">Kraken Robotics acquires Covelya Group for $615M<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Boston Dynamics brings its legged robots to the FIFA World Cup", "source": "Robotics Business Review", "date": "2026-07-06", "url": "https://www.therobotreport.com/boston-dynamics-brings-its-legged-robots-to-the-fifa-world-cup/", "summary": "<p>Around the 2026 FIFA World Cup, Hyundai and Boston Dynamics have taught footwork to the Atlas humanoid, while the Spot robot is on patrol.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/boston-dynamics-brings-its-legged-robots-to-the-fifa-world-cup/\">Boston Dynamics brings its legged robots to the FIFA World Cup<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Humanoid says KinetIQ Ascend reinforcement learning approaches human-level dexterity", "source": "Robotics Business Review", "date": "2026-07-05", "url": "https://www.therobotreport.com/humanoid-announces-kinetiq-ascend-reinforcement-learning-approach/", "summary": "<p>Humanoid says its KinetIQ Ascend approach can reach 99.9% manipulation reliability at human speed and beyond for industrial tasks. <\/p>\n<p>The post <a href=\"https://www.therobotreport.com/humanoid-announces-kinetiq-ascend-reinforcement-learning-approach/\">Humanoid says KinetIQ Ascend reinforcement learning approaches human-level dexterity<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Context is king: How Avride uses cloud VLMs as a safety net for delivery robots", "source": "Robotics Business Review", "date": "2026-07-04", "url": "https://www.therobotreport.com/how-avride-uses-cloud-vlms-safety-net-delivery-robots/", "summary": "<p>Avride uses vision-language models, or VLMs, to improve the environmental awareness of its delivery robots.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/how-avride-uses-cloud-vlms-safety-net-delivery-robots/\">Context is king: How Avride uses cloud VLMs as a safety net for delivery robots<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Japan Pioneered Humanoid Robots—Can It Now Catch China?", "source": "IEEE Spectrum Robotics", "date": "2026-07-04", "url": "https://spectrum.ieee.org/humanoid-robots-japan", "summary": "<img src=\"https://spectrum.ieee.org/media-library/a-middle-aged-asian-man-seated-next-to-an-uncannily-similar-humanoid-robot-with-the-same-hairstyle-glasses-and-clothing.jpg?id=67080305&amp;width=1245&amp;height=700&amp;coordinates=0%2C187%2C0%2C188\" /><br /><br /><p>“In the future, the relationship between humans and robots will deepen, and the distinction between them will probably disappear.” This prediction, from one of the attendees at the recent <a href=\"https://humanoidssummit.com/agenda-2\" rel=\"noopener noreferrer\" target=\"_blank\">Humanoids Summit in Tokyo<\/a>, might have been unremarkable had it not come directly from an android that was first introduced to the world 20 years ago. <\/p><p><a href=\"https://eng.irl.sys.es.osaka-u.ac.jp/robot\" rel=\"noopener noreferrer\" target=\"_blank\">Geminoid HI-6<\/a> is the sixth-generation of a robot originally designed in 2006. The mechanical twin of Osaka University professor <a href=\"https://spectrum.ieee.org/the-amazing-androids-of-hiroshi-ishiguro\" target=\"_self\">Hiroshi Ishiguro<\/a>, Geminoid HI-6 is now equipped with a large language model trained on Ishiguro’s own writings and interviews. It has advanced conversational skills and can even have a chat with its creator, an eerie spectacle. But at the Humanoids Summit, Geminoid was one of the few humanoid robots from Japan, the country that pioneered the form factor.<\/p><p>While the event in Tokyo had only about 40 robots on display, Chinese systems outnumbered Japanese by roughly three to one. Some Japanese robotics firms were even using Chinese robots in their own technology demonstrations, something that would have been unthinkable in the recent past—one Japanese engineer described the situation as “sad.” The conference was a stark reminder of how Japan has ceded its early lead in humanoid robot development to overseas competitors, and the challenge it now faces to secure a place in an ecosystem increasingly dominated by general-purpose robots powered by AI. <\/p><p>Twenty-five years ago, Japan was turning out <a href=\"https://www.youtube.com/watch?v=ESLc26fNAe8\" target=\"_blank\">groundbreaking humanoids that were showstopping in their abilities<\/a>, but they were not commercialized as <a href=\"https://spectrum.ieee.org/japan-earthquake-more-robots-to-the-rescue\" target=\"_blank\">practical machines<\/a> in any meaningful way. Heavily influenced by science fiction and lacking practical applications, they were mostly expensive technology demonstrations that were eventually mothballed. What Japan retains, however, is robotics design and know-how, which it must leverage to be a key player in the rapidly evolving humanoid ecosystem. <\/p><h3>Learning to Walk—Then Standing Still<\/h3><p>To anyone who has seen recent videos of Chinese humanoids doing <a href=\"https://www.youtube.com/watch?v=R6T-Ea5CfRE\" rel=\"noopener noreferrer\" target=\"_blank\">kung-fu and synchronized acrobatics<\/a>, as well as<a href=\"https://www.bbc.com/news/videos/cz0e54yrppno\" rel=\"noopener noreferrer\" target=\"_blank\"> half-marathon races<\/a>, China’s remarkable progress in the field is nothing new. At the Humanoids Summit, Toyota showed a video of its <a href=\"http://toyotatimes.jp/en/newscast/188.html\" target=\"_blank\">latest basketball-playing robot<\/a>, and Honda exhibited its <a href=\"https://global.honda/jp/RandD/field/hgrx/honda-multi-fingered-hand/\" target=\"_blank\">latest robot hand<\/a>, but the full-scale humanoids on the floor were mostly Chinese–the kid-size <a href=\"https://www.booster.tech/booster-k1/\" rel=\"noopener noreferrer\" target=\"_blank\">K1 machines from Booster Robotics<\/a> of Beijing were dancing to Michael Jackson tunes. The full-scale <a href=\"https://robotsguide.com/robots/unitree-g1\" rel=\"noopener noreferrer\" target=\"_blank\">G1 humanoid from Unitree Robotics<\/a> of Hangzhou was also doing demos. <\/p><p>“You cannot sell these bipedal systems in Japan for safety and compliance reasons,” says Shuichi Nagao, a frequent visitor to China as CTO of <a href=\"https://www.omakase.ai/robotics\" rel=\"noopener noreferrer\" target=\"_blank\">Omakase Robotics<\/a>, a division of Zeals, a Japanese humanoid robot developer. Omakase was exhibiting a G1 modified with an external PC controller, a dextrous hand, a suction-cup manipulator and a sensor “hat” with an extra speaker, mic, and camera. <\/p><p>“In China, the government is pushing humanoid development. They didn’t have an industry 20 years ago. The people pushing it are young, in their 20s and 30s. It’s a really different mentality out there,” says Nagao. “Big players in Japan are still looking for use cases for humanoids. In China, they’re already doing mass production and reducing the cost, so other countries can’t compete with them anymore.”<\/p><p>Another Japanese company showing off G1 bots was summit sponsor GMO AI & Robotics, a subsidiary of Japanese internet company <a href=\"https://en.wikipedia.org/wiki/GMO_Internet\" rel=\"noopener noreferrer\" target=\"_blank\">GMO<\/a>. It’s using the robots in partnership with Japan Airlines to <a href=\"https://group.gmo/en/news/article/850/\" rel=\"noopener noreferrer\" target=\"_blank\">load and unload cargo containers<\/a> at Tokyo’s Haneda airport. The cargo project is a trial—like <a href=\"https://www.tokyoweekender.com/entertainment/tech-trends/ai-powered-robot-monk-buddharoid/\" rel=\"noopener noreferrer\" target=\"_blank\">many other humanoid experiments<\/a>—but the fact that Chinese machines have penetrated so far into Japan’s ecosystem <a href=\"https://www.amazon.com/dp/B001SARCOI?lv=shuf&amp;channelId=500&amp;plpRedirect=mhFallback\" rel=\"noopener noreferrer\" target=\"_blank\">upends a long history<\/a>. <\/p><p>In 1973, scientists at Waseda University in Tokyo built <a href=\"https://www.humanoid.waseda.ac.jp/booklet/kato_2.html\" rel=\"noopener noreferrer\" target=\"_blank\">WABOT-1<\/a>, considered the first full-scale humanoid robot, which was capable of slow bipedal locomotion, grasping objects, and simple communication. It inspired Honda’s groundbreaking Asimo humanoid, but Asimo was never commercialized. It was eventually retired in 2022, the year ChatGPT was released. Two years later, Unitree’s G1 went on sale for US $16,000.<\/p><p class=\"shortcode-media shortcode-media-rebelmouse-image\"> <img alt=\"A 65 centimeter tall bipedal robot, its design features the head of an anime-style girl with legs directly underneath.\" class=\"rm-shortcode\" id=\"706b9\" src=\"https://spectrum.ieee.org/media-library/a-65-centimeter-tall-bipedal-robot-its-design-features-the-head-of-an-anime-style-girl-with-legs-directly-underneath.jpg?id=67080329&amp;width=980\" /> <small class=\"image-media media-caption\">China’s High Torque Technology Co. showed off its Mini Pi biped, customized with an anime-inspired head, at Humanoids Summit in Tokyo. The regular version is priced at $3,500. <\/small><small class=\"image-media media-photo-credit\">Tim Hornyak<\/small><\/p><h3>Supply and Demand<\/h3><p>Japan’s development of humanoids happened before practical applications or widespread demand were in place, but bad timing is only part of the story—Japan also has a history of developing technologies that might appeal to domestic consumers but not necessarily those overseas. For example, decades after its highly engineered multifunction toilets first appeared, they have only recently found a <a href=\"https://www.nytimes.com/2025/05/29/business/toto-toilet-japan-bidet.html\" target=\"_blank\">following abroad<\/a>. <\/p><p>Japan’s humanoid prowess was partly built on the back of its legendary industrial automation, yet even that stronghold has eroded. Ani Kelkar, a partner from McKinsey & Company in Boston who produces analytical reports about the robotics industry, told the summit audience that while Japan occupied the top spot in the world in manufacturing robot density (the number of multipurpose industrial robots in operation per 10,000 employees) from at least 1994 to 2009, it then slipped to second in 2014, third in 2019, and fifth in 2024. In that year, South Korea was at the top of the leaderboard with a robot density of 1,220 compared to Japan’s 446. <\/p><p>The International Federation of Robotics <a href=\"https://ifr.org/ifr-press-releases/news/robot-density-surges-in-europe-asia-and-americas\" target=\"_blank\">estimates<\/a> China now has the most operational industrial robots in the world, with around 2 million total units, approximately 4.5 times more than Japan. “The annual installation numbers are impressive too: 54 percent of all robots installed worldwide in 2024 were deployed in China,” the IFR said in a release in April 2026. <\/p><p>“I think the loss of Japanese leadership is more to do with the rise of China as a manufacturing powerhouse including for sectors that Japan had high export levels,” Kelkar said in an email interview. “The recovery has not yet happened as Japan “missed” the rapid acceleration in AI for robotics and is now playing catch-up.”<\/p><h3>How Japan Can Adapt <\/h3><p>Kelkar believes Japan has a $100 billion opportunity in general-purpose robotics, which are machines that can perform a wide variety of tasks, and it cannot rely on the slower-growing industrial robot market, which is centered on factory machines that do one simple and predictable task like welding car parts. He points to a McKinsey <a href=\"https://www.mckinsey.com/industries/industrials/our-insights/japans-100-billion-opportunity-in-general-purpose-robotics#/\" target=\"_blank\">white paper<\/a> suggesting that while Japan has much of the hardware and technology experience needed to support general-purpose robot development, it must change its strategy to capture a larger share in AI, software, data collection, and robotics platforms.<\/p><p><a href=\"https://ogata-lab.jp/member/ogata.html\" target=\"_blank\">Tetsuya Ogata<\/a> is a professor of engineering and director of the Institute for AI and Robotics at Waseda University, the birthplace of humanoids in Japan. He briefed the summit on how a nonprofit he chairs, the AI Robot Association (<a href=\"https://www.airoa.org/\" rel=\"noopener noreferrer\" target=\"_blank\">AIRoA<\/a>), is working with Toyota and other members to develop foundational technologies for collaborative use. <\/p><p>For instance, AIRoA has collected some 80,000 hours of data on remote operation of mobile manipulators, which Ogata believes is the largest dataset of its kind. Using the data, it built and verified vision-language-action (VLA) models, and it has also started data collection for dual-arm mobile manipulation. In an interview, Ogata acknowledged Japan’s struggle to find its place in the changing landscape. <\/p><p>“The world of AI is inherently a game of scale,” says Ogata. “Therefore, Japan’s absolute prerequisite is to secure a competitive baseline of scale—in data, computing resources, and talent. Beyond that, what I consider most critical is a mind-set shift: Rather than trying to hoard scale within a single nation or company, we must grow stronger by collaborating with a diverse ecosystem of domestic and international players.” <\/p><p>Specifically, this means creating a “collaborative domain” to address data—the single biggest bottleneck—through industry-wide cooperation rather than data siloing. By collectively nurturing a precompetitive, shared data infrastructure and foundation model, individual companies can then compete on top of it with their own applications. “By offering this open ‘data ecosystem’ to the world, we can engage global players and establish a ‘third pole’ alongside the U.S. and China,” says Ogata. “I believe this is how Japan can reclaim its global presence.”<\/p><p>In 1999, Japan introduced the <a href=\"https://www.eurotechnology.com/2015/02/22/i-mode-mobile-internet-docomo/\" rel=\"noopener noreferrer\" target=\"_blank\">world’s first mobile internet services platform<\/a>. But being first didn’t turn Japan into a smartphone manufacturing or design center—it’s now merely a supplier of parts to other countries that are leading the smartphone industry. If Japan can avoid a repeat of that experience and successfully deregulate, diversity, and commercialize its original humanoid dreams, it stands a better chance of influencing the direction of the industry and reaping billions in value. As automobiles and electronics were pillars of Japan’s industrial strategy in the last century, Japan could make humanoid robots one of its key value generators in the 21st century, an approach that would not only deliver economic benefits but give Japan greater clout in how the industry will evolve. Just like Japanese cars, electronics, and even toilets, Japanese humanoids could stand for craftsmanship and reliability. It’s a legacy that Japan can’t afford to give up. <\/p>"}, {"title": "Quarterhill discusses transport modernization as U.S. marks 70 years of federal highways", "source": "The Robot Report", "date": "2026-07-03", "url": "https://www.therobotreport.com/quarterhill-discusses-transport-modernization-u-s-marks-70-years-federal-highways/", "summary": "<p>At the U.S. celebrates 250 years of independence and 70 years of its highway system, an expert looks at the future of autonomous transport. <\/p>\n<p>The post <a href=\"https://www.therobotreport.com/quarterhill-discusses-transport-modernization-u-s-marks-70-years-federal-highways/\">Quarterhill discusses transport modernization as U.S. marks 70 years of federal highways<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Video Friday: An Earthbound Mars Rover for the Moon", "source": "IEEE Spectrum Robotics", "date": "2026-07-03", "url": "https://spectrum.ieee.org/video-friday-nasa-lunar-rover", "summary": "<img src=\"https://spectrum.ieee.org/media-library/mars-style-rover-prototype-on-rugged-ground-under-a-clear-sky-with-the-moon-visible.png?id=67083121&amp;width=1245&amp;height=700&amp;coordinates=0%2C0%2C0%2C0\" /><br /><br /><p><span><a href=\"https://spectrum.ieee.org/tag/video-friday\" target=\"_blank\">Video Friday<\/a> is your weekly selection of awesome robotics videos, collected by your friends at <\/span><em>IEEE Spectrum<\/em><span> robotics. We also post a weekly calendar of upcoming robotics events for the next few months. Please <\/span><a href=\"mailto:automaton@ieee.org?subject=Robotics%20event%20suggestion%20for%20Video%20Friday\">send us your events<\/a><span> for inclusion.<\/span><\/p><h5><a href=\"https://roboticsconference.org/\">RSS 2026<\/a>: 13–17 July 2026, SYDNEY<\/h5><h5><a href=\"https://mrs.fel.cvut.cz/summer-school-2026/\">Summer School on Multi-Robot Systems<\/a>: 29 July–4 August 2026, PRAGUE<\/h5><h5><a href=\"https://actuate.foxglove.dev/\">Actuate 2026<\/a>: 18–19 August 2026, SAN FRANCISCO<\/h5><h5><a href=\"https://2026.ieee-iros.org/\">IROS 2026<\/a>: 27 September–1 October 2026, PITTSBURGH<\/h5><p>Enjoy today’s videos!<\/p><div class=\"horizontal-rule\"><\/div><div><span style=\"display: none;\"> <\/span><\/div><blockquote class=\"rm-anchors\" id=\"fmxmym6bj-y\"><em>NASA is considering a mission concept for an advanced, nuclear-powered rover to be deployed to the Moon’s South Pole as part of the agency’s Moon Base plans. The PROMISE (Polar Rover for Observation, Mapping, and In-Situ Exploration) mission concept relies on the <\/em><em>Curiosity<\/em><em> Mars rover mission’s testbed rover. Some elements of the Perseverance Mars testbed rover shown in this video could be used as well. As exact duplicates of Curiosity and Perseverance, the testbed rovers are equipped with flight-proven engineering systems capable of carrying technology as well as science instruments that would advance Moon Base efforts.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>A Mars rover for the Moon? That’s some <a href=\"https://science.nasa.gov/resource/improved-optimism/\" target=\"_blank\">OPTIMISM<\/a> right there.<\/p><p>[ <a href=\"https://science.nasa.gov/resource/improved-optimism/\">JPL<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"6qrzc1kf7kc\">This is the absolute best thing since <a href=\"https://spectrum.ieee.org/festos-fantastical-flying-robots\" target=\"_blank\">Festo’s AirPenguin<\/a>.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><blockquote><em>The project explores soft, lightweight robots that can gently float around people in indoor environments and invite playful, affectionate, and everyday interactions. Unlike conventional drones, our robot is designed to be quiet, soft, touch-safe, and socially approachable. Through this work, we ask what future indoor companion robots might feel like if they were not rigid machines, but gentle floating beings that share space with us.<\/em><\/blockquote><p>[ <a href=\"https://dl.acm.org/doi/10.1145/3800645.3813051\">Paper<\/a> ]<\/p><p>Thanks, Mingyang!<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"m7pzr90bqw4\"><em>Today, we’re launching our home robot, Isaac 1. Deliveries will begin this fall.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>US $500 per month, with some basic task autonomy, plus teleoperation.<\/p><p>[ <a href=\"https://www.weaverobotics.com/isaac-1\">Weave Robotics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"tv90gfm9rao\">A couple of things from this new Figure video: Thing one is that the cart-pulling is a good illustration of how clumsy humanoid robots still are at basic tasks relative to humans. Thing two is that there are absolutely no humans anywhere near these robots. You can see one guy at 0:19, which I can only assume is an accident, because these robots are not safe to be around from an industrial safety perspective.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.figure.ai/news/f-03-at-bmw\">Figure<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"5mhop2g4e4u\">Our very own Kohava Mendelsohn met some robots at ICRA in Vienna, and only one of them was murderous.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://2026.ieee-icra.org/\">ICRA 2026<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"ipyxwelid9q\"><em>Welcome to Robot Park, where we’re building the future with Apollo 2. Robot Park is where Apollo learns today, getting the experience needed to make a difference tomorrow. Today we’re announcing Robot Park, our nearly 90,000-square-foot facility where Apollo 2 is collecting real-world training data needed to advance autonomous humanoid robots. <\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://apptronik.com/news-collection/welcome-to-robot-park-where-apptroniks-apollo-goes-to-work\">Apptronik<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"mrlbqt5tkh4\"><em>UBTech Robotics, the world’s first publicly traded humanoid robot-maker, has launched a humanlike robot that features lifelike silicone skin and “emotional AI,” as Chinese tech firms increasingly transition robots from the factory floor to the family living room.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.scmp.com/tech/tech-trends/article/3358884/ubtechs-lifelike-humanoid-robots-built-companionship-arriving-homes-across-china\">SCMP<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"xdq8yzehviy\"><em>Spherephones are redefining how we experience sound. Created at Georgia Tech, this wearable uses spatial audio to alert users to movement from every direction—including behind and below. Built for safer human-robot collaboration, the technology is expanding into gaming and accessibility applications. See how music is becoming a new language for awareness and interaction.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://research.gatech.edu/feature/spherephones\">Georgia Tech<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"6dme3jyj3hg\"><em>Humanoid robots are meant to carry out long-horizon autonomous missions in a world built for humans. This is hard. These missions consist of many steps, each of which requires them to perceive, navigate, and interact with the environment. This is exactly Flexion’s goal: building the general-purpose intelligence that turns any robot into a useful helper.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://flexion.ai/news/flexion-reflect-v1.0\">Flexion<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"lttnht-y47m\"><em>We’re introducing KinetIQ Ascend—our reinforcement-learning approach designed to reach 99.9 percent manipulation reliability at human speed and beyond.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://thehumanoid.ai/technology/kinetiq-ascend/\">Humanoid<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"hsmj7__elk0\"><em>Dr. Sebastian “Basti” Scherer has worked in field robotics since the first DARPA Grand Challenge in 2004. He runs the AirLab at Carnegie Mellon’s Robotics Institute and is the director of safe embodied AI at FieldAI. While much of the industry is focused on local skills like tabletop manipulation, Dr. Scherer sees the greatest value in solving dirty, dull, and dangerous tasks that require operating in uncertain environments where the robot needs to “just work.” When robots “just work,” they become less like robots and more like tools. “That’s the big challenge that we have to overcome,” he says. “And that’s the challenge that FieldAI is really primed to solve.”<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.fieldai.com/\">FieldAI<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"omzfvmtwsjc\">Look, I really appreciate how valuable robots like ElliQ can be, and robots that do good work and offer a financial benefit are incredibly important, especially in the context of family care. But in my opinion, you really shouldn’t suggest that a robot with FaceTime or whatever is an equal replacement for in-person human companionship, nor should you suggest that AI can replace a human wellness coach. If you can’t afford those things, then sure, ElliQ can offer some of those capabilities in a very limited way, but that’s all.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://elliq.com/\">ElliQ<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"gz4frehicfe\">Very cool moves! Now get a job!<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.deeprobotics.cn/en\">DEEP Robotics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"r6f8bztjqfg\"><em>Drawing inspiration from restaurant waiters in Morocco and Turkey, among other places, we equip a robot with a hanging tray to transport objects from one location to another without dropping them or spilling their contents. We incorporate this approach into an interactive robot waiter demonstration, which uses computer vision and visual servoing to steer toward a person with a raised hand to serve them.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://arxiv.org/abs/2606.10039\">Paper<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"qfsmncdh9lu\">If you’re going to make robots wear skirts or shorts or pants, you have to give them butts, or it’s just not going to work. That is all.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://techshare.co.jp/product/unitree/g1/\">TechShare<\/a> ] via [ <a href=\"https://www.youtube.com/@KazumichiMoriyama\">Kazumichi Moriyama<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"kfy7d-qiyjw\"><em>It’s Los Alamos, so of course we have robots. Some work inside gloveboxes, while others probe unexploded ordnance in the field and aid with repetitive lifting, Doc Ock–style. Legend has it there’s a fro-yo robot in the cafeteria.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.lanl.gov/media/publications/national-security-science/1224-sniffing-out-radiation\">LANL<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"8aiznj4cciu\">Here are a couple of talks from the recent Humanoids Summit in Japan, from Ali Agha of FieldAI as well as Hiroshi Ishiguro.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p class=\"shortcode-media shortcode-media-youtube\"> <span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span> <\/p><p>[ <a href=\"https://humanoidssummit.com/agenda-2\">Humanoids Summit<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div>"}, {"title": "Blattner awards Built Robotics $75M contract for physical AI to help meet energy demand", "source": "Robotics Business Review", "date": "2026-07-02", "url": "https://www.therobotreport.com/blattner-awards-built-robotics-75m-contract-meet-energy-demands/", "summary": "<p>Blattner has expanded its partnership with Built Robotics to scale autonomous systems for solar construction.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/blattner-awards-built-robotics-75m-contract-meet-energy-demands/\">Blattner awards Built Robotics $75M contract for physical AI to help meet energy demand<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Why you should combine robot dexterity with mechanical positioning for complex assembly operations", "source": "Robotics Business Review", "date": "2026-07-02", "url": "https://www.therobotreport.com/why-you-should-combine-robot-dexterity-with-mechanical-positioning-for-complex-assembly-operations/", "summary": "<p>Experts are recognizing the importance of mechanical positioning and its impact on the machine’s mobility, range and speed.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/why-you-should-combine-robot-dexterity-with-mechanical-positioning-for-complex-assembly-operations/\">Why you should combine robot dexterity with mechanical positioning for complex assembly operations<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Luxonis closes Series A round to scale physical AI perception layer", "source": "Robotics Business Review", "date": "2026-07-02", "url": "https://www.therobotreport.com/luxonis-closes-series-a-round-to-scale-physical-ai-perception-layer/", "summary": "<p>Luxonis said it plans to scale production of its OAK camera and refine its platform to support robotics and industrial automation. <\/p>\n<p>The post <a href=\"https://www.therobotreport.com/luxonis-closes-series-a-round-to-scale-physical-ai-perception-layer/\">Luxonis closes Series A round to scale physical AI perception layer<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Automate 2026 show recap", "source": "Robotics Business Review", "date": "2026-07-02", "url": "https://www.therobotreport.com/automate-2026-show-recap/", "summary": "<p>Editors Steve Crowe, Mike Oitzman, and Sarah Wynn review Automate 2026, analyzing key trends in physical AI, humanoids, and software orchestration.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/automate-2026-show-recap/\">Automate 2026 show recap<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Apptronik unveils Apollo 2 and a flagship data collection and training facility", "source": "Robotics Business Review", "date": "2026-07-01", "url": "https://www.therobotreport.com/apptronik-unveils-apollo-2-flagship-data-collection-training-facility/", "summary": "<p>Built as a data collection and training platform, Apollo 2 enables continuous learning through deployment, Apptronik said.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/apptronik-unveils-apollo-2-flagship-data-collection-training-facility/\">Apptronik unveils Apollo 2 and a flagship data collection and training facility<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Top 10 robotics developments of June 2026", "source": "Robotics Business Review", "date": "2026-07-01", "url": "https://www.therobotreport.com/top-10-robotic-stories-june-2026/", "summary": "<p>Humanoid robots made many headlines in June 2026, whether it be for companies going public, new deployments, or hitting production milestones.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/top-10-robotic-stories-june-2026/\">Top 10 robotics developments of June 2026<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "In Robotics, Ruggedization Is No Longer Optional", "source": "Robotics Business Review", "date": "2026-07-01", "url": "https://www.therobotreport.com/in-robotics-ruggedization-is-no-longer-optional/", "summary": "<p>As autonomy moves beyond controlled environments, ruggedized design is becoming a prerequisite for reliable robotic operations.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/in-robotics-ruggedization-is-no-longer-optional/\">In Robotics, Ruggedization Is No Longer Optional<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Sonair ADAR One 3D ultrasonic sensor is now safety-certified", "source": "Robotics Business Review", "date": "2026-06-30", "url": "https://www.therobotreport.com/sonair-3d-ultrasonic-sensor-is-now-safety-certified/", "summary": "<p>Sonair says ADAR One was assessed as a human detection sensor according to the IEC 61496 standard for electrosensitive protection devices.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/sonair-3d-ultrasonic-sensor-is-now-safety-certified/\">Sonair ADAR One 3D ultrasonic sensor is now safety-certified<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Queue raises funding to build fully autonomous pharmacy", "source": "Robotics Business Review", "date": "2026-06-30", "url": "https://www.therobotreport.com/queue-raises-funding-fully-autonomous-pharmacy/", "summary": "<p>Queue is developing automated pharmacies to expand access to prescriptions in hospitals, retail sites, and underserved communities.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/queue-raises-funding-fully-autonomous-pharmacy/\">Queue raises funding to build fully autonomous pharmacy<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Soft, robotic cells from morph embed physical AI into hardware", "source": "Robotics Business Review", "date": "2026-06-30", "url": "https://www.therobotreport.com/soft-robotic-cells-from-morph-embed-physical-ai-into-hardware/", "summary": "<p>morph launched a physically intelligent soft robotics platform that designs and manufactures what it calls “soft robotic cells.” <\/p>\n<p>The post <a href=\"https://www.therobotreport.com/soft-robotic-cells-from-morph-embed-physical-ai-into-hardware/\">Soft, robotic cells from morph embed physical AI into hardware<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "How Jaiveer Singh Is Helping Robots — and Developers — Move Faster", "source": "NVIDIA Robotics", "date": "2026-06-30", "url": "https://blogs.nvidia.com/blog/nvidia-life-jaiveer-singh/", "summary": "When Jaiveer Singh talks about robots, he doesn’t begin with spectacle. He begins with infrastructure: the boards inside machines, the software that lets developers see through a robot&#8217;s cameras and the engineering required before a robot can leave a demo floor to do something useful. As a robotics software engineer who leads the team behind [&#8230;]"}, {"title": "Into the Omniverse: Three Workflows for Improving Vision AI Agent Accuracy With Synthetic Data and Fine-Tuning", "source": "NVIDIA Robotics", "date": "2026-06-30", "url": "https://blogs.nvidia.com/blog/vision-ai-agent-skills-omniverse-metropolis/", "summary": "Editor’s note: This post is part of Into the Omniverse, a series focused on how developers, 3D practitioners, and enterprises can transform their workflows using the latest advances in OpenUSD and NVIDIA Omniverse. Vision AI agents are becoming a practical way to automatically turn video data from the physical world into operational intelligence in factories, [&#8230;]"}, {"title": "X Square Robot brings its valuation to $2.8B with four consecutive funding rounds", "source": "Robotics Business Review", "date": "2026-06-30", "url": "https://www.therobotreport.com/x-square-robot-brings-valuation-2-8b-four-consecutive-funding-rounds/", "summary": "<p>X Square Robots' system combines foundation models, robotics hardware, a data pipeline system, and real-world deployments.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/x-square-robot-brings-valuation-2-8b-four-consecutive-funding-rounds/\">X Square Robot brings its valuation to $2.8B with four consecutive funding rounds<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "MBody AI expands service robotics operations to eleven states and Canada", "source": "Robotics Business Review", "date": "2026-06-29", "url": "https://www.therobotreport.com/mbody-ai-expands-service-robotics-operations-eleven-states-canada/", "summary": "<p>MBody AI has deployed its hardware-agnostic Orchestrator platform to Florida and California, with a pilot in Ontario.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/mbody-ai-expands-service-robotics-operations-eleven-states-canada/\">MBody AI expands service robotics operations to eleven states and Canada<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Advantages of hypoid gearing over worm, bevel and bevel-planetary", "source": "Robotics Business Review", "date": "2026-06-29", "url": "https://www.therobotreport.com/advantages-of-hypoid-gearing-over-worm-bevel-and-bevel-planetary/", "summary": "<p>Right-angle gearing often requires engineers to compromise between torque capacity and mechanical efficiency. Hypoid gearing offers a balance of mechanical efficiency, load-carrying capability, and single-stage ratio range.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/advantages-of-hypoid-gearing-over-worm-bevel-and-bevel-planetary/\">Advantages of hypoid gearing over worm, bevel and bevel-planetary<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"ti
