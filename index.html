-reader-text\"> \"Renesas Establishes Physical AI &#038; Robotics Lab in Beijing to Accelerate Next-Generation Robotics Innovation\"<\/span><\/a>"}, {"title": "AIR Partners with Elmo Motion Control to Enhance Uncrewed Cargo Aircraft Platform", "source": "EE Journal", "date": "2026-08-31", "url": "https://www.eejournal.com/industry_news/air-partners-with-elmo-motion-control-to-enhance-uncrewed-cargo-aircraft-platform/", "summary": "AIR, the leading manufacturer and developer of Smart Aircraft, today announced a strategic partnership with Elmo Motion Control (Elmo), a global leader in motion control technology. Elmo will integrate high-performance motion control solution into AIR’s Heavy Lift UAS – a VTOL-capable uncrewed cargo aircraft capable of 550lb payloads. The partnership brings together Elmo’s compact, high-power density servo &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/air-partners-with-elmo-motion-control-to-enhance-uncrewed-cargo-aircraft-platform/\">Read More &#8594;<span class=\"screen-reader-text\"> \"AIR Partners with Elmo Motion Control to Enhance Uncrewed Cargo Aircraft Platform\"<\/span><\/a>"}, {"title": "Radxa Linkr – A USB drive-sized IP KVM with USB-C, Ethernet, and WiFi support", "source": "CNX Software", "date": "2026-08-30", "url": "https://www.cnx-software.com/2026/08/30/radxa-linkr-a-usb-drive-sized-ip-kvm-with-usb-c-ethernet-and-wifi-support/", "summary": "<div><img alt=\"Radxa Linkr IP KVM\" class=\"attachment-medium size-medium wp-post-image\" height=\"424\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/08/Radxa-Linkr-IP-KVM-720x424.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Radxa Linkr is a compact, USB flash drive-sized IP KVM that connects to the target through HDMI and USB for video, keyboard, and mouse emulation. The user can control it over USB-C, Ethernet, or WiFi client/access point, even before the OS is booted. The device does not require any specific apps, since all you need is a web browser. The company also highlights support for Tailscale VPN, two-factor authentication, and  AI agents such as OpenClaw and Hermes. Radxa Linkr specifications: SoC – Rockchip RV1106G3 CPU – Arm Cortex A7 @ 1.2GHz with an integrated RISC-V co-processor. NPU – 1 TOPS 4th-gen Rockchip NPU with hybrid quantization (int4, int8, int16) ISP – 3rd-gen 5MP high-performance ISP VPU – 3072×1728 (5MP) @ 30fps H.265/H.264 encoding, 16MP @ 60FPS JPEG snapshot System Memory –  256MB DDR3L on-chip memory Storage for OS and virtual media images Optional 16 GB eMMC flash MicroSD card slot Display Input &#8211; [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/08/30/radxa-linkr-a-usb-drive-sized-ip-kvm-with-usb-c-ethernet-and-wifi-support/\">Radxa Linkr &#8211; A USB drive-sized IP KVM with USB-C, Ethernet, and WiFi support<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "ACEMAGIC Kron Mini K5 (Core 3 304) review – Part 1: Specifications, unboxing, teardown, and first boot", "source": "CNX Software", "date": "2026-08-29", "url": "https://www.cnx-software.com/2026/08/29/acemagic-kron-mini-k5-core-3-304-review-part-1-specifications-unboxing-teardown-and-first-boot/", "summary": "<div><img alt=\"ACEMAGIC Kron Mini K5 Intel Core 3 304 unboxing review\" class=\"attachment-medium size-medium wp-post-image\" height=\"479\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/08/ACEMAGIC-Kron-Mini-K5-Intel-Core-3-304-unboxing-review-720x479.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>ACEMAGIC sent us a sample of the Kron Mini K5 Wildcat Lake mini PC for review. The computer is offered with either an Intel Core 3 304 or Core 5 320 CPU, and features triple display output, 2.5GbE and WiFi 6 networking, and several USB ports, but, interestingly, no Thunderbolt/USB4 ports. The company provided us with the entry-level variant pairing an Intel Core 3 304 penta-core processor with 12GB of RAM and 512GB of storage. In this first part of the review, we&#8217;ll list the mini PC&#8217;s specifications, go through an unboxing and a teardown, before booting it into Windows 11. In the next parts, we&#8217;ll review it using Windows 11 and Ubuntu 26.04 in depth with feature testing and benchmarks. ACEMAGIC Kron Mini K5 (Intel Core 3 304) specifications The company hasn&#8217;t put up a product page for this exact model just yet, so we gathered specifications from our [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/08/29/acemagic-kron-mini-k5-core-3-304-review-part-1-specifications-unboxing-teardown-and-first-boot/\">ACEMAGIC Kron Mini K5 (Core 3 304) review &#8211; Part 1: Specifications, unboxing, teardown, and first boot<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Fanless AMD Ryzen Embedded 8840U/8640U Edge AI Computer supports up to 256GB DDR5 SO-DIMM memory", "source": "CNX Software", "date": "2026-08-28", "url": "https://www.cnx-software.com/2026/08/28/fanless-amd-ryzen-embedded-8840u-8640u-edge-ai-computer-supports-up-to-256gb-ddr5-so-dimm-memory/", "summary": "<div><img alt=\"Fanless AMD Ryzen Embedded 8000 Edge AI computer\" class=\"attachment-medium size-medium wp-post-image\" height=\"433\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/08/Fanless-AMD-Ryzen-Embedded-8000-Edge-AI-computer-720x433.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>IBASE AA400-N is an &#8220;ultra-compact&#8221; fanless edge AI computer powered by an AMD Ryzen Embedded 8840U/8640U processor with up to 8 cores, 16 threads, and a combined 39 TOPS of AI performance for machine and robotic vision, autonomous inspection, smart retail, industrial automation, and other data-intensive, space-constrained applications. The most intriguing part of the specs and announcement is the claim of up to 256GB DDR5 capacity through two SO-DIMM modules, implying availability of 128GB DDR5 SO-DIMM memory modules. The system also comes with a 256GB M.2 NVMe SSD, features 8K-capable HDMI and DisplayPort video interfaces, two 2.5GbE jacks, M.2 sockets for optional WiFi, Bluetooth and 4G/5G cellular connectivity, a few USB ports and a COM port. &#160; IBASE AA400-N specifications: AMD Ryzen Embedded 8000 Series processors AA400-NM  – AMD Ryzen Embedded 8840U CPU – 8-core/16-thread Zen4 &#8220;Hawk Point&#8221; processor up to 3.3 GHz / 5.1 GHz (Turbo) GPU – AMD [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/08/28/fanless-amd-ryzen-embedded-8840u-8640u-edge-ai-computer-supports-up-to-256gb-ddr5-so-dimm-memory/\">Fanless AMD Ryzen Embedded 8840U/8640U Edge AI Computer supports up to 256GB DDR5 SO-DIMM memory<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Spark Solder one-handed USB-C soldering iron supports TS100 tips, integrates solder feeder (Crowdfunding)", "source": "CNX Software", "date": "2026-08-28", "url": "https://www.cnx-software.com/2026/08/28/spark-solder-one-handed-usb-c-soldering-iron-ts100-tips-automated-solder-feeder/", "summary": "<div><img alt=\"Spark Solder one handed soldering iron\" class=\"attachment-medium size-medium wp-post-image\" height=\"480\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/08/Spark-Solder-one-handed-soldering-iron-720x480.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Spark Solder is a compact, USB-C-powered one-handed soldering iron with a built-in motorized solder feeder for convenient one-handed operation. It supports standard TS100 tips, delivers up to 45W of heating power, and features a 1-inch LCD for adjusting the temperature and solder feed speed. While smart, portable soldering irons are very common these days, using one can still be tricky when you have to handle the iron, solder wire, and components at the same time. Spark Solder solves this by adding a replaceable solder capsule and a two-axis motorized feeding system to the handle, leaving one hand free for easier assembly, prototyping, and repairs. Spark Solder specifications: Display – 1-inch TFT display for adjusting temperature, solder extrusion speed, and tip profiles Soldering Power output – Up to 45W Temperature Range – 200°C to 450°C Heat-Up Time – Reaches 300°C in 6 seconds Temperature Stability – ±2°C (via PID control) Tip [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/08/28/spark-solder-one-handed-usb-c-soldering-iron-ts100-tips-automated-solder-feeder/\">Spark Solder one-handed USB-C soldering iron supports TS100 tips, integrates solder feeder (Crowdfunding)<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Microduck – A duck-like biped robot designed for physical AI experimentation and fun", "source": "CNX Software", "date": "2026-08-28", "url": "https://www.cnx-software.com/2026/08/28/microduck-a-duck-like-biped-robot-designed-for-physical-ai-experimentation-and-fun/", "summary": "<div><img alt=\"Microduck\" class=\"attachment-medium size-medium wp-post-image\" height=\"388\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/08/Microduck-720x388.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Pollen Robotics and Hugging Face have unveiled the Microduck, a 25 cm tall biped robot with 15 motors, a camera, a depth sensor, two motion sensors, and an articulated beak that can pick up objects. This follows the launch of the Reachy Mini desktop robot earlier this year that featured a Raspberry Pi CM4 module or could interface to a computer instead. In some ways, we may think of the Microduck as a Reachy Mini with legs, but the company says both are different products. The Reachy Mini targets human-robot interaction, while the Microduck focuses on motion/action, although it also features a microphone and a speaker for audio interaction. Microduck specifications: SoC – Rockchip RK3566 CPU – Quad-core Cortex-A55 processor @ up to 1.8 GHz GPU – Arm Mali-G52 NPU – 0.8 TOPS AI accelerator VPU 4Kp60 H.265/H.264/VP9 video decoder 1080p60 H.264/H.265 video encoder System Memory – 1GB RAM Storage [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/08/28/microduck-a-duck-like-biped-robot-designed-for-physical-ai-experimentation-and-fun/\">Microduck &#8211; A duck-like biped robot designed for physical AI experimentation and fun<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Embedded Systems Runtime Observability, Sensor Fusion for Drones, Embedded Design for Mil/Aero: Embedded Week Insights", "source": "Embedded.com", "date": "2026-08-28", "url": "https://www.embedded.com/embedded-systems-runtime-observability-sensor-fusion-for-drones-embedded-design-for-mil-aero-embedded-week-insights/", "summary": "<p>Here's a roundup of this week's must-read articles. We cover the latest developments on why embedded teams require runtime observability, sensor fusion for drones, and embedded systems design for aerospace and defense. Also, check News Archives - Embedded and Technical Articles Archives - Embedded for the complete list of news and articles from our website. NEWS RAIN Alliance Launches [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/embedded-systems-runtime-observability-sensor-fusion-for-drones-embedded-design-for-mil-aero-embedded-week-insights/\">Embedded Systems Runtime Observability, Sensor Fusion for Drones, Embedded Design for Mil/Aero: Embedded Week Insights<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "Seco Introduces SMARC Module for Industrial Edge AI", "source": "Embedded.com", "date": "2026-08-28", "url": "https://www.embedded.com/seco-introduces-smarc-module-for-industrial-edge-ai/", "summary": "<p>Seco has announced the SOM-SMARC-Dragonwing-IQ8, a SMARC Rel. 2.1.1 system-on-module (SOM) designed to help OEMs transition from Arduino-based prototyping to production-oriented industrial edge AI systems. Early hardware samples are available to select customers and partners for evaluation of AI-enabled robotics, smart machines, industrial vision, human-machine interfaces (HMIs), and machine-control applications. The module is based on [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/seco-introduces-smarc-module-for-industrial-edge-ai/\">Seco Introduces SMARC Module for Industrial Edge AI<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "FSP Launches Next-Gen 3200W CRPS Power Solutions to Fully Power AI Edge and Next-Generation Data Centers", "source": "EE Journal", "date": "2026-08-28", "url": "https://www.eejournal.com/industry_news/fsp-launches-next-gen-3200w-crps-power-solutions-to-fully-power-ai-edge-and-next-generation-data-centers/", "summary": "FSP Group, a global leading power supply manufacturer, leverages its deep R&#38;D capabilities and forward-looking insights into computing architectures to announce two new 3200W Common Redundant Power Supply (CRPS) modules: the FSP3200-20HM (12V output) and FSP3200-21HE (54V output). Designed specifically for next-generation data centers, edge AI servers, and high-density workstations, FSP&#8217;s dual-voltage architecture (12V &#38; &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/fsp-launches-next-gen-3200w-crps-power-solutions-to-fully-power-ai-edge-and-next-generation-data-centers/\">Read More &#8594;<span class=\"screen-reader-text\"> \"FSP Launches Next-Gen 3200W CRPS Power Solutions to Fully Power AI Edge and Next-Generation Data Centers\"<\/span><\/a>"}, {"title": "OMC introduces new high-performance laboratory-grade polish finish for its industrial fibre optic cables", "source": "EE Journal", "date": "2026-08-28", "url": "https://www.eejournal.com/industry_news/omc-introduces-new-high-performance-laboratory-grade-polish-finish-for-its-industrial-fibre-optic-cables/", "summary": "OMC, a pioneer in optoelectronics design &#38; manufacture, has introduced a new ultra-performance laboratory-grade polish finish for its industrial fibre optic cables and datalinks, designed to serve the most demanding applications. The use of a combination of highly skilled human operators and custom-trained, calibrated and tooled cobots has enabled a new, unprecedented quality of finish to be &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/omc-introduces-new-high-performance-laboratory-grade-polish-finish-for-its-industrial-fibre-optic-cables/\">Read More &#8594;<span class=\"screen-reader-text\"> \"OMC introduces new high-performance laboratory-grade polish finish for its industrial fibre optic cables\"<\/span><\/a>"}, {"title": "STL takes a major leap towards Decarbonisation; enabling Eco-friendly product portfolio by transitioning to 100% ‘Green power’", "source": "EE Journal", "date": "2026-08-28", "url": "https://www.eejournal.com/industry_news/stl-takes-a-major-leap-towards-decarbonisation-enabling-eco-friendly-product-portfolio-by-transitioning-to-100-green-power/", "summary": "Reduction of ~80% carbon emission for G.657.A2 Fibre to 0.9 Kg from 4.7Kg Transition of key manufacturing facilities in India to 100% ‘Green Power’ energy source Shift to 100% Green Hydrogen manufacturing in India  STL [NSE: STLTECH], a leading connectivity solutions provider for AI-ready digital infrastructure, today announced significant progress on its journey towards decarbonisation and its Net-Zero ambitions. Transitioning to 100% Green Power &#8211; STL, recently, has moved &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/stl-takes-a-major-leap-towards-decarbonisation-enabling-eco-friendly-product-portfolio-by-transitioning-to-100-green-power/\">Read More &#8594;<span class=\"screen-reader-text\"> \"STL takes a major leap towards Decarbonisation; enabling Eco-friendly product portfolio by transitioning to 100% ‘Green power’\"<\/span><\/a>"}, {"title": "From Lab to Battlefield: Navigating Hardware, TRLs, and the Edge in Defense", "source": "EE Journal", "date": "2026-08-28", "url": "https://www.eejournal.com/fish_fry/from-lab-to-battlefield-navigating-hardware-trls-and-the-edge-in-defense/", "summary": "<img alt=\"\" class=\"webfeedsFeaturedVisual wp-post-image\" height=\"300\" src=\"https://www.eejournal.com/wp-content/uploads/2026/08/AD-082826-300x300.jpg\" style=\"display: block; margin-bottom: 5px; clear: both;\" width=\"300\" />My podcast guest this week is David Jedynak, Vice President of Strategic Planning at Curtiss-Wright Defense Solutions. David and I chat about the complexities of &#8220;New Defense&#8221; innovation and what founders must understand about translating tech to the tactical environment. We also examine the similarities and differences between the defense sector and the tech industry &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/fish_fry/from-lab-to-battlefield-navigating-hardware-trls-and-the-edge-in-defense/\">Read More &#8594;<span class=\"screen-reader-text\"> \"From Lab to Battlefield: Navigating Hardware, TRLs, and the Edge in Defense\"<\/span><\/a>"}, {"title": "USB-C Deskradar – An ESP32-C3 ADS-B flight tracker with a 1.28-inch round display", "source": "CNX Software", "date": "2026-08-27", "url": "https://www.cnx-software.com/2026/08/27/usb-c-deskradar-an-esp32-c3-ads-b-flight-tracker-with-a-1-28-inch-round-display/", "summary": "<div><img alt=\"USB C Deskradar, Live ADS B Flight Tracker\" class=\"attachment-medium size-medium wp-post-image\" height=\"480\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/08/USB-C-Deskradar-Live-ADS-B-Flight-Tracker-720x480.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>The USB-C Deskradar is an ESP32-C3-based, aviation-themed ADS-B flight tracker that tracks and displays live aircraft positions around your location on a sonar-style circular grid. A 1.28-inch round display and a 3D-printed enclosure provide a real-time view of flights around a configured location. As we&#8217;ll see further below, it appears to be an open-source project that was picked up by Chinese vendors and started popping up on AliExpress as an inexpensive desk gadget. USB-C Deskradar specifications: Wireless module –16-pin ESP32-C3 Super Mini module SoC – Espressif Systems ESP32-C3FH4, single-core 32-bit RISC-V microcontroller @ up to 160 MHz; 400 KB SRAM; 4MB flash USB – USB Type-C port for programming Ceramic antenna Display – 1.28-inch round TFT color LCD with GC9A01 controller; 240×240 resolution; driven via SPI Misc Hardware button (connected to GPIO 9 / BOOT pin, active LOW) Short tap – Cycles radar range presets (e.g., 5, 10, 15, 25 [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/08/27/usb-c-deskradar-an-esp32-c3-ads-b-flight-tracker-with-a-1-28-inch-round-display/\">USB-C Deskradar &#8211; An ESP32-C3 ADS-B flight tracker with a 1.28-inch round display<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Engineering Embedded Systems for Aerospace and Defense", "source": "Embedded.com", "date": "2026-08-27", "url": "https://www.embedded.com/engineering-embedded-systems-for-aerospace-and-defense/", "summary": "<p>For years, electronics for military and aerospace applications have been built around hardware that could tolerate harsh environments far beyond those encountered by commercial and industrial machinery. Such systems include satellites, planetary rovers, combat vehicles, naval platforms, avionics, and electronic warfare equipment. Ruggedized packaging, military-grade components, and rigorous qualification testing ensured that systems remained operational [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/engineering-embedded-systems-for-aerospace-and-defense/\">Engineering Embedded Systems for Aerospace and Defense<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "RAIN Alliance Launches RFID Sensor Working Group", "source": "Embedded.com", "date": "2026-08-27", "url": "https://www.embedded.com/rain-alliance-launches-rfid-sensor-working-group/", "summary": "<p>The RAIN Alliance has established a new RFID Sensor Working Group to support the development and adoption of sensor-enabled RAIN RFID technologies. The group will bring together technology providers, end users, and industry stakeholders to address emerging applications, deployment challenges, and standards requirements across industrial IoT, asset management, and digital product passport (DPP) use cases. [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/rain-alliance-launches-rfid-sensor-working-group/\">RAIN Alliance Launches RFID Sensor Working Group<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "Infineon supplies silicon carbide technology to Fox ESS, enhancing efficiency of residential energy storage systems", "source": "EE Journal", "date": "2026-08-27", "url": "https://www.eejournal.com/industry_news/infineon-supplies-silicon-carbide-technology-to-fox-ess-enhancing-efficiency-of-residential-energy-storage-systems/", "summary": "Infineon Technologies AG (FSE: IFX / OTCQX: IFNNY) supplies silicon carbide (SiC) power semiconductors to Fox ESS, a leading provider of renewable energy solutions, to enhance the efficiency of its residential energy storage systems (ESS). Leveraging Infineon&#8217;s CoolSiC™ MOSFETs 1200 V G2 in the Q-DPAK package, Fox ESS has reduced switching losses by 70 percent. &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/infineon-supplies-silicon-carbide-technology-to-fox-ess-enhancing-efficiency-of-residential-energy-storage-systems/\">Read More &#8594;<span class=\"screen-reader-text\"> \"Infineon supplies silicon carbide technology to Fox ESS, enhancing efficiency of residential energy storage systems\"<\/span><\/a>"}, {"title": "Altera Expands Agilex 9 Direct RF FPGA Ecosystem for Defense", "source": "Embedded.com", "date": "2026-08-26", "url": "https://www.embedded.com/altera-expands-agilex-9-direct-rf-fpga-ecosystem-for-defense/", "summary": "<p>Altera Corp. has recently expanded its Agilex 9 Direct RF FPGA ecosystem through collaborations with Mercury Systems and VadaTech, introducing commercial off-the-shelf (COTS) solutions for next-generation defense platforms. The partnerships combine Agilex 9 medium-band Direct RF FPGAs with open-architecture hardware to help defense system developers reduce size, weight, power, and cost; shorten development cycles; and deploy more [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/altera-expands-agilex-9-direct-rf-fpga-ecosystem-for-defense/\">Altera Expands Agilex 9 Direct RF FPGA Ecosystem for Defense<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "Nvidia Unveils Jetson Orin Nano 2 for Robotics and Edge AI", "source": "Embedded.com", "date": "2026-08-25", "url": "https://www.embedded.com/nvidia-unveils-jetson-orin-nano-2-for-robotics-and-edge-ai/", "summary": "<p>Nvidia claims to redefine entry-level edge AI with the launch of the Jetson Orin Nano 2 robotics computer, making frontier-class AI models available to millions of developers. Advancing generative AI at the edge, the new AI supercomputer targets applications such as robots, delivery and inspection drones, and vision AI systems that need small, energy-efficient robotics [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/nvidia-unveils-jetson-orin-nano-2-for-robotics-and-edge-ai/\">Nvidia Unveils Jetson Orin Nano 2 for Robotics and Edge AI<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "Why Sensor Fusion Matters for Drone Navigation and Detection", "source": "Embedded.com", "date": "2026-08-25", "url": "https://www.embedded.com/why-sensor-fusion-matters-for-drone-navigation-and-detection/", "summary": "<p>A variety of sensors are used on drones for spatial awareness, terrain and target mapping, obstacle navigation, and optimizing flight paths to the target. Anti-drone defense systems similarly rely on many sensors for detection, flight-path tracking, and drone classification. Each sensor has its strengths and weaknesses. Sensor fusion involves merging the multiple sensor data input [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/why-sensor-fusion-matters-for-drone-navigation-and-detection/\">Why Sensor Fusion Matters for Drone Navigation and Detection<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}], "papers": [{"title": "SUN: Persistent Programs For Language-Grounded Control-to-Learning-to-Real Policies", "authors": ["Weiqi Wang", "Zhi Li", "Yudong Lei", "David Martinez", "Xiaofeng Gao", "Yuxin Jiang", "Chenfanfu Jiang", "Yingnian Wu", "Demetri Terzopoulos", "Ran Gong"], "published": "2026-08-31", "summary": "Bridging model-based control and learned policies in long-horizon manipulation has harbored a silent disagreement: control executes specified objectives, learning amortizes that behavior into a reactive policy, yet existing protocols discard task semantics, leaving rewards hand-crafted and behavior drifting from what control verified.We introduce Semantically UNified (SUN) Programs, typed executables where geometric and contact relations are defined once and compiled into aligned Model Predictive Control (MPC) costs, satisfaction predicates, RL rewards, transition guards, and diagnostics. Our system, Kuafu, driven by large vision language systems, automatically synthesizes SUN Programs from language and scene semantics, screens feasibility via MPC, and retains semantics while training stage-conditioned policies. Across nine tasks, Kuafu achieves 82.03% macro-success, outperforming sparse-reward (35.67%) and Stage-BC (24.75%) baselines. At 8192-way scale, it generates 10.57x the successful trajectory time per hour of human teleoperation. With 500 trajectories per task, Kuafu data trains DP3 policies to 46.0% simulation success (vs. 22.4% for alternatives) and 34.7% on physical Franka and Kinova robots. These results establish that simulation-screened task semantics can effectively amortize control into robust policies, without demonstrations or manual dense rewards, unifying symbolic planning and data-driven execution.", "pdf_url": "https://arxiv.org/pdf/2608.31167v1"}, {"title": "VeriCam: A Verification Baseline for the Classification of Unknown Data", "authors": ["Lucas Wojcik", "Gabriel E. Lima", "Sergio M. Silva", "Eduil Nascimento", "David Menotti"], "published": "2026-08-31", "summary": "The advent of foundation models have enabled a new era in zero-shot classification. Yet, key challenges persist. Despite their impressive generalization power that leverages the immense pre-training knowledge, both foundation models for image and text as well as vision-text hybrids lack the representational power needed for fine-grained, minutiae-based class separation that some real-world tasks require. To address the current gaps in the literature, we propose VeriCam, a pipeline designed to learn highly specialized features that enable classification of unknown classes in unseen data. VeriCam works by leveraging the representation power of image models trained for the verification task, where the model develops an intricate feature space that incorporates fine-grained details. By training a model to discriminate between pairs of images from the same and different classes, a relational graph is constructed, representing the class relationships between data points. We then present two approaches for graph clustering: a naive algorithm and a specific setup for the Leiden graph clustering algorithm. The pipeline is validated on the LPLCv2 dataset, which comprises real-world traffic surveillance images. We show that the dataset carries an inherent capture device bias that is posed as a generalization challenge for downstream License Plate recognition tasks such as OCR. As such, we dynamically identify capture devices with a label-agnostic approach, enabling the construction of a fair and unbiased benchmark. In the cross-device scenario, our pipeline reaches an F1-Score of 93.45 in the verification baseline and a V-Measure score of 80.13 in the clustering step. All code is publicly available at https://github.com/lmlwojcik/VeriCam", "pdf_url": "https://arxiv.org/pdf/2608.31107v1"}, {"title": "OmniRAS: Standardizing Foundation Model Training and Evaluation in Robot-Assisted Surgery", "authors": ["Leonardo Borgioli", "Neil Getty", "Wenli Xiu", "Jessica Cassiani", "Alvaro Ducas", "Carlos Agustin Orda", "Hira Waris", "Fangfang Xia", "Rick Stevens", "Pier Cristoforo Giulianotti", "Milos Zefran"], "published": "2026-08-31", "summary": "Few foundation models exist for robot-assisted surgery, partly because large robotic-surgery video corpora are difficult to assemble and existing models are evaluated mostly on laparoscopic benchmarks. Further, most existing models are evaluated on a small set of public benchmarks, mostly focused on laparoscopic surgery. We present OmniRAS, a family of 1B- and 2B-parameter V-JEPA-2.1 encoders for robot-assisted surgery, and detail their training. First, we release two densely annotated robotic-cholecystectomy datasets: OmniRAS-PR and a multi-label YT-Chole tool-verb-target task, the first triplet-style annotation for robotic cholecystectomy, together with splits, probe protocols, and an inter-rater study validating the shared phase ontology. Second, we document continued pretraining at up to 256 compute nodes with global batch 6,144 over 19 sources totaling approximately 2,650 hours of surgical video, 51% robotic, and analyze compute and data composition. Third, we evaluate against raw V-JEPA-2.1 and specialized surgical models on six tasks spanning triplet, phase, and step recognition, action segmentation, and detection, under frozen-encoder and final-four-block fine-tuning regimes. Across three seeds, this yields 254 downstream runs, including 109 with partial backbone fine-tuning. The best OmniRAS models achieve the strongest adapted results across all task families, while frozen differences are smaller.", "pdf_url": "https://arxiv.org/pdf/2608.31048v1"}, {"title": "Driving on Memory", "authors": ["Christian Löwens", "Thorben Funke", "Alexandru Paul Condurache"], "published": "2026-08-31", "summary": "End-to-end autonomous driving models plan future trajectories from raw sensor input. While earlier driving benchmarks often measured deviation from the human trajectory, current benchmarks such as NAVSIM and Bench2Drive evaluate models with richer simulation-based metrics intended to capture safe and compliant driving. A high benchmark score should reflect that a model can understand the scene in front of it and act accordingly. But how much of that score specifically comes from reacting to the dynamic part of that scene? To probe this, we remove a model's camera input and replace it with memories from prior drives at the same location. The retrieved memories can provide persistent scene information, including road layout and location-conditioned regularities, but not the current traffic state. Surprisingly, memory is nearly sufficient on NAVSIM, reaching or even exceeding the performance of leading end-to-end methods without actually observing the evaluated scene. Our results suggest that a high NAVSIM score does not require a planner to react to the current traffic scene and should be treated with caution. This effect is benchmark-dependent: driving from memory causes substantially larger performance drops on Bench2Drive and RealEngine. We provide our code at https://github.com/boschresearch/MemoryDrivoR .", "pdf_url": "https://arxiv.org/pdf/2608.31029v1"}, {"title": "TSPFN: A Temporal Tabular Foundation Model for Physiological Time Series Classification", "authors": ["Jérémie Stym-Popper", "Clément Rambour", "Federica Granese", "Nicolas Thome", "Olivier Bernard"], "published": "2026-08-31", "summary": "Designing models that generalize effectively in low- to medium-data regimes remains a primary challenge in medical machine learning, particularly for physiological time-series classification. While tabular foundation models such as TabPFN offer an attractive alternative to conventional fine-tuning through in-context learning, they are not designed to capture the temporal dependencies inherent to physiological signals. ~In this paper, we introduce TSPFN, a foundation model that redesigns TabPFN's architecture for time series data. TSPFN integrates structured temporal representations and positional embeddings to capture intra-sample temporal and channel dependencies. To fully leverage its spatio-temporal design, the model is pretrained on 140,000 real-world physiological time series across multiple medical domains. This yields a unified, generalizable framework capable of learning the specificities of medical time series. Experiments across diverse physiological benchmarks demonstrate that TSPFN consistently outperforms standard tabular baselines and TabPFN, and achieves superior cross-domain generalization compared to specialized deep time-series models. All our experiments, ablation studies, and pre-processing scheme are publicly available at https://github.com/Jeremstym/TSPFN", "pdf_url": "https://arxiv.org/pdf/2608.31013v1"}, {"title": "Language-Informed Flow Matching for Trend-Guided Structure-Based 3D Molecular Generation", "authors": ["Tianyu Gao", "Zhikai Su", "Jiashu Li", "Wenjun Gao", "Zichuan Ying", "Zhe Zhao", "Fei Zhang", "Ye Wei"], "published": "2026-08-31", "summary": "Structure-based drug design (SBDD) requires ligands that satisfy both 3D target affinity and 1D chemical validity. Existing controllable generation methods often rely on task-specific fine-tuning or externally imposed sampling-time guidance, adding cost and potentially conflicting with evolving 3D geometric constraints. We propose LiFT, a language-informed cross-modal framework built on Flow Matching for trend-guided 3D molecular generation across both de novo design and scaffold hopping. LiFT uses a \"Sense-Evolve-Assemble\" agent to generate target-aware SMILES as intermediate chemical conditions, from which a pre-trained chemical foundation model extracts continuous semantic priors. These priors are integrated into geometric generation through a lightweight semantic projector with zero-initialized adaptive normalization for stable cross-modal conditioning. We further introduce a Self-Conditioned Decoupled Router (SCDR), which modulates the velocity field according to intermediate structural states during ODE integration. Experiments on Cross-Docked2020 show that LiFT achieves competitive distribution matching while improving medicinal chemistry metrics and maintaining competitive structural validity under task-steering settings without additional generator fine-tuning. Our results suggest that language-derived chemical priors provide effective trend-level guidance for 3D molecular generation. Code and released artifacts are available at https://github.com/kasurl/LiFT.", "pdf_url": "https://arxiv.org/pdf/2608.31009v1"}, {"title": "DARP: A Calibrated Dual-Arm RGB-D-IR Dataset for Multi-View Robotic Perception", "authors": ["Manish Kansana", "Mohammed Yusuf Mujawar", "Sudip Mittal", "Shahram Rahimi", "Noorbakhsh Amiri Golilarz"], "published": "2026-08-31", "summary": "Robotic perception from a single viewpoint is often limited by self-occlusion and incomplete surface visibility. This paper presents DARP(Dual-Arm Robotic Perception) https://doi.org/10.21227/rmv3-be47, a calibrated dual-arm RGB-D-IR dataset for object-centered robotic perception using two independently moving eye-in-hand manipulators positioned on opposite sides of a shared tabletop workspace. Each arm carries an Intel RealSense sensor that continuously records RGB, depth, and stereo infrared data while synchronized robot joint states are logged for pose recovery. Objects are placed without fixed poses or marked locations, and the acquisition procedure performs automatic localization, cross-arm confirmation, adaptive viewpoint generation, and continuous multimodal recording. DARP contains ten unique tabletop objects and preserves the original sensor recordings, robot-state logs, object-level metadata, and calibration information required to reconstruct camera trajectories in a shared metric frame. To evaluate the geometric consistency of the acquisition, we implement a deterministic multi-view fusion pipeline that converts calibrated RGB-D observations into complementary partial point clouds and measured surface meshes without using learned or generative completion methods. Evaluation on 224 held-out RGB-D keyframes comprising 1,563,466 three-dimensional query points yields a median point-to-mesh distance of 2.13~mm and an RMSE of 4.04~mm, with 96.56\\% of points within 10~mm of the measured-surface mesh. DARP is intended as a reusable resource for multi-view reconstruction, collaborative robotic perception, multimodal fusion, active perception, and future learning-based reasoning over partial object observations.", "pdf_url": "https://arxiv.org/pdf/2608.31002v1"}, {"title": "Autonomously Acquiring Robot Manipulation Skills with Language-Driven Quality-Diversity", "authors": ["Émiland Garrabé", "Mahdi Khoramshahi", "Stéphane Doncieux"], "published": "2026-08-31", "summary": "Quality-diversity (QD) algorithms have been gaining traction in robot learning, where diverse motion primitive libraries allow robots to adapt zero-shot to constraints at deployment time. However, such methods typically require expert designers to write the success condition, fitness and diversity metrics, and this strongly limits the robot's autonomy. On the other hand, existing LLM-based reward-shaping techniques allow robots to learn autonomously but only output single high-performing solutions, limiting the robot's adaptability. In this paper, we propose an approach designed to output diverse motion primitive archives by autonomously leveraging quality-diversity algorithms, only requiring a free-form description of the task in common language. To address the difficulty of designing relevant fitness and diversity metrics, we propose an autonomous exploration mechanism able to reliably output sets of functionals covering the fitness and behavior descriptor (BD) space. First, we pose policy exploration as a functional design problem, where the functional spaces are lower-dimensional than the full BD and fitness spaces, and propose an LLM-based exploration scheme to sample from these low-dimensional spaces without any task-specific prompts, fine-tuning or expert intervention. We adapt a multi-BD variant of the MAP-Elites success (MES) algorithm, designed to leverage the heterogeneous BD samples. Finally, through experiments based on the genesis simulator, we show that our method effectively generates archives of diverse motion primitives, outperforming classical QD algorithms with inferred and hand-written parametrizations on a set of $4$ robotic manipulation tasks.", "pdf_url": "https://arxiv.org/pdf/2608.30983v1"}, {"title": "MR-JEPA: A General Purpose Video Foundation Model for Cardiac MRI", "authors": ["Athira J. Jacob", "Puneet Sharma", "Dorin Comaniciu", "Daniel Rueckert"], "published": "2026-08-31", "summary": "Cardiac magnetic resonance imaging (CMR) produces rich sequential data such as temporal cine videos and spatial LGE/mapping stacks, yet most deep learning approaches process individual 2D slices, discarding this context. We present MR-JEPA, a self-supervised video foundation model for CMR that extends LeJEPA to 3D spatiotemporal inputs through tubelet tokenization, spatiotemporal masking augmentation, and initialization from a 2D CMR foundation model. Unlike prior CMR video models limited to cine data, MR-JEPA is pretrained on multi-sequence data (cine, LGE, mapping) from 10,505 patients across two centers without annotations. We evaluate the frozen encoder on six downstream tasks using a unified multi-view gated attention architecture: LV ejection fraction, RV ejection fraction, three myocardial strains (GLS, GCS, GRS), and four-class disease detection. MR-JEPA outperforms other compared methods on all five regression tasks, including both a domain-specific CMR model pretrained on more data with text supervision and a natural-video foundation model, achieving an LV EF MAE of 4.79% (r =0.764) and a GLS MAE of 1.87 (r=0.805), with 21-27% MAE reductions over baselines on strain tasks. For disease detection, MR-JEPA achieved a macro AUG of 0.868, remaining competitive with the domain-specific baseline despite using a fully self-supervised pretraining objective. These results demonstrate the potential of a unified video encoder for robust, multi-view utilization of diverse CMR sequences in clinical cardiac quantification and diagnosis.", "pdf_url": "https://arxiv.org/pdf/2608.30975v1"}, {"title": "Learning Action Models with Conditional and Quantified Effects via Uncertainty-Guided Exploration", "authors": ["Jeffrey Jewett", "William Solow", "Sandhya Saisubramanian"], "published": "2026-08-31", "summary": "Accurate action models are critical for effective planning. Existing action-model learning methods largely assume simple action representations or become computationally intractable when learning conditional and quantified effects. We present Online Hypothesis-Driven Conditional Action Model Learning (OHCAM), an online approach for learning action models with conditional and quantified effects from limited interactions with the environment. OHCAM maintains a belief over hypothesized action models and actively selects informative actions to reduce uncertainty by maximizing disagreement among competing hypotheses, while being robust to noisy observations. To enable scalability, OHCAM begins with a small set of simple action model hypotheses and expands to more complex conditions only when the current hypotheses become inconsistent with the data. Experiments on six benchmark planning domains demonstrate that OHCAM is sample efficient in learning action models that solve substantially more tasks than baselines, even with observation noise. We validate OHCAM on two tasks using a Kinova Gen3 robot, demonstrating the real-world applicability of our approach.", "pdf_url": "https://arxiv.org/pdf/2608.30955v1"}, {"title": "LightNav-0: Eliciting VLM Spatial Intelligence for Generalist Embodied Navigation", "authors": ["Shaoan Wang", "Aocheng Luo", "Fei Huang", "Jingyi Xu", "Xiaoyang Wang", "Yueyu Wang", "Qianli Ma", "Fan Yang", "Ran Mei", "Jia Wei", "Jiangpeng Hu", "Xuhao Liu", "Hongming Chen", "Yuanbin Shao", "Yiyang Lin", "Ziliang Li", "Liang Pan", "Xinhang Liu", "Yuntao Ma", "Tingxiang Fan"], "published": "2026-08-31", "summary": "Embodied navigation requires agents to translate heterogeneous goals and visual observations into actions across tasks, environments, and robot embodiments. Modern vision-language models (VLMs) already encode spatial priors for visual grounding, spatial reasoning, and pointing, but these capabilities are rarely elicited directly for robot control. Existing navigation systems instead rely on task- or embodiment-specific components, fragmenting perception, reasoning, and action while offering limited generalization. Here we present LightNav-0, a compact generalist embodied navigation model that elicits the spatial intelligence of a pretrained VLM and aligns it with navigation, without task-specific prediction heads. LightNav-0 represents diverse navigation tasks through a unified token interface: dual-channel pointing expresses task-, scene-, and embodiment-agnostic spatial intent, while a residual vector-quantized action tokenizer maps this intent to precise, embodiment-specific trajectories. Together with temporally aware visual history compression, ER mid-training, supervised fine-tuning, and reinforcement learning, this formulation supports instruction following, open-vocabulary object navigation, and visual tracking within a single model. The navigation training corpus spans 2K+ scenes and 4K+ hours of embodied navigation data. LightNav-ER, the embodied-reasoning checkpoint used to initialize LightNav-0, attains the highest complete-set average across 8 embodied-reasoning benchmarks, while LightNav-0 achieves state-of-the-art monocular success rates across all 10 public navigation simulation settings. Real-world evaluations further demonstrate zero-shot generalization across robot embodiments, diverse scenes, and static and dynamic targets. These results establish compact VLMs as a unified and transferable backbone for generalist embodied navigation.", "pdf_url": "https://arxiv.org/pdf/2608.30935v1"}, {"title": "The Structure of Merging Turbulent Jets Beneath a Small Quadrotor", "authors": ["Anoop Kiran", "Nora Ayanian", "Kenneth Breuer"], "published": "2026-08-31", "summary": "The downwash wake of a hovering quadrotor governs both the vehicle's own performance and the safe spacing of multi-rotor formations. Prior measurements have largely characterized the mean flow, using single-point anemometry, volumetric tracking, or planar cuts through part of the rotor system. Higher-order turbulent statistics of the merged wake, and how they relate to canonical jet scaling, have remained unresolved, particularly for small quadrotors at the low-Reynolds-number end of the size range. Here, we present a detailed particle image velocimetry (PIV) study of the downwash of a hovering Crazyflie 2.1 quadrotor (arm length, $l = 46$ mm), sampled along a diagonal cut, passing through rotors along the symmetry axis of the quadrotor, and a front-rotor cut, passing through adjacent rotors. The four rotor jets merge into a single column by $z/l \\approx 5$, beyond which the mean velocity profiles progressively approach the canonical round-jet self-similar form, collapsing by $z/l \\approx 13$ when scaled by the local centerline velocity and half-width. Centerline decay and half-width growth follow canonical scaling laws with an effective source diameter $D_\\text{eff} = 2.29\\,l$, effective Reynolds number $Re_{D_\\text{eff}} = 3 \\times 10^4$, at the low end of the range over which canonical jet scaling has been established, and spreading and decay constants nonetheless within the canonical round-jet range. Resolving both cuts shows that the turbulent normal stresses retain a bimodal, cut-dependent signature of the four-rotor source throughout the measurement domain.", "pdf_url": "https://arxiv.org/pdf/2608.30900v1"}, {"title": "CAER: Causal Action Effect Reweighting for World Model Training", "authors": ["Jianjie Fang", "Xvyuan Liu", "Ziyou Wang", "Rongze Tang", "Zhaolu Wang", "Zhuohang Li", "Xin Zhang", "Haisheng Su", "Chen Gao", "Wei Wu", "Xinlei Chen", "Yong Li"], "published": "2026-08-31", "summary": "World models are becoming core infrastructure for embodied intelligence, with action-conditioned video generation providing controllable predictions of how scenes evolve after agent interventions. Yet existing models are commonly trained with space-time-uniform mean squared error, allowing abundant background tokens to dominate the gradient while sparse interaction dynamics remain under-optimized; such uniform fitting rewards reconstructing appearance rather than learning how actions change the world. We introduce Causal Action Effect Reweighting (CAER), a general training paradigm that redistributes supervision toward the tokens whose predicted future is causally affected by the action. CAER contrasts the model's own predictions with and without action conditioning to localize these tokens online, then normalizes the resulting effect map into a weight that preserves the total coefficient mass and changes only where it is spent. This online signal requires no external annotations or offline preprocessing, avoids additional data-processing time, and scales naturally with model and dataset size. Experiments across heterogeneous action-conditioned world-model tasks show that CAER converges to better solutions than uniform MSE training, with consistent improvements in the physical consistency, controllability, and visual quality of generated videos.", "pdf_url": "https://arxiv.org/pdf/2608.30897v1"}, {"title": "SleepWalking: Privileged Representation Shaping for End-to-End Blind Locomotion in Legged Robots", "authors": ["Zheng Pan", "Tenghui Wang", "Peilin Li", "Shiyu Zhou", "Hao Sun", "Yan Ma", "Liang Yu", "Liang He"], "published": "2026-08-31", "summary": "Partially observable locomotion requires a policy to act when task-relevant properties of the robot--environment state are not fully specified by instantaneous observations. Existing approaches often address this challenge by explicitly estimating missing physical variables or processing extended observation histories through structured architectures. We take a different view: partial observability is fundamentally an information-retention problem. The decisive question is not how task-relevant information enters the network, but whether the policy's internal state retains it. Guided by this perspective, we propose SleepWalking for Robot Locomotion (SWAQ), a one-stage end-to-end framework that uses next-step privileged physical reconstruction to shape what a recurrent history representation retains during policy learning, while the deployed actor uses only a direct history-to-action pathway. Under aligned training settings, SWAQ achieves a 15.0\\% higher peak mean terrain level than DWAQ, the strongest non-exteroceptive baseline, while using 44.4\\% fewer inference MACs per control step. Layerwise probes further show that information associated with the reconstructed physical variables remains linearly decodable through the policy head up to the layer preceding the action output. Complementary theoretical analysis relates privileged-variable recoverability to the achievable-return gap between history-based and privileged-information policy classes. These results suggest that semantic objectives can structure learning without requiring a corresponding architectural decomposition of the deployed controller.", "pdf_url": "https://arxiv.org/pdf/2608.30883v1"}, {"title": "Zeva: In-Context Causal Learning for Generalizable Embodied Manipulation", "authors": ["Fu Chen", "Xin Ding", "Bingjia Huang", "Xiangyu Li", "Mingju Wang", "Jiawei He", "Kun Li", "Wei Sun", "Yunxin Liu", "Hao Wu", "Ting Cao"], "published": "2026-08-31", "summary": "Generalizable embodied manipulation remains difficult to achieve through pretraining alone, due to unseen physical conditions in the real world. We argue that robots need to learn from their own physical interactions on the fly during real-world deployment and use this knowledge to inform subsequent actions. We present Zeva, the first framework that enables in-context learning from a robot's own physical interaction experience while keeping the policy model frozen. Zeva employs a Causal Interaction Extractor to encode an executed action and its induced state change into a causal interaction signal, which is stored in a dual-timescale causal memory. For subsequent actions, relevant causal interaction signals are retrieved from memory and injected into the frozen policy model as context. Experiments in simulation and real-world manipulation demonstrate that Zeva achieves the best performance among the compared frontier VLAs and WAMs and, more importantly, enables self-evolution during deployment without gradient updates. Its success rate continues to improve as the robot accumulates interaction experience. Furthermore, the acquired interaction experience can generalize across tasks.", "pdf_url": "https://arxiv.org/pdf/2608.30880v1"}, {"title": "Provably Safe Decentralized Contingency MPC under State-Only Information and Limited Sensing for Nonlinear Multi-agent Systems", "authors": ["Max Studt", "Georg Schildbach"], "published": "2026-08-31", "summary": "This paper considers decentralized contingency MPC for multi-agent control under a state-only information pattern, with particular focus on limited sensing and plug-and-play operation. The objective is to retain recursive feasibility, safety, and Lyapunov-type convergence while reducing conservatism in local interaction handling. The framework relies on agent-wise fallback regions (safe sets) in which a feasible contingency maneuver to a safe equilibrium is always available. A novel safe-set update mechanism is introduced that supports less conservative decentralized interaction while preserving the underlying guarantees. This, in turn, enables memory-free local interaction and finite sensing ranges without requiring agents to reconstruct the exact neighbor geometry. The resulting scheme remains fully decentralized and preserves the shared-first-input contingency MPC structure. Theoretical guarantees and simulation results illustrate the effectiveness of the approach in dense multi-agent scenarios.", "pdf_url": "https://arxiv.org/pdf/2608.30874v1"}, {"title": "GAFT: Geo-Anchored Fine-Tuning for Hazard Identification from Rare Failures", "authors": ["Yanran Xu", "Chuanhang Qiu", "Yue Wang", "Wenbo Wu", "Zhaoxing Li"], "published": "2026-08-31", "summary": "Off-road navigation can fail when physical structures induce irrecoverable states such as high-centering or entrapment, requiring human interventions. Identifying these structures is crucial, yet challenging. Such failure events are rare and costly to collect, resulting in limited training data. Moreover, the collected data associate frames with outcomes, but do not indicate the visual cues responsible for the failure. Learning directly from these data can therefore exploit scenario-specific visual cues, leading to poor generalization. We propose \\textbf{Geo-Anchored Fine-Tuning (GAFT)}, a parameter-efficient method that adapts a vision foundation model with a geometry-derived prior. It guides LoRA adaptation by aligning a spatial attention-rollout map with the geometry prior, while preserving pretrained representations. On an intervention-verified forest hazard benchmark, across ten independently trained adaptations, GAFT consistently outperforms frozen DINOv2 and supervised PEFT baselines, improving the repeated leave-one-scenario-out mean $F_2$ from 0.0607 to 0.3757 with statistical significance under paired analysis. Within these independently trained models, the best-performing GAFT model achieves a repeated-LOSO $F_2$ of 0.570. Code and benchmark: https://github.com/Xu-Yanran/geo_anchored_fine_tuning", "pdf_url": "https://arxiv.org/pdf/2608.30858v1"}, {"title": "A Dual-Cam Parallel Elastic Actuator with Shared Gas-Spring Compensation for Humanoid Ankles", "authors": ["Jingcheng Jiang", "Yifang Zhang", "Nikos G. Tsagarakis"], "published": "2026-08-31", "summary": "To improve torque capacity and energy efficiency of humanoid ankles, this paper proposes a 2-DoF parallel elastic actuator (PEA). The main novelty of the proposed design lies in its dual-cam, single-gas-spring architecture, which enables torque compensation in both pitch and roll using a shared elastic element, thereby improving structural compactness compared with conventional multi-element compensation schemes. By leveraging parallel gas springs and customized cam modules, the proposed architecture provides dual-axis torque assistance tailored to specific task requirements. The second key contribution is the formulation of a coupled 2-DoF mathematical model that explicitly captures the interdependence between the two compensation units through the shared spring. Based on this model, an optimization-based design framework is developed to synthesize customized cam profiles from prescribed torque references, establishing a systematic link from task requirements to hardware realization. The complete lower-leg CAD integration is presented in detail. Static FEA and kinematic simulations confirm the design's feasibility and torque-relief effectiveness. The results highlight the proposed design as a compact, customizable solution for 2-DoF humanoid ankle torque compensation.", "pdf_url": "https://arxiv.org/pdf/2608.30832v1"}, {"title": "Lucida: Parse, Generate, and Place for Composable Real-to-Sim Scene Modeling", "authors": ["Minghan Qin", "Yuang Wang", "Xiuyu Yang", "Yushi Long", "Yujian Zhang", "Ruihuan Wang", "Kai Ye", "Yangang Zhang", "Hang Li"], "published": "2026-08-31", "summary": "Composable scene modeling aims to recover a real indoor scene as complete, editable object assets arranged as observed, giving robot simulation and embodied AI a simulation-ready replica of the real environment whose objects can be manipulated individually. Existing pipelines decompose the task into three steps---parse the observations into instances, generate an asset for each, and place each asset back---but every step presumes an input that a cluttered capture rarely provides: accurate instance geometry, unoccluded views, and assets that accurately match the observations. We propose Lucida, which keeps this order but redistributes the requirements, so each step consumes only what a real capture reliably provides and precision is reached at the end of the pipeline rather than demanded at its start. Lucida parses the video into a scene graph whose nodes carry per-instance multi-view evidence, generates a complete asset for each instance from its evidence, and places assets with GizmoAct, a VLM policy that casts placement as multi-turn GUI interaction, manipulating the object's gizmo in a closed loop and deciding itself when alignment is reached. Across scene-level 3D object detection, object pose estimation, and scene reconstruction, Lucida improves mAP over Boxer by 69% on R2S-Scene, raises ADD-SB@0.05 from 57.8% to 83.4% on CA-1M, and increases scene F-Score from 0.794 for SAM3D to 0.924.", "pdf_url": "https://arxiv.org/pdf/2608.30821v1"}, {"title": "A Composition-Aware Pretraining Framework for Geospatial Foundation Models", "authors": ["Aryan Kashyap Naveen", "Abhishek Srinivas", "Pranav Moothedath", "Shrutilipi Bhattacharjee"], "published": "2026-08-31", "summary": "Geospatial foundation models have emerged as state-of-the-art methods for downstream Earth observation tasks. However, existing pretraining methodologies process imagery through a single-concept lens, failing to capture the highly compositional nature of complex satellite scenes. We propose a composition-aware pretraining framework that explicitly encodes fractional land-cover mixtures. Each satellite image cell is mapped to a histogram representing its fractional land-cover distribution, which we term the \"composition target\". These targets serve as the primary prediction objective and are distilled into the backbone using Earth Mover's Distance. Experimental evaluation shows that composition-aware pretraining yields substantial gains on region-level understanding tasks requiring semantic similarity judgment, including zero-shot image retrieval and scene classification, while remaining competitive on tasks requiring fine-grained spatial precision, such as segmentation and object detection. With a 36.8M-parameter backbone, our framework outperforms SatMAE and Prithvi-EO-2.0, which contain 303M and 600M parameters, respectively, in most retrieval and scene classification settings. On the fine-grained ForestNet-12 dataset, a rigorous testbed for compositional discrimination, our method boosts baseline mAP@10 from 0.279 to 0.434, a 55.6% relative improvement, providing direct evidence for the effectiveness of explicit composition modeling. The code implementation can be found at https://github.com/05kashyap/GFM_Composition_Pretraining", "pdf_url": "https://arxiv.org/pdf/2608.30817v1"}, {"title": "Geometric Attractor Monitoring: A Robust and Frugal Framework for Multi-modal Industrial Robotic Cycles", "authors": ["Martin Bonsergent-Brachet", "Jesse Read", "Dany Abboud"], "published": "2026-08-31", "summary": "Monitoring the health of heterogeneous industrial robot fleets is severely challenged by the multi-modal nature of their operational cycles and a persistent scarcity of run-to-failure data. Standard data-driven approaches, particularly deep learning architectures relying on sequential reconstruction, often struggle in this specific setting; they tend to over-smooth complex dynamics, masking early signs of degradation. To address these industrial constraints, we reframe the monitoring problem through a framework based on Phase Space Reconstruction (PSR). Instead of predicting temporal sequences, this framework transforms univariate sensor data into a geometric attractor, explicitly unfolding the mechanical states independently of their temporal occurrence. By evaluating various anomaly scoring techniques within this space, we demonstrate that discrete support estimation provides an effective and computationally frugal Health Indicator (HI). Validated on a real-world dataset of 21 heterogeneous robots over three years and a synthetic Langevin system, our approach outperforms standard deep learning baselines. We show that aligning the algorithmic bias with the geometric properties of the target system yields a pragmatic, traceable and easily deployable approach perfectly tailored to the realities of industrial constraints.", "pdf_url": "https://arxiv.org/pdf/2608.30804v1"}, {"title": "Learning to infer and manipulate through distributed whole-arm interaction in a soft robot", "authors": ["Chuhan Zhang", "Ebrahim Shahabi", "Kseniia Khomenko", "Wei Pan", "Cosimo Della Santina"], "published": "2026-08-31", "summary": "In animals such as elephants and octopuses, acquiring non-visual information about an object and physically engaging with it are inseparable processes mediated by rich, large-area interactions between compliant appendages and the environment. Soft robots provide a natural platform for translating this principle into engineered systems. Yet current robotic intelligence makes limited use of physical interaction, treating it primarily as a disturbance to be rejected or, at best, as a means of compensating for object misalignment. Here, we introduce a physical intelligence framework in which distributed compliant interactions jointly reveal task-relevant information and organize manipulation behavior. This results in an intrinsically partially observable problem: key task-relevant information is never measured directly, but must instead be inferred from the history of physical interactions. We propose a reinforcement-learning architecture that addresses this challenge by learning a memory-based control policy end-to-end. The key innovations making this possible are (i) a pretrained exploration policy that provides a reference for broad workspace exploration, (ii) joint optimization that integrates exploration and grasping objectives within a single recurrent policy, and (iii) a two-stage sim-to-real adaptation including observation mapping and policy fine-tuning. We demonstrate this principle through blind whole-arm grasping with a hybrid rigid-soft robotic arm that we equip with IMUs embedded directly within its compliant structure, providing its only source of proprioceptive sensing. The learned policy successfully identifies and grasps various objects by autonomously coordinating workspace exploration, object encounter and localization, inference of grasp-relevant properties, and stable whole-arm wrapping.", "pdf_url": "https://arxiv.org/pdf/2608.30773v1"}, {"title": "T3S: Improving Multi-Task Reinforcement Learning with Task-Specific Feature Selector and Scheduler", "authors": ["Yuanqiang Yu", "Tianpei Yang", "Yongliang Lv", "Yan Zheng", "Jianye Hao"], "published": "2026-08-31", "summary": "Multi-task reinforcement learning (MTRL) is a technique to train multiple tasks simultaneously, where previous works usually train a single model to solve different tasks by sharing parameters across various tasks. However, these methods are faced with inter-task interference since what parameters should be shared across tasks is not addressed, dramatically reducing learning efficiency. To solve these problems, we propose a novel MTRL framework called Task-Specific feature Selector and Scheduler (T3S), which consists of two components: a feature selector and a task scheduler. Specifically, the feature selectors employ hypernetworks to construct task-specific soft masks, which can be applied by globally shared representation to construct task-specific features. The task scheduler selects tasks for learning through two metrics, where the selection probability is inversely proportional to task progress (e.g., success rate) and task learning speed. Experimental results show that T3S consistently outperforms the state-of-the-art MTRL algorithms on various robotics manipulation tasks.", "pdf_url": "https://arxiv.org/pdf/2608.30765v1"}, {"title": "A Phased Workflow for Operating LLM-Based Coding Agents", "authors": ["Ante Kapetanovic", "Tomislav Duricic", "Andro Mercep", "Emanuel Lacic"], "published": "2026-08-31", "summary": "LLM-based coding agents combine a foundation model with a harness that shapes agent behavior. For non-trivial tasks, how practitioners structure their work with the coding agents determines whether reliable results follow. We report on a phased workflow for operating coding agents developed by the AI research team at Infobip. The workflow structures agent-assisted development into four phases where human effort is front-loaded and delegation increases as artifacts mature. Context management is the central concern, addressed through four strategies applied at each phase to counter known failure modes. From practitioner experience, we observe that upstream errors in research and planning can compound across later phases, while correcting generated code can introduce bloat and fragility. This motivates front-loading human review. We identify two open problems: the absence of metrics for workflow effectiveness and the gap between formalized context management components and the workflow-level patterns that practitioners need.", "pdf_url": "https://arxiv.org/pdf/2608.30701v1"}, {"title": "Inferring Value Criteria from Ordinal Preferences: An Iterative In-Context Learning Framework for Music Generation", "authors": ["Futa Hidaka", "Naomi Imasato", "Kazuki Miyazawa", "Takato Horii"], "published": "2026-08-31", "summary": "Adapting a generative music system to an individual's taste requires learning what that listener values. Listeners can rank pieces, but their underlying criteria may be tacit and difficult to articulate. We ask whether and under what conditions a large language model (LLM) can adapt symbolic music generation from rankings alone and construct transferable natural-language descriptions of value criteria. In our iterative in-context learning framework, the LLM formulates hypotheses, generates candidate pieces in ABC notation, receives a ranking, and periodically infers and verbalizes value criteria from history to guide later generation. We evaluate the framework against 16 simulated raters in 480 adaptation runs using mixed-effects modeling, an ablation, and transfer tests on unseen music. Overall, the framework did not outperform a feedback-free diverse-generation baseline, but did so for two value functions with targets difficult to reach through simple sampling. How atypical the target was relative to the LLM's feedback-free generation tendencies predicted adaptation difficulty. Moreover, higher value during adaptation did not imply identification of the criterion as a general rule. On unseen music, acquired descriptions and histories improved generation for more value functions than they improved preference prediction, which remained near chance. Some gains were associated with acoustic proximity to music in the context, but others were not. These findings show that rankings alone can guide generation under limited conditions, while transferable criterion inference remains constrained by the foundation model's ability to recognize, reason about, and verbalize musical attributes.", "pdf_url": "https://arxiv.org/pdf/2608.30694v1"}, {"title": "Can Video World Models Track Unobserved World States?", "authors": ["Joonghyuk Shin", "Yicong Hong", "Jaesik Park", "Xun Huang"], "published": "2026-08-31", "summary": "Video world models are increasingly used as simulators, yet visual fidelity alone does not show that a model maintains the hidden state of the world. We examine this gap with an action-conditioned video Shell Game, a visual analog of $S_5$ state tracking that decouples visual rendering from compositing the hidden state underneath. Bidirectional and autoregressive Transformers, Mamba, and linear attention restricted to nonnegative transition eigenvalues all fit the training horizon of 5 swaps and then fall toward chance on longer swap chains (extrapolation) while still rendering plausible video with additional denoising steps providing no benefit. The pixel-based diffusion target never supervises the unseen hidden state, so the generated frames cannot carry it and the state has to live inside the architecture rather than in the tokens. For a Transformer, that architectural state is only an append-only KV cache, so the model has to re-derive the hidden arrangement from the whole history at every chunk. We find two mechanisms that do extrapolate, and both carry a state across chunks and revise it in place. Linear attention succeeds once its transition eigenvalues may be negative, and TTT with a nonlinear fast weight succeeds by updating the feature map through which it reads its own state. We further examine harder cases in dynamic world exploration tasks, and discuss the broader implications for building stateful video world models.", "pdf_url": "https://arxiv.org/pdf/2608.30692v1"}, {"title": "Failure or Drift? Evaluating Monocular SLAM under Synthetic and Real-World Corruptions", "authors": ["Abhay Skaria Thomas", "Shashank Agnihotri", "Margret Keuper"], "published": "2026-08-31", "summary": "Visual SLAM is commonly evaluated on clean trajectories, although deployment failures are often caused by adverse weather, illumination, blur, and sensor artifacts. Controlled corruptions are attractive because they isolate such factors, but a synthetic stress test is useful only when it leads to the same engineering conclusion as the condition it is intended to approximate. This work examines that question for monocular SLAM. We evaluate a classical feature-based system and two learned trackers under image-space, geometry-aware, and compound corruptions, and compare their behavior with adverse conditions from 4Seasons. Rather than reducing robustness to a single trajectory error, the evaluation separates explicit tracking failure from drift accumulated by methods that remain active. The results show that learned trackers largely replace catastrophic loss with sustained, and sometimes severe, drift. More importantly, the apparent ordering of the learned systems changes with the physical fidelity of the corruption: structured rain and fog proxies preserve the real-world ordering, whereas a simple illumination proxy does not. Code is available at: https://github.com/abhaythomas/master_thesis_vslamlab_robustness.", "pdf_url": "https://arxiv.org/pdf/2608.30690v1"}, {"title": "CIG-RL: Curiosity-Driven Information-Guided Reinforcement Learning for Source Term Estimation in Uncertain Environments", "authors": ["Junhee Lee", "Seunghwan Kim", "Hongro Jang", "Hyungjin Kim", "Hyoungho Park", "Changseung Kim", "Hyondong Oh"], "published": "2026-08-31", "summary": "Source term estimation (STE), which aims to estimate key properties of the gas source, is essential for identifying hazardous gas releases. Information-theoretic approaches have been adopted for autonomous STE using mobile sensors due to robustness in noisy environments, yet their online action selection incurs substantial computational cost. Deep reinforcement learning (DRL) provides a promising alternative with its fast decision-making capability. In DRL-based STE, the agent selects actions based on belief states of the source term updated from noisy measurement sequences. However, existing methods rely on random exploration or solely on belief uncertainty reduction without an effective exploration strategy in DRL, which can limit policy robustness in noisy environments. To address this, we propose a curiosity-driven information-guided reinforcement learning for robust and efficient STE. The proposed method promotes active exploration of novel belief state transitions that have not been sufficiently explored during training. We further introduce an uncertainty-adaptive active perception reward to guide efficient source search under uncertainty. Simulations under high-noise conditions and real-world experiments demonstrate the robustness and feasibility of the proposed framework, highlighting its potential for practical STE problems.", "pdf_url": "https://arxiv.org/pdf/2608.30673v1"}, {"title": "Event-Inference Reliability for Physical AI over Wireless Networks", "authors": ["Anup Mishra", "Petar Popovski"], "published": "2026-08-31", "summary": "Wireless-enabled physical artificial intelligence (physical AI) systems call for a shift from reliable data delivery to reliable inference of physical events. The relevant question is not only whether packets arrive, but whether the set of cues available at the decision node, i.e., the evidence, is sufficiently timely and informative to support reliable inference about the event. Accordingly, this paper develops a framework in which event-inference reliability (EIR) is determined jointly by cue informativeness, cue availability, and temporal admissibility. The latter is determined by the downstream task requirement and represented through the usefulness horizon. We define event-inference error ratio (EIER) as the normalised residual event uncertainty after incorporating admitted cues, and EIR as the corresponding normalised uncertainty reduction, both conditioned on decision-node context. We further distinguish the evidence-limited Bayes benchmark from operational performance of a particular inference engine and derive an entropy-based lower bound on the minimum achievable event error from the same decision-node information. The framework then enables an event-aware wireless design interface for cue prioritisation, cue-reliability allocation, and event-inference coverage characterisation. A multiclass indoor activity-inference study combining empirical cue likelihoods with wireless delivery instantiates the framework and demonstrates how it characterises EIR under finite usefulness horizons.", "pdf_url": "https://arxiv.org/pdf/2608.30663v1"}, {"title": "Temporal Forcing: 4D Representation Alignment for Vision-Language-Action Models", "authors": ["Xingyu Ding", "Yuzhong Zhao", "Chunhai Zhao", "Yinghuan Shi", "Chaoyang Zhao", "Yifan Zhang"], "published": "2026-08-31", "summary": "Recent vision-language-action (VLA) methods improve manipulation performance by aligning their representations with 3D scene geometry. However, these methods often struggle with long-horizon manipulation and observation aliasing between visually similar states due to a lack of temporal information: the 3D scene geometry captures only the current state, rather than how it has evolved over time. To resolve this, we present Temporal Forcing, a 4D representation alignment method for VLA models. Specifically, we first introduce a history pathway that enables a vanilla VLA model to summarize observation history into temporally aware latent representations. Then, the latent representations are aligned with the geometric features extracted by a pretrained 4D foundation model, which captures the evolving 3D world through temporally consistent geometric representations, enabling a deeper understanding of dynamic environments. Temporal Forcing reaches 98.8% on LIBERO, outperforming its base model by 2.2 points. On a physical hidden-placement task, it raises full-task success from 20.0% to 43.3%. Code will be publicly available.", "pdf_url": "https://arxiv.org/pdf/2608.30643v1"}, {"title": "Cost-efficient Active Learning for Referring Image Segmentation and Grounding", "authors": ["Junbeom Hong", "Seonghoon Yu", "Hyung Rok Jung", "Sundong Kim", "Jeany Son"], "published": "2026-08-31", "summary": "Collecting natural-language referring expressions along with region annotations, such as masks or boxes, is a major bottleneck in visual grounding (VG), as annotators must write descriptions that distinguish target regions from visually similar ones. We tackle this by formulating active learning (AL) for VG under the realistic setting where only raw images are available without accompanying text. Since ground-truth text is unavailable, sample selection must estimate which images contain ambiguous regions that would require discriminative referring expressions. To address this, we generate auxiliary region-text pairs using foundation models, and introduce Referred Region Ambiguity, a new acquisition function that measures whether the model's confidence collapses onto a single region or disperses across multiple candidates. It allows our method to prioritize images with strong cross-region competition, which are more informative due to their visual ambiguity. We also design a referring-expression annotation interface that helps annotators quickly focus on writing discriminative language with a few clicks. Experiments on RIS and REC benchmarks show that our AL framework consistently outperforms several AL baselines, while a user study shows up to 1.6X faster description labeling of ours.", "pdf_url": "https://arxiv.org/pdf/2608.30621v1"}, {"title": "Learning Radio Astronomical Representations with LeJEPA and Very Small Models", "authors": ["Erica Lastufka", "Mariia Drozdova", "Vitaliy Kinakh", "Taras Holotyak", "Miroslava Dessuages-Zavadsky", "Daniel Schaerer", "Svyatoslav Voloshynovskiy"], "published": "2026-08-31", "summary": "Representations learned by vision foundation models pretrained on natural images have been shown to be useful for out-of-domain astronomical images. Performance on scientific downstream tasks increases with model size, which both carries higher inference costs and limits scalability, even when considering parameter-efficient adaptation. An alternative is to learn representations directly from astronomical observations rather than natural images, through self-supervised pretraining. We evaluate LeJEPA's ability to learn robust representations using very small vision models ($\\sim$6M parameters) pretrained on Radio Galaxy Zoo images, comparing with established self-supervised frameworks. We test whether LeJEPA's latent-space regularization leads to better radio galaxy morphology classification. Across three evaluation datasets, LeJEPA achieves performance comparable to a substantially larger foundation model while producing more consistent representations across training and evaluation datasets. These results suggest that the choice of representation learning objective is critical for enabling small domain-specific models to achieve performance competitive with representations transferred from large foundation models in scientific imaging.", "pdf_url": "https://arxiv.org/pdf/2608.30594v1"}, {"title": "TuringLLM: Efficiently Scaling Foundation Models Toward Physical AI", "authors": ["Yuheng Zhang", "Yizhao Wang", "Da Zhu", "Hua Zhou", "Yue He", "Jiah
