", "date": "2026-06-18", "url": "https://www.therobotreport.com/microbot-medical-expands-veteran-access-robotic-surgery-liberty/", "summary": "<p>Lovell Government Services will become Microbot's service-disabled veteran-owned small business vendor to supply federal programs.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/microbot-medical-expands-veteran-access-robotic-surgery-liberty/\">Microbot Medical to expand veteran access to robotic surgery with LIBERTY<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Richtech Robotics launches livestream for ADAM AI-powered humanoid", "source": "Robotics Business Review", "date": "2026-06-18", "url": "https://www.therobotreport.com/richtech-robotics-launches-livestream-adam-ai-powered-humanoid/", "summary": "<p>Online users will be able to engage with service robot ADAM, which uses NVIDIA technology, says Richtech Robotics.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/richtech-robotics-launches-livestream-adam-ai-powered-humanoid/\">Richtech Robotics launches livestream for ADAM AI-powered humanoid<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "The Secret to Marathon-Winning Humanoid Robots", "source": "IEEE Spectrum Robotics", "date": "2026-06-17", "url": "https://spectrum.ieee.org/china-humanoid-robot-marathon", "summary": "<img src=\"https://spectrum.ieee.org/media-library/a-red-and-black-humanoid-runs-alone-through-a-marathon-course.jpg?id=66940897&amp;width=1245&amp;height=700&amp;coordinates=0%2C66%2C0%2C66\" /><br /><br /><p>On 19 April 2026, the <a href=\"https://www.cnn.com/2026/04/19/china/china-robot-half-marathon-intl-hnk\" rel=\"noopener noreferrer\" target=\"_blank\">Honor Lightning humanoid robot ran a half-marathon in 50 minutes and 26 seconds<\/a>, beating the human world record by 7 minutes and the best robot time from 2025 by almost 2 hours.<\/p><p>How did Honor do it? Is there some magical technology or technique that unlocked this performance? How did the company beat the significantly better-known Unitree (which reportedly had to supply its robot with an ice backpack to try and complete the race without overheating)? My doctoral thesis involved <a href=\"https://www.avikde.me/p/phd-defense\" rel=\"noopener noreferrer\" target=\"_blank\">building and controlling hopping and running robots<\/a>, and <a href=\"https://www.avikde.me/p/ghost-robotics-minitaur\" rel=\"noopener noreferrer\" target=\"_blank\">since then I’ve tried to design and build efficient commercial legged robots<\/a>, giving me a decent idea of the constraints involved. In this article, we take a look at the fundamental underlying constraints to try and answer these questions.<\/p><h3>The Physics of Running<\/h3><p><a href=\"https://spectrum.ieee.org/ai-institute\" target=\"_blank\">Running<\/a> consists of alternating phases of a leg pushing against the ground (“stance phase”) and the body flying through the air (“aerial phase”). In the aerial phase, the body falls due to gravity, losing vertical momentum. The leg in stance phase pushes against the ground to redirect the vertical momentum upward, while the other leg swings forward to reposition for the next foothold.<\/p><p><a href=\"https://spectrum.ieee.org/ev-motor\" target=\"_blank\">Electric motors<\/a> use energy to produce torque—the higher the torque, the more energy is lost as heat. Adding a gear train after the motor amplifies its torque and reduces its speed. A large reduction helps with torque production, but since the rotor of the motor itself has to spin faster, it becomes very sluggish at accelerating its output. This is obviously bad for the swing phase described above. These competing effects mean that for a particular motor, there is usually a sweet spot for the gear ratio:<\/p><p class=\"shortcode-media shortcode-media-rebelmouse-image\"> <img alt=\"A graph showing the relationship between gearing and motor efficiency, with an optimal gearing ratio in the relationship between stance and swing.\" class=\"rm-shortcode\" id=\"10bd7\" src=\"https://spectrum.ieee.org/media-library/a-graph-showing-the-relationship-between-gearing-and-motor-efficiency-with-an-optimal-gearing-ratio-in-the-relationship-between.jpg?id=66940901&amp;width=980\" /> <small class=\"image-media media-caption\">The power consumed by a robot leg is minimized at an optimal gear ratio (30:1 in this example).<\/small><small class=\"image-media media-photo-credit\">Avik De/Datawrapper<\/small><\/p><h3>How Honor Did It<\/h3><p>While the Lightning’s motor specifications are not published, the hip and knee motors roughly have a 110-to-150-millimeter outer diameter. For an approximate set of motor parameters, I looked to the <a href=\"https://www.tq-group.com/en/products/tq-robodrive/servo-kits/ilm115x25/\" target=\"_blank\">ILM115x25 motor<\/a> due to its relevant size and detailed specifications.<\/p><p>We can use a simple physics model to estimate the power consumption for running at 7 meters per second (the Lightning’s average half-marathon speed) as gear ratio varies:<\/p><p class=\"shortcode-media shortcode-media-rebelmouse-image\"> <img alt=\"A graph showing that optimal gearing for a robot\\u2019s motor dissipates the amount of heat that the motor generates.\" class=\"rm-shortcode\" id=\"185f3\" src=\"https://spectrum.ieee.org/media-library/a-graph-showing-that-optimal-gearing-for-a-robot-u2019s-motor-dissipates-the-amount-of-heat-that-the-motor-generates.jpg?id=66940912&amp;width=980\" /><small class=\"image-media media-caption\">The light blue curve shows how to pick the optimal gearing (45:1). The dark blue curve shows how much heat will be produced in the knee motor, ~150W for the optimal gearing.<\/small><small class=\"image-media media-photo-credit\">Avik De/Datawrapper<\/small><\/p><p>We see that the drivetrain is not magical: with a gear ratio <em><em>chosen for this task<\/em><\/em> (we’ll return to this below), the approximate robot power consumption would be a very reasonable 400 watts.<\/p><p>However, the dissipated knee power ( typically the main thermal limiting factor) is approximately 150 W. This is almost an unavoidable consequence—running at human speeds with a humanoid-size robot will inevitably generate this amount of heat! Over a prolonged period, keeping the motor from overheating would be a challenge, but the Lightning has a <a href=\"https://eu.36kr.com/en/p/3775418378027520\" target=\"_blank\">trick up its sleeve<\/a>:<\/p><blockquote>According to Honor, the liquid-cooling pipes penetrate deep into the motors like capillaries. The high-power liquid pump has a heat-exchange flow rate of more than 4 liters per minute. Each of the four drive motors in the lower limbs is equipped with an independent liquid-cooling circuit.<\/blockquote><p>Liquid cooling is not new, but it’s definitely not a commodity. It has shown up in research periodically, and on the commercial side <a href=\"https://apptronik.com/news-collection/apptronik-readies-its-humanoid-robot-for-a-summer-unveil\" target=\"_blank\">Apptronik tried it for a few of its prototypes<\/a> but (to my knowledge) does not use it on its main <a href=\"https://apptronik.com/apollo\" target=\"_blank\">Apollo<\/a> platform. Basic air-convection-based cooling would not continuously be able to extract 150 W out of the knee motor, and so the cooling technology is a key enabler of this type of performance.<\/p><h3>Why Others Couldn’t Compete<\/h3><p>Why did Honor’s competitors, including more <a href=\"https://www.forbes.com/sites/johnkoetsier/2026/01/09/top-10-humanoid-robot-companies-by-shipments-revealed/\" target=\"_blank\">established and widely shipped humanoids<\/a> such as from <a href=\"https://www.unitree.com/g1\" target=\"_blank\">Unitree<\/a> or <a href=\"https://www.agibot.com/\" target=\"_blank\">Agibot<\/a>, not compete as well?<\/p><p>We can use the same model to generate an equivalent energetics plot for walking at 1.5 m/s, a much more modest but potentially more common activity for a commercial humanoid robot:<\/p><p class=\"shortcode-media shortcode-media-rebelmouse-image\"> <img alt=\"A graph showing that robots with gear ratios optimized for running or walking are inefficient when walking or running respectively.\" class=\"rm-shortcode\" id=\"616f5\" src=\"https://spectrum.ieee.org/media-library/a-graph-showing-that-robots-with-gear-ratios-optimized-for-running-or-walking-are-inefficient-when-walking-or-running-respective.jpg?id=66940939&amp;width=980\" /> <small class=\"image-media media-caption\">The solid and dashed light blue lines show a running-optimized design, while green lines show a walking-optimized design. The optimal ratio for walking is much lower (30:1 vs. 45:1). However, the power dissipated in the knee motor while running [dark blue] is much higher at 30:1 vs. 45:1—the price to pay for running with a walking-optimized design.<\/small><small class=\"image-media media-photo-credit\">Avik De/Datawrapper<\/small><\/p><p>The plot adds a new green curve for the walking power, and the optimal gearing is significantly different!<\/p><p>Let’s say you design your robot to excel at the normal walking task and choose the green design with 30:1 gearing. The knee motor power to run a half marathon is over 300 W (red arrow), more than two times what we had with the running-optimized design. It wouldn’t be so surprising to need ice packs!<\/p><p>Conversely, visually following the green curve shows that the running-optimized robot wastes more power for walking. Using larger motors sized for running increases the weight of the robot and wastes power when it is standing or walking. The larger motors also pose practical issues like bumping into objects while operating in homes or factories.<\/p><h3>Closing Thoughts<\/h3><p>Honor’s half-marathon performance was an impressive engineering effort and result. It didn’t need any magical leaps in technology, but the deployment of the capillary motor cooling solution is a notable advance without which this running pace would have been unsustainable. The cooling, weight optimization, and robustness advances may well be useful for more practical purposes like carrying heavy payloads down the line.<\/p><p class=\"shortcode-media shortcode-media-rebelmouse-image\"> <img alt=\"A comparison showing two similar humanoid robots, but one has significantly smaller motors on its hips.\" class=\"rm-shortcode\" id=\"19121\" src=\"https://spectrum.ieee.org/media-library/a-comparison-showing-two-similar-humanoid-robots-but-one-has-significantly-smaller-motors-on-its-hips.jpg?id=66941011&amp;width=980\" /> <small class=\"image-media media-caption\">The Honor Lighting robot [right] has much larger motors driving its legs than the Unitree H1 robot, making it a more efficient runner but a less efficient walker.<\/small><small class=\"image-media media-photo-credit\">Left: Wei Zhiyang/Zhejiang Daily Press Group/VCG/Getty Images; Right: VCG/Getty Images<\/small><\/p><p>However, the Lightning is not as well-suited to other tasks as a robot designed for greater versatility. Engineering is always characterized by trade-offs, and making the correct ones separates good products from great ones. With consistently improving AI language models, this very human skill is becoming the most valuable one an engineer can have.<\/p><p>The news coverage seemed to overly focus on the fact that the human half-marathon record had been broken by a robot. Machines and humans have very different capabilities and constraints, so why should we ever have expected the half-marathon time for a robot and human to be related? As in <a href=\"https://en.wikipedia.org/wiki/Deep_Blue_versus_Garry_Kasparov\" target=\"_blank\">Deep Blue’s 1997 defeat of Garry Kasparov in chess<\/a>, where it couldn’t physically move the pieces, the Honor robot’s capabilities are much narrower than a human running elbow to elbow with other runners while visually navigating the course without GPS. Comparing the robot runner to a human runner is just an apples-to-oranges comparison, which only risks diminishing Honor’s engineering achievement on one hand and human athletic achievement on the other.<\/p>"}, {"title": "Sanctuary AI validates physical AI performance at Tier 1 automotive supplier", "source": "Robotics Business Review", "date": "2026-06-17", "url": "https://www.therobotreport.com/sanctuary-ai-validates-physical-ai-performance-tier-1-automotive-supplier/", "summary": "<p>Sanctuary AI is not waiting for humanoid robots; it's applying physical AI to demonstrate production-ready performance.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/sanctuary-ai-validates-physical-ai-performance-tier-1-automotive-supplier/\">Sanctuary AI validates physical AI performance at Tier 1 automotive supplier<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Evaluating humanoids for surface finishing applications", "source": "Robotics Business Review", "date": "2026-06-17", "url": "https://www.therobotreport.com/evaluating-humanoids-for-surface-finishing-applications/", "summary": "<p>Most manufacturing applications aim to reduce cycle time to improve throughput. Using general-purpose industrial robots that transcend human constraints is often an attractive option.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/evaluating-humanoids-for-surface-finishing-applications/\">Evaluating humanoids for surface finishing applications<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Fennec Engineering earns T2 qualification for Advanced Safety Acceleration Platform", "source": "Robotics Business Review", "date": "2026-06-17", "url": "https://www.therobotreport.com/fennec-engineering-earns-t2-qualification-advanced-safety-acceleration-platform/", "summary": "<p>Fennec Engineering has obtained certification confirming that its automated traceability platform meets strict safety standards.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/fennec-engineering-earns-t2-qualification-advanced-safety-acceleration-platform/\">Fennec Engineering earns T2 qualification for Advanced Safety Acceleration Platform<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Autonomique deploys semi-humanoid robots and AI at Canadian Tier 1", "source": "Robotics Business Review", "date": "2026-06-17", "url": "https://www.therobotreport.com/autonomique-deploys-semi-humanoid-robots-canadian-tier-1/", "summary": "<p>Autonomique has moved its AI-powered robots from pilot to production at F&#038;P Mfg., with plans for deployment across F-tech's global network.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/autonomique-deploys-semi-humanoid-robots-canadian-tier-1/\">Autonomique deploys semi-humanoid robots and AI at Canadian Tier 1<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "PSYONIC partners with ABB Robotics to apply human touch to robot dexterity", "source": "Robotics Business Review", "date": "2026-06-16", "url": "https://www.therobotreport.com/psyonic-abb-robotics-partner-apply-human-touch-data-robot-dexterity/", "summary": "<p>PSYONIC is combining its Ability Hand with ABB Robotics' GoFa cobot arm to apply data from prosthetics users to robotic grasping.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/psyonic-abb-robotics-partner-apply-human-touch-data-robot-dexterity/\">PSYONIC partners with ABB Robotics to apply human touch to robot dexterity<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Built Robotics, Penn xLAB to develop physical AI for construction", "source": "Robotics Business Review", "date": "2026-06-16", "url": "https://www.therobotreport.com/xlab-and-built-robotics-partner-to-advance-construction/", "summary": "<p>xLAB and Built Robotics partner to capture additional data, advancing AI models to improve construction site safety.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/xlab-and-built-robotics-partner-to-advance-construction/\">Built Robotics, Penn xLAB to develop physical AI for construction<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Kawasaki Robotics to debut RL030N physical AI platform at Automate", "source": "Robotics Business Review", "date": "2026-06-16", "url": "https://www.therobotreport.com/kawasaki-robotics-debut-rl030n-physical-ai-platform-automate/", "summary": "<p>Kawasaki Robotics says its 8-DoF robot, Pulseboard inspection tech, and other systems will show its vision for intelligent automation.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/kawasaki-robotics-debut-rl030n-physical-ai-platform-automate/\">Kawasaki Robotics to debut RL030N physical AI platform at Automate<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Genesis AI launches Eno general-purpose robot", "source": "Robotics Business Review", "date": "2026-06-16", "url": "https://www.therobotreport.com/genesis-ai-launches-eno-general-purpose-robot/", "summary": "<p>Genesis plans to begin Eno’s production and targeted customer deployments by the end of 2026, with home deployments coming later. <\/p>\n<p>The post <a href=\"https://www.therobotreport.com/genesis-ai-launches-eno-general-purpose-robot/\">Genesis AI launches Eno general-purpose robot<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}], "embeddedNews": [{"title": "Cut And Fold Your 3D Printer’s Next Cover", "source": "Hackaday", "date": "2026-07-15", "url": "https://hackaday.com/2026/07/15/cut-and-fold-your-3d-printers-next-cover/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"450\" src=\"https://hackaday.com/wp-content/uploads/2026/07/Snapmaker-U1-top-cover-coroplast-2-banner.png?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>[cmh]&#8217;s ultra-simple top cover for the Snapmaker U1 3D printer has a 3D model, but don&#8217;t let that fool you. There&#8217;s no 3D printing at all involved in this project. Rather, <a class=\"read-more\" href=\"https://hackaday.com/2026/07/15/cut-and-fold-your-3d-printers-next-cover/\">&#8230;read more<\/a>"}, {"title": "FLOSS Weekly Episode 875: JavaScript as a Systems Language", "source": "Hackaday", "date": "2026-07-15", "url": "https://hackaday.com/2026/07/15/floss-weekly-episode-875-javascript-as-a-systems-language/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"484\" src=\"https://hackaday.com/wp-content/uploads/2021/06/Pipewire.jpg?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>This week Jonathan chats with Nariman Jelveh about Puter! It&#8217;s the project that takes the idea of the Browser-as-the-OS seriously. Why did a simulated desktop on the web take off, <a class=\"read-more\" href=\"https://hackaday.com/2026/07/15/floss-weekly-episode-875-javascript-as-a-systems-language/\">&#8230;read more<\/a>"}, {"title": "Hayabusa2’s Next Target is a Tiny 11 Meter Asteroid", "source": "Hackaday", "date": "2026-07-15", "url": "https://hackaday.com/2026/07/15/hayabusa2s-next-target-is-a-tiny-11-meter-asteroid/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"356\" src=\"https://hackaday.com/wp-content/uploads/2026/07/1998_KY26_concave_shape_model_Santana-Ros_2025.png?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>Launched in 2014, Japan&#8217;s Hayabusa2 spacecraft completed its primary asteroid sample return mission all the way back in 2020. But with the main spacecraft still healthy, the intrepid little probe <a class=\"read-more\" href=\"https://hackaday.com/2026/07/15/hayabusa2s-next-target-is-a-tiny-11-meter-asteroid/\">&#8230;read more<\/a>"}, {"title": "Putting Some Zig in a Linux-Based 3D Printer", "source": "Hackaday", "date": "2026-07-15", "url": "https://hackaday.com/2026/07/15/putting-some-zig-in-a-linux-based-3d-printer/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"484\" src=\"https://hackaday.com/wp-content/uploads/2026/07/CrossCompiling.jpg?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>Having Linux on so many devices is both a blessing and a curse. Sure, it is great that you can hack on things and modify them or even totally repurpose <a class=\"read-more\" href=\"https://hackaday.com/2026/07/15/putting-some-zig-in-a-linux-based-3d-printer/\">&#8230;read more<\/a>"}, {"title": "Making a Locked Down Wearable Work Without a Subscription", "source": "Hackaday", "date": "2026-07-15", "url": "https://hackaday.com/2026/07/15/making-a-locked-down-wearable-work-without-a-subscription/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"400\" src=\"https://hackaday.com/wp-content/uploads/2026/07/OpenStrapWHOOP.png?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>WHOOP does not have the presence in the wearable space as other brands, but in certain circles, it&#8217;s a household name. Their business model requires you to have a yearly <a class=\"read-more\" href=\"https://hackaday.com/2026/07/15/making-a-locked-down-wearable-work-without-a-subscription/\">&#8230;read more<\/a>"}, {"title": "Hacking Around the Financial Pain of New 3DS XL Top Screens", "source": "Hackaday", "date": "2026-07-15", "url": "https://hackaday.com/2026/07/15/hacking-around-the-financial-pain-of-new-3ds-xl-top-screens/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"451\" src=\"https://hackaday.com/wp-content/uploads/2026/07/new_3ds_xl_screen_hack_skawo_youtube.jpg?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>With Nintendo&#8217;s 3DS experiencing a bit of a renaissance lately, prices for functioning systems have shot through the roof. Getting a busted one with a broken screen is a lot <a class=\"read-more\" href=\"https://hackaday.com/2026/07/15/hacking-around-the-financial-pain-of-new-3ds-xl-top-screens/\">&#8230;read more<\/a>"}, {"title": "AIM-ing For a More Open Platform Than Discord", "source": "Hackaday", "date": "2026-07-15", "url": "https://hackaday.com/2026/07/14/aim-ing-for-a-more-open-platform-than-discord/", "summary": "<div><img alt=\"The OpenOscar Server in terminal, with Pidgin connected\" class=\"attachment-large size-large wp-post-image\" height=\"360\" src=\"https://hackaday.com/wp-content/uploads/2026/07/OpenOscar.png?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>Do you remember AIM? It may suprize you to hear that AOL&#8217;s instant messanger was actually supported all the way up to 2017&#8211; two years after Discord launched. Unlike Discord, <a class=\"read-more\" href=\"https://hackaday.com/2026/07/14/aim-ing-for-a-more-open-platform-than-discord/\">&#8230;read more<\/a>"}, {"title": "Bigme Hibreak Dual 2 – An Android 16 smartphone with 6.13-inch 80fps E-Ink and 5-inch LCD display (Crowdfunding)", "source": "CNX Software", "date": "2026-07-15", "url": "https://www.cnx-software.com/2026/07/15/bigme-hibreak-dual-2-an-android-16-smartphone-with-6-13-inch-80fps-e-ink-and-5-inch-lcd-display/", "summary": "<div><img alt=\"Bigme Hibreak Dual 2 – An Android 16 smartphone with 6.13 inch 80fps E Ink and 5 inch LCD display\" class=\"attachment-medium size-medium wp-post-image\" height=\"480\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/07/Bigme-Hibreak-Dual-2-–-An-Android-16-smartphone-with-6.13-inch-80fps-E-Ink-and-5-inch-LCD-display-720x480.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Bigme has launched the Hibreak Dual 2, an Android 16 smartphone with a 6.13-inch 80fps E-Ink display on the front and a 5-inch LCD on the rear. Built around the MediaTek Dimensity 8300 processor and supports dual 5G connectivity, positioning it as an E-Ink smartphone with flagship-class hardware. The front E-Ink can be used for reading, writing, and general everyday use, whereas the LCD in the back serves as a conventional smartphone display for applications that require higher refresh rates and full-color output, like video gaming and navigation. This dual-screen setup allows users to switch between the two displays depending on the task. Bigme Hibreak Dual 2 specifications: SoC – MediaTek Dimensity 8300 CPU &#8211; Octa-core processor with 4x Arm Cortex-A715 and 4x Cortex-A510 GPU &#8211; Arm Mali-G615 VPU Video Encoding &#8211; H.264, HEVC Video Playback &#8211; H.264, HEVC, VP9, AV1 AI accelerator &#8211; MediaTek NPU 780 Memory – 12GB [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/07/15/bigme-hibreak-dual-2-an-android-16-smartphone-with-6-13-inch-80fps-e-ink-and-5-inch-lcd-display/\">Bigme Hibreak Dual 2 – An Android 16 smartphone with 6.13-inch 80fps E-Ink and 5-inch LCD display (Crowdfunding)<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Reverse-engineering brings RK3576 NPU support to open-source Rocket driver for mainline Linux", "source": "CNX Software", "date": "2026-07-15", "url": "https://www.cnx-software.com/2026/07/15/reverse-engineering-brings-rk3576-npu-support-to-open-source-rocket-driver-for-mainline-linux/", "summary": "<div><img alt=\"Rockchip RK3576 open source NPU driver\" class=\"attachment-medium size-medium wp-post-image\" height=\"520\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/07/Rockchip-RK3576-open-source-NPU-driver-720x520.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Back in 2024, we noted that the open-source driver for RK3588&#8217;s NPU by Tomeu Vizoso delivered decent performance for object detection. Since then, good progress has been made, and it&#8217;s now known as the Rocket driver in mainline Linux. However, the Rockchip RK3576 SoC is not supported by the Rocket driver in mainline yet, despite sharing a similar NPU. The good news is that Ga Hing Woo has been working on mainline Linux support for the Rockchip RK3576 NPU using the Rocket driver stack and has tested the updates on the Radxa ROCK 4D running Linux 7.1-rc5. This required some serious reverse-engineering work due to hidden registers not documented in the TRM. Ga Hing Woo (also written as Jiaxing Hu) sent us an email explaining some of the challenges: Single int8 convolution now comes out byte-exact against a CPU reference on the open stack. Getting there meant reverse-engineering the compute [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/07/15/reverse-engineering-brings-rk3576-npu-support-to-open-source-rocket-driver-for-mainline-linux/\">Reverse-engineering brings RK3576 NPU support to open-source Rocket driver for mainline Linux<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Big Savings Alert! AIVON PCBA Monthly SMT Special Deals + Free Shipping (Sponsored)", "source": "CNX Software", "date": "2026-07-15", "url": "https://www.cnx-software.com/2026/07/15/big-savings-alert-aivon-pcba-monthly-smt-special-deals-free-shipping/", "summary": "<div><img alt=\"AVION PCBA Special Offers July 2026\" class=\"attachment-medium size-medium wp-post-image\" height=\"390\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/07/AVION-PCBA-Special-Offers-July-2026-720x390.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>In today’s fast-paced electronics industry, bringing innovative products from b-wifi-adapter/", "summary": "pico-usb-wifi by 白一百 is firmware for the Raspberry Pi Pico W that turns it into a driverless USB WiFi adapter, enumerating as a USB CDC-NCM device. The firmware works as a transparent layer-2 bridge that forwards frames between the Pico W’s wireless interface and its USB interface. The host’s USB interface adopts the Pico W [&#8230;]"}, {"title": "Boost REM Sleep with a Wearable", "source": "Adafruit", "date": "2026-07-15", "url": "https://blog.adafruit.com/2026/07/15/boost-rem-sleep-with-a-wearable/", "summary": "Credit: Huiliang &#8220;Evan&#8221; Wang via The University of Texas in Austin A team of researchers led by The University of Texas in Austin have developed a soft wearable device called &#8220;NEUSLeeP&#8221; capable of stimulating deep brain regions and monitoring brain activity in real time. The study, published in Nature Communications, helped boost participants REM sleep. [&#8230;]"}, {"title": "An Arduino library for controlling compatible Kenwood audio equipment", "source": "Adafruit", "date": "2026-07-15", "url": "https://blog.adafruit.com/2026/07/15/an-arduino-library-for-controlling-compatible-kenwood-audio-equipment/", "summary": "Do you have certain Kenwood equipment and wish to controll them via software? KenwoodXS is an Arduino library for controlling and monitoring compatible Kenwood audio equipment over the proprietary Kenwood XS System Control bus. The library can send raw command bytes and includes named helpers for common receiver, tape deck, and CD player commands discovered [&#8230;]"}, {"title": "Crafting a panel meter calculator with floating point", "source": "Adafruit", "date": "2026-07-15", "url": "https://blog.adafruit.com/2026/07/15/crafting-a-panel-meter-calculator-with-floating-point/", "summary": "Michał Zalewski on the lcamtuf’s thing blog writes: I’m a bit of a calculator nerd. For a while, calculators lagged behind general-purpose computing because of the lack of a suitable display technology. I constructed the display itself out of six generic “SO-45” panel voltmeters from Amazon, plus one vintage edgewise voltmeter scored on eBay. The panel [&#8230;]"}, {"title": "How To Read More Books", "source": "Adafruit", "date": "2026-07-15", "url": "https://blog.adafruit.com/2026/07/15/how-to-read-more-books/", "summary": "Are we approaching a reading crisis or does &#8220;THE END OF READING IS HERE&#8221; just make for a catchy headline?  Sounds like a lot of hand-wringing to me, but reading is fun! I hit a rut in my reading  and was amazed at how much an e-reader helped me dive back into content over 280 [&#8230;]"}, {"title": "Drawing a moving 3D internal combustion engine", "source": "Adafruit", "date": "2026-07-15", "url": "https://blog.adafruit.com/2026/07/15/drawing-a-moving-3d-internal-combustion-engine/", "summary": "Bartosz Ciechanowski discusses the invention of the internal combustion engine in the 19th century and how it has revolutionized transportation over land, water, and air. All with detailed 3D images, many moving. Despite their omnipresence in modern day, the operation of an engine may be cryptic. Over the course of this article I’d like to [&#8230;]"}, {"title": "Obfuscated, self-evaluating bash script by CDN Akamai being supplied to consumers via retail stores", "source": "Adafruit", "date": "2026-07-15", "url": "https://blog.adafruit.com/2026/07/15/obfuscated-self-evaluating-bash-script-by-cdn-akamai-being-supplied-to-consumers-via-retail-stores/", "summary": "Tris Sherliker was made aware of an interesting shirt by CDN Akamai supplied via Uniqlo stores in support of their Peace for All campaign. Is that … a shebang?! My wife was right that I’d want to see it. Was that… a shebang? Take a closer look at the text block (above, partial) Yes, a shebang! [&#8230;]"}, {"title": "Designing and assembling my first PCB", "source": "Adafruit", "date": "2026-07-15", "url": "https://blog.adafruit.com/2026/07/15/designing-and-assembling-my-first-pcb/", "summary": "Tadas Vilkeliskis posts about making their first printed circuit board: About a couple months ago I purchased an Arduino Nano ESP32 dev board&#8230;Next was getting some peripherals so I ordered a small LCD and BME280 temperature/humidity sensor breakout boards. Both of these I was able to wire up to the ESP32 chip and get them [&#8230;]"}, {"title": "Pick the Perfect Plant: Battery-Powered Sun Tracking #Light #AdafruitLearningSystem @Adafruit", "source": "Adafruit", "date": "2026-07-15", "url": "https://blog.adafruit.com/2026/07/15/pick-the-perfect-plant-battery-powered-sun-tracking-light-adafruitlearningsystem-adafruit/", "summary": "Ever wonder if that empty corner of your yard is actually fit for sun-loving tomatoes or better off with shade-tolerant hostas? Instead of playing the gardening guessing game, this Learn guide walks you through building a battery-powered data logger designed to track the amount of sun a certain part of your garden gets on an [&#8230;]"}, {"title": "JP’s Product Pick of the Week 7/14/26 – Adafruit ADS7128 8-Channel ADC and GPIO Expander – STEMMA QT / Qwiic #newproductpick", "source": "Adafruit", "date": "2026-07-15", "url": "https://blog.adafruit.com/2026/07/15/jps-product-pick-of-the-week-7-14-26-adafruit-ads7128-8-channel-adc-and-gpio-expander-stemma-qt-qwiic-newproductpick/", "summary": "If you missed this week’s livestream of John Park’s Product Pick(s) of the Week, not to worry, here’s the video. This week’s pick is the Adafruit ADS7128 8-Channel ADC and GPIO Expander &#8211; STEMMA QT / Qwiic! Watch the video to find out about the Adafruit ADS7128 8-Channel ADC and GPIO Expander &#8211; STEMMA QT [&#8230;]"}, {"title": "How to build a circular LCD clock", "source": "Adafruit", "date": "2026-07-15", "url": "https://blog.adafruit.com/2026/07/15/how-to-build-a-circular-lcd-clock/", "summary": "blinry wanted a clock in the kitchen without relying on the small one on the oven. So I recently built a wall clock from a circular LCD screen! It’s really great because it can display any clock face you want, even ones you code yourself! Waveshare’s 7 inch circular LCD Raspberry Pi 3-5 A microSD [&#8230;]"}, {"title": "Openstrap Edge makes a WHOOP 4.0 band useful without a subscription", "source": "Adafruit", "date": "2026-07-15", "url": "https://blog.adafruit.com/2026/07/15/openstrap-edge-makes-a-whoop-4-0-band-useful-without-a-subscription/", "summary": "The WHOOP 4.0 is a screenless fitness wearable designed for 24/7 continuous tracking. It focuses heavily on sleep quality, physiological recovery, and daily exertion levels rather than step counts. The tracker operates via a subscription model and is typically priced between $30/month and an annual fee of $239 Abdul Sahil isn&#8217;t knocking WHOOP. But the [&#8230;]"}, {"title": "Volkswagen technology meets smart mobility. The result: a next-generation e-bike", "source": "EE Journal", "date": "2026-07-15", "url": "https://www.eejournal.com/industry_news/volkswagen-technology-meets-smart-mobility-the-result-a-next-generation-e-bike/", "summary": "n+ has unveiled an all-new range of Volkswagen licensed premium electric bicycles that redefines what riders should expect from an eBike. Inspired by decades of automotive innovation, the new Volkswagen eBikes feature intelligent safety systems, designed to make city streets safer for all road users. While many eBikes focus solely on motor power and battery capacity, n+ approach the &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/volkswagen-technology-meets-smart-mobility-the-result-a-next-generation-e-bike/\">Read More &#8594;<span class=\"screen-reader-text\"> \"Volkswagen technology meets smart mobility. The result: a next-generation e-bike\"<\/span><\/a>"}, {"title": "$50 Forgix board pairs Raspberry Pi RP2354 MCU with Trion T8 FPGA in Teensy form factor", "source": "CNX Software", "date": "2026-07-14", "url": "https://www.cnx-software.com/2026/07/14/50-forgix-board-pairs-raspberry-pi-rp2354-mcu-with-trion-t8-fpga-in-teensy-form-factor/", "summary": "<div><img alt=\"Forgix RP2354 T8 board\" class=\"attachment-medium size-medium wp-post-image\" height=\"566\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/07/Forgix-RP2354-T8-board-720x566.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Adiuvo Engineering&#8217;s Forgix is a development board pairing a Raspberry Pi RP2354 microcontroller with 2MB flash and an Efinix Trion T8 FPGA in the Teensy 4.0 form factor. The board also features a 16 Mbit PSRAM chip, a USB-C port, a push-button, an RGB LED, and through and castellated holes routed to either the RP2354 MCU or Trion T8 FPGA for SPI, I2C, UART, ADC, USB 1.1, and custom interfaces. &#160; Forgix board specifications: SoC – Raspberry Pi RP2354B  CPU Dual-core Arm Cortex-M33 @ 150 MHz with Arm Trustzone, Secure boot Dual-core 32-bit RISC-V Hazard3 @ 150 MHz (3-stage in-order pipeline; RV32IMAC with Zba, Zbb, Zbs, Zbkb, Zcb, Zcmp, and Zicsr extensions) Up to two cores can be used at a time, either 2x Arm, 2x RISC-V, or 1x Arm + 1x RISC-V Memory – 520 KB on-chip SRAM Storage – 2MB of stacked (in-package) flash memory FPGA &#8211; Efinix Trion T8F49 connected to [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/07/14/50-forgix-board-pairs-raspberry-pi-rp2354-mcu-with-trion-t8-fpga-in-teensy-form-factor/\">$50 Forgix board pairs Raspberry Pi RP2354 MCU with Trion T8 FPGA in Teensy form factor<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Meet Moddo Pinch – The world’s smallest 32-bit Arduino-compatible board (2026 Edition)", "source": "CNX Software", "date": "2026-07-14", "url": "https://www.cnx-software.com/2026/07/14/meet-moddo-pinch-the-world-smallest-arduino-compatible-board-2026-edition/", "summary": "<div><img alt=\"World&#039;s smallest Arduino board 2026\" class=\"attachment-medium size-medium wp-post-image\" height=\"474\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/07/World-smallest-Arduino-board-2026-720x474.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Canada-based Moddo has designed the Pinch board, which it claims is the world&#8217;s smallest 32-bit Arduino-compatible board so far, measuring just 10.9 x 10.5 mm. The board is powered by a Microchip SAMD11 Cortex-M0+ microcontroller with 4 KB SRAM and 16KB flash, features an RGB LED, reset/bootloader button, 3.3 V LDO, a USB-C port, and a total of 12 GPIOs. Moddo Pinch specifications: Microcontroller &#8211; Microchip SAM D11 (ATSAMD11D14A) MCU core &#8211; Arm Cortex-M0+ processor running at up to 48 MHz RAM &#8211; 4 KB SRAM Storage &#8211; 16 KB Flash (12 KB for sketches, 4 KB bootloader) USB &#8211; 1x USB Type-C port for power, programming (CDC serial), and HID Expansion &#8211; 16-pin header (1.27mm pitch) 12x GPIO (D0–D11) 5x analog input (A0–A4) 11x PWM 1x DAC 1x I2C, 1x SPI, 2x UART(multiplexed with USB &#38; D5/D6) Debug &#8211; SWD on D5 (SWCLK) and D6 (SWDIO) Misc RGB LED [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/07/14/meet-moddo-pinch-the-world-smallest-arduino-compatible-board-2026-edition/\">Meet Moddo Pinch &#8211; The world&#8217;s smallest 32-bit Arduino-compatible board (2026 Edition)<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "IoTLabs wM-Bus gateway – An ESP32 device with Wireless M-Bus connectivity for Home Assistant", "source": "CNX Software", "date": "2026-07-14", "url": "https://www.cnx-software.com/2026/07/14/iotlabs-wm-bus-gateway-an-esp32-device-with-wireless-m-bus-connectivity-for-home-assistant/", "summary": "<div><img alt=\"wM Bus Gateway\" class=\"attachment-medium size-medium wp-post-image\" height=\"480\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/07/wM-Bus-Gateway-720x480.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>IoTLabs wM-Bus Gateway is an ESP32 device supporting the Wireless M-Bus (wM-Bus) standard for receiving data from compatible meters and sensors, designed for full integration with Home Assistant. Wireless M-Bus (Wireless Meter Bus) is a wireless protocol specifically designed for remote reading of smart meters, generally gas, water, or electricity meters, and typically used by utilities, but the wM-Bus gateway allows you to deploy the standard for your home automation solution, meters, and sensors. wM-Bus gateway specifications: Main controller &#8211; ESP32 dual-core microcontroller with Wi-Fi and BLE connectivity Display &#8211; 1.3-inch OLED for live measurements and status wM-Bus &#8211; 868 MHz radio receiver; Semtech SX1276-based RFM95/RFM96 according to the code Supports T1 and C1 frames, compatible with the wmbusmeters library Antennas Built-in 2.4 GHz antenna for Wi-Fi and Bluetooth External SMA antenna for wireless M-Bus; important: must be connected before powering the device to avoid damage Misc Top button to [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/07/14/iotlabs-wm-bus-gateway-an-esp32-device-with-wireless-m-bus-connectivity-for-home-assistant/\">IoTLabs wM-Bus gateway &#8211; An ESP32 device with Wireless M-Bus connectivity for Home Assistant<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Microchip Releases Free VectorBlox 3.0 SDK", "source": "Embedded.com", "date": "2026-07-14", "url": "https://www.embedded.com/microchip-releases-free-vectorblox-3-0-sdk/", "summary": "<p>Microchip Technology Inc. has introduced version 3.0 of its VectorBlox Accelerator software development kit (SDK), adding new capabilities to improve the implementation of artificial intelligence inference on PolarFire FPGA and system-on-chip (SoC) devices. The updated development environment is designed to simplify the deployment of convolutional neural network (CNN) models while increasing performance and energy efficiency [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/microchip-releases-free-vectorblox-3-0-sdk/\">Microchip Releases Free VectorBlox 3.0 SDK<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "Liquid Instruments Unveils GenInst Studio for Custom Test Design", "source": "Embedded.com", "date": "2026-07-14", "url": "https://www.embedded.com/liquid-instruments-unveils-geninst-studio-for-custom-test-design/", "summary": "<p>The agentic AI test solution delivers application-specific instruments in minutes.<\/p>\n<p>The post <a href=\"https://www.embedded.com/liquid-instruments-unveils-geninst-studio-for-custom-test-design/\">Liquid Instruments Unveils GenInst Studio for Custom Test Design<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "From Sunlight to Smartphones: The Hidden World of DC‑DC Converters – Eaton and Mouser", "source": "EE Journal", "date": "2026-07-14", "url": "https://www.eejournal.com/chalk_talks/from-sunlight-to-smartphones-the-hidden-world-of-dc-dc-converters-eaton-and-mouser/", "summary": "&#160; In this episode of Chalk Talk, Mohammad Mohiuddin from Eaton and Amelia Dalton explore the fundamentals of DC-DC conversion, the benefits of the different types of converter architectures and how technologies like gallium nitride, silicon carbide, traditional silicon MOSFETs, and IGBTs compare when it comes to efficiency, switching speed, and power density. They also &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/chalk_talks/from-sunlight-to-smartphones-the-hidden-world-of-dc-dc-converters-eaton-and-mouser/\">Read More &#8594;<span class=\"screen-reader-text\"> \"From Sunlight to Smartphones: The Hidden World of DC‑DC Converters – Eaton and Mouser\"<\/span><\/a>"}, {"title": "TDK expands HWS3000 series with wide range three-phase input model", "source": "EE Journal", "date": "2026-07-14", "url": "https://www.eejournal.com/industry_news/tdk-expands-hws3000-series-with-wide-range-three-phase-input-model/", "summary": "TDK Corporation (TSE:6762) announces the expansion of the 3000 W TDK-Lambda HWS3000 programmable AC-DC power supply series with the introduction of the HWS3000GT4 model. Now available with a new wide-range 340 – 528 Vac three-phase input option, this addition offers engineers greater installation flexibility, improved compatibility with global industrial power systems, and enhanced resilience in &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/tdk-expands-hws3000-series-with-wide-range-three-phase-input-model/\">Read More &#8594;<span class=\"screen-reader-text\"> \"TDK expands HWS3000 series with wide range three-phase input model\"<\/span><\/a>"}, {"title": "RAIN in Action to Explore How RAIN-Enabled Infrastructure Translates to Real-World Impact", "source": "EE Journal", "date": "2026-07-14", "url": "https://www.eejournal.com/industry_news/rain-in-action-to-explore-how-rain-enabled-infrastructure-translates-to-real-world-impact/", "summary": "RAIN Alliance has today announced that its RAIN in Action Summit will return later this year. From 29 September to 1 October, industry leaders, innovators, and end users are invited to Madrid, Spain for three days to explore how RAIN technology is helping shape a smarter, more connected, and sustainable future. This year’s theme, “From Infrastructure to Impact” &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/rain-in-action-to-explore-how-rain-enabled-infrastructure-translates-to-real-world-impact/\">Read More &#8594;<span class=\"screen-reader-text\"> \"RAIN in Action to Explore How RAIN-Enabled Infrastructure Translates to Real-World Impact\"<\/span><\/a>"}, {"title": "Infineon and LS ELECTRIC collaborate to advance high-efficiency direct current power solutions for AI data centers", "source": "EE Journal", "date": "2026-07-14", "url": "https://www.eejournal.com/industry_news/infineon-and-ls-electric-collaborate-to-advance-high-efficiency-direct-current-power-solutions-for-ai-data-centers/", "summary": "Collaboration focuses on power conversion systems for energy storage, solid-state transformers and solid-state circuit breakers Infineon&#8217;s semiconductors help enhance efficiency, performance and reliability of DC power infrastructure systems  Infineon Technologies AG (FSE: IFX / OTCQX: IFNNY) and LS ELECTRIC have signed a Memorandum of Understanding (MoU) to collaborate on high-efficiency direct current (DC) power infrastructure &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/infineon-and-ls-electric-collaborate-to-advance-high-efficiency-direct-current-power-solutions-for-ai-data-centers/\">Read More &#8594;<span class=\"screen-reader-text\"> \"Infineon and LS ELECTRIC collaborate to advance high-efficiency direct current power solutions for AI data centers\"<\/span><\/a>"}, {"title": "Saelig Introduces 4th Generation AIM-TTi PSA2704RT 2.7GHz Spectrum Analyzers", "source": "EE Journal", "date": "2026-07-14", "url": "https://www.eejournal.com/industry_news/saelig-introduces-4th-generation-aim-tti-psa2704rt-2-7ghz-spectrum-analyzers/", "summary": "Saelig Company, Inc. has announced the release of the AIM TTi PSA Series 4 Handheld Spectrum Analyzers. A significant technical leap forward for the popular PSA family, this next-generation series introduces real-time signal capture alongside classic swept and fast-swept FFT modes. Designed specifically to match the rapid pace of modern RF design, telecommunications debugging, and wireless field testing, &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/saelig-introduces-4th-generation-aim-tti-psa2704rt-2-7ghz-spectrum-analyzers/\">Read More &#8594;<span class=\"screen-reader-text\"> \"Saelig Introduces 4th Generation AIM-TTi PSA2704RT 2.7GHz Spectrum Analyzers\"<\/span><\/a>"}, {"title": "The Big Five-Oh-Oh!", "source": "EE Journal", "date": "2026-07-14", "url": "https://www.eejournal.com/article/the-big-five-oh-oh/", "summary": "<img alt=\"\" class=\"webfeedsFeaturedVisual wp-post-image\" height=\"300\" src=\"https://www.eejournal.com/wp-content/uploads/2026/07/max-0500-image-for-home-page-500-columns-300x300.jpg\" style=\"display: block; margin-bottom: 5px; clear: both;\" width=\"300\" />My first column on EEJournal, The Artificial Intelligence Apocalypse (Part 1), was posted on September 19, 2019. That’s almost seven years ago as I pen these words. Things are moving so fast these days that I find it hard to wrap my brain around how much the technology landscape has changed since those far-off times. &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/article/the-big-five-oh-oh/\">Read More &#8594;<span class=\"screen-reader-text\"> \"The Big Five-Oh-Oh!\"<\/span><\/a>"}, {"title": "Ambient Scientific GPX10 Pro MCU delivers years of always-on AI on a coin-cell battery", "source": "CNX Software", "date": "2026-07-13", "url": "https://www.cnx-software.com/2026/07/13/ambient-scientific-gpx10-pro-mcu-delivers-years-of-always-on-ai-on-a-coin-cell-battery/", "summary": "<div><img alt=\"Ambient Scientific GPX10 Pro Cortex M4 MCU always on embedded AI\" class=\"attachment-medium size-medium wp-post-image\" height=\"494\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/07/Ambient-Scientific-GPX10-Pro-Cortex-M4-MCU-always-on-embedded-AI-720x494.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Ambient Scientific GPX10 Pro is a processor/microcontroller for always-on embedded AI applications on power-constrained edge devices. With a consumption of under &#60;100μW, it can deliver years of always-on AI on one coin-cell battery. The SoC features ten software-programmable MX8 AI cores leveraging the company&#8217;s DigAn technology, ultra-low power ADC, an 8-bit DVP camera interface, 2048 KB SRAM, support for numerous peripherals, and an Arm Cortex-M4F core for non-AI workloads. GPX10 Pro key features and specifications: MCU core &#8211; Arm Cortex-M4F core clocked at 100 KHz to 100 MHz Memory 2048 KB system SRAM 64KB retention SRAM in “Always On” block Storage &#8211; External SPI or QSPI flash 10x MX8 programmable AI Cores for ultra-low power deep learning applications Based on the DigAn AI engine, which can change behavior between being a master and a slave. Up to 2,560 MAC operations per clock cycle (256 MAC per cycle per core) Peak [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/07/13/ambient-scientific-gpx10-pro-mcu-delivers-years-of-always-on-ai-on-a-coin-cell-battery/\">Ambient Scientific GPX10 Pro MCU delivers years of always-on AI on a coin-cell battery<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "WisMesh Station Review – Telemetry, MQTT, and Grafana tested on a Raspberry Pi 4-based Meshtastic gateway", "source": "CNX Software", "date": "2026-07-13", "url": "https://www.cnx-software.com/2026/07/13/wismesh-station-review-telemetry-mqtt-and-grafana-tested-on-a-raspberry-pi-4-based-meshtastic-gateway/", "summary": "<div><img alt=\"RAKwireless WisMesh Station Review\" class=\"attachment-medium size-medium wp-post-image\" height=\"540\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/07/RAKwireless-WisMesh-Station-Review-720x540.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>RAKwireless has sent us a sample of the WisMesh Station, a Meshtastic gateway and base station based on a Raspberry Pi 4 Model B, a WisMesh Pi HAT RAK6421 expansion board, a LoRa module, a GNSS module, all housed in a compact metal enclosure. It comes with meshtasticd preinstalled, making it ready to use right out of the box. Just unbox it, plug it in, and start using Meshtastic immediately. We&#8217;ll also use software packages for communication, data storage, and visualization, such as MQTT, Node-RED, InfluxDB, and Grafana, mostly following RAKwireless’s user guide WisMesh Station is available in 2 models according to transmit power: the standard RAK8622 model that uses the RAK13300 LoRa module (Semtech SX1262 with 22 dBm transmit power), suitable for urban networks where nodes are close to each other, and the high-power RAK8623 (HP) model that uses the RAK13302 module (SX1262 + SKY66122 amplifier circuit with 30 [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/07/13/wismesh-station-review-telemetry-mqtt-and-grafana-tested-on-a-raspberry-pi-4-based-meshtastic-gateway/\">WisMesh Station Review &#8211; Telemetry, MQTT, and Grafana tested on a Raspberry Pi 4-based Meshtastic gateway<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Raspberry Pi gets 10BASE-T1S/T1L Single Pair Ethernet (SPE) HAT+ board", "source": "CNX Software", "date": "2026-07-13", "url": "https://www.cnx-software.com/2026/07/13/raspberry-pi-gets-10base-t1s-t1l-single-pair-ethernet-spe-hat-board/", "summary": "<div><img alt=\"Raspberry Pi 10BASE T1S SPE HAT\" class=\"attachment-medium size-medium wp-post-image\" height=\"480\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/07/Raspberry-Pi-10BASE-T1S-SPE-HAT-720x480.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Germany-based Brechel Electronic has launched two new Single Pair Ethernet (SPE) expansion boards for Raspberry Pi platforms: the BE-IIS-HPP-T1S and the BE-IIS-HPP-T1L. Designed for technology evaluation, industrial network prototyping, and educational laboratory use, these boards add 10 Mbit/s Ethernet communication over a single twisted pair to standard Raspberry Pi SBCs. The BE-IIS-HPP-T1S is based on the Microchip LAN8651 10BASE-T1S MAC-PHY and supports IEEE 802.3cg Single Pair Ethernet over multidrop networks with up to 8 nodes, enabling distances up to 25 meters on a shared bus. For longer-reach point-to-point links, the company offers the BE-IIS-HPP-T1L, built around Analog Devices ADIN1110 MAC-PHY. Both boards are part of the BE-IIS HAT++ ecosystem, which allows multiple industrial communication HATs to be stacked on a single Raspberry Pi without running into SPI or GPIO resource conflicts. Brechel Electronic 10BASE-T1L and 10BASE-T1S specifications: Compatibility &#8211; Raspberry Pi HAT+ compliant T1L &#8211; Supports Pi 3, 4, 5, and Zero [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/07/13/raspberry-pi-gets-10base-t1s-t1l-single-pair-ethernet-spe-hat-board/\">Raspberry Pi gets 10BASE-T1S/T1L Single Pair Ethernet (SPE) HAT+ board<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Swissbit, Nexperia Partner on Secure Hardware Platforms", "source": "Embedded.com", "date": "2026-07-13", "url": "https://www.embedded.com/swissbit-nexperia-partner-on-secure-hardware-platforms/", "summary": "<p>Swissbit AG and Nexperia have announced a collaboration to develop hardware platforms optimized for AI, cloud computing, and enterprise server applications. The partnership combines Swissbit's expertise in secure storage and embedded memory with Nexperia's portfolio of semiconductor components to support system developers in building high-performance computing platforms that require long operational lifetimes, data integrity, and [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/swissbit-nexperia-partner-on-secure-hardware-platforms/\">Swissbit, Nexperia Partner on Secure Hardware Platforms<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "Melexis Expands Pressure Sensor Family", "source": "Embedded.com", "date": "2026-07-13", "url": "https://www.embedded.com/melexis-expands-pressure-sensor-family/", "summary": "<p>New variants deliver pressure measurement as low as 2 bar for EVs and AI data centers.<\/p>\n<p>The post <a href=\"https://www.embedded.com/melexis-expands-pressure-sensor-family/\">Melexis Expands Pressure Sensor Family<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "Next level motion detection: Panasonic Industry enhances its PIR sensor portfolio with PaPIRs+", "source": "EE Journal", "date": "2026-07-13", "url": "https://www.eejournal.com/industry_news/next-level-motion-detection-panasonic-industry-enhances-its-pir-sensor-portfolio-with-papirs/", "summary": "Panasonic Industry Europe announces the expansion of its proven PIR motion sensor portfolio with the introduction of PaPIRs+, the next evolution of its widely used PaPIRs technology. Designed to meet increasing demands in building automation and smart infrastructure, PaPIRs+ delivers significantly enhanced detection performance while maintaining the simplicity and reliability of conventional PIR solutions. Building &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/next-level-motion-detection-panasonic-industry-enhances-its-pir-sensor-portfolio-with-papirs/\">Read More &#8594;<span class=\"screen-reader-text\"> \"Next level motion detection: Panasonic Industry enhances its PIR sensor portfolio with PaPIRs+\"<\/span><\/a>"}, {"title": "IK Multimedia Launches ReSing Voices Brazilian Pack and New Singer Showcase", "source": "EE Journal", "date": "2026-07-13", "url": "https://www.eejournal.com/industry_news/ik-multimedia-launches-resing-voices-brazilian-pack-and-new-singer-showcase/", "summary": "IK Multimedia today announced the ReSing Voices Brazilian Pack, adding eight new Brazilian Portuguese voice models and unlocking Portuguese voice model creation for ReSing users. The company also introduced the new ReSing Singer Showcase, offering a new way to discover, purchase, and permanently own individual ReSing voice models. ReSing is a plug-in and standalone application that enables &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/ik-multimedia-launches-resing-voices-brazilian-pack-and-new-singer-showcase/\">Read More &#8594;<span class=\"screen-reader-text\"> \"IK Multimedia Launches ReSing Voices Brazilian Pack and New Singer Showcase\"<\/span><\/a>"}, {"title": "Research reveals how grassroots football could help tackle climate change", "source": "EE Journal", "date": "2026-07-13", "url": "https://www.eejournal.com/industry_news/research-reveals-how-grassroots-football-could-help-tackle-climate-change/", "summary": "With international football met with increasing criticism over its carbon footprint, University of Bath students are working with Bath City FC to show how community football could help tackle climate change. Using real data from the club, researchers identified practical, low-cost decarbonisation options, alongside longer-term investments that could transform how grassroots clubs use and produce &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/research-reveals-how-grassroots-football-could-help-tackle-climate-change/\">Read More &#8594;<span class=\"screen-reader-text\"> \"Research reveals how grassroots football could help tackle climate change\"<\/span><\/a>"}, {"title": "Beelink EQi review – Part 2: An Intel Core 3 304 “Wildcat Lake” mini PC tested with Windows 11 Pro", "source": "CNX Software", "date": "2026-07-12", "url": "https://www.cnx-software.com/2026/07/12/beelink-eqi-review-intel-core-3-304-wildcat-lake-mini-pc-windows-11-pro/", "summary": "<div><img alt=\"Beelink EQi Wildcat Lake Core 3 304 Windows 11 mini PC review\" class=\"attachment-medium size-medium wp-post-image\" height=\"555\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/07/Beelink-EQi-Wildcat-Lake-Core-3-304-Windows-11-mini-PC-review-720x555.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>We&#8217;ve already checked out the specifications and hardware of the Beelink EQi Wildcat Lake mini PC in the first part of the review, with an unboxing and a teardown, before booting the mini PC into the pre-installed Windows 11 Pro for a first quick look. We’ve now had time to test the Intel Core 3 304 mini PC in more detail on Windows 11 Pro, so we’ll report our experience. The review includes feature testing, benchmark results, 4K and 8K YouTube video playback, 10GbE, 2.5GbE, and WiFi network performance evaluation, cooling performance, and measurement of fan noise and power consumption. Software Overview and Feature Testing After fully updating Windows 11 Pro and drivers to the latest version (excluding previews), I went to System &#62; About window again. We still have a 1.50 GHz (base frequency) Intel Core 3 304 processor with 16GB 6400MT/s memory, and 834GB of storage from the [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/07/12/beelink-eqi-review-intel-core-3-304-wildcat-lake-mini-pc-windows-11-pro/\">Beelink EQi review &#8211; Part 2: An Intel Core 3 304 &#8220;Wildcat Lake&#8221; mini PC tested with Windows 11 Pro<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Lua-programmable ELM11-Feather board puts Gowin GW1NR FPGA into Feather form factor (Crowdfunding)", "source": "CNX Software", "date": "2026-07-11", "url": "https://www.cnx-software.com/2026/07/11/lua-programmable-elm11-feather-board-puts-gowin-gw1nr-fpga-into-feather-form-factor/", "summary": "<div><img alt=\"ELM11-Feather FPGA board\" class=\"attachment-medium size-medium wp-post-image\" height=\"383\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/07/ELM11-Feather-FPGA-board-720x383.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>BrisbaneSilicon ELM11-Feather is a &#8220;microcontroller&#8221; board based on a Gowin GW1NR FPGA that is natively programmable in Lua, C, SystemVerilog, and VHDL. Compatible with the Adafruit Feather form factor, the board features GPIO headers, a built-in debugger, a USB-C port for power and programming, and a 2-pin header for a LiPo battery. The company calls it a microcontroller board because the FPGA runs a PicoRV32 MCU softcore at up to 75 MHz with 1MB RAM and 8MB flash, programmable with Lua, and the user can also customize hardware layers with RTL code using the remaining FPGA fabric. ELM11-Feather specifications: FPGA &#8211; Gowin GW1NR-LV9 FPGA from the GW1NR-9 family 8K LUTs 8,640 logical units (LUTs) 6,480 flip-flop 17,280 bits shadow SRAM (SSRAM) 486 Kbit block SRAM (BSRAM) 64 Mbit (8MB) PSRAM 608 Kbit user flash 2x PLL Up to 276x user I/O USB &#8211; 1x USB Type-C port for power and [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/07/11/lua-programmable-elm11-feather-board-puts-gowin-gw1nr-fpga-into-feather-form-factor/\">Lua-programmable ELM11-Feather board puts Gowin GW1NR FPGA into Feather form factor (Crowdfunding)<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "M5Stack Stamp-C5 – A Tiny ESP32-C5 USB-C board/module with up to 19 GPIO, 3.7V battery support", "source": "CNX Software", "date": "2026-07-10", "url": "https://www.cnx-software.com/2026/07/10/m5stack-stamp-c5-a-tiny-esp32-c5-usb-c-board-module-with-up-to-19-gpio-3-7v-battery-support/", "summary": "<div><img alt=\"M5Stack Stamp-C5\" class=\"attachment-medium size-medium wp-post-image\" height=\"405\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/07/M5Stack-Stamp-C5-720x405.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>M5Stack Stamp-C5, also known as the M5Stamp-C5, is a tiny wireless IoT USB-C board based on the Espressif ESP32-C5 RISC-V microcontroller with dual-band WiFi 6, Bluetooth LE, and 802.15.4 (Zigbee/Thread) connectivity. Despite its small size (19.1 x 17.6mm), the module exposes up to nineteen GPIO pins, eleven on standard 2.54mm pitch headers and castellated holes, and eight on an FPC extension connector. The board also supports battery charging and ships with an external IPEX antenna for wireless connectivity, since there&#8217;s no built-in antenna. M5Stack Stamp-C5 specifications: Wireless MCU –  Espressif Systems ESP32-C5HF4 CPU Single-core 32-bit RISC-V processor @ up to 240 MHz Low-power RISC-V core @ 48 MHz acting as the main processor for power-sensitive applications Memory – 384 KB SRAM on-chip Storage – 320 KB ROM, 4MB SPI flash Wireless Dual-band (2.4/5 GHz) 802.11ax WiFi 6, 802.11b/g/n WiFi 4 backward compatibility WiFi modes: Station mode, SoftAP mode, SoftAP + [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/07/10/m5stack-stamp-c5-a-tiny-esp32-c5-usb-c-board-module-with-up-to-19-gpio-3-7v-battery-support/\">M5Stack Stamp-C5 &#8211; A Tiny ESP32-C5 USB-C board/module with up to 19 GPIO, 3.7V battery support<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Renesas 365 Dev Platform, NOR Flash Safety Features, Edge Intelligence in SDVs: Embedded Week Insights", "source": "Embedded.com", "date": "2026-07-10", "url": "https://www.embedded.com/renesas-365-dev-platform-nor-flash-safety-features-edge-intelligence-in-sdvs-embedded-week-insights/", "summary": "<p>Here's a roundup of this week's must-read articles. We'll look into the latest developments on Renesas 365 development platform, safety features in NOR flash memory, edge intelligence in SDV architecture, and more. Also, check News Archives - Embedded and Technical Articles Archives - Embedded for the complete list of news and articles from our website. NEWS Qualcomm Unveils Dragonfly [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/renesas-365-dev-platform-nor-flash-safety-features-edge-intelligence-in-sdvs-embedded-week-insights/\">Renesas 365 Dev Platform, NOR Flash Safety Features, Edge Intelligence in SDVs: Embedded Week Insights<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "Microchip Offers Free MPLAB Compiler and AI Tools", "source": "Embedded.com", "date": "2026-07-10", "url": "https://www.embedded.com/microchip-offers-free-mplab-compiler-and-ai-tools/", "summary": "<p>Microchip Technology Inc. has made its MPLAB XC Pro compilers and MPLAB Machine Learning (ML) development suite available free of charge, removing licensing barriers for developers working on embedded systems and edge AI applications. The updated licensing model allows unlimited installations for both individual users and development teams, providing unrestricted access to compiler optimization features and [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/microchip-offers-free-mplab-compiler-and-ai-tools/\">Microchip Offers Free MPLAB Compiler and AI Tools<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "eSOL Brings Game Engine Visualization to Industrial Embedded Development", "source": "Embedded.com", "date": "2026-07-09", "url": "https://www.embedded.com/esol-brings-game-engine-visualization-to-industrial-embedded-development/", "summary": "<p>The 3D engine demonstrates how visualization, simulation, HMI, and ROS-based workflows are converging with the embedded development stack.<\/p>\n<p>The post <a href=\"https://www.embedded.com/esol-brings-game-engine-visualization-to-industrial-embedded-development/\">eSOL Brings Game Engine Visualization to Industrial Embedded Development<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "Edge Intelligence Redefines What SDVs Can Do", "source": "Embedded.com", "date": "2026-07-09", "url": "https://www.embedded.com/edge-intelligence-redefines-what-sdvs-can-do/", "summary": "<p>Software-defined vehicles (SDVs) are increasing the need to process intelligence closer to the systems that are generating data. Modern vehicles produce large amounts of data from sensors, control units, and diagnostic systems, making it inefficient and costly to send all the raw data to the cloud for processing. This is one of the main reasons [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/edge-intelligence-redefines-what-sdvs-can-do/\">Edge Intelligence Redefines What SDVs Can Do<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "Qualcomm Unveils Dragonfly Data Center Portfolio for Agentic AI Infrastructure", "source": "Embedded.com", "date": "2026-07-08", "url": "https://www.embedded.com/qualcomm-unveils-dragonfly-data-center-portfolio-for-agentic-ai-infrastructure/", "summary": "<p>The new CPUs, AI accelerators and HBC technology target higher inference throughput, improved energy efficiency and lower AI infrastructure costs.<\/p>\n<p>The post <a href=\"https://www.embedded.com/qualcomm-unveils-dragonfly-data-center-portfolio-for-agentic-ai-infrastructure/\">Qualcomm Unveils Dragonfly Data Center Portfolio for Agentic AI Infrastructure<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}], "papers": [{"title": "DenseReward: Dense Reward Learning via Failure Synthesis for Robotic Manipulation", "authors": ["Yu Fang", "Wanxi Dong", "Jiaqi Liu", "Yue Yang", "Mingxiao Huo", "Yao Mu", "Huaxiu Yao", "Li Erran Li", "Daniel Szafir", "Mingyu Ding"], "published": "2026-07-14", "summary": "Reinforcement learning holds great promise for improving robot policies beyond the limits of imitation learning. However, its practical adoption remains bottlenecked by the lack of reliable vision-language reward models that provide dense and informative feedback. Two key challenges remain: acquiring diverse failure data at scale and obtaining fine-grained reward signals beyond sparse trajectory-level success labels. Collecting failure trajectories typically requires laborious human effort, while pseudo-failures constructed by relabeling successful demonstrations fail to capture the diverse physical failure modes that arise during robot execution. Meanwhile, existing reward models often predict sparse binary or trajectory-level rewards, which provide limited guidance for efficient policy optimization. We introduce DenseReward, a dense robotic reward model that addresses both challenges. To train DenseReward, we develop an automated failure data generation pipeline that synthesizes physically realistic failure trajectories in simulation without human labeling, covering diverse failure modes such as collisions, missed grasps, object drops, and recovery behaviors. DenseReward predicts dense frame-level reward scores from visual observations and language instructions, enabling fine-grained estimation of task progress throughout an episode. Experiments show that DenseReward outperforms general-purpose VLMs and existing robotic reward models in dense reward prediction across both simulated and real-world manipulation. We further demonstrate that DenseReward provides effective reward guidance for downstream model predictive control and reinforcement learning. We release the dataset, trained reward models, and evaluation suite to support the development of failure-aware dense reward modeling for robot learning.", "pdf_url": "https://arxiv.org/pdf/2607.13033v1"}, {"title": "TerraZero: Procedural Driving Simulation for Zero-Demonstration Self-Play at Scale", "authors": ["Zhouchonghao Wu", "Akshay Rangesh", "Weixin Li", "Wei-Jer Chang", "Zachary Lee", "Tim Wang", "Wei Zhan"], "published": "2026-07-14", "summary": "Training robust autonomous driving agents requires a simulator that is fast enough for reinforcement learning at scale, realistic enough to ground behavior in real-world map structure, and diverse enough to cover the safety-critical long tail that logged data rarely contains. We present TerraZero, a procedural driving simulator and self-play training stack. A configurable C engine runs simulation on the CPU and policy inference on the GPU over a zero-copy path, sustaining 1.3M agent-steps per second on a single server-grade GPU, far faster than existing object-level simulators, while keeping fidelity lighter single-agent systems omit: heterogeneous agents, multiple dynamics models, and full traffic-rule enforcement. TerraZero treats logged data only as a source of real-world map geometry, populating each map with randomized rule-based road users and signal controllers and randomizing agent dynamics, rewards, and sizes per episode, so a map yields an unbounded set of scenarios. Every reported policy trains from scratch by reinforcement learning alone on a compute-efficient self-play recipe across GPUs, with zero human demonstrations and no fallback planner at inference. Policies generalize zero-shot across cities and datasets, including emergent left-hand-traffic driving without explicit supervision. As an ego policy, TerraZero is the first fully learned policy to top the InterPlan long-tail benchmark, ahead of larger learned planners; on routine-driving val14 it ranks among the best approaches and is the safest, posting the best collision and time-to-collision scores. On Waymo Open Sim Agents realism the same recipe outperforms other demonstration-free methods and is competitive with the strongest reference-anchored self-play method. One stack serves both roles: driving policies across dynamics for cars and trucks, and sim agents that jointly control vehicles, pedestrians, and cyclists.", "pdf_url": "https://arxiv.org/pdf/2607.13028v1"}, {"title": "FlowWAM: Optical Flow as a Unified Action Representation for World Action Models", "authors": ["Yixiang Chen", "Peiyan Li", "Yuan Xu", "Qisen Ma", "Jiabing Yang", "Kai Wang", "Jianhua Yang", "Dong An", "He Guan", "Gaoteng Liu", "Jianlou Si", "Jun Huang", "Jing Liu", "Nianfeng Liu", "Yan Huang", "Liang Wang"], "published": "2026-07-14", "summary": "World Action Models (WAMs) are able to leverage pretrained video generators for both world modeling and action prediction. However, directly leveraging such video generators for control raises a new challenge: how to represent actions in a suitable form that aligns with pretrained video generators while carrying enough motion cues for accurate control. Existing numerical actions fail to satisfy the former, and prior visual action representations overlook the temporal motion structure across frames. We address this issue with FlowWAM, a dual-stream diffusion framework that adopts optical flow as a unified, video-native action representation. Flow videos share the same format as RGB videos and encode rich per-pixel displacement. By jointly modeling them within a shared pretrained video generator, FlowWAM can naturally implement two modes of WAMs. In policy mode, FlowWAM generates flow for action prediction, while in world-model mode, it uses target flow sequences to guide future video generation. Moreover, since flow can be easily extracted from raw videos without action labels, FlowWAM can leverage large-scale action-unlabeled video datasets for pretraining. We empirically find that our flow-based action representation delivers gains across both modes. On RoboTwin manipulation, FlowWAM raises the success rate to 92.94% on the Clean setting and 92.14% on Random, outperforming both VLA and WAM baselines. On WorldArena world modeling, it achieves the best overall EWMScore (63.71) with an 18.4% relative improvement in trajectory accuracy. More results can be found on our project website: https://flow-wam.github.io .", "pdf_url": "https://arxiv.org/pdf/2607.13017v1"}, {"title": "The Spectrum Is Not Enough: When Context Helps Time-Series Forecasting", "authors": ["Mert Onur Cakiroglu", "Mehmet Dalkilic", "Hasan Kurban"], "published": "2026-07-14", "summary": "A growing family of indices scores how predictable a series is from its spectrum. Practitioners increasingly read these scores as answering a different question: whether \\emph{adding context}, a longer lookback, a retrieval plug-in, or a pretrained model, will help. These are not the same question. The value of context is a property of the operating point, not of the series. Any index built from the power spectrum is invariant under phase randomization, whereas the beyond-second-order value that retrieval and foundation models supply is not, because a phase-randomized series is asymptotically Gaussian. We state this as an impossibility result and isolate it with surrogate pairs that fix the spectrum and the marginal by construction. We then give a label-free, configuration-level diagnostic, the coverage deficit, whose principal term measures beyond-spectrum structure as the gain of analog over linear prediction. On seven benchmarks the prediction holds: window-keyed retrieval's value collapses across surrogate pairs (ECL median $+33\\%\\!\\to\\!-35\\%$, $p{<}10^{-40}$) while every spectral index stays frozen; a foundation model's value splits into a surviving second-order part and a small beyond-linear margin that collapses; a longer linear window's value survives. Leave-one-dataset-out, the structure term predicts the sign of beyond-spectrum value where the spectral indices trail it, and the reverse holds for the second-order mechanism. We introduce no new forecaster; the contribution is the distinction, a controlled comparison, and a diagnostic for the deployment decision. Code: https://anonymous.4open.science/r/SINE.", "pdf_url": "https://arxiv.org/pdf/2607.13006v1"}, {"title": "ChunkFlow: Towards Continuity-Consistent Chunked Policy Learning", "authors": ["Zhao Yang", "Yinan Shi", "Mingyuan Yao", "Wenyao Xue", "Yawei Jueluo", "Longjun Liu"], "published": "2026-07-14", "summary": "Vision-language action (VLA) models increasingly adopt chunked action heads to satisfy real-time constraints; however, this introduces boundary jitter: overlapping regions between consecutive chunks often yield inconsistent predictions, degrading temporal coherence and the task success rate. Existing methods, such as inference-time blending, merely reweight mismatched proposals without correcting underlying errors, leading to residual accumulation under biased or noisy histories. We propose ChunkFlow, a seam-aware training-and-execution framework for chunked policies that aligns chunk structure with boundary execution. It partitions each chunk into frozen, editable, and future zones, applies deterministic overlap blending at execution, and trains raw predictions with seam and first- and second-order continuity losses. History corruption and scheduled sampling improve robustness to executed-history errors, while an AWAC fine-tuning stage adapts the policy without removing these structural regularizers. Under mild smoothness assumptions, pre-blending seam discrepancies provably decay with increasing overlap. Experiments on CALVIN, LIBERO, and real robots show an improved success-stability trade-off with low-latency inference. Project page: https://cytoderm-ai.github.io/chunkflow.", "pdf_url": "https://arxiv.org/pdf/2607.12992v1"}, {"title": "MAMMOTH: A Multi-Modal End-to-End Policy for Off-Road Mobility Robust to Missing Modality", "authors": ["Ahaan Kotian", "Shivani Subramanyan", "Suresh Sundaram"], "published": "2026-07-14", "summary": "Reliable autonomous navigation in unstructured off-road environments remains a critical unsolved challenge due to extreme terrain diversity, drastic illumination variations and acute sensor degradation. Recent developments have approached the problem as a traversability costmap estimation or visual navigation task. However, many exhibit heavy reliance on RGB modality, leading to poor performance in varied illumination such as glares, shadows or low ambient light. Achieving robust generalization in such conditions requires integrating modalities that provide supplementary scene information. Such multi-modal methods suffer from a rigid dependency on the presence of near-perfect sensor inputs, leaving them unable to robustly handle sensor degradation or individual modality failure. To address these limitations, w
