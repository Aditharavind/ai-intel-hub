oes-unitree-robotics-ipo-mean-for-humanoid-industry/\">What does Unitree Robotics&#8217; IPO mean for the humanoid industry?<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Kollmorgen to give a joint-by-joint guide to humanoid motion at RoboBusiness", "source": "The Robot Report", "date": "2026-08-19", "url": "https://www.therobotreport.com/kollmorgen-give-joint-by-joint-guide-humanoid-motion-robobusiness/", "summary": "<p>The talk at RoboBusiness will outline the unique demands of each body zone and the challenges of scaling for production.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/kollmorgen-give-joint-by-joint-guide-humanoid-motion-robobusiness/\">Kollmorgen to give a joint-by-joint guide to humanoid motion at RoboBusiness<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Unichem acquires Loomia to accelerate entry into the humanoid ‘skin’ market", "source": "Robotics Business Review", "date": "2026-08-18", "url": "https://www.therobotreport.com/unichem-acquires-loomia-accelerate-entry-humanoid-skin-market/", "summary": "<p>Automotive suppliers Unichem and R&#038;Y are working with Loomia to develop tactile sensors for automotive and robotics applications.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/unichem-acquires-loomia-accelerate-entry-humanoid-skin-market/\">Unichem acquires Loomia to accelerate entry into the humanoid &#8216;skin&#8217; market<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Drones With Claws Perch on Arctic Icebergs", "source": "IEEE Spectrum Robotics", "date": "2026-08-18", "url": "https://spectrum.ieee.org/arctic-iceberg-drones", "summary": "<img src=\"https://spectrum.ieee.org/media-library/a-drone-firmly-planted-on-the-steep-slope-of-an-iceberg-after-a-successful-landing.jpg?id=67573301&amp;width=1245&amp;height=700&amp;coordinates=0%2C187%2C0%2C188\" /><br /><br /><p><em><em>This article is part of our exclusive <\/em><\/em><a href=\"https://spectrum.ieee.org/collections/journal-watch/\" target=\"_self\"><em><em>IEEE Journal Watch series<\/em><\/em><\/a><em><em> in partnership with IEEE Xplore.<\/em><\/em><\/p><p>Microspines are one of many ways to enable robots to latch onto surfaces like <a href=\"https://spectrum.ieee.org/microspines-make-it-easy-for-drones-to-perch-on-walls-and-ceilings\" target=\"_self\">walls and ceilings<\/a>. Now roboticists in Canada are using the mini spikes to get drones to land on a more challenging, remote surface: icebergs.<\/p><p>Like a spider, the Ice Dart can land on and latch onto steep, slippery surfaces such as icebergs and glaciers—an increasingly useful capability as activity in the Arctic increases. The drone can grip onto icy slopes of nearly 60 degrees, which is way beyond what most humans could manage without special equipment. <\/p><p>In a recent study, researchers explained how they developed the Ice Dart drone with a special landing gear that absorbs the impact of a hard landing while holding the drone in place with tiny spines that penetrate and grip the ice.<\/p><hr /><p class=\"shortcode-media shortcode-media-youtube\"> <span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span> <\/p><p>Published in <a href=\"https://ieeexplore.ieee.org/abstract/document/11554347\" rel=\"noopener noreferrer\" target=\"_blank\"><em><em>IEEE Transactions on Field Robotics<\/em><\/em><\/a>, the study describes how the Ice Dart was able to land on icebergs and a glacier in southeast Iceland. Tests took place amid persistent winds and temperatures of 0 to 10 °C along the ruggedly breathtaking Fjallsjökull (pronounced “FYATLS-yuh-kuutl”) glacier, which empties into a lagoon filled with icebergs. The drone was able to successfully perch at speeds of up to 3 meters per second and slopes of up to 58 degrees, with a success rate of 100 percent even in wind speeds of 30 km/h<span>.<\/span><\/p><p>The researchers were motivated by a desire to allow drones to land almost anywhere in the world, since the availability of safe landing sites is one of the primary limitations on where and how drones can operate. The researchers already have a history of developing drones that can land on <a href=\"https://onlinelibrary.wiley.com/doi/full/10.1002/rob.70069\" target=\"_blank\">fast-moving trucks<\/a> as well as <a href=\"https://ieeexplore.ieee.org/abstract/document/9779538\" target=\"_blank\">trailers, boats, and steep roofs<\/a>. <\/p><h4>Ice Perching<\/h4><p>“The ability to land rather than hover can fundamentally change how drones are used in the field,” says <a href=\"https://alexislussierdesbiens.github.io/\" rel=\"noopener noreferrer\" target=\"_blank\">Alexis Lussier Desbiens<\/a>, a professor of engineering at  <a href=\"https://www.createk.co/\" rel=\"noopener noreferrer\" target=\"_blank\">Université de Sherbrooke<\/a>, in Sherbrooke, Quebec, Canada, who coauthored the study. “Once a drone has landed, energy consumption drops dramatically, allowing much longer observation periods with a small aircraft. The drone also becomes completely silent and can even reduce or eliminate its thermal and RF signature by shutting down major onboard systems.”<\/p><p>Landing on icebergs specifically allows drones to monitor them for days or months, producing more detailed observation than a quick aerial surveillance mission. This could simplify iceberg tracking compared to methods such as helicopter deployment, dropped instruments, or dart-like tracking devices, and provide another data layer to satellite and ship-based iceberg detection, according to the researchers. It could also provide a means of monitoring icebergs that are otherwise untrackable.<\/p><p>With its carbon-fiber construction, the Ice Dart drone weighs just 2.65 kg and has four legs arranged in an X shape, attached to its body with a pivot joint. Used in the group’s <a href=\"https://www.youtube.com/watch?v=tTUVr1Ogag0\" rel=\"noopener noreferrer\" target=\"_blank\">previous drone research<\/a>, this landing gear disperses energy to reduce impact and overcomes multiple engineering challenges. The friction shock absorbers consist of 38 disks that generate friction torque as the legs move up and down upon impact. This lowers the UAV’s center of mass and helps spread out the kinetic energy of landing, but the real trick comes in the form of two retractable spines on each foot—one for uphill and one for downhill grip. The larger spine engages on the more heavily loaded downhill feet, and the smaller, thinner spine engages more easily on the uphill feet, even under very low loads on steep slopes. The spines only penetrate the ice as the suspension compresses, generating grip and protecting them from high-impact forces. <\/p><p>“The inspiration for the retractable spines in the feet came from looking at a cat’s claws and their ability to deploy only when needed,” says <a href=\"https://www.linkedin.com/in/isaac-tunney-10094912a/\" rel=\"noopener noreferrer\" target=\"_blank\">Isaac Tunney<\/a>, a Université de Sherbrooke postdoc in mechanical and robotics engineering who was lead author of the paper. “I wanted to create feet that would naturally and passively engage their spines in the ice at the right moment, regardless of the drone’s orientation, the surface geometry, or the ice conditions.”<\/p><h4>Arctic Surveillance<\/h4><p><a href=\"https://www.abdn.ac.uk/people/william.harcourt\" rel=\"noopener noreferrer\" target=\"_blank\">William D. Harcourt<\/a> is a researcher at the University of Aberdeen, in Aberdeen, Scotland, focused on Arctic glaciers, snow, and sea ice, as well as the use of remote sensing and machine learning techniques. Harcourt was not involved in the study, but he sees several potentially interesting applications of the technology. <\/p><p>“Near the front of tidewater glaciers, these systems could enable measurement of <a href=\"https://www.antarcticglaciers.org/glacier-processes/glacier-flow-2/glacier-flow-ii-stress-and-strain/\" rel=\"noopener noreferrer\" target=\"_blank\">stress and strain<\/a> and help us understand <a href=\"https://en.wikipedia.org/wiki/Ice_calving\" rel=\"noopener noreferrer\" target=\"_blank\">calving processes<\/a>,” Harcourt says. “Drones can be used as a mobile GPS, literally acting as a receiver on the ice, but the system would need to solve tilting issues as 3D change measurements usually required the antenna to be horizontal. However, if these problems can be solved, it could be used to track iceberg movements.”<\/p><p>The researchers want to continue developing the Ice Dart technology for real-world applications, including autonomous landing site selection and an emergency takeoff capability to be used if an iceberg rolls over or breaks apart. This August, the drone will be deployed during a Canadian Arctic mission to land on icebergs, collect data, and help validate ship-based iceberg-detection systems.<\/p>"}, {"title": "FORT Robotics to take safety stack public via SPAC merger", "source": "Robotics Business Review", "date": "2026-08-18", "url": "https://www.therobotreport.com/fort-robotics-takes-safety-stack-public-via-spac-merger/", "summary": "<p>FORT Robotics said it expects valuation of more than $500 million as it lists on Nasdaq with plans to accelerate safety software development.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/fort-robotics-takes-safety-stack-public-via-spac-merger/\">FORT Robotics to take safety stack public via SPAC merger<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "How to achieve high voltage in industrial systems without high complexity", "source": "Robotics Business Review", "date": "2026-08-18", "url": "https://www.therobotreport.com/how-achieve-high-voltage-industrial-systems-without-high-complexity/", "summary": "<p>Kollmorgen discusses the importance of fitting voltage systems closely to the application while still making the best use of infrastructure.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/how-achieve-high-voltage-industrial-systems-without-high-complexity/\">How to achieve high voltage in industrial systems without high complexity<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Gravis Robotics raises $200M for autonomous construction", "source": "Robotics Business Review", "date": "2026-08-17", "url": "https://www.therobotreport.com/gravis-robotics-raises-200m-autonomous-construction/", "summary": "<p>Gravis Robotics has designed autonomy AI and hardware for a wide range of excavators and construction equipment and plans to scale globally.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/gravis-robotics-raises-200m-autonomous-construction/\">Gravis Robotics raises $200M for autonomous construction<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Is Shipyard Welding the Right First Job for Humanoid Robots?", "source": "IEEE Spectrum Robotics", "date": "2026-08-17", "url": "https://spectrum.ieee.org/persona-ai-humanoid-robot-welding", "summary": "<img src=\"https://spectrum.ieee.org/media-library/two-men-supervise-a-humanoid-robot-as-it-completes-a-welding-task-in-an-industrial-warehouse.jpg?id=67626093&amp;width=1245&amp;height=700&amp;coordinates=0%2C187%2C0%2C188\" /><br /><br /><p>Humanoids desperately need to stop making YouTube videos and get a job already, and <a href=\"https://persona.ai/\" rel=\"noopener noreferrer\" target=\"_blank\">Persona AI<\/a> is one of the few humanoid companies that seems to be entirely focused on making that happen. Persona AI’s approach has been to carefully select a job that is economically viable for robots right now, and they’ve found one that was also the job of <a href=\"https://spectrum.ieee.org/unimation-robot\" target=\"_self\">one of the very first industrial robots ever sold<\/a>: welding.<\/p><p><em><em>IEEE Spectrum<\/em><\/em> first spoke with Persona <a href=\"https://spectrum.ieee.org/persona-ai-radford-pratt\" target=\"_self\">two years ago<\/a>, shortly after it was founded by <a href=\"https://www.linkedin.com/in/nicolaus-radford/\" rel=\"noopener noreferrer\" target=\"_blank\">Nicolaus Radford<\/a> and <a href=\"https://www.linkedin.com/in/jerry-pratt/\" rel=\"noopener noreferrer\" target=\"_blank\">Jerry Pratt<\/a>. Radford led <a href=\"https://spectrum.ieee.org/meet-valkyrie-nasas-superhero-robot\" target=\"_self\">the Valkyrie program at NASA’s Johnson Space Center<\/a> back in the day and was also the founder of Nauticus Robotics, while Pratt led <a href=\"https://www.ihmc.us/research/human-machine-teamwork/\" rel=\"noopener noreferrer\" target=\"_blank\">IHMC’s<\/a> <a href=\"https://spectrum.ieee.org/darpa-robotics-challenge-amazing-moments-lessons-learned-whats-next\" target=\"_self\">DARPA Robotics Challenge<\/a> team before spending a couple of years as CTO of <a href=\"https://www.figure.ai/\" rel=\"noopener noreferrer\" target=\"_blank\">Figure<\/a>. <\/p><h2>The Challenge of Humanoids<\/h2><p>As of <a href=\"https://spectrum.ieee.org/persona-ai-radford-pratt\" target=\"_self\">our first conversation in 2024<\/a>, Persona had committed to building an economically viable humanoid, but they hadn’t yet figured out where their focus was going to be. “We were all over the place,” Radford says. “Warehousing, automotive, we probably even mentioned the home.” These are the same environments with the same sorts of potential applications that basically every other humanoid robotics company is attempting to make economically viable, and despite an ever more exhaustive number of demonstrations, so far none have succeeded at any sort of useful scale. <\/p><p>The challenge for Persona, and really for every robotics company, is that it’s not enough that you have a robot that is simply capable of doing a task. It’s <em><em>also<\/em><\/em> not enough that your robot can do that task in a way that is <a href=\"https://spectrum.ieee.org/humanoid-robot-scaling\" target=\"_self\">efficient, reliable, and safe<\/a>. What’s required is that your robot can make money for both you and your customer. Most humanoid companies seek to achieve this by targeting baseline “unskilled” human labor.<\/p><p>Persona did not see economic viability in the unskilled labor approach, Radford says. “We started forming this thesis around skilled trades and tool usage.” Persona is targeting much more expensive <em><em>skilled<\/em><\/em> labor with its robots, and the reason why this is feasible is because their entry point focuses on the kind of skills that robots are especially good at. “I like to call it ‘last-mover advantage.’ We’ve seen everything that everybody’s doing, and we’ve decided that there’s a different way.”<\/p><p class=\"shortcode-media shortcode-media-youtube\"> <span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span> <small class=\"image-media media-photo-credit\"><a href=\"https://www.youtube.com/watch?v=lDNrnmCj2DM\" target=\"_blank\">Persona AI/YouTube<\/a><\/small> <\/p><h2>A Humanoid for Shipyard Welding<\/h2><p>The first task that Persona’s humanoid is focusing on is welding—using a handheld tool to connect one piece of metal to another. “Tool use is pretty difficult,” Pratt says. “And we want to use the same tools that humans do, which makes it more difficult.” That difficulty is offset somewhat by the fact that Persona’s humanoid will first focus on making long, linear welds that are relatively uncomplicated. “This is not the hardest style of weld,” Radford says, “but in shipbuilding you need a lot of them—hundreds of kilometers of linear welds per ship.”<\/p><p>Currently, Persona has two public partnerships: one with <a href=\"https://www.hd.com/en/business/shipbuilding/hhi/contents\" rel=\"noopener noreferrer\" target=\"_blank\">HD Hyundai<\/a>, which is the world’s largest shipbuilder, and the other with <a href=\"https://www.posco.com/\" rel=\"noopener noreferrer\" target=\"_blank\">POSCO<\/a>, one of the largest steel producers in the world, both in Korea. Persona declined to get into detail, but Radford says that broadly speaking, the company is interested in customers who can support ‘hundreds’ of robots per location.<\/p><p>Shipyard welding is an enticing application for Persona because there is a deficit of skilled (and highly paid) workers, it’s taxing physical labor, and it’s a comparatively easy skill for a humanoid to learn.<\/p><p>The welding process is skilled in a very robot-friendly way. Because you can only weld as fast as metal melts, the top speed for the task is an easily manageable centimeter per second. And making a high quality weld involves millimeter-scale repeated motions, which robots excel at, especially over long periods of time—whereas humans tend to get tired or bored. Pratt expects that for these uncomplicated welds, performing on par with humans—if not eventually better—will be achievable soon.<\/p><p>Shipyards make a compelling case for a humanoid with legs, as opposed to a <a href=\"https://spectrum.ieee.org/humanoid-robots-walden-robotics-toyota\" target=\"_self\">more stable wheeled base<\/a>. “These open-air shipyards are a couple hundred meters long, with horizontal and vertical spars that you have to step over all the time,” Radford says. “You’ve got to work on the ground, overhead, and through portholes.” Persona considered other form factors, like four legs (or even more), but determined a two-legged robot would be the least disruptive to existing shipyard rhythms.<\/p><h2>The Economic Viability of Humanoids<\/h2><p>Deploying their robots in shipyards specifically brings additional advantages for Persona. The safety concerns that come with bipedal robots—such as potentially falling over on a human worker—are lessened because a shipyard environment is staffed with workers who are trained to work around potentially dangerous industrial equipment. The company is also less sensitive to competitive pricing because no other company is pursuing the use case. “We’re now in an industry where the value added by our robot can be high enough that we don’t have to cut corners on quality and features in order to reduce the price,” Pratt says. “With a robot for the home, for example, there would be a lot of competition and a ton of price pressure.”<\/p><p>The added value for shipbuilders, Radford explains, doesn’t come from replacing humans with robots. “Our current partnerships are running at a significant backlog, and they’re labor-constrained. So we want to help our customers’ top line, not necessarily their bottom line.” In other words, rather than trying to argue that their robots will lower shipbuilding costs, Persona is instead arguing that their robots will allow more ships to be built. “Even if our robot was more expensive than a human, that would still be valuable to these companies, because it could unlock additional revenue,” Radford says. And when the additional skilled labor does not exist, Persona’s robots could be the next-best option for shipbuilders who need to scale.<\/p><p class=\"shortcode-media shortcode-media-rebelmouse-image\"> <img alt=\"Several workers on scaffolding as they weld a large vessel in an industrial shipyard.\" class=\"rm-shortcode\" id=\"54539\" src=\"https://spectrum.ieee.org/media-library/several-workers-on-scaffolding-as-they-weld-a-large-vessel-in-an-industrial-shipyard.jpg?id=67626098&amp;width=980\" /> <small class=\"image-media media-caption\">Shipyards are environments where legs are necessary for a robot to be useful.<\/small><small class=\"image-media media-photo-credit\">CFOTO/Future Publishing/Getty Images<\/small><\/p><h2>Persona’s Multipurpose Future<\/h2><p>In the current commercial humanoid climate, where the emphasis seems to be on developing a “general purpose” robot (whatever that means) that will somehow justify itself through some undefined scale in some equally undefined and perpetually receding future, Persona stands out with their focus on a seemingly viable, near-term, and very specific business case. It hasn’t been easy, though. “It hurts us a little bit,” Radford says. “We’ve been told that we’re not thinking big enough.” <\/p><p>But a tool-using heavy industrial humanoid has plenty of future applications, many of which can be expanded from the welding skill even within shipyards. “Shipbuilding is a great beachhead,” Pratt says. “There are tons of adjacent markets, like grinding, painting, and other kinds of fabrication.” Persona’s ambition, Radford adds, is to be “the largest repository of industrial skills.” <\/p><p>It’s going to take time to get there. That time will be needed to collect tens of thousands of hours of expert demonstration data, create high-fidelity simulations, and conduct real-world testing. And however promising Persona’s approach may seem, the company still has to prove that its idea for an economically viable robotics company can be realized. It’s the same challenge that every humanoid robot company is facing. “A lot of the technical problems are the same no matter whether you’re in a house or a shipyard,” Pratt says. “Everybody’s got a great team and smart people, and we’re all knocking these problems out together.”<\/p>"}, {"title": "How Generalist uses human demonstration data for robot learning", "source": "Robotics Business Review", "date": "2026-08-17", "url": "https://www.therobotreport.com/how-generalist-uses-human-demonstration-data-robot-learning/", "summary": "<p>Research around the Universal Manipulation Interface is enabling Generalist, Walden Robotics, and others to turn data into robot behaviors.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/how-generalist-uses-human-demonstration-data-robot-learning/\">How Generalist uses human demonstration data for robot learning<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Surgeons use da Vinci surgical robot to perform common cardiac surgery", "source": "Robotics Business Review", "date": "2026-08-17", "url": "https://www.therobotreport.com/surgeons-use-da-vinci-surgical-robot-perform-common-cardiac-surgery/", "summary": "<p>At the El Camino Health Heart and Vascular Institute, surgeons are now performing cardiac procedures with Intuitive's da Vinci robot.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/surgeons-use-da-vinci-surgical-robot-perform-common-cardiac-surgery/\">Surgeons use da Vinci surgical robot to perform common cardiac surgery<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Five years of operation shape Diligent Robotics rollout of Moxi 2.0", "source": "Robotics Business Review", "date": "2026-08-17", "url": "https://www.therobotreport.com/five-years-operation-shape-diligent-robotics-rollout-moxi-2-0/", "summary": "<p>Diligent is now rolling out Moxi 2.0 to health systems including Endeavor Health Edward Hospital and Children’s Hospital Los Angeles.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/five-years-operation-shape-diligent-robotics-rollout-moxi-2-0/\">Five years of operation shape Diligent Robotics rollout of Moxi 2.0<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "How robotics is revolutionizing stroke rehabilitation", "source": "Robotics Business Review", "date": "2026-08-16", "url": "https://www.therobotreport.com/how-robotics-is-revolutionizing-stroke-rehabilitation/", "summary": "<p>Eyal Samuel Shachar, the CEO of Bioxtreme, says the growing synergy of robotics, AI, and human-centered care will improve patient outcomes.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/how-robotics-is-revolutionizing-stroke-rehabilitation/\">How robotics is revolutionizing stroke rehabilitation<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Why robots that can’t communicate naturally won’t be adopted", "source": "Robotics Business Review", "date": "2026-08-15", "url": "https://www.therobotreport.com/why-robots-that-cant-communicate-naturally-wont-be-adopted-says-treble/", "summary": "<p>Gunnar Pétur Hauksson, the co-founder and COO at Treble Technologies, says robotics developers can't overlook the importance of hearing.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/why-robots-that-cant-communicate-naturally-wont-be-adopted-says-treble/\">Why robots that can’t communicate naturally won’t be adopted<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Robots on Wall Street: Non-traditional paths to public markets for robotics companies", "source": "Robotics Business Review", "date": "2026-08-14", "url": "https://www.therobotreport.com/robots-on-wall-street-non-traditional-paths-public-markets-robotics-companies/", "summary": "<p>Agility’s SPAC deal shows there is no one route to a robotics public listing, with SPAC mergers, reverse mergers, and traditional IPOs offering different advantages.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/robots-on-wall-street-non-traditional-paths-public-markets-robotics-companies/\">Robots on Wall Street: Non-traditional paths to public markets for robotics companies<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Video Friday: Lift Happens", "source": "IEEE Spectrum Robotics", "date": "2026-08-14", "url": "https://spectrum.ieee.org/video-friday-darpa-heavy-lift-challenge", "summary": "<img src=\"https://spectrum.ieee.org/media-library/drone-crash-on-grassland-engulfed-in-flames-with-thick-black-smoke-rising.png?id=67615846&amp;width=1245&amp;height=700&amp;coordinates=0%2C0%2C0%2C0\" /><br /><br /><p><span>Video Friday is your weekly selection of awesome robotics videos, collected by your friends at <\/span><em>IEEE Spectrum<\/em><span> robotics. We also post a weekly calendar of upcoming robotics events for the next few months. Please <\/span><a href=\"mailto:automaton@ieee.org?subject=Robotics%20event%20suggestion%20for%20Video%20Friday\">send us your events<\/a><span> for inclusion.<\/span><\/p><h5><a href=\"https://actuate.foxglove.dev/\">Actuate 2026<\/a>: 18–19 August 2026, SAN FRANCISCO<\/h5><h5><a href=\"https://2026.ieee-iros.org/\">IROS 2026<\/a>: 27 September–1 October 2026, PITTSBURGH<\/h5><h5><a href=\"https://humanoidssummit.com/\">Humanoids Summit Seoul<\/a>: 22–23 September 2026, SEOUL<\/h5><p>Enjoy today’s videos!<\/p><div class=\"horizontal-rule\"><\/div><div><span style=\"display: none;\"> <\/span><\/div><p class=\"rm-anchors\" id=\"2x2w3mweriu\">Speaking from experience, I can tell you that the best part of any DARPA challenge is when things go horribly wrong. And after you enjoy all the crashes (followed by all of the battery fires), get caught up with the <a href=\"https://spectrum.ieee.org/video-friday-heavy-lift-drone\" target=\"_blank\">DARPA Lift Challenge<\/a> with video recaps of the final few days.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p class=\"shortcode-media shortcode-media-youtube\"> <span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p class=\"shortcode-media shortcode-media-youtube\"> <span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p class=\"shortcode-media shortcode-media-youtube\"> <span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p class=\"shortcode-media shortcode-media-youtube\"> <span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.darpa.mil/news/2026/lift-challenge-awards\">DARPA Lift Challenge<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"gx-oyg38vjs\"><a href=\"https://spectrum.ieee.org/the-economics-of-drone-delivery\" target=\"_blank\">Drone delivery<\/a>: coming soon to a moving vehicle (or perhaps even through an open window) near you.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://uav.hkust.edu.hk/\">HKUST Aerial Robotics Group<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"shsjoyknax0\">This tiny little robot called STEMbot (as in stem, not STEM) can climb up and around plant stems to check for pests. It’s not very fast, but it sure is adorable.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://um-arm-lab.github.io/stembot-site/\">STEMbot<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"e47yaza_yuu\"><em>Monumental’s robots delivered the brickwork for a semi-detached home, laying around 20,000 bricks in a new community.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.monumental.co/\">Monumental<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"mm5itwlmsba\">Meet the world’s most “truss’t-worthy” robot.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.modlabupenn.org/category/vtt/\">Modlab University of Pennsylvania<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"f2r9grjjses\">Stanford BDML and Honeybee Robotics propose a payload to test gecko-inspired adhesives in spaaace!<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://rmpc.nasatechleap.org/\">NASA<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"q-yhtvmvxgk\"><em>How can a legged robot organize its own walking while maintaining a desired direction? In this work, we present a Differential Adaptive Steering (DAST) mechanism for directional adaptation in legged robots under decentralized adaptive control.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://brain.vistec.ac.th/\">BRAIN VISTEC<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"bugnlio-rqy\">I do not care even a little bit if a robot fails (safely, of course), as long as it recovers from that failure.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://sanctuary.ai/\">Sanctuary AI<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"6_x5rirnn8o\">Even for a robot that doesn’t drink champagne, those are some pretty light pours.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://kawasakirobotics.com/\">Kawasaki Robotics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"yqlkm6ylxkq\">If we as a society would just accept that the appropriate place to store clothing is in a pile on the floor, robots would have a much easier time of it.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.limxdynamics.com/en\">LimX Dynamics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"ixwjcz6xelo\">To be fair, this is also the speed at which I fold shirts.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.sharpa.com/\">Sharpa<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"5gd2b0cmfyu\"><em>Our DR02 humanoid robot takes on the stairs with stable, controlled movement—steady steps, steady progress.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.deeprobotics.cn/en\">DEEP Robotics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"en7jfhgmqci\">Two words: structural minifridge. Or is it mini fridge...? Whatever, THREE words.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://global.agilex.ai/\">AgileX<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div>"}, {"title": "Neros Technologies raises $250M to deploy its defense drones by the end of 2026", "source": "Robotics Business Review", "date": "2026-08-14", "url": "https://www.therobotreport.com/neros-technologies-raises-250m-to-deploy-its-defense-drones-by-the-end-of-2026/", "summary": "<p>Neros is developing its Archer AI and Bandit platform with the hardware and compute required for multi-asset control.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/neros-technologies-raises-250m-to-deploy-its-defense-drones-by-the-end-of-2026/\">Neros Technologies raises $250M to deploy its defense drones by the end of 2026<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "How Protolabs turns CAD files into parts in under 24 hours", "source": "The Robot Report", "date": "2026-08-14", "url": "https://www.therobotreport.com/how-protolabs-turns-cad-files-into-parts-under-24-hours/", "summary": "<p>Protolabs CTO Marc Kermisch explains how AI, simulation, and design for manufacturing turn CAD files into production parts faster.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/how-protolabs-turns-cad-files-into-parts-under-24-hours/\">How Protolabs turns CAD files into parts in under 24 hours<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "ARM Institute calls for defense manufacturing technology projects", "source": "Robotics Business Review", "date": "2026-08-13", "url": "https://www.therobotreport.com/arm-institute-calls-for-defense-manufacturing-technology-project/", "summary": "<p>The ARM Institute and the U.S. Department of War are seeking technology project submissions to help rapid U.S. production.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/arm-institute-calls-for-defense-manufacturing-technology-project/\">ARM Institute calls for defense manufacturing technology projects<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Experts to discuss the state of humanoid robots at RoboBusiness", "source": "Robotics Business Review", "date": "2026-08-13", "url": "https://www.therobotreport.com/experts-discuss-state-humanoid-robots-robobusiness-2026/", "summary": "<p>The RoboBusiness panel will include insights on humanoid robots from Agility, Apptronik, Persona AI, and PSYONIC experts.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/experts-discuss-state-humanoid-robots-robobusiness-2026/\">Experts to discuss the state of humanoid robots at RoboBusiness<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Mobile manipulators and humanoids: The future of robotics", "source": "Robotics Business Review", "date": "2026-08-13", "url": "https://www.therobotreport.com/mobile-manipulators-and-humanoids/", "summary": "<p>A free download looks at the state of humanoids, including a rundown of current robotics developers and interviews with industry experts.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/mobile-manipulators-and-humanoids/\">Mobile manipulators and humanoids: The future of robotics<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "BioflexBot robot hand aims to replicate key human hand motions", "source": "Robotics Business Review", "date": "2026-08-13", "url": "https://www.therobotreport.com/bioflexbot-robot-hand-aims-to-replicate-key-human-hand-motions/", "summary": "<p>Researchers created the BioflexBot, a novel robot that mimics and even exceeds core motions of the hand with a simple design.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/bioflexbot-robot-hand-aims-to-replicate-key-human-hand-motions/\">BioflexBot robot hand aims to replicate key human hand motions<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "DAF Trucks to integrate Einride Driver to scale autonomous electric freight", "source": "Robotics Business Review", "date": "2026-08-12", "url": "https://www.therobotreport.com/daf-trucks-integrates-einride-driver-scale-autonomous-electric-freight/", "summary": "<p>Einride is integrating its self-driving software with PACCAR unit DAF Trucks and research at TNO to advance safe autonomous trucking.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/daf-trucks-integrates-einride-driver-scale-autonomous-electric-freight/\">DAF Trucks to integrate Einride Driver to scale autonomous electric freight<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Strengthening U.S. Army sustainment: TALUS to deliver autonomous distribution", "source": "Robotics Business Review", "date": "2026-08-12", "url": "https://www.therobotreport.com/strengthening-u-s-army-sustainment-talus-to-deliver-autonomous-distribution/", "summary": "<p>A Stratom-led team won a U.S. Army contract to develop TALUS, an autonomous logistics system for contested environments.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/strengthening-u-s-army-sustainment-talus-to-deliver-autonomous-distribution/\">Strengthening U.S. Army sustainment: TALUS to deliver autonomous distribution<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Q2 2026 robotics demand increased across industries, reports A3", "source": "Robotics Business Review", "date": "2026-08-12", "url": "https://www.therobotreport.com/q2-2026-robotics-demand-increased-across-industries-reports-a3/", "summary": "<p>A3 said that Q2 2026 robotics orders in food, electronics, and healthcare helped offset soft demand from automotive manufacturing.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/q2-2026-robotics-demand-increased-across-industries-reports-a3/\">Q2 2026 robotics demand increased across industries, reports A3<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "SEW-EURODRIVE adds economy series to its planetary servo gear unit portfolio", "source": "Robotics Business Review", "date": "2026-08-12", "url": "https://www.therobotreport.com/sew-eurodrive-adds-economy-series-planetary-servo-gear-unit-portfolio/", "summary": "<p>SEW-EURODRIVE's new P1.G, P2.G and P3.G gear units extend its existing PxG family below the P5.G, P6.G, and P7.G precision range.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/sew-eurodrive-adds-economy-series-planetary-servo-gear-unit-portfolio/\">SEW-EURODRIVE adds economy series to its planetary servo gear unit portfolio<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Celona launches Orion agentic wireless platform built for physical AI and robotics", "source": "Robotics Business Review", "date": "2026-08-12", "url": "https://www.therobotreport.com/celona-launches-orion-agentic-wireless-platform-built-for-physical-ai-robotics/", "summary": "<p>Celona launched Celona Orion, a unified agentic platform merging private 5G, Wi-Fi, cellular, and satellite into one network for physical AI.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/celona-launches-orion-agentic-wireless-platform-built-for-physical-ai-robotics/\">Celona launches Orion agentic wireless platform built for physical AI and robotics<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Webinar to discuss safety and scaling robot fleets in the warehouse", "source": "Robotics Business Review", "date": "2026-08-11", "url": "https://www.therobotreport.com/webinar-to-discuss-safety-scaling-robot-fleets-warehouse/", "summary": "<p>Industry experts will discuss how to scale mobile robots in the warehouse while maintaining both safety and productivity.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/webinar-to-discuss-safety-scaling-robot-fleets-warehouse/\">Webinar to discuss safety and scaling robot fleets in the warehouse<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "The 370-billion-dollar race: How integrated design can help humanoid manufacturers succeed in a rapidly growing market", "source": "Robotics Business Review", "date": "2026-08-11", "url": "https://www.therobotreport.com/the-370-billion-dollar-race-how-integrated-design-can-help-humanoid-manufacturers-succeed-in-a-rapidly-growing-market/", "summary": "<p>The future of humanoid robotics is closer than most people realize.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/the-370-billion-dollar-race-how-integrated-design-can-help-humanoid-manufacturers-succeed-in-a-rapidly-growing-market/\">The 370-billion-dollar race: How integrated design can help humanoid manufacturers succeed in a rapidly growing market<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "PlusAI reaches key milestones ahead of launching its autonomous trucks", "source": "Robotics Business Review", "date": "2026-08-11", "url": "https://www.therobotreport.com/plusai-reaches-key-milestones-ahead-launch-autonomous-trucks/", "summary": "<p>Since the start of the year, PlusAI said it has improved the safety validation, operational maturity, and efficiency of SuperDrive.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/plusai-reaches-key-milestones-ahead-launch-autonomous-trucks/\">PlusAI reaches key milestones ahead of launching its autonomous trucks<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Defense drone developer Cambridge Aerospace raises $300M", "source": "Robotics Business Review", "date": "2026-08-11", "url": "https://www.therobotreport.com/defense-drone-developer-cambridge-aerospace-raises-300m/", "summary": "<p>The round comes just months after the Cambridge Aerospace's $200 million Series B funding in April.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/defense-drone-developer-cambridge-aerospace-raises-300m/\">Defense drone developer Cambridge Aerospace raises $300M<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "VicOne releases free NVIDIA Isaac Sim cybersecurity extension based on DEF CON 34 research", "source": "Robotics Business Review", "date": "2026-08-10", "url": "https://www.therobotreport.com/vicone-releases-free-nviida-isaac-sim-cybersecurity-extension-based-def-con-34-research/", "summary": "<p>VicOne says its free Radeis Extension for NVIDIA Isaac Sim enables developers to test robot cyber safety before deployment.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/vicone-releases-free-nviida-isaac-sim-cybersecurity-extension-based-def-con-34-research/\">VicOne releases free NVIDIA Isaac Sim cybersecurity extension based on DEF CON 34 research<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Tate deploys 58 Hirebotics cobot welders across multiple facilities", "source": "Robotics Business Review", "date": "2026-08-10", "url": "https://www.therobotreport.com/tate-deploys-58-hirebotics-cobot-welders-across-multiple-facilities/", "summary": "<p>Tate decided to move from traditional hand welding to an agile, cloud-connected automation network powered by Hirebotics.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/tate-deploys-58-hirebotics-cobot-welders-across-multiple-facilities/\">Tate deploys 58 Hirebotics cobot welders across multiple facilities<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Robot Recycler Salvages Parts From Broken Machines", "source": "IEEE Spectrum Robotics", "date": "2026-08-10", "url": "https://spectrum.ieee.org/recycling-robot", "summary": "<img src=\"https://spectrum.ieee.org/media-library/two-large-industrial-robotic-arms-in-a-university-laboratory.jpg?id=67561939&amp;width=1245&amp;height=700&amp;coordinates=0%2C156%2C0%2C157\" /><br /><br /><p>Objects constructed by robots are ubiquitous. If you’ve used a car, household appliance, or smartphone today, you’ve used an object constructed at least in part by robots. The more products that manufacturers want to produce (and consumers want to consume) at lower costs, the more industrial robots will be needed.<\/p><p>There are <a href=\"https://ifr.org/ifr-press-releases/news/global-robot-demand-in-factories-doubles-over-10-years\" rel=\"noopener noreferrer\" target=\"_blank\">over 4 million<\/a> industrial robots in use worldwide, according to the <a href=\"https://ifr.org/\" target=\"_blank\">International Federation of Robotics<\/a>. And <a href=\"https://www.abiresearch.com/press/manufacturing-robot-installed-base-to-hit-16.3-million-by-2030-amid-baby-boomer-exodus\" rel=\"noopener noreferrer\" target=\"_blank\">researchers predict<\/a> that number will grow to over 16 million by 2030, as manufacturing rapidly increases. But what’s going to happen when they start breaking down? A new system designed by researchers at the <a href=\"https://www.wbk.kit.edu/english/index.php\" target=\"_blank\">Karlsruhe Institute of Technology<\/a> (KIT), in Karlsruhe, Germany, can predict the defect in a broken product and disassemble it while protecting valuable parts from damage. To continue robotic development <a href=\"https://roboticsecolabel.com/\" rel=\"noopener noreferrer\" target=\"_blank\">sustainably<\/a>, the industry should prepare for the dismantling, <a href=\"https://spectrum.ieee.org/e-waste-recycling-robots-ram\" target=\"_blank\">recycling<\/a>, and rebuilding of our robotic systems.<\/p><hr /><p>The system consists of a predictive algorithm that guesses how a product is broken, along with robotic manipulators that actually take the broken product apart. At every stage of the process, the system checks to see if the results align with its predictions, and updates its methods if necessary. For example, in the video below, the system begins by unscrewing a broken component. To simulate a stuck screw, the researcher replaces the screw. When the system observes the screw still in place, it switches to milling away material to remove the part.<\/p><p class=\"shortcode-media shortcode-media-youtube\"> <span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>Building a product with new parts is easy, says <a href=\"https://www.jan-baumgaertner.com/\" target=\"_blank\">Jan Baumgärtner<\/a>, one of the designers of the system. Each step is clearly outlined, and there are no expected deviations. But taking apart something that’s broken is unpredictable. “We can imagine 100 ways that something can go wrong.” And if you start taking something apart without knowing how it broke, you might have to undo part of your work when you find the problem. For example, if you have to unscrew 100 screws holding two parts together, but the last screw is stuck, you’ll have wasted time unscrewing all those screws when you should have used a different method to remove the part in the first place.<\/p><h3>How to Take Apart a Product<\/h3><p>KIT’s robotic disassembly system relies on a CAD model of the broken product and of each part, so it can see how the parts should behave and understand if anything is out of the ordinary. It also uses <span>a mathematical model to predict the damage done to a broken part.<\/span><\/p><p>When you give the system a broken device and a CAD model, it first guesses how each part of the broken device should move. The axes each part can move along are called degrees of freedom (for example, a screw should rotate, but not move side to side). The disassembler nudges each part to see if it moves as expected. Based on how the part actually moves, it then uses the mathematical model to predict what went wrong with the part: A corroded part might move less than you think it should, a loose screw may move more, and a deformed part might have different degrees of freedom than expected.<\/p><p>At the beginning of disassembly, the system formulates a plan. It guesses what might be wrong with the device it’s taking apart, and then can change its guess based on observing each piece it takes apart. For example, if there was a screw loose in the part, that might be hard to guess from an initial photograph of the broken part. But when the system moves the screw, it will notice that it can move in more ways than a screw <em>should<\/em> move, and take that loose screw into account when deconstructing the device. You can also tell the disassembly system which parts are most important to salvage intact from a broken device, and it can adjust its strategy to preserve those specific parts.<\/p><h3>The Automated Circular Economy<\/h3><p>Baumgärtner’s motivation behind the design of the robotic disassembler is to help create a circular economy, where old devices are repaired instead of thrown away, reducing waste. “The big future is saving our planet,” he says.<\/p><p>Baumgärtner envisions scaling up this one system, composed of a few robotic arms, to have many robotic disassembler arms, each with different tools. These arms will specialize in a different part of the disassembly process so that an entire factory could use different robotic limbs to disassemble a wide range of products. Think of an <a href=\"https://spectrum.ieee.org/hyundai-metaplant\" target=\"_self\">industrial robot factory that creates cars,<\/a> but instead is specialized to take them apart. Or, as he puts it, “as a giant robot with 100 arms.”<\/p><p>Ultimately, if this system works as intended, it would be a fully automated way of extracting a broken part from a system, replacing it, and rebuilding the device. Then the circular economy would really shine, as people replaced broken parts in old devices instead of buying new ones all the time. “That’s why we need to think about scaling this,” he says. “Because it means it becomes so cheap that it’s cheaper to repair this [electronic device] than to produce it. <a href=\"https://www.sfb1574.kit.edu/english/index.php\" target=\"_blank\">That’s the goal<\/a>.”<\/p><p><a href=\"https://arxiv.org/pdf/2511.23407\" target=\"_blank\">This research<\/a> was presented at the IEEE International Conference on Robotics and Automation (ICRA) 2026 in Vienna.<br /><\/p><p><em>This story was updated 11 August 2026 to clarify that the disassembly system works for products in general, not only robots.<\/em><\/p>"}, {"title": "Hadrian raises $1.37B to accelerate U.S. defense, aerospace manufacturing", "source": "Robotics Business Review", "date": "2026-08-10", "url": "https://www.therobotreport.com/hadrian-raises-1-37b-accelerate-u-s-manufacturing/", "summary": "<p>The raise values Hadrian at $7.87 billion. It is Hadrian's second funding round this year, following a round in January 2026.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/hadrian-raises-1-37b-accelerate-u-s-manufacturing/\">Hadrian raises $1.37B to accelerate U.S. defense, aerospace manufacturing<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "RoboStore launches Robo Inc. to help U.S. organizations deploy robots", "source": "Robotics Business Review", "date": "2026-08-10", "url": "https://www.therobotreport.com/robostore-launches-robo-inc-to-help-u-s-organizations-deploy-robots/", "summary": "<p>RoboStore, a distributor of Unitree's legged robots, has launched Robo Inc. to serve as a U.S.-based manufacturer and integrator.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/robostore-launches-robo-inc-to-help-u-s-organizations-deploy-robots/\">RoboStore launches Robo Inc. to help U.S. organizations deploy robots<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Analog Devices returns as strategic sponsor to aid MassRobotics startups", "source": "Robotics Business Review", "date": "2026-08-09", "url": "https://www.therobotreport.com/analog-devices-returns-strategic-sponsor-aid-massrobotics-startups/", "summary": "<p>Analog Devices Inc. is supporting MassRobotics startups with Analog Garage and participating in events including RoboBusiness.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/analog-devices-returns-strategic-sponsor-aid-massrobotics-startups/\">Analog Devices returns as strategic sponsor to aid MassRobotics startups<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Experts look ahead at the next 20 years of robotics at RoboBusiness", "source": "Robotics Business Review", "date": "2026-08-08", "url": "https://www.therobotreport.com/experts-look-ahead-at-the-next-20-years-of-robotics-at-robobusiness/", "summary": "<p>At Robobusiness, leaders in robotics will explore the technologies, opportunities, and challenges that will shape the next twenty years.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/experts-look-ahead-at-the-next-20-years-of-robotics-at-robobusiness/\">Experts look ahead at the next 20 years of robotics at RoboBusiness<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Video Friday: Drones Go Heavy in DARPA Lift Challenge", "source": "IEEE Spectrum Robotics", "date": "2026-08-07", "url": "https://spectrum.ieee.org/video-friday-heavy-lift-drone", "summary": "<img src=\"https://spectrum.ieee.org/media-library/engineers-watch-a-slender-experimental-drone-fly-near-a-large-hangar.jpg?id=67585216&amp;width=1245&amp;height=700&amp;coordinates=0%2C104%2C0%2C104\" /><br /><br /><p><span>Video Friday is your weekly selection of awesome robotics videos, collected by your friends at <\/span><em>IEEE Spectrum<\/em><span> robotics. We also post a weekly calendar of upcoming robotics events for the next few months. Please <\/span><a href=\"mailto:automaton@ieee.org?subject=Robotics%20event%20suggestion%20for%20Video%20Friday\">send us your events<\/a><span> for inclusion.<\/span><\/p><h5><a href=\"https://actuate.foxglove.dev/\">Actuate 2026<\/a>: 18–19 August 2026, SAN FRANCISCO<\/h5><h5><a href=\"https://2026.ieee-iros.org/\">IROS 2026<\/a>: 27 September–1 October 2026, PITTSBURGH<\/h5><h5><a href=\"https://humanoidssummit.com/\">Humanoids Summit Seoul<\/a>: 22–23 September 2026, SEOUL<\/h5><p>Enjoy today’s videos!<\/p><div class=\"horizontal-rule\"><\/div><div><span style=\"display: none;\"> <\/span><\/div><p class=\"rm-anchors\" id=\"tbw6a0-w1pe\">The <a href=\"https://spectrum.ieee.org/video-friday-heavy-lift-drones\" target=\"_blank\">DARPA Lift Challenge<\/a> is taking place through this weekend. There are a couple of very brief overview videos from the past couple of days, which are only really interesting because they give you a quick look at some utterly bizarre heavy-lift drone designs. If you like what you see, DARPA has recorded livestreams of the entire event so far. We’ve posted one of those at the end of this section, and if you want to be impressed by some super-weird drones, check out <a href=\"https://youtu.be/QFo0JRPsuxE?t=7780\" target=\"_blank\">this<\/a> and <a href=\"https://youtu.be/QFo0JRPsuxE?t=9865\" target=\"_blank\">this<\/a>.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p class=\"shortcode-media shortcode-media-youtube\"> <span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p class=\"shortcode-media shortcode-media-youtube\"> <span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p class=\"shortcode-media shortcode-media-youtube\"> <span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.darpaliftchallenge.com/\">DARPA Lift Challenge<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"gc084vusvby\"><em>When NASA’s <a href=\"https://spectrum.ieee.org/video-friday-skyfall-mars-helicopter\" target=\"_blank\">SkyFall helicopters<\/a> take to the Martian skies, one of their tasks will be to hunt for frozen water—a critical resource for future astronauts—using ground-penetrating radar. For that radar to work, the rotorcraft will carry a flexible, fabric-based antenna that extends below the aircraft without interfering with landings or breaking at touchdown.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://science.nasa.gov/mission/skyfall/\">NASA<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"i_ujhsjdxpy\">Why would you even want a five-fingered humanoid hand when you could have something so much better?<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.flexiv.com/product/grav\">Flexiv<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"mc8xcyqhtl4\"><em>We’ve improved how GEN-1 learns to adapt to new actuators and new robots at the lowest level, with up to 10-20x gains on internal benchmarks. This significantly boosts performance on high-precision tasks like disassembling parts from a NIST board.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://generalistai.com/blog/gen-1\">Generalist<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"cw2aofqerdm\">This is certainly one of the best-looking humanoid robots out there.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://gbionics.ai/\">Generative Bionics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"g98ynwovr_0\">A little on the technical side, but the concept here is important, I think: being able to control an assistive robot through touch.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://sites.google.com/view/tac-nav/home\">Tac-Nav<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"gvpqvwdgku4\"><em>We present SonicFly, a passive aeroacoustic perception framework that enables one unmanned aerial vehicle (UAV) to estimate and follow another using only the leader’s intrinsic flight sound.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://generalroboticslab.com/SonicFly\">General Robotics Lab<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"rssl4e2mwoi\">Okay, but... Get a job?<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.robotis.com/en/product/ecosystem-aisapiens.php\">ROBOTIS<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div>"}, {"title": "Avatar Robotics raises seed round to address industrial labor constraints", "source": "Robotics Business Review", "date": "2026-08-07", "url": "https://www.therobotreport.com/avatar-robotics-raises-6-5-m-seed-round-address-industrial-labor-constraints/", "summary": "<p>Avatar Robotics raised $6.5 million in funding to scale humanoid robots and remote teleoperation across industrial supply chains.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/avatar-robotics-raises-6-5-m-seed-round-address-industrial-labor-constraints/\">Avatar Robotics raises seed round to address industrial labor constraints<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Building robots that survive the warehouse", "source": "Robotics Business Review", "date": "2026-08-07", "url": "https://www.therobotreport.com/building-robots-that-survive-warehouse/", "summary": "<p>Nomagic says its real moat is production data, because the messiness of real warehouses is where robots either prove themselves or fail.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/building-robots-that-survive-warehouse/\">Building robots that survive the warehouse<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Tacta Systems takes aim at high-skilled manufacturing work with TactaBot", "source": "Robotics Business Review", "date": "2026-08-07", "url": "https://www.therobotreport.com/tacta-systems-takes-aim-high-skilled-manufacturing-work-tactabot/", "summary": "<p>Tacta Systems unveiled a three-part system, including its robotic hand, that enables users to teach its robot new dexterous skills.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/tacta-systems-takes-aim-high-skilled-manufacturing-work-tactabot/\">Tacta Systems takes aim at high-skilled manufacturing work with TactaBot<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "HII signs up to $900M agreement with Path Robotics, GrayMatter Robotics", "source": "Robotics Business Review", "date": "2026-08-06", "url": "https://www.therobotreport.com/hii-signs-up-to-900m-agreement-with-path-robotics-graymatter-robotics/", "summary": "<p>The latest agreement expands HII's HYPER Program, which Path Robotics and GrayMatter Robotics joined earlier this year.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/hii-signs-up-to-900m-agreement-with-path-robotics-graymatter-robotics/\">HII signs up to $900M agreement with Path Robotics, GrayMatter Robotics<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Report looks at advances in autonomous mobile robots", "source": "Robotics Business Review", "date": "2026-08-06", "url": "https://www.therobotreport.com/report-looks-at-advances-in-autonomous-mobile-robots/", "summary": "<p>A download looks at examples of advances in autonomous mobile robots in material handling and automated storage applications.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/report-looks-at-advances-in-autonomous-mobile-robots/\">Report looks at advances in autonomous mobile robots<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "How Robin, the robotic companion, keeps patients calm during hospital visits", "source": "Robotics Business Review", "date": "2026-08-06", "url": "https://www.therobotreport.com/how-robin-robotic-companion-keeps-patients-calm-during-hospital-visits/", "summary": "<p>Robin is deployed across 30 different health systems, and Expper has plans to deploy 10 more in different states. <\/p>\n<p>The post <a href=\"https://www.therobotreport.com/how-robin-robotic-companion-keeps-patients-calm-during-hospital-visits/\">How Robin, the robotic companion, keeps patients calm during hospital visits<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}], "embeddedNews": [{"title": "Running Generative AI on an RP2350", "source": "Hackaday", "date": "2026-09-05", "url": "https://hackaday.com/2026/09/05/running-generative-ai-on-an-rp2350/", "summary": "<div><img alt=\"A grid of images shows pictures emerging from patches of random noise. To the left, images are more random, while to the right they become more recognizable.\" class=\"attachment-large size-large wp-post-image\" height=\"449\" src=\"https://hackaday.com/wp-content/uploads/2026/09/image_generation.png?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>Driven by a desire for privacy, customization, and lower costs, there’s growing interest in AI models which can be run on local hardware. Few of them go as far as <a class=\"read-more\" href=\"https://hackaday.com/2026/09/05/running-generative-ai-on-an-rp2350/\">&#8230;read more<\/a>"}, {"title": "Free Your Rotary Telephone From Its Wire", "source": "Hackaday", "date": "2026-09-05", "url": "https://hackaday.com/2026/09/05/free-your-rotary-telephone-from-its-wire/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"450\" src=\"https://hackaday.com/wp-content/uploads/2026/09/dial-cellphone-featured.jpg?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>It&#8217;s said that a teenager given a rotary telephone in 2026 would be mystified by its operation, yet there are enough surviving instruments for them to be an attractive target <a class=\"read-more\" href=\"https://hackaday.com/2026/09/05/free-your-rotary-telephone-from-its-wire/\">&#8230;read more<\/a>"}, {"title": "COSMAC Elf Turns 50", "source": "Hackaday", "date": "2026-09-05", "url": "https://hackaday.com/2026/09/04/cosmac-elf-turns-50/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"450\" src=\"https://hackaday.com/wp-content/uploads/2026/09/fred.png?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>If you were interested in computers in the early 1970s, you struggled to get time on real computers since owning your own was all but impossible. In the middle of <a class=\"read-more\" href=\"https://hackaday.com/2026/09/04/cosmac-elf-turns-50/\">&#8230;read more<\/a>"}, {"title": "Parchment Paper Paired With 3D-Printed Grid Gives a Nice Glow", "source": "Hackaday", "date": "2026-09-05", "url": "https://hackaday.com/2026/09/04/parchment-paper-paired-with-3d-printed-grid-gives-a-nice-glow/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"432\" src=\"https://hackaday.com/wp-content/uploads/2026/09/64x64-matrix-front-banner.png?w=768\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"768\" /><\/div>This custom enclosure for a 64&#215;64 RGB LED matrix by [Davisan1001] not only provides a mount point for a Raspberry Pi, but presents a clean and smooth face with square <a class=\"read-more\" href=\"https://hackaday.com/2026/09/04/parchment-paper-paired-with-3d-printed-grid-gives-a-nice-glow/\">&#8230;read more<\/a>"}, {"title": "OpenTrailPaper transforms LILYGO T5 E-Paper S3 Pro devkit into a DIY e‑paper bike computer", "source": "CNX Software", "date": "2026-09-05", "url": "https://www.cnx-software.com/2026/09/05/opentrailpaper-transforms-lilygo-t5-e-paper-s3-pro-devkit-into-a-diy-e-paper-bike-computer/", "summary": "<div><img alt=\"OpenTrailPaper DIY e-paper bike computer\" class=\"attachment-medium size-medium wp-post-image\" height=\"572\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/09/OpenTrailPaper-DIY-e-paper-bike-computer-720x572.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>OpenTrailPaper is an open-source, DIY e-paper bike computer project comprised of firmware for the ESP32-S3-based T5 E-Paper S3 Pro devkit and Android and iOS companion apps for maps, routes, and settings. It shows ride data and offline maps, follows standard GPX (GPS Exchange Format) routes, records FIT (Flexible and Interoperable Data Transfer used in Garmin devices) files, and connects to Bluetooth (and soon ANT/ANT+) heart rate, power, and cadence sensors. Before looking into the project&#8217;s details, let&#8217;s check out the LILYGO T5 E-Paper S3 Pro specifications: ESP32-S3-WROOM-1 wireless module SoC –  ESP32-S3N16R8 dual-core Tensilica LX7 microcontroller @ up to 240 MHz with 2.4 GHz 802.11n WiFi 4 and Bluetooth 5.0 LE connectivity Memory – 8MB PSRAM Storage – 16MB SPI flash PCB antenna Storage &#8211; MicroSD card slot Display – 4.7-inch e-Paper display with 960&#215;540 resolution, 16 shades of gray, capacitive touch (GT911); ED047TC1 drive IC Wireless 2.4 GHz 802.11n [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/09/05/opentrailpaper-transforms-lilygo-t5-e-paper-s3-pro-devkit-into-a-diy-e-paper-bike-computer/\">OpenTrailPaper transforms LILYGO T5 E-Paper S3 Pro devkit into a DIY e‑paper bike computer<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Microchip, Marelli Target Software-Defined Vehicle Display Systems", "source": "Embedded.com", "date": "2026-09-05", "url": "https://www.embedded.com/microchip-marelli-target-software-defined-vehicle-display-systems/", "summary": "<p>Microchip Technology and Marelli have demonstrated a display connectivity solution that streams graphics and video generated by a vehicle's centralized computing system directly to automotive displays using ASA Motion Link (ASA-ML). Based on the open automotive video connectivity and SerDes standard defined by the Automotive SerDes Alliance (ASA), the solution is designed to simplify display [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/microchip-marelli-target-software-defined-vehicle-display-systems/\">Microchip, Marelli Target Software-Defined Vehicle Display Systems<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "Fixing an Expensive Seagate LaCie Hard Drive Array", "source": "Hackaday", "date": "2026-09-04", "url": "https://hackaday.com/2026/09/04/fixing-an-expensive-seagate-lacie-hard-drive-array/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"449\" src=\"https://hackaday.com/wp-content/uploads/2026/09/seagate_lacie_hard_drive_array_mend_it_mark_youtube.jpg?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>After the [Slow Mo Guys] acquired a 168 TB Seagate LaCie Thunderbolt 3-based RAID storage system back in 2019 to store their video footage, they were obviously slightly miffed when <a class=\"read-more\" href=\"https://hackaday.com/2026/09/04/fixing-an-expensive-seagate-lacie-hard-drive-array/\">&#8230;read more<\/a>"}, {"title": "Making a Pole Balance Itself With Propellers", "source": "Hackaday", "date": "2026-09-04", "url": "https://hackaday.com/2026/09/04/making-a-pole-balance-itself-with-propellers/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"412\" src=\"https://hackaday.com/wp-content/uploads/2026/09/self_balancing_pole_peter_ryseck_youtube.jpg?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>A fun trick with a pole is to try to balance it so that it can stand on one end. This can be done in a few ways, such as <a class=\"read-more\" href=\"https://hackaday.com/2026/09/04/making-a-pole-balance-itself-with-propellers/\">&#8230;read more<\/a>"}, {"title": "Repairing Traces on a Delidded Pentium III CPU Gone Wrong", "source": "Hackaday", "date": "2026-09-04", "url": "https://hackaday.com/2026/09/04/repairing-traces-on-a-delidded-pentium-iii-cpu-gone-wrong/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"436\" src=\"https://hackaday.com/wp-content/uploads/2026/09/pentium_3_cpu_delidding_damage_bits_und_bolts_youtube.jpg?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>Delidding a CPU involves removing the integrated heat spreader (IHS) that&#8217;s put over the bare die and the substrate that it is mounted on. The reason for this is usually <a class=\"read-more\" href=\"https://hackaday.com/2026/09/04/repairing-traces-on-a-delidded-pentium-iii-cpu-gone-wrong/\">&#8230;read more<\/a>"}, {"title": "ArduinoCore-Zephyr 1.0.0 adds support for Arduino VENTUNO Q, updates to Zephyr 4.4.1, and more", "source": "CNX Software", "date": "2026-09-04", "url": "https://www.cnx-software.com/2026/09/04/arduinocore-zephyr-1-0-0-adds-support-for-arduino-ventuno-q-updates-to-zephyr-4-4-1-and-more/", "summary": "<div><img alt=\"ArduinoCore Zephyr 1.0.0 Arduino Ventuno Q\" class=\"attachment-medium size-medium wp-post-image\" height=\"480\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/09/ArduinoCore-Zephyr-1.0.0-Arduino-Ventuno-Q-720x480.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Arduino has just announced the release of ArduinoCore-Zephyr version 1.0.0, with new hardware support, including the VENTUNO Q SBC, an updated Zephyr 4.4.1 base, support for the Nicla Vision camera, and various fixes and improvements. Arduino first announced its plans to switch from Arm Mbed to Zephyr RTOS in July 2024, before releasing the first beta of Arduino Core for Zephyr in December of the same year. ArduinoCore-Zephyr 1.0.0 is not the first stable version, since that was version 0.90.0 released on July 29, 2026. The new release builds on that, so let&#8217;s see what&#8217;s new. ArduinoCore-Zephyr 1.0.0 highlights Support for Arduino VENTUNO Q SBC, specifically the STM32H5F5 real-time MCU on the board Update to Zephyr 4.4.1 with the latest upstream improvements, security fixes, and driver support Added Nicla Vision camera support to capture and process image data directly through the Zephyr core Various bug fixes and CI improvements Currently [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/09/04/arduinocore-zephyr-1-0-0-adds-support-for-arduino-ventuno-q-updates-to-zephyr-4-4-1-and-more/\">ArduinoCore-Zephyr 1.0.0 adds support for Arduino VENTUNO Q, updates to Zephyr 4.4.1, and more<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Petoi Quaddle – A mini robot dog for physical AI experimentation (Crowdfunding)", "source": "CNX Software", "date": "2026-09-04", "url": "https://www.cnx-software.com/2026/09/04/petoi-quaddle-a-mini-robot-dog-for-physical-ai-experimentation/", "summary": "<div><img alt=\"Petoi Quaddle mini robot dog\" class=\"attachment-medium size-medium wp-post-image\" height=\"418\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/09/Petoi-Quaddle-mini-robot-dog-720x418.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>If you are not into ducks, but still would like to play around with physical AI, the Petoi Quaddle is a mini robot dog equipped with 4 servos controlling its legs and is designed to help people learn robotics, coding, AI, and 3D printing. The robot is powered by an ESP32-S3 motion core for servo control and wireless connectivity, and an optional ESP32-S3 AI core to enable voice commands and Smart Home control. The robot can walk, strafe, spin, talk back, and react to the user&#8217;s touch. Three models are available depending on the user&#8217;s requirements: Builder, Buddy, and Scout. A Raspberry Pi Zero can also be mounted on the top in place of the ESP32-S3-based AI core. Petoi Quaddle runs OpenCat open-source firmware (Arduino) already used in the earlier Petoi Bittle robot dog, first introduced in 2020. The robot can be programmed in a visual programming IDE with drag-and-drop [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/09/04/petoi-quaddle-a-mini-robot-dog-for-physical-ai-experimentation/\">Petoi Quaddle &#8211; A mini robot dog for physical AI experimentation (Crowdfunding)<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "TinyGo 0.42 adds support for 87 Puya PY32 MCU variants and two EmbedFire boards", "source": "CNX Software", "date": "2026-09-04", "url": "https://www.cnx-software.com/2026/09/04/tinygo-0-42-adds-support-for-87-puya-py32-mcu-variants-and-two-embedfire-boards/", "summary": "<div><img alt=\"TinyGo Puya py32 MCU\" class=\"attachment-medium size-medium wp-post-image\" height=\"480\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/09/TinyGo-Puya-py32-MCU-720x480.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>CNXSoft: This is a guest post by Pavel Burgr, who recently added Puya PY32 MCU support to TinyGo 0.42, the latest version of the Go compiler for microcontrollers. We first covered TinyGo in 2019, and the project is still going strong with 17.7k stars, 1.1k forks, and 243 contributors. I just made a few edits and added illustrations and a few links to the article. TinyGo 0.42 adds support for the Puya PY32 family of 32-bit Arm microcontrollers. The new port includes startup code, generated device-register definitions, linker scripts, GPIO and UART support, and targets for 87 individual MCU configurations. It also includes board definitions for two inexpensive EmbedFire development boards available from AliExpress. The port was contributed by Pavel Burgr and merged through TinyGo pull request #5106. One motivation was to establish a solid, easy-to-use firmware platform for small IoT devices built around the Registry service and the BleRiot [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/09/04/tinygo-0-42-adds-support-for-87-puya-py32-mcu-variants-and-two-embedfire-boards/\">TinyGo 0.42 adds support for 87 Puya PY32 MCU variants and two EmbedFire boards<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "NXP MCX A5 MCUs, Edge AI for Military Drone Autonomy, Modular Computing for Long-Lifecycle Aerospace Platforms: Embedded Week Insights", "source": "Embedded.com", "date": "2026-09-04", "url": "https://www.embedded.com/nxp-mcx-a5-mcus-edge-ai-for-military-drone-autonomy-modular-computing-for-long-lifecycle-aerospace-platforms-embedded-week-insights/", "summary": "<p>Here's a roundup of this week's must-read articles. We'll look into the latest developments on NXP MCX A5 MCUs, edge AI for military drones, modular computing for aerospace platforms, and more. Also, check News Archives - Embedded and Technical Articles Archives - Embedded for the complete list of news and articles from our website. NEWS SomDevices, Celus Bring μSMARC [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/nxp-mcx-a5-mcus-edge-ai-for-military-drone-autonomy-modular-computing-for-long-lifecycle-aerospace-platforms-embedded-week-insights/\">NXP MCX A5 MCUs, Edge AI for Military Drone Autonomy, Modular Computing for Long-Lifecycle Aerospace Platforms: Embedded Week Insights<\/a> appeared first on <a href=\"https://www.embedded.com
