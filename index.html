SB 2.0 interfaces, along with UARTs, SPI, I2C, I2S, GPIOs, and a DisplayPort 1.4 output supporting 2K at 60Hz. The module is designed for LiDAR sensors, IMUs, cameras, robotic controllers, smart displays, and other industrial peripherals. AAEON uCOM-Q6490 specifications: SoC – Qualcomm Dragonwing QCS6490 CPU – Octa-core Kryo 670 with 1x Gold Plus core (Cortex-A78) @ 2.7 GHz, 3x Gold cores (Cortex-A78) @ 2.4 GHz, 4x Silver cores (Cortex-A55) @ up to 1.9 GHz GPU – Adreno 643L GPU @ 812 MHz with support for Open GL ES 3.2, OpenCL 2.0, [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/08/21/aaeon-ucom-q6490-a-smarc-2-1-qualcomm-dragonwing-qcs6490-som/\">AAEON uCOM-Q6490 &#8211; A SMARC 2.1-compliant SoM powered by Qualcomm Dragonwing QCS6490 SoC<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "M5Stack Paper Mono – An ESP32-S3 e-paper development board with 3.97-inch touchscreen, LoRa, and NFC", "source": "CNX Software", "date": "2026-08-21", "url": "https://www.cnx-software.com/2026/08/21/m5stack-paper-mono-an-esp32-s3-e-paper-development-board-with-3-97-inch-touchscreen-lora-and-nfc/", "summary": "<div><img alt=\"M5Stack Paper Mono ESP32-S3 monochrome E Ink devkit\" class=\"attachment-medium size-medium wp-post-image\" height=\"635\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/08/M5Stack-Paper-Mono-ESP32-S3-monochrome-E-Ink-devkit-720x635.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>M5Stack introduced the PaperColor ESP32-S3 devkit last May, but if you prefer faster refresh rates, the new Paper Mono should be a better option. The kit is based on a 3.97-inch monochrome e-Paper touch display and also supports LoRa and NFC long-range and short-range connectivity. The devkit features 8MB PSRAM, 16MB flash, a microSD card slot, a PDM microphone and buzzer for audio interaction, a 6-axis IMU, an RTC, and a few buttons and an RGB LED. The Paper Mono doesn&#8217;t come with any expansion port and is powered by a USB-C port and a 1150 mAh battery. A Lite version is also offered without LoRa and NFC. M5Stack Paper Mono specifications: SoC – Espressif ESP32-S3R8 CPU – Dual-core Tensilica LX7 microcontroller up to 240 MHz with vector instructions for AI acceleration Memory – 8MB PSRAM Wireless – 2.4 GHz WiFi 4 and Bluetooth 5.0 LE + Mesh connectivity Storage [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/08/21/m5stack-paper-mono-an-esp32-s3-e-paper-development-board-with-3-97-inch-touchscreen-lora-and-nfc/\">M5Stack Paper Mono &#8211; An ESP32-S3 e-paper development board with 3.97-inch touchscreen, LoRa, and NFC<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Advanced RF Systems, Agilex FPGAs, a Neuromorphic Chip for AI Optical Inspection: Embedded Week Insights", "source": "Embedded.com", "date": "2026-08-21", "url": "https://www.embedded.com/advanced-rf-systems-agilex-fpgas-a-neuromorphic-chip-for-ai-optical-inspection-embedded-week-insights/", "summary": "<p>Here's a roundup of this week's must-read articles. We'll cover the latest developments on advanced RF systems for mil-aero communications, Agilex FPGAs, and a neuromorphic chip for AI optical inspection. Also, check News Archives - Embedded and Technical Articles Archives - Embedded for the complete list of news and articles from our website. NEWS Aetina Introduces Palm-Sized In-Vehicle Edge [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/advanced-rf-systems-agilex-fpgas-a-neuromorphic-chip-for-ai-optical-inspection-embedded-week-insights/\">Advanced RF Systems, Agilex FPGAs, a Neuromorphic Chip for AI Optical Inspection: Embedded Week Insights<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "Vector Brings Natural-Language AI Automation to CANoe", "source": "Embedded.com", "date": "2026-08-21", "url": "https://www.embedded.com/vector-brings-natural-language-ai-automation-to-canoe/", "summary": "<p>Vector Informatik GmbH has expanded its CANoe development and testing environment with AI agents and Model Context Protocol (MCP) capabilities. The new functions allow users to describe development, analysis, and testing tasks using natural-language prompts, after which specialized AI agents can determine the required steps and execute complete workflows automatically. The CANoe AI Package and [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/vector-brings-natural-language-ai-automation-to-canoe/\">Vector Brings Natural-Language AI Automation to CANoe<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "Aratas America LLC Introduces G3VH Relay", "source": "EE Journal", "date": "2026-08-21", "url": "https://www.eejournal.com/industry_news/aratas-america-llc-introduces-g3vh-relay/", "summary": "HOFFMAN ESTATES, Ill.&#8211;(BUSINESS WIRE)&#8211;As demand grows for more efficient, high-voltage power semiconductor technologies to support decarbonization and energy conservation, manufacturers are increasingly turning to silicon carbide (SiC)-based solutions. These technologies can improve performance across applications ranging from renewable energy systems and data centers to industrial automation and transportation. Against this backdrop, Aratas America LLC (Aratas), formerly OMRON &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/aratas-america-llc-introduces-g3vh-relay/\">Read More &#8594;<span class=\"screen-reader-text\"> \"Aratas America LLC Introduces G3VH Relay\"<\/span><\/a>"}, {"title": "With AWS Hackathon Win, TASKING-Led Team Demonstrates the Future of Automotive Safety-Critical Software Development", "source": "EE Journal", "date": "2026-08-21", "url": "https://www.eejournal.com/industry_news/with-aws-hackathon-win-tasking-led-team-demonstrates-the-future-of-automotive-safety-critical-software-development/", "summary": "MUNICH, August 18, 2026 — A cross-organizational team bringing together expertise from TASKING, Infineon and the German Aerospace Center (DLR) earned the top award at the AWS &#8220;Accelerating the V-Cycle with Agentic AI&#8221; hackathon for demonstrating a governed AI-assisted engineering workflow that reimagines software-defined vehicle development. The working prototype received the competition&#8217;s highest score for OEM purchase readiness, &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/with-aws-hackathon-win-tasking-led-team-demonstrates-the-future-of-automotive-safety-critical-software-development/\">Read More &#8594;<span class=\"screen-reader-text\"> \"With AWS Hackathon Win, TASKING-Led Team Demonstrates the Future of Automotive Safety-Critical Software Development\"<\/span><\/a>"}, {"title": "From Digital Twins to Confidence Engineering — A Deep Dive with Keysight Chief Technologist Jonathan Wright", "source": "EE Journal", "date": "2026-08-21", "url": "https://www.eejournal.com/fish_fry/from-digital-twins-to-confidence-engineering-a-deep-dive-with-keysight-chief-technologist-jonathan-wright/", "summary": "<img alt=\"\" class=\"webfeedsFeaturedVisual wp-post-image\" height=\"300\" src=\"https://www.eejournal.com/wp-content/uploads/2026/08/ChatGPT_Image_Aug_18_2026_11_28_44_AM6bm32-copy-1-300x300.png\" style=\"display: block; margin-bottom: 5px; clear: both;\" width=\"300\" />This week we’re diving into a challenge that’s becoming increasingly important: how do we make sure our engineering workflows, software, data, and AI can all work together reliably? My guest is Jonathan Wright, Chief Technologist at Keysight. Jonathan and I chat about the industry’s shift toward multi-physics and application-specific workflows and how that evolution is &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/fish_fry/from-digital-twins-to-confidence-engineering-a-deep-dive-with-keysight-chief-technologist-jonathan-wright/\">Read More &#8594;<span class=\"screen-reader-text\"> \"From Digital Twins to Confidence Engineering — A Deep Dive with Keysight Chief Technologist Jonathan Wright\"<\/span><\/a>"}, {"title": "European premiere of innovative V-Cell technology alongside complete Ni-MH battery portfolio for rail applications", "source": "EE Journal", "date": "2026-08-21", "url": "https://www.eejournal.com/industry_news/european-premiere-of-innovative-v-cell-technology-alongside-complete-ni-mh-battery-portfolio-for-rail-applications/", "summary": "At InnoTrans 2026 in Berlin, from September 22 to 25, Panasonic Energy will present, for the first time in Europe, its innovative V-Cell based Nickel-Metal Hydride (Ni-MH) battery technology for the European railway market at Hall 15.1, Booth No. 180. Visitors can experience a complete portfolio of railway battery solutions designed for a wide range &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/european-premiere-of-innovative-v-cell-technology-alongside-complete-ni-mh-battery-portfolio-for-rail-applications/\">Read More &#8594;<span class=\"screen-reader-text\"> \"European premiere of innovative V-Cell technology alongside complete Ni-MH battery portfolio for rail applications\"<\/span><\/a>"}, {"title": "Basler, Syslogic Deliver Industrial Machine Vision Solutions", "source": "Embedded.com", "date": "2026-08-20", "url": "https://www.embedded.com/basler-syslogic-deliver-industrial-machine-vision-solutions/", "summary": "<p>Basler and Syslogic are expanding their partnership to enable machine vision and edge AI in industrial applications that require high-performance cameras and rugged AI computing platforms. The partnership leverages Basler's ace 2 GMSL cameras and Syslogic's rugged computers to deliver machine vision to applications such as autonomous mobile robots, agricultural vehicles, construction equipment, and intelligent [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/basler-syslogic-deliver-industrial-machine-vision-solutions/\">Basler, Syslogic Deliver Industrial Machine Vision Solutions<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "Advanced RF Systems Power Next-Gen Mil-Aero Comms", "source": "Embedded.com", "date": "2026-08-19", "url": "https://www.embedded.com/advanced-rf-systems-power-next-gen-mil-aero-comms/", "summary": "<p>The radio-frequency (RF) industry, relying on established technologies for many years, is entering a significant phase of growth, driving the need for advanced solutions. Rising investment in defense and security systems and the expansion of the space economy are the two key drivers behind this growth. On the defense side, there is the demand for [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/advanced-rf-systems-power-next-gen-mil-aero-comms/\">Advanced RF Systems Power Next-Gen Mil-Aero Comms<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "Aetina Introduces Palm-Sized In-Vehicle Edge AI Platforms", "source": "Embedded.com", "date": "2026-08-19", "url": "https://www.embedded.com/aetina-introduces-palm-sized-in-vehicle-edge-ai-platforms/", "summary": "<p>Aetina Corporation introduced the DeviceEdge AIE-VN34/44 and AIE-VO24/34, its first palm-sized in-vehicle edge AI systems. Based on the Nvidia Jetson Orin NX and Jetson Orin Nano modules, the platforms provide up to 100 TOPS and 67 TOPS of AI performance, respectively, and support four GMSL2 camera connections. The systems target smart transportation, autonomous mobile robots [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/aetina-introduces-palm-sized-in-vehicle-edge-ai-platforms/\">Aetina Introduces Palm-Sized In-Vehicle Edge AI Platforms<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "BrainChip, Orama.AOI Target AI-Based Industrial Defect Detection", "source": "Embedded.com", "date": "2026-08-18", "url": "https://www.embedded.com/brainchip-orama-aoi-target-ai-based-industrial-defect-detection/", "summary": "<p>BrainChip Inc. has partnered with Atlanta-based Orama.AOI to develop AI-based automated optical inspection solutions using BrainChip's Akida neuromorphic AI platform. Orama.AOI has retrained and optimized Akida models using its industrial inspection datasets, demonstrating the platform's application to production-oriented defect detection. Orama.AOI provides AI-powered automated optical inspection technology for industrial applications with current use cases including [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/brainchip-orama-aoi-target-ai-based-industrial-defect-detection/\">BrainChip, Orama.AOI Target AI-Based Industrial Defect Detection<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "SensiBel and Aizip Combine Optical MEMS and Edge AI Beamforming", "source": "Embedded.com", "date": "2026-08-17", "url": "https://www.embedded.com/sensibel-and-aizip-combine-optical-mems-and-edge-ai-beamforming/", "summary": "<p>SensiBel and Aizip are collaborating on a speech-processing solution that combines sensiBel's optical MEMS microphone technology with Aizip's edge AI beamforming algorithms. The companies aim to improve speech clarity and recognition in demanding acoustic environments, including smart glasses, true wireless stereo (TWS) earbuds, and industrial speech applications. Aizip's beamforming solution combines AI-based noise reduction, dereverberation [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/sensibel-and-aizip-combine-optical-mems-and-edge-ai-beamforming/\">SensiBel and Aizip Combine Optical MEMS and Edge AI Beamforming<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "Humanoid Robots, Simplifying Embedded System Design, Photonic IC Development: Embedded Week Insights", "source": "Embedded.com", "date": "2026-08-14", "url": "https://www.embedded.com/humanoid-robots-simplifying-embedded-system-design-photonic-ic-development-embedded-week-insights/", "summary": "<p>Here's a roundup of this week's must-read articles. We'll look into the latest developments on humanoid robots, simplifying embedded system design, photonic IC development, and more. Also, check News Archives - Embedded and Technical Articles Archives - Embedded for the complete list of news and articles from our website. NEWS OpenLight and Tower Accelerate Photonic IC Development The expanded [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/humanoid-robots-simplifying-embedded-system-design-photonic-ic-development-embedded-week-insights/\">Humanoid Robots, Simplifying Embedded System Design, Photonic IC Development: Embedded Week Insights<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}], "papers": [{"title": "ReWorld: An Interactive World Model with Long-Horizon Memory", "authors": ["Zhifei Chen", "Luozhou Wang", "Guibao Shen", "Dongyu Yan", "Shuai Yang", "Tianshuo Xu", "Yihua Du", "Wei Wang", "Tianyi Gui", "Lianghua Huang", "Yingcong Chen"], "published": "2026-08-24", "summary": "An interactive world model must follow the user's actions, remember the places it has shown, and stream in real time. The tension is structural: control wants a short horizon, memory wants an unbounded one. ReWorld separates the two during training and bounds them at inference. Mixed per-head attention windows confine most heads to the recent past while a small set of global heads attends over the entire history, and random head routing keeps either capability from binding to particular heads; random chunk dropping makes sparse histories in-distribution. At inference the whole past lives under a fixed budget: a bounded KV cache backed by a pose-indexed landmark bank, from which the model retrieves the landmarks nearest the current pose. A metric-scale-aligned data engine places eight sources -- Unreal-rendered fly-throughs, game roaming, and real-world footage -- on one physical action scale, so the same key press moves the camera the same distance in every source, and palindrome trajectories supply the revisit evidence that memory training needs. Distribution-matching distillation confined to a LoRA adapter then compresses sampling to four steps: one backbone serves both a high-fidelity multi-step mode and a real-time interactive one, streaming 704x1280 video across photorealistic, game-style, and stylized worlds. Under a three-axis protocol covering action following, long-horizon recall, and video quality, against six recent interactive world models it attains the best control fidelity ($11.95^\\circ$ rotation error and the best camera-motion consistency) and the best generation quality; and on minute-long out-and-back rollouts ($64$\\,s, $384$ latents), its fixed 12-chunk cache still regenerates the starting view -- at rollout lengths where a sliding window has long evicted the evidence and full-KV attention runs out of memory.", "pdf_url": "https://arxiv.org/pdf/2608.23565v1"}, {"title": "Interpretable AI with Local Distillation", "authors": ["Erin Craig", "Yiling Huang", "Snigdha Panigrahi"], "published": "2026-08-24", "summary": "Modern AI models such as tabular foundation models and gradient-boosted ensembles can outpredict classical methods, but provide little basis for reasoning about their predictions. High-stakes decisions call for models that are both accurate and interpretable as built. Local linear modeling offers a path forward: a smooth regression function is locally well approximated by a linear one, allowing a linear fit near each query point to achieve high accuracy without sacrificing transparency. The challenges lie in learning what is \"local\" and developing statistical tools for interpretation. Here, we propose local distillation, in which a black-box \"teacher\" guides a regularized linear \"student\" model at each query point. The teacher (1) defines locality by upweighting training observations with similar predicted outcomes, and (2) anchors the fit with its prediction at the query point, included as a pseudo-observation whose weight is estimated from the data. For interpretation, we add a small amount of Gaussian randomization to the local objective and use refits to assess stability: selection frequencies identify reliable features at a query point, and clustering the randomized fits identifies stable subgroups across the data. Under the lasso penalty, we prove that this randomization yields feature-selection probabilities that are stable under small perturbations of the training responses. Across 17 benchmark datasets, local distillation nearly matches its AI teacher's accuracy while producing a sparse linear model at each test point. In a high-dimensional cancer gene expression example, the framework identifies patient subgroups whose local models use different genes; this heterogeneity is invisible to a global linear model, and difficult to surface in a black-box model.", "pdf_url": "https://arxiv.org/pdf/2608.23538v1"}, {"title": "The ALMA EGO-10 Survey of Massive Protoclusters: Correlation of 1.3 mm Continuum Source Clustering with Evolutionary State", "authors": ["Michael C. Logue", "Claudia J. Cyganowski", "Crystal L. Brogan", "Todd R. Hunter", "Alessio Traficante", "Allison P. M. Towner", "Stella S. R. Offner"], "published": "2026-08-24", "summary": "Massive stars characteristically form in clustered environments. Characterising young massive 'protoclusters' is therefore crucial to constraining the mechanism(s) of massive star formation, and of the assembly of stellar clusters. We present 1.3 mm continuum results from the ALMA EGO-10 imaging survey, targeting ten Spitzer GLIMPSE Extended Green Objects (EGOs) - massive protostars with active outflows traced by extended 4.5 $μ$m emission. Our sensitive 1'.6$\\times$1'.6 mosaics reveal rich protoclusters associated with all targets. With a mean spatial resolution 2200$\\times$1600 AU, we identify 570 cores - between 13 and 135 per field. We quantify protocluster structure with the $Q$-parameter, finding structural diversity with 0.5 $\\lesssim Q \\lesssim$ 0.9. The sample is notable for the wealth of complementary high-resolution multiwavelength data available. Correlating our cores with these observations, we find only 2%, 5% and 4% of cores host 6.7 GHz CH$_3$OH masers, 22 GHz H$_2$O masers and cm-$λ$ continuum sources, respectively. The massive protostars traced by 6.7 GHz masers typically reside near protocluster centres (median offset 0.045 pc), and all at $d<$ 3 kpc are found in clustered locales, with $>$10 cores within 10,000 AU. Using VLA cm-$λ$ continuum observations, we construct a new evolutionary indicator: the ratio of protocluster cm-$λ$ continuum luminosity to the mass of the associated ATLASGAL clump ($L_\\text{cm}/M_\\text{AGAL}$). This ratio correlates positively with $Q$, with the correlation driven primarily by the cm-$λ$ continuum emission from MYSOs. This suggests dynamic protocluster structure, evolving from subclustered to centrally condensed, consistent with the global collapse in hierarchical, clump-fed models of massive star formation.", "pdf_url": "https://arxiv.org/pdf/2608.23527v1"}, {"title": "Correcting a learned physical invariant improves world-model rollouts", "authors": ["Richard Bao"], "published": "2026-08-24", "summary": "World models can predict video without learning dynamics that they reliably preserve. We test whether a frozen DreamerV3 trained only on pendulum video learns a scalar that its own latent transition treats as approximately conserved. A label-free search recovers the same energy-like invariant across independently trained conservative models, while the same procedure finds no comparable invariant in matched damped models. During autonomous rollouts, this quantity drifts. Projecting the latent state back toward its initial level set reduces rollout error in all three conservative models, whereas matched random constraints usually increase it. These results distinguish a dynamically meaningful invariant from a merely decodable correlate and reveal a concrete failure mode: a world model can learn a physical constraint from pixels yet violate that constraint when it imagines forward.", "pdf_url": "https://arxiv.org/pdf/2608.23526v1"}, {"title": "GeoWAM: Visual Geometry World Action Models for Autonomous Driving", "authors": ["Yiren Lu", "Xin Ye", "Jiaming Liu", "Jin Yao", "Yi-chung Chen", "Liam Merino", "Dhruva Dixith Kurra", "Min Cai", "Tom Lampo", "Yu Yin", "Danhua Guo", "Burhan Yaman"], "published": "2026-08-24", "summary": "World action models (WAMs) have recently gained increasing attention as a framework for jointly modeling scene evolution and ego actions in autonomous driving. Most existing WAMs learn scene dynamics in pixel space by combining a video-generation backbone for future-observation prediction with an action head for ego-trajectory prediction. Pixels, however, provide only an indirect representation of these dynamics: they entangle geometry and motion with appearance, texture, and illumination, forcing the model to infer three-dimensional transformations from two-dimensional observations. We argue that geometry, represented by point clouds, offers a more natural state space for driving because it explicitly captures spatial structure and the rigid and non-rigid transformations that govern scene evolution while directly aligning with the space in which driving actions are executed. Building on this insight, we introduce \\textbf{GeoWAM}, a visual geometry world action model for autonomous driving. Rather than predicting future images, GeoWAM is pretrained to forecast future scene geometry, yielding representations that jointly encode spatial structure and temporal evolution. A geometry-conditioned action head then leverages these learned geometric dynamics to predict future ego trajectories. Extensive open-loop and closed-loop evaluations show that visual geometry world modeling yields substantially stronger driving policies than image-based alternatives, establishing future-geometry prediction as an effective pretraining objective for autonomous driving.", "pdf_url": "https://arxiv.org/pdf/2608.23486v1"}, {"title": "Act with Intent: Distilling Behavior Intent for Vision-Language-Action Models", "authors": ["Sangoh Lee", "Sangwoo Mo", "Wook-Shin Han"], "published": "2026-08-24", "summary": "Vision-Language-Action (VLA) models can turn multimodal context into robot actions, but their action decoders are still trained largely by behavior cloning. This supervises which motor command was demonstrated while leaving implicit the local objective served by the behavior under the instruction. Future-based supervision enriches action learning with frames, latent observations, trajectories, or motion representations, but these signals capture particular realizations of what may happen rather than the shared semantic objective of the forthcoming behavior. We propose Intention Distillation (INDI), which distills behavior-level intent into the action decoder. During training, a frozen teacher VLM interprets a demonstrated segment from the current observation, instruction, coarse action summary, and corresponding execution video. From its standard inputs, the deployed VLA recovers the resulting multimodal intent representation at an intermediate decoder layer and uses it to organize action prediction together with representations of how the behavior unfolds and what it achieves. On SimplerEnv-Bridge, INDI improves GR00T-N1.7 from 64.3% to 84.7%, and on RoboCasa Kitchen it improves the controlled GR00T-N1.7 baseline from 64.1% to 70.3%, with consistent gains on $π_{0.5}$ across both benchmarks. In real-world tasks, INDI improves average success from 62.0% to 68.7%, with gains of up to 12.0 pp on longer-horizon tasks. Further analyses show that the recovered latent is used by the decoder, captures behavior objective and execution progress, and organizes downstream predictions in an objective-dependent manner. These results show that action decoders benefit from explicitly modeling the semantic objective of the behavior they generate.", "pdf_url": "https://arxiv.org/pdf/2608.23478v1"}, {"title": "MetaCaster: Meta-Harness-Optimized Agent for End-to-End Few-Shot Learning of Lightweight Time Series Forecasters", "authors": ["ChengAo Shen", "Wenchao Yu", "Fangyu Wu", "Dongjin Song", "Hanghang Tong", "Dongsheng Luo", "Wei Cheng", "Haifeng Chen", "Jingchao Ni"], "published": "2026-08-24", "summary": "Time series forecasting (TSF) is evolving toward multimodal and agentic settings, yet using foundation models remains uneconomical in resource-constrained scenarios, where compact, specialized forecasters are more desirable. However, lightweight forecasters typically require substantial training data, limiting their use in domains with scarce, slowly accumulated, or privacy-sensitive time series. To address this dilemma, we investigate the challenging problem of few-shot learning for lightweight forecasters. We propose MetaCaster, a meta-harness-optimized multi-agent framework that uses agentic data generation to automatically train specialized lightweight forecasters from only a few examples and textual contexts. Our work highlights a new TSF paradigm in which agents act not as forecasters but as intermediary engineers that prepare efficient, task-specific forecasters for deployment. Experiments on 18 datasets, 23 state-of-the-art lightweight forecasters, and 14 baselines demonstrate that MetaCaster achieves both data efficiency and computational efficiency while maintaining high-quality TSF performance.", "pdf_url": "https://arxiv.org/pdf/2608.23473v1"}, {"title": "Reward-Free Continual Adaptation for Resilient Space Robots", "authors": ["Andrej Orsula", "Miguel Olivares-Mendez", "Carol Martinez"], "published": "2026-08-24", "summary": "Space robots operate in extreme environments where hardware degradation can critically compromise traditional control strategies. While continual reinforcement learning offers a promising mechanism for online adaptation, it inherently requires access to a reward signal during deployment. However, precise reward computation in space is often infeasible due to the lack of external tracking systems and the overall complexity of the environment. To address the challenge of unobservable rewards, we introduce a reward-free continual learning framework that leverages latent-state world models. By pre-training a model-based agent across diverse simulations, the world model learns a robust predictor of the reward structure within its latent space. Upon deployment to an environment with severe hardware degradation, we freeze the observation encoder and reward predictor to update only the transition dynamics of the world model through unsupervised rollouts. By training the policy entirely on imagined trajectories generated by this updated world model, the agent adapts to altered dynamics without receiving new rewards. We demonstrate our approach across simulated planetary traversal, orbital navigation, and precision assembly tasks subjected to severe morphological failures.", "pdf_url": "https://arxiv.org/pdf/2608.23452v1"}, {"title": "Whose readiness counts? Disagreement within and between sectors in perceived AI and robotics preparedness", "authors": ["Peng Wang"], "published": "2026-08-24", "summary": "AI and Industry 4.0 readiness assessments often summarise preparedness using a single score for an organisation, application domain or sector. Those summaries can conceal disagreement about the same technology and variation among applications grouped under one sector label. We test how much information is lost through this aggregation using a card-based survey in which 982 respondents provided 15,200 readiness evaluations across 17 named AI and robotics challenges. Readiness is perceived community preparedness and available resources, not personal willingness or audited organisational capability. Respondents frequently disagreed about identical challenges, with card-level readiness standard deviations of $1.03$-$1.26$ on a five-point scale. A crossed decomposition attributes 32.7% of observed variation to stable respondent differences, 7.3% to differences among challenges, and 60.0% to response-level variation that also contains measurement error. Differences among challenge-family means account for only about 2% of variation, with substantially more variation among people, applications and person-family judgements. Manufacturing has the highest mean readiness, yet shop-floor robotics, process-optimisation AI and general decision-support applications are judged differently. Computer-science and AI/ML respondents report higher readiness than non-technical respondents across challenge families, whereas engineering respondents do not report higher Manufacturing readiness. Sector rankings are therefore best used as portfolio summaries rather than evidence that an industry is uniformly ready or behind. Readiness reporting should retain application-level disagreement, disclose whose judgements form the average, and consider ethics, cyber security, literacy and capability needs without collapsing them into a single score.", "pdf_url": "https://arxiv.org/pdf/2608.23406v1"}, {"title": "MomADv2: Reliable Temporal Memory for End-to-End Autonomous Driving", "authors": ["Ziying Song", "Shengkai Zhang", "Lin Liu", "Peiliang Wu", "Lei Yang", "Dongyang Xu", "Bin Sun", "Li Wang", "Shaoqing Xu", "Caiyan Jia", "Yadan Luo"], "published": "2026-08-24", "summary": "Long-horizon planning is critical for safe autonomous driving in complex scenarios. Existing methods improve planning continuity with temporal memory, but such memory may become invalid and mislead decisions when the driving command changes. Thus, selectively leveraging useful history while suppressing command-inconsistent memory remains a key challenge. To address this issue, we propose MomADv2, a reliable state-space memory framework for long-horizon end-to-end autonomous driving. At its core, MomADv2 introduces a Selective State-Space Planning Memory Query Module, which filters historical planning queries based on temporal continuity and command consistency, selects planning modes relevant to the current command, and models the evolution of planning intentions through a selective state-space mechanism. To further alleviate local trajectory deviations and error accumulation in long-horizon planning, we design a Flow-Matching Trajectory Residual Refiner. It learns a continuous residual correction field from the refined planning output to the expert trajectory, enabling fine-grained trajectory refinement while preserving the stability of anchor-based planning. Extensive experiments on closed-loop NAVSIM and Bench2Drive, as well as open-loop nuScenes, demonstrate that MomADv2 improves long-horizon planning consistency and reduces the average collision rate by 15.6% over MomAD under 6-second planning.", "pdf_url": "https://arxiv.org/pdf/2608.23405v1"}, {"title": "Long-Horizon Audio-Visual Generation for Persistent Stories and Interactive Worlds", "authors": ["Nan Duan", "Haoyang Huang", "Weiyang Jin", "Haoran Li", "Yaowei Li", "Yuming Li", "Yijun Liu", "Xin Lu", "Xiaoxiao Ma", "Yanwen Ma", "Yaofeng Su", "Yilang Sun", "Haoyu Wang", "Zeyue Xue", "Songchun Zhang", "Junhao Zhuang"], "published": "2026-08-24", "summary": "Video generation is progressing beyond isolated clips toward long-form narratives and interactive worlds, requiring models to preserve identities, follow user controls, and remain stable over extended rollouts. We present JoyAI-Echo-1.5, a unified audio-visual generation system with two purpose-built variants. The long-video variant introduces composable cross-shot memory that aggregates visual evidence across multiple prior shots and speaker cues derived from speech-filtered full-shot audio, enabling persistent character appearance and voice identity across flexible combinations of text, image, and memory conditioning. The world-model variant converts heterogeneous navigation inputs into calibrated metric 6-DoF camera trajectories and injects them through a geometry-aware conditioning pathway, enabling controller-agnostic interaction across flexible viewpoints. To support efficient long-horizon generation, we transform a bidirectional audio-visual backbone into a causal few-step generator using progressive teacher forcing and short- and long-horizon Self-Gradient Forcing on self-generated rollouts. Experiments demonstrate strong performance in both settings. JoyAI-Echo-1.5 achieves improvements over existing long-video baselines in cross-shot consistency, visual quality, text alignment, and speech fidelity. Its world-model variant ranks first on WBench, with an average score of 81.7, and achieves leading visual quality and long-horizon persistence on SANA-WM-Bench. Together, these results indicate that memory, geometric control, and rollout-aware training provide a practical foundation for generating coherent stories and continuously evolving interactive worlds. Project page: https://echo-team-joy-future-academy-jd.github.io/Echo-1.5-Page/.", "pdf_url": "https://arxiv.org/pdf/2608.23383v1"}, {"title": "Transform-Based Multilinear Algebra via Tensor Decomposition", "authors": ["Yidan Mei", "Shenghan Mei", "Ziqin He", "Can Chen"], "published": "2026-08-24", "summary": "Transform-based tensor products, including the T-product and its more general form, namely the higher-order tensor-tensor product, have become fundamental tools for multilinear data analysis in applications such as image processing, signal reconstruction, and robotics. While invertible transforms enable tensor computations to be carried out via matrix operations in the transform domain, the resulting storage and computational costs remain prohibitive for high-dimensional, higher-order tensors. To address this challenge, we integrate low-rank tensor decomposition techniques, specifically tensor train decomposition (TTD) and hierarchical Tucker decomposition (HTD), into transform-based multilinear algebra to improve computational and memory efficiency. In particular, we develop TTD- and HTD-based formulations for the T-product and its associated key algebra, such as block diagonalization and tensor singular value decomposition, by operating directly on the factor matrices or tensors of the decompositions. The framework is further generalized to the higher-order tensor-tensor product and applied to multilinear model order reduction problems. We demonstrate the effectiveness and efficiency of our framework with numerical examples.", "pdf_url": "https://arxiv.org/pdf/2608.23366v1"}, {"title": "OptiSight: Bridging Semantic Reasoning and Geometric Control for Embodied Navigation", "authors": ["Alperen Avan", "Jordi Sanchez-Riera"], "published": "2026-08-24", "summary": "Autonomous indoor navigation requires both semantic understanding and precise geometric control. We propose OptiSight, a hybrid framework that combines Vision-Language Model reasoning with deterministic visual servoing through a finite-state Chain-of-Thought architecture. Grounded-SAM localizes open-vocabulary targets, while camera projection geometry converts visual observations into navigation commands without requiring dense mapping. The VLM is queried only at key decision points, reducing computational overhead while geometric control handles continuous navigation. Experiments in AI Habitat demonstrate reliable zero-shot navigation across diverse indoor scenarios, including obstacle avoidance and semantic ambiguity, while operating within an 8~GB VRAM budget. The source code is available at https://github.com/avanalperen/OptiSight-Python-Multimodal-CoT-for-Visual-Reasoning.", "pdf_url": "https://arxiv.org/pdf/2608.23354v1"}, {"title": "ROS2SmolVLA: Enabling Small Vision-Language-Action Models for Integration into Industrial-Grade Lightweight Robots", "authors": ["Nils Mandischer", "Noah Böckmann", "Ludwig Holl", "Lars Mikelsons"], "published": "2026-08-24", "summary": "Industrial demand changes the paradigms of production. Due to smaller batch sizes and more variations in products, companies face a growing challenge to adopt more adaptive production systems. In particular, robot-based automation is usually static and fails to respond to constantly changing processes. Vision-Language-Action (VLA) Models are a promising opportunity to mitigate this challenge by generating robot actions based on the observed system state. However, current research either focuses on large models that cannot be computed on premise, creating compliance and security challenges, or use lab-grade robot hardware that obscures exploitation in real industrial settings. In this work, we adapt Hugging Face's SmolVLA for Universal Robots lightweight robots. Further, we release the open-source repository ROS2SmolVLA that implements an interface for ROS 2 to SmolVLA, and makes it applicable for industrial-grade hardware. By this, we allow a lenient adoption into lab and industrial environments. We validate the functionality of SmolVLA for a Universal Robots UR10e using a pick-and-place task and give implementation guidelines. Our findings support that SmolVLA is a well-suited option for small-sized tasks that need to be computed on premise.", "pdf_url": "https://arxiv.org/pdf/2608.23320v1"}, {"title": "Design of a Biomimetic Joint-Covering Skin with Tissue-Like Structure to Enhance Proprioception in a Musculoskeletal Humanoid", "authors": ["Akihiro Miki", "Shun Hasegawa", "Yoshimoto Ribayashi", "Kento Kawaharazuka", "Kei Okada"], "published": "2026-08-24", "summary": "Proprioception in musculoskeletal humanoids is typically estimated primarily from muscle sensing, while the role of cutaneous deformation around joints remains insufficiently explored. In biological systems, mechanoreceptors distributed within soft tissue complement muscle feedback and support reliable joint state estimation. This study presents the design of a biomimetic joint-covering skin with a tissue-like layered structure that integrates pressure- and stretch-sensitive elements within the joint-covering tissue. The proposed skin is implemented on the musculoskeletal humanoid Musashi-W, and its independent proprioceptive capability as well as its integration with muscle sensing are evaluated. Experimental results show that the proposed skin alone achieves joint angle estimation with an average error of approximately 3 degrees. Furthermore, integration with muscle sensing improves estimation accuracy. Owing to its joint-covering structure, the skin may mechanically mitigate the influence of external disturbances on the muscles, and the integration of multiple modalities suggests the possibility of contributing to the identification of external stimuli that are difficult to interpret using muscle sensing alone. This work presents a design methodology for biomimetic joint-covering skin and demonstrates that such tissue-structured skin can serve as an effective approach for extending proprioceptive systems in musculoskeletal humanoids.", "pdf_url": "https://arxiv.org/pdf/2608.23304v1"}, {"title": "Sigmoid Attention as a Better Substrate for Learned KV Cache Eviction", "authors": ["Isaac", "Li"], "published": "2026-08-24", "summary": "Learned KV-cache eviction often faces a soft-to-hard mismatch: during training, differentiable gates typically attenuate token contributions, whereas inference saves memory only when KV entries are physically removed. We ask whether the attention substrate affects this soft-to-hard transition. Using GPT-2-scale Transformers trained on OpenWebText, we run a controlled $2\\times2\\times2$ comparison over attention type, learned gating, and positional encoding. Although sigmoid attention is worse as a dense language model, learned hard eviction changes the useful operating points: sigmoid-gated models delete KV entries with negligible PPL change relative to their own no-eviction references. Under a matched live-cache protocol on the same dense backbones, learned sigmoid gates obtain lower PPL than our H$_2$O and KeyDiff implementations, whereas softmax gates do not uniformly beat these post-hoc methods. The results suggest that attention normalization can substantially affect whether a training-time soft gate transfers cleanly to hard KV deletion.", "pdf_url": "https://arxiv.org/pdf/2608.23296v1"}, {"title": "Spotter: Efficient Urban Visual Localization via Geo-Referenced Facade Landmarks in GPS-Degraded Environments", "authors": ["Antoni Valls", "Jordi Sanchez-Riera"], "published": "2026-08-24", "summary": "Accurate visual localization on robotic and wearable platforms remains challenging in dense urban environments. Existing methodologies typically rely on GPS for absolute positioning, yet GPS signals frequently degrade in urban canyons due to multipath propagation. Consequently, standard solutions like visual odometry suffer from unmitigated drift over time, while map-matching techniques struggle to acquire the reliable GPS priors they need, on top of being too computationally heavy for real-time edge execution. To address these limitations, we propose Spotter, a robuts and real-time visual localization framework that uses building facades as a reliable source of global geo-reference, while retaining the capability to integrate GPS signals when available. In an offline stage, Spotter processes Google Street View panoramas by semantically segmenting facades and pairing multi-view stereo depth with cartographic data to build a compact metric database. At runtime, query images are matched via a cascaded retrieval and geometric verification pipeline to recover fine-grained global camera localization. We benchmark Spotter on a newly collected dataset of pedestrian sequences acquired with wearable smart glasses across several districts of Barcelona. Experimental results show that Spotter outperforms odometry-based baselines and achieves localization accuracy comparable to state-of-the-art map-based methods while operating at significantly higher frame rates.", "pdf_url": "https://arxiv.org/pdf/2608.23290v1"}, {"title": "Future Querying: Can LLMs Serve as Implicit Medical World Models?", "authors": ["Siri Willems", "James Butterworth", "Lore Goetschalckx", "Peter Vrancx", "Philippe Modard", "Elke Giets", "Ludovic Denoyer"], "published": "2026-08-24", "summary": "Traditional clinical prediction models rely on task-specific pipelines and curated, structured data, which scale poorly and underutilize unstructured text. To address this, we introduce future querying, a paradigm that probes whether large language models (LLMs) can function as implicit medical world models by evaluating their ability to answer time-indexed clinical queries about a patient's future. Our framework operates on unstructured clinical documentation using endpoint-agnostic training, enabling a single model to answer diverse clinical queries over patient trajectories without manual feature engineering or task-specific retraining. We show that small, locally fine-tuned open-weight models can match or approach larger proprietary systems, making the framework suitable for privacy-preserving, on-premise deployment. Evaluated on a new synthetic medical reports dataset and real ICU notes from the MIMIC-IV dataset, our results provide encouraging evidence that LLMs can capture aspects of clinical dynamics.", "pdf_url": "https://arxiv.org/pdf/2608.23248v1"}, {"title": "MLLM-Assisted Audio VOS: A 3rd Place Report for the MeViS-Audio Track, 8th LSVOS Challenge", "authors": ["Liangtao Shi", "Jinxia Xie", "Xiantao Hu", "Ting Liu"], "published": "2026-08-24", "summary": "In this technical report, we present a training-free framework for audio-guided video object segmentation, which integrates Multimodal Large Language Models (MLLMs) with SAM-based segmentation models. We decompose the task into several stages and identify suitable foundation models for each stage. Without introducing additional model training or task-specific fine-tuning, our approach leverages the strong multimodal reasoning capabilities of MLLMs to model text-visual correspondence and employs SAM-based models for accurate object mask generation. The proposed framework demonstrates the effectiveness of leveraging foundation models for audio-guided video segmentation and achieves competitive performance in the MeViS-Audio Track of the 8th LSVOS Challenge.", "pdf_url": "https://arxiv.org/pdf/2608.23234v1"}, {"title": "Think Only When Needed: Prompt-Authority Control for Selective Slow-Path Intervention in Vision-Language-Action Manipulation", "authors": ["Zhiruo Zhou", "Zelin Li", "Xiwen Chen", "Jiazhuo Li", "Chenwei Wang", "Huiming Chen", "Xiaojun Zhu"], "published": "2026-08-24", "summary": "Retrieval can efficiently and effectively augment a frozen vision--language--action (VLA) policy without retraining, yet retrieved text becomes a control intervention once it enters the executed prompt. In a matched audit, raw appended text reduces mean success from 92.47\\% to 3.00\\%, while meaningful and length-matched meaningless appends both fail on all 500 states. This result identifies \\emph{prompt-form collapse}: changing the instruction form, rather than adding useful semantics, can dominate execution. We introduce TOWN-VLA (Think Only When Needed), a prompt-authority interface that separates candidate generation from permission to alter the policy input. A fixed compatibility rule authorizes a canonical compact instruction; otherwise, the interface restores the original Base prompt exactly. Across 900 audited routes, every route follows this contract: 525 routes recover Base with matching hashes, and all 375 authorized prompts preserve the task signature. On a matched $4\\times7$ LIBERO-Plus evaluation with 10{,}030 episodes per method, success rises from 69.5\\% to 73.1\\% ($+362$ episodes; 95\\% CI 1.89--5.45 points), improving on six perturbation axes and all four suites. On a physical PiPER arm with a frozen \\pizerofive{} checkpoint, success rises from 52.7\\% to 78.7\\% over 150 trials per method ($p=3.16\\times10^{-6}$). Prompt authority is enforceable for a frozen controller; oracle-free admission calibration is the next deployment target.", "pdf_url": "https://arxiv.org/pdf/2608.23224v1"}, {"title": "Guided Riemannian Optimization (GuRO): Bridging Model Predictive Control and Decision Transformers", "authors": ["Hossein Abdi", "Satya Prakash Dash", "Mingfei Sun"], "published": "2026-08-24", "summary": "Decision-making in high-dimensional, nonlinear systems remains a central challenge in robotics. While model-based methods like Model Predictive Control (MPC) offer sample efficiency and interpretability, their performance degrades when the dynamics model is inaccurate or long-horizon predictions are required. Conversely, model-free reinforcement learning (RL) learns policies directly from interaction but suffers from high sample complexity and unstable optimization. Recent advances in sequence modeling have inspired transformer-based decision-making frameworks that can unify MPC and RL, but their training typically faces significant optimization challenges due to highly non-convex loss landscapes. In this work, we propose a novel framework that integrates MPC with RL in a sequence decision-making framework and leverages a curvature-aware optimization to efficiently tackle non-convex loss landscapes. MPC provides predictions of locally optimal trajectories that guide the decision transformer, removing the need for extensive offline pretraining. To address the slow and unstable convergence of traditional optimizers, we train the policy in a Riemannian parameter space using an efficient Riemannian (curvature-aware) method, leading to faster and more robust optimization. We evaluate our framework on high-dimensional quadruped control tasks and demonstrate consistent improvements over strong baselines, including TRPO, SAC, and Online Decision Transformer, achieving higher returns and faster convergence.", "pdf_url": "https://arxiv.org/pdf/2608.23204v1"}, {"title": "EchoWM: Open and Enterable Omnimodal World Models", "authors": ["Songchun Zhang", "Yaowei Li", "Junhao Zhuang", "Weiyang Jin", "Haoyu Wang", "Xin Lu", "Yilang Sun", "Shiyi Zhang", "Haoran Li", "Xiaoxiao Ma", "Yuming Li", "Yijun Liu", "Yaofeng Su", "Yanwen Ma", "Haoyu Wu", "Zihan Su", "Yue Ma", "Lvmin Zhang", "Haoyang Huang", "Zeyue Xue", "Anyi Rao", "Nan Duan"], "published": "2026-08-24", "summary": "We present EchoWM, an omnimodal world model for enterable generative media that responds to continuous navigation while jointly generating 720p video, environmental sound, music and speech. We organize interaction around camera intent: in first-person scenes, it specifies observer motion, while in third-person scenes, camera--character dynamics are learned from data without view-specific controllers. Discrete commands and continuous poses are mapped to a shared metric-scale relative 6-DoF trajectory, with dataset-level calibration preserving motion magnitude across heterogeneous data. To jointly learn audio-visual generation and trajectory control, we construct a complementary data engine and adopt progressive training followed by autoregressive post-training for long-horizon generation. Extensive evaluations show that \\model achieves strong trajectory following and high visual quality on public world-model benchmarks, supporting both first- and third-person interaction across varied subjects, and maintaining synchronized environmental sound and speech over long-horizon generation.", "pdf_url": "https://arxiv.org/pdf/2608.23189v1"}, {"title": "NetConfArena: An Executable Benchmark for LLM Agents in Closed-Loop Network Configuration", "authors": ["Chang Liu", "Xiaohui Xie", "Xinyi Chen", "Yong Cui"], "published": "2026-08-24", "summary": "Large language model (LLM) agents are increasingly attractive for automating network configuration, yet their reliability and failure patterns are poorly understood. An essential prerequisite is to assess such agents in a realistic but risk-free environment. Existing benchmarks, however, fall short: they often treat configuration as static command generation or rely on overly simplified settings. Such evaluations understate the core challenges of network configuration, where correctness requires reasoning about protocol complexity and topology dependence. We present NetConfArena, an executable benchmark for evaluating LLM agents in closed-loop network configuration. NetConfArena places agents in emulated multi-device networks, provides a standardized and compact action interface for task execution, and evaluates the resulting network behavior with hidden task-specific executable test cases. The benchmark relies on an LLM-assisted, emulation-grounded pipeline, which converts human-oriented network materials into reusable parameterized task templates. We evaluate representative LLM agents on 480 task instances instantiated from 96 protocol-focused task templates, yielding 3840 execution trajectories, and show that failures are not limited to command errors. The failures also reveal gaps in task-specification adherence and robust planning and execution. These findings suggest two future directions: using validated trajectories as supervision signals to improve foundation models, and designing harness mechanisms that make agent execution more reliable and accountable.", "pdf_url": "https://arxiv.org/pdf/2608.23179v1"}, {"title": "Spinning Quadrotor: Hover Thrust Augmentation with Passive Lifting Surfaces", "authors": ["Aniketh Parkala", "Harikumar Kandath"], "published": "2026-08-24", "summary": "Conventional multirotor aerial vehicles actively suppress yaw rotation during hover, expending power to maintain a fixed heading despite the fact that yaw regulation is not required for force balance or altitude control. This paper challenges that paradigm by proposing a spinning quadrotor architecture that intentionally operates at a sustained yaw rate, converting power traditionally spent on yaw regulation into useful aerodynamic effects. A dynamic model of the spinning quadrotor is developed, analysis for low Re range is conducted to choose an airfoil for lifting surfaces. Preliminary hardware tests show a 22% reduction in thrust required. These findings suggest that intentional yaw rotation, rather than being suppressed, can be exploited as a design mechanism for efficient and robust multirotor flight.", "pdf_url": "https://arxiv.org/pdf/2608.23163v1"}, {"title": "MIVIFI: Bridging Perspective and Fisheye Domains for Training Multi-View Fisheye Image Generation Models", "authors": ["Matthias Neuwirth-Trapp", "Begüm Altunbas", "Jiayi Wang", "Yan Xia", "Maarten Bieshaar", "Xinyu Huang", "Daniel Cremers"], "published": "2026-08-24", "summary": "Achieving 360° coverage is critical for the visual perception systems of autonomous vehicles. Fisheye cameras offer a cost-effective solution by enabling full surround coverage with as few as two sensors. However, existing multi-view fisheye datasets are limited, and synthesizing rare corner cases typically requires computationally expensive 3D simulations, hindering the training. While generative models have achieved significant success in standard perspective imagery, their application to wide-angle distortion remains unexplored. In this work, we formally introduce the novel problem of multi-view fisheye image generation conditioned on volumetric semantic representations and present two distinct methods. We first propose SyntheOcc-FE, which adapts the SyntheOcc architecture to fisheye data. While effective, this method is constrained by the scarcity of fisheye datasets, which limits its generalization. To overcome these limitations, we propose our second method, MIVIFI (multi-view fisheye), which leverages cross-domain learning with Equirectangular Projections. By bridging the gap between dataset domains using KITTI-360 fisheye images alongside nuScenes multi-view standard images, our approach enables high-fidelity manipulation of scene content. This framework enables the structural modification of semantic occupancy inputs to introduce or eliminate specific actors and facilitates the rendering of diverse meteorological conditions and illumination scenarios absent in the limited fisheye datasets. Quantitative and qualitative experiments demonstrate that our methods achieve robust photorealistic multi-view fisheye image generation and highlight the specific advantages of our cross-domain strategy for handling data scarcity.", "pdf_url": "https://arxiv.org/pdf/2608.23140v1"}, {"title": "Pointing-VLA: Typed Spatial Grounding Interfaces for Vision-Language-Action Manipulation", "authors": ["Xiwen Chen", "Zelin Li", "Zhiruo Zhou", "Huiming Chen", "Chenwei Wang", "Xiaojun Zhu"], "published": "2026-08-24", "summary": "Vision-language-action (VLA) models often expose spatial grounding through autoregressive text coordinates or opaque action tokens, creating brittle interfaces between multimodal reasoning and robot execution. We present Pointing-VLA, a typed hidden-state spatial readout built on Embodied-R1. Geometry-specific heads predict normalized points, object-functional grounding (OFG) heatmaps, and visual trajectories without serializing geometry as text. For the evaluated Bridge/WidowX and physical pick-place deployments, an explicit execution contract assigns PICK to source-conditioned OFG and PLACE to Pointing, providing direct stage-aligned spatial targets. Pointing-VLA achieves SOTA performance on Bridge/WidowX, averaging 72.9\\% across the evaluated four-task set without Bridge-specific finetuning under collision-enabled CuRobo execution. Pointing and OFG show complementary strengths across native and cross-dataset evaluations. The OFG/contact readout transfers to NORA-1.5, preserving or improving success while reducing recorded controller time by more than 20$\\times$; typed heads are also 6.68--6.90$\\times$ faster than Embodied-R1 text decoding on a shared external suite. When integrated as spatial guidance for a $π_{0.5}$ action policy, Pointing-VLA raises autonomous real-robot success from 52.7\\% to 80.7\\% across three visual contexts. These results establish typed spatial readouts as an efficient, inspectable interface between embodied reasoning and robot execution.", "pdf_url": "https://arxiv.org/pdf/2608.23138v1"}, {"title": "Shaping the Evolutionary Dynamics of Robot Morphology via Adaptive Control Learning", "authors": ["Junru Song", "Yang Yang", "Yaqing Xu", "Ying Wen", "Wei Peng", "Guozhen Li", "Wei'en Zhou", "Wen Yao"], "published": "2026-08-24", "summary": "Robot co-design via bi-level optimization couples within-lifetime controller learning for fitness evaluation with cross-generational morphological evolution. Prior work has established that well-adapted morphology facilitates faster control learning, a property termed morphological intelligence. Yet how control learning reciprocally shapes morphological evolution remains unexplored. This paper examines both directions for a holistic account of brain-body interplay. We first show that morphological contributions to control learning decouple into two orthogonal dimensions. We formalize the convergence speed as morphological intelligence and identify the performance ceiling as a complementary quantity termed true potential. A concise functional relation is then established to jointly characterize both quantities from individual learning curves, which, when aggregated at the population level, capture evolutionary profiles. Through extensive experiments on simulated voxel-based soft robots, we reveal that premature fitness evaluation systematically underestimates true potential and biases selection towards fast learners. This restricts design space exploration, compromising both optimization efficiency and morphological diversity. Notably, the widely recognized morphological Baldwin effect emerges as an artifact of this bias rather than a general evolutionary tendency. We therefore propose AdaControl, which monitors disproportionate selection for morphological intelligence during evolution and allocates minimally sufficient control learning for unbiased fitness evaluation. With AdaControl, a simple genetic algorithm rivals state-of-the-art generative-model-based co-design methods in discovering diverse high-performing designs while cutting computation by up to 80% versus exhaustive control.", "pdf_url": "https://arxiv.org/pdf/2608.23100v1"}, {"title": "From Generation to Simulation: How Far Are World Models from Being True Simulators?", "authors": ["Tong Wang", "Huan Deng", "Mucheng Yang", "Yang He", "Xiaohui Kuang", "Gang Zhao"], "published": "2026-08-24", "summary": "With the rapid progress of diffusion models and large-scale video generation, generative world models are increasingly expected to replace traditional simulators, including physics engines, game engines, and reinforcement-learning environments. Yet the remaining distance from generation to simulation lacks a systematic assessment. We present a capability-based study using an external yardstick: eight capabilities of a traditional simulator, namely asset construction, physics engine, interaction, controllability, stability, state feedback, diversity, and evaluation metrics. We trace three main technical routes--latent dynamics, video generation, and joint-embedding prediction--and map exactly 200 representative works published from 2018 to June 2026 onto these capabilities. Our analysis shows that world models have achieved functional substitution in interaction and controllability for specific scenarios, but remain short of traditional simulators in formal guarantees of physical laws, structured state feedback, and reproducible long-horizon evolution. State feedback is the most neglected cross-route shortcoming: only 6 of 163 implementation papers expose a runtime interface for querying entity states or physical parameters. We identify six research directions: formalized physics, a unified action interface, first-class state feedback, long-horizon stability, downstream-utility evaluation, and cross-route hybridization. Project page: https://github.com/AtongWang/world-model-simulators", "pdf_url": "https://arxiv.org/pdf/2608.23070v1"}, {"title": "Switched Turn-based Adaptive Source Seeking Strategy using Estimation and Information-driven Direction of Improvement", "authors": ["Shubhra Banerjee", "Satadal Ghosh"], "published": "2026-08-24", "summary": "Source seeking arises in applications such as gas leak localization, radiation monitoring, and environmental surveillance, where the origin of an unknown signal field must be estimated from spatial measurements. In practice, the source location is not directly observable and must be inferred from noisy scalar measurements collected during motion.In robotic source seeking, estimation and motion are closely linked: measurements improve the source estimate, while the chosen trajectory affects the quality of future measurements.Existing loop-based geometric strategies generate feasible motion but do not explicitly use estimation uncertainty to regulate direction updates.This paper presents a loop-based source-seeking framework that combines Extended Kalman Filter (EKF) estimation with Fisher Information Matrix (FIM)-based direction selection. The source estimate is updated during motion, and the heading is changed at loop boundaries using both estimation uncertainty and predicted information gain. A measurement-based stopping condition is used to detect convergence without requiring prior knowledge of the source location.Simulation results under stationary and moving source scenarios demonstrate improved tracking performance and reduced estimation error compared to purely information-driven or estimate-driven strategies.", "pdf_url": "https://arxiv.org/pdf/2608.23068v1"}, {"title": "LLM-based Agents for Forecasting and Prediction: Methods, Training, Evaluation, and Applications", "authors": ["Xiaogang Xu", "Jiaqi Tang", "Jianmin Chen", "Yingying Yan", "Zhenchao Tang", "Xiangxin Zhou", "Xiaobin Hu", "Wei Wei", "Jinfeng Wu", "Qifeng Chen", "Lu Zhou", "Jiafei Wu", "Zhe Liu", "Jianwei Yin", "Weimin Zheng"], "published": "2026-08-24", "summary": "Large language models (LLMs) now support forecasting systems that combine language-based reasoning with temporal data, evidence retrieval, external tools, and iterative prediction. We investigate LLM-based forecasting agents, meaning systems in which a language model contributes to a scored prediction about a future or currently unobserved target. We organize architectures into three groups. Standalone LLM workflows operate on encoded time series or event context. Tool- and retrieval-augmented agents incorporate external evidence. Hybrid systems pair LLMs with statistical or foundation models. We then review training methods and evaluation protocols. We examine negative as well as positive evidence, including sensitivity to small input perturbations, ablations in which the LLM component does not improve accuracy, and benchmark gains that may reflect contamination instead of temporal reasoning. We cover applications in finance, weather, health, energy, and operations, and we summarize the benchmarks and datasets used for evaluation. The evidence indicates that measurement is a central limitation. Future work requires calibration under distribution shift, contamination-resistant live evaluation, explicit reporting of cost and accuracy together, and methods for handling feedback between deployed forecasts and the outcomes being forecast.", "pdf_url": "https://arxiv.org/pdf/2608.23058v1"}, {"title": "Macro-Action Topological Navigation under Noisy Localization using Reinforcement Learning", "authors": ["Simon Hakenes", "Tobias Glasmachers"], "published": "2026-08-24", "summary": "Navigating large, photorealistic 3D apartments from raw pixels is widely considered infeasible for plain reinforcement learning. We build an agent that does it anyway, estimating its own pose from the camera alone. The agent has to reach several target objects in sequence, and their positions change between episodes, so it must explore to find them. It builds on our earlier object-centric topological controller, which still read the agent's true pose and its object detections from the simulator. Here we replace that true pose with an onboard, object-centric estimate. For each object we keep a bank of ORB features that, when the object is seen again, yield a rough pose measurement, which a minimal Extended Kalman Filter (EKF) fuses with a motion model. As on a real robot, the executed motions are noisy. The estimate drifts, but the agent and the nearby objects drift together, so a locally consistent pose is enough to follow each short edge and then home in visually on the target, which lets us replace full SLAM with a much smaller model, closer to how biological navigation appears to work. In the photorealistic Habitat simulator, the agent reaches its target objects from vision alone, with a pose that only needs to be locally consistent.", "pdf_url": "https://arxiv.org/pdf/2608.23055v1"}, {"title": "RoboRacer Arena: Scaling High-Fidelity Autonomous Racing in Isaac Sim", "authors": ["Mihaela-Larisa Clement", "Agnes Poks", "Ezio Bartocci"], "published": "2026-08-24", "summary": "RoboRacer offers a standardized platform for research using 1:10-scale autonomous vehicles, but the variety of available tracks hinders the process of acquiring policies. Although existing occupancy-grid simulators allow for the quick addition of new maps, they fail to include physical contact, while 3D simulators require each circuit to be implemented as a separate asset, thus limiting their scalability. In order to overcome this issue, we have developed RoboRacer Arena, a system that creates 3D racing environments directly from occupancy maps. Our method starts by using a flood fill algorithm to extract the drivable corridors and to identify the track boundaries, which are then used to establish the barriers. A distance field is calculated to define the collision boundaries. The track surfaces, collision properties, and materials are assembled into a USD stage, which allows for the automated and reproducible generation of the environment in Isaac Sim. The input maps can be obtained from SLAM sessions, from rescaled Formula 1 circuits, or from natural-language descriptions. When the input is based on natural language, we use Gemma 4 31B to generate a track specification without specifying any coordinates or geometry. To guarantee consistency and reproducibility, we apply geometric screening, procedural generation, and raster-level validation. The simulation environments are initialized in a time range of 1.18 to 2.48 seconds, with the initialization time increasing linearly as the raster size increases. In 30 matched trials involving 10 tracks and 3 seeds, 21 maps were generated and all passed validation. RoboRacer Arena currently contains 130 tracks and supports the generation of tracks from natural language. In benchmark tests, the system attains 8,707 vehicle-steps per second when using 256 parallel rigid-body vehicles, excluding the time taken for rendering and policy execution.", "pdf_url": "https://arxiv.org/pdf/2608.23040v1"}, {"title": "Free-Energy-Gated Plasticity for Real-Time Online Motor Learning in Physical Human--Robot Interaction", "authors": ["Hiroki Sawada", "Jun Tani"], "published": "2026-08-24", "summary": "Fully online embodied learning requires synaptic adaptation to acquire new behaviors while preserving previously learned dynamics during ongoing interaction. We extend the Predictive-Coding-inspired Variational Recurrent Neural Network (PV-RNN) to continuously adapt its synaptic weights and propose Free-Energy-Gated Plasticity (FEGP), which regulates the effective learning rate according to variational free energy. In real-time physical human--robot interaction, a randomly initialized network acquired three cyclic motor patterns without offline pretraining, replay, or task-boundary signals, with all three patterns emerging in autonomous rollouts. Controlled experiments over ten randomized teaching streams and five network initializations per stream showed that FEGP substantially improved repertoire coverage and retention of previously acquired patterns after they left the recent observation window. Neither a constant learning rate matched to the gate's time-averaged effective rate nor replay of the same gain values with disrupted temporal organization reproduced these improvements. These results indicate that the temporal allocation of plasticity relative to model--environment mismatch, rather than simply its average magnitude or distribution, is critical for maintaining previously acquired behaviors during continued online learning.", "pdf_url": "https://arxiv.org/pdf/2608.23000v1"}, {"title": "InstructMove: A Text-Indispensable Benchmark for Instruction-Following Manipulation", "authors": ["Mengao Zhao", "Ziang Li", "Chaodong Huang", "Mengchen Ma", "Haoyi Jiang", "Yiwei Jin", "Xinjie Wang", "Yun Du", "Xuewu Lin", "Taojun Ding", "Hongyu Xie", "Jackson Jiang", "Chunlei Yu", "Kaihua Zhang", "Lichao Huang", "Liu Liu", "Tianwei Lin", "Zhizhong Su"], "published": "2026-08-24", "summary": "Vision-language-action (VLA) models have made general-purpose robot manipulation increasingly plausible by conditioning robot actions on natural-language instructions. A key test of such generality is whether policies actually follow language instructions. Yet many manipulation benchmarks leave this ability underdetermined: the intended object or destination is often visually salient or uniquely feasible, allowing policies to succeed without grounding the instruction. We argue that instruction-following evaluation should be text-indispensable: multiple actions should be visually and physically plausible, while only one should be consistent with the language instruction. We introduce InstructMove, a text-indispensable benchmark for instruction-following manipulation. InstructMove instantiates this principle in pick-and-place scenes with semantic distractors, decomposing instruction following into category identification, attribute discrimination, spatial reasoning, and compositional pick-and-place. InstructMove supports a train-eval protocol with InstructMove training data and held-out evaluation tasks, with additional diagnostics for language dependence. Experiments with representative VLA policies show that InstructMove provides a controlled testbed for diagnosing visual shortcuts and that InstructMove simulation data can improve real-world instruction-following manipulation performance. Code: https://github.com/HorizonRobotics/RoboOrchardSim", "pdf_url": "https://arxiv.org/pdf/2608.22990v1"}, {"title": "CSymPlan: Certified Symbolic Planning and Control for High-DOF Manipulators", "authors": ["Aditya Narendra", "Ashok Kumar Saini", "Mahathi Anand", "Mahmoud Khaled", "Fares J. Abu-Dakka", "Abdalla Swikir"], "published": "2026-08-24", "summary": "Robot manipulators are commonly engineered around a decoupled motion-generation stack: a planner computes a collision-free path and a lower-level controller tracks the resulting reference. This separation is computationally convenient, but it can produce references that are difficult to execute under actuator limits, tracking error, model mismatch, and small obstacle clearances. We present CSymPlan, a certified symbolic planning and control framework for high-DOF manipulators with two complementary implementations: an offline implementation that precomputes certified reach-avoid feedback policies for known workspaces; and an online implementation that synthesizes or updates symbolic policies at runtime from changing task and perception information using parallelization. The offline implementation reduces the manipulator dynamics to a sampled perturbed double-integrator model in operational space through feedback linearization, treats torque-realization errors, modeling inaccuracies, and measurement uncertainty as bounded disturbances, and refines the synthesized symbolic policy to the Franka FR3 through a quantization--lookup--torque realization pipeline. The online implementation uses the same abstraction and refinement interface, but replaces the precomputed policy table with a runtime pFaces request--synthesis--execution loop. In randomized simulated benchmarks and perception-driven Franka FR3 experiments, both implementations complete reach-avoid tasks with zero safety violations; whenever no certified action exists, the robot holds, replans, or stops safely instead of executing an uncertified command.", "pdf_url": "https://arxiv.org/pdf/2608.22983v1"}, {"title": "Privileged Critic Training Enables Sensor-Free Thruster Fault Adaptation in End-to-End RL", "authors": ["Ricard Marsal I Castan", "Miguel A. Olivares-Méndez"], "published": "2026-08-24", "summary": "Fault-tolerant navigation for thruster-actuated robots requires online adaptation to failures that are neither binary nor fully observable: thrusters may degrade continuously, fail dead, or jam stuck-open. Classical fault detection pipelines require dedicated sensors unavailable at deployment; oracle controllers that observe the true failure state are equally impractical. We show that privileged critic training is sufficient for sensor-free fault adaptation: giving the PPO value function access to the true degradation state dgt during training, while the actor receives only standard task observations, shapes a policy that compensates for failures at deployment without any dedicated fault sensing. We propose RAFT (Recurrent Asymmetric Fault Tolerant), a policy with recurrent memory trained with a privileged asymmetric critic. Evaluated on a floating-platform robot (8 thrusters, 1 reaction wheel) under up to four simultaneous thruster failures, RAFT achieves 70.2% success at four concurrent failures, closing 84% of the gap from a failure-naive baseline (4.8%) to an oracle policy that sees the full degradation state at deployment (82.4%). All code, checkpoints, and data are open-source.", "pdf_url": "https://arxiv.org/pdf/2608.22976v1"}], "repos": [{"repo": "NVIDIA/skills", "stars": 3095, "language": "Python", "description": "Agent Skills for NVIDIA products — install into Claude Code, Codex, and other coding agents to run Physical AI, robotics, simulation, CUDA, and RAG workflows end to end.", "url": "https://github.com/NVIDIA/skills", "date": "2026-08-25", "topic": "physical-ai", "score": 1238.1}, {"repo": "awslabs/awsome-distributed-ai", "stars": 470, "language": "Shell", "description": "Collection of best practices, reference architectures, model training examples and utilities to train large models on AWS. ", "url": "https://github.com/awslabs/awsome-distributed-ai", "date": "2026-08-25", "topic": "physical-ai", "score": 188.1}, {"repo": "commaai/openpilot", "stars": 63489, "language": "Python", "description": "openpilot is an operating system for robotics. Currently, it upgrades the driver assistance system on 300+ supported cars.", "url": "https://github.com/commaai/openpilot", "date": "2026-08-25", "topic": "robotics", "score": 25395.7}, {"repo": "ArduPilot/ardupilot", "stars": 15737, "language": "C++", "description": "ArduPlane, ArduCopter, ArduRover, ArduSub source", "url": "https://github.com/ArduPilot/ardupilot", "date": "2026-08-25", "topic": "robotics", "score": 6294.9}, {"repo": "google-deepmind/mujoco", "stars": 14658, "language": "C++", "description": "Multi-Joint dynamics with Contact. A
