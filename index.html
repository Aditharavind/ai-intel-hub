ist-uses-human-demonstration-data-robot-learning/", "summary": "<p>Research around the Universal Manipulation Interface is enabling Generalist, Walden Robotics, and others to turn data into robot behaviors.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/how-generalist-uses-human-demonstration-data-robot-learning/\">How Generalist uses human demonstration data for robot learning<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Surgeons use da Vinci surgical robot to perform common cardiac surgery", "source": "Robotics Business Review", "date": "2026-08-17", "url": "https://www.therobotreport.com/surgeons-use-da-vinci-surgical-robot-perform-common-cardiac-surgery/", "summary": "<p>At the El Camino Health Heart and Vascular Institute, surgeons are now performing cardiac procedures with Intuitive's da Vinci robot.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/surgeons-use-da-vinci-surgical-robot-perform-common-cardiac-surgery/\">Surgeons use da Vinci surgical robot to perform common cardiac surgery<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Five years of operation shape Diligent Robotics rollout of Moxi 2.0", "source": "Robotics Business Review", "date": "2026-08-17", "url": "https://www.therobotreport.com/five-years-operation-shape-diligent-robotics-rollout-moxi-2-0/", "summary": "<p>Diligent is now rolling out Moxi 2.0 to health systems including Endeavor Health Edward Hospital and Children’s Hospital Los Angeles.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/five-years-operation-shape-diligent-robotics-rollout-moxi-2-0/\">Five years of operation shape Diligent Robotics rollout of Moxi 2.0<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "How robotics is revolutionizing stroke rehabilitation", "source": "Robotics Business Review", "date": "2026-08-16", "url": "https://www.therobotreport.com/how-robotics-is-revolutionizing-stroke-rehabilitation/", "summary": "<p>Eyal Samuel Shachar, the CEO of Bioxtreme, says the growing synergy of robotics, AI, and human-centered care will improve patient outcomes.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/how-robotics-is-revolutionizing-stroke-rehabilitation/\">How robotics is revolutionizing stroke rehabilitation<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Why robots that can’t communicate naturally won’t be adopted", "source": "Robotics Business Review", "date": "2026-08-15", "url": "https://www.therobotreport.com/why-robots-that-cant-communicate-naturally-wont-be-adopted-says-treble/", "summary": "<p>Gunnar Pétur Hauksson, the co-founder and COO at Treble Technologies, says robotics developers can't overlook the importance of hearing.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/why-robots-that-cant-communicate-naturally-wont-be-adopted-says-treble/\">Why robots that can’t communicate naturally won’t be adopted<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Robots on Wall Street: Non-traditional paths to public markets for robotics companies", "source": "Robotics Business Review", "date": "2026-08-14", "url": "https://www.therobotreport.com/robots-on-wall-street-non-traditional-paths-public-markets-robotics-companies/", "summary": "<p>Agility’s SPAC deal shows there is no one route to a robotics public listing, with SPAC mergers, reverse mergers, and traditional IPOs offering different advantages.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/robots-on-wall-street-non-traditional-paths-public-markets-robotics-companies/\">Robots on Wall Street: Non-traditional paths to public markets for robotics companies<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Video Friday: Lift Happens", "source": "IEEE Spectrum Robotics", "date": "2026-08-14", "url": "https://spectrum.ieee.org/video-friday-darpa-heavy-lift-challenge", "summary": "<img src=\"https://spectrum.ieee.org/media-library/drone-crash-on-grassland-engulfed-in-flames-with-thick-black-smoke-rising.png?id=67615846&amp;width=1200&amp;height=800&amp;coordinates=156%2C0%2C156%2C0\" /><br /><br /><p><span>Video Friday is your weekly selection of awesome robotics videos, collected by your friends at <\/span><em>IEEE Spectrum<\/em><span> robotics. We also post a weekly calendar of upcoming robotics events for the next few months. Please <\/span><a href=\"mailto:automaton@ieee.org?subject=Robotics%20event%20suggestion%20for%20Video%20Friday\">send us your events<\/a><span> for inclusion.<\/span><\/p><h5><a href=\"https://actuate.foxglove.dev/\">Actuate 2026<\/a>: 18–19 August 2026, SAN FRANCISCO<\/h5><h5><a href=\"https://2026.ieee-iros.org/\">IROS 2026<\/a>: 27 September–1 October 2026, PITTSBURGH<\/h5><h5><a href=\"https://humanoidssummit.com/\">Humanoids Summit Seoul<\/a>: 22–23 September 2026, SEOUL<\/h5><p>Enjoy today’s videos!<\/p><div class=\"horizontal-rule\"><\/div><div><span style=\"display: none;\"> <\/span><\/div><p class=\"rm-anchors\" id=\"2x2w3mweriu\">Speaking from experience, I can tell you that the best part of any DARPA challenge is when things go horribly wrong. And after you enjoy all the crashes (followed by all of the battery fires), get caught up with the <a href=\"https://spectrum.ieee.org/video-friday-heavy-lift-drone\" target=\"_blank\">DARPA Lift Challenge<\/a> with video recaps of the final few days.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p class=\"shortcode-media shortcode-media-youtube\"> <span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p class=\"shortcode-media shortcode-media-youtube\"> <span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p class=\"shortcode-media shortcode-media-youtube\"> <span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p class=\"shortcode-media shortcode-media-youtube\"> <span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.darpa.mil/news/2026/lift-challenge-awards\">DARPA Lift Challenge<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"gx-oyg38vjs\"><a href=\"https://spectrum.ieee.org/the-economics-of-drone-delivery\" target=\"_blank\">Drone delivery<\/a>: coming soon to a moving vehicle (or perhaps even through an open window) near you.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://uav.hkust.edu.hk/\">HKUST Aerial Robotics Group<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"shsjoyknax0\">This tiny little robot called STEMbot (as in stem, not STEM) can climb up and around plant stems to check for pests. It’s not very fast, but it sure is adorable.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://um-arm-lab.github.io/stembot-site/\">STEMbot<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"e47yaza_yuu\"><em>Monumental’s robots delivered the brickwork for a semi-detached home, laying around 20,000 bricks in a new community.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.monumental.co/\">Monumental<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"mm5itwlmsba\">Meet the world’s most “truss’t-worthy” robot.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.modlabupenn.org/category/vtt/\">Modlab University of Pennsylvania<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"f2r9grjjses\">Stanford BDML and Honeybee Robotics propose a payload to test gecko-inspired adhesives in spaaace!<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://rmpc.nasatechleap.org/\">NASA<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"q-yhtvmvxgk\"><em>How can a legged robot organize its own walking while maintaining a desired direction? In this work, we present a Differential Adaptive Steering (DAST) mechanism for directional adaptation in legged robots under decentralized adaptive control.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://brain.vistec.ac.th/\">BRAIN VISTEC<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"bugnlio-rqy\">I do not care even a little bit if a robot fails (safely, of course), as long as it recovers from that failure.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://sanctuary.ai/\">Sanctuary AI<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"6_x5rirnn8o\">Even for a robot that doesn’t drink champagne, those are some pretty light pours.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://kawasakirobotics.com/\">Kawasaki Robotics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"yqlkm6ylxkq\">If we as a society would just accept that the appropriate place to store clothing is in a pile on the floor, robots would have a much easier time of it.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.limxdynamics.com/en\">LimX Dynamics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"ixwjcz6xelo\">To be fair, this is also the speed at which I fold shirts.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.sharpa.com/\">Sharpa<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"5gd2b0cmfyu\"><em>Our DR02 humanoid robot takes on the stairs with stable, controlled movement—steady steps, steady progress.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.deeprobotics.cn/en\">DEEP Robotics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"en7jfhgmqci\">Two words: structural minifridge. Or is it mini fridge...? Whatever, THREE words.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://global.agilex.ai/\">AgileX<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div>"}, {"title": "Neros Technologies raises $250M to deploy its defense drones by the end of 2026", "source": "Robotics Business Review", "date": "2026-08-14", "url": "https://www.therobotreport.com/neros-technologies-raises-250m-to-deploy-its-defense-drones-by-the-end-of-2026/", "summary": "<p>Neros is developing its Archer AI and Bandit platform with the hardware and compute required for multi-asset control.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/neros-technologies-raises-250m-to-deploy-its-defense-drones-by-the-end-of-2026/\">Neros Technologies raises $250M to deploy its defense drones by the end of 2026<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "How Protolabs turns CAD files into parts in under 24 hours", "source": "The Robot Report", "date": "2026-08-14", "url": "https://www.therobotreport.com/how-protolabs-turns-cad-files-into-parts-under-24-hours/", "summary": "<p>Protolabs CTO Marc Kermisch explains how AI, simulation, and design for manufacturing turn CAD files into production parts faster.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/how-protolabs-turns-cad-files-into-parts-under-24-hours/\">How Protolabs turns CAD files into parts in under 24 hours<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "ARM Institute calls for defense manufacturing technology projects", "source": "Robotics Business Review", "date": "2026-08-13", "url": "https://www.therobotreport.com/arm-institute-calls-for-defense-manufacturing-technology-project/", "summary": "<p>The ARM Institute and the U.S. Department of War are seeking technology project submissions to help rapid U.S. production.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/arm-institute-calls-for-defense-manufacturing-technology-project/\">ARM Institute calls for defense manufacturing technology projects<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Experts to discuss the state of humanoid robots at RoboBusiness", "source": "Robotics Business Review", "date": "2026-08-13", "url": "https://www.therobotreport.com/experts-discuss-state-humanoid-robots-robobusiness-2026/", "summary": "<p>The RoboBusiness panel will include insights on humanoid robots from Agility, Apptronik, Persona AI, and PSYONIC experts.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/experts-discuss-state-humanoid-robots-robobusiness-2026/\">Experts to discuss the state of humanoid robots at RoboBusiness<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}], "embeddedNews": [{"title": "This Mac Is Open Source Hardware", "source": "Hackaday", "date": "2026-09-12", "url": "https://hackaday.com/2026/09/12/this-mac-is-open-source-hardware/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"450\" src=\"https://hackaday.com/wp-content/uploads/2026/09/oshintosh-featured.jpg?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>Apple hardware has always been proprietary, sometimes to an extreme. But that&#8217;s not to say that it&#8217;s impossible to make something that does the same job, which is what [DosFox1] <a class=\"read-more\" href=\"https://hackaday.com/2026/09/12/this-mac-is-open-source-hardware/\">&#8230;read more<\/a>"}, {"title": "Supercon is Nigh!", "source": "Hackaday", "date": "2026-09-12", "url": "https://hackaday.com/2026/09/12/supercon-is-nigh/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"450\" src=\"https://hackaday.com/wp-content/uploads/2026/07/supercon_10_CFP.png?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>The 2026 Hackaday Superconference is just around the corner in November. It’s hard to believe that we’ve been having an annual gathering for so long, but this is number ten. <a class=\"read-more\" href=\"https://hackaday.com/2026/09/12/supercon-is-nigh/\">&#8230;read more<\/a>"}, {"title": "The Heavy Disco-Ball Satellite Designed to Do… Nothing", "source": "Hackaday", "date": "2026-09-12", "url": "https://hackaday.com/2026/09/12/the-heavy-disco-ball-satellite-designed-to-do-nothing/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"432\" src=\"https://hackaday.com/wp-content/uploads/2026/09/lageos-artwork-banner.png?w=768\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"768\" /><\/div>Launched in 1976, LAGEOS-1 (LAser GEOdynamic Satellite) is unusual in that it contains no instrumentation, no electronics, no power supply, and no means of propulsion. It&#8217;s spherical, weighs just under <a class=\"read-more\" href=\"https://hackaday.com/2026/09/12/the-heavy-disco-ball-satellite-designed-to-do-nothing/\">&#8230;read more<\/a>"}, {"title": "Looking at a TRS-80 12 MB External Hard Drive from 1983", "source": "Hackaday", "date": "2026-09-12", "url": "https://hackaday.com/2026/09/12/looking-at-a-trs-80-12-mb-external-hard-drive-from-1983/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"466\" src=\"https://hackaday.com/wp-content/uploads/2026/09/trs-80_hdd_twelve_meg_disk_system_inside_lgr_youtube.jpg?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>Although hard disks weren&#8217;t a common feature yet in many home computers in the 1980s, they were becoming increasingly more affordable. For relative meanings of the word &#8216;affordable&#8217;, naturally. This <a class=\"read-more\" href=\"https://hackaday.com/2026/09/12/looking-at-a-trs-80-12-mb-external-hard-drive-from-1983/\">&#8230;read more<\/a>"}, {"title": "How To Fold Curved Lines in Metal Without Fancy Tools", "source": "Hackaday", "date": "2026-09-12", "url": "https://hackaday.com/2026/09/11/how-to-fold-curved-lines-in-metal-without-fancy-tools/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"450\" src=\"https://hackaday.com/wp-content/uploads/2026/09/Belly-Tank-Lakester-_-Cosmetic-Exhaust-Splitter-Fabricated-_-Ep-101-8-36-screenshot-banner.png?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>Folding a sheet of metal in a straight line is one thing, but how does one fold multiple curved lines into a sheet of aluminum without fancy machines? [John] demonstrates <a class=\"read-more\" href=\"https://hackaday.com/2026/09/11/how-to-fold-curved-lines-in-metal-without-fancy-tools/\">&#8230;read more<\/a>"}, {"title": "NeoEyes NE302 – A tiny USB-C-powered WiFi 6 Edge AI Vision camera based on STM32N6 MCU", "source": "CNX Software", "date": "2026-09-12", "url": "https://www.cnx-software.com/2026/09/12/neoeyes-ne302-a-tiny-usb-c-powered-wifi-6-edge-ai-vision-camera-based-on-stm32n6-mcu/", "summary": "<div><img alt=\"NeoEyes NE302 AI camera\" class=\"attachment-medium size-medium wp-post-image\" height=\"549\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/09/NeoEyes-NE302-AI-camera-720x549.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>CamThink NeoEyes NE302 is a tiny WiFi 6 Edge AI camera based on an STM32N6 Arm Cortex-M55 MCU with Neural-ART NPU which the company says is &#8220;especially suitable for developers and makers&#8221;. I initially thought about it as a smaller version of the CamThink NeoEyes NE301 based on the same STM32N6 MCU and 4MP OS04C10 camera sensor. But it&#8217;s quite a different device. First, it doesn&#8217;t have a battery, and the USB-C is only used for power. Memory and storage capacities have been reduced to 32 MB PSRAM and 64 MP SPI flash, and a range of built-in and optional features have been removed, including 4G LTE module (global or US), audio wafers, PIR motion connector, and a 16-pin GPIO header, as well as support for PoE power. CamThink NeoEyes NE302 specifications: Vision MCU STMicro STM32N6 MCU Core – Arm 32-bit Cortex-M55 CPU @ up to 800MHz with Arm Helium [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/09/12/neoeyes-ne302-a-tiny-usb-c-powered-wifi-6-edge-ai-vision-camera-based-on-stm32n6-mcu/\">NeoEyes NE302 &#8211; A tiny USB-C-powered WiFi 6 Edge AI Vision camera based on STM32N6 MCU<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Happy National Video Games Day 2026", "source": "Adafruit", "date": "2026-09-12", "url": "https://blog.adafruit.com/2026/09/12/happy-national-video-games-day-2026/", "summary": "image of Magnavox Odyssey via Wikipedia &#160; September 12th is National Video Games Day!!  Released 54 years ago in 1972 the Magnavox Odyssey was the first commercial home video game console. And while there seem to bet a few different days claiming to be &#8220;video game day&#8221; we celebrate today for Magnavox. We remain agnostic [&#8230;]"}, {"title": "Trying to Fix a Suspiciously Cheap Enterprise-Grade Network Switch", "source": "Hackaday", "date": "2026-09-11", "url": "https://hackaday.com/2026/09/11/trying-to-fix-a-suspiciously-cheap-enterprise-grade-network-switch/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"415\" src=\"https://hackaday.com/wp-content/uploads/2026/09/juniper_switch_pcb_rip_this_does_not_compute_youtube.jpg?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>When you see a listing for an Ethernet switch whose specification list is in effect &#8216;yes&#8217;, with a four-digit price tag when new, and with the seller asking for less <a class=\"read-more\" href=\"https://hackaday.com/2026/09/11/trying-to-fix-a-suspiciously-cheap-enterprise-grade-network-switch/\">&#8230;read more<\/a>"}, {"title": "Making a Neo Nuvistor Project in 2026", "source": "Hackaday", "date": "2026-09-11", "url": "https://hackaday.com/2026/09/11/making-a-neo-nuvistor-project-in-2026/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"462\" src=\"https://hackaday.com/wp-content/uploads/2026/09/nuvistor-based_555_board_tubetimeus_youtube.jpg?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>For a little while vacuum tubes and semiconductors were fighting a heated battle for dominance, with bipolar junction transistors and 1959&#8217;s RCA Nuvistor both allowing you to build a compact <a class=\"read-more\" href=\"https://hackaday.com/2026/09/11/making-a-neo-nuvistor-project-in-2026/\">&#8230;read more<\/a>"}, {"title": "Renesas RZ/G3L & RZ/G3SE – Ultra-low-power Cortex-A55 MPUs for industrial HMI and IoT applications", "source": "CNX Software", "date": "2026-09-11", "url": "https://www.cnx-software.com/2026/09/11/renesas-rz-g3l-rz-g3se-ultra-low-power-cortex-a55-mpus-for-industrial-hmi-and-iot-applications/", "summary": "<div><img alt=\"Renesas 64 bit RZ G3L and RZ G3SE ultra low power MPUs\" class=\"attachment-medium size-medium wp-post-image\" height=\"480\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/09/Renesas-64-bit-RZ-G3L-and-RZ-G3SE-ultra-low-power-MPUs-720x480.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Renesas has expanded its RZ/G Series with the RZ/G3L and RZ/G3SE, two new 64-bit MPUs for HMI and IoT edge systems. Both devices integrate up to four Arm Cortex-A55 application cores clocked at up to 1.2 GHz and a 200 MHz Arm Cortex-M33 real-time coprocessor. The two chips are pin-to-pin compatible but target different applications. The RZ/G3L integrates an Arm Mali-G31 3D GPU and H.264 video codec for HMI applications like retail terminals and medical devices. The RZ/G3SE removes the GPU and video codec and is designed for IoT devices with basic display requirements, including EV chargers and industrial gateway devices. Both can reduce standby power consumption to around 1 mW and resume operation quickly from deep standby, which is useful for devices that need to remain connected while consuming very little power. Renesas RZ/G3L and RZ/G3SE specifications: MPU core  CPU Quad-core or Dual-core Arm Cortex-A55 @ up to 1.2 [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/09/11/renesas-rz-g3l-rz-g3se-ultra-low-power-cortex-a55-mpus-for-industrial-hmi-and-iot-applications/\">Renesas RZ/G3L &#038; RZ/G3SE &#8211; Ultra-low-power Cortex-A55 MPUs for industrial HMI and IoT applications<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Amlogic A123X and C305X2 Arm Cortex-A320 SoCs target industrial and low-power AIoT applications", "source": "CNX Software", "date": "2026-09-11", "url": "https://www.cnx-software.com/2026/09/11/amlogic-a123x-and-c305x2-arm-cortex-a320-socs-target-industrial-and-low-power-aiot-applications/", "summary": "<div><img alt=\"Amlogic A123X C305X2 Cortex A320 SoCs\" class=\"attachment-medium size-medium wp-post-image\" height=\"360\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/09/Amlogic-A123X-C305X2-Cortex-A320-SoCs-720x360.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Amlogic has unveiled the A123X quad-core and C305X2 dual-core Arm Cortex-A320 SoCs for industrial and battery-powered Edge AI and IoT applications such as robots, dashcams, IP cameras, video conferencing equipment, and so on. The Arm Cortex-A320 low-power Armv9 CPU core was introduced in February 2025, and Amlogic is the first silicon vendor to announce Cortex-A320 SoCs. Details are sparse, with no full specifications or block diagrams and limited software information, but let&#8217;s see what we know so far. Amlogic A123X Amlogic A123X specifications: CPU &#8211; Quad-core Arm Cortex-A320 processor (Armv9.2-A, SVE2) GPU &#8211; None or not disclosed VPU H.264/H.265 encoding at 4K @ 60fps H.264/H.265 decoding at 4K @ 30fps AI 4 TOPS ADLA2 NPU for object detection and tracking CNN models 8 TOPS ADLA3 NPU supporting hardware-accelerated Transformer operations for ViT, LLM, etc. Neural network-based hardware SED engine for low-power audio event identification ISP &#8211; Low-light HDR ISP Supports [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/09/11/amlogic-a123x-and-c305x2-arm-cortex-a320-socs-target-industrial-and-low-power-aiot-applications/\">Amlogic A123X and C305X2 Arm Cortex-A320 SoCs target industrial and low-power AIoT applications<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Processors and Chiplet-Based FPGAs for Mission-Critical Systems, Scalable Physical AI Solutions: Embedded Week Insights", "source": "Embedded.com", "date": "2026-09-11", "url": "https://www.embedded.com/processors-and-chiplet-based-fpgas-for-mission-critical-systems-scalable-physical-ai-solutions-embedded-week-insights/", "summary": "<p>Here's a roundup of this week's must-read articles. We'll look into the latest developments on processors for mission-critical systems, chiplet-based FPGAs for space applications, scalable physical AI solutions, and more. Also, check News Archives - Embedded and Technical Articles Archives - Embedded for the complete list of news and articles from our website. NEWS Neura Robotics and Seco Partner [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/processors-and-chiplet-based-fpgas-for-mission-critical-systems-scalable-physical-ai-solutions-embedded-week-insights/\">Processors and Chiplet-Based FPGAs for Mission-Critical Systems, Scalable Physical AI Solutions: Embedded Week Insights<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "Renesas Launches 64-Bit MPUs for HMI and IoT Edge", "source": "Embedded.com", "date": "2026-09-11", "url": "https://www.embedded.com/renesas-launches-64-bit-mpus-for-hmi-and-iot-edge/", "summary": "<p>Renesas Electronics Corp. has expanded its RZ/G Series with two new 64-bit general-purpose microprocessors (MPUs) for human machine interface (HMI) and IoT edge systems. The pin-compatible RZ/G3L and RZ/G3SE MPUs target a range of industrial and consumer HMI and IoT gateway systems as well as home gateways that need high processing performance and high-speed network connectivity. The RZ/G3L integrates a graphics processing unit (GPU) for 3D graphics [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/renesas-launches-64-bit-mpus-for-hmi-and-iot-edge/\">Renesas Launches 64-Bit MPUs for HMI and IoT Edge<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "TechWorks calls for economic growth through UK expertise", "source": "Electronics Weekly", "date": "2026-09-11", "url": "https://www.electronicsweekly.com/news/business/techworks-calls-for-economic-growth-through-uk-expertise-2026-09/", "summary": "<p>TechWorks celebrated its 30th anniversary with the first TechWorks Semiconductors to Systems Summit (S2S26) in London. And it is calling for greater collaboration within the industry to turn UK technology [&#8230;]<\/p>\n<p>The post <a href=\"https://www.electronicsweekly.com/news/business/techworks-calls-for-economic-growth-through-uk-expertise-2026-09/\">TechWorks calls for economic growth through UK expertise<\/a> appeared first on <a href=\"https://www.electronicsweekly.com\">Electronics Weekly<\/a>.<\/p>"}, {"title": "UKESF, Unibots partner for robotics and engineering", "source": "Electronics Weekly", "date": "2026-09-11", "url": "https://www.electronicsweekly.com/news/design/stem/ukesf-unibots-partner-for-robotics-and-engineering-2026-09/", "summary": "<p>The UK Electronics Skills Foundation (UKESF) is partnering with Unibots CIC to help make learning practical robotics more accessible and social for students. Unibots CIC is a non-profit organisation that [&#8230;]<\/p>\n<p>The post <a href=\"https://www.electronicsweekly.com/news/design/stem/ukesf-unibots-partner-for-robotics-and-engineering-2026-09/\">UKESF, Unibots partner for robotics and engineering<\/a> appeared first on <a href=\"https://www.electronicsweekly.com\">Electronics Weekly<\/a>.<\/p>"}, {"title": "Intel’s StrongARM commitment looking wobbly", "source": "Electronics Weekly", "date": "2026-09-11", "url": "https://www.electronicswee n Milan, Strong IQE, EUV lithography photomasks<\/a> appeared first on <a href=\"https://www.electronicsweekly.com\">Electronics Weekly<\/a>.<\/p>"}, {"title": "CIOE reflects industry shift to HPC and AI", "source": "Electronics Weekly", "date": "2026-09-11", "url": "https://www.electronicsweekly.com/news/cioe-reflects-industry-shift-to-hpc-and-ai-2026-09/", "summary": "<p>The 27th China International Optoelectronic Exposition (CIOE 2026) took place this week (09-11 September) at the Shenzhen World Exhibition &#38; Convention Center, China. CIOE’s 4,000 exhibitors represent multiple markets, although [&#8230;]<\/p>\n<p>The post <a href=\"https://www.electronicsweekly.com/news/cioe-reflects-industry-shift-to-hpc-and-ai-2026-09/\">CIOE reflects industry shift to HPC and AI<\/a> appeared first on <a href=\"https://www.electronicsweekly.com\">Electronics Weekly<\/a>.<\/p>"}, {"title": "CXMT is world’s most profitable memory company", "source": "Electronics Weekly", "date": "2026-09-11", "url": "https://www.electronicsweekly.com/news/business/cxmt-is-worlds-most-profitable-memory-company-2026-09/", "summary": "<p>CXMT had Q2 EBIT of 82%, according to Quick FactSet, making it the world’s most profitable memory company. CXMT makes DDR5 while Hynix and Samsung have concentrated more on HBM, acting [&#8230;]<\/p>\n<p>The post <a href=\"https://www.electronicsweekly.com/news/business/cxmt-is-worlds-most-profitable-memory-company-2026-09/\">CXMT is world’s most profitable memory company<\/a> appeared first on <a href=\"https://www.electronicsweekly.com\">Electronics Weekly<\/a>.<\/p>"}, {"title": "$5.75bn equity investment for UK datacentre companies", "source": "Electronics Weekly", "date": "2026-09-11", "url": "https://www.electronicsweekly.com/news/business/5-75bn-vzc-money-for-uk-datacentre-companies-2026-09/", "summary": "<p>$5.7 billion of equity investment has been raised by 24 UK datacentre companies, according to  a report from analysts Tracxn. $3.6 billion of the $5.7 billion has been raised since [&#8230;]<\/p>\n<p>The post <a href=\"https://www.electronicsweekly.com/news/business/5-75bn-vzc-money-for-uk-datacentre-companies-2026-09/\">$5.75bn equity investment for UK datacentre companies<\/a> appeared first on <a href=\"https://www.electronicsweekly.com\">Electronics Weekly<\/a>.<\/p>"}, {"title": "TSMC August revenues up 53% YoY", "source": "Electronics Weekly", "date": "2026-09-11", "url": "https://www.electronicsweekly.com/news/business/tsmc-august-revenues-up-53-yoy-2026-09/", "summary": "<p>TSMC had record monthly revenue for August of $16.35 billion up 53.3% YoY and up 10.1% on  July. In Q2, the company had  a 77% jump in profit and forecast [&#8230;]<\/p>\n<p>The post <a href=\"https://www.electronicsweekly.com/news/business/tsmc-august-revenues-up-53-yoy-2026-09/\">TSMC August revenues up 53% YoY<\/a> appeared first on <a href=\"https://www.electronicsweekly.com\">Electronics Weekly<\/a>.<\/p>"}, {"title": "Dual-phase smart power stage family has power density exceeding 2 A/mm²", "source": "Electronics Weekly", "date": "2026-09-11", "url": "https://www.electronicsweekly.com/news/business/dual-phase-smart-power-stage-family-power-density-exceeding-2-a-mm%c2%b2-2026-09/", "summary": "<p>Infineon is sampling  a dual-phase smart power stage family designed for AI accelerators and vertical power delivery modules. Integrating Infineon&#8217;s OptiMOS 6 MOSFETs and a dual-phase driver IC in a [&#8230;]<\/p>\n<p>The post <a href=\"https://www.electronicsweekly.com/news/business/dual-phase-smart-power-stage-family-power-density-exceeding-2-a-mm%c2%b2-2026-09/\">Dual-phase smart power stage family has power density exceeding 2 A/mm²<\/a> appeared first on <a href=\"https://www.electronicsweekly.com\">Electronics Weekly<\/a>.<\/p>"}, {"title": "UPDATED GUIDE: Adafruit Metro M4 Express AirLift Lite #NoCode #WipperSnapper #AdafruitLearningSystem @Adafruit", "source": "Adafruit", "date": "2026-09-11", "url": "https://blog.adafruit. ting at Open Source For You, walks through the three pillars of observability without the usual vocabulary lesson. Metrics, logs, and traces are three ways of recording the same events inside a running system, each built around a different question. Logs keep one written entry per event, with a timestamp and whatever context [&#8230;]"}, {"title": "A backwards-walking fish was caught on video in the South China Sea", "source": "Adafruit", "date": "2026-09-11", "url": "https://blog.adafruit.com/2026/09/11/a-backwards-walking-fish-was-caught-on-video-in-the-south-china-sea/", "summary": "Sara Hashemi, writing for Popular Science, reports that scientists in China have filmed a deep-sea fish walking backward along the seafloor. The fish is Scalicus engyceros, an armored searobin. Its body is covered in bony plates, and stiff free fin rays stick out from its pectoral fins like small legs it uses to walk. The [&#8230;]"}, {"title": "Hexagon Wall Panels – Modular Shallow + Deep with Snug Pegs #3DThursday #3DPrinting", "source": "Adafruit", "date": "2026-09-11", "url": "https://blog.adafruit.com/2026/09/10/hexagon-wall-panels-modular-shallow-deep-with-snug-pegs-3dthursday-3dprinting-2/", "summary": "FOIXTRA shares: Modular hexagon wall panels in shallow (30mm) or deep (60mm) variants at 100% scale. Two peg types — small-gap or snug-fit — for different tiling aesthetics. Ships scaled to 50% by default. Alternative modular wall system to the Sci-Fi Corridor Tiles in main. By Foixtra download the files on: https://makerworld.com/en/models/1384619-hexagon-wall-panels-modular Every Thursday is [&#8230;]"}, {"title": "Imec demonstrates the extension of chemically amplified resists for High NA EUV lithography", "source": "EE Journal", "date": "2026-09-11", "url": "https://www.eejournal.com/industry_news/imec-demonstrates-the-extension-of-chemically-amplified-resists-for-high-na-euv-lithography/", "summary": "This week, at 2026 SPIE Photomask Technology + EUV Lithography Conference, imec, a world-leading research and innovation hub in advanced semiconductor technologies, demonstrates the feasibility of patterning tight-pitch random logic structures after a CAR-based single-print High NA EUV lithography step. Logic structures include lines/spaces down to 22nm pitch, and vias at 28nm center-to-center distance. These &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/imec-demonstrates-the-extension-of-chemically-amplified-resists-for-high-na-euv-lithography/\">Read More &#8594;<span class=\"screen-reader-text\"> \"Imec demonstrates the extension of chemically amplified resists for High NA EUV lithography\"<\/span><\/a>"}, {"title": "New Infineon OPTIREG™ TLE9744QK Power Management IC integrates power and safety for hybrid and electric vehicle traction inverters", "source": "EE Journal", "date": "2026-09-11", "url": "https://www.eejournal.com/industry_news/new-infineon-optireg-tle9744qk-power-management-ic-integrates-power-and-safety-for-hybrid-and-electric-vehicle-traction-inverters/", "summary": "Infineon Technologies AG (FSE: IFX / OTCQX: IFNNY) has introduced the OPTIREG™ PMIC TLE9744QK, a fully integrated Power Management IC (PMIC) specifically designed for high-voltage traction inverter applications in electric and hybrid vehicles. It consolidates complete power-supply functions, resolver excitation, and a dedicated safety engine into a single device. This simplifies traction inverter Electronic Control &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/new-infineon-optireg-tle9744qk-power-management-ic-integrates-power-and-safety-for-hybrid-and-electric-vehicle-traction-inverters/\">Read More &#8594;<span class=\"screen-reader-text\"> \"New Infineon OPTIREG™ TLE9744QK Power Management IC integrates power and safety for hybrid and electric vehicle traction inverters\"<\/span><\/a>"}, {"title": "Zuken Launches E3.series 2027 With Expanded Engineering and Manufacturing Capabilities", "source": "EE Journal", "date": "2026-09-11", "url": "https://www.eejournal.com/industry_news/zuken-launches-e3-series-2027-with-expanded-engineering-and-manufacturing-capabilities/", "summary": "Zuken today announced E3.series 2027, the latest release of its electrical design software for wiring, wire harness, fluid, and control systems design. The release focuses on making engineering information more accessible and easier to carry into manufacturing and downstream processes. Key additions include E3.CloudView for browser-based access to project documentation, workflow enhancements for common engineering &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/zuken-launches-e3-series-2027-with-expanded-engineering-and-manufacturing-capabilities/\">Read More &#8594;<span class=\"screen-reader-text\"> \"Zuken Launches E3.series 2027 With Expanded Engineering and Manufacturing Capabilities\"<\/span><\/a>"}, {"title": "Alpha and Omega Semiconductor’s New aMOS E2™ 600V Super Junction MOSFETs Support Optimized Electrical/Thermal Paths, Boosted System Performance and Long-Term Reliability", "source": "EE Journal", "date": "2026-09-11", "url": "https://www.eejournal.com/industry_news/alpha-and-omega-semiconductors-new-amos-e2-600v-super-junction-mosfets-support-optimized-electrical-thermal-paths-boosted-system-performance-and-long-term-reliability/", "summary": "Alpha and Omega Semiconductor Limited (AOS) (Nasdaq: AOSL), a designer, developer, and global supplier of a broad range of discrete power devices, wide-bandgap power devices, power management ICs and modules, today announced the release of αMOS E2™ 600V Super Junction MOSFETs: AOGT037V60DE2 and AOGT060V60DE2. AOS engineered its newly developed αMOS E2 High‑Voltage MOSFET platform to &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/alpha-and-omega-semiconductors-new-amos-e2-600v-super-junction-mosfets-support-optimized-electrical-thermal-paths-boosted-system-performance-and-long-term-reliability/\">Read More &#8594;<span class=\"screen-reader-text\"> \"Alpha and Omega Semiconductor’s New aMOS E2™ 600V Super Junction MOSFETs Support Optimized Electrical/Thermal Paths, Boosted System Performance and Long-Term Reliability\"<\/span><\/a>"}, {"title": "Pickering to showcase scalable signal switching for semiconductor test at Microelectronics UK", "source": "EE Journal", "date": "2026-09-11", "url": "https://www.eejournal.com/industry_news/pickering-to-showcase-scalable-signal-switching-for-semiconductor-test-at-microelectronics-uk/", "summary": "Pickering Interfaces will showcase its range of industry-standard modular signal switching solutions for semiconductor test and verification, as well as its recently launched graphical design tool, Test System Architect, developed to simplify signal switching and cabling system design, on stand E42 at Microelectronics UK, taking place from 29-30 September at Excel London. Microelectronics UK is a leading event for the UK microelectronics ecosystem, &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/pickering-to-showcase-scalable-signal-switching-for-semiconductor-test-at-microelectronics-uk/\">Read More &#8594;<span class=\"screen-reader-text\"> \"Pickering to showcase scalable signal switching for semiconductor test at Microelectronics UK\"<\/span><\/a>"}, {"title": "From Transistors to AI: The Chiplet Revolution with Ramune Nagisetty", "source": "EE Journal", "date": "2026-09-11", "url": "https://www.eejournal.com/fish_fry/from-transistors-to-ai-the-chiplet-revolution-with-ramune-nagisetty/", "summary": "<img alt=\"\" class=\"webfeedsFeaturedVisual wp-post-image\" height=\"300\" src=\"https://www.eejournal.com/wp-content/uploads/2026/09/AD-091126-300x300.jpg\" style=\"display: block; margin-bottom: 5px; clear: both;\" width=\"300\" />My podcast guest this week is a powerhouse of the semiconductor industry: Ramune Nagisetty. Ramune, best known for developing the chiplet-based system-in-package architecture concept, joins me this week to discuss her foundational work on chiplet-based system-in-package architectures, the current reality of chiplet interoperability, and the role of artificial intelligence in semiconductor design and manufacturing. We &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/fish_fry/from-transistors-to-ai-the-chiplet-revolution-with-ramune-nagisetty/\">Read More &#8594;<span class=\"screen-reader-text\"> \"From Transistors to AI: The Chiplet Revolution with Ramune Nagisetty\"<\/span><\/a>"}, {"title": "LattePanda Mu Ultra Compute Module features Intel Core Ultra 5 226V/7 256V Lunar Lake CPU for AI workloads", "source": "CNX Software", "date": "2026-09-10", "url": "https://www.cnx-software.com/2026/09/10/lattepanda-mu-ultra-compute-module-features-intel-core-ultra-5-226v-7-256v-lunar-lake-cpu-for-ai-workloads/", "summary": "<div><img alt=\"LattePanda Mu Ultra\" class=\"attachment-medium size-medium wp-post-image\" height=\"516\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/09/LattePanda-Mu-Ultra-720x516.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>The LattePanda Mu Ultra is an x86 Compute Module powered by an Intel Core Ultra 5 226V or Ultra 7 256V Lunar Lake processor and equipped with 16GB of DDR5 memory. Offered in the same compact 69.6 × 60mm form factor as the earlier LattePanda Mu Alder Lake-N system-on-module (N100 or Core i3-N305), it delivers much higher performance, including up 115 TOPS of AI performance. Target applications include robotics, industrial automation, portable instruments, vision AI, and a range of Edge AI applications. LattePanda Mu Ultra Specifications: Lunar Lake SoC (one or the other) Intel Core Ultra 5 Processor 226V CPU &#8211; Octa-core processor up to 4.5 GHz GPU &#8211; 7x Xe-core Intel Arc 130V GPU up to 1.85 GHz AI &#8211; 40 TOPS Intel AI Boost; combined up to 97 TOPS Intel Core Ultra 7 Processor 256V CPU &#8211; Octa-core processor up to 4.8 GHz GPU &#8211; 8x Xe-core Intel Arc [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/09/10/lattepanda-mu-ultra-compute-module-features-intel-core-ultra-5-226v-7-256v-lunar-lake-cpu-for-ai-workloads/\">LattePanda Mu Ultra Compute Module features Intel Core Ultra 5 226V/7 256V Lunar Lake CPU for AI workloads<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Arduino UNO Media Carrier adds MIPI CSI/DSI and audio connectors to UNO Q and VENTUNO Q boards", "source": "CNX Software", "date": "2026-09-10", "url": "https://www.cnx-software.com/2026/09/10/arduino-uno-media-carrier-adds-mipi-csi-dsi-and-audio-connectors-to-uno-q-and-ventuno-q-boards/", "summary": "<div><img alt=\"Arduino UNO Media Carrier board\" class=\"attachment-medium size-medium wp-post-image\" height=\"450\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/09/Arduino-UNO-Media-Carrier-board-720x450.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Arduino UNO Media Carrier board adds three audio jacks, a MIPI DSI display connector, two MIPI CSI camera connectors, and a few RGB LEDs to the Arduino UNO Q and Arduino VENTUNO Q SBCs. Both Arduino &#8220;Q&#8221; boards already expose MIPI CSI/DSI and audio interfaces, but only through the JMEDIA and JMISC 60-pin headers, which aren&#8217;t very convenient. The Arduino UNO Media Carrier board fixes that with 22-pin MIPI connectors and 3.5 audio jacks. Arduino UNO Media Carrier (ASX00083) specifications: Compatible SBCs &#8211; Arduino UNO Q and Arduino VENTUNO Q Display I/F &#8211; 22-pin MIPI DSI connector compatible with standard MIPI-DSI display modules (5-inch, 8-inch, 10.1-inch Waveshare touch display compatible) Camera I/F &#8211; 2x 22-pin MIPI-CSI connectors compatible with IMX219 camera modules like the Raspberry Pi Camera Module 2 Audio 3.5 mm (MIC-IN/Headphones Out) audio jack 3.5mm Line Out audio jack 3.5mm Ear Out audio jack Host interfaces 60-pin female [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/09/10/arduino-uno-media-carrier-adds-mipi-csi-dsi-and-audio-connectors-to-uno-q-and-ventuno-q-boards/\">Arduino UNO Media Carrier adds MIPI CSI/DSI and audio connectors to UNO Q and VENTUNO Q boards<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Alif Semiconductor Launches $49 StartKits for Edge AI MCUs", "source": "Embedded.com", "date": "2026-09-10", "url": "https://www.embedded.com/alif-semiconductor-launches-49-startkits-for-edge-ai-mcus/", "summary": "<p>Alif Semiconductor has introduced a new family of low-cost StartKit evaluation boards designed to simplify development with its edge AI-enabled Ensemble and Balletto microcontroller (MCU) platforms. The SK-E1C targets the Ensemble family, while the SK-B1 targets the Bluetooth Low Energy (BLE)-enabled Balletto devices. Both boards are priced at an MSRP of $49, providing developers with [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/alif-semiconductor-launches-49-startkits-for-edge-ai-mcus/\">Alif Semiconductor Launches $49 StartKits for Edge AI MCUs<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "Chiplet-Based FPGAs Optimize Performance for Space Applications", "source": "Embedded.com", "date": "2026-09-10", "url": "https://www.embedded.com/chiplet-based-fpgas-optimize-performance-for-space-applications/", "summary": "<p>Field-programmable gate array (FPGA) architectures for space must reconcile computing capacity, reliability, power consumption, and component availability for very long missions. A chiplet-based approach can separate processing and I/O, allowing for the optimization of radiation tolerance, performance, and upgradeability. Beyond the monolithic FPGA Space applications require increasingly higher processing capacities, especially in payloads dedicated to [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/chiplet-based-fpgas-optimize-performance-for-space-applications/\">Chiplet-Based FPGAs Optimize Performance for Space Applications<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "Halloween Tiny glowing jack o lantern pumpkin LED #3DThursday #3DPrinting", "source": "Adafruit", "date": "2026-09-10", "url": "https://blog.adafruit.com/2026/09/10/halloween-tiny-glowing-jack-o-lantern-pumpkin-led-3dthursday-3dprinting/", "summary": "Shared by DIY Wizard on MakerWorld: Welcome back witches and wizards! It&#8217;s halloween time again and I prepared some models! I&#8217;ve always wanted to use the tiny LEDs with megnetic switch for some earrings, so here are some jack o lantern earrings for halloween! Download the files and learn more Every Thursday is #3dthursday here [&#8230;]"}, {"title": "Flexi Cat Desk Pet – Grumpy Cartoon Expression with 6+ Coat Patterns #3DThursday #3DPrinting", "source": "Adafruit", "date": "2026-09-10", "url": "https://blog.adafruit.com/2026/09/10/flexi-cat-desk-pet-grumpy-cartoon-expression-with-6-coat-patterns-3dthursday-3dprinting/", "summary": "baynimals shares: Newly launched Sept 2026 — the baynimals flexi collection expanding beyond the barnyard! Signature grumpy cartoon expression and highly articulated segmented body. Incredibly wiggly, lays perfectly flat in total defeat, dense satisfying weight makes it a great desk pet and fidget. Print profiles for classic cat coat patterns including a Siamese variant. No-AMS [&#8230;]"}, {"title": "Case + Camera for Raspberry Pi Zero/2/W #3DThursday #3DPrinting", "source": "Adafruit", "date": "2026-09-10", "url": "https://blog.adafruit.com/2026/09/10/case-camera-for-raspberry-pi-zero-2-w-3dthursday-3dprinting/", "summary": "Shared by doles on MakerWorld: With the new Raspberry Pi Zero W (Pi0W) having been released, I decided to design a case and camera mount for my 3D printers. And what a better day to release it than Pi Day 2017! This should work if you don&#8217;t have the front acrylic panel attached. I&#8217;ve included [&#8230;]"}, {"title": "Raspberry Pi Zero Back Holder – Fits Snap-Fit Case for 3D Printer Mount #3DThursday #3DPrinting", "source": "Adafruit", "date": "2026-09-10", "url": "https://blog.adafruit.com/2026/09/10/raspberry-pi-zero-back-holder-fits-snap-fit-case-for-3d-printer-mount-3dthursday-3dprinting/", "summary": "nikola1 shares: A back-holder mount designed from the ground up to fit the popular Raspberry Pi Zero Snap-Fit Case. Uses 2× M3×8mm screws to attach the holder to the back of your printer. Designer specifically used it for a P1S camera mod for smooth 1080p streams. Great companion piece to any of the Pi Zero [&#8230;]"}, {"title": "Halloween Classic Carved Pumpkin Lantern – LED Tea Light up to 38mm", "source": "Adafruit", "date": "2026-09-10", "url": "https://blog.adafruit.com/2026/09/10/halloween-classic-carved-pumpkin-lantern-led-tea-light-up-to-38mm/", "summary": "A classic Jack-o&#8217;-lantern for LED tea lights up to 38mm. Scales up to accommodate larger LED candles. No AMS needed — no glue required if you want to keep the lid separate. Printed with Bambu Matte PLA, looks great in silk filaments too. Traditional Halloween essential for the ramp block. By NUKDDD Every Thursday is [&#8230;]"}, {"title": "TDK launches industry-leading low-resistance soft-termination X7R MLCCs with 10 μF/100 V in the 3225 format for AI servers, humanoids, and xEVs", "source": "EE Journal", "date": "2026-09-10", "url": "https://www.eejournal.com/industry_news/tdk-launches-industry-leading-low-resistance-soft-termination-x7r-mlccs-with-10-%ce%bcf-100-v-in-the-3225-format-for-ai-servers-humanoids-and-xevs/", "summary": "&#8211;  New 100 V SMD component with X7R characteristics has a capacitance of 10 μF in the 3225 format. &#8211;  Offers low resistance and soft termination for automotive (AEC-Q200) and general applications. &#8211;  Contributes to higher reliability, reduction of component count, and miniaturization. TDK Corporation (TSE:6762) announced today that it has expanded its CN series &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/tdk-launches-industry-leading-low-resistance-soft-termination-x7r-mlccs-with-10-%ce%bcf-100-v-in-the-3225-format-for-ai-servers-humanoids-and-xevs/\">Read More &#8594;<span class=\"screen-reader-text\"> \"TDK launches industry-leading low-resistance soft-termination X7R MLCCs with 10 μF/100 V in the 3225 format for AI servers, humanoids, and xEVs\"<\/span><\/a>"}, {"title": "STMicroelectronics’ highly integrated power-factor correction controller simplifies continuous conduction mode designs", "source": "EE Journal", "date": "2026-09-10", "url": "https://www.eejournal.com/industry_news/stmicroelectronics-highly-integrated-power-factor-correction-controller-simplifies-continuous-conduction-mode-designs/", "summary": "STMicroelectronics’ L4983 power-factor correction (PFC) controller contains a proprietary multiplier emulator and distortion-optimization circuitry, letting designers build continuous conduction mode (CCM) PFC circuits with very few external passive components. The L4983 is suitable for power supplies ranging from several hundred Watts to multiple kilowatts and has a totem-pole output with 7A-sink/3A-source capability. Typical applications include industrial and &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/stmicroelectronics-highly-integrated-power-factor-correction-controller-simplifies-continuous-conduction-mode-designs/\">Read More &#8594;<span class=\"screen-reader-text\"> \"STMicroelectronics’ highly integrated power-factor correction controller simplifies continuous conduction mode designs\"<\/span><\/a>"}, {"title": "UNIVITY Successfully Establishes the First 5G NTN TDD Connection in Millimeter-Wave (mmWave) Frequencies from Space", "source": "EE Journal", "date": "2026-09-10", "url": "https://www.eejournal.com/industry_news/univity-successfully-establishes-the-first-5g-ntn-tdd-connection-in-millimeter-wave-mmwave-frequencies-from-space/", "summary": "UNIVITY, an operator of space-based connectivity services, announces the success of uniSpark, its first in-orbit technology demonstration mission. Launched in June 2025, uniSpark established a fully bidirectional 5G NTN (Non-Terrestrial Network) connection between a ground terminal and a 5G base station onboard a satellite in orbit. This is the first in-orbit demonstration combining onboard regenerative 5G processing, a millimeter-wave (mmWave) link &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/univity-successfully-establishes-the-first-5g-ntn-tdd-connection-in-millimeter-wave-mmwave-frequencies-from-space/\">Read More &#8594;<span class=\"screen-reader-text\"> \"UNIVITY Successfully Establishes the First 5G NTN TDD Connection in Millimeter-Wave (mmWave) Frequencies from Space\"<\/span><\/a>"}, {"title": "SEGGER J-Link debug probe fully validated for STMicroelectronics’ StellarStudio", "source": "EE Journal", "date": "2026-09-10", "url": "https://www.eejournal.com/industry_news/segger-j-link-debug-probe-fully-validated-for-stmicroelectronics-stellarstudio/", "summary": "SEGGER and STMicroelectronics have worked closely together to ensure robust, high-performance support for current and future Stellar devices, with J-Link integration identified as a priority from the outset. Key J-Link features include up to 4 MBs of download speed into random-access memory (RAM), fast download directly into flash memory at full speed, and the ability &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/segger-j-link-debug-probe-fully-validated-for-stmicroelectronics-stellarstudio/\">Read More &#8594;<span class=\"screen-reader-text\"> \"SEGGER J-Link debug probe fully validated for STMicroelectronics’ StellarStudio\"<\/span><\/a>"}, {"title": "ESP32-C5 Pico board follows Raspberry Pi Pico form factor, ships with on-board or external antenna", "source": "CNX Software", "date": "2026-09-09", "url": "https://www.cnx-software.com/2026/09/09/esp32-c5-pico-board-follows-raspberry-pi-pico-form-factor-ships-with-on-board-or-external-antenna/", "summary": "<div><img alt=\"ESP32-C5 Pico\" class=\"attachment-medium size-medium wp-post-image\" height=\"498\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/09/ESP32-C5-Pico-720x498.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Waveshare ESP32-C5 Pico board brings the ESP32-C5 dual-band WiFi 6, Bluetooth LE, and 802.15.4 (Zigbee/Thread) SoC to the Raspberry Pi Pico form factor. The board features an ESP32-C5-MINI-1 Series module with PCB or external antenna, two 20-pin GPIO headers, a USB-C port for power and programming, Reset and Boot buttons, and a few LEDs. It also supports Li-Ion battery charging and discharging. Waveshare ESP32-C5 Pico specifications: Wireless module – ESP32-C5-MINI-1 or ESP32-C5-MINI-1U Wireless MCU –  Espressif Systems ESP32-C5HF4 CPU Single-core 32-bit RISC-V processor @ up to 240 MHz Low-power RISC-V core @ 48 MHz acting as the main processor for power-sensitive applications Memory – 384 KB SRAM on-chip Storage – 320 KB ROM, 4MB SPI flash Wireless Dual-band (2.4/5 GHz) 802.11ax WiFi 6, 802.11b/g/n WiFi 4 backward compatibility WiFi modes: Station mode, SoftAP mode, SoftAP + Station mode, and promiscuous mode Bluetooth 5.0 Low Energy (LE) with Mesh support, up [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/09/09/esp32-c5-pico-board-follows-raspberry-pi-pico-form-factor-ships-with-on-board-or-external-antenna/\">ESP32-C5 Pico board follows Raspberry Pi Pico form factor, ships with on-board or external antenna<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "FREE-WILi 2 portable hacking multitool features two RP2350 MCUs, ESP32-C5, ICE40 FPGA, and Raspberry Pi CM0", "source": "CNX Software", "date": "2026-09-09", "url": "https://www.cnx-software.com/2026/09/09/free-wili-2-portable-hacking-multitool-features-two-rp2350-mcus-esp32-c5-ice40-fpga-and-raspberry-pi-cm0/", "summary": "<div><img alt=\"FREE WILi 2 portable hacking multitool\" class=\"attachment-medium size-medium wp-post-image\" height=\"480\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/09/FREE-WILi-2-portable-hacking-multitool-720x480.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>The FREE-WILi 2 (Founder Edition) is an open-hardware, portable hacking multitool and lab designed for hardware hackers, pentesters, and embedded system developers. Designed as an “open electronics multitool,” it combines a range of chips and modules into a handheld device, including two Raspberry Pi RP2350 MCUs, an ESP32-C5 for wireless connectivity, a Lattice ICE40UP5K FPGA, and a Raspberry Pi CM0 for running a full Linux OS. The device also features a 3.5-inch capacitive touchscreen, a 14-button physical interface, and modular “Orca” headers for hardware expansion. Its wireless features include 2.4/5GHz Wi-Fi, Bluetooth, LoRa, sub-GHz RF, NFC, 125kHz RFID, and IR. These features make it very suitable for wireless testing, embedded hardware debugging, real-time control, electronics development, and retro gaming, with support for Adafruit Fruit Jam, PICO-8, and Doom. FREE-WILi 2 specifications: Compute Main MCUs – 2x Raspberry Pi RP2350B (One for main controls, one dedicated to display) SoM – Raspberry [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/09/09/free-wili-2-portable-hacking-multitool-features-two-rp2350-mcus-esp32-c5-ice40-fpga-and-raspberry-pi-cm0/\">FREE-WILi 2 portable hacking multitool features two RP2350 MCUs, ESP32-C5, ICE40 FPGA, and Raspberry Pi CM0<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Morse Micro Introduces Wi-Fi HaLow USB Network Adapters", "source": "Embedded.com", "date": "2026-09-09", "url": "https://www.embedded.com/morse-micro-introduces-wi-fi-halow-usb-network-adapters/", "summary": "<p>Morse Micro has introduced a range of Wi-Fi HaLow USB network adapters that give computers, laptops, and access points direct connectivity to Wi-Fi HaLow networks. Available in both USB-A and USB-C formats, the adapters give developers and device manufacturers a practical way to evaluate and integrate long-range wireless technology across multiple host platforms. The adapters [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/morse-micro-introduces-wi-fi-halow-usb-network-adapters/\">Morse Micro Introduces Wi-Fi HaLow USB Network Adapters<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "Neura Robotics and Seco Partner to Scale Physical AI", "source": "Embedded.com", "date": "2026-09-09", "url": "https://www.embedded.com/neura-robotics-and-seco-partner-to-scale-physical-ai/", "summary": "<p>Neura Robotics and Seco S.p.A. have announced a strategic partnership to industrialize and scale physical AI in Europe. The collaboration combines Neura's cognitive robotics architecture with Seco's embedded computing and manufacturing expertise, while leveraging Qualcomm Technologies' advanced edge-computing platforms. Initial activities will focus on electronic compute modules for Neura's cognitive robots, including the humanoid 4NE1, [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/neura-robotics-and-seco-partner-to-scale-physical-ai/\">Neura Robotics and Seco Partner to Scale Physical AI<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "Arm CSS for Mobile 2 “AI-Native” platform: Arm C2-Ultra and C2-Pro CPU cores, Mali G2-Ultra NX GPU", "source": "CNX Software", "date": "2026-09-08", "url": "https://www.cnx-software.com/2026/09/08/arm-css-for-mobile-2-ai-native-platform-arm-c2-ultra-and-c2-pro-cpu-cores-mali-g2-ultra-nx-gpu/", "summary": "<div><img alt=\"Arm CSS for Mobile 2\" class=\"attachment-medium size-medium wp-post-image\" height=\"405\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/09/Arm-CSS-for-Mobile-2-720x405.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Arm has introduced the CSS for Mobile 2 platform as an AI-native compute foundation comprised of the Arm C2-Ultra and C2-Pro CPUs with SME2 (Scalable Matrix Extension 2) units and the Mali G2-Ultra NX GPU with dedicated neural accelerators that enable neural graphics to run natively on the GPU. Arm C2-Ultra and C2-Pro CPUs Arm C2-Ultra specifications: Architecture &#8211; Armv9.3-A Extensions Armv9.4-A (Some key features) SME2 Extensions SVE2 Extensions Cryptography Extensions RAS Extensions ISA support &#8211; AArch64 Microarchitecture Pipeline &#8211; Out-of-order Superscalar Neon and SVE2 Optional Cryptography Unit Up to 14x CPUs in cluster 40-bit Physical Addressing Memory System and External Interfaces 64KB (I-Cache), 128KB (D-Cache) 2MB or 3MB L2 Cache Optional, 256KB to 32MB L3 Cache ECC Support Bus interfaces &#8211; AMBA AXI5 or CHI.E Optional ACP Optional Peripheral Port Security &#8211; TrustZone, Secure-EL2 Interrupts &#8211; GIC interface, GICv4.1 PMU &#8211; PMUv3 CoreSight &#8211; CoreSightv3 Embedded Trace Extension &#8211; [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/09/08/arm-css-for-mobile-2-ai-native-platform-arm-c2-ultra-and-c2-pro-cpu-cores-mali-g2-ultra-nx-gpu/\">Arm CSS for Mobile 2 &#8220;AI-Native&#8221; platform: Arm C2-Ultra and C2-Pro CPU cores, Mali G2-Ultra NX GPU<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Mission-Critical Systems: MCUs vs. FPGAs vs. SoCs", "source": "Embedded.com", "date": "2026-09-08", "url": "https://www.embedded.com/mission-critical-systems-mcus-vs-fpgas-vs-socs/", "summary": "<p>Applications in aerospace and defense as well as heavy industry and energy place long-term reliability requirements that go far beyond the specifications of commercial electronics. The presence of ionizing radiation and extreme temperatures profoundly influences the choice between microcontrollers (MCUs), field-programmable gate arrays (FPGAs), and system-on-chips (SoCs). When the environment becomes the main design constraint [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/mission-critical-systems-mcus-vs-fpgas-vs-socs/\">Mission-Critical Systems: MCUs vs. FPGAs vs. SoCs<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "YuzukiNeko – A Linux-capable Allwinner F101 RISC-V SBC with Raspberry Pi Pico form factor", "source": "CNX Software", "date": "2026-09-07", "url": "https://www.cnx-software.com/2026/09/08/yuzukineko-a-linux-capable-allwinner-f101-64-bit-risc-v-sbc-with-raspberry-pi-pico-form-factor/", "summary": "<div><img alt=\"YuzukiNeko Allwinner F101 SBC\" class=\"attachment-medium size-medium wp-post-image\" height=\"476\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/09/YuzukiNeko-Allwinner-F101-SBC-720x476.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>YuzukiHD has made another open-source hardware Linux SBC. YuzukiNeko is a Raspberry Pi Pico-sized single board computer powered by a new Allwinner F101 RISC-V SoC. The Allwinner F101 processor features a single 1.008 GHz C907 RISC-V core, 8MB or 16 MB PSRAM, and support for various display interfaces such as MIPI DSI, 24-bit RGB, and LVDS. The YuzukiNeko board itself features the F101 SoC, an SPI NOR flash, a microSD card for storage, a USB-C port, and two 20-pin GPIO headers. YuzukiNeko specifications: SoC &#8211; Allwinner F101 CPU &#8211; T-head C907 RISC-V core up to 1.008 GHz Memory &#8211; 8MB or 16MB PSRAM @ 252 MHz Package &#8211; QFN-68 Storage 128 Mbit NOR flash (PY25Q128HA-SUH-IT) MicroSD card slot USB &#8211; USB Type-C port for data, power, and programming Expansion 2x 20-pin expansion headers with GPIOs, ADC, 5V, 3.3V, and GND 5x pads with HP out (analog speaker output) and four [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/09/08/yuzukineko-a-linux-capable-allwinner-f101-64-bit-risc-v-sbc-with-raspberry-pi-pico-form-factor/\">YuzukiNeko &#8211; A Linux-capable Allwinner F101 RISC-V SBC with Raspberry Pi Pico form factor<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Reverse Engineering Without CAD Data: How MetroY Ultra Turns Physical Parts into Digital Designs (Sponsored)", "source": "CNX Software", "date": "2026-09-07", "url": "https://www.cnx-software.com/2026/09/07/reverse-engineering-without-cad-data-how-metroy-ultra-turns-physical-parts-into-digital-designs/", "summary": "<div><img alt=\"MetroY Ultra Scan\" class=\"attachment-medium size-medium wp-post-image\" height=\"405\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/08/MetroY-Ultra-Scan-720x405.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>When the Part Exists, but the Data Doesn’t Reverse engineering often starts with a physical part but no reliable digital data. In restoration and customization, manual measurement can provide basic dimensions, but it becomes limiting when complex curves, mounting points, and tight clearances need to be captured accurately. MetroY Ultra captures the actual three-dimensional geometry of a part, providing a reliable digital reference for reverse engineering, custom design, and manufacturing. Designing a Custom Motorcycle Seat Tray from Accurate Scan Data In a custom 1984 Honda CB400 build, the builder needed to create a seat tray and seat pan for a custom seat while integrating the rear fender into the modified rear subframe. The challenge was not simply designing a new part, but making that part accurately fit a motorcycle whose geometry had already been modified. Traditionally, this kind of work is often done with welded sheet metal or fiberglass layup. [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/09/07/reverse-engineering-without-cad-data-how-metroy-ultra-turns-physical-parts-into-digital-designs/\">Reverse Engineering Without CAD Data: How MetroY Ultra Turns Physical Parts into Digital Designs (Sponsored)<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "XIAO SAMD21 Plus and RP2040 Plus USB-C boards get additional GPIO pins, integrated Li-ion battery management", "source": "CNX Software", "date": "2026-09-07", "url": "https://www.cnx-software.com/2026/09/07/xiao-samd21-plus-and-rp2040-plus-usb-c-boards-get-additional-gpio-pins-integrated-li-ion-battery-management/", "summary": "<div><img alt=\"XIAO SAMD21 Plus\" class=\"attachment-medium size-medium wp-post-image\" height=\"494\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/09/XIAO-SAMD21-Plus-720x494.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Seeed Studio has expanded its XIAO Plus Series introduced in 2025, with the XIAO SAMD21 Plus and XIAO RP2040 Plus USB-C boards adding several GPIOs and integrated Li-ion battery management to the XIAO (SAMD21) and XIAO RP2040, launched in 2020 and 2021, respectively, while keeping the same form factor. XIAO SAMD21 Plus Specifications: MCU – Microchip SAMD21G18 Arm Cortex-M0+ microcontroller at up to 48MHz with 256KB Flash,32KB SRAM USB – 1x USB Type-C port for power and programming Expansion I/Os 2x 7-pin &#8220;legacy&#8221; headers with 11x analog inputs, 11x digital I/Os, 1x DAC, SPI, UART, and I2C Castellated holes and pads with 16x digital I/Os, I2C,and I2S 3.3V I/O voltage (not 5V tolerant) Misc Reset and Boot buttons RGB LED Charge LED Power Supply 5V via USB-C port Pads for battery On-board PMIC Dimensions – 23.5×17.5 mm Temperature Range &#8211; -40°C ~ 85°C The upgraded variant of the XIAO SAMD21 [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/09/07/xiao-samd21-plus-and-rp2040-plus-usb-c-boards-get-additional-gpio-pins-integrated-li-ion-battery-management/\">XIAO SAMD21 Plus and RP2040 Plus USB-C boards get additional GPIO pins, integrated Li-ion battery management<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "ACEMAGIC Kron Mini K5 Review – Part 2: A $400 Intel Core 3 304 Wildcat Lake mini PC tested with Windows 11 Pro", "source": "CNX Software", "date": "2026-09-06", "url": "https://www.cnx-software.com/2026/09/06/acemagic-kron-mini-k5-review-part-2-a-400-intel-core-3-304-wildcat-lake-mini-pc-tested-with-windows-11-pro/", "summary": "<div><img alt=\"ACEMAGIC Kron Mini K5 Intel Core 3 304 review windows 11\" class=\"attachment-medium size-medium wp-post-image\" height=\"480\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/09/ACEMAGIC-Kron-Mini-K5-Intel-Core-3-304-review-windows-11-720x480.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>After checking out the hardware of the ACEMAGIC Kron Mini K5 with an unboxing and a teardown in the first part of the review, we&#8217;ve now had time to test the Intel Core 3 304 Wildcat Lake mini PC in more depth with Windows 11 Pro. So in this article, we&#8217;ll report our experience with the penta-core mini PC, testing features, running system and AI benchmarks, playing 4K and 8K YouTube videos on Firefox, measuring network throughput (2.5GbE and WiFi 6), evaluating thermal performance, and measuring fan noise and power consumption. Software overview and feature testing The System &#62; About window confirms we have a 1.5 GHz (base frequency) Intel Core 3 304 computer paired with 12GB of RAM and 477GB of storage, running Windows 11 Pro 25H2 build 26200.9168. HWiNFO 64 provides additional details about the 15W Intel Core 3 304 penta-core (1P+4E) Wildcat Lake-U processor, the motherboard with [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/09/06/acemagic-kron-mini-k5-review-part-2-a-400-intel-core-3-304-wildcat-lake-mini-pc-tested-with-windows-11-pro/\">ACEMAGIC Kron Mini K5 Review &#8211; Part 2: A $400 Intel Core 3 304 Wildcat Lake mini PC tested with Windows 11 Pro<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Microchip, Marelli Target Software-Defined Vehicle Display Systems", "source": "Embedded.com", "date": "2026-09-05", "url": "https://www.embedded.com/microchip-marelli-target-software-defined-vehicle-display-systems/", "summary": "<p>Microchip Technology and Marelli have demonstrated a display connectivity solution that streams graphics and video generated by a vehicle's centralized computing system directly to automotive displays using ASA Motion Link (ASA-ML). Based on the open automotive video connectivity and SerDes standard defined by the Automotive SerDes Alliance (ASA), the solution is designed to simplify display [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/microchip-marelli-target-software-defined-vehicle-display-systems/\">Microchip, Marelli Target Software-Defined Vehicle Display Systems<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "NXP MCX A5 MCUs, Edge AI for Military Drone Autonomy, Modular Computing for Long-Lifecycle Aerospace Platforms: Embedded Week Insights", "source": "Embedded.com", "date": "2026-09-04", "url": "https://www.embedded.com/nxp-mcx-a5-mcus-edge-ai-for-military-drone-autonomy-modular-computing-for-long-lifecycle-aerospace-platforms-embedded-week-insights/", "summary": "<p>Here's a roundup of this week's must-read articles. We'll look into the latest developments on NXP MCX A5 MCUs, edge AI for military drones, modular computing for aerospace platforms, and more. Also, check News Archives - Embedded and Technical Articles Archives - Embedded for the complete list of news and articles from our website. NEWS SomDevices, Celus Bring μSMARC [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/nxp-mcx-a5-mcus-edge-ai-for-military-drone-autonomy-modular-computing-for-long-lifecycle-aerospace-platforms-embedded-week-insights/\">NXP MCX A5 MCUs, Edge AI for Military Drone Autonomy, Modular Computing for Long-Lifecycle Aerospace Platforms: Embedded Week Insights<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "Everspin, Teledyne HiRel Partner on Mission-Critical MRAM", "source": "Embedded.com", "date": "2026-09-04", "url": "https://www.embedded.com/everspin-teledyne-hirel-partner-on-mission-critical-mram/", "summary": "<p>Everspin Technologies and Teledyne HiRel Semiconductors have announced a strategic partnership to expand the use of magnetoresistive random-access memory (MRAM) in aerospace, defense, and other mission-critical applications. The collaboration will initially focus on Everspin's 256-Mb PERSYST spin-transfer torque MRAM (STT-MRAM), combining RAM-like access performance with non-volatile data retention. Under the agreement, Teledyne HiRel will offer [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/everspin-teledyne-hirel-partner-on-mission-critical-mram/\">Everspin, Teledyne HiRel Partner on Mission-Critical MRAM<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}], "papers": [{"title": "A Chip-scale Space-time Multiplexed Gaussian Boson Sampling Processor Beyond 10,000 Photons", "authors": ["Yu-Xuan Fu", "He-Yu Shen", "Ke-Ming Hu", "Jun-Jie He", "Yun-Long Nie", "Hang Song", "Bao-Jing Liu", "Le-Si Yang", "Xiao-Yu Wu", "Pei-Lin Du", "Yu-Ze Zhu", "Yi Xie", "De-Hui Huang", "Yu-Fei Liu", "Hai Yan", "Jin-Hong Chen", "Yu-Lin Yu", "Chuan-Yan Peng", "Wen-Hao Zhou", "Feng Lu", "Yu-Quan Peng", "Chen-Shuo Xia", "Zhi-Chao Wang", "Zhe-Han Li", "Lin Chen", "Chao-Yang Zhang", "Chun-Yan Jin", "Yan-Rong Zong", "Xiao-Yun Xu", "Jian-Peng Dou", "Xiao-Tian Fang", "Pei-Qi Zhou", "Hao Tang", "Chang-Shun Wang", "Lin Yang", "Xian-Min Jin"], "published": "2026-09-10", "summary": "Gaussian boson sampling (GBS) has emerged as a leading photonic paradigmfor demonstrating quantum computational advantage. Nevertheless, state-ofthe-art GBS setups face practical barriers including stringent optical alignment, phase instability, and limited programmability, which impede scalable engineering deployment. The chip-scale space-time multiplexed architecturepromises to resolve these constraints, yet it strongly demands wafer-scale chipcapabilities to simultaneously satisfy stringent requirements on low loss, highprecision and high-speed modulation. Here we report the first chip-scale spacetime multiplexed GBS system, monolithically integrating high-speed electrooptic modulators, on-chip delay lines, and a time-space multiplexed interferometric network on a thin-film lithium niobate chip, operating at a 4-GHz clockrate with detection events of up to 11,059 photons within 1 millisecond. Beyond benchmarking quantum advantage, we further reconfigure the photonichardware into a GBS-powered world model for modelling physical dynamics,which achieves lower prediction error with fewer trainable readout parameters compared with a classical echo state network (ESN) baseline. Our resultsvalidate the feasibility of our endeavor towards scalable photonic quantumhardware, and pave the way for the versatile programmable applications offuture GBS quantum systems.", "pdf_url": "https://arxiv.org/pdf/2609.11922v1"}, {"title": "EVPeriscope: Extended Perception across Aerial and Ground Vehicles with Event-based Propeller Tracking", "authors": ["Dexter Ong", "Vijay Kumar", "Pratik Chaudhari"], "published": "2026-09-10", "summary": "Reliable relative localization between aerial and ground robots is a key requirement for tightly coordinated heterogeneous teams. This can be difficult to do using conventional frame-based cameras and fiducial markers because they are sensitive to motion blur, lighting variations, and payload constraints. This paper presents EVPeriscope, an event-based perception system that enables detection, localization and control of a quadrotor using an upward-facing event camera on a ground robot by detecting the high-frequency visual signature of its propellers. This system allows the quadrotor to function as an extended perception system for the ground robot when onboard sensors exhibit degradation or occlusion. We demonstrate the capabilities of this marsupial ground-aerial system via experiments in challenging field conditions with wind speeds of up to 15 mph, in both daylight and at night. We show that the system supports localization and closed-loop navigation through dense foliage where the ground robot's sensors are occluded. Our control system for the quadrotor operates at 200 Hz entirely with onboard sensing and computation. More details and experiment videos can be found on the project page: https://ongdexter.github.io/evperiscope.", "pdf_url": "https://arxiv.org/pdf/2609.11920v1"}, {"title": "MindTopo: Can Foundation Models Reason in Topological Space?", "authors": ["Yunfei Ge", "Anbang Liu", "Qineng Wang", "Johnalbert Garnica", "Jianwen Lyu", "Zihan Wang", "Reuben Tan", "Jianfeng Gao", "Ruohan Zhang", "Yining Hong", "Jiajun Wu", "Manling Li"], "published": "2026-09-10", "summary": "Spatial reasoning depends not only on metric properties such as distance, angle, and shape, but also on topological relations that remain invariant under continuous deformation. Cognitive science identifies these relations as foundational to spatial understanding, yet foundation-model evaluations largely focus on metric or viewpoint-dependent relations. We introduce MindTopo, a benchmark of topological intuition across five properties grounded in cognitive science and formal topology: continuity, separation, order, enclosure, and knots. MindTopo evaluates each property at two cognitive level
