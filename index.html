rax System<\/span><\/a> provides a specialized three-dimensional cable carrier engineered specifically for complex robotic motion.<\/p><h2>Managing High Tensile Forces With Central Steel Technology<\/h2><p>Conventional cable carriers often transfer operational movement stress directly onto internal electrical lines and hoses. The Robotrax system changes this dynamic through a central steel cable that runs through the core of every chain link.<\/p><p class=\"pull-quote\">The Robotrax system’s central steel cable absorbs the primary tensile loads and preserves conductor integrity, dramatically extending cable service life.<\/p><p>When robot arms undergo rapid directional shifts and accelerations up to 10 g, this internal steel cable absorbs the primary tensile loads. By isolating electrical and fluid lines from pulling forces, the design preserves conductor integrity and dramatically extends cable service life. Mechanics can easily calibrate and adjust system tension using an integrated clamping piece, ensuring consistent mechanical support throughout long operational cycles.<\/p><h2>Spherical Link Design and Modular Cable Routing<\/h2><p>The foundation of the Robotrax system lies in its open, single-piece plastic links featuring spherical snap-on connections on both sides. This geometry allows the carrier to flex smoothly across three axes, providing radial rotation of up to ±450 degrees per meter depending on the model size.<\/p><p>To optimize internal organization, carrier links contain up to three distinct chambers. This physical separation prevents signal interference and mechanical abrasion between heavy power lines, sensitive data channels, and fluid hoses. For standard models (R040 through R100), technicians can press cables directly into the carrier without tools, drastically reducing installation and maintenance time. Larger configurations, such as the R140X, incorporate swiveling crossbars with snap locks alongside vertical and horizontal dividers for customized interior partitioning.<\/p><h3>​ROBOTRAX System<\/h3><br /><img alt=\"Numbered diagram of a flexible robotic arm with segmented joints and components\" class=\"rm-shortcode\" id=\"4af39\" src=\"https://spectrum.ieee.org/media-library/numbered-diagram-of-a-flexible-robotic-arm-with-segmented-joints-and-components.jpg?id=67685927&amp;width=980\" /><ol style=\"margin: 16px 0 0 0;\"><li style=\"padding: 4px 4px;\">Steel cable for transferring extremely high tensile forces<\/li><li style=\"padding: 4px 4px;\">Tension piece for locking the chain links<\/li><li style=\"padding: 4px 4px;\">Type with toolless opening swivel crossbars and divider module available<\/li><li style=\"padding: 4px 4px;\">Open design<br />– Fast cable laying as the cables are simply pressed in<br />– Easy checking of all cables<\/li><li style=\"padding: 4px 4px;\">Special plastic for long service life<\/li><li style=\"padding: 4px 4px;\">Protective covers or heat shields made from different materials are available for different environmental conditions<\/li><li style=\"padding: 4px 4px;\">Quick-release bracket for fixing and continuation<\/li><li style=\"padding: 4px 4px;\">Strain relief with LineFix clamps<\/li><li style=\"padding: 4px 4px;\">Protection against hard impacts, excessive abrasion and premature wear as well as limitation of the bending radius through protector<\/li><\/ol><h2>Active Retraction and Impact Protection<\/h2><p>Large robot work envelopes and high-speed motion trajectories can cause loose cable carrier loops to swing and strike the robot body. To eliminate these destructive collisions, Tsubaki KabelSchlepp integrates the Pull Back Unit (PBU).<\/p><p>The PBU serves as an active retraction mechanism that maintains optimal tension on the cable carrier throughout the entire motion cycle. By preventing excess slack and eliminating interfering contours, the PBU minimizes collision risks across complex movement paths. The unit requires zero maintenance on its retraction element and offers standard mounting configurations for leading industrial robot platforms, including KUKA, ABB, and FANUC.<\/p><p class=\"pull-quote\">Tsubaki KabelSchlepp’s Pull Back Unit <span>maintains optimal tension on the cable carrier and minimizes collision risks across complex movement paths.<\/span><\/p><p><span><\/span><span>Additionally, external protectors can be retrofitted onto individual chain links. These durable impact shields limit the minimum bending radius to prevent over-flexing while shielding the chain body from severe external abrasion. If wear occurs, technicians simply replace the modular protector rather than the entire cable carrier assembly.<\/span><\/p><h2>Built for Demanding Industrial Environments<\/h2><p>From automotive welding cells to high-speed machining centers, Robotrax systems adapt to severe working conditions through tailored protective accessories:<\/p><ul><li><strong>Heat Shields: <\/strong>Aluminum-coated textile fiber covers protect against radiated heat, hot weld spatter, and flying sparks.<\/li><li><strong>Protective Covers: <\/strong>Coated polyester sleeves shield sensitive lines against aggressive cutting fluids, hydraulic oils, paint overspray, and abrasive dust.<\/li><li><strong>LineFix Strain Relief:<\/strong> Multi-layer clamping devices anchor cables securely at both ends to prevent axial displacement during intense motion.<\/li><\/ul>By combining central load absorption, multi-axis flexibility, and active retraction control, the Robotrax system offers plant engineers and system integrators a reliable path toward maximizing robot uptime and reducing total operational costs."}, {"title": "The Best Way to Explore Lunar Craters Is a Giant Robot Ball", "source": "IEEE Spectrum Robotics", "date": "2026-09-03", "url": "https://spectrum.ieee.org/moon-ball-robot", "summary": "<img src=\"https://spectrum.ieee.org/media-library/a-gif-of-a-spherical-robot-rolling-over-a-bumpy-path.gif?id=67701776&amp;width=1245&amp;height=700&amp;coordinates=0%2C0%2C0%2C0\" /><br /><br /><p>On a good day, the rock quarry in central Texas is about 370,000 kilometers (230,000 miles) from the moon. But last February, when Rishi Jangale watched his 1.8-meter-wide, 150-kilogram inflatable robot roll effortlessly over rocks, gravel, and wet clay, his imagination turned the quarry into the lunar surface instead.<\/p><p>Jangale is an upbeat mechanical engineer nearing the end of his Ph.D. at Texas A&amp;M University, in College Station, Texas. He and his labmates have been working on this big tan “RoboBall” for about five years. Their goal: create a vehicle capable of <a href=\"https://spectrum.ieee.org/a-jumping-robot-for-enceladus\" target=\"_blank\">exploring some of the most inaccessible terrain<\/a> in our solar system, such as the 21 km-wide Shackleton crater on the moon’s south pole.<\/p><p>The Shackleton crater is 4 km deep and contains many smaller, deeper craters within. Some parts of the crater never see the sun, and within these perpetually dark, frigid pockets lie mysterious substances that planetary scientists have long struggled to examine, including layers of ancient lunar geology and stores of frozen water that could potentially support a future lunar base.<\/p><p>“The moon is like an archive of what happened to the Earth,” says <a href=\"https://www.nhm.ac.uk/our-science/people/sara-russell.html\" rel=\"noopener noreferrer\" target=\"_blank\">Sara Russell<\/a>, a cosmic mineralogist with London’s Natural History Museum who is not involved with Texas A&amp;M’s work. “Robotic collection works brilliantly well, and it’s great to see that being explored more in this context.”<\/p><p>“NASA is not going to let astronauts get anywhere near these craters, because if someone falls in, you’re not going to be able to get them out,” Jangale says. “So we thought, what better shape to roll down a hill than a ball?” In a <a href=\"https://ieeexplore.ieee.org/document/11248963\" rel=\"noopener noreferrer\" target=\"_blank\">recent paper<\/a> published in <em><em>IEEE Transactions on Field Robotics<\/em><\/em>, Jangale’s team reports on the design of RoboBall, a hypothetical lunar mission, and the results from initial tests in the Texas quarry.<\/p><h2>Getting Rolling<\/h2><p>RoboBall is the brainchild of Jangale’s advisor, <a href=\"http://link?\" rel=\"noopener noreferrer\" target=\"_blank\">former NASA robotics engineer Robert Ambrose<\/a>, who first conceived of the design in 2003.<\/p><p>Ambrose figured that a ball could address a pesky mobility risk that robots face on lunar terrain, especially in low gravity: <a href=\"https://www.bbc.com/news/science-environment-68388695\" rel=\"noopener noreferrer\" target=\"_blank\">tipping over<\/a>. An inflatable sphere can’t tip over, and the form factor also insulates its internal components from sharp rocks, dust, and the huge temperature swings from over 93 °C in sunlit spots to minus 240 °C in the shade inside lunar craters. Ambrose imagined a wheeled rover parking at a crater’s edge and releasing a RoboBall to explore its depths. Unlike <a href=\"https://www-robotics.jpl.nasa.gov/how-we-do-it/systems/the-axel-rover/\" rel=\"noopener noreferrer\" target=\"_blank\">a small tethered rover<\/a>, the RoboBall wouldn’t roll its way back up—but with no strings attached, it would have a far greater range to collect geological samples, and then be able to launch them back to the rover outside the crater with small rockets.<\/p><p class=\"shortcode-media shortcode-media-rebelmouse-image rm-float-left rm-resized-container rm-resized-container-25\" style=\"float: left;\"> <img alt=\"A wheeled rover carrying a robotic ball up a small hill of dirt and gravel.\" class=\"rm-shortcode\" id=\"20656\" src=\"https://spectrum.ieee.org/media-library/a-wheeled-rover-carrying-a-robotic-ball-up-a-small-hill-of-dirt-and-gravel.jpg?id=67694269&amp;width=980\" /> <small class=\"image-media media-caption\">A robotic rover would ferry RoboBall across the lunar surface to the edge of a crater.<\/small><small class=\"image-media media-photo-credit\"><a href=\"https://ieeexplore.ieee.org/document/11248963\" target=\"_blank\">R. Jangale, D. Pravecek, et al.<\/a><\/small><\/p><p>NASA hasn’t brought lunar samples back to Earth in over 50 years. Some morsels of moon geology find their way to Earth as meteorites, but Russell says these lack the “gold standard” field work—context about where that sample actually came from. Even as NASA reboots its crewed moon missions, many lunar sites remain inaccessible.<\/p><p>In 2022, Ambrose’s lab finished a proof of concept, the 0.5-meter-wide RoboBall II. Creating the full-size RoboBall III then took about 11 months. “We were building these robots really quickly,” Jangale says. “Ambrose really encourages us to use and break these robots.” And designs did go awry. Jangale remembers software errors and a drivetrain that proved too weak to roll over soft bumps in initial tests.<\/p><p class=\"shortcode-media shortcode-media-youtube\"> <span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span> <small class=\"image-media media-photo-credit\"><a href=\"https://www.youtube.com/watch?v=tnj4BRuprlI\" target=\"_blank\">Texas A&amp;M RAD Lab/YouTube<\/a><\/small><\/p><h2>How to Slow Your Roll<\/h2><p>RoboBall drives by moving a pendulum within its shell, shifting its entire center of mass. On flat ground, if the pendulum’s arm points forward, the shell rolls forward to compensate, and as long as the pendulum keeps the center of mass in front of the center of the ball, RoboBall will keep rolling forward. If the pendulum leans a few degrees to the left or right, RoboBall steers left or right to match. “The robot wants to go where you point the pendulum,” Jangale says. The 340-pound ball is just soft enough to bounce lightly over bumpy obstacles, but its slight overpressure keeps it relatively firm. On steep slopes, this mechanism also lets the ball control its downhill speed by simply angling the pendulum uphill.<\/p><p>“The beauty here is the simplicity,” says Hiro Ono, an aerospace engineer who worked on robot mobility at NASA’s Jet Propulsion Lab for 13 years before joining Georgia Tech. For space robots, Ono describes simplicity in terms of the number of actuators. RoboBall has just two, and both are fully inside of the shell, shielded from environmental risk factors like dust, a feature that Ono describes as “unique.”<\/p><p>After the first quarry tests, it took about seven months for the team to design and build an upgraded RoboBall III with 2.5 times more torque—enough to fling itself over small obstacles and roll up 20 degree slopes.<\/p><p class=\"shortcode-media shortcode-media-rebelmouse-image\"> <img alt=\"Close-up of a needle-like rocket protruding from the payload bay of a large robotic ball.\" class=\"rm-shortcode\" id=\"0c74a\" src=\"https://spectrum.ieee.org/media-library/close-up-of-a-needle-like-rocket-protruding-from-the-payload-bay-of-a-large-robotic-ball.jpg?id=67694233&amp;width=980\" /> <small class=\"image-media media-caption\">A small rocket can launch out of the center of the RoboBall to return a sample back to a rover outside the crater.<\/small><small class=\"image-media media-photo-credit\"><a href=\"https://ieeexplore.ieee.org/document/11248963\" target=\"_blank\">R. Jangale, D. Pravecek, et al.<\/a><\/small><\/p><h2>Getting Mission Ready<\/h2><p>In the new paper, the remotely operated RoboBall III descended the quarry’s slopes, navigated soft terrain, and launched hypothetical payloads back out of the crater with small rockets. Powered by a large battery, the robot would inflate itself during a lunar mission and charge up from a robotic rover at the edge of a crater before heading out on its own.<\/p><p>RoboBall is probably not the right platform for all kinds of missions—its slightly bumbling nature means that it’s not ideal if you want to collect a sample from a very specific rock, for example. For now, the team hopes to work with scientists designing lunar science instruments to physically fit into RoboBall’s carry-on-luggage-size interior, while also fitting in with how RoboBall operates. “The robot is not the mission,” Jangale says. “The robot is a way for you to complete the mission.”<\/p><p>The current version of RoboBall cost roughly $250,000 to build, but is not quite ready for the moon in its current form. While its gold-treated aluminum parts are appropriate for space missions, its other materials are not. Space-grade electronics will cost more, and the ball’s shell—made from a material tough enough to roll over steel shards and withstand minus 184 °C temperatures—has never been evaluated in lunar extremes. Aside from materials questions, the team plans to engineer the ball to adapt how it drives on varying slopes autonomously. They also hope to collaborate with government agencies or spaceflight contractors to keep refining the robot’s design for a real, <a href=\"https://spectrum.ieee.org/moon-landing-2025\" target=\"_blank\">eventual mission<\/a>.<\/p><p>Later this year, Texas A&amp;M will open <a href=\"https://space.tamu.edu/institute/facility/\" target=\"_blank\">a new facility<\/a> in Houston with the world’s largest indoor simulated moon and Mars landscapes. The facility is only 190 km from Jangale’s quarry. It’s still about 370,000 km from the moon, but it’s going to help Jangale get his robot quite a bit closer.<\/p>"}, {"title": "JAKA hits Teradyne Robotics back over patent dispute", "source": "Robotics Business Review", "date": "2026-09-03", "url": "https://www.therobotreport.com/jaka-hits-teradyne-robotics-back-over-patent-dispute/", "summary": "<p>JAKA is now taking legal action against Teradyne Robotics to end public dissemination of statements it considers \"false, misleading and damaging.\"<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/jaka-hits-teradyne-robotics-back-over-patent-dispute/\">JAKA hits Teradyne Robotics back over patent dispute<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "NVIDIA plans to acquire Hugging Face and keep AI development platform open", "source": "Robotics Business Review", "date": "2026-09-03", "url": "https://www.therobotreport.com/nvidia-to-acquire-hugging-face-and-keep-ai-develpment-platform-open/", "summary": "<p>NVIDIA is already a major model contributor to Hugging Face, which recently surpassed 1 million datasets.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/nvidia-to-acquire-hugging-face-and-keep-ai-develpment-platform-open/\">NVIDIA plans to acquire Hugging Face and keep AI development platform open<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Medtronic invests $700M in surgical partner Cornerstone Robotics", "source": "Robotics Business Review", "date": "2026-09-03", "url": "https://www.therobotreport.com/medtronic-invests-700m-in-surgical-partner-cornerstone-robotics/", "summary": "<p>Medtronic and Cornerstone Robotics are building a multi-port portfolio anchored by the Hugo surgical system and expanded by Sentire.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/medtronic-invests-700m-in-surgical-partner-cornerstone-robotics/\">Medtronic invests $700M in surgical partner Cornerstone Robotics<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Learn why food is physical AI’s hardest problem at RoboBusiness", "source": "Robotics Business Review", "date": "2026-09-02", "url": "https://www.therobotreport.com/learn-why-food-is-physical-ai-hardest-problem-chef-robotics-robobusiness/", "summary": "<p>Rajat Bhageria, the founder and CEO of Chef Robotics, will explore what makes food such a demanding benchmark for physical AI.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/learn-why-food-is-physical-ai-hardest-problem-chef-robotics-robobusiness/\">Learn why food is physical AI&#8217;s hardest problem at RoboBusiness<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "AIR to use Elmo Motion Control technology in uncrewed cargo aircraft", "source": "Robotics Business Review", "date": "2026-09-02", "url": "https://www.therobotreport.com/air-uses-elmo-motion-control-technology-in-uncrewed-cargo-aircraft/", "summary": "<p>The partnership brings together Elmo's compact, high-power density servo drives and AIR's electric aviation design.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/air-uses-elmo-motion-control-technology-in-uncrewed-cargo-aircraft/\">AIR to use Elmo Motion Control technology in uncrewed cargo aircraft<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "NexCOBOT discusses physical AI market hurdles and acceleration", "source": "Robotics Business Review", "date": "2026-09-02", "url": "https://www.therobotreport.com/nexcobot-discusses-physical-ai-market-hurdles-and-acceleration/", "summary": "<p>NexCOBOT, which provides functional safety and motion controllers, discusses how physical AI benefits from 'Big Tech' and where it will grow.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/nexcobot-discusses-physical-ai-market-hurdles-and-acceleration/\">NexCOBOT discusses physical AI market hurdles and acceleration<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "The Missing Layer in Robot Safety Assurance", "source": "Robotics Business Review", "date": "2026-09-01", "url": "https://www.therobotreport.com/the-missing-layer-in-robot-safety-assurance/", "summary": "<p>Why robot safety assurance must account for attacks that can change how a machine sees, decides, and acts.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/the-missing-layer-in-robot-safety-assurance/\">The Missing Layer in Robot Safety Assurance<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "HowToRobot and Robotics Australia Group partner on platform to encourage robot adoption", "source": "Robotics Business Review", "date": "2026-09-01", "url": "https://www.therobotreport.com/howtorobot-robotics-australia-group-partner-platform-encourage-robot-adoption/", "summary": "<p>The initiative is intended to help businesses in Australia identify automation opportunities, test them, and connect with local suppliers.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/howtorobot-robotics-australia-group-partner-platform-encourage-robot-adoption/\">HowToRobot and Robotics Australia Group partner on platform to encourage robot adoption<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "From spreadsheets to AI: Deere gives farmers new features in Operations Center, JD", "source": "The Robot Report", "date": "2026-09-01", "url": "https://www.therobotreport.com/from-spreadsheets-ai-john-deeres-new-jd-operations-center-features/", "summary": "<p>John Deere has launched JD, an AI tool that turns historical farm data into actionable insights to boost profitability.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/from-spreadsheets-ai-john-deeres-new-jd-operations-center-features/\">From spreadsheets to AI: Deere gives farmers new features in Operations Center, JD<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Learn how physical AI is being used to do real work at RoboBusiness", "source": "Robotics Business Review", "date": "2026-09-01", "url": "https://www.therobotreport.com/learn-how-physical-ai-is-being-used-to-do-real-work-at-robobusiness/", "summary": "<p>Leaders at Amazon Robotics, Teradyne Robotics, and Cobot will discuss how they're applying physical AI to robots operating in customer environments.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/learn-how-physical-ai-is-being-used-to-do-real-work-at-robobusiness/\">Learn how physical AI is being used to do real work at RoboBusiness<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Visko launches Orbis live model and closes pre-seed funding round", "source": "Robotics Business Review", "date": "2026-09-01", "url": "https://www.therobotreport.com/visko-launches-orbis-live-model-closes-pre-seed-funding-round/", "summary": "<p>Visko says Orbis streams 4K video at 24 frames per second, responds to user intervention, and sustains hour-scale generation without drift.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/visko-launches-orbis-live-model-closes-pre-seed-funding-round/\">Visko launches Orbis live model and closes pre-seed funding round<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Top 10 robotics stories of August 2026", "source": "Robotics Business Review", "date": "2026-09-01", "url": "https://www.therobotreport.com/top-10-robotics-stories-of-august-2026/", "summary": "<p>August 2026's top 10 stories included large funding rounds, updates in the humanoid robot industry, and the latest physical AI models. <\/p>\n<p>The post <a href=\"https://www.therobotreport.com/top-10-robotics-stories-of-august-2026/\">Top 10 robotics stories of August 2026<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Early bird pricing for RoboBusiness 2026 ends August 31", "source": "Robotics Business Review", "date": "2026-08-31", "url": "https://www.therobotreport.com/early-bird-pricing-for-robobusiness-2026-ends-august-31/", "summary": "<p>Early bird pricing for RoboBusiness 2026, which saves attendees $200 on full conference passes, will end Aug. 31.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/early-bird-pricing-for-robobusiness-2026-ends-august-31/\">Early bird pricing for RoboBusiness 2026 ends August 31<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Skild AI unveils S1 flagship robot foundation model", "source": "Robotics Business Review", "date": "2026-08-31", "url": "https://www.therobotreport.com/skild-ai-unveils-s1-flagship-robot-foundation-model/", "summary": "<p>Skild AI says its S1 robot foundation model enables robots to learn new tasks just by seeing a video of it being performed.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/skild-ai-unveils-s1-flagship-robot-foundation-model/\">Skild AI unveils S1 flagship robot foundation model<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "How better grippers can unlock physical AI", "source": "Robotics Business Review", "date": "2026-08-31", "url": "https://www.therobotreport.com/how-better-grippers-can-unlock-physical-ai/", "summary": "<p>Physical AI depends on smarter grippers to give robots the dexterity, sensing and adaptability needed to handle real-world tasks.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/how-better-grippers-can-unlock-physical-ai/\">How better grippers can unlock physical AI<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Reframe Systems raises $40M to scale its robotic microfactories for home building", "source": "Robotics Business Review", "date": "2026-08-31", "url": "https://www.therobotreport.com/reframe-systems-raises-40m-scale-robotic-microfactories-home-building/", "summary": "<p>Reframe Systems aims to build a network of automated microfactories near communities where homes are needed.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/reframe-systems-raises-40m-scale-robotic-microfactories-home-building/\">Reframe Systems raises $40M to scale its robotic microfactories for home building<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "The edge AI wall: Why embodied AI requires new mathematics", "source": "Robotics Business Review", "date": "2026-08-30", "url": "https://www.therobotreport.com/edge-ai-wall-why-embodied-ai-requires-new-mathematics/", "summary": "<p>Computational overload is not a bug of a specific planner, but an edge AI wall limiting physical and embodied AI.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/edge-ai-wall-why-embodied-ai-requires-new-mathematics/\">The edge AI wall: Why embodied AI requires new mathematics<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "The differences between decentralized and centralized power in swarm robotics", "source": "Robotics Business Review", "date": "2026-08-29", "url": "https://www.therobotreport.com/differences-between-decentralized-centralized-power-swarm-robotics/", "summary": "<p>A robotic swarm typically relies on centralized or decentralized power management, but a hybrid approach could offer the best of both.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/differences-between-decentralized-centralized-power-swarm-robotics/\">The differences between decentralized and centralized power in swarm robotics<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Video Friday: Meet Microduck", "source": "IEEE Spectrum Robotics", "date": "2026-08-28", "url": "https://spectrum.ieee.org/video-friday-microduck-robot", "summary": "<img src=\"https://spectrum.ieee.org/media-library/colorful-desk-robots-posed-among-books-beside-an-open-laptop-in-an-office.png?id=67687638&amp;width=1245&amp;height=700&amp;coordinates=101%2C0%2C101%2C0\" /><br /><br /><p><span>Video Friday is your weekly selection of awesome robotics videos, collected by your friends at <\/span><em>IEEE Spectrum<\/em><span> robotics. We also post a weekly calendar of upcoming robotics events for the next few months. Please <\/span><a href=\"mailto:automaton@ieee.org?subject=Robotics%20event%20suggestion%20for%20Video%20Friday\">send us your events<\/a><span> for inclusion.<\/span><\/p><h5><a href=\"https://humanoidssummit.com/\">Humanoids Summit Seoul<\/a>: 22–23 September 2026, SEOUL<\/h5><h5><a href=\"https://2026.ieee-iros.org/\">IROS 2026<\/a>: 27 September–1 October 2026, PITTSBURGH<\/h5><h5><a href=\"https://www.corl.org/\">CoRL 2026<\/a>: 9–12 November 2026, AUSTIN, TEXAS<\/h5><p>Enjoy today’s videos!<\/p><div class=\"horizontal-rule\"><\/div><div><span style=\"display: none;\"> <\/span><\/div><p class=\"rm-anchors\" id=\"ratzeygbgfu\">Nvidia just paid US $12.9 billion for the company that acquired Pollen Robotics, and this must be why.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><blockquote>Meet Microduck. 🦆 The 25-centimeter, 780-gram robot that waddles, falls, gets back up, and learns new tricks.<br /><br />Packed inside: 15 degrees of freedom, a front camera, an 8x8 lidar, two IMUs, mics, a speaker, NFC, Wi-Fi, and Bluetooth.<br /><br />Out of the box, Microduck already walks, sits, crouches, roller skates, picks up objects with its articulated beak, and recovers from falls on its own. Drive it with a game controller, plug-in accessories, and NFC tagged objects, run autonomous behaviors, or gather several Microducks for races and football. <br /><br />Software fully open source. Ready for whatever you throw at it.<\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"> <span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p><span>On pre-order for an astonishingly low $399, and ships before Christmas.<\/span><\/p><p>[ <a href=\"https://pollen-robotics.com/microduck/\">Microduck<\/a> ]<\/p><p>Thanks, Matthieu!<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"tbgy6brdxqu\">If you’ve chosen to ignore all the earlier <a href=\"https://spectrum.ieee.org/video-friday-darpa-heavy-lift-challenge\" target=\"_blank\">DARPA Lift Challenge<\/a> videos that we’ve posted, now you can get all caught up in about five minutes.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.darpa.mil/research/challenges/lift\">DARPA<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"uzv-96uhiqc\">You had me at “54-gram robot that out-jumps a kangaroo.”<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://ieeexplore.ieee.org/document/11553415\"><em>IEEE Transactions on Robotics<\/em><\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"vwen7knkzk4\">Sometimes, you just need a video like this.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><blockquote><em>Most fish-inspired robots are built for one size and one job, so scaling them up or down usually means starting from scratch. A team of engineers says it has found a way to solve that problem. They’ve unveiled ScaFi, a robot modeled on fish like cod and mackerel.<\/em><\/blockquote><p>[ <a href=\"https://engineering.nyu.edu/news/robot-grows-fish-not-machine\">New York University<\/a> ]<\/p><p>Thanks, Leah!<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"8qlvfdpz4qq\">Martin writes, “We’re a small robotics team in Czechia, Europe, building practical hardware around the <a href=\"https://spectrum.ieee.org/unitree-g1\" target=\"_blank\">Unitree G1<\/a>. Here’s a short demo of our lightweight gripper picking up a strawberry; the gripper weighs under 200 grams and is designed for simple, sensitive manipulation without adding a complex multifinger hand.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://sentiorobotix.com/gripper\">Sentio Robotix<\/a> ]<\/p><p>Thanks, Martin!<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"3kzjnb42dnm\">Hybrid visual markers that are useful for both cameras and lidar is a neat idea.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://binitshah.github.io/blog/stretch-4-autodocking/\">Hello Robot<\/a> ]<\/p><p>Thanks, Binit!<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"j_rrgxeaxfc\"><em>EmoLo brings emotion-inspired expressive locomotion to Open Duck Mini V2, a low-cost, open-source bipedal robot inspired by Disney’s BDX droids. With a single reinforcement learning policy, the robot can generate distinct walking styles associated with different emotional expressions, showing how characterful and expressive whole-body motion can be achieved on an accessible robotic platform.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://mertcookimg.github.io/emolo/\">EmoLo<\/a> ]<\/p><p>Thanks, Masato!<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"3c2s1zhuvum\">If it’s possible for a robot with a completely immobile face to look frustrated, this robot absolutely does, starting at three minutes into this video.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://elib.dlr.de/218609/\">DLR RM<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"zvumtotghu0\"><em>Noble Machines deployed its first general-purpose robots to a Fortune Global 500 industrial customer within 18 months of the company’s launch and met its first delivery milestone, made possible by its AI-driven whole-body control and industry-leading end-to-end autonomy.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.businesswire.com/news/home/20260303533339/en/Noble-Machines-Emerges-from-Stealth-Ships-and-Deploys-General-Purpose-Robots-for-Industrys-Toughest-Jobs\">Noble Machines<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"u3hru7dacvy\"><em>We’ve reduced the time it takes to go from physical prompt → robot behavior. The faster anyone can teach a robot to do something new, the easier it becomes to scale physical work.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://generalistai.com/blog/gen-1.5\">Generalist<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"3hrjrztzkni\">I know this video is mostly a gimmick, but I would totally rent a moderately heavy lift quadruped for a couple of days to help with a move.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.deeprobotics.cn/en\">DEEP Robotics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"4u52yao8g3a\">Is taking two minutes to excellently fold a shirt too long, or do we even care how long it takes, as long as it’s a robot doing it?<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://robotics.tokyo/\">Tokyo Robotics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"npovvg-8yoe\"><em>TRON 2 × Wuji Hand 2 handles TCM pharmacy work: picking, weighing, grinding, and packaging. The omnidirectional base frees the hands, while precise gripping and dual-arm force control enable midair operations.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.limxdynamics.com/en\">LimX Dynamics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"forsxxxit4i\">Person who genuinely knows things about robots, Christian Hubicki, explains everything about robots smashing into walls.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.christianhubicki.com/\">Christian Hubicki<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div>"}, {"title": "EXL acquires physical AI model developer iMerit", "source": "Robotics Business Review", "date": "2026-08-28", "url": "https://www.therobotreport.com/exl-acquires-physical-ai-model-developer-imerit/", "summary": "<p>The EXL and iMerit executives explain how their companies' combined expertise and platforms will help developers with reliable physical AI.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/exl-acquires-physical-ai-model-developer-imerit/\">EXL acquires physical AI model developer iMerit<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "How Locus Robotics is getting a grasp on one of robotics biggest challenges: manipulation", "source": "Robotics Business Review", "date": "2026-08-28", "url": "https://www.therobotreport.com/locus-getting-grasp-one-robotics-biggest-challenges-manipulation/", "summary": "<p>Locus Robotics recently acquired Nexera Robotics, which create unique soft picking technology, bolstering its manipulation capabilities.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/locus-getting-grasp-one-robotics-biggest-challenges-manipulation/\">How Locus Robotics is getting a grasp on one of robotics biggest challenges: manipulation<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "From teach and repeat to SelfPath AI: The next robotics leap", "source": "Robotics Business Review", "date": "2026-08-28", "url": "https://www.therobotreport.com/from-teach-repeat-to-selfpath-ai-next-robotics-leap/", "summary": "<p>John Black, chief technology officer at Brian Corp, shares insights on how to build trust for robotics fleets and AI.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/from-teach-repeat-to-selfpath-ai-next-robotics-leap/\">From teach and repeat to SelfPath AI: The next robotics leap<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Deere faces headwinds in Q3 update and announces Reservoir R&D partnership", "source": "Robotics Business Review", "date": "2026-08-28", "url": "https://www.therobotreport.com/deere-faces-headwinds-in-q3-update-and-announces-10m-reservoir-rd-partnership/", "summary": "<p>Deere beats Q3 expectations, raises guidance, and partners with Reservoir on a $10 million agtech AI initiative.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/deere-faces-headwinds-in-q3-update-and-announces-10m-reservoir-rd-partnership/\">Deere faces headwinds in Q3 update and announces Reservoir R&#038;D partnership<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Teradyne Robotics ramps up fight against cobot copycats", "source": "Robotics Business Review", "date": "2026-08-27", "url": "https://www.therobotreport.com/teradyne-robotics-sues-another-chinese-cobot-maker/", "summary": "<p>Teradyne Robotics sued cobot maker JAKA over alleged patent infringement, marking its second battle with a Chinese cobot company in 2026.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/teradyne-robotics-sues-another-chinese-cobot-maker/\">Teradyne Robotics ramps up fight against cobot copycats<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "NSF to invest $90M into three new technology centers, including one focused on robotics", "source": "Robotics Business Review", "date": "2026-08-27", "url": "https://www.therobotreport.com/nsf-invests-90m-three-new-technology-centers-including-one-focused-robotics/", "summary": "<p>One of the new NSF funded centers will be the Center for Human and Robot Co-Adaptation, led by The University of Texas at Austin.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/nsf-invests-90m-three-new-technology-centers-including-one-focused-robotics/\">NSF to invest $90M into three new technology centers, including one focused on robotics<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Carbon Robotics partners with iMerit to power instant in-field AI customization", "source": "Robotics Business Review", "date": "2026-08-27", "url": "https://www.therobotreport.com/carbon-robotics-partners-with-imerit-to-power-instant-in-field-ai-customization/", "summary": "<p>Carbon Robotics introduced a plant foundation AI model and tractor kit, enabling farmers to customize laser weeding.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/carbon-robotics-partners-with-imerit-to-power-instant-in-field-ai-customization/\">Carbon Robotics partners with iMerit to power instant in-field AI customization<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Bedrock Robotics’ first operator-free excavator deployments take off", "source": "Robotics Business Review", "date": "2026-08-26", "url": "https://www.therobotreport.com/bedrock-robotics-first-operator-free-excavator-deployments-take-off/", "summary": "<p>Bedrock Robotics deploys autonomous excavators to active job sites, tackling construction labor shortages with AI-powered heavy machinery.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/bedrock-robotics-first-operator-free-excavator-deployments-take-off/\">Bedrock Robotics&#8217; first operator-free excavator deployments take off<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "IDS Imaging adds Nion ToF sensor to its portfolio of 3D cameras", "source": "Robotics Business Review", "date": "2026-08-26", "url": "https://www.therobotreport.com/ids-imaging-adds-nion-tof-camera-portfolio-3d-cameras/", "summary": "<p>IDS said Nion is suitable for applications where precise 3D data is required at real-world process speeds, such as logistics and robotics. <\/p>\n<p>The post <a href=\"https://www.therobotreport.com/ids-imaging-adds-nion-tof-camera-portfolio-3d-cameras/\">IDS Imaging adds Nion ToF sensor to its portfolio of 3D cameras<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Gatik brings in $200M to continue expanding autonomous trucking operations", "source": "Robotics Business Review", "date": "2026-08-26", "url": "https://www.therobotreport.com/gatik-brings-in-200m-to-continue-expanding-autonomous-trucking-operations/", "summary": "<p>Gatik said the funding will help it expand its model built around high-frequency regional routes connecting distribution centers and stores.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/gatik-brings-in-200m-to-continue-expanding-autonomous-trucking-operations/\">Gatik brings in $200M to continue expanding autonomous trucking operations<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "AI Companion Robots Are Closing the Human Connection in Modern Homes", "source": "IEEE Spectrum Robotics", "date": "2026-08-25", "url": "https://spectrum.ieee.org/ollobot-ai-companion-robot", "summary": "<img src=\"https://spectrum.ieee.org/media-library/cute-home-robot-on-carpet-in-cozy-living-room-with-beige-sofa-and-warm-lighting.jpg?id=67154308&amp;width=1245&amp;height=700&amp;coordinates=0%2C260%2C0%2C261\" /><br /><br /><p><em>This article is brought to you by <a href=\"https://ollobot.com/\" target=\"_blank\">Ollobot<\/a>.<\/em><\/p><p>From about 2017, individuals began to truly connect with the initial wave of companion robots. These devices had personality, moved around, joked, and answered when you spoke to them. Most early companion robots, however, were still limited by simple voice-command interactions and narrow functionality. Once the novelty wore off, many ended up sitting unused on shelves. As some of those companies went out of business and turned off their servers, many owners likened it to losing a pet.<\/p><p>What Ollobot describes as “gentle intelligence” is a useful way to think about where the serious work in this category is going. Not toward more powerful assistants, but toward more present ones.<\/p><h2><a target=\"_blank\"><\/a>The problem companion robots were trying to solve<strong><\/strong><\/h2><p>Loneliness is not a niche issue. According to one <a href=\"https://pmc.ncbi.nlm.nih.gov/articles/PMC9957792/\" target=\"_blank\">study<\/a>, nearly one out of three elderly adults resides alone, meaning they do not have daily companions. <a href=\"https://pubmed.ncbi.nlm.nih.gov/20533912/\" target=\"_blank\">Research<\/a> also shows that children whose parents have migrated for work, leaving them in the care of relatives, were 2.5 times more likely to experience loneliness than children whose parents remain with them. Among working adults living alone in urban environments, similar <a href=\"https://pmc.ncbi.nlm.nih.gov/articles/PMC6530780/\" target=\"_blank\">patterns<\/a> of social isolation emerge, even if they are less visible.<\/p><p>Over the years, technology has time and again attempted to solve this problem via video calls, smart speakers, and messaging apps without much success. Those tools are geared towards communication between people that already have relationships. They do not create presence. They schedule it. That is the gap that a new generation of AI companion robots is being engineered to fill.<\/p><h2><a target=\"_blank\"><\/a>Today’s AI robots are different<strong><\/strong><\/h2><p>Today’s companion robots are not just cute and cuddly. They are designed with psychological research, clinical insight and long-term interaction models to be truly useful in real homes.<\/p><p>Three fundamental shifts define the current generation:<\/p><ol><li><strong>From reactive to proactive response. <\/strong>Older robots relied on you speaking to them, but modern robots monitor a room with cameras, microphones, and surroundings sensors to initiate interactions without your input, and they can pick up on your emotions.<\/li><li><strong>From function-oriented to emotion-oriented design.<\/strong> The original pitch for companion robots was about what they could do. The question driving the serious work now is how they make you feel, which is a harder engineering problem and a more honest framing of what the product is actually for.<\/li><li><strong>From standalone hardware to connected ecosystems.<\/strong> Leading brands are creating platforms rather than devices with software included as a built-in layer and remote access from the beginning.<\/li><\/ol><p>The <a href=\"https://www.grandviewresearch.com/industry-analysis/ai-companion-market-report?__cf_chl_f_tk=xJq0xhwCGb6n830sK3lMN.cyk2m73bms6.RauBufPho-1783406928-1.0.1.1-TsUMt2nxUgZ5nDX79zhxxVYkTv9xk2r_.E2rbXRHByA\" target=\"_blank\">global AI companion market<\/a> size was valued at US $36.8 billion in 2025 and is projected to grow from $48 billion in 2026 to $318 billion by 2033, at a compound annual growth rate of 31 percent from 2026 to 2033.<em><span><br /><\/span><\/em><\/p><h2><a target=\"_blank\"><\/a>Three household scenarios and interaction models<strong><\/strong><\/h2><p>Ollobot’s advanced AI family companion robot <a href=\"https://ollobot.com/\" target=\"_blank\"><span>OlloNi SS1<\/span><\/a> addresses a number of gaps in what existing technology offers.<\/p><p><strong>Elderly individuals living alone.<\/strong> The combination of proactive interaction, fall detection, and persistent presence addresses both safety and companionship without the social overhead of asking family members to check in more frequently.<\/p><p><strong>Children in households where parents work far from home.<\/strong> The SS1 functions as a consistent companion that already knows a child, their preferences, their moods, and their routines. The remote connection features allow parents to stay present without requiring a scheduled call, and the life recording system gives them a passive window into their child’s days that feels less clinical than a monitoring camera.<\/p><p><strong>Single professionals living alone in cities.<\/strong> The SS1 adapts to daily routines, builds up a preference model over time, and provides ambient social presence without demands.<\/p><p class=\"shortcode-media shortcode-media-rebelmouse-image\"> <img alt=\"Cute home robot with a purple cover and cartoon face displayed on its screen.\" class=\"rm-shortcode\" id=\"8d48b\" src=\"https://spectrum.ieee.org/media-library/cute-home-robot-with-a-purple-cover-and-cartoon-face-displayed-on-its-screen.jpg?id=67154351&amp;width=980\" /> <small class=\"image-media media-caption\">OlloNi SS1 adapts to daily routines over time.<\/small><small class=\"image-media media-photo-credit\">Ollobot<\/small><\/p><h2>What OlloNi SS1 is doing differently?<\/h2><p>Ollobot’s goal in building intelligent companion robots is to address the gaps in technology and capability, using innovation not to automate tasks but to fill emotional voids.<\/p><p>Much of the robotics industry has historically pursued human imitation — machines that speak, look, or behave like people. The SS1 is instead designed around familiarity and long-term coexistence rather than realism.<\/p><p>The system integrates multiple subsystems operating in parallel, including visual perception, audio processing, mobility control, and interaction management. It is equipped with a multi-chip AI 4K vision module capable of facial recognition and motion tracking. One small but revealing detail is the inclusion of a physical privacy cover for the camera — a mechanical solution to concerns that software settings alone may not fully resolve.<\/p><p class=\"shortcode-media shortcode-media-rebelmouse-image\"> <img alt=\"Person playing with a red plush robot toy that has a glowing digital face and eyes\" class=\"rm-shortcode\" id=\"daa03\" src=\"https://spectrum.ieee.org/media-library/person-playing-with-a-red-plush-robot-toy-that-has-a-glowing-digital-face-and-eyes.jpg?id=67154349&amp;width=980\" /> <small class=\"image-media media-caption\">OlloNi SS1 can actively integrate into family activities, and it can autonomously move closer to capture memorable moments or reposition itself to remain engaged in ongoing interactions.<\/small><small class=\"image-media media-photo-credit\">Ollobot<\/small><\/p><p><span>The robot supports advanced mobility across multiple indoor surfaces, including wooden floors, ceramic tiles, and low-pile carpets, with slope climbing capability up to 3.5 degrees. Rather than remaining in a fixed location, it can move naturally throughout the home to stay close to household members as daily activities unfold. <\/span><\/p><p><span>For example, the OlloNi SS1 may greet family members when they arrive home, follow an older adult from the living room to the kitchen while continuing a conversation, remind a child to take a study break after a prolonged period of inactivity, or notice that someone appears unusually quiet and gently check in. During family activities, it can autonomously move closer to capture memorable moments or reposition itself to remain engaged in ongoing interactions.<\/span><\/p><p class=\"pull-quote\">The robot continues to evolve over time, with over-the-air updates that deliver new features, performance improvements, and AI enhancements<\/p><p>It also incorporates fall detection with optimized accuracy for safety monitoring scenarios. A 6-microphone array enables omnidirectional voice pickup with an effective voice capture range of up to 5 meters, supporting reliable wake-word detection and far-field interaction.<\/p><p>To support continuous companionship, much of the robot’s AI processing takes place directly on the device through its “heart module” architecture, with 16 GB of memory and 64 GB of local storage. This enables the system to retain household memories, recognize familiar faces, and respond with lower latency, making interactions feel more natural even during everyday routines.<\/p><p>Because companion robots are expected to remain available throughout the day rather than only during brief interactions, the SS1 is designed for extended operation, offering up to 12 hours of standby time and around 5 hours of active interaction on a single charge. This allows it to accompany users through meals, conversations, playtime, and other daily activities without frequent interruptions.<\/p><p class=\"shortcode-media shortcode-media-rebelmouse-image\"> <img alt=\"Close-up of toy robot with glowing red heart and purple fur on a beige body.\" class=\"rm-shortcode\" id=\"0261b\" src=\"https://spectrum.ieee.org/media-library/close-up-of-toy-robot-with-glowing-red-heart-and-purple-fur-on-a-beige-body.jpg?id=67154317&amp;width=980\" /> <small class=\"image-media media-caption\">To support engaging interactions, much of the robot’s AI processing takes place directly on the device through its “heart module” architecture.<\/small><small class=\"image-media media-photo-credit\">Ollobot<\/small><\/p><p><span>Like the relationships it is designed to build, the robot continues to evolve over time. Running on Android OS with over-the-air (OTA) updates, the system continuously receives new features, performance improvements, and AI enhancements, allowing its capabilities to grow alongside the household it serves.<\/span><\/p><p>The robot’s behavioral model also improves over time. Rather than reacting to isolated commands, it attempts to establish a baseline understanding of household routines and individuals. Changes in behavior — prolonged quietness, unusual inactivity, or emotional cues — become triggers for interaction.<\/p><h2>Presence instead of utility<\/h2><p>Several features in the OlloNi SS1 illustrate this emphasis on presence and continuity in its interactions.<\/p><p>The system can identify different household members, including pets, and adapt responses accordingly. Remote communication features allow family members to connect through the device without treating every interaction like a scheduled call. Environmental sensors support contextual reminders tied to weather or room conditions.<\/p><p>Its “2+1” multi-display configuration is also designed around emotional communication. Two circular side displays function as expressive “emotional eyes,” while a separate primary display handles information and structured interaction. The separation allows emotional signaling and functional communication to operate independently, creating more intuitive nonverbal interaction even when no dialogue is taking place.<\/p><p class=\"shortcode-media shortcode-media-rebelmouse-image\"> <img alt=\"Cute red robot pet in checkered shirt sits on rug in cozy, warmly lit living room\" class=\"rm-shortcode\" id=\"5f2a7\" src=\"https://spectrum.ieee.org/media-library/cute-red-robot-pet-in-checkered-shirt-sits-on-rug-in-cozy-warmly-lit-living-room.jpg?id=67154312&amp;width=980\" /> <small class=\"image-media media-caption\">The robot’s behavioral model improves over time. Rather than reacting to isolated commands, it attempts to establish a baseline understanding of household routines and individuals.<\/small><small class=\"image-media media-photo-credit\">Ollobot<\/small><\/p><p>The SS1 also includes an automated life-recording system built on facial recognition and behavioral-event detection that can capture moments such as laughter, physical closeness, or group interaction automatically. An integrated AI vlog engine can then organize those moments into edited short-form videos with automated sequencing and soundtrack generation. The design intent is to preserve spontaneous domestic moments without requiring active documentation behavior from users.<\/p><p class=\"pull-quote\">An integrated AI vlog engine can<span> organize recorded<\/span><span> moments into edited short-form videos with automated sequencing and soundtrack generation<\/span><\/p><p>Visual data is processed primarily on the device through the SS1’s on-device AI architecture, with household memories stored locally and managed within Ollobot’s proprietary ecosystem instead of being shared with third-party smart home platforms. Access to recordings and live feeds is restricted to authorized users through the companion app, while encrypted communication helps protect data during remote access. Users also retain direct control over recording preferences, and the physical camera privacy cover provides an additional hardware-level safeguard whenever visual monitoring is not desired.<\/p><div class=\"ieee-sidebar-small\"><p class=\"shortcode-media shortcode-media-rebelmouse-image rm-float-left rm-resized-container rm-resized-container-25\" style=\"float: left;\"> <img alt=\"Ollobot logo with circular icon and bold lowercase text on light background\" class=\"rm-shortcode\" id=\"8eca7\" src=\"https://spectrum.ieee.org/media-library/ollobot-logo-with-circular-icon-and-bold-lowercase-text-on-light-background.png?id=67154360&amp;width=980\" /><\/p><p>Learn more at <a href=\"https://ollobot.com/\" target=\"_blank\">ollobot.com<\/a>.<\/p><\/div><p>Remote communication is similarly structured around persistence rather than transaction. Traditional video calls are episodic and screen-bound; the SS1 instead acts as a continuously present interface embedded inside the household environment. Through autonomous mobility, environmental awareness, and persistent household memory, remote family members interact with an ongoing domestic context.<\/p><h2><a target=\"_blank\"><\/a>The larger shift to “gentle intelligence”<\/h2><p>Ultimately, gentle intelligence is not about making robots behave more like humans — it is about helping them fit more naturally into human lives. Each OlloNi SS1 unit develops a unique behavioral profile based on its household. Two units running in different homes for a year will have become meaningfully different from each other, shaped by the specific people, habits, and rhythms of where they live.<\/p><p>That kind of long-term personalization is what early companion robots never had. It is also what makes the difference between a product that ends up on a shelf and one that actually earns its place in a home.<\/p><p>Learn more at <a href=\"https://ollobot.com\" target=\"_blank\">ollobot.com<\/a>.<\/p>"}, {"title": "Humans in the loop are still needed for robotaxi fleet safety, says Guident", "source": "Robotics Business Review", "date": "2026-08-25", "url": "https://www.therobotreport.com/humans-loop-are-still-needed-robotaxi-fleet-safety-says-guident/", "summary": "<p>As fleets of autonomous vehicles scale, AI and human oversight remain critical for safety, explains Guident's CEO.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/humans-loop-are-still-needed-robotaxi-fleet-safety-says-guident/\">Humans in the loop are still needed for robotaxi fleet safety, says Guident<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Jetson Orin Nano 2 doubles inference performance for robotics on the edge, says NVIDIA", "source": "Robotics Business Review", "date": "2026-08-25", "url": "https://www.therobotreport.com/jetson-orin-nano-2-doubles-inference-performance-robotics-edge-says-nvidia/", "summary": "<p>With Jetson Orin Nano 2, NVIDIA says that frontier intelligence has reached the edge and can now run in real time.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/jetson-orin-nano-2-doubles-inference-performance-robotics-edge-says-nvidia/\">Jetson Orin Nano 2 doubles inference performance for robotics on the edge, says NVIDIA<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "XPeng Motors humanoid robot unit Dogotix raises $900M", "source": "Robotics Business Review", "date": "2026-08-24", "url": "https://www.therobotreport.com/xpeng-motors-humanoid-robot-unit-dogotix-raises-900m/", "summary": "<p>Dogotix, the humanoid unit of XPeng Motors, has attained a valuation of $6.3 billion as it plans to produce robots at scale.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/xpeng-motors-humanoid-robot-unit-dogotix-raises-900m/\">XPeng Motors humanoid robot unit Dogotix raises $900M<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "The next big AI play isn’t apps or humanoids; it’s machines with brains and brawn", "source": "Robotics Business Review", "date": "2026-08-24", "url": "https://www.therobotreport.com/the-next-big-ai-play-isnt-apps-or-humanoids-its-machines-with-brains-and-brawn/", "summary": "<p>For agricultural and construction equipment makers to stay relevant as workforces dwindle, they need to add AI, says Agtonomy's founder.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/the-next-big-ai-play-isnt-apps-or-humanoids-its-machines-with-brains-and-brawn/\">The next big AI play isn&#8217;t apps or humanoids; it&#8217;s machines with brains and brawn<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Use a digital twin to explore automation before committing capital", "source": "Robotics Business Review", "date": "2026-08-23", "url": "https://www.therobotreport.com/use-digital-twin-explore-automation-before-committing-capital/", "summary": "<p>While a digital twin does not necessarily replace a systems integrator, it can help manufacturers evaluate robots and plan applications, says RoboDK.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/use-digital-twin-explore-automation-before-committing-capital/\">Use a digital twin to explore automation before committing capital<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "How software-defined manufacturing fits into real factory operations", "source": "Robotics Business Review", "date": "2026-08-22", "url": "https://www.therobotreport.com/how-software-defined-manufacturing-fits-into-real-factory-operations/", "summary": "<p>Roby Lynn explains how R2 Labs bridges PLCs, robots, and AI to unify fragmented manufacturing systems.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/how-software-defined-manufacturing-fits-into-real-factory-operations/\">How software-defined manufacturing fits into real factory operations<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "The technology that could bring robot mowers to one in two American lawns", "source": "Robotics Business Review", "date": "2026-08-22", "url": "https://www.therobotreport.com/technology-could-bring-robot-mowers-one-half-american-lawns/", "summary": "<p>Improvements in AI, satellite navigation, and machine vision are helping robotic lawn mowers spread in the U.S., writes Sunseeker's founder.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/technology-could-bring-robot-mowers-one-half-american-lawns/\">The technology that could bring robot mowers to one in two American lawns<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Robots don’t run themselves: The workforce powering physical AI", "source": "Robotics Business Review", "date": "2026-08-22", "url": "https://www.therobotreport.com/robots-dont-run-themselves-workforce-powering-physical-ai/", "summary": "<p>The addition of physical AI to the workforce requires more key performance indicators than throughput, according to the president of HireArt.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/robots-dont-run-themselves-workforce-powering-physical-ai/\">Robots don&#8217;t run themselves: The workforce powering physical AI<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Schaeffler plans to mass produce gearboxes for humanoid robots in 2027", "source": "Robotics Business Review", "date": "2026-08-21", "url": "https://www.therobotreport.com/schaeffler-plans-to-mass-manufacture-gearboxes-for-humanoids-in-2027/", "summary": "<p>Schaeffler is creating its strain wave gearboxes with a forming technology that will enable mass production of the components. <\/p>\n<p>The post <a href=\"https://www.therobotreport.com/schaeffler-plans-to-mass-manufacture-gearboxes-for-humanoids-in-2027/\">Schaeffler plans to mass produce gearboxes for humanoid robots in 2027<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Amazon’s Bhavana Chandrashekhar to speak at RoboBusiness’ Women in Robotics Lunch", "source": "Robotics Business Review", "date": "2026-08-21", "url": "https://www.therobotreport.com/amazons-bhavana-chandrashekhar-speaks-robobusiness-women-in-robotics-lunch/", "summary": "<p>The Women in Robotics Lunch at RoboBusiness is an opportunity to form new connections and deepen relationships.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/amazons-bhavana-chandrashekhar-speaks-robobusiness-women-in-robotics-lunch/\">Amazon&#8217;s Bhavana Chandrashekhar to speak at RoboBusiness&#8217; Women in Robotics Lunch<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Video Friday: Do We Need Superhuman Humanoid Robots?", "source": "IEEE Spectrum Robotics", "date": "2026-08-21", "url": "https://spectrum.ieee.org/video-friday-unitree-superhuman", "summary": "<img src=\"https://spectrum.ieee.org/media-library/humanoid-robot-leaps-over-200-centimeter-height-board-beside-person-in-warehouse.png?id=67655329&amp;width=1245&amp;height=700&amp;coordinates=0%2C0%2C0%2C0\" /><br /><br /><p><span>Video Friday is your weekly selection of awesome robotics videos, collected by your friends at <\/span><em>IEEE Spectrum<\/em><span> robotics. We also post a weekly calendar of upcoming robotics events for the next few months. Please <\/span><a href=\"mailto:automaton@ieee.org?subject=Robotics%20event%20suggestion%20for%20Video%20Friday\">send us your events<\/a><span> for inclusion.<\/span><\/p><h5><a href=\"https://humanoidssummit.com/\">Humanoids Summit Seoul<\/a>: 22–23 September 2026, SEOUL<\/h5><h5><a href=\"https://2026.ieee-iros.org/\">IROS 2026<\/a>: 27 September–1 October 2026, PITTSBURGH<\/h5><h5><a href=\"https://www.corl.org/\">CoRL 2026<\/a>: 9–12 November 2026, AUSTIN<\/h5><p>Enjoy today’s videos!<\/p><div class=\"horizontal-rule\"><\/div><div><span style=\"display: none;\"> <\/span><\/div><p class=\"rm-anchors\" id=\"o7okizfils4\">This is very, very cool. But I’m trying to think of what the commercial use case will be, you know? I guess, high speed, incredibly dangerous package delivery to second-floor windows or something...?<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.unitree.com/\">Unitree<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"1cllcvk-9lo\"><em>Humans have a remarkable ability to perform new physical skills from only one or a few examples. Our latest robot foundation model, GEN-1.5, exhibits the beginnings of that same ability: It can learn a new task in seconds, from a single example, without gradient updates or fine-tuning. It displays broad capabilities across one-shot and few-shots learning from demonstration, as well as zero-shot physical generalization. Although the tasks are simple and short-horizon, this is the first model we know for which one-shot and few-shots learning of physical skills have emerged at scale. We view these results as a significant step toward our mission of building general intelligence for the physical world.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>I will make the cautionary point that for many of these “the model figured it out” tasks, the blog post can only say that there was no relevant pretraining data “to the best of our knowledge.”<\/p><p>[ <a href=\"https://generalistai.com/blog/gen-1.5\">Generalist<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"hwpuyegnujs\">BeanBot is a robot inspired by Mexican jumping beans, and I need say no more.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://bsr.iit.it/\">IIT<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"rcbpit1--0w\">As a professional bagpiper who definitely pays very close attention to whatever that annoying tapping noise is coming from the back of the band, I can attest to this group of <a href=\"https://spectrum.ieee.org/cybernetic-third-arm-makes-drummers-even-more-annoying\" target=\"_blank\">robot drummers<\/a> being absolutely top-notch.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://global.agilex.ai/\">AgileX Robotics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"1zzj64jxb1m\"><em>What does it take for an aerial robot to move through a sequence of arbitrary poses—fast, precisely, and continuously? Rather than teaching the robot a behavior from data, we asked how far a first-principles analytical model could take us. Through a collaboration between the AIMS Group at the Hong Kong Polytechnic University and DRAGON Lab at the University of Tokyo, we developed the first sequential-convex-programming-based trajectory-optimization framework for generalized <a href=\"https://spectrum.ieee.org/caltech-and-jpl-firing-quadrotors-out-of-cannons\" target=\"_blank\">multirotors<\/a>, covering both conventional and omnidirectional platforms.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.dragon.t.u-tokyo.ac.jp/\">DRAGON Lab<\/a> ]<\/p><p>Thanks, Moju!<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"tqx_y8ehahc\">This is a nifty idea that adapts a kind of interface frequently used for robot training and uses it for human training instead.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://news.mit.edu/2026/mit-engineers-design-better-controller-operating-construction-diggers-0820\">MIT<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"gc54o6bzcgw\"><em>Gravis Robotics brings robotic intelligence to heavy construction machines. Our retrofit kit, the Gravis Rack, turns off-the-shelf hydraulic machines into robots. Cameras, lidar, and onboard compute lets your machine see and understand its surroundings, and learning-based control lets it work close to its limits, moving more dirt with full, fast cycles.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.gravisrobotics.com/\">Gravis Robotics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"kczc9sjylno\"><em>Robust brachiation requires precise hand movements to grasp and release bars together with highly coordinated whole-body motion. To address this challenge, we propose a learning-based framework centered on waypoint-guided reinforcement learning (WGRL). WGRL guides the end effector through waypoints while allowing RL to explore and generate dynamic whole-body behaviors. With this approach, the learned policy demonstrated robust brachiation across diverse courses with different bar heights, spacings, and orientations in sim-to-sim experiments. In the real world, our life-size dual-arm robot successfully traversed four consecutive bars.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.eva.ai.u-tokyo.ac.jp/team/\">EVARL<\/a> ]<\/p><p>Thanks, Ayumu!<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"qulo_xmvsw4\">Well, here’s a different approach to <a href=\"https://spectrum.ieee.org/persona-ai-humanoid-robot-welding\" target=\"_blank\">welding in shipyards with robots<\/a>.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://kawasakirobotics.com/applications/arc-welding/\">Kawasaki<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"p55r7gn8xi8\">We should have a lot more robots in agriculture, if only they’d lettuce.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.flexiv.com/\">Flexiv<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"ghfcvlu_iku\">We’ve all had refs like these.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.phybot.tech/en/home\">PHYBOT<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"roxyluaqabq\">I got stuck after the first 15 seconds of this video trying to imagine what any of these home humanoids would usefully do if they dropped a glass.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://en.zhejianglab.com/institutescenters/researchunits/interdisciplinaryresearchcenters/researchcenterforintelligentrobot/\">Zhejiang Humanoid<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"4oggdyyo45i\"><a href=\"https://spectrum.ieee.org/sri-shakey-robot-honored-as-ieee-milestone\" target=\"_blank\">Shakey the Robot<\/a> doesn’t get enough love.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.sri.com/\">SRI<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"qtd7zwk3mq4\"><em>This work introduces a novel approach to physical human-robot interaction (pHRI) by leveraging the joint torque sensors of standard collaborative robots. By mounting a passive, uninstrumented plexiglass touchpad to the robot’s flange, we transform the robot into a handwriting-based input interface.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://ts-robotics.github.io/pHRI-CHAR-TACT/\">TS-Robotics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div>"}, {"title": "Agtonomy releases new autonomous multi-point turning features", "source": "The Robot Report", "date": "2026-08-20", "url": "https://www.therobotreport.com/agtonomy-releases-new-autonomous-multi-point-turning-features/", "summary": "<p>Agtonomy has added autonomous multi-point turning and enhanced field data collection to its commercial off-road platform.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/agtonomy-releases-new-autonomous-multi-point-turning-features/\">Agtonomy releases new autonomous multi-point turning features<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "ATDev gives update on its journey building autonomous wheelchairs", "source": "Robotics Business Review", "date": "2026-08-20", "url": "https://www.therobotreport.com/atdev-gives-update-journey-building-autonomous-wheelchairs/", "summary": "<p>ATDev is developing a modern power wheelchair with a coordinated robotic arm that can take on reaching and lifting tasks for the user. <\/p>\n<p>The post <a href=\"https://www.therobotreport.com/atdev-gives-update-journey-building-autonomous-wheelchairs/\">ATDev gives update on its journey building autonomous wheelchairs<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Amazon plans to expand Prime Air to nearly 500 cities by the end of 2026", "source": "Robotics Business Review", "date": "2026-08-20", "url": "https://www.therobotreport.com/amazon-plans-expand-prime-air-nearly-500-cities-by-end-2026/", "summary": "<p>Amazon said its Prime Air drones can deliver nearly all items 5 lb. or less that can fit in a large shoebox.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/amazon-plans-expand-prime-air-nearly-500-cities-by-end-2026/\">Amazon plans to expand Prime Air to nearly 500 cities by the end of 2026<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Pudu Robotics launches new MP2000 autonomous forklift", "source": "Robotics Business Review", "date": "2026-08-19", "url": "https://www.therobotreport.com/pudu-robotics-launches-new-mp2000-autonomous-forklift/", "summary": "<p>Pudu Robotics has launched the MP2000, an AI-native autonomous robot designed to transport 2,000 kg loads across complex warehouse environments.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/pudu-robotics-launches-new-mp2000-autonomous-forklift/\">Pudu Robotics launches new MP2000 autonomous forklift<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Serve Robotics to deploy its autonomous delivery robots with Grubhub", "source": "Robotics Business Review", "date": "2026-08-19", "url": "https://www.therobotreport.com/serve-robotics-deploys-autonomous-delivery-robots-grubhub/", "summary": "<p>Serve's robot delivery will be available from more than 100 participating Grubhub merchants in Chicago and nearly 200 in Los Angeles.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/serve-robotics-deploys-autonomous-delivery-robots-grubhub/\">Serve Robotics to deploy its autonomous delivery robots with Grubhub<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "What does Unitree Robotics’ IPO mean for the humanoid industry?", "source": "Robotics Business Review", "date": "2026-08-19", "url": "https://www.therobotreport.com/what-does-unitree-robotics-ipo-mean-for-humanoid-industry/", "summary": "<p>Now that Unitree Robotics has made its IPO, which humanoid robotics companies will follow in its footsteps?<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/what-d
