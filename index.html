\">Embedded<\/a>.<\/p>"}, {"title": "Everspin, Teledyne HiRel Partner on Mission-Critical MRAM", "source": "Embedded.com", "date": "2026-09-04", "url": "https://www.embedded.com/everspin-teledyne-hirel-partner-on-mission-critical-mram/", "summary": "<p>Everspin Technologies and Teledyne HiRel Semiconductors have announced a strategic partnership to expand the use of magnetoresistive random-access memory (MRAM) in aerospace, defense, and other mission-critical applications. The collaboration will initially focus on Everspin's 256-Mb PERSYST spin-transfer torque MRAM (STT-MRAM), combining RAM-like access performance with non-volatile data retention. Under the agreement, Teledyne HiRel will offer [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/everspin-teledyne-hirel-partner-on-mission-critical-mram/\">Everspin, Teledyne HiRel Partner on Mission-Critical MRAM<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "iSpace leading ESA’s first lunar polar ice exploration rover mission", "source": "Electronics Weekly", "date": "2026-09-04", "url": "https://www.electronicsweekly.com/news/ispace-leading-esas-first-lunar-polar-ice-exploration-rover-mission-2026-09/", "summary": "<p>iSpace-Europe and the European Space Agency (ESA) have officially agreed the MAGPIE mission, Europe&#8217;s first lunar polar ice exploration rover. MAGPIE stands for the “Mission for Advanced Geophysics and Polar [&#8230;]<\/p>\n<p>The post <a href=\"https://www.electronicsweekly.com/news/ispace-leading-esas-first-lunar-polar-ice-exploration-rover-mission-2026-09/\">iSpace leading ESA&#8217;s first lunar polar ice exploration rover mission<\/a> appeared first on <a href=\"https://www.electronicsweekly.com\">Electronics Weekly<\/a>.<\/p>"}, {"title": "Open Cosmos becomes approved provider for UK sovereign comms", "source": "Electronics Weekly", "date": "2026-09-04", "url": "https://www.electronicsweekly.com/news/business/open-cosmos-becomes-approved- ording to Frank Rohmund (pictured) who heads up the Semiconductor Manufacturing Technology at Zeiss. Zeiss is the only source of the optical [&#8230;]<\/p>\n<p>The post <a href=\"https://www.electronicsweekly.com/news/business/china-15-years-behind-in-ic-process-technology-2026-09/\">China 15 years behind in IC process technology<\/a> appeared first on <a href=\"https://www.electronicsweekly.com\">Electronics Weekly<\/a>.<\/p>"}, {"title": "Simoco and Antevia Networks hook up for private 5G deployment", "source": "Electronics Weekly", "date": "2026-09-04", "url": "https://www.electronicsweekly.com/news/business/simoco-and-antevia-networks-hook-up-for-private-5g-deployment-2026-09/", "summary": "<p>Simoco and Antevia Networks, the UK developer of the 5G SHIFT private 5G platform, will integrate rapidly deployable private 5G capability into Simoco&#8217;s INEOS Grenadier mission-critical communications platform. The partnership [&#8230;]<\/p>\n<p>The post <a href=\"https://www.electronicsweekly.com/news/business/simoco-and-antevia-networks-hook-up-for-private-5g-deployment-2026-09/\">Simoco and Antevia Networks hook up for private 5G deployment<\/a> appeared first on <a href=\"https://www.electronicsweekly.com\">Electronics Weekly<\/a>.<\/p>"}, {"title": "Imec examines biomanufacturing innovations for therapeutics", "source": "Electronics Weekly", "date": "2026-09-04", "url": "https://www.electronicsweekly.com/news/business/imec-examines-biomanufacturing-innovations-for-therapeutics-2026-09/", "summary": "<p>Imec’s Bioconvergence Forum: ‘Specialty Silicon Driving Deeptech Life Sciences &#38; Medtech’, agreed that the future of biomanufacturing depends not just on better sensors, but on a more open and collaborative [&#8230;]<\/p>\n<p>The post <a href=\"https://www.electronicsweekly.com/news/business/imec-examines-biomanufacturing-innovations-for-therapeutics-2026-09/\">Imec examines biomanufacturing innovations for therapeutics<\/a> appeared first on <a href=\"https://www.electronicsweekly.com\">Electronics Weekly<\/a>.<\/p>"}, {"title": "IQE extends supply agreement with Quintessent", "source": "Electronics Weekly", "date": "2026-09-04", "url": "https://www.electronicsweekly.com/news/business/iqe-extends-supply-agreement-with-quintessent-2026-09/", "summary": "<p>IQE, the Cardiff compound semiconductor materials specialist, has signed a purchase agreement with Quintessent, the optical interconnect supplier, for Quantum Dot Laser (QDL) epitaxial wafers. Following an initial strategic announcement [&#8230;]<\/p>\n<p>The post <a href=\"https://www.electronicsweekly.com/news/business/iqe-extends-supply-agreement-with-quintessent-2026-09/\">IQE extends supply agreement with Quintessent<\/a> appeared first on <a href=\"https://www.electronicsweekly.com\">Electronics Weekly<\/a>.<\/p>"}, {"title": "Halloween Costume Detector #Raspberry Pi", "source": "Adafruit", "date": "2026-09-04", "url": "https://blog.adafruit.com/2026/09/04/halloween-costume-detector-raspberry-pi/", "summary": "Build a wise cracking skull to MC your Halloween costume party. This project uses a Raspberry Pi 5 paired with a NoIR PiCamera and speaker bonnet. The Pi runs a Python script with OpenCV person detection. When a person crosses paths with the skull, a picture is sent to Claude with a prompt requesting a [&#8230;]"}, {"title": "Shipping Alert: Rosh Hashanah – Friday, September 11, 2026", "source": "Adafruit", "date": "2026-09-04", "url": "https://blog.adafruit.com/2026/09/04/shipping-alert-rosh-hashanah-friday-september-11-2026/", "summary": "&#160; Double holiday week! Rosh Hashanah begins next Friday 9/11/2026. This is an official holiday for the Adafruit team but orders will still be shipping. Please be aware! In conjunction with Labor Day at the start of the week, this makes for a tight shipping window and there may be delays. Please plan accordingly."}, {"title": "Semi-Permanent E-Paper Camera with ‘Digital Film’ #piday #raspberrypi", "source": "Adafruit", "date": "2026-09-04", "url": "https://blog.adafruit.com/2026/09/04/semi-permanent-e-paper-camera-with-digital-film-piday-raspberrypi/", "summary": "Camera with Digital Film, image from Strange Inventions Lab &#160; Strange Inventions created this&#8230;strange invention: a cartridge-based Raspberry Pi camera that &#8216;prints&#8217; to e-paper. The 3D printed camera houses a Raspberry Pi 3 A+, camera module, battery, and microSD card. Each cartridge contains a 1.54&#8243; 4 color module. Snap a shot! The semi-permanent stills can [&#8230;]"}, {"title": "John Park’s CircuitPython Parsec: Fruit Jam SD Card Contents", "source": "Adafruit", "date": "2026-09-04", "url": "https://blog.adafruit.com/2026/09/04/john-parks-circuitpython-parsec-fruit-jam-sd-card-contents/", "summary": "#circuitpythonparsec List SD card contents easily on the Fruit Jam using CircuitPython. Try out the code example To learn about CircuitPython: https://circuitpython.org &#160;"}, {"title": "New Learn Guide: Hacking The Teenage Engineering SP-1 #Hacks #AdafruitLearningSystem @Adafruit", "source": "Adafruit", "date": "2026-09-04", "url": "https://blog.adafruit.com/2026/09/04/new-learn-guide-hacking-the-teenage-engineering-sp-1-hacks-adafruitlearningsystem-adafruit/", "summary": "The Teenage Engineering SP-1 is a hardware stem player device that was never officially released. It was manufactured in a partnership that fell apart before official release. The devices that were manufactured have ended up available in &#8220;as-is&#8221; condition through liquidation and other online stores. There is no official support or documentation for the device, [&#8230;]"}, {"title": "New Learn Guide: CircuitPython Watchdog Module #Microcontrollers #AdafruitLearningSystem @Adafruit", "source": "Adafruit", "date": "2026-09-04", "url": "https://blog.adafruit.com/2026/09/04/new-learn-guide-circuitpython-watchdog-module-microcontrollers-adafruitlearningsystem-adafruit/", "summary": "The CircuitPython watchdog module implements a watchdog timer that can be used to detect and recover from locked or stalled processes running on the microcontroller. The core principal is: configure the watchdog for a specified timeout period and activate it, then the code must feed the dog at least once within every timeout interval. Letting [&#8230;]"}, {"title": "NOAA scientists spot an ‘outrageously tiny’ fish", "source": "Adafruit", "date": "2026-09-04", "url": "https://blog.adafruit.com/2026/09/04/noaa-scientists-spot-an-outrageously-tiny-fish/", "summary": "Laura Baisas writing for Popular Science reports that a NOAA Ocean Exploration team spotted a fish estimated at five millimeters (0.19 inches) to one centimeter (0.4 inches) long. It was seen in the Northeast Canyons and Seamounts Marine National Monument in the Atlantic off New England, during the Deep Connections 2019 expedition. The species is [&#8230;]"}, {"title": "OWASP launches OASIS to fix Open Source bugs at scale", "source": "Adafruit", "date": "2026-09-04", "url": "https://blog.adafruit.com/2026/09/04/owasp-launches-oasis-to-fix-open-source-bugs-at-scale/", "summary": "Apurba Sen, writing at Open Source For You, reports that OWASP has launched the Open Automated Security Initiative for Software, or OASIS. It was announced on August 26, 2026, in San Francisco. The goal is to move open source vulnerability work from &#8220;find and report&#8221; to &#8220;find, validate and fix.&#8221; OASIS uses AI to scan [&#8230;]"}, {"title": "NASA selects Blue Origin as Mars telecommunications network provider", "source": "Adafruit", "date": "2026-09-04", "url": "https://blog.adafruit.com/2026/09/04/nasa-selects-blue-origin-as-mars-telecommunications-network-provider/", "summary": "Jessica Taveau writing for NASA reports that the agency has awarded Blue Origin a contract to build the Mars Telecommunications Network. The firm-fixed-price contract has a maximum potential value of about $700 million, and calls for delivery of a high-performance Mars telecommunications orbiter no later than December 31, 2028. Blue Origin will design, develop, integrate, [&#8230;]"}, {"title": "The Python on Microcontrollers Newsletter: subscribe for free", "source": "Adafruit", "date": "2026-09-04", "url": "https://blog.adafruit.com/2026/09/04/the-python-on-microcontrollers-newsletter-subscribe-for-free-9-4/", "summary": "The Python for Microcontrollers Newsletter is the place for the latest news involving Python on hardware (microcontrollers AND single board computers like Raspberry Pi). This ad-free, spam-free weekly email is filled with CircuitPython, MicroPython, and Python information that you may have missed, all in one place! You get a summary of all the software, events, projects, and the latest hardware worldwide once a week, no [&#8230;]"}, {"title": "datasette-mcp 0.2 connects Datasette to MCP clients", "source": "Adafruit", "date": "2026-09-04", "url": "https://blog.adafruit.com/2026/09/04/datasette-mcp-0-2-connects-datasette-to-mcp-clients/", "summary": "Simon Willison has released datasette-mcp 0.2, announced on his weblog. It is the first non-alpha release of the plugin, which exposes Datasette to Model Context Protocol clients. Datasette is a tool for exploring and publishing data. It helps people take data of any shape or size and publish that as an interactive, explorable website and [&#8230;]"}, {"title": "Cursed Skull Desk Lamp – Bambu LED Kit 001 with Golden Flame Cutout #3DThursday #3DPrinting", "source": "Adafruit", "date": "2026-09-04", "url": "https://blog.adafruit.com/2026/09/03/cursed-skull-desk-lamp-bambu-led-kit-001-with-golden-flame-cutout-3dthursday-3dprinting/", "summary": "user_3081978295 shares: A macabre yet elegant skull-shaped desk lamp perfectly sized for the Bambu Lab LED Lamp Kit 001. Internal flame-shaped cutout creates dramatic light play — the captivating golden glow is the reflection of the warm-white LED on matte black PLA. Assembles entirely without glue. Integrated cable hole at the back of the skull [&#8230;]"}, {"title": "Bio-Inspired AI: How The Biological Computing Co. is Using Living Neurons to Supercharge Generative Models", "source": "EE Journal", "date": "2026-09-04", "url": "https://www.eejournal.com/fish_fry/bio-inspired-ai-how-the-biological-computing-co-is-using-living-neurons-to-supercharge-generative-models/", "summary": "<img alt=\"\" class=\"webfeedsFeaturedVisual wp-post-image\" height=\"300\" src=\"https://www.eejournal.com/wp-content/uploads/2026/09/AD-090426-300x300.jpg\" style=\"display: block; margin-bottom: 5px; clear: both;\" width=\"300\" />My podcast guest this week Alex Ksendzovsky, co-founder of The Biological Computing Co. Alex and his team are doing something that sounds straight out of science fiction: they’re extracting computational principles from living neurons and translating them into software that runs on standard silicon. Alex and I chat about The Biological Computing Co. is bridging &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/fish_fry/bio-inspired-ai-how-the-biological-computing-co-is-using-living-neurons-to-supercharge-generative-models/\">Read More &#8594;<span class=\"screen-reader-text\"> \"Bio-Inspired AI: How The Biological Computing Co. is Using Living Neurons to Supercharge Generative Models\"<\/span><\/a>"}, {"title": "Fully integrated, baseplate-cooled 320W full-brick AC-DC power supplies for sealed, space-constrained systems", "source": "EE Journal", "date": "2026-09-04", "url": "https://www.eejournal.com/industry_news/fully-integrated-baseplate-cooled-320w-full-brick-ac-dc-power-supplies-for-sealed-space-constrained-systems/", "summary": "XP Power introduces the ASB320 series of 320W fully integrated, baseplate-cooled AC-DC power supplies offering single output from 12V to 54VDC in a compact, encapsulated brick format. Global ITE safety approvals, Class B emissions and a low-profile rugged mechanical design make these power supplies an ideal choice for space-constrained industrial automation, communications, test and measurement, and analytical &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/fully-integrated-baseplate-cooled-320w-full-brick-ac-dc-power-supplies-for-sealed-space-constrained-systems/\">Read More &#8594;<span class=\"screen-reader-text\"> \"Fully integrated, baseplate-cooled 320W full-brick AC-DC power supplies for sealed, space-constrained systems\"<\/span><\/a>"}, {"title": "Chronova Corp Comes Out of Stealth, Announces Acquisition of Intel Precision Timing Project", "source": "EE Journal", "date": "2026-09-04", "url": "https://www.eejournal.com/industry_news/chronova-corp-comes-out-of-stealth-announces-acquisition-of-intel-precision-timing-project-2/", "summary": "Chronova Corp formed silently last year with a mission to provide the most accurate, reliable, and efficient timing solutions to the most demanding electronics customers. Today Chronova came out of stealth mode to announce their successful acquisition of the foundational patents, trade secrets, and AI training data from Intel’s seven-year R&#38;D effort to redefine how &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/chronova-corp-comes-out-of-stealth-announces-acquisition-of-intel-precision-timing-project-2/\">Read More &#8594;<span class=\"screen-reader-text\"> \"Chronova Corp Comes Out of Stealth, Announces Acquisition of Intel Precision Timing Project\"<\/span><\/a>"}, {"title": "Amlogic A311Y3 Cortex-A78/A55 Edge AI system-on-module delivers up to 8 TOPS", "source": "CNX Software", "date": "2026-09-03", "url": "https://www.cnx-software.com/2026/09/03/amlogic-a311y3-cortex-a78-a55-edge-ai-system-on-module-delivers-up-to-8-tops/", "summary": "<div><img alt=\"Amlogic A311Y3 SoM\" class=\"attachment-medium size-medium wp-post-image\" height=\"360\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/09/Amlogic-A311Y3-SoM-720x360.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Boardcon CM311Y3 system-on-module (SoM) is powered by an Amlogic A311Y3 octa-core Cortex-A78/A55 SoC with an 8 TOPS NPU and targets 4K video surveillance systems, AI edge computing devices, interactive terminals, enterprise thin clients, and autonomous robots. The module comes with up to 16GB LPDDR5 and up to 256 GB eMMC flash, exposes 210 pins through castellated edges, and a development board is also provided for evaluation and early software development. We don&#8217;t often see new SoMs or SBCs based on Amlogic SoCs these days, so let&#8217;s have a closer look. Boardcon CM311Y3 System-on-Module CM311Y3 specifications: SoC &#8211; Amlogic A311Y3 CPU 2x ARM Cortex-A78 cores @ 2.4GHx 6x ARM Cortex-A55 cores @ 2.0GHz RISC-V core for system control processing RISC-V core for Always-on power management and Sensor Hub GPU &#8211; Arm Mali-G625 MC1 with support for OpenGL ES 3.2, Vulkan 1.4, and OpenCL 3.0 VPU Video Decoder &#8211; H.264 up to [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/09/03/amlogic-a311y3-cortex-a78-a55-edge-ai-system-on-module-delivers-up-to-8-tops/\">Amlogic A311Y3 Cortex-A78/A55 Edge AI system-on-module delivers up to 8 TOPS<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Artery AT32F406 and AT32F408 Cortex-M4F MCUs feature optional high-speed USB OTG PHY", "source": "CNX Software", "date": "2026-09-03", "url": "https://www.cnx-software.com/2026/09/03/artery-at32f406-and-at32f408-cortex-m4f-mcus-feature-optional-high-speed-usb-otg-phy/", "summary": "<div><img alt=\"Artery AT32F406 and AT32F408 MCU\" class=\"attachment-medium size-medium wp-post-image\" height=\"480\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/09/Artery-AT32F406-and-AT32F408-MCU-720x480.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Artery Technology AT32F406 and AT32F408 are two new Arm Cortex-M4F MCUs running at up to 216 MHz, with the F408 adding USB OTG High-Speed and an integrated PHY for industrial automation, IoT, USB accessories, and gaming peripherals. The AT32F406/F408 series both offer DSP instructions and a floating-point unit (FPU), integrate up to 512 KB Flash and 192 KB SRAM, and a 4 KB OTP memory for critical data and parameters. The microcontrollers also offer a QSPI interface for external Flash or RAM expansion, and a range of digital and analog peripheral interfaces. Artery AT32F406/AT32F408 specifications: MCU &#8211; 32-bit Arm Cortex-M4F CPU up to 216 MHz; also features Memory Protection Unit (MPU) and DSP instructions Memory/Storage 128 KB to 192 KB SRAM 256 KB to 512 KB Flash memory 26 KB boot memory (configurable as a bootloader or general instruction/data memory) 4 KB OTP (one-time programmable) memory QSPI interface for external SPI [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/09/03/artery-at32f406-and-at32f408-cortex-m4f-mcus-feature-optional-high-speed-usb-otg-phy/\">Artery AT32F406 and AT32F408 Cortex-M4F MCUs feature optional high-speed USB OTG PHY<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "TickrCast – An ESP32-S3 HUB75 LED ticker display with server-side rendering and OTA (Crowdfunding)", "source": "CNX Software", "date": "2026-09-03", "url": "https://www.cnx-software.com/2026/09/03/tickrcast-esp32-s3-hub75-led-ticker-display-with-server-side-rendering-and-ota/", "summary": "<div><img alt=\"TickrCast Expandable LED Ticker\" class=\"attachment-medium size-medium wp-post-image\" height=\"480\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/09/TickrCast-Expandable-LED-Ticker-720x480.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Layered Ventures LLC has launched the TickrCast, an expandable HUB75 LED ticker display built around an ESP32-S3. The TickrCast ships as a full consumer product designed to display live esports data, traditional sports scores, social media metrics, and flight tracking across a daisy-chained array of panels. Unlike a typical LED matrix development board, the system is a complete product with a custom controller board, plug-and-play panels, power connectors, a companion app, and an expandable enclosure. The display starts with two panels and can be expanded by adding additional panels, with the company targeting configurations of 10 or more panels. The system is controlled through Wi-Fi, while Bluetooth LE is used for initial provisioning, and the manufacturer provides more than 30 plugins at launch with no subscription required. The platform also supports signed over-the-air (OTA) firmware updates and hardware flash encryption for improved device security. TickrCast controller specifications: ESP32-S3-WROOM-1U wireless module [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/09/03/tickrcast-esp32-s3-hub75-led-ticker-display-with-server-side-rendering-and-ota/\">TickrCast &#8211; An ESP32-S3 HUB75 LED ticker display with server-side rendering and OTA (Crowdfunding)<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "DIY ESP32-P4 weather station & air quality monitor connects to LoRa and ESP-NOW sensors, various weather APIs", "source": "CNX Software", "date": "2026-09-03", "url": "https://www.cnx-software.com/2026/09/03/diy-esp32-p4-weather-station-air-quality-monitor-connects-to-lora-and-esp-now-sensors-various-weather-apis/", "summary": "<div><img alt=\"DIY ESP32-P4 Weather Station Air and Quality Monitor\" class=\"attachment-medium size-medium wp-post-image\" height=\"480\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/09/DIY-ESP32-P4-Weather-Station-Air-Quality-Monitor-720x480.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Harald Kreuzer has built an ESP32-P4 weather station and air quality monitor that features a 10.1-inch dashboard display and a built-in Sensirion SEN66 sensor for particulate matter, CO2, VOC, and NOX, and connects to wireless LoRa and ESP-NOW sensors. The project is entirely made of off-the-shelf boards, so no custom hardware is used, and it should be relatively easy to reproduce. It doesn&#8217;t require any cloud or user account, although it can connect to a choice of weather APIs (Open-Meteo, OpenWeatherMap or Visual Crossing) to display weather forecasts. The build is fully documented in a long blog post, so we&#8217;ll highlight the key features of the project in this article. Hardware specifications for the main unit: Based on ESP32-P4-Module-DEV-KIT-C Credit card-sized ESP32-P4-Module-DEV-KIT SBC based on an ESP32-P4NRW32 module with ESP32-P4 with 32MB PSRAM and ESP32-C6 for WiFi and BLE 10.1-inch IPS panel with 1280 x 800 resolution, 800:1 contrast ratio, [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/09/03/diy-esp32-p4-weather-station-air-quality-monitor-connects-to-lora-and-esp-now-sensors-various-weather-apis/\">DIY ESP32-P4 weather station &#038; air quality monitor connects to LoRa and ESP-NOW sensors, various weather APIs<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "SomDevices, Celus Bring μSMARC Modules to Design Platform", "source": "Embedded.com", "date": "2026-09-03", "url": "https://www.embedded.com/somdevices-celus-bring-%ce%bcsmarc-modules-to-design-platform/", "summary": "<p>Seven NXP i.MX-based modules will become reusable CUBOs, helping engineers evaluate interfaces and implementation requirements earlier.<\/p>\n<p>The post <a href=\"https://www.embedded.com/somdevices-celus-bring-%ce%bcsmarc-modules-to-design-platform/\">SomDevices, Celus Bring μSMARC Modules to Design Platform<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "Push long-haul network reach to 2,400km  with new ProLabs coherent transceivers", "source": "EE Journal", "date": "2026-09-03", "url": "https://www.eejournal.com/industry_news/push-long-haul-network-reach-to-2400km-with-new-prolabs-coherent-transceivers/", "summary": "Both QSFP-DD 800G ZR LH and QSFP-DD 400G ZR ULH are purpose built for carriers, service-providers, and large-scale backbone networks across the United Kingdom requiring ultra-long-haul coherent transmission. The transceivers enable operators to extend the reach of 400G and 800G networks across national and cross-continental infrastructure without compromising performance. “We are delighted to have expanded our &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/push-long-haul-network-reach-to-2400km-with-new-prolabs-coherent-transceivers/\">Read More &#8594;<span class=\"screen-reader-text\"> \"Push long-haul network reach to 2,400km  with new ProLabs coherent transceivers\"<\/span><\/a>"}, {"title": "Sensata Technologies Launches R290 Pressure + Temperature Sensor to Enable Adoption of Low-GWP and PFAS-free Refrigerants in EV Thermal Management Systems", "source": "EE Journal", "date": "2026-09-03", "url": "https://www.eejournal.com/industry_news/sensata-technologies-launches-r290-pressure-temperature-sensor-to-enable-adoption-of-low-gwp-and-pfas-free-refrigerants-in-ev-thermal-management-systems/", "summary": "Sensata’s R290 Pressure + Temperature (P+T) sensor enables automotive OEMs to adopt propane as a refrigerant in EV thermal management systems while addressing safety, leakage and regulatory challenges. Supports the transition to low-GWP and PFAS-free refrigerants with accurate, reliable pressure and temperature sensing. Offers flexible integration with Analog and LIN output options, backed by Sensata’s &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/sensata-technologies-launches-r290-pressure-temperature-sensor-to-enable-adoption-of-low-gwp-and-pfas-free-refrigerants-in-ev-thermal-management-systems/\">Read More &#8594;<span class=\"screen-reader-text\"> \"Sensata Technologies Launches R290 Pressure + Temperature Sensor to Enable Adoption of Low-GWP and PFAS-free Refrigerants in EV Thermal Management Systems\"<\/span><\/a>"}, {"title": "SECO launches Industrial HMI and SBC Powered by Qualcomm Dragonwing IQ-2390", "source": "EE Journal", "date": "2026-09-03", "url": "https://www.eejournal.com/industry_news/seco-launches-industrial-hmi-and-sbc-powered-by-qualcomm-dragonwing-iq-2390/", "summary": "Following the launch of Qualcomm Dragonwing™ IQ-2390, SECO today expands its portfolio with Compact Vision 5 Dragonwing IQ-2390, a 5-inch industrial HMI, and SBC-Dragonwing-IQ-2390, a compact single-board computer built on the new platform. The two solutions are designed to modernize connected industrial devices across HMI, control, vending, building automation, industrial vision, and other compact embedded applications. Supporting the modernization &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/seco-launches-industrial-hmi-and-sbc-powered-by-qualcomm-dragonwing-iq-2390/\">Read More &#8594;<span class=\"screen-reader-text\"> \"SECO launches Industrial HMI and SBC Powered by Qualcomm Dragonwing IQ-2390\"<\/span><\/a>"}, {"title": "Hirose Develops High-Speed Automotive Ethernet Connector for Compact Applications", "source": "EE Journal", "date": "2026-09-03", "url": "https://www.eejournal.com/industry_news/hirose-develops-high-speed-automotive-ethernet-connector-for-compact-applications/", "summary": "Hirose has unveiled the GT37 Series wire-to-board connector designed for high-speed automotive Ethernet applications. As vehicle architectures incorporate more electronic control units, cameras, sensors, displays, communication modules, and advanced driver-assistance systems (ADAS), protecting sensitive signals from electromagnetic interference (EMI) has become a critical design consideration. The GT37 Series addresses this challenge with a fully shielded &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/hirose-develops-high-speed-automotive-ethernet-connector-for-compact-applications/\">Read More &#8594;<span class=\"screen-reader-text\"> \"Hirose Develops High-Speed Automotive Ethernet Connector for Compact Applications\"<\/span><\/a>"}, {"title": "Mouser Releases New Qorvo eBook on RF Solutions for Drones, SATCOM and IIoT Next-Generation Markets", "source": "EE Journal", "date": "2026-09-03", "url": "https://www.eejournal.com/industry_news/mouser-releases-new-qorvo-ebook-on-rf-solutions-for-drones-satcom-and-iiot-next-generation-markets/", "summary": "Mouser Electronics, Inc., the New Product Introduction (NPI) leader™ empowering innovation, announces a new eBook in collaboration with Qorvo, exploring next-generation RF wireless designs for drones, satellite communications and industrial IoT. High-Performance RF Solutions for Agile New Markets addresses time-to-market pressures, coexistence issues, power-efficiency demands, and system complexity by leveraging wideband components and proven off-the-shelf &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/mouser-releases-new-qorvo-ebook-on-rf-solutions-for-drones-satcom-and-iiot-next-generation-markets/\">Read More &#8594;<span class=\"screen-reader-text\"> \"Mouser Releases New Qorvo eBook on RF Solutions for Drones, SATCOM and IIoT Next-Generation Markets\"<\/span><\/a>"}, {"title": "Are You Conversing with a Human or an AI?", "source": "EE Journal", "date": "2026-09-03", "url": "https://www.eejournal.com/article/are-you-conversing-with-a-human-or-an-ai/", "summary": "<img alt=\"\" class=\"webfeedsFeaturedVisual wp-post-image\" height=\"300\" src=\"https://www.eejournal.com/wp-content/uploads/2026/09/max-0515-image-for-home-page-modulate-scam-ai-300x300.jpg\" style=\"display: block; margin-bottom: 5px; clear: both;\" width=\"300\" />I just received a phone call from a famous company whose name we shall not speak lest they turn their corporate frowny face in my general direction. At first, I thought I was talking to a person, but his (or its) responses to some of my questions sounded a bit “glitchy.” Eventually I posed my &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/article/are-you-conversing-with-a-human-or-an-ai/\">Read More &#8594;<span class=\"screen-reader-text\"> \"Are You Conversing with a Human or an AI?\"<\/span><\/a>"}, {"title": "LightMake L4 3D printer features four independent heads for simultaneous or multi-color printing (Crowdfunding)", "source": "CNX Software", "date": "2026-09-02", "url": "https://www.cnx-software.com/2026/09/02/lightmake-l4-3d-printer-features-four-independent-printing-heads/", "summary": "<div><img alt=\"LightMake L4 3D printer four printing heads\" class=\"attachment-medium size-medium wp-post-image\" height=\"536\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/09/LightMake-L4-3D-printer-four-printing-heads-1-720x536.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>The LightMake L4 is a desktop 3D printer with four independent printing heads for high-throughput multi-color, multi-material, and batch production. It uses four independently controlled printheads and linear-motor motion instead of conventional belts, allowing users to print four identical models simultaneously, produce complex multi-color parts with minimal purge waste, or combine up to four materials in a single print. Typically, multi-color FDM 3D printers like the Bambu Lab X1 or Geeetech A20M use a single-nozzle purge material during every color change, which leads to a lot of material waste and longer print times. The LightMake L4 takes a different approach by keeping four filaments loaded and heated in four completely separate extruders. According to the company, this allows for one-second toolhead changes and near-zero purge waste. The linear motor system also promises ±1µm motion precision and speeds of up to 500 mm/s. LightMake L4 and L1 specifications: Printing technology – [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/09/02/lightmake-l4-3d-printer-features-four-independent-printing-heads/\">LightMake L4 3D printer features four independent heads for simultaneous or multi-color printing (Crowdfunding)<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "GPIBee (UsbGpib V3) USB-to-GPIB adapter gains Ethernet (PoE), but launches as closed-source hardware", "source": "CNX Software", "date": "2026-09-02", "url": "https://www.cnx-software.com/2026/09/02/gpibee-usbgpib-v3-usb-to-gpib-adapter-gains-ethernet-poe-but-launches-as-closed-source-hardware/", "summary": "<div><img alt=\"GPIBee PoE to GPIB adapter\" class=\"attachment-medium size-medium wp-post-image\" height=\"370\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/09/GPIBee-PoE-to-GPIB-adapter-720x370.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Last December, we wrote about XyphroLabs’s UsbGpib open-source hardware, affordable, and portable USB-to-GPIB adapter designed for legacy GPIB/IEEE-488 instruments and offering modern hardware and software. At the time, the UsbGpib V3 was also in the works with Ethernet (PoE) support, and the good news is that it&#8217;s now available, but named GPIBee. The less good news is that while V1 and V2 were both open-source hardware products (and still are), the GPIBee has been released as closed-source hardware for reasons we&#8217;ll explain below. GPIBee specifications: Microcontroller – Not disclosed. But not the Microchip ATMega32U4 8-bit AVR MCU found in V2 since its USB interface is limited to 12 Mbps Host interfaces USB 2.0 (480 Mbps) Type-C port with support for four modes Full USBTMC (USB Test and Measurement Class) VXI-11 over USB-Ethernet (CDC NCM) linux-gpib native interface Prologix-compatible (++ commands) via CDC UART (virtual COM port) 10/100Mbps Ethernet RJ45 port [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/09/02/gpibee-usbgpib-v3-usb-to-gpib-adapter-gains-ethernet-poe-but-launches-as-closed-source-hardware/\">GPIBee (UsbGpib V3) USB-to-GPIB adapter gains Ethernet (PoE), but launches as closed-source hardware<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Circuit Valley CHC5 – A modular USB, HDMI, and Ethernet camera system (Crowdfunding)", "source": "CNX Software", "date": "2026-09-02", "url": "https://www.cnx-software.com/2026/09/02/circuit-valley-chc5-a-modular-usb-hdmi-and-ethernet-camera-system/", "summary": "<div><img alt=\"Circuit Valley CHC5 Open Camera\" class=\"attachment-medium size-medium wp-post-image\" height=\"425\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/09/Circuit-Valley-CHC5-Open-Camera-720x425.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Circuit Valley&#8217;s CHC5 is a modular camera system based on a Core board powered by an AMD/Xilinx Zynq-7020 SoC FPGA, a range of interface boards with USB, HDMI, or Ethernet (PoE), various sensor boards, and a metal enclosure. The solution can be customized with different lens objectives and different sensors with MIPI D-PHY, LVDS, Sub-LVDS, Low Voltage LVDS, or SLVS interfaces. The Zynq-7020&#8217;s Cortex-A9 cores can handle complex tasks, while the FPGA fabric takes care of high-speed calculation and correction on the image, and can also be leveraged for  AI/machine-vision-specific algorithms or complex low-latency hardware acceleration. CHC5 specifications: Core board SoC &#8211; Xilinx AMD Zynq-7020 SoC FPGA CPU &#8211; Dual-core Arm Cortex-A9 processor FPGA &#8211; 85K logic cells, 4.9Mb Block RAM, 220 DSP slices System Memory &#8211; 1GB DDR3 Storage 1 Gbit flash memory MicroSD card slot ISP &#8211; Full-fledged ISP implemented on FPGA fabric Multiple interface boards with 10Gbps [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/09/02/circuit-valley-chc5-a-modular-usb-hdmi-and-ethernet-camera-system/\">Circuit Valley CHC5 &#8211; A modular USB, HDMI, and Ethernet camera system (Crowdfunding)<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "NXP MCX A5 MCUs Bring 10BASE-T1S Ethernet to Industrial Edge Nodes", "source": "Embedded.com", "date": "2026-09-02", "url": "https://www.embedded.com/nxp-mcx-a5-mcus-bring-10base-t1s-ethernet-to-industrial-edge-nodes/", "summary": "<p>The MCX A5 MCUs combine 10BASE-T1S Ethernet, topology discovery, and post-quantum security to extend Ethernet deeper into industrial networks.<\/p>\n<p>The post <a href=\"https://www.embedded.com/nxp-mcx-a5-mcus-bring-10base-t1s-ethernet-to-industrial-edge-nodes/\">NXP MCX A5 MCUs Bring 10BASE-T1S Ethernet to Industrial Edge Nodes<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "Unlocking Autonomy in Military Drones Goes Beyond SWaP-C", "source": "Embedded.com", "date": "2026-09-02", "url": "https://www.embedded.com/unlocking-autonomy-in-military-drones-goes-beyond-swap-c/", "summary": "<p>Global defense spending has increased amidst rising geopolitical tensions and de-globalization to strengthen national security. The Trump administration's hefty defense budget request this June allocates $2.4 billion just to drones. Resulting from this paradigm shift in warfare, global spending also follows this trend. Further fueled by technological advances, it has converged into a boon for [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/unlocking-autonomy-in-military-drones-goes-beyond-swap-c/\">Unlocking Autonomy in Military Drones Goes Beyond SWaP-C<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "KYOCERA AVX Releases New Ultraminiature 0201 KGU Series RF MLCCs", "source": "EE Journal", "date": "2026-09-02", "url": "https://www.eejournal.com/industry_news/kyocera-avx-releases-new-ultraminiature-0201-kgu-series-rf-mlccs/", "summary": "KYOCERA AVX, a leading global manufacturer of advanced electronic components engineered to accelerate technological innovation and build a better future, added a new ultraminiature 0201 case size to its KGU Series high-performance, ultra-low-ESR C0G (NP0) RF multilayer ceramic chip capacitors (MLCCs) to better serve the evolving needs of the communications industry. Driven by continuous demand &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/kyocera-avx-releases-new-ultraminiature-0201-kgu-series-rf-mlccs/\">Read More &#8594;<span class=\"screen-reader-text\"> \"KYOCERA AVX Releases New Ultraminiature 0201 KGU Series RF MLCCs\"<\/span><\/a>"}, {"title": "Qualcomm introduces Dragonwing Q-2390 and IQ-2390 for consumer and industrial AIoT applications", "source": "CNX Software", "date": "2026-09-01", "url": "https://www.cnx-software.com/2026/09/01/qualcomm-introduces-dragonwing-q-2390-and-iq-2390-for-consumer-and-industrial-aiot-applications/", "summary": "<div><img alt=\"Qualcomm Dragonwing IQ2 Q2\" class=\"attachment-medium size-medium wp-post-image\" height=\"405\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/09/Qualcomm-Dragonwing-IQ2-Q2-720x405.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Qualcomm has announced the Qualcomm Dragonwing Q-2390 and IQ-2390 quad-core Cortex-A78/A55 processors for AIoT consumer, commercial and industrial applications. The Dragonwing Q-2390 processor is designed for commercial and consumer devices, notably for applications such as retail and smart home products, as well as smart displays and enterprise edge devices, while the Dragonwing IQ-2390 processor is the SKU from the Dragonwing IQ2 Series designed for industrial automation, machine vision, building management and energy systems. Qualcomm IQ-2390 and Q-2390 specifications: CPU 1x Arm Cortex-A78 core up to 1.5 or 1.9 GHz depending on SKU 3x Arm Cortex-A55 cores up to 1.5 or 1.9 GHz depending on SKU Optional SiFive E61 RISC-V real-time core up to 600MHz with 768kB memory Cache &#8211; 512 KB L3 cache GPU &#8211; Qualcomm Adreno 704 up to 1.1 GHz Audio DSP &#8211; Qualcomm Hexagon V66  up to 1.1 GHz NPU &#8211; Qualcomm Hexagon up to 1.1 TOPS DPU [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/09/01/qualcomm-introduces-dragonwing-q-2390-and-iq-2390-for-consumer-and-industrial-aiot-applications/\">Qualcomm introduces Dragonwing Q-2390 and IQ-2390 for consumer and industrial AIoT applications<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "IAR Adds Native Linux Support to Cross-Platform Embedded IDE", "source": "Embedded.com", "date": "2026-09-01", "url": "https://www.embedded.com/iar-adds-native-linux-support-to-cross-platform-embedded-ide/", "summary": "<p>IAR has expanded the cross-platform capabilities of its certified embedded development environment by adding native Linux support alongside Windows. Developed using the Qt Framework, the new IAR cross-platform IDE is designed to provide a development environment across operating systems for safety- and compliance-critical embedded software projects. The platform also integrates directly with Visual Studio Code [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/iar-adds-native-linux-support-to-cross-platform-embedded-ide/\">IAR Adds Native Linux Support to Cross-Platform Embedded IDE<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "Achronix Adds JESD204C IP Core for Speedster7t FPGAs", "source": "Embedded.com", "date": "2026-09-01", "url": "https://www.embedded.com/achronix-adds-jesd204c-ip-core-for-speedster7t-fpgas/", "summary": "<p>Achronix Semiconductor Corp. has introduced a high-performance JESD204C IP core for its family of Speedster7t FPGAs. The IP core is designed to connect advanced analog-to-digital converters and digital-to-analog converters to programmable logic. Each core supports data rates of up to 32 Gbits/s per lane and up to eight lanes per link, which translates into an [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/achronix-adds-jesd204c-ip-core-for-speedster7t-fpgas/\">Achronix Adds JESD204C IP Core for Speedster7t FPGAs<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "SensiBel Launches 84-dBA SNR Optical MEMS Microphone", "source": "Embedded.com", "date": "2026-08-31", "url": "https://www.embedded.com/sensibel-launches-84-dba-snr-optical-mems-microphone/", "summary": "<p>SensiBel has introduced the SBM140B, an optical MEMS microphone designed to provide high-fidelity audio capture across a wide acoustic range. The company claims it is the first MEMS microphone to combine an 84-dBA signal-to-noise ratio (SNR) with a 146-dB sound pressure level (SPL) acoustic overload point (AOP), resulting in a specified dynamic range of 136 [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/sensibel-launches-84-dba-snr-optical-mems-microphone/\">SensiBel Launches 84-dBA SNR Optical MEMS Microphone<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "Building an Upgrade Path for Safety-Critical Aerospace Computing", "source": "Embedded.com", "date": "2026-08-31", "url": "https://www.embedded.com/building-an-upgrade-path-for-safety-critical-aerospace-computing/", "summary": "<p>Avionic systems are expected to operate for decades. But the processors inside them have much shorter lifecycles. This creates an expensive problem for avionics engineers because replacing the processor may also force changes to the surrounding computing hardware and software. For instance, advanced drones and autonomous aerial systems need more computing power for perception, sensor [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/building-an-upgrade-path-for-safety-critical-aerospace-computing/\">Building an Upgrade Path for Safety-Critical Aerospace Computing<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}], "papers": [{"title": "GIFT: Guided Intermediate Feature Training via Action-Oriented Structural Supervision for Robotic Manipulation", "authors": ["Yupeng Zheng", "Xiang Li", "Songen Gu", "Yuhang Zheng", "Shuai Tian", "Weize Li", "Linbo Wang", "Chaoyue Li", "Qichao Zhang", "Haoran Li", "Zhongpu Xia", "Ya-Qin Zhang", "Shuicheng Yan", "Dongbin Zhao"], "published": "2026-09-03", "summary": "Vision-language pre-training and predictive world modeling provide robot policies with rich semantic and dynamic visual features, but their native action and visual-prediction objectives may omit critical physical and task structure while retaining control-irrelevant visual redundancy. We call this mismatch between visual richness and control utility the action-sufficiency gap. We investigate whether this gap can be bridged by guiding intermediate features to preserve three control-relevant structure in robotic manipulation: geometry governing motion feasibility, affordance encoding instruction-relevant entities, and goals grounding instructions in task-relevant regions. To this end, we present GIFT (Guided Intermediate Feature Training), an architecture-flexible framework for learning intermediate features that translates these structures into training-time constraints through geometry alignment, affordance prediction, and goal-region reconstruction. We instantiate GIFT in a Vision-Language-Action (VLA) policy, a direct-action World-Action Model (WAM), and an inverse-dynamics WAM while retaining each model's action formulation. Under zero-shot transfer to LIBERO-Plus, GIFT-VLA, GIFT-WAM-Fast, and GIFT-WAM-IDM outperform StarVLA-OFT, Fast-WAM, and Fast-WAM-IDM by 4.6, 12.6, and 5.2 points, reaching 79.6%, 72.6%, and 87.8%, respectively. On RoboCasa, the three GIFT variants reach 61.4%, 83.6%, and 82.3%, outperforming their counterparts by 12.6, 9.0, and 8.4 points, respectively. Together, these results establish learning functionally structured intermediate features as a reusable principle across model-specific action formulations, with especially large gains on articulated-object tasks and high-precision real-world manipulation under unseen visual and spatial perturbations. Project page: https://openphoenix-team.github.io/GIFT-pages.", "pdf_url": "https://arxiv.org/pdf/2609.04193v1"}, {"title": "Zero-Shot Novel Depth Synthesis Using 3D Foundation Models Scene Representations", "authors": ["Denis M. Akola", "David F. Fouhey"], "published": "2026-09-03", "summary": "3D Foundation Models (3DFMs) such as VGGT have recently pushed the boundaries of 3D vision by predicting rich unified representations with feed-foward transformers. The scene representations learned by these models enable strong performance on multiple 3D vision tasks. In this paper, we investigate using their internal representations to infer 3D in the scene from new views. Our hypothesis is that in order to solve the task of 3D reconstruction, these models need to learn a representation that includes a large amount of general knowledge about 3D scenes. After showing that it is possible to decode hidden surfaces from internal 3DFM representations, we propose a method, Z3D, that estimates pointmaps in unseen views by doing latent diffusion on 3DFM representation. We show that Z3D can predict realistic depth maps for new views across multiple datasets.", "pdf_url": "https://arxiv.org/pdf/2609.04174v1"}, {"title": "Reciprocity can halve what a mechanical network can learn", "authors": ["Thai-Son Vu", "Hoang-Giang Nguyen", "Quoc-Bao Nguyen", "Sengaloun Keoalounxay", "Bao-Viet Tran"], "published": "2026-09-03", "summary": "Tunable mechanical networks are being developed as materials that learn in place. Capacity is estimated by counting tunable parameters against target constraints, ignoring Maxwell-Betti reciprocity, the symmetry every passive, linear elastic network obeys by construction. When p degrees of freedom are both driven and read out, every reachable response block lies in a subspace of codimension p(p-1)/2, whatever the size, topology and stiffnesses; at full overlap nearly half the target space is unreachable. The consequence for training is a number: any learning rule leaves an error at least the norm of the target's antisymmetric part on the shared degrees of freedom, computable before training, and positive definiteness adds an orthogonal second term. A second-order optimiser with the exact Jacobian reaches that floor within 1% in 143 of 144 runs, a bond-local contrastive rule within 0.1% in 22 of 24, and odd couplings restore the lost directions at the price of an external torque source: the network becomes active. Prescribed-displacement drives obey a companion law we prove. The symmetry is classical; its consequence on a fixed graph with finitely many tunable stiffnesses at partial overlap is new. For a published robotic metamaterial it shows that no symmetric positive-definite stiffness matrix meets both targets in the linear model their deposited data integrate.", "pdf_url": "https://arxiv.org/pdf/2609.04169v1"}, {"title": "Formation Matrix and Energy-based Control of Multi-Agent Systems", "authors": ["Martín Crespo", "Sergio Junco", "Matías Nacusse"], "published": "2026-09-03", "summary": "This paper presents an energy-based controller for a multiagent robotic system designed to achieve and maintain a specific formation while moving on a plane and avoiding collisions between agents. The controller emulates a network of elementary spring-damper modules connecting pairs of agents. This network, with its de-energized states representing the desired formation, determines the system's dynamics, which is fully encapsulated by a bond graph model. The modeling is further enhanced through the introduction of a formation matrix, using a graph-theoretic approach, that describes both the distances and relative velocities among the agents of the arrangement. This matrix mathematically represents the interconnection and energy-exchange structure of the bond graph, allowing us to put it in correspondence with the control-by-interconnection CbI-scheme of the IDA-PBC theory, facilitating the solution of the formation control problem within the port-Hamiltonian system framework. Furthermore, the paper presents leader-following and position-based formation control systems based on the CbI scheme, including a stability analysis of the corresponding closed-loop systems. The theoretical findings are validated through numerical simulations across various scenarios.", "pdf_url": "https://arxiv.org/pdf/2609.04158v1"}, {"title": "Persistent Identity Preservation in Generative Image Models: A Benchmark and Evaluation System", "authors": ["Mengwei Ren", "Xuaner Zhang", "Zhihao Xia"], "published": "2026-09-03", "summary": "Generative image models can now produce high-quality images, follow complex instructions, and support precise edits, but they still struggle to preserve who or what is being depicted. When generating or editing images of a specific subject, identity may drift as the pose, expression, appearance, viewpoint, or surrounding scene changes. Existing subject-driven methods make fundamentally different choices about where identity is represented: through the input context (GPT-Image-2, NB2), as trainable subject-specific model parameters (LoRA), or as a persistent identity layer (PHOTA IDENTITY) reusable across generations and edits. We systematically benchmark these paradigms across subject-driven generation, editing, restoration, and multi-subject settings, with tasks designed to increasingly stress identity preservation. Our results show that identity preservation remains a distinct limitation of current generative foundation models: strong image quality and instruction following do not necessarily imply strong identity fidelity, and identity degradation becomes more pronounced under iterative edits, small subject scales, severe image degradation, and multi-subject composition. Persistent identity substantially reduces this degradation across generation, editing, and restoration, consistently improving identity preservation when applied to different foundation models while maintaining comparable instruction adherence and perceptual image quality. These results suggest that identity does not simply emerge from increasingly capable generative models, but can instead be represented as persistent subject knowledge that is composed independently with the underlying generative model.", "pdf_url": "https://arxiv.org/pdf/2609.04151v1"}, {"title": "A Low-Cost, Open Platform for End-to-End Autonomous Driving on a Miniature Ackermann Vehicle", "authors": ["Gustavo Claudio Karl Couto", "Eric Aislan Antonelo", "Gabriel George Zipperer"], "published": "2026-09-03", "summary": "This paper presents a low-cost, open experimental platform for research in end-to-end autonomous driving with miniature Ackermann vehicles. The platform combines a physical vehicle, a printed urban track, data collection tools, trajectory registration, and a Webots digital twin, enabling controlled experiments that connect simulation-based autonomous-driving methods to real-world execution. As a first baseline, we implement command-conditioned behavior cloning, in which a neural policy receives an on-board camera image and a high-level navigation command and outputs steering and speed. The system is evaluated both on the physical vehicle and in simulation. In real closed-loop experiments, the learned policy follows lanes and executes commanded turns, reaching a mean cross-track error of 6.1 cm with respect to the reference route, close to the 4.7 cm observed in human demonstrations. In the digital twin, camera field of view has a strong effect on performance, reducing the mean cross-track error from 35.6 to 3.3 cm when widened from 58 to 120 degrees. Using the digital twin to generate synthetic driving data and a learned sim-to-real image translator to reduce the appearance gap, we further show that a higher-capacity policy trained on this synthetic data combined with real demonstrations is the only configuration that completes all four track routes in closed loop, whereas the compact baseline and the same network trained on real data alone complete fewer. These results establish the open platform as a practical testbed for sim-to-real studies and provide an initial command-conditioned imitation-learning baseline; we release it to support reproducible research.", "pdf_url": "https://arxiv.org/pdf/2609.04147v1"}, {"title": "Corner Cases: Headland Coverage Path Planning for Autonomous Driving in Arable Farming", "authors": ["Riikka Soitinaho", "Timo Oksanen"], "published": "2026-09-03", "summary": "This paper presents a new method for headland coverage path planning for arable fields. Several earlier approaches suggest covering the headland with nested polygons and smooth turns, however, covering the field corners entirely requires manoeuvres with reversing. In the new method, the polygon corners are modified to allow a reversing turn. A comparison to two other methods considering gap, overlap, and crossing the field boundary shows an improvement in the coverage result especially in field corners of around 90 degrees, and 240 degrees and above. Applicability of the new method is shown with several examples of real polygonal field maps.", "pdf_url": "https://arxiv.org/pdf/2609.04103v1"}, {"title": "Compressing Streaming Neural Audio Encoders via Latent-Space Distillation", "authors": ["Prasanth Yadla", "Mohammad Samragh", "Dongseong Hwang", "Mingbin Xu", "Yuanyuan Zhang", "Chung-Cheng Chiu", "Yongqiang Wang", "Yuan Liu", "Zhen Huang", "Xiaodan Zhuang"], "published": "2026-09-03", "summary": "System-wide Dictation on Apple devices runs entirely on-device, and the speech it transcribes reaches the foundation model through a tokenizer: an encoder that maps short windows of waveform onto the representation the language model reads. Because that model is sparsely activated under Instruction-Following Pruning, only a small subset of its experts occupies DRAM at any time, so the always-on tokenizer competes for the same memory, and its parameter count bears directly on power and latency. In this work we study how to compress such a tokenizer by distillation, taking as the supervision target neither the discrete token nor the output distribution but the pre-quantizer latent the model actually consumes - the last representation the two token interfaces share. We train only the student encoder to regress the teacher's per-frame latent under a squared-error objective, with a single affine layer absorbing the teacher-student width mismatch. Because the target precedes both the quantizer and the language-model bridge, one recipe covers both token interfaces we support, and applies both to a tokenizer pretrained alone and to one jointly trained with a language model. At 2.8x compression the distilled student stays within 1.9% relative WER of its teacher on five of six teacher-student pairs without any fine-tuning, and improves on an independently trained tokenizer of identical capacity by 3.9% relative.", "pdf_url": "https://arxiv.org/pdf/2609.04102v1"}, {"title": "Adaptive Vision-Language Grasping via Composable Foundation Priors and Generalizable Grasp Synthesis", "authors": ["Sixu Yan", "Shikang Wang", "Binhua Huang", "Xuanlai Tang", "Guohua Fan", "Fan Huang", "Haoxuan Li", "Yongkang Li", "Yuhan Li", "Bencheng Liao", "Zeyu Zhang", "Wenyu Liu", "Hangxin Liu", "Xinggang Wang"], "published": "2026-09-03", "summary": "This paper proposes AdaRoboVLG, a task-adaptive Vision-Language-Grasp (VLG) framework that supports generalizable grasp synthesis across different robotic hands. Unlike existing VLG methods that tightly couple foundation models with end-to-end grasp policies, AdaRoboVLG learns an efficient generalizable base policy that generates and evaluates physically feasible grasp candidates through explicit kinematic mapping and force-closure-based stability estimation, while offloading task-dependent understanding to specialized foundation-model modules. These modules provide composable priors that are integrated into the grasp synthesis process, enabling contextually adaptive grasp synthesis without retraining the underlying grasp policy. Through extensive simulation and real-world experiments, we demonstrate that (i) the base policy exhibits efficient learning and strong cross-hand generalization, (ii) the framework effectively incorporates spatial, cognitive, and temporal priors to address three representative grasping challenges without compromising grasp synthesis performance compared to state-of-the-art methods, and (iii) these priors can operate jointly to enable functional grasping in cluttered and dynamic environments. These results indicate that decoupling physical grasp synthesis from task-dependent understanding provides a scalable paradigm for robotic grasping, allowing future advances in foundation models to be directly translated into improved grasp capabilities without redesigning or retraining the underlying grasp policy. Supplementary videos are available at https://adarobovlg.github.io/", "pdf_url": "https://arxiv.org/pdf/2609.04096v1"}, {"title": "TAP-Path: Task-Adaptive Structural and Token Pruning for Efficient and Trustworthy Pathology Foundation Models", "authors": ["Mehedi Hasan", "Ashfak Yeafi", "Md Khairul Islam"], "published": "2026-09-03", "summary": "Pathology foundation models improve transferable representation learning for histopathology, but recent gains often rely on encoders with hundreds of millions of parameters and high inference cost. We propose TAP-Path, a task-adaptive compression framework that directly restructures a pretrained Virchow2 encoder rather than distilling it into a separate student. TAP-Path combines validation-driven transformer-block selection, physical removal of redundant blocks, input-adaptive patch-token pruning, multi-depth feature recovery, and a lightweight gated task head. The final model retains 24 of 32 transformer blocks and 70% of patch tokens after pruning, reducing encoder parameters by 24.96% (631.24M to 473.70M) and analytical encoder compute by 35.20% (340.13G to 220.40G FLOPs). Across three task-head optimization seeds, TAP-Path achieved $87.98 \\pm 0.067%$ test accuracy, $81.26 \\pm 0.49%$ balanced accuracy, and $82.38 \\pm 0.48%$ macro-F1 on a 32-class histopathology benchmark, compared with 86.89% for full Virchow2 and 87.67% for UNI2-h. TAP-Path achieved a Brier score of $0.1800 \\pm 0.0005$ and failure-detection AUROC of $0.9047 \\pm 0.0060$. A validation-only rare-aware objective improved rare-class balanced accuracy in a secondary operating analysis. Frozen external evaluation on 433 CPTAC samples yielded $91.22 \\pm 0.83%$ accuracy and $91.10 \\pm 0.81%$ balanced accuracy. These results show that task-adaptive structural and token sparsification can improve the accuracy-efficiency trade-off of large pathology foundation models while preserving reliability under internal and external evaluation.", "pdf_url": "https://arxiv.org/pdf/2609.04071v1"}, {"title": "Continuous Actions from Discrete Minds: Latent-Aligned Planning for End-to-End Autonomous Driving", "authors": ["Ruoyu Yao", "Yusen Xie", "Qingzhao Liu", "Pei Liu", "Zewei Yang", "Yipeng Zhu", "Xiaolong Wang", "Jun Ma"], "published": "2026-09-03", "summary": "Bridging the gap between the discrete reasoning of Vision-Language Models and the continuous, physics-constrained nature of autonomous driving remains a significant challenge. In this work, we introduce LaPla, a unified Vision-Language-Action (VLA) framework featuring latent-aligned planning to seamlessly ground semantic understanding in precise motion execution. We first design an action tokenizer based on a residual vector-quantized variational autoencoder (VQ-VAE), capturing vehicle kinematics and encoding trajectory features into a structured latent space. Rather than discrete codebook lookups that inevitably introduce quantization errors, LaPla repurposes this representation as a physical prior to bridge the modality gap between high-dimensional semantics and the raw action space. Specifically, given multimodal inputs integrating multi-view images, historical actions, and textual instructions, LaPla incorporates concurrent action queries to causally attend to the multimodal context in a single forward pass, projecting hidden states directly into the pretrained VQ-VAE latent space. The frozen decoder then translates these continuous latents into actions, effectively eliminating quantization errors and ensuring physically plausible trajectories while bypassing time-consuming autoregressive generation. Extensive experiments on the nuScenes benchmark demonstrate that LaPla achieves competitive open-loop performance, reducing long-horizon L2 error by 15.52% compared to state-of-the-art VLA methods. Closed-loop evaluations on the NVIDIA AlpaSim simulator further confirm its superior capability in ensuring smooth driving progress, improving the success rate by 33.34 percentage points with significantly reduced inference latency.", "pdf_url": "https://arxiv.org/pdf/2609.04070v1"}, {"title": "Subspace Inference Enables Efficient Active Reward Learning from Preferences", "authors": ["Yutai Zhou", "Erdem Bıyık"], "published": "2026-09-03", "summary": "Reinforcement learning from human feedback (RLHF) has emerged as a powerful yet sample-inefficient approach for learning reward models from human preferences, making active learning a critical component in synthesizing informative preference queries. However, effective uncertainty quantification required for active learning remains a key challenge for large neural network reward models. In this paper, we introduce PreferenceEKF, a sample-efficient approach that tracks reward model uncertainty by framing active preference learning as a sequential Bayesian filtering problem. Instead of relying on computationally prohibitive posterior inference over the full neural network parameter space, our method performs sequential inference via an extended Kalman filter within a low-dimensional parameter subspace, continuously updating the reward model posterior as new preference queries arrive. Our approach enables scalable sampling of neural network parameters to efficiently compute acquisition functions for active reward learning. Experiments on the D4RL and V-D4RL benchmarks demonstrate that our approach achieves better sample efficiency, runtime, scalability, and calibration compared to other Bayesian deep learning approaches, and the learned reward models lead to competitive offline reinforcement learning policy performance. This highlights the potential of scalable Bayesian methods for preference-based reward modeling in RLHF. Our code is available at https://github.com/yutaizhou/bnn_pref.", "pdf_url": "https://arxiv.org/pdf/2609.04066v1"}, {"title": "IRWOZ 2.0: A Large Language Model-driven Dialogue Dataset for Industrial Robot Conversations", "authors": ["Chen Li", "Dimitrios Chrysostomou"], "published": "2026-09-03", "summary": "IRWOZ has improved industrial human-robot interaction (HRI) dialogue systems through domain-specific annotations. However, its initial version contains substantial noise in dialogue states and utterances, limiting state-tracking accuracy. We introduce IRWOZ 2.0, which addresses these limitations through large language model (LLM) enhanced generation (Mistral/Claude-3.5) and quality refinements. Our improved dataset expands to 390 dialogues across 4 industrial domains (Assembly, Delivery, Position, Relocation), featuring manual corrections and automated typo removal. Benchmark experiments on dialogue state tracking demonstrate significant improvements, with GPT-2's BLEU-4 score increasing from 0.1651 to 0.5604 compared to original IRWOZ. To support industrial HRI research, we publicly released IRWOZ 2.0 dataset at https://ieee-dataport.org/documents/irwoz-20-large-language-model-driven-dialogue-dataset-industrial-robot-conversations", "pdf_url": "https://arxiv.org/pdf/2609.04030v1"}, {"title": "LLM4CKD: Large Language Models for Early Stage Chronic Kidney Disease Screening", "authors": ["Muhammad Ashad Kabir", "Sirajam Munira"], "published": "2026-09-03", "summary": "Early screening of chronic kidney disease (CKD) is critical for timely intervention, yet most machine learning (ML) and deep learning (DL) approaches require labeled data and model training, limiting their use in real-world screening settings. This study evaluates the effectiveness of large language models (LLMs) for CKD screening under zero-shot and few-shot in-context learning settings and compares them with traditional ML and DL methods. We propose a framework that uses clinically selected tabular features and structured prompt templates to enable LLM-based inference without task-specific training. LLM performance is evaluated across multiple prompt styles, feature configurations, and data settings, and compared with standard ML, DL, and tabular foundation model (TFM) baselines, and existing CKD screening tools. The results show that LLMs can achieve competitive performance using only a small number of examples, often matching or outperforming traditional approaches in low-data settings. However, their performance remains model-dependent and less stable as input complexity increases. In contrast, ML, DL, and TFM models show more consistent improvement with larger training data. Overall, the findings highlight a trade-off between data efficiency and stability, suggesting that LLMs may serve as a flexible complementary approach for CKD screening when labeled data are limited.", "pdf_url": "https://arxiv.org/pdf/2609.04013v1"}, {"title": "Catalogue Photography as a Cold Start: Toward Deployable Carbide Burr Recognition", "authors": ["Abilash Philip Madavath", "Chandra Yuvesh Aubeeluck", "Augustin Raju", "Nicolas Pyschny", "Felix Hackelöer", "Florian Zwanzig"], "published": "2026-09-03", "summary": "Verifying that manufactured batches of milling tools or carbide rotary burrs conform to production order sheets remains a largely manual and error-prone quality assurance task. Automating this process with computer vision faces a critical cold-start constraint since no labelled imagery is available, leaving manufacturer catalogue photography as the sole source of supervision. We investigate how far catalogue supervision can support an industrial recognition pipeline under domain shift, explicitly measuring the gap between catalogue separability and performance on held-out field photographs. Our findings reveal three key insights. First, off-the-shelf frozen feature extractors do not reliably separate the two task attributes, head shape and tooth profile, motivating targeted representation learning. Second, metric learning produces near-perfect unsupervised cluster discovery on catalogue images (adjusted Rand index 0.94--0.97), but less than half of this gain transfers to field photographs. Third, the largest transfer gains do not come from model scale or representation complexity, but from simple changes that reduce domain sensitivity: converting images to grayscale (+0.22) and constraining retrieval using the known order sheet via Hungarian assignment (+0.11). We therefore treat catalogue photography as a useful cold start rather than a deployment-ready training domain, and provide empirical baselines and an evaluation protocol for catalogue-to-field transfer in precision tool manufacturing.", "pdf_url": "https://arxiv.org/pdf/2609.03995v1"}, {"title": "MulDP: Multimodal Diffusion Policy for Autonomous Quadruped Parkour Navigation across Complex Terrains", "authors": ["Kangmai Hu", "Yueqi Zhang", "Peng Zhai", "Xiaoyi Wei", "Jiabin Hu", "Zhixiang Liu", "Quancheng Qian", "Lihua Zhang"], "published": "2026-09-03", "summary": "Quadruped robots have demonstrated impressive agility in parkour locomotion across complex terrains. However, most systems still rely on human intervention for high-level planning, and autonomous parkour navigation remains underexplored. The key challenges include fine-grained velocity regulation, long-horizon anticipatory behaviors, and tight coupling between perception and embodied execution. To address these challenges, we propose a Multimodal Diffusion Policy (MulDP) that integrates visual perception with robot proprioception and goal information to generate temporally coherent and anticipatory navigation velocity commands, tightly coupling perception with embodied control to enable robust autonomous navigation. To support the training of MulDP, we construct the first Quadruped Parkour Navigation Dataset (QPND), a multimodal dataset that encompasses diverse navigation behaviors and complex terrains. Extensive simulation and real-world experiments demonstrate that MulDP enables robust long-horizon autonomous navigation and effective traversal across complex terrains.", "pdf_url": "https://arxiv.org/pdf/2609.03984v1"}, {"title": "Automated Weld Seam Recognition and 3D Mapping for Robotic Post Processing Using Photogrammetry and Semantic Segmentation", "authors": ["Augustin Raju", "Abilash Madavath", "Chandra Yuvesh Aubeeluck", "Nicolas Pyschny", "Felix Hackelöer", "Florian Zwanzig"], "published": "2026-09-03", "summary": "Accurate identification of weld seam geometries is essential for automated robotic post processing operations such as grinding, finishing, and inspection. For large workpieces, complete surface scanning using high precision laser scanners or structured light sensors can be time consuming and often generates substantial amount of data that are not relevant. This paper presents an experimental vision based pipeline for the approximate localization of weld seams. This serves as a preliminary stage before high precision measurement. The proposed approach aims to reduce the overall scanning effort and data acquisition efficiency. The proposed method includes capturing images of the workpiece from multiple viewpoints, identifying weld seams from the images using semantic segmentation, reconstructing the workpiece using photogrammetry, and projection of identified weld seams into the reconstructed model.", "pdf_url": "https://arxiv.org/pdf/2609.03970v1"}, {"title": "WorldReward: Reward Modeling for Camera-Conditioned World Models", "authors": ["Yibin Wang", "Zehan Wang", "Junshu Tang", "Zhimin Li", "Yujie Zhou", "Jiazi Bu", "Pengyang Ling", "Feng Han", "Zhixiong Zhang", "Long Xing", "Shengyuan Ding", "Ziang Li", "Cheng Jin", "Yuhang Zang", "Jiaqi Wang", "Tianyu Pang"], "published": "2026-09-03", "summary": "Camera-conditioned world models generate interactive videos in which commanded actions should induce the expected scene changes while appearance, geometry, and temporal dynamics remain coherent. Existing rewards assess these requirements separately: geometry-based rewards estimate trajectory execution but cannot judge the visual quality of the executed motion, whereas image-based rewards measure frame quality without capturing action execution or temporal dynamics. We posit that a vision-language model (VLM) offers a shared reasoning space for relating actions to their visual outcomes. However, judging a complete long video against its full action sequence creates a lengthy, noisy context in which short-lived local action evidence can be missed or diluted. We present WorldReward, a VLM-based pairwise preference reward model that unifies action-consistency and visual-quality evaluation for camera-conditioned world models. WorldReward decomposes paired videos into action-aligned chunks, organizes each chunk into structured visual evidence, and aggregates chunk-level decisions by voting into separate video-level action and visual-quality preferences. To train it, we construct a large-scale reasoning-augmented preference dataset using structured judgments generated by a frontier VLM and refined through tool-based agent auditing and targeted human review. We further introduce WorldReward-Bench, a human-annotated benchmark measuring reward-model agreement with human preferences across action consistency, appearance quality, and motion quality. WorldReward achieves the highest agreement on all three dimensions, exceeding GPT-5.5 by 3.42, 1.45, and 3.56 percentage points, respectively. When used for RL post-training of HY-WorldPlay 1.5, it consistently improves both action execution and visual quality across short- to long-term horizons.", "pdf_url": "https://arxiv.org/pdf/2609.03952v1"}, {"title": "Computationally Efficient Pathology Segmentation using Knowledge Distillation from Foundation Models", "authors": ["Jiaqi Lv", "Yijie Zhu", "Saki Okada", "Maxwell Stanley Renna", "Robert Goldin", "Stefan Antonowicz", "Shan E Ahmed Raza"], "published": "2026-09-03", "summary": "Automatic tissue segmentation is essential for large-scale analysis of histopathology whole-slide images (WSIs), but accurate pixel-level segmentation remains challenging. Pixel-level annotations are expensive to obtain, models pre-trained on natural images may transfer poorly to histopathology, and pathology foundation models, despite their strong representations, are computationally expensive to deploy at scale. We address these challenges with a foundation-model knowledge distillation framework for efficient tissue segmentation. We first train Virchow2-based segmentation teachers, including a LoRA-adapted variant, achieving state-of-the-art or highly competitive performance across four datasets: PUMA, IGNITE, BEETLE, and a private blood vessel segmentation dataset. We then transfer response-level and feature-level knowledge from these teachers into compact student networks. Distillation consistently improves student performance over supervised training alone, producing state-of-the-art or near state-of-the-art results with substantially fewer parameters and up to ten-fold higher inference throughput than foundation-model-based segmentation networks. These results show that foundation-model knowledge can be effectively transferred to efficient segmentation models for scalable deployment without compromising performance. Models trained on the public datasets will be released through TIAToolbox.", "pdf_url": "https://arxiv.org/pdf/2609.03947v1"}, {"title": "Toward Unified Robot Learning: Bridging Representation, Vision-Language-Action, and World Models", "authors": ["Shaunak A. Mehta", "Ananya Hazarika", "Haochen Zhang", "Fan Yang", "Ryo Moriyama", "Wenkai Li", "Yash Patel", "Kanata Suzuki"], "published": "2026-09-03", "summary": "For robots to operate reliably in real-world environments, they need to perceive their surroundings, act, and reason about the consequences of those actions. Rapid progress in the domains of representation learning, VLA models, and world models has significantly enhanced the capabilities of robot learning systems, enabling robots to work in increasingly complex environments. However, these paradigms are typically developed in isolation, resulting in fragmented systems that struggle with generalization, long-horizon temporal reasoning and planning, and deployment in unstructured environments. In this survey, we present a unified perspective on robot learning by organizing the existing methods along three complementary axes: understanding through representation learning, acting through VLA models, and reasoning through world models. We introduce a structured taxonomy that captures key design choices in environment representation, policy learning, and predictive modeling, and summarize the recent progress in these domains. Beyond classifying the existing works, we analyze how these components interact, discuss common limitations, and highlight emerging trends towards more integrated systems. Through this lens, we identify the challenges in the domain of robot learning, including uncertainty quantification, out-of-distribution generalization, cross-embodiment transfer, long-context understanding, and long-horizon planning. We argue that these challenges arise not only from limitations within individual components but also from the lack of integration across perception, action, and reasoning. Building on this analysis, we outline future directions towards unified, physically grounded, and probabilistic robot learning to develop robust robotic systems that maintain consistent internal representations and support decision making over extended interactions in real-world environments.", "pdf_url": "https://arxiv.org/pdf/2609.03927v1"}, {"title": "Revisiting Topological Graphs for Macro Action based Closed-loop Reinforcement Learning of Vision Language Navigation in Continuous Environment", "authors": ["Shuhao Ye", "Sitong Mao", "Yuxiang Cui", "Yufei Wei", "Xuan Yu", "Shichao Zhai", "Wen Chen", "Shunbo Zhou", "Rong Xiong", "Yue Wang"], "published": "2026-09-03", "summary": "Vision-Language Navigation in Continuous Environments (VLN-CE) requires an agent to follow natural language instructions through unseen environments. Existing imitation learning (IL) pipelines struggle in this closed-loop setting: behavior cloning suffers from distribution shift, and DAgger's expert actions become ambiguous upon trajectory deviation. While Reinforcement Learning (RL) offers a natural paradigm to address this, directly applying RL to micro action spaces is sample-inefficient due to reward sparsity. To overcome this bottleneck, we reformulate VLN-CE as a Hierarchical Markov Decision Process (MDP), explicitly decoupling high-level planning from low-level control. By abstracting the environment into a topological graph, our high-level policy operates on a macro action space of frontier nodes, with a training-free low-leve
