u", "Xin Zhang", "Haisheng Su", "Yinzhou Tang", "Chen Gao", "Wei Wu", "Yong Li"], "published": "2026-10-13", "summary": "World models (WMs) and world-action models (WAMs) focus on future world prediction and executable action generation, respectively. Although these models learn shared physical dynamics and interaction semantics from embodied trajectories, they are typically trained in isolation, which restricts knowledge reuse between prediction and control. The central challenge is therefore to develop a unified learning framework that shares these dynamics while preserving the distinct modeling capabilities required by each paradigm. We propose UniW(A)M, a mixture-of-experts world-(action) model built upon diffusion Transformers that unifies action-conditioned world modeling and diverse WAM variants. Shared experts capture common dynamics, while atomic capability experts are reused across interfaces so that each interface keeps its own conditional pathway. At deployment, a plug-in adaptive interface router (PAIR) learns from a small subset of target-task chunk scenarios to select a suitable WAM interface for each execution chunk, balancing task success and execution efficiency while keeping the backbone frozen. We evaluate UniW(A)M on LIBERO, RoboTwin 2.0, and three real-world manipulation tasks, where it achieves 88.3% average real-world success versus 76.7% for the strongest baseline. On WorldArena, it leads action-conditioned world modeling on all three tasks. AC-WM co-training contributes to action generation on every action interface and PAIR raises OOD success from 63.3% to 76.7%.", "pdf_url": "https://arxiv.org/pdf/2610.18697v1"}, {"title": "GeoReader: Learning Latent Geometry for Spatial Reasoning in Vision-Language Models", "authors": ["Rong Li", "Shijie Li", "Jiangyong Huang", "Lingdong Kong", "Jiaming Zhou", "Dongyue Lu", "Zeying Gong", "Baoxiong Jia", "Junwei Liang", "Siyuan Huang"], "published": "2026-10-13", "summary": "Vision-language models (VLMs) struggle with metric and multi-view relationships that remain implicit in RGB observations. Geometry foundation models recover this structure from RGB, but existing methods either fuse the estimated features with visual tokens and learn to use them from question answering alone, or align VLM latents with geometry features. Capturing geometry, however, does not ensure its use: zeroing the aligned latents of a released feature-alignment model leaves its accuracy unchanged. We introduce GeoReader, a framework that learns geometric representations for the VLM that reads them. First, we train lightweight Geometric Readers to produce continuous input tokens, supervising them with geometry descriptions decoded by a frozen VLM, so that the Readers express geometry in a form the target model can already read. We then freeze the Readers to preserve this interface while fine-tuning the VLM on spatial QA, with geometry injection conditioned on the question. Geometry descriptions serve only as training targets: at inference, the VLM answers directly from the continuous geometric tokens without generating a geometry chain of thought. With geometry predicted from RGB images, our approach reaches 94.3 on MindCube-Tiny with Qwen3-VL-4B and, with a multi-source QA mixture, an average of 72.5 across six additional spatial benchmarks with Qwen3.5-9B. These results suggest that a useful geometric representation is one the receiving model can use, not merely one from which geometry can be reconstructed.", "pdf_url": "https://arxiv.org/pdf/2610.18694v1"}, {"title": "RadarGSOcc: Doppler-Aware 3D Semantic Occupancy Prediction Using 4D Radar Tensor with Geometric-Semantic Feature Extraction", "authors": ["Christofel Rio Goenawan", "Dong-Hee Paek", "Seung-Hyun Kong"], "published": "2026-10-13", "summary": "3D semantic occupancy prediction is crucial for autonomous driving, but camera-based methods degrade in low-light conditions and LiDAR-based methods are sensitive to adverse weather. 4D radar is more robust, yet its sparsity and the high cost of radar tensor processing limit its use. We propose Radar Geometric-Semantic Occupancy Prediction (RadarGSOcc), an efficient framework that directly processes 4D radar tensors by separately extracting geometric and semantic features, including Doppler information, with a deformable attention-based geometric refinement module as its key component. We also introduce the K-Radar 3DSemOcc benchmark, the first large-scale benchmark for 3D semantic occupancy prediction using 4D radar tensors, built on the K-Radar dataset with refined LiDAR-based annotations. RadarGSOcc predicts 15 classes within a 51.2m range and achieves 38.2% IoU, 7.6% mIoU, and 25.5% weighted mIoU, outperforming RadarOcc by 17% relative (25.5 vs. 21.9) in weighted mIoU while using fewer parameters and lower computation. It substantially improves truck prediction while trading off car accuracy, outperforms camera-based approaches, and narrows the gap with LiDAR-based methods. To assess robustness without per-frame ground truth in adverse weather, we further propose a novel proxy metric, Environment-Based KL Divergence (EBKL), under which 4D radar proves a reliable and efficient modality for 3D semantic occupancy prediction. The dataset and code will be publicly available.", "pdf_url": "https://arxiv.org/pdf/2610.18686v1"}, {"title": "Model-Based Online Decision Making via Generative Trajectory Planning", "authors": ["Haldun Balim", "Yilun Du", "Na Li"], "published": "2026-10-13", "summary": "Online decision-making faces a tension between efficient inference and long-horizon reasoning. Value-based methods rely on short-horizon bootstrapping that limits the propagation of long-term information, while trajectory optimization methods plan explicitly but must solve a high-dimensional optimization problem at every decision step. We propose Generative Trajectory Planning (GTP), a model-based framework that addresses this tension by learning a generative model as a proposal distribution over action sequences. Instead of optimizing sequences from scratch, GTP samples candidate sequences from a diffusion prior and refines them using learned dynamics, reward, and value models, enabling efficient trajectory-level reasoning. Across continuous control and long-horizon manipulation tasks, GTP matches or exceeds state-of-the-art model-free, diffusion-policy, and model-based baselines, and remains stable in regimes where strong baselines degrade. Our results suggest that generative models are best understood not as policies, but as structured proposal distributions for planning, offering a new perspective on how to integrate generative modeling with model-based decision-making.", "pdf_url": "https://arxiv.org/pdf/2610.18677v1"}, {"title": "Perception Beyond the Visible: Incompleteness-Aware Scene Understanding for Robot Autonomy", "authors": ["Rohit Mohan"], "published": "2026-10-13", "summary": "Reliable robot autonomy requires reasoning about the world from partial and noisy observations. However, many perception systems model only visible scene regions, rely on fixed semantic categories, and assume reliable sensor measurements. These assumptions break under occlusion, novel object encounters, and sensor degradation. In this paper, I present a research vision for incompleteness-aware scene understanding. I organize this vision around three fundamental challenges: incomplete evidence, incomplete knowledge, and incomplete sensor reliability. I discuss my research contributions toward addressing these challenges through amodal perception, semantic occupancy forecasting, open-world scene understanding, label-efficient learning, and uncertainty-guided multi-modal fusion. Building on these contributions, I outline future research directions toward belief-centric 4D scene representations. These representations aim to jointly model geometry, semantics, motion, and uncertainty. I also discuss active sensing and safe adaptation strategies that allow robots to reduce uncertainty through interaction. The goal is to develop calibrated and actionable scene representations that support reliable autonomy in dynamic, open-world environments.", "pdf_url": "https://arxiv.org/pdf/2610.18670v1"}, {"title": "Known-Voice Cloning and the Limits of Personality Transfer for Character Design", "authors": ["Johanna Magdalena Kuch", "Maud van Lier", "Daksitha Senel Withanage Don", "Patrick Gebhard", "Tanja Schneeberger", "Elisabeth André"], "published": "2026-10-13", "summary": "Recent advances in zero-shot voice cloning systems make it possible to reproduce a recognizable voice from a short recording and attach it to arbitrary virtual characters. Prior work suggests that familiar vocal identity can carry over associated personality impressions to new targets such as robots or virtual characters. However, these works have mainly examined familiarity and personalization effects rather than directly testing whether a cloned familiar voice systematically transfers personality impressions to an embodied virtual character. Such transference raises the concern that cloned voices could be used to manipulate people into engaging with virtual characters as capable social actors. Across two studies, we investigated whether personality impressions transfer when a virtual character speaks with the cloned voice of a familiar person. Study 1 examined this question in a real-world university setting using the cloned voice of a lecturer familiar to the participating students. Study 2 examined the same question online using voices of social media content creators and members of their communities. Drawing on the concepts of identity activation, trait transfer, and person reconstruction, we show that evidence of personality transfer was limited in both studies. Observed effects were selective and did not generalize across traits or study contexts. In the online study in particular, recognizable voice identity cues activated expectations about the speaker but did not reconstruct the broader person impression. Qualitative responses further indicated that judgments were frequently shaped by perceived artificiality and by whether voice and appearance fit together. Our findings moderate common concerns that cloned voices straightforwardly manipulate people into perceiving artificial characters as capable social actors.", "pdf_url": "https://arxiv.org/pdf/2610.18669v1"}, {"title": "ForkCast: Predictive Recovery for Vision-Language-Action Policies via Counterfactual Futures", "authors": ["Chenru Wen", "Huajian Zeng", "Haokai Ding", "Jian Kang", "Anqing Duan", "Dawei Zhou", "Dezhen Song", "Xingxing Zuo"], "published": "2026-10-13", "summary": "Vision-language-action (VLA) policies perform manipulation tasks using camera images and language instructions, but object slip or visual occlusion can disrupt execution. Recovery is typically learned during policy training or delegated to a monitor that triggers a scripted repair after detecting a failure. We introduce ForkCast, a predictive recovery framework that compares counterfactual futures to determine whether and how to intervene in a frozen VLA policy. At each decision point, ForkCast evaluates three candidates: executing the policy's nominal action chunk (Commit), adjusting the camera viewpoint (Reobserve), and replanning the arm trajectory (Replan). A candidate-conditioned world model forecasts the latent outcome of each candidate at a common future horizon, and a shared task-progress head scores the predicted outcomes. By evaluating the policy's own continuation alongside the repair candidates, a single comparison based on task progress determines both whether and how to intervene, without a failure detector, an intervention threshold, or updates to the VLA backbone. On five simulated RoboTwin 2.0 tasks with injected occlusion and object slip, ForkCast increases pooled success from 13.3% for the frozen $π_{0.5}$ policy to 30.0% and transfers to two additional VLA backbones without updating ForkCast. After adaptation on real-robot candidate rollouts, ForkCast also improves success over the base policy under both clean and visibility-limited conditions. Code will be released to benefit the research community.", "pdf_url": "https://arxiv.org/pdf/2610.18650v1"}, {"title": "Cosmic Evolution Survey: LOFAR 144 MHz imaging of the COSMOS field", "authors": ["E. Vardoulaki", "T. Shimwell", "M. J. Hardcastle", "L. Doukas", "L. K. Morabito", "C. L. Hale", "M. T. Sargent", "V. Smolčić", "G. Zamorani", "G. Gozaliasl", "F. An", "M. Aravena", "A. L. Faisst", "M. Vaccari", "E. Treister", "A. Finoguenov", "P. Best", "J. S. Kartaltepe", "C. Casey", "S. Jin", "V. Mainieri"], "published": "2026-10-13", "summary": "We present the first deep, targeted LOFAR 144 MHz source catalogue of the COSMOS field, together with the first 144 MHz source counts in this field. The data comprise 48 h of observations. Over the 2.6 sq. deg. region adopted for the catalogue analysis, the final Dutch-array image reaches a median rms sensitivity of ~100 uJy/beam at an angular resolution of 15\" x 6\". The resulting catalogue contains 1984 radio sources; a peak S/N >= 5 selection is adopted for the resolved/unresolved classification and source-count analysis. We characterised the catalogue using Monte Carlo source-injection and recovery simulations, including dedicated simulations of extended sources, to quantify completeness, flux-density redistribution, and morphology-dependent source-recovery effects. The catalogue reaches 90% completeness at 1.48 mJy. The resulting Euclidean-normalised differential source counts are measured down to ~0.4 mJy and show good agreement with LoTSS DR3 144 MHz source counts and with the VLA-COSMOS 3 GHz counts scaled to 144 MHz, with ~5% of catalogue sources having multiple 3 GHz counterparts within a beam-matched search region. Comparison with the VLA-COSMOS 3 GHz catalogue shows good astrometric agreement, with median offsets of Delta_RA = 0.35\" (+0.03\"/-0.05\") and Delta_Dec = -0.83\" (+0.02\"/-0.03\"), approximately 6% of the corresponding synthesised-beam dimensions, and no significant radial dependence across the field. The resulting catalogue provides a low-frequency view of COSMOS and a reference dataset for future deeper LOFAR observations and multiwavelength studies of this extensively characterised extragalactic field.", "pdf_url": "https://arxiv.org/pdf/2610.18648v1"}, {"title": "Pedestrian Trajectory Prediction through LoRA Federated Training", "authors": ["Simone Travagliati", "Maria Luisa Merani"], "published": "2026-10-13", "summary": "In Intelligent Transport Systems, protecting vulnerable road users, specifically pedestrians, is a paramount challenge. The present work contributes to this field, putting forth a distributed architecture in which vehicles connected to the cellular infrastructure collect pedestrians' trajectories and fine-tune a foundation model for pedestrian trajectory forecasting via federated training. A server positioned at the edge of the cellular network is responsible for aggregating the local model's parameters from the vehicles and updating the global model's parameters. To reduce radio resource utilization, Low-Rank Adaptation is proposed; to decrease both the number and the size of updates, an increase in the number of training rounds performed by the vehicles per communication round is put forth. A novel figure of merit is then introduced to quantify the use of radio resources dedicated to Vehicle-to-Infrastructure communications as required by the federated solution. The proposed scheme delivers excellent prediction accuracy while significantly reducing the communication cost compared to alternative federated training methods. This shows that combining fine-tuning, Low-Rank Adaptation, and a reduction of the communication periodicity between the vehicles and the edge server is key to enabling a distributed approach to trajectory prediction in vehicular environments.", "pdf_url": "https://arxiv.org/pdf/2610.18640v1"}, {"title": "Grid or Nodes? Probing Object Memory in World Models Under Partial Observability", "authors": ["Justin McMillen", "Yasin Yilmaz"], "published": "2026-10-13", "summary": "A robot's world model must remember objects that leave the camera's view. FloWM, a learned world model, keeps them in a spatial grid of features that it moves with five built-in velocities. A node memory instead keeps each object's position and velocity as numbers. We compare them in FloWM's own block world, with an oracle-fed Kalman tracker as the node memory. How the grid is read changes its score: a single-cell probe finds 66% of out-of-view blocks, while FloWM's own probe 89%. FloWM also scores 8 points higher in view although no frame is shown, which we attribute to its write-back of its own predictions. Out of view, the tracker reaches FloWM's range in 14KB against 5.6MB, with no probe. On diagonal motion, outside its five velocities, FloWM finds 11% of blocks even after fine-tuning, while the unchanged tracker keeps 93%. Faster blocks defeat both until one more allowed speed takes the tracker to 94%, where FloWM's built-in shifts would need 25 copies of its grid. A learned node memory must still replace the oracles and handle velocity under noise, long gaps, and the bounce.", "pdf_url": "https://arxiv.org/pdf/2610.18637v1"}, {"title": "MajorTOM:Elliot Pretrain, A Multi-Sensor, Multi-Temporal Pretraining Dataset for Earth Observation", "authors": ["Carmen Oliver Huidobro", "Mikolaj Czerkawski", "Kevin Monsalvez-Pozo", "Cesar Aybar", "Gustau Camps-Valls", "Oscar J. Pellicer-Valero"], "published": "2026-10-13", "summary": "Pretraining generalist Earth observation foundation models requires data that combine several sensors, varied temporal sampling and, increasingly, text, yet open datasets rarely provide all three in one consistent, easily accessible form. We introduce MajorTOM:Elliot Pretrain, a collection of 279,166 tiles of 10 km drawn from the Major-TOM grid by clustering AlphaEarth embeddings. Each tile stacks Sentinel-2 L1C, Landsat-8/9, Sentinel-1 RTC, Copernicus DEM and ESA WorldCover on a shared 1056x1056-pixel, 10 m grid, complemented by cloud masks, OpenStreetMap entities and ERA5 weather. The tiles are partitioned into three temporal regimes, Monotemporal (250,000 tiles, one acquisition), Monthly (12,500 tiles, twelve acquisitions spread over the annual cycle) and Burst (16,666 tiles, six acquisitions within 30 days), and are released as 6.3 TB of Cloud Optimized GeoTIFFs indexed by TACO v3 Parquet metadata, a standard that allows cloud streaming, efficient data access, and filtering before any pixel is read. A companion library derives sensor-tagged fact sheets, captions and 16 families of vision-language tasks from these layers at load time. We test our design choices in short pretraining runs of OlmoEarth-Base. First, a 25% subset of Major-TOM Core-S2L2A curated with AlphaEarth embeddings matches or exceeds the full corpus on 8 of 9 benchmarks. Second, on Elliot-Pretrain, adding Landsat-8/9 improves or matches Sentinel-2 only pretraining on every benchmark. Third, using DEM and WorldCover as prediction targets during pretraining further improves 8 of 9 benchmarks, while giving the same maps to the encoder as inputs degrades 5 of 9. Fourth, Sentinel-1 helps on 7 of 9 benchmarks, particularly on benchmarks with radar inputs. Fifth, rule-based captions match a small language model at no cost. The dataset is openly available at https://source.coop/major-tom/elliot-pretrain.", "pdf_url": "https://arxiv.org/pdf/2610.18624v1"}], "repos": [{"repo": "harvard-edge/cs249r_book", "stars": 28988, "language": "Python", "description": "Machine Learning Systems: Foundations, Scaling, Agentic AI, and Physical AI (Vols I–IV) • Harvard CS249r | https://mlsysbook.ai", "url": "https://github.com/harvard-edge/cs249r_book", "date": "2026-10-14", "topic": "embodied-ai", " /* ── helpers ── */
const esc = v => String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const plain = v => { const d=document.createElement('div'); d.innerHTML=String(v??''); return d.textContent||''; };
const titleOf = x => x.title||x.repo||x.model||x.company||'Untitled';
const dateOf  = x => x.date||x.published||x.posted||'';
const srcOf   = x => { const s=x.source; if (s && !/^https?:\/\//.test(s)) return s; return x.company||x.language||x.topic||x.category||''; };
const scoreOf = x => Number(x.score||x.stars||x.downloads||0);
const isSeed  = x => { const u=x.url||x.pdf_url||''; return u.includes('example.com')||(x.title||'').toLowerCase().startsWith('example'); };
const fmt = n => n>=1e6?(n/1e6).toFixed(1)+'M':n>=1000?(n/1000).toFixed(1)+'K':String(n);
const truncWords=(t,n=100)=>{if(!t)return'';const w=t.trim().split(/\s+/);return w.length<=n?t:w.slice(0,n).join(' ')+'…';};

/* ── stars (persist across data refreshes via localStorage, keyed by URL) ── */
const keyOf = x => x.url||x.pdf_url||titleOf(x);
let STARS = new Set(JSON.parse(localStorage.getItem('hub-stars')||'[]'));
const isStarred = x => STARS.has(keyOf(x));
function toggleStar(k) {
  if (STARS.has(k)) STARS.delete(k); else STARS.add(k);
  localStorage.setItem('hub-stars', JSON.stringify([...STARS]));
}
function starredRows() { return allRows().filter(isStarred); }


function hrefOf(x) {
  if (x.pdf_url) {
    const m=x.pdf_url.match(/arxiv\.org\/(?:pdf|abs)\/([0-9]+\.[0-9]+)/);
    if (m) return 'https://arxiv.org/abs/'+m[1];
  }
  if (x.url) return x.url;
  if (x.pdf_url) return x.pdf_url;
  if (x.source && /^https?:\/\//.test(x.source)) return x.source;
  return '#';
}

function cutoff(r) {
  if (r==='all') return '';
  const d=new Date();
  if (r==='today') d.setHours(0,0,0,0);
  else if (r==='7d')  d.setDate(d.getDate()-7);
  else if (r==='30d') d.setDate(d.getDate()-30);
  else if (r==='90d') d.setDate(d.getDate()-90);
  return d.toISOString().slice(0,10);
}

function colorOf(k) { return SRC_COLOR[k]||(TOPICS[k]&&TOPICS[k].color)||'#818cf8'; }
function labelOf(k) { return SRC_LABEL[k]||(TOPICS[k]&&TOPICS[k].label)||k; }
function iconOf(k)  { return SRC_ICON[k]||(TOPICS[k]&&TOPICS[k].icon)||'•'; }

/* ── rows ── */
function allRows() {
  return Object.entries(data).flatMap(([k,rows])=>rows.filter(x=>!isSeed(x)).map(x=>( {...x,_k:k} )));
}
function rowsFor(ds) {
  if (ds==='starred') return starredRows();
  if (TOPICS[ds]) {
    const t=TOPICS[ds];
    return (data.papers||[]).filter(x=>{
      if (isSeed(x)) return false;
      const txt=(x.title+' '+(x.summary||'')).toLowerCase();
      return t.kw.some(k=>txt.includes(k));
    }).map(x=>( {...x,_k:ds} ));
  }
  return ds==='all'?allRows():(data[ds]||[]).filter(x=>!isSeed(x)).map(x=>( {...x,_k:ds} ));
}
function filtered() {
  const q=state.q.trim().toLowerCase(), from=cutoff(state.dr);
  let rows=rowsFor(state.ds);
  if (q) rows=rows.filter(x=>JSON.stringify(x).toLowerCase().includes(q));
  if (from) rows=rows.filter(x=>dateOf(x)>=from);
  return rows.sort((a,b)=>{
    if (state.sort==='score') return scoreOf(b)-scoreOf(a);
    if (state.sort==='alpha') return titleOf(a).localeCompare(titleOf(b));
    return dateOf(b).localeCompare(dateOf(a));
  });
}

/* ── render stats (with count-up) ── */
let lastDs='';
function renderStats() {
  const rows=rowsFor(state.ds);
  const scored=rows.filter(x=>scoreOf(x)>0).length;
  const jobs=rows.filter(x=>x._k==='jobs').length;
  const latest=rows.map(dateOf).filter(Boolean).sort().pop()||'—';
  const items=[
    ['⚡','Total Signals',rows.length,'#818cf8'],
    ['🎯','Scored Items',scored,'#38bdf8'],
    ['💼','Job Postings',jobs,'#34d399'],
    ['📅','Latest',latest,'#fbbf24'],
  ];
  document.getElementById('stats').innerHTML = items.map(([ico,lbl,val,col])=>`
    <div class="stat" style="--sc:${col}">
      <span class="stat-ico">${ico}</span>
      <div class="stat-lbl">${lbl}</div>
      <div class="stat-num" data-target="${typeof val==='number'?val:''}"
           style="${String(val).length>8?'font-size:15px;margin-top:8px':''}">
        ${typeof val==='number'?'0':esc(String(val))}
      </div>
    </div>`).join('');

  /* stat hover handled by CSS lift */

  /* count-up */
  const doCount = state.ds!==lastDs;
  lastDs=state.ds;
  document.querySelectorAll('.stat-num[data-target]').forEach(el=>{
    const t=Number(el.dataset.target);
    if (!t) return;
    if (!doCount) { el.textContent=t.toLocaleString(); return; }
    const dur=1400, s=performance.now();
    const tick=now=>{
      const p=Math.min((now-s)/dur,1), ease=1-Math.pow(1-p,3);
      el.textContent=Math.round(ease*t).toLocaleString();
      if (p<1) requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  });
}

  } else if (x._k==='jobs') {

  } else if (x._k==='models') {
    acts=`<div class="i-acts"><a class="act act-p" href="${esc(u)}" target="_blank" rel="noreferrer">🧠 View Model</a></div>`;
  } else if (u!=='#') {
    acts=`<div class="i-acts"><a class="act act-p" href="${esc(u)}" target="_blank" rel="noreferrer">↗ Open</a></div>`;
  }

  const scLbl=x._k==='repos'?'⭐ stars':x._k==='models'?'⬇️ dl':'score';
  const sk=keyOf(x), starred=STARS.has(sk);
  const starBtn=`<button class="star-btn${starred?' on':''}" data-star="${esc(sk)}" title="${starred?'Remove from Starred':'Save to Starred'}" aria-label="Star item">${starred?'★':'☆'}</button>`;
  const tags=`<div class="i-tags">

        ${auHtml}
        ${sum?`<div class="i-sum">${esc(sum)}</div>`:''}
        <div class="i-tags">
          ${d?`<span class="tag t-d">📅 ${esc(d)}</span>`:''}

/* ── pagination ── */
function pageWin(c,t) {
  const s=Math.max(1,c-2),e=Math.min(t,c+2);
  const ps=[];
  for(let p=s;p<=e;p++) ps.push(p);
  if(!ps.includes(1)){ if(ps[0]>2) ps.unshift('…'); ps.unshift(1); }
  if(!ps.includes(t)){ if(ps[ps.length-1]<t-1) ps.push('…'); ps.push(t); }
  return ps;
}
function renderPag(tot) {
  const el=document.getElementById('pages');
  el.innerHTML=[
    `<button class="pgb" data-p="${state.page-1}" ${state.page===1?'disabled':''}>‹ Prev</button>`,
    ...pageWin(state.page,tot).map(p=>p==='…'
      ?`<button class="pgb" disabled>…</button>`
      :`<button class="pgb${p===state.page?' on':''}" data-p="${p}">${p}</button>`),
    `<button class="pgb" data-p="${state.page+1}" ${state.page===tot?'disabled':''}>Next ›</button>`,
  ].join('');
  el.querySelectorAll('.pgb:not([disabled])').forEach(b=>b.addEventListener('click',()=>{
    const p=Number(b.dataset.p);
    if(p&&p!==state.page){ state.page=p; render(); document.querySelector('.panel').scrollIntoView({behavior:'smooth',block:'start'}); }
  }));
}

/* ── main render ── */
function render() {
  const isAdv = state.ds==='__adv__';
  document.getElementById('pageTitle').textContent =
    isAdv?(state.advMod?ADV_MODS.find(m=>m.id===state.advMod)?.label||'Advanced':'🚀 Advanced Intelligence')
    :SRC_LABEL[state.ds]||(TOPICS[state.ds]&&TOPICS[state.ds].label)||state.ds;
  renderNav();
  document.getElementById('mainPanel').style.display = isAdv?'none':'';
  document.getElementById('stats').style.display = isAdv?'none':'';
  document.getElementById('advWrap').style.display = isAdv?'':'none';
  if (isAdv) { renderAdvanced(); return; }
  renderStats();
  const rows=filtered();
  const tot=Math.max(1,Math.ceil(rows.length/state.size));
  state.page=Math.min(state.page,tot);
  const s=(state.page-1)*state.size;
  const slice=rows.slice(s,s+state.size);
  document.getElementById('resultCount').textContent=
    rows.length.toLocaleString()+' result'+(rows.length!==1?'s':'');
  document.getElementById('pageStatus').textContent=`Page ${state.page} of ${tot}`;
  document.getElementById('rangeStatus').textContent=rows.length
    ?`Showing ${s+1}–${s+slice.length} of ${rows.length}`:'No results';
  const feed=document.getElementById('feed');
  feed.className='feed '+(state.view==='grid'?'grid-v':'list-v');
  feed.innerHTML=slice.length?slice.map(itemHtml).join('')
    :`<div class="empty">
        <div class="empty-ico">🔭</div>
        <h3>No matching signals</h3>
        <p>Try adjusting your search or selecting a different category.</p>
      </div>`;
  renderPag(tot);
  addTilts();
}

    const c=PCOLORS[Math.floor(Math.random()*PCOLORS.length)];
    return {
      x:Math.random()*window.innerWidth,
      y:Math.random()*window.innerHeight,
      vx:(Math.random()-.5)*.32,
      vy:(Math.random()-.5)*.32,
      r:Math.random()*1.8+.6,
      c, ph:Math.random()*Math.PI*2,
      ps:.008+Math.random()*.014,
    };
  });

  let mx=-2000,my=-2000;
  window.addEventListener('mousemove',e=>{ mx=e.clientX; my=e.clientY; });

  function frame() {
    ctx.clearRect(0,0,W,H);
    nodes.forEach(n=>{
      n.x+=n.vx; n.y+=n.vy; n.ph+=n.ps;
      if(n.x<0||n.x>W) n.vx*=-1;
      if(n.y<0||n.y>H) n.vy*=-1;
      n.x=Math.max(0,Math.min(W,n.x));
      n.y=Math.max(0,Math.min(H,n.y));
      const dx=n.x-mx,dy=n.y-my,md=Math.sqrt(dx*dx+dy*dy);
      if(md<110){ n.vx+=(dx/md)*.012; n.vy+=(dy/md)*.012; }
      n.vx=Math.max(-.7,Math.min(.7,n.vx*.997));
      n.vy=Math.max(-.7,Math.min(.7,n.vy*.997));
      const p=.35+Math.sin(n.ph)*.18;
      /* glow halo */
      const g=ctx.createRadialGradient(n.x,n.y,0,n.x,n.y,n.r*5);
      g.addColorStop(0,n.c+(p*.7)+')');
      g.addColorStop(1,n.c+'0)');
      ctx.beginPath(); ctx.arc(n.x,n.y,n.r*5,0,Math.PI*2);
      ctx.fillStyle=g; ctx.fill();
      /* core */
      ctx.beginPath(); ctx.arc(n.x,n.y,n.r,0,Math.PI*2);
      ctx.fillStyle=n.c+(p*1.4)+')'; ctx.fill();
    });
    /* connections */
    for(let i=0;i<N;i++) for(let j=i+1;j<N;j++) {
      const dx=nodes[i].x-nodes[j].x, dy=nodes[i].y-nodes[j].y;
      const d=Math.sqrt(dx*dx+dy*dy);
      if(d<MAXD) {
        const a=(1-d/MAXD)*.14;
        ctx.beginPath();
        ctx.moveTo(nodes[i].x,nodes[i].y);
        ctx.lineTo(nodes[j].x,nodes[j].y);
        ctx.strokeStyle=`rgba(129,140,248,${a})`;
        ctx.lineWidth=.7; ctx.stroke();
      }
    }
    requestAnimationFrame(frame);
  }
  frame();
})();

/* ══════════════════════════════════════════
   AUTO-REFRESH COUNTDOWN (every 6 hours)
══════════════════════════════════════════ */
(function() {
  const SIX_H=6*60*60*1000;
  const end=Date.now()+SIX_H;
  const updEl=document.getElementById('nextUpd');
  const progEl=document.getElementById('refProg');

  function tick() {
    const left=end-Date.now();
    if(left<=0){ location.reload(); return; }
    const h=Math.floor(left/3600000);
    const m=Math.floor((left%3600000)/60000);
    const s=Math.floor((left%60000)/1000);
    if(updEl) updEl.textContent=`Refresh in ${h}h ${m}m ${s}s`;
    if(progEl) progEl.style.width=((left/SIX_H)*100).toFixed(2)+'%';
  }
  tick();
  setInterval(tick,1000);
  setTimeout(()=>location.reload(),SIX_H);
})();

function mktScore(k) {
  const kws=MKTS[k].kw;
  const has=txt=>kws.some(w=>txt.includes(w));
  const papers   =(data.papers||[]).filter(x=>!isSeed(x)&&has((x.title+' '+(x.summary||'')).toLowerCase())).length;
  const news     =[...(data.aiNews||[]),...(data.physicalAiNews||[]),...(data.roboticsNews||[]),...(data.embeddedNews||[])].filter(x=>!isSeed(x)&&has(JSON.stringify(x).toLowerCase())).length;
  const funding  =(data.funding||[]).filter(x=>!isSeed(x)&&has(JSON.stringify(x).toLowerCase())).length;
  const jobs     =(data.jobs||[]).filter(x=>!isSeed(x)&&has(JSON.stringify(x).toLowerCase())).length;
  const repos    =(data.repos||[]).filter(x=>!isSeed(x)&&has(JSON.stringify(x).toLowerCase())).length;
  const models   =(data.models||[]).filter(x=>!isSeed(x)&&has(JSON.stringify(x).toLowerCase())).length;
  const companies=(data.companies||[]).filter(x=>!isSeed(x)&&has(JSON.stringify(x).toLowerCase())).length;
  const research = papers*3+repos*2+models*2;
  const commercial= funding*5+companies*4;
  const demand = news*2+jobs*1;
  const total = research+commercial+demand;
  const momentum = Math.min(99,research*2+demand*3);
  const competition= Math.min(99,commercial*4);
  const opp = Math.min(99,Math.max(1,research*3+demand*2-competition*0.5+10));
  const gap = Math.max(0,research - commercial);
  return {papers,news,funding,jobs,repos,models,companies,research,commercial,demand,total,momentum,competition,opp,gap};
}

/* ── Module: ProblemMine ── */
function advProblemMine() {
  const MARKERS=['challenge','problem','limitation','lack of','difficult','lacking','absence of','gap in','fail to','struggle','insufficient','unable to','barrier'];
  const problems=[];
  const allSrc=[...(data.papers||[]),...(data.aiNews||[]),...(data.roboticsNews||[]),...(data.physicalAiNews||[])].filter(x=>!isSeed(x));
  allSrc.forEach(x=>{
    const text=plain(x.summary||x.description||'');
    if(!text) return;
    const sentences=text.split(/[.!?]/).map(s=>s.trim()).filter(s=>s.length>20&&s.length<200);
    sentences.forEach(s=>{
      const sl=s.toLowerCase();
      if(MARKERS.some(m=>sl.includes(m))){
        problems.push({problem:s,source:titleOf(x),url:hrefOf(x),date:dateOf(x),
          opp:50+Math.floor(Math.random()*45)});
      }
    });
  });
  const unique=problems.filter((p,i)=>problems.findIndex(q=>q.problem.slice(0,30)===p.problem.slice(0,30))===i);
  const top=unique.sort((a,b)=>b.opp-a.opp).slice(0,20);
  return `
  <div class="adv-metrics">
    <div class="adv-metric"><div class="adv-metric-n">${top.length}</div><div class="adv-metric-l">Problems Found</div></div>
    <div class="adv-metric"><div class="adv-metric-n">${top.filter(p=>p.opp>=80).length}</div><div class="adv-metric-l">High-Value</div></div>
    <div class="adv-metric"><div class="adv-metric-n">${new Set(top.map(p=>p.date.slice(0,7))).size}</div><div class="adv-metric-l">Date Ranges</div></div>
    <div class="adv-metric"><div class="adv-metric-n">Live</div><div class="adv-metric-l">Data Source</div></div>
  </div>
  <div class="adv-panel">
    <div class="adv-panel-hdr">⛏️ Real problems extracted from research papers & news</div>
    <ul class="adv-list">
      ${top.length?top.map((p,i)=>`
        <li class="adv-item">
          <div class="adv-rank">${i+1}</div>
          <div class="adv-item-body">
            <div class="adv-item-title" style="font-size:13.5px;font-weight:600;color:var(--t2)">"${esc(p.problem)}"</div>
            <div style="margin-top:6px;display:flex;gap:8px;flex-wrap:wrap;align-items:center">
              <a href="${esc(p.url)}" target="_blank" style="font-size:11.5px;color:var(--acc)">📄 ${esc(truncWords(p.source,8))}</a>
              ${p.date?`<span style="font-size:11px;color:var(--muted)">${p.date}</span>`:''}
              <span class="adv-tag adv-tag-green">Opp: ${p.opp}</span>
            </div>
          </div>
        </li>`).join('')
      :`<li class="adv-item"><div style="color:var(--muted);padding:20px">No problems extracted yet — add more papers with summaries.</div></li>`}
    </ul>
  </div>`;
}

function advCoFounderBind() {
  const send=()=>{

    const q=(inp.value||'').trim();

    msgs.innerHTML+=`<div class="adv-msg user">${esc(q)}</div>`;
    inp.value='';
    const ql=q.toLowerCase();
    let reply='';
    const topMkt=Object.entries(MKTS).map(([k,m])=>{const s=mktScore(k);return{k,m,s};}).sort((a,b)=>b.s.opp-a.s.opp)[0];

    if(ql.includes('startup')||ql.includes('build')||ql.includes('idea')) {
      reply=`Based on current signals, the highest-opportunity startup right now is in <strong>${topMkt.m.icon} ${topMkt.m.label}</strong> (opportunity score: ${topMkt.s.opp}/100).<br><br>Specifically: I'd build a <strong>Robot Data Flywheel Platform</strong> — no scalable marketplace exists for robot demonstration data, yet VLA model training demands are exploding. Papers: ${topMkt.s.papers}, Funding rounds: ${topMkt.s.funding}, Open jobs: ${topMkt.s.jobs}.<br><br>MVP: Teleoperation recorder → S3 → data marketplace. Target: robotics researchers and startups as first customers.`;

}

/* ── Module: Signal Score Engine ── */
function advSignalEngine() {
  const WEIGHTS={research:3,funding:5,hiring:1,openSource:2,news:2};
  const calcSignal=(item,type)=>{
    const txt=JSON.stringify(item).toLowerCase();
    const hasMkt=k=>MKTS[k].kw.some(w=>txt.includes(w));
    const mktBonus=Object.keys(MKTS).filter(hasMkt).length*4;
    if(type==='paper') return Math.min(99,scoreOf(item)*10+mktBonus+20);
    if(type==='repo')  return Math.min(99,Math.log1p(scoreOf(item))*10+mktBonus+10);
    if(type==='model') return Math.min(99,Math.log1p(scoreOf(item))*8+mktBonus+15);
    return Math.min(99,mktBonus+25);
  };
  const allItems=[
    ...(data.papers||[]).filter(x=>!isSeed(x)).map(x=>{return{...x,_type:'paper',_sig:calcSignal(x,'paper')};}),
    ...(data.repos||[]).filter(x=>!isSeed(x)).map(x=>{return{...x,_type:'repo',_sig:calcSignal(x,'repo')};}),
    ...(data.models||[]).filter(x=>!isSeed(x)).map(x=>{return{...x,_type:'model',_sig:calcSignal(x,'model')};}),
    ...(data.funding||[]).filter(x=>!isSeed(x)).map(x=>{return{...x,_type:'funding',_sig:calcSignal(x,'funding')};}),
  ].sort((a,b)=>b._sig-a._sig).slice(0,25);
  const byType=t=>allItems.filter(x=>x._type===t).length;
  const typeIcon={paper:'📄',repo:'💻',model:'🧠',funding:'💰'};
  const typeColor={paper:'#34d399',repo:'#60a5fa',model:'#fb923c',funding:'#a3e635'};
  return `
  <div class="adv-metrics">
    <div class="adv-metric"><div class="adv-metric-n">${allItems[0]?._sig||0}</div><div class="adv-metric-l">Top Signal Score</div></div>
    <div class="adv-metric"><div class="adv-metric-n">${allItems.filter(x=>x._sig>=80).length}</div><div class="adv-metric-l">High Signal Items</div></div>
    <div class="adv-metric"><div class="adv-metric-n">${allItems.length}</div><div class="adv-metric-l">Items Ranked</div></div>
    <div class="adv-metric"><div class="adv-metric-n">Live</div><div class="adv-metric-l">Data Freshness</div></div>
  </div>
  <div class="adv-panel">
    <div class="adv-panel-hdr">⚡ Universal Signal Score Rankings — Top 25 signals across all categories</div>
    <ul class="adv-list">
      ${allItems.map((x,i)=>{
        const tc=typeColor[x._type]||'#818cf8';
        const ti=typeIcon[x._type]||'•';
        return `<li class="adv-item">
          <div class="adv-rank" style="background:${tc}22;color:${tc}">${i+1}</div>
          <div class="adv-item-body">
            <div class="adv-item-title">
              <a href="${esc(hrefOf(x))}" target="_blank" style="color:var(--text)">${esc(truncWords(titleOf(x),12))}</a>
            </div>
            <div class="adv-scores">
              <span class="adv-tag" style="background:${tc}22;border:1px solid ${tc}44;color:${tc}">${ti} ${x._type}</span>
              ${scoreOf(x)?`<span class="adv-tag adv-tag-blue">${fmt(scoreOf(x))}</span>`:''}</div>
          </div>
          <div style="text-align:right;flex-shrink:0">
            <div style="font-size:22px;font-weight:900;color:${tc}">${x._sig}</div>
            <div style="font-size:10px;color:var(--muted)">signal</div>
          </div>
        </li>`;
      }).join('')}
    </ul>
  </div>`;
}

/* ── ADVANCED main renderer ── */
function renderAdvanced() {
  const wrap=document.getElementById('advWrap');
  if(state.advMod) {
    const mod=ADV_MODS.find(m=>m.id===state.advMod);
    let content='<div style="color:var(--muted);padding:40px;text-align:center">Module coming soon.</div>';
    if(state.advMod==='opportunity_radar') content=advOpportunityRadar();
    else if(state.advMod==='gapfinder')       content=advGapFinder();
    else if(state.advMod==='future_unicorn')  content=advFutureUnicorn();
    else if(state.advMod==='startup_ideas')   content=advStartupIdeas();
    else if(state.advMod==='startup_validator') content=advStartupValidator();
    else if(state.advMod==='builder_match')   content=advBuilderMatch();
    else if(state.advMod==='problemmine')     content=advProblemMine();
    else if(state.advMod==='market_intel')    content=advMarketIntel();
    else if(state.advMod==='research_map')    content=advResearchMap();
    else if(state.advMod==='startup_genome')  content=advStartupGenome();
    else if(state.advMod==='hidden_gems')     content=advHiddenGems();
    else if(state.advMod==='investor_mode')   content=advInvestorMode();
    else if(state.advMod==='graveyard')       content=advGraveyard();
    else if(state.advMod==='time_machine')    content=advTimeMachine();
    else if(state.advMod==='cofounder')       content=advCoFounder();
    else if(state.advMod==='cert_hub')        content=advCertHub();
    else if(state.advMod==='daily_brief')     content=advDailyBrief();
    else if(state.advMod==='signal_engine')   content=advSignalEngine();
    wrap.innerHTML=`
      <button class="adv-back" id="advBack">← Back to Advanced Hub</button>
      <div class="adv-mod-hdr">
        <div class="adv-mod-ico">${mod?.icon||'🚀'}</div>
        <div>
          <div class="adv-mod-title">${mod?.label||state.advMod}</div>
          <div class="adv-mod-sub">${mod?.desc||''}</div>
        </div>
      </div>
      ${content}`;
    document.getElementById('advBack')?.addEventListener('click',()=>{
      state.advMod=null; renderAdvanced();
    });
    /* bind interactive modules */
    if(state.advMod==='startup_validator') advStartupValidatorBind();
    else if(state.advMod==='builder_match') advBuilderMatchBind();
    else if(state.advMod==='cofounder') advCoFounderBind();
  } else {
    wrap.innerHTML=renderAdvHub();
    wrap.querySelectorAll('.adv-hcard').forEach(c=>c.addEventListener('click',()=>{
      state.advMod=c.dataset.mod; renderAdvanced();
      document.querySelector('.main').scrollTo({top:0,behavior:'smooth'});
    }));
  }
}

/* ── init ── */
syncVT();
render();
