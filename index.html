munity has passion and [&#8230;]"}, {"title": "Gridfinity Resistor Organizer – 2×2 with 10 Slots + Labels #3DThursday #3DPrinting", "source": "Adafruit", "date": "2026-07-30", "url": "https://blog.adafruit.com/2026/07/30/gridfinity-resistor-organizer-2x2-with-10-slots-labels-3dthursday-3dprinting/", "summary": "nsanor shares: A simple 2×2 Gridfinity bit for storing and organizing 10 different values of resistors. Optional separate label tab. Open front for easy retrieval, with clearance to store resistors on their original adhesive strip rolls without removal. By Noah&#8217;s Thing Factory download the files on: https://makerworld.com/en/models/1153169-gridfinity-resistor-organizer Every Thursday is #3dthursday here at Adafruit! The [&#8230;]"}, {"title": "KUMO Modular Lamp Collection – 58 Lampshades + Configurator #3DThursday #3DPrinting", "source": "Adafruit", "date": "2026-07-30", "url": "https://blog.adafruit.com/2026/07/30/kumo-modular-lamp-collection-58-lampshades-configurator-3dthursday-3dprinting/", "summary": "flowalistik shares: The complete KUMO modular lamp collection with 58 lampshades ranging from 100mm to 300mm tall. Create your perfect KUMO lamp on the desktop using the KUMO Configurator. Massive design library from a well-known 3D-printing designer. By flowalistik download the files on: https://makerworld.com/en/models/1927838-kumo-modular-lamp-collection Every Thursday is #3dthursday here at Adafruit! The DIY 3D printing [&#8230;]"}, {"title": "From the mail bag…", "source": "Adafruit", "date": "2026-07-30", "url": "https://blog.adafruit.com/2026/07/30/from-the-mail-bag-799/", "summary": "From the mail bag! Thanks so much for your support and assistance! &#8230; I truly appreciate the time and effort you put into helping me and also looking out for my data You are a role model for all businesses to emulate! Thank you. v/r, David"}, {"title": "Gridfinity Small Parts Organizer – Stackable IKEA Alex Drawer Fit #3DThursday #3DPrinting", "source": "Adafruit", "date": "2026-07-30", "url": "https://blog.adafruit.com/2026/07/30/gridfinity-small-parts-organizer-stackable-ikea-alex-drawer-fit-3dthursday-3dprinting/", "summary": "PrecisionCrafts shares: A simple, popular Gridfinity organizer for small electronics parts. 15mm wide, 64–80mm long bins with taller and shorter variants. Five small parts boxes fit stacked on top of each other in the taller drawers of the IKEA Alex — a well-loved combination in the maker workspace. Prints without supports. By PrecisionCrafts download the [&#8230;]"}, {"title": "Using Video Glasses As a Camera Viewfinder Is Harder Than It Looks", "source": "Hackaday", "date": "2026-07-29", "url": "https://hackaday.com/2026/07/29/using-video-glasses-as-a-camera-viewfinder-is-harder-than-it-looks/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"450\" src=\"https://hackaday.com/wp-content/uploads/2026/07/Making-XREAL-Video-Glasses-into-a-Sony-ZV-E10-Viewfinder-_-My-Ultimate-Rig-0-27-screenshot-banner.png?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>[John Dingley] has a Sony ZV-E10 camera that is excellent, but the design lacks a built-in electronic viewfinder. This means it relies entirely on its rear-mounted touchscreen for framing shots. <a class=\"read-more\" href=\"https://hackaday.com/2026/07/29/using-video-glasses-as-a-camera-viewfinder-is-harder-than-it-looks/\">&#8230;read more<\/a>"}, {"title": "Scrap Pinball Parts Become Beautiful Wall Art", "source": "Hackaday", "date": "2026-07-29", "url": "https://hackaday.com/2026/07/29/scrap-pinball-parts-become-beautiful-wall-art/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"451\" src=\"https://hackaday.com/wp-content/uploads/2026/07/image-18-e1785299080644.webp?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>[Hans Scharler] came into a neat find recently—the playfield from a 1970s Atari Superman game. It&#8217;s the sort of thing that&#8217;s too nice to throw away, but isn&#8217;t really enough <a class=\"read-more\" href=\"https://hackaday.com/2026/07/29/scrap-pinball-parts-become-beautiful-wall-art/\">&#8230;read more<\/a>"}, {"title": "FLOSS Weekly Episode 877: RCE As a Service", "source": "Hackaday", "date": "2026-07-29", "url": "https://hackaday.com/2026/07/29/floss-weekly-episode-877-rce-as-a-service/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"484\" src=\"https://hackaday.com/wp-content/uploads/2021/06/Pipewire.jpg?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>This week Jonathan chats with Francois Proulx about SmokedMeat! That&#8217;s the third in a trio of Open Source security tools from Boost Security, and this one is the red team <a class=\"read-more\" href=\"https://hackaday.com/2026/07/29/floss-weekly-episode-877-rce-as-a-service/\">&#8230;read more<\/a>"}, {"title": "The ESP32 Gets a Web Browser", "source": "Hackaday", "date": "2026-07-29", "url": "https://hackaday.com/2026/07/29/the-esp32-gets-a-web-browser/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"493\" src=\"https://hackaday.com/wp-content/uploads/2026/07/espbrowser_feat.jpg?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>At the Hackaday Europe conference in Italy earlier in the year, we were shown a rather interesting device. The work of [Alun Morris], it was an ESP32-powered Cheap Black Display <a class=\"read-more\" href=\"https://hackaday.com/2026/07/29/the-esp32-gets-a-web-browser/\">&#8230;read more<\/a>"}, {"title": "NXP RW610FML Wi-Fi 6 and BLE 5.4 module features RW610 Cortex-M33 wireless MCU", "source": "CNX Software", "date": "2026-07-29", "url": "https://www.cnx-software.com/2026/07/29/nxp-rw610fml-wi-fi-6-and-ble-5-4-module-features-rw610-cortex-m33-wireless-mcu/", "summary": "<div><img alt=\"NXP RW610FML Scalable Wi Fi 6 and Bluetooth LE Combo Module\" class=\"attachment-medium size-medium wp-post-image\" height=\"480\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/07/NXP-RW610FML-Scalable-Wi-Fi-6-and-Bluetooth-LE-Combo-Module-720x480.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>NXP has introduced the RW610FML, a compact, low-power, certified Wi-Fi 6 and Bluetooth Low Energy (BLE) 5.4 wireless module based on the company&#8217;s RW610 Cortex-M33 microcontroller, the little brother of the RW612 without an 802.15.4 radio. Designed for smart appliances, home automation, industrial gateways, and medical devices, the surface-mount module combines the 260 MHz Arm Cortex-M33 wireless SoC with 8MB of on-module NOR flash, a built-in antenna, an RF matching circuit, and a crystal oscillator. NXP RW610FML Specifications: Wireless MCU – NXP RW610 CPU Core – 260 MHz Arm Cortex-M33 core with Arm TrustZone-M Internal memory – 1.2 MB embedded on-chip SRAM Connectivity Wi-Fi – Dual-band 2.4 GHz and 5 GHz Wi-Fi 6 (IEEE 802.11a/b/g/n/ac/ax) SISO 20 MHz channel bandwidth Up to MCS9 (114 Mbps) peak data rate Bluetooth – Bluetooth Low Energy (LE) supporting 2 Mbit/s high-speed mode, long-range operation, and extended advertising Storage &#8211; 8 MB NOR flash Castellated [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/07/29/nxp-rw610fml-wi-fi-6-and-ble-5-4-module-features-rw610-cortex-m33-wireless-mcu/\">NXP RW610FML Wi-Fi 6 and BLE 5.4 module features RW610 Cortex-M33 wireless MCU<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "7.6-inch square HDMI displays with USB capacitive touchscreen offered at 1200×1200 or 800×800 resolution", "source": "CNX Software", "date": "2026-07-29", "url": "https://www.cnx-software.com/2026/07/29/7-6-inch-square-hdmi-displays-with-usb-capacitive-touchscreen-offered-at-1200x1200-or-800x800-resolution/", "summary": "<div><img alt=\"7.6-inch square HDMI touch display\" class=\"attachment-medium size-medium wp-post-image\" height=\"387\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/07/7.6-inch-square-HDMI-touch-display-720x387.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>VIEWE UEDX12120076-HMD-RB-A and UEDX80800076-HMD-RB-A are 7.6-inch square HDMI capacitive touch displays with 1200&#215;1200 and 800&#215;800 resolution, respectively. We had previously seen 4-inch square HDMI +USB touch displays with 720×720 resolution for Raspberry Pi or other SBCs, but if you need something larger, VIEWE has now launched 7.6-inch variants with higher resolutions. VIEWE UEDX12120076-HMD-RB-A/UEDX80800076-HMD specifications: Display 7.6-inch MIPI DSI square IPS display Resolution UEDX80800076-HMD-RB-A &#8211; 800 x 800 UEDX12120076-HMD-RB-A &#8211; 1200 x 1200 Display driver ILI9881C for UEDX80800076-HMD-RB-A Potentially HX8279 for UEDX12120076-HMD-RB-A Brightness – 1,000 cd/㎡ Active area – 135.36 x 135.36 mm Touchscreen – Optional 5-point capacitive touchscreen via USB-C port (likely FT6336U touch IC) Video Input Mini HDMI 1.4 ITE HDMI input to MIPI DSI bridge based on the blurry photo of the controller. USB – USB-C port for power and touchscreen Misc &#8211; LED lifetime: 30,000 hours Power Supply &#8211; 5V via USB-C port Dimensions – 148.24 x [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/07/29/7-6-inch-square-hdmi-displays-with-usb-capacitive-touchscreen-offered-at-1200x1200-or-800x800-resolution/\">7.6-inch square HDMI displays with USB capacitive touchscreen offered at 1200&#215;1200 or 800&#215;800 resolution<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Sovol M1D hybrid IDEX 3D printer features 6 interchangeable toolheads for multi-color and multi-material prints (Crowdfunding)", "source": "CNX Software", "date": "2026-07-29", "url": "https://www.cnx-software.com/2026/07/29/sovol-m1d-hybrid-idex-3d-printer-features-6-interchangeable-toolheads-for-multi-color-and-multi-material-prints/", "summary": "<div><img alt=\"Sovol M1D IDEX Tool Changing 3D Printer\" class=\"attachment-medium size-medium wp-post-image\" height=\"480\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/07/Sovol-M1D-IDEX-Tool-Changing-3D-Printer-720x480.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Sovol has launched the M1D, an open-source IDEX (Independent Dual Extruder) 3D printer with a fixed dual-extruder architecture and interchangeable toolheads that support up to seven independently heated toolheads (one fixed and six swappable). It comes in two variants: the open-frame M1D Essential and the M1D Advanced, which adds a full enclosure and a chamber heating module capable of reaching up to 60°C. The M1D uses a patented automatic tool changer for swapping print heads in as little as five seconds and supports Single, Multi-Head, Copy, and Mirror printing modes. It enables multi-material or/and multi-color prints, including adding water-soluble support to a print to remove the need to manually remove support (see video at the end of this post for demo). The printer targets makers, engineers, prototype development, and small-scale production by reducing purge waste while improving printing efficiency and material flexibility. Sovol M1D specifications: Printing technology – FDM (Fused Deposition Modeling) Storage – [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/07/29/sovol-m1d-hybrid-idex-3d-printer-features-6-interchangeable-toolheads-for-multi-color-and-multi-material-prints/\">Sovol M1D hybrid IDEX 3D printer features 6 interchangeable toolheads for multi-color and multi-material prints (Crowdfunding)<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "SensWear – An open-source modular Nordic nRF54L15 development platform for wearables", "source": "CNX Software", "date": "2026-07-29", "url": "https://www.cnx-software.com/2026/07/29/senswear-an-open-source-modular-nordic-nrf54l15-development-platform-for-wearables/", "summary": "<div><img alt=\"SensWear nRF54L15 wearables development platform\" class=\"attachment-medium size-medium wp-post-image\" height=\"486\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/07/SensWear-nRF54L15-wearables-development-platform-720x486.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>SensWear is an open-source hardware development platform for wearables based on Nordic nRF54L15 Bluetooth LE SoC and a range of sensors designed for researchers, developers, and companies building smart rings, wristbands, patches, and other custom devices. The solution is mainly comprised of flexible boards, including the SensWear core board with an nRF54L15 MCU and a 6-axis IMU sensor, and daughter boards with either PPG and optical sensing,  temperature sensing, capacitive touch sensing, or haptic feedback. SensWear key features and specifications: Core mainboard SoC &#8211; Nordic Semi nRF54L15 CPU Arm Cortex-M33 @ up to 128 MHz RISC-V coprocessor for “software-defined peripheral” Memory – 256 KB SRAM Storage – 1.5MB Non-volatile Memory (NVM) Wireless Bluetooth LE 6.0 Thread, Zigbee (IEEE 802.15.4-2020) Matter Amazon Sidewalk Proprietary 2.4 GHz protocols with a new 4 Mbps mode NFC support Sensors Bosch BHI360 six-axis smart IMU and sensor hub Standardized interface for interchangeable daughter boards I2C and [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/07/29/senswear-an-open-source-modular-nordic-nrf54l15-development-platform-for-wearables/\">SensWear – An open-source modular Nordic nRF54L15 development platform for wearables<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "BrainChip Launches AKD1500 M.2 Module for Fanless Edge AI", "source": "Embedded.com", "date": "2026-07-29", "url": "https://www.embedded.com/brainchip-launches-akd1500-m-2-module-for-fanless-edge-ai/", "summary": "<p>BrainChip Inc. has introduced a new M.2 version of its AKD1500 edge AI accelerator, enabling compact, fanless, and plug-and-play deployment of neuromorphic artificial intelligence capabilities in industrial and commercial systems. Based on the Akida neuromorphic processor architecture, the module provides hardware designers with a low-power solution for adding on-device AI functionality to existing platforms without [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/brainchip-launches-akd1500-m-2-module-for-fanless-edge-ai/\">BrainChip Launches AKD1500 M.2 Module for Fanless Edge AI<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "Emerson Expands AI Capabilities Across Test Environment", "source": "Embedded.com", "date": "2026-07-29", "url": "https://www.embedded.com/emerson-expands-ai-capabilities-across-test-environment/", "summary": "<p>NI Nigel AI enhancements accelerate test productivity by up to 50 percent.<\/p>\n<p>The post <a href=\"https://www.embedded.com/emerson-expands-ai-capabilities-across-test-environment/\">Emerson Expands AI Capabilities Across Test Environment<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "Synopsys unveils autonomous workflows agents", "source": "Electronics Weekly", "date": "2026-07-29", "url": "https://www.electronicsweekly.com/news/business/synopsys-unveils-autonomous-workflows-agents-2026-07/", "summary": "<p>On the first anniversary of its acquisition of Ansys, Synopsys demos autonomous design verification agents for EDA and CAE (computer aided engineering) design. The agents have been developed with Nvidia, [&#8230;]<\/p>\n<p>The post <a href=\"https://www.electronicsweekly.com/news/business/synopsys-unveils-autonomous-workflows-agents-2026-07/\">Synopsys unveils autonomous workflows agents<\/a> appeared first on <a href=\"https://www.electronicsweekly.com\">Electronics Weekly<\/a>.<\/p>"}, {"title": "Sleeping With The Enemy", "source": "Electronics Weekly", "date": "2026-07-29", "url": "https://www.electronicsweekly.com/blogs/mannerisms/dilemmas/sleeping-with-the-enemy-2026-07/", "summary": "<p>Responding to recent M&#38;A activity, Anglia Components has warned of a looming potential imbalance in the supply chain, where traditional lines may become blurred, leading to a lack of transparency [&#8230;]<\/p>\n<p>The post <a href=\"https://www.electronicsweekly.com/blogs/mannerisms/dilemmas/sleeping-with-the-enemy-2026-07/\">Sleeping With The Enemy<\/a> appeared first on <a href=\"https://www.electronicsweekly.com\">Electronics Weekly<\/a>.<\/p>"}, {"title": "Scaling semiconductor manufacturing through NPI, yield ramp and high-volume production", "source": "Electronics Weekly", "date": "2026-07-29", "url": "https://www.electronicsweekly.com/news/business/scaling-semiconductor-manufacturing-through-npi-yield-ramp-and-high-volume-production-2026-07/", "summary": "<p>Anshul Karnik discusses how semiconductor technologies are successfully transitioned from early technology development (TD) through new product introduction (NPI) and into high-volume manufacturing (HVM), writes Ellen F Warren. ELLEN WARREN: [&#8230;]<\/p>\n<p>The post <a href=\"https://www.electronicsweekly.com/news/business/scaling-semiconductor-manufacturing-through-npi-yield-ramp-and-high-volume-production-2026-07/\">Scaling semiconductor manufacturing through NPI, yield ramp and high-volume production<\/a> appeared first on <a href=\"https://www.electronicsweekly.com\">Electronics Weekly<\/a>.<\/p>"}, {"title": "Physics modelling cracks the code for thermal mechanics", "source": "Electronics Weekly", "date": "2026-07-29", "url": "https://www.electronicsweekly.com/news/products/physics-modelling-cracks-the-code-for-thermal-mechanics-2026-07/", "summary": "<p>DAC 2026: Among the start-ups at this year&#8217;s conference, Vinci was one of the most progressive, with a  physics-bsed AI software platform for predictive hardware design. The company introduced its [&#8230;]<\/p>\n<p>The post <a href=\"https://www.electronicsweekly.com/news/products/physics-modelling-cracks-the-code-for-thermal-mechanics-2026-07/\">Physics modelling cracks the code for thermal mechanics<\/a> appeared first on <a href=\"https://www.electronicsweekly.com\">Electronics Weekly<\/a>.<\/p>"}, {"title": "LIVE NOW! SHOW and TELL 7/29/2026 with @ecken #ShowandTell @adafruit", "source": "Adafruit", "date": "2026-07-29", "url": "https://blog.adafruit.com/2026/07/29/live-now-show-and-tell-7-29-2026-with-ecken-showandtell-adafruit/", "summary": "The biggest and longest running worldwide online Show and Tell LIVE! Right now! 7/29/2026 at 7:30pm Eastern. Hosted this week by Noe Ruiz To show and share a project at 7:30pm Eastern today, view the chat or in discord https://adafru.it/discord and look for the JOIN link to join. For best results, be on a wired [&#8230;]"}, {"title": "Running a 28.9M parameter LLM on an $8 microcontroller", "source": "Adafruit", "date": "2026-07-29", "url": "https://blog.adafruit.com/2026/07/29/running-a-28-9m-parameter-llm-on-an-8-microcontroller/", "summary": "Slava S. on GitHub has a 28.9 million parameter language model that generates text on an ESP32-S3, a microcontroller that costs about $8. It runs on the chip itself, with nothing sent to a server, and it writes each word to a small screen wired to the chip at roughly 9 tokens per second. The [&#8230;]"}, {"title": "The new “Y-zipper,” a three-sided fastener  #3dThursday", "source": "Adafruit", "date": "2026-07-29", "url": "https://blog.adafruit.com/2026/07/29/the-new-y-zipper-a-three-sided-fastener-3dthursday/", "summary": "In 1985, the Innovative Design Fund placed an ad in Scientific American offering up to $10,000 to support clever prototypes for clothing, home decor, and textiles. William Freeman PhD ’92, then an electrical engineer at Polaroid and now an MIT professor, saw it and submitted a novel idea: a three-sided zipper. Instead of fastening pants, [&#8230;]"}, {"title": "Metal boots into a persistent native MicroPython REPL", "source": "Adafruit", "date": "2026-07-29", "url": "https://blog.adafruit.com/2026/07/29/metal-boots-into-a-persistent-native-micropython-repl/", "summary": "pymergetic on GitHub has created Metal, an experimental UEFI/BIOS freestanding async runtime. It is not a conventional OS and it is very far from production-ready, but it now boots directly into a persistent interactive MicroPython REPL. The repository is at https://github.com/pymergetic/metal. See more in the MicroPython forums."}, {"title": "Detecting Environmental Hazards with a Wearable Patch", "source": "Adafruit", "date": "2026-07-29", "url": "https://blog.adafruit.com/2026/07/29/detecting-environmental-hazards-with-a-wearable-patch/", "summary": "Researchers at North Carolina State University have created a wearable patch that can detect hazardous gaseous, aerosolized, and aqueous environmental toxins and notify wearers by vibrating against their skin. For this work, the researchers created a square patch slightly smaller than a driver’s license. The patch contains a microcontroller that serves as the patch’s brain; [&#8230;]"}, {"title": "Simplified Pico VGA", "source": "Adafruit", "date": "2026-07-29", "url": "https://blog.adafruit.com/2026/07/29/simplified-pico-vga/", "summary": "Kevin on Kevin&#8217;s Blog looks into various microcontroller video implementations for VGA using a Raspberry Pi Pico. It starts with the Raspberry Pi Pico Hardware Design Manual which has an example showing how an RP2040 can be used to create a VGA signal using a 3-way 5-bit resistor DAC. That it requires 5 GPIO pins [&#8230;]"}, {"title": "Wires and Connections – How to choose your next projects connections", "source": "Adafruit", "date": "2026-07-29", "url": "https://blog.adafruit.com/2026/07/29/wires-and-connections-how-to-choose-your-next-projects-connections/", "summary": "Wires are the electrically conductive connections between the elements in electronic circuitry.  Designing your project or following many Adafruit guides, there are wires interconnecting different parts.  Theoretically, these are zero resistance, perfect connections.  On the breadboard, they are nice colored jumper wires.  In practice, the designer has a many possible choices of how to connect electronic parts [&#8230;]"}, {"title": "Ubuntu Touch 24.04-2.0 updates Morph browser, adds notch and printing support, and more", "source": "CNX Software", "date": "2026-07-28", "url": "https://www.cnx-software.com/2026/07/28/ubuntu-touch-24-04-2-0-updates-morph-browser-adds-notch-and-printing-support-and-more/", "summary": "<div><img alt=\"Ubuntu Touch 24.04-2.0\" class=\"attachment-medium size-medium wp-post-image\" height=\"660\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/07/Ubuntu-Touch-24.04-2.0-720x660.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>UBPorts has announced the release of Ubuntu Touch 24.04-2.0 based on Ubuntu 24.04. It features an upgraded Morph Browser based on Chromium 134, supports smartphones with notches and rounded corners, a Widevine DRM installer, and more. Ubuntu Touch 24.04-2.0 highlights: Updated browser engine for Morph Browser from Chromium 87 to Chromium 134 for improved compatibility with websites and web applications Installer for Widevine DRM with the following note: Widevine installer is not endorsed by Google. UBports, Ubuntu Touch, or Morph Browser is not a licensed Widevine implementation. Extracting Widevine from another source is considered by some to be in legally grey area. You are responsible for your usage of Widevine installer. Support for notches and rounded corners; currently configured on Fairphone 4 and 5, all Volla devices, and several community devices Screenshot editor allowing users to crop, rotate, and adjust color; this can be disabled by the user Ubuntu Touch [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/07/28/ubuntu-touch-24-04-2-0-updates-morph-browser-adds-notch-and-printing-support-and-more/\">Ubuntu Touch 24.04-2.0 updates Morph browser, adds notch and printing support, and more<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "DFI X6X-ORN – An IP67-rated, rugged Jetson Orin NX/Nano edge AI computer with GMSL2 camera support", "source": "CNX Software", "date": "2026-07-28", "url": "https://www.cnx-software.com/2026/07/28/dfi-x6x-orn-an-ip67-rated-rugged-jetson-orin-nx-nano-edge-ai-computer-with-gmsl2-camera-support/", "summary": "<div><img alt=\"DFI X6X ORN Jetson IP67 fanless edge AI computer\" class=\"attachment-medium size-medium wp-post-image\" height=\"480\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/07/DFI-X6X-ORN-Jetson-IP67-fanless-edge-AI-computer-720x480.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>The DFI X6X-ORN is a fanless, IP67-rated Edge AI computer powered by the NVIDIA Jetson Orin NX/Nano. It is designed for extreme outdoor and industrial environments in maritime, agriculture, construction, and intelligent transportation applications. The system fully relies on rugged M12 and M20 circular waterproof connectors for all its I/O, including PoE and GMSL2 camera interfaces. It delivers up to 157 TOPS of AI performance when equipped with the Jetson Orin NX 16GB module, complies with MIL-STD-810H shock and vibration standards, and supports an operating temperature range of -20°C to 60°C. DFI X6X-ORN specifications: SoM – NVIDIA Jetson Orin NX/Nano module Jetson Orin NX 16GB – Up to 157 TOPS, 16GB LPDDR5, 10W/15W/25W/ 40W power modes Jetson Orin NX 8GB – Up to 117 TOPS, 8GB LPDDR5, 10W/15W/25W/40W power modes Jetson Orin Nano 8GB – Up to 67 TOPS, 8GB LPDDR5, 7W/10W/25W power modes Jetson Orin Nano 4GB – Up [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/07/28/dfi-x6x-orn-an-ip67-rated-rugged-jetson-orin-nx-nano-edge-ai-computer-with-gmsl2-camera-support/\">DFI X6X-ORN &#8211; An IP67-rated, rugged Jetson Orin NX/Nano edge AI computer with GMSL2 camera support<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Waveshare RP2350-POE-ETH – A Raspberry Pi RP2350 MCU board with PoE", "source": "CNX Software", "date": "2026-07-28", "url": "https://www.cnx-software.com/2026/07/28/waveshare-rp2350-poe-eth-a-raspberry-pi-rp2350-mcu-board-with-poe/", "summary": "<div><img alt=\"Raspberry Pi RP2350 Power-over-Ethernet (PoE) board\" class=\"attachment-medium size-medium wp-post-image\" height=\"690\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/07/Raspberry-Pi-RP2350-power-over-ethernet-PoE-board-720x690.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Waveshare RP2350-POE-ETH is a Raspberry Pi RP2350 board with Ethernet implemented through a W6300 chip, support for optional PoE (Power-over-Ethernet), and two GPIO headers. We had covered a few Raspberry Pi RP2350 boards with Ethernet from WIZNet, including the W5100S-EVB-Pico2, W5500-EVB-Pico2, and W6300-EVB-Pico2, but none were advertised with PoE at the time. Since then, the 4-pin WizPOE-P1 module changes that, and the Waveshare RP2350-POE-ETH board offers a more affordable option. Waveshare RP2350-POE-ETH specifications: Microcontroller – Raspberry Pi RP2350A CPU Dual-core Arm Cortex-M33 processor @ 150 MHz Dual-core 32-bit RISC-V Hazard3 @ 150 MHz Up to two cores can be used at a time, either 2x Arm, 2x RISC-V, or 1x Arm + 1x RISC-V Memory – 520KB internal RAM Storage &#8211; 8KB OTP Storage Storage – 16Mbit SPI NOR flash Ethernet 10/100Mbps Ethernet RJ45 port via WIZnet W6300 “iEthernet” chip 6-pin PoE connector for optional module USB – USB 1.1 C-Type [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/07/28/waveshare-rp2350-poe-eth-a-raspberry-pi-rp2350-mcu-board-with-poe/\">Waveshare RP2350-POE-ETH &#8211; A Raspberry Pi RP2350 MCU board with PoE<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "LILYGO T-Display C5 board features 1.9-inch IPS color LCD, battery support, Qwiic expansion connectors", "source": "CNX Software", "date": "2026-07-28", "url": "https://www.cnx-software.com/2026/07/28/lilygo-t-display-c5-board-features-1-9-inch-ips-color-lcd-battery-support-qwiic-expansion-connectors/", "summary": "<div><img alt=\"LILYGO T-Display C5\" class=\"attachment-medium size-medium wp-post-image\" height=\"601\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/07/LILYGO-T-Display-C5-720x601.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>LILYGO T-Display C5 is an ESP32-C5 board with a 1.9-inch IPS color LCD, a USB-C port for power and programming, Lithium battery support, and GPIO expansion via headers and two Qwiic expansion connectors. The main benefit of using an ESP32-C5 chip is support for dual-band WiFi 6 connectivity (2.4/5.0 GHz), and it also keeps Bluetooth LE 5.x and the 802.15.4 radio for Zigbee/Thread/Matter found in the ESP32-C6. LILYGO T-Display C5 specifications: Wireless module – Espressif Systems ESP32-WROOM-C5-1U-N16R8 SoC &#8211; ESP32-C5HR8 CPU Single-core 32-bit RISC-V processor @ up to 240 MHz Low-power RISC-V core @ 40 MHz acting as the main processor for power-sensitive applications Memory – 384 KB SRAM on-chip, 8MB PSRAM Storage – 320 KB ROM Wireless Connectivity Dual-band (2.4GHz/5 GHz) 802.11ax WiFi 6, with 802.11b/g/n WiFi 4 standard fallback Bluetooth 5.0 Low Energy (LE) 802.15.4 radio for Zigbee 3.0 and Thread 1.3 Storage &#8211; 16MB flash Antenna &#8211; [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/07/28/lilygo-t-display-c5-board-features-1-9-inch-ips-color-lcd-battery-support-qwiic-expansion-connectors/\">LILYGO T-Display C5 board features 1.9-inch IPS color LCD, battery support, Qwiic expansion connectors<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "TDK, LG Innotek Collaborate on Physical AI Solutions", "source": "Embedded.com", "date": "2026-07-28", "url": "https://www.embedded.com/tdk-lg-innotek-collaborate-on-physical-ai-solutions/", "summary": "<p>TDK and LG Innotek have entered into a strategic partnership to develop sensing technologies for physical AI applications, with an initial focus on next-generation vision and tactile sensing modules for humanoid robots. The collaboration combines LG Innotek's expertise in optical systems and ultra-precision module design with TDK's sensor technology portfolio to create integrated solutions that [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/tdk-lg-innotek-collaborate-on-physical-ai-solutions/\">TDK, LG Innotek Collaborate on Physical AI Solutions<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "A New Route to Fault-Tolerant Quantum Computers", "source": "Embedded.com", "date": "2026-07-28", "url": "https://www.embedded.com/a-new-route-to-fault-tolerant-quantum-computers/", "summary": "<p>After early proof-of-concept demonstrations, quantum computing (QC) and quantum sensing (QS) are quickly moving toward practical technologies. While much focus is devoted to increasing the number of qubits to make quantum processors more capable, an equally important effort is directed at improving their quality. Quantum systems are extremely sensitive to the environment they interact with, [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/a-new-route-to-fault-tolerant-quantum-computers/\">A New Route to Fault-Tolerant Quantum Computers<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "Andes Technology and Mirabilis Design Announce Collaboration on System-Level Models for Andes RISC-V Processor IP", "source": "EE Journal", "date": "2026-07-28", "url": "https://www.eejournal.com/industry_news/andes-technology-and-mirabilis-design-announce-collaboration-on-system-level-models-for-andes-risc-v-processor-ip/", "summary": "Hsinchu, Taiwan / Santa Clara, CA – July 27th, 2026 – Andes Technology, a leading supplier of high-performance, energy-efficient RISC-V processor IP and a Founding Premier Member of RISC-V International, and Mirabilis Design today announced a strategic collaboration to deliver system-level architecture models for Andes RISC-V processors. This partnership empowers SoC architects to evaluate and optimize processor-based designs &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/andes-technology-and-mirabilis-design-announce-collaboration-on-system-level-models-for-andes-risc-v-processor-ip/\">Read More &#8594;<span class=\"screen-reader-text\"> \"Andes Technology and Mirabilis Design Announce Collaboration on System-Level Models for Andes RISC-V Processor IP\"<\/span><\/a>"}, {"title": "AI can predict and plan ahead for drought with access to the right data, experts say", "source": "EE Journal", "date": "2026-07-28", "url": "https://www.eejournal.com/industry_news/ai-can-predict-and-plan-ahead-for-drought-with-access-to-the-right-data-experts-say/", "summary": "July 28, 2026 — The cause of water shortages and wildfires worldwide, the ongoing drought crisis demonstrates the urgent need to proactively predict when and where drought conditions will occur well before they happen. Virginia Tech experts say the artificial intelligence (AI) technology that makes this possible exists — the key is maximizing access to worldwide &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/ai-can-predict-and-plan-ahead-for-drought-with-access-to-the-right-data-experts-say/\">Read More &#8594;<span class=\"screen-reader-text\"> \"AI can predict and plan ahead for drought with access to the right data, experts say\"<\/span><\/a>"}, {"title": "Synopsys and Intel Foundry Fast-Track Customer Readiness from Silicon to Systems on Intel 14A", "source": "EE Journal", "date": "2026-07-28", "url": "https://www.eejournal.com/industry_news/synopsys-and-intel-foundry-fast-track-customer-readiness-from-silicon-to-systems-on-intel-14a/", "summary": "Key Highlights Certified AI-powered EDA flows and multiphysics analysis for Intel 14A designs: Provide early insight into power integrity, thermal, and electromagnetic effects, improving predictability and accelerating convergence From DTCO to system-aware co-optimization: Extends co-optimization across silicon, package, IP and system domains to enable full system realization with optimal PPA Multi-die and advanced packaging leadership: Synopsys &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/synopsys-and-intel-foundry-fast-track-customer-readiness-from-silicon-to-systems-on-intel-14a/\">Read More &#8594;<span class=\"screen-reader-text\"> \"Synopsys and Intel Foundry Fast-Track Customer Readiness from Silicon to Systems on Intel 14A\"<\/span><\/a>"}, {"title": "Synopsys Advances Agentic AI Chip Design with AMD and Microsoft", "source": "EE Journal", "date": "2026-07-28", "url": "https://www.eejournal.com/industry_news/synopsys-advances-agentic-ai-chip-design-with-amd-and-microsoft/", "summary": "Key Highlights Synopsys is advancing an open, interoperable agentic AI stack for autonomous workflows across the chip design lifecycle. Introducing two new agentic EDA workflows, developed in collaboration with Microsoft and used by AMD, available for evaluation on Microsoft Discovery to accelerate chip design. Fully-autonomous debug closure workflow initial results demonstrate up to 40% reduction &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/synopsys-advances-agentic-ai-chip-design-with-amd-and-microsoft/\">Read More &#8594;<span class=\"screen-reader-text\"> \"Synopsys Advances Agentic AI Chip Design with AMD and Microsoft\"<\/span><\/a>"}, {"title": "RS and RS PRO streamline control panel integration in automated industrial environments", "source": "EE Journal", "date": "2026-07-28", "url": "https://www.eejournal.com/industry_news/rs-and-rs-pro-streamline-control-panel-integration-in-automated-industrial-environments/", "summary": "RS, a high-service global product and service solutions provider for industrial customers, provides comprehensive support for the rapidly accelerating cross-market trend towards control panel integration, which is being driven by digital transformation and smart factory initiatives. As industrial automation becomes increasingly ubiquitous and the cost of unplanned downtime continues to rise, industrial operators can’t afford &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/rs-and-rs-pro-streamline-control-panel-integration-in-automated-industrial-environments/\">Read More &#8594;<span class=\"screen-reader-text\"> \"RS and RS PRO streamline control panel integration in automated industrial environments\"<\/span><\/a>"}, {"title": "2,000+ AI-Routed PCBs a Week!", "source": "EE Journal", "date": "2026-07-28", "url": "https://www.eejournal.com/article/2000-ai-routed-pcbs-a-week/", "summary": "<img alt=\"\" class=\"webfeedsFeaturedVisual wp-post-image\" height=\"300\" src=\"https://www.eejournal.com/wp-content/uploads/2026/07/max-0504-image-for-home-page-deeppcb-300x300.jpg\" style=\"display: block; margin-bottom: 5px; clear: both;\" width=\"300\" />I can’t believe that the Design Automation Conference (DAC) has rolled around once again. Also, I can’t believe that, in conversation, some people remain blissfully unaware that you can pronounce this as “DAC” (to rhyme with “quack”), or spell it out as “D-A-C.” And to top it all off, I can’t believe I’m not there &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/article/2000-ai-routed-pcbs-a-week/\">Read More &#8594;<span class=\"screen-reader-text\"> \"2,000+ AI-Routed PCBs a Week!\"<\/span><\/a>"}, {"title": "Jetway SMC-ARK1 – A Rockchip RK3588 SMARC 2.1 compliant system-on-module", "source": "CNX Software", "date": "2026-07-27", "url": "https://www.cnx-software.com/2026/07/27/jetway-smc-ark1-a-rockchip-rk3588-smarc-2-1-compliant-system-on-module/", "summary": "<div><img alt=\"Rockchip RK3588 SMARC 2.1 system-on-module\" class=\"attachment-medium size-medium wp-post-image\" height=\"532\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/07/Rockchip-RK3588-SMARC-2.1-system-on-module-720x532.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Jetway has introduced the SMC-ARK1, a new SMARC system-on-module built around the Rockchip RK3588 octa-core processor. Designed for embedded computing and edge AI applications, the board includes up to 16GB of LPDDR4x memory and up to 128GB of eMMC flash, dual GbE, and an Ampak AP6398SV Wi-Fi 5 and Bluetooth 5.0 module, alongside a dedicated HDMI input via an I-PEX FPC connector. We&#8217;ve previously written about the Geniatech SOM-3568-SMARC module based on the Rockchip RK3568, but Jetway&#8217;s SMC-ARK1 appears to be the first SMARC module we&#8217;ve seen based on the Rockchip RK3588. The module follows the SMARC 2.1 short form-factor specification (82 × 50 mm) and can be used with compatible SMARC carrier boards. Jetway SMC-ARK1 specifications: SoC – Rockchip RK3588 octa-core processor with CPU – 4x Cortex‑A76  cores @ up to 2.4 GHz, 4x Cortex‑A55 cores @ 1.8 GHz GPU – Arm Mali-G610 MP4 GPU Video decoder – 8Kp60 H.265, VP9, AVS2, 8Kp30 [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/07/27/jetway-smc-ark1-a-rockchip-rk3588-smarc-2-1-compliant-system-on-module/\">Jetway SMC-ARK1 &#8211; A Rockchip RK3588 SMARC 2.1 compliant system-on-module<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Synopsys, AMD, and Microsoft Expand Agentic AI for EDA", "source": "Embedded.com", "date": "2026-07-27", "url": "https://www.embedded.com/synopsys-amd-and-microsoft-expand-agentic-ai-for-eda/", "summary": "<p>Synopsys has expanded its agentic AI strategy for electronic design automation (EDA) by introducing autonomous chip design workflows developed in collaboration with AMD and Microsoft. The new workflows are available for evaluation on Microsoft Discovery and are designed to automate complex engineering tasks across the semiconductor design lifecycle, from design implementation through verification and debug. [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/synopsys-amd-and-microsoft-expand-agentic-ai-for-eda/\">Synopsys, AMD, and Microsoft Expand Agentic AI for EDA<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "Congatec Launches Ryzen AI-based COM-HPC Module", "source": "Embedded.com", "date": "2026-07-27", "url": "https://www.embedded.com/congatec-launches-ryzen-ai-based-com-hpc-module/", "summary": "<p>The COM-HPC module targets physical AI applications in rugged environments.<\/p>\n<p>The post <a href=\"https://www.embedded.com/congatec-launches-ryzen-ai-based-com-hpc-module/\">Congatec Launches Ryzen AI-based COM-HPC Module<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "edge lab LIVE! Developer Conference for Edge AI, Open-Source Software, Open Standards Hardware & CRA-Compliant Product Development Launches at electronica 2026", "source": "EE Journal", "date": "2026-07-27", "url": "https://www.eejournal.com/industry_news/edge-lab-live-developer-conference-for-edge-ai-open-source-software-open-standards-hardware-cra-compliant-product-development-launches-at-electronica-2026/", "summary": "PHOENIX — July 27, 2026 — ThroughPut Marketing today announced edge lab LIVE!,  the premier technical conference and exhibition for edge AI, edge computing, and CRA-compliant embedded and IoT product development. Hosted in partnership with Messe München, edge lab LIVE! takes place November 10-13, 2026 at electronica in Munich, Germany. Focusing on the practical aspects of modern embedded and IoT edge &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/edge-lab-live-developer-conference-for-edge-ai-open-source-software-open-standards-hardware-cra-compliant-product-development-launches-at-electronica-2026/\">Read More &#8594;<span class=\"screen-reader-text\"> \"edge lab LIVE! Developer Conference for Edge AI, Open-Source Software, Open Standards Hardware &#038; CRA-Compliant Product Development Launches at electronica 2026\"<\/span><\/a>"}, {"title": "Keysight Certifies Electromagnetic Design Software for Intel Foundry’s Latest Processes", "source": "EE Journal", "date": "2026-07-27", "url": "https://www.eejournal.com/industry_news/keysight-certifies-electromagnetic-design-software-for-intel-foundrys-latest-processes/", "summary": "SANTA ROSA, Calif.&#8211;(BUSINESS WIRE)&#8211;Keysight Technologies, Inc. (NYSE: KEYS) today announced certification of its RFPro electromagnetic (EM) design software, part of the Keysight EDA Advanced Design System (ADS), for Intel 14A and Intel 18A-P process technologies. The certification gives radio frequency integrated circuit (RFIC) and mixed-signal designers confidence that their electromagnetic simulations accurately reflect Intel Foundry’s &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/keysight-certifies-electromagnetic-design-software-for-intel-foundrys-latest-processes/\">Read More &#8594;<span class=\"screen-reader-text\"> \"Keysight Certifies Electromagnetic Design Software for Intel Foundry’s Latest Processes\"<\/span><\/a>"}, {"title": "TDK presents SMD common-mode chokes for up to 80 V/35 A with a minimized PCB footprint", "source": "EE Journal", "date": "2026-07-27", "url": "https://www.eejournal.com/industry_news/tdk-presents-smd-common-mode-chokes-for-up-to-80-v-35-a-with-a-minimized-pcb-footprint/", "summary": "TDK Corporation (TSE:6762) presents the EP21 series (ordering code: B82552J*J021) of flat-wire double chokes. These components are designed for common-mode EMI filtering and are available in an SMD format with dimensions of only 23.8 x 17.7 mm and heights ranging from 21.6 to 22.3 mm. To minimize board space, these components feature underbody termination. They can be used as &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/tdk-presents-smd-common-mode-chokes-for-up-to-80-v-35-a-with-a-minimized-pcb-footprint/\">Read More &#8594;<span class=\"screen-reader-text\"> \"TDK presents SMD common-mode chokes for up to 80 V/35 A with a minimized PCB footprint\"<\/span><\/a>"}, {"title": "Newark partners with Hailo to accelerate edge AI innovation globally", "source": "EE Journal", "date": "2026-07-27", "url": "https://www.eejournal.com/industry_news/newark-partners-with-hailo-to-accelerate-edge-ai-innovation-globally/", "summary": "Newark has announced a new global partnership with Hailo, a pioneering edge artificial intelligence (AI) chipmaker, to expand access to high-performance AI solutions for customers worldwide. Through the collaboration, Newark will offer Hailo’s AI products via their global distribution network, e-commerce platforms, and engineering community, enabling engineers, developers, and enterprises to integrate advanced edge AI &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/newark-partners-with-hailo-to-accelerate-edge-ai-innovation-globally/\">Read More &#8594;<span class=\"screen-reader-text\"> \"Newark partners with Hailo to accelerate edge AI innovation globally\"<\/span><\/a>"}, {"title": "Hybrid MCUs, Low-Power Embedded Design, Pros and Cons of MCU HW and SW Peripherals: Embedded Week Insights", "source": "Embedded.com", "date": "2026-07-24", "url": "https://www.embedded.com/hybrid-mcus-low-power-embedded-design-   wam:{ label:'World Action',  icon:'🌍', color:'#a78bfa', kw:['wam','world action model','world-action','world model'] },
  robotPolicy:{ label:'Robot Policy',  icon:'🦿', color:'#2dd4bf', kw:['robot polic','manipulation polic','dexterous','locomotion','loco-manipul'] },
  rlPolicy:{    label:'RL Policy',     icon:'🧮', color:'#fbbf24', kw:['reinforcement learning','reward function','policy gradient','actor-critic','ppo ','rl agent'] },
  simulation:{  label:'Simulation',    icon:'🖥️', color:'#60a5fa', kw:['sim-to-real','simulation','simulator','simulated env','mujoco','isaac','sapien','robotwin','libero'] },
};

const state = { ds:'all',page:1,size:20,q:'',sort:'newest',view:'grid',dr:'all',advMod:null };

/* ── helpers ── */
const esc = v => String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const plain = v => { const d=document.createElement('div'); d.innerHTML=String(v??''); return d.textContent||''; };
const titleOf = x => x.title||x.repo||x.model||x.company||'Untitled';
const dateOf  = x => x.date||x.published||x.posted||'';
const srcOf   = x => { const s=x.source; if (s && !/^https?:\/\//.test(s)) return s; return x.company||x.language||x.topic||x.category||''; };
const scoreOf = x => Number(x.score||x.stars||x.downloads||0);
const isSeed  = x => { const u=x.url||x.pdf_url||''; return u.includes('example.com')||(x.title||'').toLowerCase().startsWith('example'); };
const fmt = n => n>=1e6?(n/1e6).toFixed(1)+'M':n>=1000?(n/1000).toFixed(1)+'K':String(n);
const truncWords=(t,n=100)=>{if(!t)return'';const w=t.trim().split(/\s+/);return w.length<=n?t:w.slice(0,n).join(' ')+'…';};

/* ── stars (persist across data refreshes via localStorage, keyed by URL) ── */
const keyOf = x => x.url||x.pdf_url||titleOf(x);
let STARS = new Set(JSON.parse(localStorage.getItem('hub-stars')||'[]'));
const isStarred = x => STARS.has(keyOf(x));
function toggleStar(k) {
  if (STARS.has(k)) STARS.delete(k); else STARS.add(k);
  localStorage.setItem('hub-stars', JSON.stringify([...STARS]));
}
function starredRows() { return allRows().filter(isStarred); }


function hrefOf(x) {
  if (x.pdf_url) {
    const m=x.pdf_url.match(/arxiv\.org\/(?:pdf|abs)\/([0-9]+\.[0-9]+)/);
    if (m) return 'https://arxiv.org/abs/'+m[1];
  }
  if (x.url) return x.url;
  if (x.pdf_url) return x.pdf_url;
  if (x.source && /^https?:\/\//.test(x.source)) return x.source;
  return '#';
}

function cutoff(r) {
  if (r==='all') return '';
  const d=new Date();
  if (r==='today') d.setHours(0,0,0,0);
  else if (r==='7d')  d.setDate(d.getDate()-7);
  else if (r==='30d') d.setDate(d.getDate()-30);
  else if (r==='90d') d.setDate(d.getDate()-90);
  return d.toISOString().slice(0,10);
}

function colorOf(k) { return SRC_COLOR[k]||(TOPICS[k]&&TOPICS[k].color)||'#818cf8'; }
function labelOf(k) { return SRC_LABEL[k]||(TOPICS[k]&&TOPICS[k].label)||k; }
function iconOf(k)  { return SRC_ICON[k]||(TOPICS[k]&&TOPICS[k].icon)||'•'; }

/* ── rows ── */
function allRows() {
  return Object.entries(data).flatMap(([k,rows])=>rows.filter(x=>!isSeed(x)).map(x=>( {...x,_k:k} )));
}
function rowsFor(ds) {
  if (ds==='starred') return starredRows();
  if (TOPICS[ds]) {
    const t=TOPICS[ds];
    return (data.papers||[]).filter(x=>{
      if (isSeed(x)) return false;
      const txt=(x.title+' '+(x.summary||'')).toLowerCase();
      return t.kw.some(k=>txt.includes(k));
    }).map(x=>( {...x,_k:ds} ));
  }
  return ds==='all'?allRows():(data[ds]||[]).filter(x=>!isSeed(x)).map(x=>( {...x,_k:ds} ));
}
function filtered() {
  const q=state.q.trim().toLowerCase(), from=cutoff(state.dr);
  let rows=rowsFor(state.ds);
  if (q) rows=rows.filter(x=>JSON.stringify(x).toLowerCase().includes(q));
  if (from) rows=rows.filter(x=>dateOf(x)>=from);
  return rows.sort((a,b)=>{
    if (state.sort==='score') return scoreOf(b)-scoreOf(a);
    if (state.sort==='alpha') return titleOf(a).localeCompare(titleOf(b));
    return dateOf(b).localeCompare(dateOf(a));
  });
}

/* ── render nav ── */
function renderNav() {
  const mk = (k,lbl,ico,n) => `
    <button class="nav-btn${state.ds===k?' active':''}" data-k="${k}">
      <span class="nav-ico">${ico}</span>
      <span class="nav-lbl">${esc(lbl)}</span>
      <span class="nav-cnt">${n}</span>
    </button>`;
  document.getElementById('navMain').innerHTML =
    [['all',allRows().length],['starred',starredRows().length],...Object.entries(data).map(([k,r])=>[k,r.length])]
      .map(([k,n])=>mk(k,SRC_LABEL[k]||k,SRC_ICON[k]||'•',n)).join('');
  document.getElementById('navTopics').innerHTML =
    Object.entries(TOPICS).map(([k,t])=>mk(k,t.label,t.icon,rowsFor(k).length)).join('');
  document.getElementById('navAdv').innerHTML =
    mk('__adv__','ADVANCED','🚀','18 modules');
  document.querySelectorAll('.nav-btn').forEach(b=>b.addEventListener('click',()=>{
    state.ds=b.dataset.k; state.page=1; state.advMod=null; render();
  }));
}

/* ── render stats (with count-up) ── */
let lastDs='';
function renderStats() {
  const rows=rowsFor(state.ds);
  const scored=rows.filter(x=>scoreOf(x)>0).length;
  const jobs=rows.filter(x=>x._k==='jobs').length;
  const latest=rows.map(dateOf).filter(Boolean).sort().pop()||'—';
  const items=[
    ['⚡','Total Signals',rows.length,'#818cf8'],
    ['🎯','Scored Items',scored,'#38bdf8'],
    ['💼','Job Postings',jobs,'#34d399'],
    ['📅','Latest',latest,'#fbbf24'],
  ];
  document.getElementById('stats').innerHTML = items.map(([ico,lbl,val,col])=>`
    <div class="stat" style="--sc:${col}">
      <span class="stat-ico">${ico}</span>
      <div class="stat-lbl">${lbl}</div>
      <div class="stat-num" data-target="${typeof val==='number'?val:''}"
           style="${String(val).length>8?'font-size:15px;margin-top:8px':''}">
        ${typeof val==='number'?'0':esc(String(val))}
      </div>
    </div>`).join('');

  /* stat hover handled by CSS lift */

  /* count-up */
  const doCount = state.ds!==lastDs;
  lastDs=state.ds;
  document.querySelectorAll('.stat-num[data-target]').forEach(el=>{
    const t=Number(el.dataset.target);
    if (!t) return;
    if (!doCount) { el.textContent=t.toLocaleString(); return; }
    const dur=1400, s=performance.now();
    const tick=now=>{
      const p=Math.min((now-s)/dur,1), ease=1-Math.pow(1-p,3);
      el.textContent=Math.round(ease*t).toLocaleString();
      if (p<1) requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  });
}

/* ── item template ── */

  const color=colorOf(x._k), t=titleOf(x), u=hrefOf(x),

  let auHtml='';
  if (isPaper && Array.isArray(x.authors) && x.authors.length) {
    const shown=x.authors.slice(0,5), more=x.authors.length-shown.length;
    auHtml=`<div class="i-authors">
      ${shown.map(a=>`<span class="au">${esc(a)}</span>`).join('')}

  let acts='';

    acts=`<div class="i-acts"><a class="act act-p" href="${esc(u)}" target="_blank" rel="noreferrer">🧠 View Model</a></div>`;
  } else if (u!=='#') {
    acts=`<div class="i-acts"><a class="act act-p" href="${esc(u)}" target="_blank" rel="noreferrer">↗ Open</a></div>`;
  }

  const scLbl=x._k==='repos'?'⭐ stars':x._k==='models'?'⬇️ dl':'score';
  const sk=keyOf(x), starred=STARS.has(sk);

/* ── pagination ── */
function pageWin(c,t) {
  const s=Math.max(1,c-2),e=Math.min(t,c+2);
  const ps=[];
  for(let p=s;p<=e;p++) ps.push(p);
  if(!ps.includes(1)){ if(ps[0]>2) ps.unshift('…'); ps.unshift(1); }
  if(!ps.includes(t)){ if(ps[ps.length-1]<t-1) ps.push('…'); ps.push(t); }
  return ps;
}
function renderPag(tot) {
  const el=document.getElementById('pages');
  el.innerHTML=[
    `<button class="pgb" data-p="${state.page-1}" ${state.page===1?'disabled':''}>‹ Prev</button>`,
    ...pageWin(state.page,tot).map(p=>p==='…'
      ?`<button class="pgb" disabled>…</button>`
      :`<button class="pgb${p===state.page?' on':''}" data-p="${p}">${p}</button>`),
    `<button class="pgb" data-p="${state.page+1}" ${state.page===tot?'disabled':''}>Next ›</button>`,
  ].join('');
  el.querySelectorAll('.pgb:not([disabled])').forEach(b=>b.addEventListener('click',()=>{
    const p=Number(b.dataset.p);
    if(p&&p!==state.page){ state.page=p; render(); document.querySelector('.panel').scrollIntoView({behavior:'smooth',block:'start'}); }
  }));
}

/* ── main render ── */
function render() {
  const isAdv = state.ds==='__adv__';
  document.getElementById('pageTitle').textContent =
    isAdv?(state.advMod?ADV_MODS.find(m=>m.id===state.advMod)?.label||'Advanced':'🚀 Advanced Intelligence')
    :SRC_LABEL[state.ds]||(TOPICS[state.ds]&&TOPICS[state.ds].label)||state.ds;
  renderNav();
  document.getElementById('mainPanel').style.display = isAdv?'none':'';
  document.getElementById('stats').style.display = isAdv?'none':'';
  document.getElementById('advWrap').style.display = isAdv?'':'none';
  if (isAdv) { renderAdvanced(); return; }
  renderStats();
  const rows=filtered();
  const tot=Math.max(1,Math.ceil(rows.length/state.size));
  state.page=Math.min(state.page,tot);
  const s=(state.page-1)*state.size;
  const slice=rows.slice(s,s+state.size);
  document.getElementById('resultCount').textContent=
    rows.length.toLocaleString()+' result'+(rows.length!==1?'s':'');
  document.getElementById('pageStatus').textContent=`Page ${state.page} of ${tot}`;
  document.getElementById('rangeStatus').textContent=rows.length
    ?`Showing ${s+1}–${s+slice.length} of ${rows.length}`:'No results';
  const feed=document.getElementById('feed');
  feed.className='feed '+(state.view==='grid'?'grid-v':'list-v');
  feed.innerHTML=slice.length?slice.map(itemHtml).join('')
    :`<div class="empty">
        <div class="empty-ico">🔭</div>
        <h3>No matching signals</h3>
        <p>Try adjusting your search or selecting a different category.</p>
      </div>`;
  renderPag(tot);
  addTilts();
}

/* ══════════════════════════════════════════
   NEURAL NETWORK BACKGROUND ANIMATION
══════════════════════════════════════════ */
(function() {
  const canvas=document.getElementById('bgCanvas');
  const ctx=canvas.getContext('2d');
  let W,H;
  function resize(){ W=canvas.width=window.innerWidth; H=canvas.height=window.innerHeight; }
  window.addEventListener('resize',resize); resize();

  const N=40, MAXD=150;
  const PCOLORS=['rgba(124,58,237,','rgba(99,102,241,','rgba(129,140,248,','rgba(14,165,233,'];
  const nodes=Array.from({length:N},()=>{
    const c=PCOLORS[Math.floor(Math.random()*PCOLORS.length)];
    return {
      x:Math.random()*window.innerWidth,
      y:Math.random()*window.innerHeight,
      vx:(Math.random()-.5)*.32,
      vy:(Math.random()-.5)*.32,
      r:Math.random()*1.8+.6,
      c, ph:Math.random()*Math.PI*2,
      ps:.008+Math.random()*.014,
    };
  });

  let mx=-2000,my=-2000;
  window.addEventListener('mousemove',e=>{ mx=e.clientX; my=e.clientY; });

  function frame() {
    ctx.clearRect(0,0,W,H);
    nodes.forEach(n=>{
      n.x+=n.vx; n.y+=n.vy; n.ph+=n.ps;
      if(n.x<0||n.x>W) n.vx*=-1;
      if(n.y<0||n.y>H) n.vy*=-1;
      n.x=Math.max(0,Math.min(W,n.x));
      n.y=Math.max(0,Math.min(H,n.y));
      const dx=n.x-mx,dy=n.y-my,md=Math.sqrt(dx*dx+dy*dy);
      if(md<110){ n.vx+=(dx/md)*.012; n.vy+=(dy/md)*.012; }
      n.vx=Math.max(-.7,Math.min(.7,n.vx*.997));
      n.vy=Math.max(-.7,Math.min(.7,n.vy*.997));
      const p=.35+Math.sin(n.ph)*.18;
      /* glow halo */
      const g=ctx.createRadialGradient(n.x,n.y,0,n.x,n.y,n.r*5);
      g.addColorStop(0,n.c+(p*.7)+')');
      g.addColorStop(1,n.c+'0)');
      ctx.beginPath(); ctx.arc(n.x,n.y,n.r*5,0,Math.PI*2);
      ctx.fillStyle=g; ctx.fill();
      /* core */
      ctx.beginPath(); ctx.arc(n.x,n.y,n.r,0,Math.PI*2);
      ctx.fillStyle=n.c+(p*1.4)+')'; ctx.fill();
    });
    /* connections */
    for(let i=0;i<N;i++) for(let j=i+1;j<N;j++) {
      const dx=nodes[i].x-nodes[j].x, dy=nodes[i].y-nodes[j].y;
      const d=Math.sqrt(dx*dx+dy*dy);
      if(d<MAXD) {
        const a=(1-d/MAXD)*.14;
        ctx.beginPath();
        ctx.moveTo(nodes[i].x,nodes[i].y);
        ctx.lineTo(nodes[j].x,nodes[j].y);
        ctx.strokeStyle=`rgba(129,140,248,${a})`;
        ctx.lineWidth=.7; ctx.stroke();
      }
    }
    requestAnimationFrame(frame);
  }
  frame();
})();

/* ══════════════════════════════════════════
   AUTO-REFRESH COUNTDOWN (every 6 hours)
══════════════════════════════════════════ */
(function() {
  const SIX_H=6*60*60*1000;
  const end=Date.now()+SIX_H;
  const updEl=document.getElementById('nextUpd');
  const progEl=document.getElementById('refProg');

  function tick() {
    const left=end-Date.now();
    if(left<=0){ location.reload(); return; }
    const h=Math.floor(left/3600000);
    const m=Math.floor((left%3600000)/60000);
    const s=Math.floor((left%60000)/1000);
    if(updEl) updEl.textContent=`Refresh in ${h}h ${m}m ${s}s`;
    if(progEl) progEl.style.width=((left/SIX_H)*100).toFixed(2)+'%';
  }
  tick();
  setInterval(tick,1000);
  setTimeout(()=>location.reload(),SIX_H);
})();

const ALL_TEXT = (arr) => arr.filter(x=>!isSeed(x)).map(x=>JSON.stringify(x).toLowerCase());

function mktScore(k) {
  const kws=MKTS[k].kw;
  const has=txt=>kws.some(w=>txt.includes(w));
  const papers   =(data.papers||[]).filter(x=>!isSeed(x)&&has((x.title+' '+(x.summary||'')).toLowerCase())).length;
  const news     =[...(data.aiNews||[]),...(data.physicalAiNews||[]),...(data.roboticsNews||[]),...(data.embeddedNews||[])].filter(x=>!isSeed(x)&&has(JSON.stringify(x).toLowerCase())).length;
  const funding  =(data.funding||[]).filter(x=>!isSeed(x)&&has(JSON.stringify(x).toLowerCase())).length;
  const jobs     =(data.jobs||[]).filter(x=>!isSeed(x)&&has(JSON.stringify(x).toLowerCase())).length;
  const repos    =(data.repos||[]).filter(x=>!isSeed(x)&&has(JSON.stringify(x).toLowerCase())).length;
  const models   =(data.models||[]).filter(x=>!isSeed(x)&&has(JSON.stringify(x).toLowerCase())).length;
  const companies=(data.companies||[]).filter(x=>!isSeed(x)&&has(JSON.stringify(x).toLowerCase())).length;
  const research = papers*3+repos*2+models*2;
  const commercial= funding*5+companies*4;
  const demand = news*2+jobs*1;
  const total = research+commercial+demand;
  const momentum = Math.min(99,research*2+demand*3);
  const competition= Math.min(99,commercial*4);
  const opp = Math.min(99,Math.max(1,research*3+demand*2-competition*0.5+10));
  const gap = Math.max(0,research - commercial);
  return {papers,news,funding,jobs,repos,models,companies,research,commercial,demand,total,momentum,competition,opp,gap};
}

    const idea=(document.getElementById('val-idea').value||'').toLowerCase();
    const mkt=(document.getElementById('val-market').value||'').toLowerCase();
    const combined=idea+' '+mkt;
    let bestMkt=null, bestScore=0;
    Object.entries(MKTS).forEach(([k,m])=>{
      const s=mktScore(k);
      if(m.kw.some(w=>combined.includes(w.split(' ')[0]))){

    if(!bestMkt) { const e=Object.entries(MKTS).map(([k,m])=>{return{k,m,s:mktScore(k)};}); bestMkt=e.sort((a,b)=>b.s.opp-a.s.opp)[0]; }

/* ── Module: ProblemMine ── */
function advProblemMine() {
  const MARKERS=['challenge','problem','limitation','lack of','difficult','lacking','absence of','gap in','fail to','struggle','insufficient','unable to','barrier'];
  const problems=[];
  const allSrc=[...(data.papers||[]),...(data.aiNews||[]),...(data.roboticsNews||[]),...(data.physicalAiNews||[])].filter(x=>!isSeed(x));
  allSrc.forEach(x=>{
    const text=plain(x.summary||x.description||'');
    if(!text) return;
    const sentences=text.split(/[.!?]/).map(s=>s.trim()).filter(s=>s.length>20&&s.length<200);
    sentences.forEach(s=>{
      const sl=s.toLowerCase();
      if(MARKERS.some(m=>sl.includes(m))){
        problems.push({problem:s,source:titleOf(x),url:hrefOf(x),date:dateOf(x),
          opp:50+Math.floor(Math.random()*45)});
      }
    });
  });
  const unique=problems.filter((p,i)=>problems.findIndex(q=>q.problem.slice(0,30)===p.problem.slice(0,30))===i);
  const top=unique.sort((a,b)=>b.opp-a.opp).slice(0,20);
  return `
  <div class="adv-metrics">
    <div class="adv-metric"><div class="adv-metric-n">${top.length}</div><div class="adv-metric-l">Problems Found</div></div>
    <div class="adv-metric"><div class="adv-metric-n">${top.filter(p=>p.opp>=80).length}</div><div class="adv-metric-l">High-Value</div></div>
    <div class="adv-metric"><div class="adv-metric-n">${new Set(top.map(p=>p.date.slice(0,7))).size}</div><div class="adv-metric-l">Date Ranges</div></div>
    <div class="adv-metric"><div class="adv-metric-n">Live</div><div class="adv-metric-l">Data Source</div></div>
  </div>
  <div class="adv-panel">
    <div class="adv-panel-hdr">⛏️ Real problems extracted from research papers & news</div>
    <ul class="adv-list">
      ${top.length?top.map((p,i)=>`
        <li class="adv-item">
          <div class="adv-rank">${i+1}</div>
          <div class="adv-item-body">
            <div class="adv-item-title" style="font-size:13.5px;font-weight:600;color:var(--t2)">"${esc(p.problem)}"</div>
            <div style="margin-top:6px;display:flex;gap:8px;flex-wrap:wrap;align-items:center">
              <a href="${esc(p.url)}" target="_blank" style="font-size:11.5px;color:var(--acc)">📄 ${esc(truncWords(p.source,8))}</a>
              ${p.date?`<span style="font-size:11px;color:var(--muted)">${p.date}</span>`:''}
              <span class="adv-tag adv-tag-green">Opp: ${p.opp}</span>
            </div>
          </div>
        </li>`).join('')
      :`<li class="adv-item"><div style="color:var(--muted);padding:20px">No problems extracted yet — add more papers with summaries.</div></li>`}
    </ul>
  </div>`;
}

  const topGap=Object.entries(MKTS).map(([k,m])=>{const s=mktScore(k);const g=Math.min(99,s.papers*4-s.funding*6+20);return{k,m,g};}).sort((a,b)=>b.g-a.g)[0];
  const today=new Date().toLocaleDateString('en-US',{weekday:'long',year:'numeric',month:'long',day:'numeric'});
  const section=(label,icon,content)=>
    `<div class="adv-brief-section"><div class="adv-brief-label">${icon} ${label}</div>${content}</div>`;
  return `
  <div class="adv-hero" style="text-align:left;padding:20px 24px">
    <div style="font-size:12px;font-weight:700;color:var(--acc);letter-spacing:.08em;text-transform:uppercase;margin-bottom:5px">Daily Founder Brief</div>
    <div class="adv-hero-title" style="font-size:22px">${today}</div>
    <div class="adv-hero-sub">Your daily intelligence digest for Physical AI builders</div>
  </div>
  ${section('Top Market Signal','📡',`
    <div class="adv-panel" style="padding:16px 18px;margin:0">
      <div style="font-size:15px;font-weight:800">${topMkt.m.icon} ${topMkt.m.label} — Opportunity Score ${topMkt.s.opp}</div>
      <div style="font-size:13px;color:var(--t2);margin-top:5px">
        ${topMkt.s.papers} papers · ${topMkt.s.funding} funding rounds · ${topMkt.s.jobs} open jobs
      </div>
      ${bar('Momentum',topMkt.s.momentum,topMkt.m.color)}
    </div>`)}
  ${section('Top Research Paper','📄',`
    <div class="adv-panel" style="padding:16px 18px;margin:0">
      <a href="${esc(hrefOf(topPaper))}" target="_blank" style="font-size:14px;font-weight:700;color:var(--text)">${esc(truncWords(titleOf(topPaper),15))}</a>
      ${Array.isArray(topPaper.authors)&&topPaper.authors.length?`<div style="font-size:12px;color:var(--t3);margin-top:4px">${topPaper.authors.slice(0,3).join(', ')}${topPaper.authors.length>3?' et al.':''}</div>`:''}</div>`)}
  ${section('Biggest Gap Opportunity','🔍',`
    <div class="adv-panel" style="padding:16px 18px;margin:0">
      <div style="font-size:14px;font-weight:700">${topGap.m.icon} ${topGap.m.label} — ${topGap.g} gap score</div>
      <div style="font-size:13px;color:var(--t2);margin-top:5px">Strong research activity. Few commercial solutions. High demand. Build here.</div>
    </div>`)}
  ${topFunding&&titleOf(topFunding)?section('Latest Funding Round','💰',`
    <div class="adv-panel" style="padding:16px 18px;margin:0">
      <div style="font-size:14px;font-weight:700">${esc(truncWords(titleOf(topFunding),12))}</div>
      <div style="font-size:13px;color:var(--t2);margin-top:4px">
        ${topFunding.amount?`<span class="adv-tag adv-tag-green">${esc(topFunding.amount)}</span>`:''}
        ${topFunding.stage?`<span class="adv-tag adv-tag-blue">${esc(topFunding.stage)}</span>`:''}
        ${dateOf(topFunding)?`<span style="color:var(--muted);font-size:12px;margin-left:6px">${dateOf(topFunding)}</span>`:''}
      </div>
    </div>`):''}</div>`;
  return `<div class="adv-wrap">` + section('placeholder','','') + `</div>`;
}

/* ── Module: Signal Score Engine ── */
function advSignalEngine() {
  const WEIGHTS={research:3,funding:5,hiring:1,openSource:2,news:2};
  const calcSignal=(item,type)=>{
    const txt=JSON.stringify(item).toLowerCase();
    const hasMkt=k=>MKTS[k].kw.some(w=>txt.includes(w));
    const mktBonus=Object.keys(MKTS).filter(hasMkt).length*4;
    if(type==='paper') return Math.min(99,scoreOf(item)*10+mktBonus+20);
    if(type==='repo')  return Math.min(99,Math.log1p(scoreOf(item))*10+mktBonus+10);
    if(type==='model') return Math.min(99,Math.log1p(scoreOf(item))*8+mktBonus+15);
    return Math.min(99,mktBonus+25);
  };
  const allItems=[
    ...(data.papers||[]).filter(x=>!isSeed(x)).map(x=>{return{...x,_type:'paper',_sig:calcSignal(x,'paper')};}),
    ...(data.repos||[]).filter(x=>!isSeed(x)).map(x=>{return{...x,_type:'repo',_sig:calcSignal(x,'repo')};}),
    ...(data.models||[]).filter(x=>!isSeed(x)).map(x=>{return{...x,_type:'model',_sig:calcSignal(x,'model')};}),
    ...(data.funding||[]).filter(x=>!isSeed(x)).map(x=>{return{...x,_type:'funding',_sig:calcSignal(x,'funding')};}),
  ].sort((a,b)=>b._sig-a._sig).slice(0,25);
  const byType=t=>allItems.filter(x=>x._type===t).length;
  const typeIcon={paper:'📄',repo:'💻',model:'🧠',funding:'💰'};
  const typeColor={paper:'#34d399',repo:'#60a5fa',model:'#fb923c',funding:'#a3e635'};
  return `
  <div class="adv-metrics">
    <div class="adv-metric"><div class="adv-metric-n">${allItems[0]?._sig||0}</div><div class="adv-metric-l">Top Signal Score</div></div>
    <div class="adv-metric"><div class="adv-metric-n">${allItems.filter(x=>x._sig>=80).length}</div><div class="adv-metric-l">High Signal Items</div></div>
    <div class="adv-metric"><div class="adv-metric-n">${allItems.length}</div><div class="adv-metric-l">Items Ranked</div></div>
    <div class="adv-metric"><div class="adv-metric-n">Live</div><div class="adv-metric-l">Data Freshness</div></div>
  </div>
  <div class="adv-panel">
    <div class="adv-panel-hdr">⚡ Universal Signal Score Rankings — Top 25 signals across all categories</div>
    <ul class="adv-list">
      ${allItems.map((x,i)=>{
        const tc=typeColor[x._type]||'#818cf8';
        const ti=typeIcon[x._type]||'•';
        return `<li class="adv-item">
          <div class="adv-rank" style="background:${tc}22;color:${tc}">${i+1}</div>
          <div class="adv-item-body">
            <div class="adv-item-title">
              <a href="${esc(hrefOf(x))}" target="_blank" style="color:var(--text)">${esc(truncWords(titleOf(x),12))}</a>
            </div>
            <div class="adv-scores">
              <span class="adv-tag" style="background:${tc}22;border:1px solid ${tc}44;color:${tc}">${ti} ${x._type}</span>
              ${scoreOf(x)?`<span class="adv-tag adv-tag-blue">${fmt(scoreOf(x))}</span>`:''}</div>
          </div>
          <div style="text-align:right;flex-shrink:0">
            <div style="font-size:22px;font-weight:900;color:${tc}">${x._sig}</div>
            <div style="font-size:10px;color:var(--muted)">signal</div>
          </div>
        </li>`;
      }).join('')}
    </ul>
  </div>`;
}

/* ── ADVANCED main renderer ── */
function renderAdvanced() {
  const wrap=document.getElementById('advWrap');
  if(state.advMod) {
    const mod=ADV_MODS.find(m=>m.id===state.advMod);
    let content='<div style="color:var(--muted);padding:40px;text-align:center">Module coming soon.</div>';
    if(state.advMod==='opportunity_radar') content=advOpportunityRadar();
    else if(state.advMod==='gapfinder')       content=advGapFinder();
    else if(state.advMod==='future_unicorn')  content=advFutureUnicorn();
    else if(state.advMod==='startup_ideas')   content=advStartupIdeas();
    else if(state.advMod==='startup_validator') content=advStartupValidator();
    else if(state.advMod==='builder_match')   content=advBuilderMatch();
    else if(state.advMod==='problemmine')     content=advProblemMine();
    else if(state.advMod==='market_intel')    content=advMarketIntel();
    else if(state.advMod==='research_map')    content=advResearchMap();
    else if(state.advMod==='startup_genome')  content=advStartupGenome();
    else if(state.advMod==='hidden_gems')     content=advHiddenGems();
    else if(state.advMod==='investor_mode')   content=advInvestorMode();
    else if(state.advMod==='graveyard')       content=advGraveyard();
    else if(state.advMod==='time_machine')    content=advTimeMachine();
    else if(state.advMod==='cofounder')       content=advCoFounder();
    else if(state.advMod==='cert_hub')        content=advCertHub();
    else if(state.advMod==='daily_brief')     content=advDailyBrief();
    else if(state.advMod==='signal_engine')   content=advSignalEngine();
    wrap.innerHTML=`
      <button class="adv-back" id="advBack">← Back to Advanced Hub</button>
      <div class="adv-mod-hdr">
        <div class="adv-mod-ico">${mod?.icon||'🚀'}</div>
        <div>
          <div class="adv-mod-title">${mod?.label||state.advMod}</div>
          <div class="adv-mod-sub">${mod?.desc||''}</div>
        </div>
      </div>
      ${content}`;
    document.getElementById('advBack')?.addEventListener('click',()=>{
      state.advMod=null; renderAdvanced();
    });
    /* bind interactive modules */
    if(state.advMod==='startup_validator') advStartupValidatorBind();
    else if(state.advMod==='builder_match') advBuilderMatchBind();
    else if(state.advMod==='cofounder') advCoFounderBind();
  } else {
    wrap.innerHTML=renderAdvHub();
    wrap.querySelectorAll('.adv-hcard').forEach(c=>c.addEventListener('click',()=>{
      state.advMod=c.dataset.mod; renderAdvanced();
      document.querySelector('.main').scrollTo({top:0,behavior:'smooth'});
    }));
  }
}

/* ── init ── */
syncVT();
render();
</script>
