volving Python on hardware (microcontrollers AND single board computers like Raspberry Pi). This ad-free, spam-free weekly email is filled with CircuitPython, MicroPython, and Python information that you may have missed, all in one place! You get a summary of all the software, events, projects, and the latest hardware worldwide once a week, no [&#8230;]"}, {"title": "U.S. onshoring of memory may increase costs for now", "source": "Adafruit", "date": "2026-10-02", "url": "https://blog.adafruit.com/2026/10/02/u-s-onshoring-of-memory-may-increase-costs-for-now/", "summary": "In a recent report in the Wall Street Journal, the U.S. wants more domestic production of the memory chips essential to AI, and are looking to use tariffs to make that happen. The U.S. currently has just one commercial memory production facility, while the advanced memory used for AI remains dependent on Asian manufacturing. Meaningful [&#8230;]"}, {"title": "John Park’s CircuitPython Parsec: Surviving Sensor Drop with Try/Except", "source": "Adafruit", "date": "2026-10-02", "url": "https://blog.adafruit.com/2026/10/02/john-parks-circuitpython-parsec-surviving-sensor-drop-with-try-except/", "summary": "#circuitpythonparsec Help your code gracefully survive an I2C sensor disconnect with a try/except in CircuitPython. Try out the code example To learn about CircuitPython: https://circuitpython.org &#160;"}, {"title": "Sensea underwater camera — Raspberry Pi #Raspberrypi", "source": "Adafruit", "date": "2026-10-02", "url": "https://blog.adafruit.com/2026/10/02/sensea-underwater-camera-raspberry-pi-raspberrypi/", "summary": "Via Raspberrypi.com/news Sensea was conceived as “a low-cost DIY underwater explorer that would reveal what’s going on below the surface of our local ponds and rivers”, proving that you don’t need expensive equipment to investigate the depths. For context, the boys’ agitated pleas for a GoPro fell on deaf ears, so they built a custom [&#8230;]"}, {"title": "Get Ready for Electronic Halloween with Adafruit Matrix Portal", "source": "Adafruit", "date": "2026-10-02", "url": "https://blog.adafruit.com/2026/10/02/get-ready-for-electronic-halloween-with-adafruit-matrix-portal/", "summary": "What&#8217;s the easiest way to make a custom colorful LED display for Halloween? Like, no solder, no wiring, just instant plug-and-play? Adafruit Matrix Portal! With our add-on for RGB Matricies it&#8217;s never been easier. Plug directly into the back of any Adafruit HUB-75 display (all the ones we stock will work) from 16&#215;32 up to [&#8230;]"}, {"title": "Cybernetic Animated Eyeball #ElectronicHalloween", "source": "Adafruit", "date": "2026-10-02", "url": "https://blog.adafruit.com/2026/10/02/cybernetic-animated-eyeball-electronichalloween/", "summary": "The Cyberdyne Systems T-800 Series Model 101 Terminator is one of the all time classic cyborg characters from science fiction. You can get a terrific Halloween mask of the T-800 and even display it as a piece of artwork, but it&#8217;s just missing a little something. I know, a terrifying cyborg eyeball to look around, [&#8230;]"}, {"title": "Celebrate National Hispanic Heritage Month with The Miami-Dade Public Library System #HispanicHeritageMonth", "source": "Adafruit", "date": "2026-10-02", "url": "https://blog.adafruit.com/2026/10/02/celebrate-national-hispanic-heritage-month-with-the-miami-dade-public-library-system-hispanicheritagemonth/", "summary": "The Miami-Dade Public Library System is celebrating National Hispanic Heritage Month with a variety of events, recommended reads for kids, and resources."}, {"title": "Manufacturing Day 2026 @mfgday #MFGDay26", "source": "Adafruit", "date": "2026-10-02", "url": "https://blog.adafruit.com/2026/10/02/manufacturing-day-2026-mfgday-mfgday26/", "summary": "&#160; Today is Manufacturing Day, celebrated the 1st Friday of October. As an American manufacturer in the heart of Brooklyn, NY, Adafruit is proud to share our work. Peak into our manufacturing processes with our past series Advanced Manufacturing: Made in NYC. Spend some time today to learn more about manufacturing. There are webinars, gamified [&#8230;]"}, {"title": "Today Only! Get 15% off with code AdaBoo15 🎃", "source": "Adafruit", "date": "2026-10-02", "url": "https://blog.adafruit.com/2026/10/02/halloween-sale-2026/", "summary": "&#160; It&#8217;s our favorite time of the year! Add code AdaBoo15 to your cart for 15% off to make your trick or treat build that much sweeter! Some restrictions apply. Discount does not apply to gift certificates, subscriptions, some Raspberry Pi items, digital items or software. We also do not permit the use of discount [&#8230;]"}, {"title": "Vector and SCSK Collaborate to Simplify Embedded Software Development on Renesas RL78/F2x", "source": "EE Journal", "date": "2026-10-02", "url": "https://www.eejournal.com/industry_news/vector-and-scsk-collaborate-to-simplify-embedded-software-development-on-renesas-rl78-f2x/", "summary": "Vector and SCSK Corporation have developed a joint evaluation bundle to simplify the development of sensor and actuator applications based on Renesas RL78/F2x microcontrollers. By combining Vector&#8217;s MICROSAR IO with SCSK&#8217;s QINeS-Lite platform and drivers, the bundle provides a pre-integrated software foundation, reducing integration effort and accelerating setup and evaluation. SCSK is a leading Japanese &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/vector-and-scsk-collaborate-to-simplify-embedded-software-development-on-renesas-rl78-f2x/\">Read More &#8594;<span class=\"screen-reader-text\"> \"Vector and SCSK Collaborate to Simplify Embedded Software Development on Renesas RL78/F2x\"<\/span><\/a>"}, {"title": "DigiKey Releases Factory Tomorrow Season 6 Exploring AI Infrastructure, Industrial Connectivity and Smart Manufacturing", "source": "EE Journal", "date": "2026-10-02", "url": "https://www.eejournal.com/industry_news/digikey-releases-factory-tomorrow-season-6-exploring-ai-infrastructure-industrial-connectivity-and-smart-manufacturing/", "summary": "DigiKey, the global distribution leader of electronic components and automation products, announces the launch of Season 6 of Factory Tomorrow, a video series highlighting how manufacturers and technology suppliers are building the foundation for the next generation of industrial production. From AI-enabled data centers powering Industry 4.0 to the networks that move power and data across &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/digikey-releases-factory-tomorrow-season-6-exploring-ai-infrastructure-industrial-connectivity-and-smart-manufacturing/\">Read More &#8594;<span class=\"screen-reader-text\"> \"DigiKey Releases Factory Tomorrow Season 6 Exploring AI Infrastructure, Industrial Connectivity and Smart Manufacturing\"<\/span><\/a>"}, {"title": "TDK showcases factory automation, RF power and advanced power solutions at SEMICON West 2026", "source": "EE Journal", "date": "2026-10-02", "url": "https://www.eejournal.com/industry_news/tdk-showcases-factory-automation-rf-power-and-advanced-power-solutions-at-semicon-west-2026/", "summary": "&#8211;  TDK will exhibit its latest factory automation, programmable power supply and RF power technologies at SEMICON West, October 13–15, 2026, at Moscone Center in San Francisco, Booth 453 &#8211;  Live factory automation demonstrations will highlight TDK’s precision load port and flip-chip technologies for advanced semiconductor manufacturing and packaging &#8211;  TDK-Lambda will showcase advanced RF &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/tdk-showcases-factory-automation-rf-power-and-advanced-power-solutions-at-semicon-west-2026/\">Read More &#8594;<span class=\"screen-reader-text\"> \"TDK showcases factory automation, RF power and advanced power solutions at SEMICON West 2026\"<\/span><\/a>"}, {"title": "Bringing the Brain to AI: Inside BrainChip’s Neuromorphic Approach to Event Based AI Processing", "source": "EE Journal", "date": "2026-10-02", "url": "https://www.eejournal.com/fish_fry/bringing-the-brain-to-ai-inside-brainchips-neuromorphic-approach-to-event-based-ai-processing/", "summary": "<img alt=\"\" class=\"webfeedsFeaturedVisual wp-post-image\" height=\"300\" src=\"https://www.eejournal.com/wp-content/uploads/2026/09/AD-100226-300x300.jpg\" style=\"display: block; margin-bottom: 5px; clear: both;\" width=\"300\" />In this week’s podcast, we&#8217;re diving deep into the frontier of artificial intelligence and exploring how mimicking the human brain could hold the key to ultra-low-power, highly efficient computing at the edge. My guest is Sean Hehir, CEO of BrainChip. Sean and I explore their groundbreaking Akida neuromorphic processor and how BrainChip&#8217;s event-based approach processes &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/fish_fry/bringing-the-brain-to-ai-inside-brainchips-neuromorphic-approach-to-event-based-ai-processing/\">Read More &#8594;<span class=\"screen-reader-text\"> \"Bringing the Brain to AI: Inside BrainChip’s Neuromorphic Approach to Event Based AI Processing\"<\/span><\/a>"}, {"title": "LakeShark firmware turns LilyGO T-Display P4 into a handheld ESP32-P4 SDR scanner", "source": "CNX Software", "date": "2026-10-01", "url": "https://www.cnx-software.com/2026/10/01/lakeshark-firmware-turns-lilygo-t-display-p4-into-a-handheld-esp32-p4-sdr-scanner/", "summary": "<div><img alt=\"LilyGO T Display P4 running LakeShark open source firmware\" class=\"attachment-medium size-medium wp-post-image\" height=\"480\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/09/LilyGO-T-Display-P4-running-LakeShark-open-source-firmware-720x480.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>LakeShark is open-source firmware by Samuel Reynolds (SAMS0N1TE) that turns the ESP32-P4-based LilyGO T-Display P4 into a handheld SDR scanner. Paired with an RTL-SDR Blog V3 or V4 dongle, it supports P25 Phase I trunking, analog FM/AM, POCSAG pager decoding, and 1090 MHz ADS-B reception directly on the ESP32-P4, without a PC, Raspberry Pi, or smartphone. It also includes an onboard SX1262 that supports LoRa and MeshCore applications. SDR devices like LimeSDR Micro, xSDR, UUGear’s VU GPSDR, and many others usually rely on a PC, Raspberry Pi, or smartphone for processing, but LakeShark shows that a powerful microcontroller can also handle many SDR tasks. We previously covered the LilyGO T-Display P4 in March 2026, and LakeShark makes good use of its built-in hardware, including the SX1262 for LoRa and MeshCore applications, L76K GPS receiver for location tracking and offline maps, and ESP32-C6 for Wi-Fi and Bluetooth connectivity. LakeShark hardware requirements: Primary [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/10/01/lakeshark-firmware-turns-lilygo-t-display-p4-into-a-handheld-esp32-p4-sdr-scanner/\">LakeShark firmware turns LilyGO T-Display P4 into a handheld ESP32-P4 SDR scanner<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "$30 Raspberry Pi Smart Display Module for CM5 targets digital signage displays and kiosks", "source": "CNX Software", "date": "2026-10-01", "url": "https://www.cnx-software.com/2026/10/01/30-raspberry-pi-smart-display-module-for-cm5-targets-digital-signage-displays-and-kiosks/", "summary": "<div><img alt=\"Raspberry Pi Smart Display Module\" class=\"attachment-medium size-medium wp-post-image\" height=\"478\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/09/Raspberry-Pi-Smart-Display-Module-720x478.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Raspberry Pi Smart Display Module is a CM5 carrier board compatible with the Intel Smart Display Module (SDM) specification, more specifically the SDM-L form factor (as opposed to the smaller SDM-S option). The Intel SDM standard has been around for years, and we first wrote it in 2018, covering the Axiomtek SDM300s (SDM-S) module. These cards are designed to be plugged into compatible digital signage displays, kiosks, point-of-sale systems, and so on. They feature a standard 98-pin PCIe edge connector with USB 3.0, HDMI 1.4/2.0, I2C/UART/SPI signalling, as well as Ethernet, HDMI, USB ports, and an M.2 expansion socket. Raspberry Pi Smart Display Module specifications: Compatible with Raspberry Pi Compute Module 5 Video Output &#8211; Full-size HDMI 2.0 port Camera &#8211; 22-way MIPI DSI/CSI-2 connector (internal) Networking Gigabit Ethernet RJ45 port WiFi 5 and Bluetooth 5.2 (on CM5) with U.FL antenna USB USB 3.0 Type-A port USB 2.0 Type-C port for programming [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/10/01/30-raspberry-pi-smart-display-module-for-cm5-targets-digital-signage-displays-and-kiosks/\">$30 Raspberry Pi Smart Display Module for CM5 targets digital signage displays and kiosks<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Vector, SCSK Simplify RL78/F2x Embedded Software Development", "source": "Embedded.com", "date": "2026-10-01", "url": "https://www.embedded.com/vector-scsk-simplify-rl78-f2x-embedded-software-development/", "summary": "<p>Vector Informatik GmbH and SCSK Corp. have developed a joint evaluation bundle for embedded sensor and actuator applications based on Renesas RL78/F2x microcontrollers (MCUs). The package combines Vector's MICROSAR IO with SCSK's QINeS-Lite software platform and device drivers, providing a pre-integrated software foundation intended to reduce initial setup and integration work during application development and evaluation. [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/vector-scsk-simplify-rl78-f2x-embedded-software-development/\">Vector, SCSK Simplify RL78/F2x Embedded Software Development<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "Aetina Launches Edge AI Systems for Robotics", "source": "Embedded.com", "date": "2026-10-01", "url": "https://www.embedded.com/aetina-launches-edge-ai-systems-for-robotics/", "summary": "<p>Aetina Corp. has introduced its DeviceEdge AIE-KT78 and AIE-KT68 flagship edge AI systems for robotics and autonomous machines. The edge AI systems, powered by Nvidia Jetson Thor, integrate the Nvidia Blackwell architecture's high-performance AI compute, high-bandwidth sensor connectivity, and deterministic industrial control. These edge systems help developers design collaborative robots (cobots), humanoid robots, and autonomous [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/aetina-launches-edge-ai-systems-for-robotics/\">Aetina Launches Edge AI Systems for Robotics<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "TDK presents DC-link capacitors rated for up to +135 °C in automotive and industrial applications", "source": "EE Journal", "date": "2026-10-01", "url": "https://www.eejournal.com/industry_news/tdk-presents-dc-link-capacitors-rated-for-up-to-135-c-in-automotive-and-industrial-applications/", "summary": "TDK Corporation (TSE: 6762) presents the B3272*A/G/T series of DC-link film capacitors. These are qualified for continuous operation at case temperatures of up to +135 °C, with no derating required up to +105 °C. These components feature an EPN dielectric. This blend of polypropylene (PP) and cyclic olefin copolymer (COC) has already been proven in TDK’s ModCap UHP &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/tdk-presents-dc-link-capacitors-rated-for-up-to-135-c-in-automotive-and-industrial-applications/\">Read More &#8594;<span class=\"screen-reader-text\"> \"TDK presents DC-link capacitors rated for up to +135 °C in automotive and industrial applications\"<\/span><\/a>"}, {"title": "OpenAI and Synopsys Announce GPT-Synopsys: Frontier Intelligence to Revolutionize Chip Design", "source": "EE Journal", "date": "2026-10-01", "url": "https://www.eejournal.com/industry_news/openai-and-synopsys-announce-gpt-synopsys-frontier-intelligence-to-revolutionize-chip-design/", "summary": "Synopsys (Nasdaq: SNPS) and OpenAI today announced a strategic partnership that brings together OpenAI&#8217;s advanced AI capabilities with Synopsys&#8217; industry-leading EDA tools and agentic AI capabilities to revolutionize the design of semiconductors. The companies signed an expansive, multi-year agreement to jointly develop GPT-Synopsys, a specialized model, optimized to use Synopsys EDA tools to perform semiconductor &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/openai-and-synopsys-announce-gpt-synopsys-frontier-intelligence-to-revolutionize-chip-design/\">Read More &#8594;<span class=\"screen-reader-text\"> \"OpenAI and Synopsys Announce GPT-Synopsys: Frontier Intelligence to Revolutionize Chip Design\"<\/span><\/a>"}, {"title": "sensiBel’s 32 MEMS Microphone Array Development Kit Accelerates Edge AI Acoustic Detection", "source": "EE Journal", "date": "2026-10-01", "url": "https://www.eejournal.com/industry_news/sensibels-32-mems-microphone-array-development-kit-accelerates-edge-ai-acoustic-detection/", "summary": "sensiBel, the leader in optical MEMS sensing, today launched NOVA32™, a complete acoustic-detection hardware kit that speeds the design to deployment of high-precision physical AI sensor solutions used in beamforming applications, such as drone detection, industrial predictive maintenance, and environmental noise mapping. NOVA32 is a plug-and-play hardware kit that aggregates 32 high-performance optical MEMS microphones &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/sensibels-32-mems-microphone-array-development-kit-accelerates-edge-ai-acoustic-detection/\">Read More &#8594;<span class=\"screen-reader-text\"> \"sensiBel’s 32 MEMS Microphone Array Development Kit Accelerates Edge AI Acoustic Detection\"<\/span><\/a>"}, {"title": "Gigaphoton Develops Gas Recycling System for ArF Excimer Lasers", "source": "EE Journal", "date": "2026-10-01", "url": "https://www.eejournal.com/industry_news/gigaphoton-develops-gas-recycling-system-for-arf-excimer-lasers/", "summary": "Gigaphoton Inc. (Head Office: Oyama, Tochigi; President and CEO: Tatsuo Enami), a manufacturer of lightsources for semiconductor lithography, announced that it developed hTGM for ArF, the on-site neon gas recycling system for ArF excimer lasers. ArF lithography plays a critical role in the mass production of advanced semiconductors. Stable laser operation and the effective use &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/gigaphoton-develops-gas-recycling-system-for-arf-excimer-lasers/\">Read More &#8594;<span class=\"screen-reader-text\"> \"Gigaphoton Develops Gas Recycling System for ArF Excimer Lasers\"<\/span><\/a>"}, {"title": "Harnessing AI (and Humans)", "source": "EE Journal", "date": "2026-10-01", "url": "https://www.eejournal.com/article/harnessing-ai-and-humans/", "summary": "<img alt=\"\" class=\"webfeedsFeaturedVisual wp-post-image\" height=\"300\" src=\"https://www.eejournal.com/wp-content/uploads/2026/09/max-0523-image-for-home-page-innostax-300x300.jpg\" style=\"display: block; margin-bottom: 5px; clear: both;\" width=\"300\" />I don’t know about you, but I’m starting to feel like I need to run twice as fast just to keep up with everything that’s happening in AI space (where no one can hear you scream). No sooner do I wrap my brain around one concept than someone ambles into my life and introduces me &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/article/harnessing-ai-and-humans/\">Read More &#8594;<span class=\"screen-reader-text\"> \"Harnessing AI (and Humans)\"<\/span><\/a>"}, {"title": "OpenArm 2.0 – An open-source 7-DOF robot arm with QDD joints, bilateral force feedback, in-hand camera", "source": "CNX Software", "date": "2026-09-30", "url": "https://www.cnx-software.com/2026/09/30/openarm-2-0-an-open-source-7-dof-robot-arm-with-qdd-joints-bilateral-force-feedback-in-hand-camera/", "summary": "<div><img alt=\"OpenArm 2.0 arms installed inside the OpenArm Cell for standardized evaluation\" class=\"attachment-medium size-medium wp-post-image\" height=\"524\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/09/OpenArm-2.0-arms-installed-inside-the-OpenArm-Cell-for-standardized-evaluation-720x524.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Tokyo-based Enactic OpenArm 2.0 is an open-source hardware 7-DOF robot arm designed for physical AI research, teleoperation, and contact-rich data collection. It uses quasi-direct-drive (QDD) backdrivable joints to support compliant motion and bilateral force-feedback control. The arm supports 4.1 kg nominal and 6 kg peak payload, features 1 kHz CAN-FD control, and a compact parallel gripper with an in-hand camera and replaceable fingers. It supports bilateral force-feedback teleoperation, gravity compensation, and compliant interaction, with an aluminum and stainless-steel structure and MISUMI-frame base. The ecosystem also includes the OpenArm Cell for standardized evaluation and OpenArm KER, a motorless replica for teleoperation and data collection. Open-source CAD, BOM, firmware, control software, ROS 2, MuJoCo, Isaac Lab, and dataset tools support applications such as imitation learning, reinforcement learning, sim-to-real, and robotic manipulation. OpenArm 2.0 specifications: Communication CAN-FD (recommended): nominal 1 Mbps, data 5 Mbps, control loop 1 kHz Classic CAN 2.0 fallback @ [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/09/30/openarm-2-0-an-open-source-7-dof-robot-arm-with-qdd-joints-bilateral-force-feedback-in-hand-camera/\">OpenArm 2.0 &#8211; An open-source 7-DOF robot arm with QDD joints, bilateral force feedback, in-hand camera <\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "ESP32-C5 devkit features 3.5-inch touch LCD, optional camera and battery", "source": "CNX Software", "date": "2026-09-30", "url": "https://www.cnx-software.com/2026/09/30/esp32-c5-devkit-features-3-5-inch-touch-lcd-optional-camera-and-battery/", "summary": "<div><img alt=\"Waveshare ESP32-C5-Touch-LCD-3.5\" class=\"attachment-medium size-medium wp-post-image\" height=\"512\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/09/Waveshare-ESP32-C5-Touch-LCD-3.5-720x512.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Waveshare ESP32-C5-Touch-LCD-3.5 is another ESP32-C5 devkit with a built-in display, but equipped with a larger 3.5-inch color touch LCD and an optional BF3901 low-resolution (0.08 MP) camera and/or a 500 mAh battery. It also features a speaker connector and a built-in microphone for voice interaction, a 6-axis IMU  and a temperature and humidity sensor, a microSD card slot for additional storage, and a 32-pin GPIO connector for expansion. ESP32-C5-Touch-LCD-3.5 specifications: Wireless module – Espressif Systems ESP32-C5-WROOM-1U-N32R8 SoC – ESP32-C5HR8 CPU Single-core 32-bit RISC-V processor @ up to 240 MHz Low-power RISC-V core @ 40 MHz acting as the main processor for power-sensitive applications Memory – 384 KB SRAM on-chip, 8MB PSRAM Storage – 320 KB ROM Wireless Connectivity Dual-band (2.4GHz/5 GHz) 802.11ax WiFi 6, with 802.11b/g/n WiFi 4 standard fallback Bluetooth 5.0 Low Energy (LE) 802.15.4 radio for Zigbee 3.0 and Thread 1.3 Storage – 32MB flash Antenna – IPEX [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/09/30/esp32-c5-devkit-features-3-5-inch-touch-lcd-optional-camera-and-battery/\">ESP32-C5 devkit features 3.5-inch touch LCD, optional camera and battery<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Efinix Adds 64-Bit RISC-V SoC with Linux and DDR Support", "source": "Embedded.com", "date": "2026-09-30", "url": "https://www.embedded.com/efinix-adds-64-bit-risc-v-soc-with-linux-and-ddr-support/", "summary": "<p>Efinix Inc. has introduced the Sapphire RV64 SoC, a 64-bit RISC-V processor core designed to extend the company's embedded processing capabilities beyond its existing 32-bit Sapphire RV32 architecture. The new SoC targets FPGA-based applications that need greater processing performance, larger addressable memory, expanded I/O, and Linux support, while retaining the configurability and low-power characteristics of [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/efinix-adds-64-bit-risc-v-soc-with-linux-and-ddr-support/\">Efinix Adds 64-Bit RISC-V SoC with Linux and DDR Support<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "EU Cyber Resilience Act: Evidence Matters", "source": "Embedded.com", "date": "2026-09-30", "url": "https://www.embedded.com/eu-cyber-resilience-act-evidence-matters/", "summary": "<p>The device rebooted and the evidence disappeared. Now what?<\/p>\n<p>The post <a href=\"https://www.embedded.com/eu-cyber-resilience-act-evidence-matters/\">EU Cyber Resilience Act: Evidence Matters<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "Synopsys Powers Autonomous Engineering with a Broad Portfolio of Long-Horizon Agents and Autopilot Platform", "source": "EE Journal", "date": "2026-09-30", "url": "https://www.eejournal.com/industry_news/synopsys-powers-autonomous-engineering-with-a-broad-portfolio-of-long-horizon-agents-and-autopilot-platform/", "summary": "Synopsys, Inc. (Nasdaq: SNPS) today announced Synopsys AgentEngineer™ solutions, the industry&#8217;s broadest portfolio of domain-specific long-horizon agents that can reason, plan, and execute complete engineering workflows from silicon to systems across verification, system validation, implementation, analog, manufacturing, and simulation and analysis domains. Built on the Synopsys Autopilot™ Platform, a comprehensive, open, and secure foundation for autonomous engineering, &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/synopsys-powers-autonomous-engineering-with-a-broad-portfolio-of-long-horizon-agents-and-autopilot-platform/\">Read More &#8594;<span class=\"screen-reader-text\"> \"Synopsys Powers Autonomous Engineering with a Broad Portfolio of Long-Horizon Agents and Autopilot Platform\"<\/span><\/a>"}, {"title": "NXP FRDM-IMXRT1186 development board features i.MX RT1186 crossover MCU, four Ethernet ports", "source": "CNX Software", "date": "2026-09-29", "url": "https://www.cnx-software.com/2026/09/29/nxp-frdm-imxrt1186-development-board-features-i-mx-rt1186-crossover-mcu-four-ethernet-ports/", "summary": "<div><img alt=\"NXP FRDM-IMXRT1186\" class=\"attachment-medium size-medium wp-post-image\" height=\"514\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/09/NXP-FRDM-IMXRT1186-720x514.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>NXP has just launched the FRDM-IMXRT1186, a development board based on the i.MX RT1186 crossover MCU for industrial automation, robotics, PLCs, and edge computing applications. The MCU uses a heterogeneous architecture with an 800 MHz Arm Cortex-M7 core for application processing and a 300 MHz Arm Cortex-M33 core for real-time control and communications. The board includes 64 Mbit HyperRAM, 512 Mbit HyperFlash, and 128 Mbit QSPI Flash, along with two Gigabit Ethernet ports for TSN switching and two Fast Ethernet ports for EtherCAT or TSN switching. It also features a USB Type-C OTG port and a CAN transceiver, while debugging is supported through an on-board MCU-Link debugger and JTAG connector. For expansion, the board includes Arduino UNO R3 and FRDM headers, a FlexSPI follower header, an SRAMC header, and motor-control headers. NXP FRDM-IMXRT1186 development board specifications: SoC – NXP MIMXRT1186CVJ8C (i.MX RT1180 family, LFBGA196) CPU Arm Cortex-M7 application core @ [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/09/29/nxp-frdm-imxrt1186-development-board-features-i-mx-rt1186-crossover-mcu-four-ethernet-ports/\">NXP FRDM-IMXRT1186 development board features i.MX RT1186 crossover MCU, four Ethernet ports<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Walnut Pi CM2 – A cheaper Raspberry Pi CM5 alternative based on Allwinner T527 octa-core SoC", "source": "CNX Software", "date": "2026-09-29", "url": "https://www.cnx-software.com/2026/09/29/walnut-pi-cm2-a-cheaper-raspberry-pi-cm5-alternative-based-on-allwinner-t527-octa-core-soc/", "summary": "<div><img alt=\"Walnut Pi CM2\" class=\"attachment-medium size-medium wp-post-image\" height=\"467\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/09/Walnut-Pi-CM2-720x467.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Walnut Pi CM2 is a low-cost Raspberry Pi CM5-compatible Compute Module powered by an Allwinner T527 octa-core Cortex-A55 processor paired with up to 4GB LPDDR4 RAM, 16GB eMMC flash, and an optional wireless module. It&#8217;s basically the company&#8217;s Walnut Pi 2B credit card-sized SBC in Pi Compute Module form factor, exposing I/Os via two 100-pin high-density connectors. Besides the price, benefits include a WiFi 6 and Bluetooth 5.0 module, a Gigabit Ethernet PHY on the module, and a built-in 2 TOPS NPU in the T527 SoC. Downsides are that the Allwinner T527 is not quite as powerful as the Broadcom BCM2712 (4x Cortex-A76 cores) found in the CM5, and as with other such &#8220;Raspberry Pi CM5-compatible&#8221; modules, it&#8217;s only partially electrically compatible. Walnut Pi CM2 specifications: SoC – Allwinner T527 CPU Octa-core Arm Cortex-A55 processor with four cores @ 1.80 GHz and four cores @ 1.42GHz E906 RISC-V core up [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/09/29/walnut-pi-cm2-a-cheaper-raspberry-pi-cm5-alternative-based-on-allwinner-t527-octa-core-soc/\">Walnut Pi CM2 &#8211; A cheaper Raspberry Pi CM5 alternative based on Allwinner T527 octa-core SoC<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "MathWorks Releases MATLAB and Simulink R2026b", "source": "Embedded.com", "date": "2026-09-29", "url": "https://www.embedded.com/mathworks-releases-matlab-and-simulink-r2026b/", "summary": "<p>MathWorks has released MATLAB and Simulink Release 2026b (R2026b), introducing new products and enhancements for engineering teams developing increasingly complex systems that combine software, electronics, and artificial intelligence. The release expands capabilities for system configuration, simulation, verification, visual inspection, perception, embedded software, aerospace, and data analysis, aiming to streamline workflows from design and modeling through [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/mathworks-releases-matlab-and-simulink-r2026b/\">MathWorks Releases MATLAB and Simulink R2026b<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "EU Cyber Resilience Act: Secure-By-Design vs. Bolt-On Security", "source": "Embedded.com", "date": "2026-09-29", "url": "https://www.embedded.com/eu-cyber-resilience-act-secure-by-design-vs-bolt-on-security/", "summary": "<p>Making the right security choices for the EU Cyber Resilience Act and why this matters now.<\/p>\n<p>The post <a href=\"https://www.embedded.com/eu-cyber-resilience-act-secure-by-design-vs-bolt-on-security/\">EU Cyber Resilience Act: Secure-By-Design vs. Bolt-On Security<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "Critical Link MitySOM-AM62x/A/P – TI Sitara AM62 SO-DIMM SoMs for edge AI and industrial automation", "source": "CNX Software", "date": "2026-09-28", "url": "https://www.cnx-software.com/2026/09/28/critical-link-mitysom-am62x-a-p-ti-sitara-am62-so-dimm-soms-for-edge-ai-and-industrial-automation/", "summary": "<div><img alt=\"MitySOM AMxx Dev Kit\" class=\"attachment-medium size-medium wp-post-image\" height=\"480\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/09/MitySOM-AMxx-Dev-Kit-720x480.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Critical Link MitySOM-AM62x/A/P is a family of TI Sitara AM62-based industrial SO-DIMM SoMs designed for embedded Linux systems, industrial automation, HMI, and other embedded applications. The family includes the general-purpose MitySOM-AM62, AI-focused MitySOM-AM62A, and multimedia-oriented MitySOM-AM62P system-on-modules. The standard AM62 modules feature up to a quad-core Arm Cortex-A53 processor at 1.4 GHz, along with a 400 MHz Cortex-M4F MCU and dual programmable real-time units (PRUs). The AM62A adds a C7x DSP with Matrix Multiply Accelerator supporting up to 2 TOPS and an image signal processor (ISP), while the AM62P includes a 3D GPU rated above 50 GFLOPS and a four-lane MIPI DSI output. MitySOM-AM62x / AM62Ax / AM62Px specifications: SoM options MitySOM-AM62x – Texas Instruments Sitara AM62x Application CPU – Up to Quad-core Arm Cortex-A53 up to 1.4 GHz Real-time cores Arm Cortex-M4F up to 400 MHz Dual-core Programmable Real-Time Unit (PRU-SS) up to 333 MHz GPU – 3D Graphics [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/09/28/critical-link-mitysom-am62x-a-p-ti-sitara-am62-so-dimm-soms-for-edge-ai-and-industrial-automation/\">Critical Link MitySOM-AM62x/A/P &#8211; TI Sitara AM62 SO-DIMM SoMs for edge AI and industrial automation<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Up2Stream spins off from Arylic as a dedicated DIY audio brand (Sponsored)", "source": "CNX Software", "date": "2026-09-28", "url": "https://www.cnx-software.com/2026/09/28/up2stream-spins-off-from-arylic-as-a-dedicated-diy-audio-brand/", "summary": "<div><img alt=\"Up2stream DIY audio website\" class=\"attachment-medium size-medium wp-post-image\" height=\"555\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/09/Up2stream-DIY-audio-website-720x555.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Up2Stream started as Arylic’s DIY audio board line and has now been spun off as its own brand. The split is not a rebadge or a clone of Arylic’s finished consumer streamers and amplifiers. It is a deliberate move to put the maker community first: boards, accessories, documentation, and support aimed at people who build speakers, restore vintage gear, or design custom multiroom systems. Many long-time users still treat “Up2Stream” and “Arylic” as the same storefront. Others assume the boards are a copy of Arylic’s boxed products. They are related in history, but they serve different jobs. Arylic’s consumer line is complete hardware you plug in. Up2Stream is the modular stack you drop into a cabinet, a plate amp, a passive pair, or a 2.1 build and wire yourself. Same streaming DNA, different product mission. The lineup is built around a few core modules and a set of add-ons that [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/09/28/up2stream-spins-off-from-arylic-as-a-dedicated-diy-audio-brand/\">Up2Stream spins off from Arylic as a dedicated DIY audio brand (Sponsored)<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "EU Cyber Resilience Act Shifts Secure-by-Design for Embedded Developers", "source": "Embedded.com", "date": "2026-09-28", "url": "https://www.embedded.com/eu-cyber-resilience-act-shifts-secure-by-design-for-embedded-developers/", "summary": "<p>The EU CRA is changing what secure-by-design means for embedded developers.<\/p>\n<p>The post <a href=\"https://www.embedded.com/eu-cyber-resilience-act-shifts-secure-by-design-for-embedded-developers/\">EU Cyber Resilience Act Shifts Secure-by-Design for Embedded Developers<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "Leopard Imaging, Lumotive Launch 3D Perception Platform for Edge AI and Robotics", "source": "Embedded.com", "date": "2026-09-28", "url": "https://www.embedded.com/leopard-imaging-lumotive-launch-3d-perception-platform-for-edge-ai-and-robotics/", "summary": "<p>Leopard Imaging and Lumotive have introduced Sirius Max, a long-range, software-defined 3D perception platform designed for robotics, industrial automation, autonomous machines, automotive systems, and edge AI applications. The LI-AR0234-AF0130-TX10-GMSL2-140H combines RGB imaging, intelligent indirect time-of-flight (iToF) depth sensing, embedded processing, synchronization, and programmable beam-steered illumination in a compact GMSL2 camera module. Sirius Max uses Lumotive's [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/leopard-imaging-lumotive-launch-3d-perception-platform-for-edge-ai-and-robotics/\">Leopard Imaging, Lumotive Launch 3D Perception Platform for Edge AI and Robotics<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}], "papers": [{"title": "ROWBench: Do Video Models Render What the Program Specifies?", "authors": ["Zheng-Hui Huang", "Guixu Lin", "Yu-Ju Tsai", "Jian-Kai Zhu", "Fengbo Lan", "Yu-Lun Liu", "Yung-Yu Chuang", "Kaipeng Zhang", "Zhixiang Wang"], "published": "2026-10-01", "summary": "Programmable world models separate executable dynamics from visual generation, offering a promising foundation for next-generation game engines. However, their visual adherence to explicit rules and interactions remains insufficiently evaluated. Existing benchmarks assess visual quality, controllability, and instruction or physical adherence, but rarely test fidelity to fine-grained, program-specified world events. We introduce PROWBench, comprising 170 programmatically constructed episodes and 600 proxy videos covering diverse scenes and interactions. PROWBench logs entity states and timestamped events, including those outside the camera's field of view, as replayable world records, from which it renders synchronized views and proxy representations. This enables generated videos to be checked against the observable consequences of program execution. An extensible framework constructs scenes, controls behaviors, and can render each camera view in different representations, such as coarse 3D, and bounding boxes. The benchmark covers first- and third-person perspectives, with synchronized multi-view observations available for a subset of episodes. Grounded in these records, PROWBench evaluates entity control, long-horizon memory, and, with two VLM-based metrics, Logic-Render Alignment and Interaction Success Rate, adherence to the prescribed timeline and the visual realization of timestamped engine-recorded events.", "pdf_url": "https://arxiv.org/pdf/2610.02205v1"}, {"title": "Reconstruct, Practice, Go Real: Guided Self-Improvement for Embodied Agents", "authors": ["Yen-Jen Wang", "Haozhe Jiang", "Shuying Deng", "Haoru Xue", "Weirui Ye", "Rocky Duan", "Nika Haghtalab", "S. Shankar Sastry", "Pieter Abbeel", "Haozhi Qi"], "published": "2026-10-01", "summary": "Building reliable robot capabilities across diverse tasks requires substantial human effort to develop and maintain skills, design rewards, and integrate perception with control. We present Reconstruct, Practice, Go Real (RPG), a framework for autonomous improvement of robot execution systems without updating model weights. RPG identifies manipulation capabilities in an offline dataset and constructs related practice tasks in simulation. During practice, RPG uses execution feedback, privileged simulator state, and available dataset videos to diagnose failures. It develops new reusable symbolic skills, refines existing skills, and revises the system prompt based on these diagnoses. Cross-task evaluation tests individual candidate changes and merged revisions before they are retained for reuse. At test time, a multimodal LLM uses the resulting system prompt and skill library to coordinate perception and robot control. On held-out initializations of 22 manipulation tasks, RPG improves task success from 28.6% after the first practice round to 95.0% after 15 rounds, outperforming all evaluated baselines, including ASPIRE (75.5%) and CaP-Agent0 powered by GPT-6 Astra Pro (60.0%). After a common calibration and hardware-adaptation procedure, the frozen system succeeds in all 30 physical trials, with ten trials on each of three tasks. Project Website: https://rpg-robot.github.io/", "pdf_url": "https://arxiv.org/pdf/2610.02204v1"}, {"title": "FERPO: Forward Entropy-Regularized Policy Optimization", "authors": ["Sebastian Sanokowski", "Alireza Sarmadi", "Majid Khadiv"], "published": "2026-10-01", "summary": "Several state-of-the-art methods for online reinforcement learning in continuous control improve policies using action gradients of a learned critic. However, critics are typically trained to predict returns, and accurate value predictions do not necessarily yield accurate action derivatives, potentially leading to unreliable policy updates. We propose Forward Entropy-Regularized Policy Optimization (FERPO), an on-policy maximum entropy reinforcement learning algorithm that performs policy improvement using critic values without differentiating the critic with respect to actions. FERPO derives an optimal target action distribution from a policy-improvement objective regularized by entropy and Kullback-Leibler (KL) divergence. We then fit the actor to this target by minimizing a forward-KL objective, estimated using self-normalized importance sampling (SNIS) with actions drawn from the rollout policy. By limiting the target distribution's deviation from the rollout policy, the KL regularization helps keep these importance weights well behaved. In contrast to reverse-KL objectives, which can favor a subset of the target distribution's modes, the forward-KL objective encourages coverage of multiple high-value modes and thereby promotes exploration. Experiments and ablations on MuJoCo Playground and ManiSkill show competitive performance and sample-efficiency gains. Computational benchmarks also demonstrate faster actor updates than Relative Entropy Pathwise Policy Optimization (REPPO).", "pdf_url": "https://arxiv.org/pdf/2610.02198v1"}, {"title": "InterEvolve: Test-Time Evolution of Reward Programs for Humanoid Loco-Manipulation", "authors": ["Zhuo Lin", "Sirui Xu", "Liuyu Bian", "Yu-Xiong Wang", "Liang-Yan Gui"], "published": "2026-10-01", "summary": "We study test-time evolution for humanoid loco-manipulation: solving tasks that a controller was never trained for by repurposing its existing skills, improving from its own attempts, and retaining what it learns, without retraining. Our key insight is that a broad controller already holds much of the competence a new task needs, and that this competence becomes accessible through an interface between planning and control that is expressive enough to specify contact-rich, multi-stage interactions, yet executable and measurable enough that execution feedback can guide planning from experience. InterEvolve realizes this interface with two components. First, we develop an object-aware forward-backward (FB) behavioral foundation model, whose object residuals on a frozen body prior turn a new reward about the body or objects into loco-manipulation behavior at test time. Second, we specify tasks as reward programs: staged rewards with completion conditions and tunable constants. A large language model (LLM) agent revises the program structure in context, drawing on execution feedback and a skill library of verified programs, while a numerical optimizer tunes its constants. With every candidate verified across parallel simulation scenarios, the program explores new ways to induce, repurpose, and compose the controller's existing motor competence for the task at hand, and thus improves over iterations. Experiments show that human-designed rewards leave much of the FB model's loco-manipulation competence untapped, whereas the programs InterEvolve evolves release it, sometimes through novel strategies. It further produces behaviors for diverse tasks, complex scenes, and long-horizon compositions in simulation, and evolved skills run autonomously on a physical Unitree G1 from egocentric onboard perception.", "pdf_url": "https://arxiv.org/pdf/2610.02196v1"}, {"title": "Higher-Order Molecular Grammars for Generative and Foundation Models in Chemistry", "authors": ["Yiming Huang", "Yujie Zeng", "Vijay Prakash Dwivedi", "Simone Foti", "Jianmin Wang", "Jure Leskovec", "Tolga Birdal"], "published": "2026-10-01", "summary": "Molecular learning models are strongly shaped by their underlying representations. Yet standard sequential and graph formalisms struggle to explicitly encode higher-order topology, such as ring systems and recurring motifs. Existing higher-order representations can capture these structures directly, but they are often computationally demanding and difficult to decode into valid molecules. Here, we introduce Higher-order Grammar Representation (HGR), a principled, topology-aware framework that lifts molecules to combinatorial complexes and parses each complex into a compact sequence of production rules under a context-free higher-order grammar. By serialising higher-order topology into rule sequences, HGR makes these structures directly compatible with standard sequence models, avoiding the computational overhead of explicit higher-order encodings while preserving topological expressiveness. To reduce benchmark bias towards simple ring systems, we construct RingDiv, a ring-enriched benchmark containing 1.18 million molecules, including the curated RingDiv300k subset, and introduce the ring diversity index (RDI) to quantify ring-system coverage. In molecular generation, HGR-based models uniquely combine 100% validity by construction with leading distributional alignment, ranking first in FCD on all five generation benchmarks. In representation learning, HGR-FM achieves the highest mean AUC across seven MoleculeNet benchmarks under both transfer protocols, improving on the strongest baseline by 8.3 and 3.3 AUC points under probing and full fine-tuning, respectively. Collectively, these results establish HGR as an efficient higher-order representation for molecular generation and transferable representation learning.", "pdf_url": "https://arxiv.org/pdf/2610.02186v1"}, {"title": "Watch, Infer, Coordinate: Inferring Robot Partner Constraints for Zero-Shot Coordination", "authors": ["Suyu Ye", "Zheyuan Zhang", "Vaishnav Tadiparthi", "Hossein Nourkhiz Mahjoub", "Ehsan Moradi Pari", "Tianmin Shu", "Homanga Bharadhwaj", "Nakul Agarwal"], "published": "2026-10-01", "summary": "Robots operating in the physical world will increasingly need to coordinate with other robots, particularly in manipulation tasks where an object may be too large or heavy for a single robot to carry alone. Physical limitations caused by hardware degradation or actuator faults can restrict the actions a robot can reliably execute, yet these limitations may be unknown to its partner. We study whether a helper can infer a robot partner's physical constraints from observing it coordinate with another robot, then use the inferred capability to coordinate with the same partner on a new task. This is difficult because a demonstration shows what the constrained robot did, but not what it could have done. In physically coupled tasks, the other robot may also compensate for its limitations, making those limitations difficult to identify from the constrained robot's behavior alone. Our key insight is that these constraints shape the joint behavior of the team, making the actions of both robots informative about the constrained partner's capability. We introduce Watch, Infer, Coordinate, a benchmark spanning three physically coupled manipulation settings, together with an inference approach that scores candidate constraints using observed joint behavior. Across all three settings, our method substantially improves constraint inference and zero-shot coordination, approaching an oracle with access to the true constraints.", "pdf_url": "https://arxiv.org/pdf/2610.02170v1"}, {"title": "World Observer: Joint Actor-Observer Generation for Persistent World Modeling", "authors": ["Hyunwook Choi", "Dahyun Chung", "Hyunsung Kim", "Siyoon Jin", "Jinhyeok Choi", "Junyoung Seo", "Seungryong Kim"], "published": "2026-10-01", "summary": "How can a world model continuously observe regions beyond the actor's current view? Video world models simulate how an environment evolves from an agent's actions, yet remain actor-centric. Once an object leaves the actor's view, they lose direct evidence of its evolution, often failing to preserve its state and dynamics upon re-entry. To address this, we introduce World Observer, which decouples observing from acting by jointly generating a perspective actor for the agent-centric view with one or more panoramic observers that watch selected world regions. This allows objects that leave the actor's view to remain visually evolving in an observer, so their updated states are reflected when they re-enter. We ground the actor and observers by warping from a shared panoramic source for explicit geometric correspondence, and introduce an Observer Sink of high-resolution perspective references to restore fine appearance upon re-entry. Since the observers are decoupled from the actor, they can be placed freely across the scene, extended to multiple locations for broader coverage, and driven by control signals to steer out-of-view evolution. To evaluate out-of-view evolution, we further introduce world-space metrics and a benchmark spanning real and synthetic scenes. World Observer substantially improves out-of-view dynamics while remaining competitive in visual fidelity, camera control, and 3D adherence.", "pdf_url": "https://arxiv.org/pdf/2610.02162v1"}, {"title": "DuoMind: Enabling Distributed Multi-Robot Coordination with Semantic Communication", "authors": ["Hanchu Zhou", "Dechen Gao", "Hang Wang", "Brendan Lynch", "Boqi Zhao", "Qiyao Ma", "Raman Goyal", "Junshan Zhang"], "published": "2026-10-01", "summary": "Vision-language models (VLMs) and vision-language-action models (VLAs) have recently driven rapid progress in general-purpose robots, yet most progress has focused on single-robot settings. Extending these capabilities to multi-robot systems remains challenging because robots must coordinate long-horizon behaviors while maintaining reliable, fine-grained execution. We introduce DuoMind, a distributed hierarchical framework for multi-robot coordination through semantic communication. Each robot uses a VLA-based action model for low-level execution and a VLM-based orchestrator for high-level reasoning and inter-agent coordination. At each planning step, the orchestrator at each robot reasons over the task instruction, local observations, and messages received from other robots. It then generates low-level instructions for the action model and semantic messages for peer robots. This architecture exploits the complementary strengths of pretrained models by combining the semantic reasoning capabilities of VLMs with the precise action-generation capabilities of VLAs. To address the scarcity of benchmarks for multi-robot coordination, we further develop RoboPoly, a benchmark comprising long-horizon manipulation tasks that require coordinated, closed-loop execution under distributed control. Experiments on RoboPoly and RoboTwin demonstrate that DuoMind improves multi-robot task performance, while ablation studies confirm the contributions of hierarchical orchestration and semantic communication. More details are available on our project page.", "pdf_url": "https://arxiv.org/pdf/2610.02161v1"}, {"title": "4Director: Controlling Video World Models with Rigid 3D Geometry", "authors": ["Wei Cao", "Hao Zhang", "Vikram Voleti", "Yuqun Wu", "Mallikarjun B R", "Shimon Vainer", "Mark Boss", "Yaoyao Liu"], "published": "2026-10-01", "summary": "Precise control over camera and object motion is essential for professional video production. Existing methods control objects only coarsely, through image-plane cues that are ambiguous in depth and rotation or through 3D tracks and blobs that lack complete geometry and lose consistency across viewpoint changes. We introduce 4Director, a video world model conditioned on an explicit 4D scene representation: each object is reconstructed once from the input image as a canonical mesh and moved by one prescribed rigid transformation per frame. This representation provides an intuitive 3D control interface and prevents unobserved geometry from being regenerated independently in every frame. We render the controlled scene as a depth video and introduce a Motion Adapter that transforms this geometric scaffold into video while synthesizing view-consistent appearance, illumination, and non-rigid dynamics. For training, we construct RealCOD-Rigid, a new dataset of 20,774 clips annotated with rigid 3D scenes by our automatic pipeline. We further introduce Identity-Gated IoU (IG-IoU), which jointly evaluates adherence to prescribed object motion and preservation of object identity. Experiments demonstrate that 4Director consistently outperforms prior methods in visual quality and in camera and object control.", "pdf_url": "https://arxiv.org/pdf/2610.02160v1"}, {"title": "SkeleWAM: Skeleton World-Action Modeling for Efficient Robotic Manipulation", "authors": ["Juyi Sheng", "Hua Wang", "Mengyuan Liu"], "published": "2026-10-01", "summary": "World action models (WAMs) combine robot action generation with future state prediction. Existing WAMs typically predict videos or learned visual latents, which represent interaction geometry only implicitly and may retain appearance information unrelated to control. We introduce SkeleWAM, a compact WAM that represents a manipulation scene as a sparse 3D skeleton composed of robot joints, object centers, and interaction points. Constructed online from current RGB-D observations and robot proprioception, the skeleton provides a unified geometric state for action generation and future skeleton prediction. Future skeleton prediction provides additional geometric supervision for action learning without requiring visual reconstruction. At inference, SkeleWAM generates actions directly from the current skeleton and language instruction, while Medoid Action Consensus (MAC) serves as an auxiliary consensus strategy for stochastic action samples. On LIBERO-Plus, SkeleWAM achieves an overall success rate of 85.9% with 57.1M parameters, outperforming Cosmos-Policy by 3.7 percentage points. These results demonstrate that sparse 3D robot--object structure provides an effective state space for robust and parameter-efficient world action learning. The project is available at https://skelewam-project.github.io/.", "pdf_url": "https://arxiv.org/pdf/2610.02120v1"}, {"title": "GlassGuard: Verified Glass Plane Mapping for Robot Navigation", "authors": ["Hanwen Guo", "Zhengzhi Lin", "Yusen Xie", "Ji Zhang"], "published": "2026-10-01", "summary": "Transparent and specular surfaces pose a serious challenge to LiDAR-based SLAM and navigation because laser returns may pass through glass, leaving collision boundaries absent from the map. Prior work attempts to reconstruct the missing surfaces, but inaccurate obstacle placement can create the opposite failure: contamination of traversable free space. Recognizing this dual requirement, we present GlassGuard, a navigation-oriented framework for reconstructing planar architectural glass from complementary visual and LiDAR evidence. We formulate success in terms of both glass coverage and free-space contamination and apply this principle throughout proposal verification and global map construction. A foundation vision model provides glass-instance masks, structural 3D cues generate metric plane hypotheses, and depth-free 2D projective geometry checks their orientations before they enter a consolidated global map. We evaluate GlassGuard in nine building-scale scenes spanning diverse glass structures, spatial scales, and lighting conditions, with more than one hour and 2.1 km of real-world robot traversal. GlassGuard achieves 85% of total glass coverage for its panoramic version. Under identical pinhole inputs, GlassGuard achieves 82% total coverage, compared with at most 61% for the evaluated baselines, while producing 5-17x fewer false voxels per frame. Qualitative examples with a navigation planner illustrate the reconstructed planes blocking paths through glass while leaving traversable routes open. The project page is available at https://glassguardproject.github.io/.", "pdf_url": "https://arxiv.org/pdf/2610.02110v1"}, {"title": "HumanoidToolBench: Benchmarking Humanoid Tool Use from Selection to Mobile Execution", "authors": ["Kyochul Jang", "Seohyeon Park", "Ohchul Kwon", "Sangjun Park", "Junhyeok Choi", "Seungyeop Yi", "Chaeyun Kim", "Sangkyu Lee", "Idan Szpektor", "Avi Caciularu", "Jongmin Park", "Youngjae Yu"], "published": "2026-10-01", "summary": "As robotic hardware and learning methods advance, humanoids need tools to perform tasks beyond their inherent physical limits. Successful tool use requires selecting a suitable tool and coordinating manipulation and, when needed, locomotion to complete the task. Existing benchmarks do not jointly evaluate these capabilities on a humanoid. We introduce HumanoidToolBench, an 18-task benchmark spanning three scenarios, three execution levels, and two tool-set modes, together with ToolBook, a dataset of 3.1k demonstrations collected in simulation and on a real Unitree G1. Evaluation of seven policies in simulation and three on the real robot reveals substantial gaps between selecting a suitable tool and completing the task. Focused GR00T N1.7 probes show reduced selection accuracy on unseen tools and continued task execution under unrelated instructions. Code and data are available at https://snu-pi.github.io/HumanoidToolBench/.", "pdf_url": "https://arxiv.org/pdf/2610.02089v1"}, {"title": "Foundations without Fundamentals: Zero-Shot Blind Spots in Time Series FMs", "authors": ["Nafiseh Ghoroghchian", "Haipeng Zhang", "Shuyi Han", "Alex Labach", "George Stein"], "published": "2026-10-01", "summary": "Despite the success of Time Series Foundation Models (TSFMs) on broad benchmarks, their ability to internalize basic temporal logic, especially in settings supported by exogenous covariates, remains under-examined. We introduce SimpleTimeBench, a diagnostic univariate and multivariate \"unit test\" suite for primitives such as monotonic trends, periodic signals and leading indicator covariates, scenarios where near-perfect forecasts should be trivial. Surprisingly, prominent multivariate TSFMs (Chronos-2, Moirai and Toto) frequently produce suboptimal zero-shot forecasts for these inputs. While fine-tuning Chronos-2 improves its behaviour on specific tasks, we show that this adaptation degrades performance on other fundamental patterns rather than enhancing its generalizable foundational capabilities. This reveals a gap between pre-training scale and basic temporal reasoning, suggesting that current TSFMs could potentially lack the inductive biases needed to capture simple predictable functions. We further demonstrate that these failures are not merely synthetic curiosities: they persist in real-world sensor forecasting, where TSFMs consistently underutilize leading indicators available in observed covariates. This inability to capture simple relationships limits the practical utility and reliability of current multivariate models.", "pdf_url": "https://arxiv.org/pdf/2610.02058v1"}, {"title": "UniWAM: Unified World-Action Model", "authors": ["Jiayi Chen", "Wenxuan Song", "Jingbo Wang", "Shuai Zhou", "Xicheng Gong", "Zehua Fan", "Ziyang Zhou", "Junwu E", "Haodong Yan", "Fuhao Li", "Qize Yu", "Xu Huang", "Pengwei Wang", "Wen Chen", "Shunbo Zhou", "Haoang Li"], "published": "2026-10-01", "summary": "Vision-language-action models benefit from the understanding and reasoning capabilities of pretrained vision-language models, but action-only supervision provides limited grounding in world dynamics. Conversely, world-action models inherit spatiotemporal priors from video generation models, yet remain limited in semantic understanding and reasoning under distribution shifts. We introduce UniWAM, a unified architecture that integrates a physical reasoner, a world generator, and an action predictor to jointly learn semantic understanding of the physical world, visual generation, and action prediction. To ensure the quality of the training data, we developed a rigorous data cleaning and annotation pipeline for both human egocentric data and robot data. To adapt the vision-language component to embodied tasks while preserving its inherited language capabilities, we represent low-level actions in natural language and introduce a pre-training recipe that assigns complementary supervision from visual question answering (VQA) data, human egocentric data, and robot demonstrations to the appropriate model components. During post-training, future visual noise augmentation reduces reliance on precise future predictions, while history-conditioned flow matching uses encoded action history to initialize action generation. Together, these designs significantly reduce denoising steps while maintaining performance. UniWAM achieves state-of-the-art (SOTA) performance across multiple evaluations, including in-distribution performance, robustness, generalization, instruction following, and long-horizon task execution. Furthermore, we uncover a log-linear scaling law of unified human-robot co-training, demonstrating the effectiveness of large-scale pre-training on a mixture of human and robot data.", "pdf_url": "https://arxiv.org/pdf/2610.02054v1"}, {"title": "Prune First, Decide Fast: Scalable Semantic Query Processing with JEVDB", "authors": ["Zhengle Wang", "Hanxu Yan", "Fuheng Zhao", "Chunwei Liu"], "published": "2026-10-01", "summary": "Semantic database systems extend SQL with foundation-model inference over unstructured data, but current engines rely heavily on autoregressive LLMs for discrete relational decisions, creating high latency and monetary cost. We present JEVDB, a scalable semantic database system that uses fast, typed decision models for semantic filters, joins, classification, and ranking, while selectively escalating uncertain cases to generative LLMs. To reduce semantic-join work, JEVDB combines exact Yannakakis-style semijoin reduction over relational structure with Semantic Bloom Filters (SBFs), which use registered necessary conditions to screen candidates across latent semantic edges. We evaluate JEVDB on SemBench and Shelob, a TPC-DS-derived semantic-join workload. On SemBench, JEVDB-Flash achieves the lowest latency on all 21 evaluated queries and the lowest cost on 19, while maintaining competitive answer quality. On Shelob, where joins scale to 540K candidate pairs, JEVDB completes all queries with 95.7%-97.5% mean F1. SBF screening removes 87.4% of candidate pairs before semantic evaluation, and reusable condition-index scoring further reduces reasoning-model escalations by 55.2%. An interactive query simulator, source code, and benchmarks are available at https://jevdb.org.", "pdf_url": "https://arxiv.org/pdf/2610.02046v1"}, {"title": "Spurious sources in high-resolution VLA surveys", "authors": ["Eric F. Jiménez-Andrade", "Emmanuel Momjian", "Eric J. Murphy", "James J. Condon", "Miguel Vega"], "published": "2026-10-01", "summary": "Blind extragalactic radio continuum surveys are increasingly conducted at sub-arcsecond angular resolutions. However, these surveys contain substantially more spurious sources than expected from purely Gaussian noise statistics. We investigate the origin of these false detections using the 10GHz GOODS-N mosaic obtained with the Karl G. Jansky Very Large Array (VLA), which reaches a native angular resolution of 0.22arcsec and exhibits a nearly Gaussian pixel-noise distribution. We show that part of the increase in the spurious-source fraction at high angular resolution arises naturally from the larger number of independent resolution elements, while residual wide-field imaging effects associated with the primary-beam response make only a modest contribution. Nevertheless, even after accounting for these effects, the observed fraction of false detections remains several times higher than predicted for Gaussian noise. An analysis of the noise autocorrelation function reveals that images with relatively sparse uv coverage retain significant dirty-beam sidelobes that introduce correlated noise fluctuations, substantially increasing the probability of false detections. We conclude that the excess of spurious sources is an intrinsic consequence of incomplete uv sampling rather than the imaging methodology itself, highlighting that future deep radio continuum surveys require not only high angular resolution but also sufficiently dense uv coverage to minimize spurious detections.", "pdf_url": "https://arxiv.org/pdf/2610.02028v1"}, {"title": "Bellman Meets Lyapunov: Unsupervised Reinforcement Learning via Mastering Chaos", "authors": ["Tristan Shah", "Wooyoung Chung", "Volodomyr Makarenko", "Juan Wachs", "Stas Tiomkin"], "published": "2026-10-01", "summary": "Reinforcement learning (RL) is a powerful paradigm for training agents, yet its success rests on domain expertise of human engineers who design informative reward signals for every new task. Unsupervised RL aims to reduce this engineering with intrinsic motivation (IM): reward signals that emerge from the agent environment interaction itself. Existing IM objectives, however, involve the selection of information variables, which re-introduces domain expertise the field has sought to eliminate. We introduce Forward CIP (F-CIP), an RL-native formulation of the Controllable Information Production (CIP) objective, which is defined by the system's dynamics alone and requires no such selection. We prove that F-CIP is compatible with RL and demonstrate its effectiveness with existing algorithms. Training agents with F-CIP results in unsupervised discovery of primitive behaviors such as balancing and maintaining controllability, which are essential for more complex robot behaviors. Paired with a simple forward-velocity reward, our method produces coordinated gaits such as hopping and running which otherwise require reward engineering to learn.", "pdf_url": "https://arxiv.org/pdf/2610.02012v1"}, {"title": "H-SPAR: Hydrodynamic-aware Simulation for Particle Transport and Autonomous Robots", "authors": ["Navid Zarrabi", "Nariman Yousefi", "Sajad Saeedi"], "published": "2026-10-01", "summary": "Environmental robotic sampling requires considering the dual influence of water currents on robotic motion and particle transport. Existing marine robotics simulators generally model flow, autonomy, and sampling targets separately, limiting joint evaluation of mission cost and sampling performance. H-SPAR integrates spatially and temporally varying velocity fields, Lagrangian particle transport, probabilistic sampling, and ROS 2/Gazebo-based uncrewed surface vehicle (USV) autonomy. In this work, shared precomputed flow fields drive particle advection and current-induced forces during closed-loop vehicle execution. Path-planning experiments show that the existing current-aware planner SVF-RRT* achieves 69.4% lower upstream cost than conventional RRT* at the planning level, but this reduction falls to 41.7% during execution under time-varying currents, reflecting temporal flow variation, vehicle motion constraints, and path deviation omitted during planning. Coverage experiments show that sweep orientation changes the particle-sampling rate by up to 22.2% under the complete H-SPAR configuration. These findings highlight the importance of evaluating planning, vehicle execution, particle transport, and sampling together under consistent hydrodynamic conditions. The project webpage is available at https://sites.google.com/view/h-spar, and the open-source code is available on GitHub at https://github.com/naviiidz/h-spar-sim.", "pdf_url": "https://arxiv.org/pdf/2610.01985v1"}, {"title": "BLT*: Informed Belief Localization Trees for Uncertainty-Aware Planning on Digital Twins", "authors": ["Elliot Preston-Krebs", "Abhishek Goudar", "Timothy D. Barfoot"], "published": "2026-10-01", "summary": "We present Informed Belief Localization Trees* (Informed BLT*), a sampling-based belief space planning (BSP) algorithm that scales to large outdoor digital twins with point-cloud observations. We adapt RRT* and Informed RRT* to belief space using the $2$-Wasserstein ($W_2$) metric. Assuming isotropic Gaussian beliefs, sampled belief states can be connected efficiently while accounting for available information and probabilistic collision constraints. This enables steering and rewiring without repeatedly propagating observations, and allows previously computed measurement information to be reused. We present a framework to generate semantically labelled digital twins for planning in real-world environments with point-cloud-based localization. Experiments in simulated environments and digital twins show faster initial solution discovery in most maps with competitive cost convergence.", "pdf_url": "https://arxiv.org/pdf/2610.01972v1"}, {"title": "Training-Free Diffusion Planning with Analytical Local Scores", "authors": ["Michael Y. Fatemi", "Jinhao Liang", "Ferdinando Fioretto"], "published": "2026-10-01", "summary": "Path finding and multi-robot motion planning require trajectories that are smooth, goal-directed, and collision-free in environments with complex geometric constraints. Recent diffusion-based planners have shown that trajectory generation can be cast as iterative denoising which has opened the doors to learning-based approaches that can handle multi-modal trajectory distributions and refine entire trajectories. However, a key limitation is that diffusion planners require training on large collections of feasible trajectories, rendering them map-specific, and difficult to deploy when high-quality demonstrations are unavailable. This paper introduces a training-free diffusion-based motion planner that replaces learned global trajectory scores with analytical local scores derived from obstacle, smoothness, velocity, and inter-agent feasibility terms. The proposed idea relies on a key observation: the score of a trajectory can be reconstructed by considering only local interactions between neighboring waypoints and nearby constraints. This structure exploitation yields a decomposed denoising procedure that retains the optimization structure of classical trajectory methods while inheriting the iterative refinement behavior of diffusion models. Experiments on a large collection of complex environments and large multi-agent planning tasks show that the proposed analytical score produces smooth and feasible trajectories within limited computational costs, for example in generating feasible paths for 300+ agents in environments containing 100+ obstacles in under 6 seconds on a GPU, outperforming strong learning-based and optimization baselines, while avoiding the data requirements of learned diffusion planners.", "pdf_url": "https://arxiv.org/pdf/2610.01959v1"}, {"title": "TouchTherm: Building Multimodal Digital Twins of Objects for Tactile and Thermal Rendering", "authors": ["Yitao Zhang", "Hong Ying", "Haoran Guo", "Xiaoying Zhou", "Guanyu Chen", "Chenxi Xiao"], "published": "2026-10-01", "summary": "Robotic simulation and virtual reality increasingly require object assets that capture not only visual geometry but also the physical cues underlying tactile and thermal interaction. Existing 3D datasets and reconstruction methods primarily represent object-scale geometry and visual appearance, overlooking microscale surface structure for high-fidelity haptic rendering and transient temperature dynamics for temperature-aware interaction. We present TouchTherm, a framework for constructing simulation-ready visuo-tactile-thermal object assets from real-world objects. For visual and tactile reconstruction, we combine structured-light scanning with multiview normal maps obtained from photometric stereo. The normal maps are registered to the scanned geometry and transformed into tangent space to recover local micro-height fields for optical tactile rendering, while the coarse mesh handles collision detection. For thermal reconstruction, we capture synchronized multiview infrared videos of natural cooling following controlled heating and reconstruct a physics-regularized dynamic thermal field. Experiments on 20 objects show that the reconstructed micro-height fields preserve dominant surface structures and recover higher-frequency details beyond the coarse geometry, while the thermal fields achieve held-out surface-temperature MAEs of 0.465 degrees C and 0.592 degrees C at 30 s and 45 s, respectively. The resulting tactile assets support synthetic-to-real object recognition from tactile observations, while a glove-based VR system demonstrates spatially and temporally varying thermal feedback. These results highlight the potential of TouchTherm for multimodal sensory simulation and temperature-aware virtual interaction.", "pdf_url": "https://arxiv.org/pdf/2610.01943v1"}, {"title": "Latent-Foresight: End-to-End Learning Predictable Representations for Latent World Models", "authors": ["Efstathios Karypidis", "Spyros Gidaris", "Nikos Komodakis"], "published": "2026-10-01", "summary": "Predicting the future evolution of a scene is a fundamental capability for world modeling. Recent work has shown that operating in the feature space of Vision Foundation Models (VFMs) yields semantically rich representations that support diverse future scene understanding tasks. However, existing approaches rely on two-stage pipelines, where VFM features are first compressed using fixed dimensionality reduction (e.g., PCA) or independently trained autoencoders, and a separate predictor is trained on top of the resulting frozen latent space. This decoupling between representation learning and temporal prediction, as well as approaches that apply predictors directly on raw VFM features, provides no guarantee that the latent space is structured for predictable dynamics. In this work, we propose Latent-Foresight, an end-to-end framework that jointly learns a latent tokenizer and a flow-based generative dynamics model, explicitly shaping the representation to support temporal predictability. To enable stable joint optimization, we introduce several key design choices that prevent latent collapse and align reconstruction with generative objectives. Extensive experiments show that our approach learns more temporally coherent latent representations and consistently outperforms two-stage baselines across multiple future scene understanding tasks and prediction horizons, while eliminating separate training stages, including during high-resolution adaptation. We provide the implementation code and model weights at https://github.com/Sta8is/Latent-Foresight", "pdf_url": "https://arxiv.org/pdf/2610.01942v1"}, {"title": "Fewer Tokens, Better Action: GPT-6 Astra Robot Agents with 14% Higher Success Rate but 65% Fewer Tokens", "authors": ["Ruiyang Si", "Jianxin Bi", "Shunyu Yang", "Rui Ni", "Wenbo Huang", "Qiang Wang", "Shulong Jiang", "Duomin Wang", "Xiuyu Li", "Haiwen Feng", "Zhen Dong", "Daquan Zhou"], "published": "2026-10-01", "summary": "Vision language model (VLM) agents can control robots through visual feedback and action primitives, but repeated model invocations and redundant observations incur substantial token overhead. We introduce PyRUA-Lean, an interactive code-execution framework that couples feedback-driven primitive composition with selective observation: the agent composes classical robot primitives and learned vision-language-action (VLA) policies into Python cells that perform conditional checks and local retries, returning only explicitly requested images and state feedback for replanning. Across 700 simulated task instances from LIBERO-PRO, RoboTwin 2.0, and RoboCasa365, we compare PyRUA-Lean with a tool-calling baseline using the same GPT-6 Astra planner and underlying robot primitives. Under equal LLM-call budgets, PyRUA-Lean increases overall success from 63.1% to 71.7%. On instances solved by both agents, it uses 49% fewer LLM calls and 65% fewer input tokens.", "pdf_url": "https://arxiv.org/pdf/2610.01939v1"}, {"title": "CLoSeR: Closing the Loop for Long-Context Streaming Reconstruction", "authors": ["Moyang Li", "Zihan Zhu", "Wei Zhang", "Marc Pollefeys", "Daniel Barath"], "published": "2026-10-01", "summary": "Feedforward foundation models have recently shown remarkable 3D reconstruction capabilities. However, existing models exhibit large tracking drift in long-context streaming reconstruction due to error accumulation. In this paper, we revisit loop closure with streaming reconstruction foundation models to enable accurate, drift-free, kilometer-scale reconstruction. Specifically, our method detects loop candidates through global descriptor retrieval, and constructs loop-conditioned windows to estimate the relative poses between looped frames. Given the observation that our adopted streaming reconstruction backbone produces a globally consistent scale, we optimize all frame poses on the SE(3) manifold with sequential and loop closure constraints, avoiding the pose graph optimization on the Sim(3) or higher-dimensional SL(4) manifolds employed in prior works. Extensive experiments show that our method reduces drift and produces consistent geometry on kilometer-scale sequences, significantly outperforming the state of the art. Code is available at https://github.com/MoyangLi00/CLoSeR.git.", "pdf_url": "https://arxiv.org/pdf/2610.01927v1"}, {"title": "Robot Learning on Discrete Surfaces: Theory and Applications", "authors": ["Matteo Dalle Vedove", "Fares J. Abu-Dakka", "Luigi Palopoli", "Daniele Fontanelli", "Matteo Saveriano"], "published": "2026-10-01", "summary": "All the objects composing our world are enclosed within surfaces. Yet, most robot learning and motion generation frameworks treat surfaces as constraints ignoring their intrinsic geometry. This gap is acute for polyhedral meshes--the standard output of CAD and 3D reconstruction--whose discrete geometric structure remains unexploited. In this paper, we propose a unified discrete Riemannian framework that enables robot learning directly on polyhedral surface meshes. Using discrete differential geometry, we define logarithmic and exponential maps, parallel transport, and ambient-space projections that remain well-defined across faces, edges, and vertices. We instantiate the framework in three learning paradigms: (i) Dynamic Movement Primitives (DMPs), an improved exponential-map computation and a fixed-tangent-cone forcing-term encoding with parallel transport yield better cross-surface generalisation and stability over prior mesh-based approaches. (ii) Gaussian Process (GP), a geodesic-based kernel with practical admissibility control, enables regression at arbitrary mesh locations without smoothness assumptions. (iii) Riemannian Flow Matching (RFM), mesh-native operators improve generative quality over spectral baselines while reducing training time. The framework is validated in simulation against state-of-the-art methods and dem
