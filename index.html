effective cooling. Alternative Pi enclosure form-factor for those running Compute Module [&#8230;]"}, {"title": "3D Printer Electronics Enclosure V4 – Modular Controller Box #3DThursday #3DPrinting", "source": "Adafruit", "date": "2026-08-06", "url": "https://blog.adafruit.com/2026/08/06/3d-printer-electronics-enclosure-v4-modular-controller-box-3dthursday-3dprinting/", "summary": "jonbourg shares: A large modular electronics enclosure for 3D printers, big enough (depending on controller board size) to hold the controller board, a Raspberry Pi, and other electronics. Long-running community project. Alternative for the electronics/enclosure block. By jonbourg (Thingiverse) download the files on: https://www.thingiverse.com/thing:4615105 Every Thursday is #3dthursday here at Adafruit! The DIY 3D printing [&#8230;]"}, {"title": "DodecaLight – Modular Dodecagon Lamp / Torch Convertible #3DThursday #3DPrinting", "source": "Adafruit", "date": "2026-08-06", "url": "https://blog.adafruit.com/2026/08/06/dodecalight-modular-dodecagon-lamp-torch-convertible-3dthursday-3dprinting/", "summary": "Shared by SimonMakerForge on MakerWorld: A modular 3D-printed lamp based on a dodecagonal geometry that transforms from a table lamp into a handheld torch via a telescopic base that doubles as a handle. Stack 30mm segments (3mm gap between each for a distinctive light pattern) to whatever height you want. Compatible with Bambu Lab LED [&#8230;]"}, {"title": "Bambu LED Kit Desk Lamp – 6-Piece Support-Free Base #3DThursday #3DPrinting", "source": "Adafruit", "date": "2026-08-06", "url": "https://blog.adafruit.com/2026/08/06/bambu-led-kit-desk-lamp-6-piece-support-free-base-3dthursday-3dprinting/", "summary": "novera shares: A simple table lamp for the Bambu Lab Kit 001, with a 6-piece base designed to avoid all supports during printing. Shade prints in vase mode. Intuitive assembly with a little glue. Alternative lamp for the Bambu LED Kit block. By Novera download the files on: https://makerworld.com/en/models/580960-bambu-led-kit-desk-lamp Every Thursday is #3dthursday here at [&#8230;]"}, {"title": "John Park’s Workshop — LIVE TODAY 8/6/26", "source": "Adafruit", "date": "2026-08-06", "url": "https://blog.adafruit.com/2026/08/06/john-parks-workshop-live-today-8-6-26/", "summary": "It&#8217;s JOHN PARK’S WORKSHOP — LIVE! &#8212; Coming up at 4pm ET / 1pm PT Today!  LIVE TEXT CHAT IS HERE in the Adafruit Discord chat! Projects &#8211; Intel 8080 Space Invaders Port to Fruit Jam CircuitPython Parsec Learn Guide Recap Tool Tips Retro Gear &#8211; picoBootloader &#38; PicoSNES on Fruit Jam and more! The [&#8230;]"}, {"title": "PCB Vise & Solder Station – 3-in-1 Bench Tool #3Dprinting #3DThursday", "source": "Adafruit", "date": "2026-08-06", "url": "https://blog.adafruit.com/2026/08/06/pcb-vise-solder-station-3-in-1-bench-tool-3dprinting-3dthursday/", "summary": "A compact 3-in-1 bench tool combining solder holder, cable clamp, and PCB holder in one. Parallel jaw closure with threaded screw for firm cable/PCB grip. Uses just 66g of filament (49g without the solder holder — a great filament-scrap use). Alternative maker tool. By Chefkoch Every Thursday is #3dthursday here at Adafruit! The DIY 3D [&#8230;]"}, {"title": "Raspberry Pi 5 Case Snap-Fit #3DThursday #3DPrinting", "source": "Adafruit", "date": "2026-08-06", "url": "https://blog.adafruit.com/2026/08/06/raspberry-pi-5-case-snap-fit-3dthursday-3dprinting/", "summary": "squirrelbrain shares: A Pi 5 case using M2.5×10 self-tapping screws (13× for case, 4× for Pi) and M5×10 BHCS/SHCS mounting screws. 4010 fan mount with M3×12 BHCS + M3 heat-set inserts. Red faces removable for wire/ribbon access. No supports needed. Alternative Pi 5 case for the enclosure block. Note: user comments flag SD-card slot fit [&#8230;]"}, {"title": "Maker’s Supply Screwdriver Kit Gridfinity Box – Custom Bit Insert #3DPrinting", "source": "Adafruit", "date": "2026-08-06", "url": "https://blog.adafruit.com/2026/08/06/makers-supply-screwdriver-kit-gridfinity-box-custom-bit-insert-3dprinting/", "summary": "A Gridfinity box designed specifically for the Maker&#8217;s Supply Screwdriver Set (with the long S2 bits and ergonomic aluminum handle). Every bit and the screwdriver handle has a perfectly-measured place. Size labels (H4.0-H0.9, PH1-PH0) embossed directly into the design, and clever center cutouts let you extract bits easily with a fingertip. By DGs 3D-PRINT Every [&#8230;]"}, {"title": "NEW GUIDE: Hacking the Teenage Engineering EP-2350 Ting", "source": "Adafruit", "date": "2026-08-06", "url": "https://blog.adafruit.com/2026/08/06/new-guide-hacking-the-teenage-engineering-ep-2350-ting/", "summary": "The Teenage Engineering EP-2350 ting is a handheld microphone device, effects box, and sample player used as an input to samplers, sequencers, and other audio gizmos. The brain of the gadget is the Raspberry Pi RP2350 microcontroller. The stock firmware is a custom build of MicroPython, which means it is possible for it to run [&#8230;]"}, {"title": "64×64 RGB Matrix (2.5mm Pitch) – Adafruit Panel Case with Pi Mount #3DThursday #3DPrinting", "source": "Adafruit", "date": "2026-08-06", "url": "https://blog.adafruit.com/2026/08/06/64x64-rgb-matrix-2-5mm-pitch-adafruit-panel-case-with-pi-mount-3dthursday-3dprinting/", "summary": "Davisan1001 shares: A simple case, stand, and Raspberry Pi mount for the Adafruit 64×64 RGB LED Matrix (2.5mm pitch). Designed with a lean-back angle for easy tabletop viewing. Fits the Raspberry Pi 3 B v1.2 (may work with similar models). Known issue: some USB I/O ports blocked when Pi 3 is mounted — one remains [&#8230;]"}, {"title": "The Python on Microcontrollers Newsletter: subscribe for free", "source": "Adafruit", "date": "2026-08-06", "url": "https://blog.adafruit.com/2026/08/06/the-python-on-microcontrollers-newsletter-subscribe-for-free-8-6-2/", "summary": "The Python for Microcontrollers Newsletter is the place for the latest news involving Python on hardware (microcontrollers AND single board computers like Raspberry Pi). This ad-free, spam-free weekly email is filled with CircuitPython, MicroPython, and Python information that you may have missed, all in one place! You get a summary of all the software, events, projects, and the latest hardware worldwide once a week, no [&#8230;]"}, {"title": "Production-Ready Embedded Computing — Toradex, NXP and Mouser Electronics", "source": "EE Journal", "date": "2026-08-06", "url": "https://www.eejournal.com/chalk_talks/production-ready-embedded-computing-toradex-nxp-and-mouser-electronics/", "summary": "&#160; In this episode of Chalk Talk, Kyle Fox from NXP and Mohamed Raad from Toradex and Amelia Dalton discuss why proven, pin-compatible product families and industrial IoT platforms are essential for scaling and long-term maintenance. They also discuss how NXP’s i.MX family and software platforms enable advanced physical AI capabilities, explore the biggest benefits &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/chalk_talks/production-ready-embedded-computing-toradex-nxp-and-mouser-electronics/\">Read More &#8594;<span class=\"screen-reader-text\"> \"Production-Ready Embedded Computing &#8212; Toradex, NXP and Mouser Electronics\"<\/span><\/a>"}, {"title": "TDK adds vibration-resistant axial and soldering-star capacitors for 125 V and upgrades 63 V series", "source": "EE Journal", "date": "2026-08-06", "url": "https://www.eejournal.com/industry_news/tdk-adds-vibration-resistant-axial-and-soldering-star-capacitors-for-125-v-and-upgrades-63-v-series/", "summary": "TDK Corporation (TSE: 6762) has expanded its axial/soldering star-aluminum electrolytic capacitor lineup with 125 V-rated components to the B43693/B43793 series (125 V to 250 V) and upgraded the 63-V series of existing B41687/B41787 (25 V to 63 V). This complements the product spectrum, addressing the increasing demand for compact and high-ripple-current DC-link capacitor banks with battery voltages ranging from 48-V &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/tdk-adds-vibration-resistant-axial-and-soldering-star-capacitors-for-125-v-and-upgrades-63-v-series/\">Read More &#8594;<span class=\"screen-reader-text\"> \"TDK adds vibration-resistant axial and soldering-star capacitors for 125 V and upgrades 63 V series\"<\/span><\/a>"}, {"title": "­ EnSilica joins European 5G‑aNTeNna consortium to advance Ka‑band 5G‑NTN satellite user terminals", "source": "EE Journal", "date": "2026-08-06", "url": "https://www.eejournal.com/industry_news/ensilica-joins-european-5g-antenna-consortium-to-advance-ka-band-5g-ntn-satellite-user-terminals/", "summary": "EnSilica, a leading maker of mixed-signal application-specific integrated circuits (ASICs), has joined the 5G-aNTeNna consortium, a European development project focused on creating compact, secure and scalable 5G-NTN user terminals for the EU’s IRIS² satellite communications commercial infrastructure. Led by Silicon Austria Labs (SAL), the consortium brings together CISC Semiconductor, EnSilica, FRITZ!, TechniSat and Terma Technologies to develop a highly secure and resilient broadband &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/ensilica-joins-european-5g-antenna-consortium-to-advance-ka-band-5g-ntn-satellite-user-terminals/\">Read More &#8594;<span class=\"screen-reader-text\"> \"­ EnSilica joins European 5G‑aNTeNna consortium to advance Ka‑band 5G‑NTN satellite user terminals\"<\/span><\/a>"}, {"title": "Stackpole Introduces High-Temperature Chip Resistors for Automotive, Aerospace, and Industrial Applications", "source": "EE Journal", "date": "2026-08-06", "url": "https://www.eejournal.com/industry_news/stackpole-introduces-high-temperature-chip-resistors-for-automotive-aerospace-and-industrial-applications/", "summary": "Stackpole Electronics, Inc. has introduced the RMHT series of AEC-qualified thick film chip resistors for applications that require dependable performance at elevated temperatures. The RMHT series maintains full-rated power up to 105°C, compared with conventional thick film resistors that typically require power derating above 70°C. This capability makes RMHT a strong fit for automotive, aerospace, &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/stackpole-introduces-high-temperature-chip-resistors-for-automotive-aerospace-and-industrial-applications/\">Read More &#8594;<span class=\"screen-reader-text\"> \"Stackpole Introduces High-Temperature Chip Resistors for Automotive, Aerospace, and Industrial Applications\"<\/span><\/a>"}, {"title": "Saelig Unveils the EECL DIV-100-10-SQ: High-Precision 100MHz to 10MHz Frequency Divider Module", "source": "EE Journal", "date": "2026-08-06", "url": "https://www.eejournal.com/industry_news/saelig-unveils-the-eecl-div-100-10-sq-high-precision-100mhz-to-10mhz-frequency-divider-module/", "summary": "Saelig Company, Inc. has announced the EECL DIV-100-10-SQ, a state-of-the-art frequency divider module designed to convert instrument reference signals down to with virtually zero increase in phase noise. Engineered for laboratory precision and ease of use, the DIV-100-10-SQ features a compact form factor that plugs directly onto an instrument&#8217;s BNC port, eliminating cable clutter and signal degradation. &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/saelig-unveils-the-eecl-div-100-10-sq-high-precision-100mhz-to-10mhz-frequency-divider-module/\">Read More &#8594;<span class=\"screen-reader-text\"> \"Saelig Unveils the EECL DIV-100-10-SQ: High-Precision 100MHz to 10MHz Frequency Divider Module\"<\/span><\/a>"}, {"title": "Practical AI: Don’t Work Harder; Work Smarter", "source": "EE Journal", "date": "2026-08-06", "url": "https://www.eejournal.com/article/practical-ai-dont-work-harder-work-smarter/", "summary": "<img alt=\"\" class=\"webfeedsFeaturedVisual wp-post-image\" height=\"300\" src=\"https://www.eejournal.com/wp-content/uploads/2026/08/max-0507-image-for-home-page-blaize-300x300.jpg\" style=\"display: block; margin-bottom: 5px; clear: both;\" width=\"300\" />For the past three years, almost every discussion I&#8217;ve had about AI processors and accelerators has eventually devolved into someone jumping up and down (metaphorically speaking) waving around bigger and bigger numbers: more parameters, more memory bandwidth, more TOPS, more&#8230; well&#8230; you name it, and they&#8217;ve got more of it. After a while, it begins &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/article/practical-ai-dont-work-harder-work-smarter/\">Read More &#8594;<span class=\"screen-reader-text\"> \"Practical AI: Don’t Work Harder; Work Smarter\"<\/span><\/a>"}, {"title": "Large-scale LoRaWAN deployments become easier through QR codes and relays", "source": "CNX Software", "date": "2026-08-05", "url": "https://www.cnx-software.com/2026/08/05/large-scale-lorawan-deployments-become-easier-through-qr-codes-and-relays/", "summary": "<div><img alt=\"LoRaWAN TS014 TS018 TR016 QR code\" class=\"attachment-medium size-medium wp-post-image\" height=\"480\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/08/LoRaWAN-TS014-TS018-TR016-QR-code-720x480.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>LoRaWAN devices typically require users to enter parameters such as the DevEUI, JoinEUI (formerly AppEUI), AppKey, and potentially the DevAddr plus the session keys, depending on the activation mode (ABP vs OTAA). This is manageable for a handful of devices, but becomes time-consuming, error-prone, and costly at scale. To make the onboarding process easier and scale LoRaWAN networks more effectively, the LoRa Alliance has now introduced three new documents: the TS014 and TS018 specifications and the TR016 technical recommendations. They should all help users get a device onto a network quickly, securely, and with minimal manual work, such as scanning a QR code. Here are the links and summaries for all three documents: TS014-1.0.0 &#8211; LoRaWAN End-Device Capabilities API Specification &#8211; TS014 eliminates manual data entry and proprietary workarounds by enabling LoRaWAN networks to automatically pull device profiles. It specifically describes a standard interface which enables the hNS (Home Network [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/08/05/large-scale-lorawan-deployments-become-easier-through-qr-codes-and-relays/\">Large-scale LoRaWAN deployments become easier through QR codes and relays<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "ZecTrix Note 4 – A 4.2-inch ESP32-S3 wireless e-paper display for voice tasks", "source": "CNX Software", "date": "2026-08-05", "url": "https://www.cnx-software.com/2026/08/05/zectrix-note-4-a-4-2-inch-esp32-s3-wireless-e-paper-display-for-voice-tasks/", "summary": "<div><img alt=\"ZecTrix Note 4 4.2 inch AI e paper smart note\" class=\"attachment-medium size-medium wp-post-image\" height=\"480\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/08/ZecTrix-Note-4-4.2-inch-AI-e-paper-smart-note-720x480.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Designed by ZecTrix Lab in China, the Note 4 is an ESP32-S3-based AI smart note with a 4.2-inch e-paper display and built-in voice input. The device is designed to display reminders, notes, clocks, weather, images, and custom templates, while the Note 4C variant replaces the monochrome display with a four-color e-paper panel. The device features 2.4GHz Wi-Fi and Bluetooth 5.0 connectivity, a microphone, a speaker, NFC, physical buttons, a USB Type-C port, a 2,000mAh rechargeable battery, and GPIO expansion for custom hardware projects. ZecTrix Note 4 / Note 4C specifications: SoC – Espressif Systems ESP32-S3 CPU – Dual-core Tensilica LX7 up to 240 MHz with vector extension for AI/ML workloads RAM – 512KB SRAM; 8MB PSRAM Wireless – WiFi 4 and Bluetooth LE 5 Storage – 16MB flash Display Note 4 – 4.2-inch monochrome E-Ink display, 400 × 300 resolution; supports partial refresh Note 4C – 4.2-inch four-color (BWRY) E-Ink display, [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/08/05/zectrix-note-4-a-4-2-inch-esp32-s3-wireless-e-paper-display-for-voice-tasks/\">ZecTrix Note 4 – A 4.2-inch ESP32-S3 wireless e-paper display for voice tasks<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "CtrlVibe AI Console keypad – An OpenAI Codex Micro alternative for AI workflows (Crowdfunding)", "source": "CNX Software", "date": "2026-08-05", "url": "https://www.cnx-software.com/2026/08/05/ctrlvibe-ai-console-keypad-an-openai-codex-micro-alternative-for-ai-workflows/", "summary": "<div><img alt=\"CtrlVibe AI Workflow Console\" class=\"attachment-medium size-medium wp-post-image\" height=\"450\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/08/CtrlVibe-AI-Workflow-Console-720x450.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>The CtrlVibe AI Console is a programmable desktop keypad designed for AI workflows. The device includes hardware controls for switching between AI tools, launching shortcuts, selecting execution modes, and recording voice input. It comes with nine programmable mechanical keys, a rotary encoder, a three-position switch, a 1.14-inch LCD, a built-in MEMS microphone, USB-C and Bluetooth connectivity, and RGB status lighting. The features and specifications of the CtrlVibe make it an alternative to Work Louder Codex Micro, a $230 mechanical macropad designed for OpenAI Codex. There is also an open-source firmware project available for the M5Stack Core2 that reproduces many of the Codex Micro&#8217;s features. While the Codex Micro is designed specifically for OpenAI Codex, the CtrlVibe AI Console can be used with multiple AI tools and uses a rotary encoder to switch between applications or models, along with a three-position hardware switch for selecting AI execution modes. CtrlVibe AI Console [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/08/05/ctrlvibe-ai-console-keypad-an-openai-codex-micro-alternative-for-ai-workflows/\">CtrlVibe AI Console keypad &#8211; An OpenAI Codex Micro alternative for AI workflows (Crowdfunding)<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Samsung Advances AI Memory with New 3D Architecture", "source": "Embedded.com", "date": "2026-08-05", "url": "https://www.embedded.com/samsung-advances-ai-memory-with-new-3d-architecture/", "summary": "<p>Samsung Electronics presented its latest memory technologies and long-term roadmap for AI infrastructure at the Future of Memory and Storage (FMS) 2026 conference, introducing new 3D memory concepts with advances in high-bandwidth memory (HBM), NAND flash, and enterprise storage. The announcements reflect the company's strategy of improving memory bandwidth, density, and energy efficiency to support [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/samsung-advances-ai-memory-with-new-3d-architecture/\">Samsung Advances AI Memory with New 3D Architecture<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "Silicon Labs Delivers its Lowest-Power Bluetooth LE SoC", "source": "Embedded.com", "date": "2026-08-05", "url": "https://www.embedded.com/silicon-labs-delivers-its-lowest-power-bluetooth-le-soc/", "summary": "<p>The BG2B Bluetooth LE wireless SoC delivers high power efficiency, security, and integration.<\/p>\n<p>The post <a href=\"https://www.embedded.com/silicon-labs-delivers-its-lowest-power-bluetooth-le-soc/\">Silicon Labs Delivers its Lowest-Power Bluetooth LE SoC<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "Ambiq Launches heliaPROFILER for Edge AI Development", "source": "Embedded.com", "date": "2026-08-05", "url": "https://www.embedded.com/ambiq-launches-heliaprofiler-for-edge-ai-development/", "summary": "<p>Ambiq has expanded its HELIA AI software ecosystem with the introduction of heliaPROFILER, an open-source profiling tool designed to accelerate the development and optimization of edge AI applications running on Apollo system-on-chips (SoCs). The software provides developers with cycle-accurate insight into AI model execution, enabling more efficient optimization of performance, memory usage, and energy consumption [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/ambiq-launches-heliaprofiler-for-edge-ai-development/\">Ambiq Launches heliaPROFILER for Edge AI Development<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "Calibre Vision AI: Accelerating Early Chip Integration and Debug — Siemens", "source": "EE Journal", "date": "2026-08-05", "url": "https://www.eejournal.com/chalk_talks/calibre-vision-ai-accelerating-early-chip-integration-and-debug-siemens/", "summary": "&#160; In this episode of Chalk Talk, Priyank Jain from Siemens and Amelia Dalton investigate Calibre Vision AI and how this solution is helping design teams navigate the increasing complexity of full-chip integration and speed up their debug workflows. They also explore the challenges of early full chip integration and the variety of benefits that &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/chalk_talks/calibre-vision-ai-accelerating-early-chip-integration-and-debug-siemens/\">Read More &#8594;<span class=\"screen-reader-text\"> \"Calibre Vision AI: Accelerating Early Chip Integration and Debug &#8212; Siemens\"<\/span><\/a>"}, {"title": "TANAKA Develops MOC1-30 Series Methane Oxidation Catalyst with High Sulfur Resistance and More Than 80% Methane Conversion", "source": "EE Journal", "date": "2026-08-05", "url": "https://www.eejournal.com/industry_news/tanaka-develops-moc1-30-series-methane-oxidation-catalyst-with-high-sulfur-resistance-and-more-than-80-methane-conversion/", "summary": "TANAKA PRECIOUS METAL TECHNOLOGIES Co., Ltd. (Head Office: Chuo-ku, Tokyo; CEO: Koichiro Tanaka), a company engaged in the industrial precious metals business of TANAKA, today announced the development of the MOC1-30 series methane oxidation catalyst which has excellent resistance to sulfur (S) and maintains high purification performance over an extended period of time. The product is &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/tanaka-develops-moc1-30-series-methane-oxidation-catalyst-with-high-sulfur-resistance-and-more-than-80-methane-conversion/\">Read More &#8594;<span class=\"screen-reader-text\"> \"TANAKA Develops MOC1-30 Series Methane Oxidation Catalyst with High Sulfur Resistance and More Than 80% Methane Conversion\"<\/span><\/a>"}, {"title": "Mouser’s AI and Power Management Resource Hubs Help Engineers Deliver Industrial Edge AI", "source": "EE Journal", "date": "2026-08-05", "url": "https://www.eejournal.com/industry_news/mousers-ai-and-power-management-resource-hubs-help-engineers-deliver-industrial-edge-ai/", "summary": "Dedicated hubs covering the full industrial edge AI design challenge Practical guidance on workload characterization, energy harvesting and production-grade power architecture Direct paths from technical insight to stocked edge AI and power management components Mouser Electronics, Inc., the New Product Introduction (NPI) leader™ empowering innovation, is highlighting how its AI and Power Management Resource Hubs &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/mousers-ai-and-power-management-resource-hubs-help-engineers-deliver-industrial-edge-ai/\">Read More &#8594;<span class=\"screen-reader-text\"> \"Mouser&#8217;s AI and Power Management Resource Hubs Help Engineers Deliver Industrial Edge AI\"<\/span><\/a>"}, {"title": "Ambiq Announces the Launch of heliaPROFILER to Accelerate Edge AI Development", "source": "EE Journal", "date": "2026-08-05", "url": "https://www.eejournal.com/industry_news/ambiq-announces-the-launch-of-heliaprofiler-to-accelerate-edge-ai-development/", "summary": "Ambiq Micro, Inc. (&#8220;Ambiq®&#8221;), a technology leader in ultra-low power semiconductor solutions for edge AI, today announced the launch of heliaPROFILER™, a new open-source profiling tool that expands its HELIA™ AI ecosystem. Designed for AI developers building on Ambiq Apollo SoCs, heliaPROFILER provides cycle-accurate insight into AI model execution on production hardware, enabling faster optimization &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/ambiq-announces-the-launch-of-heliaprofiler-to-accelerate-edge-ai-development/\">Read More &#8594;<span class=\"screen-reader-text\"> \"Ambiq Announces the Launch of heliaPROFILER to Accelerate Edge AI Development\"<\/span><\/a>"}, {"title": "reComputer Mini J501 Edge AI computer features NVIDIA Jetson AGX Orin 64GB/32GB module, two FAKRA camera connectors", "source": "CNX Software", "date": "2026-08-04", "url": "https://www.cnx-software.com/2026/08/04/recomputer-mini-j501-edge-ai-computer-features-nvidia-jetson-agx-orin-64gb-32gb-module-two-fakra-camera-connectors/", "summary": "<div><img alt=\"reComputer Mini J501\" class=\"attachment-medium size-medium wp-post-image\" height=\"448\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/08/reComputer-mini-J501-720x448.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Designed for robotics applications, the reComputer Mini J501 is an Edge AI computer powered by an NVIDIA Jetson AGX Orin 64GB or 32GB module, delivering up ot 275 TOPS of AI performance. The computer features 10GbE and GbE RJ45 ports, HDMI 2.1 video output, two USB 3.2 ports, two USB 2.0 Type-C Debug/Recovery ports, a 128 M.2 NVMe SSD, two FAKRA connectors for up to eight GMSL2 cameras, and a range of other I/O connectors. reComputer Mini J501 specifications: System-on-module (one or the other) NVIDIA Jetson AGX Orin 32GB  (reComputer Mini J5011 model) CPU – 8-core Arm Cortex-A78AE v8.2 64-bit processor @ 2.2 GHz with 2MB L2 + 4MB L3 cache GPU and AI NVIDIA Ampere architecture with 1792 NVIDIA CUDA cores and 56 Tensor Cores @ 930 MHz DL Accelerator – 2x NVDLA Engines @ up to 1.4 GHz Up to 200 TOPS Video Encode – 1x 4K60 &#124; 3x 4K30 [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/08/04/recomputer-mini-j501-edge-ai-computer-features-nvidia-jetson-agx-orin-64gb-32gb-module-two-fakra-camera-connectors/\">reComputer Mini J501 Edge AI computer features NVIDIA Jetson AGX Orin 64GB/32GB module, two FAKRA camera connectors<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Espressif ESP32-C61-MINI-1/1U Wi-Fi 6 and BLE IoT module launched for about $2", "source": "CNX Software", "date": "2026-08-04", "url": "https://www.cnx-software.com/2026/08/04/espressif-esp32-c61-mini-1-1u-wi-fi-6-and-ble-iot-module-2-dollars/", "summary": "<div><img alt=\"ESP32-C61-MINI-1U\" class=\"attachment-medium size-medium wp-post-image\" height=\"519\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/08/ESP32-C61-MINI-1U-720x519.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Back in 2024, Espressif Systems introduced the ESP32-C61 2.4 GHz WiFi 6 and Bluetooth LE (BLE) SoC as a low-cost variant of the ESP32-C6 without an 802.15.4 radio, a single RISC-V core, and lower-capacity SRAM (320KB vs 512KB). We had first seen the ESP32-C61 in the Wireless Tag ESP32P4C61 board introduced last June in a Kickstarter campaign last June, but Espressif has now started to sell samples of the ESP32-C61-MINI-1 and ESP32-C61-MINI-1U on AliExpress for $10.7 for a pack of 5 pieces, or around $2 per module. ESP32-C61-MINI-1/1U Module specifications: SoC &#8211; ESP32-C61 CPU core &#8211; Single-core 32-bit RISC-V microprocessor up to 160 MHz Memory 320KB SRAM Up to 8 MB PSRAM Storage 256KB ROM Up to 8 MB Quad SPI flash Wireless 2.4 GHz WiFi 1T1R Frequency: 2412 ~ 2484 MHz IEEE 802.11ax-compliant 20 MHz-only non-AP mode MCS0 ~ MCS9 Uplink and downlink OFDMA Downlink MU-MIMO Target wake time [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/08/04/espressif-esp32-c61-mini-1-1u-wi-fi-6-and-ble-iot-module-2-dollars/\">Espressif ESP32-C61-MINI-1/1U Wi-Fi 6 and BLE IoT module launched for about $2<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "BG2B is the lowest-power Bluetooth LE SoC from Silicon Labs so far", "source": "CNX Software", "date": "2026-08-04", "url": "https://www.cnx-software.com/2026/08/04/bg2b-lowest-power-bluetooth-le-soc-from-silicon-labs/", "summary": "<div><img alt=\"Silicon Labs BG2B\" class=\"attachment-medium size-medium wp-post-image\" height=\"422\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/08/Silicon-Labs-BG2B-720x422.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Silicon Labs BG2B is an ultra-low-power Arm Cortex-M33 Bluetooth 6 LE SoC with support for Channel Sounding, &#8220;Secure Vault High&#8221; security, and integrated CAN-FD and peripherals such as LED drivers and ADCs for smaller, longer-lasting IoT devices. The company claims it&#8217;s the lowest-power Bluetooth LE device in its portfolio, with 1.1 µA EM2 sleep current with RAM retention, as well as 14%-15% lower MCU active current and lower Bluetooth receive current compared to Silicon Labs BG22/BG22L. The new microcontroller targets secure ranging, asset tracking, electronic shelf labels (ESLs), smart home, industrial monitoring, and vehicle diagnostics. Silicon Labs BG2B specifications: CPU core &#8211; 32-bit Arm Cortex-M33 @ 80 MHz with DSP instructions and floating-point unit (FPU) Memory &#8211; 64 kB or 128 kB SRAM Storage &#8211; 1016 kB flash Wireless &#8211; 2.4 GHz radio Modulation Formats OQPSK DSSS 2 (G)FSK with fully configurable shaping (G)MSK Protocols Bluetooth Low Energy 6 Channel [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/08/04/bg2b-lowest-power-bluetooth-le-soc-from-silicon-labs/\">BG2B is the lowest-power Bluetooth LE SoC from Silicon Labs so far<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Cadence Develops Agentic AI Platform for PCB Design", "source": "Embedded.com", "date": "2026-08-04", "url": "https://www.embedded.com/cadence-develops-agentic-ai-platform-for-pcb-design/", "summary": "<p>The AuraStack AI super agent coordinates advanced PCB and package design with simulation and sign-off but leaves application-specific tradeoffs to engineers.<\/p>\n<p>The post <a href=\"https://www.embedded.com/cadence-develops-agentic-ai-platform-for-pcb-design/\">Cadence Develops Agentic AI Platform for PCB Design<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "Optical Zonu Launches Miniature Ku-Band RFoF Transmitter", "source": "Embedded.com", "date": "2026-08-04", "url": "https://www.embedded.com/optical-zonu-launches-miniature-ku-band-rfof-transmitter/", "summary": "<p>Optical Zonu has introduced a miniature Ku-band RF-over-fiber (RFoF) transmitter designed for defense and aerospace platforms where installation space is limited and high-frequency RF signal integrity is critical. The compact OEM module enables direct conversion of RF signals to optical signals at the antenna, reducing transmission losses and simplifying system architectures compared with conventional coaxial [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/optical-zonu-launches-miniature-ku-band-rfof-transmitter/\">Optical Zonu Launches Miniature Ku-Band RFoF Transmitter<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "ChronoWatch X2040 – A DIY watch with off-the-shelf Raspberry Pi RP2040 round display, 3D printed case, and custom firmware", "source": "CNX Software", "date": "2026-08-03", "url": "https://www.cnx-software.com/2026/08/03/chronowatch-x2040-a-diy-watch-with-off-the-shelf-raspberry-pi-rp2040-round-display-3d-printed-case-and-custom-firmware/", "summary": "<div><img alt=\"Raspberry Pi RP2040 watch\" class=\"attachment-medium size-medium wp-post-image\" height=\"491\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/08/Raspberry-Pi-RP2040-watch-720x491.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>If you&#8217;ve ever wanted to build your own watch, the ChronoWatch X2040 DIY watch allows you to do it the easy way with a Waveshare RP2040-Touch-LCD-1.28 touch LCD board, a 3D-printed case, a 3.7V LiPo battery, a few screws, and firmware using the Pico C/C++ SDK. When Vishal Soni decided he wanted to build a watch, he initially planned to design a custom board, but since there are already several round LCD boards based on Raspberry Pi RP2040 MCU, he went with a Waveshare board, preferring to spend more time on firmware programming. ChronoWatch X2040 parts: Waveshare RP2040-Touch-LCD-1.28 with Raspberry Pi RP2040 MCU and 1.28-inch round touch display &#8211; About $23 to $29 on Amazon, AliExpress, or the Waveshare store. 3D printed case designed with Tinkercad 3.7V 950mAh Lipo battery (35 x 25 x 10 mm) M2 4mm screw M2 heat inserts 2-pin MX1.25 connector 1mm heat shrink sleeve tube [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/08/03/chronowatch-x2040-a-diy-watch-with-off-the-shelf-raspberry-pi-rp2040-round-display-3d-printed-case-and-custom-firmware/\">ChronoWatch X2040 &#8211; A DIY watch with off-the-shelf Raspberry Pi RP2040 round display, 3D printed case, and custom firmware<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "28.9M-parameter LLM runs locally on ESP32-S3 at 9 tokens/s", "source": "CNX Software", "date": "2026-08-03", "url": "https://www.cnx-software.com/2026/08/03/28-9m-parameter-llm-runs-locally-on-esp32-s3-at-9-tokens-s/", "summary": "<div><img alt=\"ESP32-S3 local LLM\" class=\"attachment-medium size-medium wp-post-image\" height=\"451\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/08/ESP32-S3-local-LLM-720x451.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Slava S. (slvDev) has optimized a 28.9M-parameter LLM running locally on an ESP32-S3 development board at around 9 tokens/s while generating text, or more exactly, telling short stories. We&#8217;ve written about LLMs and ESP32 in the past, but usually the boards are used as low-power gateways to interact with online LLMs hosted on powerful servers in data centers. Such products or projects include HiWonderLLM &#8220;smart chat module&#8221;, the ESP-Claw framework, or the ESP32 Agent Dev Kit. Slava&#8217;s &#8220;esp32-ai&#8221; project is quite different, as everything runs on the ESP32-S3 microcontroller. This won&#8217;t work on all ESP32-S3 as you&#8217;ll need enough memory and storage to store the 14.9MB (4-bit) model file, and Slava tested his demo on an ~$8 ESP32-S3 board with 512KB SRAM+8MB SPRAM and 16MB flash connected to a small I2C display to display short stories. Dave Bennett already did something similar with the ESP32-LLM project, but it only relied [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/08/03/28-9m-parameter-llm-runs-locally-on-esp32-s3-at-9-tokens-s/\">28.9M-parameter LLM runs locally on ESP32-S3 at 9 tokens/s<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "$299.99 ASUS UGen300 USB AI accelerator combines 40 TOPS Hailo-10H chip with 8GB LPDDR4", "source": "CNX Software", "date": "2026-08-03", "url": "https://www.cnx-software.com/2026/08/03/299-99-asus-ugen300-usb-ai-accelerator-hailo-10h-8gb-lpddr4/", "summary": "<div><img alt=\"ASUS UGen300 USB AI Accelerator\" class=\"attachment-medium size-medium wp-post-image\" height=\"463\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/08/ASUS-UGen300-USB-AI-Accelerator-720x463.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>ASUS UGen300 USB AI accelerator features a 40 TOPS Hailo-10H AI processor and 8GB of LPDDR4 memory to support large language models (LLMs), vision language models (VLMs), and AI vision workloads while consuming less than 2.5 Watts. In some ways, the hardware is similar to the Raspberry Pi AI HAT+ 2, but in a slim dongle form factor (105 x 50 x 18mm) and a 10 Gbps USB 3.2 Gen1 USB-C Type-C port instead of a 5 or 8 GT/s PCIe interface. ASUS UGen300 USB AI accelerator (UGen300-USB-8G) specifications: AI accelerator – Hailo Hailo-10H delivering up to 40 TOPS (INT4) or 20 TOPS (INT8) inferencing performance Memory &#8211; 8GB LPDDR4 @ 4266 MT/s Host interface &#8211; USB 3.1 Gen2 (10 Gbps) Type-C port Power Supply &#8211; 5V via USB-C port Power Consumption &#8211; 2.5 Watts (typical) Dimensions – 105 x 50 x 18 mm Weight &#8211; 145 grams ASUS says the [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/08/03/299-99-asus-ugen300-usb-ai-accelerator-hailo-10h-8gb-lpddr4/\">$299.99 ASUS UGen300 USB AI accelerator combines 40 TOPS Hailo-10H chip with 8GB LPDDR4<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Fault-Tolerant Quantum Computers, Sustained Performance Defines the Next Phase of Edge AI, Agentic AI for EDA: Embedded Week Insights", "source": "Embedded.com", "date": "2026-07-31", "url": "https://www.embedded.com/fault-tolerant-quantum-computers-sustained-performance-defines-the-next-phase-of-edge-ai-agentic-ai-for-eda-embedded-week-insights/", "summary": "<p>Here's a roundup of this week's must-read articles. We'll look into the latest developments on fault-tolerant quantum computers, why sustained performance will define the next phase of edge AI, and a partnership on agentic AI for EDA to automate complex engineering tasks. Also, check News Archives - Embedded and Technical Articles Archives - Embedded for the complete list of [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/fault-tolerant-quantum-computers-sustained-performance-defines-the-next-phase-of-edge-ai-agentic-ai-for-eda-embedded-week-insights/\">Fault-Tolerant Quantum Computers, Sustained Performance Defines the Next Phase of Edge AI, Agentic AI for EDA: Embedded Week Insights<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "Mikroe Integrates Swift Navigation Skylark with GNSS 19 Click", "source": "Embedded.com", "date": "2026-07-31", "url": "https://www.embedded.com/mikroe-integrates-swift-navigation-skylark-with-gnss-19-click/", "summary": "<p>Mikroe has partnered with Swift Navigation to integrate the Skylark Precise Positioning Service into its GNSS 19 Click development board, providing users with a free six-month license to the cloud-based correction service. The collaboration is intended to simplify access to high-accuracy global navigation satellite system (GNSS) positioning for developers working on industrial, automotive, and IoT [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/mikroe-integrates-swift-navigation-skylark-with-gnss-19-click/\">Mikroe Integrates Swift Navigation Skylark with GNSS 19 Click<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "Renesas Upgrades DDR5 MRDIMM Chipset", "source": "Embedded.com", "date": "2026-07-30", "url": "https://www.embedded.com/renesas-upgrades-ddr5-mrdimm-chipset/", "summary": "<p>Renesas Electronics Corp. has launched its third‑generation (Gen 3) DDR5 multiplexed rank dual in‑line memory module (MRDIMM) chipset solutions with server-class MRDIMM speeds up to 16,000 mega transfers per second (MT/s). The new devices include the RRG5013 multiplexed registering clock driver (MRCD) and RRG5103 multiplexed data buffer (MDB). Targeting increased demand for higher memory bandwidth driven by AI data centers, cloud infrastructure, and accelerated [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/renesas-upgrades-ddr5-mrdimm-chipset/\">Renesas Upgrades DDR5 MRDIMM Chipset<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}], "papers": [{"title": "RxnCLF: Contrastive Transformation-Aware Reaction Foundation Model for Improved Reactivity Prediction", "authors": ["Yiting Zheng", "Cheng Fang", "Anthony Donofrio", "Haote Li"], "published": "2026-08-06", "summary": "Reaction yield prediction remains challenging because labeled data are scarce and reaction space is both combinatorially large and sparsely populated, limiting the generalization of existing reaction representations. String-, fingerprint-, and graph-based reaction encodings only partially capture chemical transformations, making accurate prediction difficult for reactions with complex substrates. We propose reaction contrastive learning foundation (RxnCLF), a self-supervised contrastive framework for reaction representation learning. RxnCLF is built on a condensed reaction graph (CRG) that unifies reactant and product information into a single graph, enabling the model to learn explicit and enriched transformation structure rather than disconnected graphs. Pretrained on 1.7 million Pistachio reactions, RxnCLF learns a compact and continuous latent space that captures both reaction-center features and broader side chain contexts, making it transformation-aware and chemically interpretable. Fine-tuned on multiple yield prediction benchmarks, including Buchwald-Hartwig, Pd-catalyzed BH coupling, and proprietary HTE C-N coupling and amide formation datasets, RxnCLF consistently outperforms graph and sequence-based baselines, improving R2 and achieving the best performance overall. Our results highlight the promise of CRG-based RxnCLF as a scalable reaction foundation model, with the potential to generalize across broader reaction spaces and support diverse downstream reaction informatics tasks, including regioselectivity prediction, enantioselectivity prediction, and reaction condition optimization.", "pdf_url": "https://arxiv.org/pdf/2608.06259v1"}, {"title": "MASS: Multiplayer World Models with Authoritative Shared State", "authors": ["Ziqi Cai", "Siqi Yang", "Yimu Wang", "Zixian Gao", "Yunheng Liu", "Shuchen Weng", "Erwin Wu", "Kaipeng Zhang", "Boxin Shi"], "published": "2026-08-06", "summary": "Current video world models struggle in multiplayer environments because they entangle world state with view-dependent visual latents, leading to redundant compute, view inconsistencies, and poor scalability. We propose MAS (Multiplayer world models with Authoritative Shared State) to resolve this limitation. Inspired by multiplayer game architectures, MAS disentangles world dynamics and view rendering. A learned Logic Engine advances a global, authoritative typed state from joint actions without any hand-written transition function, acting as the sole recurrent memory and synchronization reference. From this shared state, a learned Rendering Engine generates independent and consistent views for any requested camera on demand. This explicit disentangling allows MAS to achieve superior state accuracy and lower cross-view inconsistency compared to state-of-the-art multi-view baselines on a matched multiplayer Snake benchmark. It advances predicted worlds with 1,024 concurrent players for 10,000 recurrent steps. Our results show that explicit, authoritative state modeling provides a practical foundation for scalable and consistent multi-agent world simulation.", "pdf_url": "https://arxiv.org/pdf/2608.06257v1"}, {"title": "A Six-Dimensional Taxonomy of Post-Training Adaptation Techniques with Applications in AI Governance", "authors": ["Fardin Afdideh", "Fernando Seoane", "Farhad Abtahi"], "published": "2026-08-06", "summary": "Post-training adaptation has become central to modern machine learning practice and includes techniques such as retraining, fine-tuning, parameter-efficient adaptation, alignment, retrieval augmentation, model editing, unlearning, calibration, and Multimodal Instruction Tuning. However, the literature remains fragmented across technique families, model classes, and deployment contexts, making it difficult to compare methods or describe how a trained model has been modified. This survey synthesizes the post-training adaptation literature and introduces a six-dimensional taxonomy organized by mechanism, goal, data requirement, persistence, structural scope, and model type. The taxonomy distinguishes commonly conflated terms such as fine-tuning, retrieval augmentation, and prompting, and shows how adaptation strategies evolve from traditional machine learning through deep learning, foundation models, large language models, and multimodal large language models. It also maps relationships among techniques, including inheritance, supersession, hybridization, and layered deployment stacks. The resulting vocabulary can support technical documentation, model-change tracking, and governance analysis. The survey concludes by identifying open challenges in evaluation, reproducibility, persistent inference-time adaptation, unlearning, multimodal adaptation, and governance-aware post-training workflows.", "pdf_url": "https://arxiv.org/pdf/2608.06246v1"}, {"title": "From Passive Mirrors to Active Agents: Holonic Digital Twins for Physical AI over Networks", "authors": ["Christo Kurisummoottil Thomas", "Omar Hashash", "Walid Saad"], "published": "2026-08-06", "summary": "Despite advances in artificial intelligence (AI) across multiple sectors, today's AI tools, including deep learning and generative AI, still fail when embedded into physical systems, such as robots and vehicles operating under real-world physical laws. This stems from their inability to maintain reliable world models for long-horizon planning under uncertainty and generalize to unseen scenarios. In this context, wireless networks, through pervasive sensing and communication, can orchestrate physical intelligence. However, current architectures optimize throughput, latency, and reliability and cannot support real-time physical AI coordination, requiring agents to maintain shared spatiotemporal context. To address these challenges, a network of holonic digital twins (HDT-Nets) framework is proposed to deliver real-time physical AI inference through holonic agents that actively reason about their environment rather than passively mirror physical assets. Each HDT is realized as a hierarchical structure spanning the physical agent and network edge, reasoning autonomously at the local level while cooperating with neighboring HDTs to form collectively intelligent units. In HDT-Net, causal Markov blankets spanning sensing, communication, and control determine which agents must coordinate and enable counterfactual reasoning over multi-domain interventions. Active inference within these boundaries unifies perception, action, and learning by minimizing expected free energy while deciding which beliefs to transmit based on their cognitive value to the receiver. Category theory ensures that transmitted beliefs preserve semantic structure across heterogeneous agents with incompatible representations. Finally, integrated information theory quantifies when collective intelligence exceeds independent operation and how network intelligence evolves through coordinated learning and information exchange.", "pdf_url": "https://arxiv.org/pdf/2608.06227v1"}, {"title": "Robot Learning from Human Demonstrations: Handwritten Alphabet Trajectories and Human-Likeness Evaluation", "authors": ["Alperen Kenan", "Paul Bremner", "Manuel Giuliani"], "published": "2026-08-06", "summary": "Learning from demonstration (LfD) provides a developmental framework through which robots can develop motor skills by observing and imitating human dynamics, reducing reliance on explicit programming to teach a skill to a robot. The resulting human-like robot motion is recognised as a key factor in building trust and enabling natural collaboration in human-robot interaction. This paper presents a framework for learning human-like robot motion from demonstration, including data collection, probabilistic trajectory learning, and perceptual user evaluation. A dataset of 3,142 handwriting demonstrations was collected from 22 participants across all 52 Latin alphabet character-case combinations via a touchscreen teleoperation interface, capturing planar position, contact force, and timing. Building on the widely used Gaussian Mixture Model and Gaussian Mixture Regression approach for learning from demonstration, the framework is extended in this work by incorporating force and normalised time dimensions to enable richer representation of human dynamics, and adapting it to handle non-continuous, multi-segment trajectories, enabling generalisation across demonstrations. A user study with 21 participants evaluated the perceived human-likeness of the generated trajectories using a continuous scale anchored between robotic and human-like motion, normalised to 0-100 where 50 represents the neutral midpoint. The generated trajectories achieved an overall human-likeness score of 71.50 (SD=22.56), indicating that the majority of trajectories were perceived as more human-like. Participants identified geometric positioning and trajectory sequence as the most influential perceptual factors, and reported positive attitudes toward human-like robot behaviour. The datasets are released as open-source, providing a reproducible benchmark for developing and evaluating human-like robot motion methods.", "pdf_url": "https://arxiv.org/pdf/2608.06221v1"}, {"title": "Design and Evaluation of a Touchscreen-Based Teleoperation Interface for Robotic Manipulators", "authors": ["Juan José García Cárdenas", "Alperen Kenan", "Hamidreza Raei", "Paul Bremner", "Manuel Giuliani", "Arash Ajoudani", "Adriana Tapus"], "published": "2026-08-06", "summary": "Intuitive teleoperation interfaces are crucial for the safe and effective operation of robotic manipulators in challenging environments. In the nuclear industry, surface contact tasks such as swab sampling require precise path and force tracking, obstacle avoidance, and sustained operator attention, which conventional joystick interfaces struggle to support effectively. This study designs and evaluates a novel touchscreen teleoperation interface that maps continuous finger movements directly to robotic manipulator motions, provides finer velocity control, and integrates control with visualization, enabling more natural, precise, and intuitive surface interaction than conventional controllers. A comparative user study with 20 participants evaluated task performance and workload using the proposed touchscreen, a conventional joystick, and a single-click autonomous mode. Tasks simulated realistic surface manipulation using a Franka Emika Panda arm, remotely controlled from another country. Kinematic, physiological, and behavioral data were recorded to comprehensively assess task performance, cognitive load, and operator trust across each control condition. Participants completed teleoperation tasks more efficiently and accurately with the touchscreen interface, achieving a 53.5% reduction in completion time (median: 2.50 vs. 5.38 min), higher in-area coverage on the sinusoidal path (90.7% vs. 84.1%), and lower overshoot on both path geometries compared with the joystick. Cognitive load, quantified via NASA-TLX (0-100), decreased from joystick to touchscreen (mean TLX 52 to 43; -9 points, -17.3%) and was lowest under the autonomous one-click mode (31; -21 points vs. joystick, -40.4%; -12 vs. touchscreen, -27.9%). This research presents an easy-to-implement touchscreen interface that improves performance in teleoperated surface tasks while reducing cognitive load.", "pdf_url": "https://arxiv.org/pdf/2608.06219v1"}, {"title": "VIDP: Variable Impedance Diffusion Policy for Compliant Robot Manipulation from Diverse Demonstrations", "authors": ["Hisham Khalil", "Neil Fernandes", "Thomas M. Kwok", "Hsiu-Chin Lin", "Yue Hu"], "published": "2026-08-06", "summary": "Contact-rich manipulation requires precise tracking and mechanical compliance, where variable impedance control can improve robustness in task success, whereas static compliance cannot adapt to varying contact constraints. Variable impedance skills can be learned from demonstrations, avoiding complex modeling, but compliance is a hidden variable in force-agnostic kinematic data. While existing methods infer compliance from trajectory variations, these variations may reflect geometric adaptation and not intentional compliance when subject to changing spatial layouts. Therefore, this letter introduces Variable Impedance Diffusion Policy (VIDP), an imitation learning-based variable impedance control framework leveraging a Task-Parameterized Directionality-Aware Mixture Model (TP-DAMM) to extract physically consistent trajectory distributions from diverse demonstrations. By mapping distributions to stiffness profiles, VIDP jointly predicts pose actions and task compliance without force sensors. Real-world experiments show that VIDP significantly outperforms fixed-impedance baselines in task success rate while reducing interaction forces with respect to high stiffness controllers and tracking errors with respect to low stiffness baselines.", "pdf_url": "https://arxiv.org/pdf/2608.06210v1"}, {"title": "ErgoSurf: Ergodic Control for the Coverage of Unknown Surfaces", "authors": ["Stefan Schneyer", "Timo Bachmann", "Maged Iskandar", "Korbinian Nottensteiner", "Alin Albu-Schäffer", "Freek Stulp", "João Silvério"], "published": "2026-08-06", "summary": "Contact-centric tasks on surfaces, ranging from inspection and cleaning to sanding and polishing, require robots to systematically cover the surface while maintaining stable contact. Ergodic control generates trajectories that spend time at a location proportional to a desired, task-specific spatial distribution, enabling efficient information gathering and coverage. However, traditional ergodic control methods rely on prior knowledge of surface geometry or require a vision sensory input to scan the geometry beforehand, limiting their applicability in real-world scenarios with unknown or dynamic environments. This paper introduces a novel online ergodic control framework that achieves systematic surface coverage while simultaneously reconstructing unknown surface geometry. We employ a Gaussian Process Implicit Surface (GPIS) model that learns global surface geometry from intrinsic tactile sensing during execution. For efficient online planning, we approximate the surface locally using point clouds sampled from tangent planes at observed contact points and iteratively fit them to the Gaussian Process. This approximation simultaneously serves as the sampling domain for both the target and the coverage distributions. We employ a heat-diffusion analogy to compute potential fields that guide ergodic exploration, translating spatial coverage objectives into smooth robot trajectories. We demonstrate our framework through simulation and real-robot experiments, validating simultaneous ergodic coverage and online surface geometry learning with reconstruction errors approaching the ground truth.", "pdf_url": "https://arxiv.org/pdf/2608.06208v1"}, {"title": "EnvACE: Internalizing Environment Dynamics via World Rehearsal for Agentic Reinforcement Learning", "authors": ["Zishan Xu", "Zhiyuan Yao", "Yuxin Chen", "Yifu Guo", "Zhengxi Lu", "Yuquan Lu", "Jinyang Huang", "Yan Xu", "Yasheng Wang", "Weinan Zhang", "Xingshan Zeng", "Weiwen Liu"], "published": "2026-08-06", "summary": "Training large language model agents for long-horizon tool use typically relies on interactions with real or synthesized executable environments, whose construction and verification are costly, or on external simulators that are difficult to ground. We introduce EnvACE, an agentic reinforcement learning method that replaces external environment interaction during training with world rehearsal. The policy alternates between acting and rehearsal: it first generates a tool call, then plays the role of the environment to produce the response induced by that action, and conditions subsequent decisions on the rehearsed response. Both roles are jointly optimized end-to-end using task-success rewards. Through world rehearsal, the policy internalizes the relationship between actions and their environment responses in its parameters, yielding an agent world model that directly supports decision making. Across BFCL-v4, tau^2-Bench, VitaBench, and FinMCP-Bench, EnvACE achieves strong and transferable performance, outperforming environment-scaling baselines in the overall evaluation. Controlled studies further show that world rehearsal consistently improves policy learning across model scales. At test time, the internalized world model enables private rehearsal before committed execution, yielding further gains under a moderate rehearsal budget without additional external interaction. Our findings establish world rehearsal as a new path toward scaling LLM agent training beyond the constraints of external environments. Our code is publicly available at https://github.com/Within-yao/EnvACE.", "pdf_url": "https://arxiv.org/pdf/2608.06197v1"}, {"title": "Prior-SG: Task and Prior Driven Region Segmentation for Scene Graphs in Arbitrarily-Structured Environments", "authors": ["Giorgio Tonetti", "Laurent Kneip", "Abel Gawel", "Marco Hutter"], "published": "2026-08-06", "summary": "Hierarchical 3D scene graphs are a promising representation for high-level spatial reasoning in autonomous mobile platforms. However, existing extraction frameworks typically rely on purely local visual clustering or strict geometric heuristics, such as wall-separated rooms, which fail in open-plan or arbitrarily-structured environments. We propose Prior-SG, a task- and prior-driven framework that casts scene graph generation fundamentally as a probabilistic alignment problem. As the robot explores, it continuously aggregates an incoming RGB-D sensor stream into a physically grounded Instance Graph utilizing a multi-scale, open-vocabulary feature fusion strategy. The system then infers the high-level functional semantics of this map through a Maximum A Posteriori (MAP) estimate, guided by a Prior Graph-a logical expectation of the environment's structure and task-relevant vocabulary synthesized dynamically by a Large Language Model. By optimizing a Markov Random Field that fuses heterogeneous experts (visual, geometric, and discrete objects) with these topological priors, the system resolves local perceptual ambiguities. We validate this approach across diverse simulated residential datasets and large, open-plan real-world environments. Prior-SG achieves state-of-the-art semantic region segmentation accuracy compared to recent baselines, robustly delineates distant functional boundaries in the absence of physical walls, and uniquely provides zero-shot ontological flexibility, enabling the robot to entirely restructure its spatial partitioning based on a given high-level task.", "pdf_url": "https://arxiv.org/pdf/2608.06170v1"}, {"title": "BendTwin: Robust Dense-to-Sparse Physical Reconstruction with Bending-Aware Differentiable Spring-Mass Models", "authors": ["Yixiong Jing", "Qi Wang", "Lin Chen", "Junwei Jiang", "Guangming Wang", "Haibing Wu", "Olaf Wysocki", "Wanli Ma", "Brian Sheil"], "published": "2026-08-06", "summary": "Reconstructing objects with mechanical properties from video observations enables physically consistent dynamic prediction, benefiting robotics planning and interaction. Existing spring--mass based physical driven reconstruction approaches offer efficient and differentiable physical reconstruction, but they typically rely on axial springs alone. Such formulations oversimplify the underlying structural mechanics and can become mechanically under-constrained when the physical graph is coarsened, limiting their ability to preserve stable local deformation. We present BendTwin, a bending-aware differentiable spring--mass framework for video-based reconstruction and future prediction of deformable objects. BendTwin introduces bending stiffness and damping over local surface triplets, penalizing deviations from rest angles and regularizing higher-order deformation. These bending constraints improve mechanical stability while preserving the simplicity of spring--mass system. Experiments show that BendTwin consistently outperforms the axial-only PhysTwin baseline. Ablation studies further demonstrate that the bending constraints maintain system stability across different downsampling ratios and consistently improve upon the original PhysTwin formulation. Overall, BendTwin provides an effective approach for constructing mechanically faithful digital twins from sparse-view RGB-D videos.", "pdf_url": "https://arxiv.org/pdf/2608.06164v1"}, {"title": "iARCS: Iterative Agentic RL for Controllable 3D Scene Generation", "authors": ["Saugat Adhikari", "Ashok Prasad Neupane", "Pramish Paudel", "Ajad Chhatkuli", "Danda Pani Paudel"], "published": "2026-08-06", "summary": "Synthetic 3D scene generation is increasingly used as a data source for computer vision and embodied AI, but existing generators often optimize perceptual realism without reliably satisfying task-critical functional constraints. This mismatch limits the usefulness of synthetic data for downstream training, where accessibility, traversability, and spatial rule compliance are often essential. We present iARCS, an iterative agentic reinforcement learning framework that adapts a pretrained scene generator to natural-language task requirements. iARCS uses a two-stage strategy: universal-reward pretraining to improve physical plausibility and layout quality, followed by task-specific fine-tuning with LLM-generated reward programs that are iteratively refined from training feedback. Experiments show improved constraint fidelity on walkability, reachability, and clearance-focused tasks, effective task-specific constraint optimization, and competitive scene diversity. We further show that data generated by iARCS improves a base generator, supporting its value as a practical synthetic data generation tool rather than only a controllable scene editing method.", "pdf_url": "https://arxiv.org/pdf/2608.06161v1"}, {"title": "Visual Grounding in Zero-Shot Vision-Language Control", "authors": ["J. de Curtò", "Dayani Plasencia", "Diego Sánchez", "I. de Zarzà"], "published": "2026-08-06", "summary": "Vision-language models (VLMs) are increasingly used as zero-shot controllers, but successful trajectories do not necessarily show that decisions are grounded in visual input: simulator dynamics and conservative action priors can produce favourable scores without meaningful perception. We investigate this with an input-ablation battery: blind-image controls, repeated identical inputs, lane-axis reflection, non-visual baselines, and pipeline-integrity checks. Across nine direct-action models, six structured local VLMs, and an exploratory VLM-MPC hierarchy, we analyse 32,874 scored calls over two embodiments and three simulators. The direct-control results are largely negative: a constant-SLOW policy outperforms a scripted geometric controller, several models are image-invariant or nearly constant, and models that recognize longitudinal hazards still fail to transform LEFT and RIGHT under reflection. No local VLM meets the joint longitudinal and lateral grounding criteria. However, an image-only deterministic positive control estimates the lead gap with 0.090 m MAE and exact mirror equivariance, confirming the stimuli carry sufficient visual information; the failures are modular, not universal. A post-hoc, leakage-controlled symmetry-consensus guardian selects two models from 16 calibration frames and freezes a 2-of-4 hazard vote across original and reflected views. On 272 held-out frames it reaches 0.954 balanced accuracy (episode-cluster bootstrap 95% CI [0.895,0.990]); nested leave-one-episode-out recovers the same pair and threshold in all 12 folds. Abstaining on ties raises committed balanced accuracy to 0.973 at 0.824 coverage. With deterministic perception retaining lateral authority, offline modular replay achieves 0.934 action agreement and exact mirror equivariance. These results support current VLMs as bounded, selective hazard assistants, not monolithic zero-shot controllers.", "pdf_url": "https://arxiv.org/pdf/2608.06154v1"}, {"title": "Learning visual representations for compositional analysis of artworks and photographs", "authors": ["Fatemeh Behrad", "Tinne Tuytelaars", "Johan Wagemans"], "published": "2026-08-06", "summary": "Composition, the deliberate arrangement of visual elements, is central to how meaning, emotion, and aesthetic quality are conveyed in artwork, yet it remains among the least formalized dimensions of visual understanding. Prior work highlights a persistent gap in learning meaningful compositional representations, attributing it to semantic bias and suggesting that human-inspired approaches may be key. We compare two parallel paradigms for composition analysis: a human-inspired method grounded in perceptual grouping, and fine-tuned foundation models enabled by recent large-scale compositional datasets. The human-inspired approach uses object-centric models for region-level decomposition and a graph attention network to capture spatial relationships between elements. Both paradigms are evaluated on composition score/category prediction, compositional image retrieval, and visual saliency detection. With frozen encoders, the human-inspired method achieves competitive performance while remaining interpretable. When sufficient data enables fine-tuning, large self-supervised models outperform significantly, but at the cost of interpretability and cross-domain generalization.", "pdf_url": "https://arxiv.org/pdf/2608.06142v1"}, {"title": "SkillTFM: Gated Skill Evolution for Training-Free Adaptation of Tabular Foundation Models", "authors": ["Yi He", "Zhengkang Guan", "Anpeng Wu", "Peng Cui", "Fei Wu", "Kun Kuang"], "published": "2026-08-06", "summary": "Tabular data are ubiquitous in real-world applications and are crucial for data-driven prediction and decision-making across science, industry, finance, healthcare, and public services. Tabular foundation models (TFMs) have emerged as a promising paradigm for general-purpose tabular learning, offering reusable predictors across diverse datasets and substantially reducing the need for task-specific training, tuning, and model development. However, their practical deployment remains constrained by distribution shifts, heterogeneous feature semantics, and task-specific patterns that are difficult to capture without costly fine-tuning or additional labeled data. To this end, we propose SkillTFM, a training-free system that shifts TFM adaptation from parameter updates to the gated evolution of agentic skills. The core of SkillTFM is a verifiable and extensible skill bank that couples boundary evidence identification with gated skill evolution: the former characterizes task structure and base-model failure patterns, whereas the latter retrieves and extends reusable skills subject to explicit validation. Across simulated boundary settings and real-world electricity-price forecasting, SkillTFM improves AUC by 0.128--0.142, raises nonlinear-boundary AUC from 0.699 to 0.898. Furthermore, experiments across TFM backbones demonstrate the effectiveness and generality of SkillTFM.", "pdf_url": "https://arxiv.org/pdf/2608.06137v1"}, {"title": "Is Self-Pretraining really useful to improve diagnosis in medical Time Series?", "authors": ["Omar Coser", "Antonio Orvieto", "Paolo Soda", "Loredana Zollo"], "published": "2026-08-06", "summary": "Inspired by recent evidence that transformer architectures benefit from Self-PreTraining (SPT) on long-context benchmarks, we investigate whether similar gains extend to multimodal, multivariate, and even simple univariate medical time series. Our objective is to assess the impact of SPT on the performance and scalability of transformer-based models across diverse medical applications, particularly under limited data conditions. We evaluate transformer architectures on three representative medical time-series tasks: rehabilitation robotics (Camargo dataset), stress detection (Non-EEG Stress), and Parkinson's disease detection (Gait Parkinson's Disease). Models are trained either from scratch or through SPT using four masking-based objectives designed to promote temporal and cross-modal representation learning, and we systematically vary model depth to examine how capacity interacts with pre-training benefits. Across datasets and configurations, SPT consistently improves classification accuracy by 0-6 percentage points depending on masking strategy, dataset and architecture, with gains observed not only in multivariate settings but also when models are restricted to simple univariate inputs. The improvements increase for deeper models that can better exploit the enriched temporal representations learned during pre-training. These findings indicate that SPT is a simple and general strategy that enhances transformer performance on medical time-series tasks without requiring task-specific architectural changes, supporting its potential to improve robustness and accuracy in data-limited clinical settings.", "pdf_url": "https://arxiv.org/pdf/2608.06122v1"}, {"title": "Kastor: An efficient fine-tuning strategy for generative emulation of PDE simulations", "authors": ["Guillaume Couairon", "Alexis Jacq", "Yu-Han Wu", "Renu Singh", "Yana Hasson", "Quentin Berthet", "Romuald Elie"], "published": "2026-08-06", "summary": "Machine learning offers a promising avenue to accelerate physical simulations by replacing computationally expensive traditional Partial Differential Equation (PDE) solvers with fast, differentiable surrogate models. However, standard auto-regressive ML emulators often suffer from error accumulation over long horizons and struggle to capture the stochasticity of complex physical systems. In this paper, we propose Kastor, a comprehensive methodology to adapt a deterministic physics foundation model into a highly efficient and accurate generative surrogate. First, we introduce a two-stage inference scheme that combines a large-stride causal auto-regressive model with a non-causal temporal super-resolution network, significantly reducing error accumulation while minimizing computational cost. Second, we present Mean prediction regularization (MPR), a novel training objective that constrains the generative model to predict the deterministic distribution mean under null noise conditioning. This regularization dramatically improves the performance and stability of both Functional Generative Networks (FGN) and diffusion-based emulators. Finally, we demonstrate that incorporating spatial gradient matching improves the accuracy and physical fidelity of the simulations as measured by power spectrum density. Extensive evaluations on diverse simulation datasets of the benchmark The Well show that with these components, our model outperforms competing methods in forecasting accuracy, spectral consistency, and computational efficiency. Our model achieves a 42.9% average reduction in forecasting compared to our reference based on the Walrus finetuning methodology, and outperforms Walrus for 8 out of 10 datasets on variance-normalized RMSE (VRMSE).", "pdf_url": "https://arxiv.org/pdf/2608.06107v1"}, {"title": "IcFuzz: Fuzzing Isaac Sim with Semantic Stage Guidance and Multi-level Mutation", "authors": ["Zhixiang Chen", "Zhuangbin Chen", "Ruoxi Jia", "Zeqin Liao", "Wei Li", "Jinyang Liu", "Zibin Zheng"], "published": "2026-08-06", "summary": "Robotics simulators serve as a foundational infrastructure for embodied AI, facilitating safe and scalable robotic system development. NVIDIA Isaac Sim has emerged as one of the most popular simulators, distinguished by its GPU-accelerated physics engine and photorealistic rendering, which enable high-fidelity modeling of complex environments. However, its inherent complexity inevitably introduces software bugs that can compromise simulation reliability. Existing fuzzing approaches struggle to test Isaac Sim effectively due to challenges of context-aware object semantics, hierarchical simulation control, and a vast simulation state space. In this paper, we propose IcFuzz, the first fuzzing approach for Isaac Sim. IcFuzz first performs an LLM-based semantic stage segmentation, decomposing simulation programs into structured stages that capture context-aware object semantics. Guided by this information, IcFuzz designs multi-level mutation operators to systematically exercise the simulator across hierarchical granularities. To efficiently navigate the vast simulation state space, IcFuzz employs a multi-armed bandit algorithm to adaptively schedule mutation operators. Experimental results show that IcFuzz outperforms the baselines in terms of both code coverage and bug detection. Specifically, IcFuzz achieves approximately 190\\%--205\\% of the code coverage of the baselines and detects an average of 3.7 unique crashes over three rounds of 12-hour tests, while no crashes are detected by the baselines. Moreover, IcFuzz has uncovered 11 bugs over approximately four months, 9 of which have been confirmed or fixed by the developers.", "pdf_url": "https://arxiv.org/pdf/2608.06088v1"}, {"title": "Topometric Autonomous Vehicle Localization by Combining Visual Embeddings and Feed-Forward 3D Models", "authors": ["Eulogio Quemada-Torres", "Alberto Jaenal", "Francisco-Angel Moreno", "Javier Gonzalez-Jimenez"], "published": "2026-08-06", "summary": "Effective Visual Localization (VL) requires a map of the environment that combines compactness for efficient scalability with robustness against visual appearance changes and metric precision. Through low-dimensional image embeddings, Visual Place Recognition (VPR) is able to successfully meet the first two requirements, but its low metric accuracy makes it less suitable than standard VL approaches based on local features or neural representations. This limitation can be overcome by integrating VPR with the accurate local trajectory estimates produced by feed-forward neural 3D geometry (FF3D) models. In this paper, we address sequential appearance-based localization through a topometric framework that iteratively combines probabilistic VPR with FF3D metric pose estimation in controlled image sets. Our approach proposes an automatic offline mapping tool that models the topometric pose-appearance interaction in the different parts of the scene. This map is later employed by an online particle filter that estimates the pose from odometry and belief over places for FF3D inference, successfully incorporating neural metric estimation into probabilistic appearance-based localization. We extensively evaluate the framework on three known benchmarks, demonstrating substantial improvements over existing appearance-based methods. The modularity of our approach allows the descriptor extractor and FF3D model to remain interchangeable, and a focused analysis further shows that sequential belief can mitigate severe failures under perceptual aliasing.", "pdf_url": "https://arxiv.org/pdf/2608.06021v1"}, {"title": "From Economic Agents to Agentic Economies: A Systems Blueprint for Economic World Models", "authors": ["Jiale Han", "Xiang Li", "Jing Qian", "Wenyuan Gu", "Pin Gao", "Ye Luo", "Hongyuan Zha", "Dacheng Tao", "Benyou Wang", "Lin William Cong"], "published": "2026-08-06", "summary": "Economic World Models (EWMs) are generative economic models that simulate how economies evolve from within by modeling heterogeneous agents, their beliefs and actions, and the market and institutional mechanisms through which their interactions produce aggregate outcomes. This paper develops an implementation roadmap for building economic world models as generative engines in which heterogeneous agents act, interact, adapt, and co-evolve with markets and institutions, thereby producing economic dynamics from the inside. We organize EWM systems into a six-level capability ladder, from fixed rule-based agent worlds to adaptive and LLM-based agent worlds, self-evolving agents, evolving institutional worlds, and sim-to-real economic twins aligned with real observations. A systematic literature survey across these levels reveals that existing work remains concentrated in lower-level agent and simulation environments, while systems with self-evolving agents, endogenous institutions, persistent empirical alignment, and validated economic mechanisms remain rare. By translating the EWM agenda into an implementation blueprint, this paper aims to accelerate the development of the next generation of economic simulation environments that can serve as high-fidelity sandboxes for human decision-makers and as training, planning, evaluation, and safety substrates for AI agents. We release a curated paper list and related resources to support future research.", "pdf_url": "https://arxiv.org/pdf/2608.06020v1"}, {"title": "Adaptive-WAM: Quality-Guided Early-Exit Planning from Intermediate Video-Diffusion Features", "authors": ["Sining Ang", "Yuguang Yang", "Yan Wang"], "published": "2026-08-06", "summary": "Large video diffusion models provide rich spatiotemporal priors for autonomous driving, but existing world-action models often inherit the cost of iterative future-video generation even though deployment only requires an ego trajectory. We ask a more basic question: how much of a video diffusion model must be executed to make a reliable driving decision? Through a controlled study of video denoising timesteps and Diffusion Transformer (DiT) depth, we find that planning performance is largely insensitive to the tested video-noise levels, whereas strong trajectories can already be decoded from intermediate layers. Based on this observation, we introduce Adaptive-WAM, a quality-aware multi-exit planner built on a Wan2.2-5B backbone. Trajectory diffusion heads are attached to selected DiT blocks, and a lightweight trajectory-quality scorer terminates inference once the best trajectory decoded so far satisfies a quality threshold; otherwise, computation continues from the cached hidden state to a deeper exit. The deployed planner therefore avoids the iterative classifier-free denoising loop and VAE decoding required for future-video synthesis, while dynamically allocating backbone depth according to trajectory quality. On NAVSIM, the adaptive single-trajectory planner achieves 90.8 PDMS; a separate fixed-exit variant reaches 92.6 PDMS with 64 proposals. It further obtains 89.9 EPDMS on NAVSIM v2, yielding the best reported results among the compared front-view video world-model planners. Without target-domain fine-tuning, Adaptive-WAM transfers to nuScenes with 0.88 m average L2 error and a 0.08\\% collision rate. On an A100, adaptive routing improves PDMS from 90.62 to 90.79 while averaging 170 ms end-to-end planning latency, approximately 10\\% below the 190 ms fixed block-15 planner and 47\\% below the 320 ms fixed full-depth planner. Code will be released.", "pdf_url": "https://arxiv.org/pdf/2608.06008v1"}, {"title": "Do Tabular Foundation Models Agree with Themselves?", "authors": ["Christian Klötergens", "Vijaya Krishna Yalavarthi", "Lars Schmidt-Thieme", "Tom Hanika"], "published": "2026-08-06", "summary": "Tabular Foundation Models (TFMs) are
