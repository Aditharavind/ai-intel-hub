g.<\/p><p><strong>Is the <\/strong><a href=\"https://robotsguide.com/robots/perseverance\" target=\"_blank\"><strong>Perseverance rover<\/strong><\/a><strong>, which is nine years younger than Curiosity, significantly different in terms of its hardware and software?<\/strong><\/p><p><strong>Holloway: <\/strong>In terms of hardware, the rovers are actually very similar. Both use a <a href=\"https://www.baesystems.com/en/article/bae-systems-rad750--single-board-computers-guide-insight-mars-landing\" target=\"_blank\">RAD 750 processor<\/a> and have the same amount of memory. However, Perseverance has an extra processor specifically for visual odometry, which allows it to drive autonomously. <a href=\"https://www.youtube.com/watch?v=Q_P0swqaZDk\" rel=\"noopener noreferrer\" target=\"_blank\">This difference reflects their primary mission designs<\/a>: Perseverance was designed for driving long distances, while Curiosity is a mission focused on sampling as it goes. So Perseverance’s onboard scheduling capabilities are there to optimize its driving. In fact, just last year, Perseverance surpassed <a href=\"https://science.nasa.gov/mission/msl-curiosity/location-map/\" rel=\"noopener noreferrer\" target=\"_blank\">Curiosity’s driving distance<\/a> after only about three years on Mars.<\/p><h2>Curiosity Rover Memory and Software Fixes<\/h2><p><strong>Do you have some examples of significant tweaks the team has made to keep Curiosity roving?<\/strong><\/p><p><strong>Holloway: <\/strong>One of my favorite examples comes from a <a href=\"https://science.nasa.gov/blog/sol-2204-curiosity-science-is-baaaack/\" rel=\"noopener noreferrer\" target=\"_blank\">processor anomaly<\/a> that happened on Sol 2172 [Ed. note: “Sol” is the term for a Martian day—about 24 hours and 40 minutes]. Curiosity has two computers, A and B. We landed on A, swapped to B due to <a href=\"https://llis.nasa.gov/lesson/11201\" rel=\"noopener noreferrer\" target=\"_blank\">a NAND memory anomaly early on (Sol 200)<\/a>. For years, we were chugging along on B, until one day there was a problem—B booted up, but it couldn’t mount its drive partition. We’d never seen this before. To preserve B’s data, we swapped back to A, which we hadn’t trusted in two thousand Sols. A also had a degraded memory, with only two gigabytes of usable storage space instead of four. We painstakingly transferred data from B over to A and then down to Earth, and eventually we ran out of stuff we wanted to transfer, which was really good, because A then started acting funny in the same way it did on Sol 200. It was acting like its memory was coming unsoldered. That’s bad. <\/p><p>We quickly swapped back to B, formatted it, and got it working again. The problem then became that we couldn’t trust A’s memory at all, but we needed a second computer as a “lifeboat” for diagnostics and transfers if B failed again. We realized we had one other place of memory: where we keep our flight software. We have four copies of the flight software (two current versions and two older versions) in different banks of very small amounts of memory, just 32 megabytes each. What if we just jettisoned the old flight software copies and used that 64-megabyte NOR memory as our file system for computer A? <\/p><p>So <a href=\"https://ieeexplore.ieee.org/document/9697661\" rel=\"noopener noreferrer\" target=\"_blank\">that’s what we did<\/a>. It was so elegant! Computer A is operating with less than 1 percent of its original memory, but we can run a mission on it. A small mission, but we haven’t had to jettison any core capabilities. We can still drive, we can manage data, we can even theoretically do science. Everything works fine, just much slower and much smaller. That flight software release was even called “<a href=\"https://www.computer.org/csdl/proceedings-article/smc-it/2021/856000a007/1ANLcTE5g3e\" rel=\"noopener noreferrer\" target=\"_blank\">R-Hope<\/a>“ because we hoped it would work.<\/p><p><strong>What are the constraints on Curiosity’s lifespan?<\/strong><\/p><p><strong>Holloway: <\/strong>Our biggest hardware challenge is <a href=\"https://spectrum.ieee.org/if-necessary-mars-rover-curiosity-could-rip-its-own-wheels-off-to-stay-mobile\" target=\"_self\">wheel wear<\/a>. It looks like we’re driving on this sandy terrain with some rocks in it, and our intuition said that we could just drive over these rocks and they’d get pushed down into the sand and it would be no big deal. But what we ended up seeing was that those little rocks are actually the tips of giant boulders buried in the sand, and they’re razor sharp. Our wheels were getting ripped apart driving over them, especially our front wheels, so <a href=\"https://www.jpl.nasa.gov/news/curiosity-adds-reverse-driving-for-wheel-protection/\" rel=\"noopener noreferrer\" target=\"_blank\">we started driving backwards<\/a>.<\/p><p>We also monitor consumables. We consider the number of times we move our actuators. That’s a consumable. Curiosity hasn’t <a href=\"https://www.nasa.gov/image-article/curiositys-dusty-selfie/\" rel=\"noopener noreferrer\" target=\"_blank\">taken a selfie<\/a> in a while, and one of the reasons is that it’s really hard on the joint actuators. Our onboard memory is a consumable, but surprisingly we’re not anywhere near our life cycle for memory. Our biggest consumable is power; we have an <a href=\"https://mars.nasa.gov/internal_resources/788/\" rel=\"noopener noreferrer\" target=\"_blank\">RTG<\/a>, a nuclear power source, which decreases its output as it ages.<\/p><p>Newer missions are flying <a href=\"https://www.qualcomm.com/snapdragon/overview\" rel=\"noopener noreferrer\" target=\"_blank\">Snapdragon<\/a> [processors], but Curiosity’s RAD 750 is a power hog. One of the things that we’ve rolled out that’s going really well is a way of reducing the amount of time we spend with the computer powered on, by harvesting time when we finish activities early and going to sleep, which lets us turn off the computers and some of the heating. Another thing we’re looking at is doing stuff in parallel when we’re on, like being able to drive or use the arm while communicating with an orbiter. <\/p><p>So power is decreasing, and that’s causing us to do all this parallelism work and become more efficient and nuanced in the way we operate. But we are not having any degraded science output at this time. Our wheels are still going, our arm is still okay for now, knock on wood. I would say maybe the bottleneck is budget.<\/p><h2>Curiosity Rover’s Impact on Future Mars Exploration<\/h2><p><strong>What have you learned from Curiosity that will improve future missions?<\/strong><\/p><p><strong>Holloway: <\/strong>As an embedded flight software person, I think about how we can change, add, or modify software capabilities during the mission. There’s definitely a sweet spot for loading and patching flight software—some of these concepts were pioneered on Spirit and Opportunity and then inherited by Curiosity and Perseverance, making it easier to understand and change the software.<\/p><p>Some of the things that I wish we had now on [the Mars Science Laboratory] include a better understanding of where our power is going. I want to see how much power each component is drawing every minute, so that we could architect a software system that could balance loads better. We have some of this information that was built in by the engineers who designed the rover, but as an operator, I want something slightly different. So if I were building a mission, I would have those discussions earlier and get operators into the room to say, “what do you want your data products to look like?”<\/p><p>The key takeaway for designing future missions is to talk to all your users early in the design process. It needs to happen upfront.<\/p><p><strong>What does Curiosity’s long-term future look like?<\/strong><\/p><p><strong>Holloway: <\/strong>That’s a conversation that happens, and it’s a really delicate one. We have a lot of science instruments, and a lot of them have to do with contact science and sampling and rely on the arm. If we lose the arm, what science can we still do? Well, we have a lot of remote sensors too, like cameras, environmental sensors, and radiation sensors. All of these things are important for the future of space exploration and humans on Mars. <\/p><p>From a power perspective, our RTG is projected to start degrading science output in the sixth extended mission, but we’re going to be fine through 2035 and potentially even beyond that. So we have a long and exciting future ahead of us. We need to figure out the best way of operating within our constraints, but we’re still kicking.<\/p>"}, {"title": "Walmart, Wing add 7 markets in drone delivery expansion", "source": "Robotics Business Review", "date": "2026-06-09", "url": "https://www.therobotreport.com/walmart-wing-add-7-markets-in-drone-delivery-expansion/", "summary": "<p>Wing plans to bring drone deliveries to Memphis, New Orleans, Philadelphia, Phoenix, San Diego, San Francisco, and Salt Lake City.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/walmart-wing-add-7-markets-in-drone-delivery-expansion/\">Walmart, Wing add 7 markets in drone delivery expansion<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Effort to establish a National Commission on Robotics advances in Congress", "source": "Robotics Business Review", "date": "2026-06-09", "url": "https://www.therobotreport.com/effort-establish-national-commission-on-robotics-advances-congress/", "summary": "<p>As the proposed National Commission on Robotics advances, industry leaders continue to call for more unified U.S. policy.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/effort-establish-national-commission-on-robotics-advances-congress/\">Effort to establish a National Commission on Robotics advances in Congress<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Standard Bots raises $200M to expand U.S. manufacturing footprint", "source": "Robotics Business Review", "date": "2026-06-09", "url": "https://www.therobotreport.com/standard-bots-raises-200m-expand-u-s-manufacturing-footprint/", "summary": "<p>Standard Bots asserted that investments in robotics are key to making U.S. manufacturing competitive on the global stage.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/standard-bots-raises-200m-expand-u-s-manufacturing-footprint/\">Standard Bots raises $200M to expand U.S. manufacturing footprint<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "ACS raises $200M to scale autonomous counter-drone system", "source": "Robotics Business Review", "date": "2026-06-08", "url": "https://www.therobotreport.com/allen-control-systems-raises-200m-for-autonomous-weapons-stations/", "summary": "<p>Allen Control Systems will use the funding to scale manufacturing and accelerate deployment of its autonomous weapon station, Bullfrog.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/allen-control-systems-raises-200m-for-autonomous-weapons-stations/\">ACS raises $200M to scale autonomous counter-drone system<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Daimon Robotics and Galbot jointly launches RobOmni for benchmarking tactile perception and dexterous manipulation", "source": "Robotics Business Review", "date": "2026-06-08", "url": "https://www.therobotreport.com/daimon-robotics-and-galbot-jointly-launches-robomni-for-benchmarking-tactile-perception-and-dexterous-manipulation/", "summary": "<p>Embodied AI is evolving from vision-centric perception toward Physical AI.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/daimon-robotics-and-galbot-jointly-launches-robomni-for-benchmarking-tactile-perception-and-dexterous-manipulation/\">Daimon Robotics and Galbot jointly launches RobOmni for benchmarking tactile perception and dexterous manipulation<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "NVIDIA and LG Group Build an AI Factory to Advance Physical AI, Mobility and AI Infrastructure", "source": "NVIDIA Robotics", "date": "2026-06-08", "url": "https://blogs.nvidia.com/blog/nvidia-and-lg-group-ai-factory/", "summary": "NVIDIA and LG Group are building an AI factory to accelerate LG Group’s next wave of AI-driven businesses, spanning robotics, autonomous driving, data center technologies and GPU cloud services. The AI factory will provide LG Group with accelerated computing infrastructure to train, simulate, validate and deploy AI-based applications across its key businesses.  The collaboration brings [&#8230;]"}, {"title": "AGIBOT holds World Challenge 2026 to see how AI models perform on real tasks", "source": "Robotics Business Review", "date": "2026-06-07", "url": "https://www.therobotreport.com/agibot-holds-world-challenge-2026-see-how-ai-models-perform-real-tasks/", "summary": "<p>AGIBOT said the industry is moving beyond simulation scores toward closed-loop testing on real robots with real tasks.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/agibot-holds-world-challenge-2026-see-how-ai-models-perform-real-tasks/\">AGIBOT holds World Challenge 2026 to see how AI models perform on real tasks<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "NVIDIA and Doosan Group Collaborate to Advance Physical AI and AI Factory Infrastructure", "source": "NVIDIA Robotics", "date": "2026-06-07", "url": "https://blogs.nvidia.com/blog/nvidia-and-doosan-group-physical-ai/", "summary": "NVIDIA and Doosan Group are expanding their collaboration to advance new opportunities across physical AI, robotics and AI factory infrastructure, spanning Doosan Robotics, Doosan Bobcat, Doosan Enerbility and Doosan Corporation Electro-Materials BG. The collaboration will bring together NVIDIA’s full-stack accelerated computing platforms with Doosan Group’s capabilities in industrial automation, power generation and advanced electronics materials [&#8230;]"}, {"title": "Robots can enhance manufacturing workers rather than replace them", "source": "Robotics Business Review", "date": "2026-06-06", "url": "https://www.therobotreport.com/robots-can-enhance-manufacturing-workers-rather-than-replace-them/", "summary": "<p>With the right AI, teleoperation, and safeguards, robotics can augment manufacturing opportunities, says one to ONE Holdings' president.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/robots-can-enhance-manufacturing-workers-rather-than-replace-them/\">Robots can enhance manufacturing workers rather than replace them<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Video Friday: Watch This Running Robot Not Fall Down Stairs", "source": "IEEE Spectrum Robotics", "date": "2026-06-05", "url": "https://spectrum.ieee.org/video-friday-humanoid-robot-running", "summary": "<img src=\"https://spectrum.ieee.org/media-library/humanoid-robot-running-down-stone-steps-in-a-green-park.gif?id=66866536&amp;width=1245&amp;height=700&amp;coordinates=0%2C0%2C0%2C0\" /><br /><br /><p>Video Friday is your weekly selection of awesome robotics videos, collected by your friends at <em>IEEE Spectrum<\/em> robotics. We also post a weekly calendar of upcoming robotics events for the next few months. Please <a href=\"mailto:automaton@ieee.org?subject=Robotics%20event%20suggestion%20for%20Video%20Friday\">send us your events<\/a> for inclusion.<\/p><h5><a href=\"https://roboticsconference.org/\">RSS 2026<\/a>: 13–17 July 2026, SYDNEY<\/h5><h5><a href=\"https://mrs.fel.cvut.cz/summer-school-2026/\">Summer School on Multi-Robot Systems<\/a>: 29 July–4 August 2026, PRAGUE<\/h5><h5><a href=\"https://actuate.foxglove.dev/\">Actuate 2026<\/a>: 18–19 August 2026, SAN FRANCISCO<\/h5><p>Enjoy today’s videos!<\/p><div class=\"horizontal-rule\"><\/div><div><span style=\"display: none;\"> <\/span><\/div><p class=\"rm-anchors\" id=\"sqlsazqkgak\">It’s been a while since a humanoid robot video actually impressed me, but the beginning of this does. <\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>Hard to know how much of that recovery was luck, though.<\/p><p>[ <a href=\"https://www.deeprobotics.cn/en\">Deep Robotics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"24itn9kfhfs\"><em>When you’re very confident in your MPC-based balance controller...<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>I feel you, buddy. And thanks for posting this. We’ve all been there, in one way or another.<\/p><p>[ <a href=\"https://groups.cs.umass.edu/daros/sample-home-page/\">DARoS Lab<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"acfgwbab5ei\"><em>GENE01 designed from scratch and sent to batch production. Two scalable lower bodies. Physical AI deployed for motor control and world-action modeling. All in three months. Generative Bionics is running.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://gbionics.ai/\">Generative Bionics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"1o8te5fjsd0\"><em>Alex, the newest humanoid robot built entirely by ‪IHMCRobotics‬, takes its first steps outdoors! This was a significant milestone for our team, especially because Alex is the first humanoid robot developed entirely by IHMC Robotics to venture outside the lab. These outdoor trials were conducted in preparation for a demonstration in Maryland, where Alex later successfully walked completely untethered.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.ihmc.us/news20251119/\">IHMC<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"oxtcmmw63t4\"><em>Built on the Enlight platform, Flexiv Mico is a compact dual-arm system engineered for safe, seamless collaboration in any workspace.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://flexiv.com/product/robot-system\">Flexiv Robotics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"gvbyvkp6k5s\">Is it weird that I’m jealous that robots can have feet that are swappable?<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://bostondynamics.com/products/atlas/\">Boston Dynamics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"w4daoeu3aas\"><em>Midweek at ICRA 2026. Cable-climbing robots that work as a squad: CCRobot-S is a team of robots with reconfigurable cable-driven manipulation that collaboratively inspect and maintain long-span bridge stay cables. Parallel operation for speed, morphological reconfiguration for reach.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://ieeexplore.ieee.org/document/11196028/\">IEEE Transactions on Robotics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"2xajzq8v9p8\">I would love to know the story behind this odd choice of hat.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://github.com/ROBOTIS-GIT\" target=\"_blank\">Robotis <\/a>]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"qyy-bwbpxbi\"><em>How did Atlas learn football—and why? Go behind the scenes of <a href=\"https://spectrum.ieee.org/the-evolution-of-robot-soccer\" target=\"_blank\">School of Football<\/a> and discover a glimpse of the Next of robotics.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>What I really want to know is, what kinds of things is it possible to do in football (<a href=\"https://spectrum.ieee.org/video-friday-rabona-soccer\" target=\"_blank\">soccer<\/a>) when your robot’s joints are not constrained by biology?<\/p><p>[ <a href=\"https://bostondynamics.com/blog/can-football-teach-a-robot-to-move/\">Boston Dynamics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div>"}, {"title": "Why deterministic real-time systems are more critical than ever in robotics", "source": "Robotics Business Review", "date": "2026-06-05", "url": "https://www.therobotreport.com/qnx-why-deterministic-real-time-systems-are-more-critical-than-ever-robotics/", "summary": "<p>Winston Leung discusses the role of QNX in robotics and AI, focusing on safety, innovation, and industry trends.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/qnx-why-deterministic-real-time-systems-are-more-critical-than-ever-robotics/\">Why deterministic real-time systems are more critical than ever in robotics<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "NVIDIA Research Unlocks Advanced Grasping, Smarter Autonomous Driving and Agent Training at Scale", "source": "NVIDIA Robotics", "date": "2026-06-03", "url": "https://blogs.nvidia.com/blog/cvpr-research-grasping-driving-agent-training/", "summary": "What makes a robot gripper useful isn’t that it can pick up one object — it’s that it can pick up the next one, and the one after that, with a tool it’s never held before.  What makes an autonomous vehicle system safe isn’t just that it can reason through a situation — it’s that [&#8230;]"}, {"title": "NVIDIA Enables the Next Era Of Physical AI Research With Agent Skills For Autonomous Vehicles, Robotics And Vision AI", "source": "NVIDIA Robotics", "date": "2026-06-03", "url": "https://blogs.nvidia.com/blog/cvpr-physical-ai-research-agent-skills/", "summary": "At CVPR, NVIDIA is unveiling new physical AI agent skills that help researchers and developers speed the development of autonomous vehicles, robots and vision AI systems. The core challenge in physical AI research isn’t simply developing stronger models. It’s building a full workflow around them — reconstructing real-world scenes, generating edge-case scenarios, training policies, evaluating [&#8230;]"}, {"title": "NVIDIA Jetson Brings Agentic AI to the Physical World", "source": "NVIDIA Robotics", "date": "2026-06-02", "url": "https://blogs.nvidia.com/blog/jetson-agentic-ai-physical-world/", "summary": "Agentic AI is getting physical. At COMPUTEX on Tuesday, NVIDIA announced NVIDIA JetPack 7.2 and NVIDIA NemoClaw support on NVIDIA Jetson. JetPack 7.2 brings agentic AI skills, Yocto project support, NVIDIA CUDA 13 on NVIDIA Jetson Orin, a substantial performance gain on Jetson AGX Orin 32GB module and Multi-Instance GPU (MIG) support on NVIDIA Jetson [&#8230;]"}, {"title": "NVIDIA Factory Operations Blueprint Gives Factories a New AI Brain", "source": "NVIDIA Robotics", "date": "2026-06-01", "url": "https://blogs.nvidia.com/blog/factory-operations-fox-blueprint-ai-brain/", "summary": "As factories move from isolated automation to plant-wide intelligence, manufacturers need AI systems that can connect live machine signals, quality systems, work instructions and operational alerts into a unified decision layer.  Today at GTC Taipei at COMPUTEX, NVIDIA announced the NVIDIA Factory Operations Blueprint (FOX) — a reference design for building an autonomous factory manager [&#8230;]"}, {"title": "How Cosmos 3 Helps Physical AI Think Before It Acts", "source": "NVIDIA Robotics", "date": "2026-06-01", "url": "https://blogs.nvidia.com/blog/cosmos-3-physical-ai-open-world-foundation-model/", "summary": ""}, {"title": "This DIY Bipedal Robot Used Pneumatic “Air-Muscles” Instead of Motors", "source": "IEEE Spectrum Robotics", "date": "2026-05-31", "url": "https://spectrum.ieee.org/shadow-walker-biped-humanoid-robot", "summary": "<img src=\"https://spectrum.ieee.org/media-library/two-photos-of-a-prototype-humanoid-robot-with-a-wooden-frame-and-wires-and-other-components-strung-on-its-body.jpg?id=66825613&amp;width=1245&amp;height=700&amp;coordinates=0%2C187%2C0%2C188\" /><br /><br /><p>In 1987, <a href=\"https://shadowrobot.com/the-story-of-our-founder-richard-greenhill/\" rel=\"noopener noreferrer\" target=\"_blank\">Richard Greenhill<\/a>, a British photographer who was fascinated by (but had no actual training in) robotics, decided he wanted to build a life-size humanoid that could do useful things, like carrying luggage. He was working at a startup called Intergalactic Robots, but he couldn’t convince anyone there to build such a machine, so he set about building one himself, in his attic.<\/p><div class=\"rm-embed embed-media\"><\/div><p>To help with his project, he organized a weekly get-together of a dozen or so like-minded folks. Every Wednesday night, his wife, Sally, would make a big pot of spaghetti, and the group would tinker with components scavenged from old printers and picked up from junkyards. They called themselves the Shadow Group. They eventually constructed several different robots, but their main project was the two-legged Shadow Walker.<\/p><p class=\"shortcode-media shortcode-media-rebelmouse-image\"> <img alt=\"Two color photos of a casually dressed white man in a workroom posing with a partially assembled wooden robot.\" class=\"rm-shortcode\" id=\"b189a\" src=\"https://spectrum.ieee.org/media-library/two-color-photos-of-a-casually-dressed-white-man-in-a-workroom-posing-with-a-partially-assembled-wooden-robot.jpg?id=66825888&amp;width=980\" /> <small class=\"image-media media-caption\">In 1987, photographer Richard Greenhill organized a weekly gathering of DIY enthusiasts to work on projects in his attic, including the Shadow Walker. <\/small><small class=\"image-media media-photo-credit\">Richard Greenhill and David Buckley<\/small><\/p><p>Greenhill’s friend <a href=\"https://davidbuckley.net/DB/aboutme.htm\" target=\"_blank\">David Buckley<\/a>, a robotics and animatronics expert he’d met at Intergalactic, sketched out a rough design based on medical textbooks of human bone structure and muscle movement. The robot’s skeleton, made of maple, was greatly simplified—only one bone in the lower leg and a single wide toe on each foot. The ankle’s double-axis design allowed for two degrees of movement. The knee had no complicating kneecap.<\/p><p>Greenhill didn’t want the robot to use motors, so its movement was controlled using compressed air to extend and contract 28 “air-muscles”—his version of a McKibben muscle, invented in the 1950s to mimic musculature with pneumatics. The muscles were connected to the bones across eight joints (hips, knees, ankles, toes), which provided 12 degrees of freedom.<\/p><p class=\"ieee-inbody-related\">RELATED: <a href=\"https://spectrum.ieee.org/the-short-strange-life-of-the-first-friendly-robot\" target=\"_self\">The Short, Strange Life of the First Friendly Robot<\/a><\/p><p>The robot’s headless torso held the control valves, electronics, and computer interfaces. It stood 168 centimeters tall and 46 cm wide and weighed about 38 kilograms. The group managed to get the robot to stand up reliably and balance itself; it could even regain its center if pushed a little. But walking turned out to be more of a challenge.<\/p><p><a href=\"https://www.linkedin.com/in/walkerrich/\" target=\"_blank\">Rich Walker<\/a> joined the group as a teenager and began writing software to get the robot to stand. He was particularly interested in using neural networks to solve balancing problems, although he ran into a number of hardware obstacles, including the unreliability of the sensors and the valves, and the robot’s overall fragility. Over time, Walker and the team developed a standard library of routines to control the robot. Walker wrote a <a href=\"https://davidbuckley.net/DB/ShadowBiped/ShadBipedArchive/Shadow%20Robot%20Company%20Shadow%20Biped.htm\" target=\"_blank\">detailed description<\/a> of the Shadow Walker in 1999, which is available on David Buckley’s website.<\/p><h2>The 1st International Robot Olympics<\/h2><p>By the time the Shadow Group began developing Shadow Walker, engineers in academia and industry had been working on robotics for several decades. The world’s first industrial robot, the <a href=\"https://spectrum.ieee.org/unimation-robot\" target=\"_self\">Unimate<\/a>, debuted in 1961, and in 1967 Donald Michie and others began building a series of <a href=\"https://spectrum.ieee.org/freddy-robot-british-ai-winter\" target=\"_self\">Freddy <\/a>robots to investigate machine intelligence. The IEEE created its first dedicated robotics organization in 1984 when it established the IEEE Robotics and Automation Council, which became the <a href=\"https://www.ieee-ras.org/\" target=\"_blank\">IEEE Robotics and Automation Society<\/a> in 1987. Also in 1987, the nonprofit International Federation of Robotics was established to promote research, development, use, and cooperation in the field of robotics.<\/p><p>As Shadow Walker pushed the limits for a DIY humanoid robot, industrial humanoids were also gaining ground. In 1986, Honda began working on its experimental (E-series) and later the prototype (P-series) humanoid robots, finally unveiling the P2 in 1996. The P2 stood 183 cm tall and weighed 210 kg. It was the first humanoid capable of stable, autonomous walking. This work eventually led to the development of the groundbreaking <a href=\"https://spectrum.ieee.org/honda-p2-robot-ieee-milestone\" target=\"_self\">ASIMO<\/a>.<\/p><p class=\"shortcode-media shortcode-media-rebelmouse-image\"> <img alt=\"Two color photos of a casually dressed bearded white man posing with a wooden robot leg and with a computer and other equipment.\" class=\"rm-shortcode\" id=\"45b6e\" src=\"https://spectrum.ieee.org/media-library/two-color-photos-of-a-casually-dressed-bearded-white-man-posing-with-a-wooden-robot-leg-and-with-a-computer-and-other-equipment.jpg?id=66826216&amp;width=980\" /> <small class=\"image-media media-caption\">Greenhill’s friend, roboticist David Buckley, consulted medical textbooks to create Shadow Walker’s humanoid design.<\/small><small class=\"image-media media-photo-credit\">Richard Greenhill and David Buckley<\/small><\/p><p>In the late 1980s, the public was both fascinated and horrified by the potential of robots. Businesses saw robots as a way to increase productivity, while workers worried they would take their jobs. Children viewed them as wondrous toys, while people with disabilities embraced them as tools of liberation. Military experts hoped robots would fight wars without endangering human soldiers, while politicians pondered if robots might eventually get to vote. Philosophers thought robots could challenge our notions of intelligence (and stupidity), while the religious struggled with concerns about the human race in a robot-dominated future.<\/p><p class=\"shortcode-media shortcode-media-rebelmouse-image rm-float-left rm-resized-container rm-resized-container-25\" style=\"float: left;\"> <img alt=\"Photo of two articulated feet made of pieces of wood strung with wires and other components.\" class=\"rm-shortcode\" id=\"528f6\" src=\"https://spectrum.ieee.org/media-library/photo-of-two-articulated-feet-made-of-pieces-of-wood-strung-with-wires-and-other-components.jpg?id=66835726&amp;width=980\" /> <small class=\"image-media media-caption\">Shadow Walker’s simplified anatomy included only one bone in the lower leg and a single wide toe on each foot.<\/small><small class=\"image-media media-photo-credit\">Science Museum Group<\/small><\/p>Peter Mowforth, cofounder of the <a href=\"https://en.wikipedia.org/wiki/Turing_Institute\" target=\"_blank\">Turing Institute<\/a> in Glasgow, noted these disparate visions for robots when he announced the 1st International Robot Olympics, to be held in 27 and 28 September 1990 and hosted by the Turing Institute and the University of Strathclyde. The Olympics would round up the world’s best robots and showcase them head-to-head.<p>Mowforth himself thought all of the competing visions of robots were overblown. Steeped in machine learning research and robotics development, he knew firsthand the limitations of the state of the art: Robots rarely worked as intended, easily broke down, and glitched over seemingly trivial problems. He envisioned the Robot Olympics as a testbed to assess what the latest generation of robots could and could not do.<\/p><p class=\"shortcode-media shortcode-media-rebelmouse-image rm-float-left rm-resized-container rm-resized-container-25\" style=\"float: left;\"> <img alt=\"Photo of a headless and armless humanoid robot wearing red pants.\" class=\"rm-shortcode\" id=\"3135a\" src=\"https://spectrum.ieee.org/media-library/photo-of-a-headless-and-armless-humanoid-robot-wearing-red-pants.jpg?id=66826230&amp;width=980\" /> <small class=\"image-media media-caption\">At the 1990 Robot Olympics, held in Glasgow, Shadow Walker wore pants to conceal its pneumatic “air-muscles” from competitors.<\/small><small class=\"image-media media-photo-credit\">Adam Hart-Davis/Science Source<\/small><\/p><p>The call for participation was wide open. Instead of having predetermined categories of competition, the organizers opted to see who applied to compete and then group them based on their claimed capabilities. In addition to picking the winners of individual events, the judges would select an overall Olympic champion based on the quality of the hardware, the sophistication of behavior, and novelty. Other prizes were given for young competitors, technologies that showed commercial potential, and design. In the end, more than 50 robots were entered, from a mix of universities, industry, and hobbyist groups from Canada, France, India, Japan, Mexico, the Soviet Union, the United States, the United Kingdom, and Yugoslavia.<\/p><p>There were plenty of disappointments. Trolleyman, a golf-cart-like wheeled robot, suffered a power failure while carrying the opening Olympic torch through the streets of Glasgow. The pile rug in the arena tripped up many robots that had been trained only on flat, smooth floors. David Buckley later concluded that the events were too difficult, and that the Olympics didn’t push development forward.<\/p><p class=\"shortcode-media shortcode-media-youtube\"> <span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>Of course, there were winners. In a surprise triumph for vintage technology, the fully mechanical 19th-century Japanese Archer from the Museum of Automata in York, England, won gold in javelin, beating out competitors more than 100 years its junior. The overall Olympic Champion was Yamabico, Shoji Suzuki’s entry from the University of Tsukuba, in Japan, which won bronze in obstacle avoidance and gold in wall following, but was disqualified in the talking category for not speaking English.<\/p><p>The Shadow Group had high hopes for Shadow Walker. Unfortunately, though, it failed to take a step, and the biped race was won by the Cardiff University Biped. Shadow Walker now resides in the <a href=\"https://collection.sciencemuseumgroup.org.uk/objects/co8366055/biped-robot\" target=\"_blank\">collections of the Science Museum<\/a> in London.<\/p><h2>The Legacy of Shadow Walker<\/h2><p>In 1997, a paying customer in search of a robotic leg compelled the Shadow Group to get serious and become a registered company. <a href=\"https://shadowrobot.com/\" target=\"_blank\">Shadow Robot<\/a> is now Britain’s oldest robotics company. Rich Walker, who had left the Shadow Group to earn a B.A. in mathematics and a diploma in computer science at the University of Cambridge, joined Shadow Robot in 1999 as technical director. Today he’s the director of the company.<\/p><p>Shadow Robot specializes in durable <a href=\"https://robotsguide.com/robots/shadow\" target=\"_blank\">robot hands<\/a> rather than walking robots. But the focus on hands is also a legacy of the Shadow Group. Walker remembers that the Shadow Group’s first humanoid hand in the late 1990s was impressive simply for being able to pick up a pint of beer (a smooth-sided, thin-walled glass). Today, Shadow Robot’s hands are <a href=\"https://shadowrobot.com/dexterous-hand-series/\" target=\"_blank\">testbeds for dexterity<\/a>. Gone are the pneumatic muscles, replaced by actuators that move each finger with precision. The classic model contains 20 motors, allowing for <a href=\"https://www.drugs.com/medical-answers/abduction-adduction-mean-3562250/\" target=\"_blank\">abductive and adductive <\/a>movement with 24 degrees of freedom.<\/p><p class=\"shortcode-media shortcode-media-rebelmouse-image\"> <img alt=\"Black and white photo of a two-legged humanoid robot with its left leg raised, next to a man with his right leg raised while another man looks on.\" class=\"rm-shortcode\" id=\"8e4ba\" src=\"https://spectrum.ieee.org/media-library/black-and-white-photo-of-a-two-legged-humanoid-robot-with-its-left-leg-raised-next-to-a-man-with-his-right-leg-raised-while-ano.jpg?id=66826242&amp;width=980\" /> <small class=\"image-media media-caption\">Shadow Walker’s operator wore a data suit that captured his movements and allowed the robot to copy them.<\/small><small class=\"image-media media-photo-credit\">Richard Greenhill<\/small><\/p><p>In a <a href=\"https://shadowrobot.com/why-your-industry-needs-dexterity-not-humanoids/\" target=\"_blank\">recent blog post<\/a>, Sejal Parsotomo, senior marketing executive at Shadow Robot, wrote that while humanoid robots are great for public relations, specialized dexterity is key for success: A robot that can walk into your factory may be impressive, but a robot that can <a href=\"https://spectrum.ieee.org/robot-hand-shadow-robot-company\" target=\"_blank\">reliably manipulate objects<\/a> is transformative.<\/p><p>In its struggles to take more than a few steps, the Shadow Walker showed the inherent difficulty that robots had in mastering even low-level skills. In August 2025, Beijing hosted the <a href=\"https://www.whrgoc.com/about\" target=\"_blank\">World Humanoid Robot Games<\/a>. Competing in sports such as gymnastics, soccer, and track events, as well as more “useful” tasks like hotel cleaning and sorting medicine, these robots could literally have run circles around the competitors in the first Robot Olympics 35 years earlier. And yet, there is still so much work needed in order for robots to navigate the human-built environment. Despite the astonishing progress, we’re still not all that close to actually useful humanoid robots.<\/p><p><em><em>Part of a <\/em><\/em><a href=\"https://spectrum.ieee.org/collections/past-forward/\" target=\"_self\"><em><em>continuing series<\/em><\/em><\/a><em> <\/em><em><em>looking at historical artifacts that embrace the boundless potential of technology.<\/em><\/em><\/p><p><em>An abridged version of this article appears in the June 2026 print issue as “Learning to Walk.”<\/em><\/p><h3>References<\/h3><br /><p>Richard Greenhill gives an <a href=\"https://shadowrobot.com/the-story-of-our-founder-richard-greenhill/\" target=\"_blank\">overview of his life<\/a> and the founding of the Shadow Group in a post on Shadow Robot’s corporate website.<\/p><p>David Buckley has a compilation of resources on the <a href=\"https://davidbuckley.net/DB/ShadowBiped/ShadBiped.htm\" target=\"_blank\">Shadow Biped Walker<\/a>, including <a href=\"https://davidbuckley.net/DB/ShadowBiped/ShadBipedArchive/Shadow%20Robot%20Company%20Shadow%20Biped.htm\" rel=\"noopener noreferrer\" target=\"_blank\">specifications<\/a> from the 1999 iteration and a <a href=\"https://davidbuckley.net/RS/History/Olympics90_files/Brochure.htm\" rel=\"noopener noreferrer\" target=\"_blank\">brochure<\/a> from the 1st International Robot Olympics.<\/p>There is coverage of the Robot Olympics worthy of a gossip sheet in <a href=\"https://ricerca.repubblica.it/repubblica/archivio/repubblica/1990/09/30/olimpiade-dei-robot.html\" rel=\"noopener noreferrer\" target=\"_blank\"><em><em>La Repubblica<\/em><\/em><\/a><em> <\/em>and lovely footage of the competition in <a href=\"https://www.youtube.com/watch?v=I37bUBVM854\" rel=\"noopener noreferrer\" target=\"_blank\">this TV-am interview<\/a> of Peter Mowforth by Lorraine Kelly."}, {"title": "Video Friday: Extreme Omnidirectional Robot", "source": "IEEE Spectrum Robotics", "date": "2026-05-29", "url": "https://spectrum.ieee.org/video-friday-rabona-soccer", "summary": "<img src=\"https://spectrum.ieee.org/media-library/spherical-multi-legged-robot-walking-along-a-forest-trail.gif?id=66834857&amp;width=1245&amp;height=700&amp;coordinates=0%2C0%2C0%2C0\" /><br /><br /><p>Video Friday is your weekly selection of awesome robotics videos, collected by your friends at <em>IEEE Spectrum<\/em> robotics. We also post a weekly calendar of upcoming robotics events for the next few months. Please <a href=\"mailto:automaton@ieee.org?subject=Robotics%20event%20suggestion%20for%20Video%20Friday\">send us your events<\/a> for inclusion.<\/p><h5><a href=\"https://2026.ieee-icra.org/\">ICRA 2026<\/a>: 1–5 June 2026, VIENNA<\/h5><h5><a href=\"https://roboticsconference.org/\">RSS 2026<\/a>: 13–17 July 2026, SYDNEY<\/h5><h5><a href=\"https://mrs.fel.cvut.cz/summer-school-2026/\">Summer School on Multi-Robot Systems<\/a>: 29 July–4 August 2026, PRAGUE<\/h5><h5><a href=\"https://actuate.foxglove.dev/\">Actuate 2026<\/a>: 18–19 August 2026, SAN FRANCISCO<\/h5><p>Enjoy today’s videos!<\/p><div class=\"horizontal-rule\"><\/div><div><span style=\"display: none;\"> <\/span><\/div><p class=\"rm-anchors\" id=\"nd-i4ynqeuy\">What is the right number of legs for a robot? Two? Four? No, the answer is obviously all of them. All of the legs.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://generalroboticslab.com/Argus\">Argus<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"mccv90sunby\">Sigh, yet another skill that I as a soccer-playing human should have but a robot has instead: the rabona.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://bostondynamics.com/products/atlas/\">Boston Dynamics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"p5lywik6oba\"><em>Robots are rapidly becoming part of our everyday lives, from drones and industrial machines to home assistants and humanoid robots. As their presence continues to grow, an important question arises: How can we choose the right robot—not only in terms of performance and cost but also in terms of sustainability? <\/em><em>This video introduces the Eco‑Score for Robots, a new approach to evaluating the environmental impact of robotic systems. Just as eco-labels help consumers make informed choices in other industries, the Robotics Eco‑Label provides a clear and transparent way to assess how sustainable a robot truly is.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://roboticsecolabel.com/\">Robotics EcoLabel<\/a> ]<\/p><p>Thanks, Bram!<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"w5iw60q526k\">Uh oh, <a href=\"https://spectrum.ieee.org/yale-variable-friction-robot-fingers\" target=\"_blank\">five-fingered hands<\/a>.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.agilityrobotics.com/\">Agility<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"tapvn-tqpx0\"><em>Robotic manipulation has come a long way since the 1990s. We’ve gone from the two-ball paddle <a href=\"https://spectrum.ieee.org/juggling-robots-get-fancier\" target=\"_blank\">juggling robot <\/a>to AthenaZero, who can juggle barehanded using onboard vision feedback. By moving away from task-specific passive end-effectors such as cups or paddles and using multifingered hands, it can transition between a wide range of patterns including cascade, half-shower, tennis, shower, and box.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>There needs to be a robot circus show already.<\/p><p>[ <a href=\"https://rai-inst.com/resources/blog/bimanual-robot-for-dynamic-manipulation/\">Robotics and AI Institute<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"qvdgu1-ykxy\">Zero legs. One hat. $13K.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.astribot.com/en\">Astribot<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"-lgo5xqgvko\"><em>From its elegant design to the advanced technology powering every step, Luna is more than a machine—it’s a leap into the future.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://limxdynamics.com/en/products/luna\">LimX Dynamics<\/a> ]<\/p><p>Thanks, Jinyan!<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"g3pvccv00um\">You got a quadrotor in my quadruped! No, you got a quadruped in my quadrotor!<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://engineering.ontariotechu.ca/mars/index.php\">MARS Laboratory<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"tmi_h-ct5pk\"><em>A human hand, a robot’s arm—together tracing circles of trust and precision. No missteps. No hesitation. Just pure, algorithmic grace.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.ubtrobot.com/en/humanoid/products/walker-c\">UBTECH<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"qlsj3p87a4a\">Low-gravity planetary exploration with a quadruped just looks like fun.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.autonomousrobotslab.com/\">Autonomous Robots Lab<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"xwjssgdd5no\">Here it is, that robot Kool-Aid that everyone seems to be drinking. Including me!<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://generalistai.com/\">Generalist<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"6-prnhfdyfw\">Don’t shoot Mini Pupper!<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://mangdang.store/products/mp2\">MangDang<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"ofnlnztcwm4\"><em>We show here the ARISTO (Anthropomorphic, Robotic, Integrated-Sensing, Tendon-Operated) Hand. Developed in collaboration with Sony Group Corporation, this research platform is engineered to address the complex requirements of manipulating small, thin, and fragile objects.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://sites.utexas.edu/hcrl/\">University of Texas Human Centered Robotics Lab<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"3vbk_jzmagu\">Okay, but did you really have to call it the T800?<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://en.engineai.com.cn/product-t800\">EngineAI<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"p15of1ktjt4\"><em>Moby shows what useful mobile manipulation looks like in the real world: picking up, carrying, and placing adaptable payloads. The video shows payload handling across increasing crate loads, including a 50.3-pound load, while maintaining balance, control, and mobility. This is the kind of capability that matters outside the lab—moving real objects, in real spaces, with practical reliability.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.noblemachines.ai/\">Noble Machines<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"dqyojl69xdk\"><em>What does it take to make a robot look human? Harvard SEAS students Hailey Block, Henry Tavistock, and Evan Crowley created “Hollow Minds,” a pair of animatronic heads capable of speaking, blinking, tracking movement, and displaying lifelike facial expressions.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://seas.harvard.edu/electrical-engineering/courses\">Harvard University<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"jeejj42tkqu\">The longevity here is impressive, but the obvious question here is why the heck you’d ever do this task with a bipedal humanoid robot. It also doesn’t seem to have any error recovery, which is obviously fixable, but highlights the fact that real humans are versatile and humanoid robots are not.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.figure.ai/\">Figure<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"ydf1vzbzrgy\"><em>Kacper Nowicki, CEO and cofounder of Nomagic, recently sat down for a deep dive into the “humanoid vs. purpose-built” debate during a panel discussion at the Web Summit in Vancouver 2026.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://nomagic.ai/\">Nomagic<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div>"}, {"title": "NVIDIA Research Advances Robotics From Simulation to the Real World", "source": "NVIDIA Robotics", "date": "2026-05-28", "url": "https://blogs.nvidia.com/blog/icra-research-robotics-simulation-to-real-world/", "summary": "Robotics is entering a new phase: moving from controlled demos and scripted automation toward generalizable, reliable embodied autonomy in the real world.  At the International Conference on Robotics and Automation (ICRA), eight of NVIDIA Research’s 28 accepted papers show how simulation-to-real transfer is becoming a foundation for that shift, helping robots perceive, reason, plan and [&#8230;]"}, {"title": "Video Friday: Atlas Versus a Fridge", "source": "IEEE Spectrum Robotics", "date": "2026-05-22", "url": "https://spectrum.ieee.org/video-friday-humanoid-robot-learning", "summary": "<img src=\"https://spectrum.ieee.org/media-library/bipedal-humanoid-robot-does-one-legged-spinning-kick-in-a-brightly-lit-industrial-workshop.gif?id=66779183&amp;width=1200&amp;height=400&amp;coordinates=0%2C92%2C0%2C92\" /><br /><br /><p><span>Video Friday is your weekly selection of awesome robotics videos, collected by your friends at <\/span><em>IEEE Spectrum<\/em><span> robotics. We also post a weekly calendar of upcoming robotics events for the next few months. Please <\/span><a href=\"mailto:automaton@ieee.org?subject=Robotics%20event%20suggestion%20for%20Video%20Friday\">send us your events<\/a><span> for inclusion.<\/span><\/p><h5><a href=\"https://2026.ieee-icra.org/\">ICRA 2026<\/a>: 1–5 June 2026, VIENNA<\/h5><h5><a href=\"https://roboticsconference.org/\">RSS 2026<\/a>: 13–17 July 2026, SYDNEY<\/h5><h5><a href=\"https://mrs.fel.cvut.cz/summer-school-2026/\">Summer School on Multi-Robot Systems<\/a>: 29 July–4 August 2026, PRAGUE<\/h5><h5><a href=\"https://actuate.foxglove.dev/\">Actuate 2026<\/a>: 18–19 August 2026, SAN FRANCISCO<\/h5><p>Enjoy today’s videos!<\/p><div class=\"horizontal-rule\"><\/div><div><span style=\"display: none;\"> <\/span><\/div><blockquote class=\"rm-anchors\" id=\"xkk5ze3fukq\"><em>Just months after its debut, Atlas is proving why it is the world’s most capable and dynamic humanoid robot, ready for real work. Lifting a mini-fridge is a feat of strength, but the true breakthrough is in the underlying reinforcement learning and controls systems. The robot is learning to navigate real world adaptability: handling heavy objects by bracing and accounting for the mass and inertia; using whole-body control, not just hands to maneuver; and demonstrating superhuman range of motion and balance. This marks a critical shift in robotics where humanoids move beyond the lab and into dynamic industrial settings.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>Watching Atlas move a fridge may be less impressive than whatever the heck it does at 4:10.<\/p><p>[ <a href=\"https://bostondynamics.com/blog/training-a-humanoid-robot-for-hard-work/\">Boston Dynamics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"p0okuedzdg0\"><em>SpikerBot is a robot you teach by wiring neurons, not writing code. Drag spiking neurons in the app, connect them to sensors and motors, then press play. It moves, reacts, and changes behavior based on the brain you built.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>Already funded on Kickstarter with a robot kit starting at US $219.<\/p><p>[ <a href=\"https://www.kickstarter.com/projects/backyardbrains/spikerbot-build-a-brain-create-a-creature\">Kickstarter<\/a> ] via [ <a href=\"https://backyardbrains.com/\">Backyard Brains<\/a> ]<\/p><p>Thanks, Greg!<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"32qhuslr0gm\"><em>Wheeled-legged robots, which have wheels at their feet and achieve high mobility by coordinating wheel drive and leg drive, have been developed. In this paper, we address the problem of how to draw out the potential task-execution capability of the legs by freeing them from the roles of locomotion through external body support.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://shin0805.github.io/wixus/\">WiXus<\/a> ] from [ <a href=\"http://www.jsk.t.u-tokyo.ac.jp/\" target=\"_blank\">JSK Robotics Laboratory<\/a> ] via [ <a href=\"https://2026.ieee-icra.org/\" target=\"_blank\">ICRA 2026<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"olpxfcg2ibs\">A very clever idea for electronics-free, multi-dimensional touch sensing.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.nature.com/articles/s41467-026-72497-3\">Nature Communications<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"b-a8tb8ttii\"><em>Using external voice commands, G1 is directly controlled to generate a wide range of actions in real time. This video was recorded in a single take, with on‑site audio recording.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://shop.unitree.com/products/unitree-g1\">Unitree<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"5kdmlpvqvhk\"><em>Hummingbirds are impressive flyers, and advancements in high-speed photography, instrumentation, and measurement techniques have revealed much about their aerodynamics, flight behaviors, and wing and body kinematics. However, comparatively less is known about their natural flight dynamics, which is the relationship among a bird’s flight velocities, the control actions of its wings, and the acceleration of the bird in flight. To investigate this, at the <a href=\"https://spectrum.ieee.org/fly-like-a-fly\" target=\"_blank\">Advanced Vertical Flight Laboratory<\/a> we have designed, built, and flight tested a biomimetic robotic hummingbird on which is implemented the same techniques for flight control as observed in hummingbirds.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://avfl.engr.tamu.edu/\">Advanced Vertical Flight Laboratory<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"k115trhcuby\">I guess if you’re going to make a <a href=\"https://spectrum.ieee.org/quadruped-robot-benchmark-barkour\" target=\"_blank\">robot dog<\/a>, it’s only fair to give it the ability to frolic in the water.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.magiclab.top/en/\">MagicLab<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"e7ojml_wo_u\"><em>The original automated layout robot—the one that showed up when the construction industry was pretty sure robots were lame and then proved otherwise. It has printed millions of square feet of layout across thousands of projects. It built an entire category of construction technology. The category of: Stuff That Actually Does Helpful Work on Real Jobsites. But FieldPrinter 2 is here. It’s faster, tougher, smaller, and smarter. So for FieldPrinter 1, it’s time. Time for a quiet retirement. A mug. Maybe a plaque... But nay, good knight! Thou shalt expire in a blaze of thunderous glory!!<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.dustyrobotics.com/\">Dusty Robotics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"cyx8fbk9jeg\">Here’s an interesting idea for an inflatable <a href=\"https://spectrum.ieee.org/foldable-monocopter-drone\" target=\"_blank\">monocopter drone<\/a>.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://airlab.sutd.edu.sg/\">AIRLAB<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"6hrgihba3ro\"><em>Meet the Lynx S10—a compact all-terrain robot built to deliver industry-grade performance in a lightweight form factor under 20kg.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.deeprobotics.cn/en\">DE Robotics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"amovyq3hfpm\"><em>Noble Machines builds general-purpose robots for heavy industry, supporting people with the most hazardous and physically demanding tasks. Attendees at <a href=\"https://spectrum.ieee.org/nvidia-groq-3\" target=\"_blank\">NVIDIA GTC 2026 <\/a>witnessed the power of autonomous industrial work with Noble Machines Moby.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.noblemachines.ai/\">Noble Machines<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"_ulzzrpmlok\">I’m sorry, but Lego bricks should be for humans only.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.limxdynamics.com/en/products/tron2\">LimX Dynamics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"l_yqaxoi_bs\">Need a robot that can go places? Huskies were around way before legged humanoids, and I bet they’ll be around way after, too.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://clearpathrobotics.com/husky-a300-unmanned-ground-vehicle-robot/\">Clearpath Robotics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"8mflnicbyve\">I know this little dude is just a research platform at Disney, but I still want one to be my friend.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://arxiv.org/abs/2605.15122\">Paper<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"l8owjwnnxug\"><em>In March 1982, General Motors announced a rapid and aggressive conversion to robotics. By 1990, GM wanted 14,000 robots in their factories doing everything from painting to welding to assembly. Nowadays, we dream of robots in the factories, doing everything end to end. In the dark. Lights out. Guess what? GM dreamed the same 40 years ago, and they spent an estimated US $60 billion to try to make it reality. In today’s video, we look at General Motors and their dreams of the automated, all-robot factory.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://asianometry.passport.online/\">Asianometry <\/a> ]<\/p><div class=\"horizontal-rule\"><\/div>"}, {"title": "Open-Source Software Is Starting to Help Robots Think", "source": "IEEE Spectrum Robotics", "date": "2026-05-21", "url": "https://spectrum.ieee.org/open-source-robot-ai-platforms", "summary": "<img src=\"https://spectrum.ieee.org/media-library/a-smiling-emoji-with-red-eyes-and-a-grey-face-resembling-a-robot.jpg?id=66750560&amp;width=1245&amp;height=700&amp;coordinates=0%2C187%2C0%2C188\" /><br /><br /><p>When a group of academics <a href=\"https://spectrum.ieee.org/open-source-robotics-hardware-research-and-innovation\" target=\"_self\">started making open-source robotics hardware<\/a>, a generation of roboticists got years of their lives back. Now, the bigger challenge is getting robots to think—and that’s starting to be open sourced too.<\/p><p>The shift is still early, but companies including Hugging Face, Nvidia, and Alibaba have all made significant bets on open-source robotics in the last two years, releasing tools and models aimed at the higher-level work of getting robots to reason, decide, and act. <\/p><p><span>The open source movement that accelerated other AI applications is now being applied to the problem of making robots smarter. <\/span> If these attempts to bring AI to robotics with open-source platforms succeed, the barrier to building a capable robot could fall as fast as the barrier to building an AI application did.<\/p><h2>The world ROS built<\/h2><p>Open-source robotics software has been around since the mid-1990s, with early projects like Carnegie Mellon University’s <a href=\"https://www.ri.cmu.edu/project/inter-process-communication-package/\" target=\"_blank\">Inter-Process Communication package<\/a> and the <a href=\"https://playerstage.sourceforge.net/\" target=\"_blank\">Player Project<\/a> in the early 2000s laying the groundwork. But these were often tied to specific research groups, and the field remained fragmented. <\/p><p>The Robot Operating System, ROS, <a href=\"https://spectrum.ieee.org/the-origin-story-of-ros-the-linux-of-robotics\" target=\"_self\">changed that when it made its debut<\/a> in 2007. By bundling tools and attracting more users, it became the de facto standard. The story of open-source robotics, in many ways, starts there. <\/p><p>Despite its name, ROS is not actually an operating system. Rather, it is a software framework that sits on top of Linux and handles robotic fundamentals like moving data between components, talking to hardware, building maps, planning paths, and supporting developer tools, such as data logging and visualization. Before ROS, every robotics team wrote that infrastructure themselves. It often took a year or two before a lab could get to the research it actually cared about. <\/p><p><a href=\"https://brian.gerkey.org/\" rel=\"noopener noreferrer\" target=\"_blank\">Brian Gerkey<\/a>, who helped build ROS in the mid-2000s, says he was drawn to the project because of how much open source had already changed the world, pointing out that nearly the entire internet <a href=\"https://www.hbs.edu/ris/Publication%20Files/24-038_51f8444f-502c-4139-8bf2-56eb4b65c58a.pdf\" rel=\"noopener noreferrer\" target=\"_blank\">is built on it<\/a>. <\/p><p>“I’m a tool builder, and I like to share everything as openly as I possibly can, because I think that’s where we get the most impact out of what we build,” says Gerkey, board chair of Open Robotics and now CTO at <a href=\"https://www.intrinsic.ai/\" rel=\"noopener noreferrer\" target=\"_blank\">Intrinsic<\/a>, a robotics and AI unit of Google.<\/p><p>As it was developing, the AI community largely took the same approach, sharing research, models, and data openly, and the field accelerated faster than almost anyone predicted. Now some of those same advancements are arriving in robotics.<\/p><h2>Open-source AI for robotics<\/h2><p>Computer vision, once a hard problem, has advanced dramatically in just a few years, says <a href=\"https://www.linkedin.com/in/spencermhuang/\" rel=\"noopener noreferrer\" target=\"_blank\">Spencer Huang<\/a>, Nvidia’s director of product for robotics. What once required significant expertise can now be done in a few lines of code. Simulation tools have become accurate enough to be useful for training, and access to the tooling that once required a specialized lab is now widely available, much of it open source.<\/p><p>“To get into robotics, you no longer need a Ph.D.,” he says. The result is a much larger pool of people who can contribute, and the field is starting to look less like a specialized discipline and more like a platform that anyone can build on.<\/p><p>Nvidia has built out an open-source robotics stack that covers the full development pipeline. Its <a href=\"https://www.nvidia.com/en-us/ai/cosmos/\" rel=\"noopener noreferrer\" target=\"_blank\">Cosmos world models<\/a> generate synthetic training data and simulate physical environments. Its <a href=\"https://huggingface.co/blog/nvidia/gr00t-n1-7\" rel=\"noopener noreferrer\" target=\"_blank\">GR00T models<\/a> give robots the ability to reason through and execute complex tasks. And its <a href=\"https://developer.nvidia.com/isaac\" rel=\"noopener noreferrer\" target=\"_blank\">Isaac frameworks<\/a> handle the orchestration that ties training, simulation, and deployment together. Not everyone needs to train the robots from scratch, Huang says, and most people probably shouldn’t.<\/p><p>“If you gate pre-training, the field just never grows,” he says. “We should be able to provide a high-quality, state-of-the-art pre-trained model that anyone can go and take and fine tune for their own purposes.”<\/p><p>All of Nvidia’s open-source models live on Hugging Face, the open-source AI platform that has become the default place to share models and datasets. <a href=\"https://huggingface.co/lerobot\" rel=\"noopener noreferrer\" target=\"_blank\">Hugging Face launched LeRobot<\/a>, a community platform for robotics AI, in May 2024. Since its launch, the number of robotics datasets on the platform grew from 1,145 at the end of 2024 to more than 58,000 today, making it the single largest dataset category on the hub.<\/p><p>Hugging Face has also moved into hardware, acquiring robotics company <a href=\"https://www.pollen-robotics.com/\" rel=\"noopener noreferrer\" target=\"_blank\">Pollen Robotics<\/a>. The acquisition came from a realization that software alone was not enough, according to <a href=\"https://www.linkedin.com/in/clementdelangue/\" rel=\"noopener noreferrer\" target=\"_blank\">Clement Delangue<\/a>, Hugging Face’s CEO. The goal, as with the software, was to bring more people in.<\/p><p>The contributors to LeRobot include the biggest names in the industry, academic labs, and hobbyists building robots in their spare time. For instance, earlier this year, Alibaba <a href=\"https://arxiv.org/abs/2602.14979v1\" rel=\"noopener noreferrer\" target=\"_blank\">released RynnBrain<\/a>, an open-source foundation model for physical AI that the company claims outperforms comparable offerings from Google and Nvidia on benchmarks. That diversity of projects, Delangue says, is important. <\/p><p>“It is not just one model or one dataset or one hardware,” he says. “It is a lot of small contributions that everyone can be part of.”<\/p><h2>Commercial incentives muddle the field<\/h2><p>The stakes, Delangue says, go beyond convenience. A world where only a few proprietary systems control the robots in people’s homes is a concerning one. “Having robots at home that you don’t really understand, that you don’t really control, that a few people in Silicon Valley control is a scary thought,” he says. “Open source gives an alternative path.”<\/p><p>But getting there is not straightforward. The open sourcing happening now looks different from what produced ROS, which emerged largely from academics pooling their work with no commercial stake in the outcome. The biggest contributors today are companies with clear business reasons to want more people building on their platforms. That’s not necessarily a bad thing, says <a href=\"https://engineering.oregonstate.edu/people/bill-smart\" rel=\"noopener noreferrer\" target=\"_blank\">Bill Smart<\/a>, a professor at Oregon State University, in Corvallis, who was part of the early open-source robotics community. But the incentives are worth being aware of.<\/p><p>He also worries that the lowered barrier to entry has a downside. Researchers coming from AI without a robotics background are sometimes solving problems the field already solved. A newcomer might spend a week training a neural network to move a robot’s hand from one point to another, unaware that the same task can be accomplished with a few lines of code using decades-old techniques. The incentives are not always pointing in the same direction as the progress.<\/p><p>Smart is not without hope though. Whatever the motives behind the open sourcing, he says, the effect is real. More people are in the field than ever before, the tools are genuinely easier to use, and the community is bigger and more diverse than anything that existed when ROS was getting started. <\/p><p>“Anyone can make a robot move now,” he says. “As an old tech guy, that makes me happy and sad, because I’m no longer special.”<\/p>"}, {"title": "The Future of Physical AI Isn’t Smarter Robots, It’s Smarter Interfaces", "source": "IEEE Spectrum Robotics", "date": "2026-05-21", "url": "https://spectrum.ieee.org/wetour-robotics-physical-ai-human-interfaces", "summary": "<img src=\"https://spectrum.ieee.org/media-library/hands-controlling-speaker-light-bulb-and-drone-against-minimalist-white-walls.jpg?id=66718902&amp;width=1245&amp;height=700&amp;coordinates=160%2C0%2C160%2C0\" /><br /><br /><p><em>This sponsored article is brought to you by <a href=\"https://wetourrobotics.com/\" target=\"_blank\">Wetour Robotics<\/a>.<\/em><\/p><p>A field technician on a wind turbine, harness clipped, both hands on a wrench, needs to send a command to the diagnostic device hanging at her belt. A logistics worker on a loading dock, gloves on, eyes on the pallet, needs to redirect a connected lift. A person using an assistive mobility device on a crowded street wants to nudge it forward without taking out a phone or speaking aloud. None of these moments call for a smarter robot. They call for a smarter way to be heard by the machines that already exist.<\/p><h2>The industry has been building from one side<\/h2><p>The past three years of Physical AI have been a story of remarkable progress on the robot side of the loop. Companies like Boston Dynamics, Figure, and Unitree have advanced actuators, locomotion, and dexterity to a level that would have seemed implausible a decade ago. Google DeepMind’s Gemini Robotics has redefined what vision-language-action models can do in unstructured settings. The trajectory of the hardware and the foundation models is real, and it is accelerating.<\/p><p>But there is another side to this loop, and it has been treated as a solved problem for too long. The interface between humans and machines has defaulted, for 40 years, to three input modalities: screens, buttons, and voice. Each of those assumes the user can stop, look down, and translate intent into structured commands. That assumption breaks the moment the work moves into a real environment. On a turbine. On a dock. On a sidewalk. In any setting where hands are occupied, eyes are committed, or speaking is impractical, the conventional interface stack quietly fails.<\/p><p class=\"pull-quote\">Spatial Intent Fusion is the simultaneous processing of three streams of human-centered information, namely spatial position, visual context, and gestural intent: Your body is the interface.<br /><\/p><p>The bottleneck on the human side of the loop is becoming as important as the one on the machine side. And solving it requires a different question. Not how do we make the robot more capable, but how do we let the human participate in the computing system as naturally as the robot already does.<\/p><h2>Wetour Robotics’ bet: put the human back into the computing loop<\/h2><p><a href=\"https://wetourrobotics.com/\" target=\"_blank\">Wetour Robotics<\/a> is betting that the next architectural leap in Physical AI is not about making the robot more capable. It is about making the human a first-class node in the computing network, with the same kind of low-latency, high-fidelity participation that connected devices already enjoy.<\/p><p>Wetour Robotics’ engineers frame the problem this way: a wristband that recognizes a gesture is not enough. A camera that recognizes a scene is not enough. The information a human carries about what they are about to do is distributed across multiple channels, including where their body is in space, what their eyes are attending to, and what their muscles are preparing to do, and any single channel observed in isolation is ambiguous. Reconstructing intent reliably means fusing those channels at the operating system level, with latency low enough that the loop feels closed rather than mediated.<\/p><p>This approach has a name. Wetour Robotics calls it Spatial Intent Fusion: the simultaneous processing of three streams of human-centered information, namely spatial position, visual context, and gestural intent, fused into a single real-time command for any connected physical device. It is the technical implementation behind a simpler positioning statement the company uses externally: your body is the interface.<\/p><p class=\"shortcode-media shortcode-media-rebelmouse-image\"> <img alt=\"Sleek silver rectangular electronic device labeled \\u201cORCHESTRA\\u201d on a light gray background.\" class=\"rm-shortcode\" id=\"1af08\" src=\"https://spectrum.ieee.org/media-library/sleek-silver-rectangular-electronic-device-labeled-u201corchestra-u201d-on-a-light-gray-background.png?id=66718892&amp;width=980\" /> <small class=\"image-media media-caption\">Orchestra is a portable intelligent hub running the operating system that handles sensor fusion, intent inference, command translation, and safety arbitration. The reference compute platform is NVIDIA Jetson Orin Nano Super, which provides enough on-device inference capacity to keep the entire control loop at the edge, with no cloud dependency on the critical path. <\/small><small class=\"image-media media-photo-credit\">Wetour Robotics<\/small><\/p><h2>The architecture: three layers, four engines, one loop<\/h2><p>Orchestra is not a single device but a layered platform, designed from the start to be sensor-flexible and actuator-agnostic. The architecture decomposes into three perception layers and four coordination engines.<\/p><p><strong>Orchestra<\/strong> itself is the local compute and orchestration core: a portable intelligent hub running the operating system that handles sensor fusion, intent inference, command translation, and safety arbitration. The reference compute platform is NVIDIA Jetson Orin Nano Super, which provides enough on-device inference capacity to keep the entire control loop at the edge, with no cloud dependency on the critical path. Edge inference is non-negotiable for this application. Full-chain latency from biosignal acquisition to actuator command is held under 100 milliseconds, the envelope inside which closed-loop control feels natural rather than laggy.<\/p><p><strong>VisionLink<\/strong> handles visual and spatial perception. Cameras feed into vision models that identify objects, estimate distances, and track environmental context. VisionLink is designed not as a passive recognition layer but as a real-time command generator: its outputs feed directly into Orchestra OS to be fused with biosignal data.<\/p><p><strong>Conductor<\/strong> is the biosignal pipeline. It ingests raw surface electromyographic (sEMG) data from a wrist-worn device, classifies temporal patterns into discrete gestures or continuous control signals, and outputs actuator commands. The technically interesting property of sEMG for this use case is that the signal precedes visible motion. Motor unit action potentials appear at the skin surface roughly 50 to 80 milliseconds before a finger completes the corresponding gesture. Wetour Robotics calls this property pre-motion intent sensing, and it is what allows Orchestra to anticipate user intent rather than react to it.<\/p><p>On top of the three perception layers, Orchestra OS runs fou
