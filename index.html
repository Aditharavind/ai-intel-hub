cent faster than it otherwise could have<span>. <em>Opportunity<\/em> and <em>Curiosity<\/em> both only used autonomous driving about 5 percent of the time. <em>Perseverance<\/em> is the first Mars rover that drives itself 90 percent of the time, with its enhanced autonomy system that includes a second processor with <\/span><a href=\"https://spectrum.ieee.org/fpga-chip-ieee-milestone\" target=\"_self\">an FPGA<\/a><span> to speed up extra image processing operations.<\/span><\/p><p><strong>What was it like to let <em>Perseverance<\/em> drive itself for the first time?<\/strong><\/p><p><strong>Maimone:<\/strong> <em>Perseverance<\/em> is the culmination of decades of work on Mars rover autonomy, so seeing <em>Perseverance<\/em> use its AutoNav system to drive itself basically at full speed, up to 120 meters an hour, was incredible.<\/p><p class=\"shortcode-media shortcode-media-rebelmouse-image\"> <img alt=\"View of Mars' rocky surface as-captured by cameras installed on the undercarriage of a space rover.\" class=\"rm-shortcode\" id=\"245ba\" src=\"https://spectrum.ieee.org/media-library/view-of-mars-rocky-surface-as-captured-by-cameras-installed-on-the-undercarriage-of-a-space-rover.jpg?id=67675990&amp;width=980\" /> <small class=\"image-media media-caption\">These two images taken by Perseverance’s hazard avoidance and navigation cameras show (at left) the very first AutoNav drive on Mars where the rover autonomously stopped before running into a rock pile, and (at right) the second AutoNav drive where the rover successfully steered around a rock.<\/small><small class=\"image-media media-photo-credit\">JPL-Caltech/NASA<\/small><\/p><p><strong>Where are the humans in this process?<\/strong><\/p><p><strong>Maimone: <\/strong>The plan of where to go is specified by the science team, and then on the engineering side, the strategic route planning team develops a path to get us to that goal by guessing, based on lower-resolution maps from orbit, what the terrain is going to look like for the rover. Each day, a tactical operations team combines the strategic overall route with that day’s science goals to pick the actual route the rover will follow.<\/p><p>We want humans to keep doing long-range planning because that avoids wasting time. For example, we’ve learned that if we see sandy areas with intersecting waves or crests—not just ripples blown in one direction, but cross-ripples going in multiple directions—the rover tends to sink into terrain like that, so we tell the rover to keep out of those areas. The onboard autonomy only measures terrain shape, not terrain type, so it benefits from those location-based annotations.<\/p><p>We now have years of experience correlating images taken from orbit with images taken by the rover, and understanding how different kinds of terrain affect the drive. With the current orbiters at Mars, we sometimes get 25 centimeters resolution on orbital images. That’s still not quite enough to see all obstacles; there could be a big rock that doesn’t really show up on a scale of more than one or two pixels, making it very hard to notice. That is why you want to have autonomy on the rover, but the greater help we can give it at a high level, the faster we can reach our goals and the fewer potential delays we’ll encounter.<\/p><p class=\"shortcode-media shortcode-media-rebelmouse-image\"> <img alt=\"A map of Mars' surface featuring the Perseverance rover's planned path for autonomous navigation, alongside its final executed route which was diverted due to hazardous terrain. \" class=\"rm-shortcode\" id=\"2f1aa\" src=\"https://spectrum.ieee.org/media-library/a-map-of-mars-surface-featuring-the-perseverance-rover-s-planned-path-for-autonomous-navigation-alongside-its-final-executed-r.jpg?id=67675967&amp;width=980\" /> <small class=\"image-media media-caption\">This orbital view shows a region of complex Martian terrain that Perseverance could not navigate autonomously. The blue line shows the path that human planners estimated, while the white line shows the path taken by the rover. The inset image, from Perseverance’s hazard avoidance camera, shows the rocky, sandy, and sloped terrain.<\/small><small class=\"image-media media-photo-credit\">Source images: <a href=\"https://ieeexplore.ieee.org/document/11265757\" target=\"_blank\">Olivier Toupet, Masahiro Ono, et al.<\/a>; JPL-Caltech/University of Arizona/NASA <\/small><\/p><p><strong>What happens when the autonomy system on <em>Perseverance<\/em> fails?<\/strong><\/p><p><strong>Maimone: <\/strong>We ended up not using the autonomy at all for about two months in more complex terrain while we tuned things and wrote new software to deal with that new terrain we hadn’t encountered before. Some of those changes were relatively quick, and some required months of study. For example, one parameter is the maximum amount of slope that the robot is allowed to climb, because on steep slopes, there is a risk of the rover slipping sideways. <\/p><p>We landed inside Jezero Crater, which was very flat, and so for the first three years, most of our driving was at less than 14 degrees of slope. When we finally decided to leave the crater, we began to encounter other terrain at higher tilts with greater rock density, and the experience we gained allowed us to re-tune the parameters to allow the rover to traverse those more difficult terrains, with slopes of up to 24 degrees.<\/p><h2>Rover autonomy in the age of AI<\/h2><p><strong>Late last year, you let <a href=\"https://spectrum.ieee.org/perseverance-rover-nasa-anthropic-ai\" target=\"_self\">Anthropic’s Claude AI plan a 400-meter drive for <em>Perseverance<\/em><\/a>. How did that go?<\/strong><\/p><p><strong>Maimone: <\/strong>We had the AI look at the orbital images and pick out a path for us, which became the starting point of the day’s rover planning operations. Typically, that starting path comes from the human rover planner team, but in this case, it was generated by AI. Humans were still in the loop; the team reviewed it and made a couple of adjustments. AI gave us a solid starting point that allowed us to make rapid progress, because it’s much easier to validate a path than to pick one from scratch.<\/p><p class=\"shortcode-media shortcode-media-rebelmouse-image\"> <img alt=\"Selfie taken by NASA\\u2019s Perseverance rover on the planet Mars.\" class=\"rm-shortcode\" id=\"c04cd\" src=\"https://spectrum.ieee.org/media-library/selfie-taken-by-nasa-u2019s-perseverance-rover-on-the-planet-mars.jpg?id=67685143&amp;width=980\" /> <small class=\"image-media media-caption\">NASA’s Perseverance Mars rover took this selfie on July 23, 2024. The selfie is composed of 62 images taken by the WATSON (Wide Angle Topographic Sensor for Operations and eNgineering) camera on the end of the rover’s robotic arm.<\/small><small class=\"image-media media-photo-credit\">JPL-Caltech/MSSS/NASA<\/small><\/p><p><strong>Do you think humans will remain a necessary part of rover operations, or do you see the next generation of Mars rovers operating for weeks at a time without human assistance?<\/strong><\/p><p><strong>Maimone:<\/strong> One of the things that has held us back from driving very long distances autonomously is that as we drive, the rover accumulates uncertainty in its position. When the uncertainty grows, it means we have to stay farther away from areas that human rover planners have identified as being potentially dangerous, called “keep-out zones.” In some cases, the uncertainty gets high enough that the rover can’t plan a safe path, because the keep-out zones (which grow with the rover’s uncertainty) get too big.<\/p><p>We now have a new capability that we’ve added to <em>Perseverance<\/em> called <a href=\"https://www.nasa.gov/missions/mars-2020-perseverance/perseverance-rover/nasas-perseverance-now-autonomously-pinpoints-its-location-on-mars/\" target=\"_blank\">Mars Global Localization<\/a>. With this new technology  that can shrink our uncertainty, we theoretically have the ability to go as long as we have resources to keep driving safely based on our maps and keep-out zones.<\/p><p>But to truly run a mission for weeks, you need to not only drive long distances, but also execute science operations autonomously. We have people here also looking at automating science operations by doing image processing onboard the rover to get a better understanding of what’s out there and where to focus the instruments’ attention. So I do think we are getting to the point where we can support long-period autonomous operations. It has been a slow evolution, but we have great capabilities now and a good understanding of what’s needed to make it work well.<\/p><p><strong>As someone who has been involved with all of these Mars rovers—<a href=\"https://www.jpl.nasa.gov/news/nasa-to-begin-attempts-to-free-sand-trapped-mars-rover/\" target=\"_blank\">including one that got stuck<\/a>—do you fundamentally trust <em>Perseverance<\/em> to operate autonomously?<\/strong><\/p><p><strong>Maimone: <\/strong>I do. We built the software, tested it, ran millions of simulations, and did lots of work in the field in many different test environments. It hasn’t steered us wrong yet. We’re looking forward to setting even bigger records.<\/p>"}, {"title": "Promise Robotics partners with D.R. Horton on physical AI for homebuilding", "source": "Robotics Business Review", "date": "2026-10-13", "url": "https://www.therobotreport.com/promise-robotics-partners-d-r-horton-physical-ai-homebuilding/", "summary": "<p>Promise Robotics has signed a multi-year partnership with America's largest homebuilder by volume to bring physical AI to construction.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/promise-robotics-partners-d-r-horton-physical-ai-homebuilding/\">Promise Robotics partners with D.R. Horton on physical AI for homebuilding<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Hello Robot, A&K Robotics to discuss how robots navigate crowded indoor spaces at RoboBusiness", "source": "Robotics Business Review", "date": "2026-10-13", "url": "https://www.therobotreport.com/hello-robot-ak-robotics-discuss-how-robots-navigate-crowded-indoor-spaces-robobusiness/", "summary": "<p>As robots move beyond warehouses and other controlled environments and into everyday life, navigation challenges will be critical.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/hello-robot-ak-robotics-discuss-how-robots-navigate-crowded-indoor-spaces-robobusiness/\">Hello Robot, A&#038;K Robotics to discuss how robots navigate crowded indoor spaces at RoboBusiness<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "NYSOFA expands partnership with Intuition Robotics to bring ElliQ to more seniors", "source": "Robotics Business Review", "date": "2026-10-13", "url": "https://www.therobotreport.com/nysofa-expands-partnership-intuition-robotics-bring-elliq-more-seniors/", "summary": "<p>With the expansion, NYSOFA and Intuition Robotics established a new three-year, $2.1 million agreement to keep rolling out ElliQ.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/nysofa-expands-partnership-intuition-robotics-bring-elliq-more-seniors/\">NYSOFA expands partnership with Intuition Robotics to bring ElliQ to more seniors<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Closing the reality gap: Why real-time execution has become the new competitive advantage", "source": "Robotics Business Review", "date": "2026-10-12", "url": "https://www.therobotreport.com/closing-reality-gap-why-real-time-execution-has-become-new-competitive-advantage/", "summary": "<p>Daifuku's Cecile Dick-Calmes said success is no longer measured solely by automation density or equipment utilization.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/closing-reality-gap-why-real-time-execution-has-become-new-competitive-advantage/\">Closing the reality gap: Why real-time execution has become the new competitive advantage<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Will ‘boring’ robots win in the real world? Why robotic form should follow workflow", "source": "Robotics Business Review", "date": "2026-10-11", "url": "https://www.therobotreport.com/will-boring-robots-win-in-the-real-world-why-robotic-form-should-follow-workflow/", "summary": "<p>If we want to move physical AI from social media feeds to a sustained commercial level, we must reverse our current approach.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/will-boring-robots-win-in-the-real-world-why-robotic-form-should-follow-workflow/\">Will &#8216;boring&#8217; robots win in the real world? Why robotic form should follow workflow<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Why dexterity is physical AI’s real bottleneck", "source": "Robotics Business Review", "date": "2026-10-10", "url": "https://www.therobotreport.com/why-dexterity-is-physical-ai-real-bottleneck/", "summary": "<p>The next major challenge in robotic dexterity is making the entire system reliable enough to turn capabilities into useful work.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/why-dexterity-is-physical-ai-real-bottleneck/\">Why dexterity is physical AI&#8217;s real bottleneck<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Video Friday: Robot Decommissioning Takes a Fun Turn", "source": "IEEE Spectrum Robotics", "date": "2026-10-09", "url": "https://spectrum.ieee.org/video-friday-reachy-mini-raps", "summary": "<img src=\"https://spectrum.ieee.org/media-library/an-ai-generated-image-of-a-smiling-humanoid-robot-in-robe-free-falls-into-deep-pit-filled-with-colorful-balls.jpg?id=68398684&amp;width=1245&amp;height=700&amp;coordinates=0%2C0%2C0%2C1\" /><br /><br /><p><span>Video Friday is your weekly selection of awesome robotics videos, collected by your friends at <\/span><em>IEEE Spectrum<\/em><span> robotics. We also post a weekly calendar of upcoming robotics events for the next few months. Please <\/span><a href=\"mailto:automaton@ieee.org?subject=Robotics%20event%20suggestion%20for%20Video%20Friday\">send us your events<\/a><span> for inclusion.<\/span><\/p><h5><a href=\"https://www.corl.org/\">CoRL 2026<\/a>: 9–12 November 2026, AUSTIN<\/h5><h5><a href=\"https://2026.ieee-humanoids.org/\">Humanoids 2026<\/a>: 6–9 December 2026, SANTA CLARA, CA<\/h5><p>Enjoy today’s videos!<\/p><div class=\"horizontal-rule\"><\/div><div><span style=\"display: none;\"> <\/span><\/div><p class=\"rm-anchors\" id=\"vsqiozzff-g\">It’s possible that I wasn’t the only one who thought that <a href=\"https://spectrum.ieee.org/video-friday-bioinspired-robotics\" target=\"_blank\">Figure’s recent stunt<\/a> was somewhat ridiculous.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>Devanthro is, in fact, selling these plastic balls for $1,000 each, and they’ll arrive in time for Christmas.<\/p><p>[ <a href=\"https://devanthro.myshopify.com/\">Devanthro<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"hfvuu1kmi-a\">Not that anyone uses ringtones anymore, but if we did, this would be absolutely everywhere, and I’d be loving it.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://pollen-robotics.com/\">Pollen<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"lanimroojeo\">Let’s not get too excited, but this threadlike linear motor is pretty sweet.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adma.75156\">Ecole Polytechnique Fédérale de Lausanne LMTS<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"oejn1ggmsi8\">What is this robot for? It’s for doing exactly what you see here, that’s what it’s for.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://rai-inst.com/resources/blog/introducing-exploy-simplifying-rl-policy-deployment-in-autonomous-robotics/\">RAI Institute<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"oxeomba-eew\"><em>Humanoid robots still struggle to plan contact-rich whole-body manipulation from egocentric RGB and proprioception. Workhorse learns such manipulation from robot-free human demonstrations. On a real Unitree G1, Workhorse sorts boxes with its hands and a kick, catches a thrown box, and topples and climbs a suitcase.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>Yeah that happens to me too when I have a communication failure.<\/p><p>[ <a href=\"https://hybridrobotics.github.io/workhorse/\">Hybrid Robotics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"vg9ycujrxag\">A car wash that models your vehicle, then cleans it with robot arms? Interesting idea.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>The recent reviews from this location suggest that the robots aren’t quite up to snuff yet, but it really seems like there’s potential here.<\/p><p>[ <a href=\"https://www.kuka.com/en-us/industries/solutions-database/2026/09/touchless-car-washing-with-robots/\">KUKA<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"_14hvdlehym\">So this is not the worst idea I’ve ever seen for what to do with humanoid robots.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.ehangzhou.gov.cn/2026-10/08/c_299254.htm\">DEEP Robotics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"7owu19bs0zw\">Some lovely manipulation with a deceptively simple gripper.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://generalistai.com/blog/gen-1.5\">Generalist<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"ufoymnzvlvu\">I am genuinely embarrassed to say that this <a href=\"https://spectrum.ieee.org/how-boston-dynamics-taught-its-robots-to-dance\" target=\"_blank\">robot dances<\/a> better than I do.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://generalroboticslab.com/CoDance\">General Robotics Lab<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"jwskw4u0-py\"><em>MIT researchers developed SANDO, a new navigation system that helps robots safely navigate unfamiliar environments while avoiding moving obstacles. The system can rapidly plan and adjust a collision-free path using onboard sensors and computing, with safety backed by mathematical guarantees.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://news.mit.edu/2026/planning-system-ensures-robots-flight-path-will-remain-collision-free-1007\">MIT News<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"y1qepwfahu8\">Can you spot the part of this video that I’m side-eyeing?<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>Yep, it’s where the middle clip starts after the hand already has a good grip on that peelable strip.<\/p><p>[ <a href=\"https://sanctuary.ai/\">Sanctuary AI<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"uhdcii-icjs\"><em>Inspired by feather stars, the NC State researchers report a soft underwater swimming robot capable of achieving three distinct swimming modes—jellyfishlike vertical swimming, fishlike directional steering, and rotorlike 3D reorientation—using only two pneumatic inputs.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://news.ncsu.edu/2026/10/feather-star-robot/\">NC State University<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"pwuq4whzskm\">Here’s a series of mini-keynotes from ICRA earlier this year on manipulation, humanoids, and embodied design.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://2026.ieee-icra.org/program/keynote-sessions/\">ICRA 2026<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div>"}, {"title": "Why humanoid robot demos still fail the generalization test", "source": "Robotics Business Review", "date": "2026-10-09", "url": "https://www.therobotreport.com/why-humanoid-robot-demos-still-fail-the-generalization-test/", "summary": "<p>How better data and human judgment can help robots move beyond demos toward reliable real-world performance.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/why-humanoid-robot-demos-still-fail-the-generalization-test/\">Why humanoid robot demos still fail the generalization test<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Boston Dynamics gives more insight into its redesigned humanoid hand", "source": "Robotics Business Review", "date": "2026-10-09", "url": "https://www.therobotreport.com/boston-dynamics-gives-more-insight-into-its-redesigned-humanoid-hand/", "summary": "<p>The Robot Report spoke with Alberto Rodriguez, the director of robot behavior for Atlas at Boston Dynamics, about the humanoid's new hand.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/boston-dynamics-gives-more-insight-into-its-redesigned-humanoid-hand/\">Boston Dynamics gives more insight into its redesigned humanoid hand<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Groceryshop 2026 shows that retail robots are ready to scale, use AI", "source": "Robotics Business Review", "date": "2026-10-09", "url": "https://www.therobotreport.com/groceryshop-2026-shows-retail-robots-ready-scale-use-ai/", "summary": "<p>Groceryshop 2026 not only featured mobile robots for taking inventory, but it also showed how retail automation is evolving.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/groceryshop-2026-shows-retail-robots-ready-scale-use-ai/\">Groceryshop 2026 shows that retail robots are ready to scale, use AI<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Into the Omniverse: How Developers Turn Ideas Into Simulations With Frontier AI Agents", "source": "NVIDIA Robotics", "date": "2026-10-08", "url": "https://blogs.nvidia.com/blog/developers-simulation-frontier-ai-agents/", "summary": "Turning a simulation idea into a working application means assembling assets, connecting physics and rendering, and checking that the scene behaves as intended. Developers are combining frontier AI models with NVIDIA Omniverse libraries to help carry out that work — building applications for exploring scenarios, investigating failures and improving designs. Developers direct AI agents through [&#8230;]"}, {"title": "This Disembodied Hand Is All the Robot You Need", "source": "IEEE Spectrum Robotics", "date": "2026-10-08", "url": "https://spectrum.ieee.org/walking-robotic-hand", "summary": "<img src=\"https://spectrum.ieee.org/media-library/a-detached-robotic-hand-using-its-five-fingers-to-walk.jpg?id=68383398&amp;width=1245&amp;height=700&amp;coordinates=0%2C187%2C0%2C188\" /><br /><br /><p><a href=\"https://spectrum.ieee.org/biomimetic-anthropomorphic-robot-hand\" target=\"_blank\">A hand<\/a> attached to the end of an arm is a given for most humans, but what if robots didn’t have to play by the same rules as we do? Researchers from ETH Zurich have turned an off-the-shelf robotic hand into <a href=\"https://srl-ethz.github.io/website-fingers-as-legs/\" rel=\"noopener noreferrer\" target=\"_blank\">a completely self-contained robot<\/a> that walks on its fingertips while using those same fingers to manipulate its environment.<\/p><p>Besides making the perfect Halloween accessory for anyone planning to dress up as a member of the Addams Family—who were famously accompanied by a disembodied walking hand <a href=\"https://en.wikipedia.org/wiki/Thing_(The_Addams_Family)\" rel=\"noopener noreferrer\" target=\"_blank\">called Thing<\/a>—this robotic hand could make it possible to operate controls and handle objects in places a traditional robot arm can’t reach, the researchers say.<\/p><p class=\"shortcode-media shortcode-media-youtube\"> <span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span> <small class=\"image-media media-photo-credit\"><a href=\"https://www.youtube.com/watch?v=93BLyBPAfYs\" target=\"_blank\">Soft Robotics Lab, ETH Zurich/YouTube<\/a><\/small> <\/p><p><a href=\"https://srl.ethz.ch/the-group/people/amirhossein-kazemipour.html\" rel=\"noopener noreferrer\" target=\"_blank\">Amirhossein Kazemipour<\/a>, a Ph.D. candidate in the <a href=\"https://srl.ethz.ch/\" rel=\"noopener noreferrer\" target=\"_blank\">Soft Robotics Lab at ETH Zurich<\/a> who led the project, believes this hand could prove useful in contexts like fiddly maintenance tasks in industrial settings, or in search and rescue, where a robot could detach its hand to explore confined spaces too tight for the rest of its body. More broadly, he says, the work is a step toward a new approach to robotics in which body parts are not confined to a single role.<\/p><p>“I wanted to see how much a robotic hand could do without the rest of the robot,” Kazemipour told <em><em>IEEE Spectrum<\/em><\/em>. “Instead of having this traditional view of robotic parts, what if we could use those parts to do other tasks that they are not designed to do?”<\/p><p>This is <a href=\"https://spectrum.ieee.org/epfl-lasa\" target=\"_blank\">not the first attempt<\/a> to <a href=\"https://www.nature.com/articles/s41467-025-67675-8\" rel=\"noopener noreferrer\" target=\"_blank\">get a robot hand to walk<\/a>, but previous work has typically relied on specially designed hands. The ETH team instead decided to use off-the-shelf hardware from <a href=\"https://www.wuji.tech/en/\" rel=\"noopener noreferrer\" target=\"_blank\">Wuji Technology<\/a>, augmented with an 80-gram backpack containing a battery, an inertial measurement unit (IMU), and a Raspberry Pi Zero. Kazemipour says they decided to go with a commercial robot hand because they didn’t want to compromise on the hand’s manipulation capabilities. This introduced significant challenges, he adds, because a hand’s shape is optimized for grasping rather than crawling.<\/p><h2>How to Walk With Fingers<\/h2><p>To teach the hand to walk, the researchers trained a model in simulation using reinforcement learning—an approach in which models learn skills through many rounds of trial and error, receiving rewards for getting closer to the desired behavior along with penalties when they diverge from it. But Kazemipour says the unusual geometry of a hand meant they couldn’t just reuse methods used to train other kinds of legged robots. Standard quadrupeds or bipeds tend to be symmetrical on their left and right sides, which simplifies walking and balance, he says. Hands, in contrast, are not at all symmetrical, with fingers of different lengths and an opposable thumb.<\/p><p>In addition to rewards for moving at the right speed and in the right direction and penalties for things like wobbling or jerky movement, the team introduced a novel way to keep the hand in a crawling stance during the simulated training. To account for unequal digit length, they gave each finger its own target position relative to the palm, based on where it naturally sits when in the crawling posture. They then penalized the fingers for straying too far from that reference point, creating what they describe as “virtual springs” that pull the fingers back to the crawling stance. Crucially, the penalties for fingers moving forward and backward are significantly less than those for moving side to side, so taking steps in that way costs the hand very little compared with the rewards it receives for moving.<\/p><p>The team also trained separate models for skills like righting the hand when it falls over, pressing keys on a keyboard, and pushing objects to a target. All four models fit on the onboard computer, says Kazemipour, and the controller can switch between them as necessary. In real-world tests, the hand crawled across 14 different surfaces including smooth floors, metal grates, grass, and gravel. Other experiments confirmed that it could make both right and left turns, and hit an average speed of 9 centimeters per second. The hand was able to right itself in 21 of 25 trials. When given a video feed from an overhead camera, it even managed to autonomously push a 41-gram cube to targets up to 40 cm away 15 times in a row.<\/p><p>“What interests me most about this work is that the same fingers can move the hand, support its weight, and interact with its surroundings,” says <a href=\"https://www.rcast.u-tokyo.ac.jp/en/research/people/staff-inami_masahiko.html\" rel=\"noopener noreferrer\" target=\"_blank\">Masahiko Inami<\/a>, a professor at the University of Tokyo whose group has developed <a href=\"https://dl.acm.org/doi/10.1145/3745900.3746081\" rel=\"noopener noreferrer\" target=\"_blank\">hand-shaped walking robots<\/a>. He agrees that a mobile hand could be useful for reaching confined spaces and operating controls that an entire arm could not easily access, though he says practical deployment would require onboard perception and more robust navigation. <a href=\"https://smbys.github.io/#:~:text=Hideki%20Shimobayashi%20explores%20the%20Physical,of%20Tokyo%20(advised%20by%20Dr.\" rel=\"noopener noreferrer\" target=\"_blank\">Hideki Shimobayashi<\/a>, a Ph.D. student in Inami’s lab, also points out that walking puts very different loads on a hand compared to grasping, so durability may be a challenge.<\/p><p>However, <a href=\"https://www.me.columbia.edu/faculty/matei-ciocarlie\" rel=\"noopener noreferrer\" target=\"_blank\">Matei Ciocarlie<\/a>, an associate professor of mechanical engineering at Columbia University, says it’s a “cool result” that suggests robot hands don’t have to be restricted to the same capabilities as their human counterparts. “One can imagine an entirely new class of mobile manipulators that are simultaneously dexterous, able to traverse complex terrain, and able to manipulate payloads comparable in size to themselves,” he says.<\/p><p>Kazemipour sees his work as part of a longer-term vision for robots made up of parts that are not tied to a single job or even a single body plan, something he calls “autonomous modular embodiments.” “Robotic body parts should not be permanently assigned to a single function,” he says. “They can dynamically transition between roles, between being components of one embodiment system and autonomous agents, according to the task.”<\/p>"}, {"title": "Jabil discusses the pace of humanoid robot development and production", "source": "The Robot Report", "date": "2026-10-08", "url": "https://www.therobotreport.com/jabil-discusses-pace-humanoid-robot-development-production/", "summary": "<p>Jabil, which is working with robot developers such as Apptronik, provides a design perspective on humanoid progress.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/jabil-discusses-pace-humanoid-robot-development-production/\">Jabil discusses the pace of humanoid robot development and production<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Helm.ai reaches $70M in signed commercial contracts for its foundation models", "source": "Robotics Business Review", "date": "2026-10-08", "url": "https://www.therobotreport.com/helm-ai-reaches-70m-signed-commercial-contracts-foundation-models/", "summary": "<p>Helm.ai trained its foundation models using its unsupervised 'deep teaching' methodology to master the structure of the physical world itself.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/helm-ai-reaches-70m-signed-commercial-contracts-foundation-models/\">Helm.ai reaches $70M in signed commercial contracts for its foundation models<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "AWS launches open-source Physical AI Toolchain for robotics", "source": "Robotics Business Review", "date": "2026-10-08", "url": "https://www.therobotreport.com/aws-launches-open-source-physical-ai-toolchain-for-robotics/", "summary": "<p>The toolchain combines AWS and NVIDIA tools for synthetic data generation, model training, simulation and validation, edge deployment, and continuous improvement.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/aws-launches-open-source-physical-ai-toolchain-for-robotics/\">AWS launches open-source Physical AI Toolchain for robotics<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "SafeWorld emerges from stealth to build, deploy robot safety simulation technologies", "source": "Robotics Business Review", "date": "2026-10-08", "url": "https://www.therobotreport.com/safeworld-emerges-stealth-build-deploy-robot-safety-simulation-technologies/", "summary": "<p>SafeWorld’s platform provides testing and simulation software to help enterprises evaluate and deploy robots safely and responsibly.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/safeworld-emerges-stealth-build-deploy-robot-safety-simulation-technologies/\">SafeWorld emerges from stealth to build, deploy robot safety simulation technologies<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "HiPHI: A Large-Scale Benchmark for High-Precision Human Motion and Object Interaction", "source": "IEEE Spectrum Robotics", "date": "2026-10-07", "url": "https://content.knowledgehub.wiley.com/hiphi-a-large-scale-benchmark-for-high-precision-human-motion-and-object-interaction/", "summary": "<img src=\"https://spectrum.ieee.org/media-library/noitom-robotics-logo-with-stylized-nr-monogram-on-transparent-background.png?id=68382308&amp;width=980\" /><br /><br /><p><span>This White Paper gives robotics researchers and engineers an overview of a new large-scale motion capture dataset built to close the data gap limiting humanoid robot learning. It also shows how policies trained on the dataset transfer to a real humanoid robot.<\/span><\/p><p><strong>What you will learn about: <\/strong><\/p><ul><li>Why humanoid robot learning, a central problem in embodied AI and Physical AI, needs data that internet video and existing motion capture datasets cannot provide. <\/li><li><span><span>How <\/span><span>FrameNet<\/span><span>, a linguistic framework for human action, can guide motion capture collection to systematically cover a broad range of whole-body motion.<\/span><\/span> <\/li><li><span><span>Why synchronized object trajectories and meshes make human-object interaction data useful for teaching <\/span><span>robots<\/span> real-world tasks such as carrying, pushing, and pulling.<\/span> <\/li><li><span>How reinforcement learning policies trained on this motion capture data improve with scale, and how sim-to-real transfer carries them onto a physical humanoid robot.<\/span><\/li><\/ul><div><a href=\"https://content.knowledgehub.wiley.com/hiphi-a-large-scale-benchmark-for-high-precision-human-motion-and-object-interaction/\" target=\"_blank\">Download this free whitepaper now!<\/a><\/div>"}, {"title": "Teradyne Robotics, Elite Robots settle cobot dispute", "source": "Robotics Business Review", "date": "2026-10-07", "url": "https://www.therobotreport.com/terayne-robotics-elite-robots-settle-cobot-dispute/", "summary": "<p>Teradyne Robotics and Elite Robots have settled their software dispute, ending the legal case without disclosing the terms of the agreement.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/terayne-robotics-elite-robots-settle-cobot-dispute/\">Teradyne Robotics, Elite Robots settle cobot dispute<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Harmonic Drive to share how integrated actuators can reduce engineering at RoboBusiness", "source": "Robotics Business Review", "date": "2026-10-07", "url": "https://www.therobotreport.com/harmonic-drive-share-how-integrated-actuators-reduce-engineering-robobusiness/", "summary": "<p>Attendees will learn how integrated actuators can reduce engineering effort by simplifying system integration.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/harmonic-drive-share-how-integrated-actuators-reduce-engineering-robobusiness/\">Harmonic Drive to share how integrated actuators can reduce engineering at RoboBusiness<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "PTC acquisition positions Schneider Electric to challenge Siemens", "source": "Robotics Business Review", "date": "2026-10-07", "url": "https://www.therobotreport.com/ptc-acquisition-positions-schneider-electric-challenge-siemens/", "summary": "<p>The Schneider Electric acquisition of PTC gives it a 'digital thread' from design through operations, but it needs to integrate data and software, says Interact Analysis.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/ptc-acquisition-positions-schneider-electric-challenge-siemens/\">PTC acquisition positions Schneider Electric to challenge Siemens<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Sovereign AI, same landlord — thoughts on the physical AI race", "source": "Robotics Business Review", "date": "2026-10-06", "url": "https://www.therobotreport.com/sovereign-ai-same-landlord-thoughts-physical-ai-race/", "summary": "<p>While physical AI architecture alternatives are growing in number, NVIDIA has taken a sovereign strategy to ensuring its role. <\/p>\n<p>The post <a href=\"https://www.therobotreport.com/sovereign-ai-same-landlord-thoughts-physical-ai-race/\">Sovereign AI, same landlord &#8212; thoughts on the physical AI race<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "FireDome builds autonomous ‘artillery’ for wildfire defense", "source": "Robotics Business Review", "date": "2026-10-06", "url": "https://www.therobotreport.com/firedome-builds-autonomous-artillery-for-wildfire-defense/", "summary": "<p>FireDome builds autonomous wildfire defense systems to protect communities and infrastructure before firefighters arrive.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/firedome-builds-autonomous-artillery-for-wildfire-defense/\">FireDome builds autonomous &#8216;artillery&#8217; for wildfire defense<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Overview AI launches OV Spark line of AI inspection cameras", "source": "Robotics Business Review", "date": "2026-10-06", "url": "https://www.therobotreport.com/overview-ai-launches-ov-spark-line-ai-inspection-cameras/", "summary": "<p>The OV Spark and OV Spark Pro AI inspection cameras are available now through Overview AI and its distribution partners.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/overview-ai-launches-ov-spark-line-ai-inspection-cameras/\">Overview AI launches OV Spark line of AI inspection cameras<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Boston Dynamics appoints former Amazon exec Rohit Prasad as new CEO", "source": "Robotics Business Review", "date": "2026-10-06", "url": "https://www.therobotreport.com/boston-dynamics-appoints-former-amazon-executive-rohit-prasad-new-ceo/", "summary": "<p>Before Boston Dynamics, Prasad served as senior vice president and head scientist for Alexa and artificial general intelligence at Amazon.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/boston-dynamics-appoints-former-amazon-executive-rohit-prasad-new-ceo/\">Boston Dynamics appoints former Amazon exec Rohit Prasad as new CEO<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Pegasus 1.6 brings video understanding to physical AI, says TwelveLabs", "source": "Robotics Business Review", "date": "2026-10-06", "url": "https://www.therobotreport.com/pegasus-1-6-brings-video-understanding-physical-ai-says-twelvelabs/", "summary": "<p>TwelveLabs says its Pegasus 1.6 model understands first-person video and supports workflows including labeling for robotics developers.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/pegasus-1-6-brings-video-understanding-physical-ai-says-twelvelabs/\">Pegasus 1.6 brings video understanding to physical AI, says TwelveLabs<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "FCC robot restrictions could accelerate shift to local AI", "source": "Robotics Business Review", "date": "2026-10-05", "url": "https://www.therobotreport.com/fcc-robot-restrictions-could-accelerate-shift-to-local-ai/", "summary": "<p>Companies deploying physical AI today need to decide which AI workloads belong on the robot, what can remain in the cloud, and whether the underlying technology stack can meet rising expectations for security, safety, and supply-chain transparency.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/fcc-robot-restrictions-could-accelerate-shift-to-local-ai/\">FCC robot restrictions could accelerate shift to local AI<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Teradyne invests in Bright Machines to bring robotics to AI infrastructure manufacturing", "source": "Robotics Business Review", "date": "2026-10-05", "url": "https://www.therobotreport.com/teradyne-invests-ibright-machines-brings-robotics-ai-infrastructure-manufacturing/", "summary": "<p>The companies plan to integrate Teradyne robotics and test technologies with the Bright Machines manufacturing platform. <\/p>\n<p>The post <a href=\"https://www.therobotreport.com/teradyne-invests-ibright-machines-brings-robotics-ai-infrastructure-manufacturing/\">Teradyne invests in Bright Machines to bring robotics to AI infrastructure manufacturing<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "How robotics and physical AI can responsibly tackle key physical security challenges", "source": "Robotics Business Review", "date": "2026-10-04", "url": "https://www.therobotreport.com/how-robotics-physical-ai-can-responsibly-tackle-key-physical-security-challenges/", "summary": "<p>Cyber and physical security threats are rapidly evolving, but robotics and AI can evolve to meet them, writes a columnist.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/how-robotics-physical-ai-can-responsibly-tackle-key-physical-security-challenges/\">How robotics and physical AI can responsibly tackle key physical security challenges<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "The physical AI race will be won in the patent office", "source": "Robotics Business Review", "date": "2026-10-03", "url": "https://www.therobotreport.com/physical-ai-race-will-be-won-in-patent-office/", "summary": "<p>Patent protection is important for robotics startups, but they should be strategic in determining what IP is important, says Lightbringer.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/physical-ai-race-will-be-won-in-patent-office/\">The physical AI race will be won in the patent office<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Calling robotics startups: Submissions for the 2026 Robotics Startup Radar close soon", "source": "Robotics Business Review", "date": "2026-10-02", "url": "https://www.therobotreport.com/calling-all-robotics-startups-apply-now-2026-robotics-startup-radar/", "summary": "<p>Submit now to be part of the Robotics Startup Radar, which brings together some of the most promising robotics startups.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/calling-all-robotics-startups-apply-now-2026-robotics-startup-radar/\">Calling robotics startups: Submissions for the 2026 Robotics Startup Radar close soon<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Video Friday: Albatross Falls, Spins, Self-Rights, and Sails Away", "source": "IEEE Spectrum Robotics", "date": "2026-10-02", "url": "https://spectrum.ieee.org/video-friday-bioinspired-robotics", "summary": "<img src=\"https://spectrum.ieee.org/media-library/futuristic-robotic-bird-gliding-low-above-water-with-a-trailing-wire.png?id=68024679&amp;width=1245&amp;height=700&amp;coordinates=0%2C275%2C0%2C276\" /><br /><br /><p><span>Video Friday is your weekly selection of awesome robotics videos, collected by your friends at <\/span><em>IEEE Spectrum<\/em><span> robotics. We also post a weekly calendar of upcoming robotics events for the next few months. Please <\/span><a href=\"mailto:automaton@ieee.org?subject=Robotics%20event%20suggestion%20for%20Video%20Friday\">send us your events<\/a><span> for inclusion.<\/span><\/p><h5><a href=\"https://www.corl.org/\">CoRL 2026<\/a>: 9–12 November 2026, AUSTIN<\/h5><h5><a href=\"https://2026.ieee-humanoids.org/\">Humanoids 2026<\/a>: 6–9 December 2026, SANTA CLARA, CA<\/h5><p>Enjoy today’s videos!<\/p><div class=\"horizontal-rule\"><\/div><div><span style=\"display: none;\"> <\/span><\/div><blockquote class=\"rm-anchors\" id=\"j8curj0ydxi\"><em>We’ve developed ALBATROSS (Airborne Lander with Buoyant AuToROtating Sailing Sensor), a hybrid aerial-marine robot. It can be released from the air, autorotate down to the water without a parachute, passively self-right after landing, and then reuse the same rigid wings as sails for autonomous wind-powered navigation.<\/em><em>The key idea is to make the physical structures do as much of the work as possible. Rather than carrying separate systems for aerial descent, landing, and marine propulsion, ALBATROSS uses the same wings for both autorotation and sailing, with minimal actuation. Ultimately, we’re interested in whether platforms like this could combine rapid aerial deployment with persistent, energy-efficient marine sensing.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.sutd.edu.sg/\" target=\"_blank\">Singapore University of Technology and Design<\/a> ] paper via [ <a href=\"https://www.science.org/doi/10.1126/scirobotics.aed1423\">Science Robotics<\/a> ]<\/p><p>Thanks, Shane!<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"pfah5oqdpdm\">I’m just getting so burnt out on the <a href=\"https://spectrum.ieee.org/robot-martial-arts\" target=\"_blank\">humanoid publicity stunts<\/a>, you know?<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.figure.ai/news/f-02-decommission\">Figure<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"_j6cd1smsza\"><em>Sharpa unveiled three major proprietary new products at the IEEE/RSJ International Conference on Intelligent Robots and Systems (IROS): D01, the first integrated tactile-sensing robot built for dexterous manipulation; W02, a next-generation fully tactile, ultracompact, lightweight dexterous hand; and AE01, a high-fidelity haptic exoskeleton data glove.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.sharpa.com/blogs/news/sharpa-launches-three-flagship-products-at-iros-pushing-the-boundaries-of-dexterous-manipulation\">Sharpa<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"cfs_zu1kwqw\"><em>Why will Boston Dynamics win the humanoid robotics race? We’ve already commercialized autonomous mobile robots, creating markets with Spot and Stretch. Now we’re doing it again with Atlas: learning in real environments, designing for manufacturing at scale, and introducing a new era of physical intelligence.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://bostondynamics.com/news/boston-dynamics-opens-robotics-metaplant-application-center-to-train-humanoid-robots-for-manufacturing-tasks/\">Boston Dynamics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"fvk2n5exr_u\"><em>This work presents a lightweight, compliant footpad that enhances the terrain adaptability of a hopping robot. The design combines a planar foot supported by a compliant spherical joint for self‑alignment with embedded spines to improve traction on uneven or slippery surfaces.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://climb.mie.utoronto.ca/\">CLIMB Lab, University of Toronto<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"ozd8vyccygy\"><em>Heterogeneous robot teams distribute complementary capabilities across specialized agents, but their physical roles and capacities typically remain fixed throughout a mission. We present HARP, a Heterogeneous Aerial Robotic modules Platform, in which independently deployable aerial robots physically reconfigure to compose their capabilities for field operations.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://generalroboticslab.com/HARP\">General Robotics Lab<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"rr05thcb6mg\">Some very impressive mobility from <a href=\"https://spectrum.ieee.org/video-friday-anymals-and-animals\" target=\"_blank\">ANYmal<\/a>.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://arxiv.org/abs/2601.17428\">ETH Zurich RSL<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"a-8o8l_zc4a\">Daniel writes, “I’m a high school student in Canada, and I built a self-constructing robot arm that assembles itself. It’s designed to be low-cost, with disaster response in mind: Small robots can squeeze through gaps in rubble but are too weak to move things, while big arms are strong but can’t fit through. My arm is split into three wheeled modules that travel separately, then dock together using a spring-lock mechanism.”<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.youtube.com/@DanielZhu-y1y\">Daniel Zhu<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"rnt97btyqrq\"><a href=\"https://spectrum.ieee.org/rivian-self-driving\" target=\"_blank\">Autonomous highway driving<\/a> not impressive enough for you? Try this.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.xpeng.com/news/01a0f7644454a0e70a9e8a02823600e0\">XPENG<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"aqb3m8j1l88\"><em>The IT Imperial team has connected MaleCNS—a published connectome of a male fruit fly (Drosophila melanogaster)—to a physical Unitree G1 humanoid robot. The system creates a closed loop: camera → fruit-fly neural model → motor decoding → physical robot movement. The robot receives visual input through its stereo camera. The images are transformed into a representation adapted to the fly’s visual system, processed by the computational model based on the reconstructed nervous system, and then converted into movement commands for the robot.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://itimperial.group/en\">IT Imperial<\/a> ]<\/p><p>Thanks, Anna!<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"mhfh0fah5fy\">My guess is that this is far easier than it looks or far harder than it looks, and I’m honestly not sure which.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.ahadjawaid.com/nac\">Paper<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"eqb015r0290\">I cannot believe that this is still a thing, but good on them!<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.tevel-tech.com/\">Tevel<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"7wo36jslsto\"><em>In Part 1 of Dexterity Explained, we break down what manual dexterity is, why it matters, and how robotic hands and physical AI work together to bring greater skill, precision, and control to physical tasks.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://sanctuary.ai/solutions/\">Sanctuary AI<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"zgbm8pdtpgo\">XPENG has a lot of money to build a lot of these robots. They do look very human. I’m not sure what they’re going to do, though.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.xpeng.com/pressroom/news/01a03797fccda01e0de68a02a256006a\">XPENG<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"ae3-hjqw9ci\">That’s a lot of robots! Tell me what they’re all going to do!<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.ubtrobot.com/en/\">UBTECH<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"wtyg6u_sf18\"><em>When floods swept away roads and bridges in Nepal, local drone pilots stepped in to help map the damage, support search teams, and deliver essential supplies to communities cut off from help. In this episode of Ground Truth with Flying Labs, host Leka Tingitana speaks with Uttam Pudasaini, an advisor to Nepal Flying Labs, and Raj Bikram Maharjan, cofounder of Airlift Technology, about the drone community’s response to the devastating floods of 26 August 2026.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://flyinglabs.org/nepal\">WeRobotics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div>"}, {"title": "Runway introduces Praxis-1 world action model for robotics", "source": "Robotics Business Review", "date": "2026-10-02", "url": "https://www.therobotreport.com/runway-introduces-praxis-1-world-action-model-robotics/", "summary": "<p>When Runway does release Praxis-1 publicly, it plans to ship it with open weights rather than as a closed model. <\/p>\n<p>The post <a href=\"https://www.therobotreport.com/runway-introduces-praxis-1-world-action-model-robotics/\">Runway introduces Praxis-1 world action model for robotics<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Inside Omron’s next-generation LD mobile robots", "source": "Robotics Business Review", "date": "2026-10-02", "url": "https://www.therobotreport.com/inside-omrons-next-generation-ld-mobile-robots/", "summary": "<p>In mobile robotics, software, safety, and fleet management are becoming just as important as the robot itself, according to an OMROM project manager.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/inside-omrons-next-generation-ld-mobile-robots/\">Inside Omron’s next-generation LD mobile robots<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Eli Lilly, Purdue to share field learnings on human robot interaction at RoboBusiness", "source": "Robotics Business Review", "date": "2026-10-02", "url": "https://www.therobotreport.com/eli-lilly-purdue-to-share-field-learnings-on-human-robot-interaction-at-robobusiness/", "summary": "<p>Experts from Eli Lilly and Purdue University will reveal findings about the perception of robots on the manufacturing floor.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/eli-lilly-purdue-to-share-field-learnings-on-human-robot-interaction-at-robobusiness/\">Eli Lilly, Purdue to share field learnings on human robot interaction at RoboBusiness<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Atlas Robot’s New Hand May Outperform Humanlike Designs", "source": "IEEE Spectrum Robotics", "date": "2026-10-01", "url": "https://spectrum.ieee.org/robust-robot-hand", "summary": "<img src=\"https://spectrum.ieee.org/media-library/close-up-of-a-robotic-hand-with-three-fingers-and-a-thumb-making-a-gesture-similar-to-the-sign-of-the-horns.jpg?id=67879402&amp;width=1245&amp;height=700&amp;coordinates=0%2C260%2C0%2C261\" /><br /><br /><p><span>Today, <\/span><a href=\"https://bostondynamics.com/\" target=\"_blank\">Boston Dynamics<\/a><span> is <a href=\"https://bostondynamics.com/blog/robot-hands-for-modern-ai-and-real-work/\" target=\"_blank\">announcing<\/a> a redesigned hand for its <\/span><a href=\"https://spectrum.ieee.org/atlas-humanoid-robot\" target=\"_self\">Atlas robot<\/a><span>. The previous generation could do some <\/span><a href=\"https://spectrum.ieee.org/robots-ces-2026\" target=\"_self\">crazy superhuman<\/a><span> things with its three fingers, but it was never intended for mass production in the tens or hundreds of thousands. Switching from research hardware to a scalable product makes previously ignorable questions suddenly paramount: How can you make a hand that does everything you need it to do but is also rugged and reliable and cost-effective? It’s questions like these that drove the design of the new Atlas hand, and while it doesn’t look much like a human hand, it might be a hand that makes it out into the real world.<\/span><\/p><p class=\"shortcode-media shortcode-media-youtube\"> <span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span> <small class=\"image-media media-caption\">- YouTube<\/small> <small class=\"image-media media-photo-credit\"> <a href=\"https://www.youtube.com/watch?v=4whgw2gLBS8\" target=\"_blank\">www.youtube.com<\/a> <\/small> <\/p><p>Compared to the almost <a href=\"https://clonerobotics.com/hand\" target=\"_blank\">eerily humanlike hands<\/a> designed by a litany of other <a href=\"https://www.1x.tech/discover/neos-hands\" target=\"_blank\">humanoid<\/a> <a href=\"https://www.unitree.com/Dex5-S\" rel=\"noopener noreferrer\" target=\"_blank\">robotics<\/a> <a href=\"https://www.figure.ai/\" rel=\"noopener noreferrer\" target=\"_blank\">companies<\/a>, Atlas’s new hand does look awfully clunky. We’ve certainly seen some of those robots with much more humanlike hands perform dexterous manipulation tasks that are, speaking as someone who has personally witnessed robots haplessly fumble their way through the world for nearly two decades now, nothing short of incredible. And it’s not just what these hands can do—it’s how they look while doing it, as slim, graceful mechanical copies of our own hands. They seem like science fiction, and to some extent, that’s exactly what they are.<\/p><p>“Hands are a ruthless design trade-off,” <a href=\"https://www.linkedin.com/in/alberto-rodriguez-5457661a8/\" rel=\"noopener noreferrer\" target=\"_blank\">Alberto Rodriguez<\/a>, director of robot behavior at Boston Dynamics, tells <em>IEEE Spectrum<\/em>. “There’s no way around it, you’re always giving up on something. And many of the current designs are giving up on things like reliability and manufacturability.” This is what invariably happens when you try and cram everything necessary to make a robotic hand function within the form factor of a human hand: It’s going to be either very fragile or very expensive, and likely both at the same time. The unfortunate reality is that for now, and likely for the immediate future, all that these sorts of hands are good for are research and demos.<\/p><p>With Atlas’s new hand, Boston Dynamics is making the design trade-offs necessary to achieve a hand that, according to the press release, is capable of a vast array of useful tasks, including using tools; is strong and rugged; can be cleanly simulated; can be mass-manufactured and repaired at reliably low cost; and is close enough in form factor to a human hand that human demonstrations can be used to train it.<\/p><p>You’ll notice that “looks cosmetically like a human hand” is nowhere on that list, and this new hand doesn’t. Rodriguez explains that getting rid of the pinky was a straightforward decision, agreed on after his team spent a day with their pinkies taped to their ring fingers. But why even add a fourth finger, when the previous generation of Atlas’ hand seemed to do well with only three? It’s not just the extra finger, but a complete redesign that almost doubled the degrees of freedom between the old hand and the new, going from 7 to 13. <\/p><p class=\"shortcode-media shortcode-media-rebelmouse-image\"> <img alt=\"Close-up of a splayed robotic hand with three fingers and a thumb.\" class=\"rm-shortcode\" id=\"8b02e\" src=\"https://spectrum.ieee.org/media-library/close-up-of-a-splayed-robotic-hand-with-three-fingers-and-a-thumb.jpg?id=67879501&amp;width=980\" /> <small class=\"image-media media-photo-credit\">Boston Dynamics<\/small><\/p><p>“We also added the ability for the fingers to splay open because we knew that it was important for one finger to be able to move against another, and we also knew that we needed to be able to hold the handle of a tool with a trigger,” Rodriguez says, which includes many common tools like drills or welding torches. “We’re convinced that from a product perspective, this hand should be able to do everything we need it to do for the foreseeable horizon.” And that ability to finger splay goes beyond what human hands are capable of. According to Rodriguez, “With reinforcement learning, we can discover uses for these superhuman extra motions and exploit them.”<\/p><p>Reliability, manufacturability, and cost are all closely related. By reducing the degrees of freedom relative to other more anthropomorphic hand designs down to just 13, Boston Dynamics can use fewer, larger, and more powerful actuators. The actuators are embedded directly into the joints themselves in a direct-drive configuration, with a transmission that allows the motors to be back-driven and react to force and contact. Each actuator pack is a single unit that can be easily replaced, and there are no delicate tendons or cables across joints to stretch and break. “What we’re working on right now is figuring out what needs to change in the fine details of our design if we want to make 100,000 of these hands a year,” Rodriguez says.<\/p><p>Not every humanoid company will make the trade-offs that Boston Dynamics has done here, and there’s still plenty of room for creativity when it comes to hand design. But if humanoids with hands are going to scale, some difficult decisions will have to be made, and it’ll take some compromise to deliver on the promises that the humanoid industry has committed to.<\/p>"}, {"title": "How Maven Robotics plans to automate industrial work, one task at a time", "source": "Robotics Business Review", "date": "2026-10-01", "url": "https://www.therobotreport.com/how-maven-robotics-plans-automate-industrial-work-one-task-at-a-time/", "summary": "<p>With the $100 million it raised earlier this month, Maven Robotics is looking towards mass producing its mobile manipulator robot.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/how-maven-robotics-plans-automate-industrial-work-one-task-at-a-time/\">How Maven Robotics plans to automate industrial work, one task at a time<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "ANYbotics launches Shift to streamline robot fleet operations, scale inspections", "source": "Robotics Business Review", "date": "2026-10-01", "url": "https://www.therobotreport.com/anybotics-launches-shift-streamline-robot-fleet-operations-scale-autonomous-inspections/", "summary": "<p>ANYbotics designed Shift to help maintenance teams run industrial inspections, detect failing equipment, and turn data into work orders.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/anybotics-launches-shift-streamline-robot-fleet-operations-scale-autonomous-inspections/\">ANYbotics launches Shift to streamline robot fleet operations, scale inspections<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Boston Dynamics drops pinkie on new humanoid hand", "source": "Robotics Business Review", "date": "2026-10-01", "url": "https://www.therobotreport.com/boston-dynamics-drops-pinkie-on-new-humanoid-hand/", "summary": "<p>Boston Dynamics engineers taped their pinkies and ring fingers together for a day to learn what they weren’t able to do.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/boston-dynamics-drops-pinkie-on-new-humanoid-hand/\">Boston Dynamics drops pinkie on new humanoid hand<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Precision In Motion. Vishay Precision Group, Inc. (VPG) to Showcase Custom Sensing Capabilities for Humanoid Robotics at RoboBusiness 2026", "source": "Robotics Business Review", "date": "2026-10-01", "url": "https://www.therobotreport.com/precision-in-motion-vishay-precision-group-inc-vpg-to-showcase-custom-sensing-capabilities-for-humanoid-robotics-at-robobusiness-2026/", "summary": "<p>As humanoid robots move from research labs into factories, warehouses, homes, and other shared spaces, accurate physical feedback becomes crucial.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/precision-in-motion-vishay-precision-group-inc-vpg-to-showcase-custom-sensing-capabilities-for-humanoid-robotics-at-robobusiness-2026/\">Precision In Motion. Vishay Precision Group, Inc. (VPG) to Showcase Custom Sensing Capabilities for Humanoid Robotics at RoboBusiness 2026<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Your Robot’s Safety Functions Already Work. What If the Input Lies?", "source": "Robotics Business Review", "date": "2026-10-01", "url": "https://www.therobotreport.com/your-robots-safety-functions-already-work-what-if-the-input-lies/", "summary": "<p>A robot can follow its safety rules and still act on manipulated information. See what this means for robot safety and how teams can strengthen their testing and evidence.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/your-robots-safety-functions-already-work-what-if-the-input-lies/\">Your Robot’s Safety Functions Already Work. What If the Input Lies?<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Top 10 robotics stories of September 2026", "source": "Robotics Business Review", "date": "2026-10-01", "url": "https://www.therobotreport.com/top-10-robotics-stories-of-september-2026/", "summary": "<p>In September 2026, live events such as IMTS, ROSCon, and iROS brought a flood of robotics developments.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/top-10-robotics-stories-of-september-2026/\">Top 10 robotics stories of September 2026<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Tackling construction labor shortages: ASI and SoftBank partner on autonomous fleets", "source": "Robotics Business Review", "date": "2026-09-30", "url": "https://www.therobotreport.com/tackling-construction-labor-shortages-asi-softbank-partner-autonomous-fleets/", "summary": "<p>ASI and SoftBank join forces with $225M to scale brand-agnostic autonomous heavy equipment across infrastructure projects.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/tackling-construction-labor-shortages-asi-softbank-partner-autonomous-fleets/\">Tackling construction labor shortages: ASI and SoftBank partner on autonomous fleets<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "The Robot Report parent Arrowfly launches AI for Engineers platform, events for engineers navigating AI", "source": "Robotics Business Review", "date": "2026-09-30", "url": "https://www.therobotreport.com/robot-report-parent-arrowfly-launches-ai-for-engineers-platform-events-engineers-navigating-ai/", "summary": "<p>The initiative for engineers includes a news desk, a conference, research, and an advisory board, grounded in trusted editorial brands.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/robot-report-parent-arrowfly-launches-ai-for-engineers-platform-events-engineers-navigating-ai/\">The Robot Report parent Arrowfly launches AI for Engineers platform, events for engineers navigating AI<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Innodata opens motion-capture lab to help humanoids move more like people", "source": "Robotics Business Review", "date": "2026-09-30", "url": "https://www.therobotreport.com/innodata-opens-motion-capture-lab-help-humanoids-move-more-like-people/", "summary": "<p>Innodata uses Vicon cameras to measure movements with sub-millimeter accuracy and to collect real-world training data for robots.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/innodata-opens-motion-capture-lab-help-humanoids-move-more-like-people/\">Innodata opens motion-capture lab to help humanoids move more like people<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Meet Flourish One, the Raspberry Pi-powered humanoid built for busy parents", "source": "Robotics Business Review", "date": "2026-09-29", "url": "https://www.therobotreport.com/meet-flourish-one-raspberry-pi-powered-humanoid-built-busy-parents/", "summary": "<p>Flourish is releasing a $3,555 phone-trainable home robot, targeting busy parents with personalized, cloud-trained chore automation.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/meet-flourish-one-raspberry-pi-powered-humanoid-built-busy-parents/\">Meet Flourish One, the Raspberry Pi-powered humanoid built for busy parents<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "State of Robots in Manufacturing", "source": "Robotics Business Review", "date": "2026-09-29", "url": "https://www.therobotreport.com/state-of-robots-in-manufacturing/", "summary": "<p>The Robot Report looks at recent advances in automation for manufacturing, from improvements in technologies and use cases to the potential of humanoids and AI.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/state-of-robots-in-manufacturing/\">State of Robots in Manufacturing<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "ForceN to give a crash course on force and torque sensing for humanoids at RoboBusiness", "source": "Robotics Business Review", "date": "2026-09-29", "url": "https://www.therobotreport.com/forcen-gives-crash-course-force-torque-sensing-humanoids-robobusiness-2026/", "summary": "<p>Attendees will learn about the many ways they can use force and torque sensors in humanoids and how to avoid breaking them while doing it.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/forcen-gives-crash-course-force-torque-sensing-humanoids-robobusiness-2026/\">ForceN to give a crash course on force and torque sensing for humanoids at RoboBusiness<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Gecko Robotics works with NVIDIA to add AI agent security and control", "source": "Robotics Business Review", "date": "2026-09-28", "url": "https://www.therobotreport.com/gecko-robotics-works-with-nvidia-adds-ai-agent-security-and-control/", "summary": "<p>Gecko Robotics is using the new NVIDIA Open Agent Safety Platform to ensure the secure autonomous control of systems.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/gecko-robotics-works-with-nvidia-adds-ai-agent-security-and-control/\">Gecko Robotics works with NVIDIA to add AI agent security and control<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Raise Robotics to discuss scaling field robots at RoboBusiness", "source": "Robotics Business Review", "date": "2026-09-28", "url": "https://www.therobotreport.com/raise-robotics-discuss-scaling-field-robots-robobusiness/", "summary": "<p>Raise Robotics said attendees will learn a decision rule for allocating engineering capacity and a vocabulary for two hidden failure modes.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/raise-robotics-discuss-scaling-field-robots-robobusiness/\">Raise Robotics to discuss scaling field robots at RoboBusiness<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "A Day in the Life of a Roboticist: Charlie Kemp", "source": "IEEE Spectrum Robotics", "date": "2026-09-28", "url": "https://robotsguide.com/learn/a-day-in-the-life-of-a-roboticist-charlie-kemp", "summary": "<img src=\"https://spectrum.ieee.org/media-library/man-standing-beside-a-tall-wheeled-robot-smiling-and-waving-at-the-camera.jpg?id=67880303&amp;width=1245&amp;height=700&amp;coordinates=0%2C187%2C0%2C188\" /><br /><br /><p>Building useful robots starts with understanding the people who use them. For Charlie Kemp, cofounder and chief technology officer of Hello Robot, that means developing assistive robots that can help people with everyday tasks and support greater independence.<\/p><p>In this <a href=\"https://robotsguide.com/\" target=\"_blank\">Robots Guide<\/a> profile, Kemp shares his path from studying artificial intelligence at MIT to building Stretch, explains how working with people with disabilities has shaped his approach, and offers advice for aspiring roboticists. <a href=\"https://robotsguide.com/learn/a-day-in-the-life-of-a-roboticist-charlie-kemp\" rel=\"noopener noreferrer\" target=\"_blank\">Read the full profile on IEEE’s Robots Guide.<\/a><\/p>"}, {"title": "Robonomics on the threshold: Economic autonomy, smart cities, and crypto wallets for humanoids", "source": "Robotics Business Review", "date": "2026-09-28", "url": "https://www.therobotreport.com/robotics-threshold-economic-autonomy-crypto-wallets-humanoids/", "summary": "<p>Economics is both a robotics impetus and a constraint, as systems make deliveries on streets or do chores in households.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/robotics-threshold-economic-autonomy-crypto-wallets-humanoids/\">Robonomics on the threshold: Economic autonomy, smart cities, and crypto wallets for humanoids<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Asimov’s laws are not enough to keep robotics and AI safe", "source": "Robotics Business Review", "date": "2026-09-27", "url": "https://www.therobotreport.com/asimovs-laws-are-not-enough-keep-robotics-ai-safe/", "summary": "<p>Asimov's fictional Three Laws of Robotics famously set safeguards, and tech observers today raise similar concerns about AI.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/asimovs-laws-are-not-enough-keep-robotics-ai-safe/\">Asimov&#8217;s laws are not enough to keep robotics and AI safe<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "From 14 cities to 15,000: What it will take to scale robotaxis?", "source": "Robotics Business Review", "date": "2026-09-26", "url": "https://www.therobotreport.com/from-14-cities-to-15000-what-it-will-take-to-scale-robotaxis/", "summary": "<p>While robotaxis prove their driving ability, scaling the industry globally requires solving the unglamorous challenge of fast, local vehicle servicing.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/from-14-cities-to-15000-what-it-will-take-to-scale-robotaxis/\">From 14 cities to 15,000: What it will take to scale robotaxis?<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Farmers are facing more pressure; CNH says robotics can help", "source": "Robotics Business Review", "date": "2026-09-25", "url": "https://www.therobotreport.com/farmers-are-facing-more-pressure-cnh-says-robotics-can-help/", "summary": "<p>Labor availability, costs, productivity, and efficiency are common concerns of farmers that technology can address, according to CNH. <\/p>\n<p>The post <a href=\"https://www.therobotreport.com/farmers-are-facing-more-pressure-cnh-says-robotics-can-help/\">Farmers are facing more pressure; CNH says robotics can help<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Video Friday: Life’s Better With a Little Robot Goose", "source": "IEEE Spectrum Robotics", "date": "2026-09-25", "url": "https://spectrum.ieee.org/video-friday-goose-household-robots", "summary": "<img src=\"https://spectrum.ieee.org/media-library/mobile-assistive-robot-with-articulated-arm-beside-
