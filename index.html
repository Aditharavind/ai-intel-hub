.patsnap.com/article/what-is-lpips-and-how-it-measures-perceptual-similarity\" target=\"_blank\">learned perceptual image patch similarity<\/a>, or LPIPS, while making sure that the design could still physically work. LPIPS is the difference between two images: a background image, and a background image with an overlay of the simulated spinning drone. The smaller that difference is, the more invisible that design is. It’s tricky for a human to consider all of the variables at once, but Rubenstein says that the final design does make intuitive sense, because “the automated pipeline prefers placements where components don’t visually overlap as it spins, or where the components are too close to the center of rotation.”<\/p><p class=\"shortcode-media shortcode-media-rebelmouse-image\"> <img alt=\"Two variations of minimalist drones made from a few thin rods, wires and a miniature circuit board. Both are barely visible when in-flight.\" class=\"rm-shortcode\" id=\"394e6\" src=\"https://spectrum.ieee.org/media-library/two-variations-of-minimalist-drones-made-from-a-few-thin-rods-wires-and-a-miniature-circuit-board-both-are-barely-visible-when.jpg?id=67480677&amp;width=980\" /> <small class=\"image-media media-caption\">Two iterations of Phantom Twist drones are shown with their handheld launching mechanisms. The better-optimized version [bottom row] relocates the launcher interface to remove components that are too close to the central axis, making them more visible.<\/small><small class=\"image-media media-photo-credit\">Michael Rubenstein/Northwestern University<\/small><\/p><p>Out of a starting set of around 20,000 feasible Phantom Twist configurations, the optimized design (the one that you see or don’t see in the pictures and videos) has a LPIPS score of 0.0104. A human-designed Phantom Twist is about twice as visible, with a LPIPS score of around 0.2, and a conventional quadrotor (of the same size) would be over 10 times more visible. And there’s still a bit more optimization that could be done with the electrical wiring as well as increasing the baseline transparency of the components themselves.<\/p><p>Phantom Twist is currently controlled using an optical tracking system, which means that it’s not yet capable of flying outside of a controlled environment. But Rubenstein has built <a href=\"https://www.roboticsproceedings.org/rss20/p102.pdf\" target=\"_blank\">other drones along similar principles<\/a> in the past, which have successfully flown outside, and he’s optimistic about using those techniques to break Phantom Twist out of the lab. The spinning behavior might even enable some useful sensing capabilities, he says. “An interesting possibility is mounting a camera on the spinning body. As the vehicle rotates, it could capture imagery in every direction, effectively creating a 360-degree view of its surroundings that could be used for onboard navigation and control.”<\/p><p>As for what a drone like Phantom Twist could be used for—assuming that the sound can be mitigated somewhat (and there are <a href=\"https://spectrum.ieee.org/pennysized-ionocraft-flies-with-no-moving-parts\" target=\"_self\">potential approaches to making that happen<\/a>), a stealthy microdrone could do all sorts of things with covert surveillance being the most obvious application. For his part, Rubenstein says that he’s personally excited about the potential for watching wildlife, “where a less-intrusive drone could observe animals while minimizing its impact on their natural behavior.” The elephants in particular <a href=\"https://spectrum.ieee.org/research-proves-drones-sound-like-bees-which-is-good-news-for-elephants\" target=\"_self\">would certainly appreciate that<\/a>.<\/p><p>For a deeper dive into all the particulars of this project, read the paper: <a href=\"https://arxiv.org/html/2605.11296v1\" target=\"_blank\"><em><em>Computational Design of a Low-Visibility UAV Using a Human-Aligned Perceptual Metric<\/em><\/em><\/a>, by Jingxian Wang, Chen Yu, David Matthews, Emma Alexander, Sam Kriegman, and Michael Rubenstein from Northwestern University, which is being presented this week at <a href=\"https://roboticsconference.org/\" target=\"_blank\">RSS 2026 in Sydney<\/a>.<\/p>"}, {"title": "TerraFirma raises $115M to build robotic infrastructure for construction", "source": "Robotics Business Review", "date": "2026-07-16", "url": "https://www.therobotreport.com/terrafirma-raises-115m-build-robotic-infrastructure-construction/", "summary": "<p>TerraFirma has developed a platform that combines AI-enabled software, a remote command-and-control center, and retrofitted heavy machinery.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/terrafirma-raises-115m-build-robotic-infrastructure-construction/\">TerraFirma raises $115M to build robotic infrastructure for construction<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Agility outlines six recommendations for U.S. humanoid robot policies", "source": "Robotics Business Review", "date": "2026-07-15", "url": "https://www.therobotreport.com/agility-outlines-six-recommendations-for-u-s-humanoid-robot-policies/", "summary": "<p>Peggy Johnson, CEO of Agility, said the U.S. needs a policy framework that can strengthen what's already working for the humanoid industry.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/agility-outlines-six-recommendations-for-u-s-humanoid-robot-policies/\">Agility outlines six recommendations for U.S. humanoid robot policies<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Vicarious Surgical board seeks to dissolve company", "source": "Robotics Business Review", "date": "2026-07-15", "url": "https://www.therobotreport.com/vicarious-surgical-board-seeks-to-dissolve-company/", "summary": "<p>The board is asking shareholders to approve their plan to dissolve and liquidate the business at a special meeting scheduled for July 21, but said it can not predict how much (if anything) investors would recover or when.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/vicarious-surgical-board-seeks-to-dissolve-company/\">Vicarious Surgical board seeks to dissolve company<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Icarus Robotics uses KULR technology to power JOY free-flying space robot", "source": "Robotics Business Review", "date": "2026-07-15", "url": "https://www.therobotreport.com/icarus-robotics-uses-kulr-technology-to-power-joy-free-flying-space-robot/", "summary": "<p>Under the agreement, KULR will supply its KULR ONE Space battery systems to power JOY’s onboard systems on the ISS.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/icarus-robotics-uses-kulr-technology-to-power-joy-free-flying-space-robot/\">Icarus Robotics uses KULR technology to power JOY free-flying space robot<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Walden Robotics launches at $1.1B valuation for general-purpose robots", "source": "Robotics Business Review", "date": "2026-07-15", "url": "https://www.therobotreport.com/walden-robotics-launches-1-1b-valuation-general-purpose-robots/", "summary": "<p>Leading technology companies have invested in Walden Robotics, which emerged from stealth as it develops full-stack physical AI.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/walden-robotics-launches-1-1b-valuation-general-purpose-robots/\">Walden Robotics launches at $1.1B valuation for general-purpose robots<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "NVIDIA Introduces New Jetson Thor Computers to Advance Mainstream Robotics and Edge AI", "source": "NVIDIA Robotics", "date": "2026-07-15", "url": "https://blogs.nvidia.com/blog/jetson-thor-robotics-edge-ai-agent/", "summary": "General-purpose robots and autonomous machines are moving from research labs to real-world mass-market deployment, creating demand for compact, power-efficient AI supercomputers capable of running foundation models at the edge.  To meet that need, NVIDIA today introduced the T3000 and T2000, new modules based on the NVIDIA Thor architecture that enable mass-market robotics and edge AI [&#8230;]"}, {"title": "NVIDIA shares how to evaluate general-purpose robot policies for real-world deployment", "source": "Robotics Business Review", "date": "2026-07-14", "url": "https://www.therobotreport.com/nvidia-shares-how-evaluate-general-purpose-robot-policies-real-world-deployment/", "summary": "<p>RoboLab research powers NVIDIA Isaac Lab-Arena, an open-source simulation framework for large-scale policy setup and evaluation. <\/p>\n<p>The post <a href=\"https://www.therobotreport.com/nvidia-shares-how-evaluate-general-purpose-robot-policies-real-world-deployment/\">NVIDIA shares how to evaluate general-purpose robot policies for real-world deployment<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Key to Humanoid Progress: Managing the Power Behind the Robots", "source": "Robotics Business Review", "date": "2026-07-14", "url": "https://www.therobotreport.com/key-to-humanoid-progress-managing-the-power-behind-the-robots/", "summary": "<p>Murata Power Solutions' John Quinlan on how advanced robotics converts, distributes and controls on-board power from battery to actuator. <\/p>\n<p>The post <a href=\"https://www.therobotreport.com/key-to-humanoid-progress-managing-the-power-behind-the-robots/\">Key to Humanoid Progress: Managing the Power Behind the Robots<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "The Robot Report parent company, WTWH Media, rebrands as Arrowfly", "source": "Robotics Business Review", "date": "2026-07-13", "url": "https://www.therobotreport.com/the-robot-report-parent-company-wtwh-media-rebrands-as-arrowfly/", "summary": "<p>The Arrowfly name unifies more than 40 brands under a new identity built for the future of B2B content and events.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/the-robot-report-parent-company-wtwh-media-rebrands-as-arrowfly/\">The Robot Report parent company, WTWH Media, rebrands as Arrowfly<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Yaskawa America gets information security certification", "source": "The Robot Report", "date": "2026-07-13", "url": "https://www.therobotreport.com/yaskawa-america-gets-information-seccurity-certification/", "summary": "<p>Yaskawa America said that independent ISO/IEC 27001:2022 certification shows its focus on protecting customer information.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/yaskawa-america-gets-information-seccurity-certification/\">Yaskawa America gets information security certification<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Ondas acquires DZYNE for $875.8M, expanding its defense capabilities", "source": "Robotics Business Review", "date": "2026-07-13", "url": "https://www.therobotreport.com/ondas-acquires-dzyne-875-8m-expanding-its-defense-capabilities/", "summary": "<p>DZYNE Technologies specializes in long-endurance autonomous aircraft, counter-drone systems, and autonomous effects.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/ondas-acquires-dzyne-875-8m-expanding-its-defense-capabilities/\">Ondas acquires DZYNE for $875.8M, expanding its defense capabilities<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Building a Foundation Stack for General-Purpose Robots", "source": "IEEE Spectrum Robotics", "date": "2026-07-13", "url": "https://spectrum.ieee.org/x-square-robot-embodied-ai-stack", "summary": "<img src=\"https://spectrum.ieee.org/media-library/humanoid-robot-folding-laundry-on-a-neatly-made-bed-in-a-sunlit-bedroom.png?id=67111698&amp;width=1245&amp;height=700&amp;coordinates=4%2C0%2C4%2C0\" /><br /><br /><p><em>This article is brought to you by <a href=\"https://x2robot.com/\" target=\"_blank\">X Square Robot<\/a>.<\/em><\/p><p>Large language models gave artificial intelligence a working recipe. Pretrain a large model on broad data, and general capability follows. Robotics has no such recipe. Robotics systems have long been assembled from separate perception, planning, and control parts that rarely add up to intelligence a robot can carry from one task to another, or one machine to another. The central problem in embodied AI is to find the equivalent recipe, and the field does not yet agree on what it is.<\/p><p><a href=\"https://x2robot.com/\" target=\"_blank\">X Square Robot<\/a>, a Chinese embodied-AI company, has made an unusually explicit bet. It argues that the recipe is an integrated stack, spanning the data a robot learns from, a world model for predicting changes in the physical world, and an action model that brings together perception, planning, reasoning, and decision-making to generate executable robot behavior. The company also believes that the stack should be built and <a href=\"https://x2robot.com/en/research\" target=\"_blank\">released in the open<\/a>.<\/p><p class=\"shortcode-media shortcode-media-youtube\"> <span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span> <small class=\"image-media media-caption\">X Square Robot shares its vision of bringing robots into real homes.<\/small><small class=\"image-media media-photo-credit\">X Square Robot<\/small><\/p><h2>X Square Robot’s embodied AI stack<\/h2><p>What holds the stack together is a small set of principles rather than a single overarching model.<\/p><ul><li>The first is that the basic unit of robot data is an interaction, not a trajectory; a demonstration is successful only if it changes the world as intended, not simply because the joints moved. <\/li><li>The second is that pretraining should yield usable capability, not just an initialization for later fine-tuning. <\/li><li>The third is that behavior should be modeled around physical events rather than fixed slices of time. <\/li><\/ul><p>These principles make the layers interdependent, since the same robot-free data that trains the action model is also structured to feed the world model. It is worth being precise, though. The company describes the world model and the action model as complementary but independent model families that share a code base. Both sit within its broader World Unified Model, which it has presented as an architecture for training vision, language, action, and physical prediction together.<\/p><h2>Robot learning data: Engineering for quality and cost, not scale<\/h2><p>For the X Square Robot team, one of the biggest constraints on general-purpose robots is the cost and quality of interaction data, not the number of parameters. To address that, the company built its Universal Manipulation Interface (UMI) data collection system, <a href=\"https://x2robot.com/en/news/6a46341cc7feadddbc603a33\" target=\"_blank\">QUANXTA Zero Series<\/a>. It works by collecting demonstrations from people wearing a rig with dual grippers rather than teleoperating a robot. This approach is not itself new, and builds on established methods for robot-free data capture. What sets it apart are two engineering choices.<\/p><div class=\"ieee-sidebar-medium\"><p class=\"shortcode-media shortcode-media-rebelmouse-image rm-float-left rm-resized-container rm-resized-container-25\" style=\"float: left;\"> <img alt=\"Person using VR headset and handheld controllers to teleoperate a dishwashing robot system\" class=\"rm-shortcode\" id=\"75dbc\" src=\"https://spectrum.ieee.org/media-library/person-using-vr-headset-and-handheld-controllers-to-teleoperate-a-dishwashing-robot-system.png?id=67111747&amp;width=980\" /> <small class=\"image-media media-caption\">X Square Robot emphasizes data quality control, recording trajectories and replaying them on a real robot, with only those that actually complete the task counted as valid.<\/small><small class=\"image-media media-photo-credit\">X Square Robot<\/small><\/p><\/div><p>The first is quality control, and it is the most distinctive part. Rather than accepting recorded trajectories as they are, the system runs a closed inspection loop, and its notable step is physical playback. A sample of trajectories is replayed on the real robot, and only those that actually complete the task count as valid. That makes the validity rate a measured quantity rather than an assumption. For example, a gripper that closes a fraction of a second too early still looks like a grasp in the data, yet it has pushed the object away, so it shouldn’t be classified as valid. A smaller clean dataset can be worth more than a larger noisy one.<\/p><p>The second choice is how lower-cost human data and scarce robot data are combined. The company pretrains on a large volume of robot-free demonstrations to build general representations, then adds a small amount of real-robot data as an anchor to the specific machine’s dynamics. It reports that this reaches performance comparable to an all-robot dataset at roughly a 20-fold lower cost of collection, driven mainly by how much cheaper the wearable rig is than a teleoperation setup. <\/p><p>The resulting dataset is deliberately model-agnostic, formatted to feed both action models and world models. The caveat is that the strongest results are measured on the company’s own robots and data-collection pipelines. Broader independent testing will help confirm and extend these promising results across a wider range of settings.<\/p><h2>A world model organized around events<\/h2><p>In developing its world model, called <a href=\"https://x2robot.com/en/pages/wm\" target=\"_blank\">WALL-WM<\/a>, X Square Robot took a differentiated approach. Most action models predict a fixed-length chunk of motion from the current image and instruction. That is convenient, but it segments behavior into fixed-duration windows, so the boundaries fall where elapsed time dictates rather than where one action ends and the next begins. WALL-WM instead treats an action-grounded semantic event as its unit: a coherent piece of behavior such as reaching, grasping, or placing, something that can be named in language, seen in video, and executed as motion.<\/p><div class=\"ieee-sidebar-large\"><p class=\"shortcode-media shortcode-media-rebelmouse-image\"> <img alt=\"Collage of robot arms manipulating kitchen objects with charts of multimodal AI performance\" class=\"rm-shortcode\" id=\"67705\" src=\"https://spectrum.ieee.org/media-library/collage-of-robot-arms-manipulating-kitchen-objects-with-charts-of-multimodal-ai-performance.png?id=67111750&amp;width=980\" /> <small class=\"image-media media-caption\">X Square Robot’s world model, called WALL-WM, treats an action-grounded semantic event as its unit: a coherent piece of behavior such as reaching, grasping, or placing, something that can be named in language, seen in video, and executed as motion.<\/small><small class=\"image-media media-photo-credit\">X Square Robot<\/small><\/p><\/div><p><span>WALL-WM’s design reflects a specific concern about not discarding what large video models already know. To achieve that, a text-to-video model is coupled to a freshly initialized action network that reads from the video features without overwriting them, which preserves the visual prior. From that one process, it offers two modes. An event mode runs in variable-length segments and suits reasoning over long horizons, while a fixed-length mode produces the steady, real-time output a controller needs. That places WALL-WM between mainstream chunk-based action models and pure video world models, keeping the predictive character of a world model while still yielding executable control.<\/span><\/p><p>In a series of experiments, the company relied on a generalization test that is more specific than most. A model trained on a limited dataset was evaluated on long-horizon tasks in unseen settings and, on the company’s real-robot benchmark, reportedly outscored baselines that had been fine-tuned on related data. That is a meaningful result if it holds. For now, it is measured on the company’s own benchmark. With the code now being released, the broader community will have the opportunity to test, reproduce, and build on them across more settings.<\/p><h2>A policy that runs before fine-tuning, and action tokens with meaning<\/h2><p>The action layer carries two connected ideas. The first is a requirement the company sets for itself with <a href=\"https://x2robot.com/en/oss\" target=\"_blank\">Wall-OSS-0.5<\/a>, its vision-language-action model: The pretrained model should run on a real robot before any task-specific fine-tuning. <\/p><p>The interest is less in the scores than in the design behind them. The model trains three objectives together, namely discrete action tokens, language grounding, and continuous action generation. And it keeps gradients flowing through all of them rather than freezing parts of the network as some rival designs do. It’s also a more strict method, since it reports untuned behavior such as approaching, grasping, and recovering, including on a deformable task held out of training.<\/p><div class=\"ieee-sidebar-large\"><p class=\"shortcode-media shortcode-media-rebelmouse-image\"> <img alt=\"Dashboard of robot training metrics with charts and photos of a robot sorting objects\" class=\"rm-shortcode\" id=\"2d02b\" src=\"https://spectrum.ieee.org/media-library/dashboard-of-robot-training-metrics-with-charts-and-photos-of-a-robot-sorting-objects.png?id=67111753&amp;width=980\" /> <small class=\"image-media media-caption\">As part of X Square Robot’s Wall-OSS-0.5 vision-language-action model design, the pretrained model should run on a real robot before any task-specific fine-tuning. <\/small><small class=\"image-media media-photo-credit\">X Square Robot<a href=\"https://spectrum.ieee.org/r/entryeditor/2677167058#/\" target=\"_self\"><\/a><\/small><\/p><\/div><p>The second idea is the action interface itself, called X-Tokenizer. Most systems that turn continuous motion into discrete tokens produce codes that the language model cannot interpret. X-Tokenizer reframes tokenization as learning a semantic interface, so that the top-level code stands for the intent of a motion while lower-level codes carry finer detail, all aligned with the language model’s own features. <\/p><p>A useful consequence is stability. Adding noise to an action barely moves the intent code, which is what lets one tokenizer to be reused across robots without re-tuning. The tokenizer inside the production action model is a related variant of this approach. Together, the two ideas give the action layer something rather powerful: capability that transfers.<\/p><h2>The future of embodied AI stacks<\/h2><p>X Square Robot is betting that its unique approach combining three layers, each specialized in solving a key part of the problem, will stand out from other embodied AI stacks. The physical-playback step that grounds data quality is uncommon and sensible. The reframing of world modeling around events, with one backbone serving both reasoning and control, is a genuinely distinct approach. And the pairing of a deployable pretraining standard with a tokenizer designed as a semantic interface gives the action layer unusual coherence. <\/p><p class=\"pull-quote\">X Square Robot’s valuation has climbed above 20 billion yuan (about US $2.9 billion), suggesting that investors increasingly view data infrastructure, foundation models, and scalable training systems as long-term differentiators in embodied AI.<\/p><p>The next phase will bring broader validation. Much of the current evidence comes from X Square’s own robots and benchmarks. With the world model code now being made public, and as the community begins to test, reproduce, and build on the work, the reported capabilities will be tested across more robots, tasks, and settings.<\/p><p><span>X Square Robot’s recent funding rounds reflect similar confidence. The company’s valuation has climbed above 20 billion yuan (about US $2.9 billion), suggesting that investors increasingly view data infrastructure, foundation models, and scalable training systems as long-term differentiators in embodied AI.<\/span><\/p><h2>What’s next for X Square Robot<\/h2><p>To learn more about its future plans, the following Q&amp;A with the X Square Robot team further explores the company’s technology, strategy, and vision.<\/p><p><strong>What made now the right moment, technically, to commit to this stack? What recently became possible that wasn’t possible a couple of years ago?<\/strong><\/p><p>It is not one breakthrough but several trends maturing together. Foundation models gave us a shared representation across vision, language, and action, so we can model what a robot sees, what it is asked to do, and how its actions change the world in one framework, rather than as separate perception, planning, and control modules. <\/p><p>Compute and infrastructure are finally sufficient for large-scale pretraining over long-horizon, multi-embodiment data. Just as importantly, we realized that data, not model size, is the real bottleneck for general robots—what is scarce is diverse, high-quality, reproducible interaction data. And world modeling has become practical. The useful question is no longer how to predict a few seconds of video, but how to understand the ways actions change objects, contacts, and task states. Two years ago these ingredients existed separately. Today they are mature enough to work as one system.<\/p><p class=\"pull-quote\">“We realized that data, not model size, is the real bottleneck for general robots—what is scarce is diverse, high-quality, reproducible interaction data. And world modeling has become practical.”<\/p><p><strong>Your data system captures demonstrations with a wearable VR rig and custom grippers rather than teleoperating robots. What was wrong with standard teleoperation?<\/strong><\/p><p>Teleoperation is built around controlling the robot. It forces the operator to work within the machine’s kinematics, latency, and viewpoint, and the resulting demonstrations are slower, stiffer, and less diverse. <span>We built our system around capturing human skill instead. Manipulation is really about contact, timing, finger coordination, and recovery, not just the path the hand takes, and a wearable rig records those before the behavior is compressed onto one particular robot. It also breaks teleoperation’s expensive scaling law, in which every demonstration needs a robot. <\/span><\/p><p>People can generate rich data independently of any robot, and the crucial property is that those demonstrations can still be replayed and executed on a physical robot through the model. Mobility is convenient, but that replay is the real point, because it is what lets the same data be reused across different platforms.<\/p><p class=\"shortcode-media shortcode-media-rebelmouse-image\"> <img alt=\"Robot and person loading a washing machine together in a modern laundry room.\" class=\"rm-shortcode\" id=\"3283b\" src=\"https://spectrum.ieee.org/media-library/robot-and-person-loading-a-washing-machine-together-in-a-modern-laundry-room.png?id=67111806&amp;width=980\" /> <small class=\"image-media media-caption\">In X Square Robot’s approach, demonstrations can be replayed and executed on a physical robot through the AI model, allowing the same data to be reused across different platforms.<\/small><small class=\"image-media media-photo-credit\">X Square Robot<a href=\"https://spectrum.ieee.org/r/entryeditor/2677167058#/\" target=\"_self\"><\/a><\/small><\/p><p><strong>X Square Robot reports that its pipeline has roughly an 85 percent data-validity rate. Why is quality control such an underrated bottleneck?<\/strong><\/p><p>Because errors in robot data are far more expensive than in language data. A small timing or contact error can change what a demonstration means. If a gripper closes a fraction of a second too early, the motion still looks like a grasp, but physically it has pushed the object away. A dataset that mixes failures and accidental successes teaches ambiguity, not skill, because the real unit is the interaction, not the trajectory. <\/p><p>So we run automated inspection, kinematic checks, and physical replay, where we play a sample of trajectories back on the real robot and count only the ones that actually complete the task. Data quality sets the ceiling on how good a policy can be. In our experience a smaller, cleaner dataset often beats a much larger, noisier one, which is why we treat quality control as part of the model, not a preprocessing afterthought.<\/p><p><strong>The model runs in both “event mode” and “chunk mode.” When does each matter?<\/strong><\/p><p>Both matter, for different reasons. The physical world changes through events—when contact occurs, a grasp forms, or an object slips—not in fixed-frame windows. Event mode concentrates the model’s attention on those moments, and it matters most for long-horizon tasks, like clearing a table, where progress is a sequence of semantic events rather than a smooth stream. It runs in variable-length segments that follow the task rather than a clock. Chunk mode matters for deployment. Real controllers need a stable, real-time interface, and fixed-length chunks integrate cleanly with existing control systems. <\/p><p>We organize learning around events in the first place because a fixed window can split one motion in half or merge two together, which turns training into short-horizon pattern matching and weakens the model on long tasks. So the world model’s job is to connect event-level understanding, which is where the reasoning happens, with a fixed-length output a real robot can actually run.<\/p><p><strong>Why make “deployable before fine-tuning” the criterion?<\/strong><\/p><p>Pretraining should produce capability, not just a good starting point. If a model is only useful after heavy fine-tuning, then most of the intelligence still lives in the downstream supervision, not in the foundation model. Deployable before fine-tuning is a more honest test of what pretraining actually learned. A well-pretrained robot should already know how to approach, grasp, move, avoid obstacles, and correct itself. Fine-tuning should adapt it to a specific task or robot, not create the ability from nothing. It is also a practical requirement. A robot in a home or a workplace shouldn’t need a brand-new dataset and a new policy every time the task changes, so a foundation model that already carries general skill, and some ability to recover, is the minimum bar for something genuinely useful in the real world.<\/p><p><strong>What is the most challenging part of cross-embodiment learning?<\/strong><\/p><p>Robots differ in control frequency, delay, compliance, sensing precision, and contact dynamics, so the same instruction can require different action decompositions and recovery strategies, and a behavior that works on one arm cannot simply be copied to another. Cross-embodiment learning needs an intermediate abstraction, lower than language but higher than joint angles: how you approach an object, how you make contact, how you apply force, and how you recover from a mistake. <\/p><p>When we say cross-embodiment, the main capability we mean is multi-embodiment generalization: transferring across robots, training on many embodiments at once, and adapting to different kinematics. Human-to-robot transfer and other techniques are specific approaches to that goal.<\/p><p class=\"pull-quote\">“A robot in a home or workplace shouldn’t need a new dataset and policy every time the task changes. A useful foundation model should already carry general skills and the ability to recover.”<\/p><p><strong><span><\/span>What would you most like to see other researchers attempt to reproduce or stress-test?<\/strong><\/p><p>Three things, above all. Whether event-level representations really generalize beyond our own datasets, across more tasks, scenes, objects, embodiments, and failure conditions. Whether pretraining stays effective on robots the model never saw during training, or whether its capability is still too tightly coupled to what it has already seen. And whether real-robot evaluation can become a shared language for the field, so that we compare not just success rates but the reasons systems fail, where an instruction was misread, where perception broke down, or where recovery fell short. Robotics has been driven too often by impressive demonstrations, and real progress comes from results that are reproducible and diagnosable.<\/p><p><strong>What capability is still missing before robots become dependable in homes?<\/strong><\/p><p>Benchmarks measure competence, like whether a model can finish a task. Homes demand reliability, safe and consistent operation over time in a place that changes every day, with objects moving, instructions that are vague, and people interrupting. The missing piece is not a higher one-time success rate: it is robust recovery. A dependable home robot has to know when it is uncertain, when to slow down, when to ask for help, and how to bring the world back to a safe state after it drops something or misunderstands a request. <\/p><p>In a real home, failure recovery matters more than raw success, because the home does not reset itself. Homes also demand careful personalization, learning a household’s routines and preferences over time, with safety and trust as first principles. That combination, not any single skill, separates a capable demonstration from a robot people can live with.<\/p><p class=\"shortcode-media shortcode-media-rebelmouse-image\"> <img alt=\"Humanoid service robot stands by a table in a modern living room.\" class=\"rm-shortcode\" id=\"169cf\" src=\"https://spectrum.ieee.org/media-library/humanoid-service-robot-stands-by-a-table-in-a-modern-living-room.jpg?id=67111807&amp;width=980\" /> <small class=\"image-media media-caption\">X Square Robot’s approach is that, in a real home, failure recovery matters more than raw success, because the home does not reset itself and it demands careful personalization, with safety and trust as first principles. <\/small><small class=\"image-media media-photo-credit\">X Square Robot<a href=\"https://spectrum.ieee.org/r/entryeditor/2677167058#/\" target=\"_self\"><\/a><\/small><\/p><p><strong>How do the open-source components fit into X Square Robot’s World Unified Model direction?<\/strong><\/p><p>We see these releases as layers of the World Unified Model direction rather than isolated projects. <a href=\"https://x2robot.com/en/oss\" target=\"_blank\">Wall-OSS-0.5<\/a>, the action model, asks whether an open vision-language-action model can gain directly measurable capability from large-scale pretraining, so it is the capability layer. <span>WALL-WM, the world model, asks how a robot should understand change in the world, shifting from fixed windows to event-level modeling, so it is the representation layer. The data system supplies the interaction data that both of them learn from. <\/span><\/p><p>Together they form a loop in which models produce capability, world models organize understanding, and the open-source community drives reproduction and improvement. World Unified Model is the broader architecture those layers support, bringing vision, language, action, and physical prediction together. <\/p><p>We are releasing these pieces openly because embodied intelligence cannot be solved by one organization; it needs many embodiments, many real tasks, and broad feedback, and the long-term goal is a stack that keeps learning and ultimately moves robots from laboratory demonstrations toward reliable everyday use.<\/p>"}, {"title": "STEM education in the classroom, introducing BotBall", "source": "Robotics Business Review", "date": "2026-07-12", "url": "https://www.therobotreport.com/stem-education-classroom-introducing-botball/", "summary": "<p>Botball addresses STEM education with autonomous robotics, real coding, and a level playing field driven entirely by students.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/stem-education-classroom-introducing-botball/\">STEM education in the classroom, introducing BotBall<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Are suppliers ready for new robot safety standards?", "source": "Robotics Business Review", "date": "2026-07-11", "url": "https://www.therobotreport.com/are-suppliers-ready-for-new-robot-safety-standards/", "summary": "<p>Suppliers that are well prepared for standard changes will benefit, while underprepared companies may face market access disruption.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/are-suppliers-ready-for-new-robot-safety-standards/\">Are suppliers ready for new robot safety standards?<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Why robotics teams need virtual gyms before deployment", "source": "Robotics Business Review", "date": "2026-07-11", "url": "https://www.therobotreport.com/why-robotics-teams-need-virtual-gyms-before-deployment/", "summary": "<p>To address environmental and task variability, robots can benefit from 'virtual gyms' to bridge the sim-to-real gap, says SoftServe.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/why-robotics-teams-need-virtual-gyms-before-deployment/\">Why robotics teams need virtual gyms before deployment<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Ground Robots Inherit the Kill Zone", "source": "IEEE Spectrum Robotics", "date": "2026-07-10", "url": "https://spectrum.ieee.org/ukraine-ground-drones", "summary": "<img src=\"https://spectrum.ieee.org/media-library/an-unmanned-ground-vehicle-moving-through-a-sparse-forest-landscape.jpg?id=67114838&amp;width=1245&amp;height=700&amp;coordinates=0%2C156%2C0%2C157\" /><br /><br /><p><a href=\"https://itarena.ua/speaker/borys-drozhak/\" rel=\"noopener noreferrer\" target=\"_blank\">Borys Drozhak<\/a> has a vision: a front line almost free of humans, patrolled by <a href=\"https://spectrum.ieee.org/autonomous-drone-warfare\" target=\"_self\">flying drones<\/a> and ground robots, and continuously monitored by AI-controlled sensor networks. And it’s not a pipe dream. Ukrainian roboticists have made major strides in that direction over the past four years. Remotely controlled ground vehicles fitted with machine guns and grenade launchers now patrol the no-man’s-land straddling the front, part of a robotic legion that has stymied Russia’s territorial ambitions so far this year.<\/p><p>Drozhak is a co-founder and CEO of <a href=\"https://rovertech.co.ua/en/\" rel=\"noopener noreferrer\" target=\"_blank\">RoverTech<\/a>, which manufactures the Zmiy, one of Ukraine’s most successful ground robots. Zmiy, Ukrainian for snake, is an 800-kilogram (1,700-pound) rover, 2.15 by 1.5 meters in size, with 75-centimeter diameter wheels. The Zmiy comes in various configurations—for demining, logistics, fighting fires, firing a machine gun, or launching grenades. <\/p><p>According to Drozhak, the uncrewed ground vehicle (UGV) is a record-breaker among Ukrainian ground robots. It’s engineered to be nearly noiseless and emit as little heat as possible, helping it to elude Russia’s intelligence, surveillance, and reconnaissance (ISR) drones. As a result, a <a href=\"https://oboronka.mezha.ua/en/virobnictvo-nrk-zmiy-311311/\" rel=\"noopener noreferrer\" target=\"_blank\">Zmiy rover<\/a> completes on average 57 missions across the kill zone before being destroyed. The kill zone is the roughly 35-kilometer-wide swath of land that straddles the front line; its width is variable and determined mainly by the growing range of the drones.<\/p><p>“Usually, a UGV on the battlefield lasts about seven missions,” Drozhak says. “The Zmiy is quite a bit bigger and stronger” in comparison with most other UGVs, “and can make it back even if two of its wheels get destroyed.”<\/p><p>Drozhak is a software engineer turned roboticist whose story is echoed everywhere in the Ukrainian defense establishment. Before the Russian invasion, he was living a quiet life in Ireland, working for an international software development firm. He returned home shortly after the war began to help defend his homeland. Together with his friend, Vasyl Korenovskyi, who had been a mining engineer, he founded RoverTech with the goal of building robots to perform some of the most dangerous tasks in the war zone. In 2023, they rolled out their first product—the Zmiy de-miner. Earlier this year, one of RoverTech’s assault UGVs was part of a <a href=\"https://www.cnn.com/2026/04/20/europe/robots-ukraine-battlefield-drones-intl-cmd\" rel=\"noopener noreferrer\" target=\"_blank\">widely reported<\/a> operation that forced a group of Russian soldiers to surrender without the presence of any Ukrainian troops. Such feats, Drozhak insists, are not rare on Ukrainian battlefields these days.<\/p><p>UGVs are the latest chapter in the military-technology race spurred by the war in Ukraine. <a href=\"https://www.defensenews.com/unmanned/2026/04/24/ukraine-to-field-25000-ground-robots-in-push-to-replace-soldiers-for-frontline-logistics/\" rel=\"noopener noreferrer\" target=\"_blank\">Scores of Ukrainian startups<\/a> have developed dozens of different small ground robots, each with typically multiple variants, over the past three years. They’re mostly replacing human-driven tanks and other military vehicles that used to crisscross the war zone. These remotely controlled robotic vehicles cost a few tens of thousands of dollars apiece compared to millions for a traditional tank, and they can be tweaked and modified in frontline workshops to serve the most urgent needs. <\/p><h2>Zelenskyy Orders Up 50,000 More UGVs<\/h2><p>In April, Ukraine’s President Volodymyr Zelenskyy <a href=\"https://www.pravda.com.ua/eng/news/2026/04/27/8032079/\" rel=\"noopener noreferrer\" target=\"_blank\">signed an order<\/a> for the government to procure 50,000 UGVs for Ukraine’s military forces by the end of 2026. That’s more than three times as many as the government purchased in 2025 and a massive increase from the 2,000 procured in 2024, according to defense analyst <a href=\"https://www.linkedin.com/in/marcclange/?locale=de\" rel=\"noopener noreferrer\" target=\"_blank\">Marc C. Lange<\/a>.<\/p><p>The rise of UGVs, Lange explains, is a direct response to the warfighting revolution ushered in by the speedy evolution of uncrewed aerial vehicles that came to define the war in Ukraine.<\/p><p>As the number of drones zooming above the front line rose and their range increased, the battlefield became completely transparent. Today, anything that enters the kill zone gets hit by a first-person view (FPV) kamikaze drone within minutes.<\/p><p>“Any armored formation, any resupply and logistics vehicle, and any manned formation anywhere near the edge of the battle area has between seconds to a low amount of minutes before it gets turned to dust,” Lange says. “The Ukrainians were losing drivers. Traditional methods of evacuating injured soldiers became impossible. That space is basically unsurvivable.”<\/p><p>Ukraine, suffering from a <a href=\"https://www.longwarjournal.org/archives/2026/06/analysis-ukraine-unveils-reforms-to-address-manpower-shortage.php\" rel=\"noopener noreferrer\" target=\"_blank\">shortage of infantry<\/a>, has taken that problem more seriously than Russia, which has a larger pool of fresh recruits to draw from. UGVs began ferrying supplies to troops at frontline positions in 2024. Gradually, they took over the complex and risky evacuations of the wounded, using special enclosures to protect the soldier being transported. But this year, Lange says, is “the year of the assault UGV.”<\/p><p>Emerging Ukrainian tactics combine UGVs with real-time reconnaissance and surveillance from aerial drones, which discover enemy troops, often under cover of night. The reconnaissance data are then used by remote operators who guide UGVs as they stalk, corner, and shoot to kill. <a href=\"https://www.linkedin.com/in/oleg-fedoryshyn-a1045819/\" rel=\"noopener noreferrer\" target=\"_blank\">Oleg Fedoryshyn<\/a>, the head of research and design at <a href=\"https://devdroid.tech/en/\" rel=\"noopener noreferrer\" target=\"_blank\">DevDroid<\/a>, another prominent Ukrainian UGV developer, said the ground robots can be controlled from as far as 100 kilometers away using Starlink connectivity, LTE networks, or mesh-networked military radio systems. The UGVs can also carry strike UAVs (uncrewed aerial vehicles), serve as communication relays for drones, or carry and launch communication relay drones that further extend the range of the attack vehicles. The UGV can lurk in position for up to one week without needing a battery charge, Fedoryshyn said, and wait for the enemy to move closer.<\/p><p>“It’s better than to put people there,” he notes. “A guy with a machine gun is always the first target for the enemy.”<\/p><p class=\"shortcode-media shortcode-media-rebelmouse-image\"> <img alt=\"An Ukrainian soldier adjusting an unmanned ground vehicle\\u2019s machine gun.\" class=\"rm-shortcode\" id=\"e136b\" src=\"https://spectrum.ieee.org/media-library/an-ukrainian-soldier-adjusting-an-unmanned-ground-vehicle-u2019s-machine-gun.jpg?id=67114858&amp;width=980\" /> <small class=\"image-media media-caption\">The Droid TW 12.7, by DevDroid, is shown here outfitted with a 0.50-caliber M2 Browning machine gun that can be aimed and fired by a remote operator using a tablet and an encrypted communications link.<\/small><small class=\"image-media media-photo-credit\">DevDroid<\/small><\/p><p>Fedoryshyn estimates that UGVs could eventually help cut the number of soldiers needed along the front line by 30 to 40 percent. Drozhak is even more ambitious. He envisions a future front line that’s entirely automated, relying on sensors and other systems that are only occasionally serviced by humans.<\/p><p class=\"pull-quote\">A guy with a machine gun is always the first target for the enemy.<\/p><p>“Right now, we need a lot of UGVs because there are people on the front line and we need to deliver supplies to them,” he says. “But we can substitute many of them with sensor systems, servicing robots, and UGVs, and then we will not need that many for logistics. At some point, we could have only robots in the kill zone.”<\/p><p>Ukraine, with a prewar population of around 41 million, has lost over 150,000 fighters in the war since 2022, according to <a href=\"https://www.csis.org/analysis/russias-grinding-war-ukraine\" target=\"_blank\">estimates<\/a> by the <a href=\"https://www.csis.org/\" target=\"_blank\">Center for Strategic and International Studies<\/a> and others. Many thousands of others have been mutilated or permanently disabled. Even those who return without physical injuries suffer lasting <a href=\"https://balticsentinel.eu/8046076/war-at-home-the-psychological-toll-on-ukraine-s-returning-soldiers\" target=\"_blank\">psychological trauma<\/a>. Drozhak dreams that a future robot army would put an end to the ability of autocratic regimes worldwide to brutalize their neighbors. <\/p><p>“There will be no need to push people on the battlefield anymore,” says Drozhak, the RoverTech CEO. “Once we achieve that in Ukraine, any country with a decent economy would be able to defend themselves just with technology.”<\/p><p><a href=\"https://www.pravda.com.ua/eng/news/2026/06/01/8037264/\" target=\"_blank\">RoverTech’s Tarantula<\/a> active-protection system, which uses acoustic and visual sensors combined with AI algorithms to detect approaching killer drones, is the first step in that direction, he declares.<\/p><p>“The future battlefield will rely on networks of robotic sensors and autonomous systems that can continuously monitor dangerous areas, provide early warning, and reduce the need for soldiers to expose themselves to direct threats,” he says. “Human operators will remain responsible for critical decisions, but increasingly advanced sensing technologies will help move people away from the most dangerous positions on the battlefield.”<\/p><h2>Why UGVs Are Vulnerable<\/h2><p>Militaries around the world were looking at UGVs prior to Russia’s 2022 invasion of Ukraine. But those were quite different, explains <a href=\"https://www.cna.org/our-experts/bendett-samuel\" target=\"_blank\">Samuel Bendett<\/a>, a defense analyst at the consultancy <a href=\"https://www.cna.org/\" target=\"_blank\">CNA<\/a>. They were larger, more complex, and conceived to operate in smaller numbers. The more compact forms now seen in Ukraine are the result of an evolution that paralleled that of the first-person view (FPV) attack drones. Both needed to be cheap as they don’t last long and small to be less conspicuous. Now, the West is trying to understand the overall role of UGVs in <a href=\"https://youtu.be/0nhQjpRnBHs?si=43FvJ9ykWv2967eP\" rel=\"noopener noreferrer\" target=\"_blank\">future warfare<\/a>. So far, in Bendett’s view, the impact of UGVs on warfare isn’t as profound as that of the FPVs and other aerial drones.<\/p><p>“Not every terrain would be applicable to using a UGV,” Bendett explains. “So far, a lot fewer countries are seeking to integrate them into their combat operations than UAVs, which very much democratized the way of enabling short-range to mid-range strikes against adversaries.”<\/p><p>UGVs, he points out, are much more susceptible to communication disruptions than UAVs, while being less suitable for autonomous operations and swarming due to the complexity of ground terrain.<\/p><p>“With UAVs, communication is much easier,” according to Bendett. “There are no interferences between the ground station and the UAV save the distance, Earth’s curvature, and the radio horizon. But on Earth, there’s lots of different obstacles that interfere with radio signals.”<\/p><p>Most UGVs rely on <a href=\"https://starlink.com/\" rel=\"noopener noreferrer\" target=\"_blank\">Starlink<\/a> as the first choice for operator control, but even that comes with problems. Starlink signals are easily disrupted by trees and buildings. And Russia, having been cut off from Starlink, is working hard to find ways to <a href=\"https://en.defence-ua.com/news/how_russians_try_to_jam_starlink_using_a_15_million_system_why_its_barely_working-18830.html\" rel=\"noopener noreferrer\" target=\"_blank\">jam the system<\/a>.<\/p><p>On top of that, Lange says, as UAV autonomy progresses, UGVs could be left behind. The reason is that UGVs are likely to remain dependent on operator communication links for some time and will therefore be vulnerable to <a href=\"https://spectrum.ieee.org/ukraine-killer-drones\" target=\"_self\">enemy UAVs that can’t be stopped by jamming<\/a> systems that still provide some protection today.<\/p><p>“The low production cost of strike drones will mean that UGVs will have to endure a barrage of strikes that might be too much,” Lange says. “The question is whether you can make UGVs more survivable on the front line both in terms of command and control and the actual survivability of that many strikes.”<\/p><p>Still, he thinks there’s “no path back from UGVs.” The idea of distributing a whole range of tasks, performed in the past by a single large and expensive tank, to a fleet of small, cheap UGVs provides more resilience against the omnipresent drones. Moreover, although many international commentators now say that Russia appears to be losing, the war grinds on—and so does the cat-and-mouse game of lethal innovation.<\/p>"}, {"title": "Video Friday: A World Cup for Robots", "source": "IEEE Spectrum Robotics", "date": "2026-07-10", "url": "https://spectrum.ieee.org/video-friday-robot-world-cup", "summary": "<img src=\"https://spectrum.ieee.org/media-library/humanoid-robots-play-soccer-as-a-ball-flies-toward-the-goal-in-a-tournament-arena.jpg?id=67119515&amp;width=1245&amp;height=700&amp;coordinates=0%2C312%2C0%2C313\" /><br /><br /><p><span><a href=\"https://spectrum.ieee.org/tag/video-friday\" target=\"_blank\">Video Friday<\/a> is your weekly selection of <a href=\"https://spectrum.ieee.org/video-friday-robot-grippers\" target=\"_blank\">awesome robotics videos<\/a>, collected by your friends at <\/span><em>IEEE Spectrum<\/em><span> robotics. We also post a weekly calendar of upcoming robotics events for the next few months. Please <\/span><a href=\"mailto:automaton@ieee.org?subject=Robotics%20event%20suggestion%20for%20Video%20Friday\">send us your events<\/a><span> for inclusion.<\/span><\/p><h5><a href=\"https://roboticsconference.org/\">RSS 2026<\/a>: 13–17 July 2026, SYDNEY<\/h5><h5><a href=\"https://mrs.fel.cvut.cz/summer-school-2026/\">Summer School on Multi-Robot Systems<\/a>: 29 July–4 August 2026, PRAGUE<\/h5><h5><a href=\"https://actuate.foxglove.dev/\">Actuate 2026<\/a>: 18–19 August 2026, SAN FRANCISCO<\/h5><h5><a href=\"https://2026.ieee-iros.org/\">IROS 2026<\/a>: 27 September–1 October 2026, PITTSBURGH<\/h5><h5><a href=\"https://humanoidssummit.com/\">Humanoids Summit Seoul<\/a>: 22–23 September 2026, SEOUL<\/h5><p>Enjoy today’s videos!<\/p><div class=\"horizontal-rule\"><\/div><div><span style=\"display: none;\"> <\/span><\/div><blockquote class=\"rm-anchors\" id=\"xuedf0fmame\"><em>For the first time, two full teams of humanoid robots played an 11-vs-11 soccer match on hardware, bringing one of robotics’ most ambitious long-term visions closer to reality. Never before have two full-sized humanoid robot teams played a soccer game against each other.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.robocup.org/news/192\">RoboCup<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"9xjhrkpcbgi\"><em>Engineers at MIT and EPFL in Lausanne, Switzerland, have designed a robot that can swim underwater and flap out of the water to continue flying through the air, much like a diving bird. The robot can help scientists study the mechanics that enable these actions in aquatic aviators and may help launch a new class of aerial-aquatic drones and vehicles.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://news.mit.edu/2026/new-flapping-robot-swims-and-flies-like-diving-bird-0709\">MIT<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"qryxv3csrea\"><em>We’re excited to announce our breakthrough robotic hands for the NEO platform: hands that match or exceed human-level dexterity, strength, safety, and reliability. Designed from the ground up, these 25-DoF hands combine 25 fully actuated degrees of freedom with a tendon-driven system, rich tactile sensing, and built-in compliance. The result is a hand capable of true in-hand manipulation, precision tool use, and delicate interaction.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.1x.tech/discover/neos-hands\">1X<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"zjlr7m91yue\"><em>This match, Tech United played against IRIS at the midsize league at RoboCup 2026 in Incheon, South Korea.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://techunited.nl/?page_id=2135&amp;lang=en\">Tech United<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"ezplxk78cfk\"><em>Atlas arrived pitchside at NYNJ Stadium in front of 80,000 people gathered to see Brazil vs. Norway. After performing some of the sport’s most memorable player celebrations, Atlas helped kick off the second half by delivering the match ball!<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://bostondynamics.com/blog/can-football-teach-a-robot-to-move/\">Boston Dynamics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"k7_acxnvrdi\"><em>Navigating discrete terrain such as stepping stones remains a major challenge for legged robots. Conventional approaches often rely on dense environment reconstruction from cameras or lidar, which can be affected by latency, occlusions, and significant computational overhead. We show that proximity sensors integrated into the bottom of a quadruped’s feet enable safe, terrain-seeking autonomous locomotion.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://arxiv.org/abs/2606.31912\">Paper<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"xsrc3tdzqv4\"><em>On this holiday, Digit is on grill duty. It turns out precise force control is good for more than payload handling. Happy 4th of July from all of us at Agility.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.agilityrobotics.com/\">Agility<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"yyjmb-lgp8o\"><em>We’ve created GEN-1, our latest milestone in scaling robot learning. We believe it to be the first general-purpose AI model that crosses a new performance threshold: mastery of simple physical tasks. It improves average success rates to 99 percent on tasks where previous models achieve 64 percent, completes tasks roughly 3x faster than state-of-the-art, and requires only one hour of robot data for each of these results. GEN-1 unlocks commercial viability across a broad range of applications—and while it cannot solve all tasks today, it is a significant step toward our mission of creating generalist intelligence for the physical world.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://generalistai.com/blog/gen-1\">Generalist<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"_wgnmkmvels\">Four years at Figure.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.figure.ai/news\">Figure<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"cmcvaclf9bm\"><em>Reachy Mini is becoming your real AI companion. The Conversation App makes it able to talk fluently with you, help you with your to-do list, remind you of important tasks, and even chat about music. Long-term memory, voice interaction, always ready to help.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://huggingface.co/reachy-mini\">Reachy Mini<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"p8u_4v8suoq\">Is this sort of thing now a real job for humanoid robots, then?<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://shop.unitree.com/collections/humanoid-robot\">Unitree<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"lad1wzntj6e\">Quite a story, but is it a real job?<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://en.engineai.com.cn/product-t800\">EngineAI<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"tsdjodthhnk\">If you have a cute animal logo for your research, I will always share it.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://patripfr.github.io/bievr-lio/\">BIEVR-LIO<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"kg3hwbaioda\">This is very delicate work, although the real challenge would be picking those nuts out of a jumbled bin full of randomly sized nuts, which is how most of us live our lives.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://sanctuary.ai/\">Sanctuary<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"wdf3borclra\">Not for me, thank you, although I’m not saying that most of the other humanoid robots out there are any better looking, fundamentally.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.ubtrobot.com/en/\">UBTECH<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"jqi_ucwhe2c\"><em>Robotics professor Dr. Christian Hubicki judges robot soccer skills while knowing very little about soccer himself.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.optimalroboticslab.com/\">ORL<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"qbm9xvrq7tg\"><em>In this presentation, Brendan Schulman, vice president of policy at Boston Dynamics, outlines the critical role of government engagement in driving the success of the humanoid robotics industry. He demonstrates how legged robots like the Spot quadruped and Atlas humanoid are moving beyond factory settings to deliver real-world value in infrastructure inspection, industrial manufacturing, and public safety. Schulman highlights the intersection of AI and robotics, showcasing how large behavioral models and reinforcement learning enable robots to navigate slippery floors and autonomously avoid workplace hazards. Ultimately, he calls for a proactive national robotics strategy focused on workforce training, safety standards, and ethical frameworks to support supply chain resilience and global competitiveness.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://humanoidssummit.com/\">Humanoids Summit<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div>"}, {"title": "AI² Robotics raises $735M at $3B valuation for wheeled humanoid robots", "source": "Robotics Business Review", "date": "2026-07-10", "url": "https://www.therobotreport.com/ai%c2%b2-robotics-raises-735m-3b-valuation-wheeled-humanoid-robots/", "summary": "<p>Shenzhen’s Ai2 Robotics raised $735 million at a $2.8 billion valuation, backed by state, corporate, and financial giants.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/ai%c2%b2-robotics-raises-735m-3b-valuation-wheeled-humanoid-robots/\">AI² Robotics raises $735M at $3B valuation for wheeled humanoid robots<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "XTEND secures U.S. patent for autonomous navigation technology", "source": "Robotics Business Review", "date": "2026-07-10", "url": "https://www.therobotreport.com/xtend-secures-u-s-patent-autonomous-navigation-technology/", "summary": "<p>XTEND said the newly granted patent expands its portfolio supporting autonomous navigation, operator assistance, and mission execution.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/xtend-secures-u-s-patent-autonomous-navigation-technology/\">XTEND secures U.S. patent for autonomous navigation technology<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "How Path Robotics uses AI to optimize robotic welding", "source": "Robotics Business Review", "date": "2026-07-10", "url": "https://www.therobotreport.com/how-path-robotics-uses-ai-optimize-robotic-welding/", "summary": "<p>CEO Andy Lonsberry explains how Path Robotics applies AI to welding, and UC San Diego professor Michael Yip discusses robot learning.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/how-path-robotics-uses-ai-optimize-robotic-welding/\">How Path Robotics uses AI to optimize robotic welding<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Beyond da Vinci: Why versatile humanoid robots are the next frontier in surgery", "source": "Robotics Business Review", "date": "2026-07-09", "url": "https://www.therobotreport.com/beyond-da-vinci-why-versatile-humanoid-robots-are-next-frontier-surgery/", "summary": "<p>For the first time, teleoperated humanoid robots successfully performed surgeries during a UC San Diego preclinical trial.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/beyond-da-vinci-why-versatile-humanoid-robots-are-next-frontier-surgery/\">Beyond da Vinci: Why versatile humanoid robots are the next frontier in surgery<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Rollon launches two telescopic rails with integrated magnets", "source": "Robotics Business Review", "date": "2026-07-09", "url": "https://www.therobotreport.com/rollon-launches-two-telescopic-rails-integrated-magnets/", "summary": "<p>Rollon said the magnets deliver improved load management, smoother extension, and increased durability, even under intensive operating conditions.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/rollon-launches-two-telescopic-rails-integrated-magnets/\">Rollon launches two telescopic rails with integrated magnets<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Calling all robotics startups: apply to RoboBusiness Startup Alley", "source": "Robotics Business Review", "date": "2026-07-09", "url": "https://www.therobotreport.com/calling-all-robotics-startups-apply-to-robobusiness-startup-alley/", "summary": "<p>We're looking for robotics startups that are creating a full system, component, or software system to show off their work at RoboBusiness.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/calling-all-robotics-startups-apply-to-robobusiness-startup-alley/\">Calling all robotics startups: apply to RoboBusiness Startup Alley<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "ForSight Robotics’ road to performing a fully robotic cataract surgery", "source": "Robotics Business Review", "date": "2026-07-09", "url": "https://www.therobotreport.com/forsight-robotics-road-to-performing-a-fully-robotic-cataracts-surgery/", "summary": "<p>ForSight Robotics' JASPER Platform assists surgeons with cataract surgeries, while still leaving the power in the surgeon's hands.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/forsight-robotics-road-to-performing-a-fully-robotic-cataracts-surgery/\">ForSight Robotics&#8217; road to performing a fully robotic cataract surgery<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "ENCY Software and Stäubli Robotics partner to simplify robot programming", "source": "Robotics Business Review", "date": "2026-07-08", "url": "https://www.therobotreport.com/ency-software-staubli-robotics-partner-simplify-robot-programming/", "summary": "<p>ENCY Software and Stäubli Robotics have signed a global agreement to make robot programming more intuitive, faster, and more accessible.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/ency-software-staubli-robotics-partner-simplify-robot-programming/\">ENCY Software and Stäubli Robotics partner to simplify robot programming<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "NVIDIA and Hugging Face bring new models and frameworks to LeRobot", "source": "Robotics Business Review", "date": "2026-07-08", "url": "https://www.therobotreport.com/nvidia-hugging-face-bring-new-models-frameworks-lerobot/", "summary": "<p>Hugging Face LeRobot is an open-source robotics library for training, running, and sharing robot datasets, models, policies, and workflows.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/nvidia-hugging-face-bring-new-models-frameworks-lerobot/\">NVIDIA and Hugging Face bring new models and frameworks to LeRobot<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Tickets, geofences, and 1M miles: The new reality of California AV compliance", "source": "Robotics Business Review", "date": "2026-07-08", "url": "https://www.therobotreport.com/tickets-geofences-1m-miles-new-reality-california-av-compliance/", "summary": "<p>Guident CEO Harald Braun breaks down the new AV mandates in California mandates and how they will affect the driverless industry.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/tickets-geofences-1m-miles-new-reality-california-av-compliance/\">Tickets, geofences, and 1M miles: The new reality of California AV compliance<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "NVIDIA and Hugging Face Bring New Models and Frameworks to LeRobot for the Open Robotics Community", "source": "NVIDIA Robotics", "date": "2026-07-07", "url": "https://blogs.nvidia.com/blog/hugging-face-lerobot-models-frameworks-open-robotics/", "summary": "Open source AI has shown how quickly developers can innovate when models, data and tools are shared. Robotics has the same opportunity, but advancements in physical AI development can still be gated by costly and fragmented resources, from large datasets and robot foundation models to simulation, compute and validation tools. NVIDIA and Hugging Face are [&#8230;]"}, {"title": "Tesollo initiates IPO process while developing humanoid hands", "source": "Robotics Business Review", "date": "2026-07-07", "url": "https://www.therobotreport.com/tesollo-initiates-ipo-process-developing-humanoid-hands/", "summary": "<p>Tesollo, a South Korean robotic hand specialist, has officially begun preparations for its initial public offering.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/tesollo-initiates-ipo-process-developing-humanoid-hands/\">Tesollo initiates IPO process while developing humanoid hands<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "HIVE brings in $15M to build physical AI for industrial machines", "source": "Robotics Business Review", "date": "2026-07-07", "url": "https://www.therobotreport.com/hive-brings-in-15m-to-build-physical-ai-for-industrial-machines/", "summary": "<p>HIVE has deployed its technology across several sites in Scandinavia, operating autonomously across different machines.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/hive-brings-in-15m-to-build-physical-ai-for-industrial-machines/\">HIVE brings in $15M to build physical AI for industrial machines<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "ABB Robotics includes vSLAM navigation in F712 autonomous forklift", "source": "Robotics Business Review", "date": "2026-07-07", "url": "https://www.therobotreport.com/abb-robotics-includes-vslam-navigation-f712-autonomous-forklift/", "summary": "<p>The Flexley Stacy F712 forklift uses vision to navigate, works with other robots, and complies with safety standards, says ABB Robotics.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/abb-robotics-includes-vslam-navigation-f712-autonomous-forklift/\">ABB Robotics includes vSLAM navigation in F712 autonomous forklift<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "IEEE Honors Robotics Pioneer Toshio Fukuda", "source": "IEEE Spectrum Robotics", "date": "2026-07-07", "url": "https://spectrum.ieee.org/ieee-honors-toshio-fukuda", "summary": "<img src=\"https://spectrum.ieee.org/media-library/three-men-in-suits-onstage-smiling-as-one-presents-an-award-medal-in-a-box.jpg?id=67107362&amp;width=1245&amp;height=700&amp;coordinates=0%2C469%2C0%2C469\" /><br /><br /><p><a href=\"https://ethw.org/Toshio_Fukuda\" rel=\"noopener noreferrer\" target=\"_blank\">Toshio Fukuda<\/a> has been blazing trails for most of his career. He is considered to be one of the most prolific scholars in <a href=\"https://spectrum.ieee.org/topic/robotics/\" target=\"_self\">robotics<\/a>, writing more than 2,000 research papers and authoring several books on the field. He’s an influential figure thanks to his pioneering work developing biomedical robotic systems, industrial robots, micro-nano robotics, mechatronics, and AI-driven automation.<\/p><p>Fukuda launched one of the first robotics conferences, the <a href=\"https://www.ieee-ras.org/conferences-workshops/financially-co-sponsored/iros/\" rel=\"noopener noreferrer\" target=\"_blank\">IEEE/RSJ International Conference on Intelligent Robots and Systems<\/a> (IROS). It is still popular almost 40 years later.<\/p><h3>Toshio Fukuda<\/h3><br /><p><strong>Employer<\/strong><\/p><p>Egypt-Japan University of Science and Technology, in Alexandria<\/p>\n<p><strong>Title<\/strong><\/p><p>Professor and vice president of research<\/p>\n<p><strong>Member grade<\/strong><\/p><p>Life Fellow<\/p>\n<p><strong>Alma maters<\/strong><\/p><p>Waseda University, in Tokyo; University of Tokyo <\/p><p>An IEEE Life Fellow, he is a professor emeritus in the department of micro-nano systems engineering and a visiting professor at <a href=\"https://en.nagoya-u.ac.jp/\" rel=\"noopener noreferrer\" target=\"_blank\">Nagoya University<\/a>, in Japan, where he taught for nearly 25 years. Currently, he is a vice president of research at the <a href=\"https://ejust.edu.eg/\" rel=\"noopener noreferrer\" target=\"_blank\">Egypt-Japan University of Science and Technology<\/a>, in Alexandria, Egypt.<\/p><p>Within IEEE, Fukuda has held top volunteer positions including the organization’s highest office: He served as <a href=\"https://spectrum.ieee.org/u/toshio-fukuda\" target=\"_self\">IEEE president<\/a> in 2020, becoming the first person of Asian descent to hold the role.<\/p><p>He’s a former program director of Japan’s <a href=\"https://www.jst.go.jp/moonshot/en/about.html\" rel=\"noopener noreferrer\" target=\"_blank\">Moonshot program<\/a>, which by 2050 intends to develop advanced AI robots.<\/p><p>Born in Japan, Fukuda has been recognized by the country for his contributions to science with two of its highest awards: the <a href=\"https://en.wikipedia.org/wiki/Medals_of_Honor_(Japan)\" rel=\"noopener noreferrer\" target=\"_blank\">Medal of Honor with a purple ribbon<\/a> in 2015 and the <a href=\"https://en.wikipedia.org/wiki/Order_of_the_Sacred_Treasure\" rel=\"noopener noreferrer\" target=\"_blank\">Order of the Sacred Treasure<\/a> in 2022.<\/p><p>IEEE honored him with this year’s <a href=\"https://corporate-awards.ieee.org/award/ieee-richard-m-emberson-award/\" rel=\"noopener noreferrer\" target=\"_blank\">Richard M. Emberson Award<\/a> for “distinguished service advancing the technical objectives of IEEE, especially in the area of robotics.” The IEEE Board-level award is sponsored by the <a href=\"https://ta.ieee.org/technical-activities-board\" rel=\"noopener noreferrer\" target=\"_blank\">IEEE Technical Activities Board<\/a>. Fukuda received the award on 24 April at a <a href=\"https://spectrum.ieee.org/ieee-celebrates-honors-ceremony-2026\" target=\"_self\">ceremony<\/a> in New York City.<\/p><p>As a former IEEE president who has served as a master of ceremonies at several of the organization’s major award events, Fukuda noted that he is more accustomed to bestowing awards than receiving them.<\/p><p>“It’s very interesting to be on the receiving end,” he says.<\/p><h2>The journey into robotics research<\/h2><p>As a teenager, Fukuda spent his summer breaks teaching himself how to build things including transistor radios and steam engines.<\/p><p>“It was very nice to have a hands-on hobby and make these kinds of things myself,” he says. His experimentation led him to study engineering.<\/p><p>He earned a bachelor’s degree in engineering in 1971 from <a href=\"https://www.waseda.jp/top/en/\" rel=\"noopener noreferrer\" target=\"_blank\">Waseda University<\/a>, in Tokyo. He says one of his professors there—<a href=\"https://www.humanoid.waseda.ac.jp/history.html\" rel=\"noopener noreferrer\" target=\"_blank\">Ichiro Kato<\/a>, regarded as the father of Japanese robotics research—was a good mentor who made a positive impact.<\/p><p>Fukuda’s research interests were robotics and mechatronics, a field that combines robotics, electronics, computer science, and control systems.<\/p><p>He went on to earn a master’s degree and a doctorate in science from the <a href=\"https://www.u-tokyo.ac.jp/en/\" rel=\"noopener noreferrer\" target=\"_blank\">University of Tokyo<\/a>, in 1971 and 1977. During those years, he also attended <a href=\"https://www.yale.edu/\" rel=\"noopener noreferrer\" target=\"_blank\">Yale<\/a>, where he conducted research on advanced control theory in 1973.<\/p><p>He reflects fondly on his time at Yale: “It was a very nice environment and a kind of free-thinking atmosphere. It motivated me to study more.”<\/p><p class=\"pull-quote\">“IEEE doesn’t care who you are, what you do, what country you are from, or whether you are male or female. IEEE accepts people who have energy and passion.”<\/p><p>While at Yale, Fukuda served as an assistant to his advisor—which led him to consider a career in academia, he says, because he enjoyed the freedom that research work afforded him.<\/p><p>But he realized that such freedom comes with a price. University researchers are expected to raise the money that funds their work. He compares researchers to small-business owners who have to bring in money to keep their enterprise afloat.<\/p><p>That realization led him to select robotics as his field because he intended to develop technologies useful to industry, he says.<\/p><p>After earning his doctorate, he returned to Japan in 1977 to work as a research scientist at the government’s Mechanical Engineering Laboratory, later renamed the <a href=\"https://www.aist.go.jp/aist_e/about_aist/\" target=\"_blank\">National Institute of Advanced Industrial Science and Technology<\/a>, in Tsukuba.<\/p><p>“There was a lot of research going on at the lab, including practical robotics and theory,” he says.<\/p><p>He left Japan in 1979 to become a visiting research fellow at the <a href=\"https://www.uni-stuttgart.de/en/\" rel=\"noopener noreferrer\" tar
