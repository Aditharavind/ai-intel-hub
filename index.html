arry its own power, and still have room for useful sensors is extraordinarily difficult,” Vo-Doan says. An insect already comes with much of that mobility built in, so instead of trying to create artificial versions of every part of an insect’s body from scratch, researchers can graft an electronic interface onto an insect to make use of its existing capabilities.<\/p><p>Previously, scientists have shown they could steer cyborg insects such as <a href=\"https://spectrum.ieee.org/the-robot-insect-race\" target=\"_self\">beetles<\/a> and <a href=\"https://spectrum.ieee.org/cyborg-moth-gets-a-new-radio\" target=\"_self\">moths<\/a>. This prior work largely focused on controlling their movements to serve as passive sensor platforms.<\/p><p>In 2023, as Vo-Doan and fellow researcher <a href=\"https://www.unsw.edu.au/staff/thanh-nho-do\" rel=\"noopener noreferrer\" target=\"_blank\">Thanh Nho Do<\/a> were talking about search-and-rescue cyborg insects shortly before that year’s IEEE International Conference on Robotics and Automation (ICRA), they asked, “What happens after an insect finds a trapped victim?” Vo-Doan recalls. “Could it go beyond locating someone and actually provide some form of assistance while rescuers are still trying to reach them?”<\/p><h3>Giant Cockroaches to the Rescue<\/h3><p>To answer this question, the roboticists experimented with giant burrowing cockroaches (<a href=\"https://en.wikipedia.org/wiki/Giant_burrowing_cockroach\" rel=\"noopener noreferrer\" target=\"_blank\"><em><em>Macropanesthia rhinoceros<\/em><\/em><\/a>), which are native to Australia. The researchers needed an insect capable of carrying a large payload (over half their weight), and at roughly 40 grams in size, this species is <a href=\"https://www.guinnessworldrecords.com/world-records/106442-heaviest-cockroach\" rel=\"noopener noreferrer\" target=\"_blank\">the world’s heaviest species of roach<\/a>. A larger insect is also easier to operate on to implant cybernetic interfaces.<\/p><p>The cockroaches were saddled with lightweight electronics that included electrodes implanted into both their antennae and small tail-like appendages known as cerci. Wirelessly activating these electrodes with a handheld gaming controller could steer the roaches left or right, spur them forward, or stop them from moving.<\/p><p>The insects were also equipped with either a wireless camera or a remote-controlled injector, which used a spring to launch a drug-filled syringe at a nearby target. A chemical reaction inside the syringe then generated a puff of carbon dioxide, which exerted pressure within the syringe to inject its payload into a target.<\/p><p class=\"shortcode-media shortcode-media-rebelmouse-image\"> <img alt=\"Two large cockroaches each with a set of electronics and sensors on their carapace\" class=\"rm-shortcode\" id=\"1244e\" src=\"https://spectrum.ieee.org/media-library/two-large-cockroaches-each-with-a-set-of-electronics-and-sensors-on-their-carapace.jpg?id=67724308&amp;width=980\" /> <small class=\"image-media media-caption\">Paraborgs are designed to work in teams, with some carrying cameras and others carrying injectors with potentially lifesaving medications.<\/small><small class=\"image-media media-photo-credit\">The University of Queensland<\/small><\/p><p>The scientists decided not to load both a camera and an injector onto a single roach because the combined weight and bulk could impair their mobility in complex terrains. Having both sets of electronics would also increase energy demands, resulting in reduced operation time. Instead, the researchers envision a <a href=\"https://spectrum.ieee.org/swarm-of-cyborg-cockroaches\" target=\"_self\">swarm<\/a> approach with the Paraborgs, with different specialized cyborgs performing complementary roles.<\/p><p>In proof-of-concept tests, the scientists were able to successfully navigate the Paraborgs over a 2.5-meter course past three checkpoints before launching their needles at an 8-by-10-centimeter silicone target. In 25 trials, the cockroaches completed the course every single time and succeeded at injecting the target 72 percent of the time. “The long-term goal is to combine the insect’s advanced locomotion with sensing and intervention capabilities so we can reach and help more people, more quickly,” Vo-Doan says.<\/p><p class=\"shortcode-media shortcode-media-rebelmouse-image\"> <img alt=\"Two large cockroaches with backpack electronics navigate around rocks and over sand.\" class=\"rm-shortcode\" id=\"e3858\" src=\"https://spectrum.ieee.org/media-library/two-large-cockroaches-with-backpack-electronics-navigate-around-rocks-and-over-sand.jpg?id=67724312&amp;width=980\" /> <small class=\"image-media media-caption\">While the Paraborgs can be steered remotely, the cockroaches themselves are still very much alive and able to use their skills as bugs to navigate through complex terrain.<\/small><small class=\"image-media media-photo-credit\">The University of Queensland<\/small><\/p><p>The researchers acknowledge that “for someone who is already trapped or injured, seeing a cyborg insect approaching could understandably be a little surprising or unsettling at first,” Vo-Doan says. Ways to make it clear these insects were part of rescue efforts might include flashing lights, recognizable emergency markings, “or perhaps a tiny speaker delivering a simple message such as, ‘help is on the way,’” Vo-Doan adds. “Making people feel comfortable with the technology is just as important as making it work.”<\/p><h3>Practical Paraborgs<\/h3><p>In the future, Vo-Doan and his colleagues aim to address practical issues with the Paraborg. These include compensating for the movements of victims, establishing reliable wireless communications inside collapsed structures, and guiding the cyborgs as they climb over and squeeze through complex environments filled with rubble and dust. Autonomy will become increasingly important for these insects, particularly if the scientists want to operate multiple cyborgs at the same time, he says.<\/p><p>In addition, a fundamental challenge when it comes to working with cyborg insects is that they are living creatures with minds of their own. “We are not piloting them like conventional wheeled robots,” Vo-Doan says. “Electrical stimulation influences their direction, but the insect still generates and controls much of its own locomotion.” To deal with this unreliability, the Paraborgs will need better onboard systems to pinpoint their positions and monitor their actions so researchers can recognize when an insect has deviated from its course or become less responsive.<\/p><p>“We are not suggesting that this is a medical device ready to be used on people today,” Vo-Doan says. “Real disaster sites are full of unstable debris, narrow gaps, and communication difficulties, so we need to understand how the insect, electronics, and injector all perform under those conditions. There are also important questions around drug choice and dosage, sterility, needle safety, reliability, and regulation.”<\/p><p>Ultimately, such research into cyborg cockroaches may help inform robot design, explains Vo-Doan. These insects “can give us useful capabilities sooner while, at the same time, helping us develop the fully artificial systems of the future.”<\/p><p>The scientists detailed <a href=\"https://advanced.onlinelibrary.wiley.com/doi/10.1002/advs.76973\" target=\"_blank\">their findings<\/a> last month in the journal <em><em>Advanced Science<\/em><\/em>.<\/p>"}, {"title": "Enovis to acquire surgical tech provider eCential Robotics for $180M", "source": "Robotics Business Review", "date": "2026-09-05", "url": "https://www.therobotreport.com/enovis-to-acquire-ecential-robotics-for-180m/", "summary": "<p>Enovis said it plans to bring a robotic system targeting the knee within the next two years, followed by a system focusing on the shoulder.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/enovis-to-acquire-ecential-robotics-for-180m/\">Enovis to acquire surgical tech provider eCential Robotics for $180M<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "ARM Institute gets $90M for 10 projects to modernize military manufacturing", "source": "The Robot Report", "date": "2026-09-05", "url": "https://www.therobotreport.com/arm-institute-gets-90m-for-10-projects-to-modernize-military-manufacturing/", "summary": "<p>Fifteen member organizations will deliver viable working solutions within a two-year timeframe, the ARM Institute said.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/arm-institute-gets-90m-for-10-projects-to-modernize-military-manufacturing/\">ARM Institute gets $90M for 10 projects to modernize military manufacturing<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Lyte raises $165M to help robots better sense their surroundings", "source": "Robotics Business Review", "date": "2026-09-04", "url": "https://www.therobotreport.com/lyte-raises-165m-help-robots-better-sense-their-surroundings/", "summary": "<p>Lyte AI plans to use its second round of funding this year to scale production of its AI and perception capabilities.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/lyte-raises-165m-help-robots-better-sense-their-surroundings/\">Lyte raises $165M to help robots better sense their surroundings<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Robot.com partners with Sodexo to roll out more sidewalk delivery robots", "source": "Robotics Business Review", "date": "2026-09-04", "url": "https://www.therobotreport.com/robot-com-partners-sodexo-rolls-out-more-sidewalk-delivery-robots/", "summary": "<p>Robot.com says college campuses will continue to be an important part of its strategy as it scales sidewalk delivery robots.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/robot-com-partners-sodexo-rolls-out-more-sidewalk-delivery-robots/\">Robot.com partners with Sodexo to roll out more sidewalk delivery robots<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "How FPGAs become the gatekeepers of physical AI security", "source": "Robotics Business Review", "date": "2026-09-04", "url": "https://www.therobotreport.com/how-fpgas-become-the-gatekeepers-of-physical-ai-security/", "summary": "<p>Eric Sivertson, vice president of security business at Lattice Semiconductor, explains how FPGAs can act as deterministic guardrails for robotic systems.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/how-fpgas-become-the-gatekeepers-of-physical-ai-security/\">How FPGAs become the gatekeepers of physical AI security<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Calling robotics startups: Apply now to be part of the 2026 Robotics Startup Radar", "source": "Robotics Business Review", "date": "2026-09-04", "url": "https://www.therobotreport.com/calling-all-robotics-startups-apply-now-2026-robotics-startup-radar/", "summary": "<p>Submit now to be part of the Robotics Startup Radar, which brings together some of the most promising robotics startups.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/calling-all-robotics-startups-apply-now-2026-robotics-startup-radar/\">Calling robotics startups: Apply now to be part of the 2026 Robotics Startup Radar<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Video Friday: Digit Redecorates", "source": "IEEE Spectrum Robotics", "date": "2026-09-04", "url": "https://spectrum.ieee.org/video-friday-agility-robotics-digit", "summary": "<img src=\"https://spectrum.ieee.org/media-library/humanoid-robot-tidies-an-orange-couch-while-a-person-watches-in-a-modern-living-room.gif?id=67725697&amp;width=1245&amp;height=700&amp;coordinates=0%2C0%2C0%2C0\" /><br /><br /><p><span>Video Friday is your weekly selection of awesome robotics videos, collected by your friends at <\/span><em>IEEE Spectrum<\/em><span> robotics. We also post a weekly calendar of upcoming robotics events for the next few months. Please <\/span><a href=\"mailto:automaton@ieee.org?subject=Robotics%20event%20suggestion%20for%20Video%20Friday\">send us your events<\/a><span> for inclusion.<\/span><\/p><h5><a href=\"https://humanoidssummit.com/\">Humanoids Summit Seoul<\/a>: 22–23 September 2026, SEOUL<\/h5><h5><a href=\"https://2026.ieee-iros.org/\">IROS 2026<\/a>: 27 September–1 October 2026, PITTSBURGH<\/h5><h5><a href=\"https://www.corl.org/\">CoRL 2026<\/a>: 9–12 November 2026, AUSTIN<\/h5><p>Enjoy today’s videos!<\/p><div class=\"horizontal-rule\"><\/div><div><span style=\"display: none;\"> <\/span><\/div><p class=\"rm-anchors\" id=\"ozpzi8vhgsg\">I know these videos from <a href=\"https://spectrum.ieee.org/digit-agility-robotics\" target=\"_blank\">Agility<\/a> can be a little bit silly, but the couch drag in this one is impressive.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.agilityrobotics.com/\">Agility Robotics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"hbynm1gcxbu\"><em>Stabilizing unsecured payloads against the inherent oscillations of dynamic bipedal locomotion remains a critical engineering bottleneck for humanoids in unstructured environments. To solve this, we introduce ReST-RL, a hierarchical reinforcement-learning architecture that explicitly decouples locomotion from payload stabilization. Successfully deployed on the Unitree G1 humanoid hardware, this modular approach demonstrates highly reliable zero-shot sim-to-real generalization across various objects and external force disturbances.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://steadytray.github.io/\">SteadyTray<\/a> ]<\/p><p>Thanks, Ioana!<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"qbuixdvviv4\"><a href=\"https://spectrum.ieee.org/figure-new-humanoid-robot\" target=\"_blank\">Figure<\/a> is scaling compute so that its robots can...uh...have their compute scaled, I guess?<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>Solving for a robot in every home is not a data-and-compute problem, it’s a safety-and-cost problem.<\/p><p>[ <a href=\"https://www.figure.ai/\">Figure<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"lg0lq7s69g4\">The most important thing to know about this gripper is that koalas have two thumbs on each hand.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://rai-inst.com/resources/blog/handheld-robotic-data-collection/\">RAI Institute<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"frfad-zunfy\">DARPA Triage Challenge Finals are in November!<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.darpa.mil/research/challenges/darpa-triage-challenge\">DARPA<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"ezcbwdvd_ya\"><em>Online, humanoid robots are very impressive to watch, but behind the scenes, most of those movements are carefully choreographed. Researchers in Carnegie Mellon University’s Safe AI Lab are instead teaching robots how to adapt. Their system, called APEX, allows a humanoid robot to navigate obstacles using adaptive, full-body maneuvers.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://engineering.cmu.edu/news-events/news/2026/09/02-robot-human-collaboration.html\">CMU<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"7dl-f9sbnek\"><em>Researchers from North Carolina State University have created teardrop-shaped soft robots that leap upward or forward when exposed to infrared light—and will keep jumping as long as the light is present. <\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><blockquote><em>The robots are made of a liquid-crystal elastomer ribbon shaped like a teardrop, with a thin aluminum tube shaped like a V at one end. When exposed to light from an infrared lamp, the surface of the ribbon contracts, causing the ribbon to rotate. The stiff V at one end of the robot prevents the ribbon from simply rolling in place, causing the ribbon to twist tighter and tighter. This stores energy until the twist reaches a critical point when the ribbon releases that energy, causing the V at one end of the teardrop to snap downward and strike the surface. This launches the teardrop into the air.<\/em><\/blockquote><p>[ <a href=\"https://news.ncsu.edu/2026/08/soft-robots-jumping-forever/\">NC State<\/a> ]<\/p><p>Thanks, Ship!<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"ws6boq4yeaq\">I’ll be honest—I was prepared to be underwhelmed by the DARPA Lift Challenge, but there was such creativity in the heavy-lift drone designs that I’m excited for it to come back in 2028.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.darpaliftchallenge.com/\">DARPA Lift Challenge<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"nh47n7cbx7s\">Thank you, Christian, for attempting to talk some sense into the internet.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.christianhubicki.com/\">Christian Hubicki<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"l9xu2wmkrrg\"><em>Humans use not only muscle signals but also stretched skin around joints as a cue for proprioception. To mimic this biological mechanism, we developed a three-layer joint-covering skin with 44 pressure- and stretch-sensitive elements for the musculoskeletal humanoid Musashi-W.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>It’s not a replicant, but one day, it will be.<\/p><p>[ <a href=\"https://poyotamu000.github.io/musashiw-joint-covering-skin/\">University of Tokyo<\/a> ]<\/p><p>Thanks, Akihiro!<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"8kdxnt-4zl0\">Having mobility issues with your robot? Just staple it to the end of an industrial robotic arm. Problem solved!<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.limxdynamics.com/en/products/tron2\">LimX Dynamics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"_kytnzqoe4k\">But what if I am the sort of person who needs to speak to a manager?<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.sharpa.com/pages/north-at-work\">Sharpa<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"gzxkmyjh5py\"><em>In Turpan, China—known as the City of Fire—summer ground temperatures can exceed 50 °C. During the grape harvest, farmers traditionally carry heavy baskets back and forth under the intense heat, while every extra minute in the sun can affect the freshness of the fruit. This year, the DEEP Robotics Lynx M20S joined the harvest. <\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.deeprobotics.cn/en\">DEEP Robotics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"_uav5s18cwq\"><em>This video showcases the achievements of the first OH! GYM! Project cohort, a group of university and graduate students who explored, developed, and deployed their own humanoid behaviors using the open-source AI Sapiens K1 platform. Over the course of one month, the students experienced the complete process of humanoid development—from creating motions in simulation to transferring them onto a physical robot through repeated Sim2Real experiments.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://docs.robotis.com/docs/common/oh_project/\">ROBOTIS<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div>"}, {"title": "PlusAI to take autonomous trucking public via a SPAC deal", "source": "Robotics Business Review", "date": "2026-09-03", "url": "https://www.therobotreport.com/plusai-takes-autonomous-trucking-public-via-spac-deal/", "summary": "<p>The SPAC transaction values PlusAI, whose self-driving trucking software is already generating revenue, at about $800 million.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/plusai-takes-autonomous-trucking-public-via-spac-deal/\">PlusAI to take autonomous trucking public via a SPAC deal<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Protecting Dynamic Industrial Robot Cable Carriers", "source": "IEEE Spectrum Robotics", "date": "2026-09-03", "url": "https://spectrum.ieee.org/industrial-robot-cable-carrier-protection", "summary": "<img src=\"https://spectrum.ieee.org/media-library/industrial-robotic-arm-with-cable-management-system-and-flexible-energy-chains.jpg?id=67633840&amp;width=1245&amp;height=700&amp;coordinates=0%2C104%2C0%2C104\" /><br /><br /><p><em>This article is brought to you by <a href=\"https://tsubaki-kabelschlepp.com/\" target=\"_blank\">Tsubaki KabelSchlepp<\/a>.<\/em><\/p><p>In modern automated manufacturing, six-axis articulated robots perform high-speed, multidirectional maneuvers under demanding operational cycles. However, as robot arms swivel, rotate, and extend, the electrical cables, fiber optics, and pneumatic hoses supplying them endure severe mechanical stress. Torsional twist, rapid acceleration, and repeated contact with machine structures often lead to premature conductor fatigue, insulation breakdown, and costly unplanned production halts.<\/p><p>To overcome these multi-axis motion challenges, the <a href=\"https://carriers.ustsubaki.com/products/cable-carriers/robotrax-system?utm_campaign=KSD&amp;utm_source=IEEESpectrum&amp;utm_medium=Native&amp;utm_term=Article&amp;utm_content=RobotraxDresspack\" rel=\"noopener noreferrer\" target=\"_blank\"><span>Tsubaki KabelSchlepp Robotrax System<\/span><\/a> provides a specialized three-dimensional cable carrier engineered specifically for complex robotic motion.<\/p><h2>Managing High Tensile Forces With Central Steel Technology<\/h2><p>Conventional cable carriers often transfer operational movement stress directly onto internal electrical lines and hoses. The Robotrax system changes this dynamic through a central steel cable that runs through the core of every chain link.<\/p><p class=\"pull-quote\">The Robotrax system’s central steel cable absorbs the primary tensile loads and preserves conductor integrity, dramatically extending cable service life.<\/p><p>When robot arms undergo rapid directional shifts and accelerations up to 10 g, this internal steel cable absorbs the primary tensile loads. By isolating electrical and fluid lines from pulling forces, the design preserves conductor integrity and dramatically extends cable service life. Mechanics can easily calibrate and adjust system tension using an integrated clamping piece, ensuring consistent mechanical support throughout long operational cycles.<\/p><h2>Spherical Link Design and Modular Cable Routing<\/h2><p>The foundation of the Robotrax system lies in its open, single-piece plastic links featuring spherical snap-on connections on both sides. This geometry allows the carrier to flex smoothly across three axes, providing radial rotation of up to ±450 degrees per meter depending on the model size.<\/p><p>To optimize internal organization, carrier links contain up to three distinct chambers. This physical separation prevents signal interference and mechanical abrasion between heavy power lines, sensitive data channels, and fluid hoses. For standard models (R040 through R100), technicians can press cables directly into the carrier without tools, drastically reducing installation and maintenance time. Larger configurations, such as the R140X, incorporate swiveling crossbars with snap locks alongside vertical and horizontal dividers for customized interior partitioning.<\/p><h3>​ROBOTRAX System<\/h3><br /><img alt=\"Numbered diagram of a flexible robotic arm with segmented joints and components\" class=\"rm-shortcode\" id=\"4af39\" src=\"https://spectrum.ieee.org/media-library/numbered-diagram-of-a-flexible-robotic-arm-with-segmented-joints-and-components.jpg?id=67685927&amp;width=980\" /><ol style=\"margin: 16px 0 0 0;\"><li style=\"padding: 4px 4px;\">Steel cable for transferring extremely high tensile forces<\/li><li style=\"padding: 4px 4px;\">Tension piece for locking the chain links<\/li><li style=\"padding: 4px 4px;\">Type with toolless opening swivel crossbars and divider module available<\/li><li style=\"padding: 4px 4px;\">Open design<br />– Fast cable laying as the cables are simply pressed in<br />– Easy checking of all cables<\/li><li style=\"padding: 4px 4px;\">Special plastic for long service life<\/li><li style=\"padding: 4px 4px;\">Protective covers or heat shields made from different materials are available for different environmental conditions<\/li><li style=\"padding: 4px 4px;\">Quick-release bracket for fixing and continuation<\/li><li style=\"padding: 4px 4px;\">Strain relief with LineFix clamps<\/li><li style=\"padding: 4px 4px;\">Protection against hard impacts, excessive abrasion and premature wear as well as limitation of the bending radius through protector<\/li><\/ol><h2>Active Retraction and Impact Protection<\/h2><p>Large robot work envelopes and high-speed motion trajectories can cause loose cable carrier loops to swing and strike the robot body. To eliminate these destructive collisions, Tsubaki KabelSchlepp integrates the Pull Back Unit (PBU).<\/p><p>The PBU serves as an active retraction mechanism that maintains optimal tension on the cable carrier throughout the entire motion cycle. By preventing excess slack and eliminating interfering contours, the PBU minimizes collision risks across complex movement paths. The unit requires zero maintenance on its retraction element and offers standard mounting configurations for leading industrial robot platforms, including KUKA, ABB, and FANUC.<\/p><p class=\"pull-quote\">Tsubaki KabelSchlepp’s Pull Back Unit <span>maintains optimal tension on the cable carrier and minimizes collision risks across complex movement paths.<\/span><\/p><p><span><\/span><span>Additionally, external protectors can be retrofitted onto individual chain links. These durable impact shields limit the minimum bending radius to prevent over-flexing while shielding the chain body from severe external abrasion. If wear occurs, technicians simply replace the modular protector rather than the entire cable carrier assembly.<\/span><\/p><h2>Built for Demanding Industrial Environments<\/h2><p>From automotive welding cells to high-speed machining centers, Robotrax systems adapt to severe working conditions through tailored protective accessories:<\/p><ul><li><strong>Heat Shields: <\/strong>Aluminum-coated textile fiber covers protect against radiated heat, hot weld spatter, and flying sparks.<\/li><li><strong>Protective Covers: <\/strong>Coated polyester sleeves shield sensitive lines against aggressive cutting fluids, hydraulic oils, paint overspray, and abrasive dust.<\/li><li><strong>LineFix Strain Relief:<\/strong> Multi-layer clamping devices anchor cables securely at both ends to prevent axial displacement during intense motion.<\/li><\/ul>By combining central load absorption, multi-axis flexibility, and active retraction control, the Robotrax system offers plant engineers and system integrators a reliable path toward maximizing robot uptime and reducing total operational costs."}, {"title": "The Best Way to Explore Lunar Craters Is a Giant Robot Ball", "source": "IEEE Spectrum Robotics", "date": "2026-09-03", "url": "https://spectrum.ieee.org/moon-ball-robot", "summary": "<img src=\"https://spectrum.ieee.org/media-library/a-gif-of-a-spherical-robot-rolling-over-a-bumpy-path.gif?id=67701776&amp;width=1245&amp;height=700&amp;coordinates=0%2C0%2C0%2C0\" /><br /><br /><p>On a good day, the rock quarry in central Texas is about 370,000 kilometers (230,000 miles) from the moon. But last February, when Rishi Jangale watched his 1.8-meter-wide, 150-kilogram inflatable robot roll effortlessly over rocks, gravel, and wet clay, his imagination turned the quarry into the lunar surface instead.<\/p><p>Jangale is an upbeat mechanical engineer nearing the end of his Ph.D. at Texas A&amp;M University, in College Station, Texas. He and his labmates have been working on this big tan “RoboBall” for about five years. Their goal: create a vehicle capable of <a href=\"https://spectrum.ieee.org/a-jumping-robot-for-enceladus\" target=\"_blank\">exploring some of the most inaccessible terrain<\/a> in our solar system, such as the 21 km-wide Shackleton crater on the moon’s south pole.<\/p><p>The Shackleton crater is 4 km deep and contains many smaller, deeper craters within. Some parts of the crater never see the sun, and within these perpetually dark, frigid pockets lie mysterious substances that planetary scientists have long struggled to examine, including layers of ancient lunar geology and stores of frozen water that could potentially support a future lunar base.<\/p><p>“The moon is like an archive of what happened to the Earth,” says <a href=\"https://www.nhm.ac.uk/our-science/people/sara-russell.html\" rel=\"noopener noreferrer\" target=\"_blank\">Sara Russell<\/a>, a cosmic mineralogist with London’s Natural History Museum who is not involved with Texas A&amp;M’s work. “Robotic collection works brilliantly well, and it’s great to see that being explored more in this context.”<\/p><p>“NASA is not going to let astronauts get anywhere near these craters, because if someone falls in, you’re not going to be able to get them out,” Jangale says. “So we thought, what better shape to roll down a hill than a ball?” In a <a href=\"https://ieeexplore.ieee.org/document/11248963\" rel=\"noopener noreferrer\" target=\"_blank\">recent paper<\/a> published in <em><em>IEEE Transactions on Field Robotics<\/em><\/em>, Jangale’s team reports on the design of RoboBall, a hypothetical lunar mission, and the results from initial tests in the Texas quarry.<\/p><h2>Getting Rolling<\/h2><p>RoboBall is the brainchild of Jangale’s advisor, <a href=\"http://link?\" rel=\"noopener noreferrer\" target=\"_blank\">former NASA robotics engineer Robert Ambrose<\/a>, who first conceived of the design in 2003.<\/p><p>Ambrose figured that a ball could address a pesky mobility risk that robots face on lunar terrain, especially in low gravity: <a href=\"https://www.bbc.com/news/science-environment-68388695\" rel=\"noopener noreferrer\" target=\"_blank\">tipping over<\/a>. An inflatable sphere can’t tip over, and the form factor also insulates its internal components from sharp rocks, dust, and the huge temperature swings from over 93 °C in sunlit spots to minus 240 °C in the shade inside lunar craters. Ambrose imagined a wheeled rover parking at a crater’s edge and releasing a RoboBall to explore its depths. Unlike <a href=\"https://www-robotics.jpl.nasa.gov/how-we-do-it/systems/the-axel-rover/\" rel=\"noopener noreferrer\" target=\"_blank\">a small tethered rover<\/a>, the RoboBall wouldn’t roll its way back up—but with no strings attached, it would have a far greater range to collect geological samples, and then be able to launch them back to the rover outside the crater with small rockets.<\/p><p class=\"shortcode-media shortcode-media-rebelmouse-image rm-float-left rm-resized-container rm-resized-container-25\" style=\"float: left;\"> <img alt=\"A wheeled rover carrying a robotic ball up a small hill of dirt and gravel.\" class=\"rm-shortcode\" id=\"20656\" src=\"https://spectrum.ieee.org/media-library/a-wheeled-rover-carrying-a-robotic-ball-up-a-small-hill-of-dirt-and-gravel.jpg?id=67694269&amp;width=980\" /> <small class=\"image-media media-caption\">A robotic rover would ferry RoboBall across the lunar surface to the edge of a crater.<\/small><small class=\"image-media media-photo-credit\"><a href=\"https://ieeexplore.ieee.org/document/11248963\" target=\"_blank\">R. Jangale, D. Pravecek, et al.<\/a><\/small><\/p><p>NASA hasn’t brought lunar samples back to Earth in over 50 years. Some morsels of moon geology find their way to Earth as meteorites, but Russell says these lack the “gold standard” field work—context about where that sample actually came from. Even as NASA reboots its crewed moon missions, many lunar sites remain inaccessible.<\/p><p>In 2022, Ambrose’s lab finished a proof of concept, the 0.5-meter-wide RoboBall II. Creating the full-size RoboBall III then took about 11 months. “We were building these robots really quickly,” Jangale says. “Ambrose really encourages us to use and break these robots.” And designs did go awry. Jangale remembers software errors and a drivetrain that proved too weak to roll over soft bumps in initial tests.<\/p><p class=\"shortcode-media shortcode-media-youtube\"> <span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span> <small class=\"image-media media-photo-credit\"><a href=\"https://www.youtube.com/watch?v=tnj4BRuprlI\" target=\"_blank\">Texas A&amp;M RAD Lab/YouTube<\/a><\/small><\/p><h2>How to Slow Your Roll<\/h2><p>RoboBall drives by moving a pendulum within its shell, shifting its entire center of mass. On flat ground, if the pendulum’s arm points forward, the shell rolls forward to compensate, and as long as the pendulum keeps the center of mass in front of the center of the ball, RoboBall will keep rolling forward. If the pendulum leans a few degrees to the left or right, RoboBall steers left or right to match. “The robot wants to go where you point the pendulum,” Jangale says. The 340-pound ball is just soft enough to bounce lightly over bumpy obstacles, but its slight overpressure keeps it relatively firm. On steep slopes, this mechanism also lets the ball control its downhill speed by simply angling the pendulum uphill.<\/p><p>“The beauty here is the simplicity,” says Hiro Ono, an aerospace engineer who worked on robot mobility at NASA’s Jet Propulsion Lab for 13 years before joining Georgia Tech. For space robots, Ono describes simplicity in terms of the number of actuators. RoboBall has just two, and both are fully inside of the shell, shielded from environmental risk factors like dust, a feature that Ono describes as “unique.”<\/p><p>After the first quarry tests, it took about seven months for the team to design and build an upgraded RoboBall III with 2.5 times more torque—enough to fling itself over small obstacles and roll up 20 degree slopes.<\/p><p class=\"shortcode-media shortcode-media-rebelmouse-image\"> <img alt=\"Close-up of a needle-like rocket protruding from the payload bay of a large robotic ball.\" class=\"rm-shortcode\" id=\"0c74a\" src=\"https://spectrum.ieee.org/media-library/close-up-of-a-needle-like-rocket-protruding-from-the-payload-bay-of-a-large-robotic-ball.jpg?id=67694233&amp;width=980\" /> <small class=\"image-media media-caption\">A small rocket can launch out of the center of the RoboBall to return a sample back to a rover outside the crater.<\/small><small class=\"image-media media-photo-credit\"><a href=\"https://ieeexplore.ieee.org/document/11248963\" target=\"_blank\">R. Jangale, D. Pravecek, et al.<\/a><\/small><\/p><h2>Getting Mission Ready<\/h2><p>In the new paper, the remotely operated RoboBall III descended the quarry’s slopes, navigated soft terrain, and launched hypothetical payloads back out of the crater with small rockets. Powered by a large battery, the robot would inflate itself during a lunar mission and charge up from a robotic rover at the edge of a crater before heading out on its own.<\/p><p>RoboBall is probably not the right platform for all kinds of missions—its slightly bumbling nature means that it’s not ideal if you want to collect a sample from a very specific rock, for example. For now, the team hopes to work with scientists designing lunar science instruments to physically fit into RoboBall’s carry-on-luggage-size interior, while also fitting in with how RoboBall operates. “The robot is not the mission,” Jangale says. “The robot is a way for you to complete the mission.”<\/p><p>The current version of RoboBall cost roughly $250,000 to build, but is not quite ready for the moon in its current form. While its gold-treated aluminum parts are appropriate for space missions, its other materials are not. Space-grade electronics will cost more, and the ball’s shell—made from a material tough enough to roll over steel shards and withstand minus 184 °C temperatures—has never been evaluated in lunar extremes. Aside from materials questions, the team plans to engineer the ball to adapt how it drives on varying slopes autonomously. They also hope to collaborate with government agencies or spaceflight contractors to keep refining the robot’s design for a real, <a href=\"https://spectrum.ieee.org/moon-landing-2025\" target=\"_blank\">eventual mission<\/a>.<\/p><p>Later this year, Texas A&amp;M will open <a href=\"https://space.tamu.edu/institute/facility/\" target=\"_blank\">a new facility<\/a> in Houston with the world’s largest indoor simulated moon and Mars landscapes. The facility is only 190 km from Jangale’s quarry. It’s still about 370,000 km from the moon, but it’s going to help Jangale get his robot quite a bit closer.<\/p>"}, {"title": "JAKA hits Teradyne Robotics back over patent dispute", "source": "Robotics Business Review", "date": "2026-09-03", "url": "https://www.therobotreport.com/jaka-hits-teradyne-robotics-back-over-patent-dispute/", "summary": "<p>JAKA is now taking legal action against Teradyne Robotics to end public dissemination of statements it considers \"false, misleading and damaging.\"<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/jaka-hits-teradyne-robotics-back-over-patent-dispute/\">JAKA hits Teradyne Robotics back over patent dispute<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "NVIDIA plans to acquire Hugging Face and keep AI development platform open", "source": "Robotics Business Review", "date": "2026-09-03", "url": "https://www.therobotreport.com/nvidia-to-acquire-hugging-face-and-keep-ai-develpment-platform-open/", "summary": "<p>NVIDIA is already a major model contributor to Hugging Face, which recently surpassed 1 million datasets.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/nvidia-to-acquire-hugging-face-and-keep-ai-develpment-platform-open/\">NVIDIA plans to acquire Hugging Face and keep AI development platform open<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Medtronic invests $700M in surgical partner Cornerstone Robotics", "source": "Robotics Business Review", "date": "2026-09-03", "url": "https://www.therobotreport.com/medtronic-invests-700m-in-surgical-partner-cornerstone-robotics/", "summary": "<p>Medtronic and Cornerstone Robotics are building a multi-port portfolio anchored by the Hugo surgical system and expanded by Sentire.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/medtronic-invests-700m-in-surgical-partner-cornerstone-robotics/\">Medtronic invests $700M in surgical partner Cornerstone Robotics<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Learn why food is physical AI’s hardest problem at RoboBusiness", "source": "Robotics Business Review", "date": "2026-09-02", "url": "https://www.therobotreport.com/learn-why-food-is-physical-ai-hardest-problem-chef-robotics-robobusiness/", "summary": "<p>Rajat Bhageria, the founder and CEO of Chef Robotics, will explore what makes food such a demanding benchmark for physical AI.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/learn-why-food-is-physical-ai-hardest-problem-chef-robotics-robobusiness/\">Learn why food is physical AI&#8217;s hardest problem at RoboBusiness<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "AIR to use Elmo Motion Control technology in uncrewed cargo aircraft", "source": "Robotics Business Review", "date": "2026-09-02", "url": "https://www.therobotreport.com/air-uses-elmo-motion-control-technology-in-uncrewed-cargo-aircraft/", "summary": "<p>The partnership brings together Elmo's compact, high-power density servo drives and AIR's electric aviation design.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/air-uses-elmo-motion-control-technology-in-uncrewed-cargo-aircraft/\">AIR to use Elmo Motion Control technology in uncrewed cargo aircraft<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "NexCOBOT discusses physical AI market hurdles and acceleration", "source": "Robotics Business Review", "date": "2026-09-02", "url": "https://www.therobotreport.com/nexcobot-discusses-physical-ai-market-hurdles-and-acceleration/", "summary": "<p>NexCOBOT, which provides functional safety and motion controllers, discusses how physical AI benefits from 'Big Tech' and where it will grow.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/nexcobot-discusses-physical-ai-market-hurdles-and-acceleration/\">NexCOBOT discusses physical AI market hurdles and acceleration<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "The Missing Layer in Robot Safety Assurance", "source": "Robotics Business Review", "date": "2026-09-01", "url": "https://www.therobotreport.com/the-missing-layer-in-robot-safety-assurance/", "summary": "<p>Why robot safety assurance must account for attacks that can change how a machine sees, decides, and acts.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/the-missing-layer-in-robot-safety-assurance/\">The Missing Layer in Robot Safety Assurance<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "HowToRobot and Robotics Australia Group partner on platform to encourage robot adoption", "source": "Robotics Business Review", "date": "2026-09-01", "url": "https://www.therobotreport.com/howtorobot-robotics-australia-group-partner-platform-encourage-robot-adoption/", "summary": "<p>The initiative is intended to help businesses in Australia identify automation opportunities, test them, and connect with local suppliers.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/howtorobot-robotics-australia-group-partner-platform-encourage-robot-adoption/\">HowToRobot and Robotics Australia Group partner on platform to encourage robot adoption<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "From spreadsheets to AI: Deere gives farmers new features in Operations Center, JD", "source": "The Robot Report", "date": "2026-09-01", "url": "https://www.therobotreport.com/from-spreadsheets-ai-john-deeres-new-jd-operations-center-features/", "summary": "<p>John Deere has launched JD, an AI tool that turns historical farm data into actionable insights to boost profitability.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/from-spreadsheets-ai-john-deeres-new-jd-operations-center-features/\">From spreadsheets to AI: Deere gives farmers new features in Operations Center, JD<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Learn how physical AI is being used to do real work at RoboBusiness", "source": "Robotics Business Review", "date": "2026-09-01", "url": "https://www.therobotreport.com/learn-how-physical-ai-is-being-used-to-do-real-work-at-robobusiness/", "summary": "<p>Leaders at Amazon Robotics, Teradyne Robotics, and Cobot will discuss how they're applying physical AI to robots operating in customer environments.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/learn-how-physical-ai-is-being-used-to-do-real-work-at-robobusiness/\">Learn how physical AI is being used to do real work at RoboBusiness<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Visko launches Orbis live model and closes pre-seed funding round", "source": "Robotics Business Review", "date": "2026-09-01", "url": "https://www.therobotreport.com/visko-launches-orbis-live-model-closes-pre-seed-funding-round/", "summary": "<p>Visko says Orbis streams 4K video at 24 frames per second, responds to user intervention, and sustains hour-scale generation without drift.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/visko-launches-orbis-live-model-closes-pre-seed-funding-round/\">Visko launches Orbis live model and closes pre-seed funding round<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Top 10 robotics stories of August 2026", "source": "Robotics Business Review", "date": "2026-09-01", "url": "https://www.therobotreport.com/top-10-robotics-stories-of-august-2026/", "summary": "<p>August 2026's top 10 stories included large funding rounds, updates in the humanoid robot industry, and the latest physical AI models. <\/p>\n<p>The post <a href=\"https://www.therobotreport.com/top-10-robotics-stories-of-august-2026/\">Top 10 robotics stories of August 2026<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Early bird pricing for RoboBusiness 2026 ends August 31", "source": "Robotics Business Review", "date": "2026-08-31", "url": "https://www.therobotreport.com/early-bird-pricing-for-robobusiness-2026-ends-august-31/", "summary": "<p>Early bird pricing for RoboBusiness 2026, which saves attendees $200 on full conference passes, will end Aug. 31.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/early-bird-pricing-for-robobusiness-2026-ends-august-31/\">Early bird pricing for RoboBusiness 2026 ends August 31<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Skild AI unveils S1 flagship robot foundation model", "source": "Robotics Business Review", "date": "2026-08-31", "url": "https://www.therobotreport.com/skild-ai-unveils-s1-flagship-robot-foundation-model/", "summary": "<p>Skild AI says its S1 robot foundation model enables robots to learn new tasks just by seeing a video of it being performed.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/skild-ai-unveils-s1-flagship-robot-foundation-model/\">Skild AI unveils S1 flagship robot foundation model<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "How better grippers can unlock physical AI", "source": "Robotics Business Review", "date": "2026-08-31", "url": "https://www.therobotreport.com/how-better-grippers-can-unlock-physical-ai/", "summary": "<p>Physical AI depends on smarter grippers to give robots the dexterity, sensing and adaptability needed to handle real-world tasks.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/how-better-grippers-can-unlock-physical-ai/\">How better grippers can unlock physical AI<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Reframe Systems raises $40M to scale its robotic microfactories for home building", "source": "Robotics Business Review", "date": "2026-08-31", "url": "https://www.therobotreport.com/reframe-systems-raises-40m-scale-robotic-microfactories-home-building/", "summary": "<p>Reframe Systems aims to build a network of automated microfactories near communities where homes are needed.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/reframe-systems-raises-40m-scale-robotic-microfactories-home-building/\">Reframe Systems raises $40M to scale its robotic microfactories for home building<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "The edge AI wall: Why embodied AI requires new mathematics", "source": "Robotics Business Review", "date": "2026-08-30", "url": "https://www.therobotreport.com/edge-ai-wall-why-embodied-ai-requires-new-mathematics/", "summary": "<p>Computational overload is not a bug of a specific planner, but an edge AI wall limiting physical and embodied AI.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/edge-ai-wall-why-embodied-ai-requires-new-mathematics/\">The edge AI wall: Why embodied AI requires new mathematics<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "The differences between decentralized and centralized power in swarm robotics", "source": "Robotics Business Review", "date": "2026-08-29", "url": "https://www.therobotreport.com/differences-between-decentralized-centralized-power-swarm-robotics/", "summary": "<p>A robotic swarm typically relies on centralized or decentralized power management, but a hybrid approach could offer the best of both.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/differences-between-decentralized-centralized-power-swarm-robotics/\">The differences between decentralized and centralized power in swarm robotics<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Video Friday: Meet Microduck", "source": "IEEE Spectrum Robotics", "date": "2026-08-28", "url": "https://spectrum.ieee.org/video-friday-microduck-robot", "summary": "<img src=\"https://spectrum.ieee.org/media-library/colorful-desk-robots-posed-among-books-beside-an-open-laptop-in-an-office.png?id=67687638&amp;width=1245&amp;height=700&amp;coordinates=101%2C0%2C101%2C0\" /><br /><br /><p><span>Video Friday is your weekly selection of awesome robotics videos, collected by your friends at <\/span><em>IEEE Spectrum<\/em><span> robotics. We also post a weekly calendar of upcoming robotics events for the next few months. Please <\/span><a href=\"mailto:automaton@ieee.org?subject=Robotics%20event%20suggestion%20for%20Video%20Friday\">send us your events<\/a><span> for inclusion.<\/span><\/p><h5><a href=\"https://humanoidssummit.com/\">Humanoids Summit Seoul<\/a>: 22–23 September 2026, SEOUL<\/h5><h5><a href=\"https://2026.ieee-iros.org/\">IROS 2026<\/a>: 27 September–1 October 2026, PITTSBURGH<\/h5><h5><a href=\"https://www.corl.org/\">CoRL 2026<\/a>: 9–12 November 2026, AUSTIN, TEXAS<\/h5><p>Enjoy today’s videos!<\/p><div class=\"horizontal-rule\"><\/div><div><span style=\"display: none;\"> <\/span><\/div><p class=\"rm-anchors\" id=\"ratzeygbgfu\">Nvidia just paid US $12.9 billion for the company that acquired Pollen Robotics, and this must be why.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><blockquote>Meet Microduck. 🦆 The 25-centimeter, 780-gram robot that waddles, falls, gets back up, and learns new tricks.<br /><br />Packed inside: 15 degrees of freedom, a front camera, an 8x8 lidar, two IMUs, mics, a speaker, NFC, Wi-Fi, and Bluetooth.<br /><br />Out of the box, Microduck already walks, sits, crouches, roller skates, picks up objects with its articulated beak, and recovers from falls on its own. Drive it with a game controller, plug-in accessories, and NFC tagged objects, run autonomous behaviors, or gather several Microducks for races and football. <br /><br />Software fully open source. Ready for whatever you throw at it.<\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"> <span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p><span>On pre-order for an astonishingly low $399, and ships before Christmas.<\/span><\/p><p>[ <a href=\"https://pollen-robotics.com/microduck/\">Microduck<\/a> ]<\/p><p>Thanks, Matthieu!<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"tbgy6brdxqu\">If you’ve chosen to ignore all the earlier <a href=\"https://spectrum.ieee.org/video-friday-darpa-heavy-lift-challenge\" target=\"_blank\">DARPA Lift Challenge<\/a> videos that we’ve posted, now you can get all caught up in about five minutes.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.darpa.mil/research/challenges/lift\">DARPA<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"uzv-96uhiqc\">You had me at “54-gram robot that out-jumps a kangaroo.”<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://ieeexplore.ieee.org/document/11553415\"><em>IEEE Transactions on Robotics<\/em><\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"vwen7knkzk4\">Sometimes, you just need a video like this.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><blockquote><em>Most fish-inspired robots are built for one size and one job, so scaling them up or down usually means starting from scratch. A team of engineers says it has found a way to solve that problem. They’ve unveiled ScaFi, a robot modeled on fish like cod and mackerel.<\/em><\/blockquote><p>[ <a href=\"https://engineering.nyu.edu/news/robot-grows-fish-not-machine\">New York University<\/a> ]<\/p><p>Thanks, Leah!<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"8qlvfdpz4qq\">Martin writes, “We’re a small robotics team in Czechia, Europe, building practical hardware around the <a href=\"https://spectrum.ieee.org/unitree-g1\" target=\"_blank\">Unitree G1<\/a>. Here’s a short demo of our lightweight gripper picking up a strawberry; the gripper weighs under 200 grams and is designed for simple, sensitive manipulation without adding a complex multifinger hand.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://sentiorobotix.com/gripper\">Sentio Robotix<\/a> ]<\/p><p>Thanks, Martin!<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"3kzjnb42dnm\">Hybrid visual markers that are useful for both cameras and lidar is a neat idea.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://binitshah.github.io/blog/stretch-4-autodocking/\">Hello Robot<\/a> ]<\/p><p>Thanks, Binit!<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"j_rrgxeaxfc\"><em>EmoLo brings emotion-inspired expressive locomotion to Open Duck Mini V2, a low-cost, open-source bipedal robot inspired by Disney’s BDX droids. With a single reinforcement learning policy, the robot can generate distinct walking styles associated with different emotional expressions, showing how characterful and expressive whole-body motion can be achieved on an accessible robotic platform.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://mertcookimg.github.io/emolo/\">EmoLo<\/a> ]<\/p><p>Thanks, Masato!<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"3c2s1zhuvum\">If it’s possible for a robot with a completely immobile face to look frustrated, this robot absolutely does, starting at three minutes into this video.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://elib.dlr.de/218609/\">DLR RM<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"zvumtotghu0\"><em>Noble Machines deployed its first general-purpose robots to a Fortune Global 500 industrial customer within 18 months of the company’s launch and met its first delivery milestone, made possible by its AI-driven whole-body control and industry-leading end-to-end autonomy.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.businesswire.com/news/home/20260303533339/en/Noble-Machines-Emerges-from-Stealth-Ships-and-Deploys-General-Purpose-Robots-for-Industrys-Toughest-Jobs\">Noble Machines<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"u3hru7dacvy\"><em>We’ve reduced the time it takes to go from physical prompt → robot behavior. The faster anyone can teach a robot to do something new, the easier it becomes to scale physical work.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://generalistai.com/blog/gen-1.5\">Generalist<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"3hrjrztzkni\">I know this video is mostly a gimmick, but I would totally rent a moderately heavy lift quadruped for a couple of days to help with a move.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.deeprobotics.cn/en\">DEEP Robotics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"4u52yao8g3a\">Is taking two minutes to excellently fold a shirt too long, or do we even care how long it takes, as long as it’s a robot doing it?<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://robotics.tokyo/\">Tokyo Robotics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"npovvg-8yoe\"><em>TRON 2 × Wuji Hand 2 handles TCM pharmacy work: picking, weighing, grinding, and packaging. The omnidirectional base frees the hands, while precise gripping and dual-arm force control enable midair operations.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.limxdynamics.com/en\">LimX Dynamics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"forsxxxit4i\">Person who genuinely knows things about robots, Christian Hubicki, explains everything about robots smashing into walls.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.christianhubicki.com/\">Christian Hubicki<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div>"}, {"title": "EXL acquires physical AI model developer iMerit", "source": "Robotics Business Review", "date": "2026-08-28", "url": "https://www.therobotreport.com/exl-acquires-physical-ai-model-developer-imerit/", "summary": "<p>The EXL and iMerit executives explain how their companies' combined expertise and platforms will help developers with reliable physical AI.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/exl-acquires-physical-ai-model-developer-imerit/\">EXL acquires physical AI model developer iMerit<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "How Locus Robotics is getting a grasp on one of robotics biggest challenges: manipulation", "source": "Robotics Business Review", "date": "2026-08-28", "url": "https://www.therobotreport.com/locus-getting-grasp-one-robotics-biggest-challenges-manipulation/", "summary": "<p>Locus Robotics recently acquired Nexera Robotics, which create unique soft picking technology, bolstering its manipulation capabilities.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/locus-getting-grasp-one-robotics-biggest-challenges-manipulation/\">How Locus Robotics is getting a grasp on one of robotics biggest challenges: manipulation<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "From teach and repeat to SelfPath AI: The next robotics leap", "source": "Robotics Business Review", "date": "2026-08-28", "url": "https://www.therobotreport.com/from-teach-repeat-to-selfpath-ai-next-robotics-leap/", "summary": "<p>John Black, chief technology officer at Brian Corp, shares insights on how to build trust for robotics fleets and AI.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/from-teach-repeat-to-selfpath-ai-next-robotics-leap/\">From teach and repeat to SelfPath AI: The next robotics leap<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Deere faces headwinds in Q3 update and announces Reservoir R&D partnership", "source": "Robotics Business Review", "date": "2026-08-28", "url": "https://www.therobotreport.com/deere-faces-headwinds-in-q3-update-and-announces-10m-reservoir-rd-partnership/", "summary": "<p>Deere beats Q3 expectations, raises guidance, and partners with Reservoir on a $10 million agtech AI initiative.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/deere-faces-headwinds-in-q3-update-and-announces-10m-reservoir-rd-partnership/\">Deere faces headwinds in Q3 update and announces Reservoir R&#038;D partnership<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Teradyne Robotics ramps up fight against cobot copycats", "source": "Robotics Business Review", "date": "2026-08-27", "url": "https://www.therobotreport.com/teradyne-robotics-sues-another-chinese-cobot-maker/", "summary": "<p>Teradyne Robotics sued cobot maker JAKA over alleged patent infringement, marking its second battle with a Chinese cobot company in 2026.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/teradyne-robotics-sues-another-chinese-cobot-maker/\">Teradyne Robotics ramps up fight against cobot copycats<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "NSF to invest $90M into three new technology centers, including one focused on robotics", "source": "Robotics Business Review", "date": "2026-08-27", "url": "https://www.therobotreport.com/nsf-invests-90m-three-new-technology-centers-including-one-focused-robotics/", "summary": "<p>One of the new NSF funded centers will be the Center for Human and Robot Co-Adaptation, led by The University of Texas at Austin.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/nsf-invests-90m-three-new-technology-centers-including-one-focused-robotics/\">NSF to invest $90M into three new technology centers, including one focused on robotics<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Carbon Robotics partners with iMerit to power instant in-field AI customization", "source": "Robotics Business Review", "date": "2026-08-27", "url": "https://www.therobotreport.com/carbon-robotics-partners-with-imerit-to-power-instant-in-field-ai-customization/", "summary": "<p>Carbon Robotics introduced a plant foundation AI model and tractor kit, enabling farmers to customize laser weeding.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/carbon-robotics-partners-with-imerit-to-power-instant-in-field-ai-customization/\">Carbon Robotics partners with iMerit to power instant in-field AI customization<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Bedrock Robotics’ first operator-free excavator deployments take off", "source": "Robotics Business Review", "date": "2026-08-26", "url": "https://www.therobotreport.com/bedrock-robotics-first-operator-free-excavator-deployments-take-off/", "summary": "<p>Bedrock Robotics deploys autonomous excavators to active job sites, tackling construction labor shortages with AI-powered heavy machinery.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/bedrock-robotics-first-operator-free-excavator-deployments-take-off/\">Bedrock Robotics&#8217; first operator-free excavator deployments take off<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "IDS Imaging adds Nion ToF sensor to its portfolio of 3D cameras", "source": "Robotics Business Review", "date": "2026-08-26", "url": "https://www.therobotreport.com/ids-imaging-adds-nion-tof-camera-portfolio-3d-cameras/", "summary": "<p>IDS said Nion is suitable for applications where precise 3D data is required at real-world process speeds, such as logistics and robotics. <\/p>\n<p>The post <a href=\"https://www.therobotreport.com/ids-imaging-adds-nion-tof-camera-portfolio-3d-cameras/\">IDS Imaging adds Nion ToF sensor to its portfolio of 3D cameras<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Gatik brings in $200M to continue expanding autonomous trucking operations", "source": "Robotics Business Review", "date": "2026-08-26", "url": "https://www.therobotreport.com/gatik-brings-in-200m-to-continue-expanding-autonomous-trucking-operations/", "summary": "<p>Gatik said the funding will help it expand its model built around high-frequency regional routes connecting distribution centers and stores.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/gatik-brings-in-200m-to-continue-expanding-autonomous-trucking-operations/\">Gatik brings in $200M to continue expanding autonomous trucking operations<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "AI Companion Robots Are Closing the Human Connection in Modern Homes", "source": "IEEE Spectrum Robotics", "date": "2026-08-25", "url": "https://spectrum.ieee.org/ollobot-ai-companion-robot", "summary": "<img src=\"https://spectrum.ieee.org/media-library/cute-home-robot-on-carpet-in-cozy-living-room-with-beige-sofa-and-warm-lighting.jpg?id=67154308&amp;width=1245&amp;height=700&amp;coordinates=0%2C260%2C0%2C261\" /><br /><br /><p><em>This article is brought to you by <a href=\"https://ollobot.com/\" target=\"_blank\">Ollobot<\/a>.<\/em><\/p><p>From about 2017, individuals began to truly connect with the initial wave of companion robots. These devices had personality, moved around, joked, and answered when you spoke to them. Most early companion robots, however, were still limited by simple voice-command interactions and narrow functionality. Once the novelty wore off, many ended up sitting unused on shelves. As some of those companies went out of business and turned off their servers, many owners likened it to losing a pet.<\/p><p>What Ollobot describes as “gentle intelligence” is a useful way to think about where the serious work in this category is going. Not toward more powerful assistants, but toward more present ones.<\/p><h2><a target=\"_blank\"><\/a>The problem companion robots were trying to solve<strong><\/strong><\/h2><p>Loneliness is not a niche issue. According to one <a href=\"https://pmc.ncbi.nlm.nih.gov/articles/PMC9957792/\" target=\"_blank\">study<\/a>, nearly one out of three elderly adults resides alone, meaning they do not have daily companions. <a href=\"https://pubmed.ncbi.nlm.nih.gov/20533912/\" target=\"_blank\">Research<\/a> also shows that children whose parents have migrated for work, leaving them in the care of relatives, were 2.5 times more likely to experience loneliness than children whose parents remain with them. Among working adults living alone in urban environments, similar <a href=\"https://pmc.ncbi.nlm.nih.gov/articles/PMC6530780/\" target=\"_blank\">patterns<\/a> of social isolation emerge, even if they are less visible.<\/p><p>Over the years, technology has time and again attempted to solve this problem via video calls, smart speakers, and messaging apps without much success. Those tools are geared towards communication between people that already have relationships. They do not create presence. They schedule it. That is the gap that a new generation of AI companion robots is being engineered to fill.<\/p><h2><a target=\"_blank\"><\/a>Today’s AI robots are different<strong><\/strong><\/h2><p>Today’s companion robots are not just cute and cuddly. They are designed with psychological research, clinical insight and long-term interaction models to be truly useful in real homes.<\/p><p>Three fundamental shifts define the current generation:<\/p><ol><li><strong>From reactive to proactive response. <\/strong>Older robots relied on you speaking to them, but modern robots monitor a room with cameras, microphones, and surroundings sensors to initiate interactions without your input, and they can pick up on your emotions.<\/li><li><strong>From function-oriented to emotion-oriented design.<\/strong> The original pitch for companion robots was about what they could do. The question driving the serious work now is how they make you feel, which is a harder engineering problem and a more honest framing of what the product is actually for.<\/li><li><strong>From standalone hardware to connected ecosystems.<\/strong> Leading brands are creating platforms rather than devices with software included as a built-in layer and remote access from the beginning.<\/li><\/ol><p>The <a href=\"https://www.grandviewresearch.com/industry-analysis/ai-companion-market-report?__cf_chl_f_tk=xJq0xhwCGb6n830sK3lMN.cyk2m73bms6.RauBufPho-1783406928-1.0.1.1-TsUMt2nxUgZ5nDX79zhxxVYkTv9xk2r_.E2rbXRHByA\" target=\"_blank\">global AI companion market<\/a> size was valued at US $36.8 billion in 2025 and is projected to grow from $48 billion in 2026 to $318 billion by 2033, at a compound annual growth rate of 31 percent from 2026 to 2033.<em><span><br /><\/span><\/em><\/p><h2><a target=\"_blank\"><\/a>Three household scenarios and interaction models<strong><\/strong><\/h2><p>Ollobot’s advanced AI family companion robot <a href=\"https://ollobot.com/\" target=\"_blank\"><span>OlloNi SS1<\/span><\/a> addresses a number of gaps in what existing technology offers.<\/p><p><strong>Elderly individuals living alone.<\/strong> The combination of proactive interaction, fall detection, and persistent presence addresses both safety and companionship without the social overhead of asking family members to check in more frequently.<\/p><p><strong>Children in households where parents work far from home.<\/strong> The SS1 functions as a consistent companion that already knows a child, their preferences, their moods, and their routines. The remote connection features allow parents to stay present without requiring a scheduled call, and the life recording system gives them a passive window into their child’s days that feels less clinical than a monitoring camera.<\/p><p><strong>Single professionals living alone in cities.<\/strong> The SS1 adapts to daily routines, builds up a preference model over time, and provides ambient social presence without demands.<\/p><p class=\"shortcode-media shortcode-media-rebelmouse-image\"> <img alt=\"Cute home robot with a purple cover and cartoon face displayed on its screen.\" class=\"rm-shortcode\" id=\"8d48b\" src=\"https://spectrum.ieee.org/media-library/cute-home-robot-with-a-purple-cover-and-cartoon-face-displayed-on-its-screen.jpg?id=67154351&amp;width=980\" /> <small class=\"image-media media-caption\">OlloNi SS1 adapts to daily routines over time.<\/small><small class=\"image-media media-photo-credit\">Ollobot<\/small><\/p><h2>What OlloNi SS1 is doing differently?<\/h2><p>Ollobot’s goal in building intelligent companion robots is to address the gaps in technology and capability, using innovation not to automate tasks but to fill emotional voids.<\/p><p>Much of the robotics industry has historically pursued human imitation — machines that speak, look, or behave like people. The SS1 is instead designed around familiarity and long-term coexistence rather than realism.<\/p><p>The system integrates multiple subsystems operating in parallel, including visual perception, audio processing, mobility control, and interaction management. It is equipped with a multi-chip AI 4K vision module capable of facial recognition and motion tracking. One small but revealing detail is the inclusion of a physical privacy cover for the camera — a mechanical solution to concerns that software settings alone may not fully resolve.<\/p><p class=\"shortcode-media shortcode-media-rebelmouse-image\"> <img alt=\"Person playing with a red plush robot toy that has a glowing digital face and eyes\" class=\"rm-shortcode\" id=\"daa03\" src=\"https://spectrum.ieee.org/media-library/person-playing-with-a-red-plush-robot-toy-that-has-a-glowing-digital-face-and-eyes.jpg?id=67154349&amp;width=980\" /> <small class=\"image-media media-caption\">OlloNi SS1 can actively integrate into family activities, and it can autonomously move closer to capture memorable moments or reposition itself to remain engaged in ongoing interactions.<\/small><small class=\"image-media media-photo-credit\">Ollobot<\/small><\/p><p><span>The robot supports advanced mobility across multiple indoor surfaces, including wooden floors, ceramic tiles, and low-pile carpets, with slope climbing capability up to 3.5 degrees. Rather than remaining in a fixed location, it can move naturally throughout the home to stay close to household members as daily activities unfold. <\/span><\/p><p><span>For example, the OlloNi SS1 may greet family members when they arrive home, follow an older adult from the living room to the kitchen while continuing a conversation, remind a child to take a study break after a prolonged period of inactivity, or notice that someone appears unusually quiet and gently check in. During family activities, it can autonomously move closer to capture memorable moments or reposition itself to remain engaged in ongoing interactions.<\/span><\/p><p class=\"pull-quote\">The robot continues to evolve over time, with over-the-air updates that deliver new features, performance improvements, and AI enhancements<\/p><p>It also incorporates fall detection with optimized accuracy for safety monitoring scenarios. A 6-microphone array enables omnidirectional voice pickup with an effective voice capture range of up to 5 meters, supporting reliable wake-word detection and far-field interaction.<\/p><p>To support continuous companionship, much of the robot’s AI processing takes place directly on the device through its “heart module” architecture, with 16 GB of memory and 64 GB of local storage. This enables the system to retain household memories, recognize familiar faces, and respond with lower latency, making interactions feel more natural even during everyday routines.<\/p><p>Because companion robots are expected to remain available throughout the day rather than only during brief interactions, the SS1 is designed for extended operation, offering up to 12 hours of standby time and around 5 hours of active interaction on a single charge. This allows it to accompany users through meals, conversations, playtime, and other daily activities without frequent interruptions.<\/p><p class=\"shortcode-media shortcode-media-rebelmouse-image\"> <img alt=\"Close-up of toy robot with glowing red heart and purple fur on a beige body.\" class=\"rm-shortcode\" id=\"0261b\" src=\"https://spectrum.ieee.org/media-library/close-up-of-toy-robot-with-glowing-red-heart-and-purple-fur-on-a-beige-body.jpg?id=67154317&amp;width=980\" /> <small class=\"image-media media-caption\">To support engaging interactions, much of the robot’s AI processing takes place directly on the device through its “heart module” architecture.<\/small><small class=\"image-media media-photo-credit\">Ollobot<\/small><\/p><p><span>Like the relationships it is designed to build, the robot continues to evolve over time. Running on Android OS with over-the-air (OTA) updates, the system continuously receives new features, performance improvements, and AI enhancements, allowing its capabilities to grow alongside the household it serves.<\/span><\/p><p>The robot’s behavioral model also improves over time. Rather than reacting to isolated commands, it attempts to establish a baseline understanding of household routines and individuals. Changes in behavior — prolonged quietness, unusual inactivity, or emotional cues — become triggers for interaction.<\/p><h2>Presence instead of utility<\/h2><p>Several features in the OlloNi SS1 illustrate this emphasis on presence and continuity in its interactions.<\/p><p>The system can identify different household members, including pets, and adapt responses accordingly. Remote communication features allow family members to connect through the device without treating every interaction like a scheduled call. Environmental sensors support contextual reminders tied to weather or room conditions.<\/p><p>Its “2+1” multi-display configuration is also designed around emotional communication. Two circular side displays function as expressive “emotional eyes,” while a separate primary display handles information and structured interaction. The separation allows emotional signaling and functional communication to operate independently, creating more intuitive nonverbal interaction even when no dialogue is taking place.<\/p><p class=\"shortcode-media shortcode-media-rebelmouse-image\"> <img alt=\"Cute red robot pet in checkered shirt sits on rug in cozy, warmly lit living room\" class=\"rm-shortcode\" id=\"5f2a7\" src=\"https://spectrum.ieee.org/media-library/cute-red-robot-pet-in-checkered-shirt-sits-on-rug-in-cozy-warmly-lit-living-room.jpg?id=67154312&amp;width=980\" /> <small class=\"image-media media-caption\">The robot’s behavioral model improves over time. Rather than reacting to isolated commands, it attempts to establish a baseline understanding of household routines and individuals.<\/small><small class=\"image-media media-photo-credit\">Ollobot<\/small><\/p><p>The SS1 also includes an automated life-recording system built on facial recognition and behavioral-event detection that can capture moments such as laughter, physical closeness, or group interaction automatically. An integrated AI
