s real, and it is accelerating.<\/p><p>But there is another side to this loop, and it has been treated as a solved problem for too long. The interface between humans and machines has defaulted, for 40 years, to three input modalities: screens, buttons, and voice. Each of those assumes the user can stop, look down, and translate intent into structured commands. That assumption breaks the moment the work moves into a real environment. On a turbine. On a dock. On a sidewalk. In any setting where hands are occupied, eyes are committed, or speaking is impractical, the conventional interface stack quietly fails.<\/p><p class=\"pull-quote\">Spatial Intent Fusion is the simultaneous processing of three streams of human-centered information, namely spatial position, visual context, and gestural intent: Your body is the interface.<br /><\/p><p>The bottleneck on the human side of the loop is becoming as important as the one on the machine side. And solving it requires a different question. Not how do we make the robot more capable, but how do we let the human participate in the computing system as naturally as the robot already does.<\/p><h2>Wetour Robotics’ bet: put the human back into the computing loop<\/h2><p><a href=\"https://wetourrobotics.com/\" target=\"_blank\">Wetour Robotics<\/a> is betting that the next architectural leap in Physical AI is not about making the robot more capable. It is about making the human a first-class node in the computing network, with the same kind of low-latency, high-fidelity participation that connected devices already enjoy.<\/p><p>Wetour Robotics’ engineers frame the problem this way: a wristband that recognizes a gesture is not enough. A camera that recognizes a scene is not enough. The information a human carries about what they are about to do is distributed across multiple channels, including where their body is in space, what their eyes are attending to, and what their muscles are preparing to do, and any single channel observed in isolation is ambiguous. Reconstructing intent reliably means fusing those channels at the operating system level, with latency low enough that the loop feels closed rather than mediated.<\/p><p>This approach has a name. Wetour Robotics calls it Spatial Intent Fusion: the simultaneous processing of three streams of human-centered information, namely spatial position, visual context, and gestural intent, fused into a single real-time command for any connected physical device. It is the technical implementation behind a simpler positioning statement the company uses externally: your body is the interface.<\/p><p class=\"shortcode-media shortcode-media-rebelmouse-image\"> <img alt=\"Sleek silver rectangular electronic device labeled \\u201cORCHESTRA\\u201d on a light gray background.\" class=\"rm-shortcode\" id=\"1af08\" src=\"https://spectrum.ieee.org/media-library/sleek-silver-rectangular-electronic-device-labeled-u201corchestra-u201d-on-a-light-gray-background.png?id=66718892&amp;width=980\" /> <small class=\"image-media media-caption\">Orchestra is a portable intelligent hub running the operating system that handles sensor fusion, intent inference, command translation, and safety arbitration. The reference compute platform is NVIDIA Jetson Orin Nano Super, which provides enough on-device inference capacity to keep the entire control loop at the edge, with no cloud dependency on the critical path. <\/small><small class=\"image-media media-photo-credit\">Wetour Robotics<\/small><\/p><h2>The architecture: three layers, four engines, one loop<\/h2><p>Orchestra is not a single device but a layered platform, designed from the start to be sensor-flexible and actuator-agnostic. The architecture decomposes into three perception layers and four coordination engines.<\/p><p><strong>Orchestra<\/strong> itself is the local compute and orchestration core: a portable intelligent hub running the operating system that handles sensor fusion, intent inference, command translation, and safety arbitration. The reference compute platform is NVIDIA Jetson Orin Nano Super, which provides enough on-device inference capacity to keep the entire control loop at the edge, with no cloud dependency on the critical path. Edge inference is non-negotiable for this application. Full-chain latency from biosignal acquisition to actuator command is held under 100 milliseconds, the envelope inside which closed-loop control feels natural rather than laggy.<\/p><p><strong>VisionLink<\/strong> handles visual and spatial perception. Cameras feed into vision models that identify objects, estimate distances, and track environmental context. VisionLink is designed not as a passive recognition layer but as a real-time command generator: its outputs feed directly into Orchestra OS to be fused with biosignal data.<\/p><p><strong>Conductor<\/strong> is the biosignal pipeline. It ingests raw surface electromyographic (sEMG) data from a wrist-worn device, classifies temporal patterns into discrete gestures or continuous control signals, and outputs actuator commands. The technically interesting property of sEMG for this use case is that the signal precedes visible motion. Motor unit action potentials appear at the skin surface roughly 50 to 80 milliseconds before a finger completes the corresponding gesture. Wetour Robotics calls this property pre-motion intent sensing, and it is what allows Orchestra to anticipate user intent rather than react to it.<\/p><p>On top of the three perception layers, Orchestra OS runs four coordination engines. The <strong>Perception Engine<\/strong> ingests and normalizes raw sensor streams. The <strong>Intent Engine <\/strong>performs Spatial Intent Fusion across modalities, resolving what the user is trying to do given where they are, what they are looking at, and what their hand is signaling. The <strong>Orchestration Engine<\/strong> translates intent into device-specific command sequences for any connected actuator. The <strong>Safety Engine<\/strong> arbitrates conflicting commands, enforces operational envelopes, and gates execution against runtime safety conditions.<\/p><p class=\"shortcode-media shortcode-media-youtube\"> <span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><h2>The trade-offs we’re honest about<\/h2><p>No system that bridges the human body and the digital world is finished. Three engineering challenges remain open, and the company addresses each with a deliberate trade-off rather than a claim of having fully solved it.<\/p><p><strong>Baseline stability of sEMG under motion.<\/strong> In a stationary user, continuous gesture recognition from sEMG is reliable. Once the user is walking, climbing, or otherwise moving, motion artifacts and electrode drift degrade the signal in ways that are difficult to fully compensate for. Rather than overpromise on continuous control in dynamic settings, Orchestra defaults to a smaller set of robust discrete gestures in complex operating environments, and reserves continuous control modes for contexts where the signal-to-noise ratio supports them.<\/p><p><strong>Miniaturization of edge AI compute.<\/strong> Running the Orchestra control loop entirely at the edge requires real on-device inference, which has historically meant trading off between compute capacity, battery life, and form factor. Wetour Robotics’ approach has been a compact carrier board paired with a thermal design and a battery module sized for all-day wearability. The result is a hub that travels with the user rather than tethering them to a desk, and that performs the full perception-to-actuation loop without offloading to the cloud.<\/p><p><strong>Heterogeneity of third-party device protocols.<\/strong> The actuator side of the loop is a fragmented landscape. Different manufacturers expose different command interfaces, different communication stacks, and different safety conventions, and a Physical AI operating system has to integrate with all of them. Wetour Robotics uses an AI-agent layer to negotiate connection and protocol translation adaptively, so that Orchestra OS can ingest data from a wide range of devices, run them through neural network models that infer human intent, and emit the right command on the right protocol for the device on the other end.<\/p><h2>Why this matters, and why it helps the rest of the field<\/h2><p>The history of computing is a history of interface revolutions. Command lines gave way to graphical user interfaces, which gave way to touch, which gave way to voice. Each transition expanded who could participate in the system and what they could do with it. The next transition is not about a new screen or a new microphone. It is about treating the human body itself as a participant in the computing network, capable of contributing intent at the same speed and fidelity that any other connected node can.<\/p><p class=\"pull-quote\">The history of computing is a history of interface revolutions. The next transition is not about a new screen or a new microphone — it is about treating the human body itself as a participant in the computing network.<\/p><p>This path is not a competitor to the work being done on humanoid robots, foundation models for embodied AI, and dexterous manipulation. It is the missing complement to that work. The hardest open problem for humanoid systems is the data: every natural interaction between a human and the physical world is a potential training signal, and most of those interactions are currently invisible to any computing system. As more humans become first-class nodes in the loop, those interactions become observable, structured, and ultimately useful for training the next generation of embodied AI, including the humanoid robots being developed today.<\/p><p>In other words: putting the human back into the computing loop is not just about better interfaces for individual users. It is about generating the kind of grounded, in-the-wild human-machine interaction data that the broader Physical AI ecosystem will need to keep advancing. The robot side and the human side of the loop are not two competing futures. They are two halves of the same one.<\/p><p>That is what Wetour Robotics means when it says: <em>Your body is the interface.<\/em><\/p><p>Learn more at <a href=\"https://wetourrobotics.com/\" target=\"_blank\">wetourrobotics.com<\/a>.<\/p>"}, {"title": "Will Robotics Have a ChatGPT Moment?", "source": "IEEE Spectrum Robotics", "date": "2026-05-20", "url": "https://spectrum.ieee.org/robotics-ai-breakthrough", "summary": "<img src=\"https://spectrum.ieee.org/media-library/a-collection-of-5-robots-against-colored-backgrounds.jpg?id=66734221&amp;width=1245&amp;height=700&amp;coordinates=0%2C88%2C0%2C88\" /><br /><br /><p>Over the next few decades, billions of autonomous, AI-powered robots will work alongside people in factories, perform tedious tasks in warehouses, care for the elderly, <a href=\"https://spectrum.ieee.org/collections/darpa-subterranean-challenge/\" target=\"_blank\">assist in unsafe disaster areas<\/a>, deliver packages and food to our doorsteps, and eventually help out in our homes. Some will look like us, and many won’t. What is certain is that regardless of form factor, robots will all rely heavily on AI in order to deliver real-world value.<\/p><div class=\"rm-embed embed-media\"><\/div><p><span>In 2025, total investments in robotics companies reached <\/span><a href=\"https://www.cbinsights.com/research/report/venture-trends-2025/\" target=\"_blank\">a record US $40.7 billion, accounting for 9 percent of all venture funding<\/a><span>. The multibillion dollar question therefore is this: What will it take for AI-powered robots to begin to have a serious economic impact? Many of today’s robotics and AI companies are making bold claims, such as that humanoid robots will <\/span><a href=\"https://www.1x.tech/\" target=\"_blank\">soon be coming into our homes<\/a><span>, but there’s still a big gap between promise and reality.<\/span><\/p><p><span><\/span><span>The promise of robots that live and work alongside us has been the stuff of science fiction for a very long time. And while many programmers have tried to make that promise a reality, the physical world is just too complicated for traditional computer programs to handle the endless complexity it presents. Thanks to AI, robots are no longer being programmed—instead, they learn to operate in the real world. With enough practice, they can learn to perceive and understand the world around them, reason about that world, and use that reason and understanding to perform tasks that are useful, reliable, and safe.<\/span><\/p><p>The two of us have worked at the forefront of AI and robotics for the last decade, as a <a href=\"https://engineering.oregonstate.edu/people/jonathan-hurst\" target=\"_blank\">Professor in Robotics at Oregon State University<\/a> and <a href=\"https://www.agilityrobotics.com/about/leadership\" target=\"_blank\">Co-Founder of Agility Robotics<\/a>, and as <a href=\"https://www.linkedin.com/in/hanspeter/\" rel=\"noopener noreferrer\" target=\"_blank\">former CEO<\/a> of the <a href=\"https://everydayrobots.ai/\" rel=\"noopener noreferrer\" target=\"_blank\">Everyday Robots moonshot at Google X<\/a>. Our experience deploying AI-powered robots in real-world settings has given us a perspective on where AI can be used to great benefit in complex robotic systems in the near term and where we are still on the frontier of science fiction. We believe AI will enable an inflection point in robotics advances, but that it will be through the well-engineered application of coordinated systems of different AI tools rather than a single ChatGPT-style breakthrough.<\/p><p>As the excitement around AI is matched only by the uncertainty of what will be possible, here are five hard truths that will define AI in robotics.<\/p><h2>1. The YouTube-to-Reality Gap Is Real<\/h2><p>For years, we have been seeing videos on YouTube with humanoid robots performing amazing moves on everything from a dance floor to an obstacle course. The inside knowledge in robotics is to “never trust a YouTube robot video.” The gap between real robots that can perform real work in unstructured human environments and carefully scripted and edited robot performances remains significant. The latest performance to get a lot of attention was a <a href=\"https://www.youtube.com/watch?v=mUmlv814aJo\" rel=\"noopener noreferrer\" target=\"_blank\">martial arts show<\/a> featuring Unitree humanoid robots performing with children at the Chinese 2026 Spring Festival Gala. While impressive, this falls into a long lineage of tightly scripted robotic performances, where everything has been carefully choreographed and planned in advance. The low-level controls, synchronization, and choreography were stunning, yet the Spring Gala robot performance showed a level of autonomy and intelligence much closer to industrial robots building cars in a factory than something that will show up in your living room any time soon. <\/p><p class=\"shortcode-media shortcode-media-youtube\"> <span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span> <\/p><p><span>Seeing these kinds of demos nevertheless raises questions about where robotics really is. If robots can perform kung fu moves and do backflips and dance, why aren’t they also showing up on factory floors yet? And why can’t they do the dishes in my home after dinner? The simple answer is this: Making AI-powered robots capable of performing general tasks in varied human environments is still <\/span><em><em>really<\/em><\/em><span> hard. While impressive technological feats like those at the Spring Festival may make it look like we could be very close, the use of AI in these demos is only for low-level motor control (to keep the robots from falling over) and therefore is only a small part of the solution for robots to be general purpose in the real, unstructured spaces where we humans live and work.<\/span><\/p><h2>2. Data Is An Unsolved Challenge<\/h2><p>Large Language Models (LLMs) like OpenAI’s ChatGPT and Anthropic’s Claude were initially trained on an internet-scale database of text. The world woke up one day in late 2022 to ChatGPT demonstrating that AI computers could suddenly “speak” to us in prose or verse and about seemingly any topic. LLMs have turned out to generalize well and are now able to take multimodal input (text, images, video) and produce multimodal output. Importantly, the corpus of training data was both enormous and human-generated, which are characteristics that form the gold standard for AI training.<\/p><p class=\"shortcode-media shortcode-media-rebelmouse-image rm-float-left rm-resized-container rm-resized-container-25\" style=\"float: left;\"> <img alt=\"A series of four images, including robots working in a contained factory space, in an open indoor factory, outdoors in the real world delivering a package, and working with a human to move a couch in an apartment.\" class=\"rm-shortcode\" id=\"a0903\" src=\"https://spectrum.ieee.org/media-library/a-series-of-four-images-including-robots-working-in-a-contained-factory-space-in-an-open-indoor-factory-outdoors-in-the-real.jpg?id=66734272&amp;width=980\" /> <small class=\"image-media media-caption\">The fastest path to robots as part of everyday life may emerge through a range of robot forms performing increasingly sophisticated applications and employing a range of AI tools.<\/small><small class=\"image-media media-photo-credit\">Agility Robotics<\/small><\/p><p>Giving AI a body (in the form of a robot), so that it can engage with people in the physical world, continues to be a very difficult and broadly unsolved problem. AI models for general-purpose robotics must simultaneously satisfy multiple, often conflicting, physical, geometric, and temporal limitations while operating in unstructured, dynamic environments. In order to generalize, robot models need to be trained on data gathered in a high-dimensional configuration space, where “dimensions” represent text, lighting conditions, degrees of freedom, joint limits, velocities, force, and safety boundaries, just to mention a few. Importantly, this must be <em><em>good<\/em><\/em> data—it must contain many examples from what amounts to an infinite number of possible configurations in the physical world.<\/p><p>Since there are very few existing sources of data like this, approaches like teleoperation, video analysis, motion capture of humans, and self-exploration in simulation and in the real world are all seen as important ways to collect data. It’s a herculean task. For example, at Everyday Robots at Google X, we ran 240 million robot instances in our simulator over the course of 2022 to collect training data, mostly to train a trash-sorting model. Similar amounts of data will be needed for every skill to get to a similar level of capability, which is not yet human level.<\/p><h2>3. There Will Be No Single Robot AI<\/h2><p>We are far away from a moment where a single AI model might allow general-purpose robots to live and work alongside us. <\/p><p>General-purpose robots can have wheels or legs. They can have one, two, three, or more arms. Some have propellers and can fly, while others may be designed to operate under water. Some will drive on busy roads. The physical world is infinitely varied and complex. And then there are all the people and other animals that will be surrounding the robots. How do you train a model to operate a robot safely and reliably in all of these settings? The simple answer is: You don’t. At least not for quite some time.<\/p><p>We believe the winning AI architecture leading to the next big breakthroughs in general-purpose robotics will be “agentic AI” for robots, which are high-level coordinating models that can reason, plan, use tools, and learn from outcomes to execute complex tasks with limited supervision. Agentic, high-level models running on robots will invoke a system of specialized ones for different types of tasks. We will likely soon see multiple robots collaborating and coordinating with each other through their onboard agentic AI models.<\/p><p>AI tools are unlocking new and powerful capabilities in robotics, which in turn will enable new solutions and new markets. It’s encouraging to see these new models being made broadly available, some even as open-source solutions. This availability is akin to what happened with the internet: Real progress occurred when it became ubiquitous. We anticipate an inevitable democratization of complex behaviors in robotics with wide access to these AI tools and technologies.<\/p><h2>4. Hardware Is Still Very Hard<\/h2><p>Robots are complex systems with many parts that all need to work together with great precision. For a robot to be useful and safe, every part of it must be coordinated, from its perception systems to the computer controlling it, all the way down to its individual actuators.<\/p><p>Actuators—that is, the motors and gears—are a good example of an important part of the robot where what got us here won’t get us there. The actuators used at scale by most industrial robots will not work for robots that will operate in human environments. If these robots accidentally collide with an obstacle, the resulting impacts are harsh, forces are high, and things break. Humans don’t move in this way. We are far more compliant in how we interact with the world, and we’re constantly making contact with our environment and using that contact to help us accomplish things. <\/p><p>Consider the challenge of inserting a key in a lock: Humans typically don’t do this by aligning the key perfectly with the keyhole. Instead, we just feel for the edge of the keyhole and jiggle the key in. Robots need to be able to operate in novel ways to achieve comparable capabilities by using a new class of actuators that are sensitive to force and able to have a compliant interaction with the environment. While these kinds of actuators do exist, they are not yet generally available at scale for robot systems designed to operate around people.<\/p><h2>5. Real Value Comes From “Easy” Tasks<\/h2><p>There’s a big difference between tasks that look impressive and real-world tasks that provide value. Robotics is a perfect example of <a href=\"https://en.wikipedia.org/wiki/Moravec%27s_paradox\" target=\"_blank\">Moravec’s paradox<\/a>, which states that tasks that are hard for humans are easy for computers (like multiplying two big numbers), and tasks easy for humans (like a toddler’s movements) are extremely difficult for computers and robots.<\/p><p>Serving customers is an unforgiving reality check, because customers only care about solving the real problems they have. If we are to deploy AI-based robot solutions, they must outperform the way things are currently done while demonstrating reliable performance metrics and safety. Agility Robotics’ early work to deploy our humanoid robot Digit in customer locations led to the realization that our first obstacle was safety: Robots that balance and manipulate objects in human spaces bring new types of risk to the workplace. In the first <a href=\"https://www.youtube.com/watch?v=AJpTpUqjgrY\" target=\"_blank\">humanoid deployments<\/a>, physical barriers were necessary, and Agility kicked off a multi-year engineering effort to solve the safety challenge, touching nearly every aspect of robot design and relying heavily on new AI-based approaches to human detection and behavior control.<\/p><p class=\"shortcode-media shortcode-media-youtube\"> <span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span> <\/p><p><a href=\"https://everydayrobots.ai/vision\" target=\"_blank\">Everyday Robots<\/a> at Google deployed robots in 2019 that worked autonomously in office buildings doing chores like cleaning cafe tables and sorting trash. We quickly learned how “messy” and difficult the real world is for a robot. This experience informed the architecture and deployment of our AI systems while also gathering real-world data that could be combined with simulation data for training and improving models.<\/p><p>This focus on creating a product to meet specific customer needs and deploying robots in real-world settings is the only way to inform the structure of the AI tools and infrastructure for near-term utility on a path towards long-term broader capability and generality. There will be no “aha” moment, no silver bullet algorithm, and no volume of data sufficient to produce a general-purpose robot without extensive real-world experience. <\/p><h2>AI Robots Are Coming, One Step at a Time<\/h2>As we look to the future, there is no doubt that the world is bringing AI into the physical world through robots. We are at the beginning of a “<a href=\"https://spectrum.ieee.org/is-a-cambrian-explosion-coming-for-robotics\" target=\"_self\">Cambrian explosion<\/a>“ of useful, intelligent machines. We believe AI is not one tool, but a huge frontier of technical approaches that is unlocking new capabilities so powerful, they will define our economy moving forward. This will happen not in one single definitive moment, but as an ongoing set of small and large breakthroughs, where AI-driven robots begin to provide real value in a few tasks, and then a few more, with impacts unfolding across numerous $100 billion-plus markets that will dramatically improve the quality of our lives."}], "roboticsNews": [{"title": "HII signs up to $900M agreement with Path Robotics, GrayMatter Robotics", "source": "Robotics Business Review", "date": "2026-08-06", "url": "https://www.therobotreport.com/hii-signs-up-to-900m-agreement-with-path-robotics-graymatter-robotics/", "summary": "<p>The latest agreement expands HII's HYPER Program, which Path Robotics and GrayMatter Robotics joined earlier this year.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/hii-signs-up-to-900m-agreement-with-path-robotics-graymatter-robotics/\">HII signs up to $900M agreement with Path Robotics, GrayMatter Robotics<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Report looks at advances in autonomous mobile robots", "source": "Robotics Business Review", "date": "2026-08-06", "url": "https://www.therobotreport.com/report-looks-at-advances-in-autonomous-mobile-robots/", "summary": "<p>A download looks at examples of advances in autonomous mobile robots in material handling and automated storage applications.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/report-looks-at-advances-in-autonomous-mobile-robots/\">Report looks at advances in autonomous mobile robots<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "How Robin, the robotic companion, keeps patients calm during hospital visits", "source": "Robotics Business Review", "date": "2026-08-06", "url": "https://www.therobotreport.com/how-robin-robotic-companion-keeps-patients-calm-during-hospital-visits/", "summary": "<p>Robin is deployed across 30 different health systems, and Expper has plans to deploy 10 more in different states. <\/p>\n<p>The post <a href=\"https://www.therobotreport.com/how-robin-robotic-companion-keeps-patients-calm-during-hospital-visits/\">How Robin, the robotic companion, keeps patients calm during hospital visits<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Into the Omniverse: How Open World Models Push the Frontier of Physical AI", "source": "NVIDIA Robotics", "date": "2026-08-06", "url": "https://blogs.nvidia.com/blog/open-world-models-physical-ai/", "summary": "In July, NVIDIA joined more than 200 companies and organizations in signing “Open Weights and American AI Leadership,” an open letter arguing that AI leadership will be measured not by any single frontier model but by whether an open ecosystem reaches every sector."}, {"title": "Moove raises $250M to build infrastructure for autonomous vehicles", "source": "Robotics Business Review", "date": "2026-08-05", "url": "https://www.therobotreport.com/moove-raises-250m-to-build-infrastructure-for-autonomous-vehicles/", "summary": "<p>The funding will support Moove's expansion of its autonomous fleet ownership and robotics-first depot infrastructure “Nests.”<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/moove-raises-250m-to-build-infrastructure-for-autonomous-vehicles/\">Moove raises $250M to build infrastructure for autonomous vehicles<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Why perception is the key to scaling industrial autonomy", "source": "Robotics Business Review", "date": "2026-08-05", "url": "https://www.therobotreport.com/why-perception-is-the-key-to-scaling-industrial-autonomy/", "summary": "<p>Autonomy is no longer just about robotic motor skills. It encompasses machine awareness, dynamic decision-making, multi-vehicle coordination, and spatial precision at a large scale. <\/p>\n<p>The post <a href=\"https://www.therobotreport.com/why-perception-is-the-key-to-scaling-industrial-autonomy/\">Why perception is the key to scaling industrial autonomy<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "University of Florida opens new robotics lab dedicated to industrialized construction", "source": "Robotics Business Review", "date": "2026-08-05", "url": "https://www.therobotreport.com/university-of-florida-opens-new-robotics-lab-dedicated-to-industrialized-construction/", "summary": "<p>Fueled by Autodesk, UF opened a robotics lab for industrialized construction to fight housing shortages and labor declines.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/university-of-florida-opens-new-robotics-lab-dedicated-to-industrialized-construction/\">University of Florida opens new robotics lab dedicated to industrialized construction<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Avnet and Weston Robot partner to launch edge AI inspection platform", "source": "Robotics Business Review", "date": "2026-08-05", "url": "https://www.therobotreport.com/avnet-and-weston-robot-partner-to-launch-edge-ai-inspection-platform/", "summary": "<p>Avnet and Weston Robot have partnered to launch an AI-powered autonomous inspection platform for complex industrial environments.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/avnet-and-weston-robot-partner-to-launch-edge-ai-inspection-platform/\">Avnet and Weston Robot partner to launch edge AI inspection platform<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "GAM Enterprises to produce Schaeffler’s PSC gear reducers", "source": "Robotics Business Review", "date": "2026-08-05", "url": "https://www.therobotreport.com/gam-enterprises-to-produce-schaefflers-psc-gear-reducers/", "summary": "<p>Acquiring the IP from this core supplier allows GAM to vertically integrate its supply chain and expand its manufacturing capabilities.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/gam-enterprises-to-produce-schaefflers-psc-gear-reducers/\">GAM Enterprises to produce Schaeffler&#8217;s PSC gear reducers<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "What Robotics Companies Think About the U.S. Foreign Robot Ban", "source": "IEEE Spectrum Robotics", "date": "2026-08-04", "url": "https://spectrum.ieee.org/fcc-covered-list-mobile-robots", "summary": "<img src=\"https://spectrum.ieee.org/media-library/photo-collage-of-humanoid-quadruped-and-unmanned-ground-vehicle-robots.jpg?id=67563239&amp;width=1200&amp;height=800&amp;coordinates=0%2C208%2C0%2C209\" /><br /><br /><p>The U.S. Federal Communications Commission (FCC) “Covered List,” originally published in 2021, identifies communications equipment and services that it says pose a threat to national security. <span>On 28 July, the FCC added <\/span><a href=\"https://www.fcc.gov/document/fcc-adds-foreign-produced-power-inverters-and-robots-covered-list-0\" target=\"_blank\">mobile, communicating robots weighing more than 2 kilograms and power inverters<\/a><span> commonly used in solar panels to the list, meaning that new products from any foreign country in these categories are no longer eligible for import.<\/span><\/p><p>The move is a Department of Defense–driven expansion of scattered federal efforts to <a href=\"https://spectrum.ieee.org/chinese-robots-us-ban\" target=\"_self\">further limit U.S. exposure<\/a> to potentially sensitive Chinese technology, but it may impose major changes on the robotics industry in allied countries, too. <\/p><p>The FCC’s <a href=\"https://www.fcc.gov/sites/default/files/robots-nsd.pdf\" target=\"_blank\">announcement<\/a> says:<\/p><blockquote>All foreign-produced advanced robotic devices pose an unacceptable risk to the national security of the United States and to the safety and security of U.S. persons…unless the [Department of Defense determines that] a given foreign-produced advanced robotic device, or a class of such devices, does not pose such risks.<\/blockquote><p>There are two <a href=\"https://docs.fcc.gov/public/attachments/DA-26-786A1.pdf\" target=\"_blank\">important definitions<\/a> here. The first is what an “advanced robotic device” is, and the second is what “unacceptable risk” means. Drones already went through their own round of this sort of regulation, so they’re exempt from this particular restriction, as are connected vehicles and medical devices. As far as the FCC is concerned, “advanced robotic devices” are <em><em>mobile<\/em><\/em> systems that incorporate on-board sensing and communications and have some amount of autonomy. There are a couple of loopholes, including systems weighing under 2 kilograms and any system that communicates at less than 200 kilobits per second, which opens up some creative possibilities. It’s important to note that this applies to <em><em>new<\/em><\/em> devices; those already certified are not restricted for sale or use.<\/p><p>As to the risks, the U.S. government says that foreign advanced robotic devices represent “a cybersecurity risk that threatens the security of critical infrastructure and thus the safety and security of U.S. persons.” There seem to be two main points to the justification, <a href=\"https://docs.fcc.gov/public/attachments/DA-26-786A1.pdf\" target=\"_blank\">found in Appendix C<\/a>. The first is that mobile robots are important to both the economy and the military, so the United States needs its own supply chain and industrial base rather than relying on foreign manufacturers. And second, mobile robots monitor critical infrastructure in sensitive locations, making them a security risk.<\/p><h2>The Country That Must Not Be Named<\/h2><p>As part of <a href=\"https://www.fcc.gov/sites/default/files/robots-nsd.pdf\" rel=\"noopener noreferrer\" target=\"_blank\">its justification<\/a> for why foreign robots are a security risk, the DOD cites <a href=\"https://spectrum.ieee.org/unitree-robot-exploit\" target=\"_self\"><em><em>IEEE Spectrum’s<\/em><\/em> article on a critical vulnerability in robots from Unitree<\/a>, based in Hangzhou, China, along with several other news articles and reports about Chinese robotics. And despite the FCC <a href=\"https://www.fcc.gov/covered-list-faqs-robots-inverters\" rel=\"noopener noreferrer\" target=\"_blank\">swearing<\/a> up and down that this action is “country neutral” and “not targeted at any country or countries,” U.S. national security sources told <em><em>Spectrum<\/em><\/em> that the perceived threat is obviously China. That’s how China feels about it, too, per a Chinese Ministry of Commerce 29 July <a href=\"https://za.china-embassy.gov.cn/eng/fyrth/202607/t20260729_11994715.htm\" rel=\"noopener noreferrer\" target=\"_blank\">press conference<\/a> (<a href=\"https://sinocism.notion.site/MOFCOM-Spokesperson-Answers-Reporters-Questions-on-the-US-FCC-Adding-Foreign-Power-Inverters-and-Ad-3ad84ece41d781ca8e46d4ec2a45c96c\" rel=\"noopener noreferrer\" target=\"_blank\">translation of the first quote here<\/a>):<\/p><blockquote>On the surface, the FCC’s measures fly the banner of “non-discrimination,” but in substance they discriminate against and suppress Chinese enterprises and products…<br /><br />China firmly opposes the U.S. overstretching the concept of national security and going after Chinese companies. Protectionism does not make the U.S. more competitive and will only hurt the interests of U.S. companies and consumers. China will continue to do what is necessary to firmly defend the legitimate and lawful rights and interests of Chinese companies.<\/blockquote><p>It’s unclear what China is going to do about this—but how about the rest of the world? How can foreign companies that make advanced robotic devices get them cleared for FCC authorization? Among <a href=\"https://www.fcc.gov/sites/default/files/robots-ca.pdf\" rel=\"noopener noreferrer\" target=\"_blank\">many, many other things<\/a>, you’ll need to provide “a detailed, time-bound plan to establish or expand manufacturing in the United States for the advanced robotic device.” <\/p><p>Because China also produces a large fraction of robot components, even for robots assembled in the United States, it will have strong leverage in any related negotiations until U.S. robotics companies further diversify their supply chains.<\/p><p class=\"ieee-inbody-related\">RELATED: <a href=\"https://spectrum.ieee.org/chinese-robots-us-ban\" target=\"_self\">Proposed Chinese Robot Ban Is Latest U.S. Tech Sovereignty Move<\/a><\/p><p>Applicants must also submit their applications to the DOD and FCC by 1 January 2028, which is unfortunate for anyone who wants to develop an advanced robotic device after that point. <\/p><h2>Robotics Industry Reactions<\/h2><p>This is all very new, and reactions from the robotics community have been mixed. <\/p><p>Some American robotics companies may benefit in the local market from the newfound lack of competition in the commercial market. <a href=\"https://www.linkedin.com/in/brendanschulman/\" rel=\"noopener noreferrer\" target=\"_blank\">Brendan Schulman,<\/a> <a href=\"https://bostondynamics.com/\" rel=\"noopener noreferrer\" target=\"_blank\">Boston Dynamics<\/a>’ vice president of policy, wrote an enthusiastic <a href=\"https://www.linkedin.com/posts/brendanschulman_after-months-of-increasing-calls-from-industry-activity-7488070496488435712-8LE-?utm_source=share&amp;utm_medium=member_desktop&amp;rcm=ACoAAADzTX0B_X82L2FL9GS1Qib6fNoMXJQlPzA\" rel=\"noopener noreferrer\" target=\"_blank\">endorsement of the ban on LinkedIn<\/a>: “I sense that this is just the first round in a series of policies that will define the success and growth of the industry for decades to come.” On the other hand, third-country buyers <a href=\"https://www.linkedin.com/feed/update/urn:li:activity:7488293386664292355/\" rel=\"noopener noreferrer\" target=\"_blank\">may just stick to Chinese products<\/a>, as they generally have for drones and electric cars. <\/p><p>But not all companies expect major changes from the new regulation. American customers “need to know they can audit the technology, get support quickly, and keep the system operating without depending on a fragile overseas supply chain,” <a href=\"https://www.linkedin.com/in/nicolaus-radford/\" rel=\"noopener noreferrer\" target=\"_blank\">Nic Radford<\/a>, the CEO of the U.S. humanoid robotics company <a href=\"https://spectrum.ieee.org/persona-ai-radford-pratt/\" target=\"_self\">Persona<\/a>, tells <em><em>IEEE Spectrum<\/em><\/em>. In other words, he figures some customers wouldn’t have wanted Chinese humanoids anyway.<\/p><p><a href=\"https://www.linkedin.com/in/phfrey/\" rel=\"noopener noreferrer\" target=\"_blank\">Philipp Frey<\/a>, vice president of strategy for the Swiss quadruped company <a href=\"https://www.anybotics.com/\" rel=\"noopener noreferrer\" target=\"_blank\">ANYbotics<\/a>, agrees. He says their enterprise customers in the United States “increasingly evaluate robots on long-term reliability, cybersecurity, software capability, safety certification, serviceability, and ecosystem integration, not on hardware cost alone.” <\/p><p>ANYbotics also plans to apply for conditional approval of future products, Frey says. That will involve a national-security review by the DOD or the Department of Homeland Security, disclosing company beneficial ownership, supply-chain risks, and declaring a plan for establishing a significant manufacturing presence in the United States.<\/p><p><a href=\"https://www.linkedin.com/in/gavin-kenneally-321a3833/\" target=\"_blank\">Gavin Kenneally<\/a>, CEO of the U.S. quadruped company <a href=\"https://www.ghostrobotics.io/\" target=\"_blank\">Ghost Robotics<\/a>, is more explicit about the risks that Chinese robot strategy poses to the United States. “Active and purposeful spyware is deployed inside the U.S. on Chinese robots. Examples of predatory pricing abound. And this isn’t just a competition between U.S. and Chinese robotics companies; it’s between private U.S. companies and China’s coordinated national strategy,” Kenneally tells <em><em>Spectrum<\/em><\/em>. “If today’s announcement encourages stronger cybersecurity and a more level competitive environment, that’s good for customers and good for the robotics industry.”<\/p><p>So is an industry-wide ban the best way to guard against threats? American approaches to Chinese technology security risks have been “ad hoc and fragmented,” wrote the Brookings Institution sociologist <a href=\"https://www.brookings.edu/people/kyle-chan/\" rel=\"noopener noreferrer\" target=\"_blank\">Kyle Chan<\/a> in a <a href=\"https://www.brookings.edu/articles/a-new-risk-framework-for-chinese-technology-products-and-investments/\" rel=\"noopener noreferrer\" target=\"_blank\">report<\/a> published 9 July. Chan called for the Bureau of Industry and Security, part of the Department of Commerce, to centralize federal information gathering and decision-making on how to handle risky foreign devices. He also called for better public input mechanisms for these issues, and a continuous, proportionate process that tightened or relaxed targeted import restrictions in response to well-defined risks. <\/p><p>That would allow American industry to continue benefiting from partnerships with Chinese manufacturers in less sensitive links of the supply chain, Chan argues. Those links will evolve over time, requiring continued assessment, but without those partnerships, crude bans “could make it more difficult for American startups and researchers to develop new software and end up slowing innovation across the U.S. robotics ecosystem,” he writes.<\/p>"}, {"title": "Humanoids won’t scale on factory floors until costs drop", "source": "Robotics Business Review", "date": "2026-08-04", "url": "https://www.therobotreport.com/humanoids-wont-scale-on-factory-floors-until-costs-drop/", "summary": "<p>The race to commercialize humanoids is on. What’s left to prove is that humanoid robots can beat the economics of the automation manufacturers are already running.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/humanoids-wont-scale-on-factory-floors-until-costs-drop/\">Humanoids won’t scale on factory floors until costs drop<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Zoox unveils production-ready robotaxi for U.S. expansion", "source": "Robotics Business Review", "date": "2026-08-04", "url": "https://www.therobotreport.com/zoox-unveils-production-ready-robotaxi-for-u-s-expansion/", "summary": "<p>Amazon subsidiary Zoox unveiled its final production-ready robotaxi design and expanded testing following a subtle redesign to improve rider comfort.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/zoox-unveils-production-ready-robotaxi-for-u-s-expansion/\">Zoox unveils production-ready robotaxi for U.S. expansion<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "U.S. Navy picks Blue Water Autonomy to use autonomous vessels for deep ocean surveys", "source": "Robotics Business Review", "date": "2026-08-04", "url": "https://www.therobotreport.com/u-s-navy-picks-blue-water-autonomy-to-use-autonomous-vessels-for-deep-ocean-surveys/", "summary": "<p>Blue Water Autonomy creates unmanned ships that can operate autonomously on the open ocean for months a time.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/u-s-navy-picks-blue-water-autonomy-to-use-autonomous-vessels-for-deep-ocean-surveys/\">U.S. Navy picks Blue Water Autonomy to use autonomous vessels for deep ocean surveys<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Reimagine Robotics emerges from stealth with robots that ‘learn on the job’", "source": "Robotics Business Review", "date": "2026-08-03", "url": "https://www.therobotreport.com/reimagine-robotics-emerges-stealth-with-robotslearn-on-the-job/", "summary": "<p>Reimagine Robotics, founded by former Google DeepMind Applied Robotics leaders, is developing systems that do not require specialized programmers.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/reimagine-robotics-emerges-stealth-with-robotslearn-on-the-job/\">Reimagine Robotics emerges from stealth with robots that &#8216;learn on the job&#8217;<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Walden Robotics Partners With Toyota on Practical Humanoids", "source": "IEEE Spectrum Robotics", "date": "2026-08-03", "url": "https://spectrum.ieee.org/humanoid-robots-walden-robotics-toyota", "summary": "<img src=\"https://spectrum.ieee.org/media-library/humanoid-orange-and-white-robot-using-two-finger-gripper-hands-to-work-with-metal-tool-components.jpg?id=67568024&amp;width=1200&amp;height=800&amp;coordinates=62%2C0%2C63%2C0\" /><br /><br /><p>For a while there, it seemed as though robotics as a whole was stuck in a <a href=\"https://spectrum.ieee.org/top-robotics-stories-2024\" target=\"_self\">mad rush<\/a> towards building <a href=\"https://spectrum.ieee.org/topic/robotics/humanoid-robots/\" target=\"_self\">humanoid robots<\/a> mostly because it was very possible (and very lucrative) to do so, even without near-term goals that were necessarily realistic. Some of the magic of those first couple of years of the humanoid explosion has stuck around, but there’s also been an industry-wide sobering leading to <a href=\"https://spectrum.ieee.org/humanoid-robot-scaling\" target=\"_self\">pointed questions about practicality and value<\/a>. In other words, starting a commercial humanoid company <em><em>now<\/em><\/em> is a much different proposition than it would have been just a few years ago. <\/p><p>On 15 July, <a href=\"https://www.waldenrobotics.com/news/walden-robotics-launches-from-stealth\" rel=\"noopener noreferrer\" target=\"_blank\">Walden Robotics emerged from stealth<\/a> with US $300 million in funding at a valuation of $1.1 billion. Walden is a spinout of <a href=\"https://spectrum.ieee.org/toyota-to-invest-1-billion-in-ai-and-robotics-rd\" target=\"_self\">Toyota Research Institute<\/a> (TRI), and it’s spent the last 10 or so years working on hard problems in robotics with the goal of transitioning from research to real-world applications. That seems like the amount of time and experience that it might reasonably take to develop a <a href=\"https://spectrum.ieee.org/humanoid-robot-scaling\" target=\"_self\">practical and value-driven approach<\/a> to deploying general-purpose humanoid robots, and Walden has chosen an excellent starting point by skipping the legs.<\/p><p>“It’s ironic,” says Walden cofounder and CEO <a href=\"https://www.linkedin.com/in/russ-tedrake-88648a4a/\" rel=\"noopener noreferrer\" target=\"_blank\">Russ Tedrake<\/a>. “I thought about legs for 20 years; that’s the class I teach at MIT. There are many reasons to build a robot with legs. But the question is, what’s the addressable market? And what percentage of it is covered by a wheeled base?” It’s this focused, practical thinking that sets Walden somewhat apart from many (if not most) of the other companies in this space. Rather than <a href=\"https://spectrum.ieee.org/boston-dynamics-spot-robot-dog-now-available\" target=\"_self\">developing a robot first and searching for a viable commercial use case second<\/a>, Walden instead identified applications where robots can provide value now, and designed a robot that could safely and efficiently meet those needs.<\/p><p class=\"shortcode-media shortcode-media-youtube\"> <span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span> <small class=\"image-media media-photo-credit\">Walden Robotics<\/small> <\/p><h2>Walden Robotics’ Manufacturing Focus<\/h2><p class=\"shortcode-media shortcode-media-rebelmouse-image rm-float-left rm-resized-container rm-resized-container-25\" style=\"float: left;\"> <img alt=\"A smiling man in a blue shirt\" class=\"rm-shortcode\" id=\"f545c\" src=\"https://spectrum.ieee.org/media-library/a-smiling-man-in-a-blue-shirt.jpg?id=67568051&amp;width=980\" /> <small class=\"image-media media-caption\">Russ Tedrake is the CEO and cofounder of Walden Robotics.<\/small><small class=\"image-media media-photo-credit\">Walden Robotics<\/small><\/p><p>Tedrake is light on the details about what specific applications Walden is targeting at this point (citing confidentiality with current commercial partners). Manufacturing and logistics environments where there are a lot of <a href=\"https://www.youtube.com/watch?v=F_7IPm7f1vI\" target=\"_blank\">relatively simple<\/a> and <a href=\"https://www.youtube.com/watch?v=tv90GFM9RAo\" target=\"_blank\">repetitive tasks<\/a> that aren’t friendly to conveyor belts and preprogrammed robot arms are a good bet. Even in these environments, however, robots still have to find a useful niche because they’re going up against human workers who are more flexible while also cheaper to employ. So the question is: How do you make an argument to a customer that a robot is actually a better solution than their existing human workers?<\/p><p>“You need to find applications with high utilization—where the robot is used 24 hours a day, 7 days a week,” says Tedrake. “Manufacturing is a global imperative right now, and it makes the economics work.” Economic viability is a necessary condition, but it’s not a sufficient one for Walden, or for their partnership with Toyota. People are a big part of Walden’s plan, too.<\/p><p>One of Walden’s major strengths is the company’s partnership with Toyota, which is not all that surprising given that Walden is a spinout from TRI, which is <a href=\"https://spectrum.ieee.org/toyota-to-invest-1-billion-in-ai-and-robotics-rd\" target=\"_self\">Toyota’s Silicon Valley–based R&amp;D arm<\/a>. “Toyota was very proud of the work we had done at TRI, and was ready to go big in this space,” says Tedrake. “Part of the excitement of having Toyota as a partner is that their culture is deeply people-first. When talking to Toyota’s leadership, I was never asked how much money this is going to make, but I was asked how it will improve the quality of life for all people.”<\/p><p class=\"shortcode-media shortcode-media-rebelmouse-image\"> <img alt=\"A white and orange humanoid robot manipulates an object in its two-finger grippers.\" class=\"rm-shortcode\" id=\"209d4\" src=\"https://spectrum.ieee.org/media-library/a-white-and-orange-humanoid-robot-manipulates-an-object-in-its-two-finger-grippers.jpg?id=67568030&amp;width=980\" /> <small class=\"image-media media-caption\">The robot’s chonky design allows it to meet the high-payload requirements of useful manufacturing work.<\/small><small class=\"image-media media-photo-credit\">Walden Robotics<\/small><\/p><p>In this context, at least in the short term, Walden’s approach to improving the quality of life for people is to take over those aforementioned repetitive manufacturing tasks with robots. Tedrake hopes that this will lead to workplaces where skilled craftspeople are able to do even more with their hard-earned expertise, increasing their efficiency, productivity, and happiness all at the same time—a noble goal, although there’s only so much Walden itself can do to make this happen, and not all customers will share Toyota’s priorities.<\/p><h2>Wheeled Humanoid Robots in Factories<\/h2><p>Many other <a href=\"https://www.agilityrobotics.com/\" target=\"_blank\">humanoid<\/a> <a href=\"https://www.figure.ai/\" target=\"_blank\">robotics<\/a> <a href=\"https://apptronik.com/\" target=\"_blank\">companies<\/a> are also targeting these logistics and manufacturing spaces with general-purpose robots, and they’re doing so by making robots that are as humanlike as possible. The theory is that a humanoid form factor is necessary when operating in human environments. And there are certainly arguments in favor of a humanoid with legs—stairs exist, for one, and legged robots have a smaller footprint compared with ones that have wheels.<\/p><p>But a large wheeled base offers some significant advantages, as Tedrake points out. You’re incentivized to cram the base full of batteries, since more weight near the floor keeps the robot stable, which also solves the problem of running out of power during the middle of the workday. More importantly, a statically stable robot that moves around on a wheeled base can bypass the <a href=\"https://spectrum.ieee.org/humanoid-robot-scaling\" target=\"_self\">safety challenges<\/a> that are currently keeping legged humanoids physically separated from real humans—most prominently, the fact that legged robots can fall over. “Factories already have autonomous mobile [wheeled] robots,” explains Tedrake. “They already have safety cases built around AMRs. You can piggyback on that with a wheeled base.”<\/p><p class=\"shortcode-media shortcode-media-rebelmouse-image\"> <img alt=\"A close-up of a robotic gripper grasping a metallic object in a vise.\" class=\"rm-shortcode\" id=\"f600c\" src=\"https://spectrum.ieee.org/media-library/a-close-up-of-a-robotic-gripper-grasping-a-metallic-object-in-a-vise.jpg?id=67568022&amp;width=980\" /> <small class=\"image-media media-caption\">Simple, rugged grippers make the robot suitable for commercial deployment.<\/small><small class=\"image-media media-photo-credit\">Walden Robotics<\/small><\/p><p>Walden’s perspective on manipulation is similar. Many humanoid companies are using five-fingered hands that are highly dexterous but also highly complex, which Tedrake believes is not a pragmatic approach in the context of commercial deployments. “There’s a question of what you need to do the tasks, but the real question is just durability,” Tedrake says. “We have been deployed in a Toyota factory, and at the end of the week, the hands take a beating, so we built hands that can take that. I have not seen a more dexterous hand that could have done the work our hand has done.”<\/p><p>Walden’s long-term plan is to build “general-purpose robots.” It’s not always clear what a general-purpose robot is, because (I would argue) nobody is quite sure what “general purpose” means. It’s certainly not referring to robots that can do <em><em>everything<\/em><\/em>; I think the closest we can get are robots that can be taught to do a useful number of different skills, which is why I prefer the term “multipurpose.” It’s a little pedantic, I know, but I think the distinction is important because it moderates expectations in the near term.<\/p><p>Part of where Walden’s optimism towards general purposeness comes from is TRI’s earlier research on <a href=\"https://medium.com/toyotaresearch/tris-robots-learn-new-skills-in-an-afternoon-here-s-how-2c30b1a8c573\" target=\"_blank\">diffusion policy<\/a>, which helps robots learn new skills more quickly by leveraging previously learned skills as a foundation. “Fundamentally, multitasking is a way to get to a general-purpose robot,” Tedrake says. “I believe there is a single platform that can do a lot of tasks that are of high value for real customers. That will give us the experience we need to give birth to this deployed general-purpose capability.”<\/p>"}, {"title": "HEBI Robotics earns NASA SBIR grant to fast track miniaturized actuators", "source": "The Robot Report", "date": "2026-08-03", "url": "https://www.therobotreport.com/hebi-robotics-earns-nasa-sbir-grant-fast-track-miniaturized-actuators/", "summary": "<p>This Phase I award is only part of HEBI Robotics' roadmap. The company also plans to continue developing its existing actuation hardware.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/hebi-robotics-earns-nasa-sbir-grant-fast-track-miniaturized-actuators/\">HEBI Robotics earns NASA SBIR grant to fast track miniaturized actuators<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "igus launches energy chain with 600-degree rotation for industrial robots", "source": "Robotics Business Review", "date": "2026-08-03", "url": "https://www.therobotreport.com/igus-launches-energy-chain-600-degree-rotation-industrial-robots/", "summary": "<p>igus says its new twisterchain energy chain provides cable management for challenging industrial robotics applications such as palletizing.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/igus-launches-energy-chain-600-degree-rotation-industrial-robots/\">igus launches energy chain with 600-degree rotation for industrial robots<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Google DeepMind says Gemini Robotics 2 enables full body control", "source": "Robotics Business Review", "date": "2026-08-02", "url": "https://www.therobotreport.com/google-deepmind-says-gemini-robotics-2-enables-full-body-control/", "summary": "<p>Gemini Robotics 2 enables robots to reason through every movement, unlocking a broad range of tasks, DeepMind said. <\/p>\n<p>The post <a href=\"https://www.therobotreport.com/google-deepmind-says-gemini-robotics-2-enables-full-body-control/\">Google DeepMind says Gemini Robotics 2 enables full body control<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Top 10 robotics stories of July 2026", "source": "Robotics Business Review", "date": "2026-08-01", "url": "https://www.therobotreport.com/top-10-robotics-stories-july-2026/", "summary": "<p>In July, large funding rounds, new approaches to robot training, and new robot models drew our readers attention.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/top-10-robotics-stories-july-2026/\">Top 10 robotics stories of July 2026<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Procore Technologies acquires DroneDeploy for $845M", "source": "Robotics Business Review", "date": "2026-07-31", "url": "https://www.therobotreport.com/procore-technologies-acquires-dronedeploy-845m/", "summary": "<p>Procore will integrate DroneDeploy's visual intelligence technology to link the digital world with physical construction sites.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/procore-technologies-acquires-dronedeploy-845m/\">Procore Technologies acquires DroneDeploy for $845M<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "KUKA deploys Automation Management Platform for North American automakers", "source": "Robotics Business Review", "date": "2026-07-31", "url": "https://www.therobotreport.com/kuka-deploys-automation-management-platform-north-american-automakers/", "summary": "<p>KUKA has deployed its Automation Management Platform at KTPO, a major manufacturing facility in Ohio.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/kuka-deploys-automation-management-platform-north-american-automakers/\">KUKA deploys Automation Management Platform for North American automakers<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "FCC robot ruling shines a spotlight on U.S. policy; how next-gen AI can help warehousing", "source": "Robotics Business Review", "date": "2026-07-31", "url": "https://www.therobotreport.com/fcc-robot-ruling-shines-spotlight-on-u-s-policy-how-next-gen-ai-can-help-warehousing/", "summary": "<p>OSARO’s Derek Pridmore says warehouse robots are advancing, but real-world safety and reliability still depend on specialized, layered AI systems.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/fcc-robot-ruling-shines-spotlight-on-u-s-policy-how-next-gen-ai-can-help-warehousing/\">FCC robot ruling shines a spotlight on U.S. policy; how next-gen AI can help warehousing<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Video Friday: Meet Google DeepMind’s Gemini Robotics 2", "source": "IEEE Spectrum Robotics", "date": "2026-07-31", "url": "https://spectrum.ieee.org/video-robot-gemini2-ai-robot", "summary": "<img src=\"https://spectrum.ieee.org/media-library/humanoid-robot-and-robotic-arm-labeled-gemini-robotics-er-2-in-a-workshop-setting.webp?id=67560022&amp;width=1200&amp;height=800&amp;coordinates=125%2C0%2C125%2C0\" /><br /><br /><p><span>Video Friday is your weekly selection of awesome robotics videos, collected by your friends at <\/span><em>IEEE Spectrum<\/em><span> robotics. We also post a weekly calendar of upcoming robotics events for the next few months. Please <\/span><a href=\"mailto:automaton@ieee.org?subject=Robotics%20event%20suggestion%20for%20Video%20Friday\">send us your events<\/a><span> for inclusion.<\/span><\/p><h5><a href=\"https://actuate.foxglove.dev/\">Actuate 2026<\/a>: 18–19 August 2026, SAN FRANCISCO<\/h5><h5><a href=\"https://2026.ieee-iros.org/\">IROS 2026<\/a>: 27 September–1 October 2026, PITTSBURGH<\/h5><h5><a href=\"https://humanoidssummit.com/\">Humanoids Summit Seoul<\/a>: 22–23 September 2026, SEOUL<\/h5><p>Enjoy today’s videos!<\/p><div class=\"horizontal-rule\"><\/div><div><span style=\"display: none;\"> <\/span><\/div><blockquote class=\"rm-anchors\" id=\"4lsqnrmc6ny\"><em>Introducing Gemini Robotics 2—the intelligence layer powering the next generation of truly adaptable robots. As it takes its first literal steps, this major advance unlocks intelligent whole-body control, advanced dexterity, and multirobot collaboration. <\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p class=\"shortcode-media shortcode-media-youtube\"> <span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p class=\"shortcode-media shortcode-media-youtube\"> <span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://deepmind.google/blog/gemini-robotics-2-brings-whole-body-intelligence-to-robots/\">Google DeepMind<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"vzwytn3fw1w\">THE ROADMAP! NOOOOO!<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.agilityrobotics.com/\">Agility<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"xha2tj_1c6q\">Videos like this always make me wonder how <a href=\"https://spectrum.ieee.org/robot-with-liquid-metal-tendons-can-heal-itself\" target=\"_blank\">repairable<\/a> these robots are. Very, I would hope.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.unitree.com/As2-W\">Unitree<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"m81_7rggdxm\"><em>Humans routinely communicate through abstractions of their bodies, including shadows, silhouettes, and reflections. Here, we present a robotic system capable of dynamic shadow expression using a 21-degrees-of-freedom <a href=\"https://spectrum.ieee.org/video-friday-robotic-hand-dexterity\" target=\"_blank\">dexterous hand<\/a> with compliant soft skin and a learned shadow self-model.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://generalroboticslab.com/shadow\">General Robotics Lab<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"n20cvjhmzh8\">Human-to-quadruped motion transfer is an odd concept, but I’m here for it.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://studios.disneyresearch.com/2026/07/30/two2four-generative-quadruped-puppeteering-from-human-motion/\">Disney Research<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"alc1aon3a4i\"><em>Meet Stretch 4.0<\/em>—t<em>he one-armed, three-wheeled robot that can navigate your home safely. Would you rather a humanoid robot or Stretch?<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://hello-robot.com/\">Hello Robot<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"cjytikq4dum\">And now, this, for some reason.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.pndbotics.com/\">PNDbotics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"k4wzqzblkry\">I’m not sure we’re allowed to be impressed if you resize a badminton court to accommodate your robot.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.phybot.tech/en/home\">PHYBOT<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"rnrf8fc47qm\">Golden eagles care not for <a href=\"https://spectrum.ieee.org/dutch-police-training-eagles-to-take-down-drones\" target=\"_blank\">drones<\/a>. <\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.team-blacksheep.com/\">Team BlackSheep<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"1tzmvkf7x10\"><em>University of Southern California researchers work with NASA and others to train robot dogs for planetary exploration on Mars, the moon, and beyond!<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.radlab.us/\">Research in Applied Decisions: RAD Lab<\/a> ]<\/p><p>Thanks, Cristina!<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"lzphwt2wwv8\"><a href=\"https://spectrum.ieee.org/humanoid-robots-japan\" target=\"_blank\">WABOT-1<\/a> was arguably the birth of the humanoid robot in Japan. We’ve come a long way, and it’s good to be reminded where we started.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"http://www.takanishi.mech.waseda.ac.jp/top/index.htm\">Takanishi Lab<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"1eplnnhbqbs\">If only this video was at 1x instead of 5x we could have had 15 hours of Memo folding laundry.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.sunday.ai/\">Sunday Robotics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div>"}, {"title": "Teradyne Robotics revenue rises 33% year over year in Q2", "source": "Robotics Business Review", "date": "2026-07-30", "url": "https://www.therobotreport.com/teradyne-robotics-revenue-rises-33-year-over-year-in-q2/", "summary": "<p>Teradyne Robotics said growth in the U.S. and in AI were big drivers for its revenue increase in the second quarter of 2026.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/teradyne-robotics-revenue-rises-33-year-over-year-in-q2/\">Teradyne Robotics revenue rises 33% year over year in Q2<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "DoorDash gains FAA certification to operate its own drone delivery program", "source": "Robotics Business Review", "date": "2026-07-30", "url": "https://www.therobotreport.com/doordash-gains-faa-certification-to-operate-its-own-drone-delivery-program/", "summary": "<p>The FAA approval came nearly a year after DoorDash unveiled its delivery robot and reflects its increasing interest in building automation in-house.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/doordash-gains-faa-certification-to-operate-its-own-drone-delivery-program/\">DoorDash gains FAA certification to operate its own drone delivery program<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "5 Physical AI infrastructure platforms shaping robotics in 2026", "source": "Robotics Business Review", "date": "2026-07-30", "url": "https://www.therobotreport.com/5-physical-ai-infrastructure-platforms-shaping-robotics-in-2026/", "summary": "<p>These five platforms address different challenges and provide the basis for the emerging physical AI tech stack, according to Lightwheel.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/5-physical-ai-infrastructure-platforms-shaping-robotics-in-2026/\">5 Physical AI infrastructure platforms shaping robotics in 2026<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Experts react to FCC limits on U.S. imports of new humanoid and mobile robots", "source": "Robotics Business Review", "date": "2026-07-29", "url": "https://www.therobotreport.com/industry-reacts-fcc-ban-u-s-imports-new-humanoid-quadruped-robots/", "summary": "<p>The FCC has banned some foreign humanoids, which industry experts say could help U.S. industry but hinder innovation.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/industry-reacts-fcc-ban-u-s-imports-new-humanoid-quadruped-robots/\">Experts react to FCC limits on U.S. imports of new humanoid and mobile robots<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "GMEX Robotics to acquire MediaMeta.ai for social intelligence", "source": "Robotics Business Review", "date": "2026-07-29", "url": "https://www.therobotreport.com/gmex-robotics-to-acquire-mediameta-ai-social-intelligence/", "summary": "<p>GMEX Robotics has acquired shares in MediaMeta to incorporate social intelligence capabilities into its service robots.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/gmex-robotics-to-acquire-mediameta-ai-social-intelligence/\">GMEX Robotics to acquire MediaMeta.ai for social intelligence<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "How integrated actuators improve humanoid robot joint performance and system integration", "source": "Robotics Business Review", "date": "2026-07-28", "url": "https://www.therobotreport.com/how-integrated-actuators-improve-humanoid-robot-joint-performance-and-system-integration/", "summary": "<p>Humanoid robots have become an important area of research in robotics, attracting attention from universities, research institutions, and technology companies.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/how-integrated-actuators-improve-humanoid-robot-joint-performance-and-system-integration/\">How integrated actuators improve humanoid robot joint performance and system integration<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Robot Finger Feels in Color", "source": "IEEE Spectrum Robotics", "date": "2026-07-28", "url": "https://spectrum.ieee.org/robot-finger", "summary": "<img src=\"https://spectrum.ieee.org/media-library/close-up-of-a-sensor-for-a-robotic-fingertip-and-raised-relief-images-of-a-leaf-and-a-u-s-penny.jpg?id=67542077&amp;width=1200&amp;height=800&amp;coordinates=0%2C83%2C0%2C84\" /><br /><br /><p><span>Imagine running your fingertip over the surface of a U.S. penny. You would feel the ridges of the raised letters and numbers, Abe Lincoln’s bearded side profile, and, if it’s tails, the fluted columns of the Lincoln Memorial. Getting a robot to sense the same things is an imposing task, often requiring gathering data on pressure and force at many spatial locations at once. But that’s just what a team of scientists in Europe has now managed to do, using an unusual, colorful robotic skin that provides high-resolution sensing in real time.<\/span><\/p><p>“To be honest, when they showed us this, we thought it was, and pardon my French, [expletive] cool, because it’s a distinctly different approach,” recalled Rich Walker, director of <a href=\"https://shadowrobot.com/\" target=\"_blank\">Shadow Robot<\/a>, the U.K.’s longest-running robot company, which primarily focuses on <a href=\"https://spectrum.ieee.org/video-friday-shadow-robot-hand\" target=\"_blank\">robotic hands<\/a>.<\/p><p class=\"ieee-inbody-related\">RELATED: <a href=\"https://spectrum.ieee.org/shadow-walker-biped-humanoid-robot\" target=\"_self\">“This DIY Bipedal Robot Used Pneumatic “Air-Muscles” Instead of Motors”<\/a><\/p><p>The research team, which hails from Queen Mary University of London, the University of Florence, the University of Trieste, and the University of Trento, designed a robotic fingertip with a synthetic skin that reflects different colors of light in response to mechanical deformation. By reading the light reflected off the skin, the fingertip generates maps of topology, strain, and contact pressure. The team has already used the sensor to generate maps of a human fingertip, a penny, and a leaf.<\/p><p><a href=\"https://www.seresearch.qmul.ac.uk/cit/people/gsasso/\" target=\"_blank\">Giacomo Sasso<\/a>, a postdoctoral research associate in the lab of <a href=\"https://www.sems.qmul.ac.uk/staff/f.carpi/\" target=\"_blank\">Federico Carpi<\/a> at Queen Mary University of London, came up with the idea for the sensor. He had been researching optics when he stumbled upon an interesting <a href=\"https://www.nature.com/articles/s41563-022-01318-x\" target=\"_blank\">paper published in the journal <em><em>Nature<\/em><\/em><\/a>. It described the “mechanochromic material” that would eventually make up the reflector in the skin.<\/p><p>Following the method described in <em><em>Nature<\/em><\/em>, Sasso exposed a light-sensitive film to a 5-megawatt, 635-nanometer (red) laser for seven minutes. The laser beam creates an interference pattern which causes the film to polymerize in alternating densities, creating layers with different refractive indices.<\/p><p>This structure is called a <a href=\"https://spectrum.ieee.org/a-simple-filter-makes-blueemitting-oleds-give-off-white-light\" target=\"_blank\">Bragg reflector<\/a>. The alternating densities and refractive indices in the polymer cause specific wavelengths of light to be reflected. When the reflector is deformed by contact with an object, its layers are stretched, becoming thinner and reflecting light of a different wavelength. <\/p><p>It took Sasso less than a week to re-create the material in the lab. “From there, we started seeing how we could translate these color patterns into something that was useful for us,” he says. Soon, they realized that the color produced by the material was all they needed to be able to sense the topology of objects.<\/p><p>In the robotic finger, the Bragg reflector is sandwiched between a layer of silicone, which protects it from the outside, and a transparent, fingertip-shaped silicone finger with a camera and LED light embedded inside of it. <\/p><p>The light from the LED shines through the clear polymer of the finger. When the fingertip is deformed by an object, the reflector bounces light back to the camera, with wavelengths depending on the level of deformation—red for least deformation, shifting to green, and then to blue when most deformed.<\/p><p>The team also made adjustments to increase the sensitivity of the skin and help the camera to better read color differences. The silicone of the outer layer of the fingertip is colored black to increase the color contrast, allowing the camera to better translate color into the morphology. The rigidity of the camera inside the finger also enhances the deformation of the reflector, producing greater differences in reflected wavelengths.<\/p><p>After all that optimization, the finger provided 100-micrometer resolution with no <a href=\"https://spectrum.ieee.org/robot-fingers\" target=\"_blank\">computational<\/a> latency, the researchers determined.<\/p><h2>What robot fingers need<\/h2><p>Human skin takes in a variety of tactile information in order to successfully move and manipulate objects, including temperature, texture, pressure, and vibration. But engineering a robot to do the same is challenging because of spatial constraints. There often isn’t enough room in a robotic fingertip to incorporate more than one type of sensor. The question then becomes: Which type of sensor should be used?<\/p><p>“And the answer to that is…that’s a really hard question. No one knows yet,” says Walker. Carpi’s team’s robotic finger is exciting because it presents yet another option for roboticists to experiment with, Walker says.<\/p><p>Although Carpi’s team <a href=\"https://www.gelsight.com/\" target=\"_blank\">isn’t the first<\/a> to use soft materials for tactile sensing, its technology is unique because it is able to extract quantitative information about depth and size from the topologic maps it generates. According to Walker, most sensors can only generate topological maps, which reveal the relative sizes of object features.<\/p><p>To Sasso, another key advantage of this robotic finger is that it embeds tactile sensing directly into the material of the finger, rather than using taxels, or pixels that measure force or pressure at specific spatial points. <\/p><p class=\"ieee-inbody-related\">RELATED: <a href=\"https://spectrum.ieee.org/robot-fingers\" target=\"_blank\">Robot Hand Manipulates Complex Objects by Touch Alone<\/a><\/p><p>“The core aspect of the sensor is that we’re essentially [moving toward] having the sensing element at the material level,” he says. “The camera, which is a very highly optimized electronic component, is translating whatever the material is already doing directly into digital signals.” <\/p><p><a href=\"https://www.linkedin.com/in/michael-yu-wang-258a4525/\" target=\"_blank\">Michael Wang<\/a>, co-founder and chief scientist at <a href=\"https://spectrum.ieee.org/daimon-robotics-physical-ai\" target=\"_blank\">Daimon Robotics<\/a>, which, unlike Shadow Robot, prim
