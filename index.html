that can do a lot of tasks that are of high value for real customers. That will give us the experience we need to give birth to this deployed general-purpose capability.”<\/p>"}, {"title": "HEBI Robotics earns NASA SBIR grant to fast track miniaturized actuators", "source": "The Robot Report", "date": "2026-08-03", "url": "https://www.therobotreport.com/hebi-robotics-earns-nasa-sbir-grant-fast-track-miniaturized-actuators/", "summary": "<p>This Phase I award is only part of HEBI Robotics' roadmap. The company also plans to continue developing its existing actuation hardware.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/hebi-robotics-earns-nasa-sbir-grant-fast-track-miniaturized-actuators/\">HEBI Robotics earns NASA SBIR grant to fast track miniaturized actuators<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "igus launches energy chain with 600-degree rotation for industrial robots", "source": "Robotics Business Review", "date": "2026-08-03", "url": "https://www.therobotreport.com/igus-launches-energy-chain-600-degree-rotation-industrial-robots/", "summary": "<p>igus says its new twisterchain energy chain provides cable management for challenging industrial robotics applications such as palletizing.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/igus-launches-energy-chain-600-degree-rotation-industrial-robots/\">igus launches energy chain with 600-degree rotation for industrial robots<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Google DeepMind says Gemini Robotics 2 enables full body control", "source": "Robotics Business Review", "date": "2026-08-02", "url": "https://www.therobotreport.com/google-deepmind-says-gemini-robotics-2-enables-full-body-control/", "summary": "<p>Gemini Robotics 2 enables robots to reason through every movement, unlocking a broad range of tasks, DeepMind said. <\/p>\n<p>The post <a href=\"https://www.therobotreport.com/google-deepmind-says-gemini-robotics-2-enables-full-body-control/\">Google DeepMind says Gemini Robotics 2 enables full body control<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Top 10 robotics stories of July 2026", "source": "Robotics Business Review", "date": "2026-08-01", "url": "https://www.therobotreport.com/top-10-robotics-stories-july-2026/", "summary": "<p>In July, large funding rounds, new approaches to robot training, and new robot models drew our readers attention.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/top-10-robotics-stories-july-2026/\">Top 10 robotics stories of July 2026<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Procore Technologies acquires DroneDeploy for $845M", "source": "Robotics Business Review", "date": "2026-07-31", "url": "https://www.therobotreport.com/procore-technologies-acquires-dronedeploy-845m/", "summary": "<p>Procore will integrate DroneDeploy's visual intelligence technology to link the digital world with physical construction sites.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/procore-technologies-acquires-dronedeploy-845m/\">Procore Technologies acquires DroneDeploy for $845M<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "KUKA deploys Automation Management Platform for North American automakers", "source": "Robotics Business Review", "date": "2026-07-31", "url": "https://www.therobotreport.com/kuka-deploys-automation-management-platform-north-american-automakers/", "summary": "<p>KUKA has deployed its Automation Management Platform at KTPO, a major manufacturing facility in Ohio.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/kuka-deploys-automation-management-platform-north-american-automakers/\">KUKA deploys Automation Management Platform for North American automakers<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "FCC robot ruling shines a spotlight on U.S. policy; how next-gen AI can help warehousing", "source": "Robotics Business Review", "date": "2026-07-31", "url": "https://www.therobotreport.com/fcc-robot-ruling-shines-spotlight-on-u-s-policy-how-next-gen-ai-can-help-warehousing/", "summary": "<p>OSARO’s Derek Pridmore says warehouse robots are advancing, but real-world safety and reliability still depend on specialized, layered AI systems.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/fcc-robot-ruling-shines-spotlight-on-u-s-policy-how-next-gen-ai-can-help-warehousing/\">FCC robot ruling shines a spotlight on U.S. policy; how next-gen AI can help warehousing<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Video Friday: Meet Google DeepMind’s Gemini Robotics 2", "source": "IEEE Spectrum Robotics", "date": "2026-07-31", "url": "https://spectrum.ieee.org/video-robot-gemini2-ai-robot", "summary": "<img src=\"https://spectrum.ieee.org/media-library/humanoid-robot-and-robotic-arm-labeled-gemini-robotics-er-2-in-a-workshop-setting.webp?id=67560022&amp;width=1200&amp;height=800&amp;coordinates=125%2C0%2C125%2C0\" /><br /><br /><p><span>Video Friday is your weekly selection of awesome robotics videos, collected by your friends at <\/span><em>IEEE Spectrum<\/em><span> robotics. We also post a weekly calendar of upcoming robotics events for the next few months. Please <\/span><a href=\"mailto:automaton@ieee.org?subject=Robotics%20event%20suggestion%20for%20Video%20Friday\">send us your events<\/a><span> for inclusion.<\/span><\/p><h5><a href=\"https://actuate.foxglove.dev/\">Actuate 2026<\/a>: 18–19 August 2026, SAN FRANCISCO<\/h5><h5><a href=\"https://2026.ieee-iros.org/\">IROS 2026<\/a>: 27 September–1 October 2026, PITTSBURGH<\/h5><h5><a href=\"https://humanoidssummit.com/\">Humanoids Summit Seoul<\/a>: 22–23 September 2026, SEOUL<\/h5><p>Enjoy today’s videos!<\/p><div class=\"horizontal-rule\"><\/div><div><span style=\"display: none;\"> <\/span><\/div><blockquote class=\"rm-anchors\" id=\"4lsqnrmc6ny\"><em>Introducing Gemini Robotics 2—the intelligence layer powering the next generation of truly adaptable robots. As it takes its first literal steps, this major advance unlocks intelligent whole-body control, advanced dexterity, and multirobot collaboration. <\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p class=\"shortcode-media shortcode-media-youtube\"> <span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p class=\"shortcode-media shortcode-media-youtube\"> <span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://deepmind.google/blog/gemini-robotics-2-brings-whole-body-intelligence-to-robots/\">Google DeepMind<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"vzwytn3fw1w\">THE ROADMAP! NOOOOO!<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.agilityrobotics.com/\">Agility<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"xha2tj_1c6q\">Videos like this always make me wonder how <a href=\"https://spectrum.ieee.org/robot-with-liquid-metal-tendons-can-heal-itself\" target=\"_blank\">repairable<\/a> these robots are. Very, I would hope.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.unitree.com/As2-W\">Unitree<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"m81_7rggdxm\"><em>Humans routinely communicate through abstractions of their bodies, including shadows, silhouettes, and reflections. Here, we present a robotic system capable of dynamic shadow expression using a 21-degrees-of-freedom <a href=\"https://spectrum.ieee.org/video-friday-robotic-hand-dexterity\" target=\"_blank\">dexterous hand<\/a> with compliant soft skin and a learned shadow self-model.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://generalroboticslab.com/shadow\">General Robotics Lab<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"n20cvjhmzh8\">Human-to-quadruped motion transfer is an odd concept, but I’m here for it.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://studios.disneyresearch.com/2026/07/30/two2four-generative-quadruped-puppeteering-from-human-motion/\">Disney Research<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"alc1aon3a4i\"><em>Meet Stretch 4.0<\/em>—t<em>he one-armed, three-wheeled robot that can navigate your home safely. Would you rather a humanoid robot or Stretch?<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://hello-robot.com/\">Hello Robot<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"cjytikq4dum\">And now, this, for some reason.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.pndbotics.com/\">PNDbotics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"k4wzqzblkry\">I’m not sure we’re allowed to be impressed if you resize a badminton court to accommodate your robot.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.phybot.tech/en/home\">PHYBOT<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"rnrf8fc47qm\">Golden eagles care not for <a href=\"https://spectrum.ieee.org/dutch-police-training-eagles-to-take-down-drones\" target=\"_blank\">drones<\/a>. <\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.team-blacksheep.com/\">Team BlackSheep<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"1tzmvkf7x10\"><em>University of Southern California researchers work with NASA and others to train robot dogs for planetary exploration on Mars, the moon, and beyond!<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.radlab.us/\">Research in Applied Decisions: RAD Lab<\/a> ]<\/p><p>Thanks, Cristina!<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"lzphwt2wwv8\"><a href=\"https://spectrum.ieee.org/humanoid-robots-japan\" target=\"_blank\">WABOT-1<\/a> was arguably the birth of the humanoid robot in Japan. We’ve come a long way, and it’s good to be reminded where we started.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"http://www.takanishi.mech.waseda.ac.jp/top/index.htm\">Takanishi Lab<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"1eplnnhbqbs\">If only this video was at 1x instead of 5x we could have had 15 hours of Memo folding laundry.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.sunday.ai/\">Sunday Robotics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div>"}, {"title": "Teradyne Robotics revenue rises 33% year over year in Q2", "source": "Robotics Business Review", "date": "2026-07-30", "url": "https://www.therobotreport.com/teradyne-robotics-revenue-rises-33-year-over-year-in-q2/", "summary": "<p>Teradyne Robotics said growth in the U.S. and in AI were big drivers for its revenue increase in the second quarter of 2026.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/teradyne-robotics-revenue-rises-33-year-over-year-in-q2/\">Teradyne Robotics revenue rises 33% year over year in Q2<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "DoorDash gains FAA certification to operate its own drone delivery program", "source": "Robotics Business Review", "date": "2026-07-30", "url": "https://www.therobotreport.com/doordash-gains-faa-certification-to-operate-its-own-drone-delivery-program/", "summary": "<p>The FAA approval came nearly a year after DoorDash unveiled its delivery robot and reflects its increasing interest in building automation in-house.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/doordash-gains-faa-certification-to-operate-its-own-drone-delivery-program/\">DoorDash gains FAA certification to operate its own drone delivery program<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "5 Physical AI infrastructure platforms shaping robotics in 2026", "source": "Robotics Business Review", "date": "2026-07-30", "url": "https://www.therobotreport.com/5-physical-ai-infrastructure-platforms-shaping-robotics-in-2026/", "summary": "<p>These five platforms address different challenges and provide the basis for the emerging physical AI tech stack, according to Lightwheel.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/5-physical-ai-infrastructure-platforms-shaping-robotics-in-2026/\">5 Physical AI infrastructure platforms shaping robotics in 2026<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Experts react to FCC limits on U.S. imports of new humanoid and mobile robots", "source": "Robotics Business Review", "date": "2026-07-29", "url": "https://www.therobotreport.com/industry-reacts-fcc-ban-u-s-imports-new-humanoid-quadruped-robots/", "summary": "<p>The FCC has banned some foreign humanoids, which industry experts say could help U.S. industry but hinder innovation.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/industry-reacts-fcc-ban-u-s-imports-new-humanoid-quadruped-robots/\">Experts react to FCC limits on U.S. imports of new humanoid and mobile robots<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "GMEX Robotics to acquire MediaMeta.ai for social intelligence", "source": "Robotics Business Review", "date": "2026-07-29", "url": "https://www.therobotreport.com/gmex-robotics-to-acquire-mediameta-ai-social-intelligence/", "summary": "<p>GMEX Robotics has acquired shares in MediaMeta to incorporate social intelligence capabilities into its service robots.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/gmex-robotics-to-acquire-mediameta-ai-social-intelligence/\">GMEX Robotics to acquire MediaMeta.ai for social intelligence<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "How integrated actuators improve humanoid robot joint performance and system integration", "source": "Robotics Business Review", "date": "2026-07-28", "url": "https://www.therobotreport.com/how-integrated-actuators-improve-humanoid-robot-joint-performance-and-system-integration/", "summary": "<p>Humanoid robots have become an important area of research in robotics, attracting attention from universities, research institutions, and technology companies.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/how-integrated-actuators-improve-humanoid-robot-joint-performance-and-system-integration/\">How integrated actuators improve humanoid robot joint performance and system integration<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Robot Finger Feels in Color", "source": "IEEE Spectrum Robotics", "date": "2026-07-28", "url": "https://spectrum.ieee.org/robot-finger", "summary": "<img src=\"https://spectrum.ieee.org/media-library/close-up-of-a-sensor-for-a-robotic-fingertip-and-raised-relief-images-of-a-leaf-and-a-u-s-penny.jpg?id=67542077&amp;width=1200&amp;height=800&amp;coordinates=0%2C83%2C0%2C84\" /><br /><br /><p><span>Imagine running your fingertip over the surface of a U.S. penny. You would feel the ridges of the raised letters and numbers, Abe Lincoln’s bearded side profile, and, if it’s tails, the fluted columns of the Lincoln Memorial. Getting a robot to sense the same things is an imposing task, often requiring gathering data on pressure and force at many spatial locations at once. But that’s just what a team of scientists in Europe has now managed to do, using an unusual, colorful robotic skin that provides high-resolution sensing in real time.<\/span><\/p><p>“To be honest, when they showed us this, we thought it was, and pardon my French, [expletive] cool, because it’s a distinctly different approach,” recalled Rich Walker, director of <a href=\"https://shadowrobot.com/\" target=\"_blank\">Shadow Robot<\/a>, the U.K.’s longest-running robot company, which primarily focuses on <a href=\"https://spectrum.ieee.org/video-friday-shadow-robot-hand\" target=\"_blank\">robotic hands<\/a>.<\/p><p class=\"ieee-inbody-related\">RELATED: <a href=\"https://spectrum.ieee.org/shadow-walker-biped-humanoid-robot\" target=\"_self\">“This DIY Bipedal Robot Used Pneumatic “Air-Muscles” Instead of Motors”<\/a><\/p><p>The research team, which hails from Queen Mary University of London, the University of Florence, the University of Trieste, and the University of Trento, designed a robotic fingertip with a synthetic skin that reflects different colors of light in response to mechanical deformation. By reading the light reflected off the skin, the fingertip generates maps of topology, strain, and contact pressure. The team has already used the sensor to generate maps of a human fingertip, a penny, and a leaf.<\/p><p><a href=\"https://www.seresearch.qmul.ac.uk/cit/people/gsasso/\" target=\"_blank\">Giacomo Sasso<\/a>, a postdoctoral research associate in the lab of <a href=\"https://www.sems.qmul.ac.uk/staff/f.carpi/\" target=\"_blank\">Federico Carpi<\/a> at Queen Mary University of London, came up with the idea for the sensor. He had been researching optics when he stumbled upon an interesting <a href=\"https://www.nature.com/articles/s41563-022-01318-x\" target=\"_blank\">paper published in the journal <em><em>Nature<\/em><\/em><\/a>. It described the “mechanochromic material” that would eventually make up the reflector in the skin.<\/p><p>Following the method described in <em><em>Nature<\/em><\/em>, Sasso exposed a light-sensitive film to a 5-megawatt, 635-nanometer (red) laser for seven minutes. The laser beam creates an interference pattern which causes the film to polymerize in alternating densities, creating layers with different refractive indices.<\/p><p>This structure is called a <a href=\"https://spectrum.ieee.org/a-simple-filter-makes-blueemitting-oleds-give-off-white-light\" target=\"_blank\">Bragg reflector<\/a>. The alternating densities and refractive indices in the polymer cause specific wavelengths of light to be reflected. When the reflector is deformed by contact with an object, its layers are stretched, becoming thinner and reflecting light of a different wavelength. <\/p><p>It took Sasso less than a week to re-create the material in the lab. “From there, we started seeing how we could translate these color patterns into something that was useful for us,” he says. Soon, they realized that the color produced by the material was all they needed to be able to sense the topology of objects.<\/p><p>In the robotic finger, the Bragg reflector is sandwiched between a layer of silicone, which protects it from the outside, and a transparent, fingertip-shaped silicone finger with a camera and LED light embedded inside of it. <\/p><p>The light from the LED shines through the clear polymer of the finger. When the fingertip is deformed by an object, the reflector bounces light back to the camera, with wavelengths depending on the level of deformation—red for least deformation, shifting to green, and then to blue when most deformed.<\/p><p>The team also made adjustments to increase the sensitivity of the skin and help the camera to better read color differences. The silicone of the outer layer of the fingertip is colored black to increase the color contrast, allowing the camera to better translate color into the morphology. The rigidity of the camera inside the finger also enhances the deformation of the reflector, producing greater differences in reflected wavelengths.<\/p><p>After all that optimization, the finger provided 100-micrometer resolution with no <a href=\"https://spectrum.ieee.org/robot-fingers\" target=\"_blank\">computational<\/a> latency, the researchers determined.<\/p><h2>What robot fingers need<\/h2><p>Human skin takes in a variety of tactile information in order to successfully move and manipulate objects, including temperature, texture, pressure, and vibration. But engineering a robot to do the same is challenging because of spatial constraints. There often isn’t enough room in a robotic fingertip to incorporate more than one type of sensor. The question then becomes: Which type of sensor should be used?<\/p><p>“And the answer to that is…that’s a really hard question. No one knows yet,” says Walker. Carpi’s team’s robotic finger is exciting because it presents yet another option for roboticists to experiment with, Walker says.<\/p><p>Although Carpi’s team <a href=\"https://www.gelsight.com/\" target=\"_blank\">isn’t the first<\/a> to use soft materials for tactile sensing, its technology is unique because it is able to extract quantitative information about depth and size from the topologic maps it generates. According to Walker, most sensors can only generate topological maps, which reveal the relative sizes of object features.<\/p><p>To Sasso, another key advantage of this robotic finger is that it embeds tactile sensing directly into the material of the finger, rather than using taxels, or pixels that measure force or pressure at specific spatial points. <\/p><p class=\"ieee-inbody-related\">RELATED: <a href=\"https://spectrum.ieee.org/robot-fingers\" target=\"_blank\">Robot Hand Manipulates Complex Objects by Touch Alone<\/a><\/p><p>“The core aspect of the sensor is that we’re essentially [moving toward] having the sensing element at the material level,” he says. “The camera, which is a very highly optimized electronic component, is translating whatever the material is already doing directly into digital signals.” <\/p><p><a href=\"https://www.linkedin.com/in/michael-yu-wang-258a4525/\" target=\"_blank\">Michael Wang<\/a>, co-founder and chief scientist at <a href=\"https://spectrum.ieee.org/daimon-robotics-physical-ai\" target=\"_blank\">Daimon Robotics<\/a>, which, unlike Shadow Robot, primarily uses vision-based sensing, echoed Walker’s sentiment that it’s beneficial to explore new methods of sensing, which may bring unique advantages. But he also explained that soft materials often face challenges with durability, and that the significance of the team’s work would be revealed when the finger is integrated into real<a href=\"https://spectrum.ieee.org/robot-fingers\" target=\"_blank\"> robot hands<\/a>.<\/p><p>“The practical and useful benefits, especially in the context of robot hands, remain to be tested and validated,” he says.<\/p><p>When the materials of soft sensors, like the silicone in Carpi’s team’s fingertip, become eroded or damaged after repeated use, the signals measured by the sensors may not reflect objects’ topography as well. <\/p><p>“Especially if you have the electronics embedded into the material layer itself, that becomes a very challenging engineering problem. And I haven’t seen [many] good soft electronics materials that really can undergo long periods of usage,” Wang says.<\/p><p><span>However, because the Bragg reflector isn’t in direct contact with objects itself, the outer layer of silicone material acts as a protective barrier, Sasso says. The silicone can also be made more durable using certain chemical coatings, according to Wang.<\/span><\/p><p>The team has already been talking to companies that could potentially employ the new sensor. They also hope to improve the sensor so that it can sense objects that don’t lie flat on surfaces. That could open up its use in surgical instruments that require precise contact mapping of tissues and organs, Carpi says.<\/p><p>“There are significant developments that we expect with a clear path toward transition to real world applications,” he says.<\/p>"}, {"title": "Agency Tool Company wants to make OTA software updates easier", "source": "The Robot Report", "date": "2026-07-28", "url": "https://www.therobotreport.com/agency-tool-company-wants-to-make-ota-software-updates-easier/", "summary": "<p>Two Scythe co-founders are using their experience building commercial robots to create tools for robotics developers at Agency Tool Co.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/agency-tool-company-wants-to-make-ota-software-updates-easier/\">Agency Tool Company wants to make OTA software updates easier<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Powerful Compute So Compact, It’s Clutch — Build AI Anywhere With NVIDIA Jetson", "source": "NVIDIA Robotics", "date": "2026-07-28", "url": "https://blogs.nvidia.com/blog/build-ai-with-nvidia-jetson/", "summary": "As a discerning AI investor who values style and substance, Sarah Guo knows this season’s standout accessory isn’t the latest designer purse — but what’s inside it.  In a recent video, Guo, founder of AI-native venture capital firm Conviction and co-host of the AI podcast No Priors, highlighted how the NVIDIA Jetson platform for edge [&#8230;]"}, {"title": "Registration is open for RoboBusiness 2026", "source": "Robotics Business Review", "date": "2026-07-28", "url": "https://www.therobotreport.com/registration-is-open-for-robobusiness-2026/", "summary": "<p>This year, join us in October in Santa Clara to celebrate 20 years of robotics excellence at RoboBusiness 2026.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/registration-is-open-for-robobusiness-2026/\">Registration is open for RoboBusiness 2026<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "ENvue Medical develops robotic feeding tube placement system", "source": "Robotics Business Review", "date": "2026-07-28", "url": "https://www.therobotreport.com/envue-medical-develops-robotic-feeding-tube-placement-system/", "summary": "<p>ENvue Drive is designed to assist, not replace, the clinician, who retains full control of the procedure at all times.  <\/p>\n<p>The post <a href=\"https://www.therobotreport.com/envue-medical-develops-robotic-feeding-tube-placement-system/\">ENvue Medical develops robotic feeding tube placement system<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "NORD expands compact NORDAC VFD family to 200 hp", "source": "Robotics Business Review", "date": "2026-07-27", "url": "https://www.therobotreport.com/nord-expands-nordac-compact-vfd-family-to-200-hp/", "summary": "<p>NORD Drivesystems said its NORDAC PRO VFDs are adaptable to individual application requirements across industries.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/nord-expands-nordac-compact-vfd-family-to-200-hp/\">NORD expands compact NORDAC VFD family to 200 hp<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Kraken Technology raises Series B funding for autonomous vessels", "source": "Robotics Business Review", "date": "2026-07-27", "url": "https://www.therobotreport.com/kraken-technology-raises-series-b-funding-autonomous-vessels/", "summary": "<p>Kraken Technology plans to use its funding to continue developing uncrewed surface vessels and localizing manufacturing around the world.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/kraken-technology-raises-series-b-funding-autonomous-vessels/\">Kraken Technology raises Series B funding for autonomous vessels<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Magmotor makes motors for a changing world for 150+ years", "source": "Robotics Business Review", "date": "2026-07-26", "url": "https://www.therobotreport.com/magmotor-makes-motors-changing-world-150-years/", "summary": "<p>Magmotor has been providing motors for demanding use cases for decades and offers custom systems for robotics.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/magmotor-makes-motors-changing-world-150-years/\">Magmotor makes motors for a changing world for 150+ years<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Optical Tech Would Update a Robot’s AI on the Fly", "source": "IEEE Spectrum Robotics", "date": "2026-07-26", "url": "https://spectrum.ieee.org/ai-in-robotics", "summary": "<img src=\"https://spectrum.ieee.org/media-library/an-asian-man-positions-the-lens-of-an-optical-receiver-a-meter-away-from-a-beam-of-led-light-in-a-lab.jpg?id=67530602&amp;width=1200&amp;height=800&amp;coordinates=0%2C209%2C0%2C209\" /><br /><br /><p>Atop a lab bench, <a href=\"https://tech.cornell.edu/\" rel=\"noopener noreferrer\" target=\"_blank\">Cornell Tech<\/a> postdoctoral researcher <a href=\"https://www.linkedin.com/in/yifan-he-5471a1386/\" rel=\"noopener noreferrer\" target=\"_blank\">Yifan He<\/a> positions the lens of an optical receiver almost a meter away from an LED emitting a beam of red light. The computer monitor attached to the receiver takes a beat to refresh, then displays an array of squares that resemble a QR code.<\/p><p>When you hold your phone camera up to a QR code, light strikes the image sensor as only a first step to revealing the data hidden behind the black-and-white matrix. The receiver here is doing something different: directly altering its own memory using the photocurrents produced by the beamed array of light. And unlike the data behind a QR code, which might point to a simple web address, this optical code could convey the <a href=\"https://spectrum.ieee.org/sparse-ai\" target=\"_blank\">parameters of an AI model<\/a>. <\/p><p>The new receiver design, presented last month at the <a href=\"https://www.vlsisymposium.org/\" rel=\"noopener noreferrer\" target=\"_blank\">IEEE/JSAP Symposium on VLSI Technology & Circuits<\/a> in Honolulu, seeks to reduce the burden of increasing memory demands on AI systems. Shining data down onto processors could lower the energy typically required for data centers, self-driving cars, and even “edge” applications like AI-powered robots, researchers say. <\/p><p>“People are designing all sorts of different AI chips,” says <a href=\"https://www.linkedin.com/in/jae-sun-seo-21062717/\" rel=\"noopener noreferrer\" target=\"_blank\">Jae-sun Seo<\/a>, an associate professor of electrical and computer engineering at Cornell Tech, in New York City. These processors don’t often have room for all the parameters that make up AI models, so the additional data is stored in dynamic RAM (<a href=\"https://spectrum.ieee.org/stacking-chips-sideways\" target=\"_blank\">DRAM<\/a>). The electrical connections commonly used to move the data between the DRAM and the processor create cost and efficiency concerns when systems scale up. “That’s one of the major bottlenecks.” <\/p><p>Optical links move data at high bandwidth with less energy loss than metal wires, but today’s optical receivers undercut that advantage by relying on power-hungry analog circuits to convert light to electronic bits. The group’s new tech would instead receive rapid flashes of digital QR-code-like matrices so that chips can tweak model parameters without those analog circuits, enabling fully digital optical communication that would consume less energy.<\/p><p>“This is a really important problem,” says <a href=\"https://www.linkedin.com/in/dennis-sylvester-68a938/\" rel=\"noopener noreferrer\" target=\"_blank\">Dennis Sylvester<\/a>, an IEEE Fellow who chairs the <a href=\"https://umich.edu/\" rel=\"noopener noreferrer\" target=\"_blank\">University of Michigan<\/a>’s electrical and computer engineering department and was not involved in the work. “It’s got massive commercial implications. This solution is a clever way of dealing with it.”<\/p><p class=\"shortcode-media shortcode-media-rebelmouse-image\"> <img alt=\"Two Asian men standing in front of a lab desk with a receiver chip, oscilloscope and laptop displaying an optically programmable SRAM-based receiver demo.\" class=\"rm-shortcode\" id=\"b2c1d\" src=\"https://spectrum.ieee.org/media-library/two-asian-men-standing-in-front-of-a-lab-desk-with-a-receiver-chip-oscilloscope-and-laptop-displaying-an-optically-programmable.jpg?id=67530613&amp;width=980\" /> <small class=\"image-media media-caption\">Jae-sun Seo [left] and Yifan He have developed a receiver that can edit memory in response to QR-code-like arrays of light.<\/small><small class=\"image-media media-photo-credit\">Alex Music<\/small><\/p><h2>How Light “Flips” Memory to Power AI<\/h2><p>Processors have a bit of built-in static RAM (<a href=\"https://spectrum.ieee.org/sram-intel-tsmc\" target=\"_blank\">SRAM<\/a>), but not enough to allow an AI model to run independently. While SRAM is the faster of the two memory options, DRAM can store more data in the same footprint.<\/p><p>In the new system, the DRAM sits with the transmitter, and the receiver is part of the processor’s SRAM. The transmitter beams the data to the array of SRAM cells, which in this case are modified to contain photodiodes. Light hitting each photodiode creates a current to flip binary values in the SRAM. <\/p><p>Creating a link between the light and receiver requires calibration, because you can’t expect them to be perfectly aligned or perpendicular to each other. So the chip references a data frame that has information about the expected position of each pixel of data and uses that frame to ensure it can receive the real data, He says. “Ideally the best way is to have direct, point-to-point space between the transmitter and the receiver,” Seo adds, “but even if it’s slightly tilted, we have this calibration circuit.”<\/p><p>For applications in real-world settings, the researchers say they will need to build an optical transmitter that can alter the light matrix millions of times per second, transferring gigabits per second. The transmitter that I saw in He and Seo’s lab is only a proof of concept, emitting a static 14-by-14-bit matrix through a metal mask over the light. The researchers say they are working with optics research groups to build a transmitter that is capable of rapidly changing the matrix. <\/p><h2>The Future of Light-Based Memory Links<\/h2><p>Michigan’s Sylvester says that the tech in its current form is likely far from commercialization because the individual photosensitive bit cells are larger than SRAM bit cells in conventional chips. Those larger cells mean the chip can fit less memory, a trade-off that he says could cancel out the added efficiency of the light-based approach. <\/p><p>Seo says that it’s part of the group’s ongoing efforts to shrink the bit cells, which can be achieved by optimizing the size of transistors and circuits and leveraging CMOS scaling.<\/p><p>Seo and He are looking at uses for the tech in robotics and other edge applications. One example is in AI-robot-powered warehouses and factories, which could use optical data transmission to save time and energy when updating the AI models in each robot. Additionally, <a href=\"https://spectrum.ieee.org/microbots\" target=\"_self\">microrobots<\/a>, which are inherently memory-constrained due to their size, could one day benefit from the tech, though it would require a more size-conscious design.<\/p><p>“Edge AI is a big growth area, and in three, four, five years, you’re going to hear as much about that as you are with data centers, probably, as the intelligence migrates more and more into these devices that we have,” Sylvester says.<\/p>"}, {"title": "Photos: First look at J&J’s Ottava surgical robot", "source": "Robotics Business Review", "date": "2026-07-25", "url": "https://www.therobotreport.com/photos-first-look-at-jjs-ottava-surgical-robot/", "summary": "<p>The robot-in-table design is meant to save space in the operating room, with J&#038;J saying its novel architecture takes up 30-50% less space than boom-and-cart systems.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/photos-first-look-at-jjs-ottava-surgical-robot/\">Photos: First look at J&#038;J&#8217;s Ottava surgical robot<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "NEURA Robotics establishes NEURA Gym RWTH Aachen to train physical AI", "source": "Robotics Business Review", "date": "2026-07-24", "url": "https://www.therobotreport.com/neura-robotics-establishes-neura-gym-rwth-aachen-train-physical-ai/", "summary": "<p>NEURA Robotics has partnered with a German university for NEURA Gym RWTH Aachen, one of 10 facilities for training physical AI.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/neura-robotics-establishes-neura-gym-rwth-aachen-train-physical-ai/\">NEURA Robotics establishes NEURA Gym RWTH Aachen to train physical AI<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Video Friday: An Italian Humanoid Comes to Life", "source": "IEEE Spectrum Robotics", "date": "2026-07-24", "url": "https://spectrum.ieee.org/video-friday-physical-ai-robotics", "summary": "<img src=\"https://spectrum.ieee.org/media-library/humanoid-robot-with-red-armor-and-glowing-lights-stands-against-a-dark-background.png?id=67531350&amp;width=1245&amp;height=700&amp;coordinates=0%2C0%2C0%2C0\" /><br /><br /><p><span>Video Friday is your weekly selection of awesome robotics videos, collected by your friends at <\/span><em>IEEE Spectrum<\/em><span> robotics. We also post a weekly calendar of upcoming robotics events for the next few months. Please <\/span><a href=\"mailto:automaton@ieee.org?subject=Robotics%20event%20suggestion%20for%20Video%20Friday\">send us your events<\/a><span> for inclusion.<\/span><\/p><h5><a href=\"https://mrs.fel.cvut.cz/summer-school-2026/\">Summer School on Multi-Robot Systems<\/a>: 29 July–4 August 2026, PRAGUE<\/h5><h5><a href=\"https://actuate.foxglove.dev/\">Actuate 2026<\/a>: 18–19 August 2026, SAN FRANCISCO<\/h5><h5><a href=\"https://2026.ieee-iros.org/\">IROS 2026<\/a>: 27 September–1 October 2026, PITTSBURGH<\/h5><h5><a href=\"https://humanoidssummit.com/\">Humanoids Summit Seoul<\/a>: 22–23 September 2026, SEOUL<\/h5><p>Enjoy today’s videos!<\/p><div class=\"horizontal-rule\"><\/div><div><span style=\"display: none;\"> <\/span><\/div><blockquote class=\"rm-anchors\" id=\"mgf142yepjc\"><em>In just six months, our team turned GENE.01 into a fully functional humanoid platform that can walk, sense and interact. Its full-body multimodal skin perceives touch, proximity, force, and temperature, bringing Physical AI closer to safe and natural collaboration with people. Not a render. Not a concept. This is GENE.01. The future of Physical AI is taking its first steps.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://gbionics.ai/\">Generative Bionics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"iq3pccrfegq\"><em>Why create robot intelligence for just one hand, when we could have it learn from many? GEN-1, our latest embodied foundation model, now supports a broad range of end effectors from 5-finger hands, to specialized tools, and everything in between. Each hand is a different sensorimotor interface by which GEN-1 experiences the physical world. Scaling pretraining across thousands of these interfaces teaches GEN-1 a universal physical common sense that transfers to new hands and new ways to grasp, push, pull, twist, and more.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>And to illustrate this concept, a surprise spatula.<\/p><p class=\"shortcode-media shortcode-media-youtube\"> <span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://generalistai.com/blog/towards-machines-with-a-thousand-hands\">Generalist<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"gu2nuedjiuq\"><em>This paper presents the design, fabrication, and flight validation of a flat-packable <a href=\"https://spectrum.ieee.org/foldable-airplane-could-ride-a-cubesat-to-mars-in-2022\" target=\"_blank\">flying wing<\/a> built primarily from corrugated cardboard. The aircraft is manufactured from three laser-cut sheets and assembled through a fold-and-lock architecture that forms load-bearing wing structures with minimal tooling and no permanent fasteners. The full airframe can be assembled in under 15 minutes, demonstrating strong potential for rapid deployment, low-cost logistics, and scalable field use.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://airlab.sutd.edu.sg/\">AIR Lab<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"hukrzo75_ww\">A $14,000 open-source data-collection system that includes beat-down capability.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://github.com/haraduka/mevion\">MEVION<\/a> ]<\/p><p>Thanks, Kento!<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"qzr0rmp2_5w\"><em>Together with Niantic Spatial and Nvidia, [we] can now scan a real deployment site with off-the-shelf hardware, reconstruct it into a photorealistic Gaussian splat, and run massively parallel RL [<a href=\"https://spectrum.ieee.org/ai-institute\" target=\"_blank\">reinforcement learning<\/a>] training. The policies trained in our Gym environment then transfer zero-shot to the real robot and environments they were trained for. This enables faster deployment of more capable and robust policies for the end user.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://flexion.ai/news/niantic-spatial-flexion-and-nvidia-closing-the-sim2real-gap-for-humanoids\">Flexion<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"w2bmy5cnhvs\">I don’t know why, but the version of Tron 2 with the stubby little legs is just adorable.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.limxdynamics.com/en/products/tron2\">LimX Dynamics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"vmgiim6g_fg\">Uh, get a real job already...?<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.pndbotics.com/\">PNDbotics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"xtggy9lrisw\">Well, I guess we can all stop asking what humanoid robots are good for.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://en.engineai.com.cn/\">EngineAI<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"143b_pm77ga\">I think the right thing to do here is only post the disclaimer included with this video: “This film is a conceptual creative production, and certain scenes are presented for demonstration purposes only and do not represent the actual in-store operating process. The final store environment, robot appearance, and functionality are subject to the actual deployment. During actual operations, the robot will autonomously perform only designated preparation steps for specified ice cream products, and its hands will be fitted with protective gloves that comply with applicable food safety requirements.”<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.sharpa.com/pages/north-at-work\">Sharpa<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"h_ztrvhjv8k\"><em><a href=\"https://spectrum.ieee.org/in-the-air-with-ziplines-medical-delivery-drones\" target=\"_blank\">Drone delivery<\/a> is now an essential part of the South West London Pathology (SWLP) modernization agenda. Since February 2026, our highly automated aircraft have been delivering urgent NHS samples across south west London, with service up to 85% faster than ground transport. We are thrilled to be part of this initiative, supporting clinicians in providing timely, effective care for patients and contributing to a greener, more resilient NHS.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://wing.com/news/elevating-healthcare-logistics-wing-apian-nhs-south-west-london-drone-deliveries\">Wing<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"tzpswti20e8\"><em>Take a closer look at what’s next for the Aurora Driver. Designed to move freight farther, faster, and more efficiently, this next generation of the Aurora Driver delivers greater performance, built to last one million miles and cut hardware cost in half. <\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://aurora.tech/newsroom/your-questions-about-our-latest-driverless-launch-answered\">Aurora<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"gj4p0pc6kwc\"><em>How does a robot learn to recognize an object it’s never encountered? In this case, a demo can be worth a thousand words. Short human demonstrations can be used to create fully automated training datasets, sidestepping the prompting limitations that hold back vision-language models. Rather than describing objects with language, the system tracks what a person touches and manipulates during a demo, follows those objects through time, and clusters detections to handle objects merging or splitting apart in the scene. This bypasses a core weakness of VLMs, which struggle to reliably detect unusual or novel objects even with repeated, carefully engineered prompts.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://rai-inst.com/resources/blog/show-dont-tell-detecting-novel-objects-by-watching-human-demonstrations/\">Robotics and AI Institute<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div>"}], "embeddedNews": [{"title": "Claude Plays DOOM", "source": "Hackaday", "date": "2026-08-26", "url": "https://hackaday.com/2026/08/26/claude-plays-doom/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"450\" src=\"https://hackaday.com/wp-content/uploads/2026/08/🤖-Claude-Sonnet-plays-DOOM-on-an-ESP32-P4-0-54-screenshot.png?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>Large language models (LLMs) are generally thought of as machines that accept textual prompts and spit out textual content. However, if you&#8217;re creative in the way you interface with them, <a class=\"read-more\" href=\"https://hackaday.com/2026/08/26/claude-plays-doom/\">&#8230;read more<\/a>"}, {"title": "New Controller Makes Heavy Machinery Intuitive", "source": "Hackaday", "date": "2026-08-26", "url": "https://hackaday.com/2026/08/26/new-controller-makes-heavy-machinery-intuitive/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"533\" src=\"https://hackaday.com/wp-content/uploads/2026/08/excavator-controller-main.jpg?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>As children, many of us looked wistfully into the cockpits of heavy machinery, wondering just how the series of knobs and levers would do something like operate a bulldozer, crane, <a class=\"read-more\" href=\"https://hackaday.com/2026/08/26/new-controller-makes-heavy-machinery-intuitive/\">&#8230;read more<\/a>"}, {"title": "Blow Those Pyros With A Telephone!", "source": "Hackaday", "date": "2026-08-26", "url": "https://hackaday.com/2026/08/25/blow-those-pyros-with-a-telephone/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"450\" src=\"https://hackaday.com/wp-content/uploads/2026/08/pyro-phone-featured.jpg?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>A pyrotechnic charge is set off by passing a high voltage through a filament within it, melting the filament and igniting the charge. We could think of a variety of <a class=\"read-more\" href=\"https://hackaday.com/2026/08/25/blow-those-pyros-with-a-telephone/\">&#8230;read more<\/a>"}, {"title": "Cheap AI Token Resellers: The Secret Ingredient is Fraud", "source": "Hackaday", "date": "2026-08-26", "url": "https://hackaday.com/2026/08/25/cheap-ai-token-resellers-the-secret-ingredient-is-fraud/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"484\" src=\"https://hackaday.com/wp-content/uploads/2019/03/botnet.jpg?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>[Matt Lenhard] has an interesting writeup explaining exactly how fraudsters offer access to cutting-edge AI models at a tenth of the price. Perhaps unsurprisingly, the secret is to get tokens <a class=\"read-more\" href=\"https://hackaday.com/2026/08/25/cheap-ai-token-resellers-the-secret-ingredient-is-fraud/\">&#8230;read more<\/a>"}, {"title": "Banana Pi BPI-AI2N – A Renesas RZ/V2N-based SoM and carrier board for Vision AI applications", "source": "CNX Software", "date": "2026-08-26", "url": "https://www.cnx-software.com/2026/08/26/banana-pi-bpi-ai2n-a-renesas-rz-v2n-based-som-and-carrier-board-for-vision-ai-applications/", "summary": "<div><img alt=\"Banana Pi BPI-AI2N Renesas RZ/V2N SoM and carrier board\" class=\"attachment-medium size-medium wp-post-image\" height=\"481\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/08/Banana-Pi-BPI-AI2N-Renesas-RZ-V2N-som-carrier-board-720x481.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Banana Pi BPI-AI2N is a system-on-module (SoM) powered by a Renesas RZ/V2N quad-core Cortex-A55 microprocessor with a 15 TOPS (sparse) DRP-AI3 accelerator for Vision AI workloads. The module features 8GB LPDDR4x, 32GB eMMC flash, 64MB SPI flash, two Gigabit Ethernet controllers, a PMIC, and exposes all I/Os through a 260-pin SO-DIMM connector. The company also provides a Jetson Nano-inspired carrier board with a MIPI DSI connector, two MIPI CSI connectors, two GbE RJ45 ports, two USB 3.0 ports, an M.2 socket for NVMe SSD storage, a 40-pin GPIO header, and more. Banana Pi BPI-AI2N-Core SoM specifications: SoC &#8211; Renesas RZ/V2N CPU Quad-core Arm Cortex-A55 @ 1.8 GHz Arm Cortex-M33 @ 200 MHz GPU – Arm Mali-G31 3D graphics engine (GE3D) with OpenGL ES 3.2 and OpenCL 2.0 FP VPU – Encode &#38; decode H.264 – Up to 1920×1080 @ 60 fps (Renesas specs, but SOMDEVICES also mentions up to 4K @ [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/08/26/banana-pi-bpi-ai2n-a-renesas-rz-v2n-based-som-and-carrier-board-for-vision-ai-applications/\">Banana Pi BPI-AI2N &#8211; A Renesas RZ/V2N-based SoM and carrier board for Vision AI applications<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Nvidia unleashes robotics computer set for entry level edge AI", "source": "Electronics Weekly", "date": "2026-08-26", "url": "https://www.electronicsweekly.com/news/products/bus-systems-sbcs/nvidia-unleashes-robotics-computer-set-for-entry-level-edge-ai-2026-08/", "summary": "<p>The Jetson Orin Nano 2 is the company&#8217;s upgrade to its Jetson Orin Nano Super computer, with twice the inference performance of the earlier Super model. The entry level robotics [&#8230;]<\/p>\n<p>The post <a href=\"https://www.electronicsweekly.com/news/products/bus-systems-sbcs/nvidia-unleashes-robotics-computer-set-for-entry-level-edge-ai-2026-08/\">Nvidia unleashes robotics computer set for entry level edge AI<\/a> appeared first on <a href=\"https://www.electronicsweekly.com\">Electronics Weekly<\/a>.<\/p>"}, {"title": "Redwire launches Seeker navigation sensors and space cameras", "source": "Electronics Weekly", "date": "2026-08-26", "url": "https://www.electronicsweekly.com/news/products/sensors-products/redwire-launches-seeker-navigation-sensors-and-space-cameras-2026-08/", "summary": "<p>Redwire, the aerospace and defence company, has announced the launch of its Seeker product line of navigation sensors and space cameras. They include a 5MP space-rated camera, a high-accuracy star [&#8230;]<\/p>\n<p>The post <a href=\"https://www.electronicsweekly.com/news/products/sensors-products/redwire-launches-seeker-navigation-sensors-and-space-cameras-2026-08/\">Redwire launches Seeker navigation sensors and space cameras<\/a> appeared first on <a href=\"https://www.electronicsweekly.com\">Electronics Weekly<\/a>.<\/p>"}, {"title": "SpaceX to build $100bn Starship launch site in Louisiana", "source": "Electronics Weekly", "date": "2026-08-26", "url": "https://www.electronicsweekly.com/news/business/spacex-to-build-starship-launch-site-in-louisiana-2026-08/", "summary": "<p>Yesterday SpaceX said it would build a $100 billion Starship rocket launch site on Pecan Island (pictured) in southern Louisiana. Elon Musk said it  would be “the biggest launch site [&#8230;]<\/p>\n<p>The post <a href=\"https://www.electronicsweekly.com/news/business/spacex-to-build-starship-launch-site-in-louisiana-2026-08/\">SpaceX to build $100bn Starship launch site in Louisiana<\/a> appeared first on <a href=\"https://www.electronicsweekly.com\">Electronics Weekly<\/a>.<\/p>"}, {"title": "BYD is BEV global leader with Tesla No.2", "source": "Electronics Weekly", "date": "2026-08-26", "url": "https://www.electronicsweekly.com/news/business/byd-is-global-leader-in-bevs-with-tesla-no-2-2026-08/", "summary": "<p>BYD  rega ntum-adoption-tie-up-for-formationq-and-hartree-centre-2026-08/", "summary": "<p>FormationQ and the Hartree Centre, part of the Science and Technology Facilities Council (STFC) and UK Research and Innovation (UKRI), have partnered  to accelerate the adoption of advanced quantum computing [&#8230;]<\/p>\n<p>The post <a href=\"https://www.electronicsweekly.com/news/business/quantum-adoption-tie-up-for-formationq-and-hartree-centre-2026-08/\">Quantum adoption tie-up for FormationQ and Hartree Centre<\/a> appeared first on <a href=\"https://www.electronicsweekly.com\">Electronics Weekly<\/a>.<\/p>"}, {"title": "Top Ten Semiconductor Companies in Q2", "source": "Electronics Weekly", "date": "2026-08-26", "url": "https://www.electronicsweekly.com/blogs/mannerisms/ten-best/top-ten-semiconductor-companies-in-q2-2026-08/", "summary": "<p>NVIDIA USA $125.7 Billion AI GPUs &#38; Data Center Accelerators Samsung Electronics South Korea $72.7 Billion (Memory/DS Division) DRAM, NAND Flash, &#38; Logic Chips TSMC Taiwan $69.3 Billion (Pure Foundry [&#8230;]<\/p>\n<p>The post <a href=\"https://www.electronicsweekly.com/blogs/mannerisms/ten-best/top-ten-semiconductor-companies-in-q2-2026-08/\">Top Ten Semiconductor Companies in Q2<\/a> appeared first on <a href=\"https://www.electronicsweekly.com\">Electronics Weekly<\/a>.<\/p>"}, {"title": "Reject Fluid Simulations, Return To Rheoscopic Fluid", "source": "Hackaday", "date": "2026-08-25", "url": "https://hackaday.com/2026/08/25/reject-fluid-simulations-return-to-rheoscopic-fluid/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"450\" src=\"https://hackaday.com/wp-content/uploads/2026/08/rheoscopic-sim-feat.jpg?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>Fluid simulations are one of the &#8220;killer apps&#8221; of high-performance computing, but if you can&#8217;t afford the performance, they can take a depressingly long time to run. Depending on your <a class=\"read-more\" href=\"https://hackaday.com/2026/08/25/reject-fluid-simulations-return-to-rheoscopic-fluid/\">&#8230;read more<\/a>"}, {"title": "Native SMB3 Client Brings Modern NAS Access To 20-Year-Old PowerPC Macs", "source": "Hackaday", "date": "2026-08-25", "url": "https://hackaday.com/2026/08/25/native-smb3-client-brings-modern-nas-access-to-20-year-old-powerpc-macs/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"450\" src=\"https://hackaday.com/wp-content/uploads/2020/06/apple-hardware-featured.jpg?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>As software updates cease for operating systems, they eventually begin to lose access to parts of the LAN and internet due to out of date encryption features, as well as <a class=\"read-more\" href=\"https://hackaday.com/2026/08/25/native-smb3-client-brings-modern-nas-access-to-20-year-old-powerpc-macs/\">&#8230;read more<\/a>"}, {"title": "AI Book Scanning: Just What Is A Rare Book?", "source": "Hackaday", "date": "2026-08-25", "url": "https://hackaday.com/2026/08/25/ai-book-scanning-just-what-is-a-rare-book/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"450\" src=\"https://hackaday.com/wp-content/uploads/2026/08/rare-book-featured.jpg?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>One of the stories of the last few weeks has been that AI companies have been scanning books in very large numbers in order to train their models with content <a class=\"read-more\" href=\"https://hackaday.com/2026/08/25/ai-book-scanning-just-what-is-a-rare-book/\">&#8230;read more<\/a>"}, {"title": "Lantronix Open-M 720G/520G – Ultra-compact LGA system-on-modules based on MediaTek Genio 720 and Genio 520 SoCs", "source": "CNX Software", "date": "2026-08-25", "url": "https://www.cnx-software.com/2026/08/26/lantronix-open-m-720g-520g-ultra-compact-lga-system-on-module-based-on-mediatek-genio-720-and-genio-520-socs/", "summary": "<div><img alt=\"Lantronix Open M-520G and Open-M 720G\" class=\"attachment-medium size-medium wp-post-image\" height=\"385\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/08/Lantronix-Open-M-520G-720G-720x385.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Lantronix Open-M 720G and 520G are compact (43x44mm) LGA system-on-modules (SoM) powered by 6nm MediaTek Genio 720 and Genio 520 SoCs, offering an AI performance of 10 TOPS, and designed for Edge IoT applications running low-power Vision AI and GenAI tasks. The Genio 720 dual-camera module ships with 8GB LPDDR5 and the Genio 520 single-camera module with 4GB LPDDR5. Both offer 128GB UFS storage, Gigabit Ethernet, optional WiFi 6 and Bluetooth 5.3 connectivity, dual display support, audio inputs/outputs, USB 3.2/2.0 interfaces, PCIe Gen2 x1, and more. Lantronix Open-M 720G/520G specifications: SoC (one or the other) MediaTek Genio 520 (MT8371) CPU – 2x Cortex-A78 up to 2.2GHz,  6x Cortex-A55 up to 2.0 GHz GPU – Arm Mali-G57 MC2 up to 880 MHz VPU Video Decode – Up to 1920 x 1200 @ 60fps Video Encode – Up to 1920 x 1200 @ 60fps ISP – 1x ISP NPU – NPU850 AI accelerator [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/08/26/lantronix-open-m-720g-520g-ultra-compact-lga-system-on-module-based-on-mediatek-genio-720-and-genio-520-socs/\">Lantronix Open-M 720G/520G &#8211; Ultra-compact LGA system-on-modules based on MediaTek Genio 720 and Genio 520 SoCs<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "$299 Arduino Ventuno Q SBC combines Qualcomm Dragonwing IQ8 SoC and STM32H5 MCU", "source": "CNX Software", "date": "2026-08-25", "url": "https://www.cnx-software.com/2026/08/25/299-arduino-ventuno-q-sbc-combines-qualcomm-dragonwing-iq8-soc-and-stm32h5-mcu/", "summary": "<div><img alt=\"Arduino Ventuno Q\" class=\"attachment-medium size-medium wp-post-image\" height=\"480\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/08/Arduino-Ventuno-Q-720x480.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>The Arduino Ventuno Q is a single board computer pairing a Qualcomm Dragonwing IQ8 (IQ-8275) octa-core Edge AI SoC with an STM32H5F5 Arm Cortex-M33 microcontroller for real-time I/Os. First introduced at Embedded World 2026, the Ventuno Q is the second Qualcomm-based Arduino board after the Arduino UNO Q launched in October 2025. It&#8217;s quite a different beast with a larger design featuring 16GB LPDDR5, 64GB eMMC flash, an M.2 socket for NVMe storage, 2.5GbE and Wi-Fi 6 networking, a 4K-capable HDMI output, and two USB 3.2 ports, while still offloading real-time I/O to a Cortex-M33 microcontroller. Arduino Ventuno Q (ABX00181) specifications: SoC  &#8211; Qualcomm Dragonwing IQ8 (IQ-8275, also known as QCS8275): CPU &#8211; Octa-core Kryo Gen 6 (Arm Cortex-A78/A55) processor GPU &#8211; Adreno A623 AI accelerator -Hexagon Tensor AI Processor (NPU) up to 40 dense TOPS ISP &#8211; Qualcomm Spectra 692/690 ISP Microcontroller (MCU) &#8211; STMicro STM32H5F5 CPU core &#8211; [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/08/25/299-arduino-ventuno-q-sbc-combines-qualcomm-dragonwing-iq8-soc-and-stm32h5-mcu/\">$299 Arduino Ventuno Q SBC combines Qualcomm Dragonwing IQ8 SoC and STM32H5 MCU<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Firehat is an open-source FireWire DV capture HAT for SBCs with Raspberry Pi PCIe FFC connector (Crowdfunding)", "source": "CNX Software", "date": "2026-08-25", "url": "https://www.cnx-software.com/2026/08/25/firehat-open-source-firewire-dv-capture-hat-pcie-sbc-raspberry-pi-5-radxa-rock-2f/", "summary": "<div><img alt=\"Firehat A compact FireWire DV capture HAT for single board computers\" class=\"attachment-medium size-medium wp-post-image\" height=\"480\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/08/Firehat-A-compact-FireWire-DV-capture-HAT-for-single-board-computers-720x480.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Computer Equipment Group has launched the Firehat, an open-source FireWire HAT that adds a native IEEE 1394 / i.LINK / DV port to SBCs with a Raspberry Pi PCIe FFC connector like the Pi 5 or the Radxa ROCK 2F. Built around a VIA VT6315N controller, the Firehat provides a modern way to capture footage from MiniDV, Digital8, DVCAM, DVCPRO, and HDV camcorders. It lets users connect compatible cameras or decks to an SBC and record the original digital DV stream directly to local storage, without legacy computers or discontinued FireWire capture cards. Firehat specifications: Compatibility – Radxa ROCK 2F, Raspberry Pi 5, and other SBCs that expose PCIe over an FPC connector (or via adapter) Controller – VIA VT6315N FireWire / IEEE 1394 controller Display – 1.3-inch monochrome OLED display onboard Camera input port – 6-pin FireWire/i.LINK/DV port Host interface PCIe 2.0 FFC connector for video 40-pin Raspberry Pi [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/08/25/firehat-open-source-firewire-dv-capture-hat-pcie-sbc-raspberry-pi-5-radxa-rock-2f/\">Firehat is an open-source FireWire DV capture HAT for SBCs with Raspberry Pi PCIe FFC connector (Crowdfunding)<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Advantech AOM-6741 AI Vision SMARC module features 100 TOPS Qualcomm IQ-9075 SoC, up to 36 GB LPDDR5", "source": "CNX Software", "date": "2026-08-25", "url": "https://www.cnx-software.com/2026/08/25/advantech-aom-6741-qualcomm-iq-9075-smarc-module/", "summary": "<div><img alt=\"Advantech AOM-6741\" class=\"attachment-medium size-medium wp-post-image\" height=\"432\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/08/Advantech-AOM-6741-720x432.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Advantech AOM-6741 is a SMARC 2.2 Full Size module powered by a Qualcomm Dragonwing IQ-9075 octa-core SoC with up to 100 TOPS (INT8) of AI performance, up to 36 GB LPDDR5 memory, and 128GB UFS storage. The module also features two MIPI DSI connectors, at least one MIPI CSI connector, and exposes all I/Os through a standard 314-pin MXM 3.0 edge connector, including four DisplayPort interfaces, dual 2.5GbE, two USB 3.2 Gen2, PCIe Gen3 x2 and x4 interfaces, and more. With support for up to 16 concurrent cameras, the OAM-06741 SoM mainly targets industrial-grade vision intelligence applications. Advantech AOM-6741 specifications: SoC – Qualcomm DragonWing IQ-9075 CPU Octa-core Kryo Gen 6 (Cortex-A78C-based) application cores @ up to 3.2 GHz (according to Advantech, conflicts with earlier announcements mentioning up to 2.36 GHz) Quad-core Cortex-R52 real-time cores @ up to 1.85GHz GPU – Adreno 663 GPU delivering up to 1.2 TFLOPS FP32 with secure [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/08/25/advantech-aom-6741-qualcomm-iq-9075-smarc-module/\">Advantech AOM-6741 AI Vision SMARC module features 100 TOPS Qualcomm IQ-9075 SoC, up to 36 GB LPDDR5<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Nvidia Unveils Jetson Orin Nano 2 for Robotics and Edge AI", "source": "Embedded.com", "date": "2026-08-25", "url": "https://www.embedded.com/nvidia-unveils-jetson-orin-nano-2-for-robotics-and-edge-ai/", "summary": "<p>Nvidia claims to redefine entry-level edge AI with the launch of the Jetson Orin Nano 2 robotics computer, making frontier-class AI models available to millions of developers. Advancing generative AI at the edge, the new AI supercomputer targets applications such as robots, delivery and inspection drones, and vision AI systems that need small, energy-efficient robotics [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/nvidia-unveils-jetson-orin-nano-2-for-robotics-and-edge-ai/\">Nvidia Unveils Jetson Orin Nano 2 for Robotics and Edge AI<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "Why Sensor Fusion Matters for Drone Navigation and Detection", "source": "Embedded.com", "date": "2026-08-25", "url": "https://www.embedded.com/why-sensor-fusion-matters-for-drone-navigation-and-detection/", "summary": "<p>A variety of sensors are used on drones for spatial awareness, terrain and target mapping, obstacle navigation, and optimizing flight paths to the target. Anti-drone defense systems similarly rely on many sensors for detection, flight-path tracking, and drone classification. Each sensor has its strengths and weaknesses. Sensor fusion involves merging the multiple sensor data input [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/why-sensor-fusion-matters-for-drone-navigation-and-detection/\">Why Sensor Fusion Matters for Drone Navigation and Detection<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "Viavi Vertex 6.0 Targets 6G and Wi-Fi 7/8 RF Testing", "source": "Embedded.com", "date": "2026-08-25", "url": "https://www.embedded.com/viavi-vertex-6-0-targets-6g-and-wi-fi-7-8-rf-testing/", "summary": "<p>Viavi Solutions has introduced Vertex 6.0, an enhanced version of its channel emulation platform designed to reproduce real-world RF propagation conditions in laboratory environments. The new platform targets next-generation cellular, Wi-Fi, military, and aerospace technologies and is well-positioned to test emerging 6G and Wi-Fi 7/8 systems. Vertex 6.0 provides 400 MHz of instantaneous bandwidth and [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/viavi-vertex-6-0-targets-6g-and-wi-fi-7-8-rf-testing/\">Viavi Vertex 6.0 Targets 6G and Wi-Fi 7/8 RF Testing<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "CHIIPS #38 – CHIIPs with John Weil of endly interconnect for analog telephones. It’s like a little phone company in a box that fits on your desk. If you’re new here, the goal is to design a from-scratch, modular, hobbyist-friendly interconnect for analog telephones. It’s like a little phone company in a box that [&#8230;]"}, {"title": "San Francisco’s Exploratorium turns STEM learning into hands-on play", "source": "Adafruit", "date": "2026-08-25", "url": "https://blog.adafruit.com/2026/08/25/san-franciscos-exploratorium-turns-stem-learning-into-hands-on-play/", "summary": "On Pier 15 in San Francisco is the Exploratorium, looking out onto the Bay that characterizes a city equally defined by art and culture as it is by technological prowess. This is a museum, but not one with pieces that hang on the walls only to be observed with the eyes. It’s a didactic playground [&#8230;]"}, {"title": "WeatherPaper: a smart weather station using an e-paper display", "source": "Adafruit", "date": "2026-08-25", "url": "https://blog.adafruit.com/2026/08/25/weatherpaper-a-smart-weather-station-using-an-e-paper-display/", "summary": "WeatherPaper is a health and comfort-focused smart weather station designed around a 4.2-inch e-paper display and a custom PCB. It lasts over a year and a half on a single charge. Features 500 Days Battery Life: WiFi fetching uptime cuts to a fraction of a second, driven by aggressive power management in software optimisation and firmware [&#8230;]"}, {"title": "libtmt – a simple terminal emulation library", "source": "Adafruit", "date": "2026-08-25", "url": "https://blog.adafruit.com/2026/08/25/libtmt-a-simple-terminal-emulation-library/", "summary": "libtmt is Rob King&#8217;s Tiny Mock Terminal Library. It provides emulation of a classic smart text terminal, by maintaining an in-memory screen image. Sending text and command sequences to libtmt causes it to update this in-memory image, which can then be examined and rendered however the user sees fit. The imagined primary goal for libtmt [&#8230;]"}, {"title": "DuckDuckGo survey highlights how much personal information users share with AI", "source": "Adafruit", "date": "2026-08-25", "url": "https://blog.adafruit.com/2026/08/25/duckduckgo-survey-highlights-how-much-personal-information-users-share-with-ai/", "summary": "Private search company DuckDuckGo has released a new survey highlighting just how much personal information people are sharing with AI chatbots, and how little many understand about what happens to those conversations. Here are the details. DuckDuckGo highlights several privacy-related aspects around how people use AI chatbots, including the fact that nearly one in three [&#8230;]"}, {"title": "The Art and Beauty of Blade Runner  #ArtTuesday", "source": "Adafruit", "date": "2026-08-25", "url": "https://blog.adafruit.com/2026/08/25/the-art-and-beauty-of-blade-runner/", "summary": "T.R. Napper&#8217;s popular article on the art and beauty of Blade Runner is a classic. Currently 404 on the official site, it is still available on the Internet Archive Wayback Machine. Blade Runner is one of the most visually haunting and memorable movies in the history of cinema. It has inspired art, and is a [&#8230;]"}, {"title": "World Humanoid Robot Games", "source": "Adafruit", "date": "2026-08-25", "url": "https://blog.adafruit.com/2026/08/25/world-humanoid-robot-games/", "summary": "Are you following the action sports of the World Humanoid Robot Games. Coming out of Beijing for the second year in a row, the events set humanoid robots into human-like events. Sometimes comical and sometimes frightening, the 2,000 robots competing from 16 countries are breaking records. The Tiangong Ultra ran the 100 meter in 8.86 [&#8230;]"}, {"title": "How Europe is killing makers and micro-entrepreneurs", "source": "Adafruit", "date": "2026-08-25", "url": "https://blog.adafruit.com/2026/08/25/how-europe-is-killing-makers-and-micro-entrepreneurs/", "summary": "European Union&#8217;s new packaging rules threaten to kill the world of makers and micro-entrepreneurs, putting jobs, livelihoods and an entire ecosystem of innovation at risk. Lectronz is a marketplace for open-source hardware makers and DIY electronics. Most of their sellers are not factories or well-funded startups. They are engineers, independent designers, and hardware enthusiasts working [&#8230;]"}, {"title": "JP’s Product Pick of the Week — New Earlier Time!! 3pm Eastern TODAY 8/25/26 and Beyond! @adafruit #adafruit #newproductpick", "source": "Adafruit", "date": "2026-08-25", "url": "https://blog.adafruit.com/2026/08/25/jps-product-pick-of-the-week-new-earlier-time-3pm-eastern-today-8-25-26-and-beyond-adafruit-adafruit-newproductpick/", "summary": "Product Picks come earlier now! One hour earlier in fact. Come on by for JP&#8217;s Product Pick of The Week ! A new product pick will be revealed. The show airs at 3pm ET / 12pm PT We&#8217;re making changes to some show schedules at Adafruit, so this will be the new time slot for [&#8230;]"}, {"title": "os8088 spotlight: new programs and features", "source": "Adafruit", "date": "2026-08-25", "url": "https://blog.adafruit.com/2026/08/25/os8088-spotlight-new-programs-and-features/", "summary": "os8088 new items: what was added, what it does, screenshots of it running on an Intel 8086, and the video that goes with it, by Jorge Gonzalez. os8088 now fetches real web pages and lays them out as text and tables, over an Ethernet card or a parallel cable to a DOS machine standing next [&#8230;]"}, {"title": "Buzzing Mindfulness Bracelet #AdafruitLearnSystem", "source": "Adafruit", "date": "2026-08-25", "url": "https://blog.adafruit.com/2026/08/25/buzzing-mindfulness-bracelet-adafruitlearnsystem/", "summary": "This guide was written for the Gemma board, but can be done with either the v1, v2 or Gemma M0. We recommend the Gemma M0 as it is easier to use and is more compatible with modern computers! Build yourself a buzzing bracelet for subtle haptic feedback as time passes! It&#8217;s great for reminding yourself [&#8230;]"}, {"title": "EX-i SFC3000 Flow Computer Brings Advanced Flow Measurement to Water and Energy Applications", "source": "EE Journal", "date": "2026-08-25", "url": "https://www.eejournal.com/industry_news/ex-i-sfc3000-flow-computer-brings-advanced-flow-measurement-to-water-and-energy-applications/", "summary": "The EX-i Flow Measurement Ltd  SFC3000 Flow Computer has many applications across the water, utilities and process industries, where accurate measurement of liquid and steam flows is increasingly important for managing both resources and energy. Water is a critical resource in many parts of the world, and in industrial applications it can also be considered an effective &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/ex-i-sfc3000-flow-computer-brings-advanced-flow-measurement-to-water-and-energy-applications/\">Read More &#8594;<span class=\"screen-reader-text\"> \"EX-i SFC3000 Flow Computer Brings Advanced Flow Measurement to Water and Energy Applications\"<\/span><\/a>"}, {"title": "Infineon acquires C2i Semiconductors to expand its innovation capabilities in AI data center power management solutions", "source": "EE Journal", "date": "2026-08-25", "url": "https://www.eejournal.com/industry_news/infineon-acquires-c2i-semiconductors-to-expand-its-innovation-capabilities-in-ai-data-center-power-management-solutions/", "summary": "Acquisition strengthens Infineon’s leadership in power solutions for AI data centers and accelerates software-defined power architectures from grid to core C2i Semiconductors adds highly differentiated expertise in intelligent digital power management, multiphase controllers and system-level power architectures especially for vertical power delivery including Substrate Integrated Voltages Regulators (SIVR) Transaction expands Infineon’s innovation footprint in India &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/infineon-acquires-c2i-semiconductors-to-expand-its-innovation-capabilities-in-ai-data-center-power-management-solutions/\">Read More &#8594;<span class=\"screen-reader-text\"> \"Infineon acquires C2i Semiconductors to expand its innovation capabilities in AI data center power management solutions\"<\/span><\/a>"}, {"title": "Hirose Announces Commercial Availability of its Compact, 1000V Wire-to-Board Connector for Automotive Powertrains", "source": "EE Journal", "date": "2026-08-25", "url": "https://www.eejournal.com/industry_news/hirose-announces-commercial-availability-of-its-compact-1000v-wire-to-board-connector-for-automotive-powertrains/", "summary": "Hirose has announced the commercial availability of its high-voltage ZE150HV Series wire-to-board connector. Ideal for electric vehicle (EV) and hybrid electric vehicle (HEV) powertrains, the connector features a 4.5 mm pitch and supports 1000V AC/DC, 10A per pin, and operating temperatures up to 125°C. Engineered to meet IEC 60664 standards (Pollution Degree 2, altitude 6,000m), &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/hirose-announces-commercial-availability-of-its-compact-1000v-wire-to-board-connector-for-automotive-powertrains/\">Read More &#8594;<span class=\"screen-reader-text\"> \"Hirose Announces Commercial Availability of its Compact, 1000V Wire-to-Board Connector for Automotive Powertrains\"<\/span><\/a>"}, {"title": "IDS’s Nion 3D ToF camera goes into series production", "source": "EE Journal", "date": "2026-08-25", "url": "https://www.eejournal.com/industry_news/idss-nion-3d-tof-camera-goes-into-series-production/", "summary": "IDS Imaging Development Systems GmbH is expanding its 3D portfolio with Nion, an industrial ToF camera featuring 1.2-megapixel resolution and integrated depth processing. It provides high-resolution and temporally stable depth information at 30 fps, even during rapid movements and in changing lighting conditions. This makes it suitable for applications such a
