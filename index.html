ical AI Toolchain for robotics<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "SafeWorld emerges from stealth to build, deploy robot safety simulation technologies", "source": "Robotics Business Review", "date": "2026-10-08", "url": "https://www.therobotreport.com/safeworld-emerges-stealth-build-deploy-robot-safety-simulation-technologies/", "summary": "<p>SafeWorld’s platform provides testing and simulation software to help enterprises evaluate and deploy robots safely and responsibly.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/safeworld-emerges-stealth-build-deploy-robot-safety-simulation-technologies/\">SafeWorld emerges from stealth to build, deploy robot safety simulation technologies<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "HiPHI: A Large-Scale Benchmark for High-Precision Human Motion and Object Interaction", "source": "IEEE Spectrum Robotics", "date": "2026-10-07", "url": "https://content.knowledgehub.wiley.com/hiphi-a-large-scale-benchmark-for-high-precision-human-motion-and-object-interaction/", "summary": "<img src=\"https://spectrum.ieee.org/media-library/noitom-robotics-logo-with-stylized-nr-monogram-on-transparent-background.png?id=68382308&amp;width=980\" /><br /><br /><p><span>This White Paper gives robotics researchers and engineers an overview of a new large-scale motion capture dataset built to close the data gap limiting humanoid robot learning. It also shows how policies trained on the dataset transfer to a real humanoid robot.<\/span><\/p><p><strong>What you will learn about: <\/strong><\/p><ul><li>Why humanoid robot learning, a central problem in embodied AI and Physical AI, needs data that internet video and existing motion capture datasets cannot provide. <\/li><li><span><span>How <\/span><span>FrameNet<\/span><span>, a linguistic framework for human action, can guide motion capture collection to systematically cover a broad range of whole-body motion.<\/span><\/span> <\/li><li><span><span>Why synchronized object trajectories and meshes make human-object interaction data useful for teaching <\/span><span>robots<\/span> real-world tasks such as carrying, pushing, and pulling.<\/span> <\/li><li><span>How reinforcement learning policies trained on this motion capture data improve with scale, and how sim-to-real transfer carries them onto a physical humanoid robot.<\/span><\/li><\/ul><div><a href=\"https://content.knowledgehub.wiley.com/hiphi-a-large-scale-benchmark-for-high-precision-human-motion-and-object-interaction/\" target=\"_blank\">Download this free whitepaper now!<\/a><\/div>"}, {"title": "Teradyne Robotics, Elite Robots settle cobot dispute", "source": "Robotics Business Review", "date": "2026-10-07", "url": "https://www.therobotreport.com/terayne-robotics-elite-robots-settle-cobot-dispute/", "summary": "<p>Teradyne Robotics and Elite Robots have settled their software dispute, ending the legal case without disclosing the terms of the agreement.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/terayne-robotics-elite-robots-settle-cobot-dispute/\">Teradyne Robotics, Elite Robots settle cobot dispute<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Harmonic Drive to share how integrated actuators can reduce engineering at RoboBusiness", "source": "Robotics Business Review", "date": "2026-10-07", "url": "https://www.therobotreport.com/harmonic-drive-share-how-integrated-actuators-reduce-engineering-robobusiness/", "summary": "<p>Attendees will learn how integrated actuators can reduce engineering effort by simplifying system integration.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/harmonic-drive-share-how-integrated-actuators-reduce-engineering-robobusiness/\">Harmonic Drive to share how integrated actuators can reduce engineering at RoboBusiness<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "PTC acquisition positions Schneider Electric to challenge Siemens", "source": "Robotics Business Review", "date": "2026-10-07", "url": "https://www.therobotreport.com/ptc-acquisition-positions-schneider-electric-challenge-siemens/", "summary": "<p>The Schneider Electric acquisition of PTC gives it a 'digital thread' from design through operations, but it needs to integrate data and software, says Interact Analysis.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/ptc-acquisition-positions-schneider-electric-challenge-siemens/\">PTC acquisition positions Schneider Electric to challenge Siemens<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Sovereign AI, same landlord — thoughts on the physical AI race", "source": "Robotics Business Review", "date": "2026-10-06", "url": "https://www.therobotreport.com/sovereign-ai-same-landlord-thoughts-physical-ai-race/", "summary": "<p>While physical AI architecture alternatives are growing in number, NVIDIA has taken a sovereign strategy to ensuring its role. <\/p>\n<p>The post <a href=\"https://www.therobotreport.com/sovereign-ai-same-landlord-thoughts-physical-ai-race/\">Sovereign AI, same landlord &#8212; thoughts on the physical AI race<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "FireDome builds autonomous ‘artillery’ for wildfire defense", "source": "Robotics Business Review", "date": "2026-10-06", "url": "https://www.therobotreport.com/firedome-builds-autonomous-artillery-for-wildfire-defense/", "summary": "<p>FireDome builds autonomous wildfire defense systems to protect communities and infrastructure before firefighters arrive.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/firedome-builds-autonomous-artillery-for-wildfire-defense/\">FireDome builds autonomous &#8216;artillery&#8217; for wildfire defense<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Overview AI launches OV Spark line of AI inspection cameras", "source": "Robotics Business Review", "date": "2026-10-06", "url": "https://www.therobotreport.com/overview-ai-launches-ov-spark-line-ai-inspection-cameras/", "summary": "<p>The OV Spark and OV Spark Pro AI inspection cameras are available now through Overview AI and its distribution partners.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/overview-ai-launches-ov-spark-line-ai-inspection-cameras/\">Overview AI launches OV Spark line of AI inspection cameras<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Boston Dynamics appoints former Amazon exec Rohit Prasad as new CEO", "source": "Robotics Business Review", "date": "2026-10-06", "url": "https://www.therobotreport.com/boston-dynamics-appoints-former-amazon-executive-rohit-prasad-new-ceo/", "summary": "<p>Before Boston Dynamics, Prasad served as senior vice president and head scientist for Alexa and artificial general intelligence at Amazon.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/boston-dynamics-appoints-former-amazon-executive-rohit-prasad-new-ceo/\">Boston Dynamics appoints former Amazon exec Rohit Prasad as new CEO<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Pegasus 1.6 brings video understanding to physical AI, says TwelveLabs", "source": "Robotics Business Review", "date": "2026-10-06", "url": "https://www.therobotreport.com/pegasus-1-6-brings-video-understanding-physical-ai-says-twelvelabs/", "summary": "<p>TwelveLabs says its Pegasus 1.6 model understands first-person video and supports workflows including labeling for robotics developers.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/pegasus-1-6-brings-video-understanding-physical-ai-says-twelvelabs/\">Pegasus 1.6 brings video understanding to physical AI, says TwelveLabs<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "FCC robot restrictions could accelerate shift to local AI", "source": "Robotics Business Review", "date": "2026-10-05", "url": "https://www.therobotreport.com/fcc-robot-restrictions-could-accelerate-shift-to-local-ai/", "summary": "<p>Companies deploying physical AI today need to decide which AI workloads belong on the robot, what can remain in the cloud, and whether the underlying technology stack can meet rising expectations for security, safety, and supply-chain transparency.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/fcc-robot-restrictions-could-accelerate-shift-to-local-ai/\">FCC robot restrictions could accelerate shift to local AI<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Teradyne invests in Bright Machines to bring robotics to AI infrastructure manufacturing", "source": "Robotics Business Review", "date": "2026-10-05", "url": "https://www.therobotreport.com/teradyne-invests-ibright-machines-brings-robotics-ai-infrastructure-manufacturing/", "summary": "<p>The companies plan to integrate Teradyne robotics and test technologies with the Bright Machines manufacturing platform. <\/p>\n<p>The post <a href=\"https://www.therobotreport.com/teradyne-invests-ibright-machines-brings-robotics-ai-infrastructure-manufacturing/\">Teradyne invests in Bright Machines to bring robotics to AI infrastructure manufacturing<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "How robotics and physical AI can responsibly tackle key physical security challenges", "source": "Robotics Business Review", "date": "2026-10-04", "url": "https://www.therobotreport.com/how-robotics-physical-ai-can-responsibly-tackle-key-physical-security-challenges/", "summary": "<p>Cyber and physical security threats are rapidly evolving, but robotics and AI can evolve to meet them, writes a columnist.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/how-robotics-physical-ai-can-responsibly-tackle-key-physical-security-challenges/\">How robotics and physical AI can responsibly tackle key physical security challenges<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "The physical AI race will be won in the patent office", "source": "Robotics Business Review", "date": "2026-10-03", "url": "https://www.therobotreport.com/physical-ai-race-will-be-won-in-patent-office/", "summary": "<p>Patent protection is important for robotics startups, but they should be strategic in determining what IP is important, says Lightbringer.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/physical-ai-race-will-be-won-in-patent-office/\">The physical AI race will be won in the patent office<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Calling robotics startups: Submissions for the 2026 Robotics Startup Radar close soon", "source": "Robotics Business Review", "date": "2026-10-02", "url": "https://www.therobotreport.com/calling-all-robotics-startups-apply-now-2026-robotics-startup-radar/", "summary": "<p>Submit now to be part of the Robotics Startup Radar, which brings together some of the most promising robotics startups.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/calling-all-robotics-startups-apply-now-2026-robotics-startup-radar/\">Calling robotics startups: Submissions for the 2026 Robotics Startup Radar close soon<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Video Friday: Albatross Falls, Spins, Self-Rights, and Sails Away", "source": "IEEE Spectrum Robotics", "date": "2026-10-02", "url": "https://spectrum.ieee.org/video-friday-bioinspired-robotics", "summary": "<img src=\"https://spectrum.ieee.org/media-library/futuristic-robotic-bird-gliding-low-above-water-with-a-trailing-wire.png?id=68024679&amp;width=1200&amp;height=800&amp;coordinates=0%2C187%2C0%2C187\" /><br /><br /><p><span>Video Friday is your weekly selection of awesome robotics videos, collected by your friends at <\/span><em>IEEE Spectrum<\/em><span> robotics. We also post a weekly calendar of upcoming robotics events for the next few months. Please <\/span><a href=\"mailto:automaton@ieee.org?subject=Robotics%20event%20suggestion%20for%20Video%20Friday\">send us your events<\/a><span> for inclusion.<\/span><\/p><h5><a href=\"https://www.corl.org/\">CoRL 2026<\/a>: 9–12 November 2026, AUSTIN<\/h5><h5><a href=\"https://2026.ieee-humanoids.org/\">Humanoids 2026<\/a>: 6–9 December 2026, SANTA CLARA, CA<\/h5><p>Enjoy today’s videos!<\/p><div class=\"horizontal-rule\"><\/div><div><span style=\"display: none;\"> <\/span><\/div><blockquote class=\"rm-anchors\" id=\"j8curj0ydxi\"><em>We’ve developed ALBATROSS (Airborne Lander with Buoyant AuToROtating Sailing Sensor), a hybrid aerial-marine robot. It can be released from the air, autorotate down to the water without a parachute, passively self-right after landing, and then reuse the same rigid wings as sails for autonomous wind-powered navigation.<\/em><em>The key idea is to make the physical structures do as much of the work as possible. Rather than carrying separate systems for aerial descent, landing, and marine propulsion, ALBATROSS uses the same wings for both autorotation and sailing, with minimal actuation. Ultimately, we’re interested in whether platforms like this could combine rapid aerial deployment with persistent, energy-efficient marine sensing.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.sutd.edu.sg/\" target=\"_blank\">Singapore University of Technology and Design<\/a> ] paper via [ <a href=\"https://www.science.org/doi/10.1126/scirobotics.aed1423\">Science Robotics<\/a> ]<\/p><p>Thanks, Shane!<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"pfah5oqdpdm\">I’m just getting so burnt out on the <a href=\"https://spectrum.ieee.org/robot-martial-arts\" target=\"_blank\">humanoid publicity stunts<\/a>, you know?<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.figure.ai/news/f-02-decommission\">Figure<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"_j6cd1smsza\"><em>Sharpa unveiled three major proprietary new products at the IEEE/RSJ International Conference on Intelligent Robots and Systems (IROS): D01, the first integrated tactile-sensing robot built for dexterous manipulation; W02, a next-generation fully tactile, ultracompact, lightweight dexterous hand; and AE01, a high-fidelity haptic exoskeleton data glove.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.sharpa.com/blogs/news/sharpa-launches-three-flagship-products-at-iros-pushing-the-boundaries-of-dexterous-manipulation\">Sharpa<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"cfs_zu1kwqw\"><em>Why will Boston Dynamics win the humanoid robotics race? We’ve already commercialized autonomous mobile robots, creating markets with Spot and Stretch. Now we’re doing it again with Atlas: learning in real environments, designing for manufacturing at scale, and introducing a new era of physical intelligence.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://bostondynamics.com/news/boston-dynamics-opens-robotics-metaplant-application-center-to-train-humanoid-robots-for-manufacturing-tasks/\">Boston Dynamics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"fvk2n5exr_u\"><em>This work presents a lightweight, compliant footpad that enhances the terrain adaptability of a hopping robot. The design combines a planar foot supported by a compliant spherical joint for self‑alignment with embedded spines to improve traction on uneven or slippery surfaces.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://climb.mie.utoronto.ca/\">CLIMB Lab, University of Toronto<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"ozd8vyccygy\"><em>Heterogeneous robot teams distribute complementary capabilities across specialized agents, but their physical roles and capacities typically remain fixed throughout a mission. We present HARP, a Heterogeneous Aerial Robotic modules Platform, in which independently deployable aerial robots physically reconfigure to compose their capabilities for field operations.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://generalroboticslab.com/HARP\">General Robotics Lab<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"rr05thcb6mg\">Some very impressive mobility from <a href=\"https://spectrum.ieee.org/video-friday-anymals-and-animals\" target=\"_blank\">ANYmal<\/a>.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://arxiv.org/abs/2601.17428\">ETH Zurich RSL<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"a-8o8l_zc4a\">Daniel writes, “I’m a high school student in Canada, and I built a self-constructing robot arm that assembles itself. It’s designed to be low-cost, with disaster response in mind: Small robots can squeeze through gaps in rubble but are too weak to move things, while big arms are strong but can’t fit through. My arm is split into three wheeled modules that travel separately, then dock together using a spring-lock mechanism.”<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.youtube.com/@DanielZhu-y1y\">Daniel Zhu<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"rnt97btyqrq\"><a href=\"https://spectrum.ieee.org/rivian-self-driving\" target=\"_blank\">Autonomous highway driving<\/a> not impressive enough for you? Try this.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.xpeng.com/news/01a0f7644454a0e70a9e8a02823600e0\">XPENG<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"aqb3m8j1l88\"><em>The IT Imperial team has connected MaleCNS—a published connectome of a male fruit fly (Drosophila melanogaster)—to a physical Unitree G1 humanoid robot. The system creates a closed loop: camera → fruit-fly neural model → motor decoding → physical robot movement. The robot receives visual input through its stereo camera. The images are transformed into a representation adapted to the fly’s visual system, processed by the computational model based on the reconstructed nervous system, and then converted into movement commands for the robot.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://itimperial.group/en\">IT Imperial<\/a> ]<\/p><p>Thanks, Anna!<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"mhfh0fah5fy\">My guess is that this is far easier than it looks or far harder than it looks, and I’m honestly not sure which.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.ahadjawaid.com/nac\">Paper<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"eqb015r0290\">I cannot believe that this is still a thing, but good on them!<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.tevel-tech.com/\">Tevel<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"7wo36jslsto\"><em>In Part 1 of Dexterity Explained, we break down what manual dexterity is, why it matters, and how robotic hands and physical AI work together to bring greater skill, precision, and control to physical tasks.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://sanctuary.ai/solutions/\">Sanctuary AI<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"zgbm8pdtpgo\">XPENG has a lot of money to build a lot of these robots. They do look very human. I’m not sure what they’re going to do, though.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.xpeng.com/pressroom/news/01a03797fccda01e0de68a02a256006a\">XPENG<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"ae3-hjqw9ci\">That’s a lot of robots! Tell me what they’re all going to do!<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.ubtrobot.com/en/\">UBTECH<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"wtyg6u_sf18\"><em>When floods swept away roads and bridges in Nepal, local drone pilots stepped in to help map the damage, support search teams, and deliver essential supplies to communities cut off from help. In this episode of Ground Truth with Flying Labs, host Leka Tingitana speaks with Uttam Pudasaini, an advisor to Nepal Flying Labs, and Raj Bikram Maharjan, cofounder of Airlift Technology, about the drone community’s response to the devastating floods of 26 August 2026.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://flyinglabs.org/nepal\">WeRobotics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div>"}, {"title": "Runway introduces Praxis-1 world action model for robotics", "source": "Robotics Business Review", "date": "2026-10-02", "url": "https://www.therobotreport.com/runway-introduces-praxis-1-world-action-model-robotics/", "summary": "<p>When Runway does release Praxis-1 publicly, it plans to ship it with open weights rather than as a closed model. <\/p>\n<p>The post <a href=\"https://www.therobotreport.com/runway-introduces-praxis-1-world-action-model-robotics/\">Runway introduces Praxis-1 world action model for robotics<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Inside Omron’s next-generation LD mobile robots", "source": "Robotics Business Review", "date": "2026-10-02", "url": "https://www.therobotreport.com/inside-omrons-next-generation-ld-mobile-robots/", "summary": "<p>In mobile robotics, software, safety, and fleet management are becoming just as important as the robot itself, according to an OMROM project manager.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/inside-omrons-next-generation-ld-mobile-robots/\">Inside Omron’s next-generation LD mobile robots<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Eli Lilly, Purdue to share field learnings on human robot interaction at RoboBusiness", "source": "Robotics Business Review", "date": "2026-10-02", "url": "https://www.therobotreport.com/eli-lilly-purdue-to-share-field-learnings-on-human-robot-interaction-at-robobusiness/", "summary": "<p>Experts from Eli Lilly and Purdue University will reveal findings about the perception of robots on the manufacturing floor.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/eli-lilly-purdue-to-share-field-learnings-on-human-robot-interaction-at-robobusiness/\">Eli Lilly, Purdue to share field learnings on human robot interaction at RoboBusiness<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Atlas Robot’s New Hand May Outperform Humanlike Designs", "source": "IEEE Spectrum Robotics", "date": "2026-10-01", "url": "https://spectrum.ieee.org/robust-robot-hand", "summary": "<img src=\"https://spectrum.ieee.org/media-library/close-up-of-a-robotic-hand-with-three-fingers-and-a-thumb-making-a-gesture-similar-to-the-sign-of-the-horns.jpg?id=67879402&amp;width=1200&amp;height=800&amp;coordinates=0%2C0%2C0%2C0\" /><br /><br /><p><span>Today, <\/span><a href=\"https://bostondynamics.com/\" target=\"_blank\">Boston Dynamics<\/a><span> is <a href=\"https://bostondynamics.com/blog/robot-hands-for-modern-ai-and-real-work/\" target=\"_blank\">announcing<\/a> a redesigned hand for its <\/span><a href=\"https://spectrum.ieee.org/atlas-humanoid-robot\" target=\"_self\">Atlas robot<\/a><span>. The previous generation could do some <\/span><a href=\"https://spectrum.ieee.org/robots-ces-2026\" target=\"_self\">crazy superhuman<\/a><span> things with its three fingers, but it was never intended for mass production in the tens or hundreds of thousands. Switching from research hardware to a scalable product makes previously ignorable questions suddenly paramount: How can you make a hand that does everything you need it to do but is also rugged and reliable and cost-effective? It’s questions like these that drove the design of the new Atlas hand, and while it doesn’t look much like a human hand, it might be a hand that makes it out into the real world.<\/span><\/p><p class=\"shortcode-media shortcode-media-youtube\"> <span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span> <small class=\"image-media media-caption\">- YouTube<\/small> <small class=\"image-media media-photo-credit\"> <a href=\"https://www.youtube.com/watch?v=4whgw2gLBS8\" target=\"_blank\">www.youtube.com<\/a> <\/small> <\/p><p>Compared to the almost <a href=\"https://clonerobotics.com/hand\" target=\"_blank\">eerily humanlike hands<\/a> designed by a litany of other <a href=\"https://www.1x.tech/discover/neos-hands\" target=\"_blank\">humanoid<\/a> <a href=\"https://www.unitree.com/Dex5-S\" rel=\"noopener noreferrer\" target=\"_blank\">robotics<\/a> <a href=\"https://www.figure.ai/\" rel=\"noopener noreferrer\" target=\"_blank\">companies<\/a>, Atlas’s new hand does look awfully clunky. We’ve certainly seen some of those robots with much more humanlike hands perform dexterous manipulation tasks that are, speaking as someone who has personally witnessed robots haplessly fumble their way through the world for nearly two decades now, nothing short of incredible. And it’s not just what these hands can do—it’s how they look while doing it, as slim, graceful mechanical copies of our own hands. They seem like science fiction, and to some extent, that’s exactly what they are.<\/p><p>“Hands are a ruthless design trade-off,” <a href=\"https://www.linkedin.com/in/alberto-rodriguez-5457661a8/\" rel=\"noopener noreferrer\" target=\"_blank\">Alberto Rodriguez<\/a>, director of robot behavior at Boston Dynamics, tells <em>IEEE Spectrum<\/em>. “There’s no way around it, you’re always giving up on something. And many of the current designs are giving up on things like reliability and manufacturability.” This is what invariably happens when you try and cram everything necessary to make a robotic hand function within the form factor of a human hand: It’s going to be either very fragile or very expensive, and likely both at the same time. The unfortunate reality is that for now, and likely for the immediate future, all that these sorts of hands are good for are research and demos.<\/p><p>With Atlas’s new hand, Boston Dynamics is making the design trade-offs necessary to achieve a hand that, according to the press release, is capable of a vast array of useful tasks, including using tools; is strong and rugged; can be cleanly simulated; can be mass-manufactured and repaired at reliably low cost; and is close enough in form factor to a human hand that human demonstrations can be used to train it.<\/p><p>You’ll notice that “looks cosmetically like a human hand” is nowhere on that list, and this new hand doesn’t. Rodriguez explains that getting rid of the pinky was a straightforward decision, agreed on after his team spent a day with their pinkies taped to their ring fingers. But why even add a fourth finger, when the previous generation of Atlas’ hand seemed to do well with only three? It’s not just the extra finger, but a complete redesign that almost doubled the degrees of freedom between the old hand and the new, going from 7 to 13. <\/p><p class=\"shortcode-media shortcode-media-rebelmouse-image\"> <img alt=\"Close-up of a splayed robotic hand with three fingers and a thumb.\" class=\"rm-shortcode\" id=\"8b02e\" src=\"https://spectrum.ieee.org/media-library/close-up-of-a-splayed-robotic-hand-with-three-fingers-and-a-thumb.jpg?id=67879501&amp;width=980\" /> <small class=\"image-media media-photo-credit\">Boston Dynamics<\/small><\/p><p>“We also added the ability for the fingers to splay open because we knew that it was important for one finger to be able to move against another, and we also knew that we needed to be able to hold the handle of a tool with a trigger,” Rodriguez says, which includes many common tools like drills or welding torches. “We’re convinced that from a product perspective, this hand should be able to do everything we need it to do for the foreseeable horizon.” And that ability to finger splay goes beyond what human hands are capable of. According to Rodriguez, “With reinforcement learning, we can discover uses for these superhuman extra motions and exploit them.”<\/p><p>Reliability, manufacturability, and cost are all closely related. By reducing the degrees of freedom relative to other more anthropomorphic hand designs down to just 13, Boston Dynamics can use fewer, larger, and more powerful actuators. The actuators are embedded directly into the joints themselves in a direct-drive configuration, with a transmission that allows the motors to be back-driven and react to force and contact. Each actuator pack is a single unit that can be easily replaced, and there are no delicate tendons or cables across joints to stretch and break. “What we’re working on right now is figuring out what needs to change in the fine details of our design if we want to make 100,000 of these hands a year,” Rodriguez says.<\/p><p>Not every humanoid company will make the trade-offs that Boston Dynamics has done here, and there’s still plenty of room for creativity when it comes to hand design. But if humanoids with hands are going to scale, some difficult decisions will have to be made, and it’ll take some compromise to deliver on the promises that the humanoid industry has committed to.<\/p>"}, {"title": "How Maven Robotics plans to automate industrial work, one task at a time", "source": "Robotics Business Review", "date": "2026-10-01", "url": "https://www.therobotreport.com/how-maven-robotics-plans-automate-industrial-work-one-task-at-a-time/", "summary": "<p>With the $100 million it raised earlier this month, Maven Robotics is looking towards mass producing its mobile manipulator robot.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/how-maven-robotics-plans-automate-industrial-work-one-task-at-a-time/\">How Maven Robotics plans to automate industrial work, one task at a time<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "ANYbotics launches Shift to streamline robot fleet operations, scale inspections", "source": "Robotics Business Review", "date": "2026-10-01", "url": "https://www.therobotreport.com/anybotics-launches-shift-streamline-robot-fleet-operations-scale-autonomous-inspections/", "summary": "<p>ANYbotics designed Shift to help maintenance teams run industrial inspections, detect failing equipment, and turn data into work orders.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/anybotics-launches-shift-streamline-robot-fleet-operations-scale-autonomous-inspections/\">ANYbotics launches Shift to streamline robot fleet operations, scale inspections<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Boston Dynamics drops pinkie on new humanoid hand", "source": "Robotics Business Review", "date": "2026-10-01", "url": "https://www.therobotreport.com/boston-dynamics-drops-pinkie-on-new-humanoid-hand/", "summary": "<p>Boston Dynamics engineers taped their pinkies and ring fingers together for a day to learn what they weren’t able to do.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/boston-dynamics-drops-pinkie-on-new-humanoid-hand/\">Boston Dynamics drops pinkie on new humanoid hand<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Precision In Motion. Vishay Precision Group, Inc. (VPG) to Showcase Custom Sensing Capabilities for Humanoid Robotics at RoboBusiness 2026", "source": "Robotics Business Review", "date": "2026-10-01", "url": "https://www.therobotreport.com/precision-in-motion-vishay-precision-group-inc-vpg-to-showcase-custom-sensing-capabilities-for-humanoid-robotics-at-robobusiness-2026/", "summary": "<p>As humanoid robots move from research labs into factories, warehouses, homes, and other shared spaces, accurate physical feedback becomes crucial.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/precision-in-motion-vishay-precision-group-inc-vpg-to-showcase-custom-sensing-capabilities-for-humanoid-robotics-at-robobusiness-2026/\">Precision In Motion. Vishay Precision Group, Inc. (VPG) to Showcase Custom Sensing Capabilities for Humanoid Robotics at RoboBusiness 2026<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Your Robot’s Safety Functions Already Work. What If the Input Lies?", "source": "Robotics Business Review", "date": "2026-10-01", "url": "https://www.therobotreport.com/your-robots-safety-functions-already-work-what-if-the-input-lies/", "summary": "<p>A robot can follow its safety rules and still act on manipulated information. See what this means for robot safety and how teams can strengthen their testing and evidence.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/your-robots-safety-functions-already-work-what-if-the-input-lies/\">Your Robot’s Safety Functions Already Work. What If the Input Lies?<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Top 10 robotics stories of September 2026", "source": "Robotics Business Review", "date": "2026-10-01", "url": "https://www.therobotreport.com/top-10-robotics-stories-of-september-2026/", "summary": "<p>In September 2026, live events such as IMTS, ROSCon, and iROS brought a flood of robotics developments.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/top-10-robotics-stories-of-september-2026/\">Top 10 robotics stories of September 2026<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Tackling construction labor shortages: ASI and SoftBank partner on autonomous fleets", "source": "Robotics Business Review", "date": "2026-09-30", "url": "https://www.therobotreport.com/tackling-construction-labor-shortages-asi-softbank-partner-autonomous-fleets/", "summary": "<p>ASI and SoftBank join forces with $225M to scale brand-agnostic autonomous heavy equipment across infrastructure projects.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/tackling-construction-labor-shortages-asi-softbank-partner-autonomous-fleets/\">Tackling construction labor shortages: ASI and SoftBank partner on autonomous fleets<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "The Robot Report parent Arrowfly launches AI for Engineers platform, events for engineers navigating AI", "source": "Robotics Business Review", "date": "2026-09-30", "url": "https://www.therobotreport.com/robot-report-parent-arrowfly-launches-ai-for-engineers-platform-events-engineers-navigating-ai/", "summary": "<p>The initiative for engineers includes a news desk, a conference, research, and an advisory board, grounded in trusted editorial brands.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/robot-report-parent-arrowfly-launches-ai-for-engineers-platform-events-engineers-navigating-ai/\">The Robot Report parent Arrowfly launches AI for Engineers platform, events for engineers navigating AI<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Innodata opens motion-capture lab to help humanoids move more like people", "source": "Robotics Business Review", "date": "2026-09-30", "url": "https://www.therobotreport.com/innodata-opens-motion-capture-lab-help-humanoids-move-more-like-people/", "summary": "<p>Innodata uses Vicon cameras to measure movements with sub-millimeter accuracy and to collect real-world training data for robots.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/innodata-opens-motion-capture-lab-help-humanoids-move-more-like-people/\">Innodata opens motion-capture lab to help humanoids move more like people<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Meet Flourish One, the Raspberry Pi-powered humanoid built for busy parents", "source": "Robotics Business Review", "date": "2026-09-29", "url": "https://www.therobotreport.com/meet-flourish-one-raspberry-pi-powered-humanoid-built-busy-parents/", "summary": "<p>Flourish is releasing a $3,555 phone-trainable home robot, targeting busy parents with personalized, cloud-trained chore automation.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/meet-flourish-one-raspberry-pi-powered-humanoid-built-busy-parents/\">Meet Flourish One, the Raspberry Pi-powered humanoid built for busy parents<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "State of Robots in Manufacturing", "source": "Robotics Business Review", "date": "2026-09-29", "url": "https://www.therobotreport.com/state-of-robots-in-manufacturing/", "summary": "<p>The Robot Report looks at recent advances in automation for manufacturing, from improvements in technologies and use cases to the potential of humanoids and AI.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/state-of-robots-in-manufacturing/\">State of Robots in Manufacturing<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "ForceN to give a crash course on force and torque sensing for humanoids at RoboBusiness", "source": "Robotics Business Review", "date": "2026-09-29", "url": "https://www.therobotreport.com/forcen-gives-crash-course-force-torque-sensing-humanoids-robobusiness-2026/", "summary": "<p>Attendees will learn about the many ways they can use force and torque sensors in humanoids and how to avoid breaking them while doing it.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/forcen-gives-crash-course-force-torque-sensing-humanoids-robobusiness-2026/\">ForceN to give a crash course on force and torque sensing for humanoids at RoboBusiness<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Gecko Robotics works with NVIDIA to add AI agent security and control", "source": "Robotics Business Review", "date": "2026-09-28", "url": "https://www.therobotreport.com/gecko-robotics-works-with-nvidia-adds-ai-agent-security-and-control/", "summary": "<p>Gecko Robotics is using the new NVIDIA Open Agent Safety Platform to ensure the secure autonomous control of systems.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/gecko-robotics-works-with-nvidia-adds-ai-agent-security-and-control/\">Gecko Robotics works with NVIDIA to add AI agent security and control<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Raise Robotics to discuss scaling field robots at RoboBusiness", "source": "Robotics Business Review", "date": "2026-09-28", "url": "https://www.therobotreport.com/raise-robotics-discuss-scaling-field-robots-robobusiness/", "summary": "<p>Raise Robotics said attendees will learn a decision rule for allocating engineering capacity and a vocabulary for two hidden failure modes.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/raise-robotics-discuss-scaling-field-robots-robobusiness/\">Raise Robotics to discuss scaling field robots at RoboBusiness<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "A Day in the Life of a Roboticist: Charlie Kemp", "source": "IEEE Spectrum Robotics", "date": "2026-09-28", "url": "https://robotsguide.com/learn/a-day-in-the-life-of-a-roboticist-charlie-kemp", "summary": "<img src=\"https://spectrum.ieee.org/media-library/man-standing-beside-a-tall-wheeled-robot-smiling-and-waving-at-the-camera.jpg?id=67880303&amp;width=1200&amp;height=800&amp;coordinates=0%2C83%2C0%2C84\" /><br /><br /><p>Building useful robots starts with understanding the people who use them. For Charlie Kemp, cofounder and chief technology officer of Hello Robot, that means developing assistive robots that can help people with everyday tasks and support greater independence.<\/p><p>In this <a href=\"https://robotsguide.com/\" target=\"_blank\">Robots Guide<\/a> profile, Kemp shares his path from studying artificial intelligence at MIT to building Stretch, explains how working with people with disabilities has shaped his approach, and offers advice for aspiring roboticists. <a href=\"https://robotsguide.com/learn/a-day-in-the-life-of-a-roboticist-charlie-kemp\" rel=\"noopener noreferrer\" target=\"_blank\">Read the full profile on IEEE’s Robots Guide.<\/a><\/p>"}, {"title": "Robonomics on the threshold: Economic autonomy, smart cities, and crypto wallets for humanoids", "source": "Robotics Business Review", "date": "2026-09-28", "url": "https://www.therobotreport.com/robotics-threshold-economic-autonomy-crypto-wallets-humanoids/", "summary": "<p>Economics is both a robotics impetus and a constraint, as systems make deliveries on streets or do chores in households.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/robotics-threshold-economic-autonomy-crypto-wallets-humanoids/\">Robonomics on the threshold: Economic autonomy, smart cities, and crypto wallets for humanoids<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}], "embeddedNews": [{"title": "A 1982 Modem for $100", "source": "Hackaday", "date": "2026-10-30", "url": "https://hackaday.com/2026/10/30/a-1982-modem-for-100/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"450\" src=\"https://hackaday.com/wp-content/uploads/2026/10/vicmod.png?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>[Dave Farquhar] takes a walk down memory lane about the Commodore 1600 VICModem, perhaps the first phone modem to sell for less than $100. Commodore, of course, was famous for <a class=\"read-more\" href=\"https://hackaday.com/2026/10/30/a-1982-modem-for-100/\">&#8230;read more<\/a>"}, {"title": "Making Internal Combustion Engines Better With More Valves", "source": "Hackaday", "date": "2026-10-30", "url": "https://hackaday.com/2026/10/30/making-internal-combustion-engines-better-with-more-valves/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"468\" src=\"https://hackaday.com/wp-content/uploads/2026/10/ten_valve_cylinder_head_alexanders_laboratory_youtube.jpg?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>When it comes to internal combustion engines (ICEs), it&#8217;s generally accepted that each cylinder doesn&#8217;t have more valves to let in a fresh fuel mixture and to exhaust the aftermath <a class=\"read-more\" href=\"https://hackaday.com/2026/10/30/making-internal-combustion-engines-better-with-more-valves/\">&#8230;read more<\/a>"}, {"title": "A Modern Smalltalk", "source": "Hackaday", "date": "2026-10-30", "url": "https://hackaday.com/2026/10/30/a-modern-smalltalk/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"450\" src=\"https://hackaday.com/wp-content/uploads/2026/10/small.png?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>In the history of object-oriented (OO) computer languages, Smalltalk has a special place. It wasn&#8217;t the first OO language, and it hasn&#8217;t spread as well as some others. But it <a class=\"read-more\" href=\"https://hackaday.com/2026/10/30/a-modern-smalltalk/\">&#8230;read more<\/a>"}, {"title": "Hackaday Podcast Episode 393: Epaper, Tamagotchi Hacks, and Supercon Talks Galore", "source": "Hackaday", "date": "2026-10-30", "url": "https://hackaday.com/2026/10/30/hackaday-podcast-episode-393-epaper-tamagotchi-hacks-and-supercon-talks-galore/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"484\" src=\"https://hackaday.com/wp-content/uploads/2016/05/microphone.jpg?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>This week&#8217;s podcast comes from Europe, as Elliot Williams is joined by Jenny List, who wishes to apologies for the poor sound quality from her headset microphone. The news this <a class=\"read-more\" href=\"https://hackaday.com/2026/10/30/hackaday-podcast-episode-393-epaper-tamagotchi-hacks-and-supercon-talks-galore/\">&#8230;read more<\/a>"}, {"title": "How Britain Narrowly Escaped a Grid Blackout in June 2026", "source": "Hackaday", "date": "2026-10-30", "url": "https://hackaday.com/2026/10/30/how-britain-narrowly-escaped-a-grid-blackout-in-june-2026/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"443\" src=\"https://hackaday.com/wp-content/uploads/2026/10/uk_grid_six_issues_june_2026_the_electric_brit_youtube.jpg?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>Amidst one of the worst heatwaves in European history, Britain&#8217;s national grid saw itself faced with a quiet crisis this summer. On June 23rd, the grid frequency dropped to 49.657 <a class=\"read-more\" href=\"https://hackaday.com/2026/10/30/how-britain-narrowly-escaped-a-grid-blackout-in-june-2026/\">&#8230;read more<\/a>"}, {"title": "This Week in Security: Broken Embargoes, UEFI Overflow, Wormable Tailscale, Starlink Ad Snooping, and a DHS Directory Dump", "source": "Hackaday", "date": "2026-10-30", "url": "https://hackaday.com/2026/10/30/this-week-in-security-broken-embargoes-uefi-overflow-wormable-tailscale-starlink-ad-snooping-and-a-dhs-directory-dump/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"484\" src=\"https://hackaday.com/wp-content/uploads/2016/01/darkarts.jpg?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>Last week brought us at least two broken embargoes: php2shell leaked onto Hacker News a day early, and a batch of Linux kernel bugs landed on the public kernel mailing <a class=\"read-more\" href=\"https://hackaday.com/2026/10/30/this-week-in-security-broken-embargoes-uefi-overflow-wormable-tailscale-starlink-ad-snooping-and-a-dhs-directory-dump/\">&#8230;read more<\/a>"}, {"title": "The Sounds of the World, One Random Album at a Time", "source": "Hackaday", "date": "2026-10-30", "url": "https://hackaday.com/2026/10/30/the-sounds-of-the-world-one-random-album-at-a-time/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"430\" src=\"https://hackaday.com/wp-content/uploads/2026/10/impermanence_feat.png?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>In the streaming era it&#8217;s easy to forget that there&#8217;s still a lot of stuff being broadcast over the radio for anyone who cares enough to dial in their receiver. <a class=\"read-more\" href=\"https://hackaday.com/2026/10/30/the-sounds-of-the-world-one-random-album-at-a-time/\">&#8230;read more<\/a>"}, {"title": "Azume One – A 2.8mm sensor that turns any regular wristwatch into a health tracker (Crowdfunding)", "source": "CNX Software", "date": "2026-10-30", "url": "https://www.cnx-software.com/2026/10/30/azume-one-a-2-8mm-sensor-that-turns-any-regular-wristwatch-into-a-health-tracker/", "summary": "<div><img alt=\"Azume One Health Tracker Module for all watches\" class=\"attachment-medium size-medium wp-post-image\" height=\"480\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/10/Azume-One-Health-Tracker-Module-for-all-watches-720x480.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Azume, a Munich-based startup, has designed the Azume One, a compact health tracker that attaches to the back of a regular wristwatch to track heart rate, sleep, stress, and daily activity without needing an additional smartwatch. The device measures 30mm in diameter, is 2.8mm thick, and weighs 5 grams. It features an optical PPG sensor and a motion sensor to track health and activity data, which it sends to an Android or iOS smartphone over Bluetooth 5.4. Other highlights include up to 48 hours of battery life, a removable nano-suction mounting system, and an included wristband for sleep tracking without wearing a watch. Azume One specifications: MCU / SoC &#8211; Not specified (Potentially Nordic Semi nRF52-based)  Sensors Optical PPG sensor for heart rate and blood oxygen monitoring Motion sensor for activity and workout tracking Skin temperature monitoring Connectivity – Bluetooth 5.4 Misc No display, vibrations, or notifications No subscription required [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/10/30/azume-one-a-2-8mm-sensor-that-turns-any-regular-wristwatch-into-a-health-tracker/\">Azume One &#8211; A 2.8mm sensor that turns any regular wristwatch into a health tracker (Crowdfunding)<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "$26 Banana Pi BPI-RT2 WiFi 6 router board features Realtek RTL8198D dual-core MIPS SoC", "source": "CNX Software", "date": "2026-10-30", "url": "https://www.cnx-software.com/2026/10/30/26-banana-pi-bpi-rt2-wifi-6-router-board-features-realtek-rtl8198d-dual-core-mips-soc/", "summary": "<div><img alt=\"Banana Pi BPI RT2 WiFi 6 router board with Realtek RTL8198D dual core MIPS SoC\" class=\"attachment-medium size-medium wp-post-image\" height=\"480\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/10/Banana-Pi-BPI-RT2-WiFi-6-router-board-with-Realtek-RTL8198D-dual-core-MIPS-SoC-720x480.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Just last week we wrote about the GL.iNet Mango 2 (GL-MG1300), a low-cost mini travel router built around a MediaTek MT7621A dual-core MIPS SoC. Now, Banana Pi has introduced another MIPS router: the BPI-RT2 router board built around a Realtek RTL8198D dual-core MIPS SoC. The BPI-RT2 ships with 256MB DDR3 RAM, 128MB SPI-NAND flash, four Gigabit Ethernet ports (one WAN and three LAN), and a USB 3.0 port. It also supports dual-band WiFi 6 with 2×2 MIMO on both the 2.4 GHz and 5 GHz bands. The board measures 97 × 65mm and is designed for home networking, wireless access points, and small business routers. Banana Pi BPI-RT2 specifications: SoC – Realtek RTL8198D Dual-core MIPS interAptiv processor Integrated Gigabit Ethernet switching hardware Memory – 256MB DDR3 RAM Storage – 128MB SPI-NAND flash Networking 1x Gigabit Ethernet WAN port 3x Gigabit Ethernet LAN ports Dual-band WiFi 6 (802.11ax), AX3000 2.4 GHz – [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/10/30/26-banana-pi-bpi-rt2-wifi-6-router-board-features-realtek-rtl8198d-dual-core-mips-soc/\">$26 Banana Pi BPI-RT2 WiFi 6 router board features Realtek RTL8198D dual-core MIPS SoC<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Development Platforms for Edge AI, When Engineering Apps Need Agentic AI, Real-Time Sensing: Embedded Week Insights", "source": "Embedded.com", "date": "2026-10-30", "url": "https://www.embedded.com/development-platforms-for-edge-ai-when-engineering-apps-need-agentic-ai-real-time-sensing-embedded-week-insights/", "summary": "<p>Here's a roundup of this week's must-read articles: How to Navigate the Memory Chip Shortage, When Engineering Apps Need Agentic AI, and Real-Time Sensing Prevents Catastrophic Infrastructure Failures, and more! Also, check News Archives - Embedded and Technical Articles Archives - Embedded for the complete list of news and articles from our website. NEWS Qt Group Introduces Clate for [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/development-platforms-for-edge-ai-when-engineering-apps-need-agentic-ai-real-time-sensing-embedded-week-insights/\">Development Platforms for Edge AI, When Engineering Apps Need Agentic AI, Real-Time Sensing: Embedded Week Insights<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "Altera Brings FPGAs to Physical AI With Agilex 2X and an Agentic Design Assistant", "source": "Embedded.com", "date": "2026-10-30", "url": "https://www.embedded.com/altera-brings-fpgas-to-physical-ai-with-agilex-2x-and-an-agentic-design-assistant/", "summary": "<p>Agilex 2X FPGAs and AI design agent deliver up to 10× faster design creation.<\/p>\n<p>The post <a href=\"https://www.embedded.com/altera-brings-fpgas-to-physical-ai-with-agilex-2x-and-an-agentic-design-assistant/\">Altera Brings FPGAs to Physical AI With Agilex 2X and an Agentic Design Assistant<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "Raspberry Pi Halloween Wise Cracking skull", "source": "Adafruit", "date": "2026-10-30", "url": "https://blog.adafruit.com/2026/10/30/raspberry-pi-halloween-wise-cracking-skull/", "summary": "&#160; &#160; Raspberry Pi Halloween Costume Detector Build a wise cracking skull to MC your Halloween costume party. This project uses a Raspberry Pi 5 paired with a NoIR PiCamera and speaker bonnet. The Pi runs a Python script with OpenCV person detection. When a person crosses paths with the skull, a picture is sent [&#8230;]"}, {"title": "NEW GUIDE: FLAC and Ogg Playback with CircuitPython #AdafruitLearningSystem #CircuitPython", "source": "Adafruit", "date": "2026-10-30", "url": "https://blog.adafruit.com/2026/10/30/new-guide-flac-and-ogg-playback-with-circuitpython-adafruitlearningsystem-circuitpython/", "summary": "A new guide in the Adafruit Learning System: FLAC and Ogg Playback with CircuitPython by Anne Barela with programming by Mikey Sklar. With CircuitPython Turbo on ESP32-S3, RP2350 (and similarly fast boards likely to follow), music playing capabilities have expanded. FLAC and Ogg Vorbis are popular open source audio formats that some prefer over MP3 [&#8230;]"}, {"title": "John Park’s CircuitPython Parsec: Cap Touch on STEMMA Ports", "source": "Adafruit", "date": "2026-10-30", "url": "https://blog.adafruit.com/2026/10/30/john-parks-circuitpython-parsec-cap-touch-on-stemma-ports/", "summary": "#circuitpythonparsec Plug-and-play cap touch sensing with STEMMA ports, plus bonus ground reference wire! Try out the code example To learn about CircuitPython: https://circuitpython.org PyPortal: https://www.adafruit.com/product/4116 &#160;"}, {"title": "Handwriting to pen plotting", "source": "Adafruit", "date": "2026-10-30", "url": "https://blog.adafruit.com/2026/10/30/handwriting-to-pen-plotting/", "summary": "Daniel Catt built a markdown to handwriting tool, written up in his newsletter at newsletter.revdancatt.com. He runs a Bantam Tools NextDraw 8511 pen plotter driven by Kitty, his AI assistant, which writes out his morning todo lists, addresses envelopes and now handles packing lists on A6 index cards and A5 notes. It is slower than [&#8230;]"}, {"title": "A dog’s paw print was found in a 3,700-year-old brick", "source": "Adafruit", "date": "2026-10-30", "url": "https://blog.adafruit.com/2026/10/30/dogs-paw-print-found-in-a-3700-year-old-brick/", "summary": "Andrew Paul, writing at Popular Science, reports on a Bronze Age mud brick in Turkey that carries a dog&#8217;s paw print. The find came from Tavşanlı Höyük, a mound site about 100 miles south of Istanbul that covers nearly 100 acres and holds Anatolian remains going back 8,000 years. Turkey&#8217;s Minister of Culture and Tourism, [&#8230;]"}, {"title": "Rolling Stone: the 200 greatest rock songs of the 21st century", "source": "Adafruit", "date": "2026-10-30", "url": "https://blog.adafruit.com/2026/10/30/rolling-stone-the-200-greatest-rock-songs-of-the-21st-century/", "summary": "Jason Kottke pointed to Rolling Stone&#8217;s list of the 200 greatest rock songs of the 21st century so far, writing about it on kottke.org. The top pick is &#8220;Maps&#8221; by the Yeah Yeah Yeahs. Kottke says he cannot argue with it. Rolling Stone also put all 200 songs into a YouTube playlist. Start to finish, [&#8230;]"}, {"title": "Patch Commodore 64 Kernal Roms to remap keyboard", "source": "Adafruit", "date": "2026-10-30", "url": "https://blog.adafruit.com/2026/10/30/patch-commodore-64-kernal-roms-to-remap-keyboard/", "summary": "Dave VW has posted a new way to remap the Commodore 64 keyboard, writing at Tech with Dave. Earlier remapping drivers loaded into lower BASIC RAM at a fixed address and vanished on restart. The keyboard tables actually live in the KERNAL ROM, which holds four maps: Normal, Shift, Commodore, and Control. The new program, [&#8230;]"}, {"title": "A magnetic lock opens by magic", "source": "Adafruit", "date": "2026-10-30", "url": "https://blog.adafruit.com/2026/10/30/a-magnetic-lock-opens-by-magic/", "summary": "Stephen Cass built a lockbox that opens only when the right gesture is traced with a magnet, and wrote it up for IEEE Spectrum. The sensor is SparkFun&#8217;s $100 magnetic imaging tile, a small-run board based on work by Peter Jansen. It carries an 8-by-8 grid of Hall-effect sensors that read both magnitude and polarity, [&#8230;]"}, {"title": "A bunch of items from Stanley Kubrick’s personal archive", "source": "Adafruit", "date": "2026-10-30", "url": "https://blog.adafruit.com/2026/10/30/a-bunch-of-items-from-stanley-kubricks-personal-archive/", "summary": "Jason Kottke, writing at kottke.org, notes that items from Stanley Kubrick&#8217;s personal archive are headed to auction early next year. The lots include Jack Torrance&#8217;s axe and the sisters&#8217; blue dresses from The Shining. Kubrick&#8217;s director&#8217;s chair is also in the sale, along with a chess set the director owned. See more at kottke.org."}, {"title": "doomformer: neural networks computed inside DOOM maps", "source": "Adafruit", "date": "2026-10-30", "url": "https://blog.adafruit.com/2026/10/30/doomformer-neural-networks-computed-inside-doom-maps/", "summary": "doomformer is a project from alp (@mottopanikeiku) that compiles an integer neural network into a DOOM map. Voodoo dolls do the arithmetic. Light levels and plane heights hold the values. Every value the map exposes is read back and compared against NumPy. One map puts 1,355 voodoo dolls to work on an MNIST network. The [&#8230;]"}, {"title": "Build an Aliens style motion scanner with an ESP32-S3 and radar", "source": "Adafruit", "date": "2026-10-30", "url": "https://blog.adafruit.com/2026/10/30/build-an-aliens-style-motion-scanner-with-an-esp32-s3-and-radar/", "summary": "Julian Horsey at Geeky Gadgets writes about a handheld radar built by NorthWorks Lab, modeled on the motion tracker from the movie Aliens. It pairs an ESP32-S3 microcontroller with an LD2450 radar module, a small display and a speaker. The LD2450 reports the position of moving targets, and the ESP32-S3 turns that data into an [&#8230;]"}, {"title": "A compact conversational language model that chats in plain English and writes Python", "source": "Adafruit", "date": "2026-10-30", "url": "https://blog.adafruit.com/2026/10/30/a-compact-conversational-language-model-that-chats-in-plain-english-and-writes-python/", "summary": "Kristijonas Adomaitis has published Kadmos-1 on GitHub, a decoder-only transformer language model with 45.8 million parameters that holds a short conversation and writes small Python functions. The architecture, tokenizer and weights were built in the repository from random initialisation, not fine-tuned from an existing pretrained model. The model file is about 110 lines of PyTorch. [&#8230;]"}, {"title": "VIAVI Expands AI-Native Testing with MCP Server Framework for Network and Security Testing", "source": "EE Journal", "date": "2026-10-30", "url": "https://www.eejournal.com/industry_news/viavi-expands-ai-native-testing-with-mcp-server-framework-for-network-and-security-testing/", "summary": "VIAVI Solutions Inc. (NASDAQ: VIAV) has announced the integration of a Model Context Protocol (MCP) Server Framework into the NITRO® AI portfolio, enabling engineers to configure, run and analyze tests using natural-language prompts. The framework integrates with the VIAVI TestCenter (network performance testing), CyberFlood (security and application performance testing) and TeraVM (secure access/ZTNA testing) platforms. [&#8230;]"}, {"title": "Pickering Interfaces launches Remote Gateway software for remote control of PXI test systems", "source": "EE Journal", "date": "2026-10-30", "url": "https://www.eejournal.com/industry_news/pickering-interfaces-launches-remote-gateway-software-for-remote-control-of-pxi-test-systems/", "summary": "Pickering Interfaces, a provider of modular signal switching and simulation solutions for electronic test and verification, has introduced Pickering Remote Gateway. The new gRPC-based software enables engineers to control Pickering PXI/PXIe products remotely from applications running on separate computers, across multiple operating systems and programming languages. Pickering Remote Gateway allows test hardware to remain close [&#8230;]"}, {"title": "TDK introduces programmable and scalable DC-DC power supplies for emerging DC-grid architectures", "source": "EE Journal", "date": "2026-10-30", "url": "https://www.eejournal.com/industry_news/tdk-introduces-programmable-and-scalable-dc-dc-power-supplies-for-emerging-dc-grid-architectures/", "summary": "TDK Corporation (TSE:6762) has launched the TDK-Lambda EDC series of programmable DC-DC power supplies, developed to support growing demand for DC-grid architectures as the use of renewable energy sources and battery storage increases. The compact, high-power series, which includes 1.5 kW and 3 kW models with constant-voltage (CV) and constant-current (CC) operation, will facilitate simpler [&#8230;]"}, {"title": "Winning the V‑Cycle: Agentic AI Accelerates Safety‑Critical Automotive Software", "source": "EE Journal", "date": "2026-10-30", "url": "https://www.eejournal.com/fish_fry/winning-the-v-cycle-agentic-ai-accelerates-safety-critical-automotive-software/", "summary": "<img alt=\"\" class=\"webfeedsFeaturedVisual wp-post-image\" height=\"175\" src=\"https://www.eejournal.com/wp-content/uploads/2026/10/iStock-522473736-300x175.jpg\" style=\"display: block; margin-bottom: 5px; clear: both;\" width=\"300\" />&#160; My podcast guest this week is Travis Bone from TASKING. Travis and I chat about their recent big win at the AWS &#8220;Accelerating the V-Cycle with Agentic AI&#8221; hackathon alongside partners Infineon and DLR. We explore how their governed, agentic AI workflow connects trusted hardware intelligence directly into the V-cycle, from automating compliance, test [&#8230;]"}, {"title": "$2600 LattePanda Sigma 2 single board server features 180 TOPS Intel Core Ultra X7 358H SoC for local AI applications", "source": "CNX Software", "date": "2026-10-29", "url": "https://www.cnx-software.com/2026/10/29/2600-lattepanda-sigma-2-single-board-server-features-180-tops-intel-core-ultra-x7-358h-soc-for-local-ai-applications/", "summary": "<div><img alt=\"LattePanda Sigma 2\" class=\"attachment-medium size-medium wp-post-image\" height=\"552\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/10/LattePanda-Sigma-2-720x552.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>The LattePanda Sigma 2 is a compact single board server/computer powered by an Intel Core Ultra X7 358H Panther Lake-H processor with Intel Arc B390 graphics and a 50 TOPS NPU delivering up to 180 TOPS of combined performance for local AI workloads. The board features up to 64GB of LPDDR5X-8533 RAM, three M.2 M-Key slots, one M.2 E-Key slot, and an OCuLink port for storage, wireless, and accelerator expansion, as well as two Thunderbolt 4 ports, dual 10GbE, USB 3.2 Gen 2 and USB 2.0 ports, and HDMI 2.1, DisplayPort 2.1, and eDP 1.5 display interfaces. Key Specifications SoC &#8211; Intel Core Ultra X7 Processor 358H CPU – 16-core (4P + 8E + 4LPE) @ 1.9/1.5/1.5 GHz (base frequency), 4.8/3.5/3.5 GHz (Turbo frequency) Cache – 18 MB Intel Smart Cache GPU – 12-core Intel Arc B390 GPU @ 2.5 GHz up to 122 TOPS (INT8) AI accelerator – 50 [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/10/29/2600-lattepanda-sigma-2-single-board-server-features-180-tops-intel-core-ultra-x7-358h-soc-for-local-ai-applications/\">$2600 LattePanda Sigma 2 single board server features 180 TOPS Intel Core Ultra X7 358H SoC for local AI applications<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "BeagleConnect QuadESC 4-channel BLDC motor controller uses TI’s AM13E23019-based Torque module", "source": "CNX Software", "date": "2026-10-29", "url": "https://www.cnx-software.com/2026/10/29/beagleconnect-quadesc-4-channel-bldc-motor-controller-ti-am13e23019-based-torque-module/", "summary": "<div><img alt=\"BeagleConnect QuadESC Carrier and BeagleConnect Torque SoM\" class=\"attachment-medium size-medium wp-post-image\" height=\"480\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/10/BeagleConnect-QuadESC-Carrier-and-BeagleConnect-Torque-SoM-720x480.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>BeagleBoard.org has introduced the BeagleConnect QuadESC, an open-source 4-channel BLDC motor controller/carrier board built around the BeagleConnect Torque SoM. The SoM features TI&#8217;s 200 MHz AM13E23019 Arm Cortex-M33 microcontroller with a trigonometric math unit (TMU) and a TinyEngine neural-network accelerator for edge AI applications. The QuadESC carrier board supports four three-phase BLDC motor outputs, twelve current and twelve voltage sensing channels, four temperature sensors, and battery voltage monitoring. It also includes an eight-pin flight controller connector with DShot, telemetry, and current reporting signals, along with SWD debugging, a buzzer connector, and onboard power regulation. BeagleConnect Torque SoM The Torque SoM can also be integrated with custom carrier boards for robotics, motor control, and CAN-connected applications. It provides the processing, sensing, and communication interfaces, while external hardware supplies the motor power. Specifications: Main MCU– Texas Instruments AM13E23019 CPU core &#8211; Arm Cortex-M33 MCU @ 200 MHz with FPU Memory &#8211; 128KB [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/10/29/beagleconnect-quadesc-4-channel-bldc-motor-controller-ti-am13e23019-based-torque-module/\">BeagleConnect QuadESC 4-channel BLDC motor controller uses TI&#8217;s AM13E23019-based Torque module<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Ceva Expands NeuPro NPU Portfolio into AI Infrastructure", "source": "Embedded.com", "date": "2026-10-29", "url": "https://www.embedded.com/ceva-expands-neupro-npu-portfolio-into-ai-infrastructure/", "summary": "<p>Ceva Inc. has unveiled its next-generation NeuPro neural processing unit (NPU) portfolio, targeting AI workloads ranging from always-on sensing and advanced edge systems to cloud and data center infrastructure. Built on a common architecture and unified software development kit (SDK), the new portfolio delivers up to 2× higher AI throughput per square millimeter and 50% [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/ceva-expands-neupro-npu-portfolio-into-ai-infrastructure/\">Ceva Expands NeuPro NPU Portfolio into AI Infrastructure<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "Celus Adds Agentic AI Workflow to Its Electronics Design Assistant", "source": "Embedded.com", "date": "2026-10-29", "url": "https://www.embedded.com/celus-adds-agentic-ai-workflow-to-its-electronics-design-assistant/", "summary": "<p>Celus upgrades its Design Assistant with an #agenticAI workflow that helps hardware #engineers plan the system architecture and component selection before schematic capture. #EmbeddedSystemDesign @Celusio<\/p>\n<p>The post <a href=\"https://www.embedded.com/celus-adds-agentic-ai-workflow-to-its-electronics-design-assistant/\">Celus Adds Agentic AI Workflow to Its Electronics Design Assistant<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "Renesas Expands RL78 Family with Ultra-Low-Power 16-Bit RL78/G21 MCU Optimized for Smart Appliance System Control", "source": "EE Journal", "date": "2026-10-29", "url": "https://www.eejournal.com/industry_news/renesas-expands-rl78-family-with-ultra-low-power-16-bit-rl78-g21-mcu-optimized-for-smart-appliance-system-control/", "summary": "Extends proven low-power leadership by cutting down power consumption by half, achieving top ULPMark®-PeripheralProfile benchmark scores, and increasing reliability with ±4 kV HBM ESD tolerance. Expands the existing RL78/G23 lineup with expanded touch-key functionality for advanced HMI devices, along with enhanced security.  Renesas Electronics Corporation (TSE:6723), a premier supplier of advanced semiconductor solutions, today announced [&#8230;]"}, {"title": "Advanced Energy Unveils Centra Smart Hub for Improved Temperature Measurement in Next-Generation Semiconductor Tools", "source": "EE Journal", "date": "2026-10-29", "url": "https://www.eejournal.com/industry_news/advanced-energy-unveils-centra-smart-hub-for-improved-temperature-measurement-in-next-generation-semiconductor-tools/", "summary": "Advanced Energy Industries Inc. (Nasdaq: AEIS), a global leader in highly engineered, precision power conversion, measurement and control solutions, today launched the new Centra™ Smart Hub at SEMICON West in San Francisco. The Centra Smart Hub, combined with Advanced Energy’s new Remote Smart Sensors (RSS), enables more accurate wafer-temperature measurement and real-time temperature control for [&#8230;]"}, {"title": "TDK launches 1000 V and 1500 V contactors for xEVs, DC fast-charging, and AI data center infrastructure", "source": "EE Journal", "date": "2026-10-29", "url": "https://www.eejournal.com/industry_news/tdk-launches-1000-v-and-1500-v-contactors-for-xevs-dc-fast-charging-and-ai-data-center-infrastructure/", "summary": "<img alt=\"\" class=\"webfeedsFeaturedVisual wp-post-image\" height=\"225\" src=\"https://www.eejournal.com/wp-content/uploads/2026/10/261028_TDK_Press-Picture_B_Background_HVC28_HVC29-300x225.jpg\" style=\"display: block; margin-bottom: 5px; clear: both;\" width=\"300\" />TDK Corporation (TSE: 6762) has introduced the HVC28 and HVC29 series of gas-filled, high-voltage DC contactors with optional mechanical auxiliary contact. Both series are available with continuous current ratings of 300 A, 400 A, 500 A, and 600 A. The HVC28 is designed primarily for automotive systems with operating DC voltages of up to 1000 V and high short-circuit currents. Meanwhile, [&#8230;]"}, {"title": "Hirose Develops Narrow-Width Hybrid FPC-to-Board Connector For Space-constrained Applications", "source": "EE Journal", "date": "2026-10-29", "url": "https://www.eejournal.com/industry_news/hirose-develops-narrow-width-hybrid-fpc-to-board-connector-for-space-constrained-applications/", "summary": "<img alt=\"\" class=\"webfeedsFeaturedVisual wp-post-image\" height=\"253\" src=\"https://www.eejournal.com/wp-content/uploads/2026/10/Hirose-BK19-Series-Pr-300x253.png\" style=\"display: block; margin-bottom: 5px; clear: both;\" width=\"300\" />Hirose has expanded its hybrid FPC-to-board connector family with a narrow-width, ultra-low-profile version that enables slimmer, more compact designs for portable devices. Among the world&#8217;s smallest single-row FPC-to-board connectors, the BK19 Series features a 0.3 mm pitch, 0.5 mm stacking height, and 1.2 mm width. The BK19 Series utilizes a fully armored design for enhanced [&#8230;]"}, {"title": "Saelig Introduces Euroquartz High Power RF Cavity Filters", "source": "EE Journal", "date": "2026-10-29", "url": "https://www.eejournal.com/industry_news/saelig-introduces-euroquartz-high-power-rf-cavity-filters/", "summary": "Saelig Company, Inc.  has announced the availability of Euroquartz RF Cavity Filters for a variety of specifications, including high-pass, low-pass, band-stop, and notch filters. The filters can be custom tailored for frequency tuning, bandwidth adjustment, attenuation control, mechanical sizing, impedance matching, connector selection, group delay performance, or power capacity. Their physical size and metallic construction allow them [&#8230;]"}, {"title": "AI-Based Electronic Design for When Failure Is Not an Option", "source": "EE Journal", "date": "2026-10-29", "url": "https://www.eejournal.com/article/ai-based-electronic-design-for-when-failure-is-not-an-option/", "summary": "<img alt=\"\" class=\"webfeedsFeaturedVisual wp-post-image\" height=\"150\" src=\"https://www.eejournal.com/wp-content/uploads/2026/10/max-0531-image-for-home-page-circuit-mind-300x150.jpg\" style=\"display: block; margin-bottom: 5px; clear: both;\" width=\"300\" />Artificial intelligence is making its presence felt in just about every corner of electronic design, but there&#8217;s a world of difference between generating a circuit and creating one you can trust. What happens when the stakes are high, the designs are complex, and getting things wrong simply isn&#8217;t an option? In my recent column, No [&#8230;]"}, {"title": "LILYGO T-Display K230 RISC-V AI dev kit features AMOLED, LoRa, and keyboard with optional LTE-M/NB-IoT cellular connectivity", "source": "CNX Software", "date": "2026-10-28", "url": "https://www.cnx-software.com/2026/10/28/lilygo-t-display-k230-risc-v-ai-dev-kit-features-amoled-lora-and-an-optional-keyboard/", "summary": "<div><img alt=\"LILYGO T Display K230 optional QWERTY keyboard expansion board\" class=\"attachment-medium size-medium wp-post-image\" height=\"480\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/10/LILYGO-T-Display-K230-optional-QWERTY-keyboard-expansion-board-720x480.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>LILYGO T-Display K230 is a handheld dev kit based on Canaan&#8217;s Kendryte K230 dual-core 64-bit RISC-V processor. The kit features a 4.1-inch AMOLED touchscreen and supports an optional detachable keyboard with battery and optional nRF9151 cellular and GNSS connectivity. The device also comes with 1GB LPDDR4 RAM, a 2MP camera, HDMI output, Ethernet, WiFi 4, and either an SX1262 or LR2021 LoRa transceiver. These features make this kit suitable for remote monitoring, wireless communication, and other embedded applications. LILYGO T-Display K230 Kit specifications: SoC – Kendryte K230 CPU 64-bit RISC-V processor @ 1.6GHz with RISC-V Vector Extension 1.0, FPU 64-bit RISC-V processor @ 800MHz with support for RV64GCB instruction set; AI accelerator KPU with support for INT8 and INT16 Compatible with TVM, TensorFlow, PyTorch, ONNX Typical network performance: Resnet 50 ≥ 85fps @ INT8; Mobilenet_v2 ≥ 670fps @ INT8; YoloV5S ≥ 38fps @INT8; GPU – 2.5D graphics engine DPU – [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/10/28/lilygo-t-display-k230-risc-v-ai-dev-kit-features-amoled-lora-and-an-optional-keyboard/\">LILYGO T-Display K230 RISC-V AI dev kit features AMOLED, LoRa, and keyboard with optional LTE-M/NB-IoT cellular connectivity<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Picotronix modular oscilloscope and logic analyzer features two Raspberry Pi Pico 2 boards (Crowdfunding)", "source": "CNX Software", "date": "2026-10-28", "url": "https://www.cnx-software.com/2026/10/28/picotronix-modular-oscilloscope-and-logic-analyzer-features-two-raspberry-pi-pico-2-boards/", "summary": "<div><img alt=\"Picotronix modular oscilloscope logic analyzer\" class=\"attachment-medium size-medium wp-post-image\" height=\"438\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/10/Picotronix-modular-oscilloscope-logic-analyzer-720x438.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Picotronix is a modular oscilloscope, logic analyzer, and frequency meter from Sydney-based Thort Werx Pty Ltd, based on two Raspberry Pi Pico 2 units, more exactly a Pico 2 used as a signal processor and a Pico 2 W used to drive the display and for wireless connectivity. The solution is comprised of the Picotronix Main Module with an integrated LCD and three expansion ports, used to connect picoPods plug-in expansion modules to add high-speed ADCs, mixed-logic family logic state analysis, a waveform generator, analog conditioning, and more. Picotronix key features and specifications: Main Module Two-channel digital storage oscilloscope 8-channel logic analyzer, expandable up to 14 channels with a picoPod; up to 150 MHz sample rate Frequency meter Display &#8211; 320 × 240 color LCD from Pimoroni Three expansion ports, two 10-pin analog ports, and one 26-pin multifunction port Analog channel Accepts 3 Vpp or 16.6 Vpp at 1 MΩ, [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/10/28/picotronix-modular-oscilloscope-and-logic-analyzer-features-two-raspberry-pi-pico-2-boards/\">Picotronix modular oscilloscope and logic analyzer features two Raspberry Pi Pico 2 boards (Crowdfunding)<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Qt Group Introduces Clate for AI-Powered Embedded UX Design", "source": "Embedded.com", "date": "2026-10-28", "url": "https://www.embedded.com/qt-group-introduces-clate-for-ai-powered-embedded-ux-design/", "summary": "<p>Qt Group has announced Clate, a design tool developed specifically for user interface and user experience (U
