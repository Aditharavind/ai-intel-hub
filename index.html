ion edge AI cameras powered by a Qualcomm DragonWing QCS8550. Connected through the camera&#8217;s M8 interface, it adds GPIO, relay, CAN, serial, and USB connectivity, allowing OAK4-based systems to interface directly with sensors, actuators, PLCs, motors, and other industrial equipment for machine vision and automation applications. The prototype module features 16 GPIOs, four 16A relays, CAN 2.0, RS232, two USB 2.0 Type-A ports, an isolated strobe output, onboard audio, three buttons, and three status LEDs. It is powered directly from the OAK4 M8 connector, and supports DIN rail and VESA mounting. Luxonis M8 Controller Box specifications: MCU – Raspberry Pi RP2040 dual-core Arm Cortex M0+ @ 133 MHz with 264KB SRAM Host interface M8 connector for connecting Luxonis OAK4 cameras (standalone mode only) M8 passthrough port Audio 3.5mm headphone/AUX jack with mic input Onboard [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/07/30/luxonis-m8-controller-box-adds-industrial-i-os-can-bus-and-relay-control-to-oak4-ai-vision-cameras/\">Luxonis M8 Controller Box adds industrial I/Os, CAN Bus, and relay control to OAK4 AI vision cameras<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Credit card-sized Edge AI single board computers are powered by TI AM62A (2 TOPS) or AM68A (8 TOPS) SoC", "source": "CNX Software", "date": "2026-07-30", "url": "https://www.cnx-software.com/2026/07/30/credit-card-sized-edge-ai-sbc-texas-instruments-am62a-2-tops-am68a-8-tops-soc/", "summary": "<div><img alt=\"InHand Mo 62A SBC\" class=\"attachment-medium size-medium wp-post-image\" height=\"500\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/07/InHand-Mo-62A-SBC-720x500.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>InHand Mo 62A and Mo 68A are two credit card-sized Edge AI single board computers (SBCs) powered by Texas Instruments AM62A and AM68A processors, delivering respectively 2 TOPS and 8 TOPS of AI performance. Designed for AI Vision applications, the Mo 62A and Mo 68A SBCs support MIPI CSI camera input, Raspberry Pi HAT expansion boards, integrate 7th-generation ISP image processing capabilities, and handle H.264 / H.265 video encoding and decoding. However, they offer a different range of ports, as you&#8217;ll see in the specifications below. Target applications include industrial equipment, access control systems, robots, smart cameras, and visual inspection terminals. InHand Mo 62A Mo 62A specifications: SoC – Texas Instruments AM62A74 SoC Application processor – Up to four Arm Cortex- A53 cores @ 1.4GHz Real-time cores 1x Cortex-R5F @ 800MHz (MPU Channel with FFI) 1x Cortex-R5F @ 800MHz to support Device Management 3D GPU &#8211; None VPU &#8211; 4Kp30 [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/07/30/credit-card-sized-edge-ai-sbc-texas-instruments-am62a-2-tops-am68a-8-tops-soc/\">Credit card-sized Edge AI single board computers are powered by TI AM62A (2 TOPS) or AM68A (8 TOPS) SoC<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Renesas Upgrades DDR5 MRDIMM Chipset", "source": "Embedded.com", "date": "2026-07-30", "url": "https://www.embedded.com/renesas-upgrades-ddr5-mrdimm-chipset/", "summary": "<p>Renesas Electronics Corp. has launched its third‑generation (Gen 3) DDR5 multiplexed rank dual in‑line memory module (MRDIMM) chipset solutions with server-class MRDIMM speeds up to 16,000 mega transfers per second (MT/s). The new devices include the RRG5013 multiplexed registering clock driver (MRCD) and RRG5103 multiplexed data buffer (MDB). Targeting increased demand for higher memory bandwidth driven by AI data centers, cloud infrastructure, and accelerated [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/renesas-upgrades-ddr5-mrdimm-chipset/\">Renesas Upgrades DDR5 MRDIMM Chipset<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "Why Sustained Performance Defines the Next Phase of Edge AI", "source": "Embedded.com", "date": "2026-07-30", "url": "https://www.embedded.com/why-sustained-performance-defines-the-next-phase-of-edge-ai/", "summary": "<p>Avnet Silica details why sustained performance, not peak compute, will define the next phase of edge AI.<\/p>\n<p>The post <a href=\"https://www.embedded.com/why-sustained-performance-defines-the-next-phase-of-edge-ai/\">Why Sustained Performance Defines the Next Phase of Edge AI<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "Modular Smart Lamp – E26 Bulb Base Configurator #3DThursday #3DPrinting", "source": "Adafruit", "date": "2026-07-30", "url": "https://blog.adafruit.com/2026/07/30/modular-smart-lamp-e26-bulb-base-configurator-3dthursday-3dprinting/", "summary": "Shared by Embrace Making on MakerWorld: A flexible modular smart lamp built around an E26 bulb base and collet system. Mix and match parts to make it funky, classy, or minimalist — swap looks quickly and easily. Fully customizable and remix-friendly. Download the files and learn more Every Thursday is #3dthursday here at Adafruit! The [&#8230;]"}, {"title": "16×16 LED Matrix Diffuser Enclosure – Stencil-Compatible #3Dprinting #3DThursday", "source": "Adafruit", "date": "2026-07-30", "url": "https://blog.adafruit.com/2026/07/30/16x16-led-matrix-diffuser-enclosure-stencil-compatible-3dprinting-3dthursday/", "summary": "A 16×16 LED matrix enclosure designed to work with stencil sheets — follow-up to the designer&#8217;s popular 8×32 enclosure. March 2026 update re-uploaded missing STLs and added vented components for full-brightness heat management. Ridges on the back plate and notches on the grid designed with intent — YouTube walkthrough available. By MyBritishComputerGuy (Thingiverse) Download files: [&#8230;]"}, {"title": "EMASS Collaborates with Bosch Sensortec to Deliver Edge AI Asset Tracking Solution", "source": "EE Journal", "date": "2026-07-30", "url": "https://www.eejournal.com/industry_news/emass-collaborates-with-bosch-sensortec-to-deliver-edge-ai-asset-tracking-solution/", "summary": "LOS ANGELES  – EMASS, a Nanoveu subsidiary specializing in ultra-efficient edge AI semiconductor technology, today announced a collaboration with Bosch Sensortec to develop an intelligent asset-tracking reference design that combines advanced sensing with ultra-low-power edge AI. The jointly developed platform enables battery-powered asset trackers to process data locally and transmit only meaningful events instead of &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/emass-collaborates-with-bosch-sensortec-to-deliver-edge-ai-asset-tracking-solution/\">Read More &#8594;<span class=\"screen-reader-text\"> \"EMASS Collaborates with Bosch Sensortec to Deliver Edge AI Asset Tracking Solution\"<\/span><\/a>"}, {"title": "ALL​.SPACE Launches Hydra MAX Wideband Ka Platform for Resilient Multi-Orbit Operations", "source": "EE Journal", "date": "2026-07-30", "url": "https://www.eejournal.com/industry_news/all-space-launches-hydra-max-wideband-ka-platform-for-resilient-multi-orbit-operations-2/", "summary": "Hydra MAX unlocks next-generation wideband Ka networks while maintaining simultaneous multi-orbit connectivity on the move, delivering 500 MHz of instantaneous bandwidth per Ka beam Tested with government customers, Hydra MAX provides network-agnostic interoperability across leading commercial and government Ka-band networks, along with sovereign modem flexibility and optional DIFI-over-fiber connectivity The launch follows York Space Systems&#8217; &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/all-space-launches-hydra-max-wideband-ka-platform-for-resilient-multi-orbit-operations-2/\">Read More &#8594;<span class=\"screen-reader-text\"> \"ALL​.SPACE Launches Hydra MAX Wideband Ka Platform for Resilient Multi-Orbit Operations\"<\/span><\/a>"}, {"title": "Renesas Gen 3 MRDIMM Chipset Solutions Advance DDR5 Memory Performance to 16,000 MT/s for Next-Gen AI and HPC Applications", "source": "EE Journal", "date": "2026-07-30", "url": "https://www.eejournal.com/industry_news/renesas-gen-3-mrdimm-chipset-solutions-advance-ddr5-memory-performance-to-16000-mt-s-for-next-gen-ai-and-hpc-applications/", "summary": "TOKYO, Japan — July 30, 2026 — Renesas Electronics Corporation (TSE: 6723), a premier supplier of advanced semiconductor solutions, today announced its third‑generation (Gen 3) DDR5 Multiplexed Rank Dual In‑Line Memory Module (MRDIMM) chipset solutions, delivering DDR5 server-class MRDIMM speeds up to 16,000 mega transfers per second (MT/s). The new solutions are designed to address the growing demand for &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/renesas-gen-3-mrdimm-chipset-solutions-advance-ddr5-memory-performance-to-16000-mt-s-for-next-gen-ai-and-hpc-applications/\">Read More &#8594;<span class=\"screen-reader-text\"> \"Renesas Gen 3 MRDIMM Chipset Solutions Advance DDR5 Memory Performance to 16,000 MT/s for Next-Gen AI and HPC Applications\"<\/span><\/a>"}, {"title": "FocalPoint and STMicroelectronics enter into a commercial agreement to deliver enhanced GNSS reliability for automotive applications", "source": "EE Journal", "date": "2026-07-30", "url": "https://www.eejournal.com/industry_news/focalpoint-and-stmicroelectronics-enter-into-a-commercial-agreement-to-deliver-enhanced-gnss-reliability-for-automotive-applications/", "summary": "Cambridge, UK – 14th July 2026: FocalPoint, a UK-based leader in GNSS (Global Navigation Satellite System) software for automotive, wearables, and smartphones, today announced that it has entered into a commercial agreement with STMicroelectronics. The agreement marks a major step towards delivering highly reliable vehicle positioning in challenging GNSS environments. Building on the collaboration first announced in &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/focalpoint-and-stmicroelectronics-enter-into-a-commercial-agreement-to-deliver-enhanced-gnss-reliability-for-automotive-applications/\">Read More &#8594;<span class=\"screen-reader-text\"> \"FocalPoint and STMicroelectronics enter into a commercial agreement to deliver enhanced GNSS reliability for automotive applications\"<\/span><\/a>"}, {"title": "Synopsys Showcases Comprehensive Autonomous Engineering Workflows from Silicon to Systems, Developed with NVIDIA Technology", "source": "EE Journal", "date": "2026-07-30", "url": "https://www.eejournal.com/industry_news/synopsys-showcases-comprehensive-autonomous-engineering-workflows-from-silicon-to-systems-developed-with-nvidia-technology/", "summary": "Key Highlights Synopsys unveils a fully autonomous long-running design verification agent that orchestrates the entire chip verification cycle delivering up to 50X faster time-to-validated RTL while achieving 20% additional coverage improvement Demonstrating Synopsys&#8217; first fully autonomous computer-aided engineering (CAE) workflow for thermal management and electronic device cooling capable of autonomously executing set-up, pre-processing, and post-processing &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/synopsys-showcases-comprehensive-autonomous-engineering-workflows-from-silicon-to-systems-developed-with-nvidia-technology/\">Read More &#8594;<span class=\"screen-reader-text\"> \"Synopsys Showcases Comprehensive Autonomous Engineering Workflows from Silicon to Systems, Developed with NVIDIA Technology\"<\/span><\/a>"}, {"title": "NXP RW610FML Wi-Fi 6 and BLE 5.4 module features RW610 Cortex-M33 wireless MCU", "source": "CNX Software", "date": "2026-07-29", "url": "https://www.cnx-software.com/2026/07/29/nxp-rw610fml-wi-fi-6-and-ble-5-4-module-features-rw610-cortex-m33-wireless-mcu/", "summary": "<div><img alt=\"NXP RW610FML Scalable Wi Fi 6 and Bluetooth LE Combo Module\" class=\"attachment-medium size-medium wp-post-image\" height=\"480\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/07/NXP-RW610FML-Scalable-Wi-Fi-6-and-Bluetooth-LE-Combo-Module-720x480.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>NXP has introduced the RW610FML, a compact, low-power, certified Wi-Fi 6 and Bluetooth Low Energy (BLE) 5.4 wireless module based on the company&#8217;s RW610 Cortex-M33 microcontroller, the little brother of the RW612 without an 802.15.4 radio. Designed for smart appliances, home automation, industrial gateways, and medical devices, the surface-mount module combines the 260 MHz Arm Cortex-M33 wireless SoC with 8MB of on-module NOR flash, a built-in antenna, an RF matching circuit, and a crystal oscillator. NXP RW610FML Specifications: Wireless MCU – NXP RW610 CPU Core – 260 MHz Arm Cortex-M33 core with Arm TrustZone-M Internal memory – 1.2 MB embedded on-chip SRAM Connectivity Wi-Fi – Dual-band 2.4 GHz and 5 GHz Wi-Fi 6 (IEEE 802.11a/b/g/n/ac/ax) SISO 20 MHz channel bandwidth Up to MCS9 (114 Mbps) peak data rate Bluetooth – Bluetooth Low Energy (LE) supporting 2 Mbit/s high-speed mode, long-range operation, and extended advertising Storage &#8211; 8 MB NOR flash Castellated [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/07/29/nxp-rw610fml-wi-fi-6-and-ble-5-4-module-features-rw610-cortex-m33-wireless-mcu/\">NXP RW610FML Wi-Fi 6 and BLE 5.4 module features RW610 Cortex-M33 wireless MCU<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "7.6-inch square HDMI displays with USB capacitive touchscreen offered at 1200×1200 or 800×800 resolution", "source": "CNX Software", "date": "2026-07-29", "url": "https://www.cnx-software.com/2026/07/29/7-6-inch-square-hdmi-displays-with-usb-capacitive-touchscreen-offered-at-1200x1200-or-800x800-resolution/", "summary": "<div><img alt=\"7.6-inch square HDMI touch display\" class=\"attachment-medium size-medium wp-post-image\" height=\"387\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/07/7.6-inch-square-HDMI-touch-display-720x387.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>VIEWE UEDX12120076-HMD-RB-A and UEDX80800076-HMD-RB-A are 7.6-inch square HDMI capacitive touch displays with 1200&#215;1200 and 800&#215;800 resolution, respectively. We had previously seen 4-inch square HDMI +USB touch displays with 720×720 resolution for Raspberry Pi or other SBCs, but if you need something larger, VIEWE has now launched 7.6-inch variants with higher resolutions. VIEWE UEDX12120076-HMD-RB-A/UEDX80800076-HMD specifications: Display 7.6-inch MIPI DSI square IPS display Resolution UEDX80800076-HMD-RB-A &#8211; 800 x 800 UEDX12120076-HMD-RB-A &#8211; 1200 x 1200 Display driver ILI9881C for UEDX80800076-HMD-RB-A Potentially HX8279 for UEDX12120076-HMD-RB-A Brightness – 1,000 cd/㎡ Active area – 135.36 x 135.36 mm Touchscreen – Optional 5-point capacitive touchscreen via USB-C port (likely FT6336U touch IC) Video Input Mini HDMI 1.4 ITE HDMI input to MIPI DSI bridge based on the blurry photo of the controller. USB – USB-C port for power and touchscreen Misc &#8211; LED lifetime: 30,000 hours Power Supply &#8211; 5V via USB-C port Dimensions – 148.24 x [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/07/29/7-6-inch-square-hdmi-displays-with-usb-capacitive-touchscreen-offered-at-1200x1200-or-800x800-resolution/\">7.6-inch square HDMI displays with USB capacitive touchscreen offered at 1200&#215;1200 or 800&#215;800 resolution<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Sovol M1D hybrid IDEX 3D printer features 6 interchangeable toolheads for multi-color and multi-material prints (Crowdfunding)", "source": "CNX Software", "date": "2026-07-29", "url": "https://www.cnx-software.com/2026/07/29/sovol-m1d-hybrid-idex-3d-printer-features-6-interchangeable-toolheads-for-multi-color-and-multi-material-prints/", "summary": "<div><img alt=\"Sovol M1D IDEX Tool Changing 3D Printer\" class=\"attachment-medium size-medium wp-post-image\" height=\"480\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/07/Sovol-M1D-IDEX-Tool-Changing-3D-Printer-720x480.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Sovol has launched the M1D, an open-source IDEX (Independent Dual Extruder) 3D printer with a fixed dual-extruder architecture and interchangeable toolheads that support up to seven independently heated toolheads (one fixed and six swappable). It comes in two variants: the open-frame M1D Essential and the M1D Advanced, which adds a full enclosure and a chamber heating module capable of reaching up to 60°C. The M1D uses a patented automatic tool changer for swapping print heads in as little as five seconds and supports Single, Multi-Head, Copy, and Mirror printing modes. It enables multi-material or/and multi-color prints, including adding water-soluble support to a print to remove the need to manually remove support (see video at the end of this post for demo). The printer targets makers, engineers, prototype development, and small-scale production by reducing purge waste while improving printing efficiency and material flexibility. Sovol M1D specifications: Printing technology – FDM (Fused Deposition Modeling) Storage – [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/07/29/sovol-m1d-hybrid-idex-3d-printer-features-6-interchangeable-toolheads-for-multi-color-and-multi-material-prints/\">Sovol M1D hybrid IDEX 3D printer features 6 interchangeable toolheads for multi-color and multi-material prints (Crowdfunding)<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "BrainChip Launches AKD1500 M.2 Module for Fanless Edge AI", "source": "Embedded.com", "date": "2026-07-29", "url": "https://www.embedded.com/brainchip-launches-akd1500-m-2-module-for-fanless-edge-ai/", "summary": "<p>BrainChip Inc. has introduced a new M.2 version of its AKD1500 edge AI accelerator, enabling compact, fanless, and plug-and-play deployment of neuromorphic artificial intelligence capabilities in industrial and commercial systems. Based on the Akida neuromorphic processor architecture, the module provides hardware designers with a low-power solution for adding on-device AI functionality to existing platforms without [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/brainchip-launches-akd1500-m-2-module-for-fanless-edge-ai/\">BrainChip Launches AKD1500 M.2 Module for Fanless Edge AI<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "Emerson Expands AI Capabilities Across Test Environment", "source": "Embedded.com", "date": "2026-07-29", "url": "https://www.embedded.com/emerson-expands-ai-capabilities-across-test-environment/", "summary": "<p>NI Nigel AI enhancements accelerate test productivity by up to 50 percent.<\/p>\n<p>The post <a href=\"https://www.embedded.com/emerson-expands-ai-capabilities-across-test-environment/\">Emerson Expands AI Capabilities Across Test Environment<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "TDK, LG Innotek Collaborate on Physical AI Solutions", "source": "Embedded.com", "date": "2026-07-28", "url": "https://www.embedded.com/tdk-lg-innotek-collaborate-on-physical-ai-solutions/", "summary": "<p>TDK and LG Innotek have entered into a strategic partnership to develop sensing technologies for physical AI applications, with an initial focus on next-generation vision and tactile sensing modules for humanoid robots. The collaboration combines LG Innotek's expertise in optical systems and ultra-precision module design with TDK's sensor technology portfolio to create integrated solutions that [...]<\/p>\n
