full-bridge module family uses the industry-standard SiCPAK™ form factor and has a [&#8230;]"}, {"title": "Darveen Unveils DPC-1210 21.5-Inch Industrial Panel PC with Intel® Core™ Ultra 5 Processors for Edge AI Applications", "source": "EE Journal", "date": "2026-10-23", "url": "https://www.eejournal.com/industry_news/darveen-unveils-dpc-1210-21-5-inch-industrial-panel-pc-with-intel-core-ultra-5-processors-for-edge-ai-applications/", "summary": "Darveen, a global leader in industrial computing, today announced the launch of the DPC-1210 Industrial Panel PC, powered by the latest Intel® Core™ Ultra 5 125H/U series processors (Meteor Lake). Combining AI-ready computing, a bright 21.5-inch projected capacitive touchscreen, and an advanced copper heat pipe cooling system built for extended, stable operation, the DPC-1210 is [&#8230;]"}, {"title": "TDK presents robust and easy-to-mount NTC systems for demanding industrial applications with voltages up to 4000 V", "source": "EE Journal", "date": "2026-10-23", "url": "https://www.eejournal.com/industry_news/tdk-presents-robust-and-easy-to-mount-ntc-systems-for-demanding-industrial-applications-with-voltages-up-to-4000-v/", "summary": "TDK Corporation (TSE: 6762) announces the expansion of its NTC temperature sensor portfolio with the M704 (ordering code: B57704M0103A001) and M705 (ordering code: B57705M0103A001) series, engineered for reliable temperature measurement in high-voltage environments. With voltage ratings of up to 4000 V (AC) for the M704 and 2500 V (AC) for the M705, these probe assemblies enable safe and [&#8230;]"}, {"title": "MicroVision Begins Commercial Production of MOVIA(TM) Pro for Superior Short-Range Sensing and Onboard Perception, Enabling Physical AI at the Edge", "source": "EE Journal", "date": "2026-10-23", "url": "https://www.eejournal.com/industry_news/microvision-begins-commercial-production-of-moviatm-pro-for-superior-short-range-sensing-and-onboard-perception-enabling-physical-ai-at-the-edge/", "summary": "MicroVision, Inc. (NASDAQ: MVIS), a leader in advanced perception solutions for industrial, security and defense, intelligent infrastructure, and automotive applications, today announced the much-anticipated commercial production launch of MOVIA™ Pro, shipping sensors to meet customer demand. MOVIA Pro is the company’s next-generation short-range lidar sensor uniquely engineered to deliver differentiated sensing performance and onboard perception [&#8230;]"}, {"title": "GL.iNet Mango 2 mini travel router features AC1300 WiFi 5 and dual Gigabit Ethernet", "source": "CNX Software", "date": "2026-10-22", "url": "https://www.cnx-software.com/2026/10/22/gl-inet-mango-2-mini-travel-router-features-ac1300-wifi-5-and-dual-gigabit-ethernet/", "summary": "<div><img alt=\"GL.iNet Mango 2 (GL MG1300) Dual band Mini Travel Router\" class=\"attachment-medium size-medium wp-post-image\" height=\"480\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/10/GL.iNet-Mango-2-GL-MG1300-Dual-band-Mini-Travel-Router-720x480.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>GL.iNet Mango 2 (GL-MG1300) mini dual-band WiFi 5 travel router is built around the MediaTek MT7621A dual-core processor. It is designed to share hotel WiFi, wired Ethernet, or mobile internet connections with multiple devices. The router measures just 89 x 63 x 15mm and weighs 100 grams. It supports WiFi speeds of up to 400 Mbps on the 2.4 GHz band and 866 Mbps on the 5 GHz band, along with WireGuard VPN speeds of up to 184 Mbps and OpenVPN speeds of up to 95 Mbps with DCO. Other features include dual  Gigabit Ethernet ports, USB 3.0, USB-C power, and others. GL.iNet Mango 2 (GL-MG1300) specifications: Processor – Mediatek MT7621A dual core MIPS 1004Kc processor @ 880Mhz Memory – 128MB DDR3L RAM Storage – 128MB SPI NAND flash + 2MB SPI NOR flash Networking 2x Gigabit Ethernet ports (WAN/LAN) Dual-band 802.11a/b/g/n/ac WiFi 5 2.4 GHz – Up to 400 [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/10/22/gl-inet-mango-2-mini-travel-router-features-ac1300-wifi-5-and-dual-gigabit-ethernet/\">GL.iNet Mango 2 mini travel router features AC1300 WiFi 5 and dual Gigabit Ethernet<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Rotary encoder with 1.8-inch touch display gets upgrade to ESP32-S31 SoC", "source": "CNX Software", "date": "2026-10-22", "url": "https://www.cnx-software.com/2026/10/22/rotary-encoder-with-1-8-inch-touch-display-gets-upgrade-to-esp32-s31-soc/", "summary": "<div><img alt=\"ESP32-S31 rotary encoder\" class=\"attachment-medium size-medium wp-post-image\" height=\"673\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/10/ESP32-S31-rotary-encoder-720x673.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Following our coverage of a 4.3-inch ESP32-S31 display development board, a Facebook reader pointed out the GUITION JC3636F118C-I-YR1 rotary encoder with a built-in 1.8-inch touchscreen display. It appears to be an update to an earlier ESP32-S3 model, now equipped with an ESP32-S31NRV16 WiFi 6, Bluetooth 5.4, and 802.15.4 SoC with 16MB of PSRAM. The rotary knob also includes 16MB SPI flash, a speaker, a microphone, and an optional rechargeable battery. GUITION JC3636F118C-I-YR1 specifications: SoC – ESP32-S31NRV16 CPU RISC-V HP (High-performance) RV32IMAFCP CPU @ 320 MHz with FPU, SIMD, etc. RISC-V LP (Low-power) MCU core Memory – 512 KB SRAM, 32 KB low-power SRAM, 16MB PSRAM Wireless 2.4 GHz WiFi 6 (802.11ax) Bluetooth 5.4 with support for LE Audio, direction finding, Bluetooth Mesh 1.1, and Classic (BR/EDR) 802.15.4 radio for Zigbee, Thread, and Matter Storage 16 MB flash MicroSD card slot (for WiFi configuration, music or MJPEG video playback, etc.) Display 1.8-inch [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/10/22/rotary-encoder-with-1-8-inch-touch-display-gets-upgrade-to-esp32-s31-soc/\">Rotary encoder with 1.8-inch touch display gets upgrade to ESP32-S31 SoC<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Socionext, Cadence Advance AI-Driven 3-nm SoC Design", "source": "Embedded.com", "date": "2026-10-22", "url": "https://www.embedded.com/socionext-cadence-advance-ai-driven-3-nm-soc-design/", "summary": "<p>Socionext Inc. is expanding its use of agentic artificial intelligence (AI) across system-on-chip (SoC) development, extending AI-driven workflows from front-end design and verification to the physical design of large-scale chips manufactured using advanced process technologies. The initiative includes a collaboration with Cadence Design Systems Inc. and the deployment of its InnoStack AI Super Agent for [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/socionext-cadence-advance-ai-driven-3-nm-soc-design/\">Socionext, Cadence Advance AI-Driven 3-nm SoC Design<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "How Agentic AI Accelerates Edge AI Software Development", "source": "Embedded.com", "date": "2026-10-22", "url": "https://www.embedded.com/how-agentic-ai-accelerates-edge-ai-software-development/", "summary": "<p>Deploying an AI model on edge hardware involves much more than generating application code. The model needs to be compressed or quantized to fit available memory, compiled for a specific processor, integrated with a runtime, and tested for latency, power consumption, and accuracy. Developers must also make the software work with the surrounding embedded components [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/how-agentic-ai-accelerates-edge-ai-software-development/\">How Agentic AI Accelerates Edge AI Software Development<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "ESP-Mosaico – An ESP32-S31-based modular development platform for AI-assisted hardware creation", "source": "CNX Software", "date": "2026-10-21", "url": "https://www.cnx-software.com/2026/10/21/esp-mosaico-an-esp32-s31-based-modular-development-platform-for-ai-assisted-hardware-creation/", "summary": "<div><img alt=\"ESP-Mosaico\" class=\"attachment-medium size-medium wp-post-image\" height=\"430\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/10/ESP-Mosaico-720x430.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Espressif Systems ESP-Mosaico is an ESP32-S31 development platform with a 480 × 480 OLED touchscreen, haptic feedback, a built-in battery, USB Type-C connectivity, and expansion I/O. It&#8217;s specifically designed for AI &#60;-&#62; hardware integration and targets magnetic expansion toys, motion sensing, square touch display HMI, and edge voice/multimedia applications. ESP-Mosaico specifications: CoreBoard SoC – ESP32-S31NRV16 CPU RISC-V HP (High-performance) RV32IMAFCP CPU @ 320 MHz with FPU, SIMD, etc. RISC-V LP (Low-power) MCU core Memory – 512 KB SRAM, 32 KB low-power SRAM, 16MB PSRAM Wireless 2.4 GHz WiFi 6 (802.11ax) Bluetooth 5.4 with support for LE Audio, direction finding, Bluetooth Mesh 1.1, and Classic (BR/EDR) 802.15.4 radio for Zigbee, Thread, and Matter Storage 1 Gbit (128 MB) SPI NAND flash for asset storage. 16 MB (128 Mbit) SPI NOR flash (GD25Q128EWIGR) for program and data storage. Display &#8211; 2.16-inch QSPI touch display with 480 x 480 resolution; CO5300 driver + CST9220 [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/10/21/esp-mosaico-an-esp32-s31-based-modular-development-platform-for-ai-assisted-hardware-creation/\">ESP-Mosaico &#8211; An ESP32-S31-based modular development platform for AI-assisted hardware creation<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Raytron SE5 1280: 1280×1024 Uncooled Thermal Imaging Module for OEM Applications (Sponsored)", "source": "CNX Software", "date": "2026-10-21", "url": "https://www.cnx-software.com/2026/10/21/raytron-se5-1280-1280x1024-uncooled-thermal-imaging-module-for-oem-applications/", "summary": "<div><img alt=\"Raytron SE5 1280 LWIR Thermal Sensor\" class=\"attachment-medium size-medium wp-post-image\" height=\"480\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/09/Raytron-SE5-1280-LWIR-Thermal-Sensor-720x480.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>The Raytron SE5 1280 is a high-resolution uncooled infrared module designed for integration into OEM thermal imaging systems. Based on a 1280 × 1024 uncooled VOx infrared detector with a 12 μm pixel pitch, the module delivers more than 1.3 million infrared pixels in a compact form factor measuring no more than 29 × 29 × 15.7 mm and weighing less than 26 g. 1280 × 1024 VOx Detector for High-Resolution Thermal Imaging At the core of the SE5 1280 is a 1280 × 1024 uncooled VOx infrared detector with a 12 μm pixel pitch, operating in the 8–14 μm long-wave infrared (LWIR) band. With more than 1.3 million infrared pixels, the detector provides a substantially higher spatial resolution than conventional 640 × 512 thermal imaging configurations. This can help thermal imaging systems capture finer temperature patterns and spatial details, particularly when identifying relatively small thermal targets or distinguishing objects [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/10/21/raytron-se5-1280-1280x1024-uncooled-thermal-imaging-module-for-oem-applications/\">Raytron SE5 1280: 1280×1024 Uncooled Thermal Imaging Module for OEM Applications (Sponsored)<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Variscite, SecEdge Add Firmware TPM 2.0 Security to i.MX SoMs", "source": "Embedded.com", "date": "2026-10-21", "url": "https://www.embedded.com/variscite-secedge-add-firmware-tpm-2-0-security-to-i-mx-soms/", "summary": "<p>Variscite and SecEdge Inc. have announced the availability of firmware-based Trusted Platform Module (TPM) 2.0 security across Variscite's i.MX system-on-modules (SoMs). The solution integrates SecEdge's SEC-TPM firmware implementation into the application processor's security architecture, enabling device authentication and cryptographic key protection without requiring a separate TPM chip. TPM 2.0, defined by the Trusted Computing Group [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/variscite-secedge-add-firmware-tpm-2-0-security-to-i-mx-soms/\">Variscite, SecEdge Add Firmware TPM 2.0 Security to i.MX SoMs<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "Siemens Adds Self-Verification for Long-Running EDA Agents", "source": "Embedded.com", "date": "2026-10-21", "url": "https://www.embedded.com/siemens-adds-self-verification-for-long-running-eda-agents/", "summary": "<p>Self-verifying agents can manage extended semiconductor design workflows, but deterministic EDA tools and human engineers still determine whether results are valid.<\/p>\n<p>The post <a href=\"https://www.embedded.com/siemens-adds-self-verification-for-long-running-eda-agents/\">Siemens Adds Self-Verification for Long-Running EDA Agents<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "Semtech LR2021 LoRa chip gets the SDR treatment, supports 100 MHz to 2.74 GHz", "source": "CNX Software", "date": "2026-10-20", "url": "https://www.cnx-software.com/2026/10/20/semtech-lr2021-lora-chip-gets-the-sdr-treatment-supports-100-mhz-to-2-74-ghz/", "summary": "<div><img alt=\"Semtech LR2021 LoRa transceiver used as an SDR for raw I Q capture and signal analysis (Image AI generated)\" class=\"attachment-medium size-medium wp-post-image\" height=\"480\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/10/Semtech-LR2021-LoRa-transceiver-used-as-an-SDR-for-raw-I-Q-capture-and-signal-analysis-Image-AI-generated-720x480.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Earlier this month, we saw how the humble ESP32-S3 could be turned into an SDR transmitter and receiver; then we saw developer h0m3us3r release the w1700k-sdr project, which turns a Gemtek W1700K Wi-Fi 7 router into a wideband SDR receiver. The LR2021-SDR open-source project by Samuel Reynolds (SAMS0N1TE) follows the same principle and turns the Semtech LR2021 LoRa transceiver into a software-defined radio (SDR) capable of receiving signals from 100 MHz to 2.74 GHz. Using an undocumented command in the chip&#8217;s ROM, this project exposes raw 16-bit I/Q samples, allowing software to decode P25 Phase 1 digital voice, POCSAG pager messages, and analog FM signals without an external SDR dongle. LR2021-SDR firmware features: Supported hardware &#8211; Semtech LR2021 running ROM 1.24; not compatible with the SX1262 variant for raw I/Q access. Receive frequency range &#8211; 100 MHz to 2.74 GHz (experimentally tested), extending beyond the datasheet&#8217;s specified 150–960 MHz and 1.5–2.5 [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/10/20/semtech-lr2021-lora-chip-gets-the-sdr-treatment-supports-100-mhz-to-2-74-ghz/\">Semtech LR2021 LoRa chip gets the SDR treatment, supports 100 MHz to 2.74 GHz<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Altera Expands Defense-Grade Agilex FPGA Portfolio", "source": "Embedded.com", "date": "2026-10-20", "url": "https://www.embedded.com/altera-expands-defense-grade-agilex-fpga-portfolio/", "summary": "<p>Altera Corp. is extending defense-grade capabilities across its Agilex FPGA and SoC FPGA portfolio to support aerospace and defense systems requiring high performance, reliability, and long-term availability. The expanded offering covers applications ranging from embedded processing and edge computing to high-bandwidth communications, sensing, and electronic warfare. Defense-grade Agilex devices are designed to operate across temperatures [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/altera-expands-defense-grade-agilex-fpga-portfolio/\">Altera Expands Defense-Grade Agilex FPGA Portfolio<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "Synaptics Claims a New Class of Edge AI Processors, Expands Coralboard Platform", "source": "Embedded.com", "date": "2026-10-20", "url": "https://www.embedded.com/synaptics-claims-a-new-class-of-edge-ai-processors-expands-coralboard-platform/", "summary": "<p>Synaptics Inc. has claimed a new class of microcontrollers (MCUs), the xMCU, for multimodal edge AI. Announced at its annual tech day, the new Astra SR200 series combines heterogeneous, AI-native compute and acceleration with integrated high-bandwidth custom DRAM. It was designed to enable device-native and real-time experiences that combine modalities such as voice, vision, audio, [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/synaptics-claims-a-new-class-of-edge-ai-processors-expands-coralboard-platform/\">Synaptics Claims a New Class of Edge AI Processors, Expands Coralboard Platform<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}], "papers": [{"title": "Auto-Research Arena: Benchmarking and Advancing Auto-Research in Language Modeling", "authors": ["Xi Chen", "Chongjian Ge", "Yiran Xu", "Yiqun Mei", "Henrik I. Christensen", "Hao Tan", "Ziwen Chen", "Hanwen Jiang"], "published": "2026-10-26", "summary": "As autonomous research systems become more capable, benchmarks must both evaluate their performance and support meaningful research progress. We introduce Auto-Research Arena, a multi-target benchmark for evaluating autonomous research systems and discovering ideas in language modeling. Arena supports diverse research objectives within a shared experimental environment by separating admissibility from improvement: model quality and resource constraints determine whether a result qualifies, while the selected target measures progress among admissible results. We instantiate Arena in language model pretraining with nine targets spanning model, data, training, and inference efficiency, and evaluate seven research harnesses using two foundation models. Arena clearly differentiates existing harnesses across research objectives, with several sophisticated methods outperformed by our simple sequential search baseline, indicating substantial headroom in current auto-research systems. Beyond evaluation, Arena reveals a substantially broader frontier of model and system ideas aligned with active research directions. Reusing these discoveries in a new quality-driven search yields lower training loss under matched data and FLOPs and lower held-out BPB at the same model size. Together, Arena provides a common framework for benchmarking autonomous research and expanding its scope in language modeling. The code is available at https://github.com/Auto-Research-Arena/auto-research-arena", "pdf_url": "https://arxiv.org/pdf/2610.35866v1"}, {"title": "Learning Force-Reactive Humanoid Loco-Manipulation", "authors": ["Sihang Li", "Xiaofeng Guo", "Jinkun Cao", "Charlie Cheng", "Ruihan Yang", "Chen Feng", "Guanya Shi", "Haozhi Qi"], "published": "2026-10-26", "summary": "Many everyday tasks require controlling contact force as well as motion. On a humanoid, this force must often be coordinated across both hands and the whole body, and cannot be specified by kinematic trajectories alone. Therefore, we present FLORE, a framework for learning force-reactive humanoid loco-manipulation. We collect robot-free demonstrations using two force-sensing UMI-style handheld grippers for hand motion and contact wrenches, and wearable trackers for body motion. A force-reactive diffusion policy takes vision, proprioception, and measured wrenches as input, then predicts actions and per-hand force commands. A hybrid compliance whole-body controller with force tracking executes these commands while maintaining balance: an integral of the force error measured by real force/torque (F/T) sensors lets each hand track force accurately along the commanded direction and remain compliant along the others. In simulation, the controller tracks per-hand force commands of varied magnitude and direction, with little loss in whole-body motion accuracy. Across three contact-rich tasks on the robot, the force-reactive policy succeeds in 80% of rollouts, compared with 26.7% for a position-only policy trained on the same demonstrations and executed by the same controller. For more details, please visit our website: https://louis-leee.github.io/FLoRe/.", "pdf_url": "https://arxiv.org/pdf/2610.35862v1"}, {"title": "Differentiable Contact Dynamics for Legged Locomotion: Policy Learning and Contact-Implicit Trajectory Optimization", "authors": ["Gijeong Kim", "Seungbin Oh", "Dongyun Kang", "Hae-Won Park"], "published": "2026-10-26", "summary": "This paper proposes a smooth analytic gradient for frictional contact and applies it to policy learning and contact-implicit trajectory optimization for legged locomotion. The exact contact sensitivity is available in closed form but describes changes within the current contact mode, providing no first-order information toward neighboring contact modes. The proposed gradient replaces this sensitivity only in the backward pass, leaving the hard-contact forward solve unchanged and the realized rollout feasible. A central-path relaxation of the de Saxcé-corrected second-order-cone complementarity problem for Coulomb friction smooths the conditions defining the separating, clamping, and sliding modes. The relaxed sensitivity is evaluated at a point on the central path obtained by a Newton iteration initialized from the hard-contact solution. The sensitivity remains continuous through contact-mode transitions and converges to the exact sensitivity as the relaxation vanishes. Using 100,000 samples and less than 2 min of training on a desktop PC, policy learning with the proposed gradient produces a policy that transfers to hardware without fine-tuning. On hardware, the robot under a trotting policy withstands pushes and traverses debris and slippery ground. In trajectory optimization, the proposed gradient reaches contact-rich solutions missed by exact and Signorini-relaxed gradients. Project page: https://diffcontact.github.io", "pdf_url": "https://arxiv.org/pdf/2610.35852v1"}, {"title": "Nonprehensile Robotic Catching Using Virtual Constraints", "authors": ["Aakash Khandelwal", "Ranjan Mukherjee"], "published": "2026-10-26", "summary": "The problem of nonprehensile robotic catching is addressed using virtual nonholonomic constraints (VNHCs); the motion of the robot end-effector is designed and controlled directly in terms of the states of the object before it is caught on the surface of the end-effector. In contrast to contemporary approaches, our approach avoids the need for object trajectory prediction, and consequent time-varying robot trajectory generation. With a focus on the planar case, we demonstrate that our VNHC approach can be used to catch an object on an end-effector at a desired height, with minimal relative normal velocity at the contact instant. Moreover, the VNHC function depends only on the desired catching height, and the same VNHC can be used for a range of initial conditions. We use model predictive control (MPC) to bring the object and end-effector to rest at a desired location after contact is made. The approach is validated in simulation.", "pdf_url": "https://arxiv.org/pdf/2610.35851v1"}, {"title": "OSWAM: An Effective World Action Model with One-Step Action Generation", "authors": ["Guowen Zhang", "Liyi Chen", "Xu Hu", "Pengfei Wang", "Jingfan Chen", "Chenhang He", "Lei Zhang"], "published": "2026-10-26", "summary": "Direct-policy World Action Models (WAM) have demonstrated the benefits of decoupling action generation from explicit future visual prediction for efficient inference in autonomous driving and embodied control. However, they still require tens of denoising steps to achieve competitive action quality, incurring substantial latency and hindering real-time deployment. Simply reducing the number of denoising steps will collapse the nonlinear multi-step denoising trajectory into coarse updates, substantially degrading action quality. To reduce the denoising steps while enabling real-time action generation, we present an effective world action model with one-step action generation, namely OSWAM, for autonomous driving and embodied control. We argue that it is the absence of structured action priors in random noise initialization that forces direct-policy WAMs to recover coherent action sequences through iterative denoising. Hence, we construct imagination tokens to initialize the diffusion process, providing physical priors and action-conditioned representations. We further introduce privileged information distillation with future conditioning to enhance future-aware action generation. As a result, OSWAM can efficiently and effectively generate high quality actions in just one diffusion step. Our experiments demonstrate that OSWAM achieves comparable or even better results in both autonomous driving and embodied control than direct-policy WAM and Joint-WAM that require tens of steps. It obtains approximately $3\\times$ speedup over direct-policy WAM baselines and supports real-time compiled inference with latency as low as 40ms on an NVIDIA RTX 5090 GPU. The project page is available at https://gwenzhang.github.io/OSWAM/", "pdf_url": "https://arxiv.org/pdf/2610.35850v1"}, {"title": "Work Agents: Systems, Capabilities, and Optimization", "authors": ["Zishan Xu", "Enjun Du", "Mingqi Gao", "Cheng Yang", "Junhao Shen", "Zirong Chen", "Zhiyuan Yao", "Yifu Guo", "Yuquan Lu", "Jinyang Huang", "Zhengxi Lu", "Siyi Liu", "Ziyu Zheng", "Yongqi Zhang", "Difan Zou", "Weiwen Liu"], "published": "2026-10-26", "summary": "As foundation models evolve from information generation to digital work execution, agents are increasingly capable of completing complex tasks across tools, applications, and workflows. However, existing research lacks a unified perspective on how agents reliably accomplish delegated work. To address this gap, we present a work-centric, system-level perspective that views work agents as systems combining foundation models and runtime harnesses to execute tasks in stateful workspaces and deliver verifiable outcomes. We introduce two complementary dimensions, work persistence and work openness, to characterize working conditions, and classify digital work into five forms according to task scope and organization. Building on this framework, we identify five core capability families required for reliable work execution and examine approaches to model optimization, harness optimization, and their joint optimization. We further analyze existing evaluation methods and metrics from the perspective of work outcomes. Finally, we discuss future research directions, including sustained work delegation, adaptation to open environments, and the interaction between work execution and capability improvement. This paper provides a unified framework for understanding, optimizing, and evaluating work agents, supporting the development of systems capable of delivering reliable, verifiable, and practically valuable work outcomes.", "pdf_url": "https://arxiv.org/pdf/2610.35845v1"}, {"title": "Profiling a Frontier Agent with EBench: From Direct Control to Harness with Policy", "authors": ["Yifei Yao", "Yude Zou", "Guanbo Jiao", "Xing Gao", "Ning Gao", "Yukai Wang", "Jiantong Chen", "Zihou Zhu", "Xinyu Li", "Ningyu Yan", "Shuai Wang", "Jianming Ma", "Haoyu Guo", "Weinan Zhang", "Chunhua Shen"], "published": "2026-10-26", "summary": "Frontier multimodal large language models (MLLMs) can control robots without robot-specific training, but how their capabilities compare and interact with post-trained vision-language-action (VLA) and world action model (WAM) policies across manipulation demands remains to be thoroughly evaluated. In this report, we evaluate GPT-6-Astra on EBench as the core of an agent that controls a robot through an agent harness under the same visual and proprioceptive observation protocol as post-trained policies. We study two agent configurations: direct control, in which the agent generates waypoint commands directly, and harness with policy, in which it can also invoke a post-trained VLA or WAM policy for action execution. Under direct control, the agent achieves competitive overall performance relative to post-trained policies. It leads on short-horizon tasks and exhibits the least performance variation across generalization dimensions, whereas it underperforms post-trained policies on long-horizon tasks, tabletop manipulation, and high-precision contact-rich tasks. In the harness with policy, invoking a post-trained VLA or WAM combines the complementary strengths of both components, raising overall task success to the level of the strongest compared post-trained policies while substantially reducing token cost. However, performance remains below the per-task upper bound of the standalone components due to suboptimal policy invocation, fixed-instruction execution without subgoals, and grasp disruption when the agent resumes control. Overall, our study characterizes the capability boundary of a frontier MLLM agent and suggests directions for improving future agent harness design. Project page: https://internrobotics.github.io/EBench-Astra-Tech-Report/", "pdf_url": "https://arxiv.org/pdf/2610.35832v1"}, {"title": "Pretraining Knows What, Simulation Teaches How: Compositional Generalization in a Sim-Trained Robot Agent", "authors": ["Benjamin Pikus", "Daniel Saunders", "Mircea Mironenco", "Salman Mohammadi", "Mathew Mathew", "Sirou Zhu", "Divya Makkar", "Xuhua Huang", "Qinbo Li", "Supreeth Narasimhaswamy", "Siyuan Cen", "Thomas Neff", "Dejia Xu", "Shyamal Buch"], "published": "2026-10-26", "summary": "A robot policy needs to understand what a task is asking for in a scene, and how to move the robot to accomplish that task. To achieve these two skills, we introduce Zero-real Agent Policy (ZAP), a recipe that teaches a small off-the-shelf vision-language model to control a robot via a simple tool harness. We use a pretrained 27B parameter model to bootstrap world understanding and reasoning, followed by supervised fine-tuning and GRPO on simple simulated tasks to teach it how to move the robot. Without any real-world robot data during training, ZAP reaches 96.7% success on real-world tasks, matching GPT-6 Astra in our harness and outperforming the MolmoAct2 VLA (33.3%), while running 3x faster and 17x cheaper than GPT-6 Astra. We demonstrate that ZAP also generalizes to completely new objects, goals, strategies, and language by seating a test tube in a rack (and choosing a different hole in the rack when prompted), handing a test tube between arms mid-air, drawing an X on a tic-tac-toe board, and playing chess. These goals and types of manipulation don't appear in our training data. Furthermore, ZAP also transfers to an unseen embodiment. On a single-arm Franka, ZAP reaches 55.9% on RoboLab-120, 4.9 percentage points ahead of the leading VLA/WAM baseline.", "pdf_url": "https://arxiv.org/pdf/2610.35817v1"}, {"title": "World Model for Energy Efficiency Maximization in Dynamic Metasurface Antennas", "authors": ["Abdolrasoul Sakhaei Gharagezlou", "Mehdi Monemi", "Matti Latva-aho", "Mehdi Rasti"], "published": "2026-10-26", "summary": "Dynamic metasurface antennas (DMAs) have emerged as a promising technology for realizing large-scale antenna arrays in next-generation wireless networks owing to their ability to enable dense and energy-efficient antenna architectures. However, jointly optimizing digital beamforming and DMA element weights under time-varying channel conditions remains challenging due to their coupled effects on the received signal and interference powers. We formulate this problem to maximize time-averaged energy efficiency (EE) under time-varying channel conditions, subject to transmit power constraints, Lorentzian phase limitations, and minimum rate requirements. To enable long-term planning and improve sample efficiency compared with model-free reinforcement learning, we develop a world model framework that learns latent system dynamics from interactions with the environment and jointly optimizes digital beamforming and DMA element weights through imagined trajectories. Furthermore, we incorporate feasibility-preserving action mappings and safety cost signals to ensure constraint satisfaction during policy learning. Simulation results demonstrate that the proposed framework improves the time-averaged EE by approximately 20% compared with the deep Q-network baseline, while achieving higher sample efficiency and more reliable constraint satisfaction.", "pdf_url": "https://arxiv.org/pdf/2610.35813v1"}, {"title": "Multi-Objective Reinforcement Learning Using Routed Ensembles and Trajectory Attribution", "authors": ["Zhenshuo Zhang", "Ruoxuan Xiong", "Hongyang R. Zhang"], "published": "2026-10-26", "summary": "Multi-objective reinforcement learning is a fundamental problem for modern AI, with applications spanning post-training, reasoning models, and robotic control. A central challenge is to learn policies that balance competing objectives, such as helpfulness versus honesty in safety and alignment, or speed versus energy in robotics. The optimal policy can vary sharply with objective-weighting combinations, and the extent of this variation depends crucially on the degree of conflict among objectives, making per-preference policy learning sample-inefficient. In this paper, we introduce objective-conflict coefficients and derive near-optimal regret bounds for online settings using this measure, thereby quantifying the impact of misalignment on learning efficiency. Then, we design routed ensemble policy learning, an algorithm that maintains a small set of basis policies and dynamically routes trajectories to the policy with the highest potential reward. Finally, we consider trajectory selection as another approach to mitigate objective conflict, and design a kernel surrogate trajectory attribution algorithm that estimates how feedback signals from a set of trajectories influence policy learning on other trajectories. The kernel can capture nonlinear interactions such as synergy and antagonism between trajectories. We evaluate our approach across diverse environments and benchmarks: routed ensembles improve average performance by 4.3% over baselines for online environments from Meta-World and MO-Gymnasium, and kernel surrogate attribution improves correlation with leave-one-out analysis over existing baselines by 50%. When applied to trajectory selection, kernel-based attribution yields a 27% improvement in reward over baseline attribution methods.", "pdf_url": "https://arxiv.org/pdf/2610.35733v1"}, {"title": "SPECOLA: A Tool for Specification Driven Robot Evaluation", "authors": ["Immanuel Ampomah Mensah", "Hadas Kress-Gazit"], "published": "2026-10-26", "summary": "Simulation benchmarks are a useful way to measure progress in robotics; typically they provide success rate as the dominant measure of performance. However, success rate reports only whether a rollout completed the task, hiding by what margin it succeeded, how sensitive the success is to goal parameter changes, requirements it may have violated, and whether success persisted. Signal Temporal Logic (STL) provides a formal language for capturing specifications; it can be used to define requirements, and measure how close a robot behavior is to satisfying or violating them. Using STL monitors in a simulator, however, requires exposing simulator state and mapping it to specification-relevant signals. We present Specola, a tool for evaluating robot behaviors in simulation with respect to STL specifications. Specola provides an interface for writing specifications over simulator signals, and creates and manages the relevant monitors while a policy executes. We provide a Python API and command-line interface for integrating monitoring into existing policy execution loops. We provide an adapter interface for connecting new simulators, and provide adapters for nine simulation environments and benchmarks, including LIBERO, RoboCasa, Isaac Lab, and RoboDojo. We provide case studies that illustrate the nuanced evaluation that Specola enables. Code and adapters are available at https://github.com/specola-eval/specola.", "pdf_url": "https://arxiv.org/pdf/2610.35730v1"}, {"title": "TrySee: Modular Perception-Enhanced VLM Grounding for Closed-Loop Robot Task Planning in Specialized Domains", "authors": ["Elias Hofele", "Thomas Trapp", "David Timmermann", "Tristan Schnell", "Georg Heppner", "Arne Roennau"], "published": "2026-10-26", "summary": "Vision Language Models (VLMs) have shown impressive capabilities in high-level reasoning and task planning for robots. However, specialized domains remain a challenge for VLMs' image interpretation and grounding abilities. We introduce TrySee, a modular closed-loop robot task planning pipeline integrating general-purpose VLM reasoning with domain-specific perception and established robotics components. The system consists of an inherently reactive cyclic planning pipeline, augmented with domain-specific modular vision preprocessing, to provide online grounding. Finally, a dynamic preprocessing selection mechanism contributes to the scalability of the pipeline. The system requires neither VLM fine-tuning nor end-to-end demonstrations and adapts through replaceable perception modules and motion planning. The approach is evaluated on planning tasks across 5 widely different domains, including a real-world robot disassembly task. The field tests in a brownfield environment demonstrate the approach's practicality in integrating VLM planning into specialized robotic systems with limited domain-specific training data.", "pdf_url": "https://arxiv.org/pdf/2610.35687v1"}, {"title": "FISRF: Flexible Instructional Scaffolding Reflection Framework for Robotics Task Planning with Large Language Model", "authors": ["Qingmiao Liang", "Jiatao Zhang", "Runxin Zou", "Yufan Song", "Wei Song", "Yuhua Zheng"], "published": "2026-10-26", "summary": "Large Language Models (LLMs) are widely adopted for reflective error correction in task planning; however, existing approaches primarily rely on autonomous exploration, rendering them prone to accumulating erroneous experiences during early interactions with new environments. To address this limitation, we propose the Flexible Instructional Scaffolding Reflection Framework (FISRF), an agent--mentor architecture that estimates the robot's Zone of Proximal Development (ZPD) in task planning and adaptively selects reflection strategies and mentor guidance, thereby facilitating the accumulation of effective error-correction experience. Experiments in ALFWorld and on real-world robotic platforms demonstrate that FISRF reduces the average number of error-correction rounds by 37% and redundant reasoning by 25.1%, while improving the overall task success rate by 8%. Project webpage : https://fisrfplanning.github.io/", "pdf_url": "https://arxiv.org/pdf/2610.35686v1"}, {"title": "Continuous-Time Safe Planning and Control for Agile Quadrupeds", "authors": ["Gage MacLin", "Mason Peterson", "Camilla Tabasso", "Venanzio Cichella", "Joshua Migdal", "Tye Brady", "Taskin Padir"], "published": "2026-10-26", "summary": "Agile quadruped navigation in dynamic environments demands trajectories that are both dynamically feasible and provably collision-free. Most real-time planners achieve tractability through a convex reduction that requires simplified kinematic models, discarding motion that the robot can readily execute, and certify safety only at discretization points, leaving open possible inter-sample collisions with moving obstacles. We present a real-time motion planning framework that retains the fully-actuated $SE(2)$ model of a quadruped, with its anisotropic, heading-coupled velocity bounds, and accepts the resulting nonconvexity. By parameterizing trajectories as composite Bernstein polynomials, we exploit the convex hull property to certify collision avoidance and the input bounds over the entirety of each planning horizon. Solved at online replanning rates, the optimization runs in closed loop, commanding body velocities to the locomotion controller. We validate the approach in simulation against ablations and external baselines, and in hardware experiments on a quadruped navigating among unknown moving obstacles, recovering both lateral and heading-coupled motion that simplified models exclude.", "pdf_url": "https://arxiv.org/pdf/2610.35670v1"}, {"title": "Environment Edits as a Corrective Signal for Reward Learning", "authors": ["Isaac Ngui", "Courtney McBeth", "Nancy M. Amato"], "published": "2026-10-26", "summary": "Robot corrections allow people to adjust a robot's behavior, but a single correction changes many features. Also, preferences about object attributes and relationships between objects cannot be expressed by moving the robot. We propose environment edits as a complementary form of feedback. The robot's motion is held constant as the human edits the scene, so the only explanation for the edit is the moved object. We introduce Feature Learning from Environmental and Robot-Relational Edit Traces (FERRET), which learns preferences from both robot and environment corrections. We show that environment edits are able to disambiguate features and learn preferences that robot corrections alone cannot.", "pdf_url": "https://arxiv.org/pdf/2610.35659v1"}, {"title": "VPR-Space: A Benchmark for Visual Place Recognition in Space Analog Domains", "authors": ["Richard Fechner", "Peer Neubert"], "published": "2026-10-26", "summary": "Visual Place Recognition (VPR) is an important means for loop closure detection in visual Simultaneous Localization and Mapping (SLAM). While state-of-the-art VPR and SLAM approaches excel in urban and feature-rich natural environments, the vast and feature-poor environments of extraterrestrial surfaces like on the Moon or Mars pose severe challenges for existing approaches. This paper presents a novel benchmark, VPR-Space, to evaluate VPR capabilities on extraterrestrial surfaces. There are three contributions: (1) We collected sixteen VPR database-query datasets based on existing data from Space Analog Domains (SAD), terrestrial environments that resemble properties of the Moon or Mars. The collection includes a range of challenges regarding environment, viewpoint change, and illumination conditions. (2) To address the ill-posed nature of VPR, we propose a novel approach to generate the ground-truth information in VPR benchmarks. Instead of defining that a query and datbase image show the same place if and only if their camera poses are within fixed position and viewing direction thresholds, we propose to make the decision dependent on whether the match would be valuable in the downstream SLAM task. To avoid the overhead and restrictions of evaluating VPR in-the-loop within SLAM systems, we provide VPR ground-truth (GT) matrices based on the performance of an ensemble of state-of-the-art Relative Pose Estimators (RPE). Under this GT we require a VPR method to identify exactly those image pairs for which a subsequently applied RPE is expected to provide a valuable pose estimate in a SLAM context. (3) We evaluated nine state-of-the-art VPR approaches. The results show considerable room for improvement and indicate directions for future research. We provide a pre-release version of the dataset on github: $\\texttt{https://github.com/rfechner/VPR-Space}$", "pdf_url": "https://arxiv.org/pdf/2610.35642v1"}, {"title": "SeeRF: Learning to See Beyond Fields of View via Generative Image Registration and Fusion", "authors": ["Xunpeng Yi", "Yibing Zhang", "Qinglong Yan", "Yifan Lu", "Han Xu", "Jiayi Ma"], "published": "2026-10-26", "summary": "Due to the inherent discrepancies in imaging viewpoints and field-of-view mismatches among multi-modal sensors, existing fusion methods have long struggled to achieve complete scene-level information integration beyond the limitation in sensor fields of view. Consequently, the generated fusion results often contain modality-specific regions and fusion artifacts, limiting the comprehensive representation of scene structures and semantic information. To address this challenge, we propose a generative registration-fusion framework, termed SeeRF. Specifically, it first introduces a deformation generation strategy based on the diffeomorphic stationary velocity field, combined with visual foundation model-guided feature extraction and a coarse-to-fine progressive multi-modal image registration module, to achieve accurate cross-modal flow estimation and generate valid field-of-view masks. Subsequently, the registration module is tightly coupled with the generative diffusion module for multi-modal completion and fusion, where the cross-modal control encoding module and the control residual feature encoder-decoder mechanism provide effective guidance. By leveraging the powerful prior modeling capability of generative diffusion models, the proposed framework overcomes the limitations imposed by shared fields of view and enables effective completion and natural fusion of non-overlapping field-of-view regions. Extensive experiments on multiple public datasets and real-world scenarios demonstrate that the proposed method achieves superior performance, validating its effectiveness, superiority, and robustness. The code will be available at https://github.com/XunpengYi/SeeRF.", "pdf_url": "https://arxiv.org/pdf/2610.35637v1"}, {"title": "Adapt for Planning, Not just Prediction: Optimistic Test-Time World Model Adaptation", "authors": ["Akshay Mete", "Dileep Kalathil", "P. R. Kumar"], "published": "2026-10-26", "summary": "Latent world models are typically pre-trained offline and kept frozen at test time, so planning with them can degrade under distribution shift. Test-time adaptation (TTA) can mitigate this degradation by updating the model during deployment. Unlike pre-training on fixed data, TTA for planning is closed-loop: the planner uses model rollouts to select actions, and the resulting transitions drive the next update. This raises the question: which objective should guide TTA for planning? Under a prediction-only objective, the model is fit only to the outcomes of its own actions, so it can remain wrong about the actions that would reach the goal, and low prediction error need not translate into better planning. Inspired by reward-biased maximum likelihood from adaptive control, we introduce Optimistic Test-Time Adaptation (OpTTA). Its objective has two terms, the prediction loss on observed transitions and the planner's goal-reaching cost on its candidate rollouts, both minimized over the model parameters. The planning term biases adaptation toward models that are optimistic about reaching the goal, without any additional environment interaction. Across visual and environment shifts on manipulation, reaching and navigation tasks, OpTTA raises final planning success over the frozen model by 13.5 percentage points on average, compared with 6.9 for the prediction-only objective (AdaJEPA), when only the predictor is adapted. When the encoder is adapted as well, the gains are 13.5 and 7.5 points. These experiments span three JEPA world models with different encoders and training objectives and, for temporal straightening, both CEM and gradient-based planners. Our results suggest that test-time adaptation of world models for planning benefits from an optimistic, task-aware term in addition to the prediction loss.", "pdf_url": "https://arxiv.org/pdf/2610.35636v1"}, {"title": "Revisiting Direct Control: A Field Evaluation of Sensor Fusion Efficacy in Teleoperating Full-Scale Autonomous Vehicles via Bird's Eye View", "authors": ["Stanisław Kuczma", "Sławomir K. Tadeja", "Michał R. Nowicki"], "published": "2026-10-26", "summary": "In autonomous driving, robot teleoperation serves as a critical safety fallback mechanism, requiring operators to assume direct control in the event of system failure. While recent research has pivoted toward high-level supervisory control or simulation-based studies, these approaches often fail to capture the physical dynamics and sensory demands of driving a full-scale vehicle. To address this gap, we evaluated the impact of spatial data representation on operator performance using a real car-sized vehicle in a field experiment with $N = 18$ participants. We compared three visualization interfaces: (i) a standard camera feed baseline, with two bird's-eye views (BEV) from (ii) a raw LiDAR point cloud, and (iii) a sensor fusion of LiDAR and camera data streams. Contrary to prior passive observation studies suggesting that sensor-fusion BEV may hinder awareness, our active-control results demonstrate that such representation significantly outperforms the standard LiDAR BEV in perceived usability ($p \\leq 0.0001$) and cognitive task load ($p = 0.01$, NASA-TLX score: 34.58/100) while also being significantly better than the Camera-only view ($p = 0.043$). The fused interface also led to statistically significant reductions in task completion time ($p = 0.0461$) and superior usability (SUS: 77.9/100) compared to those of the Camera-only and LiDAR-only views. By synthesizing objective performance data with comprehensive subjective assessments, we demonstrate that BEV fusion maximizes safety margins while minimizing the operator's mental demand. These findings challenge existing teleoperation conventions and provide an empirically validated approach for designing robust remote piloting systems.", "pdf_url": "https://arxiv.org/pdf/2610.35630v1"}, {"title": "From Language to Drives: A Multimodal Framework for Aligning Autonomous Robots with Human Purposes", "authors": ["Diana Cerdas-Vargas", "Alejandro Romero", "Richard J. Duro"], "published": "2026-10-26", "summary": "This work explores a multimodal approach to the alignment of the behavior of open-ended learning autonomous robots with human purposes through the use of large language models as cultural enablers. While autonomous robots can generate their own skills and goals through interaction with the environment, they often lack mechanisms to ensure that these remain relevant and aligned to those of human users. The proposed approach makes use of the general and cultural knowledge contained in LLMs and VLMs to establish a multimodal interactive alignment process in which human purposes, expressed in natural language, are transformed into motivational components of a robot architecture in the form of robot missions and drives that guide the behavior of the robot. The system is structured into three layers for semantic alignment, mission generation, and drive modeling. This design enables a bidirectional interaction loop: human inputs define high-level purposes, robots expand them into executable missions making use of multimodal information relayed by LLMs and VLMs, and feedback maintains alignment with human intent. Experiments in simulation and with a physical robot demonstrate that the process produces valid missions and behaviors, supporting effective human-agent alignment in interactive scenarios with autonomous robots.", "pdf_url": "https://arxiv.org/pdf/2610.35629v1"}, {"title": "Robot-Aligned 3D Gaussian Splatting for Precise Reaching with Wrist-Camera VLA Policies", "authors": ["Zuoxu Wang", "Xiao Liang"], "published": "2026-10-26", "summary": "Efficient robotic data collection remains a major bottleneck for vision-language-action (VLA) policy learning, especially for tasks requiring accurate end-effector positioning and camera-action alignment. This challenge is particularly severe in electronic-waste disassembly, where robots operate in cluttered assemblies of densely packed, visually similar components. Full digital-twin simulation is difficult because many parts are thin, reflective, or mechanically complex, making accurate object-level meshes and contact models difficult to obtain. In this work, we focus on pre-contact reaching and propose a 3D Gaussian Splatting (3DGS)-based data generation pipeline for wrist-camera VLA adaptation. Our method reconstructs the real workspace with 3DGS and renders diverse wrist-camera observations from robot-aligned poses. These observations are paired with smooth, structured reaching trajectories to provide robot-aligned visual-action supervision for VLA fine-tuning. We further augment the VLA policy with an instruction-conditioned reach verifier that estimates target proximity and provides reliable termination before physical interaction. Experiments in motherboard disassembly demonstrate precise VLA-based reaching using wrist-camera observations alone, without an external side-view camera. With $π$0.5, 1,500 generated trajectories achieve 80.0\\% precise-reaching success across three targets, compared with 58.7\\% using 150 teleoperated demonstrations, while requiring less than 10 minutes of active human capture. Project website: https://001-wang.github.io/PrecisionReach-GS/", "pdf_url": "https://arxiv.org/pdf/2610.35626v1"}, {"title": "Context-Aware Generation and Modulation of Expressive Motion Behavior using Multimodal Foundation Models", "authors": ["Till Hielscher", "Fabio Scaparro", "Kai O. Arras"], "published": "2026-10-26", "summary": "Expressive robot motion positively impacts human-robot interaction by improving user engagement, likability, or task performance. We present a novel approach to automatically generate and modulate complex, expressive full-body gesture sequences from a multimodal (text, audio, video) context description. Based on a unified mathematical implementation of the Principles of Animation using Dynamic Movement Primitives, we use multimodal foundation models to generate such sequences along with parametric motion variations that are highly context-aware. This method extends the state of the art in terms of flexibility and generality by being interpretable, composable, and working across different robot morphologies. Moreover, we integrate the system into a continuous control framework and leverage knowledge distillation to learn a much smaller model, significantly improving token efficiency and system latency. Results from a user study with a human-like platform indicate that participants judged our system's motions to be better aligned with the interaction context than motions produced under a non-modulated or API-level condition. We also demonstrate how the system generates expressive motion for robots with different kinematics, showcasing its versatility. Paper webpage: https://gen-mod-expressive-motion-behavior.github.io/.", "pdf_url": "https://arxiv.org/pdf/2610.35615v1"}, {"title": "VaLoP: Value Gradient Lookahead and Pullback for Reward-Guided Diffusion", "authors": ["Kwanyoung Kim"], "published": "2026-10-26", "summary": "Reward guidance steers a pretrained diffusion or flow model toward images or actions that a reward model prefers, at sampling time and without retraining the model for each reward. It follows the gradient of a value function, the expected reward given the noisy state. The two common estimates of this gradient, gradients through a one-step denoised estimate and learned value models, are least accurate at high noise, where the coarse structure of the sample is decided. Interestingly, we find that both errors are posterior covariances, which grow with the uncertainty about the clean sample, and hence at higher noise. To reduce them, we evaluate the value at a less noisy state, one sampler step ahead, where this uncertainty is smaller, and pull its gradient back to the current state. This lookahead places both estimators at the two ends of one family and reveals that an intermediate lookahead requires one additional term, a correction through the generator. We therefore propose Value Gradient Lookahead and Pullback (VaLoP), which computes this correction with one vector-Jacobian product, and VaLoP-Fast, which amortizes it with a small head that, for text-to-image models, is trained with a single reward and reused for the others. Across various models, rewards, and benchmark datasets, both robustly outperform existing value-gradient guidance on the target reward, VaLoP-Fast at about the cost of learned-value guidance. Both extend to critic-guided robot policies, where VaLoP-Fast attains the highest success rates on LIBERO and RoboCasa.", "pdf_url": "https://arxiv.org/pdf/2610.35607v1"}, {"title": "RoboDoctor: Training-Free Recursive Self-Improvement for Robot Policies", "authors": ["Heyang Yu", "Haomin Li", "Sihang Li", "Jixin Yan", "Shiyun Peng", "Wanqi Zhong", "Tianyu Xin", "Yuan Yao", "Xiaoyu Tian", "Yiming Li"], "published": "2026-10-26", "summary": "Generalist robot policies and language-model agents provide complementary capabilities, but completing a task also requires adapting their use to the consequences of physical interaction. We study execution as a locus of adaptation: feedback guides the current action and supplies evidence for revising subsequent decisions under fixed model weights. We introduce RoboDoctor, a training-free framework that connects diagnosis, grounded action, and persistent experience across three revision targets. The harness allocates control between policy and agent; intervention determines when to assist while preserving useful policy behavior; and operation refines physical methods through observed effects. Linked experience records retain the reason for a decision, the attempted method, its outcome, and conditions for reuse. On a curated archive of 54 RoboDojo-Sim task entries, RoboDoctor achieves a five-dimension mean score of 57.10, with a native success rate of 49.44%. Recorded interactions illustrate strategy changes, selective correction, and grasp revision. These findings characterize execution-time adaptation in the evaluated system; controlled trials remain necessary to isolate the contribution of cross-episode experience.", "pdf_url": "https://arxiv.org/pdf/2610.35604v1"}, {"title": "Distributed Predictive Flocking for a Swarm of Miniature Vibration-Driven Robots in a Confined Arena", "authors": ["Prajol Shrestha", "Siddhant Mohapatra", "Filip Novkoski", "Julian Oelhaf", "Nicolas Vandewalle", "Ana-Sunčana Smith", "Andreas Maier"], "published": "2026-10-26", "summary": "Coordinating many miniature robots in a confined arena, with no leader, central planner, or global map, is a core challenge for swarm robotics. As the swarm grows denser, collision avoidance becomes the limiting factor, and the number of safely coexisting robots depends on the formulation of the inter-robot safety constraint. We present a distributed predictive flocking controller in which each robot solves its own nonlinear model predictive control (NMPC) problem, optimizing swarm cohesion and alignment costs, inter-robot and obstacle safety, and a task objective, while exchanging only predicted trajectories with local neighbors. Within this generalized controller architecture, solved in real time, we compare six barrier and control-barrier-function (CBF) safety formulations on a digital twin of an open-source vibration-driven bristlebot in a $0.64\\,\\mathrm{m^2}$ arena. A look-ahead discrete-time CBF performs best overall, with the fewest collisions and the widest inter-robot margins across nearly every swarm size tested. We deploy it on phototaxis, phototactic orbiting, and cohesion without a stimulus tasks, using swarm sizes starting from ten robots and up to the geometric packing limit. The swarm holds well: collisions stay low in small swarms, rising steeply as the packing limit approaches, while coordination and cohesion degrade gently rather than collapsing. The swarm is found not to trade safety for order, keeping both across the confined arena, with local alignment high at every swarm size.", "pdf_url": "https://arxiv.org/pdf/2610.35582v1"}, {"title": "Preemptive Instruction Following with Resumption", "authors": ["Zerun Liu", "Lechao Cheng", "Yimin Liu", "Shengeng Tang", "Yaxiong Wang", "Zhun Zhong"], "published": "2026-10-26", "summary": "Long-horizon embodied navigation may be interrupted by a higher-priority instruction before the current task sequence is complete. The agent must finish its current atomic task, execute the inserted task, and resume the remaining sequence from the updated environment state, where its viewpoint and available navigation candidates may have changed. To evaluate this capability, we introduce PIFR benchmark, a novel task for runtime task preemption and resumption in embodied navigation. PIFR includes single, repeated, and nested interruption settings,with stage-specific metrics for inserted-task completion, resumption of the original task, and completion of the full sequence. Evaluations show that recovery performance varies across interruption conditions, while aggregate success can obscure differences in interruption handling and resumption. We further propose a lightweight candidate-ranking baseline to improve target re-grounding after interruption. Together, PIFR and the baseline provide a systematic framework for studying interruption handling and task recovery in long-horizon embodied navigation.", "pdf_url": "https://arxiv.org/pdf/2610.35576v1"}, {"title": "High-resolution tactile observation makes hidden racket-control mechanisms learnable", "authors": ["Haoyang Tian", "Zhengwei Li", "Houcheng Li", "Xu Yang", "Peigeng Gu", "Xinyue Wang", "Tairan Zhu", "Shuo Jiang", "Long Cheng"], "published": "2026-10-26", "summary": "Experts can master fine hand-object manipulation skills, yet limited conscious perception of rapid tactile interactions hinders their ability to articulate the underlying control mechanisms. Badminton racket control requires rapid, fine hand-force coordination, providing a demanding testbed for uncovering these mechanisms. An 864-node tactile-inertial glove with synchronized 100-Hz acquisition recorded over 14,000 strokes from more than 70 participants across five skills. Inspired by sensorimotor control, our mechanics-grounded two-layer framework inferred object-driving and grip-stabilizing control from tactile history, while resolving their spatiotemporal force realization. We found that higher proficiency was associated with selective rather than extensive control: greater skill specificity, anticipatory regulation, focal distal modulation and lower geometric torque cancellation, while spatiotemporal coordination showed a non-monotonic acquire-refine pattern. We translated these mechanisms into personalized guidance targeting force control and force-motion coordination. In a randomized cohort, mechanism-guided learners gained 0.72 expert-rated skill levels versus 0.05 with level-only feedback, making control mechanisms actionable.", "pdf_url": "https://arxiv.org/pdf/2610.35563v1"}, {"title": "WorldPager: Zero-Stall Tiered Memory for Long-Horizon World Models on a Single Consumer GPU", "authors": ["Bingnan Liu", "Ruini Xue"], "published": "2026-10-26", "summary": "Interactive world models keep the KV of past chunks as retrieval memory so that revisited places stay consistent. On a single consumer machine (one RTX 4090, 32 GiB of host memory, one NVMe SSD), long sessions with such memory hit two walls. The first is capacity: the KV of Matrix-Game 2.0 exhausts host memory after 45 seconds of video in bf16 and after 2.8 minutes in int4. The second is the model's positional horizon of 4.3 minutes. We show that this memory is capacity-bound rather than bandwidth-bound and that its access set is known before compute, because the camera pose is an input. An analytical model built on these observations predicts spill points to within one chunk and classifies zero versus non-zero stalls correctly on held-out configurations. Guided by it, WorldPager stores int4 KV in a GPU/DRAM/NVMe hierarchy instead of recomputing it, prefetches each chunk's memory from the extrapolated pose, never waits on a miss, and writes back in the background; to our knowledge, it is the first to place the KV memory of an interactive world model on an NVMe tier with zero-stall prefetching. With training-free position handling, it generates 37.5 minutes of video continuously with zero stalls and constant host memory, at about 9.5 frames per second. On a sealed test set, int4 storage shows no measurable quality loss; on long-gap revisits it lowers image quality by about one MUSIQ point.", "pdf_url": "https://arxiv.org/pdf/2610.35529v1"}, {"title": "Enhancing Deep Reinforcement Learning for Robotic Motion Planning via Task Decomposition", "authors": ["Yuanzhi He", "Victor Romero-Cano", "Jiayu Xu", "Juan David Hernández", "Gualtiero Colombo"], "published": "2026-10-26", "summary": "Training robotic manipulation policies in simulation is widely adopted due to safety and cost efficiency; however, tasks involving obstacles remain under-performing and often converge slowly under Deep Reinforcement Learning (DRL). To address this challenge, we propose a task decomposition framework for DRL that integrates Transfer Learning (TL) with Reward Redesign (RR) to improve learning efficiency and robustness in obstacle environments. The TL strategy selectively transfers only the first-layer critic parameters across structurally related tasks, since that layer captures general state--action representations while deeper layers encode reward- and obstacle-specific value geometry; RR decomposes tasks into staged sub-objectives to provide denser optimization signals. Experiments on the PyBullet Panda platform show consistent gains in obstacle settings. On Push with obstacle, our method achieves $0.83 \\pm 0.05$, outperforming the strongest baseline (Truncated Quantile Critics (TQC), $0.77 \\pm 0.06$) by approximately $7.8\\%$. On Slide with obstacle, performance reaches $0.95 \\pm 0.02$, exceeding Soft Actor-Critic (SAC) ($0.84 \\pm 0.06$) by about $11\\%$ success rates. In addition to higher final performance, forward transfer reduces convergence time by up to $70\\%$ in obstacle tasks, and RR shortens sparse-reward Pick-and-Place training from roughly $0.75$M to $0.20$M steps ($\\approx73\\%$ reduction). The best policy is deployed on a real Franka Emika FR3 robot as a qualitative feasibility demonstration.", "pdf_url": "https://arxiv.org/pdf/2610.35494v1"}, {"title": "DEX-PHD: A Dexterous Portable Handheld Device for Multimodal Data Collection", "authors": ["Jooyoung Hong", "Noboru Myers", "Obin Kwon", "Yixian Yang", "Joohyung Kim"], "published": "2026-10-26", "summary": "Existing manipulation data collection methods typically offer either accurate robot-state acquisition through kinematic-chain-based teleoperation or convenient, portable operation through vision-based approaches. We present DEX-PHD, a portable handheld device that combines these advantages for dexterous manipulation by integrating a dexterous robot hand, continuous per-finger control, and multimodal logging. The system records proprioceptive information, fingertip contact data, and wrist-camera video, while the operator directly controls the robot hand through joint-level mapping. Its untethered design enables data collection across diverse environments. We demonstrate DEX-PHD on contact-rich tasks requiring coordinated multi-finger manipulation and deploy the collected demonstrations through open-loop replay on a physical humanoid robot. The results show that open-loop replay preserves the main temporal patterns of finger motion and task-relevant contact. Therefore, DEX-PHD provides a practical platform for portable, multimodal dexterous manipulation data collection.", "pdf_url": "https://arxiv.org/pdf/2610.35462v1"}, {"title": "RoKON: Efficient and Adaptive Data-Enabled Predictive Control for Robotic Manipulation", "authors": ["Akshun Sharma", "Zhongqi Wei", "Buqing Ou", "Frederike Dümbgen"], "published": "2026-10-26", "summary": "Data-enabled predictive control has recently emerged as a promising control paradigm, enabling a transparent optimal-control formulation without the need to learn an explicit dynamics model. This paper presents a number of extensions paving the path towards its use in real-time robotics tasks. Following recent work, we utilize a nonlinear predictor based on Gaussian kernels to represent the relationship between input and output data. We propose a damped Gauss-Newton method that enables real-time control by efficiently exploiting the least-squares structure of the control problem. In addition, we introduce a hybrid buffer management strategy that incorporates informative online data while retaining relevant offline data, allowing the predictor to account for changes in the dynamics. We demonstrate the tracking performance and computational suitability of the proposed method in MuJoCo using a Franka Research 3 arm pushing a block across surface, without prior knowledge of its changing friction values.", "pdf_url": "https://arxiv.org/pdf/2610.35458v1"}, {"title": "Prior Predictive Matching for Bayesian LoRA", "authors": ["Tomasz Kuśmierczyk", "Eliezer de Souza da Silva", "Marcin Sendera"], "published": "2026-10-26", "summary": "Bayesian variants of Low-Rank Adaptation (LoRA) provide principled uncertainty estimation when fine-tuning large foundation models, but require specifying the prior over the low-rank weight updates. We address this hyperparameter selection problem by introducing a closed-form prior-predictive estimator that operates before fine-tuning. We analyze a second-order expansion of the network and quantify how the low-rank prior drives function-space deviations from the pretrained outputs. We also show that these prior-predictive quantities depend on the prior only through the product of the adaptation rank and the fourth power of the prior scale. Because the training targets share a single draw of the latent weight update, we can leverage the covariance between example residuals to derive a moment-matching estimator. Furthermore, our theoretical analysis establishes that the optimal prior precision scales as $r^{-1/2}$ with the rank $r$, allowing a single estimate to generalize across all ranks. Controlled experiments across regression and classification tasks validate our approximation and show that our estimator recovers the true prior scale. On RoBERTa-large, our approach improves predictive negative log-likelihood (NLL) and calibration over both MAP and marginal-likelihood selection without requiring validation data, while achieving competitive out-of-distribution detection.", "pdf_url": "https://arxiv.org/pdf/2610.35457v1"}, {"title": "Model-Aware Generation of Safety-Critical Scenes for Robust End-to-End Driving via Distilled Planner Surrogates", "authors": ["Khaled M. Seyam", "Julian Wiederer", "Samar Fathalah", "Markus Braun", "Bin Yang"], "published": "2026-10-26", "summary": "End-to-end driving models perform well on standard benchmarks but collide frequently in safety-critical scenarios. We present a failure-mode analysis on NeuroNCAP which shows that 95.9% of DiffusionDrive's collisions are planning failures despite reliable detection, pinpointing the bottleneck in planning rather than perception. We attribute this to a fundamental data imbalance, as safety-critical interactions are rare in real driving logs, so planners are hardly ever trained on them. We close this gap with a novel model-aware framework that generates safety-critical training scenes against a specific planner. Each planner is attacked at the bird's-eye-view (BEV) level through a differentiable surrogate distilled from its own planning head. This keeps the expensive video renderer out of the attack loop. We extract 50 scenes per planner, each pairing an attack with a safe escape trajectory that serves as the fine-tuning label. A fully automated quality-diversity search generates both the attacks and the escapes, so that their variety is not specified by hand. Only these scenes are rendered to fine-tune the planner, which reduces the computational cost significantly. Fine-tuning on these scenes roughly halves the closed-loop collision rate of two planners on NeuroNCAP (SparseDrive 28.0% to 12.2%, DiffusionDrive 37.5% to 19.2%) while largely preserving normal driving. A cross-planner transfer experiment shows that the gain comes from targeting the specific planner. Each planner improves most on the scenes generated against itself, and DiffusionDrive fine-tuned on SparseDrive's scenes retains only 6.7 of its 18.3-point collision-rate reduction.", "pdf_url": "https://arxiv.org/pdf/2610.35448v1"}, {"title": "MATE-BT: A Behavior-Tree-Based Framework for Hierarchically Decentralized Mission Autonomy in Heterogeneous Multi-Robot Teams", "authors": ["Sunbeen Lee", "Hoseon Gi", "Jik Hur", "Inmo Jang"], "published": "2026-10-26", "summary": "Multi-robot teams executing predefined missions must adapt to runtime changes and sustain mission management despite robot failures. This paper proposes MATE-BT (Mission, Allocation, and Task Execution with Behavior Trees), a hierarchically decentralized framework that separates mission execution, allocation, and task execution. An active onboard leader manages mission progression and team-level task assignment, with authority transferable to another leader-capable robot after failure. Interchangeable decentralized methods resolve target assignments, while each robot adapts its local behavior through planning and acting with behavior trees. Webots simulations and real-robot experiments demonstrate mission continuity despite new targets and robot failures, including active-leader failure. In the physical experiments, all MATE-BT computation runs onboard. Hardware-in-the-loop resource measurements further support onboard execution on Jetson Orin Nano and Raspberry Pi 5. By updating only the affected layers without full-plan regeneration, MATE-BT maintained a response time of approximately 130 ms with 30 robots and 120 targets. Comparisons of four target-assignment plugins reveal scenario-dependent trade-offs between mission completion time and total travel distance.", "pdf_url": "https://arxiv.org/pdf/2610.35429v1"}, {"title": "EmbodiedLab: Benchmarking Embodied Agents That Act to Know", "authors": ["Hongcheng Gao", "Zelin Zheng", "Alex Zhou", "Jay Zhu", "Shijia Ge", "Yazhe Wang", "Xiping Li", "Jianshu Zeng", "Di Wu", "Xuan Shangguan", "Yexing Wan", "Lingyu He", "Yongli Wang", "Xiaohan Yu", "Zhiqi Jia", "Yue Liu", "Bryan Hooi", "Yinpeng Dong", "Wentao Zhang", "Sihang Wu", "Xiao He"], "published": "2026-10-26", "summary": "Embodied agents are expected to accomplish real-world goals by deciding for themselves how and when to interact with their surroundings. For many such goals, changing the physical state of the world is the means rather than the end: the agent changes the state of a system through interaction, observes the feedback, and explores until it either achieves the goal itself (e.g., discovering physical laws) or learns what the goal requires; it acts to know. Manipulation benchmarks stop at acting to change, with the target state given; scientific discovery benchmarks evaluate knowing but replace physical experimentation with symbolic actions or numerical queries. We introduce EmbodiedLab, a benchmark in which a robot must act to know. Quantitative science experiments make this setting controllable: the parameters of the system are resampled for every instance, so the result cannot be known in advance, yet it can be scored exactly. Across 30 experiments in five disciplines on 14 apparatus platforms, the agent receives an objective and the apparatus, chooses its own procedure, and operates a physics-based simulated laboratory, reading the instruments through its cameras. Evaluation checks what the agent came to know, grounded in readings recorded during the episode, as well as the physical state the task requires; every experiment is verified to be solvable. We evaluate six frontier models in their developers' coding agents with native observation and control, with added perception and motion planning, and with manipulation skills distilled from the strongest agents. With native control, even the strongest agent succeeds less than half the time; for every agent, most failures arise in interacting with the apparatus, and manipulation skills help weaker agents more than perception and planning. The benchmark and its evaluation code are available at https://github.com/HexaFuture/EmbodiedLab.", "pdf_url": "https://arxiv.org/pdf/2610.35385v1"}, {"title": "Rigid Particle-Induced Anomalous Softening in Elastomer Composites", "authors": ["Yonghyun Cho", "Hyeongho Min", "Hongdeok Kim", "Dongeun Lee", "Minjune Kim", "Siyeon Jang", "Ali Amini", "Zitang Wei", "Hosub Lim", "Hwan-ho Cho", "Bo-yong Park", "Sang Won Lee", "Joonmyung Choi", "Metin Sitti", "Sangyul Baik"], "published": "2026-10-26", "summary": "Particle-filled soft composites generally stiffen as particle loading increases, imposing a trade-off between functionality and compliance. Here, we show that this trade-off can be overcome by designing particles to actively direct gelation rather than act as passive fillers. In a sol-rich elastomer matrix, sol-phase kinetics redirect network formation towards particle-mediated assembly, yielding anomalous softening despite increasing particle content. This response is governed by topological reconfiguration of the load-bearing network during gelation rather than by filler loading alone. A structure-based model captures the composition-dependent onset of this behaviour, and the same response is reproduced across distinct particle systems. The resulting materials combine functionality with softness, energy dissipation, and recoverability under large deformation. These findings establish topology-guided gelation as a general strategy for engineering compliant functional composites for soft robotic actuation, conformal interfaces, and other systems that require both deformability and embedded material functionality.", "pdf_url": "https://arxiv.org/pdf/2610.35380v1"}], "repos": [{"repo": "harvard-edge/cs249r_book", "stars": 29691, "language": "Python", "description": "Machine Learning Systems: Foundations, Scaling, Agentic AI, and Physical AI (Vols I–IV) • Harvard CS249r | https://mlsysbook.ai", "url": "https://github.com/harvard-edge/cs249r_book", "date": "2026-10-27", "topic": "embodied-ai", "score": 11876.5}, {"repo": "NVIDIA/skills", "stars": 3753, "language": "Python", "description": "Agent Skills for NVIDIA products — install into Claude Code, Codex, and other coding agents to run Physical AI, robotics, simulation, CUDA, and RAG workflows end to end.", "url": "https://github.com/NVIDIA/skills", "date": "2026-10-27", "topic": "physical-ai", "score": 1501.3}, {"repo": "robocurve/inspect-robots", "stars": 709, "language": "Python", "description": "Open source evals for physical AI. Run any LLM/VLA on any arm/humanoid against any real/sim benchmark.", "url": "https://github.com/robocurve/inspect-robots", "date": "2026-10-27", "topic": "vla", "score": 283.7}, {"repo": "autonomous-ai/lampOS", "stars": 500, "language": "Python", "description": "The open-source operating system for physical AI.", "url": "https://github.com/autonomous-ai/lampOS", "date": "2026-10-27", "topic": "physical-ai", "score": 200.1}, {"repo": "awslabs/awsome-distributed-ai", "stars": 490, "language": "Shell", "description": "Best practices, reference architectures, and examples for distributed AI tra
