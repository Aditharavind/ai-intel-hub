raw Your Blood Now", "source": "IEEE Spectrum Robotics", "date": "2026-09-07", "url": "https://spectrum.ieee.org/blood-draw-robot-vitestro-aletta", "summary": "<img src=\"https://spectrum.ieee.org/media-library/an-older-silver-haired-woman-seated-at-automated-medical-device-with-a-robotic-arm-drawing-blood.jpg?id=67726417&amp;width=1245&amp;height=700&amp;coordinates=0%2C187%2C0%2C188\" /><br /><br /><p>You sit down and put your arm in the cradle. You press a button. The machine takes it from there.<\/p><p>A <a href=\"https://spectrum.ieee.org/tag/near-infrared-light\" target=\"_self\">near-infrared light<\/a> sweeps your inner elbow, hunting for a vein. A puff of alcohol hits your skin. An <a href=\"https://spectrum.ieee.org/tag/ultrasound\" target=\"_self\">ultrasound<\/a> probe glides across your arm, mapping how deep the vessel runs and which way it bends. Doppler captures the direction of blood flow to rule out the artery.<\/p><p>The cuff tightens around your upper arm. The needle comes down and pierces the skin. Your blood flows into the collection tubes, each one tipped end over end nine times—no more, no less. The needle withdraws. You get a bandage. No human ever touched you.<\/p><p>This is what it’s like to have blood taken by <a href=\"https://vitestro.com/aletta/\" rel=\"noopener noreferrer\" target=\"_blank\">Aletta<\/a>, the first <a href=\"https://spectrum.ieee.org/profile-veebot\" target=\"_self\">autonomous blood-draw device<\/a> authorized for use in the United States. Developed by the Dutch medical robotics firm <a href=\"https://vitestro.com/\" rel=\"noopener noreferrer\" target=\"_blank\">Vitestro<\/a>, the system combines imaging technologies with advanced robotics and AI to do by algorithm what a human phlebotomist—a trained health care professional who finds veins and draws blood by hand—does by feel.<\/p><p>The U.S. Food and Drug Administration <a href=\"https://www.fda.gov/news-events/press-announcements/fda-authorizes-first-its-kind-robotic-blood-draw-device\" rel=\"noopener noreferrer\" target=\"_blank\">gave Aletta the go-ahead<\/a> on 19 August for use on adults in nonhospitalized settings. The decision follows the lead of European regulators, who <a href=\"https://www.prnewswire.com/news-releases/vitestro-achieves-ce-marking-for-autonomous-blood-drawing-device-302231939.html\" rel=\"noopener noreferrer\" target=\"_blank\">authorized the device two years earlier<\/a>.<\/p><p>“You have to tip your cap to them,” says <a href=\"https://www.linkedin.com/in/maxbalter/\" rel=\"noopener noreferrer\" target=\"_blank\">Max Balter<\/a>, a surgical-robotics specialist at Medtronic who <a href=\"https://ieeexplore.ieee.org/document/7169572\" rel=\"noopener noreferrer\" target=\"_blank\">worked<\/a> on <a href=\"https://ieeexplore.ieee.org/document/7457657\" rel=\"noopener noreferrer\" target=\"_blank\">autonomous<\/a> blood-draw <a href=\"https://www.worldscientific.com/doi/10.1142/S2339547819500067\" rel=\"noopener noreferrer\" target=\"_blank\">systems<\/a> during grad school in the mid-2010s. “The engineering that they have is incredible…and with their FDA clearance, it moves the whole industry forward.”<\/p><h2>Aletta Boosts Lab Capacity Amid Shortages<\/h2><p>In a clinical trial involving more than 1,600 people in the Netherlands, Aletta successfully drew blood on the first attempt in <a href=\"https://doi.org/10.1093/clinchem/hvag029\" rel=\"noopener noreferrer\" target=\"_blank\">94.5 percent of cases<\/a>, even among those with hard-to-access veins, people with obesity, and the elderly. When Aletta failed to identify a suitable vein, the patient was referred for conventional phlebotomy.<\/p><p>“It’s exceptional performance,” says <a href=\"https://medicine.yale.edu/profile/joe-el-khoury/\" rel=\"noopener noreferrer\" target=\"_blank\">Joe El-Khoury<\/a>, a clinical chemist at Yale who was not involved in the Dutch trial. “It’s definitely as good if not better” than a typical professional phlebotomist.<\/p><p>Complications were minimal, with multiple built-in safeguards to detect problems, such as sensors that track arm movement and needle position, and to halt the process should something go awry. And for those whose veins proved too challenging, a phlebotomist remains on hand to take over when needed.<\/p><p>Notably, because a single phlebotomist can supervise up to three Aletta machines, the system should go a long way toward “helping clinical labs address the critical operational challenges related to the staffing shortages of phlebotomists,” says <a href=\"https://www.linkedin.com/in/luuk-giesen/\" rel=\"noopener noreferrer\" target=\"_blank\">Luuk Giesen<\/a>, chief medical officer of Vitestro.<\/p><p>That’s no small challenge in a profession with a <a href=\"https://aplm.kglmeridian.com/doi/10.5858/arpa.2019-0140-CP\" rel=\"noopener noreferrer\" target=\"_blank\">median annual turnover rate of nearly 25 percent<\/a> and a <a href=\"https://academic.oup.com/ajcp/article/164/5/759/8267738\" rel=\"noopener noreferrer\" target=\"_blank\">vacancy rate of close to 10 percent<\/a>, according to surveys of medical laboratories that draw mostly from U.S. institutions. The resulting staffing shortages can limit labs’ capacity to meet demand for routine diagnostic testing of blood counts, cholesterol, metabolic markers, and more. Aletta could address that bottleneck.<\/p><h2>Addressing Skin Tone Bias in Blood Draw AI<\/h2><p>The promise of greater capacity, however, comes with a caveat: Aletta still fails in roughly one case out of 20. Who are those people?<\/p><p>Some may simply have elusive or unusually deep veins. But a more significant obstacle could be skin pigmentation. In particular, the melanin in darker skin can interfere with the near-infrared light Aletta uses to first map the veins near the skin’s surface and identify promising puncture sites. The technique relies on hemoglobin absorbing the light differently from surrounding tissue, and darker skin tones can absorb more of that light before it reaches the camera, thereby reducing the contrast.<\/p><p class=\"shortcode-media shortcode-media-rebelmouse-image\"> <img alt=\"A smiling dark skinned woman holds a bandaid onto her arm while sitting next to a large machine.\" class=\"rm-shortcode\" id=\"9138e\" src=\"https://spectrum.ieee.org/media-library/a-smiling-dark-skinned-woman-holds-a-bandaid-onto-her-arm-while-sitting-next-to-a-large-machine.jpg?id=67726420&amp;width=980\" /> <small class=\"image-media media-caption\">Some experts have raised concerns that Aletta’s infrared sensors will perform poorly for people with darker skin tones, but Vitestro says that its machine also includes an ultrasound sensor, in part to mitigate that risk.<\/small><small class=\"image-media media-photo-credit\">Vitestro<\/small><\/p><p>Giesen recognizes that the issue could affect first-pass imaging, but notes that the main determinant of vein selection and needle placement is the ultrasound system, which relies on sound rather than light and should not be affected by skin pigmentation in the same way. “Ultrasound is skin-tone agnostic,” he says, adding that Vitestro has unpublished data showing no effect of skin tone on the system’s performance.<\/p><p>The company thus <a href=\"https://vitestro.com/aletta/patients/\" target=\"_blank\">claims on its website<\/a> that the “technology works well for all skin tones,” an assertion <a href=\"https://www.fda.gov/news-events/press-announcements/fda-authorizes-first-its-kind-robotic-blood-draw-device\" rel=\"noopener noreferrer\" target=\"_blank\">echoed in the FDA press release<\/a> announcing the authorization of Vitestro’s device.<\/p><p>But given the history of racial disparities in medical devices—particularly optical technologies such as pulse oximeters, which can be <a href=\"https://spectrum.ieee.org/pulse-oximeters-encode-racial-bias-with-clear-consequences-for-covid-19-patients\" target=\"_self\">less accurate in people with darker skin<\/a> and went largely unrecognized as a problem for decades—such claims warrant evidence, says El-Khoury, who has <a href=\"https://academic.oup.com/clinchem/article-lookup/doi/10.1093/clinchem/hvag045\" rel=\"noopener noreferrer\" target=\"_blank\">written about the issue<\/a>.<\/p><p><a href=\"https://www.mayoclinic.org/biographies/katzman-brooke-m-ph-d/bio-20514695\" rel=\"noopener noreferrer\" target=\"_blank\">Brooke Katzman<\/a>, a clinical chemist at the Mayo Clinic who is collaborating with Vitestro, also wants more evidence that samples collected by the robot are as suitable for testing as those drawn by hand.<\/p><p>The Dutch trial reported little damage to red blood cells, but other measures of sample quality, including clotted tubes, insufficient blood, and proper tube filling, still need to be assessed, as do the results of routine laboratory tests themselves. Katzman plans to launch a U.S.-based trial next year to collect just that sort of data.<\/p><p>“We’re going to do our due diligence,” she says. “Like any instrument we would bring into the lab, we’re going to put it through its paces before using it clinically.”<\/p><h2>The Future of Automated Blood Testing<\/h2><p>Aletta takes its name from the 19th-century physician <a href=\"https://pmc.ncbi.nlm.nih.gov/articles/PMC11151697/\" rel=\"noopener noreferrer\" target=\"_blank\">Aletta Jacobs<\/a>, the first female doctor in the Netherlands and founder of what is widely considered the world’s first birth-control clinic.<\/p><p>That nod to history is fitting for a technology that builds on decades of research in robotic phlebotomy by groups in <a href=\"https://ieeexplore.ieee.org/document/826854/\" rel=\"noopener noreferrer\" target=\"_blank\">Europe<\/a>, the <a href=\"https://www.researchgate.net/publication/309480332_Robotic_Assistive_Device_for_Phlebotomy\" rel=\"noopener noreferrer\" target=\"_blank\">United States<\/a>, and <a href=\"https://haoyangli16.github.io/pdf/venibot.pdf\" rel=\"noopener noreferrer\" target=\"_blank\">China<\/a>, and <a href=\"https://doi.org/10.3389/fmed.2023.1251963\" rel=\"noopener noreferrer\" target=\"_blank\">MagicNurse<\/a>. Yet few pushed the concept as far as biomedical engineer <a href=\"https://bme.rutgers.edu/martin-l-yarmush\" rel=\"noopener noreferrer\" target=\"_blank\">Martin Yarmush<\/a> of Rutgers University in New Jersey, in whose lab Medtronic’s Balter completed his Ph.D.<\/p><p>In one version of their platform, the Rutgers team even <a href=\"https://ieeexplore.ieee.org/document/7759102/\" rel=\"noopener noreferrer\" target=\"_blank\">coupled their robot to a benchtop blood analyzer<\/a>, allowing it to draw samples and then measure levels of infection-fighting immune cells and oxygen-carrying red blood cells—all within minutes.<\/p><p>That all-in system never made it out of laboratory testing. And VascuLogic, the company spun out to commercialize the platform, is long defunct—though others, including <a href=\"https://rophai.net/\" rel=\"noopener noreferrer\" target=\"_blank\">ROPHAI<\/a>, <a href=\"https://bhealthcare.com/\" rel=\"noopener noreferrer\" target=\"_blank\">BHealthCare<\/a>, and <a href=\"https://doi.org/10.3389/fmed.2023.1251963\" rel=\"noopener noreferrer\" target=\"_blank\">MagicNurse<\/a>, continue to work in the space. But the Rutgers proof-of-concept demonstration points toward the tantalizing possibility of fully automated blood testing at the point of care, with robots handling everything from the needle stick to the analysis.<\/p><p>It is, in some ways, the promise that Theranos made—but built on conventional, validated laboratory technology rather than the <a href=\"https://www.goodreads.com/en/book/show/37976541-bad-blood\" rel=\"noopener noreferrer\" target=\"_blank\">dubious science and deception<\/a> that brought that particular company down.<\/p><p>“I have no doubt that is the future,” says <a href=\"https://www.feinberg.northwestern.edu/faculty-profiles/az/profile.html?xid=22300\" rel=\"noopener noreferrer\" target=\"_blank\">Gregory Retzinger<\/a>, a clinical pathologist at the Northwestern University Feinberg School of Medicine, in Chicago, who <a href=\"https://vitestro.com/news/northwestern-medicine-and-vitestro-collaborate-to-advance-autonomous-robotic-phlebotomy/\" rel=\"noopener noreferrer\" target=\"_blank\">collaborates with Vitestro<\/a> and has tried the Aletta device himself. (“It was painless, it was fast,” he says.)<\/p><p>For now, Giesen says Vitestro is keeping its ambitions—and its machine—focused on the blood-collection process itself, though he believes Aletta could ultimately do far more. The company plans to launch Aletta in Europe next year, with the U.S. market to follow. <\/p>"}, {"title": "Inbolt to discuss physical AI’s deployment problem at RoboBusiness", "source": "Robotics Business Review", "date": "2026-09-07", "url": "https://www.therobotreport.com/inbolt-ceo-to-discuss-physical-ais-deployment-problem-at-robobusiness/", "summary": "<p>Rudy Cohen, the co-founder and CEO of Inbolt, will reframe where physical AI pays off at RoboBusiness this fall.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/inbolt-ceo-to-discuss-physical-ais-deployment-problem-at-robobusiness/\">Inbolt to discuss physical AI&#8217;s deployment problem at RoboBusiness<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Agility Robotics reports $1.8M revenue ahead of humanoid SPAC", "source": "Robotics Business Review", "date": "2026-09-07", "url": "https://www.therobotreport.com/agility-robotics-reports-18m-revenue-ahead-of-humanoid-spac/", "summary": "<p>Agility Robotics’ S-4 filing reveals $1.8 million in 2025 revenue, a $140 million operating loss and plans to scale its Digit humanoid robot business.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/agility-robotics-reports-18m-revenue-ahead-of-humanoid-spac/\">Agility Robotics reports $1.8M revenue ahead of humanoid SPAC<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "MassRobotics shares member survey results around FCC restrictions", "source": "Robotics Business Review", "date": "2026-09-07", "url": "https://www.therobotreport.com/massrobotics-shares-member-survey-results-around-fcc-restrictions/", "summary": "<p>MassRobotics has found that companies were split on the FCC ban on new foreign-produced mobile robots.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/massrobotics-shares-member-survey-results-around-fcc-restrictions/\">MassRobotics shares member survey results around FCC restrictions<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Pressure sensors can help improve robotic gripping accuracy", "source": "Robotics Business Review", "date": "2026-09-06", "url": "https://www.therobotreport.com/pressure-sensors-can-help-improve-robotic-gripping-accuracy/", "summary": "<p>From first contact through surface deformation, load distribution, and final stable hold, pressure sensors can improve robotic bin picking.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/pressure-sensors-can-help-improve-robotic-gripping-accuracy/\">Pressure sensors can help improve robotic gripping accuracy<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Eric Sivertson discusses FPGAs and robot security", "source": "Robotics Business Review", "date": "2026-09-06", "url": "https://www.therobotreport.com/eric-sivertson-discusses-fpgas-robot-security/", "summary": "<p>An interview with Eric Sivertson of Lattice Semiconductor about FPGAs and how they can improve robot safety and security.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/eric-sivertson-discusses-fpgas-robot-security/\">Eric Sivertson discusses FPGAs and robot security<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Cyborg Roaches Can Stab You With Needles", "source": "IEEE Spectrum Robotics", "date": "2026-09-05", "url": "https://spectrum.ieee.org/cyborg-rescue-roach", "summary": "<img src=\"https://spectrum.ieee.org/media-library/large-brown-cockroach-fitted-with-an-electronic-device-and-wires-on-its-back.jpg?id=67724302&amp;width=1245&amp;height=700&amp;coordinates=0%2C62%2C0%2C63\" /><br /><br /><p>Imagine you are trapped under rubble after an earthquake and you see an electronics-covered cockroach with a spring-loaded needle on its back scuttling toward you. Although the sight might be unnerving, to say the least, this prototype paramedic cyborg, or “Paraborg,” might one day help deliver lifesaving aid to disaster victims who might be otherwise impossible to reach.<\/p><hr /><h3>The Hardest Problems in Robotics<\/h3><p>For decades, scientists have sought to develop cyborg insects as “a shortcut around some of the hardest problems in robotics,” says <a href=\"https://about.uq.edu.au/experts/42152\" rel=\"noopener noreferrer\" target=\"_blank\">T. Thang Vo-Doan<\/a>, director of the <a href=\"https://tthangvodoan.wordpress.com/\" rel=\"noopener noreferrer\" target=\"_blank\">University of Queensland’s Biorobotics Lab<\/a> in Brisbane, Australia, which just published a paper on the Paraborgs.<\/p><p class=\"shortcode-media shortcode-media-youtube\"> <span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span> <small class=\"image-media media-photo-credit\">The University of Queensland<\/small> <\/p><p>Building an insect-size robot “that can move reliably through rubble, climb over irregular surfaces, recover from falls, carry its own power, and still have room for useful sensors is extraordinarily difficult,” Vo-Doan says. An insect already comes with much of that mobility built in, so instead of trying to create artificial versions of every part of an insect’s body from scratch, researchers can graft an electronic interface onto an insect to make use of its existing capabilities.<\/p><p>Previously, scientists have shown they could steer cyborg insects such as <a href=\"https://spectrum.ieee.org/the-robot-insect-race\" target=\"_self\">beetles<\/a> and <a href=\"https://spectrum.ieee.org/cyborg-moth-gets-a-new-radio\" target=\"_self\">moths<\/a>. This prior work largely focused on controlling their movements to serve as passive sensor platforms.<\/p><p>In 2023, as Vo-Doan and fellow researcher <a href=\"https://www.unsw.edu.au/staff/thanh-nho-do\" rel=\"noopener noreferrer\" target=\"_blank\">Thanh Nho Do<\/a> were talking about search-and-rescue cyborg insects shortly before that year’s IEEE International Conference on Robotics and Automation (ICRA), they asked, “What happens after an insect finds a trapped victim?” Vo-Doan recalls. “Could it go beyond locating someone and actually provide some form of assistance while rescuers are still trying to reach them?”<\/p><h3>Giant Cockroaches to the Rescue<\/h3><p>To answer this question, the roboticists experimented with giant burrowing cockroaches (<a href=\"https://en.wikipedia.org/wiki/Giant_burrowing_cockroach\" rel=\"noopener noreferrer\" target=\"_blank\"><em><em>Macropanesthia rhinoceros<\/em><\/em><\/a>), which are native to Australia. The researchers needed an insect capable of carrying a large payload (over half its weight), and at roughly 40 grams in size, this species is <a href=\"https://www.guinnessworldrecords.com/world-records/106442-heaviest-cockroach\" rel=\"noopener noreferrer\" target=\"_blank\">the world’s heaviest species of roach<\/a>. A larger insect is also easier to operate on to implant cybernetic interfaces.<\/p><p>The cockroaches were saddled with lightweight electronics that included electrodes implanted into both their antennae and small tail-like appendages known as cerci. Wirelessly activating these electrodes with a handheld gaming controller could steer the roaches left or right, spur them forward, or stop them from moving.<\/p><p>The insects were also equipped with either a wireless camera or a remote-controlled injector, which used a spring to launch a drug-filled syringe at a nearby target. A chemical reaction inside the syringe then generated a puff of carbon dioxide, which exerted pressure within the syringe to inject its payload into a target.<\/p><p class=\"shortcode-media shortcode-media-rebelmouse-image\"> <img alt=\"Two large cockroaches each with a set of electronics and sensors on their carapace\" class=\"rm-shortcode\" id=\"1244e\" src=\"https://spectrum.ieee.org/media-library/two-large-cockroaches-each-with-a-set-of-electronics-and-sensors-on-their-carapace.jpg?id=67724308&amp;width=980\" /> <small class=\"image-media media-caption\">Paraborgs are designed to work in teams, with some carrying cameras and others carrying injectors with potentially lifesaving medications.<\/small><small class=\"image-media media-photo-credit\">The University of Queensland<\/small><\/p><p>The scientists decided not to load both a camera and an injector onto a single roach because the combined weight and bulk could impair their mobility on complex terrain. Having both sets of electronics would also increase energy demands, resulting in reduced operation time. Instead, the researchers envision a <a href=\"https://spectrum.ieee.org/swarm-of-cyborg-cockroaches\" target=\"_self\">swarm<\/a> approach with the Paraborgs, with different specialized cyborgs performing complementary roles.<\/p><p>In proof-of-concept tests, the scientists were able to successfully navigate the Paraborgs over a 2.5-meter course past three checkpoints before launching their needles at an 8-by-10-centimeter silicone target. In 25 trials, the cockroaches completed the course every single time and succeeded at injecting the target 72 percent of the time. “The long-term goal is to combine the insect’s advanced locomotion with sensing and intervention capabilities so we can reach and help more people, more quickly,” Vo-Doan says.<\/p><p class=\"shortcode-media shortcode-media-rebelmouse-image\"> <img alt=\"Two large cockroaches with backpack electronics navigate around rocks and over sand.\" class=\"rm-shortcode\" id=\"e3858\" src=\"https://spectrum.ieee.org/media-library/two-large-cockroaches-with-backpack-electronics-navigate-around-rocks-and-over-sand.jpg?id=67724312&amp;width=980\" /> <small class=\"image-media media-caption\">While the Paraborgs can be steered remotely, the cockroaches themselves are still very much alive and able to use their skills as bugs to navigate through complex terrain.<\/small><small class=\"image-media media-photo-credit\">The University of Queensland<\/small><\/p><p>The researchers acknowledge that “for someone who is already trapped or injured, seeing a cyborg insect approaching could understandably be a little surprising or unsettling at first,” Vo-Doan says. Ways to make it clear these insects were part of rescue efforts might include flashing lights, recognizable emergency markings, “or perhaps a tiny speaker delivering a simple message such as, ‘Help is on the way,’ ” Vo-Doan adds. “Making people feel comfortable with the technology is just as important as making it work.”<\/p><h3>Practical Paraborgs<\/h3><p>In the future, Vo-Doan and his colleagues aim to address practical issues with the Paraborg. These include compensating for the movements of victims, establishing reliable wireless communications inside collapsed structures, and guiding the cyborgs as they climb over and squeeze through complex environments filled with rubble and dust. Autonomy will become increasingly important for these insects, particularly if the scientists want to operate multiple cyborgs at the same time, he says.<\/p><p>In addition, a fundamental challenge when it comes to working with cyborg insects is that they are living creatures with minds of their own. “We are not piloting them like conventional wheeled robots,” Vo-Doan says. “Electrical stimulation influences their direction, but the insect still generates and controls much of its own locomotion.” To deal with this unreliability, the Paraborgs will need better onboard systems to pinpoint their positions and monitor their actions so researchers can recognize when an insect has deviated from its course or become less responsive.<\/p><p>“We are not suggesting that this is a medical device ready to be used on people today,” Vo-Doan says. “Real disaster sites are full of unstable debris, narrow gaps, and communication difficulties, so we need to understand how the insect, electronics, and injector all perform under those conditions. There are also important questions around drug choice and dosage, sterility, needle safety, reliability, and regulation.”<\/p><p>Ultimately, such research into cyborg cockroaches may help inform robot design, explains Vo-Doan. These insects “can give us useful capabilities sooner while, at the same time, helping us develop the fully artificial systems of the future.”<\/p><p>The scientists detailed <a href=\"https://advanced.onlinelibrary.wiley.com/doi/10.1002/advs.76973\" target=\"_blank\">their findings<\/a> last month in the journal <em><em>Advanced Science<\/em><\/em>.<\/p>"}, {"title": "Enovis to acquire surgical tech provider eCential Robotics for $180M", "source": "Robotics Business Review", "date": "2026-09-05", "url": "https://www.therobotreport.com/enovis-to-acquire-ecential-robotics-for-180m/", "summary": "<p>Enovis said it plans to bring a robotic system targeting the knee within the next two years, followed by a system focusing on the shoulder.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/enovis-to-acquire-ecential-robotics-for-180m/\">Enovis to acquire surgical tech provider eCential Robotics for $180M<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "ARM Institute gets $90M for 10 projects to modernize military manufacturing", "source": "The Robot Report", "date": "2026-09-05", "url": "https://www.therobotreport.com/arm-institute-gets-90m-for-10-projects-to-modernize-military-manufacturing/", "summary": "<p>Fifteen member organizations will deliver viable working solutions within a two-year timeframe, the ARM Institute said.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/arm-institute-gets-90m-for-10-projects-to-modernize-military-manufacturing/\">ARM Institute gets $90M for 10 projects to modernize military manufacturing<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Lyte raises $165M to help robots better sense their surroundings", "source": "Robotics Business Review", "date": "2026-09-04", "url": "https://www.therobotreport.com/lyte-raises-165m-help-robots-better-sense-their-surroundings/", "summary": "<p>Lyte AI plans to use its second round of funding this year to scale production of its AI and perception capabilities.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/lyte-raises-165m-help-robots-better-sense-their-surroundings/\">Lyte raises $165M to help robots better sense their surroundings<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Robot.com partners with Sodexo to roll out more sidewalk delivery robots", "source": "Robotics Business Review", "date": "2026-09-04", "url": "https://www.therobotreport.com/robot-com-partners-sodexo-rolls-out-more-sidewalk-delivery-robots/", "summary": "<p>Robot.com says college campuses will continue to be an important part of its strategy as it scales sidewalk delivery robots.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/robot-com-partners-sodexo-rolls-out-more-sidewalk-delivery-robots/\">Robot.com partners with Sodexo to roll out more sidewalk delivery robots<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "How FPGAs become the gatekeepers of physical AI security", "source": "Robotics Business Review", "date": "2026-09-04", "url": "https://www.therobotreport.com/how-fpgas-become-the-gatekeepers-of-physical-ai-security/", "summary": "<p>Eric Sivertson, vice president of security business at Lattice Semiconductor, explains how FPGAs can act as deterministic guardrails for robotic systems.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/how-fpgas-become-the-gatekeepers-of-physical-ai-security/\">How FPGAs become the gatekeepers of physical AI security<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Calling robotics startups: Apply now to be part of the 2026 Robotics Startup Radar", "source": "Robotics Business Review", "date": "2026-09-04", "url": "https://www.therobotreport.com/calling-all-robotics-startups-apply-now-2026-robotics-startup-radar/", "summary": "<p>Submit now to be part of the Robotics Startup Radar, which brings together some of the most promising robotics startups.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/calling-all-robotics-startups-apply-now-2026-robotics-startup-radar/\">Calling robotics startups: Apply now to be part of the 2026 Robotics Startup Radar<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Video Friday: Digit Redecorates", "source": "IEEE Spectrum Robotics", "date": "2026-09-04", "url": "https://spectrum.ieee.org/video-friday-agility-robotics-digit", "summary": "<img src=\"https://spectrum.ieee.org/media-library/humanoid-robot-tidies-an-orange-couch-while-a-person-watches-in-a-modern-living-room.gif?id=67725697&amp;width=1500&amp;height=2000&amp;coordinates=231%2C0%2C231%2C0\" /><br /><br /><p><span>Video Friday is your weekly selection of awesome robotics videos, collected by your friends at <\/span><em>IEEE Spectrum<\/em><span> robotics. We also post a weekly calendar of upcoming robotics events for the next few months. Please <\/span><a href=\"mailto:automaton@ieee.org?subject=Robotics%20event%20suggestion%20for%20Video%20Friday\">send us your events<\/a><span> for inclusion.<\/span><\/p><h5><a href=\"https://humanoidssummit.com/\">Humanoids Summit Seoul<\/a>: 22–23 September 2026, SEOUL<\/h5><h5><a href=\"https://2026.ieee-iros.org/\">IROS 2026<\/a>: 27 September–1 October 2026, PITTSBURGH<\/h5><h5><a href=\"https://www.corl.org/\">CoRL 2026<\/a>: 9–12 November 2026, AUSTIN<\/h5><p>Enjoy today’s videos!<\/p><div class=\"horizontal-rule\"><\/div><div><span style=\"display: none;\"> <\/span><\/div><p class=\"rm-anchors\" id=\"ozpzi8vhgsg\">I know these videos from <a href=\"https://spectrum.ieee.org/digit-agility-robotics\" target=\"_blank\">Agility<\/a> can be a little bit silly, but the couch drag in this one is impressive.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.agilityrobotics.com/\">Agility Robotics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"hbynm1gcxbu\"><em>Stabilizing unsecured payloads against the inherent oscillations of dynamic bipedal locomotion remains a critical engineering bottleneck for humanoids in unstructured environments. To solve this, we introduce ReST-RL, a hierarchical reinforcement-learning architecture that explicitly decouples locomotion from payload stabilization. Successfully deployed on the Unitree G1 humanoid hardware, this modular approach demonstrates highly reliable zero-shot sim-to-real generalization across various objects and external force disturbances.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://steadytray.github.io/\">SteadyTray<\/a> ]<\/p><p>Thanks, Ioana!<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"qbuixdvviv4\"><a href=\"https://spectrum.ieee.org/figure-new-humanoid-robot\" target=\"_blank\">Figure<\/a> is scaling compute so that its robots can...uh...have their compute scaled, I guess?<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>Solving for a robot in every home is not a data-and-compute problem, it’s a safety-and-cost problem.<\/p><p>[ <a href=\"https://www.figure.ai/\">Figure<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"lg0lq7s69g4\">The most important thing to know about this gripper is that koalas have two thumbs on each hand.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://rai-inst.com/resources/blog/handheld-robotic-data-collection/\">RAI Institute<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"frfad-zunfy\">DARPA Triage Challenge Finals are in November!<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.darpa.mil/research/challenges/darpa-triage-challenge\">DARPA<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"ezcbwdvd_ya\"><em>Online, humanoid robots are very impressive to watch, but behind the scenes, most of those movements are carefully choreographed. Researchers in Carnegie Mellon University’s Safe AI Lab are instead teaching robots how to adapt. Their system, called APEX, allows a humanoid robot to navigate obstacles using adaptive, full-body maneuvers.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://engineering.cmu.edu/news-events/news/2026/09/02-robot-human-collaboration.html\">CMU<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"7dl-f9sbnek\"><em>Researchers from North Carolina State University have created teardrop-shaped soft robots that leap upward or forward when exposed to infrared light—and will keep jumping as long as the light is present. <\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><blockquote><em>The robots are made of a liquid-crystal elastomer ribbon shaped like a teardrop, with a thin aluminum tube shaped like a V at one end. When exposed to light from an infrared lamp, the surface of the ribbon contracts, causing the ribbon to rotate. The stiff V at one end of the robot prevents the ribbon from simply rolling in place, causing the ribbon to twist tighter and tighter. This stores energy until the twist reaches a critical point when the ribbon releases that energy, causing the V at one end of the teardrop to snap downward and strike the surface. This launches the teardrop into the air.<\/em><\/blockquote><p>[ <a href=\"https://news.ncsu.edu/2026/08/soft-robots-jumping-forever/\">NC State<\/a> ]<\/p><p>Thanks, Ship!<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"ws6boq4yeaq\">I’ll be honest—I was prepared to be underwhelmed by the DARPA Lift Challenge, but there was such creativity in the heavy-lift drone designs that I’m excited for it to come back in 2028.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.darpaliftchallenge.com/\">DARPA Lift Challenge<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"nh47n7cbx7s\">Thank you, Christian, for attempting to talk some sense into the internet.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.christianhubicki.com/\">Christian Hubicki<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"l9xu2wmkrrg\"><em>Humans use not only muscle signals but also stretched skin around joints as a cue for proprioception. To mimic this biological mechanism, we developed a three-layer joint-covering skin with 44 pressure- and stretch-sensitive elements for the musculoskeletal humanoid Musashi-W.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>It’s not a replicant, but one day, it will be.<\/p><p>[ <a href=\"https://poyotamu000.github.io/musashiw-joint-covering-skin/\">University of Tokyo<\/a> ]<\/p><p>Thanks, Akihiro!<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"8kdxnt-4zl0\">Having mobility issues with your robot? Just staple it to the end of an industrial robotic arm. Problem solved!<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.limxdynamics.com/en/products/tron2\">LimX Dynamics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"_kytnzqoe4k\">But what if I am the sort of person who needs to speak to a manager?<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.sharpa.com/pages/north-at-work\">Sharpa<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"gzxkmyjh5py\"><em>In Turpan, China—known as the City of Fire—summer ground temperatures can exceed 50 °C. During the grape harvest, farmers traditionally carry heavy baskets back and forth under the intense heat, while every extra minute in the sun can affect the freshness of the fruit. This year, the DEEP Robotics Lynx M20S joined the harvest. <\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.deeprobotics.cn/en\">DEEP Robotics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"_uav5s18cwq\"><em>This video showcases the achievements of the first OH! GYM! Project cohort, a group of university and graduate students who explored, developed, and deployed their own humanoid behaviors using the open-source AI Sapiens K1 platform. Over the course of one month, the students experienced the complete process of humanoid development—from creating motions in simulation to transferring them onto a physical robot through repeated Sim2Real experiments.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://docs.robotis.com/docs/common/oh_project/\">ROBOTIS<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div>"}, {"title": "PlusAI to take autonomous trucking public via a SPAC deal", "source": "Robotics Business Review", "date": "2026-09-03", "url": "https://www.therobotreport.com/plusai-takes-autonomous-trucking-public-via-spac-deal/", "summary": "<p>The SPAC transaction values PlusAI, whose self-driving trucking software is already generating revenue, at about $800 million.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/plusai-takes-autonomous-trucking-public-via-spac-deal/\">PlusAI to take autonomous trucking public via a SPAC deal<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Protecting Dynamic Industrial Robot Cable Carriers", "source": "IEEE Spectrum Robotics", "date": "2026-09-03", "url": "https://spectrum.ieee.org/industrial-robot-cable-carrier-protection", "summary": "<img src=\"https://spectrum.ieee.org/media-library/industrial-robotic-arm-with-cable-management-system-and-flexible-energy-chains.jpg?id=67633840&amp;width=1245&amp;height=700&amp;coordinates=0%2C104%2C0%2C104\" /><br /><br /><p><em>This article is brought to you by <a href=\"https://tsubaki-kabelschlepp.com/\" target=\"_blank\">Tsubaki KabelSchlepp<\/a>.<\/em><\/p><p>In modern automated manufacturing, six-axis articulated robots perform high-speed, multidirectional maneuvers under demanding operational cycles. However, as robot arms swivel, rotate, and extend, the electrical cables, fiber optics, and pneumatic hoses supplying them endure severe mechanical stress. Torsional twist, rapid acceleration, and repeated contact with machine structures often lead to premature conductor fatigue, insulation breakdown, and costly unplanned production halts.<\/p><p>To overcome these multi-axis motion challenges, the <a href=\"https://carriers.ustsubaki.com/products/cable-carriers/robotrax-system?utm_campaign=KSD&amp;utm_source=IEEESpectrum&amp;utm_medium=Native&amp;utm_term=Article&amp;utm_content=RobotraxDresspack\" rel=\"noopener noreferrer\" target=\"_blank\"><span>Tsubaki KabelSchlepp Robotrax System<\/span><\/a> provides a specialized three-dimensional cable carrier engineered specifically for complex robotic motion.<\/p><h2>Managing High Tensile Forces With Central Steel Technology<\/h2><p>Conventional cable carriers often transfer operational movement stress directly onto internal electrical lines and hoses. The Robotrax system changes this dynamic through a central steel cable that runs through the core of every chain link.<\/p><p class=\"pull-quote\">The Robotrax system’s central steel cable absorbs the primary tensile loads and preserves conductor integrity, dramatically extending cable service life.<\/p><p>When robot arms undergo rapid directional shifts and accelerations up to 10 g, this internal steel cable absorbs the primary tensile loads. By isolating electrical and fluid lines from pulling forces, the design preserves conductor integrity and dramatically extends cable service life. Mechanics can easily calibrate and adjust system tension using an integrated clamping piece, ensuring consistent mechanical support throughout long operational cycles.<\/p><h2>Spherical Link Design and Modular Cable Routing<\/h2><p>The foundation of the Robotrax system lies in its open, single-piece plastic links featuring spherical snap-on connections on both sides. This geometry allows the carrier to flex smoothly across three axes, providing radial rotation of up to ±450 degrees per meter depending on the model size.<\/p><p>To optimize internal organization, carrier links contain up to three distinct chambers. This physical separation prevents signal interference and mechanical abrasion between heavy power lines, sensitive data channels, and fluid hoses. For standard models (R040 through R100), technicians can press cables directly into the carrier without tools, drastically reducing installation and maintenance time. Larger configurations, such as the R140X, incorporate swiveling crossbars with snap locks alongside vertical and horizontal dividers for customized interior partitioning.<\/p><h3>​ROBOTRAX System<\/h3><br /><img alt=\"Numbered diagram of a flexible robotic arm with segmented joints and components\" class=\"rm-shortcode\" id=\"4af39\" src=\"https://spectrum.ieee.org/media-library/numbered-diagram-of-a-flexible-robotic-arm-with-segmented-joints-and-components.jpg?id=67685927&amp;width=980\" /><ol style=\"margin: 16px 0 0 0;\"><li style=\"padding: 4px 4px;\">Steel cable for transferring extremely high tensile forces<\/li><li style=\"padding: 4px 4px;\">Tension piece for locking the chain links<\/li><li style=\"padding: 4px 4px;\">Type with toolless opening swivel crossbars and divider module available<\/li><li style=\"padding: 4px 4px;\">Open design<br />– Fast cable laying as the cables are simply pressed in<br />– Easy checking of all cables<\/li><li style=\"padding: 4px 4px;\">Special plastic for long service life<\/li><li style=\"padding: 4px 4px;\">Protective covers or heat shields made from different materials are available for different environmental conditions<\/li><li style=\"padding: 4px 4px;\">Quick-release bracket for fixing and continuation<\/li><li style=\"padding: 4px 4px;\">Strain relief with LineFix clamps<\/li><li style=\"padding: 4px 4px;\">Protection against hard impacts, excessive abrasion and premature wear as well as limitation of the bending radius through protector<\/li><\/ol><h2>Active Retraction and Impact Protection<\/h2><p>Large robot work envelopes and high-speed motion trajectories can cause loose cable carrier loops to swing and strike the robot body. To eliminate these destructive collisions, Tsubaki KabelSchlepp integrates the Pull Back Unit (PBU).<\/p><p>The PBU serves as an active retraction mechanism that maintains optimal tension on the cable carrier throughout the entire motion cycle. By preventing excess slack and eliminating interfering contours, the PBU minimizes collision risks across complex movement paths. The unit requires zero maintenance on its retraction element and offers standard mounting configurations for leading industrial robot platforms, including KUKA, ABB, and FANUC.<\/p><p class=\"pull-quote\">Tsubaki KabelSchlepp’s Pull Back Unit <span>maintains optimal tension on the cable carrier and minimizes collision risks across complex movement paths.<\/span><\/p><p><span><\/span><span>Additionally, external protectors can be retrofitted onto individual chain links. These durable impact shields limit the minimum bending radius to prevent over-flexing while shielding the chain body from severe external abrasion. If wear occurs, technicians simply replace the modular protector rather than the entire cable carrier assembly.<\/span><\/p><h2>Built for Demanding Industrial Environments<\/h2><p>From automotive welding cells to high-speed machining centers, Robotrax systems adapt to severe working conditions through tailored protective accessories:<\/p><ul><li><strong>Heat Shields: <\/strong>Aluminum-coated textile fiber covers protect against radiated heat, hot weld spatter, and flying sparks.<\/li><li><strong>Protective Covers: <\/strong>Coated polyester sleeves shield sensitive lines against aggressive cutting fluids, hydraulic oils, paint overspray, and abrasive dust.<\/li><li><strong>LineFix Strain Relief:<\/strong> Multi-layer clamping devices anchor cables securely at both ends to prevent axial displacement during intense motion.<\/li><\/ul>By combining central load absorption, multi-axis flexibility, and active retraction control, the Robotrax system offers plant engineers and system integrators a reliable path toward maximizing robot uptime and reducing total operational costs."}, {"title": "The Best Way to Explore Lunar Craters Is a Giant Robot Ball", "source": "IEEE Spectrum Robotics", "date": "2026-09-03", "url": "https://spectrum.ieee.org/moon-ball-robot", "summary": "<img src=\"https://spectrum.ieee.org/media-library/a-gif-of-a-spherical-robot-rolling-over-a-bumpy-path.gif?id=67701776&amp;width=1245&amp;height=700&amp;coordinates=0%2C0%2C0%2C0\" /><br /><br /><p>On a good day, the rock quarry in central Texas is about 370,000 kilometers (230,000 miles) from the moon. But last February, when Rishi Jangale watched his 1.8-meter-wide, 150-kilogram inflatable robot roll effortlessly over rocks, gravel, and wet clay, his imagination turned the quarry into the lunar surface instead.<\/p><p>Jangale is an upbeat mechanical engineer nearing the end of his Ph.D. at Texas A&amp;M University, in College Station, Texas. He and his labmates have been working on this big tan “RoboBall” for about five years. Their goal: create a vehicle capable of <a href=\"https://spectrum.ieee.org/a-jumping-robot-for-enceladus\" target=\"_blank\">exploring some of the most inaccessible terrain<\/a> in our solar system, such as the 21 km-wide Shackleton crater on the moon’s south pole.<\/p><p>The Shackleton crater is 4 km deep and contains many smaller, deeper craters within. Some parts of the crater never see the sun, and within these perpetually dark, frigid pockets lie mysterious substances that planetary scientists have long struggled to examine, including layers of ancient lunar geology and stores of frozen water that could potentially support a future lunar base.<\/p><p>“The moon is like an archive of what happened to the Earth,” says <a href=\"https://www.nhm.ac.uk/our-science/people/sara-russell.html\" rel=\"noopener noreferrer\" target=\"_blank\">Sara Russell<\/a>, a cosmic mineralogist with London’s Natural History Museum who is not involved with Texas A&amp;M’s work. “Robotic collection works brilliantly well, and it’s great to see that being explored more in this context.”<\/p><p>“NASA is not going to let astronauts get anywhere near these craters, because if someone falls in, you’re not going to be able to get them out,” Jangale says. “So we thought, what better shape to roll down a hill than a ball?” In a <a href=\"https://ieeexplore.ieee.org/document/11248963\" rel=\"noopener noreferrer\" target=\"_blank\">recent paper<\/a> published in <em><em>IEEE Transactions on Field Robotics<\/em><\/em>, Jangale’s team reports on the design of RoboBall, a hypothetical lunar mission, and the results from initial tests in the Texas quarry.<\/p><h2>Getting Rolling<\/h2><p>RoboBall is the brainchild of Jangale’s advisor, <a href=\"http://link?\" rel=\"noopener noreferrer\" target=\"_blank\">former NASA robotics engineer Robert Ambrose<\/a>, who first conceived of the design in 2003.<\/p><p>Ambrose figured that a ball could address a pesky mobility risk that robots face on lunar terrain, especially in low gravity: <a href=\"https://www.bbc.com/news/science-environment-68388695\" rel=\"noopener noreferrer\" target=\"_blank\">tipping over<\/a>. An inflatable sphere can’t tip over, and the form factor also insulates its internal components from sharp rocks, dust, and the huge temperature swings from over 93 °C in sunlit spots to minus 240 °C in the shade inside lunar craters. Ambrose imagined a wheeled rover parking at a crater’s edge and releasing a RoboBall to explore its depths. Unlike <a href=\"https://www-robotics.jpl.nasa.gov/how-we-do-it/systems/the-axel-rover/\" rel=\"noopener noreferrer\" target=\"_blank\">a small tethered rover<\/a>, the RoboBall wouldn’t roll its way back up—but with no strings attached, it would have a far greater range to collect geological samples, and then be able to launch them back to the rover outside the crater with small rockets.<\/p><p class=\"shortcode-media shortcode-media-rebelmouse-image rm-float-left rm-resized-container rm-resized-container-25\" style=\"float: left;\"> <img alt=\"A wheeled rover carrying a robotic ball up a small hill of dirt and gravel.\" class=\"rm-shortcode\" id=\"20656\" src=\"https://spectrum.ieee.org/media-library/a-wheeled-rover-carrying-a-robotic-ball-up-a-small-hill-of-dirt-and-gravel.jpg?id=67694269&amp;width=980\" /> <small class=\"image-media media-caption\">A robotic rover would ferry RoboBall across the lunar surface to the edge of a crater.<\/small><small class=\"image-media media-photo-credit\"><a href=\"https://ieeexplore.ieee.org/document/11248963\" target=\"_blank\">R. Jangale, D. Pravecek, et al.<\/a><\/small><\/p><p>NASA hasn’t brought lunar samples back to Earth in over 50 years. Some morsels of moon geology find their way to Earth as meteorites, but Russell says these lack the “gold standard” field work—context about where that sample actually came from. Even as NASA reboots its crewed moon missions, many lunar sites remain inaccessible.<\/p><p>In 2022, Ambrose’s lab finished a proof of concept, the 0.5-meter-wide RoboBall II. Creating the full-size RoboBall III then took about 11 months. “We were building these robots really quickly,” Jangale says. “Ambrose really encourages us to use and break these robots.” And designs did go awry. Jangale remembers software errors and a drivetrain that proved too weak to roll over soft bumps in initial tests.<\/p><p class=\"shortcode-media shortcode-media-youtube\"> <span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span> <small class=\"image-media media-photo-credit\"><a href=\"https://www.youtube.com/watch?v=tnj4BRuprlI\" target=\"_blank\">Texas A&amp;M RAD Lab/YouTube<\/a><\/small><\/p><h2>How to Slow Your Roll<\/h2><p>RoboBall drives by moving a pendulum within its shell, shifting its entire center of mass. On flat ground, if the pendulum’s arm points forward, the shell rolls forward to compensate, and as long as the pendulum keeps the center of mass in front of the center of the ball, RoboBall will keep rolling forward. If the pendulum leans a few degrees to the left or right, RoboBall steers left or right to match. “The robot wants to go where you point the pendulum,” Jangale says. The 340-pound ball is just soft enough to bounce lightly over bumpy obstacles, but its slight overpressure keeps it relatively firm. On steep slopes, this mechanism also lets the ball control its downhill speed by simply angling the pendulum uphill.<\/p><p>“The beauty here is the simplicity,” says Hiro Ono, an aerospace engineer who worked on robot mobility at NASA’s Jet Propulsion Lab for 13 years before joining Georgia Tech. For space robots, Ono describes simplicity in terms of the number of actuators. RoboBall has just two, and both are fully inside of the shell, shielded from environmental risk factors like dust, a feature that Ono describes as “unique.”<\/p><p>After the first quarry tests, it took about seven months for the team to design and build an upgraded RoboBall III with 2.5 times more torque—enough to fling itself over small obstacles and roll up 20 degree slopes.<\/p><p class=\"shortcode-media shortcode-media-rebelmouse-image\"> <img alt=\"Close-up of a needle-like rocket protruding from the payload bay of a large robotic ball.\" class=\"rm-shortcode\" id=\"0c74a\" src=\"https://spectrum.ieee.org/media-library/close-up-of-a-needle-like-rocket-protruding-from-the-payload-bay-of-a-large-robotic-ball.jpg?id=67694233&amp;width=980\" /> <small class=\"image-media media-caption\">A small rocket can launch out of the center of the RoboBall to return a sample back to a rover outside the crater.<\/small><small class=\"image-media media-photo-credit\"><a href=\"https://ieeexplore.ieee.org/document/11248963\" target=\"_blank\">R. Jangale, D. Pravecek, et al.<\/a><\/small><\/p><h2>Getting Mission Ready<\/h2><p>In the new paper, the remotely operated RoboBall III descended the quarry’s slopes, navigated soft terrain, and launched hypothetical payloads back out of the crater with small rockets. Powered by a large battery, the robot would inflate itself during a lunar mission and charge up from a robotic rover at the edge of a crater before heading out on its own.<\/p><p>RoboBall is probably not the right platform for all kinds of missions—its slightly bumbling nature means that it’s not ideal if you want to collect a sample from a very specific rock, for example. For now, the team hopes to work with scientists designing lunar science instruments to physically fit into RoboBall’s carry-on-luggage-size interior, while also fitting in with how RoboBall operates. “The robot is not the mission,” Jangale says. “The robot is a way for you to complete the mission.”<\/p><p>The current version of RoboBall cost roughly $250,000 to build, but is not quite ready for the moon in its current form. While its gold-treated aluminum parts are appropriate for space missions, its other materials are not. Space-grade electronics will cost more, and the ball’s shell—made from a material tough enough to roll over steel shards and withstand minus 184 °C temperatures—has never been evaluated in lunar extremes. Aside from materials questions, the team plans to engineer the ball to adapt how it drives on varying slopes autonomously. They also hope to collaborate with government agencies or spaceflight contractors to keep refining the robot’s design for a real, <a href=\"https://spectrum.ieee.org/moon-landing-2025\" target=\"_blank\">eventual mission<\/a>.<\/p><p>Later this year, Texas A&amp;M will open <a href=\"https://space.tamu.edu/institute/facility/\" target=\"_blank\">a new facility<\/a> in Houston with the world’s largest indoor simulated moon and Mars landscapes. The facility is only 190 km from Jangale’s quarry. It’s still about 370,000 km from the moon, but it’s going to help Jangale get his robot quite a bit closer.<\/p>"}, {"title": "JAKA hits Teradyne Robotics back over patent dispute", "source": "Robotics Business Review", "date": "2026-09-03", "url": "https://www.therobotreport.com/jaka-hits-teradyne-robotics-back-over-patent-dispute/", "summary": "<p>JAKA is now taking legal action against Teradyne Robotics to end public dissemination of statements it considers \"false, misleading and damaging.\"<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/jaka-hits-teradyne-robotics-back-over-patent-dispute/\">JAKA hits Teradyne Robotics back over patent dispute<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "NVIDIA plans to acquire Hugging Face and keep AI development platform open", "source": "Robotics Business Review", "date": "2026-09-03", "url": "https://www.therobotreport.com/nvidia-to-acquire-hugging-face-and-keep-ai-develpment-platform-open/", "summary": "<p>NVIDIA is already a major model contributor to Hugging Face, which recently surpassed 1 million datasets.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/nvidia-to-acquire-hugging-face-and-keep-ai-develpment-platform-open/\">NVIDIA plans to acquire Hugging Face and keep AI development platform open<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Medtronic invests $700M in surgical partner Cornerstone Robotics", "source": "Robotics Business Review", "date": "2026-09-03", "url": "https://www.therobotreport.com/medtronic-invests-700m-in-surgical-partner-cornerstone-robotics/", "summary": "<p>Medtronic and Cornerstone Robotics are building a multi-port portfolio anchored by the Hugo surgical system and expanded by Sentire.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/medtronic-invests-700m-in-surgical-partner-cornerstone-robotics/\">Medtronic invests $700M in surgical partner Cornerstone Robotics<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Learn why food is physical AI’s hardest problem at RoboBusiness", "source": "Robotics Business Review", "date": "2026-09-02", "url": "https://www.therobotreport.com/learn-why-food-is-physical-ai-hardest-problem-chef-robotics-robobusiness/", "summary": "<p>Rajat Bhageria, the founder and CEO of Chef Robotics, will explore what makes food such a demanding benchmark for physical AI.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/learn-why-food-is-physical-ai-hardest-problem-chef-robotics-robobusiness/\">Learn why food is physical AI&#8217;s hardest problem at RoboBusiness<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}], "embeddedNews": [{"title": "Vacuum Drying and Making Stuff Hot in a Vacuum", "source": "Hackaday", "date": "2026-10-01", "url": "https://hackaday.com/2026/10/01/vacuum-drying-and-making-stuff-hot-in-a-vacuum/", "summary": "<div><img alt=\"Two diaphragm vacuum pump setups with high-tech jam jar vacuum vessel. (Credit: Maya Posch)\" class=\"attachment-large size-large wp-post-image\" height=\"533\" src=\"https://hackaday.com/wp-content/uploads/2026/02/vacuum_drying_diaphragm_pump_configurations_maya_posch.jpg?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>After previously exploring the impact of vapor pressure on the drying of desiccant and more, the conclusion was essentially that in order to drive moisture that&#8217;s not directly on a <a class=\"read-more\" href=\"https://hackaday.com/2026/10/01/vacuum-drying-and-making-stuff-hot-in-a-vacuum/\">&#8230;read more<\/a>"}, {"title": "The Whole Computer Is Vim", "source": "Hackaday", "date": "2026-10-01", "url": "https://hackaday.com/2026/10/01/the-whole-computer-is-vim/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"450\" src=\"https://hackaday.com/wp-content/uploads/2026/09/esp-vim-featured.jpg?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>Love it or hate it, Vim, the vi-compatible minimalist editor, is a common denominator between a huge array of operating systems. If you need to edit a file, it&#8217;s usually <a class=\"read-more\" href=\"https://hackaday.com/2026/10/01/the-whole-computer-is-vim/\">&#8230;read more<\/a>"}, {"title": "SDR– Lets You Patch Together Your Setup", "source": "Hackaday", "date": "2026-10-01", "url": "https://hackaday.com/2026/10/01/sdr-lets-you-patch-together-your-setup/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"449\" src=\"https://hackaday.com/wp-content/uploads/2026/09/Screenshot-2026-10-01-101123-e1790813515650.png?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>It is often helpful to think of a radio as a series of interconnected functional blocks—hence the use of block diagrams to convey how a given radio operates. [Julian Haag] <a class=\"read-more\" href=\"https://hackaday.com/2026/10/01/sdr-lets-you-patch-together-your-setup/\">&#8230;read more<\/a>"}, {"title": "DIY Game Console Does It With Optical Disks", "source": "Hackaday", "date": "2026-10-01", "url": "https://hackaday.com/2026/09/30/diy-game-console-does-it-with-optical-disks/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"450\" src=\"https://hackaday.com/wp-content/uploads/2026/09/cd-game-console-feat.jpg?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>Optical media may be dead for video games on the big corporate consoles, but not in [Emmet]&#8217;s heart&#8211; or on his DIY game console, that he built specifically to use <a class=\"read-more\" href=\"https://hackaday.com/2026/09/30/diy-game-console-does-it-with-optical-disks/\">&#8230;read more<\/a>"}, {"title": "Will Superconducting Transistors Help Quantum Computers?", "source": "Hackaday", "date": "2026-10-01", "url": "https://hackaday.com/2026/09/30/will-superconducting-transistors-help-quantum-computers/", "summary": "<div><img alt=\"Quantum computer\" class=\"attachment-large size-large wp-post-image\" height=\"484\" src=\"https://hackaday.com/wp-content/uploads/2021/10/QuantumComputing.jpg?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>Despite all the glamorous promises made about quantum computing, it&#8217;s hard to make the argument that today&#8217;s quantum computers hold a candle to the sheer practicality of classical computers, especially <a class=\"read-more\" href=\"https://hackaday.com/2026/09/30/will-superconducting-transistors-help-quantum-computers/\">&#8230;read more<\/a>"}, {"title": "LakeShark firmware turns LilyGO T-Display P4 into a handheld ESP32-P4 SDR scanner", "source": "CNX Software", "date": "2026-10-01", "url": "https://www.cnx-software.com/2026/10/01/lakeshark-firmware-turns-lilygo-t-display-p4-into-a-handheld-esp32-p4-sdr-scanner/", "summary": "<div><img alt=\"LilyGO T Display P4 running LakeShark open source firmware\" class=\"attachment-medium size-medium wp-post-image\" height=\"480\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/09/LilyGO-T-Display-P4-running-LakeShark-open-source-firmware-720x480.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>LakeShark is open-source firmware by Samuel Reynolds (SAMS0N1TE) that turns the ESP32-P4-based LilyGO T-Display P4 into a handheld SDR scanner. Paired with an RTL-SDR Blog V3 or V4 dongle, it supports P25 Phase I trunking, analog FM/AM, POCSAG pager decoding, and 1090 MHz ADS-B reception directly on the ESP32-P4, without a PC, Raspberry Pi, or smartphone. It also includes an onboard SX1262 that supports LoRa and MeshCore applications. SDR devices like LimeSDR Micro, xSDR, UUGear’s VU GPSDR, and many others usually rely on a PC, Raspberry Pi, or smartphone for processing, but LakeShark shows that a powerful microcontroller can also handle many SDR tasks. We previously covered the LilyGO T-Display P4 in March 2026, and LakeShark makes good use of its built-in hardware, including the SX1262 for LoRa and MeshCore applications, L76K GPS receiver for location tracking and offline maps, and ESP32-C6 for Wi-Fi and Bluetooth connectivity. LakeShark hardware requirements: Primary [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/10/01/lakeshark-firmware-turns-lilygo-t-display-p4-into-a-handheld-esp32-p4-sdr-scanner/\">LakeShark firmware turns LilyGO T-Display P4 into a handheld ESP32-P4 SDR scanner<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "$30 Raspberry Pi Smart Display Module for CM5 targets digital signage displays and kiosks", "source": "CNX Software", "date": "2026-10-01", "url": "https://www.cnx-software.com/2026/10/01/30-raspberry-pi-smart-display-module-for-cm5-targets-digital-signage-displays-and-kiosks/", "summary": "<div><img alt=\"Raspberry Pi Smart Display Module\" class=\"attachment-medium size-medium wp-post-image\" height=\"478\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/09/Raspberry-Pi-Smart-Display-Module-720x478.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Raspberry Pi Smart Display Module is a CM5 carrier board compatible with the Intel Smart Display Module (SDM) specification, more specifically the SDM-L form factor (as opposed to the smaller SDM-S option). The Intel SDM standard has been around for years, and we first wrote it in 2018, covering the Axiomtek SDM300s (SDM-S) module. These cards are designed to be plugged into compatible digital signage displays, kiosks, point-of-sale systems, and so on. They feature a standard 98-pin PCIe edge connector with USB 3.0, HDMI 1.4/2.0, I2C/UART/SPI signalling, as well as Ethernet, HDMI, USB ports, and an M.2 expansion socket. Raspberry Pi Smart Display Module specifications: Compatible with Raspberry Pi Compute Module 5 Video Output &#8211; Full-size HDMI 2.0 port Camera &#8211; 22-way MIPI DSI/CSI-2 connector (internal) Networking Gigabit Ethernet RJ45 port WiFi 5 and Bluetooth 5.2 (on CM5) with U.FL antenna USB USB 3.0 Type-A port USB 2.0 Type-C port for programming [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/10/01/30-raspberry-pi-smart-display-module-for-cm5-targets-digital-signage-displays-and-kiosks/\">$30 Raspberry Pi Smart Display Module for CM5 targets digital signage displays and kiosks<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Fable: The Invention Which Took Time", "source": "Electronics Weekly", "date": "2026-10-01", "url": "https://www.electronicsweekly.com/blogs/mannerisms/fable/fable-the-invention-which-took-time-2026-10/", "summary": "<p>There was once a man who was determined  to harness the electrons created by the Edison Effect to perform as a signal detector. After 15 years of experimentation he achieved [&#8230;]<\/p>\n<p>The post <a href=\"https://www.electronicsweekly.com/blogs/mannerisms/fable/fable-the-invention-which-took-time-2026-10/\">Fable: The Invention Which Took Time<\/a> appeared first on <a href=\"https://www.electronicsweekly.com\">Electronics Weekly<\/a>.<\/p>"}, {"title": "Nanosecond-level precision laser pulse control for lidar and ToF systems", "source": "Electronics Weekly", "date": "2026-10-01", "url": "https://www.electronicsweekly.com/news/business/nanosecond-level-precision-laser-pulse-control-for-lidar-and-tof-systems-2026-10/", "summary": "<p>Lidar and time-offlight (ToF) systems depend on fast, stable and repeatable laser pulses, write Laephar Castro and Anant Sinha. The growing adoption of autonomous vehicles, industrial automation and advanced robotics [&#8230;]<\/p>\n<p>The post <a href=\"https://www.electronicsweekly.com/news/business/nanosecond-level-precision-laser-pulse-control-for-lidar-and-tof-systems-2026-10/\">Nanosecond-level precision laser pulse control for lidar and ToF systems<\/a> appeared first on <a href=\"https://www.electronicsweekly.com\">Electronics Weekly<\/a>.<\/p>"}, {"title": "ESA, Mistral sign agreement to explore space AI", "source": "Electronics Weekly", "date": "2026-10-01", "url": "https://www.electronicsweekly.com/news/business/esa-mistral-sign-agreement-to-explore-space-ai-2026-10/", "summary": "<p>The European Space Agency (ESA) and Mistral will be working together to increase role of AI in space. Mistral AI is a French artificial intelligence company with a current company [&#8230;]<\/p>\n<p>The post <a href=\"https://www.electronicsweekly.com/news/business/esa-mistral-sign-agreement-to-explore-space-ai-2026-10/\">ESA, Mistral sign agreement to explore space AI<\/a> appeared first on <a href=\"https://www.electronicsweekly.com\">Electronics Weekly<\/a>.<\/p>"}, {"title": "IPO market gets choppy", "source": "Electronics Weekly", "date": "2026-10-01", "url": "https://www.electronicsweekly.com/news/business/ipo-market-gets-choppy-2026-10/", "summary": "<p>Earlier this week the smart ring company Oura pulled a $15 billion IPO the day before it was due to list  citing &#8220;uncertainty in the IPO market&#8221;. Oura had intended [&#8230;]<\/p>\n<p>The post <a href=\"https://www.electronicsweekly.com/news/business/ipo-market-gets-choppy-2026-10/\">IPO market gets choppy<\/a> appeared first on <a href=\"https://www.electronicsweekly.com\">Electronics Weekly<\/a>.<\/p>"}, {"title": "FTC to accelerate investigation into Anthropic and OpenAI", "source": "Electronics Weekly", "date": "2026-10-01", "url": "https://www.electronicsweekly.com/news/business/ftc-to-step-up-investigation-into-anthropic-and-openai-2026-10/", "summary": "<p>The US FTC has prioritised an earlier investigation into harm caused by Anthropic and OpenAI models following reports of escaping rogue agents. “I think it’s very important that we not [&#8230;]<\/p>\n<p>The post <a href=\"https://www.electronicsweekly.com/news/business/ftc-to-step-up-investigation-into-anthropic-and-openai-2026-10/\">FTC to accelerate investigation into Anthropic and OpenAI<\/a> appeared first on <a href=\"https://www.electronicsweekly.com\">Electronics Weekly<\/a>.<\/p>"}, {"title": "Micron has $54bn revenue quarter", "source": "Electronics Weekly", "date": "2026-10-01", "url": "https://www.electronicsweekly.com/news/business/micron-has-54bn-revenue-quarter-2026-10/", "summary": "<p>Micron had revenue of $54.23 billion for calendar Q3 (Micron’s fiscal Q4) versus $41.46 billion for the prior quarter and $11.32 billion for the same period last year. Net profit [&#8230;]<\/p>\n<p>The post <a href=\"https://www.electronicsweekly.com/news/business/micron-has-54bn-revenue-quarter-2026-10/\">Micron has $54bn revenue quarter<\/a> appeared first on <a href=\"https://www.electronicsweekly.com\">Electronics Weekly<\/a>.<\/p>"}, {"title": "Iceye, Nokia partner for sovereign LEO satellite comms", "source": "Electronics Weekly", "date": "2026-10-01", "url": "https://www.electronicsweekly.com/news/business/iceye-nokia-partner-for-sovereign-leo-satellite-comms-2026-10/", "summary": "<p>Iceye, the specialist in satellite-based SAR imagery, is partnering with Nokia to develop secure, high-performance broadband low Earth orbit (LEO) satellite communications systems for governments. Sovereign is th with an idea for a wearable last week and I&#8217;m really excited about it, but I have zero experience with electronics. In the past it would have taken me months to find and [&#8230;]"}, {"title": "Heltec V4 Meshtastic LoRa GPS Rugged Case #3DThursday #3DPrinting", "source": "Adafruit", "date": "2026-10-01", "url": "https://blog.adafruit.com/2026/10/01/heltec-v4-meshtastic-lora-gps-rugged-case-3dthursday-3dprinting/", "summary": "Alex_B_4854992 shares: The original case design that started it all for the Heltec V4 LoRa board. Rugged form factor with room for 2× 18650 cells and integrated 1S 9A BMS. Assembly: 6× M3 heat-set inserts, 1× 2.9mm light pipe, 10× M3×6 hex socket head screws, 2× M3×10 countersunk screws, 1× slide switch. Print front and [&#8230;]"}, {"title": "sensiBel’s 32 MEMS Microphone Array Development Kit Accelerates Edge AI Acoustic Detection", "source": "EE Journal", "date": "2026-10-01", "url": "https://www.eejournal.com/industry_news/sensibels-32-mems-microphone-array-development-kit-accelerates-edge-ai-acoustic-detection/", "summary": "sensiBel, the leader in optical MEMS sensing, today launched NOVA32™, a complete acoustic-detection hardware kit that speeds the design to deployment of high-precision physical AI sensor solutions used in beamforming applications, such as drone detection, industrial predictive maintenance, and environmental noise mapping. NOVA32 is a plug-and-play hardware kit that aggregates 32 high-performance optical MEMS microphones &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/sensibels-32-mems-microphone-array-development-kit-accelerates-edge-ai-acoustic-detection/\">Read More &#8594;<span class=\"screen-reader-text\"> \"sensiBel’s 32 MEMS Microphone Array Development Kit Accelerates Edge AI Acoustic Detection\"<\/span><\/a>"}, {"title": "Gigaphoton Develops Gas Recycling System for ArF Excimer Lasers", "source": "EE Journal", "date": "2026-10-01", "url": "https://www.eejournal.com/industry_news/gigaphoton-develops-gas-recycling-system-for-arf-excimer-lasers/", "summary": "Gigaphoton Inc. (Head Office: Oyama, Tochigi; President and CEO: Tatsuo Enami), a manufacturer of lightsources for semiconductor lithography, announced that it developed hTGM for ArF, the on-site neon gas recycling system for ArF excimer lasers. ArF lithography plays a critical role in the mass production of advanced semiconductors. Stable laser operation and the effective use &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/gigaphoton-develops-gas-recycling-system-for-arf-excimer-lasers/\">Read More &#8594;<span class=\"screen-reader-text\"> \"Gigaphoton Develops Gas Recycling System for ArF Excimer Lasers\"<\/span><\/a>"}, {"title": "Harnessing AI (and Humans)", "source": "EE Journal", "date": "2026-10-01", "url": "https://www.eejournal.com/article/harnessing-ai-and-humans/", "summary": "<img alt=\"\" class=\"webfeedsFeaturedVisual wp-post-image\" height=\"300\" src=\"https://www.eejournal.com/wp-content/uploads/2026/09/max-0523-image-for-home-page-innostax-300x300.jpg\" style=\"display: block; margin-bottom: 5px; clear: both;\" width=\"300\" />I don’t know about you, but I’m starting to feel like I need to run twice as fast just to keep up with everything that’s happening in AI space (where no one can hear you scream). No sooner do I wrap my brain around one concept than someone ambles into my life and introduces me &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/article/harnessing-ai-and-humans/\">Read More &#8594;<span class=\"screen-reader-text\"> \"Harnessing AI (and Humans)\"<\/span><\/a>"}, {"title": "Pogo-Bot Goes All Terrain With Compliant Foot", "source": "Hackaday", "date": "2026-09-30", "url": "https://hackaday.com/2026/09/30/pogo-bot-goes-all-terrain-with-compliant-foot/", "summary": "<div><img alt=\"The pogo-quadcopter on ice\" class=\"attachment-large size-large wp-post-image\" height=\"450\" src=\"https://hackaday.com/wp-content/uploads/2026/09/pogo-quadcopter-feat.jpg?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>What do you get when you combine a pogo stick, a quadcopter, and engineering students from the University of Toronto? This thing, apparently&#8211; a &#8220;monopedal hopping robot&#8221; that uses a <a class=\"read-more\" href=\"https://hackaday.com/2026/09/30/pogo-bot-goes-all-terrain-with-compliant-foot/\">&#8230;read more<\/a>"}, {"title": "Open Source Tricorder Is In It For The Science", "source": "Hackaday", "date": "2026-09-30", "url": "https://hackaday.com/2026/09/30/open-source-tricorder-is-in-it-for-the-science/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"450\" src=\"https://hackaday.com/wp-content/uploads/2026/09/OSS_cyberdeck_main_body_and_back_cover.png?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>If you&#8217;re reading Hackaday there&#8217;s pretty good odds you&#8217;re at least somewhat fond of Star Trek. We&#8217;d bet good money most of you would quit your jobs today if a Starfleet <a class=\"read-more\" href=\"https://hackaday.com/2026/09/30/open-source-tricorder-is-in-it-for-the-science/\">&#8230;read more<\/a>"}, {"title": "OpenArm 2.0 – An open-source 7-DOF robot arm with QDD joints, bilateral force feedback, in-hand camera", "source": "CNX Software", "date": "2026-09-30", "url": "https://www.cnx-software.com/2026/09/30/openarm-2-0-an-open-source-7-dof-robot-arm-with-qdd-joints-bilateral-force-feedback-in-hand-camera/", "summary": "<div><img alt=\"OpenArm 2.0 arms installed inside the OpenArm Cell for standardized evaluation\" class=\"attachment-medium size-medium wp-post-image\" height=\"524\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/09/OpenArm-2.0-arms-installed-inside-the-OpenArm-Cell-for-standardized-evaluation-720x524.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Tokyo-based Enactic OpenArm 2.0 is an open-source hardware 7-DOF robot arm designed for physical AI research, teleoperation, and contact-rich data collection. It uses quasi-direct-drive (QDD) backdrivable joints to support compliant motion and bilateral force-feedback control. The arm supports 4.1 kg nominal and 6 kg peak payload, features 1 kHz CAN-FD control, and a compact parallel gripper with an in-hand camera and replaceable fingers. It supports bilateral force-feedback teleoperation, gravity compensation, and compliant interaction, with an aluminum and stainless-steel structure and MISUMI-frame base. The ecosystem also includes the OpenArm Cell for standardized evaluation and OpenArm KER, a motorless replica for teleoperation and data collection. Open-source CAD, BOM, firmware, control software, ROS 2, MuJoCo, Isaac Lab, and dataset tools support applications such as imitation learning, reinforcement learning, sim-to-real, and robotic manipulation. OpenArm 2.0 specifications: Communication CAN-FD (recommended): nominal 1 Mbps, data 5 Mbps, control loop 1 kHz Classic CAN 2.0 fallback @ [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/09/30/openarm-2-0-an-open-source-7-dof-robot-arm-with-qdd-joints-bilateral-force-feedback-in-hand-camera/\">OpenArm 2.0 &#8211; An open-source 7-DOF robot arm with QDD joints, bilateral force feedback, in-hand camera <\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "ESP32-C5 devkit features 3.5-inch touch LCD, optional camera and battery", "source": "CNX Software", "date": "2026-09-30", "url": "https://www.cnx-software.com/2026/09/30/esp32-c5-devkit-features-3-5-inch-touch-lcd-optional-camera-and-battery/", "summary": "<div><img alt=\"Waveshare ESP32-C5-Touch-LCD-3.5\" class=\"attachment-medium size-medium wp-post-image\" height=\"512\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/09/Waveshare-ESP32-C5-Touch-LCD-3.5-720x512.jpg\" style=\"margin-bottom: 10px
