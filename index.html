 Adafruit.com/NEW. Want to get new products info beamed straight into your inbox? New nEw NEWs From Adafruit is an email newsletter sent once a week to subscribers only. It features [&#8230;]"}, {"title": "NOAA’s 2026-2027 U.S. Winter Outlook – El Niño Looms Large", "source": "Adafruit", "date": "2026-10-17", "url": "https://blog.adafruit.com/2026/10/17/noaas-2026-2027-u-s-winter-outlook-el-nino-looms-large/", "summary": "The 2026-2027 U.S. Winter Outlook map for precipitation shows wetter-than-average conditions are most likely across the Southwest, South and East Coast. Drier-than-average conditions are forecast for parts of the northern Rockies and Great Lakes, and central Alaska. (Image credit: NOAA) &#160; A wet warm winter is in store for much of the country. A predicted [&#8230;]"}, {"title": "Nokia 3310 Upgraded with A Custom PCB", "source": "Adafruit", "date": "2026-10-17", "url": "https://blog.adafruit.com/2026/10/17/nokia-3310-upgraded-with-a-custom-pcb/", "summary": "Hoani Bryson got first place in a Nokia 3310 Jam for the entry Trick Shot II. To create the game Hoani built custom hardware with a Pi based PCB and tore apart a Nokia 3310, not an easy feat. The Jam’s goals were to make a game as if it were being made for the [&#8230;]"}, {"title": "15% off our Halloween Gift Guide", "source": "Adafruit", "date": "2026-10-17", "url": "https://blog.adafruit.com/2026/10/17/15-off-our-halloween-gift-guide/", "summary": "The time crunch starts now! Squeeze in a last minute build and add the code BeGood15 to your cart for 15% off items featured in our Halloween gift guide from Saturday, October 17th – Sunday, October 25th at 11:59 PM EDT. Some restrictions apply. This code is only applicable to items featured in our Halloween [&#8230;]"}, {"title": "Xerxes Pi 2026 and Xerxes Nano carrier boards offer NVMe, PoE, and OCuLink for Raspberry Pi and Jetson modules (Crowdfunding)", "source": "CNX Software", "date": "2026-10-16", "url": "https://www.cnx-software.com/2026/10/16/xerxes-pi-2026-and-xerxes-nano-carrier-boards-offer-nvme-poe-and-oculink-for-raspberry-pi-and-jetson-modules/", "summary": "<div><img alt=\"Xerxes Pi 2026\" class=\"attachment-medium size-medium wp-post-image\" height=\"480\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/10/Xerxes-Pi-2026-720x480.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>After a successful campaign for Xerxes Pi back in 2025, Rapid Analysis has returned with a Xerxes Home Lab ecosystem that includes the Xerxes Pi 2026 and Xerxes Nano carrier board. The upgrade includes M.2 NVMe storage support on the bottom of the board, an I2S Qwiic connector for digital audio, and added debug and boot jumper pins for easier headless deployment. Designed for home labs, edge AI developers, and small businesses, the Xerxes Pi 2026 supports Raspberry Pi CM4/CM5 and other CM modules, Gigabit Ethernet, optional PoE+, and CSI/HDMI expansion. The larger Xerxes Nano supports NVIDIA Jetson Orin Nano and Turing RK1 modules, adding M.2 PCIe, OCuLink, and SPI/UART connectivity. Both boards support active cooling and compact 1U rack installations. Xerxes Pi 2026 Xerxes Pi 2026 specifications: Supported SoMs – Raspberry Pi CM4, CM5, and compatible alternatives via 2x 100-pin high-density mezzanine connectors Storage M.2 M-key PCIe Gen 2 [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/10/16/xerxes-pi-2026-and-xerxes-nano-carrier-boards-offer-nvme-poe-and-oculink-for-raspberry-pi-and-jetson-modules/\">Xerxes Pi 2026 and Xerxes Nano carrier boards offer NVMe, PoE, and OCuLink for Raspberry Pi and Jetson modules (Crowdfunding)<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Edge AI for Real-Time Systems, the Edge Computing Energy Problem, PCIe 6.0 High-Radix Switches: Embedded Week Insights", "source": "Embedded.com", "date": "2026-10-16", "url": "https://www.embedded.com/edge-ai-for-real-time-systems-the-edge-computing-energy-problem-pcie-6-0-high-radix-switches-embedded-week-insights/", "summary": "<p>Here's a roundup of this week's must-read articles. We cover the latest developments on designing edge AI for real-time systems, solving the edge computing energy problem, PCIe 6.0 high-radix switches for AI data centers, and more. Also, check News Archives - Embedded and Technical Articles Archives - Embedded for the complete list of news and articles from our website. [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/edge-ai-for-real-time-systems-the-edge-computing-energy-problem-pcie-6-0-high-radix-switches-embedded-week-insights/\">Edge AI for Real-Time Systems, the Edge Computing Energy Problem, PCIe 6.0 High-Radix Switches: Embedded Week Insights<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "Elektrobit and Microchip Simplify AUTOSAR Integration", "source": "Embedded.com", "date": "2026-10-16", "url": "https://www.embedded.com/elektrobit-and-microchip-simplify-autosar-integration/", "summary": "<p>Elektrobit and Microchip Technology have announced a collaboration to simplify AUTOSAR-based software development for automotive manufacturers and Tier 1 suppliers using Microchip's automotive processor platforms. The initiative combines Elektrobit's automotive software, development tools, and automation capabilities with Microchip's hardware to reduce integration effort, mitigate development risks, and accelerate time to market for software-defined vehicles. As [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/elektrobit-and-microchip-simplify-autosar-integration/\">Elektrobit and Microchip Simplify AUTOSAR Integration<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "Microchip POL-05-20S is radiation-tolerant GaN point-of-load converter", "source": "Electronics Weekly", "date": "2026-10-16", "url": "https://www.electronicsweekly.com/news/products/ tive-analogue-2026-10/\">Anglia addresses alternative analogue<\/a> appeared first on <a href=\"https://www.electronicsweekly.com\">Electronics Weekly<\/a>.<\/p>"}, {"title": "IonQ and Cavendish Lab open Quantum Innovation Centre", "source": "Electronics Weekly", "date": "2026-10-16", "url": "https://www.electronicsweekly.com/news/business/ionq-and-cavendish-lab-open-quantum-innovation-centre-2026-10/", "summary": "<p>IonQ, the Maryland manufacturer of general purpose quantum computers based on trapped ion technology, and Cambridge University’s Cavendish Lab have opened the IonQ Quantum Innovation Centre at the Ray Dolby [&#8230;]<\/p>\n<p>The post <a href=\"https://www.electronicsweekly.com/news/business/ionq-and-cavendish-lab-open-quantum-innovation-centre-2026-10/\">IonQ and Cavendish Lab open Quantum Innovation Centre<\/a> appeared first on <a href=\"https://www.electronicsweekly.com\">Electronics Weekly<\/a>.<\/p>"}, {"title": "Infineon and Wolfspeed hook up on SiC wafers", "source": "Electronics Weekly", "date": "2026-10-16", "url": "https://www.electronicsweekly.com/news/business/infineon-and-wolfspeed-hook-up-on-sic-wafers-uh-2026-10/", "summary": "<p>Infineon and Wolfspeed have signed a new multi-year supply agreement for 200mm SiC wafers to take over from 150 mm wafers “Silicon carbide is at the heart of the energy [&#8230;]<\/p>\n<p>The post <a href=\"https://www.electronicsweekly.com/news/business/infineon-and-wolfspeed-hook-up-on-sic-wafers-uh-2026-10/\">Infineon and Wolfspeed hook up on SiC wafers<\/a> appeared first on <a href=\"https://www.electronicsweekly.com\">Electronics Weekly<\/a>.<\/p>"}, {"title": "STM32F407 RT-Spark Music Player Using FreeRTOS", "source": "Adafruit", "date": "2026-10-16", "url": "https://blog.adafruit.com/2026/10/16/stm32f407-rt-spark-music-player-using-freertos/", "summary": "John Paul Maluya, Karl Vincent Remo, and Amer Patrick Lauma built an eight-song music player built on the STM32F407 RT-Spark board. Check out the details of their project on hackster.io This project was developed for BCA182 Embedded Systems Programming Laboratory 2 using the RT-Thread RT-Spark development board with an STM32F407 microcontroller. The objective was to [&#8230;]"}, {"title": "John Park’s CircuitPython Parsec: STEMMA QT Port GPIO Pins", "source": "Adafruit", "date": "2026-10-16", "url": "https://blog.adafruit.com/2026/10/16/john-parks-circuitpython-parsec-stemma-qt-port-gpio-pins/", "summary": "#circuitpythonparsec Use the STEMMA QT port on your board as a plug-and-play set of GPIO pins plus power and ground! Also, bonus code to ask the board for pin name aliases. Try out the code example To learn about CircuitPython: https://circuitpython.org &#160;"}, {"title": "Budgeting RAM for your Raspberry Pi Project #piday #raspberrypi", "source": "Adafruit", "date": "2026-10-16", "url": "https://blog.adafruit.com/2026/10/16/budgeting-ram-for-your-raspberry-pi-project-piday-raspberrypi/", "summary": "RAM is expensive. There was a time when makers would default to the beefiest Pi for nearly any project. A little extra RAM couldn&#8217;t hurt, right? Well, these days, a little extra RAM can hurt your wallet. Calvin Wankhede at Engadget goes over how much RAM you actually need and why, most often, the 1 [&#8230;]"}, {"title": "Get Ready for Electronic Halloween with nOOds", "source": "Adafruit", "date": "2026-10-16", "url": "https://blog.adafruit.com/2026/10/16/get-ready-for-electronic-halloween-with-noods/", "summary": "&#160; To put it simply, we LOVE nOOds! Our flexible LEDs come in different lengths and color and are perfect when you want lighting that&#8217;s got pizzazz. They&#8217;re made of dozens of micro LED diodes that are bonded together on an ultra-flexible metal backing, then coated in colorful silicone for protection. And because they&#8217;re just [&#8230;]"}, {"title": "Zigbee vs. Matter over Thread: understanding IoT protocol performance in practice", "source": "Adafruit", "date": "2026-10-16", "url": "https://blog.adafruit.com/2026/10/16/zigbee-vs-matter-over-thread-understanding-iot-protocol-performance-in-practice/", "summary": "A paper posted to arXiv compares two low power mesh protocols used in smart home gear: Zigbee and Matter over Thread. Both run on 802.15.4 radios, both build mesh networks, and both show up in products from the same vendors. The question the paper takes on is how they actually behave once they are deployed, [&#8230;]"}, {"title": "Microsoft is embracing the tidal wave of AI-decompiled games by announcing a lab for them", "source": "Adafruit", "date": "2026-10-16", "url": "https://blog.adafruit.com/2026/10/16/microsoft-is-embracing-the-tidal-wave-of-ai-decompiled-games-by-announcing-a-lab-for-them/", "summary": "Simon Batt, writing at XDA Developers, reports that Microsoft has responded to the wave of AI-assisted game decompilations with a new group of its own. Recent examples include Super Smash Bros. Melee being decompiled and made to run natively on PC, Android, and Linux. Xbox CEO Asha Sharma announced Xbox Labs on the company&#8217;s official [&#8230;]"}, {"title": "The Python on Microcontrollers Newsletter: subscribe for free", "source": "Adafruit", "date": "2026-10-16", "url": "https://blog.adafruit.com/2026/10/16/the-python-on-microcontrollers-newsletter-subscribe-for-free-10-15-2/", "summary": "The Python for Microcontrollers Newsletter is the place for the latest news involving Python on hardware (microcontrollers AND single board computers like Raspberry Pi). This ad-free, spam-free weekly email is filled with CircuitPython, MicroPython, and Python information that you may have missed, all in one place! You get a summary of all the software, events, projects, and the latest hardware worldwide once a week, no [&#8230;]"}, {"title": "Agentic AI and RF Digital Twins: 6G Redesigned in Real Time", "source": "EE Journal", "date": "2026-10-16", "url": "https://www.eejournal.com/fish_fry/agentic-ai-and-rf-digital-twins-6g-redesigned-in-real-time/", "summary": "<img alt=\"\" class=\"webfeedsFeaturedVisual wp-post-image\" height=\"300\" src=\"https://www.eejournal.com/wp-content/uploads/2026/10/AI-6G-Holographic-Connectivity-300x300.png\" style=\"display: block; margin-bottom: 5px; clear: both;\" width=\"300\" />In this week’s podcast, we’re looking at the future of wireless engineering, and how agentic AI, digital twins, and 6G networks are coming together to change how we design, simulate, and operate connected systems. My guest is Houman Zarrinkoub, Principal Product Manager of Wireless Communications at MathWorks. Houman and I explore why RF digital twins [&#8230;]"}, {"title": "W1700K SDR turns a Wi-Fi 7 router into a 320 MSps software-defined radio receiver", "source": "CNX Software", "date": "2026-10-15", "url": "https://www.cnx-software.com/2026/10/16/w1700k-sdr-turns-a-wi-fi-7-router-into-a-320-msps-software-defined-radio-receiver/", "summary": "<div><img alt=\"Full 2.4 GHz spectrum view with flattened passband correction applied\" class=\"attachment-medium size-medium wp-post-image\" height=\"480\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/10/Full-2.4-GHz-spectrum-view-with-flattened-passband-correction-applied-720x480.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Just a few days ago, we wrote about the ESP-SDR project, which turned an ESP32 into an SDR receiver (and now SDR transmitter), but the data was streamed over UART, which couldn&#8217;t keep up with the sample rate. Now, developer h0m3us3r has released w1700k-sdr, also an open-source project that turns a Gemtek W1700K Wi-Fi 7 router into a wideband SDR receiver. The project uses the router&#8217;s built-in MediaTek MT7996 radio to capture raw 14-bit I/Q samples at up to 320 MSps across the 2.4 GHz, 5 GHz, and 6 GHz bands. The captured data is then streamed over a 10 GbE connection using the router&#8217;s Airoha AN7581 SoC to a Linux computer, where you can view the live spectrum and waterfall in a browser. To make this work, the project replaces the router&#8217;s stock firmware with a custom Linux system and radio firmware, allowing it to capture raw I/Q data [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/10/16/w1700k-sdr-turns-a-wi-fi-7-router-into-a-320-msps-software-defined-radio-receiver/\">W1700K SDR turns a Wi-Fi 7 router into a 320 MSps software-defined radio receiver<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "HPMicro HPM5100 RISC-V MCU integrates four 16-bit ADCs, four op-amps for analog sensing and motor control", "source": "CNX Software", "date": "2026-10-15", "url": "https://www.cnx-software.com/2026/10/15/hpmicro-hpm5100-risc-v-mcu-integrates-four-16-bit-adcs-four-op-amps-for-analog-sensing-and-motor-control/", "summary": "<div><img alt=\"HPM5100 series\" class=\"attachment-medium size-medium wp-post-image\" height=\"480\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/10/HPM5100-series-720x480.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>HPMicro has introduced the HPM5100 series, a family of 32-bit RISC-V mixed-signal MCUs, starting with the HPM5151 parts. It features a 400 MHz RISC-V processor, 416 KB SRAM, 1 MB flash, four 16-bit ADCs, four operational amplifiers, and four analog comparators. It also includes a high-speed USB 2.0 OTG interface with an integrated PHY, CAN FD, multiple UART/SPI/I2C interfaces, and 32 PWM channels for motor control. The chip supports hardware floating-point operations and DSP instructions, while the integrated analog peripherals reduce the need for external ADCs and signal-conditioning circuits. HPMicro HPM5100 specifications: MCU core – Single-core 32-bit RISC-V processor @ 400 MHz (up to 480 MHz in high-performance mode with external power supply) Hardware FPU, SIMD, and DSP instruction support 16 KB L1 instruction cache and 16 KB L1 data cache Up to 3.57 CoreMark/MHz Memory 416 KB SRAM 256 KB instruction local memory (ILM) 128 KB data local memory [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/10/15/hpmicro-hpm5100-risc-v-mcu-integrates-four-16-bit-adcs-four-op-amps-for-analog-sensing-and-motor-control/\">HPMicro HPM5100 RISC-V MCU integrates four 16-bit ADCs, four op-amps for analog sensing and motor control<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "From Spooky Action to Quantum Internet: Communication Takes to the Air", "source": "Embedded.com", "date": "2026-10-15", "url": "https://www.embedded.com/from-spooky-action-to-quantum-internet-communication-takes-to-the-air/", "summary": "<p>Researchers demonstrate a 13-mile free-space quantum link across Long Island Sound.<\/p>\n<p>The post <a href=\"https://www.embedded.com/from-spooky-action-to-quantum-internet-communication-takes-to-the-air/\">From Spooky Action to Quantum Internet: Communication Takes to the Air<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "Solving the Edge Computing Energy Problem", "source": "Embedded.com", "date": "2026-10-15", "url": "https://www.embedded.com/solving-the-edge-computing-energy-problem/", "summary": "<p>With edge AI, the inference has moved from the cloud to the embedded device. Cameras, wearables, industrial sensors, robots, and vehicles can run trained models, making predictions or decisions on new and uncertain data. Because these devices are often powered by small batteries, an energy issue arises. Engineers developing embedded systems at the edge face [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/solving-the-edge-computing-energy-problem/\">Solving the Edge Computing Energy Problem<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "Testblox Launches Small Form Factor Multi-Vendor Platform for In-Fixture Functional Test", "source": "EE Journal", "date": "2026-10-15", "url": "https://www.eejournal.com/industry_news/testblox-launches-small-form-factor-multi-vendor-platform-for-in-fixture-functional-test/", "summary": "Testblox AB, a new test &#38; measurement company that focuses on reducing the size, complexity, and cost of functional test, today launched a new, multi-vendor platform for automated test.  Nearly 40 commercial-off-the-shelf (COTS) modules are available at launch, covering measurement, switching, power, communications, and I/O. The modules share a compact, playing-card-sized form factor, common interfaces, [&#8230;]"}, {"title": "VON ARDENNE Addresses Semiconductor Panel-Level Packaging Market with New HiPIMS Deposition Solution", "source": "EE Journal", "date": "2026-10-15", "url": "https://www.eejournal.com/industry_news/von-ardenne-addresses-semiconductor-panel-level-packaging-market-with-new-hipims-deposition-solution/", "summary": "VON ARDENNE, a global leader in high-precision vacuum coating equipment and co-developed materials solutions, today announced that it is expanding its semiconductor deposition portfolio into panel-level packaging (PLP). The HiPIMS solution deposits high-aspect-ratio barrier and seed layers in through-glass via (TGV) holes, enabling dense, highly adherent functional film deposition with improved material performance. It leverages [&#8230;]"}, {"title": "SAXON Q Shows That Room-Temperature Quantum Computers Can Rival the Performance of Superconducting Processors", "source": "EE Journal", "date": "2026-10-15", "url": "https://www.eejournal.com/industry_news/saxon-q-shows-that-room-temperature-quantum-computers-can-rival-the-performance-of-superconducting-processors/", "summary": "SAXON Q, a leader in NV-center quantum computing, today released a paper showing that its room-temperature diamond-based system can perform on par with superconducting quantum computers cooled to near absolute zero. Running Grover’s search algorithm, a standard benchmark test for quantum performance, a SAXON Q system identified a single target state 77.3% of the time [&#8230;]"}, {"title": "Siemens transforms computational lithography for next-generation AI semiconductors with NVIDIA cuLitho", "source": "EE Journal", "date": "2026-10-15", "url": "https://www.eejournal.com/industry_news/siemens-transforms-computational-lithography-for-next-generation-ai-semiconductors-with-nvidia-culitho/", "summary": "Collaboration between Siemens and NVIDIA delivers up to 12x acceleration for full-chip optical proximity correction (OPC) workloads in lithography Enables practical full-chip optimization of photomasks for High Numerical Aperture Extreme Ultraviolet EUV lithography (High-NA EUV) lithography using the most advanced computational lithographic methods, including inverse lithography technology (ILT) Addresses the critical runtime and complexity challenges [&#8230;]"}, {"title": "TASKING Brings Certifiable Agentic AI to Embedded Debugging Analysis with winIDEA AI Kit", "source": "EE Journal", "date": "2026-10-15", "url": "https://www.eejournal.com/industry_news/tasking-brings-certifiable-agentic-ai-to-embedded-debugging-analysis-with-winidea-ai-kit/", "summary": "TASKING, a global leader in high-performance embedded software development tools, has launched the winIDEA AI Kit. This set of tools and files allows artificial intelligent (AI) agents to integrate with TASKING’s unified toolchain through the winIDEA development environment. Accessibility to AI agents within the development toolchain enables developers to automate multiple development workflows, accelerating software [&#8230;]"}, {"title": "No Engineer Is an Island (The Butterfly Effect: Engineering Edition)", "source": "EE Journal", "date": "2026-10-15", "url": "https://www.eejournal.com/article/no-engineer-is-an-island-the-butterfly-effect-engineering-edition/", "summary": "<img alt=\"\" class=\"webfeedsFeaturedVisual wp-post-image\" height=\"150\" src=\"https://www.eejournal.com/wp-content/uploads/2026/10/max-0527-image-for-home-page-e3-designers-300x150.jpg\" style=\"display: block; margin-bottom: 5px; clear: both;\" width=\"300\" />I often hear (or read) someone saying something that really strikes a chord, like the lyric “I wish I didn’t know now what I didn’t know then” from Toby Keith’s 1994 single Wish I Didn’t Know Now. Some of these turns of phrase, memorable observations, and pearls of wisdom really stick with me, often leaving [&#8230;]"}, {"title": "Orange Pi O1 SBC features 16 TOPS SOPHGO BM1688 AI SoC, supports 4G/5G cellular connectivity", "source": "CNX Software", "date": "2026-10-14", "url": "https://www.cnx-software.com/2026/10/15/orange-pi-o1-sbc-features-16-tops-sophgo-bm1688-ai-soc-supports-4g-5g-cellular-connectivity/", "summary": "<div><img alt=\"Orange Pi O1\" class=\"attachment-medium size-medium wp-post-image\" height=\"511\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/10/Orange-Pi-O1-720x511.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Orange Pi O1 is a new single board computer (SBC) based on the somewhat older SOPHGO BM1688 octa-core Cortex-A53 SoC with a built-in 16 TOPS AI accelerator/TPU, and support for decoding up to sixteen 1080p30 video streams, or encoding ten. The board comes with 8GB or 16GB memory, supports M.2 NVMe, eMMC module, SPI flash, SATA III, or microSD card storage, and offers HDMI and MIPI DSI display interfaces, two MIPI CSI camera connectors, dual GbE, WiFi 6E, Bluetooth 5.3, and optional 4G/5G cellular connectivity,  as well as a few USB ports, audio interfaces, and a 26-pin GPIO header for expansion. Orange Pi O1 specifications: SoC &#8211; SOPHGO BM1688 CPU 8-core Arm Cortex-A53 processor @ 1.65 GHz RISC-V C906 co-processor @ 1.2 GHz TPU &#8211; SOPHGO Neural Network Acceleration Engine (TPU), delivering 16 TOPS @ INT8 VPU Video decoding &#8211; H.264 &#38; H.265 up to 16 channels at 1080p30 Video [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/10/15/orange-pi-o1-sbc-features-16-tops-sophgo-bm1688-ai-soc-supports-4g-5g-cellular-connectivity/\">Orange Pi O1 SBC features 16 TOPS SOPHGO BM1688 AI SoC, supports 4G/5G cellular connectivity<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Romu – A Tiny Raspberry Pi RP2354A board for USB application development (Crowdfunding)", "source": "CNX Software", "date": "2026-10-14", "url": "https://www.cnx-software.com/2026/10/14/romu-tiny-raspberry-pi-rp2354a-usb-board/", "summary": "<div><img alt=\"Romu board vs dollar coin\" class=\"attachment-medium size-medium wp-post-image\" height=\"405\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/10/Romu-board-vs-dollar-coin-720x405.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Bitmerse Romu is a tiny (15.5 x 12 mm), almost minimal Raspberry Pi RP2354A USB board with a USB 2.0 interface on one side of the PCB, and the dual Cortex-M33/RISC-V MCU on the other side, connected to a few debugging/programming pads, buttons, and an RGB LED. It doesn&#8217;t come with any GPIO, and it&#8217;s mostly designed for USB applications such as a security key for passwordless login, a USB MIDI controller, a macro pad, or a custom HID device. You can plug it directly into a spare USB Type-A port of your computer/host without any cables, breadboard, or adapters required. Romu specifications: SoC – Raspberry Pi RP2354A CPU Dual-core Arm Cortex-M33 @ 150 MHz with Arm Trustzone, Secure boot Dual-core 32-bit RISC-V Hazard3 @ 150 MHz (3-stage in-order pipeline; RV32IMAC with Zba, Zbb, Zbs, Zbkb, Zcb, Zcmp, and Zicsr extensions) Up to two cores can be used at a time, either 2x [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/10/14/romu-tiny-raspberry-pi-rp2354a-usb-board/\">Romu &#8211; A Tiny Raspberry Pi RP2354A board for USB application development (Crowdfunding)<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "VIEWE launches 4.3-inch ESP32-S31 display development board", "source": "CNX Software", "date": "2026-10-14", "url": "https://www.cnx-software.com/2026/10/14/viewe-4-3-inch-esp32-s31-display-development-board/", "summary": "<div><img alt=\"VIEWE 4.3 inch ESP32 S31 smart display with a music player interface\" class=\"attachment-medium size-medium wp-post-image\" height=\"480\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/10/VIEWE-4.3-inch-ESP32-S31-smart-display-with-a-music-player-interface-720x480.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>VIEWE has introduced the PLCM-UES31S043H800V480C-U, a 4.3-inch smart display module that appears to be the first third-party development board powered by the new ESP32-S31 MCU. The board includes a 4.3-inch display with 2.4 GHz Wi-Fi 6, Bluetooth 5.4 LE and Classic, and IEEE 802.15.4 for Zigbee and Thread. It also features USB-C and USB-A ports, a microSD card slot, RS485 and CAN interfaces, and a 20-pin GPIO expansion header with UART and I2C. The board also includes an ES8389 audio codec, two NS4150B amplifiers, two onboard microphones, four ADC buttons, a WS2812B RGB LED, and BOOT/RESET buttons. It operates on a 5V power supply and supports an operating temperature range of -20°C to +70°C. VIEWE PLCM-UES31S043H800V480C-U Specifications: Wireless module – ESP32-S31-WROOM-3-N16R16V SoC – ESP32-S31NRV16 CPU RISC-V HP (High-performance) RV32IMAFCP CPU @ 320 MHz with FPU, SIMD, etc. RISC-V LP (Low-power) MCU core Memory – 512 KB SRAM, 32 KB low-power SRAM, [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/10/14/viewe-4-3-inch-esp32-s31-display-development-board/\">VIEWE launches 4.3-inch ESP32-S31 display development board<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Microchip Unveils PCIe Gen 6 and NVMe Devices for Data Centers", "source": "Embedded.com", "date": "2026-10-14", "url": "https://www.embedded.com/microchip-unveils-pcie-gen-6-and-nvme-devices-for-data-centers/", "summary": "<p>Microchip Technology Inc. has expanded its data center portfolio with new connectivity, storage, and acceleration capabilities designed to meet the performance, security, and scalability needs of AI infrastructure. The additions include PCIe Gen 6 switching, enhanced PCIe Gen 5 NVMe SSD controllers, and updates to the Adaptec SmartRAID 4300 family of NVMe RAID storage accelerators, [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/microchip-unveils-pcie-gen-6-and-nvme-devices-for-data-centers/\">Microchip Unveils PCIe Gen 6 and NVMe Devices for Data Centers<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "Axiado, Arm Integrate AI Security into AGI CPU Servers", "source": "Embedded.com", "date": "2026-10-14", "url": "https://www.embedded.com/axiado-arm-integrate-ai-security-into-agi-cpu-servers/", "summary": "<p>Axiado Corporation has announced a collaboration with Arm to integrate its Data Center Secure Control Module (DC-SCM) cards into the Arm AGI CPU server platform. The integration combines hardware-anchored security, intelligent platform management, and AI-assisted monitoring to address the operational and security requirements of next-generation data centers designed for agentic AI workloads. The companies are [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/axiado-arm-integrate-ai-security-into-agi-cpu-servers/\">Axiado, Arm Integrate AI Security into AGI CPU Servers<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "RECOM and CELUS Partner to Bring RECOM Power Designs to the CELUS Design Platform", "source": "EE Journal", "date": "2026-10-14", "url": "https://www.eejournal.com/industry_news/recom-and-celus-partner-to-bring-recom-power-designs-to-the-celus-design-platform/", "summary": "RECOM Power, the Austrian designer and manufacturer of power conversion solutions, and CELUS, an industry leader in cloud-based electronics design automation, today announced a partnership that brings a first set of RECOM power designs to the CELUS Design Platform. Under the partnership, these designs are represented as reusable, application-ready design content within CELUS. Engineers can evaluate [&#8230;]"}, {"title": "TDK introduces new dual-die, stray-field robust motor position sensor for ASIL D fail operational applications", "source": "EE Journal", "date": "2026-10-14", "url": "https://www.eejournal.com/industry_news/tdk-introduces-new-dual-die-stray-field-robust-motor-position-sensor-for-asil-d-fail-operational-applications/", "summary": "&#8211;  Full redundancy through two independent dies stacked in a compact QFN24 4×4 mm² package &#8211;  ASIL D ready as a Safety Element out of Context (SEooC), with integrated diagnostics and independent fault detection for each die &#8211;  Stray-field compensation per ISO 11452-8:2015 via an array of six horizontal Hall plates per die &#8211;  High-speed analog [&#8230;]"}, {"title": "Siemens’ Tessent ecosystem enables direct test pattern execution via PCIe and USB", "source": "EE Journal", "date": "2026-10-14", "url": "https://www.eejournal.com/industry_news/siemens-tessent-ecosystem-enables-direct-test-pattern-execution-via-pcie-and-usb/", "summary": "New Tessent Silicon Executable (TSE) software seamlessly delivers test data from the test equipment ecosystem to the Tessent In-System Test on-chip hardware Enables consistent test application across automated test equipment, system-level test, bench, and in-system environments Empowers new functional capability and ease of use in production test and device debug Siemens today announced Tessent™ Silicon [&#8230;]"}, {"title": "Microchip MTCH3380P and MTCH3240P capacitive touch controllers support up to 64 buttons with parallel sensing", "source": "CNX Software", "date": "2026-10-13", "url": "https://www.cnx-software.com/2026/10/13/microchip-mtch3380p-and-mtch3240p-capacitive-touch-controllers-support-up-to-64-buttons-with-parallel-sensing/", "summary": "<div><img alt=\"Microchip MTCH3380P and MTCH3240P turnkey touch controllers\" class=\"attachment-medium size-medium wp-post-image\" height=\"480\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/10/Microchip-MTCH3380P-and-MTCH3240P-turnkey-touch-controllers-720x480.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Microchip Technology has introduced the MTCH3380P and MTCH3240P, two new capacitive touch controllers that handle touch detection internally, making it easier to build display-free HMI devices with touch-sensitive buttons, sliders, and wheels. The main difference between the two controllers is the number of supported touch sensors. The MTCH3380P supports up to 38 self-capacitance or 64 mutual-capacitance keys, while the smaller MTCH3240P supports up to 24 self-capacitance or 32 mutual-capacitance keys. Both controllers use parallel sensing with 12 on-chip ADCs to improve touch response times and noise immunity. They also support touch detection through thick cover materials and when users are wearing gloves, making them suitable for home appliances, industrial control panels, EV chargers, and outdoor kiosks. Both also support IEC/UL 60730 Class B functional safety requirements. Microchip MTCH3380P and MTCH3240P specifications: Controller engine – Microchip patented charge-transfer acquisition engine with pipelined analog sensing and digital processing. Touch sensing Mutual capacitance [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/10/13/microchip-mtch3380p-and-mtch3240p-capacitive-touch-controllers-support-up-to-64-buttons-with-parallel-sensing/\">Microchip MTCH3380P and MTCH3240P capacitive touch controllers support up to 64 buttons with parallel sensing<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Dragonwing FWA Gen 6 Elite Platform combines 5G Advanced, NR-NTN, and tri-band Wi-Fi 8", "source": "CNX Software", "date": "2026-10-13", "url": "https://www.cnx-software.com/2026/10/13/dragonwing-fwa-gen-6-elite-platform-combines-5g-advanced-nr-ntn-and-tri-band-wi-fi-8/", "summary": "<div><img alt=\"Qualcomm DragonWing FWA Gen 6\" class=\"attachment-medium size-medium wp-post-image\" height=\"614\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/10/Qualcomm-DragonWing-FWA-Gen-6-720x614.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Unveiled at Network X 2026, the Qualcomm Dragonwing FWA Gen 6 Elite Platform combines 5G Advanced (3GPP Rel-19), NR-NTN (New Radio – Non-Terrestrial Networks) satellite communication, and tri-band Wi-Fi 8 with a 5&#215;5 radio configuration. The new Fixed Wireless Access (FWA) solution features a Qualcomm X105 Modem-RF with 5G NR over satellite support, quad-frequency GNSS (L1, L2, L5, and L6), Qualcomm Turbo DSDA for 60% higher throughput compared to Gen 5, a quad-core CPU, an integrated 10 TOPS NPU, LPDDR4x and LPDDR5/5x, and quantum security (CNSA 2.0 compliant). It offers 500 MHz of aggregated bandwidth, 6- and 8-layer MIMO, peak download and upload speeds of 14.8 Gbps and 4.2 Gbps, respectively. Dragonwing FWA Gen 6 Elite Platform (QMX105) specifications: CPU &#8211; Quad-core CPU AI accelerator &#8211; Up to 10 TOPS, 5th-generation Qualcomm 5G AI processor handling OTT traffic detection for apps (chatbots, social media)  5G gaming traffic prioritization Smooth 5G-to-Wi-Fi [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/10/13/dragonwing-fwa-gen-6-elite-platform-combines-5g-advanced-nr-ntn-and-tri-band-wi-fi-8/\">Dragonwing FWA Gen 6 Elite Platform combines 5G Advanced, NR-NTN, and tri-band Wi-Fi 8<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Designing Edge AI for Real-Time Systems", "source": "Embedded.com", "date": "2026-10-13", "url": "https://www.embedded.com/designing-edge-ai-for-real-time-systems/", "summary": "<p>Bringing AI directly into embedded systems is much more than just running a model on the device. When a decision must come within milliseconds, every element of the chain becomes decisive. The sensors, correctly sized memory, optimized models, processor, AI accelerators, operating system, and software must be designed together to achieve adequate scheduling and predictable [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/designing-edge-ai-for-real-time-systems/\">Designing Edge AI for Real-Time Systems<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "TI unveils 3-GSPS ADC for AI Data Centers at OCP", "source": "Embedded.com", "date": "2026-10-13", "url": "https://www.embedded.com/ti-unveils-3-gsps-adc-for-ai-data-centers-at-ocp/", "summary": "<p>Texas Instruments Inc. (TI) has claimed the industry's first analog-to-digital converter (ADC) to enable 24/7 event-based remote monitoring at nanosecond resolution for AI data centers. Introduced at the Open Compute Project (OCP) Global Summit, TI will demo the ADC34DSO75 ADC, along with the new LMI800PS hot-swap controller and LMK6B bulk acoustic wave (BAW)-based oscillator, addressing the [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/ti-unveils-3-gsps-adc-for-ai-data-centers-at-ocp/\">TI unveils 3-GSPS ADC for AI Data Centers at OCP<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "PlugMate and PlugClaw Review – Thumb-sized Android-based private computers with optional Ubuntu/OpenClaw support", "source": "CNX Software", "date": "2026-10-12", "url": "https://www.cnx-software.com/2026/10/12/plugmate-and-plugclaw-review-thumb-sized-android-based-private-computers-with-optional-ubuntu-openclaw-support/", "summary": "<div><img alt=\"PlugMate/PlugClaw review\" class=\"attachment-medium size-medium wp-post-image\" height=\"540\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/10/u-adapter-through-phone-case-720x540.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>We received two unusual little devices for review this month: the PlugMate and the PlugClaw, both built by TrustKernel, a security company better known for the trusted-execution tech inside other people&#8217;s phones than for consumer gadgets. Each is a complete, self-contained computer the size of a USB stick (its own processor, memory, and encrypted storage) that runs a private, hardened Android system called PlugOS. You plug one into your phone, tablet, or computer, and that host lends it a screen, a keyboard, and a network connection. Nothing of yours crosses over. The easiest way to picture it: it&#8217;s a little computer (or more accurately, the hardware of a small phone) that borrows your screen, mouse, keyboard, and other peripherals to interact with you. IT folks will be tempted to compare it to a virtual machine, and the analogy isn&#8217;t bad, except that nothing here is virtual. It&#8217;s real, separate silicon; [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/10/12/plugmate-and-plugclaw-review-thumb-sized-android-based-private-computers-with-optional-ubuntu-openclaw-support/\">PlugMate and PlugClaw Review – Thumb-sized Android-based private computers with optional Ubuntu/OpenClaw support<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Facebook releases Muse Gadgets SDK for ESP32 and Raspberry Pi/Linux-based devices", "source": "CNX Software", "date": "2026-10-12", "url": "https://www.cnx-software.com/2026/10/12/facebook-releases-muse-gadgets-sdk-for-esp32-and-raspberry-pi-linux-based-devices/", "summary": "<div><img alt=\"Muse Gadgets\" class=\"attachment-medium size-medium wp-post-image\" height=\"421\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/10/Muse-Gadgets-720x421.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Meta, Facebook&#8217;s parent company, has released the open-source Muse Gadgets SDK, designed to work with ESP32 boards or Linux-based SBCs like a Raspberry Pi. This requires some explanation&#8230; I&#8217;ve been on holiday for a while, so I&#8217;m not up to date on everything, but apparently Meta released Muse on September 6, yet another personal AI agent&#8230; Earlier this month, Nat Friedman, head of product at Meta Superintelligence Labs, shared an X post about the Muse Gadgets &#8220;side project&#8221; that aims to make ESP32 and Linux devices work with Muse, basically enabling hardware AI monitors and Physical AI with Muse. The Muse Gadgets SDK has been released on GitHub under an Apache 2.0 license (for most of the code) with two main directories: ESP32 Device SDK &#8211; It can show images, supports audio input and output, and can interface with sensors, actuators, buttons, etc&#8230; Linux Device SDK &#8211; Works with Raspberry [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/10/12/facebook-releases-muse-gadgets-sdk-for-esp32-and-raspberry-pi-linux-based-devices/\">Facebook releases Muse Gadgets SDK for ESP32 and Raspberry Pi/Linux-based devices<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Marvell Introduces Six-Channel CXL 3.2 Memory Expanders", "source": "Embedded.com", "date": "2026-10-12", "url": "https://www.embedded.com/marvell-introduces-six-channel-cxl-3-2-memory-expanders/", "summary": "<p>Marvell Technology Inc. has introduced the Structera X 3406 and 3506, second-generation CXL 3.2 memory expansion controllers designed to increase memory capacity, bandwidth, and utilization in AI servers and data center infrastructure. The new devices target memory-intensive workloads, including large language model (LLM) inference and deep learning recommendation models (DLRM), where memory availability can limit [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/marvell-introduces-six-channel-cxl-3-2-memory-expanders/\">Marvell Introduces Six-Channel CXL 3.2 Memory Expanders<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "Designing AI Data Center Fabrics with PCIe 6.0 High-Radix Switches", "source": "Embedded.com", "date": "2026-10-12", "url": "https://www.embedded.com/designing-ai-data-center-fabrics-with-pcie-6-0-high-radix-switches/", "summary": "<p>Artificial intelligence is reshaping data center architecture by changing where system bottlenecks occur. For years, networking discussions focused primarily on scale-out communication between servers and racks using Ethernet and InfiniBand. Traditional enterprise and cloud applications generated predictable north-south traffic patterns that scaled effectively as long as the external network infrastructure improved. AI workloads have fundamentally [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/designing-ai-data-center-fabrics-with-pcie-6-0-high-radix-switches/\">Designing AI Data Center Fabrics with PCIe 6.0 High-Radix Switches<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "Wireless-Tag WT32P4C5-43S – A fully integrated 4.3-inch ESP32-P4 and ESP32-C5 touch display devkit", "source": "CNX Software", "date": "2026-10-11", "url": "https://www.cnx-software.com/2026/10/11/wireless-tag-wt32p4c5-43s-a-fully-integrated-4-3-inch-esp32-p4-and-esp32-c5-touch-display-devkit/", "summary": "<div><img alt=\"4.3 inch dual chip ESP32 P4 and ESP32 C5 Wi Fi6 integrated touch display\" class=\"attachment-medium size-medium wp-post-image\" height=\"480\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/10/4.3-inch-dual-chip-ESP32-P4-and-ESP32-C5-Wi-Fi6-integrated-touch-display-720x480.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Wireless-Tag WT32P4C5-43S (ZX4D30CE405-V1.3)  is a fully integrated 4.3-inch touch display development board that combines an ESP32-P4 MCU with an ESP32-C5 wireless module supporting dual-band WiFi 6 (2.4/5 GHz), Bluetooth LE, and 802.15.4 connectivity. Unlike previous ESP32-P4 + ESP32-C5 solutions, this one comes with a built-in touchscreen, so you don&#8217;t need to connect a separate display. Designed for industrial automation, smart control panels, and edge AI vision terminals, the board also integrates a 15-pin MIPI CSI camera interface, a microSD card slot, two USB Type-C ports (USB 2.0 High-Speed and Debug/JTAG), and a 14-pin GPIO expansion header. Wireless-Tag WT32P4C5-43S (ZX4D30CE405-V1.3) specifications: Core module – Wireless Tag WT0132P4-A1-N16R32 SoC – Espressif Systems ESP32-P4 CPU Dual-core 32-bit RISC-V HP (High-performance) CPU @ up to 400 MHz with AI instructions extension and single-precision FPU Single-RISC-V LP (Low-power) MCU core @ up to 40 MHz with 8KB of zero-wait TCM RAM Memory 768 KB HP [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/10/11/wireless-tag-wt32p4c5-43s-a-fully-integrated-4-3-inch-esp32-p4-and-esp32-c5-touch-display-devkit/\">Wireless-Tag WT32P4C5-43S &#8211; A fully integrated 4.3-inch ESP32-P4 and ESP32-C5 touch display devkit<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}], "papers": [{"title": "LIBERO-PeRM: Benchmarking Personalized Robotic Manipulation", "authors": ["Zhixu Li", "Keqian Tang", "Litian Gong", "Jingyu Yao", "Wenqian Zhang", "Tianze Xu", "Zehao Wang", "Yuping Wang", "Junge Zhang", "Jiachen Li"], "published": "2026-10-15", "summary": "Personalization is essential for general-purpose robots to transition into household environments and achieve true practicality. While general robotic manipulation has been extensively studied, personalized robotic manipulation (PeRM) lacks a controlled benchmark for separating task completion from preference satisfaction. We introduce LIBERO-PeRM, a benchmark for preference learning in embodied agents. LIBERO-PeRM studies five questions: 1) how policies follow preferences in zero-shot settings; 2) how they learn single preferences from demonstrations; 3) how efficiently they acquire preferences as demonstrations increase; 4) how learned preferences generalize across layouts and tasks; and 5) how policies compose preferences and behave under conflicts. We propose a controlled formulation and taxonomy of observable preferences in simulation, covering motion, skill, and user-profile choices. This formulation is restricted to language-expressible preferences that can be instantiated in LIBERO without changing the task goal, evaluated automatically, and reused across tasks. Building on LIBERO, our procedural pipeline generates paired demonstrations with and without preferences. We create five task suites (312 tasks) with high-quality demonstrations, rich metadata, and preference-satisfaction metrics. Experiments show that current VLA policies struggle with zero-shot personalization, while SFT makes preferences learnable. Mixed training achieves better no-preference retention than sequential adaptation and improves performance with contextual prompts compared with preference-only training, but can weaken motion-preference learning; preference generalization, decomposition, and conflict handling remain difficult. The code, datasets, and demos can be found on the project website: https://libero-perm.github.io/.", "pdf_url": "https://arxiv.org/pdf/2610.22372v1"}, {"title": "Value as Memory: Online Value-Guided Post-training for General Robot Policies", "authors": ["Wenye Yu", "Yijin Chen", "Kaiyi Xiong", "Wenbo Han", "Wendi Chen", "Yang Jin", "Han Xue", "Jun Lv", "Cewu Lu", "Chuan Wen"], "published": "2026-10-15", "summary": "Real-world post-training of generalist robot policies faces two challenges: partial observability makes action selection ambiguous, while offline post-training methods delay feedback from deployment experience. We present Value as Memory (VaM), a framework that addresses these challenges through value caching and online real-world reinforcement learning (RL). Value caching conditions actions on recent value predictions as task-progress memory, while online updates enable timely policy improvement by combining offline demonstrations, off-policy interventions, and on-policy rollouts for sample-efficient adaptation. As a result, VaM transitions from offline RL warmup to online autonomous learning with sparse rewards. Across long-horizon tasks involving deformable objects and contact-rich manipulation, VaM yields a mean absolute success-rate gain of $29.4\\%$ with value caching, while achieving a $32.8\\%$ gain with online autonomous learning over matched offline training. The evaluated online schedule performs $8\\times$ as many policy iterations under the same gradient-step budget, with more than $2\\times$ lower recorded time per gradient step with concurrent data collection and training.", "pdf_url": "https://arxiv.org/pdf/2610.22368v1"}, {"title": "T2-z: Test-Time Optimization of Environment Latents for Robotic World Models", "authors": ["Chenyuan Zhou", "Yining Hong", "Huang Huang", "Yunfan Jiang", "Wenlong Huang", "David Held", "Vitor Campagnolo Guizilini", "Yue Wang", "Li Fei-Fei", "Jiajun Wu", "Leonidas Guibas", "Yejin Choi"], "published": "2026-10-15", "summary": "Predicting how the world responds to an action requires more than what can be seen: robots must account for environmental factors that are neither directly observable nor explicitly specified, from physical properties such as friction and mass to human-defined environmental rules. We introduce T2-Z for test-time optimization of environment latents, which augments a robotic world model with a learnable environment latent to condition world predictions. This compact latent captures underlying environmental variation without supervision of what environmental factors exist or what values they take. During training, T2-Z alternates between two stages: a world-model optimization stage that fixes the latents and learns general action-conditioned dynamics across environments; and an environment-latent optimization stage that freezes the world model and optimizes the conditioning latents, allowing latent structure to emerge purely through world prediction. At test time, the world model remains frozen and a newly initialized environment latent is optimized from one or more test-time interactions, adapting the model to previously unseen environmental configurations. Across 7 simulated settings and 4 real-world robotic tasks, T2-Z reduces object prediction error metric from 15.20 to 7.00 and raises action success from 33.73% to 72.96%. Its emergent latents capture structured representations of individual and compounded factors across diverse visual scenes. Ablations further show that T2-Z can efficiently infer environment latents from as little as a single test-time interaction trajectory.", "pdf_url": "https://arxiv.org/pdf/2610.22364v1"}, {"title": "Perceive, Predict, and Plan: a Unified World Action Model for Egocentric Dexterous Manipulation", "authors": ["Zirui Wu", "Chen Guo", "Tianjian Jiang", "Zeren Jiang", "Zeming Li", "Lingchen Yang", "Longteng Duan", "Ying Xue", "Handi Yin", "Shenyuan Gao", "Martin R. Oswald", "Jun Zhang", "Ping Tan", "Jie Song"], "published": "2026-10-15", "summary": "We introduce P$^{3}$-WAM, a unified world action model for egocentric dexterous manipulation that learns 3D perception, action-conditioned prediction, and goal-directed planning through three complementary modes: Perceive, which reconstructs articulated hand motion and camera trajectories from video; Predict, which generates visual futures under prescribed actions; and Plan, which jointly generates action trajectories and their anticipated visual consequences conditioned on an initial image, a language instruction, and an optional visual goal. Our model integrates a compact, structured 3D action representation into a pretrained video diffusion transformer through a mixture-of-transformers architecture with shared base weights, modality-specific adaptation, and bidirectional visual-action attention. Randomized modality visibility lets video and 3D actions serve as either conditioning context or prediction targets across the three modes. Experiments show that unified training improves all three capabilities over single-mode training, including gains in planning quality under a vision-language model evaluation. Through unified training, our model outperforms specialized baselines on 3D hand reconstruction and action-conditioned video prediction across four datasets, while producing goal-directed manipulation videos with stronger instruction adherence and action progression than video-generation baselines. Project Page: https://p3-wam.pages.dev/", "pdf_url": "https://arxiv.org/pdf/2610.22363v1"}, {"title": "CoDA: Co-Evolution of Data Engines and Action Policies", "authors": ["Tianjiao Yu", "Zhilin Ou", "Yifan Shen", "Xinzhuo Li", "Yuanzhe Liu", "Onkar Kishor Susladkar", "Fan Wang", "Ismini Lourentzou"], "published": "2026-10-15", "summary": "Generative simulation can automate robot environment construction, but physically valid environments are not necessarily useful for training. The challenge is to identify environments that address a policy's failures and supervision that helps it overcome them. We introduce CoDA, a framework in which a simulation data engine and an action policy co-evolve through a shared heterogeneous memory of environment construction, policy failures, and learning progress. The memory compiles validated diagnoses from a vision-language critic into generation programs that recreate difficulties and training programs that help the policy overcome them. We further propose Text2potential to convert these diagnoses into staged potentials for action-chunk value learning, providing dense supervision for policy updates while preserving the task's optimal policy under standard shaping assumptions. Measured learning progress guides further generation and program refinement. Across four manipulation task families, CoDA improves out-of-distribution success from 5.3% after supervised fine-tuning to 27.6%, exceeding the strongest closed-loop baseline by 9.5 percentage points with the same generation budget. On LIBERO-Pro, 15 rounds of generation and training raise success from 25% to 84% under position perturbations and from 1% to 76% under instruction perturbations.", "pdf_url": "https://arxiv.org/pdf/2610.22362v1"}, {"title": "PathFM: Fast Generative Forecasting of Multivariate Trajectories", "authors": ["Jiachen Yao", "Xiyuan Zhang", "Annan Yu", "Boran Han", "Abdul Fatir Ansari", "Shuai Zhang", "Michael Bohlke-Schneider", "Bernie Wang"], "published": "2026-10-15", "summary": "Time series foundation models are becoming increasingly popular for general-purpose forecasting. However, most leading models predict marginal quantiles, leaving the dependence structure of future trajectories unspecified. This distinction matters for trajectory-dependent quantities such as cumulative demand, peak load, and event timing, yet point and marginal scores do not reveal it. To model this dependence, we introduce PathFM, a trajectory-based forecasting model that uses flow matching to generate complete future paths. We further distill the model to one or two steps and share history attention cache across draws. Together, these enable PathFM to generate multiple paths for a single series in roughly the time needed for one query to a quantile model. The distilled sampler also makes it practical to optimize a calibration loss directly. PathFM achieves competitive marginal accuracy on the established forecasting benchmarks fev-bench and TIME. To complement these evaluations, we introduce Forecast Path Score Bench (fps-bench), which augments fev-bench tasks with energy and variogram scores and downstream metrics. PathFM achieves a higher aggregate path score on fps-bench than all evaluated external baselines. Experiments on chaotic systems further show that our flow model sustains long-run variability, while strong baselines rapidly collapse. PathFM makes generative time series forecasting both competitive and practical, enabling diverse downstream applications.", "pdf_url": "https://arxiv.org/pdf/2610.22358v1"}, {"title": "OmniVerifier-C1: Decomposed Graded Verifier for Rule-Governed Generative World Modeling", "authors": ["Bowei Liu", "Xinchen Zhang", "Xuhuan Li", "Tianlin Zhang", "Kaian Jiang", "Jingwei Liu", "Congyang Zhao", "Yifei Qian", "Junhong Liu", "Zhiheng Li", "Yujiu Yang", "Yang Cai", "Ling Yang"], "published": "2026-10-15", "summary": "Generative visual verifiers play a crucial role in advancing multimodal intelligence. To enhance the robustness of visual verifiers in complex multimodal scenarios involving compositional requirements, we move beyond conventional binary verifiers that produce only True/False discrete judgments and introduce a verifier that automatically decomposes complex prompts or environmental rules into fine-grained components and assigns pointwise scores to provide a continuous and more informative critique signal. Our experiments further demonstrate that these structured and interpretable outputs improve the verifier's generalization to out-of-domain multimodal critic tasks. To train this verifier, we introduce a Decoupled RL training strategy that jointly optimizes sub-question-level binary judgment and global alignment scoring, using precise local feedback to develop fine-grained verification capabilities that provide a foundation for reliable continuous scoring at the global level. Under a general reinforcement learning framework, we first empirically demonstrate that the proposed pointwise graded verifier significantly outperforms binary verifiers in traditional text-to-image scenarios. We then extend our investigation to rule-governed generative world modeling where generative models are leveraged for world simulation and world reasoning under explicit rules. From a theoretical standpoint, we further show that a pairwise verification paradigm yields more accurate critiques than the pointwise formulation when ground-truth images are available, with empirical results on diverse structured world-modeling tasks such as Maze and Sudoku further validating the effectiveness of our approach. Overall, our findings suggest a key insight: the transition from generative models to structured world-modeling agents critically hinges on the availability of accurate pairwise graded visual verifiers.", "pdf_url": "https://arxiv.org/pdf/2610.22355v1"}, {"title": "GeoState: Learning View-Decoupled Geometry States for 3D World Modeling", "authors": ["Hongchang Liu", "Jian Liu", "Yujuan Ding", "Liang Peng", "Xun Jiang", "Fei Ma", "Xing Xu", "Yi Bin"], "published": "2026-10-15", "summary": "Recent 3D world models increasingly use features from geometry foundation models (GFMs) as predictive world states, benefiting from their rich geometric priors. However, the view dependence of these features entangles scene dynamics with camera-induced variation, making the resulting state evolution harder to predict. We propose GeoState, a view-decoupled geometry representation for predictive 3D world modeling that separates scene-state evolution from camera-dependent observation. Specifically, a scene tokenizer aggregates multi-view GFM features into a view-decoupled scene state, which a geometry decoder queries using camera rays. An autoregressive world model then predicts future scene states, while camera motion is modeled separately. The predicted states can therefore be decoded under either predicted or externally specified cameras, while retaining a single context-derived scale throughout the rollout without per-frame scale alignment. Experiments show that GeoState outperforms prior 3D world models on Waymo, supports geometrically consistent cross-view querying, and generalizes zero-shot to KITTI and nuScenes. Project page: https://hongchang-liu.github.io/GeoState-project-page/", "pdf_url": "https://arxiv.org/pdf/2610.22343v1"}, {"title": "Spark-0: Scaling Spatially Aligned Tactile Pretraining for Robot Dexterous Manipulation", "authors": ["Tianxing Chen", "Wenwei Lin", "Chuqiao Lyu", "Peicheng Xiang", "Junyuan Tang", "Tian Nian", "Zijian Cai", "Kehe Ye", "Chenze Yu", "Wenxuan Zhu", "Eric J. Chen", "Yan Qin", "Yue Chen", "Tongyu Wu", "Junhao Gong", "Kai-Chong Lei", "Jiahao Zhang", "Kailun Su", "Qiwei Liang", "Renjing Xu", "Ping Luo", "Wenbo Ding"], "published": "2026-10-15", "summary": "Generalist robot policies benefit from large-scale visual pretraining but often struggle with contact-rich dexterous manipulation, where force, compliance, and incipient slip are hard to observe from images. We present Spark-0, a spatially aligned vision-tactile-language-action (VTLA) model that uses touch in two complementary ways. During pretraining, image-space contact maps derived from tactile gloves, together with features from a frozen 3D geometry teacher, supervise the visual tokens; these objectives are removed at inference. In parallel, a tactile pathway encodes regional force histories and 3D taxel states to condition the action expert. A single checkpoint therefore supports both vision-only and tactile-conditioned deployment. To scale this supervision, we build HumanTouch, a 1,000-hour dataset of full-hand tactile human manipulation, and pretrain Spark-0 on it together with egocentric video, robot data, and simulation. We also release SparkArena, which pairs vision-only simulated tasks with tactile-conditioned real-robot tasks on one dexterous embodiment. Spark-0 achieves the highest mean success rate on both SparkArena tracks and ranks first on all eight aggregate metrics of the Ego Humanoid Manipulation Benchmark. Compared with vision-only pretraining on the same data and compute with touch discarded, retaining the touch of 1,000 hours of HumanTouch raises vision-only success on Ego Humanoid from 52.5% to 71.7%, and success on SparkArena-Real, where touch is also used at deployment, from 44.0% to 52.0%, indicating that touch serves not only as a policy input but also as scalable supervision for dexterous visuomotor pretraining. The Website is available at: https://xsparkai.com/Spark-0.", "pdf_url": "https://arxiv.org/pdf/2610.22342v1"}, {"title": "Dexterity from Supervised Play", "authors": ["Botao He", "Yiming Dou", "Yiannis Aloimonos", "Jitendra Malik", "Akash Sharma", "Ruoshi Liu"], "published": "2026-10-15", "summary": "How can robots autonomously collect the contact-rich experience needed to learn dexterous manipulation? We present DSP: Dexterity from supervised play, a framework in which a robot learns a play policy from minutes of human play through behavior cloning, then deploys it autonomously to collect hours of interaction data to train a world model. During inference, the same play policy then guides model-predictive control (MPC) by proposing candidate action sequences for evaluation under the learned world model. To accelerate inference, we also introduce a method for distilling a closed-loop, goal-conditioned policy through self-play within the learned world model. We evaluate this framework on underactuated pushing and any-to-any in-hand pose reorientation with a multifingered hand, in simulation and real world. In real world experiment, our method outperforms hindsight behavior cloning by 69.6% in success rate and achieves comparable success to reinforcement learning with 490 times less interaction data. These results demonstrate that supervised play can autonomously collect interaction data, guide model-based planning, and enable policy learning without any task-specific demonstrations or sim-to-real transfer.", "pdf_url": "https://arxiv.org/pdf/2610.22340v1"}, {"title": "Sim-to-Real Reinforcement Learning for Path-Safe Target Reaching in Robotic Harvesting of Hydroponic Lettuce", "authors": ["Al Bashir", "Partho Ghose", "Yibin Wang", "Robert G. Hardin", "Joshua Peeples", "Genhua Niu", "Azlan Zahid"], "published": "2026-10-15", "summary": "Robotic harvesting requires precise manipulation to ensure accurate positioning of the end-effector, especially in a constraint workspace. This study introduces the Path-Safe Approach Proximal Policy Optimization (PSA-PPO), a target-conditioned local reaching framework designed for robotic harvesting of nutrient film technique (NFT)-hydroponic lettuce in greenhouses. The proposed PSA-PPO preserves the standard clipped PPO objective while introducing a harvesting-oriented policy formulation that integrates target-conditioned observations, corridor-aware spatial constraints, trajectory-history-based safety encoding, and task-specific success criteria for constrained robotic manipulation. PSAPPO was trained entirely in Isaac Lab and successfully transferred to a physical UR10e robotic arm without any real-world policy fine-tuning. In a controlled physical benchmark against 150 scheduled targets, PSA-PPO achieved the highest reaching rate of 94.7%, outperforming Cartesian+TOTG (86.0%), RRTConnect (88.0%), and RRT* (80.0%), while reducing median RMS jerk by 39.8 to 73.0% relative to the classical planners during the final approach segment. A formulation ablation evaluated over 200 simulation targets demonstrates that path-safety and side-corridor shaping are the principal drivers of harvesting-compatible performance: removing either term substantially degrades strict success even when terminal endpoint accuracy is preserved or improved, confirming that optimization toward the endpoint alone is an insufficient objective for constrained crop-proximal manipulation. Finally, PSA-PPO was integrated with an RGB-D vision module and an end-effector and evaluated as a complete greenhouse harvesting system across 144 lettuce harvesting attempts, achieving 94.4% vision-guided target reaching and 86.1% complete harvesting success.", "pdf_url": "https://arxiv.org/pdf/2610.22337v1"}, {"title": "Illumination-Aware Active Perception for Spacecraft Inspection", "authors": ["Sagarika Rao Valluri", "Benjamin Riviere"], "published": "2026-10-15", "summary": "Harsh and rapidly varying orbital illumination introduces failure modes during spacecraft inspection. Existing planners rely on line-of-sight inspection metrics which perform occlusion checks against a known target and conflate geometric visibility with task-relevant information. These metrics overlook illumination effects including eclipse, self-shadowing, and specular reflection from spacecraft materials and tend to declare components as inspected despite the corresponding images lacking sufficient information. We propose an inspection-planning framework that replaces geometric visibility with a learned measure of camera information derived from a classifier variational autoencoder (VAE) that operates directly on the captured image. The encoder model is trained to classify spacecraft surface components from rendered patches, and its total latent variance is used to learn the varying illumination of said components, replacing binary visibility checks with a continuous, image-grounded quantity. We evaluate the approach by implementing a Guidance, Navigation, and Control architecture in a photorealistic physics simulator, and vary lighting and viewing geometries with multiple orbits. We show that, although all approaches successfully maximize their own objective, our approach results in better illumination: a mean brightness of $0.57$, with $81.6\\%$ of observations above $0.25$, compared with $0.02$ ($3.0\\%$) for geometric planning with an illumination band and $0.04$ ($6.0\\%$) for purely geometric planning.", "pdf_url": "https://arxiv.org/pdf/2610.22335v1"}, {"title": "Mem4Act: Learning Effective Latent Memory for Long-Horizon Robotic Manipulation", "authors": ["Yun Zhang", "Zhiyu Huang", "Tianhui Cai", "Chen Tang", "Wei Wang", "Jiaqi Ma"], "published": "2026-10-15", "summary": "Long-horizon robotic manipulation fundamentally requires memory: agents must retain task-relevant information from past observations and interactions and use it to guide future actions. Existing approaches typically preserve raw historical observations, compressed visual tokens, or language summaries, but these representations either expose the action policy to increasingly long histories or risk discarding task-relevant temporal, semantic, and perceptual information. We introduce Mem4Act, a framework for learning effective latent memory as a fixed-size representation explicitly optimized for long-horizon robotic control. Mem4Act addresses three coupled challenges: how to efficiently cover long histories, what information memory should retain, and how to ensure the policy actually relies on memory. To this end, it organizes history via multi-granularity temporal aggregation, preserves complementary semantic and perceptual information through question-answering supervision and key-frame DINO feature reconstruction, and employs memory-first two-stage training to encourage greater use of memory by the action policy. The resulting memory captures both high-level task state and fine-grained perceptual evidence while providing a bounded interface to the action policy. Across RoboMME, RMBench, and four real-world manipulation tasks, Mem4Act achieves state-of-the-art performance on memory-dependent control, with success rates of 49.88%, 61.0%, and 81.5%, respectively. Extensive ablations further demonstrate the importance of temporal aggregation, complementary memory supervision, and memory-first training.", "pdf_url": "https://arxiv.org/pdf/2610.22323v1"}, {"title": "Learning Self-Orchestration in Decentralized Agent Swarms", "authors": ["Guowei Xu", "Zhenting Qi", "Amani Kiruga", "Himabindu Lakkaraju", "Yilun Du"], "published": "2026-10-15", "summary": "The capabilities of an agent swarm depend on both its individual members and how they coordinate. Yet existing multi-agent systems often train agents within fixed orchestration structures, separating the learning of individual capabilities from the organization of collective behavior. We introduce market-based post-training (MPT), a framework for jointly learning action policies and self-orchestration in decentralized agent swarms. Agents express their willingness to participate through bids, which determine who acts and how collective outcomes provide local training credit. Learning both action and bidding behavior allows individual capabilities and patterns of participation to adapt together without a central coordinating agent. We evaluate MPT on embodied crafting, robot navigation, and deep research. Results show gains over monolithic post-training and confirm that agent participation indeed evolves with learning. With the same post-trained action policies, learned self-orchestration outperforms alternative coordination strategies. Ablations show that both action and bidding benefit from learning, and that learned bids provide more effective action-training signals. Beyond the original training objectives, trained swarms adapt faster to related tasks and achieve better performance with larger populations at inference time. Larger populations also suffer smaller performance losses under agent dropout, demonstrating that learned self-orchestration supports reuse, scaling, and robustness in decentralized agent swarms. Code and trained models are available at https://github.com/Embodied-Minds-Lab/MPT.", "pdf_url": "https://arxiv.org/pdf/2610.22322v1"}, {"title": "Velox: Spatial Memory Makes World Models Efficient", "authors": ["Qiuhong Shen", "Shizun Wang", "Xinchao Wang"], "published": "2026-10-15", "summary": "Video world models turn actions and camera motion into long visual rollouts, making video a natural interface for interactive simulation. Such interaction requires responsive generation, yet coherent rollouts must retain visual memory of what has already been generated. Chunked video diffusion models usually keep this context in growing KV caches, so later chunks become progressively slower. To address this bottleneck, we introduce Velox, a training-free attention router for region-level context selection using frustum slab correspondences from streaming geometry. Velox represents historical blocks as camera frustum slabs with depth intervals and obtains current-block depth through recency-priority multiwarp. For well-covered regions, frustum slab overlap softly modulates each layer's model-derived block importance. Uncovered regions retain the model-derived route without geometric bias. The fixed token-block granularity matches FlashAttention-style tiled execution and reduces the attention term that grows with rollout length. Frustum slab construction runs asynchronously with denoising on the same H200. At chunk 48, Velox accelerates attention by $4.36\\times$ and denoising by $2.43\\times$. On the full 158-case WBench navigation split, it remains within 0.15 API-free average points of dense LingBot-Fast-Cam. Please see our project page at https://velox-world.com/velox/ for more details.", "pdf_url": "https://arxiv.org/pdf/2610.22311v1"}, {"title": "Asking Smarter Questions: Targeted Active Preference Learning for Underspecified Rewards", "authors": ["Helena Merker", "Nick Walker", "Andreea Bobu"], "published": "2026-10-15", "summary": "Reward learning typically assumes the human's input covers everything that matters for the task. In practice, humans can only attend to so much at once, so their teaching naturally captures some features---or aspects of the task---better than others. Prior work has shown how the robot can identify which features were poorly supervised directly from its teaching data. But the current solution is to ask the human to try again, putting the burden on someone who already struggled to convey those features. We propose shifting this burden to the robot. Our key insight is that the same information that tells the robot what it doesn't know can help it ask better questions. Preference queries offer a low-effort channel for resolving this uncertainty, but only if the robot knows where to direct them and the human knows what to attend to when answering. We act on this insight in two ways: we build an informed prior that targets preference queries at the features that need resolving, and we accompany each query with an explanation that focuses the human's attention on exactly those features. In simulation, the informed prior beats the standard active preference learning baseline by up to $30.8\\%$ in the low-query regime, where reducing human effort matters most. In a user study, the informed prior and explanations each significantly improve reward recovery and amplify each other.", "pdf_url": "https://arxiv.org/pdf/2610.22285v1"}, {"title": "Auditable and Deployable Multi-Agent Motion Planning via Posetal Games from Legal Guidelines", "authors": ["Florian Lercher", "Karan Mahesh", "Yujun Huang", "Meshal Alharbi", "Runyu Zhang", "Hanna Krasowski", "Michael R. Benjamin", "Matthias Althoff", "Gioele Zardini"], "published": "2026-10-15", "summary": "When robots are deployed in the real-world, they must interact with other agents and accomplish their own goals while adhering to legal constraints. These potentially conflicting objectives are often only partially prioritized, making scalarized objectives or fully specified hierarchies unsuitable. We present a framework for multi-agent motion planning under legal requirements based on games with partially ordered preferences (posetal games). Scenario-independent legal guidelines order abstract legal concerns, from which we automatically derive agent preferences and a legal game for any concrete scenario. Agents may refine their legal preferences with private objectives, and regulators may refine the guideline as laws evolve. We prove that such customizations can only remove equilibria and thus preserve legality. To coordinate agents without explicitly communicating private preferences, we introduce belief play, which provably recovers the true equilibria from conservative local games, and a distributed iterative best-response protocol requiring less information. We apply the framework to maritime navigation, systematically lifting pairwise traffic rules to multi-vessel encounters. On seven encounters with up to four vessels, every rule violation of the committed equilibria is certified as forced by the legal hierarchy or unsatisfiable, and defectors are identified from public information in all tested cases. These results indicate that guideline-based posetal games offer an auditable route from partially specified laws to multi-agent motion planning.", "pdf_url": "https://arxiv.org/pdf/2610.22277v1"}, {"title": "Millimetre/Sub-Millimetre SETI: Expanding the Radio Technosignature Parameter Space with ALMA2040", "authors": ["Louisa A. Mason", "Michael A. Garrett", "Sofia Z. Sheikh", "Kelvin Wandia", "Anita M. S. Richards", "Vishal Gajjar", "Chenoa D. Tremblay", "Andrew P. V. Siemion"], "published": "2026-10-15", "summary": "The search for extraterrestrial intelligence (SETI) has been largely concentrated at centimetre wavelengths, and in particular in the 'water hole' (1.42-1.66 GHz) range. The millimetre and sub-millimetre sky is, by contrast, almost entirely unsearched. It also offers some natural advantages: above 35 GHz, the interstellar and interplanetary media are effectively transparent and non-dispersive, terrestrial interference is sparse, and interferometry suppresses what interference remains. Both antenna gain and usable fractional bandwidth increase with frequency, so a civilisation optimising directed, high-data-rate links has advantageous reasons to operate in this regime, as illustrated by the ongoing migration of our own telecommunications systems to much higher frequencies. Building on the first ALMA technosignature survey (Mason et al. 2025), we identify four searches ALMA2040 is uniquely placed to make: (i) narrowband searches using a phased-up, beamformed array, extending the commensal model pioneered for the VLA and MeerKAT into a regime where drift rates reach ~ 103 Hz s^-1; (ii) broadband aggregate leakage (BRaTs) from Kardashev Type I civilisations, for which 128-512 GHz of instantaneous bandwidth places a ~ 60 pc horizon within an integration time of one hour on source; (iii) Dysonian searches for the cold waste heat of computation - Slysh haloes - whose arcsecond and subarcsecond angular scales around M dwarfs are well matched to ALMA2040's array configuration; and (iv) geometric discontinuities imprinted by occulting megastructures, detectable as ringing in the visibility function with a phased ALMA operating in a mm/sub-mm VLBI array. We set out the corresponding requirements: bandwidth, beamforming, commensal access, spectral resolution and sub-second time resolution.", "pdf_url": "https://arxiv.org/pdf/2610.22266v1"}, {"title": "Disagreement-Guided Weak-to-Strong Routing", "authors": ["Sima Noorani", "Shayan Kiyani", "George Pappas", "Hamed Hassani"], "published": "2026-10-15", "summary": "Small language models are increasingly deployed on edge devices and robotic systems to meet cost and latency constraints, yet their limited capabilities can make reliable deployment challenging. Stronger models can provide assistance when needed, but deciding when to route a weak-model response to a stronger model often relies on signals of response correctness. In open-ended and agentic tasks, however, obtaining such signals can require costly ground-truth supervision that is difficult to obtain at scale. We revisit the foundations of weak-to-strong routing and ask whether routing decisions can instead be guided by signals that do not require ground-truth supervision
