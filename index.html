for craftsmanship and reliability. It’s a legacy that Japan can’t afford to give up. <\/p>"}, {"title": "Quarterhill discusses transport modernization as U.S. marks 70 years of federal highways", "source": "The Robot Report", "date": "2026-07-03", "url": "https://www.therobotreport.com/quarterhill-discusses-transport-modernization-u-s-marks-70-years-federal-highways/", "summary": "<p>At the U.S. celebrates 250 years of independence and 70 years of its highway system, an expert looks at the future of autonomous transport. <\/p>\n<p>The post <a href=\"https://www.therobotreport.com/quarterhill-discusses-transport-modernization-u-s-marks-70-years-federal-highways/\">Quarterhill discusses transport modernization as U.S. marks 70 years of federal highways<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Video Friday: An Earthbound Mars Rover for the Moon", "source": "IEEE Spectrum Robotics", "date": "2026-07-03", "url": "https://spectrum.ieee.org/video-friday-nasa-lunar-rover", "summary": "<img src=\"https://spectrum.ieee.org/media-library/mars-style-rover-prototype-on-rugged-ground-under-a-clear-sky-with-the-moon-visible.png?id=67083121&amp;width=1245&amp;height=700&amp;coordinates=0%2C0%2C0%2C0\" /><br /><br /><p><span><a href=\"https://spectrum.ieee.org/tag/video-friday\" target=\"_blank\">Video Friday<\/a> is your weekly selection of awesome robotics videos, collected by your friends at <\/span><em>IEEE Spectrum<\/em><span> robotics. We also post a weekly calendar of upcoming robotics events for the next few months. Please <\/span><a href=\"mailto:automaton@ieee.org?subject=Robotics%20event%20suggestion%20for%20Video%20Friday\">send us your events<\/a><span> for inclusion.<\/span><\/p><h5><a href=\"https://roboticsconference.org/\">RSS 2026<\/a>: 13–17 July 2026, SYDNEY<\/h5><h5><a href=\"https://mrs.fel.cvut.cz/summer-school-2026/\">Summer School on Multi-Robot Systems<\/a>: 29 July–4 August 2026, PRAGUE<\/h5><h5><a href=\"https://actuate.foxglove.dev/\">Actuate 2026<\/a>: 18–19 August 2026, SAN FRANCISCO<\/h5><h5><a href=\"https://2026.ieee-iros.org/\">IROS 2026<\/a>: 27 September–1 October 2026, PITTSBURGH<\/h5><p>Enjoy today’s videos!<\/p><div class=\"horizontal-rule\"><\/div><div><span style=\"display: none;\"> <\/span><\/div><blockquote class=\"rm-anchors\" id=\"fmxmym6bj-y\"><em>NASA is considering a mission concept for an advanced, nuclear-powered rover to be deployed to the Moon’s South Pole as part of the agency’s Moon Base plans. The PROMISE (Polar Rover for Observation, Mapping, and In-Situ Exploration) mission concept relies on the <\/em><em>Curiosity<\/em><em> Mars rover mission’s testbed rover. Some elements of the Perseverance Mars testbed rover shown in this video could be used as well. As exact duplicates of Curiosity and Perseverance, the testbed rovers are equipped with flight-proven engineering systems capable of carrying technology as well as science instruments that would advance Moon Base efforts.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>A Mars rover for the Moon? That’s some <a href=\"https://science.nasa.gov/resource/improved-optimism/\" target=\"_blank\">OPTIMISM<\/a> right there.<\/p><p>[ <a href=\"https://science.nasa.gov/resource/improved-optimism/\">JPL<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"6qrzc1kf7kc\">This is the absolute best thing since <a href=\"https://spectrum.ieee.org/festos-fantastical-flying-robots\" target=\"_blank\">Festo’s AirPenguin<\/a>.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><blockquote><em>The project explores soft, lightweight robots that can gently float around people in indoor environments and invite playful, affectionate, and everyday interactions. Unlike conventional drones, our robot is designed to be quiet, soft, touch-safe, and socially approachable. Through this work, we ask what future indoor companion robots might feel like if they were not rigid machines, but gentle floating beings that share space with us.<\/em><\/blockquote><p>[ <a href=\"https://dl.acm.org/doi/10.1145/3800645.3813051\">Paper<\/a> ]<\/p><p>Thanks, Mingyang!<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"m7pzr90bqw4\"><em>Today, we’re launching our home robot, Isaac 1. Deliveries will begin this fall.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>US $500 per month, with some basic task autonomy, plus teleoperation.<\/p><p>[ <a href=\"https://www.weaverobotics.com/isaac-1\">Weave Robotics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"tv90gfm9rao\">A couple of things from this new Figure video: Thing one is that the cart-pulling is a good illustration of how clumsy humanoid robots still are at basic tasks relative to humans. Thing two is that there are absolutely no humans anywhere near these robots. You can see one guy at 0:19, which I can only assume is an accident, because these robots are not safe to be around from an industrial safety perspective.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.figure.ai/news/f-03-at-bmw\">Figure<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"5mhop2g4e4u\">Our very own Kohava Mendelsohn met some robots at ICRA in Vienna, and only one of them was murderous.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://2026.ieee-icra.org/\">ICRA 2026<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"ipyxwelid9q\"><em>Welcome to Robot Park, where we’re building the future with Apollo 2. Robot Park is where Apollo learns today, getting the experience needed to make a difference tomorrow. Today we’re announcing Robot Park, our nearly 90,000-square-foot facility where Apollo 2 is collecting real-world training data needed to advance autonomous humanoid robots. <\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://apptronik.com/news-collection/welcome-to-robot-park-where-apptroniks-apollo-goes-to-work\">Apptronik<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"mrlbqt5tkh4\"><em>UBTech Robotics, the world’s first publicly traded humanoid robot-maker, has launched a humanlike robot that features lifelike silicone skin and “emotional AI,” as Chinese tech firms increasingly transition robots from the factory floor to the family living room.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.scmp.com/tech/tech-trends/article/3358884/ubtechs-lifelike-humanoid-robots-built-companionship-arriving-homes-across-china\">SCMP<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"xdq8yzehviy\"><em>Spherephones are redefining how we experience sound. Created at Georgia Tech, this wearable uses spatial audio to alert users to movement from every direction—including behind and below. Built for safer human-robot collaboration, the technology is expanding into gaming and accessibility applications. See how music is becoming a new language for awareness and interaction.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://research.gatech.edu/feature/spherephones\">Georgia Tech<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"6dme3jyj3hg\"><em>Humanoid robots are meant to carry out long-horizon autonomous missions in a world built for humans. This is hard. These missions consist of many steps, each of which requires them to perceive, navigate, and interact with the environment. This is exactly Flexion’s goal: building the general-purpose intelligence that turns any robot into a useful helper.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://flexion.ai/news/flexion-reflect-v1.0\">Flexion<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"lttnht-y47m\"><em>We’re introducing KinetIQ Ascend—our reinforcement-learning approach designed to reach 99.9 percent manipulation reliability at human speed and beyond.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://thehumanoid.ai/technology/kinetiq-ascend/\">Humanoid<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"hsmj7__elk0\"><em>Dr. Sebastian “Basti” Scherer has worked in field robotics since the first DARPA Grand Challenge in 2004. He runs the AirLab at Carnegie Mellon’s Robotics Institute and is the director of safe embodied AI at FieldAI. While much of the industry is focused on local skills like tabletop manipulation, Dr. Scherer sees the greatest value in solving dirty, dull, and dangerous tasks that require operating in uncertain environments where the robot needs to “just work.” When robots “just work,” they become less like robots and more like tools. “That’s the big challenge that we have to overcome,” he says. “And that’s the challenge that FieldAI is really primed to solve.”<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.fieldai.com/\">FieldAI<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"omzfvmtwsjc\">Look, I really appreciate how valuable robots like ElliQ can be, and robots that do good work and offer a financial benefit are incredibly important, especially in the context of family care. But in my opinion, you really shouldn’t suggest that a robot with FaceTime or whatever is an equal replacement for in-person human companionship, nor should you suggest that AI can replace a human wellness coach. If you can’t afford those things, then sure, ElliQ can offer some of those capabilities in a very limited way, but that’s all.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://elliq.com/\">ElliQ<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"gz4frehicfe\">Very cool moves! Now get a job!<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.deeprobotics.cn/en\">DEEP Robotics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"r6f8bztjqfg\"><em>Drawing inspiration from restaurant waiters in Morocco and Turkey, among other places, we equip a robot with a hanging tray to transport objects from one location to another without dropping them or spilling their contents. We incorporate this approach into an interactive robot waiter demonstration, which uses computer vision and visual servoing to steer toward a person with a raised hand to serve them.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://arxiv.org/abs/2606.10039\">Paper<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"qfsmncdh9lu\">If you’re going to make robots wear skirts or shorts or pants, you have to give them butts, or it’s just not going to work. That is all.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://techshare.co.jp/product/unitree/g1/\">TechShare<\/a> ] via [ <a href=\"https://www.youtube.com/@KazumichiMoriyama\">Kazumichi Moriyama<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"kfy7d-qiyjw\"><em>It’s Los Alamos, so of course we have robots. Some work inside gloveboxes, while others probe unexploded ordnance in the field and aid with repetitive lifting, Doc Ock–style. Legend has it there’s a fro-yo robot in the cafeteria.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.lanl.gov/media/publications/national-security-science/1224-sniffing-out-radiation\">LANL<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"8aiznj4cciu\">Here are a couple of talks from the recent Humanoids Summit in Japan, from Ali Agha of FieldAI as well as Hiroshi Ishiguro.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p class=\"shortcode-media shortcode-media-youtube\"> <span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span> <\/p><p>[ <a href=\"https://humanoidssummit.com/agenda-2\">Humanoids Summit<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div>"}, {"title": "Blattner awards Built Robotics $75M contract for physical AI to help meet energy demand", "source": "Robotics Business Review", "date": "2026-07-02", "url": "https://www.therobotreport.com/blattner-awards-built-robotics-75m-contract-meet-energy-demands/", "summary": "<p>Blattner has expanded its partnership with Built Robotics to scale autonomous systems for solar construction.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/blattner-awards-built-robotics-75m-contract-meet-energy-demands/\">Blattner awards Built Robotics $75M contract for physical AI to help meet energy demand<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Why you should combine robot dexterity with mechanical positioning for complex assembly operations", "source": "Robotics Business Review", "date": "2026-07-02", "url": "https://www.therobotreport.com/why-you-should-combine-robot-dexterity-with-mechanical-positioning-for-complex-assembly-operations/", "summary": "<p>Experts are recognizing the importance of mechanical positioning and its impact on the machine’s mobility, range and speed.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/why-you-should-combine-robot-dexterity-with-mechanical-positioning-for-complex-assembly-operations/\">Why you should combine robot dexterity with mechanical positioning for complex assembly operations<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Luxonis closes Series A round to scale physical AI perception layer", "source": "Robotics Business Review", "date": "2026-07-02", "url": "https://www.therobotreport.com/luxonis-closes-series-a-round-to-scale-physical-ai-perception-layer/", "summary": "<p>Luxonis said it plans to scale production of its OAK camera and refine its platform to support robotics and industrial automation. <\/p>\n<p>The post <a href=\"https://www.therobotreport.com/luxonis-closes-series-a-round-to-scale-physical-ai-perception-layer/\">Luxonis closes Series A round to scale physical AI perception layer<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Automate 2026 show recap", "source": "Robotics Business Review", "date": "2026-07-02", "url": "https://www.therobotreport.com/automate-2026-show-recap/", "summary": "<p>Editors Steve Crowe, Mike Oitzman, and Sarah Wynn review Automate 2026, analyzing key trends in physical AI, humanoids, and software orchestration.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/automate-2026-show-recap/\">Automate 2026 show recap<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Apptronik unveils Apollo 2 and a flagship data collection and training facility", "source": "Robotics Business Review", "date": "2026-07-01", "url": "https://www.therobotreport.com/apptronik-unveils-apollo-2-flagship-data-collection-training-facility/", "summary": "<p>Built as a data collection and training platform, Apollo 2 enables continuous learning through deployment, Apptronik said.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/apptronik-unveils-apollo-2-flagship-data-collection-training-facility/\">Apptronik unveils Apollo 2 and a flagship data collection and training facility<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Top 10 robotics developments of June 2026", "source": "Robotics Business Review", "date": "2026-07-01", "url": "https://www.therobotreport.com/top-10-robotic-stories-june-2026/", "summary": "<p>Humanoid robots made many headlines in June 2026, whether it be for companies going public, new deployments, or hitting production milestones.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/top-10-robotic-stories-june-2026/\">Top 10 robotics developments of June 2026<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "In Robotics, Ruggedization Is No Longer Optional", "source": "Robotics Business Review", "date": "2026-07-01", "url": "https://www.therobotreport.com/in-robotics-ruggedization-is-no-longer-optional/", "summary": "<p>As autonomy moves beyond controlled environments, ruggedized design is becoming a prerequisite for reliable robotic operations.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/in-robotics-ruggedization-is-no-longer-optional/\">In Robotics, Ruggedization Is No Longer Optional<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Sonair ADAR One 3D ultrasonic sensor is now safety-certified", "source": "Robotics Business Review", "date": "2026-06-30", "url": "https://www.therobotreport.com/sonair-3d-ultrasonic-sensor-is-now-safety-certified/", "summary": "<p>Sonair says ADAR One was assessed as a human detection sensor according to the IEC 61496 standard for electrosensitive protection devices.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/sonair-3d-ultrasonic-sensor-is-now-safety-certified/\">Sonair ADAR One 3D ultrasonic sensor is now safety-certified<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Queue raises funding to build fully autonomous pharmacy", "source": "Robotics Business Review", "date": "2026-06-30", "url": "https://www.therobotreport.com/queue-raises-funding-fully-autonomous-pharmacy/", "summary": "<p>Queue is developing automated pharmacies to expand access to prescriptions in hospitals, retail sites, and underserved communities.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/queue-raises-funding-fully-autonomous-pharmacy/\">Queue raises funding to build fully autonomous pharmacy<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Soft, robotic cells from morph embed physical AI into hardware", "source": "Robotics Business Review", "date": "2026-06-30", "url": "https://www.therobotreport.com/soft-robotic-cells-from-morph-embed-physical-ai-into-hardware/", "summary": "<p>morph launched a physically intelligent soft robotics platform that designs and manufactures what it calls “soft robotic cells.” <\/p>\n<p>The post <a href=\"https://www.therobotreport.com/soft-robotic-cells-from-morph-embed-physical-ai-into-hardware/\">Soft, robotic cells from morph embed physical AI into hardware<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "How Jaiveer Singh Is Helping Robots — and Developers — Move Faster", "source": "NVIDIA Robotics", "date": "2026-06-30", "url": "https://blogs.nvidia.com/blog/nvidia-life-jaiveer-singh/", "summary": "When Jaiveer Singh talks about robots, he doesn’t begin with spectacle. He begins with infrastructure: the boards inside machines, the software that lets developers see through a robot&#8217;s cameras and the engineering required before a robot can leave a demo floor to do something useful. As a robotics software engineer who leads the team behind [&#8230;]"}, {"title": "Into the Omniverse: Three Workflows for Improving Vision AI Agent Accuracy With Synthetic Data and Fine-Tuning", "source": "NVIDIA Robotics", "date": "2026-06-30", "url": "https://blogs.nvidia.com/blog/vision-ai-agent-skills-omniverse-metropolis/", "summary": "Editor’s note: This post is part of Into the Omniverse, a series focused on how developers, 3D practitioners, and enterprises can transform their workflows using the latest advances in OpenUSD and NVIDIA Omniverse. Vision AI agents are becoming a practical way to automatically turn video data from the physical world into operational intelligence in factories, [&#8230;]"}, {"title": "X Square Robot brings its valuation to $2.8B with four consecutive funding rounds", "source": "Robotics Business Review", "date": "2026-06-30", "url": "https://www.therobotreport.com/x-square-robot-brings-valuation-2-8b-four-consecutive-funding-rounds/", "summary": "<p>X Square Robots' system combines foundation models, robotics hardware, a data pipeline system, and real-world deployments.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/x-square-robot-brings-valuation-2-8b-four-consecutive-funding-rounds/\">X Square Robot brings its valuation to $2.8B with four consecutive funding rounds<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "MBody AI expands service robotics operations to eleven states and Canada", "source": "Robotics Business Review", "date": "2026-06-29", "url": "https://www.therobotreport.com/mbody-ai-expands-service-robotics-operations-eleven-states-canada/", "summary": "<p>MBody AI has deployed its hardware-agnostic Orchestrator platform to Florida and California, with a pilot in Ontario.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/mbody-ai-expands-service-robotics-operations-eleven-states-canada/\">MBody AI expands service robotics operations to eleven states and Canada<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Advantages of hypoid gearing over worm, bevel and bevel-planetary", "source": "Robotics Business Review", "date": "2026-06-29", "url": "https://www.therobotreport.com/advantages-of-hypoid-gearing-over-worm-bevel-and-bevel-planetary/", "summary": "<p>Right-angle gearing often requires engineers to compromise between torque capacity and mechanical efficiency. Hypoid gearing offers a balance of mechanical efficiency, load-carrying capability, and single-stage ratio range.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/advantages-of-hypoid-gearing-over-worm-bevel-and-bevel-planetary/\">Advantages of hypoid gearing over worm, bevel and bevel-planetary<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "BMW Group deploys Figure 03 humanoid after tests with previous version", "source": "Robotics Business Review", "date": "2026-06-29", "url": "https://www.therobotreport.com/bmw-group-deploys-figure-03-humanoid-after-tests-previous-version/", "summary": "<p>The Figure 02 robot supported the production of more than 30,000 BMW X3 vehicles over 11 months in South Carolina.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/bmw-group-deploys-figure-03-humanoid-after-tests-previous-version/\">BMW Group deploys Figure 03 humanoid after tests with previous version<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Firefly Aerospace Operates NVIDIA Jetson in Lunar Orbit for the First Time", "source": "NVIDIA Robotics", "date": "2026-06-29", "url": "https://blogs.nvidia.com/blog/firefly-aerospace-nvidia-jetson-lunar-orbit/", "summary": ""}, {"title": "Insights behind Kinisi’s acquisition by Bear Robotics", "source": "Robotics Business Review", "date": "2026-06-29", "url": "https://www.therobotreport.com/insights-behind-kinisi-acquisition-by-bear-robotics/", "summary": "<p>Brennand Pierce, founder and CEO of Kinisi Robotics, discusses the company's approach to physical AI and its acquisition by Bear Robotics.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/insights-behind-kinisi-acquisition-by-bear-robotics/\">Insights behind Kinisi’s acquisition by Bear Robotics<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "AGIBOT produces 15,000th robot, marking a milestone in embodied AI deployment", "source": "Robotics Business Review", "date": "2026-06-28", "url": "https://www.therobotreport.com/agibot-produces-15000th-robot-marking-milestone-embodied-ai-deployment/", "summary": "<p>AGIBOT has rolled out 15,000 wheeled semi-humanoid robots as it moves from embodied AI from development and production to deployment.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/agibot-produces-15000th-robot-marking-milestone-embodied-ai-deployment/\">AGIBOT produces 15,000th robot, marking a milestone in embodied AI deployment<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "We know how to build smarter robots. Now, we need to learn smarter ways to test them", "source": "Robotics Business Review", "date": "2026-06-27", "url": "https://www.therobotreport.com/we-know-how-to-build-smarter-robots-now-we-need-to-learn-smarter-ways-to-test-them/", "summary": "<p>Atharv Kolhar, a staff test automation engineer at Figure AI, says the robotics industry needs a testing philosophy that scales alongside autonomy. <\/p>\n<p>The post <a href=\"https://www.therobotreport.com/we-know-how-to-build-smarter-robots-now-we-need-to-learn-smarter-ways-to-test-them/\">We know how to build smarter robots. Now, we need to learn smarter ways to test them<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "How compact cobot integration enhances autonomous mobile robot applications", "source": "The Robot Report", "date": "2026-06-27", "url": "https://www.therobotreport.com/how-compact-cobot-integration-enhances-autonomous-mobile-robot-applications/", "summary": "<p>Cobots are quickly shaping the future of warehousing, with their use rising 10-fold from 2018 to 2025, Kassow said.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/how-compact-cobot-integration-enhances-autonomous-mobile-robot-applications/\">How compact cobot integration enhances autonomous mobile robot applications<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Orbbec shows AI-powered vision systems at Automate 2026", "source": "Robotics Business Review", "date": "2026-06-26", "url": "https://www.therobotreport.com/orbbec-shows-ai-powered-vision-systems-automate-2026/", "summary": "<p>Orbbec presented industrial-grade 3D cameras for challenging automation scenarios, as well as AI integration for enhanced robotic perception.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/orbbec-shows-ai-powered-vision-systems-automate-2026/\">Orbbec shows AI-powered vision systems at Automate 2026<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Video Friday: Give Robots a Hand", "source": "IEEE Spectrum Robotics", "date": "2026-06-26", "url": "https://spectrum.ieee.org/video-friday-robot-grippers", "summary": "<img src=\"https://spectrum.ieee.org/media-library/three-fingered-robotic-gripper-arm-crawls-upright-on-a-white-table.gif?id=67036633&amp;width=1245&amp;height=700&amp;coordinates=0%2C0%2C0%2C0\" /><br /><br /><p><span>Video Friday is your weekly selection of awesome robotics videos, collected by your friends at <\/span><em>IEEE Spectrum<\/em><span> robotics. We also post a weekly calendar of upcoming robotics events for the next few months. Please <\/span><a href=\"mailto:automaton@ieee.org?subject=Robotics%20event%20suggestion%20for%20Video%20Friday\">send us your events<\/a><span> for inclusion.<\/span><\/p><h5><a href=\"https://roboticsconference.org/\">RSS 2026<\/a>: 13–17 July 2026, SYDNEY<\/h5><h5><a href=\"https://mrs.fel.cvut.cz/summer-school-2026/\">Summer School on Multi-Robot Systems<\/a>: 29 July–4 August 2026, PRAGUE<\/h5><h5><a href=\"https://actuate.foxglove.dev/\">Actuate 2026<\/a>: 18–19 August 2026, SAN FRANCISCO<\/h5><h5><a href=\"https://2026.ieee-iros.org/\">IROS 2026<\/a>: 27 September–1 October 2026, PITTSBURGH<\/h5><p>Enjoy today’s videos!<\/p><div class=\"horizontal-rule\"><\/div><div><span style=\"display: none;\"> <\/span><\/div><p class=\"rm-anchors\" id=\"yfjuag9w2hg\">The best way of introducing a new <a href=\"https://spectrum.ieee.org/dlr-super-robust-robot-hand\" target=\"_blank\">robot hand<\/a> is to have a disembodied one crawling across a table.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.tangentrobotics.ai/\">Tangent Robotics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"auamgssnyqm\"><em>MIT CSAIL’s Improbable AI Lab Director Pulkit Agrawal explains his “SoftMimic” approach to making robots safer around humans.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://arxiv.org/abs/2510.17792\">SoftMimic<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"uskdotwb0k4\">I now have absolutely no interest in a humanoid robot for my home unless it can do this.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.pndbotics.com/\">PNDbotics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"ueon0tm0jzs\"><em>The <a href=\"https://spectrum.ieee.org/video-friday-heavy-lift-drones\" target=\"_blank\">DARPA Lift Challenge<\/a> is open to the public August 6-9, 2026, at the National Museum of the US Air Force.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.darpa.mil/research/challenges/lift\">DARPA<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"76cusj01dn8\"><em>Getting Digit to step and shuffle around an obstacle on the floor is a real test of reactive footstep planning. Digit has to spot something small and moving, recalculate where to place each foot, and keep working—all without breaking stride or losing balance. That’s the same dynamic footwork Digit uses to navigate clutter and foot traffic on a real warehouse floor.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.agilityrobotics.com/\">Agility Robotics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"9lgujrgb_kq\">This is the most aggressive <a href=\"https://spectrum.ieee.org/firefighting-robot-snake-flies-on-jets-of-water\" target=\"_blank\">firefighting robot<\/a> I’ve ever seen.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.deeprobotics.cn/en\">DEEP Robotics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"rio7kurb53o\">Wait a sec, Dusty can print things on floors besides construction layouts? How is this not in every city, making sidewalks exciting and fun everywhere?!<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.dustyrobotics.com/\">Dusty<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"mtmyfvd4zcw\">I am the first to admit that for US $4,900, the performance of the Unitree R1 is very impressive. But what is it going to do out in the world such that it will give you some sort of return on that investment?<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.unitree.com/R1\">Unitree R1<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"ij93ftr3hqe\">Event cameras are extraordinarily powerful because they can see motion, but what if everything is moving because your camera is moving? Oh no!<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://rpg.ifi.uzh.ch/\">University of Zurich Robotics & Perception Group<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"hleaklk4ixm\"><em>Can we understand whale behavior and language? Harvard SEAS Professor Stephanie Gil explains the possibility of understanding animal language and behavior using AI-driven robots and machine learning.  With ongoing whale research and advancements in artificial intelligence, the potential for animal communication with whales could become a tangible reality.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://react.seas.harvard.edu/\">Harvard SEAS<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"upxxhr8r7-a\"><em>Rodney Brooks, founder and chief technology officer of Robust.AI, sits down with Forbes Assistant Managing Editor Kerry Dolan to discuss how he came up with the idea of the Roomba vacuum cleaner and the future of robotics.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.linkedin.com/posts/rodney-brooks-1a137517_how-ants-inspired-this-founder-to-build-a-activity-7475766254587387904-ZsL9/\">LinkedIn<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"h_dtuu5jl3g\">Here are a couple of interesting presentations from UIST 2025, including everyday objects that move around your home with a mind of their own and a project featuring teamwork between helium balloons and ground robots called Buoyancé.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p class=\"shortcode-media shortcode-media-youtube\"> <span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://programs.sigchi.org/uist/2025\">UIST 2025<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div>"}, {"title": "General Intuition raises $320M to use video game data to train robots", "source": "Robotics Business Review", "date": "2026-06-26", "url": "https://www.therobotreport.com/general-intuition-raises-320m-uses-video-game-data-train-robots/", "summary": "<p>General Intuition is using video game clips with embedded action labels to speed up AI training for robotics. <\/p>\n<p>The post <a href=\"https://www.therobotreport.com/general-intuition-raises-320m-uses-video-game-data-train-robots/\">General Intuition raises $320M to use video game data to train robots<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "ARM Institute expands RoboticsCareer.org into physical AI", "source": "Robotics Business Review", "date": "2026-06-25", "url": "https://www.therobotreport.com/arm-institute-launches-physical-ai-focused-expansion-roboticscareer-org/", "summary": "<p>RoboticsCareer.org now lists the growing job opportunities in physical AI and enables employers to connect to qualified talent.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/arm-institute-launches-physical-ai-focused-expansion-roboticscareer-org/\">ARM Institute expands RoboticsCareer.org into physical AI<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Hirebotics offers no-code, explosion-proof cobot for painting", "source": "Robotics Business Review", "date": "2026-06-25", "url": "https://www.therobotreport.com/hirebotics-offers-no-code-explosion-proof-cobot-for-painting/", "summary": "<p>Hirebotics' Cobot Painter supports stationary painting, with parts placed in a paint booth where robots perform all spraying operations.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/hirebotics-offers-no-code-explosion-proof-cobot-for-painting/\">Hirebotics offers no-code, explosion-proof cobot for painting<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Robust.AI chooses Aptiv PULSE sensor for Gen 3 Carter mobile robot", "source": "Robotics Business Review", "date": "2026-06-25", "url": "https://www.therobotreport.com/robust-ai-chooses-aptiv-pulse-sensor-for-gen-3-carter-mobile-robot/", "summary": "<p>Aptiv provides sensor fusion from radar and vision using AI to enable Robust.AI's Carter robot to move safely around people.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/robust-ai-chooses-aptiv-pulse-sensor-for-gen-3-carter-mobile-robot/\">Robust.AI chooses Aptiv PULSE sensor for Gen 3 Carter mobile robot<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Deep dive into Arm’s physical AI and robotics strategies with Drew Henry", "source": "Robotics Business Review", "date": "2026-06-24", "url": "https://www.therobotreport.com/deep-dive-into-arms-physical-ai-and-robotics-strategies-with-drew-henry/", "summary": "<p>Arm EVP Drew Henry discusses the future of physical AI, robotics, and autonomous systems built for real-world constraints.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/deep-dive-into-arms-physical-ai-and-robotics-strategies-with-drew-henry/\">Deep dive into Arm&#8217;s physical AI and robotics strategies with Drew Henry<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}], "embeddedNews": [{"title": "How Film Industry Data Website The-Numbers.com got Mauled by Bots", "source": "Hackaday", "date": "2026-07-26", "url": "https://hackaday.com/2026/07/25/how-film-industry-data-website-the-numbers-com-got-mauled-by-bots/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"443\" src=\"https://hackaday.com/wp-content/uploads/2026/07/the-numbers_traffic_analysis_april_2026.png?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>A lot has been made about the increase of automated traffic on the Internet, with the past years LLM-related crawlers having quite literally swarmed the picture here. Not only does <a class=\"read-more\" href=\"https://hackaday.com/2026/07/25/how-film-industry-data-website-the-numbers-com-got-mauled-by-bots/\">&#8230;read more<\/a>"}, {"title": "Building A Fencing Scoring Box", "source": "Hackaday", "date": "2026-07-26", "url": "https://hackaday.com/2026/07/25/building-a-fencing-scoring-box/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"449\" src=\"https://hackaday.com/wp-content/uploads/2026/07/FEL79YIMRTU30F1_b6ad7c-e1784872569456.webp?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>The sport of fencing requires keeping score, just like so many other similar pastimes. When their club&#8217;s existing scoring rig broke, [jc0025] stepped up to build a scoring box of <a class=\"read-more\" href=\"https://hackaday.com/2026/07/25/building-a-fencing-scoring-box/\">&#8230;read more<\/a>"}, {"title": "Taking Tri-Camera True-Color Infrared Videos", "source": "Hackaday", "date": "2026-07-25", "url": "https://hackaday.com/2026/07/25/taking-tri-camera-true-color-infrared-videos/", "summary": "<div><img alt=\"An image of skyscrapers over a bay is shown, with some foliage along the bank. The sky and water are a pale blue-grey, while the foliage is pink.\" class=\"attachment-large size-large wp-post-image\" height=\"450\" src=\"https://hackaday.com/wp-content/uploads/2026/07/infrared_color_photo.png?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>Silicon-based CMOS camera sensors are cheap and plentiful, but they’re rarely used to their full potential: they can detect a greater range of wavelengths in the infrared spectrum than they <a class=\"read-more\" href=\"https://hackaday.com/2026/07/25/taking-tri-camera-true-color-infrared-videos/\">&#8230;read more<\/a>"}, {"title": "Team Repair Breaks Things to Teach People How to Fix Them", "source": "Hackaday", "date": "2026-07-25", "url": "https://hackaday.com/2026/07/25/team-repair-breaks-things-to-teach-people-how-to-fix-them/", "summary": "<div><img alt=\"A cardboard box (top left), set of instructions (top right), and a disassembled gaming console (bottom half) are strewn across a light blue tabletop, giving the impression that repair is impending.\" class=\"attachment-large size-large wp-post-image\" height=\"500\" src=\"https://hackaday.com/wp-content/uploads/2026/07/Team-Repair-Game-Console-wide.jpg?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>Would you buy a broken device, fix it, then return the repaired item? [Team Repair] hopes you will. Many people would rather repair what they have than have to get <a class=\"read-more\" href=\"https://hackaday.com/2026/07/25/team-repair-breaks-things-to-teach-people-how-to-fix-them/\">&#8230;read more<\/a>"}, {"title": "3D On The Playdate Handheld", "source": "Hackaday", "date": "2026-07-25", "url": "https://hackaday.com/2026/07/25/3d-on-the-playdate-handheld/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"450\" src=\"https://hackaday.com/wp-content/uploads/2026/07/Playdate-game-prototype-0-12-screenshot-e1784867241314.png?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>The Playdate is a small handheld console with a dedicated fanbase. Among them is [Cristina Ramos], who recently decided to try and push the limits of the hardware by implementing <a class=\"read-more\" href=\"https://hackaday.com/2026/07/25/3d-on-the-playdate-handheld/\">&#8230;read more<\/a>"}, {"title": "Add Sensors to Everything!", "source": "Hackaday", "date": "2026-07-25", "url": "https://hackaday.com/2026/07/25/add-sensors-to-everything/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"484\" src=\"https://hackaday.com/wp-content/uploads/2016/03/beyondmeasure.jpg?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>“You can’t control what you can’t measure” goes the old chestnut. But that’s a little bit negative, in my opinion. Instead, think of the benefits of sprinkling sensors around everywhere: <a class=\"read-more\" href=\"https://hackaday.com/2026/07/25/add-sensors-to-everything/\">&#8230;read more<\/a>"}, {"title": "Repairing a RED Cinema Camera On The Cheap", "source": "Hackaday", "date": "2026-07-25", "url": "https://hackaday.com/2026/07/25/repairing-a-red-cinema-camera-on-the-cheap/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"450\" src=\"https://hackaday.com/wp-content/uploads/2026/07/I-Found-the-Cheapest-Broken-Cinema-Camera-Online.-Can-I-Fix-It_-4-59-screenshot-1.png?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>[ALT CINE] took a punt recently when purchasing a damaged RED Komodo camera online. In functional form, the 6K-capable camera sells for several thousand pounds (or dollars, or euros), whether <a class=\"read-more\" href=\"https://hackaday.com/2026/07/25/repairing-a-red-cinema-camera-on-the-cheap/\">&#8230;read more<\/a>"}, {"title": "Beelink ME Pro 2-bay hybrid NAS gets Wildcat Lake treatment, gains 10GbE and Thunderbolt 4, loses a few M.2 slots", "source": "CNX Software", "date": "2026-07-25", "url": "https://www.cnx-software.com/2026/07/25/beelink-me-pro-2-bay-hybrid-nas-gets-wildcat-lake-treatment-gains-10gbe-and-thunderbolt-4-loses-a-few-m-2-slots/", "summary": "<div><img alt=\"Beelink ME Pro 2-Bay AI NAS Mini PC Intel Wildcat Lake 304\" class=\"attachment-medium size-medium wp-post-image\" height=\"387\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/07/Beelink-ME-Pro-2-Bay-AI-NAS-Mini-PC-Intel-Wildcat-Lake-304-720x387.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Beelink &#8220;ME Pro 2-Bay AI NAS Mini PC Intel Wildcat Lake 304&#8221; offers two SATA bays and one M.2 PCIe Gen4 socket, and is equipped with 16GB DDR5-5600 SO-DIMM memory and 512GB UFS 3.1 storage. It&#8217;s an upgrade to the Beelink ME Pro Intel N95/N150 NAS and mini PC introduced last February. Besides the faster processor, the NAS trades its 5GbE port for a faster 10GbE port, and gains two Thunderbolt 4 ports. One downside, due to the lower number of PCIe lanes in Wildcat Lake processors, is that it now features one M.2 PCIe Gen4 socket, instead of three M.2 PCIe Gen3 sockets, which is somewhat mitigated by the built-in UFS storage. Beelink ME Pro specifications: SoC &#8211; Intel Core 3 304 “Wildcat Lake” 5-core CPU – 1x P-cores @ 1.5/4.3 GHz (Turbo) + 4x LPE-cores @ 1.4/3.3 GHz (Turbo) Cache – 6MB L3 cache GPU – 1-core Intel [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/07/25/beelink-me-pro-2-bay-hybrid-nas-gets-wildcat-lake-treatment-gains-10gbe-and-thunderbolt-4-loses-a-few-m-2-slots/\">Beelink ME Pro 2-bay hybrid NAS gets Wildcat Lake treatment, gains 10GbE and Thunderbolt 4, loses a few M.2 slots<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Early Space Weather Warnings with MAGIC", "source": "Adafruit", "date": "2026-07-25", "url": "https://blog.adafruit.com/2026/07/25/early-space-weather-warnings-with-magic/", "summary": "The MAGIC instrument – the flight instrument that has just been finished and will soon be sent for integration into HENON. It is missing the sensor, which is attached by a wire and will be mounted on a deployable boom. Credit: Harry Lewis/ Imperial College London Licence type: Attribution (CC BY 4.0) via the Royal [&#8230;]"}, {"title": "Voice Recognition and Speech Synthesis on an RPi Pico 2", "source": "Adafruit", "date": "2026-07-25", "url": "https://blog.adafruit.com/2026/07/25/voice-recognition-and-speech-synthesis-on-an-rpi-pico-2/", "summary": "Pete Warden is on a mission to run a full voice interface on a fifty cent chip. This project hasn&#8217;t quite reached that goal but it is well on the way. Uses a Pi Pico with the help of a Adafruit I2S MEMS Microphone Breakout and a Adafruit I2S 3W Class D Amplifier Breakout Most [&#8230;]"}, {"title": "Backyard Squirrel Box With Camera", "source": "Adafruit", "date": "2026-07-25", "url": "https://blog.adafruit.com/2026/07/25/backyard-squirrel-box-with-camera/", "summary": "image via Hey Jude in Living, Instructables &#160; Interacting with local nature can be very fun. Over on Instructables Hey Jude in Living put together a build a nice little home for squirrels that also serves as a squirrel observation opportunity: So, dear remaining readers, as someone who is also up for some squirrel shenanigans, [&#8230;]"}, {"title": "$379.99 BOSGAME E6 ECO mini PC features Intel Core 3 304 Wildcat Lake CPU, 12GB LPDDR5X, 512GB NVMe SSD", "source": "CNX Software", "date": "2026-07-24", "url": "https://www.cnx-software.com/2026/07/24/379-99-bosgame-e6-eco-mini-pc-features-intel-core-3-304-wildcat-lake-cpu-12gb-lpddr5x-512gb-nvme-ssd/", "summary": "<div><img alt=\"BOSGAME E6 ECO\" class=\"attachment-medium size-medium wp-post-image\" height=\"541\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/07/BOSGAME-E6-ECO-720x541.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>BOSGAME E6 ECO is another Wildcat Lake mini PC powered by the penta-core Intel Core 3 304 processor, paired with 12GB LPDDR5X and a 512GB NVMe SSD, and an attractive price tag of $379.99 and up. It also features three video outputs via HDMI 2.0, DisplayPort 1.4, and USB-C ports, dual GbE networking, Wi-Fi 7 and Bluetooth 5.4 wireless connectivity, a 3.5mm audio jack, and five USB ports. BOSGAME E6 ECO mini PC: SoC – Intel Core 3 304 “Wildcat Lake” 5-core CPU – 1x P-cores @ 1.5/4.3 GHz (Turbo) + 4x LPE-cores @ 1.4/3.3 GHz (Turbo) Cache – 6MB L3 cache GPU – 1-core Intel Xe3 Graphics @ 2.3 GHz (9 TOPS) NPU – 15 TOPS Manufacturing processor – Intel 18A System Memory – 12GB LPDDR5x @ 6400MT/s Storage 512GB M.2 NVMe SSD; upgradable to up to 4TB Additional M.2 2242 PCIe Gen4 slot Video Output HDMI 2.0 video [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/07/24/379-99-bosgame-e6-eco-mini-pc-features-intel-core-3-304-wildcat-lake-cpu-12gb-lpddr5x-512gb-nvme-ssd/\">$379.99 BOSGAME E6 ECO mini PC features Intel Core 3 304 Wildcat Lake CPU, 12GB LPDDR5X, 512GB NVMe SSD<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "CirkitScape Top HAT adds extra GPIOs, RS-485, 3-channel ADC, four USB 2.0 ports to Raspberry Pi SBCs", "source": "CNX Software", "date": "2026-07-24", "url": "https://www.cnx-software.com/2026/07/24/cirkitscape-top-hat-adds-extra-gpios-rs-485-3-channel-adc-four-usb-2-0-ports-to-raspberry-pi-sbcs/", "summary": "<div><img alt=\"CIRKITSCAPE Top HAT\" class=\"attachment-medium size-medium wp-post-image\" height=\"463\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/07/CIRKITSCAPE-TopHAT-720x463.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>CirkitScape Top HAT (also written as TopHAT) is a multi-function expansion board for the Raspberry Pi that adds 16 extra GPIOs through an I2C expander, an RS-485 header, a 3-channel, 12-bit ADC, and four extra USB 2.0 ports through a USB hub. The company told us it&#8217;s designed to &#8220;make prototyping, sensing, automation, and real-world Raspberry Pi builds cleaner and easier without stacking as many separate add-ons&#8221;. A Top HAT Sensor Kit is also offered with a few sensors for environmental monitoring builds. CirkitScape Top HAT specifications: Supported SBCs &#8211; Raspberry Pi boards and compatible SBCs with 40-pin GPIO header, including the Pi 5, 4, 3B+, and Zero USB 4x USB 2.0 (480 Mbps) ports 4-port USB 2.0 hub Per-port current-limited switches (500mA per port) I/O Expansion 16x GPIOs via MCP23017 I²C expander Analog Input &#8211; 3-channel 12-bit ADC via ADS1015 chip RS-485 interface via MAX485 half-duplex transceiver Communication Interfaces [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/07/24/cirkitscape-top-hat-adds-extra-gpios-rs-485-3-channel-adc-four-usb-2-0-ports-to-raspberry-pi-sbcs/\">CirkitScape Top HAT adds extra GPIOs, RS-485, 3-channel ADC, four USB 2.0 ports to Raspberry Pi SBCs<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "AMD launches Ryzen AI Embedded X100 processors, Kria AI SoM, and physical AI/robotics developer platform", "source": "CNX Software", "date": "2026-07-24", "url": "https://www.cnx-software.com/2026/07/24/amd-launches-ryzen-ai-embedded-x100-processors-kria-ai-som-and-physical-ai-robotics-developer-platform/", "summary": "<div><img alt=\"AMD Ryzen AI Embedded X100\" class=\"attachment-medium size-medium wp-post-image\" height=\"536\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/07/AMD-Ryzen-AI-Embedded-X100-720x536.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>AMD has announced a range of new AI solutions at Advanced AI 2026, including 6th Gen AMD EPYC CPUs, AMD Instinct MI400 Series GPUs, and AMD Helios AI rackscale solutions designed for data centers. In this article, we&#8217;ll focus instead on embedded and physical AI solutions like the new Ryzen AI Embedded X100 processor family and a new Kria AI SoM integrated into the Kria AI Robotics Developer Platform pairing an X100 embedded CPU with a Kria FPGA. AMD Ryzen AI Embedded X100 AMD first introduced the Ryzen AI Embedded X100 family when it launched the Ryzen AI Embedded P100 family in January 2026, delivering up to 50 TOPS of AI performance. However, at the time there were very few details about the X100 family, just that it would offer higher CPU co latform combines edge AI processing with multimodal sensing to enable battery-powered tracking devices capable of analyzing data locally and transmitting only relevant events, reducing power consumption while providing more [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/emass-bosch-sensortec-collaborate-on-asset-tracking-platform/\">EMASS, Bosch Sensortec Collaborate on Asset Tracking Platform<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "John Park’s CircuitPython Parsec: Bitmaptools Rotozoom ZOOM", "source": "Adafruit", "date": "2026-07-24", "url": "https://blog.adafruit.com/2026/07/24/john-parks-circuitpython-parsec-bitmaptools-rotozoom-zoom/", "summary": "#circuitpythonparsec ZOOM a bitmap with ease using bitmaptools.rotozoom in CircuitPython. code example To learn about CircuitPython: https://circuitpython.org &#160;"}, {"title": "3D Printed Linguo #piday #raspberrypi @Raspberry_Pi", "source": "Adafruit", "date": "2026-07-24", "url": "https://blog.adafruit.com/2026/07/24/3d-printed-linguo-piday-raspberrypi-raspberry_pi/", "summary": "&#8220;They *are* throwing robots.&#8221; carlos3dprint shares how they brought Lisa Simpson&#8217;s Linguo to life with a little help from AI, 3D printing, and a Raspberry Pi. Check out the details on instructables. I built Linguo from The Simpsons as a real 3D printed robot with AI. In the episode, Linguo is the grammar robot Lisa [&#8230;]"}, {"title": "Subscribe to the Adafruit Youtube channel! #Youtube #AdafruitLearnSystem", "source": "Adafruit", "date": "2026-07-24", "url": "https://blog.adafruit.com/2026/07/24/subscribe-to-the-adafruit-youtube-channel-youtube-adafruitlearnsystem-226-3/", "summary": "﻿ ﻿ Are you subscribed to the Adafruit Youtube channel? If you&#8217;re not already subscribed, click here! http://adafru.it/subscribe . It’s a free and easy way to keep up with our newest episodes. Here’s some of what we’re up to. Electronics Show and Tell Wednesdays 7:30pm Electronics show and tell every Wednesday at 7:30pm ET. Adafruit [&#8230;]"}, {"title": "The “Simply” Perfect Clock #piday #raspberrypi", "source": "Adafruit", "date": "2026-07-24", "url": "https://blog.adafruit.com/2026/07/24/the-simply-perfect-clock-piday-raspberrypi/", "summary": "Lee Hutchson went shopping for a clock and he and some specific, but straightforward, wants. He wanted it to just tell the time, accurately, he wanted red digits, and he never wants to set the time&#8230;ever. Basically a red seven-segment self-setting “atomic” clock. After some searching he couldn&#8217;t find that perfect trifecta so he realized [&#8230;]"}, {"title": "Adafruit 16-Channel PWM/Servo HAT & Bonnet for Raspberry Pi #AdafruitLearnSystem", "source": "Adafruit", "date": "2026-07-24", "url": "https://blog.adafruit.com/2026/07/24/adafruit-16-channel-pwm-servo-hat-bonnet-for-raspberry-pi-adafruitlearnsystem/", "summary": "The Raspberry Pi is a wonderful little computer, but one thing it isn&#8217;t very good at is controlling DC Servo Motors &#8211; these motors need very specific and repetitive timing pulses to set the position. Instead of asking the Pi Linux kernel to send these signals, pop on our handy HAT or Bonnet. These boards [&#8230;]"}, {"title": "The Python on Microcontrollers Newsletter: subscribe for free", "source": "Adafruit", "date": "2026-07-24", "url": "https://blog.adafruit.com/2026/07/24/the-python-on-microcontrollers-newsletter-subscribe-for-free-7-24-2/", "summary": "The Python for Microcontrollers Newsletter is the place for the latest news involving Python on hardware (microcontrollers AND single board computers like Raspberry Pi). This ad-free, spam-free weekly email is filled with CircuitPython, MicroPython, and Python information that you may have missed, all in one place! You get a summary of all the software, events, projects, and the latest hardware worldwide once a week, no [&#8230;]"}, {"title": "PI-CAM-IR-A", "source": "Adafruit", "date": "2026-07-24", "url": "https://blog.adafruit.com/2026/07/24/pi-cam-ir-a/", "summary": "image via Studio Wetware &#160; PI-CAM-IR-A is a custom infrared camera inside a 1950s Kodak Duoflex II, via beachKilla on reddit: Build List: Pi Zero 2 W Waveshare 3.5″ Touchscreen IMX219 No-IR 1950’s Kodak Duraflex II Read more"}, {"title": "Mouser Accelerates Innovation with Online Transportation Resource Center for Next-Generation Mobility", "source": "EE Journal", "date": "2026-07-24", "url": "https://www.eejournal.com/industry_news/mouser-accelerates-innovation-with-online-transportation-resource-center-for-next-generation-mobility/", "summary": "July 21, 2026 – Mouser Electronics, Inc., the industry&#8217;s leading New Product Introduction (NPI) distributor with the widest selection of semiconductors and electronic components, is empowering engineers with its comprehensive transportation resource center focused on the technologies reshaping mobility. As systems evolve, engineers must address complex requirements around power management, functional safety, real-time decision-making, and &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/mouser-accelerates-innovation-with-online-transportation-resource-center-for-next-generation-mobility/\">Read More &#8594;<span class=\"screen-reader-text\"> \"Mouser Accelerates Innovation with Online Transportation Resource Center for Next-Generation Mobility\"<\/span><\/a>"}, {"title": "DigiKey and Arduino Unveil Challenge to Award $20,000 in Prizes", "source": "EE Journal", "date": "2026-07-24", "url": "https://www.eejournal.com/industry_news/digikey-and-arduino-unveil-challenge-to-award-20000-in-prizes/", "summary": "THIEF RIVER FALLS, Minn., USA – DigiKey, the global distribution leader of electronic components and automation products, and Arduino, a leader in open-source hardware and software, have launched the Dream Lab Challenge to award winning creators a custom lab with professional-grade test equipment. The it plays a &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/altus-adds-lpkf-cuttingmaster-3290-to-depaneling-portfolio/\">Read More &#8594;<span class=\"screen-reader-text\"> \"Altus Adds LPKF CuttingMaster 3290 to Depaneling Portfolio\"<\/span><\/a>"}, {"title": "Darveen Launches EN 50155-Certified TVP-310 Railway Panel PC", "source": "EE Journal", "date": "2026-07-24", "url": "https://www.eejournal.com/industry_news/darveen-launches-en-50155-certified-tvp-310-railway-panel-pc/", "summary": "Darveen, a global leader in industrial computing, today announced the launch of the TVP-310 Railway Touch Panel PC, powered by the latest Intel® Atom® x7433RE processor. Combining high-performance computing, comprehensive connectivity, and industrial-grade reliability in a compact design, the TVP-310 is purpose-built for modern railway applications. Certified to EN 50155, it meets the demanding requirements of &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/darveen-launches-en-50155-certified-tvp-310-railway-panel-pc/\">Read More &#8594;<span class=\"screen-reader-text\"> \"Darveen Launches EN 50155-Certified TVP-310 Railway Panel PC\"<\/span><\/a>"}, {"title": "Drone-in-a-Box Revolution: Inside Birdstop’s Autonomous Aerial Innovation", "source": "EE Journal", "date": "2026-07-24", "url": "https://www.eejournal.com/fish_fry/drone-in-a-box-revolution-inside-birdstops-autonomous-aerial-innovation/", "summary": "<img alt=\"\" class=\"webfeedsFeaturedVisual wp-post-image\" height=\"300\" src=\"https://www.eejournal.com/wp-content/uploads/2026/07/ChatGPT-Image-Jul-22-2026-12_49_42-PM-300x300.png\" style=\"display: block; margin-bottom: 5px; clear: both;\" width=\"300\" />In this week&#8217;s podcast, we&#8217;re diving into the future of autonomous aerial infrastructure Doug Muhlbauer from Birdstop. Doug and I chat about the challenges of building &#8216;drone-in-a-box&#8217; systems, check out what real-world industry adoption looks like, and explore the critical roles that reliability and regulation play in this space and what the future looks like &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/fish_fry/drone-in-a-box-revolution-inside-birdstops-autonomous-aerial-innovation/\">Read More &#8594;<span class=\"screen-reader-text\"> \"Drone-in-a-Box Revolution: Inside Birdstop’s Autonomous Aerial Innovation\"<\/span><\/a>"}, {"title": "Augmental MouthPad is a tongue-controlled touchpad/trackpad", "source": "CNX Software", "date": "2026-07-23", "url": "https://www.cnx-software.com/2026/07/23/augmental-mouthpad-tongue-controlled-touchpad-trackpad/", "summary": "<div><img alt=\"Augmental Mouthpad\" class=\"attachment-medium size-medium wp-post-image\" height=\"355\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/07/Augmental-Mouthpad-720x355.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Check your calendar, everyone! It&#8217;s definitely not April 1st. Now that we have that out of the way, we can start with the main topic of this article. Ready? Augmental MouthPad is a Bluetooth HID device you put into your mouth and control like a touchpad or trackpad, but with your tongue (and head) instead of your fingers. MouthPad is a custom-fit mouthpiece that turns tongue and head movements into HID data to control a phone, a tablet, and a computer like you would normally do with using a mouse, touchpad, or a touchscreen. When I first read about it and saw a short video on X, it felt like a joke, but it can be a lifesaver for people with disabilities. MouthPad specifications: Compatibility &#8211; macOS, Windows, Linux, iOS, Android Connectivity &#8211; Bluetooth Battery 7+ hours of continuous use 1.5 hours charge time Dimensions MouthPad &#8211; About ~30 × [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/07/23/augmental-mouthpad-tongue-controlled-touchpad-trackpad/\">Augmental MouthPad is a tongue-controlled touchpad/trackpad<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "AIS-1000 AI Surveillance Station – A $3,640 NDAA and TAA-compliant AI box based on Raspberry Pi 5 and Hailo-8L", "source": "CNX Software", "date": "2026-07-23", "url": "https://www.cnx-software.com/2026/07/23/ais-1000-ai-surveillance-station-a-3640-ndaa-and-taa-compliant-ai-box-based-on-raspberry-pi-5-and-hailo-8l/", "summary": "<div><img alt=\"AIS-1000 AI Surveillance Station\" class=\"attachment-medium size-medium wp-post-image\" height=\"435\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/07/AIS-1000-AI-Surveillance-Station-720x435.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>If you feel like a cheapskate when purchasing a Raspberry Pi 5 16GB for only $305, there&#8217;s now a solution to avoid embarrassment. Meet the $3,640 AIS-1000 AI Surveillance Station, pairing a Raspberry Pi 5 with a Hailo-8L AI accelerator and a 1TB NVMe SSD, all housed in a metal enclosure. Jokes aside, the device from Planet Technology is real, and users mostly pay for NDAA (National Defense Authorization Act) and TAA (Trade Agreements Act) compliance for use in AI-enhanced surveillance applications for government, critical infrastructure, or other high-security applications. Planet AIS-1000 hardware specifications: SBC &#8211; Raspberry Pi 5 (only advertised features listed) SoC &#8211; Broadcom BCM2712 CPU – Quad-core Arm Cortex-A76 processor @ 2.4 GHz GPU – VideoCore VII GPU @ 800 MHz with support for OpenGL ES 3.1, Vulkan 1.2, 4Kp60 HEVC decoder System Memory – 8GB LPDDR4X-4267 SDRAM Networking &#8211; Gigabit Ethernet RJ45 port via Broadcom BCM54213PE transceiver [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/07/23/ais-1000-ai-surveillance-station-a-3640-ndaa-and-taa-compliant-ai-box-based-on-raspberry-pi-5-and-hailo-8l/\">AIS-1000 AI Surveillance Station &#8211; A $3,640 NDAA and TAA-compliant AI box based on Raspberry Pi 5 and Hailo-8L<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Icy Electronics nRF54L15 Discovery devboard integrates a snappable nRF52820 CMSIS-DAP debugger", "source": "CNX Software", "date": "2026-07-23", "url": "https://www.cnx-software.com/2026/07/23/icy-electronics-nrf54l15-discovery-devboard-integrates-a-snappable-nrf52820-cmsis-dap-debugger/", "summary": "<div><img alt=\"nRF54L15 Discovery Devboard (+ nRF52820 CMSIS DAP)\" class=\"attachment-medium size-medium wp-post-image\" height=\"480\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/07/nRF54L15-Discovery-Devboard-nRF52820-CMSIS-DAP-720x480.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>The nRF54L15 Discovery is a compact wireless devboard with an onboard nRF52820 CMSIS-DAP debugger/programmer for Bluetooth LE, Thread, Zigbee, Matter, NFC, and other 2.4 GHz IoT applications. Its snap-apart design allows the target and interface MCUs to be used as two standalone boards. In the past, we have written about various development boards based on the Nordic nRF54L series, including the Seeed Studio XIAO nRF54L15, XIAO nRF54LM20A (Sense), and the nRF54L15 Connect Kit. The nRF54L15 Discovery board further integrates a snappable nRF52820 CMSIS-DAP debugger/programmer section. It also includes an nPM1300 PMIC with 32–800 mA LiPo battery charging and USB-C PD support, along with a TPS63900 buck-boost converter configurable for 1.8V or 3.3V I/O operation. nRF54L15 Discovery specifications: Wireless MCU – Nordic Semi nRF54L15 wireless SoC CPU Arm Cortex-M33 @ up to 128 MHz RISC-V coprocessor for “software-defined peripheral” Memory – 256 KB SRAM Storage – 1.5MB Non-volatile Memory (NVM) Wireless Bluetooth [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/07/23/icy-electronics-nrf54l15-discovery-devboard-integrates-a-snappable-nrf52820-cmsis-dap-debugger/\">Icy Electronics nRF54L15 Discovery devboard integrates a snappable nRF52820 CMSIS-DAP debugger<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "$99 Xteink X4 Pro 4.3-inch touchscreen eReader to support CrossPoint Reader open-source firmware", "source": "CNX Software", "date": "2026-07-23", "url": "https://www.cnx-software.com/2026/07/23/99-xteink-x4-pro-4-3-inch-touchscreen-ereader-to-support-crosspoint-reader-open-source-firmware/", "summary": "<div><img alt=\"Xteink X4 Pro\" class=\"attachment-medium size-medium wp-post-image\" height=\"613\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/07/Xteink-X4-Pro-720x613.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Xteink X4 Pro is a pocket-sized eReader with a 4.3-inch touchscreen E Ink display, a 16GB microSD card, 2.4 GHz WiFi and Bluetooth wireless connectivity, and a 1100 mAh battery. Previous models like the X3 and X4 e-readers were based on the ESP32-C3 RISC-V microcontroller, but the company has not disclosed which MCU was used in the new X4 Pro model. However, a recent comment on GitHub points to the X4 Pro featuring a more powerful ESP32-S3 microcontroller. Xteink X4 Pro specifications: SoC &#8211; ESP32-S3 microcontroller (TBC) with 2.4 GHz WiFi 4 and Bluetooth wireless connectivity Storage &#8211; 16 GB microSD card; expandable up to 256 GB Display 4.3-inch touchscreen E Ink display; 219 PPI Dual-tone front light Supported Formats (with default firmware) Document: EPUB, TXT Image: JPG, BMP Fonts: BIN, XTF Misc Home touch button Power, Reset, Previous, and Next buttons Built-in magnets for connection to the back of [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/07/23/99-xteink-x4-pro-4-3-inch-touchscreen-ereader-to-support-crosspoint-reader-open-source-firmware/\">$99 Xteink X4 Pro 4.3-inch touchscreen eReader to support CrossPoint Reader open-source firmware<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Low-Power Embedded Design: Are You Optimizing the Wrong Thing?", "source": "Embedded.com", "date": "2026-07-23", "url": "https://www.embedded.com/low-power-embedded-design-are-you-optimizing-the-wrong-thing/", "summary": "<p>Minimizing average current is the key to achieving long battery life.<\/p>\n<p>The post <a href=\"https://www.embedded.com/low-power-embedded-design-are-you-optimizing-the-wrong-thing/\">Low-Power Embedded Design: Are You Optimizing the Wrong Thing?<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "Aetina Adds Jetson T3000 and T2000 Support to Edge AI Systems", "source": "Embedded.com", "date": "2026-07-23", "url": "https://www.embedded.com/aetina-adds-jetson-t3000-and-t2000-support-to-edge-ai-systems/", "summary": "<p>Aetina Corp. plans to expand its edge AI computing portfolio by adding support for Nvidia's newly introduced Jetson T3000 and T2000 system-on-modules (SOMs), extending its existing range of Nvidia Jetson Thor-based platforms. The company will integrate the new modules into its upcoming DeviceEdge AIE-KT fan-based systems and the new DeviceEdge AIE-PT fanless family, providing scalable [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/aetina-adds-jetson-t3000-and-t2000-support-to-edge-ai-systems/\">Aetina Adds Jetson T3000 and T2000 Support to Edge AI Systems<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "Modular Space Ship/Sci-Fi Corridor Wall Set #3DThursday #3DPrinting", "source": "Adafruit", "date": "2026-07-23", "url": "https://blog.adafruit.com/2026/07/23/modular-space-ship-sci-fi-corridor-wall-set-3dthursday-3dprinting/", "summary": "Shared by cale.lebl (BellForged) on MakerWorld: A modular sci-fi terrain wall set for space-themed tabletop gaming and dioramas. Circular portals fit 20mm and 40mm inserts. Compatible with any OpenForge terrain. Designed for anything sci-fi or space-themed. Download the files and learn more Every Thursday is #3dthursday here at Adafruit! The DIY 3D printing community has [&#8230;]"}, {"title": "Adafruit QT PY ESP32-C3 Case – No Buttons Wire Passthrough #3DThursday #3DPrinting", "source": "Adafruit", "date": "2026-07-23", "url": "https://blog.adafruit.com/2026/07/23/adafruit-qt-py-esp32-c3-case-no-buttons-wire-passthrough-3dthursday-3dprinting/", "summary": "Eric_250094 shares: A simple, functional box for the Adafruit QT PY ESP32-C3 (no button cutouts) with wire passthrough openings and an optional solid lid variant. Direct-fit for one of Adafruit&#8217;s most popular tiny form-factor ESP32 boards — perfect for permanent sensor or STEMMA QT deployments. By Eric on Printables download the files on: https://www.printables.com/model/678640-adafruit-qt-py-esp32-c3-case-with-no-buttons Every [&#8230;]"}, {"title": "Verific App Store Opens with Downloadable Examples of Parser Platform Applications", "source": "EE Journal", "date": "2026-07-23", "url": "https://www.eejournal.com/industry_news/verific-app-store-opens-with-downloadable-examples-of-parser-platform-applications/", "summary": "Initial offerings include a hierarchy explorer, linter, HDL editor, signal tracer, essential tools for hardware design and verification Verific App Store opens July 27 as 63rd DAC begins in Long Beach, Calif. ALAMEDA, CALIF. –– July 22, 2026 ––  Verific Design Automation today announced the Verific App Store with a toolkit and downloadable example applications &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/verific-app-store-opens-with-downloadable-examples-of-parser-platform-applications/\">Read More &#8594;<span class=\"screen-reader-text\"> \"Verific App Store Opens with Downloadable Examples of Parser Platform Applications\"<\/span><\/a>"}, {"title": "Hackster launches Modern Java in the Wild Challenge", "source": "EE Journal", "date": "2026-07-23", "url": "https://www.eejournal.com/industry_news/hackster-launches-modern-java-in-the-wild-challenge/", "summary": "PHOENIX – July 23, 2026: Hackster.io, an Avnet community, has launched Modern Java in the Wild, a US-focused design challenge encouraging developers, engineers and makers to create innovative applications using Java 26, the latest release of the Java programming language. Open through August 16, 2026, the competition invites participants to develop solutions that address real-world &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/hackster-launches-modern-java-in-the-wild-challenge/\">Read More &#8594;<span class=\"screen-reader-text\"> \"Hackster launches Modern Java in the Wild Challenge\"<\/span><\/a>"}, {"title": "Keysight Addresses Cross-Domain Physics Issues That Leave Electronic Designs Vulnerable to Late-Stage Failure", "source": "EE Journal", "date": "2026-07-23", "url": "https://www.eejournal.com/industry_news/keysight-addresses-cross-domain-physics-issues-that-leave-electronic-designs-vulnerable-to-late-stage-failure/", "summary": "Keysight Technologies (NYSE: KEYS) today announced Keysight Multiphysics, a design and verification solution that addresses the physics interactions driving failure in modern electronic designs. The structural analysis application covering drop, shock, and vibration enables engineering teams to identify and fix problems earlier, before a prototype is built. Electronic products are growing in complexity faster than traditional &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/keysight-addresses-cross-domain-physics-issues-that-leave-electronic-designs-vulnerable-to-late-stage-failure/\">Read More &#8594;<span class=\"screen-reader-text\"> \"Keysight Addresses Cross-Domain Physics Issues That Leave Electronic Designs Vulnerable to Late-Stage Failure\"<\/span><\/a>"}, {"title": "Advanced Energy Launches 1100 W PFC Module with the Industry’s Highest Power Density in a Half-Brick Form Factor", "source": "EE Journal", "date": "2026-07-23", "url": "https://www.eejournal.com/industry_news/advanced-energy-launches-1100-w-pfc-module-with-the-industrys-highest-power-density-in-a-half-brick-form-factor/", "summary": "Advanced Energy Industries, Inc. (Nasdaq: AEIS), a global leader in highly engineered, precision power conversion, measurement and control solutions, today announced a new 1100 W board-mounted power factor correction (PFC) module — the industry&#8217;s first solution of its kind in a half-brick form factor. Advanced Energy’s AIH03ZPFC is designed for applications in industrial, medical, defense &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/advanced-energy-launches-1100-w-pfc-module-with-the-industrys-highest-power-density-in-a-half-brick-form-factor/\">Read More &#8594;<span class=\"screen-reader-text\"> \"Advanced Energy Launches 1100 W PFC Module with the Industry&#8217;s Highest Power Density in a Half-Brick Form Factor\"<\/span><\/a>"}, {"title": "Arduino UNO Q Arcade bundle lets you build a custom retro gaming console for about $90", "source": "CNX Software", "date": "2026-07-22", "url": "https://www.cnx-software.com/2026/07/22/arduino-uno-q-arcade-bundle-lets-you-build-a-custom-retro-gaming-console/", "summary": "<div><img alt=\"Arduino UNO Q Arcade bundle\" class=\"attachment-medium size-medium wp-post-image\" height=\"478\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/07/Arduino-UNO-Q-Arcade-bundle-1-720x478.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Arduino UNO Q Arcade bundle is a kit designed to build a custom retro gaming console. The bundle combines the Arduino UNO Q 4GB SBC with a set of daisy-chainable Modulino I2C modules, allowing users to create a custom game controller without requiring complex wiring or breadboards. The kit relies on Qwiic connectors to daisy-chain the input modules, whose data is then processed by the UNO Q to emulate standard HIDs for gaming or development. The plastic parts can be 3D printed by the user. Arduino UNO Q Arcade bundle contents: Arduino UNO Q 4GB – A Qualcomm Dragonwing QRB2210 SBC with an onboard eMMC, running Debian Linux Modulino Joystick – An I2C node configurable for simulating D-pad inputs or mouse cursor movements Modulino Buttons – An I2C node for mapping single keystrokes, multi-key shortcuts, or mouse clicks Modulino Movement – A 6-axis IMU node for motion-based mouse control Note: [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/07/22/arduino-uno-q-arcade-bundle-lets-you-build-a-custom-retro-gaming-console/\">Arduino UNO Q Arcade bundle lets you build a custom retro gaming console for about $90<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "ACEMAGICIAN Kron K1 mini PC gets low-cost variant with AMD Ryzen R2544 CPU, 8GB DDR4, 256GB SSD", "source": "CNX Software", "date": "2026-07-22", "url": "https://www.cnx-software.com/2026/07/22/acemagician-kron-k1-mini-pc-gets-low-cost-variant-with-amd-ryzen-r2544-cpu-8gb-ddr4-256gb-ssd/", "summary": "<div><img alt=\"AMD Ryzen R2544 mini PC\" class=\"attachment-medium size-medium wp-post-image\" height=\"424\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/07/AMD-Ryzen-R2544-mini-PC-720x424.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Previously offered with AMD Ryzen 5/7/9 CPUs, the ACEMAGICIAN Kron K1 mini PC has now gotten a low-cost version based on the AMD Ryzen R2544 quad-core processor paired with 8GB DDR4 and a 256GB SSD and sold for just $279.99 on Amazon. With everything going up in price, companies are trying to offer more affordable systems. ACEMAGICIAN has decided to use a processor from the Ryzen Embedded R2000 family introduced in 2022 that&#8217;s typically found in industrial-grade modules and motherboards such as the AAEON COM-R2KC6 COM Express module or the Kontron D3723-R mini-ITX motherboar
