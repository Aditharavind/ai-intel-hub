coffee-table-in-cozy-living-room.png?id=67853191&amp;width=1245&amp;height=700&amp;coordinates=0%2C0%2C0%2C0\" /><br /><br /><p><span>Video Friday is your weekly selection of awesome robotics videos, collected by your friends at <\/span><em>IEEE Spectrum<\/em><span> robotics. We also post a weekly calendar of upcoming robotics events for the next few months. Please <\/span><a href=\"mailto:automaton@ieee.org?subject=Robotics%20event%20suggestion%20for%20Video%20Friday\">send us your events<\/a><span> for inclusion.<\/span><\/p><h5><a href=\"https://2026.ieee-iros.org/\">IROS 2026<\/a>: 27 September–1 October 2026, PITTSBURGH<\/h5><h5><a href=\"https://www.corl.org/\">CoRL 2026<\/a>: 9–12 November 2026, AUSTIN, TEXAS<\/h5><h5><a href=\"https://2026.ieee-humanoids.org/\">Humanoids 2026<\/a>: 6–9 December 2026, SANTA CLARA, CALIF.<\/h5><p>Enjoy today’s videos!<\/p><div class=\"horizontal-rule\"><\/div><div><span style=\"display: none;\"> <\/span><\/div><blockquote class=\"rm-anchors\" id=\"e502xyw7e1g\"><em>Life’s better with a little Goose.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.therobotworks.ai/\">The Robot Works<\/a> ]<\/p><p>Thanks, Dave!<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"mai4evtj4dm\">Skydio has introduced the F10, a charmingly lopsided <a href=\"https://spectrum.ieee.org/skydio-camera-drone-autonomous-flying\" target=\"_blank\">fixed-wing drone<\/a>, that uses a robot arm for autonomous launch and capture.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>Unfortunately, based on the frequency of that flashing LED on the drone, this video appears to have sped up the capture (and likely the launch) by a substantial amount.<\/p><p>[ <a href=\"https://www.skydio.com/f10\">Skydio<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"lqdeoreu6bi\">I want a bunch of these little guys. I don’t know what I’d do with them. But I want them.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://freeformrobotics.org/publications/\">Freeform Robotics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"lfkoi0mvwos\"><em>Walking robots are everywhere now…. But 30 years ago, they were brand new. The first ever robot that could walk by itself was the <a href=\"https://spectrum.ieee.org/honda-p2-robot-ieee-milestone\" target=\"_blank\">Honda P2<\/a>. The P2 featured motors and hydraulics in the hips, knees, and ankles to walk around, and weighed over 300 pounds.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://spectrum.ieee.org/honda-p2-robot-ieee-milestone\">IEEE Spectrum<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"lat2rikjhto\"><em>Precision biomimetic dexterous hand, priced from US $6,500.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.unitree.com/Dex2-5\">Unitree<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"jimw_ligkvq\">What if all it took to train a drone to do acrobatics was to tell it whether you like the way it flies?<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://rpg.ifi.uzh.ch/docs/IROS26_Geles_PbRL.pdf\">UZH Robotics and Perception Group<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"ktncpptpsqe\">Why build a <a href=\"https://spectrum.ieee.org/video-friday-robotic-hands-2674168909\" target=\"_blank\">humanoid hand<\/a> when a <a href=\"https://spectrum.ieee.org/aussies-win-amazon-robotics-challenge\" target=\"_blank\">robot hand<\/a> can do stuff like this?<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://generalroboticslab.com/cartesian_handv1\">General Robotics Lab<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"etzdogql56c\"><em>Diane Heinle, a mechanical engineer at Boston Dynamics, answers questions about endurance testing for Stretch, how her team simulates years of wear on robot parts over a brief time in the lab, and why there are bird heads on them.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://bostondynamics.com/blog/ask-a-roboticist-meet-diane/\">Boston Dynamics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"0qus7bzzkas\"><em>ULOHA brings learning from demonstrations to two robot arms working underwater. We developed custom leader–follower hardware and software extending LeRobot to connect teleoperation, demonstration collection, and autonomous manipulation. The video shows the robots lifting objects together, passing objects between arms, opening a container, and catching a sponge as it rises through the water. We also explore how bubbles and action-execution timing affect learned behaviors.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://mertcookimg.github.io/uloha/\">ULOHA<\/a> ]<\/p><p>Thanks, Masato!<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"n6cl5gi0c0u\">Usually, ballbots rely on an internal pendulum, but here’s a different approach.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://generalroboticslab.com/MARBLE\">General Robotics Lab<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"hnlfompekgk\"><em>From long-horizon manipulation to tactile-guided actions, this video highlights selected collaborations that explore what Astribot robots can do.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.astribot.com/en/product\">Astribot<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"vu5w9_nmet4\">This is one of those tasks that looks a little boring but is actually both very tricky and very useful.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://arxiv.org/abs/2509.10979\">HiPeR Lab<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"5u0rzdl7jvi\">That tiny little excavator playing in flour is adorbs.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://arxiv.org/abs/2609.12677v1\">ETH Zurich Robotic Systems Lab<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"vh9ucogdwcm\">How do you fit a humanoid robot into a box?<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.limxdynamics.com/en/products/luna\">LimX Dynamics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"bykyz9qwqcw\">And now, this.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><blockquote><em>At the Opening Ceremony of WorldSkills Shanghai 2026 on 22 September, 19 Unitree humanoid robots performed alongside 120 dancers, presenting the world’s largest-scale performance featuring full-size general-purpose humanoid robots before an audience of more than 10,000 people, with a fully AI-driven autonomous robot cluster performance live-streamed worldwide in real time.<\/em><\/blockquote><p>[ <a href=\"https://unitree.com/\">Unitree<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"fd9mleerkpg\"><em>A microwave box creates a surprisingly tricky vision system challenge: there’s a picture of a microwave on the side of the box, and that microwave has a window. From the camera’s perspective, it’s a box inside a box inside a box.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.picklerobot.com/\">Pickle Robot Company<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"l6bsqc5cccw\">What exactly is Physical AI? Personally I think it’s just what robotics has always been, more or less, except that everything has to have “AI” in it now, so here we are.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.csail.mit.edu/news/\">MIT CSAIL<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"dx_dlmrlh60\"><em>As the evolution of the UR Series, the g‑Series is designed to accelerate how robots are integrated into complete automation systems. It connects more directly with cameras, higher power EOATs, and control systems, eliminating external cabling and hardware to streamline integration. This enables cleaner and faster deployment of advanced automation.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.universal-robots.com/news-and-media/news-center/universal-robots-unveils-gen-7-new-platform-industrial-automation-physical-ai/\">Universal Robots<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div>"}, {"title": "Agility Robotics, maker of Digit humanoid, exploring wheeled robots", "source": "Robotics Business Review", "date": "2026-09-25", "url": "https://www.therobotreport.com/agility-robotics-maker-of-digit-humanoid-exploring-wheeled-robots/", "summary": "<p>Agility Robotics is exploring a range of robot designs and form factors, including wheels, to address different operating environments and customer needs.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/agility-robotics-maker-of-digit-humanoid-exploring-wheeled-robots/\">Agility Robotics, maker of Digit humanoid, exploring wheeled robots<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Amazon to invest $100M in new Indiana manufacturing facility", "source": "Robotics Business Review", "date": "2026-09-25", "url": "https://www.therobotreport.com/amazon-to-invest-100m-in-new-indiana-manufacturing-facility/", "summary": "<p>The new facility will produce products that power Amazon's fulfillment and robotics network across North America.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/amazon-to-invest-100m-in-new-indiana-manufacturing-facility/\">Amazon to invest $100M in new Indiana manufacturing facility<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "General Robotics is betting on modular intelligence, not one robot brain", "source": "Robotics Business Review", "date": "2026-09-25", "url": "https://www.therobotreport.com/general-robotics-is-betting-on-modular-intelligence-not-one-robot-brain/", "summary": "<p>Rather than training one model to do everything, General Robotics composes specialized capabilities—helping robots adapt across tasks and form factors.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/general-robotics-is-betting-on-modular-intelligence-not-one-robot-brain/\">General Robotics is betting on modular intelligence, not one robot brain<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Why you should look beyond the spec sheet when choosing motion architecture", "source": "Robotics Business Review", "date": "2026-09-24", "url": "https://www.therobotreport.com/why-you-should-look-beyond-spec-sheet-when-choosing-motion-architecture/", "summary": "<p>Choosing the right motion architecture is about understanding how the entire system will behave in use, explains Kollmorgen.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/why-you-should-look-beyond-spec-sheet-when-choosing-motion-architecture/\">Why you should look beyond the spec sheet when choosing motion architecture<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Epson introduces AX6 cobot with compact design, no-code programming", "source": "Robotics Business Review", "date": "2026-09-24", "url": "https://www.therobotreport.com/epson-introduces-ax6-cobot-compact-design-no-code-programming/", "summary": "<p>Epson Robots has expanded its six-axis robot line with the AX6, a lightweight force- and power-limited arm.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/epson-introduces-ax6-cobot-compact-design-no-code-programming/\">Epson introduces AX6 cobot with compact design, no-code programming<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "ANYbotics opens the door for inspections with ANYmal robots", "source": "Robotics Business Review", "date": "2026-09-24", "url": "https://www.therobotreport.com/anybotics-opens-the-door-for-inspections-with-anymal-robots/", "summary": "<p>ANYbotics partnered with dormakaba and LEGIC Identsystems to enable the ANYmal quadruped to gain access like a badged employee.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/anybotics-opens-the-door-for-inspections-with-anymal-robots/\">ANYbotics opens the door for inspections with ANYmal robots<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Mexican EPICS in IEEE Team Builds Portable Educational Platform", "source": "IEEE Spectrum Robotics", "date": "2026-09-24", "url": "https://spectrum.ieee.org/epics-in-ieee-portable-educational", "summary": "<img src=\"https://spectrum.ieee.org/media-library/four-young-adult-students-laugh-together-while-one-of-them-holds-a-robot-shaped-like-a-hexagonal-cylinder.jpg?id=67845427&amp;width=1245&amp;height=700&amp;coordinates=0%2C156%2C0%2C157\" /><br /><br /><p>In Guadalajara, Mexico, many high schools have motivated teachers and talented students with an interest in science, technology, engineering, and mathematics, but they lack access to advanced tools such as robotics laboratories. The resources shortfall limits the students’ opportunities for hands-on learning on cutting-edge applications.<\/p><p>A team from <a href=\"https://apps.iteso.mx/web/iteso/inicio\" rel=\"noopener noreferrer\" target=\"_blank\">ITESO, Universidad Jesuita de Guadalajara<\/a>, is working to change that. Through the <a href=\"https://epics.ieee.org\" rel=\"noopener noreferrer\" target=\"_blank\">EPICS in IEEE<\/a> initiative, a multidisciplinary group of 15 engineering students, faculty advisors, and <a href=\"https://www.ieeegdl.org/\" rel=\"noopener noreferrer\" target=\"_blank\">IEEE Guadalajara Section<\/a> volunteers developed RoboMeshA. The portable, self-contained educational platform brings robotics and AI experiences into classrooms.<\/p><p><a href=\"https://spectrum.ieee.org/epics-in-ieee-15th-anniversary\" target=\"_self\">EPICS<\/a> is administered by <a href=\"https://ea.ieee.org\" rel=\"noopener noreferrer\" target=\"_blank\">IEEE Educational Activities<\/a> and funded by the <a href=\"https://www.ieee-ras.org/\" rel=\"noopener noreferrer\" target=\"_blank\">IEEE Robotics and Automation Society<\/a>.<\/p><h2>A mobile laboratory<\/h2><p>Rather than requiring a school to build a dedicated computer lab or install complex software, RoboMeshA<em> <\/em>operates as an all-in-one mobile learning network.<\/p><p>“RoboMeshA brings robotics and AI to students who don’t have access to specialized facilities or preinstalled software,” says team member Fernando Vidal Luna, an IEEE student member and a mechatronics engineering major at ITESO.<\/p><p>Students connect directly to the platform from a user-friendly web browser. They can interact with the robot manually or use its control modes to watch it move and detect and avoid obstacles.<\/p><p>“The project combines mechanical design, embedded systems, control engineering, computer vision, and AI into a single robotic system that functions as a mobile learning laboratory,” says faculty advisor <a href=\"https://www.linkedin.com/in/jorgealizarraga/\" rel=\"noopener noreferrer\" target=\"_blank\">Jorge A. Lizarraga<\/a>.<\/p><p>The team says young students are interested in technology, programming, and robotics but don’t have an opportunity to work with systems that combine mechanics, electronics, software, and control.<\/p><p>“RoboMeshA allows students to see how all these disciplines work together in a tangible and understandable way,” says team member José S. González, who also is studying mechatronics engineering.<\/p><p>The team has built two units and is developing a modular coupling framework to expand the system’s capabilities for research and classroom demonstrations. The structured system design approach connects independent software components while minimizing internal dependencies, enabling four RobotMeshA robots to operate together.<\/p><h2>Overcoming design challenges<\/h2><p>The team faced significant hurdles while designing the project.<\/p><p>“One key challenge involved the robot’s structural design,” Luna says. “It wasn’t only about making a chassis where all the components fit and the design had sufficient stability, rigidity, and weight distribution. It was also about ensuring that the electronics were protected while still being accessible for maintenance, testing, and modifications.”<\/p><p>“It was also challenging to design a platform that could be used by students with different levels of experience,” González adds.<\/p><p class=\"pull-quote\">“When students realize the technology they develop can inspire others and improve lives, engineering becomes far more meaningful.” <strong>—Luis Fernando Luque-Vega<\/strong><\/p><p>The team partnered with the <a href=\"https://www.colomos.ceti.mx/\" target=\"_blank\">CETI Colomos<\/a> and <a href=\"https://prepa.iteso.mx/\" rel=\"noopener noreferrer\" target=\"_blank\">Prepa ITESO<\/a> high schools to validate the platform in classroom settings.<\/p><p>“We wanted the first interactions with the robot to be simple and intuitive,” González says, “such that students could simply power the robot, connect to its network, and begin interacting with it, rather than having to deal with software installation, extensive configuration, or troubleshooting.”<\/p><h2>Engineering with social impact<\/h2><p>Many of the students who participated were from ITESO’s applied professional projects program. The experience offered them <a href=\"https://spectrum.ieee.org/hands-on-projects-career-advice\" target=\"_self\">practical training<\/a> in project management, system integration, and user-centered design.<\/p><p>The team also presented a research paper and a project poster in May at the <a href=\"https://congresossuj.mx/congresos/3er-congreso-de-ingenierias-suj/\" rel=\"noopener noreferrer\" target=\"_blank\">Engineering Congress of the Jesuit University System<\/a>.<\/p><p>“Seeing a design move from a digital model to a physical system was invaluable,” González says. “Working with students from different backgrounds taught us to listen to end users and design for their actual needs.”<\/p><p>Project lead <a href=\"https://www.linkedin.com/in/luis-fernando-luque-vega-289aa348/\" rel=\"noopener noreferrer\" target=\"_blank\">Luis Fernando Luque-Vega<\/a>, an IEEE member, says he’d like the venture to serve as a blueprint for engineering education.<\/p><p>“I hope RoboMeshA<em> <\/em>is adopted by schools, universities, and IEEE student branches across Mexico and internationally as a model for integrating technical innovation with community engagement,” Luque-Vega says.<\/p><p>By pairing engineering talent with community service, initiatives such as EPICS in IEEE demonstrate how targeted support can turn academic concepts into real-world solutions.<\/p><p>“When students realize the technology they develop can inspire others and improve lives, engineering becomes far more meaningful,” Luque-Vega says.<\/p><p>For more information on service-learning opportunities, visit the <a href=\"https://epics.ieee.org/\" rel=\"noopener noreferrer\" target=\"_blank\">EPICS website<\/a>.<\/p>"}, {"title": "5 million robots are now at work in factories worldwide, reports the IFR", "source": "Robotics Business Review", "date": "2026-09-24", "url": "https://www.therobotreport.com/5-million-robots-now-working-factories-worldwide-ifr-reports/", "summary": "<p>China still leads the world in industrial robot installations, but the U.S. and Germany are also significant markets, found the IFR.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/5-million-robots-now-working-factories-worldwide-ifr-reports/\">5 million robots are now at work in factories worldwide, reports the IFR<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Qualcomm to acquire PickNik Robotics and keep MoveIt open-source", "source": "Robotics Business Review", "date": "2026-09-23", "url": "https://www.therobotreport.com/qualcomm-acquires-picknik-robotics-keep-moveit-open-source/", "summary": "<p>Qualcomm plans to integrate the Dragonwing and Arduino platforms with the MoveIt open-source manipulation framework.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/qualcomm-acquires-picknik-robotics-keep-moveit-open-source/\">Qualcomm to acquire PickNik Robotics and keep MoveIt open-source<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Helicon brings automation to high-volume composites manufacturing", "source": "Robotics Business Review", "date": "2026-09-23", "url": "https://www.therobotreport.com/helicon-brings-automation-high-volume-composites-manufacturing/", "summary": "<p>Helicon has obtained seed funding to use automation to cut composite manufacturing lead times from months to weeks.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/helicon-brings-automation-high-volume-composites-manufacturing/\">Helicon brings automation to high-volume composites manufacturing<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "State of Humanoids keynote brings industry leaders to RoboBusiness", "source": "Robotics Business Review", "date": "2026-09-23", "url": "https://www.therobotreport.com/state-of-humanoids-keynote-brings-industry-leaders-robobusiness/", "summary": "<p>At RoboBusiness, industry leaders will discuss the state of humanoids as the robots transition from demos to real industrial deployments.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/state-of-humanoids-keynote-brings-industry-leaders-robobusiness/\">State of Humanoids keynote brings industry leaders to RoboBusiness<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "With the new VENTUNO Q board, Arduino hopes to make robotics development easier", "source": "Robotics Business Review", "date": "2026-09-23", "url": "https://www.therobotreport.com/new-ventuno-q-board-arduino-hopes-make-robotics-development-easier/", "summary": "<p>While this is the first intentional step by Arduino into robotics, the company has over 20 years of experience working with robotics developers.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/new-ventuno-q-board-arduino-hopes-make-robotics-development-easier/\">With the new VENTUNO Q board, Arduino hopes to make robotics development easier<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Barbara Mazzolai Wants to Build a New Field of Robotics", "source": "IEEE Spectrum Robotics", "date": "2026-09-22", "url": "https://spectrum.ieee.org/sustainability-robotics-barbara-mazzolai", "summary": "<img src=\"https://spectrum.ieee.org/media-library/photo-of-a-woman-standing-in-front-of-greenery-holding-a-device-shaped-like-a-small-octopus-arm.png?id=67787635&amp;width=1245&amp;height=700&amp;coordinates=0%2C0%2C0%2C0\" /><br /><br /><p>Throughout her career, roboticist <a href=\"https://www.iit.it/people-details/-/people/barbara-mazzolai\" rel=\"noopener noreferrer\" target=\"_blank\">Barbara Mazzolai<\/a> has turned to nature for inspiration. Now she wants to ensure the technology she builds gives back to the environment, too.<\/p><p>After starting her career as a biologist, a chance opportunity saw Mazzolai switch streams to engineering and become an early pioneer of <a href=\"https://spectrum.ieee.org/tag/bioinspired-robots\" target=\"_blank\">bioinspired robotics<\/a>. Building on her knowledge of biology’s ability to solve a diverse set of problems, she has developed robots based on octopuses, plant roots, <a href=\"https://opentalk.iit.it/en/iit-the-first-biodegradable-seed-robot-able-to-change-shape-in-response-to-humidity/\" rel=\"noopener noreferrer\" target=\"_blank\">and even seeds<\/a>. “I’ve always been fascinated by living organisms, [and] by the extraordinary variety of solutions in nature, selected by the evolutionary process,” she says.<\/p><h3>Barbara Mazzolai<\/h3><br /><p><strong><\/strong><strong>Employer:<\/strong><\/p><p> Italian Institute of Technology<\/p><p><strong>Occupation: <\/strong><\/p><p>Associate director for robotics; director of the Bioinspired Soft Robotics Laboratory<\/p><p><strong>Education: <\/strong><\/p><p>Master’s degree in biology, University of Pisa; master’s degree in eco-management and audit schemes, Scuola Superiore Sant’Anna; Ph.D. in microsystems engineering, University of Rome Tor Vergata<\/p><p>But Mazzolai, now the associate director for robotics at the <a href=\"https://www.iit.it/\" rel=\"noopener noreferrer\" target=\"_blank\">Italian Institute of Technology, in Genoa<\/a>, also believes engineering needs to <a href=\"https://spectrum.ieee.org/robotics-climate-change\" target=\"_blank\">reckon with its own impact<\/a> on the natural world. That’s why she is advocating for a new field of research she calls “sustainability robotics.”<\/p><p>In a manifesto <a href=\"https://www.nature.com/articles/s42256-026-01260-6\" rel=\"noopener noreferrer\" target=\"_blank\">published in<em><em> Nature Machine Intelligence<\/em><\/em><\/a> in July, she and her collaborators outline a vision for a new approach to designing robots that’s meant to improve the relationship between nature, humanity, and technology.<\/p><p>“We need to reduce the footprint of our technology,” she says. “It’s really about thinking in a different way to open new possibilities for robotics [and] for society.” In this new mode of thinking, Mazzolai considers sustainability a core component of the design.<\/p><h2>A child of nature<\/h2><p>Mazzolai traces her fascination with the living world back to her childhood growing up on Italy’s Tuscan coast, close to the port city Livorno. Her father was a public-health inspector and a professional mycologist, and the family spent a lot of time exploring forests and learning about the local fungi and plants.<\/p><p>After toying with the prospect of pursuing art, her other major passion, Mazzolai ultimately decided to enroll at the <a href=\"https://www.unipi.it/en/\" rel=\"noopener noreferrer\" target=\"_blank\">University of Pisa<\/a> in 1987 to study biology. She was particularly drawn to marine biology, but shortly before graduating with a master’s degree in 1995, she secured a research position at the <a href=\"https://www.cnr.it/en/institute/008/institute-of-biophysics-ibf\" rel=\"noopener noreferrer\" target=\"_blank\">Italian National Research Council’s Institute of Biophysics<\/a> studying the cycles of heavy metals like mercury through both living and nonliving parts of the environment.<\/p><p>This involved collecting and analyzing samples from water, soil, vegetables, and even humans to understand the impact these metals have on health and the environment. She balanced this work with studying environmental management at the <a href=\"https://www.santannapisa.it/it\" rel=\"noopener noreferrer\" target=\"_blank\">Scuola Superiore Sant’Anna<\/a>, in Pisa, graduating with a master’s degree in 1998.<\/p><p>During that time, however, she learned that the university was recruiting biologists to help design new devices for environmental monitoring. She applied for and got the job in 1999 and began working as a research assistant under renowned bioroboticist <a href=\"https://www.embs.org/tbme/past-editorial-board-members/paolo-dario/\" rel=\"noopener noreferrer\" target=\"_blank\">Paolo Dario<\/a>, first developing sensors and then robots meant to monitor air, water, and soil.<\/p><p>Even before entering a doctoral program, Mazzolai was promoted to assistant professor in 2004 and shortly afterward made her first foray into bioinspired robotics. In collaboration with colleagues at Sant’Anna, she helped design a soft robot inspired by the octopus. “We proposed it as a paradigm for launching this idea of soft robotics: demonstrating that [robots] can be soft, but at the same time apply strong force to the environment, like the animal does,” she says.<\/p><h2>Back to school<\/h2><p>In 2007 Mazzolai enrolled in a Ph.D. in microsystems engineering at <a href=\"https://web.uniroma2.it/\" rel=\"noopener noreferrer\" target=\"_blank\">Tor Vergata University of Rome<\/a>, which she balanced with her role at Sant’Anna. She was already relying heavily on microfabrication techniques to develop sensors for her robots, and she was keen to push that part of the field forward.<\/p><p>While robots frequently feature sensors designed for perception, such as tactile or proprioceptive sensors, these systems typically focus on understanding the robot’s position in its environment, she says. “But there are few robots that integrate physical or chemical sensors to really understand the environment they move in,” she adds.<\/p><p class=\"pull-quote\"><span>“I’ve always been fascinated by living organisms, [and] by the extraordinary variety of solutions in nature.”<\/span><\/p><p>Mazzolai was appointed as a team leader at the Center for Micro-BioRobotics of the Italian Institute of Technology in 2009, where she continued her work on the emerging field of bioinspired robotics. Two years later, she completed her Ph.D. and was promoted to director of the center.<\/p><h2>Planting the seeds<\/h2><p>Around this time Mazzolai says she became interested in using plants as a model for new kinds of robots, expanding bioinspiration beyond just animals. In particular, she was captivated by the ability of roots to efficiently explore the underground environment, and she imagined machines with the same deftness could have applications in both environmental modeling and <a href=\"https://spectrum.ieee.org/fertilizer-shortage-precision-agricultur\" target=\"_blank\">precision agriculture<\/a>.<\/p><p class=\"shortcode-media shortcode-media-rebelmouse-image\"> <img alt=\"photo of silver metallic coil wrapped around a green plant vine\" class=\"rm-shortcode\" id=\"305e3\" src=\"https://spectrum.ieee.org/media-library/photo-of-silver-metallic-coil-wrapped-around-a-green-plant-vine.jpg?id=67787644&amp;width=980\" /> <small class=\"image-media media-caption\">While many bioinspired robots mimic animals, plants also serve as a muse for Mazzolai. This tendril-like bot can coil around other structures like a vine. <\/small><small class=\"image-media media-photo-credit\">Italian Institute of Technology<\/small><\/p><p>When she first proposed the idea, colleagues were somewhat skeptical of robots based on seemingly static organisms. But in reality, she says, plants move nonstop through a process known as indeterminate growth. “They really grow for their entire life,” she says. “They adapt their morphology, their behavior to the external environment; they repair, they sense, they communicate.”<\/p><p>Trying to mimic a system that operates on such different principles to conventional robotics required some serious thinking, however. Mazzolai says that working in bioinspired robotics sometimes requires you to have “two separate brains”—one of a biologist and one of an engineer.<\/p><p>The process often involves deep study of the target organism to learn the underlying principles that shape how it operates before trying to engineer a robot capable of mimicking them. “It’s not a copy of natural organisms,” says Mazzolai, because a living organism is both difficult to replicate and has different goals.<\/p><p>In the case of plant roots, what makes them so efficient at exploring the soil is that they reduce friction by growing only at the very fine tip of the structure, while the thicker base of the root remains static. This significantly reduces the amount of energy required to push through the earth compared to that of a more conventional drill, which must push the entire structure from above.<\/p><p>To realize this principle in a robot, her team developed a miniaturized 3D printer that sits at the machine’s tip and feeds thermoplastic filament through a heated nozzle to build a snakelike body behind it. This allows the robot to push through the soil efficiently. The tip also contains sensors that allow it to avoid obstacles and detect nearby nutrients or water.<\/p><h2>Making robotics sustainable<\/h2><p>After spending so much of her career borrowing from nature, Mazzolai is now eager to return the favor. Many modern technologies, including plastics and car batteries, have been developed with little thought about how they will affect the environment at the end of their life cycles, she says.<\/p><p>She wants to ensure that robotics doesn’t follow the same path. This is the inspiration for what she and collaborators now call sustainability robotics. The approach has three central pillars: ensuring that robots have minimal impact on the environment; that they’re available to people from across the world and all socioeconomic backgrounds; and that they’re “symbiotic,” providing benefits to both humans and nature.<\/p><p>More concretely, Mazzolai would like to incorporate the concept of a life cycle into the design of robots, so that at the end of their useful life these machines can be reused, recycled, or even biodegraded.<\/p><p>While that might sound ambitious, she’s confident that all the ingredients to make it a reality are in place. And it’s a vision that she is certain will inspire future roboticists. “There are younger people who want to really work in this field because this is the future, their future,” she says. Facing the threat of ongoing environmental damage, “they want to develop something that can help.”<\/p>"}, {"title": "Intrinsic open sources key parts of its platform for easier development", "source": "Robotics Business Review", "date": "2026-09-22", "url": "https://www.therobotreport.com/intrinsic-open-sources-key-parts-platform-easier-development/", "summary": "<p>With Intrinsic Core, the company is making key parts of its manipulation platform available to robotics developers. <\/p>\n<p>The post <a href=\"https://www.therobotreport.com/intrinsic-open-sources-key-parts-platform-easier-development/\">Intrinsic open sources key parts of its platform for easier development<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "NVIDIA Isaac ROS 5.0 Advances Agentic, Open Source Robotics Development", "source": "NVIDIA Robotics", "date": "2026-09-22", "url": "https://blogs.nvidia.com/blog/isaac-ros-5-0-agentic-open-source-robotics/", "summary": "To build and deploy sophisticated robotics applications that can perceive, reason and act in dynamic environments, developers need new physical AI models and tools. The ROS open framework is a project from Open Robotics that helps humans build robots. NVIDIA Isaac ROS 5.0 — a collection of GPU-accelerated packages built on ROS, released today at [&#8230;]"}, {"title": "Isaac ROS 5.0 brings AI agents to robotics development, says NVIDIA", "source": "Robotics Business Review", "date": "2026-09-22", "url": "https://www.therobotreport.com/isaac-ros-5-0-brings-ai-agents-robotics-development-says-nvidia/", "summary": "<p>The release brings new agentic workflows and platform support to NVIDIA Isaac ROS to help developers deploy robotics applications faster. <\/p>\n<p>The post <a href=\"https://www.therobotreport.com/isaac-ros-5-0-brings-ai-agents-robotics-development-says-nvidia/\">Isaac ROS 5.0 brings AI agents to robotics development, says NVIDIA<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Intel to discuss the infrastructure needed to scale physical AI at RoboBusiness", "source": "Robotics Business Review", "date": "2026-09-22", "url": "https://www.therobotreport.com/intel-discusses-infrastructure-needed-to-scale-physical-ai-robobusiness/", "summary": "<p>Intel's Nagesh Puppala will discuss why the next phase of robotics innovation depends on more than bigger models or better simulations.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/intel-discusses-infrastructure-needed-to-scale-physical-ai-robobusiness/\">Intel to discuss the infrastructure needed to scale physical AI at RoboBusiness<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Why outdoor robots fail (and how to build systems that survive)", "source": "Robotics Business Review", "date": "2026-09-22", "url": "https://www.therobotreport.com/why-outdoor-robots-fail-how-to-build-systems-that-survive/", "summary": "<p>Learn practical strategies for building reliable outdoor robots from WiBotic, Burro, and Nextpower at RoboBusiness in Silicon Valley.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/why-outdoor-robots-fail-how-to-build-systems-that-survive/\">Why outdoor robots fail (and how to build systems that survive)<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Boston Dynamics opens Metaplant Application Center to train Atlas humanoids", "source": "Robotics Business Review", "date": "2026-09-21", "url": "https://www.therobotreport.com/boston-dynamics-opens-metaplant-application-center-train-atlas-humanoid-robots/", "summary": "<p>The new Robotics Metaplant Application Center is training humanoids as part of Hyundai's Metaplant America in Georgia.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/boston-dynamics-opens-metaplant-application-center-train-atlas-humanoid-robots/\">Boston Dynamics opens Metaplant Application Center to train Atlas humanoids<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "IAC completes autonomous racing event at Laguna Seca", "source": "Robotics Business Review", "date": "2026-09-21", "url": "https://www.therobotreport.com/iac-completes-autonomous-racing-event-at-laguna-seca/", "summary": "<p>At Laguna Seca, Unimore Racing won the Indy Autonomous Challenge, marking the IAC's first autonomous car overtakes on a road course.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/iac-completes-autonomous-racing-event-at-laguna-seca/\">IAC completes autonomous racing event at Laguna Seca<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Why Deploying Physical AI at Scale Demands Safety at Every Layer", "source": "NVIDIA Robotics", "date": "2026-09-21", "url": "https://blogs.nvidia.com/blog/physical-ai-halos-safety/", "summary": "Physical AI is moving rapidly from research to large-scale deployment. By 2035, ABI Research projects an installed base of 49 million level 3-5 autonomous vehicles (AVs), while Omdia estimates that roughly 60 million industrial robots will be deployed between 2026 and 2035. As these machines enter roads, factories, warehouses and other environments shared with people, [&#8230;]"}, {"title": "What do you do with a humanoid robot when it breaks down?", "source": "Robotics Business Review", "date": "2026-09-20", "url": "https://www.therobotreport.com/what-do-you-do-with-a-humanoid-robot-when-it-breaks-down/", "summary": "<p>Decommissioning a humanoid robot is not a matter of traditional scrapping. It's a highly technical, high-stakes surgical endeavor.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/what-do-you-do-with-a-humanoid-robot-when-it-breaks-down/\">What do you do with a humanoid robot when it breaks down?<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Hirebotics adds line tracking and linear rail capabilities to its cobots", "source": "Robotics Business Review", "date": "2026-09-19", "url": "https://www.therobotreport.com/hirebotics-adds-line-tracking-linear-rail-capabilities-cobots/", "summary": "<p>Hirebotics said these new capabilities extend the working range of the cobots, giving manufacturers greater flexibility.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/hirebotics-adds-line-tracking-linear-rail-capabilities-cobots/\">Hirebotics adds line tracking and linear rail capabilities to its cobots<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Neptune Medical earns FDA clearance for its Triton 1 robotic system", "source": "Robotics Business Review", "date": "2026-09-18", "url": "https://www.therobotreport.com/neptune-medical-earns-fda-clearance-triton-1-robotic-system/", "summary": "<p>Neptune said Triton can elevate any endoscopist's capabilities for screening, surveillance, and diagnostic colonoscopies.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/neptune-medical-earns-fda-clearance-triton-1-robotic-system/\">Neptune Medical earns FDA clearance for its Triton 1 robotic system<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Icarus Robotics flies ISS-bound robot in microgravity for the first time", "source": "Robotics Business Review", "date": "2026-09-18", "url": "https://www.therobotreport.com/icarus-robotics-flies-iss-bound-robot-in-microgravity-for-the-first-time/", "summary": "<p>This is the last major test of the system before Icarus Robotics will be sending JOY the the ISS in early 2027.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/icarus-robotics-flies-iss-bound-robot-in-microgravity-for-the-first-time/\">Icarus Robotics flies ISS-bound robot in microgravity for the first time<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Video Friday: Two Birotors Make a Quadrotor", "source": "IEEE Spectrum Robotics", "date": "2026-09-18", "url": "https://spectrum.ieee.org/video-friday-quadrotor-from-birotor", "summary": "<img src=\"https://spectrum.ieee.org/media-library/two-small-dual-propeller-robots-facing-each-other-connected-by-a-loose-green-cord.png?id=67790149&amp;width=1245&amp;height=700&amp;coordinates=103%2C0%2C103%2C0\" /><br /><br /><p><span>Video Friday is your weekly selection of awesome robotics videos, collected by your friends at <\/span><em>IEEE Spectrum<\/em><span> robotics. We also post a weekly calendar of upcoming robotics events for the next few months. Please <\/span><a href=\"mailto:automaton@ieee.org?subject=Robotics%20event%20suggestion%20for%20Video%20Friday\">send us your events<\/a><span> for inclusion.<\/span><\/p><h5><a href=\"https://humanoidssummit.com/\">Humanoids Summit Seoul<\/a>: 22–23 September 2026, SEOUL<\/h5><h5><a href=\"https://2026.ieee-iros.org/\">IROS 2026<\/a>: 27 September–1 October 2026, PITTSBURGH<\/h5><h5><a href=\"https://www.corl.org/\">CoRL 2026<\/a>: 9–12 November 2026, AUSTIN<\/h5><p>Enjoy today’s videos!<\/p><div class=\"horizontal-rule\"><\/div><div><span style=\"display: none;\"> <\/span><\/div><p class=\"rm-anchors\" id=\"2o41k1nlo1y\">A <a href=\"https://spectrum.ieee.org/flying-quadrotors-with-your-mind\" target=\"_blank\">quadrotor<\/a> is really just two birotors that love each other very much.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://climb.mie.utoronto.ca/\">CLIMB Lab<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"hsnniqsk2vu\">The last 30 seconds of this video are fantastic.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://tolomeis.github.io/contact-guided-exp/\">ETH Zurich Robotic Systems Lab<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"ljpm_2a1zre\">This is great! But if you really want to impress me, convince me that it’s a) safe to be in my home and 2) a realistic alternative to a human.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.figure.ai/news/helix-2-5-zero-shot-30-home-generalization\">Figure<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"2dbyg67etua\">I doubt anyone would call Digit 5 pretty, but here is what serious <a href=\"https://spectrum.ieee.org/humanoid-robot-safety\" target=\"_blank\">humanoid safety<\/a> looks like.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.agilityrobotics.com/\">Agility<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"setzfvdtc7i\"><em>NYU Tandon researchers built an undulatory robot that pumps water between its head and tail to climb slopes, clear steps, and swim, all while keeping the same basic gait.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><blockquote><em>On an incline, shifting water toward the head increases the force pressing the robot’s front contact points against the surface, giving them more traction. Head-biased placement was the only configuration that successfully carried WorMa up the steepest incline tested, 19.5 degrees; every other configuration slid back down. It also reduced the robot’s cost of transport by at least 33 percent compared with the other configurations.<\/em><br /><em>Steps required something different. Neither a fixed head-heavy nor tail-heavy robot could clear a step on its own. The researchers instead had WorMa approach the step with water in its head for traction, then shifted the water to the tail and raised the head and neck so the tail could push the robot closer. Once the head anchored on the step’s edge, the water shifted back to the head, and the robot continued. That sequence got WorMa over steps as high as 15 centimeters.<\/em><\/blockquote><p>[ <a href=\"https://engineering.nyu.edu/news/robot-shifts-its-own-weight-cross-land-steps-and-water\">NYU Tandon School of Engineering<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"n3obxr3law0\"><em>Kubi 2.0 is a desktop telepresence AI robot that allows remote users to look around and interact as if they were physically present. It is also a Physical AI device enabling AI agents to interact with people in the physical environment. For over the past 10 years in Japan, we have successfully implemented our telepresence solutions to help hospitalized and homebound students attend classes, interact with friends, and participate in school events. Now, we are expanding this initiative globally through Kickstarter.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.kickstarter.com/projects/kubi-2/kubi-20-be-present-from-anywhere\">Kubi 2.0 Telepresence Kickstarter<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"baelsmhwmni\">I am oddly impressed by this use case for a wheeled quadruped.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.accessnewswire.com/newsroom/en/industrial-and-manufacturing/technology-empowers-desertification-control-deep-robotics-robotic-dog-1221078\">DEEP Robotics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"rpkqzo1vshu\"><em>Legged robots are versatile on land, but their use in underwater environments remains limited. Extending quadruped locomotion to water enables amphibious mobility with applications in inspection, environmental monitoring, and disaster response. This paper presents the design, modeling, and experimental validation of a reproducible underwater quadruped robot. The robot is built around custom waterproof motor housings machined from polyoxymethylene plastic, which use off-the-shelf O-rings and dynamic shaft seals. A simplified model is derived to describe the dynamics of this underwater legged system, capturing how drag forces on spherical end effectors transmit torque to the floating base. Building on this model, a closed-loop attitude controller is developed using an error formulation defined on the special orthogonal group SO(3). The controller is evaluated both in simulation and experimentally in a water tank, where the robot tracks desired orientation setpoints in roll, pitch, and yaw.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://ntnu-arl.github.io/underwater-quadruped-robot/\">Norwegian University of Science & Technology Autonomous Robots Lab<\/a> ]<\/p><p>Thanks, Kostas!<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"4ehrwhjw5ha\"><em>Ugo Nova, a domestically produced [in Japan] semi-humanoid robot, accelerates the social implementation of physical AI, from research and development to operation in industrial settings.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://ugo.plus/ai/ugo-nova/\">Ugo<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"tpj1xtgl1nc\">I appreciate how much manipulation you can actually do with a good <a href=\"https://spectrum.ieee.org/robots-getting-a-grip-on-general-manipulation\" target=\"_blank\">two-finger gripper<\/a> and a clever robot.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.dmrobot.com/en/\">Daimon Robotics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"hulfqorvpxa\"><em>One humanoid robot rolls off the line every 10 minutes. UBTECH’s benchmark humanoid robot smart factory just goes live—from 1,000 to 10,000 units, we made the leap in less than 9 months.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>This is great! But what are they all going to do?<\/p><p>[ <a href=\"https://www.ubtrobot.com/en/humanoid/products/walker-s2\">UBTECH<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"ao1u9joxlpk\"><em>MIT engineers have built a robotic optics lab that builds, runs, and dismantles an optics experiment on demand. The setup centers on a robotic arm that physically arranges mirrors, lenses, and other optical components that are each set in custom-designed, QR-encoded housings. The robot arranges each component in precise alignments to direct and focus a beam of light (red laser). The autonomous system could speed up testing of high-tech materials, from solar cells and sensors to video displays and quantum technologies. This video is sped up 2x.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://news.mit.edu/2026/robotic-lab-runs-optics-experiments-on-demand-0917\">MIT<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"nlbijwhuqx4\"><em>Student-built rovers. Lunar terrain. High-stakes competition at NASA’s Kennedy Space Center. See the energy, engineering, and excitement of Lunabotics as university teams put their robotic systems to the test in a simulated lunar environment. These are highlights from the previous competition, as well as a look ahead as teams get ready for Lunabotics 2027.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.nasa.gov/learning-resources/lunabotics-challenge/\">Lunabotics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"gsoci0alw6g\">This CMU Robotics Institute Seminar is by Erol Şahin from METU, on “Augmenting Bee Colonies with Robotics and AI Technologies for Ecosystem Support.”<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><blockquote><em>Earth’s ecosystems are facing a rapid decline in biodiversity, with honeybees—keystone pollinators critical to ecosystem stability—being among the most affected. The EU-funded RoboRoyale project addresses this crisis by integrating advanced robotics and AI to augment the beehive, enabling observation at unprecedented resolutions and scales. Featured on the cover of Science Robotics<\/em><em> and receiving the 6th Edge of Government Award at the World Government Summit in 2024, our system tracks the Queen’s behaviors, colony efficiency, comb states, and long-term foraging activities, while advancing microrobotic intervention capabilities to support hive health. In this talk, I will discuss the challenges of developing this system, share key findings regarding complex social interactions, and explore the future potential of bio-hybrid research.<\/em><\/blockquote><p>[ <a href=\"https://www.ri.cmu.edu/event/augmenting-bee-colonies-with-robotics-and-ai-technologies-for-ecosystem-support/\">Carnegie Mellon University Robotics Institute<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div>"}, {"title": "SoftBank agrees to acquire Robotics and AI Institute", "source": "Robotics Business Review", "date": "2026-09-18", "url": "https://www.therobotreport.com/softbank-agrees-to-acquire-robotics-and-ai-institute/", "summary": "<p>The deal has been rumored for a couple of months, but it is now being reviewed by the Committee on Foreign Investment in the United States.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/softbank-agrees-to-acquire-robotics-and-ai-institute/\">SoftBank agrees to acquire Robotics and AI Institute<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "F-Prime Capital to give insights on the state of robotics investments at RoboBusiness", "source": "Robotics Business Review", "date": "2026-09-18", "url": "https://www.therobotreport.com/f-prime-capital-give-insights-state-robotics-investments-robobusiness/", "summary": "<p>Sanjay Aggarwal and Betsy Mulé of F-Prime Capital will unveil the firm's State of Robotics Investments report at RoboBusiness.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/f-prime-capital-give-insights-state-robotics-investments-robobusiness/\">F-Prime Capital to give insights on the state of robotics investments at RoboBusiness<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "The picks-and-shovels strategy behind the robotics boom", "source": "Robotics Business Review", "date": "2026-09-18", "url": "https://www.therobotreport.com/the-picks-and-shovels-strategy-behind-the-robotics-boom/", "summary": "<p>The real robotics opportunity isn’t a humanoid in every home—it’s packaging robots for the jobs businesses need done today.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/the-picks-and-shovels-strategy-behind-the-robotics-boom/\">The picks-and-shovels strategy behind the robotics boom<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Robotics investments reach $4.9B in August 2026", "source": "Robotics Business Review", "date": "2026-09-17", "url": "https://www.therobotreport.com/robotics-investments-reach-4-9b-in-august-2026/", "summary": "<p>The August 2026 Robotics Investments Report includes a table with all 162 investments rounds, complete with breakdowns by technology, country, funding stage, and more.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/robotics-investments-reach-4-9b-in-august-2026/\">Robotics investments reach $4.9B in August 2026<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Arm Total Design for Physical AI brings more than 80 developers together", "source": "Robotics Business Review", "date": "2026-09-17", "url": "https://www.therobotreport.com/arm-total-design-for-physical-ai-brings-more-than-80-developers-together/", "summary": "<p>With its new program and its Robotics Capability Framework, Arm aims to bring more clarity and unity to the robotics industry.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/arm-total-design-for-physical-ai-brings-more-than-80-developers-together/\">Arm Total Design for Physical AI brings more than 80 developers together<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Designing long-travel axes: When rack and pinion outperforms ball screws and linear motors", "source": "Robotics Business Review", "date": "2026-09-17", "url": "https://www.therobotreport.com/designing-long-travel-axes-when-rack-and-pinion-outperforms-ball-screws-and-linear-motors/", "summary": "<p>When long-travel motion demands more than ball screws and linear motors can deliver, rack-and-pinion systems can offer a compelling combination of speed, precision, scalability, and cost. Here’s when engineers should consider the tradeoff.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/designing-long-travel-axes-when-rack-and-pinion-outperforms-ball-screws-and-linear-motors/\">Designing long-travel axes: When rack and pinion outperforms ball screws and linear motors<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Rethinking Robot Safety in the Age of AI", "source": "IEEE Spectrum Robotics", "date": "2026-09-16", "url": "https://spectrum.ieee.org/physical-ai-robot-cybersecurity-vicone", "summary": "<img src=\"https://spectrum.ieee.org/media-library/humanoid-robots-and-people-walking-through-a-modern-city-street-with-glass-buildings.jpg?id=67745861&amp;width=1200&amp;height=600&amp;coordinates=0%2C62%2C0%2C63\" /><br /><br /><p><em>This article is brought to you by <a href=\"https://vicone.com?utm_source=ieee-spectrum&amp;utm_medium=sponsored-content&amp;utm_campaign=2026-09\" target=\"_blank\">VicOne<\/a>.<\/em><\/p><p>Robot safety has traditionally asked: Can a machine remain safe when something goes wrong? Physical AI raises a harder question: Can a machine remain safe when an attacker changes what it sees, decides, or does even when nothing appears to have failed?<\/p><p>As AI and robotics continue to advance at an unprecedented pace, modern robots perceive through multimodal sensors, interpret context using AI models, and translate those interpretations into physical action. As they move into dynamic environments, their safety increasingly depends on the integrity of the data guiding their decisions.<\/p><p>That dependence creates risks that conventional safety assessments may not fully capture. Recent research has demonstrated that manipulating what a robot sees, hears, or interprets can influence its behavior without requiring direct control.<\/p><p>Such manipulation can occur anywhere across its complex sensing and decision-making system — a layered attack surface encompassing training pipelines, system infrastructure, and runtime perception.<\/p><h2>Layer One: Corrupting intelligence at its source<\/h2><p>In 2017, <a href=\"https://arxiv.org/abs/1708.06733\" rel=\"noopener noreferrer\" target=\"_blank\">BadNets<\/a> demonstrated that a model could behave normally under most conditions, yet fail in the presence of a specific hidden trigger. In one example, a subtle pattern caused a stop sign to be misclassified as a speed limit sign without affecting the model’s behavior on other inputs.<\/p><p>What began as a classification vulnerability has since evolved into action manipulation.<\/p><p>At NeurIPS 2025, researchers introduced <a href=\"https://arxiv.org/abs/2505.16640\" rel=\"noopener noreferrer\" target=\"_blank\">BadVLA<\/a><strong> <\/strong>a backdoor attack targeting Vision-Language-Action (VLA) models that allow robots to see, interpret instructions, and produce coordinated physical movement. Rather than altering a single label, the attack caused conditional deviations in the robot’s action trajectory when a trigger was present. Without the trigger, the model largely preserved normal task performance, while the backdoor remained effective under task transfers and model fine-tuning.<\/p><p>A related study in 2025, <a href=\"https://arxiv.org/abs/2510.09269\" rel=\"noopener noreferrer\" target=\"_blank\">GoBA<\/a>, showed that ordinary objects such as a coffee mug could serve as a reliable trigger. The researchers reported a 97 percent attack success rate without degrading performance on clean inputs.<\/p><p class=\"pull-quote\">A critical safety question today is whether Physical AI models remain within their task and safety boundaries under adversarial conditions.<\/p><p>These studies expose a blind spot in model validation: A model may pass testing yet produce corrupted behavior when a hidden trigger appears in operation.<\/p><p>So a critical safety question today is whether Physical AI models remain within their task and safety boundaries under adversarial conditions. <a href=\"https://vicone.com/company/press-releases/vicone-turns-def-con-34-robot-hacking-research-into-free-nvidia-isaac-sim-extension?utm_source=ieee-spectrum&amp;utm_medium=sponsored-content&amp;utm_campaign=2026-09\" rel=\"noopener noreferrer\" target=\"_blank\">Simulation tools<\/a> such as NVIDIA Isaac Sim, when paired with <a href=\"https://vicone.com/products/radeis?utm_source=ieee-spectrum&amp;utm_medium=sponsored-content&amp;utm_campaign=2026-09\" target=\"_blank\">VicOne Radeis<\/a>, can test the effects of manipulated inputs before deployment.<\/p><p class=\"shortcode-media shortcode-media-youtube\"> <span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span> <small class=\"image-media media-caption\">VicOne LAB R7 demonstrates Radeis, a Physical AI safety validator for NVIDIA Isaac Sim that tests how adversarial visual inputs affect robot behavior before deployment.<\/small><small class=\"image-media media-photo-credit\">VicOne<\/small><\/p><h2>Layer Two: System vulnerabilities as gateways to AI control<\/h2><p>Even a securely trained model can be subverted if the surrounding system stack is vulnerable.<\/p><p>In September 2025, researchers disclosed <a href=\"https://github.com/Bin4ry/UniPwn\" rel=\"noopener noreferrer\" target=\"_blank\">UniPwn<\/a>, a Bluetooth <a href=\"https://spectrum.ieee.org/unitree-robot-exploit\" target=\"_blank\">exploit chain affecting quadruped and humanoid robots<\/a> from a major manufacturer. Hardcoded cryptographic keys allowed traffic decryption, authentication checks were bypassed, and command injection enabled root-level execution. The exploit is also described as “wormable.” A compromised robot could scan nearby units and potentially affect an entire fleet.<\/p><p class=\"shortcode-media shortcode-media-youtube\"> <span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span> <small class=\"image-media media-caption\">VicOne Lab R7’s demo shows how chaining three wireless exploits can trigger uncontrolled robot behavior within 60 seconds, resulting in operational disruption.<\/small><small class=\"image-media media-photo-credit\">VicOne<\/small><\/p><p><span>Middleware creates another exposure point. Vulnerabilities in <a href=\"https://www.ros.org/\" target=\"_blank\">ROS 2<\/a> and DDS-based systems can enable arbitrary code execution or abuse unauthenticated topics to deliver malicious commands. With sufficient access, an attacker could override motor commands or replace AI model weights without directly attacking the model architecture.<\/span><\/p><p>In this case, the components may still function as designed. What has changed is the trustworthiness of the commands flowing through the system. Vulnerability management can help teams identify known risks before deployment, while continuous monitoring can surface emerging threats.<\/p><h2>Layer Three: Manipulating perception and reasoning at runtime<\/h2><p>At runtime, manipulating inputs that shape perception or reasoning may require neither firmware modification nor a network breach.<\/p><p>In 2024, <a href=\"https://robopair.org/\" target=\"_blank\">RoboPAIR<\/a><strong> <\/strong>demonstrated how carefully structured prompts could redirect LLM-controlled robots into unsafe trajectories. <a href=\"https://arxiv.org/abs/2407.20242\" target=\"_blank\">BadRobot<\/a><strong> <\/strong>exposed a deeper architectural weakness: in several cases, a robot verbally refused a dangerous command while its motion controller executed the action anyway.<\/p><p>Vision-based manipulation is equally powerful. <a href=\"https://arxiv.org/abs/2411.13587\" target=\"_blank\">VLAttack<\/a><strong> <\/strong>showed that an adversarial patch within the camera’s view could reduce a VLA model’s task success rate to zero. <a href=\"https://arxiv.org/abs/2509.19870\" target=\"_blank\">FreezeVLA<\/a><strong> <\/strong>showed that a single adversarial image could freeze a robot’s decision-making loop, making it unresponsive to subsequent instructions.<\/p><p class=\"pull-quote\">Runtime assurance must therefore look beyond whether individual components remain available and assess whether cyber events are beginning to affect physical behavior.<\/p><p>In each case, the camera may still work, the model may still run, and the controller may still respond. Yet the resulting behavior can be unsafe because the robot is acting on manipulated perception or reasoning.<\/p><p>Runtime assurance must therefore look beyond whether individual components remain available and assess whether cyber events are beginning to affect physical behavior. Security event correlation, behavioral-impact assessment, and policy-bounded response supported by edge AI, can help contain the affected path without unnecessarily stopping the entire robot fleet.<\/p><h2>From point-in-time safety to lifecycle assurance<\/h2><p>The risks across these three layers reveal the missing layer in robot safety assurance: cybersecurity. Functional safety addresses failures and unexpected operating conditions; cybersecurity extends that assurance to deliberate manipulation, including attacks that may leave the underlying system apparently functional.<\/p><p>This requires assurance across the robot’s lifecycle. During design, teams need to understand which cyber risks could invalidate assumptions behind intended behavior. Before deployment, they should test whether realistic attacks can cause a robot to deviate from its task or safety boundaries. In operation, monitoring should identify whether cyber events are beginning to affect behavior, contain the affected path, and preserve safe operation where possible.<\/p><p class=\"shortcode-media shortcode-media-rebelmouse-image\"> <img alt=\"Diagram of end\\u2011to\\u2011end AI robot security from development to operation monitoring\" class=\"rm-shortcode\" id=\"097ea\" src=\"https://spectrum.ieee.org/media-library/diagram-of-end-u2011to-u2011end-ai-robot-security-from-development-to-operation-monitoring.jpg?id=67745953&amp;width=980\" /> <small class=\"image-media media-caption\">VicOne’s lifecycle approach combines AI model and vulnerability scanning, simulation-based validation, and continuous monitoring to help secure robots from development through operation.<\/small><small class=\"image-media media-photo-credit\">VicOne<\/small><\/p><p><span>While cybersecurity does not replace functional safety, it helps ensure that Physical AI remains within acceptable boundaries even when what it sees, decides, or does is under attack.<\/span><\/p><p>For a deeper look at the cybersecurity risks and defense strategies shaping autonomous robotics, download our whitepaper “<a href=\"https://info.vicone.com/ai-robotics-security-risk-whitepaper?utm_source=ieee-spectrum&amp;utm_medium=sponsored-content&amp;utm_campaign=2026-09\" target=\"_blank\">Securing the Rise of AI Robots: Cyber Risks, Real-World Threats, and Defense Strategies<\/a>.”<\/p>"}, {"title": "The evolution of Digit: Agility Robotics’ journey from Cassie to Digit 5", "source": "Robotics Business Review", "date": "2026-09-16", "url": "https://www.therobotreport.com/the-evolution-of-digit-agility-robotics-journey-from-cassie-to-digit-5/", "summary": "<p>From Cassie, to five different versions of Digit, Agility Robotics has adapted its technology to fit industrial tasks. <\/p>\n<p>The post <a href=\"https://www.therobotreport.com/the-evolution-of-digit-agility-robotics-journey-from-cassie-to-digit-5/\">The evolution of Digit: Agility Robotics&#8217; journey from Cassie to Digit 5<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}], "embeddedNews": [{"title": "2026 Retrocomputing Challenge: Dollhouse Arcade Cabinet Runs Remote DOS Games", "source": "Hackaday", "date": "2026-10-17", "url": "https://hackaday.com/2026/10/17/2026-retrocomputing-challenge-dollhouse-arcade-cabinet-runs-remote-dos-games/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"433\" src=\"https://hackaday.com/wp-content/uploads/2026/10/Micro-DOS-Arcade-Cabinet-2-banner.png?w=770\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"770\" /><\/div>Classic DOS games never ran from within stand-up arcade cabinets in dollhouses, but [Juha Lilja] imagines a world in which they did. His Micro DOS arcade cabinet is described as <a class=\"read-more\" href=\"https://hackaday.com/2026/10/17/2026-retrocomputing-challenge-dollhouse-arcade-cabinet-runs-remote-dos-games/\">&#8230;read more<\/a>"}, {"title": "Building a Flying Drone With a Single Propeller", "source": "Hackaday", "date": "2026-10-17", "url": "https://hackaday.com/2026/10/17/building-a-flying-drone-with-a-single-propeller/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"479\" src=\"https://hackaday.com/wp-content/uploads/2026/10/single_propeller_drone_joshua_bird_youtube.jpg?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>Technically all that you need in order to make a drone fly is a single motor and single propeller, but realistically it becomes basically impossible to fly it at that <a class=\"read-more\" href=\"https://hackaday.com/2026/10/17/building-a-flying-drone-with-a-single-propeller/\">&#8230;read more<\/a>"}, {"title": "2026 Retrocomputing Challenge: Oldputer Gives Old Eyes Relief with E-ink Display", "source": "Hackaday", "date": "2026-10-17", "url": "https://hackaday.com/2026/10/17/2026-retrocomputing-challenge-oldputer-gives-old-eyes-relief-with-e-ink-display/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"468\" src=\"https://hackaday.com/wp-content/uploads/2026/10/Screenshot-2026-10-16-203011.png?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>Modern computers are towers of glass and metal with very few large deviations from one to another. Monitor A will go against B, except you can’t tell them apart unless <a class=\"read-more\" href=\"https://hackaday.com/2026/10/17/2026-retrocomputing-challenge-oldputer-gives-old-eyes-relief-with-e-ink-display/\">&#8230;read more<\/a>"}, {"title": "Discovering SDRs Everywhere", "source": "Hackaday", "date": "2026-10-17", "url": "https://hackaday.com/2026/10/17/discovering-sdrs-everywhere/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"484\" src=\"https://hackaday.com/wp-content/uploads/2020/07/EarlyRadio.jpg?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>To quote commenter [douyarou], “It’s like our little version of a Precambrian explosion”. A bunch of hackers have discovered, independently and building on each other’s work, software-defined radio (SDR) capabilities <a class=\"read-more\" href=\"https://hackaday.com/2026/10/17/discovering-sdrs-everywhere/\">&#8230;read more<\/a>"}, {"title": "SolidCraft is Parametric, Automation-friendly CAD for Desktop and Browser", "source": "Hackaday", "date": "2026-10-17", "url": "https://hackaday.com/2026/10/17/solidcraft-is-parametric-automation-friendly-cad-for-desktop-and-browser/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"450\" src=\"https://hackaday.com/wp-content/uploads/2026/10/rover-poster.jpg?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>If you&#8217;re looking to try a new, open source 3D modeling CAD suite, especially one with automation-friendly interfaces, take a look at SolidCraft. It&#8217;s under development but there&#8217;s support for <a class=\"read-more\" href=\"https://hackaday.com/2026/10/17/solidcraft-is-parametric-automation-friendly-cad-for-desktop-and-browser/\">&#8230;read more<\/a>"}, {"title": "Making One Fender From Another", "source": "Hackaday", "date": "2026-10-17", "url": "https://hackaday.com/2026/10/17/making-one-fender-from-another/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"450\" src=\"https://hackaday.com/wp-content/uploads/2026/10/fenderfender-featured.jpg?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>There&#8217;s a tendency among cherished brands to licence their name and logo onto all sorts of novelty items in order to make a quick buck. Joining this trend is the <a class=\"read-more\" href=\"https://hackaday.com/2026/10/17/making-one-fender-from-another/\">&#8230;read more<\/a>"}, {"title": "TAKTO, Open Source Hand-Tracking Built Like LEGO", "source": "Hackaday", "date": "2026-10-17", "url": "https://hackaday.com/2026/10/16/takto-open-source-hand-tracking-built-like-lego/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"450\" src=\"https://hackaday.com/wp-content/uploads/2026/10/I-Built-a-Robot-Exoskeleton-for-My-Hand-0-20-screenshot.png?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>Hand tracking in VR/AR can add a substantial amount of immersion and added interactivity. Unfortunately, most camera based tracking suffers when fingers get covered, intertwined, or simply out of view <a class=\"read-more\" href=\"https://hackaday.com/2026/10/16/takto-open-source-hand-tracking-built-like-lego/\">&#8230;read more<\/a>"}, {"title": "Seeed Studio XIAO IPS display series features ESP32-S3 or nRF52840 SoC with 0.96-inch to 1.47-inch LCD options", "source": "CNX Software", "date": "2026-10-17", "url": "https://www.cnx-software.com/2026/10/17/seeed-studio-xiao-ips-display-series-features-esp32-s3-or-nrf52840-soc-with-0-96-inch-to-1-47-inch-lcd-options/", "summary": "<div><img alt=\"XIAO IPS Display Series\" class=\"attachment-medium size-medium wp-post-image\" height=\"480\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/09/XIAO-IPS-Display-Series-720x480.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Seeed Studio has introduced the XIAO IPS touch display series, a family of six compact development boards built around the XIAO ESP32-S3 Plus or XIAO nRF52840 Plus MCU, with 0.96-inch, 1.14-inch, and 1.47-inch IPS color displays. All six boards include a 6-axis IMU, a PDM digital microphone, user buttons, and LiPo battery support. The larger 1.47-inch version adds capacitive touch and a microSD card slot, whereas the 1.14-inch model includes a Grove I2C connector for connecting external sensors. The ESP32-S3 versions support Wi-Fi and Bluetooth LE connectivity, while the nRF52840 models focus on lower-power Bluetooth LE applications. The boards are designed for portable dashboards, smart home controllers, wearable devices, sensor monitoring, and other small IoT projects. XIAO IPS Display Series specifications: Wireless board (one or the other) XIAO nRF52840 Plus Wireless MCU –  Nordic nRF52840 Arm Cortex-M4F microcontroller @ up to 64 MHz with 1 MB flash, 256 KB SRAM, Bluetooth 5.0, [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/10/17/seeed-studio-xiao-ips-display-series-features-esp32-s3-or-nrf52840-soc-with-0-96-inch-to-1-47-inch-lcd-options/\">Seeed Studio XIAO IPS display series features ESP32-S3 or nRF52840 SoC with 0.96-inch to 1.47-inch LCD options<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Astrobiologist Answers Mars Questions", "source": "Adafruit", "date": "2026-10-17", "url": "https://blog.adafruit.com/2026/10/17/astrobiologist-answers-mars-questions/", "summary": "Space scientist and astrobiologist Erika DeBenedictis joined WIRED to answer the internet&#8217;s questions about Mars."}, {"title": "Adafruit New Product this Week: Adafruit CP2105 Friend – USB to Dual UART Serial Converters", "source": "Adafruit", "date": "2026-10-17", "url": "https://blog.adafruit.com/2026/10/17/adafruit-new-product-this-week-adafruit-cp2105-friend-usb-to-dual-uart-serial-converters/", "summary": "This week we debuted 1 New Product, the Adafruit CP2105 Friend &#8211; USB to Dual UART Serial Converters. Keep up with all the new at
