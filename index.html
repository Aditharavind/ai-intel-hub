material was all they needed to be able to sense the topology of objects.<\/p><p>In the robotic finger, the Bragg reflector is sandwiched between a layer of silicone, which protects it from the outside, and a transparent, fingertip-shaped silicone finger with a camera and LED light embedded inside of it. <\/p><p>The light from the LED shines through the clear polymer of the finger. When the fingertip is deformed by an object, the reflector bounces light back to the camera, with wavelengths depending on the level of deformation—red for least deformation, shifting to green, and then to blue when most deformed.<\/p><p>The team also made adjustments to increase the sensitivity of the skin and help the camera to better read color differences. The silicone of the outer layer of the fingertip is colored black to increase the color contrast, allowing the camera to better translate color into the morphology. The rigidity of the camera inside the finger also enhances the deformation of the reflector, producing greater differences in reflected wavelengths.<\/p><p>After all that optimization, the finger provided 100-micrometer resolution with no <a href=\"https://spectrum.ieee.org/robot-fingers\" target=\"_blank\">computational<\/a> latency, the researchers determined.<\/p><h2>What robot fingers need<\/h2><p>Human skin takes in a variety of tactile information in order to successfully move and manipulate objects, including temperature, texture, pressure, and vibration. But engineering a robot to do the same is challenging because of spatial constraints. There often isn’t enough room in a robotic fingertip to incorporate more than one type of sensor. The question then becomes: Which type of sensor should be used?<\/p><p>“And the answer to that is…that’s a really hard question. No one knows yet,” says Walker. Carpi’s team’s robotic finger is exciting because it presents yet another option for roboticists to experiment with, Walker says.<\/p><p>Although Carpi’s team <a href=\"https://www.gelsight.com/\" target=\"_blank\">isn’t the first<\/a> to use soft materials for tactile sensing, its technology is unique because it is able to extract quantitative information about depth and size from the topologic maps it generates. According to Walker, most sensors can only generate topological maps, which reveal the relative sizes of object features.<\/p><p>To Sasso, another key advantage of this robotic finger is that it embeds tactile sensing directly into the material of the finger, rather than using taxels, or pixels that measure force or pressure at specific spatial points. <\/p><p class=\"ieee-inbody-related\">RELATED: <a href=\"https://spectrum.ieee.org/robot-fingers\" target=\"_blank\">Robot Hand Manipulates Complex Objects by Touch Alone<\/a><\/p><p>“The core aspect of the sensor is that we’re essentially [moving toward] having the sensing element at the material level,” he says. “The camera, which is a very highly optimized electronic component, is translating whatever the material is already doing directly into digital signals.” <\/p><p><a href=\"https://www.linkedin.com/in/michael-yu-wang-258a4525/\" target=\"_blank\">Michael Wang<\/a>, co-founder and chief scientist at <a href=\"https://spectrum.ieee.org/daimon-robotics-physical-ai\" target=\"_blank\">Daimon Robotics<\/a>, which, unlike Shadow Robot, primarily uses vision-based sensing, echoed Walker’s sentiment that it’s beneficial to explore new methods of sensing, which may bring unique advantages. But he also explained that soft materials often face challenges with durability, and that the significance of the team’s work would be revealed when the finger is integrated into real<a href=\"https://spectrum.ieee.org/robot-fingers\" target=\"_blank\"> robot hands<\/a>.<\/p><p>“The practical and useful benefits, especially in the context of robot hands, remain to be tested and validated,” he says.<\/p><p>When the materials of soft sensors, like the silicone in Carpi’s team’s fingertip, become eroded or damaged after repeated use, the signals measured by the sensors may not reflect objects’ topography as well. <\/p><p>“Especially if you have the electronics embedded into the material layer itself, that becomes a very challenging engineering problem. And I haven’t seen [many] good soft electronics materials that really can undergo long periods of usage,” Wang says.<\/p><p><span>However, because the Bragg reflector isn’t in direct contact with objects itself, the outer layer of silicone material acts as a protective barrier, Sasso says. The silicone can also be made more durable using certain chemical coatings, according to Wang.<\/span><\/p><p>The team has already been talking to companies that could potentially employ the new sensor. They also hope to improve the sensor so that it can sense objects that don’t lie flat on surfaces. That could open up its use in surgical instruments that require precise contact mapping of tissues and organs, Carpi says.<\/p><p>“There are significant developments that we expect with a clear path toward transition to real world applications,” he says.<\/p>"}, {"title": "Agency Tool Company wants to make OTA software updates easier", "source": "Robotics Business Review", "date": "2026-07-28", "url": "https://www.therobotreport.com/agency-tool-company-wants-to-make-ota-software-updates-easier/", "summary": "<p>Two Scythe co-founders are using their experience building commercial robots to create tools for robotics developers at Agency Tool Co.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/agency-tool-company-wants-to-make-ota-software-updates-easier/\">Agency Tool Company wants to make OTA software updates easier<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Powerful Compute So Compact, It’s Clutch — Build AI Anywhere With NVIDIA Jetson", "source": "NVIDIA Robotics", "date": "2026-07-28", "url": "https://blogs.nvidia.com/blog/build-ai-with-nvidia-jetson/", "summary": "As a discerning AI investor who values style and substance, Sarah Guo knows this season’s standout accessory isn’t the latest designer purse — but what’s inside it.  In a recent video, Guo, founder of AI-native venture capital firm Conviction and co-host of the AI podcast No Priors, highlighted how the NVIDIA Jetson platform for edge [&#8230;]"}, {"title": "Registration is open for RoboBusiness 2026", "source": "Robotics Business Review", "date": "2026-07-28", "url": "https://www.therobotreport.com/registration-is-open-for-robobusiness-2026/", "summary": "<p>This year, join us in October in Santa Clara to celebrate 20 years of robotics excellence at RoboBusiness 2026.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/registration-is-open-for-robobusiness-2026/\">Registration is open for RoboBusiness 2026<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "ENvue Medical develops robotic feeding tube placement system", "source": "Robotics Business Review", "date": "2026-07-28", "url": "https://www.therobotreport.com/envue-medical-develops-robotic-feeding-tube-placement-system/", "summary": "<p>ENvue Drive is designed to assist, not replace, the clinician, who retains full control of the procedure at all times.  <\/p>\n<p>The post <a href=\"https://www.therobotreport.com/envue-medical-develops-robotic-feeding-tube-placement-system/\">ENvue Medical develops robotic feeding tube placement system<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "NORD expands compact NORDAC VFD family to 200 hp", "source": "Robotics Business Review", "date": "2026-07-27", "url": "https://www.therobotreport.com/nord-expands-nordac-compact-vfd-family-to-200-hp/", "summary": "<p>NORD Drivesystems said its NORDAC PRO VFDs are adaptable to individual application requirements across industries.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/nord-expands-nordac-compact-vfd-family-to-200-hp/\">NORD expands compact NORDAC VFD family to 200 hp<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Kraken Technology raises Series B funding for autonomous vessels", "source": "Robotics Business Review", "date": "2026-07-27", "url": "https://www.therobotreport.com/kraken-technology-raises-series-b-funding-autonomous-vessels/", "summary": "<p>Kraken Technology plans to use its funding to continue developing uncrewed surface vessels and localizing manufacturing around the world.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/kraken-technology-raises-series-b-funding-autonomous-vessels/\">Kraken Technology raises Series B funding for autonomous vessels<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Magmotor makes motors for a changing world for 150+ years", "source": "Robotics Business Review", "date": "2026-07-26", "url": "https://www.therobotreport.com/magmotor-makes-motors-changing-world-150-years/", "summary": "<p>Magmotor has been providing motors for demanding use cases for decades and offers custom systems for robotics.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/magmotor-makes-motors-changing-world-150-years/\">Magmotor makes motors for a changing world for 150+ years<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Optical Tech Would Update a Robot’s AI on the Fly", "source": "IEEE Spectrum Robotics", "date": "2026-07-26", "url": "https://spectrum.ieee.org/ai-in-robotics", "summary": "<img src=\"https://spectrum.ieee.org/media-library/an-asian-man-positions-the-lens-of-an-optical-receiver-a-meter-away-from-a-beam-of-led-light-in-a-lab.jpg?id=67530602&amp;width=1200&amp;height=800&amp;coordinates=0%2C209%2C0%2C209\" /><br /><br /><p>Atop a lab bench, <a href=\"https://tech.cornell.edu/\" rel=\"noopener noreferrer\" target=\"_blank\">Cornell Tech<\/a> postdoctoral researcher <a href=\"https://www.linkedin.com/in/yifan-he-5471a1386/\" rel=\"noopener noreferrer\" target=\"_blank\">Yifan He<\/a> positions the lens of an optical receiver almost a meter away from an LED emitting a beam of red light. The computer monitor attached to the receiver takes a beat to refresh, then displays an array of squares that resemble a QR code.<\/p><p>When you hold your phone camera up to a QR code, light strikes the image sensor as only a first step to revealing the data hidden behind the black-and-white matrix. The receiver here is doing something different: directly altering its own memory using the photocurrents produced by the beamed array of light. And unlike the data behind a QR code, which might point to a simple web address, this optical code could convey the <a href=\"https://spectrum.ieee.org/sparse-ai\" target=\"_blank\">parameters of an AI model<\/a>. <\/p><p>The new receiver design, presented last month at the <a href=\"https://www.vlsisymposium.org/\" rel=\"noopener noreferrer\" target=\"_blank\">IEEE/JSAP Symposium on VLSI Technology & Circuits<\/a> in Honolulu, seeks to reduce the burden of increasing memory demands on AI systems. Shining data down onto processors could lower the energy typically required for data centers, self-driving cars, and even “edge” applications like AI-powered robots, researchers say. <\/p><p>“People are designing all sorts of different AI chips,” says <a href=\"https://www.linkedin.com/in/jae-sun-seo-21062717/\" rel=\"noopener noreferrer\" target=\"_blank\">Jae-sun Seo<\/a>, an associate professor of electrical and computer engineering at Cornell Tech, in New York City. These processors don’t often have room for all the parameters that make up AI models, so the additional data is stored in dynamic RAM (<a href=\"https://spectrum.ieee.org/stacking-chips-sideways\" target=\"_blank\">DRAM<\/a>). The electrical connections commonly used to move the data between the DRAM and the processor create cost and efficiency concerns when systems scale up. “That’s one of the major bottlenecks.” <\/p><p>Optical links move data at high bandwidth with less energy loss than metal wires, but today’s optical receivers undercut that advantage by relying on power-hungry analog circuits to convert light to electronic bits. The group’s new tech would instead receive rapid flashes of digital QR-code-like matrices so that chips can tweak model parameters without those analog circuits, enabling fully digital optical communication that would consume less energy.<\/p><p>“This is a really important problem,” says <a href=\"https://www.linkedin.com/in/dennis-sylvester-68a938/\" rel=\"noopener noreferrer\" target=\"_blank\">Dennis Sylvester<\/a>, an IEEE Fellow who chairs the <a href=\"https://umich.edu/\" rel=\"noopener noreferrer\" target=\"_blank\">University of Michigan<\/a>’s electrical and computer engineering department and was not involved in the work. “It’s got massive commercial implications. This solution is a clever way of dealing with it.”<\/p><p class=\"shortcode-media shortcode-media-rebelmouse-image\"> <img alt=\"Two Asian men standing in front of a lab desk with a receiver chip, oscilloscope and laptop displaying an optically programmable SRAM-based receiver demo.\" class=\"rm-shortcode\" id=\"b2c1d\" src=\"https://spectrum.ieee.org/media-library/two-asian-men-standing-in-front-of-a-lab-desk-with-a-receiver-chip-oscilloscope-and-laptop-displaying-an-optically-programmable.jpg?id=67530613&amp;width=980\" /> <small class=\"image-media media-caption\">Jae-sun Seo [left] and Yifan He have developed a receiver that can edit memory in response to QR-code-like arrays of light.<\/small><small class=\"image-media media-photo-credit\">Alex Music<\/small><\/p><h2>How Light “Flips” Memory to Power AI<\/h2><p>Processors have a bit of built-in static RAM (<a href=\"https://spectrum.ieee.org/sram-intel-tsmc\" target=\"_blank\">SRAM<\/a>), but not enough to allow an AI model to run independently. While SRAM is the faster of the two memory options, DRAM can store more data in the same footprint.<\/p><p>In the new system, the DRAM sits with the transmitter, and the receiver is part of the processor’s SRAM. The transmitter beams the data to the array of SRAM cells, which in this case are modified to contain photodiodes. Light hitting each photodiode creates a current to flip binary values in the SRAM. <\/p><p>Creating a link between the light and receiver requires calibration, because you can’t expect them to be perfectly aligned or perpendicular to each other. So the chip references a data frame that has information about the expected position of each pixel of data and uses that frame to ensure it can receive the real data, He says. “Ideally the best way is to have direct, point-to-point space between the transmitter and the receiver,” Seo adds, “but even if it’s slightly tilted, we have this calibration circuit.”<\/p><p>For applications in real-world settings, the researchers say they will need to build an optical transmitter that can alter the light matrix millions of times per second, transferring gigabits per second. The transmitter that I saw in He and Seo’s lab is only a proof of concept, emitting a static 14-by-14-bit matrix through a metal mask over the light. The researchers say they are working with optics research groups to build a transmitter that is capable of rapidly changing the matrix. <\/p><h2>The Future of Light-Based Memory Links<\/h2><p>Michigan’s Sylvester says that the tech in its current form is likely far from commercialization because the individual photosensitive bit cells are larger than SRAM bit cells in conventional chips. Those larger cells mean the chip can fit less memory, a trade-off that he says could cancel out the added efficiency of the light-based approach. <\/p><p>Seo says that it’s part of the group’s ongoing efforts to shrink the bit cells, which can be achieved by optimizing the size of transistors and circuits and leveraging CMOS scaling.<\/p><p>Seo and He are looking at uses for the tech in robotics and other edge applications. One example is in AI-robot-powered warehouses and factories, which could use optical data transmission to save time and energy when updating the AI models in each robot. Additionally, <a href=\"https://spectrum.ieee.org/microbots\" target=\"_self\">microrobots<\/a>, which are inherently memory-constrained due to their size, could one day benefit from the tech, though it would require a more size-conscious design.<\/p><p>“Edge AI is a big growth area, and in three, four, five years, you’re going to hear as much about that as you are with data centers, probably, as the intelligence migrates more and more into these devices that we have,” Sylvester says.<\/p>"}, {"title": "Photos: First look at J&J’s Ottava surgical robot", "source": "Robotics Business Review", "date": "2026-07-25", "url": "https://www.therobotreport.com/photos-first-look-at-jjs-ottava-surgical-robot/", "summary": "<p>The robot-in-table design is meant to save space in the operating room, with J&#038;J saying its novel architecture takes up 30-50% less space than boom-and-cart systems.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/photos-first-look-at-jjs-ottava-surgical-robot/\">Photos: First look at J&#038;J&#8217;s Ottava surgical robot<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "NEURA Robotics establishes NEURA Gym RWTH Aachen to train physical AI", "source": "Robotics Business Review", "date": "2026-07-24", "url": "https://www.therobotreport.com/neura-robotics-establishes-neura-gym-rwth-aachen-train-physical-ai/", "summary": "<p>NEURA Robotics has partnered with a German university for NEURA Gym RWTH Aachen, one of 10 facilities for training physical AI.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/neura-robotics-establishes-neura-gym-rwth-aachen-train-physical-ai/\">NEURA Robotics establishes NEURA Gym RWTH Aachen to train physical AI<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Video Friday: An Italian Humanoid Comes to Life", "source": "IEEE Spectrum Robotics", "date": "2026-07-24", "url": "https://spectrum.ieee.org/video-friday-physical-ai-robotics", "summary": "<img src=\"https://spectrum.ieee.org/media-library/humanoid-robot-with-red-armor-and-glowing-lights-stands-against-a-dark-background.png?id=67531350&amp;width=1200&amp;height=800&amp;coordinates=150%2C0%2C150%2C0\" /><br /><br /><p><span>Video Friday is your weekly selection of awesome robotics videos, collected by your friends at <\/span><em>IEEE Spectrum<\/em><span> robotics. We also post a weekly calendar of upcoming robotics events for the next few months. Please <\/span><a href=\"mailto:automaton@ieee.org?subject=Robotics%20event%20suggestion%20for%20Video%20Friday\">send us your events<\/a><span> for inclusion.<\/span><\/p><h5><a href=\"https://mrs.fel.cvut.cz/summer-school-2026/\">Summer School on Multi-Robot Systems<\/a>: 29 July–4 August 2026, PRAGUE<\/h5><h5><a href=\"https://actuate.foxglove.dev/\">Actuate 2026<\/a>: 18–19 August 2026, SAN FRANCISCO<\/h5><h5><a href=\"https://2026.ieee-iros.org/\">IROS 2026<\/a>: 27 September–1 October 2026, PITTSBURGH<\/h5><h5><a href=\"https://humanoidssummit.com/\">Humanoids Summit Seoul<\/a>: 22–23 September 2026, SEOUL<\/h5><p>Enjoy today’s videos!<\/p><div class=\"horizontal-rule\"><\/div><div><span style=\"display: none;\"> <\/span><\/div><blockquote class=\"rm-anchors\" id=\"mgf142yepjc\"><em>In just six months, our team turned GENE.01 into a fully functional humanoid platform that can walk, sense and interact. Its full-body multimodal skin perceives touch, proximity, force, and temperature, bringing Physical AI closer to safe and natural collaboration with people. Not a render. Not a concept. This is GENE.01. The future of Physical AI is taking its first steps.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://gbionics.ai/\">Generative Bionics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"iq3pccrfegq\"><em>Why create robot intelligence for just one hand, when we could have it learn from many? GEN-1, our latest embodied foundation model, now supports a broad range of end effectors from 5-finger hands, to specialized tools, and everything in between. Each hand is a different sensorimotor interface by which GEN-1 experiences the physical world. Scaling pretraining across thousands of these interfaces teaches GEN-1 a universal physical common sense that transfers to new hands and new ways to grasp, push, pull, twist, and more.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>And to illustrate this concept, a surprise spatula.<\/p><p class=\"shortcode-media shortcode-media-youtube\"> <span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://generalistai.com/blog/towards-machines-with-a-thousand-hands\">Generalist<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"gu2nuedjiuq\"><em>This paper presents the design, fabrication, and flight validation of a flat-packable <a href=\"https://spectrum.ieee.org/foldable-airplane-could-ride-a-cubesat-to-mars-in-2022\" target=\"_blank\">flying wing<\/a> built primarily from corrugated cardboard. The aircraft is manufactured from three laser-cut sheets and assembled through a fold-and-lock architecture that forms load-bearing wing structures with minimal tooling and no permanent fasteners. The full airframe can be assembled in under 15 minutes, demonstrating strong potential for rapid deployment, low-cost logistics, and scalable field use.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://airlab.sutd.edu.sg/\">AIR Lab<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"hukrzo75_ww\">A $14,000 open-source data-collection system that includes beat-down capability.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://github.com/haraduka/mevion\">MEVION<\/a> ]<\/p><p>Thanks, Kento!<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"qzr0rmp2_5w\"><em>Together with Niantic Spatial and Nvidia, [we] can now scan a real deployment site with off-the-shelf hardware, reconstruct it into a photorealistic Gaussian splat, and run massively parallel RL [<a href=\"https://spectrum.ieee.org/ai-institute\" target=\"_blank\">reinforcement learning<\/a>] training. The policies trained in our Gym environment then transfer zero-shot to the real robot and environments they were trained for. This enables faster deployment of more capable and robust policies for the end user.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://flexion.ai/news/niantic-spatial-flexion-and-nvidia-closing-the-sim2real-gap-for-humanoids\">Flexion<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"w2bmy5cnhvs\">I don’t know why, but the version of Tron 2 with the stubby little legs is just adorable.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.limxdynamics.com/en/products/tron2\">LimX Dynamics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"vmgiim6g_fg\">Uh, get a real job already...?<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.pndbotics.com/\">PNDbotics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"xtggy9lrisw\">Well, I guess we can all stop asking what humanoid robots are good for.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://en.engineai.com.cn/\">EngineAI<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"143b_pm77ga\">I think the right thing to do here is only post the disclaimer included with this video: “This film is a conceptual creative production, and certain scenes are presented for demonstration purposes only and do not represent the actual in-store operating process. The final store environment, robot appearance, and functionality are subject to the actual deployment. During actual operations, the robot will autonomously perform only designated preparation steps for specified ice cream products, and its hands will be fitted with protective gloves that comply with applicable food safety requirements.”<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.sharpa.com/pages/north-at-work\">Sharpa<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"h_ztrvhjv8k\"><em><a href=\"https://spectrum.ieee.org/in-the-air-with-ziplines-medical-delivery-drones\" target=\"_blank\">Drone delivery<\/a> is now an essential part of the South West London Pathology (SWLP) modernization agenda. Since February 2026, our highly automated aircraft have been delivering urgent NHS samples across south west London, with service up to 85% faster than ground transport. We are thrilled to be part of this initiative, supporting clinicians in providing timely, effective care for patients and contributing to a greener, more resilient NHS.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://wing.com/news/elevating-healthcare-logistics-wing-apian-nhs-south-west-london-drone-deliveries\">Wing<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"tzpswti20e8\"><em>Take a closer look at what’s next for the Aurora Driver. Designed to move freight farther, faster, and more efficiently, this next generation of the Aurora Driver delivers greater performance, built to last one million miles and cut hardware cost in half. <\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://aurora.tech/newsroom/your-questions-about-our-latest-driverless-launch-answered\">Aurora<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"gj4p0pc6kwc\"><em>How does a robot learn to recognize an object it’s never encountered? In this case, a demo can be worth a thousand words. Short human demonstrations can be used to create fully automated training datasets, sidestepping the prompting limitations that hold back vision-language models. Rather than describing objects with language, the system tracks what a person touches and manipulates during a demo, follows those objects through time, and clusters detections to handle objects merging or splitting apart in the scene. This bypasses a core weakness of VLMs, which struggle to reliably detect unusual or novel objects even with repeated, carefully engineered prompts.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://rai-inst.com/resources/blog/show-dont-tell-detecting-novel-objects-by-watching-human-demonstrations/\">Robotics and AI Institute<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div>"}, {"title": "How time series databases unlock real-time data for robotics", "source": "Robotics Business Review", "date": "2026-07-24", "url": "https://www.therobotreport.com/how-time-series-databases-unlock-real-time-data-for-robotics/", "summary": "<p>Discover how time series databases help robotics teams manage high-volume sensor data, power AI insights, and keep systems running at scale.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/how-time-series-databases-unlock-real-time-data-for-robotics/\">How time series databases unlock real-time data for robotics<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Generalist’s GEN-1 foundation model now supports a range of robot end effectors", "source": "Robotics Business Review", "date": "2026-07-24", "url": "https://www.therobotreport.com/generalists-gen-1-foundation-model-now-supports-a-range-of-robot-end-effectors/", "summary": "<p>By training GEN-1 to work with new hands, Generalist said a single base model can learn sensorimotor policies on different robots.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/generalists-gen-1-foundation-model-now-supports-a-range-of-robot-end-effectors/\">Generalist&#8217;s GEN-1 foundation model now supports a range of robot end effectors<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "AMD unveils Kria module for real-time control, unified memory for robots", "source": "Robotics Business Review", "date": "2026-07-23", "url": "https://www.therobotreport.com/amd-unveils-kria-module-real-time-control-unified-memory-robots/", "summary": "<p>AMD has launched the Ryzen AI Embedded X100 and Kria AI SoM, bringing unified memory and real-time control to challenge NVIDIA in robotics.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/amd-unveils-kria-module-real-time-control-unified-memory-robots/\">AMD unveils Kria module for real-time control, unified memory for robots<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Ropedia raises $22M to scale data collection for training robots", "source": "Robotics Business Review", "date": "2026-07-23", "url": "https://www.therobotreport.com/ropedia-raises-22m-scale-data-collection-training-robots/", "summary": "<p>Ropdeia's HOMIE is a head-mounted device, equipped with a 360º camera view, that captures first-person data for training robots.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/ropedia-raises-22m-scale-data-collection-training-robots/\">Ropedia raises $22M to scale data collection for training robots<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Uber co-founder raises $1.7B for new robotics startup ATOMS", "source": "Robotics Business Review", "date": "2026-07-23", "url": "https://www.therobotreport.com/uber-co-founder-raises-1-7b-for-new-robotics-startup-atoms/", "summary": "<p>Travis Kalanick, the former CEO of Uber, said with ATOMS, he hopes to create physical automation to transform industry.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/uber-co-founder-raises-1-7b-for-new-robotics-startup-atoms/\">Uber co-founder raises $1.7B for new robotics startup ATOMS<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Holiday Robotics raises $105M for its FRIDAY wheeled humanoid", "source": "Robotics Business Review", "date": "2026-07-23", "url": "https://www.therobotreport.com/holiday-robotics-raises-105m-wheeled-humanoid-friday/", "summary": "<p>Holiday's robot features a wheel-based mobile base, an upper body for dexterous manipulation, and hot-swappable batteries.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/holiday-robotics-raises-105m-wheeled-humanoid-friday/\">Holiday Robotics raises $105M for its FRIDAY wheeled humanoid<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "NVIDIA Open Sources First GPU-Accelerated Medical Physics Simulation Framework", "source": "NVIDIA Robotics", "date": "2026-07-22", "url": "https://blogs.nvidia.com/blog/medical-physics-simulation-open-source/", "summary": "Before a healthcare robot can be useful in the real world, it has to learn how the physical world pushes back. Anatomy varies. Instruments bend, press, slip and interact with tissue. Imaging can be noisy or incomplete. And the rare, edge scenarios developers most need to understand don’t appear on schedule. That creates one of [&#8230;]"}, {"title": "Medtronic to launch AI compute platform for the operating room", "source": "The Robot Report", "date": "2026-07-22", "url": "https://www.therobotreport.com/medtronic-launch-ai-compute-platform-operating-room/", "summary": "<p>Touch Surgery bridges pre-operative planning and training, intra-operative tele-mentoring and tele-proctoring, and post-operative insights.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/medtronic-launch-ai-compute-platform-operating-room/\">Medtronic to launch AI compute platform for the operating room<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Report shares the state of physical AI and robotics", "source": "Robotics Business Review", "date": "2026-07-22", "url": "https://www.therobotreport.com/physical-ai-and-robotics/", "summary": "<p>A report looks at how physical AI is increasingly enabling autonomous systems to perceive their environments, make decisions, and act in the real world.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/physical-ai-and-robotics/\">Report shares the state of physical AI and robotics<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "MISUMI Americas releases reshoring report, supports manufacturing training bill", "source": "Robotics Business Review", "date": "2026-07-21", "url": "https://www.therobotreport.com/misumi-americas-releases-reshoring-report-supports-manufacturing-training-bill/", "summary": "<p>MISUMI Americas has examined reshoring of U.S. manufacturing and supported legislation to send workers overseas for training.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/misumi-americas-releases-reshoring-report-supports-manufacturing-training-bill/\">MISUMI Americas releases reshoring report, supports manufacturing training bill<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Friction is key to making better robot world models", "source": "Robotics Business Review", "date": "2026-07-21", "url": "https://www.therobotreport.com/friction-is-key-to-making-better-robot-world-models/", "summary": "<p>Deploying world models in real robotic systems requires a step that receives less attention than the models themselves: conditioning.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/friction-is-key-to-making-better-robot-world-models/\">Friction is key to making better robot world models<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Generative Bionics unveils humanoid robot with full-body tactile sensing", "source": "Robotics Business Review", "date": "2026-07-21", "url": "https://www.therobotreport.com/generative-bionics-unveils-humanoid-robot-with-full-body-tactile-sensing/", "summary": "<p>Generative Bionics said its Gene.01 humanoid is fully sensorized, helping it quickly anticipate human presence and respond.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/generative-bionics-unveils-humanoid-robot-with-full-body-tactile-sensing/\">Generative Bionics unveils humanoid robot with full-body tactile sensing<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Vicarious Surgical officially shutting down", "source": "Robotics Business Review", "date": "2026-07-21", "url": "https://www.therobotreport.com/vicarious-surgical-officially-shutting-down/", "summary": "<p>Vicarious Surgical raised about $300 million in total, most of that from a special purpose acquisition company (SPAC) merger in 2021.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/vicarious-surgical-officially-shutting-down/\">Vicarious Surgical officially shutting down<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "U.K.-based Humanoid secures $152M in Series A funding", "source": "Robotics Business Review", "date": "2026-07-21", "url": "https://www.therobotreport.com/uk-based-humanoid-secures-152m-in-series-a-funding/", "summary": "<p>Humanoid said it has reached a $1.35 billion valuation as it scales its AI-driven industrial robots and expands commercial deployments.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/uk-based-humanoid-secures-152m-in-series-a-funding/\">U.K.-based Humanoid secures $152M in Series A funding<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "AGIBOT unveils four embodied AI products for real-world operations at WAIC", "source": "Robotics Business Review", "date": "2026-07-20", "url": "https://www.therobotreport.com/agibot-unveils-four-embodied-ai-products-real-world-operations-waic/", "summary": "<p>AGIBOT said its demoes and industrial deployments show its progress in turning embodied AI capabilities into repeatable workflows.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/agibot-unveils-four-embodied-ai-products-real-world-operations-waic/\">AGIBOT unveils four embodied AI products for real-world operations at WAIC<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Building robots for unpredictable, infrastructure-free environments", "source": "Robotics Business Review", "date": "2026-07-20", "url": "https://www.therobotreport.com/building-robots-for-unpredictable-infrastructure-free-environments/", "summary": "<p>Real-world robotics success requires building infrastructure-free systems that thrive in unpredictable, harsh outdoor environments.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/building-robots-for-unpredictable-infrastructure-free-environments/\">Building robots for unpredictable, infrastructure-free environments<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "BrainCo demonstrates brain-controlled robot AI platform", "source": "Robotics Business Review", "date": "2026-07-20", "url": "https://www.therobotreport.com/brainco-demonstrates-brain-controlled-robot-ai-platform/", "summary": "<p>During BrainCo's demo, the mind-controlled robotic arm completed tasks that require precision, such as grasping a cup or picking up an apple.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/brainco-demonstrates-brain-controlled-robot-ai-platform/\">BrainCo demonstrates brain-controlled robot AI platform<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Boston Dynamics to discuss the art behind human-robot interaction", "source": "Robotics Business Review", "date": "2026-07-20", "url": "https://www.therobotreport.com/boston-dynamics-discuss-art-behind-human-robot-interaction/", "summary": "<p>Boston Dynamics experts will share insights into design considerations for safe human-robot interaction in a webinar.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/boston-dynamics-discuss-art-behind-human-robot-interaction/\">Boston Dynamics to discuss the art behind human-robot interaction<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "How to avoid the teleoperation trap in robotics development", "source": "Robotics Business Review", "date": "2026-07-19", "url": "https://www.therobotreport.com/how-to-avoid-teleoperation-trap-robotics-development/", "summary": "<p>Teleoperation is necessary for training humanoid robots, but reinforcement learning and simulation are still necessary, says Flexion's CEO.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/how-to-avoid-teleoperation-trap-robotics-development/\">How to avoid the teleoperation trap in robotics development<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Palm Garden AI develops Coherence Guard relational decision layer for human-facing robots", "source": "Robotics Business Review", "date": "2026-07-18", "url": "https://www.therobotreport.com/palm-garden-ai-develops-coherence-guard-relational-decision-layer-human-facing-robots/", "summary": "<p>Palm Garden AI is developing a hardware-agnostic software layer, including Coherence Guard, for human-robot interaction and relationships.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/palm-garden-ai-develops-coherence-guard-relational-decision-layer-human-facing-robots/\">Palm Garden AI develops Coherence Guard relational decision layer for human-facing robots<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "With new funding, Monumental plans to bring its construction robots to the U.S.", "source": "Robotics Business Review", "date": "2026-07-17", "url": "https://www.therobotreport.com/with-new-funding-monumental-plans-bring-construction-robots-u-s/", "summary": "<p>Monumental acts as a subcontractor during construction tasks. Contractors pay the company for finished walls rather than for robots.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/with-new-funding-monumental-plans-bring-construction-robots-u-s/\">With new funding, Monumental plans to bring its construction robots to the U.S.<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Video Friday: Your Robot Surgeon Will See You Now", "source": "IEEE Spectrum Robotics", "date": "2026-07-17", "url": "https://spectrum.ieee.org/video-friday-robotic-surgery", "summary": "<img src=\"https://spectrum.ieee.org/media-library/two-humanoid-robots-perform-a-surgical-procedure-on-a-patient-in-a-dark-lab.png?id=67494478&amp;width=1200&amp;height=800&amp;coordinates=150%2C0%2C150%2C0\" /><br /><br /><p><span>Video Friday is your weekly selection of awesome robotics videos, collected by your friends at <\/span><em>IEEE Spectrum<\/em><span> robotics. We also post a weekly calendar of upcoming robotics events for the next few months. Please <\/span><a href=\"mailto:automaton@ieee.org?subject=Robotics%20event%20suggestion%20for%20Video%20Friday\">send us your events<\/a><span> for inclusion.<\/span><\/p><h5><a href=\"https://mrs.fel.cvut.cz/summer-school-2026/\">Summer School on Multi-Robot Systems<\/a>: 29 July–4 August 2026, PRAGUE<\/h5><h5><a href=\"https://actuate.foxglove.dev/\">Actuate 2026<\/a>: 18–19 August 2026, SAN FRANCISCO<\/h5><h5><a href=\"https://2026.ieee-iros.org/\">IROS 2026<\/a>: 27 September–1 October 2026, PITTSBURGH<\/h5><h5><a href=\"https://humanoidssummit.com/\">Humanoids Summit Seoul<\/a>: 22–23 September 2026, SEOUL<\/h5><p>Enjoy today’s videos!<\/p><div class=\"horizontal-rule\"><\/div><div><span style=\"display: none;\"> <\/span><\/div><blockquote class=\"rm-anchors\" id=\"qp0eiql6vb8\"><em>In this work, we present a systematic evaluation of contemporary humanoid technology for laparoscopic surgical tasks. We develop a humanoid-based laparoscopic teleoperation framework using general-purpose instruments and assess its capabilities through benchtop characterization, dry-lab user studies spanning diverse surgical experience levels, and in vivo porcine studies. Across these evaluations, we quantify technical feasibility, task performance, and clinical readiness relative to established surgical platforms. Together, our study provides an evidence-based assessment of the current capabilities and limitations of humanoids for surgical applications, highlighting both their promise and the key technical challenges that must be addressed before clinical deployment.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://humanoid-surgeon.github.io/\">UC San Diego<\/a> ]<\/p><p>Thanks, Ioana!<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"d7i1wj0gkik\"><em>Today, we preview ACT-2, the first robotics model to achieve reliability by unifying broad generalization with high performance.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>Sunday also has this 3-hour video (!) of Memo <a href=\"https://spectrum.ieee.org/is-there-a-future-for-laundry-folding-robots\" target=\"_blank\">folding laundry<\/a> in “never seen environments.” Let’s just not ask, because we almost certainly don’t want to know.<\/p><p class=\"shortcode-media shortcode-media-youtube\"> <span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.sunday.ai/\">Sunday Robotics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"ei1zfxlvkrs\">Spot is not the first quadruped to try its legs at last few meters <a href=\"https://spectrum.ieee.org/boston-dynamics-spot-robot-dog-now-available\" target=\"_blank\">package delivery<\/a>, but the challenge is not really those last few meters—it’s going to be not driving the human coworker nuts, is my guess.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://bostondynamics.com/blog/bridging-the-porch-gap/\">Boston Dynamics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"vrmcnnekti0\"><em>Quadrupedal locomotion in complex environments requires multiple motor skills, stable gait transitions, and perceptive control over a broad range of speeds. APT-RL (Action Pretrained Transformer-based Reinforcement Learning) is a unified framework for high-speed, multiskill locomotion. A single policy selects and transitions between gaits and motor skills using only onboard perception and computation. In real-world experiments, KAIST HOUND traversed stairs, hurdles, stepping-stones, gaps, and fallen branches. It reached an instantaneous peak speed of 4.25 meters per second while traversing a 60-centimeter step and 6 m/s during a drop-down transition on a three-step staircase.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://skillquadsr.github.io/\">KAIST DRCD Lab<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"fewvzrcka5c\">We will have much more on this next week.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.waldenrobotics.com/\">Walden Robotics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"q0wmudf3jki\"><em>Today, we introduce Lumo-2, our next-generation latent world-action model for generalist embodied robot learning.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.astribot.com/en/research/Lumo2\">Astribot<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"ccnkgd3qxvg\">Following Atlas’s first-of-its-kind live performance at the FIFA World Cup 2026, we caught up with Seth Davis, senior program manager, to learn how this demonstration came together and what it takes to succeed in the field (and <a href=\"https://spectrum.ieee.org/video-friday-humanoid-robot-running\" target=\"_blank\">on the pitch<\/a>).<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://bostondynamics.com/\">Boston Dynamics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"vxfnou7kf6y\"><em>No teleoperation. No cuts. Long take. One of the world’s few complete demonstrations of long-horizon mobile manipulation, bringing fully autonomous humanoid robots another step closer to us.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.limxdynamics.com/en\">LimX<\/a> ]<\/p><p>Thanks, Jinyan!<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"ytq2o5gcu3w\">Impressive. But get a job.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.magiclab.top/en/\">MagicLab<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"w3n009ayfhq\">We saw some footage of this <a href=\"https://spectrum.ieee.org/video-friday-robot-world-cup\" target=\"_blank\">last week<\/a>, but here’s a much better video.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><blockquote><em>Wing-propelled diving birds flap their wings to move through air and water, yet the wing morphology and kinematics that enable this behavior remain poorly understood because of the difficulty of collecting in situ data. The impact of flapping frequency, wing size, and stiffness on locomotion in—and transition between—the two media are still unknown. We compared data from diving birds against experiments using a flapping-wing robot capable of flying, swimming, plunge diving, and exiting the water. We show that frequency adaptation, flexible wings, and powerful actuation enable seamless transitions without folding wings or legs, that large wings enhance flight without substantially reducing underwater efficiency, and that tail-body distance and egress angle affect water exit. These results clarify how birds (and robots) balance multifluid locomotion constraints.<\/em><\/blockquote><p>[ <a href=\"https://dspace.mit.edu/entities/publication/a8ca74c5-9e2a-42f3-9ddf-636701e91ae2\">EPFL LIS<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div>"}, {"title": "Weave Robotics launches Isaac, its first mobile humanoid robot", "source": "The Robot Report", "date": "2026-07-17", "url": "https://www.therobotreport.com/weave-robotics-launches-isaac-first-mobile-humanoid-robot/", "summary": "<p>Weave Robotics has listed the features of its Isaac wheeled bimanual manipulator robot for household and office use.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/weave-robotics-launches-isaac-first-mobile-humanoid-robot/\">Weave Robotics launches Isaac, its first mobile humanoid robot<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "This Graduate Student Equips NASA’s Robots With Assembly Skills", "source": "IEEE Spectrum Robotics", "date": "2026-07-17", "url": "https://spectrum.ieee.org/graduate-student-nasas-robots-assembly", "summary": "<img src=\"https://spectrum.ieee.org/media-library/a-young-woman-with-blonde-hair-softly-smiling-next-to-a-pair-of-collaborative-robot-arms.jpg?id=67499761&amp;width=1200&amp;height=800&amp;coordinates=156%2C0%2C156%2C0\" /><br /><br /><p>Like many engineers, <a href=\"https://www.linkedin.com/in/sarahdownsprofile\" rel=\"noopener noreferrer\" target=\"_blank\">Sarah Downs<\/a> says she knew she wanted to pursue a STEM career from a young age. As a teenager, she discovered <a href=\"https://spectrum.ieee.org/topic/robotics/\" target=\"_self\">robotics<\/a> through her Tulsa, Okla., middle school’s <a href=\"https://www.firstlegoleague.org/\" rel=\"noopener noreferrer\" target=\"_blank\">First Lego League<\/a> team, and she fell in love with the field, she says. Downs participated in the international robotics program from 2014 to 2016.<\/p><p>Watching <a href=\"https://www.pbs.org/\" rel=\"noopener noreferrer\" target=\"_blank\">PBS<\/a> specials on <a href=\"https://www.nasa.gov/\" rel=\"noopener noreferrer\" target=\"_blank\">NASA<\/a> Mars rovers <a href=\"https://spectrum.ieee.org/mars-for-the-rest-of-us\" target=\"_self\"><em><em>Spirit<\/em><\/em><\/a><em> <\/em>and <a href=\"https://spectrum.ieee.org/video-friday-opportunity-celebrates-10-years-on-mars\" target=\"_self\"><em><em>Opportunity<\/em><\/em><\/a>, and seeing the live broadcast of the <a href=\"https://spectrum.ieee.org/if-necessary-mars-rover-curiosity-could-rip-its-own-wheels-off-to-stay-mobile\" target=\"_self\"><em><em>Curiosity<\/em><\/em><\/a> rover launch in 2011, inspired the teen to dream of a career working with NASA.<\/p><h3>Sarah Downs<\/h3><br /><p><strong>MEMBER GRADE<\/strong><\/p><p>Graduate student member<\/p><p><strong>UNIVERSITY <\/strong><\/p><p>Texas A&amp;M University in College Station<\/p><p><strong>MAJOR <\/strong><\/p><p>Electric engineering<\/p><h3><\/h3><br /><p>This year the IEEE graduate student member achieved that dream. For her final project as a master’s degree candidate in electrical engineering at the <a href=\"https://utulsa.edu/\" target=\"_blank\">University of Tulsa<\/a>, she worked on an algorithm in collaboration with NASA and the U.S. <a href=\"https://www.airforce.com/en\" target=\"_blank\">Air Force<\/a>.<\/p><p>The algorithm she developed enables a robot assembling satellites in space to insert an antenna into the correct spot, addressing robotics’s classic peg-in-hole problem of inserting an object into its corresponding hole.<\/p><p>Now a Ph.D. student in electrical engineering at <a href=\"https://www.tamu.edu/index.html\" target=\"_blank\">Texas A&amp;M University<\/a> in College Station, Downs is continuing her research on satellite assembly and manipulation “but on a much larger scale,” she says.<\/p><h2>Following a childhood passion<\/h2><p>Downs grew up in the Tulsa area. Her father, who died from a heart attack in 2015 when she was 13, was a safety advisor in the oil and gas industry. Her mother stayed home to take care of her brother, who has autism. After her father died, her mother went back to college to earn a bachelor’s degree in business so she could support the family.<\/p><p>“We didn’t have much income, and my mom was always worried about money,” Downs says. “That made me more aware of having a successful career, in a monetary sense.”<\/p><p>From then on, whenever she considered her future career, having a decent salary to support the family was high on her list.<\/p><p>By pursuing a career in robotics, she says, she can follow her passion while obtaining financial security.<\/p><p>In high school, Downs joined the <a href=\"https://www.firstinspires.org/\" rel=\"noopener noreferrer\" target=\"_blank\">First<\/a> robotics club, where she found herself drawn to the electrical components used in the machines she and her classmates built.<\/p><p>During her final two years of high school, she participated in an <a href=\"https://tulsatech.edu/full-time-programs/science-technology-engineering-and-mathematics/pre-engineering/\" rel=\"noopener noreferrer\" target=\"_blank\">extension program<\/a> at <a href=\"https://tulsatech.edu/\" rel=\"noopener noreferrer\" target=\"_blank\">Tulsa Tech<\/a>, a training school. She spent half her day in high school classes and the other half taking engineering courses at the vocational school.<\/p><p>After graduating in 2020, she accepted scholarships to attend the University of Tulsa. She began her freshman year at UTulsa not knowing whether she wanted to major in electrical or mechanical engineering, she says, adding that her love of working with small systems helped her choose EE.<\/p><p>For her <a href=\"https://utulsa.edu/news/celebrating-student-innovation-tus-role-in-tasms-new-exhibits/\" rel=\"noopener noreferrer\" target=\"_blank\">senior year capstone project<\/a>, she and two of her classmates designed a lunar lander exhibit for the <a href=\"https://www.tulsamuseum.org/\" rel=\"noopener noreferrer\" target=\"_blank\">Tulsa Air and Space Museum<\/a>. They created an interactive game that simulates missions on lunar and martian surfaces. Four celestial bodies—the moon, Venus, Mars, and Titan—are listed across three computer monitors. Using a game controller, museum visitors can explore the virtual surface of each one. The <a href=\"https://www.linkedin.com/feed/update/urn:li:activity:7207091982790266880/\" rel=\"noopener noreferrer\" target=\"_blank\">exhibit<\/a> is still on display.<\/p><p>Downs earned her bachelor’s degree in electrical engineering in 2024 and continued her education at the university’s EE master’s degree program.<\/p><h2>Both more and less complicated than people think<\/h2><p>When Downs began her graduate studies, she was supposed to be part of a NASA robotics project for two years. But when a delay in government funding postponed the project’s start, she instead spent her first year in the school’s <a href=\"https://utulsa.edu/research/robotics-institute/\" rel=\"noopener noreferrer\" target=\"_blank\">Institute for Robotics and Autonomy<\/a>, then newly launched. Its main focus is developing robots to assist people who have mobility challenges.<\/p><p>Inspired by her grandmother, who was wheelchair-bound due to severe arthritis, Downs developed a robotic arm that helps older people and wheelchair users live independently. The arm was able to identify and place objects in the appropriate locations inside the home, such as unloading certain groceries from a shopping bag and placing them on a shelf or in separate containers.<\/p><p>Before the start of her sophomore year in 2025, the NASA project finally secured government funding. She developed a robot that achieves the peg-in-hole task without using any vision systems. Typically, cameras help guide robots’ satellite-assembly work. But in the harsh, remote environment of outer space, cameras might malfunction or encounter delays.<\/p><h3><\/h3><br /><p>“Don’t stop asking questions. Especially in engineering, don’t pretend like you know everything, because science is about constantly wanting to learn and listen.”<\/p><h3><\/h3><br /><p>Rather than using cameras, Downs’s robotic arm deploys a force-based insertion process to sense position and orientation of objects in the arm’s environment. The robot loosely grips an antenna and, with a torque sensor on its gripper, “feels” the force feedback of where the satellite and antenna are in relation to each other. The robot then guides the antenna assembly into a target opening on its satellite and maintains the position during adhesion.<\/p><p>Adding to the complexity, the robot performs its task in zero gravity.<\/p><p>“Without gravity, you now have to consider the arm’s reaction torques on the satellite to avoid flinging it into space,” Downs says. Any motion from the arm during the insertion process, especially from increased forces, could cause the satellite to continue movement in that direction.<\/p><p>To combat that, Downs is performing calculations for the project to direct targeted reverse thrusts and counter the force of the robot’s motions.<\/p><p>Her graduate project captures the simple yet complex nature of robotics that she finds fascinating, she says.<\/p><p>“I think robots are both more and also less complicated than people think,” she says. “Really, all you need to start programming a robot is its <a href=\"https://www.universal-robots.com/developer/hardware-and-motion/robot-motion-dh-parameters/\" target=\"_blank\">Denavit-Hartenberg parameters<\/a>, and you can do a lot with that,” she says, referencing the four values used to describe the position and orientation of a robotic arm and manipulators. Even with different grippers and degrees of freedom, “fundamentally, all robot manipulators start there,” she says.<\/p><p>“But,” she adds, “we’re still learning so much about how robots interact with their environment. Even something simple to us, like manipulating a pen, is still incredibly complex for robots.”<\/p><p>Downs is completing her doctoral thesis in the <a href=\"https://rad.engr.tamu.edu/robotic-space-simulator/\" rel=\"noopener noreferrer\" target=\"_blank\">Robotic Space Simulator<\/a> project at Texas A&amp;M’s <a href=\"https://rad.engr.tamu.edu/\" rel=\"noopener noreferrer\" target=\"_blank\">Robotics and Automation Design (RAD) Lab<\/a>, which specializes in developing machines that can survive in extreme environments. It collaborates with NASA.<\/p><p>Her thesis advisor is <a href=\"https://spectrum.ieee.org/video-friday-punch-out\" target=\"_self\">Robert Ambrose<\/a>, a NASA veteran who launched the RAD Lab in 2022. The IEEE member is set to serve as associate director of the school’s Space Institute, due to open this year in Houston. The research facility is being built next to the <a href=\"https://www.nasa.gov/johnson/\" rel=\"noopener noreferrer\" target=\"_blank\">Johnson Space Center<\/a>.<\/p><p>After earning her Ph.D., Downs says, she hopes to one day work for NASA, developing rovers that collect samples from Mars or robotic arms that perform tasks on space stations.<\/p><p>To learn more about robots, check out <em>IEEE Spectrum<\/em>’s <a href=\"https://robotsguide.com/about\" rel=\"noopener noreferrer\" target=\"_blank\">guide<\/a>.<\/p><h2>Getting out of the engineering bubble<\/h2><p>Downs joined <a href=\"https://www.ieee.org/\" rel=\"noopener noreferrer\" target=\"_blank\">IEEE<\/a> in 2020 as a freshman at UTulsa to get more involved in electrical engineering events on campus. At the time, the <a href=\"https://spectrum.ieee.org/tag/covid-19\" target=\"_self\">COVID-19 pandemic<\/a> kept clubs and organizations from meeting in person.<\/p><p>She was active in her school’s <a href=\"https://utulsa.edu/academics/engineering-computer-science/academics/departments/electrical-computer-engineering/institute-of-electronics-and-electrical-engineers-ieee/\" rel=\"noopener noreferrer\" target=\"_blank\">IEEE student branch<\/a> and was elected as its 2022–2024 president. Under her leadership, the branch went from having a few events to hosting one every two weeks.<\/p><p>They included lunch-and-learn sessions and dinners that connected students with professional engineers and the university’s alumni. Downs also organized hands-on workshops on soldering, <a href=\"https://spectrum.ieee.org/lunar-base-3d-printing\" target=\"_self\">3D printing<\/a>, CAD modeling, and <a href=\"https://spectrum.ieee.org/be-a-polarizing-job-seeker\" target=\"_self\">résumé-building<\/a>.<\/p><p>Her efforts helped increase the branch’s executive board membership from roughly five students to 25 in 2023. The same year, her soldering workshop attracted about 80 students.<\/p><p>She says she enjoyed working with IEEE, especially “engaging with alumni and learning from engineers.”<\/p><p>IEEE is a great resource for networking opportunities, she says, noting that “during the COVID-19 pandemic, engineering students stayed in their bubbles.” IEEE events helped the students make connections that could serve them well, she says.<\/p><p>“Networking is very important, especially in today’s tough job market,” she says. “It’s a lot about who you know and how people observe your work ethic.”<\/p><p>Downs, who now serves as an IEEE graduate advisor for UTulsa’s student branch, says she has seen firsthand how the school’s student branch network has benefited its student members.<\/p><p>“A lot of them have found jobs” because of IEEE, she says.<\/p><h3>The working and networking of an engineer<\/h3><br /><p>As the IEEE graduate advisor for UTulsa’s student branch, Downs noticed that many engineering undergraduates finish college without any <a href=\"https://spectrum.ieee.org/hands-on-projects-career-advice\" target=\"_self\">hands-on experience<\/a>, whether it be a project or an internship.<\/p><p>“Their résumés are very sparse, and they have no proof of their technical skills,” she says. She herself completed a facilities engineering internship at <a href=\"https://flytulsa.com/\" target=\"_blank\">Tulsa International Airport<\/a>’s <a href=\"https://www.google.com/aclk?sa=L&amp;ai=DChsSEwiakeLTiIqVAxWRzsIEHX4aO3UYACICCAEQABoCcHY&amp;ae=2&amp;co=1&amp;ase=2&amp;gclid=CjwKCAjwxb7RBhA5EiwAQ-AAdIuO_CE21RKvxNvZKxWXCYpo9d0-vpx3D3XClr2XRTWwP13SUuMbKhoCzuIQAvD_BwE&amp;ei=RV4waqKnFs-G0PEPpMyjoAg&amp;cid=CAASZuRoVbgIgx56926ScONp0UCppyfOxCgiUjlNwIYIyRNwiPfCRnB-35o-3qx5zfez3l5RTJDkwOw_SW-pvC4ORqwKrbj2g4yojyTEu490Veitl0o0gJG9sB38UMie-GYDrIURjI2CPw&amp;cce=2&amp;category=acrcp_v1_71&amp;sig=AOD64_2LzW3O1QygURf8h7S57YqN5jIk3A&amp;q&amp;sqi=2&amp;nis=4&amp;adurl&amp;ved=2ahUKEwji3dfTiIqVAxVPAzQIHSTmCIQQ0Qx6BAgNEAE\" rel=\"noopener noreferrer\" target=\"_blank\">American Airlines<\/a> maintenance facility after her sophomore year of college. And she was an electrical engineering intern at <a href=\"https://www.flightsafety.com/\" rel=\"noopener noreferrer\" target=\"_blank\">Flight Safety International<\/a> outside Tulsa after her junior year and after she graduated. The company designs, builds, and maintains its own flight simulators.<\/p><p>Her advice to undergraduates is to hone and demonstrate both their hard and soft skills by working on research projects or even personal passion projects.<\/p><p>“A <a href=\"https://www.raspberrypi.com/\" rel=\"noopener noreferrer\" target=\"_blank\">Raspberry Pi<\/a> doesn’t cost that much, and you can start working with that immediately,” she says. Students also can take part in engineering interest groups and professional organizations at their school, she adds.<\/p><p>“Put yourself out there and join a research team,” she says. “It’s a great way to show people that you’re a good person to work with and you’d do a good job in the field.”<\/p><p>She adds that it’s also a fine way to keep learning—which is what drew her to a field that has developed only within the past century.<\/p><p>“We’re still constantly learning about robots,” she says.<\/p><p>“Don’t stop asking questions,” she advises students. “Especially in engineering, don’t pretend like you know everything, because science is about constantly wanting to learn and listen.”<\/p>"}, {"title": "Founder of Maximo discusses how robotics is accelerating solar construction", "source": "Robotics Business Review", "date": "2026-07-17", "url": "https://www.therobotreport.com/transforming-solar-construction-through-robotics-deise-yumi-asami-maximo/", "summary": "<p>Maximo founder Deise Yumi Asami discusses the process of automating solar construction with robotics.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/transforming-solar-construction-through-robotics-deise-yumi-asami-maximo/\">Founder of Maximo discusses how robotics is accelerating solar construction<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Lockheed Martin taps Machina’s robots for mission-critical missile parts", "source": "Robotics Business Review", "date": "2026-07-16", "url": "https://www.therobotreport.com/lockheed-martin-taps-machinas-robots-for-mission-critical-missile-parts/", "summary": "<p>Machina Labs secured a Lockheed Martin contract to qualify robotically formed metal components for the JASSM missile program.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/lockheed-martin-taps-machinas-robots-for-mission-critical-missile-parts/\">Lockheed Martin taps Machina’s robots for mission-critical missile parts<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Xpanner rolls out X1 Panel Lift for automated solar panel installation", "source": "Robotics Business Review", "date": "2026-07-16", "url": "https://www.therobotreport.com/xpanner-rolls-out-x1-panel-lift-automated-solar-panel-installation/", "summary": "<p>X1 Panel Lift uses existing excavators and a single workflow so solar installation crews can focus on alignment, fastening, and quality.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/xpanner-rolls-out-x1-panel-lift-automated-solar-panel-installation/\">Xpanner rolls out X1 Panel Lift for automated solar panel installation<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "How to Make an Invisible Drone", "source": "IEEE Spectrum Robotics", "date": "2026-07-16", "url": "https://spectrum.ieee.org/invisible-spinning-drone", "summary": "<img src=\"https://spectrum.ieee.org/media-library/low-visibility-drone-flying-in-front-of-an-office-plant.jpg?id=67480624&amp;width=1200&amp;height=800&amp;coordinates=62%2C0%2C63%2C0\" /><br /><br /><p><span>There are many words that I would never, ever use to describe a drone. Stealthy. Subtle. Whatever the opposite of obnoxious is. Much of this is because of the giant angry bee sound that drones tend to make, but it’s also the way that they look in flight: With uncannily linear movements and an even less canny ability to hover perfectly still, they tend to draw the eye as affronts to nature.<\/span><\/p><p>In a paper presented this week at <a href=\"https://roboticsconference.org/\" target=\"_blank\">Robotics Science and Systems 2026<\/a> in Sydney, roboticists from Northwestern University, Evanston, Ill., demonstrated a drone called Phantom Twist that is essentially invisible to humans, being an order of magnitude more difficult to see in flight than a typical quadrotor. They accomplished this with the aid of computational design, and while the resulting hardware is, I would argue, also an order of magnitude more of an affront to nature than a typical quadrotor represents, it’s pretty amazing how well it works.<\/p><p class=\"shortcode-media shortcode-media-youtube\"> <span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span> <small class=\"image-media media-caption\">Phantom Twist spins so fast, it’s practically invisible.<\/small><small class=\"image-media media-photo-credit\">Michael Rubenstein/Northwestern University<\/small><\/p><p><span>The trick here is easy to see, even if the drone isn’t. By spinning in flight at between 15 and 25 hertz, Phantom Twist takes advantage of humans’ decidedly mediocre visual system to turn a solid spinning object into an opaque smear. Human eyes take some amount of time (typically about 100 milliseconds) to integrate what we see before sending the full scene off to our brains for processing. Moving objects can cause problems for this system, because if the movement is fast enough, our eyes are forced to average that motion across the scene, combining it with whatever is in the background and resulting in a transparent blur. This effect is called persistence of vision. For something that spins like Phantom Twist, that motion blur comes from the drone’s rapid rotation, and it works because most of the drone is cleverly designed to be empty space.<\/span><\/p><p>Drones that spin in flight are nothing new—we’ve covered a bunch of them in the past, including <a href=\"https://www.modlabupenn.org/piccolissimo/\" target=\"_blank\">Picolissimo<\/a> and any number of <a href=\"https://spectrum.ieee.org/spinning-drone\" target=\"_self\">samara<\/a> <a href=\"https://spectrum.ieee.org/foldable-monocopter-drone\" target=\"_self\">drones<\/a> inspired by the spinning flight of maple seeds. What makes Phantom Twist unique, and also very odd, is that the design was computationally optimized for low visibility. <\/p><h2>Controlling how drones like this fly<\/h2><p>Before we get into that, though, a quick note about how drones like this can even fly controllably, because it’s not at all obvious. With just a single motor and no control surfaces, the only possible control input is through the motor itself, and by pulsing the motor speed up or down at just the right time during each rotation, the drone can translate in any direction. Altitude control comes from changing overall motor thrust, and the drone‘s spinning nature makes it passively stable.<\/p><p class=\"shortcode-media shortcode-media-rebelmouse-image rm-float-left rm-resized-container rm-resized-container-25\" style=\"float: left;\"> <img alt=\"A minimalist drone made of a few thin rods, wires and a miniature circuit board.\" class=\"rm-shortcode\" id=\"b2caf\" src=\"https://spectrum.ieee.org/media-library/a-minimalist-drone-made-of-a-few-thin-rods-wires-and-a-miniature-circuit-board.jpg?id=67480639&amp;width=980\" /> <small class=\"image-media media-caption\">Carbon fiber rods connect batteries, a controller, some counterweights, and a motor and propeller. The research robot also includes optical tracking tags.<\/small><small class=\"image-media media-photo-credit\">Michael Rubenstein/Northwestern University<\/small><\/p><p>The bits that you need for this kind of drone include the motor and propeller, a couple of batteries, a controller, some counterweights (which could be replaced with more batteries or payload), 0.8-mm carbon fiber rods to tie it all together, and a connector for the handheld launcher that gets the whole thing up to speed. The actual <em><em>arrangement<\/em><\/em> of these components is surprisingly flexible, and that’s where the invisibility comes in. <\/p><p>“The design space is high dimensional,” explains Northwestern’s <a href=\"https://www.mccormick.northwestern.edu/research-faculty/directory/profiles/rubenstein-michael.html\" target=\"_blank\">Michael Rubenstein<\/a>. “It’s very difficult for a human to reason through all the trade-offs between the physical constraints required for stable flight and the visual appearance of the spinning drone, and I don’t think we would have easily arrived at this low-visibility design ourselves.”<\/p><p>The visibility (or not) of Phantom Twist is primarily driven by the extent to which different components line up with each other from the perspective of someone looking at the drone. The more components that line up with each other as the drone flies, the less background you see through the spinning drone, and the more visible the drone becomes. Because you might be looking at the drone from a number of different angles, and also because the drone has to be stable enough for controlled flight, there are a bunch of different things that need to be optimized all at once, which is why computational design is effective here.<\/p><p>Phantom Twist’s final design was generated using an iterative optimizer which had a goal of minimizing a metric called <a href=\"https://eureka.patsnap.com/article/what-is-lpips-and-how-it-measures-perceptual-similarity\" target=\"_blank\">learned perceptual image patch similarity<\/a>, or LPIPS, while making sure that the design could still physically work. LPIPS is the difference between two images: a background image, and a background image with an overlay of the simulated spinning drone. The smaller that difference is, the more invisible that design is. It’s tricky for a human to consider all of the variables at once, but Rubenstein says that the final design does make intuitive sense, because “the automated pipeline prefers placements where components don’t visually overlap as it spins, or where the components are too close to the center of rotation.”<\/p><p class=\"shortcode-media shortcode-media-rebelmouse-image\"> <img alt=\"Two variations of minimalist drones made from a few thin rods, wires and a miniature circuit board. Both are barely visible when in-flight.\" class=\"rm-shortcode\" id=\"394e6\" src=\"https://spectrum.ieee.org/media-library/two-variations-of-minimalist-drones-made-from-a-few-thin-rods-wires-and-a-miniature-circuit-board-both-are-barely-visible-when.jpg?id=67480677&amp;width=980\" /> <small class=\"image-media media-caption\">Two iterations of Phantom Twist drones are shown with their handheld launching mechanisms. The better-optimized version [bottom row] relocates the launcher interface to remove components that are too close to the central axis, making them more visible.<\/small><small class=\"image-media media-photo-credit\">Michael Rubenstein/Northwestern University<\/small><\/p><p>Out of a starting set of around 20,000 feasible Phantom Twist configurations, the optimized design (the one that you see or don’t see in the pictures and videos) has a LPIPS score of 0.0104. A human-designed Phantom Twist is about twice as visible, with a LPIPS score of around 0.2, and a conventional quadrotor (of the same size) would be over 10 times more visible. And there’s still a bit more optimization that could be done with the electrical wiring as well as increasing the baseline transparency of the components themselves.<\/p><p>Phantom Twist is currently controlled using an optical tracking system, which means that it’s not yet capable of flying outside of a controlled environment. But Rubenstein has built <a href=\"https://www.roboticsproceedings.org/rss20/p102.pdf\" target=\"_blank\">other drones along similar principles<\/a> in the past, which have successfully flown outside, and he’s optimistic about using those techniques to break Phantom Twist out of the lab. The spinning behavior might even enable some useful sensing capabilities, he says. “An interesting possibility is mounting a camera on the spinning body. As the vehicle rotates, it could capture imagery in every direction, effectively creating a 360-degree view of its surroundings that could be used for onboard navigation and control.”<\/p><p>As for what a drone like Phantom Twist could be used for—assuming that the sound can be mitigated somewhat (and there are <a href=\"https://spectrum.ieee.org/pennysized-ionocraft-flies-with-no-moving-parts\" target=\"_self\">potential approaches to making that happen<\/a>), a stealthy microdrone could do all sorts of things with covert surveillance being the most obvious application. For his part, Rubenstein says that he’s personally excited about the potential for watching wildlife, “where a less-intrusive drone could observe animals while minimizing its impact on their natural behavior.” The elephants in particular <a href=\"https://spectrum.ieee.org/research-proves-drones-sound-like-bees-which-is-good-news-for-elephants\" target=\"_self\">would certainly appreciate that<\/a>.<\/p><p>For a deeper dive into all the particulars of this project, read the paper: <a href=\"https://arxiv.org/html/2605.11296v1\" target=\"_blank\"><em><em>Computational Design of a Low-Visibility UAV Using a Human-Aligned Perceptual Metric<\/em><\/em><\/a>, by Jingxian Wang, Chen Yu, David Matthews, Emma Alexander, Sam Kriegman, and Michael Rubenstein from Northwestern University, which is being presented this week at <a href=\"https://roboticsconference.org/\" target=\"_blank\">RSS 2026 in Sydney<\/a>.<\/p>"}, {"title": "TerraFirma raises $115M to build robotic infrastructure for construction", "source": "Robotics Business Review", "date": "2026-07-16", "url": "https://www.therobotreport.com/terrafirma-raises-115m-build-robotic-infrastructure-construction/", "summary": "<p>TerraFirma has developed a platform that combines AI-enabl
