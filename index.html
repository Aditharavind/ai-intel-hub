tps://arxiv.org/pdf/2511.23407\" target=\"_blank\">This research<\/a> was presented at the IEEE International Conference on Robotics and Automation (ICRA) 2026 in Vienna.<br /><\/p><p><em>This story was updated 11 August 2026 to clarify that the disassembly system works for products in general, not only robots.<\/em><\/p>"}, {"title": "Hadrian raises $1.37B to accelerate U.S. defense, aerospace manufacturing", "source": "Robotics Business Review", "date": "2026-08-10", "url": "https://www.therobotreport.com/hadrian-raises-1-37b-accelerate-u-s-manufacturing/", "summary": "<p>The raise values Hadrian at $7.87 billion. It is Hadrian's second funding round this year, following a round in January 2026.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/hadrian-raises-1-37b-accelerate-u-s-manufacturing/\">Hadrian raises $1.37B to accelerate U.S. defense, aerospace manufacturing<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "RoboStore launches Robo Inc. to help U.S. organizations deploy robots", "source": "Robotics Business Review", "date": "2026-08-10", "url": "https://www.therobotreport.com/robostore-launches-robo-inc-to-help-u-s-organizations-deploy-robots/", "summary": "<p>RoboStore, a distributor of Unitree's legged robots, has launched Robo Inc. to serve as a U.S.-based manufacturer and integrator.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/robostore-launches-robo-inc-to-help-u-s-organizations-deploy-robots/\">RoboStore launches Robo Inc. to help U.S. organizations deploy robots<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Analog Devices returns as strategic sponsor to aid MassRobotics startups", "source": "Robotics Business Review", "date": "2026-08-09", "url": "https://www.therobotreport.com/analog-devices-returns-strategic-sponsor-aid-massrobotics-startups/", "summary": "<p>Analog Devices Inc. is supporting MassRobotics startups with Analog Garage and participating in events including RoboBusiness.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/analog-devices-returns-strategic-sponsor-aid-massrobotics-startups/\">Analog Devices returns as strategic sponsor to aid MassRobotics startups<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Experts look ahead at the next 20 years of robotics at RoboBusiness", "source": "Robotics Business Review", "date": "2026-08-08", "url": "https://www.therobotreport.com/experts-look-ahead-at-the-next-20-years-of-robotics-at-robobusiness/", "summary": "<p>At Robobusiness, leaders in robotics will explore the technologies, opportunities, and challenges that will shape the next twenty years.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/experts-look-ahead-at-the-next-20-years-of-robotics-at-robobusiness/\">Experts look ahead at the next 20 years of robotics at RoboBusiness<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Video Friday: Drones Go Heavy in DARPA Lift Challenge", "source": "IEEE Spectrum Robotics", "date": "2026-08-07", "url": "https://spectrum.ieee.org/video-friday-heavy-lift-drone", "summary": "<img src=\"https://spectrum.ieee.org/media-library/engineers-watch-a-slender-experimental-drone-fly-near-a-large-hangar.jpg?id=67585216&amp;width=1245&amp;height=700&amp;coordinates=0%2C104%2C0%2C104\" /><br /><br /><p><span>Video Friday is your weekly selection of awesome robotics videos, collected by your friends at <\/span><em>IEEE Spectrum<\/em><span> robotics. We also post a weekly calendar of upcoming robotics events for the next few months. Please <\/span><a href=\"mailto:automaton@ieee.org?subject=Robotics%20event%20suggestion%20for%20Video%20Friday\">send us your events<\/a><span> for inclusion.<\/span><\/p><h5><a href=\"https://actuate.foxglove.dev/\">Actuate 2026<\/a>: 18–19 August 2026, SAN FRANCISCO<\/h5><h5><a href=\"https://2026.ieee-iros.org/\">IROS 2026<\/a>: 27 September–1 October 2026, PITTSBURGH<\/h5><h5><a href=\"https://humanoidssummit.com/\">Humanoids Summit Seoul<\/a>: 22–23 September 2026, SEOUL<\/h5><p>Enjoy today’s videos!<\/p><div class=\"horizontal-rule\"><\/div><div><span style=\"display: none;\"> <\/span><\/div><p class=\"rm-anchors\" id=\"tbw6a0-w1pe\">The <a href=\"https://spectrum.ieee.org/video-friday-heavy-lift-drones\" target=\"_blank\">DARPA Lift Challenge<\/a> is taking place through this weekend. There are a couple of very brief overview videos from the past couple of days, which are only really interesting because they give you a quick look at some utterly bizarre heavy-lift drone designs. If you like what you see, DARPA has recorded livestreams of the entire event so far. We’ve posted one of those at the end of this section, and if you want to be impressed by some super-weird drones, check out <a href=\"https://youtu.be/QFo0JRPsuxE?t=7780\" target=\"_blank\">this<\/a> and <a href=\"https://youtu.be/QFo0JRPsuxE?t=9865\" target=\"_blank\">this<\/a>.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p class=\"shortcode-media shortcode-media-youtube\"> <span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p class=\"shortcode-media shortcode-media-youtube\"> <span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p class=\"shortcode-media shortcode-media-youtube\"> <span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.darpaliftchallenge.com/\">DARPA Lift Challenge<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"gc084vusvby\"><em>When NASA’s <a href=\"https://spectrum.ieee.org/video-friday-skyfall-mars-helicopter\" target=\"_blank\">SkyFall helicopters<\/a> take to the Martian skies, one of their tasks will be to hunt for frozen water—a critical resource for future astronauts—using ground-penetrating radar. For that radar to work, the rotorcraft will carry a flexible, fabric-based antenna that extends below the aircraft without interfering with landings or breaking at touchdown.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://science.nasa.gov/mission/skyfall/\">NASA<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"i_ujhsjdxpy\">Why would you even want a five-fingered humanoid hand when you could have something so much better?<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.flexiv.com/product/grav\">Flexiv<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"mc8xcyqhtl4\"><em>We’ve improved how GEN-1 learns to adapt to new actuators and new robots at the lowest level, with up to 10-20x gains on internal benchmarks. This significantly boosts performance on high-precision tasks like disassembling parts from a NIST board.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://generalistai.com/blog/gen-1\">Generalist<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"cw2aofqerdm\">This is certainly one of the best-looking humanoid robots out there.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://gbionics.ai/\">Generative Bionics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"g98ynwovr_0\">A little on the technical side, but the concept here is important, I think: being able to control an assistive robot through touch.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://sites.google.com/view/tac-nav/home\">Tac-Nav<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"gvpqvwdgku4\"><em>We present SonicFly, a passive aeroacoustic perception framework that enables one unmanned aerial vehicle (UAV) to estimate and follow another using only the leader’s intrinsic flight sound.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://generalroboticslab.com/SonicFly\">General Robotics Lab<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"rssl4e2mwoi\">Okay, but... Get a job?<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.robotis.com/en/product/ecosystem-aisapiens.php\">ROBOTIS<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div>"}, {"title": "Avatar Robotics raises seed round to address industrial labor constraints", "source": "Robotics Business Review", "date": "2026-08-07", "url": "https://www.therobotreport.com/avatar-robotics-raises-6-5-m-seed-round-address-industrial-labor-constraints/", "summary": "<p>Avatar Robotics raised $6.5 million in funding to scale humanoid robots and remote teleoperation across industrial supply chains.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/avatar-robotics-raises-6-5-m-seed-round-address-industrial-labor-constraints/\">Avatar Robotics raises seed round to address industrial labor constraints<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Building robots that survive the warehouse", "source": "Robotics Business Review", "date": "2026-08-07", "url": "https://www.therobotreport.com/building-robots-that-survive-warehouse/", "summary": "<p>Nomagic says its real moat is production data, because the messiness of real warehouses is where robots either prove themselves or fail.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/building-robots-that-survive-warehouse/\">Building robots that survive the warehouse<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Tacta Systems takes aim at high-skilled manufacturing work with TactaBot", "source": "Robotics Business Review", "date": "2026-08-07", "url": "https://www.therobotreport.com/tacta-systems-takes-aim-high-skilled-manufacturing-work-tactabot/", "summary": "<p>Tacta Systems unveiled a three-part system, including its robotic hand, that enables users to teach its robot new dexterous skills.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/tacta-systems-takes-aim-high-skilled-manufacturing-work-tactabot/\">Tacta Systems takes aim at high-skilled manufacturing work with TactaBot<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "HII signs up to $900M agreement with Path Robotics, GrayMatter Robotics", "source": "Robotics Business Review", "date": "2026-08-06", "url": "https://www.therobotreport.com/hii-signs-up-to-900m-agreement-with-path-robotics-graymatter-robotics/", "summary": "<p>The latest agreement expands HII's HYPER Program, which Path Robotics and GrayMatter Robotics joined earlier this year.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/hii-signs-up-to-900m-agreement-with-path-robotics-graymatter-robotics/\">HII signs up to $900M agreement with Path Robotics, GrayMatter Robotics<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Report looks at advances in autonomous mobile robots", "source": "Robotics Business Review", "date": "2026-08-06", "url": "https://www.therobotreport.com/report-looks-at-advances-in-autonomous-mobile-robots/", "summary": "<p>A download looks at examples of advances in autonomous mobile robots in material handling and automated storage applications.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/report-looks-at-advances-in-autonomous-mobile-robots/\">Report looks at advances in autonomous mobile robots<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "How Robin, the robotic companion, keeps patients calm during hospital visits", "source": "Robotics Business Review", "date": "2026-08-06", "url": "https://www.therobotreport.com/how-robin-robotic-companion-keeps-patients-calm-during-hospital-visits/", "summary": "<p>Robin is deployed across 30 different health systems, and Expper has plans to deploy 10 more in different states. <\/p>\n<p>The post <a href=\"https://www.therobotreport.com/how-robin-robotic-companion-keeps-patients-calm-during-hospital-visits/\">How Robin, the robotic companion, keeps patients calm during hospital visits<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Into the Omniverse: How Open World Models Push the Frontier of Physical AI", "source": "NVIDIA Robotics", "date": "2026-08-06", "url": "https://blogs.nvidia.com/blog/open-world-models-physical-ai/", "summary": "In July, NVIDIA joined more than 200 companies and organizations in signing “Open Weights and American AI Leadership,” an open letter arguing that AI leadership will be measured not by any single frontier model but by whether an open ecosystem reaches every sector."}, {"title": "Moove raises $250M to build infrastructure for autonomous vehicles", "source": "Robotics Business Review", "date": "2026-08-05", "url": "https://www.therobotreport.com/moove-raises-250m-to-build-infrastructure-for-autonomous-vehicles/", "summary": "<p>The funding will support Moove's expansion of its autonomous fleet ownership and robotics-first depot infrastructure “Nests.”<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/moove-raises-250m-to-build-infrastructure-for-autonomous-vehicles/\">Moove raises $250M to build infrastructure for autonomous vehicles<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Why perception is the key to scaling industrial autonomy", "source": "Robotics Business Review", "date": "2026-08-05", "url": "https://www.therobotreport.com/why-perception-is-the-key-to-scaling-industrial-autonomy/", "summary": "<p>Autonomy is no longer just about robotic motor skills. It encompasses machine awareness, dynamic decision-making, multi-vehicle coordination, and spatial precision at a large scale. <\/p>\n<p>The post <a href=\"https://www.therobotreport.com/why-perception-is-the-key-to-scaling-industrial-autonomy/\">Why perception is the key to scaling industrial autonomy<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "University of Florida opens new robotics lab dedicated to industrialized construction", "source": "Robotics Business Review", "date": "2026-08-05", "url": "https://www.therobotreport.com/university-of-florida-opens-new-robotics-lab-dedicated-to-industrialized-construction/", "summary": "<p>Fueled by Autodesk, UF opened a robotics lab for industrialized construction to fight housing shortages and labor declines.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/university-of-florida-opens-new-robotics-lab-dedicated-to-industrialized-construction/\">University of Florida opens new robotics lab dedicated to industrialized construction<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Avnet and Weston Robot partner to launch edge AI inspection platform", "source": "Robotics Business Review", "date": "2026-08-05", "url": "https://www.therobotreport.com/avnet-and-weston-robot-partner-to-launch-edge-ai-inspection-platform/", "summary": "<p>Avnet and Weston Robot have partnered to launch an AI-powered autonomous inspection platform for complex industrial environments.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/avnet-and-weston-robot-partner-to-launch-edge-ai-inspection-platform/\">Avnet and Weston Robot partner to launch edge AI inspection platform<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "GAM Enterprises to produce Schaeffler’s PSC gear reducers", "source": "Robotics Business Review", "date": "2026-08-05", "url": "https://www.therobotreport.com/gam-enterprises-to-produce-schaefflers-psc-gear-reducers/", "summary": "<p>Acquiring the IP from this core supplier allows GAM to vertically integrate its supply chain and expand its manufacturing capabilities.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/gam-enterprises-to-produce-schaefflers-psc-gear-reducers/\">GAM Enterprises to produce Schaeffler&#8217;s PSC gear reducers<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "What Robotics Companies Think About the U.S. Foreign Robot Ban", "source": "IEEE Spectrum Robotics", "date": "2026-08-04", "url": "https://spectrum.ieee.org/fcc-covered-list-mobile-robots", "summary": "<img src=\"https://spectrum.ieee.org/media-library/photo-collage-of-humanoid-quadruped-and-unmanned-ground-vehicle-robots.jpg?id=67563239&amp;width=1245&amp;height=700&amp;coordinates=0%2C469%2C0%2C469\" /><br /><br /><p>The U.S. Federal Communications Commission (FCC) “Covered List,” originally published in 2021, identifies communications equipment and services that it says pose a threat to national security. <span>On 28 July, the FCC added <\/span><a href=\"https://www.fcc.gov/document/fcc-adds-foreign-produced-power-inverters-and-robots-covered-list-0\" target=\"_blank\">mobile, communicating robots weighing more than 2 kilograms and power inverters<\/a><span> commonly used in solar panels to the list, meaning that new products from any foreign country in these categories are no longer eligible for import.<\/span><\/p><p>The move is a Department of Defense–driven expansion of scattered federal efforts to <a href=\"https://spectrum.ieee.org/chinese-robots-us-ban\" target=\"_self\">further limit U.S. exposure<\/a> to potentially sensitive Chinese technology, but it may impose major changes on the robotics industry in allied countries, too. <\/p><p>The FCC’s <a href=\"https://www.fcc.gov/sites/default/files/robots-nsd.pdf\" target=\"_blank\">announcement<\/a> says:<\/p><blockquote>All foreign-produced advanced robotic devices pose an unacceptable risk to the national security of the United States and to the safety and security of U.S. persons…unless the [Department of Defense determines that] a given foreign-produced advanced robotic device, or a class of such devices, does not pose such risks.<\/blockquote><p>There are two <a href=\"https://docs.fcc.gov/public/attachments/DA-26-786A1.pdf\" target=\"_blank\">important definitions<\/a> here. The first is what an “advanced robotic device” is, and the second is what “unacceptable risk” means. Drones already went through their own round of this sort of regulation, so they’re exempt from this particular restriction, as are connected vehicles and medical devices. As far as the FCC is concerned, “advanced robotic devices” are <em><em>mobile<\/em><\/em> systems that incorporate on-board sensing and communications and have some amount of autonomy. There are a couple of loopholes, including systems weighing under 2 kilograms and any system that communicates at less than 200 kilobits per second, which opens up some creative possibilities. It’s important to note that this applies to <em><em>new<\/em><\/em> devices; those already certified are not restricted for sale or use.<\/p><p>As to the risks, the U.S. government says that foreign advanced robotic devices represent “a cybersecurity risk that threatens the security of critical infrastructure and thus the safety and security of U.S. persons.” There seem to be two main points to the justification, <a href=\"https://docs.fcc.gov/public/attachments/DA-26-786A1.pdf\" target=\"_blank\">found in Appendix C<\/a>. The first is that mobile robots are important to both the economy and the military, so the United States needs its own supply chain and industrial base rather than relying on foreign manufacturers. And second, mobile robots monitor critical infrastructure in sensitive locations, making them a security risk.<\/p><h2>The Country That Must Not Be Named<\/h2><p>As part of <a href=\"https://www.fcc.gov/sites/default/files/robots-nsd.pdf\" rel=\"noopener noreferrer\" target=\"_blank\">its justification<\/a> for why foreign robots are a security risk, the DOD cites <a href=\"https://spectrum.ieee.org/unitree-robot-exploit\" target=\"_self\"><em><em>IEEE Spectrum’s<\/em><\/em> article on a critical vulnerability in robots from Unitree<\/a>, based in Hangzhou, China, along with several other news articles and reports about Chinese robotics. And despite the FCC <a href=\"https://www.fcc.gov/covered-list-faqs-robots-inverters\" rel=\"noopener noreferrer\" target=\"_blank\">swearing<\/a> up and down that this action is “country neutral” and “not targeted at any country or countries,” U.S. national security sources told <em><em>Spectrum<\/em><\/em> that the perceived threat is obviously China. That’s how China feels about it, too, per a Chinese Ministry of Commerce 29 July <a href=\"https://za.china-embassy.gov.cn/eng/fyrth/202607/t20260729_11994715.htm\" rel=\"noopener noreferrer\" target=\"_blank\">press conference<\/a> (<a href=\"https://sinocism.notion.site/MOFCOM-Spokesperson-Answers-Reporters-Questions-on-the-US-FCC-Adding-Foreign-Power-Inverters-and-Ad-3ad84ece41d781ca8e46d4ec2a45c96c\" rel=\"noopener noreferrer\" target=\"_blank\">translation of the first quote here<\/a>):<\/p><blockquote>On the surface, the FCC’s measures fly the banner of “non-discrimination,” but in substance they discriminate against and suppress Chinese enterprises and products…<br /><br />China firmly opposes the U.S. overstretching the concept of national security and going after Chinese companies. Protectionism does not make the U.S. more competitive and will only hurt the interests of U.S. companies and consumers. China will continue to do what is necessary to firmly defend the legitimate and lawful rights and interests of Chinese companies.<\/blockquote><p>It’s unclear what China is going to do about this—but how about the rest of the world? How can foreign companies that make advanced robotic devices get them cleared for FCC authorization? Among <a href=\"https://www.fcc.gov/sites/default/files/robots-ca.pdf\" rel=\"noopener noreferrer\" target=\"_blank\">many, many other things<\/a>, you’ll need to provide “a detailed, time-bound plan to establish or expand manufacturing in the United States for the advanced robotic device.” <\/p><p>Because China also produces a large fraction of robot components, even for robots assembled in the United States, it will have strong leverage in any related negotiations until U.S. robotics companies further diversify their supply chains.<\/p><p class=\"ieee-inbody-related\">RELATED: <a href=\"https://spectrum.ieee.org/chinese-robots-us-ban\" target=\"_self\">Proposed Chinese Robot Ban Is Latest U.S. Tech Sovereignty Move<\/a><\/p><p>Applicants must also submit their applications to the DOD and FCC by 1 January 2028, which is unfortunate for anyone who wants to develop an advanced robotic device after that point. <\/p><h2>Robotics Industry Reactions<\/h2><p>This is all very new, and reactions from the robotics community have been mixed. <\/p><p>Some American robotics companies may benefit in the local market from the newfound lack of competition in the commercial market. <a href=\"https://www.linkedin.com/in/brendanschulman/\" rel=\"noopener noreferrer\" target=\"_blank\">Brendan Schulman,<\/a> <a href=\"https://bostondynamics.com/\" rel=\"noopener noreferrer\" target=\"_blank\">Boston Dynamics<\/a>’ vice president of policy, wrote an enthusiastic <a href=\"https://www.linkedin.com/posts/brendanschulman_after-months-of-increasing-calls-from-industry-activity-7488070496488435712-8LE-?utm_source=share&amp;utm_medium=member_desktop&amp;rcm=ACoAAADzTX0B_X82L2FL9GS1Qib6fNoMXJQlPzA\" rel=\"noopener noreferrer\" target=\"_blank\">endorsement of the ban on LinkedIn<\/a>: “I sense that this is just the first round in a series of policies that will define the success and growth of the industry for decades to come.” On the other hand, third-country buyers <a href=\"https://www.linkedin.com/feed/update/urn:li:activity:7488293386664292355/\" rel=\"noopener noreferrer\" target=\"_blank\">may just stick to Chinese products<\/a>, as they generally have for drones and electric cars. <\/p><p>But not all companies expect major changes from the new regulation. American customers “need to know they can audit the technology, get support quickly, and keep the system operating without depending on a fragile overseas supply chain,” <a href=\"https://www.linkedin.com/in/nicolaus-radford/\" rel=\"noopener noreferrer\" target=\"_blank\">Nic Radford<\/a>, the CEO of the U.S. humanoid robotics company <a href=\"https://spectrum.ieee.org/persona-ai-radford-pratt/\" target=\"_self\">Persona<\/a>, tells <em><em>IEEE Spectrum<\/em><\/em>. In other words, he figures some customers wouldn’t have wanted Chinese humanoids anyway.<\/p><p><a href=\"https://www.linkedin.com/in/phfrey/\" rel=\"noopener noreferrer\" target=\"_blank\">Philipp Frey<\/a>, vice president of strategy for the Swiss quadruped company <a href=\"https://www.anybotics.com/\" rel=\"noopener noreferrer\" target=\"_blank\">ANYbotics<\/a>, agrees. He says their enterprise customers in the United States “increasingly evaluate robots on long-term reliability, cybersecurity, software capability, safety certification, serviceability, and ecosystem integration, not on hardware cost alone.” <\/p><p>ANYbotics also plans to apply for conditional approval of future products, Frey says. That will involve a national-security review by the DOD or the Department of Homeland Security, disclosing company beneficial ownership, supply-chain risks, and declaring a plan for establishing a significant manufacturing presence in the United States.<\/p><p><a href=\"https://www.linkedin.com/in/gavin-kenneally-321a3833/\" target=\"_blank\">Gavin Kenneally<\/a>, CEO of the U.S. quadruped company <a href=\"https://www.ghostrobotics.io/\" target=\"_blank\">Ghost Robotics<\/a>, is more explicit about the risks that Chinese robot strategy poses to the United States. “Active and purposeful spyware is deployed inside the U.S. on Chinese robots. Examples of predatory pricing abound. And this isn’t just a competition between U.S. and Chinese robotics companies; it’s between private U.S. companies and China’s coordinated national strategy,” Kenneally tells <em><em>Spectrum<\/em><\/em>. “If today’s announcement encourages stronger cybersecurity and a more level competitive environment, that’s good for customers and good for the robotics industry.”<\/p><p>So is an industry-wide ban the best way to guard against threats? American approaches to Chinese technology security risks have been “ad hoc and fragmented,” wrote the Brookings Institution sociologist <a href=\"https://www.brookings.edu/people/kyle-chan/\" rel=\"noopener noreferrer\" target=\"_blank\">Kyle Chan<\/a> in a <a href=\"https://www.brookings.edu/articles/a-new-risk-framework-for-chinese-technology-products-and-investments/\" rel=\"noopener noreferrer\" target=\"_blank\">report<\/a> published 9 July. Chan called for the Bureau of Industry and Security, part of the Department of Commerce, to centralize federal information gathering and decision-making on how to handle risky foreign devices. He also called for better public input mechanisms for these issues, and a continuous, proportionate process that tightened or relaxed targeted import restrictions in response to well-defined risks. <\/p><p>That would allow American industry to continue benefiting from partnerships with Chinese manufacturers in less sensitive links of the supply chain, Chan argues. Those links will evolve over time, requiring continued assessment, but without those partnerships, crude bans “could make it more difficult for American startups and researchers to develop new software and end up slowing innovation across the U.S. robotics ecosystem,” he writes.<\/p>"}, {"title": "Humanoids won’t scale on factory floors until costs drop", "source": "Robotics Business Review", "date": "2026-08-04", "url": "https://www.therobotreport.com/humanoids-wont-scale-on-factory-floors-until-costs-drop/", "summary": "<p>The race to commercialize humanoids is on. What’s left to prove is that humanoid robots can beat the economics of the automation manufacturers are already running.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/humanoids-wont-scale-on-factory-floors-until-costs-drop/\">Humanoids won’t scale on factory floors until costs drop<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Zoox unveils production-ready robotaxi for U.S. expansion", "source": "Robotics Business Review", "date": "2026-08-04", "url": "https://www.therobotreport.com/zoox-unveils-production-ready-robotaxi-for-u-s-expansion/", "summary": "<p>Amazon subsidiary Zoox unveiled its final production-ready robotaxi design and expanded testing following a subtle redesign to improve rider comfort.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/zoox-unveils-production-ready-robotaxi-for-u-s-expansion/\">Zoox unveils production-ready robotaxi for U.S. expansion<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "U.S. Navy picks Blue Water Autonomy to use autonomous vessels for deep ocean surveys", "source": "Robotics Business Review", "date": "2026-08-04", "url": "https://www.therobotreport.com/u-s-navy-picks-blue-water-autonomy-to-use-autonomous-vessels-for-deep-ocean-surveys/", "summary": "<p>Blue Water Autonomy creates unmanned ships that can operate autonomously on the open ocean for months a time.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/u-s-navy-picks-blue-water-autonomy-to-use-autonomous-vessels-for-deep-ocean-surveys/\">U.S. Navy picks Blue Water Autonomy to use autonomous vessels for deep ocean surveys<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Reimagine Robotics emerges from stealth with robots that ‘learn on the job’", "source": "Robotics Business Review", "date": "2026-08-03", "url": "https://www.therobotreport.com/reimagine-robotics-emerges-stealth-with-robotslearn-on-the-job/", "summary": "<p>Reimagine Robotics, founded by former Google DeepMind Applied Robotics leaders, is developing systems that do not require specialized programmers.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/reimagine-robotics-emerges-stealth-with-robotslearn-on-the-job/\">Reimagine Robotics emerges from stealth with robots that &#8216;learn on the job&#8217;<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Walden Robotics Partners With Toyota on Practical Humanoids", "source": "IEEE Spectrum Robotics", "date": "2026-08-03", "url": "https://spectrum.ieee.org/humanoid-robots-walden-robotics-toyota", "summary": "<img src=\"https://spectrum.ieee.org/media-library/humanoid-orange-and-white-robot-using-two-finger-gripper-hands-to-work-with-metal-tool-components.jpg?id=67568024&amp;width=1245&amp;height=700&amp;coordinates=0%2C62%2C0%2C63\" /><br /><br /><p>For a while there, it seemed as though robotics as a whole was stuck in a <a href=\"https://spectrum.ieee.org/top-robotics-stories-2024\" target=\"_self\">mad rush<\/a> towards building <a href=\"https://spectrum.ieee.org/topic/robotics/humanoid-robots/\" target=\"_self\">humanoid robots<\/a> mostly because it was very possible (and very lucrative) to do so, even without near-term goals that were necessarily realistic. Some of the magic of those first couple of years of the humanoid explosion has stuck around, but there’s also been an industry-wide sobering leading to <a href=\"https://spectrum.ieee.org/humanoid-robot-scaling\" target=\"_self\">pointed questions about practicality and value<\/a>. In other words, starting a commercial humanoid company <em><em>now<\/em><\/em> is a much different proposition than it would have been just a few years ago. <\/p><p>On 15 July, <a href=\"https://www.waldenrobotics.com/news/walden-robotics-launches-from-stealth\" rel=\"noopener noreferrer\" target=\"_blank\">Walden Robotics emerged from stealth<\/a> with US $300 million in funding at a valuation of $1.1 billion. Walden is a spinout of <a href=\"https://spectrum.ieee.org/toyota-to-invest-1-billion-in-ai-and-robotics-rd\" target=\"_self\">Toyota Research Institute<\/a> (TRI), and it’s spent the last 10 or so years working on hard problems in robotics with the goal of transitioning from research to real-world applications. That seems like the amount of time and experience that it might reasonably take to develop a <a href=\"https://spectrum.ieee.org/humanoid-robot-scaling\" target=\"_self\">practical and value-driven approach<\/a> to deploying general-purpose humanoid robots, and Walden has chosen an excellent starting point by skipping the legs.<\/p><p>“It’s ironic,” says Walden cofounder and CEO <a href=\"https://www.linkedin.com/in/russ-tedrake-88648a4a/\" rel=\"noopener noreferrer\" target=\"_blank\">Russ Tedrake<\/a>. “I thought about legs for 20 years; that’s the class I teach at MIT. There are many reasons to build a robot with legs. But the question is, what’s the addressable market? And what percentage of it is covered by a wheeled base?” It’s this focused, practical thinking that sets Walden somewhat apart from many (if not most) of the other companies in this space. Rather than <a href=\"https://spectrum.ieee.org/boston-dynamics-spot-robot-dog-now-available\" target=\"_self\">developing a robot first and searching for a viable commercial use case second<\/a>, Walden instead identified applications where robots can provide value now, and designed a robot that could safely and efficiently meet those needs.<\/p><p class=\"shortcode-media shortcode-media-youtube\"> <span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span> <small class=\"image-media media-photo-credit\">Walden Robotics<\/small> <\/p><h2>Walden Robotics’ Manufacturing Focus<\/h2><p class=\"shortcode-media shortcode-media-rebelmouse-image rm-float-left rm-resized-container rm-resized-container-25\" style=\"float: left;\"> <img alt=\"A smiling man in a blue shirt\" class=\"rm-shortcode\" id=\"f545c\" src=\"https://spectrum.ieee.org/media-library/a-smiling-man-in-a-blue-shirt.jpg?id=67568051&amp;width=980\" /> <small class=\"image-media media-caption\">Russ Tedrake is the CEO and cofounder of Walden Robotics.<\/small><small class=\"image-media media-photo-credit\">Walden Robotics<\/small><\/p><p>Tedrake is light on the details about what specific applications Walden is targeting at this point (citing confidentiality with current commercial partners). Manufacturing and logistics environments where there are a lot of <a href=\"https://www.youtube.com/watch?v=F_7IPm7f1vI\" target=\"_blank\">relatively simple<\/a> and <a href=\"https://www.youtube.com/watch?v=tv90GFM9RAo\" target=\"_blank\">repetitive tasks<\/a> that aren’t friendly to conveyor belts and preprogrammed robot arms are a good bet. Even in these environments, however, robots still have to find a useful niche because they’re going up against human workers who are more flexible while also cheaper to employ. So the question is: How do you make an argument to a customer that a robot is actually a better solution than their existing human workers?<\/p><p>“You need to find applications with high utilization—where the robot is used 24 hours a day, 7 days a week,” says Tedrake. “Manufacturing is a global imperative right now, and it makes the economics work.” Economic viability is a necessary condition, but it’s not a sufficient one for Walden, or for their partnership with Toyota. People are a big part of Walden’s plan, too.<\/p><p>One of Walden’s major strengths is the company’s partnership with Toyota, which is not all that surprising given that Walden is a spinout from TRI, which is <a href=\"https://spectrum.ieee.org/toyota-to-invest-1-billion-in-ai-and-robotics-rd\" target=\"_self\">Toyota’s Silicon Valley–based R&amp;D arm<\/a>. “Toyota was very proud of the work we had done at TRI, and was ready to go big in this space,” says Tedrake. “Part of the excitement of having Toyota as a partner is that their culture is deeply people-first. When talking to Toyota’s leadership, I was never asked how much money this is going to make, but I was asked how it will improve the quality of life for all people.”<\/p><p class=\"shortcode-media shortcode-media-rebelmouse-image\"> <img alt=\"A white and orange humanoid robot manipulates an object in its two-finger grippers.\" class=\"rm-shortcode\" id=\"209d4\" src=\"https://spectrum.ieee.org/media-library/a-white-and-orange-humanoid-robot-manipulates-an-object-in-its-two-finger-grippers.jpg?id=67568030&amp;width=980\" /> <small class=\"image-media media-caption\">The robot’s chonky design allows it to meet the high-payload requirements of useful manufacturing work.<\/small><small class=\"image-media media-photo-credit\">Walden Robotics<\/small><\/p><p>In this context, at least in the short term, Walden’s approach to improving the quality of life for people is to take over those aforementioned repetitive manufacturing tasks with robots. Tedrake hopes that this will lead to workplaces where skilled craftspeople are able to do even more with their hard-earned expertise, increasing their efficiency, productivity, and happiness all at the same time—a noble goal, although there’s only so much Walden itself can do to make this happen, and not all customers will share Toyota’s priorities.<\/p><h2>Wheeled Humanoid Robots in Factories<\/h2><p>Many other <a href=\"https://www.agilityrobotics.com/\" target=\"_blank\">humanoid<\/a> <a href=\"https://www.figure.ai/\" target=\"_blank\">robotics<\/a> <a href=\"https://apptronik.com/\" target=\"_blank\">companies<\/a> are also targeting these logistics and manufacturing spaces with general-purpose robots, and they’re doing so by making robots that are as humanlike as possible. The theory is that a humanoid form factor is necessary when operating in human environments. And there are certainly arguments in favor of a humanoid with legs—stairs exist, for one, and legged robots have a smaller footprint compared with ones that have wheels.<\/p><p>But a large wheeled base offers some significant advantages, as Tedrake points out. You’re incentivized to cram the base full of batteries, since more weight near the floor keeps the robot stable, which also solves the problem of running out of power during the middle of the workday. More importantly, a statically stable robot that moves around on a wheeled base can bypass the <a href=\"https://spectrum.ieee.org/humanoid-robot-scaling\" target=\"_self\">safety challenges<\/a> that are currently keeping legged humanoids physically separated from real humans—most prominently, the fact that legged robots can fall over. “Factories already have autonomous mobile [wheeled] robots,” explains Tedrake. “They already have safety cases built around AMRs. You can piggyback on that with a wheeled base.”<\/p><p class=\"shortcode-media shortcode-media-rebelmouse-image\"> <img alt=\"A close-up of a robotic gripper grasping a metallic object in a vise.\" class=\"rm-shortcode\" id=\"f600c\" src=\"https://spectrum.ieee.org/media-library/a-close-up-of-a-robotic-gripper-grasping-a-metallic-object-in-a-vise.jpg?id=67568022&amp;width=980\" /> <small class=\"image-media media-caption\">Simple, rugged grippers make the robot suitable for commercial deployment.<\/small><small class=\"image-media media-photo-credit\">Walden Robotics<\/small><\/p><p>Walden’s perspective on manipulation is similar. Many humanoid companies are using five-fingered hands that are highly dexterous but also highly complex, which Tedrake believes is not a pragmatic approach in the context of commercial deployments. “There’s a question of what you need to do the tasks, but the real question is just durability,” Tedrake says. “We have been deployed in a Toyota factory, and at the end of the week, the hands take a beating, so we built hands that can take that. I have not seen a more dexterous hand that could have done the work our hand has done.”<\/p><p>Walden’s long-term plan is to build “general-purpose robots.” It’s not always clear what a general-purpose robot is, because (I would argue) nobody is quite sure what “general purpose” means. It’s certainly not referring to robots that can do <em><em>everything<\/em><\/em>; I think the closest we can get are robots that can be taught to do a useful number of different skills, which is why I prefer the term “multipurpose.” It’s a little pedantic, I know, but I think the distinction is important because it moderates expectations in the near term.<\/p><p>Part of where Walden’s optimism towards general purposeness comes from is TRI’s earlier research on <a href=\"https://medium.com/toyotaresearch/tris-robots-learn-new-skills-in-an-afternoon-here-s-how-2c30b1a8c573\" target=\"_blank\">diffusion policy<\/a>, which helps robots learn new skills more quickly by leveraging previously learned skills as a foundation. “Fundamentally, multitasking is a way to get to a general-purpose robot,” Tedrake says. “I believe there is a single platform that can do a lot of tasks that are of high value for real customers. That will give us the experience we need to give birth to this deployed general-purpose capability.”<\/p>"}, {"title": "HEBI Robotics earns NASA SBIR grant to fast track miniaturized actuators", "source": "The Robot Report", "date": "2026-08-03", "url": "https://www.therobotreport.com/hebi-robotics-earns-nasa-sbir-grant-fast-track-miniaturized-actuators/", "summary": "<p>This Phase I award is only part of HEBI Robotics' roadmap. The company also plans to continue developing its existing actuation hardware.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/hebi-robotics-earns-nasa-sbir-grant-fast-track-miniaturized-actuators/\">HEBI Robotics earns NASA SBIR grant to fast track miniaturized actuators<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}], "embeddedNews": [{"title": "Switch Mod Fixes Fiddly Car Door Projector", "source": "Hackaday", "date": "2026-09-03", "url": "https://hackaday.com/2026/09/02/switch-mod-fixes-fiddly-car-door-projector/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"450\" src=\"https://hackaday.com/wp-content/uploads/2026/09/carprojector_feat.jpg?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>While the Citroën logo they project onto the pavement looks great, [OrangeTungsten] wasn&#8217;t thrilled with how their door-mounted projectors actually functioned. The mechanism for detecting when they should kick on <a class=\"read-more\" href=\"https://hackaday.com/2026/09/02/switch-mod-fixes-fiddly-car-door-projector/\">&#8230;read more<\/a>"}, {"title": "Has FDM 3D Printing Hit Its Peak?", "source": "Hackaday", "date": "2026-09-03", "url": "https://hackaday.com/2026/09/02/__trashed-8/", "summary": "<div><img alt=\"Art of 3D printer in the middle of printing a Hackaday Jolly Wrencher logo\" class=\"attachment-large size-large wp-post-image\" height=\"450\" src=\"https://hackaday.com/wp-content/uploads/2020/02/3D-Printering-Header-New.jpg?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>Over the time Hackaday has been in existence, the art of 3D printing has evolved from a relatively crude hit-and-miss affair to something approaching what we all imagined back then. <a class=\"read-more\" href=\"https://hackaday.com/2026/09/02/__trashed-8/\">&#8230;read more<\/a>"}, {"title": "DIY ESP32-P4 weather station & air quality monitor connects to LoRa and ESP-NOW sensors, various weather APIs", "source": "CNX Software", "date": "2026-09-03", "url": "https://www.cnx-software.com/2026/09/03/diy-esp32-p4-weather-station-air-quality-monitor-connects-to-lora-and-esp-now-sensors-various-weather-apis/", "summary": "<div><img alt=\"DIY ESP32-P4 Weather Station Air and Quality Monitor\" class=\"attachment-medium size-medium wp-post-image\" height=\"480\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/09/DIY-ESP32-P4-Weather-Station-Air-Quality-Monitor-720x480.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Harald Kreuzer has built an ESP32-P4 weather station and air quality monitor that features a 10.1-inch dashboard display and a built-in Sensirion SEN66 sensor for particulate matter, CO2, VOC, and NOX, and connects to wireless LoRa and ESP-NOW sensors. The project is entirely made of off-the-shelf boards, so no custom hardware is used, and it should be relatively easy to reproduce. It doesn&#8217;t require any cloud or user account, although it can connect to a choice of weather APIs (Open-Meteo, OpenWeatherMap or Visual Crossing) to display weather forecasts. The build is fully documented in a long blog post, so we&#8217;ll highlight the key features of the ce by  4x<\/a> appeared first on <a href=\"https://www.electronicsweekly.com\">Electronics Weekly<\/a>.<\/p>"}, {"title": "Opportunities, capabilities and effects of emerging technologies by Elon Musk.", "source": "Electronics Weekly", "date": "2026-09-03", "url": "https://www.electronicsweekly.com/news/business/opportunities-benefits-and-2026-09/", "summary": "<p>At the G20 Innovation Ministerial  meeting in Chapel Hill, North Carolina on Tuesday, Elon Musk gave an upbeat view on how today’s emerging technologies will change the world. “I think [&#8230;]<\/p>\n<p>The post <a href=\"https://www.electronicsweekly.com/news/business/opportunities-benefits-and-2026-09/\">Opportunities, capabilities and effects of emerging technologies by Elon Musk.<\/a> appeared first on <a href=\"https://www.electronicsweekly.com\">Electronics Weekly<\/a>.<\/p>"}, {"title": "Skeleton and Infineon hook up on SSTs", "source": "Electronics Weekly", "date": "2026-09-03", "url": "https://www.electronicsweekly.com/news/business/skeleton-and-infineon-hook-up-on-ssts-2026-09/", "summary": "<p>Infineon  and supercapacitor specialist Skeleton Technologies have signed an MoU to collaborate on high-efficiency, resilient power solutions for modern data centers. The rapid growth of AI, increasing power demand and [&#8230;]<\/p>\n<p>The post <a href=\"https://www.electronicsweekly.com/news/business/skeleton-and-infineon-hook-up-on-ssts-2026-09/\">Skeleton and Infineon hook up on SSTs<\/a> appeared first on <a href=\"https://www.electronicsweekly.com\">Electronics Weekly<\/a>.<\/p>"}, {"title": "Vector Photonics to promote PCSELs in datacentres", "source": "Electronics Weekly", "date": "2026-09-03", "url": "https://www.electronicsweekly.com/news/business/vector-photonics-to-promote-pcsels-in-datacentres-2026-09/", "summary": "<p>Vector Photonics, the Glasgow PCSEL pioneer.  will show at ECOC 2026, the European Conference on Optical Communication, how its PCSEL laser technology can eliminate communicat p-content/uploads/2026/08/sears-12_and_ti-5015_side-by-side_danalog_youtube.jpg?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>Thermal printers are still extremely common today, using small heating elements in combination with temperature-sensitive paper to create a dot matrix-like effect without messing with ink ribbons and complex mechanisms. <a class=\"read-more\" href=\"https://hackaday.com/2026/09/02/doubling-thermal-printer-resolution-by-wiggling/\">&#8230;read more<\/a>"}, {"title": "Harvesting Namib Desert Fog with High Voltage", "source": "Hackaday", "date": "2026-09-02", "url": "https://hackaday.com/2026/09/02/harvesting-namib-desert-fog-with-high-voltage/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"470\" src=\"https://hackaday.com/wp-content/uploads/2026/09/field_testing_atmospheric_water_harvesting_plasma_channel_youtube.jpg?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>As fun as mucking about with simulated environments in a laboratory is, at some point you have to do those field tests to demonstrate that your prototype actually works in <a class=\"read-more\" href=\"https://hackaday.com/2026/09/02/harvesting-namib-desert-fog-with-high-voltage/\">&#8230;read more<\/a>"}, {"title": "FLOSS Weekly Episode 880: The Two Wolves", "source": "Hackaday", "date": "2026-09-02", "url": "https://hackaday.com/2026/09/02/floss-weekly-episode-880-the-two-wolves/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"484\" src=\"https://hackaday.com/wp-content/uploads/2021/06/Pipewire.jpg?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>This week Jonathan chats with Benjamin Samuels of Trail of Bits! The conversation focuses on Patch the Planet, a new initiative to help Open Source projects deal with the fallout <a class=\"read-more\" href=\"https://hackaday.com/2026/09/02/floss-weekly-episode-880-the-two-wolves/\">&#8230;read more<\/a>"}, {"title": "How a 1981 RAM Expansion Worked", "source": "Hackaday", "date": "2026-09-02", "url": "https://hackaday.com/2026/09/02/how-a-1981-ram-expansion-worked/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"450\" src=\"https://hackaday.com/wp-content/uploads/2026/08/ram-pack-featured.jpg?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>Sir Clive Sinclair and his company were notorious for pushing the limits of electronic parts in search of a low price, and his ZX series 8-bit computers were fine examples <a class=\"read-more\" href=\"https://hackaday.com/2026/09/02/how-a-1981-ram-expansion-worked/\">&#8230;read more<\/a>"}, {"title": "“I’m Not Dead Yet!” Reverse Polish Notation Calculators You Can Still Buy", "source": "Hackaday", "date": "2026-09-02", "url": "https://hackaday.com/2026/09/02/im-not-dead-yet-reverse-polish-notation-calculators-you-can-still-buy/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"484\" src=\"https://hackaday.com/wp-content/uploads/2026/08/RPN.jpg?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>If you used a scientific calculator in the 1970s or 1980s, there was a fair chance that it worked differently from almost every calculator you see today. Instead of typing: <a class=\"read-more\" href=\"https://hackaday.com/2026/09/02/im-not-dead-yet-reverse-polish-notation-calculators-you-can-still-buy/\">&#8230;read more<\/a>"}, {"title": "LightMake L4 3D printer features four independent heads for simultaneous or multi-color printing (Crowdfunding)", "source": "CNX Software", "date": "2026-09-02", "url": "https://www.cnx-software.com/2026/09/02/lightmake-l4-3d-printer-features-four-independent-printing-heads/", "summary": "<div><img alt=\"LightMake L4 3D printer four printing heads\" class=\"attachment-medium size-medium wp-post-image\" height=\"536\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/09/LightMake-L4-3D-printer-four-printing-heads-1-720x536.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>The LightMake L4 is a desktop 3D printer with four independent printing heads for high-throughput multi-color, multi-material, and batch production. It uses four independently controlled printheads and linear-motor motion instead of conventional belts, allowing users to print four identical models simultaneously, produce complex multi-color parts with minimal purge waste, or combine up to four materials in a single print. Typically, multi-color FDM 3D printers like the Bambu Lab X1 or Geeetech A20M use a single-nozzle purge material during every color change, which leads to a lot of material waste and longer print times. The LightMake L4 takes a different approach by keeping four filaments loaded and heated in four completely separate extruders. According to the company, this allows for one-second toolhead changes and near-zero purge waste. The linear motor system also promises ±1µm motion precision and speeds of up to 500 mm/s. LightMake L4 and L1 specifications: Printing technology – [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/09/02/lightmake-l4-3d-printer-features-four-independent-printing-heads/\">LightMake L4 3D printer features four independent heads for simultaneous or multi-color printing (Crowdfunding)<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "GPIBee (UsbGpib V3) USB-to-GPIB adapter gains Ethernet (PoE), but launches as closed-source hardware", "source": "CNX Software", "date": "2026-09-02", "url": "https://www.cnx-software.com/2026/09/02/gpibee-usbgpib-v3-usb-to-gpib-adapter-gains-ethernet-poe-but-launches-as-closed-source-hardware/", "summary": "<div><img alt=\"GPIBee PoE to GPIB adapter\" class=\"attachment-medium size-medium wp-post-image\" height=\"370\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/09/GPIBee-PoE-to-GPIB-adapter-720x370.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Last December, we wrote about XyphroLabs’s UsbGpib open-source hardware, affordable, and portable USB-to-GPIB adapter designed for legacy GPIB/IEEE-488 instruments and offering modern hardware and software. At the time, the UsbGpib V3 was also in the works with Ethernet (PoE) support, and the good news is that it&#8217;s now available, renamed as GPIBee. The less good news is that while V1 and V2 were both open-source hardware products (and still are), the GPIBee has been released as closed-source hardware for reasons we&#8217;ll explain below. GPIBee specifications: Microcontroller – Not disclosed. But not the Microchip ATMega32U4 8-bit AVR MCU found in V2 since its USB interface is limited to 12 Mbps Host interfaces USB 2.0 (480 Mbps) Type-C port with support for four modes Full USBTMC (USB Test and Measurement Class) VXI-11 over USB-Ethernet (CDC NCM) linux-gpib native interface Prologix-compatible (++ commands) via CDC UART (virtual COM port) 10/100Mbps Ethernet RJ45 port [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/09/02/gpibee-usbgpib-v3-usb-to-gpib-adapter-gains-ethernet-poe-but-launches-as-closed-source-hardware/\">GPIBee (UsbGpib V3) USB-to-GPIB adapter gains Ethernet (PoE), but launches as closed-source hardware<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Circuit Valley CHC5 – A modular USB, HDMI, and Ethernet camera system (Crowdfunding)", "source": "CNX Software", "date": "2026-09-02", "url": "https://www.cnx-software.com/2026/09/02/circuit-valley-chc5-a-modular-usb-hdmi-and-ethernet-camera-system/", "summary": "<div><img alt=\"Circuit Valley CHC5 Open Camera\" class=\"attachment-medium size-medium wp-post-image\" height=\"425\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/09/Circuit-Valley-CHC5-Open-Camera-720x425.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Circuit Valley&#8217;s CHC5 is a modular camera system based on a Core board powered by an AMD/Xilinx Zynq-7020 SoC FPGA, a range of interface boards with USB, HDMI, or Ethernet (PoE), various sensor boards, and a metal enclosure. The solution can be customized with different lens objectives and different sensors with MIPI D-PHY, LVDS, Sub-LVDS, Low Voltage LVDS, or SLVS interfaces. The Zynq-7020&#8217;s Cortex-A9 cores can handle complex tasks, while the FPGA fabric takes care of high-speed calculation and correction on the image, and can also be leveraged for  AI/machine-vision-specific algorithms or complex low-latency hardware acceleration. CHC5 specifications: Core board SoC &#8211; Xilinx AMD Zynq-7020 SoC FPGA CPU &#8211; Dual-core Arm Cortex-A9 processor FPGA &#8211; 85K logic cells, 4.9Mb Block RAM, 220 DSP slices System Memory &#8211; 1GB DDR3 Storage 1 Gbit flash memory MicroSD card slot ISP &#8211; Full-fledged ISP implemented on FPGA fabric Multiple interface boards with 10Gbps [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/09/02/circuit-valley-chc5-a-modular-usb-hdmi-and-ethernet-camera-system/\">Circuit Valley CHC5 &#8211; A modular USB, HDMI, and Ethernet camera system (Crowdfunding)<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "NXP MCX A5 MCUs Bring 10BASE-T1S Ethernet to Industrial Edge Nodes", "source": "Embedded.com", "date": "2026-09-02", "url": "https://www.embedded.com/nxp-mcx-a5-mcus-bring-10base-t1s-ethernet-to-industrial-edge-nodes/", "summary": "<p>The MCX A5 MCUs combine 10BASE-T1S Ethernet, topology discovery, and post-quantum security to extend Ethernet deeper into industrial networks.<\/p>\n<p>The post <a href=\"https://www.embedded.com/nxp-mcx-a5-mcus-bring-10base-t1s-ethernet-to-industrial-edge-nodes/\">NXP MCX A5 MCUs Bring 10BASE-T1S Ethernet to Industrial Edge Nodes<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "Unlocking Autonomy in Military Drones Goes Beyond SWaP-C", "source": "Embedded.com", "date": "2026-09-02", "url": "https://www.embedded.com/unlocking-autonomy-in-military-drones-goes-beyond-swap-c/", "summary": "<p>Global defense spending has increased amidst rising geopolitical tensions and de-globalization to strengthen national security. The Trump administration's hefty defense budget request this June allocates $2.4 billion just to drones. Resulting from this paradigm shift in warfare, global spending also follows this trend. Further fueled by technological advances, it has converged into a boon for [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/unlocking-autonomy-in-military-drones-goes-beyond-swap-c/\">Unlocking Autonomy in Military Drones Goes Beyond SWaP-C<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "Picture of the Day: MAGPIE signs up to be ESA’s first lunar rover", "source": "Electronics Weekly", "date": "2026-09-02", "url": "https://www.electronicsweekly.com/blogs/gadget-master/picture-of-the-day/picture-of-the-day-magpie-signs-up-to-be-esas-first-lunar-rover-2026-09/", "summary": "<p>This is what a MAGPIE will look like. At least an artist's impression. Of ESA’s first lunar rover, that is. The European Space Agency (ESA) and ispace-Europe officially sign an agreement for MAGPIE to be the first European rover on the Moon...<\/p>\n<p>The post <a href=\"https://www.electronicsweekly.com/blogs/gadget-master/picture-of-the-day/picture-of-the-day-magpie-signs-up-to-be-esas-first-lunar-rover-2026-09/\">Picture of the Day: MAGPIE signs up to be ESA&#8217;s first lunar rover<\/a> appeared first on <a href=\"https://www.electronicsweekly.com\">Electronics Weekly<\/a>.<\/p>"}, {"title": "Anritsu AH15203A wideband linear amplifier for optical comms", "source": "Electronics Weekly", "date": "2026-09-02", "url": "https://www.electronicsweekly.com/news/products/anritsu-ah15203a-wideband-linear-amplifier-for-optical-comms-2026-09/", "summary": "<p>Anritsu is launching a 140 Gbaud wideband linear amplifier with integrated bias tee, the AH15203A/B, for optical communications. Aimed at developers of optical transmission devices, the company says the new [&#8230;]<\/p>\n<p>The post <a href=\"https://www.electronicsweekly.com/news/products/anritsu-ah15203a-wideband-linear-amplifier-for-optical-comms-2026-09/\">Anritsu AH15203A wideband linear amplifier for optical comms<\/a> appeared first on <a href=\"https://www.electronicsweekly.com\">Electronics Weekly<\/a>.<\/p>"}, {"title": "Memory Mania", "source": "Electronics Weekly", "date": "2026-09-02", "url": "https://www.electronicsweekly.com/blogs/mannerisms/markets/memory-mania-2026-09/", "summary": "<p>According to WSTS global memory chip revenue is projected to surge 250% to $804 billion this year and could exceed $1 trillion in 2027. Meanwhile, memory’s share of the overall [&#8230;]<\/p>\n<p>The post <a href=\"https://www.electronicsweekly.com/blogs/mannerisms/markets/memory-mania-2026-09/\">Memory Mania<\/a> appeared first on <a href=\"https://www.electronicsweekly.com\">Electronics Weekly<\/a>.<\/p>"}, {"title": "Fine, I’ll build my own text editor", "source": "Adafruit", "date": "2026-09-02", "url": "https://blog.adafruit.com/2026/09/02/fine-ill-build-my-own-text-editor/", "summary": "David Bushell set out to build his own browser based text editor. His first attempt drew everything to a &#60;canvas&#62; element at 60 to 120 frames per second. It worked, but canvas gives nothing for free: no text selection, no scrollbars, and no accessibility. He faked scrolling with a hidden overflow &#60;div&#62; sized to match the text, then [&#8230;]"}, {"title": "The WT | Wearable Tech Conference is Happening this Month", "source": "Adafruit", "date": "2026-09-02", "url": "https://blog.adafruit.com/2026/09/02/the-wt-wearable-tech-conference-is-happening-this-month/", "summary": "The WT &#124; Wearable Technologies Conference is happening this month on the 15the and 16th. Interested to see what&#8217;s to come in the wearable world. The WT &#124; Wearable Technologies Conference is the world&#8217;s leading event for anyone building the future of wearable tech. Since 2006, we&#8217;ve brought together top industry leaders, innovators, and researchers [&#8230;]"}, {"title": "3D PCB previews are a delight", "source": "Adafruit", "date": "2026-09-02", "url": "https://blog.adafruit.com/2026/09/02/3d-pcb-previews-are-a-delight/", "summary": "James Bowman has added 3D board previews to cuflow, his Python-based PCB design tool, and wrote about it on the Excamera Labs Substack. When he designed the TermDriver hardware, parts showed up only as silkscreen outlines, so picturing the finished board was guesswork. The new previews render in a web page using three.js, with a [&#8230;]"}, {"title": "A GeoJSON map viewer", "source": "Adafruit", "date": "2026-09-02", "url": "https://blog.adafruit.com/2026/09/02/a-geojson-map-viewer/", "summary": "Simon Willison built a GeoJSON map viewer. He needed it while helping gather maps of local political boundaries for the Granada Community Services District and the Midcoast Community Council. The requirement was simple: display GeoJSON files on a map and export the result as a PNG. He asked GPT-5.6-Sol for tool suggestions and it built [&#8230;]"}, {"title": "Sounds of the 1980s: NES", "source": "Adafruit", "date": "2026-09-02", "url": "https://blog.adafruit.com/2026/09/02/sounds-of-the-1980s-nes/", "summary": "The Computer History Museum posted a 15 second short on YouTube featuring the sounds of Nintendo&#8217;s first home gaming console. Not game sounds but sounds as one uses the machine. The console started out in Japan as the Famicom in 1983. It arrived in the United States as the Nintendo Entertainment System in 1985. See [&#8230;]"}, {"title": "How Gold Plastic Syndrome is killing toys and game consoles", "source": "Adafruit", "date": "2026-09-02", "url": "https://blog.adafruit.com/2026/09/02/how-gold-plastic-syndrome-is-killing-toys-and-game-consoles/", "summary": "The Transformers Wiki keeps a detailed entry on Gold Plastic Syndrome (GPS), a fan term for plastic that decomposes and then crumbles to bits under almost no force. It differs from ordinary stress fracturing. Normal breaks show stress marks first, and the broken piece still bends. A part with GPS keeps cracking apart like a [&#8230;]"}, {"title": "A Safari extension that hides YouTube AI-labeled videos", "source": "Adafruit", "date": "2026-09-02", "url": "https://blog.adafruit.com/2026/09/02/a-safari-extension-that-hides-youtube-ai-labeled-videos/", "summary": "Weedout is a Safari extension that removes videos YouTube has labeled &#8220;Made with AI&#8221; from what you see. Instead of covering them with a warning screen, it takes them out of the home feed, search results, related videos and Shorts. Detection uses YouTube&#8217;s own &#8220;Made with AI&#8221; disclosure badge, so there is no guessing and [&#8230;]"}, {"title": "Creating green clothing with living fungi", "source": "Adafruit", "date": "2026-09-02", "url": "https://blog.adafruit.com/2026/09/02/creating-green-clothing-with-living-fungi/", "summary": "Maya Posch, writing at Hackaday, covers a Science Advances paper from Ke Li and colleagues on a fungal platform for living textiles. Most fabric is dead tissue, or was never part of an organism at all. This work falls under engineered living materials, where the fabric itself stays alive. The base material is the fungus [&#8230;]"}, {"title": "JP’s Product Pick of the Week  9/1/26 @adafruit @johnedgarpark #adafruit #newproductpick", "source": "Adafruit", "date": "2026-09-02", "url": "https://blog.adafruit.com/2026/09/02/jps-product-pick-of-the-week-9-1-26-adafruit-johnedgarpark-adafruit-newproductpick/", "summary": "If you missed this week’s livestream of John Park’s Product Pick of the Week, not to worry, here’s the video . This week’s pick is the Adafruit I2S 3W Stereo Speaker Bonnet! Watch the video to find out about the Adafruit I2S 3W Stereo Speaker Bonnet, how to use it, a live demo, and more. [&#8230;]"}, {"title": "Qualcomm introduces Dragonwing Q-2390 and IQ-2390 for consumer and industrial AIoT applications", "source": "CNX Software", "date": "2026-09-01", "url": "https://www.cnx-software.com/2026/09/01/qualcomm-introduces-dragonwing-q-2390-and-iq-2390-for-consumer-and-industrial-aiot-applications/", "summary": "<div><img alt=\"Qualcomm Dragonwing IQ2 Q2\" class=\"attachment-medium size-medium wp-post-image\" height=\"405\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/09/Qualcomm-Dragonwing-IQ2-Q2-720x405.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Qualcomm has announced the Qualcomm Dragonwing Q-2390 and IQ-2390 quad-core Cortex-A78/A55 processors for AIoT consumer, commercial and industrial applications. The Dragonwing Q-2390 processor is designed for commercial and consumer devices, notably for applications such as retail and smart home products, as well as smart displays and enterprise edge devices, while the Dragonwing IQ-2390 processor is the SKU from the Dragonwing IQ2 Series designed for industrial automation, machine vision, building management and energy systems. Qualcomm IQ-2390 and Q-2390 specifications: CPU 1x Arm Cortex-A78 core up to 1.5 or 1.9 GHz depending on SKU 3x Arm Cortex-A55 cores up to 1.5 or 1.9 GHz depending on SKU Optional SiFive E61 RISC-V real-time core up to 600MHz with 768kB memory Cache &#8211; 512 KB L3 cache GPU &#8211; Qualcomm Adreno 704 up to 1.1 GHz Audio DSP &#8211; Qualcomm Hexagon V66  up to 1.1 GHz NPU &#8211; Qualcomm Hexagon up to 1.1 TOPS DPU [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/09/01/qualcomm-introduces-dragonwing-q-2390-and-iq-2390-for-consumer-and-industrial-aiot-applications/\">Qualcomm introduces Dragonwing Q-2390 and IQ-2390 for consumer and industrial AIoT applications<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Makera Z1 Desktop CNC Review – Smart milling, 4-th axis module, and 5W laser engraving", "source": "CNX Software", "date": "2026-09-01", "url": "https://www.cnx-software.com/2026/09/01/makera-z1-desktop-cnc-review-smart-milling-4-axis-module-and-5w-laser-engraving/", "summary": "<div><img alt=\"makera z1 desktop cnc cyclone dust collector lite\" class=\"attachment-medium size-medium wp-post-image\" height=\"540\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/09/makera-z1-desktop-cnc-cyclone-dust-collector-lite-720x540.png\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>The Makera Z1 Desktop CNC is a desktop CNC machine designed for milling and engraving work that requires precision. The fully enclosed machine features an aluminum structure, offers a 200 × 200 × 100 mm work volume, and is suitable for wood, plastic, acrylic, PCB boards, carbon fiber, as well as non-ferrous metals such as aluminum, brass, and copper. The standout feature of this model is its fairly complete set of assistive functions, including a quick tool change system for swapping milling bits, auto probing &#38; leveling for detecting position and leveling the workpiece, the AeroDust system for blowing and managing chips/dust, and a built-in camera for monitoring operation. In addition, optional accessories such as a 4th-axis rotary module, a 5W laser head, a workholding kit, and a 3D probe can also be installed. This model relies on a linear rail system featuring Acme lead screws and NEMA 17 stepper [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/09/01/makera-z1-desktop-cnc-review-smart-milling-4-axis-module-and-5w-laser-engraving/\">Makera Z1 Desktop CNC Review &#8211; Smart milling, 4-th axis module, and 5W laser engraving<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "ArmSoM Sige6 Allwinner A733 SBC features up to 128GB soldered-on eMMC flash, 16GB LPDDR5", "source": "CNX Software", "date": "2026-09-01", "url": "https://www.cnx-software.com/2026/09/01/armsom-sige6-allwinner-a733-sbc-features-up-to-128gb-soldered-on-emmc-flash-16gb-lpddr5/", "summary": "<div><img alt=\"ArmSom Sige6 SBC\" class=\"attachment-medium size-medium wp-post-image\" height=\"470\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/09/ArmSom-Sige6-SBC-720x470.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>ArmSoM Sige6 is yet another SBC powered by the Allwinner A733 octa-core SoC, offered in a credit card form factor with up to 128GB soldered-on eMMC flash and up to 16GB LPDDR5. The single board computer features a microSD card slot and an M.2 M-key PCIe 3.0 x2 slot for storage, Gigabit Ethernet (with optional PoE), WiFi 6, and Bluetooth 5.4 connectivity, HDMI 2.0 and MIPI DSI display interfaces, a MIPI CSI camera interface, USB 3.0/2.0 ports, a 3.5mm audio jack, a 40-pin GPIO header, and more. ArmSom Sige6 specifications: SoC – Allwinner A733-HN3 CPU Dual-core Arm Cortex-A76 @ up to 2.00 GHz Hexa-core Arm Cortex-A55 @ up to 1.80 GHz Single-core RISC-V E902 real-time core GPU – Imagination Technologies BXM-4-64 MC1 GPU with support for OpenGL ES 3.2, Vulkan 1.3, and OpenCL 3.0 VPU 4Kp60/8Kp24 H.265/VP9/AVS2 decoding, 4Kp30 H.264  decoding 4Kp30 H.265/H.264 encoding AI accelerator – 3 TOPS NPU Process [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/09/01/armsom-sige6-allwinner-a733-sbc-features-up-to-128gb-soldered-on-emmc-flash-16gb-lpddr5/\">ArmSoM Sige6 Allwinner A733 SBC features up to 128GB soldered-on eMMC flash, 16GB LPDDR5<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "IAR Adds Native Linux Support to Cross-Platform Embedded IDE", "source": "Embedded.com", "date": "2026-09-01", "url": "https://www.embedded.com/iar-adds-native-linux-support-to-cross-platform-embedded-ide/", "summary": "<p>IAR has expanded the cross-platform capabilities of its certified embedded development environment by adding native Linux support alongside Windows. Developed using the Qt Framework, the new IAR cross-platform IDE is designed to provide a development environment across operating systems for safety- and compliance-critical embedded software projects. The platform also integrates directly with Visual Studio Code [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/iar-adds-native-linux-support-to-cross-platform-embedded-ide/\">IAR Adds Native Linux Support to Cross-Platform Embedded IDE<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "Achronix Adds JESD204C IP Core for Speedster7t FPGAs", "source": "Embedded.com", "date": "2026-09-01", "url": "https://www.embedded.com/achronix-adds-jesd204c-ip-core-for-speedster7t-fpgas/", "summary": "<p>Achronix Semiconductor Corp. has introduced a high-performance JESD204C IP core for its family of Speedster7t FPGAs. The IP core is designed to connect advanced analog-to-digital converters and digital-to-analog converters to programmable logic. Each core supports data rates of up to 32 Gbits/s per lane and up to eight lanes per link, which translates into an [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/achronix-adds-jesd204c-ip-core-for-speedster7t-fpgas/\">Achronix Adds JESD204C IP Core for Speedster7t FPGAs<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "ARK Just A Pi – A tiny NDAA-compliant Raspberry Pi CM5 carrier board for drones and robots", "source": "CNX Software", "date": "2026-08-31", "url": "https://www.cnx-software.com/2026/08/31/ark-just-a-pi-a-tiny-ndaa-compliant-raspberry-pi-cm5-carrier-board-for-drones-and-robots/", "summary": "<div><img alt=\"ARK Just A Pi\" class=\"attachment-medium size-medium wp-post-image\" height=\"443\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/08/ARK-Just-A-Pi-720x443.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>ARK Just A Pi is a tiny NDAA-compliant carrier board for the Raspberry Pi CM5 designed for drones, robots, or other space-constrained embedded applications that&#8217;s about the size of the Compute Module itself. This follows ARK Electronics&#8217; NDAA-compliant ARK Jetson Orin NX/Nano bundles introduced in 2024. The new &#8220;Just A Pi&#8221; is much smaller and lighter, features a built-in 100 Mbps Ethernet switch with two JST-GH Ethernet ports, a micro HDMI port, two MIPI CSI camera connectors, a microSD card slot, a PCIe FFC connector, a USB 3.0 Type-C dual role connector, and a range of small connectors for UART, SPI, PWM, GPIO, and fan. It also features a power connector for the company&#8217;s PAB power modules. ARK Just A Pi specifications: Supported SoM Raspberry Pi Compute Module 5 &#8211; Full support Raspberry Pi Compute Module 4 &#8211; The following interfaces are not supported: CSI1/CAM1, UART2, USB-C, PCIe, and fan [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/08/31/ark-just-a-pi-a-tiny-ndaa-compliant-raspberry-pi-cm5-carrier-board-for-drones-and-robots/\">ARK Just A Pi &#8211; A tiny NDAA-compliant Raspberry Pi CM5 carrier board for drones and robots<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "D-Robotics RDK S100P – A 128 TOPS alternative to NVIDIA Jetson Orin NX 16GB with Cortex-A78AE/R52+ cores", "source": "CNX Software", "date": "2026-08-31", "url": "https://www.cnx-software.com/2026/08/31/d-robotics-rdk-s100p-a-128-tops-alternative-to-nvidia-jetson-orin-nx-16gb-with-cortex-a78ae-r52-cores/", "summary": "<div><img alt=\"RDK S100P Development Kit\" class=\"attachment-medium size-medium wp-post-image\" height=\"480\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/08/RDK-S100P-Development-Kit-720x480.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>D-Robotics RDK S100P development kit is a robotics SBC built around an S100P-based module providing an alternative to NVIDIA Jetson Orin NX 16GB with a 6-core Cortex-A78AE application cluster, a 4-core Cortex-R52+ MCU domain, a Nash BPU rated at 128 TOPS INT8, a Mali-G78AE GPU, and 24 GB of LPDDR5. The four R52+ cores can be configured for reliable real-time control: two cores run in lockstep for safety, and the other two support split-lock operation. In practice, the A78AE CPU and BPU can handle Linux and vision processing, while the MCU handles time-critical tasks such as motor and sensor I/O. This can reduce the need for a separate real-time controller, although whether it eliminates one depends on the robot and its requirements. RDK S100P specifications: SoC – D-Robotics S100P CPU – 6x Arm Cortex-A78AE @ 2.0 GHz (safety-capable AE cores) MCU – 4x Arm Cortex-R52+ @ 1.2 GHz (1x DCLS [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/08/31/d-robotics-rdk-s100p-a-128-tops-alternative-to-nvidia-jetson-orin-nx-16gb-with-cortex-a78ae-r52-cores/\">D-Robotics RDK S100P &#8211; A 128 TOPS alternative to NVIDIA Jetson Orin NX 16GB with Cortex-A78AE/R52+ cores<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Orange Pi Zero 4 – Compact Allwinner A733 SBC offers HDMI, USB-C DP, GbE, WiFI 6, PCIe FFC connector for $26.5 and up", "source": "CNX Software", "date": "2026-08-31", "url": "https://www.cnx-software.com/2026/08/31/orange-pi-zero-4-allwinner-a733-sbc-offers-hdmi-usb-c-dp-gbe-wifi-6-pcie-ffc-connector/", "summary": "<div><img alt=\"Orange Pi Zero 4\" class=\"attachment-medium size-medium wp-post-image\" height=\"498\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/08/Orange-Pi-Zero-4-720x498.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Orange Pi Zero 4 is an affordable yet feature-rich Allwinner A733 single board computer (SBC) with up to 8GB RAM, eMMC/UFS storage footprint, a microSD card slot, and plenty of I/Os. The board packs mini HDMI and USB-C DisplayPort, Gigabit Ethernet, WiFi 6 and Bluetooth 5.4, two MIPI CSI camera connectors, a Raspberry Pi-style PCIe FFC connector, and two GPIO headers into a compact 55x50mm form factor. Orange Pi Zero 4 specifications: SoC – Allwinner A733 CPU Dual-core Arm Cortex-A76 @ up to 2.00 GHz Hexa-core Arm Cortex-A55 @ up to 1.79 GHz Single-core RISC-V E902 real-time core up to 200 MHz GPU – Imagination Technologies BXM-4-64 MC1 GPU with support for OpenGL ES 3.2, Vulkan 1.3, OpenCL 3.0 VPU 8Kp24 H.265/VP9/AVS2 decoding 4Kp30 H.265/H.264 encoding AI accelerator – 3 TOPS NPU System Memory – 1GB, 2GB, 4GB, 6GB, or 8GB LPDDR5/LPDDR4/LPDDR4x; note: 16GB is also listed in the specs, [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/08/31/orange-pi-zero-4-allwinner-a733-sbc-offers-hdmi-usb-c-dp-gbe-wifi-6-pcie-ffc-connector/\">Orange Pi Zero 4 &#8211; Compact Allwinner A733 SBC offers HDMI, USB-C DP, GbE, WiFI 6, PCIe FFC connector for $26.5 and up<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "SensiBel Launches 84-dBA SNR Optical MEMS Microphone", "source": "Embedded.com", "date": "2026-08-31", "url": "https://www.embedded.com/sensibel-launches-84-dba-snr-optical-mems-microphone/", "summary": "<p>SensiBel has introduced the SBM140B, an optical MEMS microphone designed to provide high-fidelity audio capture across a wide acoustic range. The company claims it is the first MEMS microphone to combine an 84-dBA signal-to-noise ratio (SNR) with a 146-dB sound pressure level (SPL) acoustic overload point (AOP), resulting in a specified dynamic range of 136 [...]<\/p>\n<p>The post <a href=\"https://w
