ry/humanoid-orange-and-white-robot-using-two-finger-gripper-hands-to-work-with-metal-tool-components.jpg?id=67568024&amp;width=1200&amp;height=800&amp;coordinates=62%2C0%2C63%2C0\" /><br /><br /><p>For a while there, it seemed as though robotics as a whole was stuck in a <a href=\"https://spectrum.ieee.org/top-robotics-stories-2024\" target=\"_self\">mad rush<\/a> towards building <a href=\"https://spectrum.ieee.org/topic/robotics/humanoid-robots/\" target=\"_self\">humanoid robots<\/a> mostly because it was very possible (and very lucrative) to do so, even without near-term goals that were necessarily realistic. Some of the magic of those first couple of years of the humanoid explosion has stuck around, but there’s also been an industry-wide sobering leading to <a href=\"https://spectrum.ieee.org/humanoid-robot-scaling\" target=\"_self\">pointed questions about practicality and value<\/a>. In other words, starting a commercial humanoid company <em><em>now<\/em><\/em> is a much different proposition than it would have been just a few years ago. <\/p><p>On 15 July, <a href=\"https://www.waldenrobotics.com/news/walden-robotics-launches-from-stealth\" rel=\"noopener noreferrer\" target=\"_blank\">Walden Robotics emerged from stealth<\/a> with US $300 million in funding at a valuation of $1.1 billion. Walden is a spinout of <a href=\"https://spectrum.ieee.org/toyota-to-invest-1-billion-in-ai-and-robotics-rd\" target=\"_self\">Toyota Research Institute<\/a> (TRI), and it’s spent the last 10 or so years working on hard problems in robotics with the goal of transitioning from research to real-world applications. That seems like the amount of time and experience that it might reasonably take to develop a <a href=\"https://spectrum.ieee.org/humanoid-robot-scaling\" target=\"_self\">practical and value-driven approach<\/a> to deploying general-purpose humanoid robots, and Walden has chosen an excellent starting point by skipping the legs.<\/p><p>“It’s ironic,” says Walden cofounder and CEO <a href=\"https://www.linkedin.com/in/russ-tedrake-88648a4a/\" rel=\"noopener noreferrer\" target=\"_blank\">Russ Tedrake<\/a>. “I thought about legs for 20 years; that’s the class I teach at MIT. There are many reasons to build a robot with legs. But the question is, what’s the addressable market? And what percentage of it is covered by a wheeled base?” It’s this focused, practical thinking that sets Walden somewhat apart from many (if not most) of the other companies in this space. Rather than <a href=\"https://spectrum.ieee.org/boston-dynamics-spot-robot-dog-now-available\" target=\"_self\">developing a robot first and searching for a viable commercial use case second<\/a>, Walden instead identified applications where robots can provide value now, and designed a robot that could safely and efficiently meet those needs.<\/p><p class=\"shortcode-media shortcode-media-youtube\"> <span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span> <small class=\"image-media media-photo-credit\">Walden Robotics<\/small> <\/p><h2>Walden Robotics’ Manufacturing Focus<\/h2><p class=\"shortcode-media shortcode-media-rebelmouse-image rm-float-left rm-resized-container rm-resized-container-25\" style=\"float: left;\"> <img alt=\"A smiling man in a blue shirt\" class=\"rm-shortcode\" id=\"f545c\" src=\"https://spectrum.ieee.org/media-library/a-smiling-man-in-a-blue-shirt.jpg?id=67568051&amp;width=980\" /> <small class=\"image-media media-caption\">Russ Tedrake is the CEO and cofounder of Walden Robotics.<\/small><small class=\"image-media media-photo-credit\">Walden Robotics<\/small><\/p><p>Tedrake is light on the details about what specific applications Walden is targeting at this point (citing confidentiality with current commercial partners). Manufacturing and logistics environments where there are a lot of <a href=\"https://www.youtube.com/watch?v=F_7IPm7f1vI\" target=\"_blank\">relatively simple<\/a> and <a href=\"https://www.youtube.com/watch?v=tv90GFM9RAo\" target=\"_blank\">repetitive tasks<\/a> that aren’t friendly to conveyor belts and preprogrammed robot arms are a good bet. Even in these environments, however, robots still have to find a useful niche because they’re going up against human workers who are more flexible while also cheaper to employ. So the question is: How do you make an argument to a customer that a robot is actually a better solution than their existing human workers?<\/p><p>“You need to find applications with high utilization—where the robot is used 24 hours a day, 7 days a week,” says Tedrake. “Manufacturing is a global imperative right now, and it makes the economics work.” Economic viability is a necessary condition, but it’s not a sufficient one for Walden, or for their partnership with Toyota. People are a big part of Walden’s plan, too.<\/p><p>One of Walden’s major strengths is the company’s partnership with Toyota, which is not all that surprising given that Walden is a spinout from TRI, which is <a href=\"https://spectrum.ieee.org/toyota-to-invest-1-billion-in-ai-and-robotics-rd\" target=\"_self\">Toyota’s Silicon Valley–based R&amp;D arm<\/a>. “Toyota was very proud of the work we had done at TRI, and was ready to go big in this space,” says Tedrake. “Part of the excitement of having Toyota as a partner is that their culture is deeply people-first. When talking to Toyota’s leadership, I was never asked how much money this is going to make, but I was asked how it will improve the quality of life for all people.”<\/p><p class=\"shortcode-media shortcode-media-rebelmouse-image\"> <img alt=\"A white and orange humanoid robot manipulates an object in its two-finger grippers.\" class=\"rm-shortcode\" id=\"209d4\" src=\"https://spectrum.ieee.org/media-library/a-white-and-orange-humanoid-robot-manipulates-an-object-in-its-two-finger-grippers.jpg?id=67568030&amp;width=980\" /> <small class=\"image-media media-caption\">The robot’s chonky design allows it to meet the high-payload requirements of useful manufacturing work.<\/small><small class=\"image-media media-photo-credit\">Walden Robotics<\/small><\/p><p>In this context, at least in the short term, Walden’s approach to improving the quality of life for people is to take over those aforementioned repetitive manufacturing tasks with robots. Tedrake hopes that this will lead to workplaces where skilled craftspeople are able to do even more with their hard-earned expertise, increasing their efficiency, productivity, and happiness all at the same time—a noble goal, although there’s only so much Walden itself can do to make this happen, and not all customers will share Toyota’s priorities.<\/p><h2>Wheeled Humanoid Robots in Factories<\/h2><p>Many other <a href=\"https://www.agilityrobotics.com/\" target=\"_blank\">humanoid<\/a> <a href=\"https://www.figure.ai/\" target=\"_blank\">robotics<\/a> <a href=\"https://apptronik.com/\" target=\"_blank\">companies<\/a> are also targeting these logistics and manufacturing spaces with general-purpose robots, and they’re doing so by making robots that are as humanlike as possible. The theory is that a humanoid form factor is necessary when operating in human environments. And there are certainly arguments in favor of a humanoid with legs—stairs exist, for one, and legged robots have a smaller footprint compared with ones that have wheels.<\/p><p>But a large wheeled base offers some significant advantages, as Tedrake points out. You’re incentivized to cram the base full of batteries, since more weight near the floor keeps the robot stable, which also solves the problem of running out of power during the middle of the workday. More importantly, a statically stable robot that moves around on a wheeled base can bypass the <a href=\"https://spectrum.ieee.org/humanoid-robot-scaling\" target=\"_self\">safety challenges<\/a> that are currently keeping legged humanoids physically separated from real humans—most prominently, the fact that legged robots can fall over. “Factories already have autonomous mobile [wheeled] robots,” explains Tedrake. “They already have safety cases built around AMRs. You can piggyback on that with a wheeled base.”<\/p><p class=\"shortcode-media shortcode-media-rebelmouse-image\"> <img alt=\"A close-up of a robotic gripper grasping a metallic object in a vise.\" class=\"rm-shortcode\" id=\"f600c\" src=\"https://spectrum.ieee.org/media-library/a-close-up-of-a-robotic-gripper-grasping-a-metallic-object-in-a-vise.jpg?id=67568022&amp;width=980\" /> <small class=\"image-media media-caption\">Simple, rugged grippers make the robot suitable for commercial deployment.<\/small><small class=\"image-media media-photo-credit\">Walden Robotics<\/small><\/p><p>Walden’s perspective on manipulation is similar. Many humanoid companies are using five-fingered hands that are highly dexterous but also highly complex, which Tedrake believes is not a pragmatic approach in the context of commercial deployments. “There’s a question of what you need to do the tasks, but the real question is just durability,” Tedrake says. “We have been deployed in a Toyota factory, and at the end of the week, the hands take a beating, so we built hands that can take that. I have not seen a more dexterous hand that could have done the work our hand has done.”<\/p><p>Walden’s long-term plan is to build “general-purpose robots.” It’s not always clear what a general-purpose robot is, because (I would argue) nobody is quite sure what “general purpose” means. It’s certainly not referring to robots that can do <em><em>everything<\/em><\/em>; I think the closest we can get are robots that can be taught to do a useful number of different skills, which is why I prefer the term “multipurpose.” It’s a little pedantic, I know, but I think the distinction is important because it moderates expectations in the near term.<\/p><p>Part of where Walden’s optimism towards general purposeness comes from is TRI’s earlier research on <a href=\"https://medium.com/toyotaresearch/tris-robots-learn-new-skills-in-an-afternoon-here-s-how-2c30b1a8c573\" target=\"_blank\">diffusion policy<\/a>, which helps robots learn new skills more quickly by leveraging previously learned skills as a foundation. “Fundamentally, multitasking is a way to get to a general-purpose robot,” Tedrake says. “I believe there is a single platform that can do a lot of tasks that are of high value for real customers. That will give us the experience we need to give birth to this deployed general-purpose capability.”<\/p>"}, {"title": "HEBI Robotics earns NASA SBIR grant to fast track miniaturized actuators", "source": "The Robot Report", "date": "2026-08-03", "url": "https://www.therobotreport.com/hebi-robotics-earns-nasa-sbir-grant-fast-track-miniaturized-actuators/", "summary": "<p>This Phase I award is only part of HEBI Robotics' roadmap. The company also plans to continue developing its existing actuation hardware.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/hebi-robotics-earns-nasa-sbir-grant-fast-track-miniaturized-actuators/\">HEBI Robotics earns NASA SBIR grant to fast track miniaturized actuators<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "igus launches energy chain with 600-degree rotation for industrial robots", "source": "Robotics Business Review", "date": "2026-08-03", "url": "https://www.therobotreport.com/igus-launches-energy-chain-600-degree-rotation-industrial-robots/", "summary": "<p>igus says its new twisterchain energy chain provides cable management for challenging industrial robotics applications such as palletizing.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/igus-launches-energy-chain-600-degree-rotation-industrial-robots/\">igus launches energy chain with 600-degree rotation for industrial robots<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Google DeepMind says Gemini Robotics 2 enables full body control", "source": "Robotics Business Review", "date": "2026-08-02", "url": "https://www.therobotreport.com/google-deepmind-says-gemini-robotics-2-enables-full-body-control/", "summary": "<p>Gemini Robotics 2 enables robots to reason through every movement, unlocking a broad range of tasks, DeepMind said. <\/p>\n<p>The post <a href=\"https://www.therobotreport.com/google-deepmind-says-gemini-robotics-2-enables-full-body-control/\">Google DeepMind says Gemini Robotics 2 enables full body control<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Top 10 robotics stories of July 2026", "source": "Robotics Business Review", "date": "2026-08-01", "url": "https://www.therobotreport.com/top-10-robotics-stories-july-2026/", "summary": "<p>In July, large funding rounds, new approaches to robot training, and new robot models drew our readers attention.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/top-10-robotics-stories-july-2026/\">Top 10 robotics stories of July 2026<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Procore Technologies acquires DroneDeploy for $845M", "source": "Robotics Business Review", "date": "2026-07-31", "url": "https://www.therobotreport.com/procore-technologies-acquires-dronedeploy-845m/", "summary": "<p>Procore will integrate DroneDeploy's visual intelligence technology to link the digital world with physical construction sites.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/procore-technologies-acquires-dronedeploy-845m/\">Procore Technologies acquires DroneDeploy for $845M<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "KUKA deploys Automation Management Platform for North American automakers", "source": "Robotics Business Review", "date": "2026-07-31", "url": "https://www.therobotreport.com/kuka-deploys-automation-management-platform-north-american-automakers/", "summary": "<p>KUKA has deployed its Automation Management Platform at KTPO, a major manufacturing facility in Ohio.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/kuka-deploys-automation-management-platform-north-american-automakers/\">KUKA deploys Automation Management Platform for North American automakers<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "FCC robot ruling shines a spotlight on U.S. policy; how next-gen AI can help warehousing", "source": "Robotics Business Review", "date": "2026-07-31", "url": "https://www.therobotreport.com/fcc-robot-ruling-shines-spotlight-on-u-s-policy-how-next-gen-ai-can-help-warehousing/", "summary": "<p>OSARO’s Derek Pridmore says warehouse robots are advancing, but real-world safety and reliability still depend on specialized, layered AI systems.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/fcc-robot-ruling-shines-spotlight-on-u-s-policy-how-next-gen-ai-can-help-warehousing/\">FCC robot ruling shines a spotlight on U.S. policy; how next-gen AI can help warehousing<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Video Friday: Meet Google DeepMind’s Gemini Robotics 2", "source": "IEEE Spectrum Robotics", "date": "2026-07-31", "url": "https://spectrum.ieee.org/video-robot-gemini2-ai-robot", "summary": "<img src=\"https://spectrum.ieee.org/media-library/humanoid-robot-and-robotic-arm-labeled-gemini-robotics-er-2-in-a-workshop-setting.webp?id=67560022&amp;width=1200&amp;height=800&amp;coordinates=125%2C0%2C125%2C0\" /><br /><br /><p><span>Video Friday is your weekly selection of awesome robotics videos, collected by your friends at <\/span><em>IEEE Spectrum<\/em><span> robotics. We also post a weekly calendar of upcoming robotics events for the next few months. Please <\/span><a href=\"mailto:automaton@ieee.org?subject=Robotics%20event%20suggestion%20for%20Video%20Friday\">send us your events<\/a><span> for inclusion.<\/span><\/p><h5><a href=\"https://actuate.foxglove.dev/\">Actuate 2026<\/a>: 18–19 August 2026, SAN FRANCISCO<\/h5><h5><a href=\"https://2026.ieee-iros.org/\">IROS 2026<\/a>: 27 September–1 October 2026, PITTSBURGH<\/h5><h5><a href=\"https://humanoidssummit.com/\">Humanoids Summit Seoul<\/a>: 22–23 September 2026, SEOUL<\/h5><p>Enjoy today’s videos!<\/p><div class=\"horizontal-rule\"><\/div><div><span style=\"display: none;\"> <\/span><\/div><blockquote class=\"rm-anchors\" id=\"4lsqnrmc6ny\"><em>Introducing Gemini Robotics 2—the intelligence layer powering the next generation of truly adaptable robots. As it takes its first literal steps, this major advance unlocks intelligent whole-body control, advanced dexterity, and multirobot collaboration. <\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p class=\"shortcode-media shortcode-media-youtube\"> <span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p class=\"shortcode-media shortcode-media-youtube\"> <span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://deepmind.google/blog/gemini-robotics-2-brings-whole-body-intelligence-to-robots/\">Google DeepMind<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"vzwytn3fw1w\">THE ROADMAP! NOOOOO!<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.agilityrobotics.com/\">Agility<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"xha2tj_1c6q\">Videos like this always make me wonder how <a href=\"https://spectrum.ieee.org/robot-with-liquid-metal-tendons-can-heal-itself\" target=\"_blank\">repairable<\/a> these robots are. Very, I would hope.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.unitree.com/As2-W\">Unitree<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"m81_7rggdxm\"><em>Humans routinely communicate through abstractions of their bodies, including shadows, silhouettes, and reflections. Here, we present a robotic system capable of dynamic shadow expression using a 21-degrees-of-freedom <a href=\"https://spectrum.ieee.org/video-friday-robotic-hand-dexterity\" target=\"_blank\">dexterous hand<\/a> with compliant soft skin and a learned shadow self-model.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://generalroboticslab.com/shadow\">General Robotics Lab<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"n20cvjhmzh8\">Human-to-quadruped motion transfer is an odd concept, but I’m here for it.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://studios.disneyresearch.com/2026/07/30/two2four-generative-quadruped-puppeteering-from-human-motion/\">Disney Research<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"alc1aon3a4i\"><em>Meet Stretch 4.0<\/em>—t<em>he one-armed, three-wheeled robot that can navigate your home safely. Would you rather a humanoid robot or Stretch?<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://hello-robot.com/\">Hello Robot<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"cjytikq4dum\">And now, this, for some reason.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.pndbotics.com/\">PNDbotics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"k4wzqzblkry\">I’m not sure we’re allowed to be impressed if you resize a badminton court to accommodate your robot.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.phybot.tech/en/home\">PHYBOT<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"rnrf8fc47qm\">Golden eagles care not for <a href=\"https://spectrum.ieee.org/dutch-police-training-eagles-to-take-down-drones\" target=\"_blank\">drones<\/a>. <\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.team-blacksheep.com/\">Team BlackSheep<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"1tzmvkf7x10\"><em>University of Southern California researchers work with NASA and others to train robot dogs for planetary exploration on Mars, the moon, and beyond!<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.radlab.us/\">Research in Applied Decisions: RAD Lab<\/a> ]<\/p><p>Thanks, Cristina!<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"lzphwt2wwv8\"><a href=\"https://spectrum.ieee.org/humanoid-robots-japan\" target=\"_blank\">WABOT-1<\/a> was arguably the birth of the humanoid robot in Japan. We’ve come a long way, and it’s good to be reminded where we started.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"http://www.takanishi.mech.waseda.ac.jp/top/index.htm\">Takanishi Lab<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"1eplnnhbqbs\">If only this video was at 1x instead of 5x we could have had 15 hours of Memo folding laundry.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.sunday.ai/\">Sunday Robotics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div>"}, {"title": "Teradyne Robotics revenue rises 33% year over year in Q2", "source": "Robotics Business Review", "date": "2026-07-30", "url": "https://www.therobotreport.com/teradyne-robotics-revenue-rises-33-year-over-year-in-q2/", "summary": "<p>Teradyne Robotics said growth in the U.S. and in AI were big drivers for its revenue increase in the second quarter of 2026.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/teradyne-robotics-revenue-rises-33-year-over-year-in-q2/\">Teradyne Robotics revenue rises 33% year over year in Q2<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "DoorDash gains FAA certification to operate its own drone delivery program", "source": "Robotics Business Review", "date": "2026-07-30", "url": "https://www.therobotreport.com/doordash-gains-faa-certification-to-operate-its-own-drone-delivery-program/", "summary": "<p>The FAA approval came nearly a year after DoorDash unveiled its delivery robot and reflects its increasing interest in building automation in-house.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/doordash-gains-faa-certification-to-operate-its-own-drone-delivery-program/\">DoorDash gains FAA certification to operate its own drone delivery program<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "5 Physical AI infrastructure platforms shaping robotics in 2026", "source": "Robotics Business Review", "date": "2026-07-30", "url": "https://www.therobotreport.com/5-physical-ai-infrastructure-platforms-shaping-robotics-in-2026/", "summary": "<p>These five platforms address different challenges and provide the basis for the emerging physical AI tech stack, according to Lightwheel.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/5-physical-ai-infrastructure-platforms-shaping-robotics-in-2026/\">5 Physical AI infrastructure platforms shaping robotics in 2026<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Experts react to FCC limits on U.S. imports of new humanoid and mobile robots", "source": "Robotics Business Review", "date": "2026-07-29", "url": "https://www.therobotreport.com/industry-reacts-fcc-ban-u-s-imports-new-humanoid-quadruped-robots/", "summary": "<p>The FCC has banned some foreign humanoids, which industry experts say could help U.S. industry but hinder innovation.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/industry-reacts-fcc-ban-u-s-imports-new-humanoid-quadruped-robots/\">Experts react to FCC limits on U.S. imports of new humanoid and mobile robots<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "GMEX Robotics to acquire MediaMeta.ai for social intelligence", "source": "Robotics Business Review", "date": "2026-07-29", "url": "https://www.therobotreport.com/gmex-robotics-to-acquire-mediameta-ai-social-intelligence/", "summary": "<p>GMEX Robotics has acquired shares in MediaMeta to incorporate social intelligence capabilities into its service robots.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/gmex-robotics-to-acquire-mediameta-ai-social-intelligence/\">GMEX Robotics to acquire MediaMeta.ai for social intelligence<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "How integrated actuators improve humanoid robot joint performance and system integration", "source": "Robotics Business Review", "date": "2026-07-28", "url": "https://www.therobotreport.com/how-integrated-actuators-improve-humanoid-robot-joint-performance-and-system-integration/", "summary": "<p>Humanoid robots have become an important area of research in robotics, attracting attention from universities, research institutions, and technology companies.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/how-integrated-actuators-improve-humanoid-robot-joint-performance-and-system-integration/\">How integrated actuators improve humanoid robot joint performance and system integration<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Robot Finger Feels in Color", "source": "IEEE Spectrum Robotics", "date": "2026-07-28", "url": "https://spectrum.ieee.org/robot-finger", "summary": "<img src=\"https://spectrum.ieee.org/media-library/close-up-of-a-sensor-for-a-robotic-fingertip-and-raised-relief-images-of-a-leaf-and-a-u-s-penny.jpg?id=67542077&amp;width=1200&amp;height=800&amp;coordinates=0%2C83%2C0%2C84\" /><br /><br /><p><span>Imagine running your fingertip over the surface of a U.S. penny. You would feel the ridges of the raised letters and numbers, Abe Lincoln’s bearded side profile, and, if it’s tails, the fluted columns of the Lincoln Memorial. Getting a robot to sense the same things is an imposing task, often requiring gathering data on pressure and force at many spatial locations at once. But that’s just what a team of scientists in Europe has now managed to do, using an unusual, colorful robotic skin that provides high-resolution sensing in real time.<\/span><\/p><p>“To be honest, when they showed us this, we thought it was, and pardon my French, [expletive] cool, because it’s a distinctly different approach,” recalled Rich Walker, director of <a href=\"https://shadowrobot.com/\" target=\"_blank\">Shadow Robot<\/a>, the U.K.’s longest-running robot company, which primarily focuses on <a href=\"https://spectrum.ieee.org/video-friday-shadow-robot-hand\" target=\"_blank\">robotic hands<\/a>.<\/p><p class=\"ieee-inbody-related\">RELATED: <a href=\"https://spectrum.ieee.org/shadow-walker-biped-humanoid-robot\" target=\"_self\">“This DIY Bipedal Robot Used Pneumatic “Air-Muscles” Instead of Motors”<\/a><\/p><p>The research team, which hails from Queen Mary University of London, the University of Florence, the University of Trieste, and the University of Trento, designed a robotic fingertip with a synthetic skin that reflects different colors of light in response to mechanical deformation. By reading the light reflected off the skin, the fingertip generates maps of topology, strain, and contact pressure. The team has already used the sensor to generate maps of a human fingertip, a penny, and a leaf.<\/p><p><a href=\"https://www.seresearch.qmul.ac.uk/cit/people/gsasso/\" target=\"_blank\">Giacomo Sasso<\/a>, a postdoctoral research associate in the lab of <a href=\"https://www.sems.qmul.ac.uk/staff/f.carpi/\" target=\"_blank\">Federico Carpi<\/a> at Queen Mary University of London, came up with the idea for the sensor. He had been researching optics when he stumbled upon an interesting <a href=\"https://www.nature.com/articles/s41563-022-01318-x\" target=\"_blank\">paper published in the journal <em><em>Nature<\/em><\/em><\/a>. It described the “mechanochromic material” that would eventually make up the reflector in the skin.<\/p><p>Following the method described in <em><em>Nature<\/em><\/em>, Sasso exposed a light-sensitive film to a 5-megawatt, 635-nanometer (red) laser for seven minutes. The laser beam creates an interference pattern which causes the film to polymerize in alternating densities, creating layers with different refractive indices.<\/p><p>This structure is called a <a href=\"https://spectrum.ieee.org/a-simple-filter-makes-blueemitting-oleds-give-off-white-light\" target=\"_blank\">Bragg reflector<\/a>. The alternating densities and refractive indices in the polymer cause specific wavelengths of light to be reflected. When the reflector is deformed by contact with an object, its layers are stretched, becoming thinner and reflecting light of a different wavelength. <\/p><p>It took Sasso less than a week to re-create the material in the lab. “From there, we started seeing how we could translate these color patterns into something that was useful for us,” he says. Soon, they realized that the color produced by the material was all they needed to be able to sense the topology of objects.<\/p><p>In the robotic finger, the Bragg reflector is sandwiched between a layer of silicone, which protects it from the outside, and a transparent, fingertip-shaped silicone finger with a camera and LED light embedded inside of it. <\/p><p>The light from the LED shines through the clear polymer of the finger. When the fingertip is deformed by an object, the reflector bounces light back to the camera, with wavelengths depending on the level of deformation—red for least deformation, shifting to green, and then to blue when most deformed.<\/p><p>The team also made adjustments to increase the sensitivity of the skin and help the camera to better read color differences. The silicone of the outer layer of the fingertip is colored black to increase the color contrast, allowing the camera to better translate color into the morphology. The rigidity of the camera inside the finger also enhances the deformation of the reflector, producing greater differences in reflected wavelengths.<\/p><p>After all that optimization, the finger provided 100-micrometer resolution with no <a href=\"https://spectrum.ieee.org/robot-fingers\" target=\"_blank\">computational<\/a> latency, the researchers determined.<\/p><h2>What robot fingers need<\/h2><p>Human skin takes in a variety of tactile information in order to successfully move and manipulate objects, including temperature, texture, pressure, and vibration. But engineering a robot to do the same is challenging because of spatial constraints. There often isn’t enough room in a robotic fingertip to incorporate more than one type of sensor. The question then becomes: Which type of sensor should be used?<\/p><p>“And the answer to that is…that’s a really hard question. No one knows yet,” says Walker. Carpi’s team’s robotic finger is exciting because it presents yet another option for roboticists to experiment with, Walker says.<\/p><p>Although Carpi’s team <a href=\"https://www.gelsight.com/\" target=\"_blank\">isn’t the first<\/a> to use soft materials for tactile sensing, its technology is unique because it is able to extract quantitative information about depth and size from the topologic maps it generates. According to Walker, most sensors can only generate topological maps, which reveal the relative sizes of object features.<\/p><p>To Sasso, another key advantage of this robotic finger is that it embeds tactile sensing directly into the material of the finger, rather than using taxels, or pixels that measure force or pressure at specific spatial points. <\/p><p class=\"ieee-inbody-related\">RELATED: <a href=\"https://spectrum.ieee.org/robot-fingers\" target=\"_blank\">Robot Hand Manipulates Complex Objects by Touch Alone<\/a><\/p><p>“The core aspect of the sensor is that we’re essentially [moving toward] having the sensing element at the material level,” he says. “The camera, which is a very highly optimized electronic component, is translating whatever the material is already doing directly into digital signals.” <\/p><p><a href=\"https://www.linkedin.com/in/michael-yu-wang-258a4525/\" target=\"_blank\">Michael Wang<\/a>, co-founder and chief scientist at <a href=\"https://spectrum.ieee.org/daimon-robotics-physical-ai\" target=\"_blank\">Daimon Robotics<\/a>, which, unlike Shadow Robot, primarily uses vision-based sensing, echoed Walker’s sentiment that it’s beneficial to explore new methods of sensing, which may bring unique advantages. But he also explained that soft materials often face challenges with durability, and that the significance of the team’s work would be revealed when the finger is integrated into real<a href=\"https://spectrum.ieee.org/robot-fingers\" target=\"_blank\"> robot hands<\/a>.<\/p><p>“The practical and useful benefits, especially in the context of robot hands, remain to be tested and validated,” he says.<\/p><p>When the materials of soft sensors, like the silicone in Carpi’s team’s fingertip, become eroded or damaged after repeated use, the signals measured by the sensors may not reflect objects’ topography as well. <\/p><p>“Especially if you have the electronics embedded into the material layer itself, that becomes a very challenging engineering problem. And I haven’t seen [many] good soft electronics materials that really can undergo long periods of usage,” Wang says.<\/p><p><span>However, because the Bragg reflector isn’t in direct contact with objects itself, the outer layer of silicone material acts as a protective barrier, Sasso says. The silicone can also be made more durable using certain chemical coatings, according to Wang.<\/span><\/p><p>The team has already been talking to companies that could potentially employ the new sensor. They also hope to improve the sensor so that it can sense objects that don’t lie flat on surfaces. That could open up its use in surgical instruments that require precise contact mapping of tissues and organs, Carpi says.<\/p><p>“There are significant developments that we expect with a clear path toward transition to real world applications,” he says.<\/p>"}, {"title": "Agency Tool Company wants to make OTA software updates easier", "source": "The Robot Report", "date": "2026-07-28", "url": "https://www.therobotreport.com/agency-tool-company-wants-to-make-ota-software-updates-easier/", "summary": "<p>Two Scythe co-founders are using their experience building commercial robots to create tools for robotics developers at Agency Tool Co.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/agency-tool-company-wants-to-make-ota-software-updates-easier/\">Agency Tool Company wants to make OTA software updates easier<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Powerful Compute So Compact, It’s Clutch — Build AI Anywhere With NVIDIA Jetson", "source": "NVIDIA Robotics", "date": "2026-07-28", "url": "https://blogs.nvidia.com/blog/build-ai-with-nvidia-jetson/", "summary": "As a discerning AI investor who values style and substance, Sarah Guo knows this season’s standout accessory isn’t the latest designer purse — but what’s inside it.  In a recent video, Guo, founder of AI-native venture capital firm Conviction and co-host of the AI podcast No Priors, highlighted how the NVIDIA Jetson platform for edge [&#8230;]"}, {"title": "Registration is open for RoboBusiness 2026", "source": "Robotics Business Review", "date": "2026-07-28", "url": "https://www.therobotreport.com/registration-is-open-for-robobusiness-2026/", "summary": "<p>This year, join us in October in Santa Clara to celebrate 20 years of robotics excellence at RoboBusiness 2026.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/registration-is-open-for-robobusiness-2026/\">Registration is open for RoboBusiness 2026<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "ENvue Medical develops robotic feeding tube placement system", "source": "Robotics Business Review", "date": "2026-07-28", "url": "https://www.therobotreport.com/envue-medical-develops-robotic-feeding-tube-placement-system/", "summary": "<p>ENvue Drive is designed to assist, not replace, the clinician, who retains full control of the procedure at all times.  <\/p>\n<p>The post <a href=\"https://www.therobotreport.com/envue-medical-develops-robotic-feeding-tube-placement-system/\">ENvue Medical develops robotic feeding tube placement system<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "NORD expands compact NORDAC VFD family to 200 hp", "source": "Robotics Business Review", "date": "2026-07-27", "url": "https://www.therobotreport.com/nord-expands-nordac-compact-vfd-family-to-200-hp/", "summary": "<p>NORD Drivesystems said its NORDAC PRO VFDs are adaptable to individual application requirements across industries.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/nord-expands-nordac-compact-vfd-family-to-200-hp/\">NORD expands compact NORDAC VFD family to 200 hp<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}], "embeddedNews": [{"title": "Rooftop Camper For Roofless Vehicle", "source": "Hackaday", "date": "2026-08-27", "url": "https://hackaday.com/2026/08/27/rooftop-camper-for-roofless-vehicle/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"450\" src=\"https://hackaday.com/wp-content/uploads/2026/08/goldwing-camper-main.jpg?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>The Honda Goldwing is one of the more famous motorcycles ever produced. It&#8217;s known for its reliability and comfort, but also for being one of the first motorcycles Honda rolls <a class=\"read-more\" href=\"https://hackaday.com/2026/08/27/rooftop-camper-for-roofless-vehicle/\">&#8230;read more<\/a>"}, {"title": "The Mactini: A Computer That Does Almost Nothing", "source": "Hackaday", "date": "2026-08-27", "url": "https://hackaday.com/2026/08/27/the-mactini-a-computer-that-does-almost-nothing/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"467\" src=\"https://hackaday.com/wp-content/uploads/2026/08/mactini_internals_tucker_osman_youtube.jpg?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>Recently [Tucker Osman] brought to life what once was just a meme created by the B nt-large size-large wp-post-image\" height=\"464\" src=\"https://hackaday.com/wp-content/uploads/2020/01/VintagePhone.jpg?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>The phones! They were one of the basic utilities of the 20th century, and were just about as reliable as death and taxes. Even when then power grid went down, <a class=\"read-more\" href=\"https://hackaday.com/2026/08/27/australias-nationwide-phone-outage-was-an-embarrassing-failure/\">&#8230;read more<\/a>"}, {"title": "Analog Optical Feedback Generates 4K Fractals With No Computer", "source": "Hackaday", "date": "2026-08-27", "url": "https://hackaday.com/2026/08/27/analog-optical-feedback-generates-4k-fractals-with-no-computer/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"450\" src=\"https://hackaday.com/wp-content/uploads/2026/08/4KVideoFeedbackFeat.jpg?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>For users of a certain age, fractal patterns and computers are nearly synonymous. Typing in BASIC programs and seeing the Mandelbrot set or other fractals slowly render on screen is <a class=\"read-more\" href=\"https://hackaday.com/2026/08/27/analog-optical-feedback-generates-4k-fractals-with-no-computer/\">&#8230;read more<\/a>"}, {"title": "eenk Provides eInk, ESP32 Powered Text Adventures", "source": "Hackaday", "date": "2026-08-27", "url": "https://hackaday.com/2026/08/27/eeink-provides-eink-esp32-powered-text-adventures/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"450\" src=\"https://hackaday.com/wp-content/uploads/2026/08/eeink-text-adventure.jpg?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>There&#8217;s a niche genre of text adventure that&#8217;s halfway between a traditional novel and a videogame. Think Zork if it had an extra few novels worth of words of well-crafted <a class=\"read-more\" href=\"https://hackaday.com/2026/08/27/eeink-provides-eink-esp32-powered-text-adventures/\">&#8230;read more<\/a>"}, {"title": "USB-C Deskradar – An ESP32-C3 ADS-B flight tracker with a 1.28-inch round display", "source": "CNX Software", "date": "2026-08-27", "url": "https://www.cnx-software.com/2026/08/27/usb-c-deskradar-an-esp32-c3-ads-b-flight-tracker-with-a-1-28-inch-round-display/", "summary": "<div><img alt=\"USB C Deskradar, Live ADS B Flight Tracker\" class=\"attachment-medium size-medium wp-post-image\" height=\"480\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/08/USB-C-Deskradar-Live-ADS-B-Flight-Tracker-720x480.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>The USB-C Deskradar is an ESP32-C3-based, aviation-themed ADS-B flight tracker that tracks and displays live aircraft positions around your location on a sonar-style circular grid. A 1.28-inch round display and a 3D-printed enclosure provide a real-time view of flights around a configured location. As we&#8217;ll see further below, it appears to be an open-source project that was picked up by Chinese vendors and started popping up on AliExpress as an inexpensive desk gadget. USB-C Deskradar specifications: Wireless module –16-pin ESP32-C3 Super Mini module SoC – Espressif Systems ESP32-C3FH4, single-core 32-bit RISC-V microcontroller @ up to 160 MHz; 400 KB SRAM; 4MB flash USB – USB Type-C port for programming Ceramic antenna Display – 1.28-inch round TFT color LCD with GC9A01 controller; 240×240 resolution; driven via SPI Misc Hardware button (connected to GPIO 9 / BOOT pin, active LOW) Short tap – Cycles radar range presets (e.g., 5, 10, 15, 25 [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/08/27/usb-c-deskradar-an-esp32-c3-ads-b-flight-tracker-with-a-1-28-inch-round-display/\">USB-C Deskradar &#8211; An ESP32-C3 ADS-B flight tracker with a 1.28-inch round display<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Opener is an open-source reference implementation of the DECT NR+ massive IoT, low-latency standard", "source": "CNX Software", "date": "2026-08-27", "url": "https://www.cnx-software.com/2026/08/27/opener-open-source-reference-implementation-of-the-dect-nr-massive-iot-standard/", "summary": "<div><img alt=\"Opener open-source DECT NR+ implementation\" class=\"attachment-medium size-medium wp-post-image\" height=\"342\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/08/Opener-open-source-DECT-NR-implementation-720x342.png\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Opener is an open-source reference implementation of the DECT NR+ protocol stack, formally known as DECT-2020 NR, used for massive IoT (mMTC) and low-latency (URLLC) machine-to-machine communication applications. It is developed by the Opener Initiative, supported by the OpenDECT-X project, and funded by the German Federal Ministry of Research, Technology and Space (BMFTR). The standard itself supports up to one million devices per km², years of battery life for low-power sensors,  non-IP and IPv6 traffic, mesh networking, and random-access operation. It is also designed for ultra-reliable low-latency communications (URLLC) with sub-millisecond air-interface latency, a 99.999% reliability target, and scheduled access for bounded latency. Contrary to 3GPP cellular communication networks, DECT NR+ does not rely on centralized infrastructure and uses context-based rather than fixed device roles. It operates in the license-exempt spectrum in the 1880–1930 MHz range (1.9 GHz), and will be extended to the 3.8–4.2 GHz band, at least in [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/08/27/opener-open-source-reference-implementation-of-the-dect-nr-massive-iot-standard/\">Opener is an open-source reference implementation of the DECT NR+ massive IoT, low-latency standard<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "LUNYEE 3020 Nova review – A desktop CNC router with 710W spindle tested with UGS and Easel software", "source": "CNX Software", "date": "2026-08-27", "url": "https://www.cnx-software.com/2026/08/27/lunyee-3020-nova-review-a-desktop-cnc-router-with-710w-spindle-tested-with-ugs-and-easel-software/", "summary": "<div><img alt=\"LUNYEE 3020 Nova CNC 710w review\" class=\"attachment-medium size-medium wp-post-image\" height=\"463\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/08/LUNYEE-3020-Nova-CNC-710w-review-720x463.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>We&#8217;ve gotten a sample of the LUNYEE 3020 Nova desktop CNC router for review. The machine features a 710W trim router spindle suitable for carving wood, acrylic, and aluminum. The drive system relies on dual HG15 linear guides and 1204 ball screws for enhanced rigidity and motion accuracy, and the machine integrates NEMA 17 stepper motors with 0.89 N·m torque. It supports Windows, Linux, and Mac systems and works with GRBL-compatible CNC software such as UGS, Fusion 360, VCarve, Easel, and LightBurn. LUNYEE sent us the CNC router with a dust shoe and a CNC vise worktable for review. We will cover the specifications, go through an unboxing, and show how to assemble and set up the machine before testing it with UGS and Easel programs using wood and acrylic as test materials suitable for the bits provided by the company. LUNYEE 3020 Nova desktop CNC router specifications Control Board [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/08/27/lunyee-3020-nova-review-a-desktop-cnc-router-with-710w-spindle-tested-with-ugs-and-easel-software/\">LUNYEE 3020 Nova review &#8211; A desktop CNC router with 710W spindle tested with UGS and Easel software<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Engineering Embedded Systems for Aerospace and Defense", "source": "Embedded.com", "date": "2026-08-27", "url": "https://www.embedded.com/engineering-embedded-systems-for-aerospace-and-defense/", "summary": "<p>For years, electronics for military and aerospace applications have been built around hardware that could tolerate harsh environments far beyond those encountered by commercial and industrial machinery. Such systems include satellites, planetary rovers, combat vehicles, naval platforms, avionics, and electronic warfare equipment. Ruggedized packaging, military-grade components, and rigorous qualification testing ensured that systems remained operational [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/engineering-embedded-systems-for-aerospace-and-defense/\">Engineering Embedded Systems for Aerospace and Defense<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "RAIN Alliance Launches RFID Sensor Working Group", "source": "Embedded.com", "date": "2026-08-27", "url": "https://www.embedded.com/rain-alliance-launches-rfid-sensor-working-group/", "summary": "<p>The RAIN Alliance has established a new RFID Sensor Working Group to support the development and adoption of sensor-enabled RAIN RFID technologies. The group will bring together technology providers, end users, and industry stakeholders to address emerging applications, deployment challenges, and standards requirements across industrial IoT, asset management, and digital product passport (DPP) use cases. [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/rain-alliance-launches-rfid-sensor-working-group/\">RAIN Alliance Launches RFID Sensor Working Group<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "Advantech places Intel 18A processors at heart of edge AI computing", "source": "Electronics Weekly", "date": "2026-08-27", "url": "https://www.electronicsweekly.com/news/products/bus-systems-sbcs/advantech-places-intel-18a-processors-at-h orter clothespin inlet (2mm back), stabilizing arc at the back preventing beak from shifting, and extended base so it doesn&#8217;t flip over when opened one-handed. Small front tray added. PETG recommended for heat resistance. Compatible with the original [&#8230;]"}, {"title": "AI book scanning: Just what is a rare book?", "source": "Adafruit", "date": "2026-08-27", "url": "https://blog.adafruit.com/2026/08/27/ai-book-scanning-just-what-is-a-rare-book/", "summary": "One of the stories of the last few weeks has been that AI companies have been scanning books in very large numbers in order to train their models with content guaranteed to have been written before 2002, and thus AI free. Jenny List for Hackaday writes: In this case they’re destroying the books for two [&#8230;]"}, {"title": "Richard Feynman’s 80-year-old quantum postulate has now been validated", "source": "Adafruit", "date": "2026-08-27", "url": "https://blog.adafruit.com/2026/08/27/richard-feynmans-80-year-old-quantum-postulate-has-now-been-validated/", "summary": "A foundational postulate of quantum physics has been directly verified by an experiment for the first time. Formulated by Richard Feynman nearly 80 years ago, it has long formed much of the backbone of modern physics. Quantum particles are notoriously difficult to analyse, as interacting with them affects their properties. But researchers have developed powerful [&#8230;]"}, {"title": "Magnetic Adjustable PCB Holder Tool #3DThursday #3DPrinting", "source": "Adafruit", "date": "2026-08-27", "url": "https://blog.adafruit.com/2026/08/27/magnetic-adjustable-pcb-holder-tool-3dthursday-3dprinting/", "summary": "Shared by Sanja 3D on MakerWorld: Magnetic PCB Holder that utilizes an old, repurposed build plate or any metal surface for maximum flexibility. This model is a remix of an excellent PCB holder originally designed by squinn. I’d like to take this opportunity to thank him for his brilliant idea and even better execution—truly masterful [&#8230;]"}, {"title": "Magnetic PCB Holder – Snap-On to Print Beds or Extra Plates #3DPrinting", "source": "Adafruit", "date": "2026-08-27", "url": "https://blog.adafruit.com/2026/08/27/magnetic-pcb-holder-snap-on-to-print-beds-or-extra-plates-3dprinting/", "summary": "A magnetic PCB holder that snaps onto any steel print surface (printer bed or spare metal plate) to securely hold boards for soldering, probing, rework, and photos. Low-profile adjustable clamps keep everything steady without getting in your way. Uses 8×2mm or 10×2mm neodymium disc magnets + M4×12mm bolts. Print in PETG or ABS for better [&#8230;]"}, {"title": "Modular Flexi Piranha – Articulated Fish with Scale Texture #3DThursday #3DPrinting", "source": "Adafruit", "date": "2026-08-27", "url": "https://blog.adafruit.com/2026/08/27/modular-flexi-piranha-articulated-fish-with-scale-texture-3dthursday-3dprinting/", "summary": "JIMGA shares: An articulated print-in-place piranha with realistic scale texture (second model where the designer added surface scales — turned out incredible). Fully modular, no glue required. Does require AMS for the multicolor scale detail. Great addition to the desk aquarium alongside the other Flexi JIMGA models this week download the files on: https://makerworld.com/en/models/2538136-modular-flexi-piranha-articulated-fish Every [&#8230;]"}, {"title": "New component added SCD43👃Adafruit IO WipperSnapper 1.0.0 Beta 132 Released!", "source": "Adafruit", "date": "2026-08-27", "url": "https://blog.adafruit.com/2026/08/27/new-component-added-scd43-adafruit-io-wippersnapper-beta-132-released/", "summary": "Adafruit WipperSnapper Firmware 1.0.0 beta 132 has been released on GitHub. This is the latest version of WipperSnapper and a stable release. It adds individual component definitions for the Sensirion SCD4x family of Carbon Dioxide sensors, now including the SCD40, SCD41, and SCD43 in increasing accuracy. &#160; Installing WipperSnapper Follow this learning system guide to learn how [&#8230;]"}, {"title": "John Park’s Workshop — LIVE TODAY 8/27/26", "source": "Adafruit", "date": "2026-08-27", "url": "https://blog.adafruit.com/2026/08/27/john-parks-workshop-live-today-8-27-26/", "summary": "It&#8217;s JOHN PARK’S WORKSHOP — LIVE! &#8212; Coming up at 4pm ET / 1pm PT Today (the usual time, no change to the Workshop show schedule)!  LIVE TEXT CHAT IS HERE in the Adafruit Discord chat! Projects  CircuitPython Parsec Learn Guide Recap Tool Tips Retro Gear and more! The live video will be on Youtube [&#8230;]"}, {"title": "Soldering Tool Holder – Flexible Arms with Modular 4-Arm Base #3DThursday #3DPrinting", "source": "Adafruit", "date": "2026-08-27", "url": "https://blog.adafruit.com/2026/08/27/soldering-tool-holder-flexible-arms-with-modular-4-arm-base-3dthursday-3dprinting/", "summary": "NYDER shares: A soldering third-arm helper that securely holds wires, PCBs, and small components. Modular base supports up to four flexible arms — start with one or two, expand as your projects grow. By community designer download the files on: https://makerworld.com/en/models/3086320-soldering-tool-holder-flexible-arms-helping-hands Every Thursday is #3dthursday here at Adafruit! The DIY 3D printing community has passion [&#8230;]"}, {"title": "REMINDER: John Park’s Workshop — LIVE TODAY 8/27/26", "source": "Adafruit", "date": "2026-08-27", "url": "https://blog.adafruit.com/2026/08/27/reminder-john-parks-workshop-live-today-8-27-26/", "summary": "It&#8217;s JOHN PARK’S WORKSHOP — LIVE! &#8212; Coming up at 4pm ET / 1pm PT Today (the usual time, no change to the Workshop show schedule)!  LIVE TEXT CHAT IS HERE in the Adafruit Discord chat! Projects  CircuitPython Parsec Learn Guide Recap Tool Tips Retro Gear and more! The live video will be on Youtube [&#8230;]"}, {"title": "Melting Pumpkin Skull – Halloween Sculpture #3DPrinting", "source": "Adafruit", "date": "2026-08-27", "url": "https://blog.adafruit.com/2026/08/27/melting-pumpkin-skull-halloween-sculpture-3dprinting/", "summary": "A remix of the original Clyde Frog Elegoo starter kit holder, updated to fit breadboards with the 3 tabs that join breadboards together (which the original didn&#8217;t accommodate). Requires printing 4 risers separately. Alternative Arduino workstation for makers using kits with tabbed breadboards. Learn more! Every Thursday is #3dthursday here at Adafruit! The DIY 3D [&#8230;]"}, {"title": "Infineon supplies silicon carbide technology to Fox ESS, enhancing efficiency of residential energy storage systems", "source": "EE Journal", "date": "2026-08-27", "url": "https://www.eejournal.com/industry_news/infineon-supplies-silicon-carbide-technology-to-fox-ess-enhancing-efficiency-of-residential-energy-storage-systems/", "summary": "Infineon Technologies AG (FSE: IFX / OTCQX: IFNNY) supplies silicon carbide (SiC) power semiconductors to Fox ESS, a leading provider of renewable energy solutions, to enhance the efficiency of its residential energy storage systems (ESS). Leveraging Infineon&#8217;s CoolSiC™ MOSFETs 1200 V G2 in the Q-DPAK package, Fox ESS has reduced switching losses by 70 percent. &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/infineon-supplies-silicon-carbide-technology-to-fox-ess-enhancing-efficiency-of-residential-energy-storage-systems/\">Read More &#8594;<span class=\"screen-reader-text\"> \"Infineon supplies silicon carbide technology to Fox ESS, enhancing efficiency of residential energy storage systems\"<\/span><\/a>"}, {"title": "Compact Connector Series from Lane Electronics Meet Rapidly Expanding Drone Market Requirements", "source": "EE Journal", "date": "2026-08-27", "url": "https://www.eejournal.com/industry_news/compact-connector-series-from-lane-electronics-meet-rapidly-expanding-drone-market-requirements/", "summary": "Lane Electronics,  a market-leading franchised distributor for many of the industry’s major electrical, electronic and optical connector manufacturers is highlighting a range of proven interconnect solutions which may be ideally suited to the rapidly evolving Unmanned Aerial Vehicle (UAV) market. As defence and commercial drone programmes increasingly demand lower-cost, lightweight platforms delivered within ever-shorter development cycles, &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/compact-connector-series-from-lane-electronics-meet-rapidly-expanding-drone-market-requirements/\">Read More &#8594;<span class=\"screen-reader-text\"> \"Compact Connector Series from Lane Electronics Meet Rapidly Expanding Drone Market Requirements\"<\/span><\/a>"}, {"title": "Chonnam National University Researchers Develop New Composite Electrolyte That Improves Safety and Lifespan of Lithium-Metal Batteries", "source": "EE Journal", "date": "2026-08-27", "url": "https://www.eejournal.com/industry_news/chonnam-national-university-researchers-develop-new-composite-electrolyte-that-improves-safety-and-lifespan-of-lithium-metal-batteries/", "summary": "Lithium metal batteries (LMBs), that use pure lithium (Li) for their negative electrodes, are attracting significant attention due to their extremely high theoretical capacity. However, their practical applications are limited by low cycling stability and safety issues, arising from dendrite formation, electrolyte breakdown and uneven solid-electrolyte interface formation. Solid-state electrolytes are a promising solution to &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/chonnam-national-university-researchers-develop-new-composite-electrolyte-that-improves-safety-and-lifespan-of-lithium-metal-batteries/\">Read More &#8594;<span class=\"screen-reader-text\"> \"Chonnam National University Researchers Develop New Composite Electrolyte That Improves Safety and Lifespan of Lithium-Metal Batteries\"<\/span><\/a>"}, {"title": "Keysight Accelerates AttoTude IC Design Cycles by More Than 50%", "source": "EE Journal", "date": "2026-08-27", "url": "https://www.eejournal.com/industry_news/keysight-accelerates-attotude-ic-design-cycles-by-more-than-50/", "summary": "Keysight Technologies, Inc. (NYSE: KEYS) today announced that AttoTude Inc., a pioneer of next-generation ASICs over Dielectric interconnect technology for AI and hyperscale data center applications, has expanded its use of Keysight EDA software to manage its full IC design workflow. As a result, AttoTude has reduced its design cycles by more than 50% while &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/keysight-accelerates-attotude-ic-design-cycles-by-more-than-50/\">Read More &#8594;<span class=\"screen-reader-text\"> \"Keysight Accelerates AttoTude IC Design Cycles by More Than 50%\"<\/span><\/a>"}, {"title": "Lam Research Breaks Ground on New Oregon Lab to Accelerate AI Era Semiconductor Research & Development Locally, Globally", "source": "EE Journal", "date": "2026-08-27", "url": "https://www.eejournal.com/industry_news/lam-research-breaks-ground-on-new-oregon-lab-to-accelerate-ai-era-semiconductor-research-development-locally-globally/", "summary": "In a ceremony today at its world-class research and development (R&#38;D) center in Tualatin, Oregon, Lam Research Corp. (NASDAQ: LRCX) commemorated the start of construction on its new, state-of-the-art Oregon lab, part of a more than $3 billion planned investment in its global lab network over the next five years to accelerate breakthroughs for the creation of &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/lam-research-breaks-ground-on-new-oregon-lab-to-accelerate-ai-era-semiconductor-research-development-locally-globally/\">Read More &#8594;<span class=\"screen-reader-text\"> \"Lam Research Breaks Ground on New Oregon Lab to Accelerate AI Era Semiconductor Research &#038; Development Locally, Globally\"<\/span><\/a>"}, {"title": "Is It Better to Live with AI Running Amok or Without AI at All? (Part 1)", "source": "EE Journal", "date": "2026-08-27", "url": "https://www.eejournal.com/article/is-it-better-to-live-with-ai-running-amok-or-without-ai-at-all-part-1/", "summary": "<img alt=\"\" class=\"webfeedsFeaturedVisual wp-post-image\" height=\"300\" src=\"https://www.eejournal.com/wp-content/uploads/2026/08/max-0513-image-for-home-page-ai-amok-part1-300x300.jpg\" style=\"display: block; margin-bottom: 5px; clear: both;\" width=\"300\" />I was chatting with a friend the other day (stop laughing, it’s true, I do have friends). We were discussing the ever-increasing use of AI. A couple of topics particularly piqued my interest: what would happen if AI were to run amok, and what would we all do if AI were to suddenly become unavailable. &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/article/is-it-better-to-live-with-ai-running-amok-or-without-ai-at-all-part-1/\">Read More &#8594;<span class=\"screen-reader-text\"> \"Is It Better to Live with AI Running Amok or Without AI at All? (Part 1)\"<\/span><\/a>"}, {"title": "HomeMaster MiniPLC – An ESP32 DIN-rail PLC controller for Home Assistant", "source": "CNX Software", "date": "2026-08-26", "url": "https://www.cnx-software.com/2026/08/26/homemaster-miniplc-an-esp32-din-rail-plc-controller-for-home-assistant/", "summary": "<div><img alt=\"MiniPLC — ESP32 DIN Rail PLC for Home Assistant\" class=\"attachment-medium size-medium wp-post-image\" height=\"480\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/08/MiniPLC-—-ESP32-DIN-Rail-PLC-for-Home-Assistant-720x480.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>The HomeMaster MiniPLC is an ESP32 PLC controller in a compact DIN-rail form factor with ESPHome pre-installed for Home Assistant integration, and designed for residential and light industrial automation. The device features relay outputs, four isolated 24V digital inputs, 0–10V analog inputs, one 0–10V analog output, PT100/PT1000 RTD channels, 1-Wire buses, and an RS-485 Modbus RTU interface. It also includes a 128 × 64 OLED display, four buttons, 12 LEDs, a buzzer, RTC, microSD slot, and optional 10/100Mbps Ethernet, with support for 24 V DC or 85–265 V AC power. HomeMaster MiniPLC specifications: Wireless Module  – ESP32-WROOM-32D-N16 (soldered on the backside of the PCB) SoC –  ESP32 dual-core wireless microcontroller CPU – Dual-core Xtensa 32-bit microprocessor @ 240MHz Memory –  520KB internal SRAM Storage – 16 MB flash Wireless – Wi-Fi 802.11b/g/n, and Bluetooth (4.2 and BLE) External Wi-Fi antenna (SMA) Storage – MicroSD card slot Display – 128 × 64 [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/08/26/homemaster-miniplc-an-esp32-din-rail-plc-controller-for-home-assistant/\">HomeMaster MiniPLC &#8211; An ESP32 DIN-rail PLC controller for Home Assistant<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Banana Pi BPI-AI2N – A Renesas RZ/V2N-based SoM and carrier board for Vision AI applications", "source": "CNX Software", "date": "2026-08-26", "url": "https://www.cnx-software.com/2026/08/26/banana-pi-bpi-ai2n-a-renesas-rz-v2n-based-som-and-carrier-board-for-vision-ai-applications/", "summary": "<div><img alt=\"Banana Pi BPI-AI2N Renesas RZ/V2N SoM and carrier board\" class=\"attachment-medium size-medium wp-post-image\" height=\"481\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/08/Banana-Pi-BPI-AI2N-Renesas-RZ-V2N-som-carrier-board-720x481.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Banana Pi BPI-AI2N is a system-on-module (SoM) powered by a Renesas RZ/V2N quad-core Cortex-A55 microprocessor with a 15 TOPS (sparse) DRP-AI3 accelerator for Vision AI workloads. The module features 8GB LPDDR4x, 32GB eMMC flash, 64MB SPI flash, two Gigabit Ethernet controllers, a PMIC, and exposes all I/Os through a 260-pin SO-DIMM connector. The company also provides a Jetson Nano-inspired carrier board with a MIPI DSI connector, two MIPI CSI connectors, two GbE RJ45 ports, two USB 3.0 ports, an M.2 socket for NVMe SSD storage, a 40-pin GPIO header, and more. Banana Pi BPI-AI2N-Core SoM specifications: SoC &#8211; Renesas RZ/V2N CPU Quad-core Arm Cortex-A55 @ 1.8 GHz Arm Cortex-M33 @ 200 MHz GPU – Arm Mali-G31 3D graphics engine (GE3D) with OpenGL ES 3.2 and OpenCL 2.0 FP VPU – Encode &#38; decode H.264 – Up to 1920×1080 @ 60 fps (Renesas specs, but SOMDEVICES also mentions up to 4K @ [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/08/26/banana-pi-bpi-ai2n-a-renesas-rz-v2n-based-som-and-carrier-board-for-vision-ai-applications/\">Banana Pi BPI-AI2N &#8211; A Renesas RZ/V2N-based SoM and carrier board for Vision AI applications<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Altera Expands Agilex 9 Direct RF FPGA Ecosystem for Defense", "source": "Embedded.com", "date": "2026-08-26", "url": "https://www.embedded.com/altera-expands-agilex-9-direct-rf-fpga-ecosystem-for-defense/", "summary": "<p>Altera Corp. has recently expanded its Agilex 9 Direct RF FPGA ecosystem through collaborations with Mercury Systems and VadaTech, introducing commercial off-the-shelf (COTS) solutions for next-generation defense platforms. The partnerships combine Agilex 9 medium-band Direct RF FPGAs with open-architecture hardware to help defense system developers reduce size, weight, power, and cost (SWaP-C), shorten development cycles, [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/altera-expands-agilex-9-direct-rf-fpga-ecosystem-for-defense/\">Altera Expands Agilex 9 Direct RF FPGA Ecosystem for Defense<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "Mouser Electronics Stocking Newest Connectivity Solutions from Nordic Semiconductor", "source": "EE Journal", "date": "2026-08-26", "url": "https://www.eejournal.com/industry_news/mouser-electronics-stocking-newest-connectivity-solutions-from-nordic-semiconductor/", "summary": "Mouser Electronics, Inc., the New Product Introduction (NPI) leader™ empowering innovation, stocks a wide range of authorized products from Nordic Semiconductor, a leading manufacturer of low-power, high-performance wireless technologies and development tools. Since 2011, Mouser&#8217;s distribution partnership with Nordic Semiconductor has served engineers&#8217; component and solution needs across industrial, medical, and consumer wireless applications. The Nordic Semiconductor nRF54L15 development kit, available from Mouser, &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/mouser-electronics-stocking-newest-connectivity-solutions-from-nordic-semiconductor/\">Read More &#8594;<span class=\"screen-reader-text\"> \"Mouser Electronics Stocking Newest Connectivity Solutions from Nordic Semiconductor\"<\/span><\/a>"}, {"title": "KYOCERA AVX Releases Vibration-Proof Aluminum Electrolytic Capacitors", "source": "EE Journal", "date": "2026-08-26", "url": "https://www.eejournal.com/industry_news/kyocera-avx-releases-vibration-proof-aluminum-electrolytic-capacitors/", "summary": "KYOCERA AVX, a leading global manufacturer of advanced electronic components engineered to accelerate technological innovation and build a better future, released two new series of compact, vibration-proof aluminum electrolytic capacitors engineered for harsh industrial environments. Designed to overcome the mechanical stress challenges that have limited the application of aluminum electrolytic capacitors in industrial applications, the &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/kyocera-avx-releases-vibration-proof-aluminum-electrolytic-capacitors/\">Read More &#8594;<span class=\"screen-reader-text\"> \"KYOCERA AVX Releases Vibration-Proof Aluminum Electrolytic Capacitors\"<\/span><\/a>"}, {"title": "­ Taoglas Expands Outdoor and Industrial Connectivity Capabilities with Acquisition of QuWireless", "source": "EE Journal", "date": "2026-08-26", "url": "https://www.eejournal.com/industry_news/taoglas-expands-outdoor-and-industrial-connectivity-capabilities-with-acquisition-of-quwireless/", "summary": "Taoglas®, a trusted provider of antennas and advanced RF solutions, today announced it has completed the acquisition of Wireless Instruments Sp. z o.o. (&#8220;QuWireless&#8221;), a specialist in high-performance antennas and antenna-enclosure systems for wireless communication devices. Headquartered in Poland, QuWireless has built a strong reputation for antenna enclosure products that perform reliably in real-world outdoor installations &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/taoglas-expands-outdoor-and-industrial-connectivity-capabilities-with-acquisition-of-quwireless/\">Read More &#8594;<span class=\"screen-reader-text\"> \"­ Taoglas Expands Outdoor and Industrial Connectivity Capabilities with Acquisition of QuWireless\"<\/span><\/a>"}, {"title": "Rackspace Technology Launches Rackspace Cloud, Among the First Fully Managed Multitenant Cloud Platforms Built on VMware Cloud Foundation 9.1", "source": "EE Journal", "date": "2026-08-26", "url": "https://www.eejournal.com/industry_news/rackspace-technology-launches-rackspace-cloud-among-the-first-fully-managed-multitenant-cloud-platforms-built-on-vmware-cloud-foundation-9-1/", "summary": "Rackspace Technology® (NASDAQ: RXT), a global enterprise AI infrastructure and solutions provider, today announced the launch of Rackspace Cloud, a fully managed, multitenant cloud platform powered by Broadcom&#8217;s VMware Cloud Foundation 9.1 (VCF 9.1), initially available in Dallas, followed soon by North Virginia and Chicago areas. Rackspace is among the first providers to bring a fully managed multitenant platform to &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/rackspace-technology-launches-rackspace-cloud-among-the-first-fully-managed-multitenant-cloud-platforms-built-on-vmware-cloud-foundation-9-1/\">Read More &#8594;<span class=\"screen-reader-text\"> \"Rackspace Technology Launches Rackspace Cloud, Among the First Fully Managed Multitenant Cloud Platforms Built on VMware Cloud Foundation 9.1\"<\/span><\/a>"}, {"title": "Lantronix Open-M 720G/520G – Ultra-compact LGA system-on-modules based on MediaTek Genio 720 and Genio 520 SoCs", "source": "CNX Software", "date": "2026-08-25", "url": "https://www.cnx-software.com/2026/08/26/lantronix-open-m-720g-520g-ultra-compact-lga-system-on-module-based-on-mediatek-genio-720-and-genio-520-socs/", "summary": "<div><img alt=\"Lantronix Open M-520G and Open-M 720G\" class=\"attachment-medium size-medium wp-post-image\" height=\"385\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/08/Lantronix-Open-M-520G-720G-720x385.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Lantronix Open-M 720G and 520G are compact (43x44mm) LGA system-on-modules (SoM) powered by 6nm MediaTek Genio 720 and Genio 520 SoCs, offering an AI performance of 10 TOPS, and designed for Edge IoT applications running low-power Vision AI and GenAI tasks. The Genio 720 dual-camera module ships with 8GB LPDDR5 and the Genio 520 single-camera module with 4GB LPDDR5. Both offer 128GB UFS storage, Gigabit Ethernet, optional WiFi 6 and Bluetooth 5.3 connectivity, dual display support, audio inputs/outputs, USB 3.2/2.0 interfaces, PCIe Gen2 x1, and more. Lantronix Open-M 720G/520G specifications: SoC (one or the other) MediaTek Genio 520 (MT8371) CPU – 2x Cortex-A78 up to 2.2GHz,  6x Cortex-A55 up to 2.0 GHz GPU – Arm Mali-G57 MC2 up to 880 MHz VPU Video Decode – Up to 1920 x 1200 @ 60fps Video Encode – Up to 1920 x 1200 @ 60fps ISP – 1x ISP NPU – NPU850 AI accelerator [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/08/26/lantronix-open-m-720g-520g-ultra-compact-lga-system-on-module-based-on-mediatek-genio-720-and-genio-520-socs/\">Lantronix Open-M 720G/520G &#8211; Ultra-compact LGA system-on-modules based on MediaTek Genio 720 and Genio 520 SoCs<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "$299 Arduino Ventuno Q SBC combines Qualcomm Dragonwing IQ8 SoC and STM32H5 MCU", "source": "CNX Software", "date": "2026-08-25", "url": "https://www.cnx-software.com/2026/08/25/299-arduino-ventuno-q-sbc-combines-qualcomm-dragonwing-iq8-soc-and-stm32h5-mcu/", "summary": "<div><img alt=\"Arduino Ventuno Q\" class=\"attachment-medium size-medium wp-post-image\" height=\"480\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/08/Arduino-Ventuno-Q-720x480.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>The Arduino Ventuno Q is a single board computer pairing a Qualcomm Dragonwing IQ8 (IQ-8275) octa-core Edge AI SoC with an STM32H5F5 Arm Cortex-M33 microcontroller for real-time I/Os. First introduced at Embedded World 2026, the Ventuno Q is the second Qualcomm-based Arduino board after the Arduino UNO Q launched in October 2025. It&#8217;s quite a different beast with a larger design featuring 16GB LPDDR5, 64GB eMMC flash, an M.2 socket for NVMe storage, 2.5GbE and Wi-Fi 6 networking, a 4K-capable HDMI output, and two USB 3.2 ports, while still offloading real-time I/O to a Cortex-M33 microcontroller. Arduino Ventuno Q (ABX00181) specifications: SoC  &#8211; Qualcomm Dragonwing IQ8 (IQ-8275, also known as QCS8275): CPU &#8211; Octa-core Kryo Gen 6 (Arm Cortex-A78/A55) processor GPU &#8211; Adreno A623 AI accelerator -Hexagon Tensor AI Processor (NPU) up to 40 dense TOPS ISP &#8211; Qualcomm Spectra 692/690 ISP Microcontroller (MCU) &#8211; STMicro STM32H5F5 CPU core &#8211; [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/08/25/299-arduino-ventuno-q-sbc-combines-qualcomm-dragonwing-iq8-soc-and-stm32h5-mcu/\">$299 Arduino Ventuno Q SBC combines Qualcomm Dragonwing IQ8 SoC and STM32H5 MCU<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Firehat is an open-source FireWire DV capture HAT for SBCs with Raspberry Pi PCIe FFC connector (Crowdfunding)", "source": "CNX Software", "date": "2026-08-25", "url": "https://www.cnx-software.com/2026/08/25/firehat-open-source-firewire-dv-capture-hat-pcie-sbc-raspberry-pi-5-radxa-rock-2f/", "summary": "<div><img alt=\"Firehat A compact FireWire DV capture HAT for single board computers\" class=\"attachment-medium size-medium wp-post-image\" height=\"480\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/08/Firehat-A-compact-FireWire-DV-capture-HAT-for-single-board-computers-720x480.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Computer Equipment Group has launched the Firehat, an open-source FireWire HAT that adds a native IEEE 1394 / i.LINK / DV port to SBCs with a Raspberry Pi PCIe FFC connector like the Pi 5 or the Radxa ROCK 2F. Built around a VIA VT6315N controller, the Firehat provides a modern way to capture footage from MiniDV, Digital8, DVCAM, DVCPRO, and HDV camcorders. It lets users connect compatible cameras or decks to an SBC and record the original digital DV stream directly to local storage, without legacy computers or discontinued FireWire capture cards. Firehat specifications: Compatibility – Radxa ROCK 2F, Raspberry Pi 5, and other SBCs that expose PCIe over an FPC connector (or via adapter) Controller – VIA VT6315N FireWire / IEEE 1394 controller Display – 1.3-inch monochrome OLED display onboard Camera input port – 6-pin FireWire/i.LINK/DV port Host interface PCIe 2.0 FFC connector for video 40-pin Raspberry Pi [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/08/25/firehat-open-source-firewire-dv-capture-hat-pcie-sbc-raspberry-pi-5-radxa-rock-2f/\">Firehat is an open-source FireWire DV capture HAT for SBCs with Raspberry Pi PCIe FFC connector (Crowdfunding)<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Advantech AOM-6741 AI Vision SMARC module features 100 TOPS Qualcomm IQ-9075 SoC, up to 36 GB LPDDR5", "source": "CNX Software", "date": "2026-08-25", "url": "https://www.cnx-software.com/2026/08/25/advantech-aom-6741-qualcomm-iq-9075-smarc-module/", "summary": "<div><img alt=\"Advantech AOM-6741\" class=\"attachment-medium size-medium wp-post-image\" height=\"432\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/08/Advantech-AOM-6741-720x432.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Advantech AOM-6741 is a SMARC 2.2 Full Size module powered by a Qualcomm Dragonwing IQ-9075 octa-core SoC with up to 100 TOPS (INT8) of AI performance, up to 36 GB LPDDR5 memory, and 128GB UFS storage. The module also features two MIPI DSI connectors, at least one MIPI CSI connector, and exposes all I/Os through a standard 314-pin MXM 3.0 edge connector, including four DisplayPort interfaces, dual 2.5GbE, two USB 3.2 Gen2, PCIe Gen3 x2 and x4 interfaces, and more. With support for up to 16 concurrent cameras, the OAM-06741 SoM mainly targets industrial-grade vision intelligence applications. Advantech AOM-6741 specifications: SoC – Qualcomm DragonWing IQ-9075 CPU Octa-core Kryo Gen 6 (Cortex-A78C-based) application cores @ up to 3.2 GHz (according to Advantech, conflicts with earlier announcements mentioning up to 2.36 GHz) Quad-core Cortex-R52 real-time cores @ up to 1.85GHz GPU – Adreno 663 GPU delivering up to 1.2 TFLOPS FP32 with secure [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/08/25/advantech-aom-6741-qualcomm-iq-9075-smarc-module/\">Advantech AOM-6741 AI Vision SMARC module features 100 TOPS Qualcomm IQ-9075 SoC, up to 36 GB LPDDR5<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Nvidia Unveils Jetson Orin Nano 2 for Robotics and Edge AI", "source": "Embedded.com", "date
