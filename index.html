get=\"_blank\">University of Stuttgart<\/a>, in Germany. During his year there, he studied systems, software problems, and related topics.<\/p><p>He returned to Japan and was hired as an associate professor of mechanical engineering at the <a href=\"https://www.tus.ac.jp/en/\" rel=\"noopener noreferrer\" target=\"_blank\">Tokyo University of Science<\/a>. He conducted research into practical uses for robots by visiting industrial plants. He decided to develop robots that inspect industrial equipment such as those used in assembly plants, oil refineries, and power stations—places that “can be hostile environments for humans,” he says.<\/p><p>His work drew interest from chemical, oil, and utility companies.<\/p><p>“I got a lot of money from them for this very practical application, which funded my research,” he says, laughing.<\/p><h2>Developing popular robotic systems<\/h2><p>Fukuda grew tired of making those robots, he says, so he switched to creating ones for scientific applications. He developed many techniques, but he probably is best known for his modular, <a href=\"https://www.sciencedirect.com/science/article/abs/pii/004579069290029D\" rel=\"noopener noreferrer\" target=\"_blank\">cellular robotic systems<\/a> (CEBOTs), which he introduced in 1985.<\/p><p>He has described how <a href=\"https://ieeexplore.ieee.org/search/searchresult.jsp?newsearch=true&amp;queryText=CEBOT\" rel=\"noopener noreferrer\" target=\"_blank\">CEBOTs work<\/a> in numerous papers published in the <a href=\"https://ieeexplore.ieee.org/Xplore/home.jsp\" rel=\"noopener noreferrer\" target=\"_blank\">IEEE Xplore Digital Library<\/a>.<\/p><p>The CEBOT system is composed of a number of autonomous robotic cells that stick together like interlocking <a href=\"https://www.lego.com/en-us\" rel=\"noopener noreferrer\" target=\"_blank\">Lego<\/a> plastic bricks, he says.<\/p><p>Each cell is a fundamental modular unit that has a function. When a simple task is given, the system can analyze it and generate the structure of the cellular manipulator. The cells connect to and detach from each other through connection mechanisms and cooperate mutually, creating complex structures and configurations.<\/p><p>“You start developing from the component-wise to the cell-wise to a small functional unit—and then you come up with clusters that make bigger systems. We can make a society of robot beings like that,” he explained in his <a href=\"https://ethw.org/Oral-History:Toshio_Fukuda\" rel=\"noopener noreferrer\" target=\"_blank\">oral history<\/a> published on the <a href=\"https://ethw.org/Main_Page\" rel=\"noopener noreferrer\" target=\"_blank\">Engineering and Technology History Wiki<\/a>. “It’s a distributed robotic system, a self-organized robotic system, and also an evolutionary robotic system.<\/p><p>“It’s also a fault-tolerant robot system because if something is wrong, you just remove those things and make a new one. You keep the system working. That’s a great thing.”<\/p><p>Today CEBOTs are used for a variety of tasks such as delivering medication in hospitals, assisting with planting crops, and transporting products in distribution centers. Check out <a href=\"https://spectrum.ieee.org/\" target=\"_self\"><em><em>IEEE Spectrum<\/em><\/em><\/a>’s <a href=\"https://robotsguide.com/\" rel=\"noopener noreferrer\" target=\"_blank\">Robots Guide<\/a> for news from the world of robotics.<\/p><p>In 1989 Fukuda joined Nagoya University as a professor of mechanical engineering and micro-nano systems engineering. During his 24-year career there, he was director of the university’s <a href=\"https://en.nagoya-u.ac.jp/assets/pdf/pages/about/communications/schools/about_communications_schools_7.pdf\" rel=\"noopener noreferrer\" target=\"_blank\">Center for Micro-Nano Mechatronics<\/a>. He developed a long list of technologies at the university, including many for medical applications. He also conducted groundbreaking research into intelligent robotic systems and micro- and nano-robotics.<\/p><p>Another technology he is known for is <a href=\"https://ieeexplore.ieee.org/document/240556\" rel=\"noopener noreferrer\" target=\"_blank\">brachiation robots<\/a>, which he helped develop in 1988. He calls them <em><em>monkey robots<\/em><\/em> because they’re based on the pendulum-like movement of monkeys swinging from tree to tree. The gravity-based locomotion enables continuous movement.<\/p><p>Brachiation robots now are inspecting high-voltage transmission towers and bridges, searching damaged buildings for survivors, and performing maintenance on pipelines and cables.<\/p><p>Fukuda retired from the university in 2013 and was named professor emeritus.<\/p><p>He didn’t stay retired for long, though. He next held a teaching appointment at <a href=\"https://www.meijo-u.ac.jp/english/\" rel=\"noopener noreferrer\" target=\"_blank\">Meijo University<\/a>, in Nagoya, until he left in 2022 to join the Egypt-Japan University.<\/p><h2>A prominent volunteer<\/h2><p>He joined IEEE in 1980 at the encouragement of one of his research advisors, Professor <a href=\"https://ethw.org/Fumio_Harashima\" rel=\"noopener noreferrer\" target=\"_blank\">Fumio Harashima<\/a>, now an IEEE Life Fellow. After attending conferences and reading the organization’s publications, Fukuda says, he looked forward to becoming more involved.<\/p><p>“I wanted to know how to organize a conference and how to edit a paper for one of its <em><em>Transactions<\/em><\/em>,” he says. “I wanted to know what was going on from inside the organization, not just the outside.”<\/p><p>In 1988 he was the founding chair and organizer of IROS, in Tokyo. The conference had 330 attendees that year, and was supported by Harashima. Today it is one of the largest and most prestigious conferences on the topic, attracting more than 9,000 people annually. Out of 120,000 conferences, it was the only conference in the <a href=\"https://www.nature.com/nature-index/faq\" rel=\"noopener noreferrer\" target=\"_blank\">Nature Index<\/a> database for this year, Fukuda says.<\/p><p>In 1996 he and other members launched <a href=\"https://ieeexplore.ieee.org/xpl/RecentIssue.jsp?punumber=3516\" rel=\"noopener noreferrer\" target=\"_blank\"><em><em>IEEE Transactions on Mechatronics<\/em><\/em><\/a>.<\/p><p>He was the founding president of the <a href=\"https://ieeenano.org/\" rel=\"noopener noreferrer\" target=\"_blank\">IEEE Nanotechnology Council<\/a>, which was established in 2002. He is considered a pioneer in nanotechnology research, particularly regarding how it relates to robotics.<\/p><p>Over the years, he has held numerous volunteer positions on IEEE editorial boards and committees.<\/p><p>He was the 1998–1999 president of the <a href=\"https://www.ieee-ras.org/\" rel=\"noopener noreferrer\" target=\"_blank\">IEEE Robotics and Automation Society<\/a>, becoming the first non-U.S. member to hold the title.<\/p><p>He was director of <a href=\"https://ta.ieee.org/society-council-resources/society-and-council-operations/divisions-society-groupings\" rel=\"noopener noreferrer\" target=\"_blank\">IEEE Division X<\/a> (2001–2002 and 2017–2018), which covers intelligent systems, biological engineering, robotics, control systems, and photonic technologies. He served as the 2013–2014 director of <a href=\"https://www.ieeer10.org/\" rel=\"noopener noreferrer\" target=\"_blank\">IEEE Region 10<\/a> (Asia-Pacific).<\/p><p>As the 2020 IEEE president, Fukuda saw the organization through the early part of the <a href=\"https://spectrum.ieee.org/ieee-presidents-column-strength-and-solidarity-in-responding-to-the-challenges-of-covid19\" target=\"_self\">COVID-19 pandemic<\/a>. Because of travel restrictions, he realized IEEE should change how it offered its in-person services, specifically educational programs. He encouraged <a href=\"https://ea.ieee.org/ea-programs\" rel=\"noopener noreferrer\" target=\"_blank\">IEEE Educational Activities<\/a> to develop an online learning platform. The <a href=\"https://spectrum.ieee.org/ieee-president-lets-focus-on-continuing-education\" target=\"_self\">IEEE Learning Network<\/a> started with just three courses and now offers nearly 2,000 courses, webinars, and learning materials.<\/p><h2>An award-winning member<\/h2><p>The Emberson Award joins a slew of other recognitions Fukuda has received from IEEE. They include several from the IEEE Robotics and Automation Society: a 2004 <a href=\"https://www.ieee-ras.org/awards-recognition/society-awards/pioneer-in-robotics-and-automation-award/\" rel=\"noopener noreferrer\" target=\"_blank\">Pioneer Award<\/a>, a 2009 <a href=\"https://www.ieee-ras.org/2026-ieee-ras-award-recipients-announced/\" rel=\"noopener noreferrer\" target=\"_blank\">Saridis Leadership Award<\/a>, and the 2011 <a href=\"https://www.ieee-ras.org/awards-recognition/conference-awards/iros-harashima-award-for-innovative-technologies/\" rel=\"noopener noreferrer\" target=\"_blank\">Harashima Award for Innovative Technologies<\/a>. He is also a recipient of the Board-level 2010 IEEE Robotics and Automation <a href=\"https://www.ieee-ras.org/awards-recognition/ieee-awards/ieee-robotics-and-automation-technical-field-award-tfa/\" rel=\"noopener noreferrer\" target=\"_blank\">Technical Field Award<\/a>.<\/p><p>He says he feels strongly that IEEE should be a diverse organization that is welcoming to all. As IEEE president, he led efforts to devise a <a href=\"https://spectrum.ieee.org/ieee-diversity-and-inclusion-efforts\" target=\"_self\">diversity, equity, and inclusion program<\/a>. Several policies, procedures, and bylaws were revised to give members a safe, inclusive place for discourse.<\/p><p>“It’s important for IEEE to make everyone feel comfortable,” he says. “DEI programs are important. All people should be equal. IEEE doesn’t care who you are, what you do, what country you are from, or whether you are male or female. IEEE accepts people who have energy and passion.<\/p><p>“It accepted me, from the Far East. That’s why I like it.”<\/p><p>You can learn more about Fukuda and his career from the <a href=\"https://ethw.org/Oral-History:Toshio_Fukuda\" rel=\"noopener noreferrer\" target=\"_blank\">oral history<\/a> conducted by the <a href=\"https://www.ieee.org/about/history-center\" rel=\"noopener noreferrer\" target=\"_blank\">IEEE History Center<\/a>.<\/p>"}, {"title": "RoboBusiness 2026 call for speakers closes soon", "source": "Robotics Business Review", "date": "2026-07-06", "url": "https://www.therobotreport.com/robobusiness-2026-opens-call-for-speakers/", "summary": "<p>RoboBusiness 2026, the premier event for developers of commercial robotics and those building robotics businesses, is seeking expert speakers.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/robobusiness-2026-opens-call-for-speakers/\">RoboBusiness 2026 call for speakers closes soon<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Quantum Systems raises $1.2B to expand drone production and deployments", "source": "Robotics Business Review", "date": "2026-07-06", "url": "https://www.therobotreport.com/quantum-systems-raises-1-2b-expand-drone-production-deployments/", "summary": "<p>Quantum plans to use the proceeds to expand production capacity, strengthen supply chain resilience, and more.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/quantum-systems-raises-1-2b-expand-drone-production-deployments/\">Quantum Systems raises $1.2B to expand drone production and deployments<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Kraken Robotics acquires Covelya Group for $615M", "source": "Robotics Business Review", "date": "2026-07-06", "url": "https://www.therobotreport.com/kraken-robotics-acquires-covelya-group-for-615m/", "summary": "<p>Covelya Group expands Kraken Robotics' product offerings and total addressable market in subsea technology.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/kraken-robotics-acquires-covelya-group-for-615m/\">Kraken Robotics acquires Covelya Group for $615M<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Boston Dynamics brings its legged robots to the FIFA World Cup", "source": "Robotics Business Review", "date": "2026-07-06", "url": "https://www.therobotreport.com/boston-dynamics-brings-its-legged-robots-to-the-fifa-world-cup/", "summary": "<p>Around the 2026 FIFA World Cup, Hyundai and Boston Dynamics have taught footwork to the Atlas humanoid, while the Spot robot is on patrol.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/boston-dynamics-brings-its-legged-robots-to-the-fifa-world-cup/\">Boston Dynamics brings its legged robots to the FIFA World Cup<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Humanoid says KinetIQ Ascend reinforcement learning approaches human-level dexterity", "source": "Robotics Business Review", "date": "2026-07-05", "url": "https://www.therobotreport.com/humanoid-announces-kinetiq-ascend-reinforcement-learning-approach/", "summary": "<p>Humanoid says its KinetIQ Ascend approach can reach 99.9% manipulation reliability at human speed and beyond for industrial tasks. <\/p>\n<p>The post <a href=\"https://www.therobotreport.com/humanoid-announces-kinetiq-ascend-reinforcement-learning-approach/\">Humanoid says KinetIQ Ascend reinforcement learning approaches human-level dexterity<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Context is king: How Avride uses cloud VLMs as a safety net for delivery robots", "source": "Robotics Business Review", "date": "2026-07-04", "url": "https://www.therobotreport.com/how-avride-uses-cloud-vlms-safety-net-delivery-robots/", "summary": "<p>Avride uses vision-language models, or VLMs, to improve the environmental awareness of its delivery robots.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/how-avride-uses-cloud-vlms-safety-net-delivery-robots/\">Context is king: How Avride uses cloud VLMs as a safety net for delivery robots<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Japan Pioneered Humanoid Robots—Can It Now Catch China?", "source": "IEEE Spectrum Robotics", "date": "2026-07-04", "url": "https://spectrum.ieee.org/humanoid-robots-japan", "summary": "<img src=\"https://spectrum.ieee.org/media-library/a-middle-aged-asian-man-seated-next-to-an-uncannily-similar-humanoid-robot-with-the-same-hairstyle-glasses-and-clothing.jpg?id=67080305&amp;width=1245&amp;height=700&amp;coordinates=0%2C187%2C0%2C188\" /><br /><br /><p>“In the future, the relationship between humans and robots will deepen, and the distinction between them will probably disappear.” This prediction, from one of the attendees at the recent <a href=\"https://humanoidssummit.com/agenda-2\" rel=\"noopener noreferrer\" target=\"_blank\">Humanoids Summit in Tokyo<\/a>, might have been unremarkable had it not come directly from an android that was first introduced to the world 20 years ago. <\/p><p><a href=\"https://eng.irl.sys.es.osaka-u.ac.jp/robot\" rel=\"noopener noreferrer\" target=\"_blank\">Geminoid HI-6<\/a> is the sixth-generation of a robot originally designed in 2006. The mechanical twin of Osaka University professor <a href=\"https://spectrum.ieee.org/the-amazing-androids-of-hiroshi-ishiguro\" target=\"_self\">Hiroshi Ishiguro<\/a>, Geminoid HI-6 is now equipped with a large language model trained on Ishiguro’s own writings and interviews. It has advanced conversational skills and can even have a chat with its creator, an eerie spectacle. But at the Humanoids Summit, Geminoid was one of the few humanoid robots from Japan, the country that pioneered the form factor.<\/p><p>While the event in Tokyo had only about 40 robots on display, Chinese systems outnumbered Japanese by roughly three to one. Some Japanese robotics firms were even using Chinese robots in their own technology demonstrations, something that would have been unthinkable in the recent past—one Japanese engineer described the situation as “sad.” The conference was a stark reminder of how Japan has ceded its early lead in humanoid robot development to overseas competitors, and the challenge it now faces to secure a place in an ecosystem increasingly dominated by general-purpose robots powered by AI. <\/p><p>Twenty-five years ago, Japan was turning out <a href=\"https://www.youtube.com/watch?v=ESLc26fNAe8\" target=\"_blank\">groundbreaking humanoids that were showstopping in their abilities<\/a>, but they were not commercialized as <a href=\"https://spectrum.ieee.org/japan-earthquake-more-robots-to-the-rescue\" target=\"_blank\">practical machines<\/a> in any meaningful way. Heavily influenced by science fiction and lacking practical applications, they were mostly expensive technology demonstrations that were eventually mothballed. What Japan retains, however, is robotics design and know-how, which it must leverage to be a key player in the rapidly evolving humanoid ecosystem. <\/p><h3>Learning to Walk—Then Standing Still<\/h3><p>To anyone who has seen recent videos of Chinese humanoids doing <a href=\"https://www.youtube.com/watch?v=R6T-Ea5CfRE\" rel=\"noopener noreferrer\" target=\"_blank\">kung-fu and synchronized acrobatics<\/a>, as well as<a href=\"https://www.bbc.com/news/videos/cz0e54yrppno\" rel=\"noopener noreferrer\" target=\"_blank\"> half-marathon races<\/a>, China’s remarkable progress in the field is nothing new. At the Humanoids Summit, Toyota showed a video of its <a href=\"http://toyotatimes.jp/en/newscast/188.html\" target=\"_blank\">latest basketball-playing robot<\/a>, and Honda exhibited its <a href=\"https://global.honda/jp/RandD/field/hgrx/honda-multi-fingered-hand/\" target=\"_blank\">latest robot hand<\/a>, but the full-scale humanoids on the floor were mostly Chinese–the kid-size <a href=\"https://www.booster.tech/booster-k1/\" rel=\"noopener noreferrer\" target=\"_blank\">K1 machines from Booster Robotics<\/a> of Beijing were dancing to Michael Jackson tunes. The full-scale <a href=\"https://robotsguide.com/robots/unitree-g1\" rel=\"noopener noreferrer\" target=\"_blank\">G1 humanoid from Unitree Robotics<\/a> of Hangzhou was also doing demos. <\/p><p>“You cannot sell these bipedal systems in Japan for safety and compliance reasons,” says Shuichi Nagao, a frequent visitor to China as CTO of <a href=\"https://www.omakase.ai/robotics\" rel=\"noopener noreferrer\" target=\"_blank\">Omakase Robotics<\/a>, a division of Zeals, a Japanese humanoid robot developer. Omakase was exhibiting a G1 modified with an external PC controller, a dextrous hand, a suction-cup manipulator and a sensor “hat” with an extra speaker, mic, and camera. <\/p><p>“In China, the government is pushing humanoid development. They didn’t have an industry 20 years ago. The people pushing it are young, in their 20s and 30s. It’s a really different mentality out there,” says Nagao. “Big players in Japan are still looking for use cases for humanoids. In China, they’re already doing mass production and reducing the cost, so other countries can’t compete with them anymore.”<\/p><p>Another Japanese company showing off G1 bots was summit sponsor GMO AI & Robotics, a subsidiary of Japanese internet company <a href=\"https://en.wikipedia.org/wiki/GMO_Internet\" rel=\"noopener noreferrer\" target=\"_blank\">GMO<\/a>. It’s using the robots in partnership with Japan Airlines to <a href=\"https://group.gmo/en/news/article/850/\" rel=\"noopener noreferrer\" target=\"_blank\">load and unload cargo containers<\/a> at Tokyo’s Haneda airport. The cargo project is a trial—like <a href=\"https://www.tokyoweekender.com/entertainment/tech-trends/ai-powered-robot-monk-buddharoid/\" rel=\"noopener noreferrer\" target=\"_blank\">many other humanoid experiments<\/a>—but the fact that Chinese machines have penetrated so far into Japan’s ecosystem <a href=\"https://www.amazon.com/dp/B001SARCOI?lv=shuf&amp;channelId=500&amp;plpRedirect=mhFallback\" rel=\"noopener noreferrer\" target=\"_blank\">upends a long history<\/a>. <\/p><p>In 1973, scientists at Waseda University in Tokyo built <a href=\"https://www.humanoid.waseda.ac.jp/booklet/kato_2.html\" rel=\"noopener noreferrer\" target=\"_blank\">WABOT-1<\/a>, considered the first full-scale humanoid robot, which was capable of slow bipedal locomotion, grasping objects, and simple communication. It inspired Honda’s groundbreaking Asimo humanoid, but Asimo was never commercialized. It was eventually retired in 2022, the year ChatGPT was released. Two years later, Unitree’s G1 went on sale for US $16,000.<\/p><p class=\"shortcode-media shortcode-media-rebelmouse-image\"> <img alt=\"A 65 centimeter tall bipedal robot, its design features the head of an anime-style girl with legs directly underneath.\" class=\"rm-shortcode\" id=\"706b9\" src=\"https://spectrum.ieee.org/media-library/a-65-centimeter-tall-bipedal-robot-its-design-features-the-head-of-an-anime-style-girl-with-legs-directly-underneath.jpg?id=67080329&amp;width=980\" /> <small class=\"image-media media-caption\">China’s High Torque Technology Co. showed off its Mini Pi biped, customized with an anime-inspired head, at Humanoids Summit in Tokyo. The regular version is priced at $3,500. <\/small><small class=\"image-media media-photo-credit\">Tim Hornyak<\/small><\/p><h3>Supply and Demand<\/h3><p>Japan’s development of humanoids happened before practical applications or widespread demand were in place, but bad timing is only part of the story—Japan also has a history of developing technologies that might appeal to domestic consumers but not necessarily those overseas. For example, decades after its highly engineered multifunction toilets first appeared, they have only recently found a <a href=\"https://www.nytimes.com/2025/05/29/business/toto-toilet-japan-bidet.html\" target=\"_blank\">following abroad<\/a>. <\/p><p>Japan’s humanoid prowess was partly built on the back of its legendary industrial automation, yet even that stronghold has eroded. Ani Kelkar, a partner from McKinsey & Company in Boston who produces analytical reports about the robotics industry, told the summit audience that while Japan occupied the top spot in the world in manufacturing robot density (the number of multipurpose industrial robots in operation per 10,000 employees) from at least 1994 to 2009, it then slipped to second in 2014, third in 2019, and fifth in 2024. In that year, South Korea was at the top of the leaderboard with a robot density of 1,220 compared to Japan’s 446. <\/p><p>The International Federation of Robotics <a href=\"https://ifr.org/ifr-press-releases/news/robot-density-surges-in-europe-asia-and-americas\" target=\"_blank\">estimates<\/a> China now has the most operational industrial robots in the world, with around 2 million total units, approximately 4.5 times more than Japan. “The annual installation numbers are impressive too: 54 percent of all robots installed worldwide in 2024 were deployed in China,” the IFR said in a release in April 2026. <\/p><p>“I think the loss of Japanese leadership is more to do with the rise of China as a manufacturing powerhouse including for sectors that Japan had high export levels,” Kelkar said in an email interview. “The recovery has not yet happened as Japan “missed” the rapid acceleration in AI for robotics and is now playing catch-up.”<\/p><h3>How Japan Can Adapt <\/h3><p>Kelkar believes Japan has a $100 billion opportunity in general-purpose robotics, which are machines that can perform a wide variety of tasks, and it cannot rely on the slower-growing industrial robot market, which is centered on factory machines that do one simple and predictable task like welding car parts. He points to a McKinsey <a href=\"https://www.mckinsey.com/industries/industrials/our-insights/japans-100-billion-opportunity-in-general-purpose-robotics#/\" target=\"_blank\">white paper<\/a> suggesting that while Japan has much of the hardware and technology experience needed to support general-purpose robot development, it must change its strategy to capture a larger share in AI, software, data collection, and robotics platforms.<\/p><p><a href=\"https://ogata-lab.jp/member/ogata.html\" target=\"_blank\">Tetsuya Ogata<\/a> is a professor of engineering and director of the Institute for AI and Robotics at Waseda University, the birthplace of humanoids in Japan. He briefed the summit on how a nonprofit he chairs, the AI Robot Association (<a href=\"https://www.airoa.org/\" rel=\"noopener noreferrer\" target=\"_blank\">AIRoA<\/a>), is working with Toyota and other members to develop foundational technologies for collaborative use. <\/p><p>For instance, AIRoA has collected some 80,000 hours of data on remote operation of mobile manipulators, which Ogata believes is the largest dataset of its kind. Using the data, it built and verified vision-language-action (VLA) models, and it has also started data collection for dual-arm mobile manipulation. In an interview, Ogata acknowledged Japan’s struggle to find its place in the changing landscape. <\/p><p>“The world of AI is inherently a game of scale,” says Ogata. “Therefore, Japan’s absolute prerequisite is to secure a competitive baseline of scale—in data, computing resources, and talent. Beyond that, what I consider most critical is a mind-set shift: Rather than trying to hoard scale within a single nation or company, we must grow stronger by collaborating with a diverse ecosystem of domestic and international players.” <\/p><p>Specifically, this means creating a “collaborative domain” to address data—the single biggest bottleneck—through industry-wide cooperation rather than data siloing. By collectively nurturing a precompetitive, shared data infrastructure and foundation model, individual companies can then compete on top of it with their own applications. “By offering this open ‘data ecosystem’ to the world, we can engage global players and establish a ‘third pole’ alongside the U.S. and China,” says Ogata. “I believe this is how Japan can reclaim its global presence.”<\/p><p>In 1999, Japan introduced the <a href=\"https://www.eurotechnology.com/2015/02/22/i-mode-mobile-internet-docomo/\" rel=\"noopener noreferrer\" target=\"_blank\">world’s first mobile internet services platform<\/a>. But being first didn’t turn Japan into a smartphone manufacturing or design center—it’s now merely a supplier of parts to other countries that are leading the smartphone industry. If Japan can avoid a repeat of that experience and successfully deregulate, diversity, and commercialize its original humanoid dreams, it stands a better chance of influencing the direction of the industry and reaping billions in value. As automobiles and electronics were pillars of Japan’s industrial strategy in the last century, Japan could make humanoid robots one of its key value generators in the 21st century, an approach that would not only deliver economic benefits but give Japan greater clout in how the industry will evolve. Just like Japanese cars, electronics, and even toilets, Japanese humanoids could stand for craftsmanship and reliability. It’s a legacy that Japan can’t afford to give up. <\/p>"}, {"title": "Quarterhill discusses transport modernization as U.S. marks 70 years of federal highways", "source": "The Robot Report", "date": "2026-07-03", "url": "https://www.therobotreport.com/quarterhill-discusses-transport-modernization-u-s-marks-70-years-federal-highways/", "summary": "<p>At the U.S. celebrates 250 years of independence and 70 years of its highway system, an expert looks at the future of autonomous transport. <\/p>\n<p>The post <a href=\"https://www.therobotreport.com/quarterhill-discusses-transport-modernization-u-s-marks-70-years-federal-highways/\">Quarterhill discusses transport modernization as U.S. marks 70 years of federal highways<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Video Friday: An Earthbound Mars Rover for the Moon", "source": "IEEE Spectrum Robotics", "date": "2026-07-03", "url": "https://spectrum.ieee.org/video-friday-nasa-lunar-rover", "summary": "<img src=\"https://spectrum.ieee.org/media-library/mars-style-rover-prototype-on-rugged-ground-under-a-clear-sky-with-the-moon-visible.png?id=67083121&amp;width=1245&amp;height=700&amp;coordinates=0%2C0%2C0%2C0\" /><br /><br /><p><span><a href=\"https://spectrum.ieee.org/tag/video-friday\" target=\"_blank\">Video Friday<\/a> is your weekly selection of awesome robotics videos, collected by your friends at <\/span><em>IEEE Spectrum<\/em><span> robotics. We also post a weekly calendar of upcoming robotics events for the next few months. Please <\/span><a href=\"mailto:automaton@ieee.org?subject=Robotics%20event%20suggestion%20for%20Video%20Friday\">send us your events<\/a><span> for inclusion.<\/span><\/p><h5><a href=\"https://roboticsconference.org/\">RSS 2026<\/a>: 13–17 July 2026, SYDNEY<\/h5><h5><a href=\"https://mrs.fel.cvut.cz/summer-school-2026/\">Summer School on Multi-Robot Systems<\/a>: 29 July–4 August 2026, PRAGUE<\/h5><h5><a href=\"https://actuate.foxglove.dev/\">Actuate 2026<\/a>: 18–19 August 2026, SAN FRANCISCO<\/h5><h5><a href=\"https://2026.ieee-iros.org/\">IROS 2026<\/a>: 27 September–1 October 2026, PITTSBURGH<\/h5><p>Enjoy today’s videos!<\/p><div class=\"horizontal-rule\"><\/div><div><span style=\"display: none;\"> <\/span><\/div><blockquote class=\"rm-anchors\" id=\"fmxmym6bj-y\"><em>NASA is considering a mission concept for an advanced, nuclear-powered rover to be deployed to the Moon’s South Pole as part of the agency’s Moon Base plans. The PROMISE (Polar Rover for Observation, Mapping, and In-Situ Exploration) mission concept relies on the <\/em><em>Curiosity<\/em><em> Mars rover mission’s testbed rover. Some elements of the Perseverance Mars testbed rover shown in this video could be used as well. As exact duplicates of Curiosity and Perseverance, the testbed rovers are equipped with flight-proven engineering systems capable of carrying technology as well as science instruments that would advance Moon Base efforts.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>A Mars rover for the Moon? That’s some <a href=\"https://science.nasa.gov/resource/improved-optimism/\" target=\"_blank\">OPTIMISM<\/a> right there.<\/p><p>[ <a href=\"https://science.nasa.gov/resource/improved-optimism/\">JPL<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"6qrzc1kf7kc\">This is the absolute best thing since <a href=\"https://spectrum.ieee.org/festos-fantastical-flying-robots\" target=\"_blank\">Festo’s AirPenguin<\/a>.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><blockquote><em>The project explores soft, lightweight robots that can gently float around people in indoor environments and invite playful, affectionate, and everyday interactions. Unlike conventional drones, our robot is designed to be quiet, soft, touch-safe, and socially approachable. Through this work, we ask what future indoor companion robots might feel like if they were not rigid machines, but gentle floating beings that share space with us.<\/em><\/blockquote><p>[ <a href=\"https://dl.acm.org/doi/10.1145/3800645.3813051\">Paper<\/a> ]<\/p><p>Thanks, Mingyang!<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"m7pzr90bqw4\"><em>Today, we’re launching our home robot, Isaac 1. Deliveries will begin this fall.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>US $500 per month, with some basic task autonomy, plus teleoperation.<\/p><p>[ <a href=\"https://www.weaverobotics.com/isaac-1\">Weave Robotics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"tv90gfm9rao\">A couple of things from this new Figure video: Thing one is that the cart-pulling is a good illustration of how clumsy humanoid robots still are at basic tasks relative to humans. Thing two is that there are absolutely no humans anywhere near these robots. You can see one guy at 0:19, which I can only assume is an accident, because these robots are not safe to be around from an industrial safety perspective.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.figure.ai/news/f-03-at-bmw\">Figure<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"5mhop2g4e4u\">Our very own Kohava Mendelsohn met some robots at ICRA in Vienna, and only one of them was murderous.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://2026.ieee-icra.org/\">ICRA 2026<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"ipyxwelid9q\"><em>Welcome to Robot Park, where we’re building the future with Apollo 2. Robot Park is where Apollo learns today, getting the experience needed to make a difference tomorrow. Today we’re announcing Robot Park, our nearly 90,000-square-foot facility where Apollo 2 is collecting real-world training data needed to advance autonomous humanoid robots. <\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://apptronik.com/news-collection/welcome-to-robot-park-where-apptroniks-apollo-goes-to-work\">Apptronik<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"mrlbqt5tkh4\"><em>UBTech Robotics, the world’s first publicly traded humanoid robot-maker, has launched a humanlike robot that features lifelike silicone skin and “emotional AI,” as Chinese tech firms increasingly transition robots from the factory floor to the family living room.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.scmp.com/tech/tech-trends/article/3358884/ubtechs-lifelike-humanoid-robots-built-companionship-arriving-homes-across-china\">SCMP<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"xdq8yzehviy\"><em>Spherephones are redefining how we experience sound. Created at Georgia Tech, this wearable uses spatial audio to alert users to movement from every direction—including behind and below. Built for safer human-robot collaboration, the technology is expanding into gaming and accessibility applications. See how music is becoming a new language for awareness and interaction.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://research.gatech.edu/feature/spherephones\">Georgia Tech<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"6dme3jyj3hg\"><em>Humanoid robots are meant to carry out long-horizon autonomous missions in a world built for humans. This is hard. These missions consist of many steps, each of which requires them to perceive, navigate, and interact with the environment. This is exactly Flexion’s goal: building the general-purpose intelligence that turns any robot into a useful helper.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://flexion.ai/news/flexion-reflect-v1.0\">Flexion<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"lttnht-y47m\"><em>We’re introducing KinetIQ Ascend—our reinforcement-learning approach designed to reach 99.9 percent manipulation reliability at human speed and beyond.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://thehumanoid.ai/technology/kinetiq-ascend/\">Humanoid<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"hsmj7__elk0\"><em>Dr. Sebastian “Basti” Scherer has worked in field robotics since the first DARPA Grand Challenge in 2004. He runs the AirLab at Carnegie Mellon’s Robotics Institute and is the director of safe embodied AI at FieldAI. While much of the industry is focused on local skills like tabletop manipulation, Dr. Scherer sees the greatest value in solving dirty, dull, and dangerous tasks that require operating in uncertain environments where the robot needs to “just work.” When robots “just work,” they become less like robots and more like tools. “That’s the big challenge that we have to overcome,” he says. “And that’s the challenge that FieldAI is really primed to solve.”<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.fieldai.com/\">FieldAI<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"omzfvmtwsjc\">Look, I really appreciate how valuable robots like ElliQ can be, and robots that do good work and offer a financial benefit are incredibly important, especially in the context of family care. But in my opinion, you really shouldn’t suggest that a robot with FaceTime or whatever is an equal replacement for in-person human companionship, nor should you suggest that AI can replace a human wellness coach. If you can’t afford those things, then sure, ElliQ can offer some of those capabilities in a very limited way, but that’s all.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://elliq.com/\">ElliQ<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"gz4frehicfe\">Very cool moves! Now get a job!<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.deeprobotics.cn/en\">DEEP Robotics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"r6f8bztjqfg\"><em>Drawing inspiration from restaurant waiters in Morocco and Turkey, among other places, we equip a robot with a hanging tray to transport objects from one location to another without dropping them or spilling their contents. We incorporate this approach into an interactive robot waiter demonstration, which uses computer vision and visual servoing to steer toward a person with a raised hand to serve them.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://arxiv.org/abs/2606.10039\">Paper<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"qfsmncdh9lu\">If you’re going to make robots wear skirts or shorts or pants, you have to give them butts, or it’s just not going to work. That is all.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://techshare.co.jp/product/unitree/g1/\">TechShare<\/a> ] via [ <a href=\"https://www.youtube.com/@KazumichiMoriyama\">Kazumichi Moriyama<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"kfy7d-qiyjw\"><em>It’s Los Alamos, so of course we have robots. Some work inside gloveboxes, while others probe unexploded ordnance in the field and aid with repetitive lifting, Doc Ock–style. Legend has it there’s a fro-yo robot in the cafeteria.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.lanl.gov/media/publications/national-security-science/1224-sniffing-out-radiation\">LANL<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"8aiznj4cciu\">Here are a couple of talks from the recent Humanoids Summit in Japan, from Ali Agha of FieldAI as well as Hiroshi Ishiguro.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p class=\"shortcode-media shortcode-media-youtube\"> <span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span> <\/p><p>[ <a href=\"https://humanoidssummit.com/agenda-2\">Humanoids Summit<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div>"}, {"title": "Blattner awards Built Robotics $75M contract for physical AI to help meet energy demand", "source": "Robotics Business Review", "date": "2026-07-02", "url": "https://www.therobotreport.com/blattner-awards-built-robotics-75m-contract-meet-energy-demands/", "summary": "<p>Blattner has expanded its partnership with Built Robotics to scale autonomous systems for solar construction.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/blattner-awards-built-robotics-75m-contract-meet-energy-demands/\">Blattner awards Built Robotics $75M contract for physical AI to help meet energy demand<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Why you should combine robot dexterity with mechanical positioning for complex assembly operations", "source": "Robotics Business Review", "date": "2026-07-02", "url": "https://www.therobotreport.com/why-you-should-combine-robot-dexterity-with-mechanical-positioning-for-complex-assembly-operations/", "summary": "<p>Experts are recognizing the importance of mechanical positioning and its impact on the machine’s mobility, range and speed.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/why-you-should-combine-robot-dexterity-with-mechanical-positioning-for-complex-assembly-operations/\">Why you should combine robot dexterity with mechanical positioning for complex assembly operations<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Luxonis closes Series A round to scale physical AI perception layer", "source": "Robotics Business Review", "date": "2026-07-02", "url": "https://www.therobotreport.com/luxonis-closes-series-a-round-to-scale-physical-ai-perception-layer/", "summary": "<p>Luxonis said it plans to scale production of its OAK camera and refine its platform to support robotics and industrial automation. <\/p>\n<p>The post <a href=\"https://www.therobotreport.com/luxonis-closes-series-a-round-to-scale-physical-ai-perception-layer/\">Luxonis closes Series A round to scale physical AI perception layer<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Automate 2026 show recap", "source": "Robotics Business Review", "date": "2026-07-02", "url": "https://www.therobotreport.com/automate-2026-show-recap/", "summary": "<p>Editors Steve Crowe, Mike Oitzman, and Sarah Wynn review Automate 2026, analyzing key trends in physical AI, humanoids, and software orchestration.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/automate-2026-show-recap/\">Automate 2026 show recap<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Apptronik unveils Apollo 2 and a flagship data collection and training facility", "source": "Robotics Business Review", "date": "2026-07-01", "url": "https://www.therobotreport.com/apptronik-unveils-apollo-2-flagship-data-collection-training-facility/", "summary": "<p>Built as a data collection and training platform, Apollo 2 enables continuous learning through deployment, Apptronik said.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/apptronik-unveils-apollo-2-flagship-data-collection-training-facility/\">Apptronik unveils Apollo 2 and a flagship data collection and training facility<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Top 10 robotics developments of June 2026", "source": "Robotics Business Review", "date": "2026-07-01", "url": "https://www.therobotreport.com/top-10-robotic-stories-june-2026/", "summary": "<p>Humanoid robots made many headlines in June 2026, whether it be for companies going public, new deployments, or hitting production milestones.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/top-10-robotic-stories-june-2026/\">Top 10 robotics developments of June 2026<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "In Robotics, Ruggedization Is No Longer Optional", "source": "Robotics Business Review", "date": "2026-07-01", "url": "https://www.therobotreport.com/in-robotics-ruggedization-is-no-longer-optional/", "summary": "<p>As autonomy moves beyond controlled environments, ruggedized design is becoming a prerequisite for reliable robotic operations.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/in-robotics-ruggedization-is-no-longer-optional/\">In Robotics, Ruggedization Is No Longer Optional<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Sonair ADAR One 3D ultrasonic sensor is now safety-certified", "source": "Robotics Business Review", "date": "2026-06-30", "url": "https://www.therobotreport.com/sonair-3d-ultrasonic-sensor-is-now-safety-certified/", "summary": "<p>Sonair says ADAR One was assessed as a human detection sensor according to the IEC 61496 standard for electrosensitive protection devices.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/sonair-3d-ultrasonic-sensor-is-now-safety-certified/\">Sonair ADAR One 3D ultrasonic sensor is now safety-certified<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Queue raises funding to build fully autonomous pharmacy", "source": "Robotics Business Review", "date": "2026-06-30", "url": "https://www.therobotreport.com/queue-raises-funding-fully-autonomous-pharmacy/", "summary": "<p>Queue is developing automated pharmacies to expand access to prescriptions in hospitals, retail sites, and underserved communities.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/queue-raises-funding-fully-autonomous-pharmacy/\">Queue raises funding to build fully autonomous pharmacy<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}], "embeddedNews": [{"title": "The Seven Sensors and Breakout Boards to Avoid in a Product", "source": "Hackaday", "date": "2026-08-02", "url": "https://hackaday.com/2026/08/02/the-seven-sensors-and-breakout-boards-to-avoid-in-a-product/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"314\" src=\"https://hackaday.com/wp-content/uploads/2026/07/cadmium_sulfide_photoresistors_john_teel_youtube.jpg?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>We&#8217;ve all seen these sensors and modules kicking around, as part of beginner kits, strapped into prototypes and potentially even in products deployed in the field. Yet as [John Teel] <a class=\"read-more\" href=\"https://hackaday.com/2026/08/02/the-seven-sensors-and-breakout-boards-to-avoid-in-a-product/\">&#8230;read more<\/a>"}, {"title": "UV Printer? 3D Printer? HeyGears says “Why Not Both”?", "source": "Hackaday", "date": "2026-08-02", "url": "https://hackaday.com/2026/08/01/uv-printer-3d-printer-heygears-says-why-not-both/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"450\" src=\"https://hackaday.com/wp-content/uploads/2026/07/HeyGears-feat.avif?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>There&#8217;s a new contender in the prosumer UV printer world up on Kickstarter, the HeyGears G1. This one&#8217;s particularly interesting as they&#8217;re explicitly marketing it as being able to produce <a class=\"read-more\" href=\"https://hackaday.com/2026/08/01/uv-printer-3d-printer-heygears-says-why-not-both/\">&#8230;read more<\/a>"}, {"title": "Bike Trainers as Video Game Controllers", "source": "Hackaday", "date": "2026-08-02", "url": "https://hackaday.com/2026/08/01/bike-trainers-as-video-game-controllers/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"450\" src=\"https://hackaday.com/wp-content/uploads/2026/07/bike-controller-main.jpg?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>While we&#8217;ve largely settled on analog sticks and digital buttons for controlling video games, there&#8217;s all sorts of projects to create truly esoteric controllers that allow playing games in unique <a class=\"read-more\" href=\"https://hackaday.com/2026/08/01/bike-trainers-as-video-game-controllers/\">&#8230;read more<\/a>"}, {"title": "Play games with your brain signals using Octopus 16 wireless EEG device", "source": "CNX Software", "date": "2026-08-02", "url": "https://www.cnx-software.com/2026/08/02/play-games-with-your-brain-signals-using-octopus-16-wireless-eeg-device/", "summary": "<div><img alt=\"Octopus 16 biosignal device for gaming\" class=\"attachment-medium size-medium wp-post-image\" height=\"388\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/08/Octopus-16-biosignal-device-for-gaming-720x388.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Octopus 16 is a wireless biosignal HID device for the XIAO ESP32-S3 board designed to let users play computer games using brain signals (EEG) with no hands (or implants) needed. The board packs 16 electrodes to measure biosignals, including EEG (electroencephalography), EMG (electromyography), and ECG (electrocardiography), and the coin-sized device is much more compact than other brain-computer interface (BCI) solutions, which typically require a cap kit with 8 to 16 electrodes and wires. Octopus 16 specifications: ADC &#8211; 2x Texas Instruments ADS131M08 24-bit, 8-channel, simultaneous-sampling, delta-sigma (ΔΣ) analog-to-digital converters Channels &#8211; 16x 24-bit channels (8x per ADC) Programmable gain (PGA) &#8211; x1 to x128 (set in firmware; default gain register 0x2222) Input high-pass / DC block &#8211; Integrated ADC DC-block filter enabled (≈ &#62;1 Hz) Host interface (to XIAO board) &#8211; Power + SPI via 2x 7-pin Brain interface 18x spring-loaded pogo pins 16x electrodes 1x  reference (AINREF) 1x Ground [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/08/02/play-games-with-your-brain-signals-using-octopus-16-wireless-eeg-device/\">Play games with your brain signals using Octopus 16 wireless EEG device<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Stewart Platform Walker Gains Feeling In Legs From Resistors", "source": "Hackaday", "date": "2026-08-01", "url": "https://hackaday.com/2026/08/01/stewart-platform-walker-gains-feeling-in-legs-from-resistors/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"450\" src=\"https://hackaday.com/wp-content/uploads/2026/07/stewart-robot.jpg?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>Stewy is a very interesting robot, with some slightly odd kinematics. Its head is a Stewart platform, which is a common-enough 6-DOF actuated plate normally used with a fixed base. <a class=\"read-more\" href=\"https://hackaday.com/2026/08/01/stewart-platform-walker-gains-feeling-in-legs-from-resistors/\">&#8230;read more<\/a>"}, {"title": "Open Source Stream Deck Targets Flexibility", "source": "Hackaday", "date": "2026-08-01", "url": "https://hackaday.com/2026/08/01/open-source-stream-deck-targets-flexibility/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"450\" src=\"https://hackaday.com/wp-content/uploads/2026/07/crowpanel-10.1-deck-e1785408623931.webp?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>Stream decks are very useful when you&#8217;re live on camera and you need to hit some complicated macro at a glance. However, there is sometimes a perception that commercial options <a class=\"read-more\" href=\"https://hackaday.com/2026/08/01/open-source-stream-deck-targets-flexibility/\">&#8230;read more<\/a>"}, {"title": "Browser-based 3D Editor Covers The Basics While Staying Local", "source": "Hackaday", "date": "2026-08-01", "url": "https://hackaday.com/2026/08/01/browser-based-3d-editor-covers-the-basics-while-staying-local/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"450\" src=\"https://hackaday.com/wp-content/uploads/2026/07/Sketchforge-banner.png?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>Got an idea and want to make a simple 3D model, but don&#8217;t want to install a full-fledged CAD modeling suite and queue up a few hours of tutorial videos? <a class=\"read-more\" href=\"https://hackaday.com/2026/08/01/browser-based-3d-editor-covers-the-basics-while-staying-local/\">&#8230;read more<\/a>"}, {"title": "Commercialization and Innovation", "source": "Hackaday", "date": "2026-08-01", "url": "https://hackaday.com/2026/08/01/commercialization-and-innovation/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"484\" src=\"https://hackaday.com/wp-content/uploads/2018/05/printering.jpg?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>The last year or two has seen relatively affordable multi-material printers hit the market, and the question that [Tom Nardi] and I were kicking around when he was writing up <a class=\"read-more\" href=\"https://hackaday.com/2026/08/01/commercialization-and-innovation/\">&#8230;read more<\/a>"}, {"title": "Creality Falcon T1 review – A 5-in-1 modular laser engraver tested with 20W fiber and 40W diode laser modules", "source": "CNX Software", "date": "2026-08-01", "url": "https://www.cnx-software.com/2026/08/01/creality-falcon-t1-review-a-5-in-1-modular-laser-engraver-tested-with-20w-fiber-and-40w-diode-laser-modules/", "summary": "<div><img alt=\"Creality Falcon T1 5-in-1 Laser Engraver review\" class=\"attachment-medium size-medium wp-post-image\" height=\"480\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/08/Creality-Falcon-T1-5-in-1-Laser-Engraver-review-720x480.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Creality sent us a sample of the Falcon T1 5-in-1 modular laser engraver for review. The company describes it as the world’s first 5-in-1 laser engraving and cutting machine that supports five types of laser modules in a single unit: 20W diode laser 20W, 40W diode laser, 20w fiber laser, 60W MOPA laser, and 5W UV Laser 5W. The laser heads can be swapped tool-free in just 15 seconds. It works with an HD camera and AI system and can engrave and cut a wide range of materials including wood, leather, acrylic, metal, glass, crystal, and plastic. Diode laser modules are ideal for cutting and engraving wood, leather, and acrylic, the fiber laser module is better suited for marking and engraving metal, the MOPA laser module supports color marking on metals such as stainless steel and titanium, and the UV laser module uses cold processing for high-precision work on glass, [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/08/01/creality-falcon-t1-review-a-5-in-1-modular-laser-engraver-tested-with-20w-fiber-and-40w-diode-laser-modules/\">Creality Falcon T1 review &#8211; A 5-in-1 modular laser engraver tested with 20W fiber and 40W diode laser modules<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Star Wars™: The Experience at The Franklin Institute Philadelphia", "source": "Adafruit", "date": "2026-08-01", "url": "https://blog.adafruit.com/2026/08/01/star-wars-the-experience-at-the-franklin-institute-philadelphia/", "summary": "Star Wars™: The Experience &#8211; A Journey Through the Galaxy will be making its exclusive world premiere at The Franklin Institute in Philadelphia in February 2027. The exhibition will feature immersive environments, props, and original costumes. The all-new exhibition traces the legacy of Star Wars from its handcrafted beginnings to today&#8217;s groundbreaking digital frontiers, exploring [&#8230;]"}, {"title": "That Project: A Standalone Rubik’s Cube Solver", "source": "Adafruit", "date": "2026-08-01", "url": "https://blog.adafruit.com/2026/08/01/that-project-a-standalone-rubiks-cube-solver/", "summary": "That Project made a screenless, standalone ESP32-S3 Rubik&#8217;s cube solver and shared the project on YouTube: This is a fully handheld, offline Rubik&#8217;s Cube solver powered by an ESP32-S3. It scans the cube using a built-in camera, detects colors with OpenCV, allows manual touch correction via an LVGL UI, and guides you through the solution [&#8230;]"}, {"title": "August is Back to School Month!! #BackToSchool #BackToSchool2026", "source": "Adafruit", "date": "2026-08-01", "url": "https://blog.adafruit.com/2026/08/01/august-is-back-to-school-month-backtoschool-backtoschool2026/", "summary": "Don&#8217;t get fooled by the pleasant weather, more heat and rain are on the way. It won&#8217;t be long, though, before false fall to come knocking, bringing shorter days and&#8230;a new school year approaching! August is Back to School Month so join us and get prepared for another scholastic voyage into the school year. We [&#8230;]"}, {"title": "NanoPi R28S – A tiny dual GbE Rockchip RK3528A wireless SBC and router with a USB-C console port", "source": "CNX Software", "date": "2026-07-31", "url": "https://www.cnx-software.com/2026/07/31/nanopi-r28s-a-tiny-dual-gbe-rockchip-rk3528a-wireless-sbc-and-router-with-a-usb-c-console-port/", "summary": "<div><img alt=\"NanoPi R28S Dual GbE router USB C Debug port\" class=\"attachment-medium size-medium wp-post-image\" height=\"443\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/07/NanoPi-R28S-Dual-GbE-router-USB-C-Debug-port-720x443.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>NanoPi R28S is yet another tiny dual Gigabit Ethernet single board computer or router (with a metal enclosure), and the second from FriendlyELEC to implement a USB-C console port, often requested by our readers, after the NanoPi R2S Plus launched in 2024. At just 49.5 x 49.5 x 24 mm in its metal case, the Rockchip RK3528A-powered router also features 1GB LPDDR4, a microSD card slot and an eMMC module socket for storage, WiFi 6 and Bluetooth 5.3 wireless connectivity. The USB-C ports are only used for power, eMMC firmware upgrades, and debugging, and the system doesn&#8217;t feature any USB port for data connectivity, nor any GPIO header for expansion. In other words, it&#8217;s mostly useful for networking (firewalls, soft routers), as well as IoT gateway applications. NanoPi R28S specifications: SoC – Rockchip RK3528A CPU – Quad-core ARM Cortex-A53 @ 1.8 GHz GPU – Arm Mali-450 GPU with support for [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/07/31/nanopi-r28s-a-tiny-dual-gbe-rockchip-rk3528a-wireless-sbc-and-router-with-a-usb-c-console-port/\">NanoPi R28S &#8211; A tiny dual GbE Rockchip RK3528A wireless SBC and router with a USB-C console port<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "reTerminal Sticky 3.97-inch touch ePaper display is supported by four open-source firmware projects (so far)", "source": "CNX Software", "date": "2026-07-31", "url": "https://www.cnx-software.com/2026/07/31/reterminal-sticky-3-97-inch-magnetic-touch-epaper-display-is-supported-by-four-open-source-firmware-projects/", "summary": "<div><img alt=\"reTerminal Sticky\" class=\"attachment-medium size-medium wp-post-image\" height=\"408\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/07/reTerminal-Sticky-720x408.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Seeed Studio&#8217;s reTerminal Sticky is a 3.97-inch &#8220;AI-powered&#8221; magnetic touch ePaper display powered by an ESP32-S3 microcontroller, which serves as a sticky-note alternative, an e-reader, a live dashboard, or a home automation controller. The 800 x 480 resolution display comes with 8MB PSRAM, 32MB Flash, a microSD card slot, and next/previous page buttons. It&#8217;s &#8220;AI-powered&#8221; through a microphone and an AI Voice button leveraging the ESP32-S3 Edge AI capabilities for a voice-to-note feature. It also features a temperature and humidity sensor and a 3-axis accelerometer, as well as a built-in magnet and a magnetic ring for easy mounting. reTerminal Sticky specifications: SoC &#8211; Espressif ESP32-S3R8 CPU – Dual-core Tensilica LX7 microcontroller up to 240 MHz with vector instructions for AI acceleration Memory – 8MB PSRAM Wireless – 2.4 GHz WiFi 4 and Bluetooth 5.0 LE Storage 32 MB flash MicroSD card slot (SanDisk recommended) Display 3.97-inch monochrome (B&#38;W) ePaper 4-level [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/07/31/reterminal-sticky-3-97-inch-magnetic-touch-epaper-display-is-supported-by-four-open-source-firmware-projects/\">reTerminal Sticky 3.97-inch touch ePaper display is supported by four open-source firmware projects (so far)<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Maker Go ESP32-C5-EVB board features RS-485 interface, four relays, four opto-isolated inputs", "source": "CNX Software", "date": "2026-07-31", "url": "https://www.cnx-software.com/2026/07/31/maker-go-esp32-c5-evb-board-features-rs-485-interface-four-relays-four-opto-isolated-inputs/", "summary": "<div><img alt=\"MakerGo ESP32-C5-EVB\" class=\"attachment-medium size-medium wp-post-image\" height=\"574\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/07/MakerGo-ESP32-C5-EVB-720x574.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Maker Go ESP32-C5-EVB is an ESP32-C5 board with four relays, four opto-isolated inputs, RS-485 communication, and support for Wi-Fi 6, Bluetooth Low Energy 5.0, and Thread/Zigbee connectivity. It&#8217;s a variant of the Maker Go ESP32-C6-EVB released in 2024 that replaces the ESP32-C6 module with an ESP32-C5 module and a GPIO header with a terminal block for RS-485. The Maker Go ESP32-C6-EVB was mostly a clone of the Olimex ESP32-C6-EVB, and while Olimex already released its own ESP32-C5-EVB, it has a different dual-channel relay design. Maker Go ESP32-C5-EVB specifications: Wireless module – DOIT ESPC5-32 module SoC – Espressif Systems ESP32-C5 CPU Single-core 32-bit RISC-V processor @ up to 240 MHz Low-power RISC-V core @ 40 MHz acting as the main processor for power-sensitive applications Memory – 384 KB SRAM on-chip, support for external PSRAM Storage – 320 KB ROM, support for external flash Connectivity Dual-band 802.11ax WiFi 6 in the 2.4GHz [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/07/31/maker-go-esp32-c5-evb-board-features-rs-485-interface-four-relays-four-opto-isolated-inputs/\">Maker Go ESP32-C5-EVB board features RS-485 interface, four relays, four opto-isolated inputs<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Fault-Tolerant Quantum Computers, Sustained Performance Defines the Next Phase of Edge AI, Agentic AI for EDA: Embedded Week Insights", "source": "Embedded.com", "date": "2026-07-31", "url": "https://www.embedded.com/fault-tolerant-quantum-computers-sustained-performance-defines-the-next-phase-of-edge-ai-agentic-ai-for-eda-embedded-week-insights/", "summary": "<p>Here's a roundup of this week's must-read articles. We'll look into the latest developments on fault-tolerant quantum computers, why sustained performance will define the next phase of edge AI, and a partnership on agentic AI for EDA to automate complex engineering tasks. Also, check News Archives - Embedded and Technical Articles Archives - Embedded for the complete list of [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/fault-tolerant-quantum-computers-sustained-performance-defines-the-next-phase-of-edge-ai-agentic-ai-for-eda-embedded-week-insights/\">Fault-Tolerant Quantum Computers, Sustained Performance Defines the Next Phase of Edge AI, Agentic AI for EDA: Embedded Week Insights<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "Mikroe Integrates Swift Navigation Skylark with GNSS 19 Click", "source": "Embedded.com", "date": "2026-07-31", "url": "https://www.embedded.com/mikroe-integrates-swift-navigation-skylark-with-gnss-19-click/", "summary": "<p>Mikroe has partnered with Swift Navigation to integrate the Skylark Precise Positioning Service into its GNSS 19 Click development board, providing users with a free six-month license to the cloud-based correction service. The collaboration is intended to simplify access to high-accuracy global navigation satellite system (GNSS) positioning for developers working on industrial, automotive, and IoT [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/mikroe-integrates-swift-navigation-skylark-with-gnss-19-click/\">Mikroe Integrates Swift Navigation Skylark with GNSS 19 Click<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "Installing Docker on the Raspberry Pi", "source": "Adafruit", "date": "2026-07-31", "url": "https://blog.adafruit.com/2026/07/31/installing-docker-on-the-raspberry-pi/", "summary": "PiMyLifeUp shares how to install Docker on your Raspberry Pi. Docker is an incredibly powerful tool that provides OS-level virtualization to deliver software packages within containers. Being in a container means the software cannot access anything that the Docker runtime doesn’t hand to it; this can help with security and resource management. Docker allows you [&#8230;]"}, {"title": "Subscribe to the Adafruit Youtube channel! #Youtube #AdafruitLearnSystem", "source": "Adafruit", "date": "2026-07-31", "url": "https://blog.adafruit.com/2026/07/31/subscribe-to-the-adafruit-youtube-channel-youtube-adafruitlearnsystem-226-4/", "summary": "﻿ ﻿ Are you subscribed to the Adafruit Youtube channel? If you&#8217;re not already subscribed, click here! http://adafru.it/subscribe . It’s a free and easy way to keep up with our newest episodes. Here’s some of what we’re up to. Electronics Show and Tell Wednesdays 7:30pm Electronics show and tell every Wednesday at 7:30pm ET. Adafruit [&#8230;]"}, {"title": "System Administrator Appreciation Day July 31, 2026 – 27th Annual #SysAdminDay", "source": "Adafruit", "date": "2026-07-31", "url": "https://blog.adafruit.com/2026/07/31/system-administrator-appreciation-day-july-31-2026-27th-annual-sysadminday/", "summary": "Today is the 27th annual System Administrator Appreciation Day. So give a little thanks to the folks keeping things running. Your network is secure, your computer is up and running, and your printer is jam-free. Why? Because you’ve got an awesome sysadmin (or maybe a whole IT department) keeping your business up and running. So [&#8230;]"}, {"title": "What to Make with Adafruit Fruit Jam Mini-Computer Kit", "source": "Adafruit", "date": "2026-07-31", "url": "https://blog.adafruit.com/2026/07/31/what-to-make-with-adafruit-fruit-jam-mini-computer-kit/", "summary": "&#160; Our Fruit Jam Mini-Computer Kit takes its inspiration from the self-contained electronic wonderland of our childhood computers that we could plug directly into a TV then blaze our eyes with 8-bit of glory. See what you can do with our Fruit Jam and our Mini-Computer Kit in the Adafruit Learning System. We suggest starting [&#8230;]"}, {"title": "The world’s first hands-free touchpad", "source": "Adafruit", "date": "2026-07-31", "url": "https://blog.adafruit.com/2026/07/31/the-worlds-first-hands-free-touchpad/", "summary": "MouthPad is a custom-fit mouthpiece that turns subtle tongue and head movements into precise control of your phone, tablet, and computer. MouthPad translates small, natural movements into cursor control, clicks, scrolling, and dragging. No hands. No wires. Worn discreetly inside your mouth. Move the cursor with your tongue or head. Tap, swipe, sip, and hold to [&#8230;]"}, {"title": "The Python on Microcontrollers Newsletter: subscribe for free", "source": "Adafruit", "date": "2026-07-31", "url": "https://blog.adafruit.com/2026/07/31/the-python-on-microcontrollers-newsletter-subscribe-for-free-7-31-2/", "summary": "The Python for Microcontrollers Newsletter is the place for the latest news involving Python on hardware (microcontrollers AND single board computers like Raspberry Pi). This ad-free, spam-free weekly email is filled with CircuitPython, MicroPython, and Python information that you may have missed, all in one place! You get a summary of all the software, events, projects, and the latest hardware worldwide once a week, no [&#8230;]"}, {"title": "Raspberry Pi 5 Case for Pimoroni NVMe Base #3DThursday #3DPrinting", "source": "Adafruit", "date": "2026-07-31", "url": "https://blog.adafruit.com/2026/07/30/raspberry-pi-5-case-for-pimoroni-nvme-base-3dthursday-3dprinting/", "summary": "tdack. shares: A dedicated case for the Raspberry Pi 5 with a Pimoroni NVMe base fitted. Uses the silicon dots from the Pimoroni parts package stuck to the bottom of the NVMe base as standoffs. Clean, purpose-built for one of the most popular NVMe expansion options for the Pi 5 download the files on: https://makerworld.com/en/models/170315 [&#8230;]"}, {"title": "Innodisk Introduces DDR5 12800 MT/s MRDIMM for AI and High-Performance Computing", "source": "EE Journal", "date": "2026-07-31", "url": "https://www.eejournal.com/industry_news/innodisk-introduces-ddr5-12800-mt-s-mrdimm-for-ai-and-high-performance-computing/", "summary": "Innodisk, a leading global AI solution provider, introduces the DDR5 12800 MT/s MRDIMM to support the rapid growth of generative AI, large language models (LLMs), and robotics applications. With an industry leading data rate of 12800 MT/s, this advanced memory module delivers exceptional bandwidth efficiency and scalability to meet the growing processing demands of AI-driven &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/innodisk-introduces-ddr5-12800-mt-s-mrdimm-for-ai-and-high-performance-computing/\">Read More &#8594;<span class=\"screen-reader-text\"> \"Innodisk Introduces DDR5 12800 MT/s MRDIMM for AI and High-Performance Computing\"<\/span><\/a>"}, {"title": "New small DP12IP series current transducer from Danisense delivers ppm-class precision", "source": "EE Journal", "date": "2026-07-31", "url": "https://www.eejournal.com/industry_news/new-small-dp12ip-series-current-transducer-from-danisense-delivers-ppm-class-precision/", "summary": "Key points: DP12IP series current transducer from Danisense delivers ppm-class precisionwith maximum linearity error of just 10 ppm Compact PCB-mount package featuring a form factor of only 32mm and weighing only 250g Supports current measurement up to 18A and accommodates measurement resistors up to 100 Ω at full scale Danisense, the leader in high-accuracy current sense &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/new-small-dp12ip-series-current-transducer-from-danisense-delivers-ppm-class-precision/\">Read More &#8594;<span class=\"screen-reader-text\"> \"New small DP12IP series current transducer from Danisense delivers ppm-class precision\"<\/span><\/a>"}, {"title": "New UFS 5.0 Embedded Flash Memory Devices from KIOXIA Enable On-Device AI", "source": "EE Journal", "date": "2026-07-31", "url": "https://www.eejournal.com/industry_news/new-ufs-5-0-embedded-flash-memory-devices-from-kioxia-enable-on-device-ai/", "summary": "KIOXIA Europe GmbH today announced its UFS(1) 5.0 embedded flash memory solutions, designed to deliver the performance, efficiency and capacity required for the next generation of AI-enabled mobile and edge devices. The new solutions will be demonstrated next week at FMS: the Future of Memory and Storage and are now available as commercial samples in 1 TB and 512 &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/new-ufs-5-0-embedded-flash-memory-devices-from-kioxia-enable-on-device-ai/\">Read More &#8594;<span class=\"screen-reader-text\"> \"New UFS 5.0 Embedded Flash Memory Devices from KIOXIA Enable On-Device AI\"<\/span><\/a>"}, {"title": "IDS expands its range of rugged industrial cameras with Sony STARVIS 2 sensors", "source": "EE Journal", "date": "2026-07-31", "url": "https://www.eejournal.com/industry_news/ids-expands-its-range-of-rugged-industrial-cameras-with-sony-starvis-2-sensors/", "summary": "When production systems are cleaned using high-pressure jets, operate in dusty environments or are exposed to sub-zero temperatures, particularly robust machine vision solutions are required. The uEye FA series from IDS Imaging Development Systems GmbH has been specifically designed for such demanding environments, featuring IP69K protection. Starting in late July, the range will expand to &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/ids-expands-its-range-of-rugged-industrial-cameras-with-sony-starvis-2-sensors/\">Read More &#8594;<span class=\"screen-reader-text\"> \"IDS expands its range of rugged industrial cameras with Sony STARVIS 2 sensors\"<\/span><\/a>"}, {"title": "Math-First AI: How Kodamai Embeds Verification and Trust", "source": "EE Journal", "date": "2026-07-31", "url": "https://www.eejournal.com/fish_fry/math-first-ai-how-kodamai-embeds-verification-and-trust/", "summary": "<img alt=\"\" class=\"webfeedsFeaturedVisual wp-post-image\" height=\"300\" src=\"https://www.eejournal.com/wp-content/uploads/2026/07/ChatGPT-Image-Jul-28-2026-01_41_46-PM-300x300.png\" style=\"display: block; margin-bottom: 5px; clear: both;\" width=\"300\" />My podcast guest this week is Dr. Maha Achour, CEO and Founder of Kodamai. Maha and I chat about the shifting landscape of AI and how we can move beyond cloud and centralized data centers to a more distributed, agentic future. We discuss why governance must &#8216;travel&#8217; with AI agents, what it means for trust &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/fish_fry/math-first-ai-how-kodamai-embeds-verification-and-trust/\">Read More &#8594;<span class=\"screen-reader-text\"> \"Math-First AI: How Kodamai Embeds Verification and Trust\"<\/span><\/a>"}, {"title": "ESP-KVM – An open-source IP KVM solution based on ESP32-P4 RISC-V MCU", "source": "CNX Software", "date": "2026-07-30", "url": "https://www.cnx-software.com/2026/07/30/esp-kvm-an-open-source-ip-kvm-solution-based-on-esp32-p4-risc-v-mcu/", "summary": "<div><img alt=\"ESP-KVM ESP32-P4 IP KVM\" class=\"attachment-medium size-medium wp-post-image\" height=\"416\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/07/ESP-KVM-ESP32-P4-IP-KVM-720x416.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Earlier this month, the P4 KVM project was brought to my attention. It provides IP KVM functionality to a Waveshare ESP32-P4-WIFI6-POE-ETH board when paired with a Toshiba TC358743 HDMI-to-CSI adapter. However, it doesn&#8217;t work with the new ESP32-P4 V3.x variants featuring a proper H.264 video encoding implementation, and the developer (Jonathan Rowny) says it&#8217;s just a proof-of-concept with many bugs and no security, so I decided to skip it. The good news is that he also encouraged others to fork the project, and Evgenij Spitsyn did just that with the release of the ESP-KVM project, which supports both MJPEG and H.264 encoding and a range of other features. ESP-KVM highlights: Video capture, resolution changes, and MJPEG or H.264 encoding Keyboard, absolute and relative pointer, media keys, copy/paste Touch mode for phones and tablets (trackpad, on-screen keyboard) Multiple viewers, one in control at a time with takeover HTTPS, login, physical password [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/07/30/esp-kvm-an-open-source-ip-kvm-solution-based-on-esp32-p4-risc-v-mcu/\">ESP-KVM &#8211; An open-source IP KVM solution based on ESP32-P4 RISC-V MCU<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "NightRun UEFI application boots a local LLM on Raspberry Pi 5 and x86 PCs without an OS", "source": "CNX Software", "date": "2026-07-30", "url": "https://www.cnx-software.com/2026/07/30/nightrun-uefi-application-boots-a-local-llm-on-raspberry-pi-5-and-x86-pcs-without-an-os/", "summary": "<div><img alt=\"NightRun runs LLMs without OS\" class=\"attachment-medium size-medium wp-post-image\" height=\"480\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/07/NightRun-runs-LLMs-without-OS-720x480.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Running LLMs locally on an SBC or mini PC is a good way to keep your data private, but they typically require a conventional operating system, which uses a good portion of system memory. NightRun is an experimental open-source project that addresses this issue by booting a machine directly into a local LLM from a USB drive or microSD card, without loading a conventional OS. By removing the operating system, NightRun makes more RAM and memory bandwidth available for AI inference. The runtime is written in Rust, and during boot it loads a quantized model (1.3 GB to 2.4 GB) directly into RAM while verifying its CRC-32 checksums. After the model is loaded, storage is &#8220;sealed,&#8221; meaning any later attempt to read from the disk will trigger a hard fault. NightRun key features: Hardware support &#8211; Supports 64-bit x86_64 UEFI PCs (Secure Boot disabled) and Raspberry Pi 5 via USB [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/07/30/nightrun-uefi-application-boots-a-local-llm-on-raspberry-pi-5-and-x86-pcs-without-an-os/\">NightRun UEFI application boots a local LLM on Raspberry Pi 5 and x86 PCs without an OS<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Luxonis M8 Controller Box adds industrial I/Os, CAN Bus, and relay control to OAK4 AI vision cameras", "source": "CNX Software", "date": "2026-07-30", "url": "https://www.cnx-software.com/2026/07/30/luxonis-m8-controller-box-adds-industrial-i-os-can-bus-and-relay-control-to-oak4-ai-vision-cameras/", "summary": "<div><img alt=\"OAK4 AI camera M8 Controller Box\" class=\"attachment-medium size-medium wp-post-image\" height=\"589\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/07/OAK4-AI-camera-M8-Controller-Box-720x589.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Luxonis has introduced a prototype of the M8 Controller Box, an industrial I/O expansion module for OAK4 AI vis
