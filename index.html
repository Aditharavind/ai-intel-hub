e shift is still early, but companies including Hugging Face, Nvidia, and Alibaba have all made significant bets on open-source robotics in the last two years, releasing tools and models aimed at the higher-level work of getting robots to reason, decide, and act. <\/p><p><span>The open source movement that accelerated other AI applications is now being applied to the problem of making robots smarter. <\/span> If these attempts to bring AI to robotics with open-source platforms succeed, the barrier to building a capable robot could fall as fast as the barrier to building an AI application did.<\/p><h2>The world ROS built<\/h2><p>Open-source robotics software has been around since the mid-1990s, with early projects like Carnegie Mellon University’s <a href=\"https://www.ri.cmu.edu/project/inter-process-communication-package/\" target=\"_blank\">Inter-Process Communication package<\/a> and the <a href=\"https://playerstage.sourceforge.net/\" target=\"_blank\">Player Project<\/a> in the early 2000s laying the groundwork. But these were often tied to specific research groups, and the field remained fragmented. <\/p><p>The Robot Operating System, ROS, <a href=\"https://spectrum.ieee.org/the-origin-story-of-ros-the-linux-of-robotics\" target=\"_self\">changed that when it made its debut<\/a> in 2007. By bundling tools and attracting more users, it became the de facto standard. The story of open-source robotics, in many ways, starts there. <\/p><p>Despite its name, ROS is not actually an operating system. Rather, it is a software framework that sits on top of Linux and handles robotic fundamentals like moving data between components, talking to hardware, building maps, planning paths, and supporting developer tools, such as data logging and visualization. Before ROS, every robotics team wrote that infrastructure themselves. It often took a year or two before a lab could get to the research it actually cared about. <\/p><p><a href=\"https://brian.gerkey.org/\" rel=\"noopener noreferrer\" target=\"_blank\">Brian Gerkey<\/a>, who helped build ROS in the mid-2000s, says he was drawn to the project because of how much open source had already changed the world, pointing out that nearly the entire internet <a href=\"https://www.hbs.edu/ris/Publication%20Files/24-038_51f8444f-502c-4139-8bf2-56eb4b65c58a.pdf\" rel=\"noopener noreferrer\" target=\"_blank\">is built on it<\/a>. <\/p><p>“I’m a tool builder, and I like to share everything as openly as I possibly can, because I think that’s where we get the most impact out of what we build,” says Gerkey, board chair of Open Robotics and now CTO at <a href=\"https://www.intrinsic.ai/\" rel=\"noopener noreferrer\" target=\"_blank\">Intrinsic<\/a>, a robotics and AI unit of Google.<\/p><p>As it was developing, the AI community largely took the same approach, sharing research, models, and data openly, and the field accelerated faster than almost anyone predicted. Now some of those same advancements are arriving in robotics.<\/p><h2>Open-source AI for robotics<\/h2><p>Computer vision, once a hard problem, has advanced dramatically in just a few years, says <a href=\"https://www.linkedin.com/in/spencermhuang/\" rel=\"noopener noreferrer\" target=\"_blank\">Spencer Huang<\/a>, Nvidia’s director of product for robotics. What once required significant expertise can now be done in a few lines of code. Simulation tools have become accurate enough to be useful for training, and access to the tooling that once required a specialized lab is now widely available, much of it open source.<\/p><p>“To get into robotics, you no longer need a Ph.D.,” he says. The result is a much larger pool of people who can contribute, and the field is starting to look less like a specialized discipline and more like a platform that anyone can build on.<\/p><p>Nvidia has built out an open-source robotics stack that covers the full development pipeline. Its <a href=\"https://www.nvidia.com/en-us/ai/cosmos/\" rel=\"noopener noreferrer\" target=\"_blank\">Cosmos world models<\/a> generate synthetic training data and simulate physical environments. Its <a href=\"https://huggingface.co/blog/nvidia/gr00t-n1-7\" rel=\"noopener noreferrer\" target=\"_blank\">GR00T models<\/a> give robots the ability to reason through and execute complex tasks. And its <a href=\"https://developer.nvidia.com/isaac\" rel=\"noopener noreferrer\" target=\"_blank\">Isaac frameworks<\/a> handle the orchestration that ties training, simulation, and deployment together. Not everyone needs to train the robots from scratch, Huang says, and most people probably shouldn’t.<\/p><p>“If you gate pre-training, the field just never grows,” he says. “We should be able to provide a high-quality, state-of-the-art pre-trained model that anyone can go and take and fine tune for their own purposes.”<\/p><p>All of Nvidia’s open-source models live on Hugging Face, the open-source AI platform that has become the default place to share models and datasets. <a href=\"https://huggingface.co/lerobot\" rel=\"noopener noreferrer\" target=\"_blank\">Hugging Face launched LeRobot<\/a>, a community platform for robotics AI, in May 2024. Since its launch, the number of robotics datasets on the platform grew from 1,145 at the end of 2024 to more than 58,000 today, making it the single largest dataset category on the hub.<\/p><p>Hugging Face has also moved into hardware, acquiring robotics company <a href=\"https://www.pollen-robotics.com/\" rel=\"noopener noreferrer\" target=\"_blank\">Pollen Robotics<\/a>. The acquisition came from a realization that software alone was not enough, according to <a href=\"https://www.linkedin.com/in/clementdelangue/\" rel=\"noopener noreferrer\" target=\"_blank\">Clement Delangue<\/a>, Hugging Face’s CEO. The goal, as with the software, was to bring more people in.<\/p><p>The contributors to LeRobot include the biggest names in the industry, academic labs, and hobbyists building robots in their spare time. For instance, earlier this year, Alibaba <a href=\"https://arxiv.org/abs/2602.14979v1\" rel=\"noopener noreferrer\" target=\"_blank\">released RynnBrain<\/a>, an open-source foundation model for physical AI that the company claims outperforms comparable offerings from Google and Nvidia on benchmarks. That diversity of projects, Delangue says, is important. <\/p><p>“It is not just one model or one dataset or one hardware,” he says. “It is a lot of small contributions that everyone can be part of.”<\/p><h2>Commercial incentives muddle the field<\/h2><p>The stakes, Delangue says, go beyond convenience. A world where only a few proprietary systems control the robots in people’s homes is a concerning one. “Having robots at home that you don’t really understand, that you don’t really control, that a few people in Silicon Valley control is a scary thought,” he says. “Open source gives an alternative path.”<\/p><p>But getting there is not straightforward. The open sourcing happening now looks different from what produced ROS, which emerged largely from academics pooling their work with no commercial stake in the outcome. The biggest contributors today are companies with clear business reasons to want more people building on their platforms. That’s not necessarily a bad thing, says <a href=\"https://engineering.oregonstate.edu/people/bill-smart\" rel=\"noopener noreferrer\" target=\"_blank\">Bill Smart<\/a>, a professor at Oregon State University, in Corvallis, who was part of the early open-source robotics community. But the incentives are worth being aware of.<\/p><p>He also worries that the lowered barrier to entry has a downside. Researchers coming from AI without a robotics background are sometimes solving problems the field already solved. A newcomer might spend a week training a neural network to move a robot’s hand from one point to another, unaware that the same task can be accomplished with a few lines of code using decades-old techniques. The incentives are not always pointing in the same direction as the progress.<\/p><p>Smart is not without hope though. Whatever the motives behind the open sourcing, he says, the effect is real. More people are in the field than ever before, the tools are genuinely easier to use, and the community is bigger and more diverse than anything that existed when ROS was getting started. <\/p><p>“Anyone can make a robot move now,” he says. “As an old tech guy, that makes me happy and sad, because I’m no longer special.”<\/p>"}, {"title": "The Future of Physical AI Isn’t Smarter Robots, It’s Smarter Interfaces", "source": "IEEE Spectrum Robotics", "date": "2026-05-21", "url": "https://spectrum.ieee.org/wetour-robotics-physical-ai-human-interfaces", "summary": "<img src=\"https://spectrum.ieee.org/media-library/hands-controlling-speaker-light-bulb-and-drone-against-minimalist-white-walls.jpg?id=66718902&amp;width=1245&amp;height=700&amp;coordinates=160%2C0%2C160%2C0\" /><br /><br /><p><em>This sponsored article is brought to you by <a href=\"https://wetourrobotics.com/\" target=\"_blank\">Wetour Robotics<\/a>.<\/em><\/p><p>A field technician on a wind turbine, harness clipped, both hands on a wrench, needs to send a command to the diagnostic device hanging at her belt. A logistics worker on a loading dock, gloves on, eyes on the pallet, needs to redirect a connected lift. A person using an assistive mobility device on a crowded street wants to nudge it forward without taking out a phone or speaking aloud. None of these moments call for a smarter robot. They call for a smarter way to be heard by the machines that already exist.<\/p><h2>The industry has been building from one side<\/h2><p>The past three years of Physical AI have been a story of remarkable progress on the robot side of the loop. Companies like Boston Dynamics, Figure, and Unitree have advanced actuators, locomotion, and dexterity to a level that would have seemed implausible a decade ago. Google DeepMind’s Gemini Robotics has redefined what vision-language-action models can do in unstructured settings. The trajectory of the hardware and the foundation models is real, and it is accelerating.<\/p><p>But there is another side to this loop, and it has been treated as a solved problem for too long. The interface between humans and machines has defaulted, for 40 years, to three input modalities: screens, buttons, and voice. Each of those assumes the user can stop, look down, and translate intent into structured commands. That assumption breaks the moment the work moves into a real environment. On a turbine. On a dock. On a sidewalk. In any setting where hands are occupied, eyes are committed, or speaking is impractical, the conventional interface stack quietly fails.<\/p><p class=\"pull-quote\">Spatial Intent Fusion is the simultaneous processing of three streams of human-centered information, namely spatial position, visual context, and gestural intent: Your body is the interface.<br /><\/p><p>The bottleneck on the human side of the loop is becoming as important as the one on the machine side. And solving it requires a different question. Not how do we make the robot more capable, but how do we let the human participate in the computing system as naturally as the robot already does.<\/p><h2>Wetour Robotics’ bet: put the human back into the computing loop<\/h2><p><a href=\"https://wetourrobotics.com/\" target=\"_blank\">Wetour Robotics<\/a> is betting that the next architectural leap in Physical AI is not about making the robot more capable. It is about making the human a first-class node in the computing network, with the same kind of low-latency, high-fidelity participation that connected devices already enjoy.<\/p><p>Wetour Robotics’ engineers frame the problem this way: a wristband that recognizes a gesture is not enough. A camera that recognizes a scene is not enough. The information a human carries about what they are about to do is distributed across multiple channels, including where their body is in space, what their eyes are attending to, and what their muscles are preparing to do, and any single channel observed in isolation is ambiguous. Reconstructing intent reliably means fusing those channels at the operating system level, with latency low enough that the loop feels closed rather than mediated.<\/p><p>This approach has a name. Wetour Robotics calls it Spatial Intent Fusion: the simultaneous processing of three streams of human-centered information, namely spatial position, visual context, and gestural intent, fused into a single real-time command for any connected physical device. It is the technical implementation behind a simpler positioning statement the company uses externally: your body is the interface.<\/p><p class=\"shortcode-media shortcode-media-rebelmouse-image\"> <img alt=\"Sleek silver rectangular electronic device labeled \\u201cORCHESTRA\\u201d on a light gray background.\" class=\"rm-shortcode\" id=\"1af08\" src=\"https://spectrum.ieee.org/media-library/sleek-silver-rectangular-electronic-device-labeled-u201corchestra-u201d-on-a-light-gray-background.png?id=66718892&amp;width=980\" /> <small class=\"image-media media-caption\">Orchestra is a portable intelligent hub running the operating system that handles sensor fusion, intent inference, command translation, and safety arbitration. The reference compute platform is NVIDIA Jetson Orin Nano Super, which provides enough on-device inference capacity to keep the entire control loop at the edge, with no cloud dependency on the critical path. <\/small><small class=\"image-media media-photo-credit\">Wetour Robotics<\/small><\/p><h2>The architecture: three layers, four engines, one loop<\/h2><p>Orchestra is not a single device but a layered platform, designed from the start to be sensor-flexible and actuator-agnostic. The architecture decomposes into three perception layers and four coordination engines.<\/p><p><strong>Orchestra<\/strong> itself is the local compute and orchestration core: a portable intelligent hub running the operating system that handles sensor fusion, intent inference, command translation, and safety arbitration. The reference compute platform is NVIDIA Jetson Orin Nano Super, which provides enough on-device inference capacity to keep the entire control loop at the edge, with no cloud dependency on the critical path. Edge inference is non-negotiable for this application. Full-chain latency from biosignal acquisition to actuator command is held under 100 milliseconds, the envelope inside which closed-loop control feels natural rather than laggy.<\/p><p><strong>VisionLink<\/strong> handles visual and spatial perception. Cameras feed into vision models that identify objects, estimate distances, and track environmental context. VisionLink is designed not as a passive recognition layer but as a real-time command generator: its outputs feed directly into Orchestra OS to be fused with biosignal data.<\/p><p><strong>Conductor<\/strong> is the biosignal pipeline. It ingests raw surface electromyographic (sEMG) data from a wrist-worn device, classifies temporal patterns into discrete gestures or continuous control signals, and outputs actuator commands. The technically interesting property of sEMG for this use case is that the signal precedes visible motion. Motor unit action potentials appear at the skin surface roughly 50 to 80 milliseconds before a finger completes the corresponding gesture. Wetour Robotics calls this property pre-motion intent sensing, and it is what allows Orchestra to anticipate user intent rather than react to it.<\/p><p>On top of the three perception layers, Orchestra OS runs four coordination engines. The <strong>Perception Engine<\/strong> ingests and normalizes raw sensor streams. The <strong>Intent Engine <\/strong>performs Spatial Intent Fusion across modalities, resolving what the user is trying to do given where they are, what they are looking at, and what their hand is signaling. The <strong>Orchestration Engine<\/strong> translates intent into device-specific command sequences for any connected actuator. The <strong>Safety Engine<\/strong> arbitrates conflicting commands, enforces operational envelopes, and gates execution against runtime safety conditions.<\/p><p class=\"shortcode-media shortcode-media-youtube\"> <span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><h2>The trade-offs we’re honest about<\/h2><p>No system that bridges the human body and the digital world is finished. Three engineering challenges remain open, and the company addresses each with a deliberate trade-off rather than a claim of having fully solved it.<\/p><p><strong>Baseline stability of sEMG under motion.<\/strong> In a stationary user, continuous gesture recognition from sEMG is reliable. Once the user is walking, climbing, or otherwise moving, motion artifacts and electrode drift degrade the signal in ways that are difficult to fully compensate for. Rather than overpromise on continuous control in dynamic settings, Orchestra defaults to a smaller set of robust discrete gestures in complex operating environments, and reserves continuous control modes for contexts where the signal-to-noise ratio supports them.<\/p><p><strong>Miniaturization of edge AI compute.<\/strong> Running the Orchestra control loop entirely at the edge requires real on-device inference, which has historically meant trading off between compute capacity, battery life, and form factor. Wetour Robotics’ approach has been a compact carrier board paired with a thermal design and a battery module sized for all-day wearability. The result is a hub that travels with the user rather than tethering them to a desk, and that performs the full perception-to-actuation loop without offloading to the cloud.<\/p><p><strong>Heterogeneity of third-party device protocols.<\/strong> The actuator side of the loop is a fragmented landscape. Different manufacturers expose different command interfaces, different communication stacks, and different safety conventions, and a Physical AI operating system has to integrate with all of them. Wetour Robotics uses an AI-agent layer to negotiate connection and protocol translation adaptively, so that Orchestra OS can ingest data from a wide range of devices, run them through neural network models that infer human intent, and emit the right command on the right protocol for the device on the other end.<\/p><h2>Why this matters, and why it helps the rest of the field<\/h2><p>The history of computing is a history of interface revolutions. Command lines gave way to graphical user interfaces, which gave way to touch, which gave way to voice. Each transition expanded who could participate in the system and what they could do with it. The next transition is not about a new screen or a new microphone. It is about treating the human body itself as a participant in the computing network, capable of contributing intent at the same speed and fidelity that any other connected node can.<\/p><p class=\"pull-quote\">The history of computing is a history of interface revolutions. The next transition is not about a new screen or a new microphone — it is about treating the human body itself as a participant in the computing network.<\/p><p>This path is not a competitor to the work being done on humanoid robots, foundation models for embodied AI, and dexterous manipulation. It is the missing complement to that work. The hardest open problem for humanoid systems is the data: every natural interaction between a human and the physical world is a potential training signal, and most of those interactions are currently invisible to any computing system. As more humans become first-class nodes in the loop, those interactions become observable, structured, and ultimately useful for training the next generation of embodied AI, including the humanoid robots being developed today.<\/p><p>In other words: putting the human back into the computing loop is not just about better interfaces for individual users. It is about generating the kind of grounded, in-the-wild human-machine interaction data that the broader Physical AI ecosystem will need to keep advancing. The robot side and the human side of the loop are not two competing futures. They are two halves of the same one.<\/p><p>That is what Wetour Robotics means when it says: <em>Your body is the interface.<\/em><\/p><p>Learn more at <a href=\"https://wetourrobotics.com/\" target=\"_blank\">wetourrobotics.com<\/a>.<\/p>"}, {"title": "Will Robotics Have a ChatGPT Moment?", "source": "IEEE Spectrum Robotics", "date": "2026-05-20", "url": "https://spectrum.ieee.org/robotics-ai-breakthrough", "summary": "<img src=\"https://spectrum.ieee.org/media-library/a-collection-of-5-robots-against-colored-backgrounds.jpg?id=66734221&amp;width=1245&amp;height=700&amp;coordinates=0%2C88%2C0%2C88\" /><br /><br /><p>Over the next few decades, billions of autonomous, AI-powered robots will work alongside people in factories, perform tedious tasks in warehouses, care for the elderly, <a href=\"https://spectrum.ieee.org/collections/darpa-subterranean-challenge/\" target=\"_blank\">assist in unsafe disaster areas<\/a>, deliver packages and food to our doorsteps, and eventually help out in our homes. Some will look like us, and many won’t. What is certain is that regardless of form factor, robots will all rely heavily on AI in order to deliver real-world value.<\/p><div class=\"rm-embed embed-media\"><\/div><p><span>In 2025, total investments in robotics companies reached <\/span><a href=\"https://www.cbinsights.com/research/report/venture-trends-2025/\" target=\"_blank\">a record US $40.7 billion, accounting for 9 percent of all venture funding<\/a><span>. The multibillion dollar question therefore is this: What will it take for AI-powered robots to begin to have a serious economic impact? Many of today’s robotics and AI companies are making bold claims, such as that humanoid robots will <\/span><a href=\"https://www.1x.tech/\" target=\"_blank\">soon be coming into our homes<\/a><span>, but there’s still a big gap between promise and reality.<\/span><\/p><p><span><\/span><span>The promise of robots that live and work alongside us has been the stuff of science fiction for a very long time. And while many programmers have tried to make that promise a reality, the physical world is just too complicated for traditional computer programs to handle the endless complexity it presents. Thanks to AI, robots are no longer being programmed—instead, they learn to operate in the real world. With enough practice, they can learn to perceive and understand the world around them, reason about that world, and use that reason and understanding to perform tasks that are useful, reliable, and safe.<\/span><\/p><p>The two of us have worked at the forefront of AI and robotics for the last decade, as a <a href=\"https://engineering.oregonstate.edu/people/jonathan-hurst\" target=\"_blank\">Professor in Robotics at Oregon State University<\/a> and <a href=\"https://www.agilityrobotics.com/about/leadership\" target=\"_blank\">Co-Founder of Agility Robotics<\/a>, and as <a href=\"https://www.linkedin.com/in/hanspeter/\" rel=\"noopener noreferrer\" target=\"_blank\">former CEO<\/a> of the <a href=\"https://everydayrobots.ai/\" rel=\"noopener noreferrer\" target=\"_blank\">Everyday Robots moonshot at Google X<\/a>. Our experience deploying AI-powered robots in real-world settings has given us a perspective on where AI can be used to great benefit in complex robotic systems in the near term and where we are still on the frontier of science fiction. We believe AI will enable an inflection point in robotics advances, but that it will be through the well-engineered application of coordinated systems of different AI tools rather than a single ChatGPT-style breakthrough.<\/p><p>As the excitement around AI is matched only by the uncertainty of what will be possible, here are five hard truths that will define AI in robotics.<\/p><h2>1. The YouTube-to-Reality Gap Is Real<\/h2><p>For years, we have been seeing videos on YouTube with humanoid robots performing amazing moves on everything from a dance floor to an obstacle course. The inside knowledge in robotics is to “never trust a YouTube robot video.” The gap between real robots that can perform real work in unstructured human environments and carefully scripted and edited robot performances remains significant. The latest performance to get a lot of attention was a <a href=\"https://www.youtube.com/watch?v=mUmlv814aJo\" rel=\"noopener noreferrer\" target=\"_blank\">martial arts show<\/a> featuring Unitree humanoid robots performing with children at the Chinese 2026 Spring Festival Gala. While impressive, this falls into a long lineage of tightly scripted robotic performances, where everything has been carefully choreographed and planned in advance. The low-level controls, synchronization, and choreography were stunning, yet the Spring Gala robot performance showed a level of autonomy and intelligence much closer to industrial robots building cars in a factory than something that will show up in your living room any time soon. <\/p><p class=\"shortcode-media shortcode-media-youtube\"> <span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span> <\/p><p><span>Seeing these kinds of demos nevertheless raises questions about where robotics really is. If robots can perform kung fu moves and do backflips and dance, why aren’t they also showing up on factory floors yet? And why can’t they do the dishes in my home after dinner? The simple answer is this: Making AI-powered robots capable of performing general tasks in varied human environments is still <\/span><em><em>really<\/em><\/em><span> hard. While impressive technological feats like those at the Spring Festival may make it look like we could be very close, the use of AI in these demos is only for low-level motor control (to keep the robots from falling over) and therefore is only a small part of the solution for robots to be general purpose in the real, unstructured spaces where we humans live and work.<\/span><\/p><h2>2. Data Is An Unsolved Challenge<\/h2><p>Large Language Models (LLMs) like OpenAI’s ChatGPT and Anthropic’s Claude were initially trained on an internet-scale database of text. The world woke up one day in late 2022 to ChatGPT demonstrating that AI computers could suddenly “speak” to us in prose or verse and about seemingly any topic. LLMs have turned out to generalize well and are now able to take multimodal input (text, images, video) and produce multimodal output. Importantly, the corpus of training data was both enormous and human-generated, which are characteristics that form the gold standard for AI training.<\/p><p class=\"shortcode-media shortcode-media-rebelmouse-image rm-float-left rm-resized-container rm-resized-container-25\" style=\"float: left;\"> <img alt=\"A series of four images, including robots working in a contained factory space, in an open indoor factory, outdoors in the real world delivering a package, and working with a human to move a couch in an apartment.\" class=\"rm-shortcode\" id=\"a0903\" src=\"https://spectrum.ieee.org/media-library/a-series-of-four-images-including-robots-working-in-a-contained-factory-space-in-an-open-indoor-factory-outdoors-in-the-real.jpg?id=66734272&amp;width=980\" /> <small class=\"image-media media-caption\">The fastest path to robots as part of everyday life may emerge through a range of robot forms performing increasingly sophisticated applications and employing a range of AI tools.<\/small><small class=\"image-media media-photo-credit\">Agility Robotics<\/small><\/p><p>Giving AI a body (in the form of a robot), so that it can engage with people in the physical world, continues to be a very difficult and broadly unsolved problem. AI models for general-purpose robotics must simultaneously satisfy multiple, often conflicting, physical, geometric, and temporal limitations while operating in unstructured, dynamic environments. In order to generalize, robot models need to be trained on data gathered in a high-dimensional configuration space, where “dimensions” represent text, lighting conditions, degrees of freedom, joint limits, velocities, force, and safety boundaries, just to mention a few. Importantly, this must be <em><em>good<\/em><\/em> data—it must contain many examples from what amounts to an infinite number of possible configurations in the physical world.<\/p><p>Since there are very few existing sources of data like this, approaches like teleoperation, video analysis, motion capture of humans, and self-exploration in simulation and in the real world are all seen as important ways to collect data. It’s a herculean task. For example, at Everyday Robots at Google X, we ran 240 million robot instances in our simulator over the course of 2022 to collect training data, mostly to train a trash-sorting model. Similar amounts of data will be needed for every skill to get to a similar level of capability, which is not yet human level.<\/p><h2>3. There Will Be No Single Robot AI<\/h2><p>We are far away from a moment where a single AI model might allow general-purpose robots to live and work alongside us. <\/p><p>General-purpose robots can have wheels or legs. They can have one, two, three, or more arms. Some have propellers and can fly, while others may be designed to operate under water. Some will drive on busy roads. The physical world is infinitely varied and complex. And then there are all the people and other animals that will be surrounding the robots. How do you train a model to operate a robot safely and reliably in all of these settings? The simple answer is: You don’t. At least not for quite some time.<\/p><p>We believe the winning AI architecture leading to the next big breakthroughs in general-purpose robotics will be “agentic AI” for robots, which are high-level coordinating models that can reason, plan, use tools, and learn from outcomes to execute complex tasks with limited supervision. Agentic, high-level models running on robots will invoke a system of specialized ones for different types of tasks. We will likely soon see multiple robots collaborating and coordinating with each other through their onboard agentic AI models.<\/p><p>AI tools are unlocking new and powerful capabilities in robotics, which in turn will enable new solutions and new markets. It’s encouraging to see these new models being made broadly available, some even as open-source solutions. This availability is akin to what happened with the internet: Real progress occurred when it became ubiquitous. We anticipate an inevitable democratization of complex behaviors in robotics with wide access to these AI tools and technologies.<\/p><h2>4. Hardware Is Still Very Hard<\/h2><p>Robots are complex systems with many parts that all need to work together with great precision. For a robot to be useful and safe, every part of it must be coordinated, from its perception systems to the computer controlling it, all the way down to its individual actuators.<\/p><p>Actuators—that is, the motors and gears—are a good example of an important part of the robot where what got us here won’t get us there. The actuators used at scale by most industrial robots will not work for robots that will operate in human environments. If these robots accidentally collide with an obstacle, the resulting impacts are harsh, forces are high, and things break. Humans don’t move in this way. We are far more compliant in how we interact with the world, and we’re constantly making contact with our environment and using that contact to help us accomplish things. <\/p><p>Consider the challenge of inserting a key in a lock: Humans typically don’t do this by aligning the key perfectly with the keyhole. Instead, we just feel for the edge of the keyhole and jiggle the key in. Robots need to be able to operate in novel ways to achieve comparable capabilities by using a new class of actuators that are sensitive to force and able to have a compliant interaction with the environment. While these kinds of actuators do exist, they are not yet generally available at scale for robot systems designed to operate around people.<\/p><h2>5. Real Value Comes From “Easy” Tasks<\/h2><p>There’s a big difference between tasks that look impressive and real-world tasks that provide value. Robotics is a perfect example of <a href=\"https://en.wikipedia.org/wiki/Moravec%27s_paradox\" target=\"_blank\">Moravec’s paradox<\/a>, which states that tasks that are hard for humans are easy for computers (like multiplying two big numbers), and tasks easy for humans (like a toddler’s movements) are extremely difficult for computers and robots.<\/p><p>Serving customers is an unforgiving reality check, because customers only care about solving the real problems they have. If we are to deploy AI-based robot solutions, they must outperform the way things are currently done while demonstrating reliable performance metrics and safety. Agility Robotics’ early work to deploy our humanoid robot Digit in customer locations led to the realization that our first obstacle was safety: Robots that balance and manipulate objects in human spaces bring new types of risk to the workplace. In the first <a href=\"https://www.youtube.com/watch?v=AJpTpUqjgrY\" target=\"_blank\">humanoid deployments<\/a>, physical barriers were necessary, and Agility kicked off a multi-year engineering effort to solve the safety challenge, touching nearly every aspect of robot design and relying heavily on new AI-based approaches to human detection and behavior control.<\/p><p class=\"shortcode-media shortcode-media-youtube\"> <span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span> <\/p><p><a href=\"https://everydayrobots.ai/vision\" target=\"_blank\">Everyday Robots<\/a> at Google deployed robots in 2019 that worked autonomously in office buildings doing chores like cleaning cafe tables and sorting trash. We quickly learned how “messy” and difficult the real world is for a robot. This experience informed the architecture and deployment of our AI systems while also gathering real-world data that could be combined with simulation data for training and improving models.<\/p><p>This focus on creating a product to meet specific customer needs and deploying robots in real-world settings is the only way to inform the structure of the AI tools and infrastructure for near-term utility on a path towards long-term broader capability and generality. There will be no “aha” moment, no silver bullet algorithm, and no volume of data sufficient to produce a general-purpose robot without extensive real-world experience. <\/p><h2>AI Robots Are Coming, One Step at a Time<\/h2>As we look to the future, there is no doubt that the world is bringing AI into the physical world through robots. We are at the beginning of a “<a href=\"https://spectrum.ieee.org/is-a-cambrian-explosion-coming-for-robotics\" target=\"_self\">Cambrian explosion<\/a>“ of useful, intelligent machines. We believe AI is not one tool, but a huge frontier of technical approaches that is unlocking new capabilities so powerful, they will define our economy moving forward. This will happen not in one single definitive moment, but as an ongoing set of small and large breakthroughs, where AI-driven robots begin to provide real value in a few tasks, and then a few more, with impacts unfolding across numerous $100 billion-plus markets that will dramatically improve the quality of our lives."}], "roboticsNews": [{"title": "Teradyne Robotics ramps up fight against cobot copycats", "source": "Robotics Business Review", "date": "2026-08-27", "url": "https://www.therobotreport.com/teradyne-robotics-sues-another-chinese-cobot-maker/", "summary": "<p>Teradyne Robotics sued cobot maker JAKA over alleged patent infringement, marking its second battle with a Chinese cobot company in 2026.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/teradyne-robotics-sues-another-chinese-cobot-maker/\">Teradyne Robotics ramps up fight against cobot copycats<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "NSF to invest $90M into three new technology centers, including one focused on robotics", "source": "Robotics Business Review", "date": "2026-08-27", "url": "https://www.therobotreport.com/nsf-invests-90m-three-new-technology-centers-including-one-focused-robotics/", "summary": "<p>One of the new NSF funded centers will be the Center for Human and Robot Co-Adaptation, led by The University of Texas at Austin.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/nsf-invests-90m-three-new-technology-centers-including-one-focused-robotics/\">NSF to invest $90M into three new technology centers, including one focused on robotics<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Carbon Robotics partners with iMerit to power instant in-field AI customization", "source": "Robotics Business Review", "date": "2026-08-27", "url": "https://www.therobotreport.com/carbon-robotics-partners-with-imerit-to-power-instant-in-field-ai-customization/", "summary": "<p>Carbon Robotics introduced a plant foundation AI model and tractor kit, enabling farmers to customize laser weeding.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/carbon-robotics-partners-with-imerit-to-power-instant-in-field-ai-customization/\">Carbon Robotics partners with iMerit to power instant in-field AI customization<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Bedrock Robotics’ first operator-free excavator deployments take off", "source": "Robotics Business Review", "date": "2026-08-26", "url": "https://www.therobotreport.com/bedrock-robotics-first-operator-free-excavator-deployments-take-off/", "summary": "<p>Bedrock Robotics deploys autonomous excavators to active job sites, tackling construction labor shortages with AI-powered heavy machinery.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/bedrock-robotics-first-operator-free-excavator-deployments-take-off/\">Bedrock Robotics&#8217; first operator-free excavator deployments take off<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "IDS Imaging adds Nion ToF sensor to its portfolio of 3D cameras", "source": "Robotics Business Review", "date": "2026-08-26", "url": "https://www.therobotreport.com/ids-imaging-adds-nion-tof-camera-portfolio-3d-cameras/", "summary": "<p>IDS said Nion is suitable for applications where precise 3D data is required at real-world process speeds, such as logistics and robotics. <\/p>\n<p>The post <a href=\"https://www.therobotreport.com/ids-imaging-adds-nion-tof-camera-portfolio-3d-cameras/\">IDS Imaging adds Nion ToF sensor to its portfolio of 3D cameras<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Gatik brings in $200M to continue expanding autonomous trucking operations", "source": "Robotics Business Review", "date": "2026-08-26", "url": "https://www.therobotreport.com/gatik-brings-in-200m-to-continue-expanding-autonomous-trucking-operations/", "summary": "<p>Gatik said the funding will help it expand its model built around high-frequency regional routes connecting distribution centers and stores.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/gatik-brings-in-200m-to-continue-expanding-autonomous-trucking-operations/\">Gatik brings in $200M to continue expanding autonomous trucking operations<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "AI Companion Robots Are Closing the Human Connection in Modern Homes", "source": "IEEE Spectrum Robotics", "date": "2026-08-25", "url": "https://spectrum.ieee.org/ollobot-ai-companion-robot", "summary": "<img src=\"https://spectrum.ieee.org/media-library/cute-home-robot-on-carpet-in-cozy-living-room-with-beige-sofa-and-warm-lighting.jpg?id=67154308&amp;width=1200&amp;height=800&amp;coordinates=0%2C0%2C0%2C0\" /><br /><br /><p><em>This article is brought to you by <a href=\"https://ollobot.com/\" target=\"_blank\">Ollobot<\/a>.<\/em><\/p><p>From about 2017, individuals began to truly connect with the initial wave of companion robots. These devices had personality, moved around, joked, and answered when you spoke to them. Most early companion robots, however, were still limited by simple voice-command interactions and narrow functionality. Once the novelty wore off, many ended up sitting unused on shelves. As some of those companies went out of business and turned off their servers, many owners likened it to losing a pet.<\/p><p>What Ollobot describes as “gentle intelligence” is a useful way to think about where the serious work in this category is going. Not toward more powerful assistants, but toward more present ones.<\/p><h2><a target=\"_blank\"><\/a>The problem companion robots were trying to solve<strong><\/strong><\/h2><p>Loneliness is not a niche issue. According to one <a href=\"https://pmc.ncbi.nlm.nih.gov/articles/PMC9957792/\" target=\"_blank\">study<\/a>, nearly one out of three elderly adults resides alone, meaning they do not have daily companions. <a href=\"https://pubmed.ncbi.nlm.nih.gov/20533912/\" target=\"_blank\">Research<\/a> also shows that children whose parents have migrated for work, leaving them in the care of relatives, were 2.5 times more likely to experience loneliness than children whose parents remain with them. Among working adults living alone in urban environments, similar <a href=\"https://pmc.ncbi.nlm.nih.gov/articles/PMC6530780/\" target=\"_blank\">patterns<\/a> of social isolation emerge, even if they are less visible.<\/p><p>Over the years, technology has time and again attempted to solve this problem via video calls, smart speakers, and messaging apps without much success. Those tools are geared towards communication between people that already have relationships. They do not create presence. They schedule it. That is the gap that a new generation of AI companion robots is being engineered to fill.<\/p><h2><a target=\"_blank\"><\/a>Today’s AI robots are different<strong><\/strong><\/h2><p>Today’s companion robots are not just cute and cuddly. They are designed with psychological research, clinical insight and long-term interaction models to be truly useful in real homes.<\/p><p>Three fundamental shifts define the current generation:<\/p><ol><li><strong>From reactive to proactive response. <\/strong>Older robots relied on you speaking to them, but modern robots monitor a room with cameras, microphones, and surroundings sensors to initiate interactions without your input, and they can pick up on your emotions.<\/li><li><strong>From function-oriented to emotion-oriented design.<\/strong> The original pitch for companion robots was about what they could do. The question driving the serious work now is how they make you feel, which is a harder engineering problem and a more honest framing of what the product is actually for.<\/li><li><strong>From standalone hardware to connected ecosystems.<\/strong> Leading brands are creating platforms rather than devices with software included as a built-in layer and remote access from the beginning.<\/li><\/ol><p>The <a href=\"https://www.grandviewresearch.com/industry-analysis/ai-companion-market-report?__cf_chl_f_tk=xJq0xhwCGb6n830sK3lMN.cyk2m73bms6.RauBufPho-1783406928-1.0.1.1-TsUMt2nxUgZ5nDX79zhxxVYkTv9xk2r_.E2rbXRHByA\" target=\"_blank\">global AI companion market<\/a> size was valued at US $36.8 billion in 2025 and is projected to grow from $48 billion in 2026 to $318 billion by 2033, at a compound annual growth rate of 31 percent from 2026 to 2033.<em><span><br /><\/span><\/em><\/p><h2><a target=\"_blank\"><\/a>Three household scenarios and interaction models<strong><\/strong><\/h2><p>Ollobot’s advanced AI family companion robot <a href=\"https://ollobot.com/\" target=\"_blank\"><span>OlloNi SS1<\/span><\/a> addresses a number of gaps in what existing technology offers.<\/p><p><strong>Elderly individuals living alone.<\/strong> The combination of proactive interaction, fall detection, and persistent presence addresses both safety and companionship without the social overhead of asking family members to check in more frequently.<\/p><p><strong>Children in households where parents work far from home.<\/strong> The SS1 functions as a consistent companion that already knows a child, their preferences, their moods, and their routines. The remote connection features allow parents to stay present without requiring a scheduled call, and the life recording system gives them a passive window into their child’s days that feels less clinical than a monitoring camera.<\/p><p><strong>Single professionals living alone in cities.<\/strong> The SS1 adapts to daily routines, builds up a preference model over time, and provides ambient social presence without demands.<\/p><p class=\"shortcode-media shortcode-media-rebelmouse-image\"> <img alt=\"Cute home robot with a purple cover and cartoon face displayed on its screen.\" class=\"rm-shortcode\" id=\"8d48b\" src=\"https://spectrum.ieee.org/media-library/cute-home-robot-with-a-purple-cover-and-cartoon-face-displayed-on-its-screen.jpg?id=67154351&amp;width=980\" /> <small class=\"image-media media-caption\">OlloNi SS1 adapts to daily routines over time.<\/small><small class=\"image-media media-photo-credit\">Ollobot<\/small><\/p><h2>What OlloNi SS1 is doing differently?<\/h2><p>Ollobot’s goal in building intelligent companion robots is to address the gaps in technology and capability, using innovation not to automate tasks but to fill emotional voids.<\/p><p>Much of the robotics industry has historically pursued human imitation — machines that speak, look, or behave like people. The SS1 is instead designed around familiarity and long-term coexistence rather than realism.<\/p><p>The system integrates multiple subsystems operating in parallel, including visual perception, audio processing, mobility control, and interaction management. It is equipped with a multi-chip AI 4K vision module capable of facial recognition and motion tracking. One small but revealing detail is the inclusion of a physical privacy cover for the camera — a mechanical solution to concerns that software settings alone may not fully resolve.<\/p><p class=\"shortcode-media shortcode-media-rebelmouse-image\"> <img alt=\"Person playing with a red plush robot toy that has a glowing digital face and eyes\" class=\"rm-shortcode\" id=\"daa03\" src=\"https://spectrum.ieee.org/media-library/person-playing-with-a-red-plush-robot-toy-that-has-a-glowing-digital-face-and-eyes.jpg?id=67154349&amp;width=980\" /> <small class=\"image-media media-caption\">OlloNi SS1 can actively integrate into family activities, and it can autonomously move closer to capture memorable moments or reposition itself to remain engaged in ongoing interactions.<\/small><small class=\"image-media media-photo-credit\">Ollobot<\/small><\/p><p><span>The robot supports advanced mobility across multiple indoor surfaces, including wooden floors, ceramic tiles, and low-pile carpets, with slope climbing capability up to 3.5 degrees. Rather than remaining in a fixed location, it can move naturally throughout the home to stay close to household members as daily activities unfold. <\/span><\/p><p><span>For example, the OlloNi SS1 may greet family members when they arrive home, follow an older adult from the living room to the kitchen while continuing a conversation, remind a child to take a study break after a prolonged period of inactivity, or notice that someone appears unusually quiet and gently check in. During family activities, it can autonomously move closer to capture memorable moments or reposition itself to remain engaged in ongoing interactions.<\/span><\/p><p class=\"pull-quote\">The robot continues to evolve over time, with over-the-air updates that deliver new features, performance improvements, and AI enhancements<\/p><p>It also incorporates fall detection with optimized accuracy for safety monitoring scenarios. A 6-microphone array enables omnidirectional voice pickup with an effective voice capture range of up to 5 meters, supporting reliable wake-word detection and far-field interaction.<\/p><p>To support continuous companionship, much of the robot’s AI processing takes place directly on the device through its “heart module” architecture, with 16 GB of memory and 64 GB of local storage. This enables the system to retain household memories, recognize familiar faces, and respond with lower latency, making interactions feel more natural even during everyday routines.<\/p><p>Because companion robots are expected to remain available throughout the day rather than only during brief interactions, the SS1 is designed for extended operation, offering up to 12 hours of standby time and around 5 hours of active interaction on a single charge. This allows it to accompany users through meals, conversations, playtime, and other daily activities without frequent interruptions.<\/p><p class=\"shortcode-media shortcode-media-rebelmouse-image\"> <img alt=\"Close-up of toy robot with glowing red heart and purple fur on a beige body.\" class=\"rm-shortcode\" id=\"0261b\" src=\"https://spectrum.ieee.org/media-library/close-up-of-toy-robot-with-glowing-red-heart-and-purple-fur-on-a-beige-body.jpg?id=67154317&amp;width=980\" /> <small class=\"image-media media-caption\">To support engaging interactions, much of the robot’s AI processing takes place directly on the device through its “heart module” architecture.<\/small><small class=\"image-media media-photo-credit\">Ollobot<\/small><\/p><p><span>Like the relationships it is designed to build, the robot continues to evolve over time. Running on Android OS with over-the-air (OTA) updates, the system continuously receives new features, performance improvements, and AI enhancements, allowing its capabilities to grow alongside the household it serves.<\/span><\/p><p>The robot’s behavioral model also improves over time. Rather than reacting to isolated commands, it attempts to establish a baseline understanding of household routines and individuals. Changes in behavior — prolonged quietness, unusual inactivity, or emotional cues — become triggers for interaction.<\/p><h2>Presence instead of utility<\/h2><p>Several features in the OlloNi SS1 illustrate this emphasis on presence and continuity in its interactions.<\/p><p>The system can identify different household members, including pets, and adapt responses accordingly. Remote communication features allow family members to connect through the device without treating every interaction like a scheduled call. Environmental sensors support contextual reminders tied to weather or room conditions.<\/p><p>Its “2+1” multi-display configuration is also designed around emotional communication. Two circular side displays function as expressive “emotional eyes,” while a separate primary display handles information and structured interaction. The separation allows emotional signaling and functional communication to operate independently, creating more intuitive nonverbal interaction even when no dialogue is taking place.<\/p><p class=\"shortcode-media shortcode-media-rebelmouse-image\"> <img alt=\"Cute red robot pet in checkered shirt sits on rug in cozy, warmly lit living room\" class=\"rm-shortcode\" id=\"5f2a7\" src=\"https://spectrum.ieee.org/media-library/cute-red-robot-pet-in-checkered-shirt-sits-on-rug-in-cozy-warmly-lit-living-room.jpg?id=67154312&amp;width=980\" /> <small class=\"image-media media-caption\">The robot’s behavioral model improves over time. Rather than reacting to isolated commands, it attempts to establish a baseline understanding of household routines and individuals.<\/small><small class=\"image-media media-photo-credit\">Ollobot<\/small><\/p><p>The SS1 also includes an automated life-recording system built on facial recognition and behavioral-event detection that can capture moments such as laughter, physical closeness, or group interaction automatically. An integrated AI vlog engine can then organize those moments into edited short-form videos with automated sequencing and soundtrack generation. The design intent is to preserve spontaneous domestic moments without requiring active documentation behavior from users.<\/p><p class=\"pull-quote\">An integrated AI vlog engine can<span> organize recorded<\/span><span> moments into edited short-form videos with automated sequencing and soundtrack generation<\/span><\/p><p>Visual data is processed primarily on the device through the SS1’s on-device AI architecture, with household memories stored locally and managed within Ollobot’s proprietary ecosystem instead of being shared with third-party smart home platforms. Access to recordings and live feeds is restricted to authorized users through the companion app, while encrypted communication helps protect data during remote access. Users also retain direct control over recording preferences, and the physical camera privacy cover provides an additional hardware-level safeguard whenever visual monitoring is not desired.<\/p><div class=\"ieee-sidebar-small\"><p class=\"shortcode-media shortcode-media-rebelmouse-image rm-float-left rm-resized-container rm-resized-container-25\" style=\"float: left;\"> <img alt=\"Ollobot logo with circular icon and bold lowercase text on light background\" class=\"rm-shortcode\" id=\"8eca7\" src=\"https://spectrum.ieee.org/media-library/ollobot-logo-with-circular-icon-and-bold-lowercase-text-on-light-background.png?id=67154360&amp;width=980\" /><\/p><p>Learn more at <a href=\"https://ollobot.com/\" target=\"_blank\">ollobot.com<\/a>.<\/p><\/div><p>Remote communication is similarly structured around persistence rather than transaction. Traditional video calls are episodic and screen-bound; the SS1 instead acts as a continuously present interface embedded inside the household environment. Through autonomous mobility, environmental awareness, and persistent household memory, remote family members interact with an ongoing domestic context.<\/p><h2><a target=\"_blank\"><\/a>The larger shift to “gentle intelligence”<\/h2><p>Ultimately, gentle intelligence is not about making robots behave more like humans — it is about helping them fit more naturally into human lives. Each OlloNi SS1 unit develops a unique behavioral profile based on its household. Two units running in different homes for a year will have become meaningfully different from each other, shaped by the specific people, habits, and rhythms of where they live.<\/p><p>That kind of long-term personalization is what early companion robots never had. It is also what makes the difference between a product that ends up on a shelf and one that actually earns its place in a home.<\/p><p>Learn more at <a href=\"https://ollobot.com\" target=\"_blank\">ollobot.com<\/a>.<\/p>"}, {"title": "Humans in the loop are still needed for robotaxi fleet safety, says Guident", "source": "Robotics Business Review", "date": "2026-08-25", "url": "https://www.therobotreport.com/humans-loop-are-still-needed-robotaxi-fleet-safety-says-guident/", "summary": "<p>As fleets of autonomous vehicles scale, AI and human oversight remain critical for safety, explains Guident's CEO.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/humans-loop-are-still-needed-robotaxi-fleet-safety-says-guident/\">Humans in the loop are still needed for robotaxi fleet safety, says Guident<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Jetson Orin Nano 2 doubles inference performance for robotics on the edge, says NVIDIA", "source": "Robotics Business Review", "date": "2026-08-25", "url": "https://www.therobotreport.com/jetson-orin-nano-2-doubles-inference-performance-robotics-edge-says-nvidia/", "summary": "<p>With Jetson Orin Nano 2, NVIDIA says that frontier intelligence has reached the edge and can now run in real time.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/jetson-orin-nano-2-doubles-inference-performance-robotics-edge-says-nvidia/\">Jetson Orin Nano 2 doubles inference performance for robotics on the edge, says NVIDIA<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Early bird pricing for RoboBusiness 2026 ends August 31", "source": "Robotics Business Review", "date": "2026-08-25", "url": "https://www.therobotreport.com/early-bird-pricing-for-robobusiness-2026-ends-august-31/", "summary": "<p>Early bird pricing for RoboBusiness 2026, which saves attendees $200 on full conference passes, will end Aug. 31.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/early-bird-pricing-for-robobusiness-2026-ends-august-31/\">Early bird pricing for RoboBusiness 2026 ends August 31<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "XPeng Motors humanoid robot unit Dogotix raises $900M", "source": "Robotics Business Review", "date": "2026-08-24", "url": "https://www.therobotreport.com/xpeng-motors-humanoid-robot-unit-dogotix-raises-900m/", "summary": "<p>Dogotix, the humanoid unit of XPeng Motors, has attained a valuation of $6.3 billion as it plans to produce robots at scale.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/xpeng-motors-humanoid-robot-unit-dogotix-raises-900m/\">XPeng Motors humanoid robot unit Dogotix raises $900M<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "The next big AI play isn’t apps or humanoids; it’s machines with brains and brawn", "source": "Robotics Business Review", "date": "2026-08-24", "url": "https://www.therobotreport.com/the-next-big-ai-play-isnt-apps-or-humanoids-its-machines-with-brains-and-brawn/", "summary": "<p>For agricultural and construction equipment makers to stay relevant as workforces dwindle, they need to add AI, says Agtonomy's founder.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/the-next-big-ai-play-isnt-apps-or-humanoids-its-machines-with-brains-and-brawn/\">The next big AI play isn&#8217;t apps or humanoids; it&#8217;s machines with brains and brawn<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Use a digital twin to explore automation before committing capital", "source": "Robotics Business Review", "date": "2026-08-23", "url": "https://www.therobotreport.com/use-digital-twin-explore-automation-before-committing-capital/", "summary": "<p>While a digital twin does not necessarily replace a systems integrator, it can help manufacturers evaluate robots and plan applications, says RoboDK.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/use-digital-twin-explore-automation-before-committing-capital/\">Use a digital twin to explore automation before committing capital<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "How software-defined manufacturing fits into real factory operations", "source": "Robotics Business Review", "date": "2026-08-22", "url": "https://www.therobotreport.com/how-software-defined-manufacturing-fits-into-real-factory-operations/", "summary": "<p>Roby Lynn explains how R2 Labs bridges PLCs, robots, and AI to unify fragmented manufacturing systems.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/how-software-defined-manufacturing-fits-into-real-factory-operations/\">How software-defined manufacturing fits into real factory operations<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "The technology that could bring robot mowers to one in two American lawns", "source": "Robotics Business Review", "date": "2026-08-22", "url": "https://www.therobotreport.com/technology-could-bring-robot-mowers-one-half-american-lawns/", "summary": "<p>Improvements in AI, satellite navigation, and machine vision are helping robotic lawn mowers spread in the U.S., writes Sunseeker's founder.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/technology-could-bring-robot-mowers-one-half-american-lawns/\">The technology that could bring robot mowers to one in two American lawns<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Robots don’t run themselves: The workforce powering physical AI", "source": "Robotics Business Review", "date": "2026-08-22", "url": "https://www.therobotreport.com/robots-dont-run-themselves-workforce-powering-physical-ai/", "summary": "<p>The addition of physical AI to the workforce requires more key performance indicators than throughput, according to the president of HireArt.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/robots-dont-run-themselves-workforce-powering-physical-ai/\">Robots don&#8217;t run themselves: The workforce powering physical AI<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Schaeffler plans to mass produce gearboxes for humanoid robots in 2027", "source": "Robotics Business Review", "date": "2026-08-21", "url": "https://www.therobotreport.com/schaeffler-plans-to-mass-manufacture-gearboxes-for-humanoids-in-2027/", "summary": "<p>Schaeffler is creating its strain wave gearboxes with a forming technology that will enable mass production of the components. <\/p>\n<p>The post <a href=\"https://www.therobotreport.com/schaeffler-plans-to-mass-manufacture-gearboxes-for-humanoids-in-2027/\">Schaeffler plans to mass produce gearboxes for humanoid robots in 2027<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Amazon’s Bhavana Chandrashekhar to speak at RoboBusiness’ Women in Robotics Lunch", "source": "Robotics Business Review", "date": "2026-08-21", "url": "https://www.therobotreport.com/amazons-bhavana-chandrashekhar-speaks-robobusiness-women-in-robotics-lunch/", "summary": "<p>The Women in Robotics Lunch at RoboBusiness is an opportunity to form new connections and deepen relationships.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/amazons-bhavana-chandrashekhar-speaks-robobusiness-women-in-robotics-lunch/\">Amazon&#8217;s Bhavana Chandrashekhar to speak at RoboBusiness&#8217; Women in Robotics Lunch<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Video Friday: Do We Need Superhuman Humanoid Robots?", "source": "IEEE Spectrum Robotics", "date": "2026-08-21", "url": "https://spectrum.ieee.org/video-friday-unitree-superhuman", "summary": "<img src=\"https://spectrum.ieee.org/media-library/humanoid-robot-leaps-over-200-centimeter-height-board-beside-person-in-warehouse.png?id=67655329&amp;width=1200&amp;height=800&amp;coordinates=150%2C0%2C150%2C0\" /><br /><br /><p><span>Video Friday is your weekly selection of awesome robotics videos, collected by your friends at <\/span><em>IEEE Spectrum<\/em><span> robotics. We also post a weekly calendar of upcoming robotics events for the next few months. Please <\/span><a href=\"mailto:automaton@ieee.org?subject=Robotics%20event%20suggestion%20for%20Video%20Friday\">send us your events<\/a><span> for inclusion.<\/span><\/p><h5><a href=\"https://humanoidssummit.com/\">Humanoids Summit Seoul<\/a>: 22–23 September 2026, SEOUL<\/h5><h5><a href=\"https://2026.ieee-iros.org/\">IROS 2026<\/a>: 27 September–1 October 2026, PITTSBURGH<\/h5><h5><a href=\"https://www.corl.org/\">CoRL 2026<\/a>: 9–12 November 2026, AUSTIN<\/h5><p>Enjoy today’s videos!<\/p><div class=\"horizontal-rule\"><\/div><div><span style=\"display: none;\"> <\/span><\/div><p class=\"rm-anchors\" id=\"o7okizfils4\">This is very, very cool. But I’m trying to think of what the commercial use case will be, you know? I guess, high speed, incredibly dangerous package delivery to second-floor windows or something...?<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.unitree.com/\">Unitree<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"1cllcvk-9lo\"><em>Humans have a remarkable ability to perform new physical skills from only one or a few examples. Our latest robot foundation model, GEN-1.5, exhibits the beginnings of that same ability: It can learn a new task in seconds, from a single example, without gradient updates or fine-tuning. It displays broad capabilities across one-shot and few-shots learning from demonstration, as well as zero-shot physical generalization. Although the tasks are simple and short-horizon, this is the first model we know for which one-shot and few-shots learning of physical skills have emerged at scale. We view these results as a significant step toward our mission of building general intelligence for the physical world.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>I will make the cautionary point that for many of these “the model figured it out” tasks, the blog post can only say that there was no relevant pretraining data “to the best of our knowledge.”<\/p><p>[ <a href=\"https://generalistai.com/blog/gen-1.5\">Generalist<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"hwpuyegnujs\">BeanBot is a robot inspired by Mexican jumping beans, and I need say no more.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://bsr.iit.it/\">IIT<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"rcbpit1--0w\">As a professional bagpiper who definitely pays very close attention to whatever that annoying tapping noise is coming from the back of the band, I can attest to this group of <a href=\"https://spectrum.ieee.org/cybernetic-third-arm-makes-drummers-even-more-annoying\" target=\"_blank\">robot drummers<\/a> being absolutely top-notch.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://global.agilex.ai/\">AgileX Robotics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"1zzj64jxb1m\"><em>What does it take for an aerial robot to move through a sequence of arbitrary poses—fast, precisely, and continuously? Rather than teaching the robot a behavior from data, we asked how far a first-principles analytical model could take us. Through a collaboration between the AIMS Group at the Hong Kong Polytechnic University and DRAGON Lab at the University of Tokyo, we developed the first sequential-convex-programming-based trajectory-optimization framework for generalized <a href=\"https://spectrum.ieee.org/caltech-and-jpl-firing-quadrotors-out-of-cannons\" target=\"_blank\">multirotors<\/a>, covering both conventional and omnidirectional platforms.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.dragon.t.u-tokyo.ac.jp/\">DRAGON Lab<\/a> ]<\/p><p>Thanks, Moju!<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"tqx_y8ehahc\">This is a nifty idea that adapts a kind of interface frequently used for robot training and uses it for human training instead.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://news.mit.edu/2026/mit-engineers-design-better-controller-operating-construction-diggers-0820\">MIT<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"gc54o6bzcgw\"><em>Gravis Robotics brings robotic intelligence to heavy construction machines. Our retrofit kit, the Gravis Rack, turns off-the-shelf hydraulic machines into robots. Cameras, lidar, and onboard compute lets your machine see and understand its surroundings, and learning-based control lets it work close to its limits, moving more dirt with full, fast cycles.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.gravisrobotics.com/\">Gravis Robotics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"kczc9sjylno\"><em>Robust brachiation requires precise hand movements to grasp and release bars together with highly coordinated whole-body motion. To address this challenge, we propose a learning-based framework centered on waypoint-guided reinforcement learning (WGRL). WGRL guides the end effector through waypoints while allowing RL to explore and generate dynamic whole-body behaviors. With this approach, the learned policy demonstrated robust brachiation across diverse courses with different bar heights, spacings, and orientations in sim-to-sim experiments. In the real world, our life-size dual-arm robot successfully traversed four consecutive bars.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.eva.ai.u-tokyo.ac.jp/team/\">EVARL<\/a> ]<\/p><p>Thanks, Ayumu!<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"qulo_xmvsw4\">Well, here’s a different approach to <a href=\"https://spectrum.ieee.org/persona-ai-humanoid-robot-welding\" target=\"_blank\">welding in shipyards with robots<\/a>.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://kawasakirobotics.com/applications/arc-welding/\">Kawasaki<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"p55r7gn8xi8\">We should have a lot more robots in agriculture, if only they’d lettuce.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.flexiv.com/\">Flexiv<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"ghfcvlu_iku\">We’ve all had refs like these.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.phybot.tech/en/home\">PHYBOT<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"roxyluaqabq\">I got stuck after the first 15 seconds of this video trying to imagine what any of these home humanoids would usefully do if they dropped a glass.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://en.zhejianglab.com/institutescenters/researchunits/interdisciplinaryresearchcenters/researchcenterforintelligentrobot/\">Zhejiang Humanoid<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"4oggdyyo45i\"><a href=\"https://spectrum.ieee.org/sri-shakey-robot-honored-as-ieee-milestone\" target=\"_blank\">Shakey the Robot<\/a> doesn’t get enough love.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.sri.com/\">SRI<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"qtd7zwk3mq4\"><em>This work introduces a novel approach to physical human-robot interaction (pHRI) by leveraging the joint torque sensors of standard collaborative robots. By mounting a passive, uninstrumented plexiglass touchpad to the robot’s flange, we transform the robot into a handwriting-based input interface.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://ts-robotics.github.io/pHRI-CHAR-TACT/\">TS-Robotics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div>"}, {"title": "Agtonomy releases new autonomous multi-point turning features", "source": "The Robot Report", "date": "2026-08-20", "url": "https://www.therobotreport.com/agtonomy-releases-new-autonomous-multi-point-turning-features/", "summary": "<p>Agtonomy has added autonomous multi-point turning and enhanced field data collection to its commercial off-road platform.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/agtonomy-releases-new-autonomous-multi-point-turning-features/\">Agtonomy releases new autonomous multi-point turning features<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "ATDev gives update on its journey building autonomous wheelchairs", "source": "Robotics Business Review", "date": "2026-08-20", "url": "https://www.therobotreport.com/atdev-gives-update-journey-building-autonomous-wheelchairs/", "summary": "<p>ATDev is developing a modern power wheelchair with a coordinated robotic arm that can take on reaching and lifting tasks for the user. <\/p>\n<p>The post <a href=\"https://www.therobotreport.com/atdev-gives-update-journey-building-autonomous-wheelchairs/\">ATDev gives update on its journey building autonomous wheelchairs<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Amazon plans to expand Prime Air to nearly 500 cities by the end of 2026", "source": "Robotics Business Review", "date": "2026-08-20", "url": "https://www.therobotreport.com/amazon-plans-expand-prime-air-nearly-500-cities-by-end-2026/", "summary": "<p>Amazon said its Prime Air drones can deliver nearly all items 5 lb. or less that can fit in a large shoebox.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/amazon-plans-expand-prime-air-nearly-500-cities-by-end-2026/\">Amazon plans to expand Prime Air to nearly 500 cities by the end of 2026<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Pudu Robotics launches new MP2000 autonomous forklift", "source": "Robotics Business Review", "date": "2026-08-19", "url": "https://www.therobotreport.com/pudu-robotics-launches-new-mp2000-autonomous-forklift/", "summary": "<p>Pudu Robotics has launched the MP2000, an AI-native autonomous robot designed to transport 2,000 kg loads across complex warehouse environments.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/pudu-robotics-launches-new-mp2000-autonomous-forklift/\">Pudu Robotics launches new MP2000 autonomous forklift<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Serve Robotics to deploy its autonomous delivery robots with Grubhub", "source": "Robotics Business Review", "date": "2026-08-19", "url": "https://www.therobotreport.com/serve-robotics-deploys-autonomous-delivery-robots-grubhub/", "summary": "<p>Serve's robot delivery will be available from more than 100 participating Grubhub merchants in Chicago and nearly 200 in Los Angeles.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/serve-robotics-deploys-autonomous-delivery-robots-grubhub/\">Serve Robotics to deploy its autonomous delivery robots with Grubhub<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "What does Unitree Robotics’ IPO mean for the humanoid industry?", "source": "Robotics Business Review", "date": "2026-08-19", "url": "https://www.therobotreport.com/what-does-unitree-robotics-ipo-mean-for-humanoid-industry/", "summary": "<p>Now that Unitree Robotics has made its IPO, which humanoid robotics companies will follow in its footsteps?<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/what-does-unitree-robotics-ipo-mean-for-humanoid-industry/\">What does Unitree Robotics&#8217; IPO mean for the humanoid industry?<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Kollmorgen to give a joint-by-joint guide to humanoid motion at RoboBusiness", "source": "The Robot Report", "date": "2026-08-19", "url": "https://www.therobotreport.com/kollmorgen-give-joint-by-joint-guide-humanoid-motion-robobusiness/", "summary": "<p>The talk at RoboBusiness will outline the unique demands of each body zone and the challenges of scaling for production.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/kollmorgen-give-joint-by-joint-guide-humanoid-motion-robobusiness/\">Kollmorgen to give a joint-by-joint guide to humanoid motion at RoboBusiness<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Unichem acquires Loomia to accelerate entry into the humanoid ‘skin’ market", "source": "Robotics Business Review", "date": "2026-08-18", "url": "https://www.therobotreport.com/unichem-acquires-loomia-accelerate-entry-humanoid-skin-market/", "summary": "<p>Automotive suppliers Unichem and R&#038;Y are working with Loomia to develop tactile sensors for automotive and robotics applications.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/unichem-acquires-loomia-accelerate-entry-humanoid-skin-market/\">Unichem acquires Loomia to accelerate entry into the humanoid &#8216;skin&#8217; market<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Drones With Claws Perch on Arctic Icebergs", "source": "IEEE Spectrum Robotics", "date": "2026-08-18", "url": "https://spectrum.ieee.org/arctic-iceberg-drones", "summary": "<img src=\"https://spectrum.ieee.org/media-library/a-drone-firmly-planted-on-the-steep-slope-of-an-iceberg-after-a-successful-landing.jpg?id=67573301&amp;width=1200&amp;height=800&amp;coordinates=0%2C83%2C0%2C84\" /><br /><br /><p><em><em>This article is part of our exclusive <\/em><\/em><a href=\"https://spectrum.ieee.org/collections/journal-watch/\" target=\"_self\"><em><em>IEEE Journal Watch series<\/em><\/em><\/a><em><em> in partnership with IEEE Xplore.<\/em><\/em><\/p><p>Microspines are one of many ways to enable robots to latch onto surfaces like <a href=\"https://spectrum.ieee.org/microspines-make-it-easy-for-drones-to-perch-on-walls-and-ceilings\" target=\"_self\">walls and ceilings<\/a>. Now roboticists in Canada are using the mini spikes to get drones to land on a more challenging, remote surface: icebergs.<\/p><p>Like a spider, the Ice Dart can land on and latch onto steep, slippery surfaces such as icebergs and glaciers—an increasingly useful capability as activity in the Arctic increases. The drone can grip onto icy slopes of nearly 60 degrees, which is way beyond what most humans could manage without special equipment. <\/p><p>In a recent study, researchers explained how they developed the Ice Dart drone with a special landing gear that absorbs the impact of a hard landing while holding the drone in place with tiny spines that penetrate and grip the ice.<\/p><hr /><p class=\"shortcode-media shortcode-media-youtube\"> <span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span> <\/p><p>Published in <a href=\"https://ieeexplore.ieee.org/abstract/document/11554347\" rel=\"noopener noreferrer\" target=\"_blank
