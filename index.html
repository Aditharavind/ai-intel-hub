t<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"gu2nuedjiuq\"><em>This paper presents the design, fabrication, and flight validation of a flat-packable <a href=\"https://spectrum.ieee.org/foldable-airplane-could-ride-a-cubesat-to-mars-in-2022\" target=\"_blank\">flying wing<\/a> built primarily from corrugated cardboard. The aircraft is manufactured from three laser-cut sheets and assembled through a fold-and-lock architecture that forms load-bearing wing structures with minimal tooling and no permanent fasteners. The full airframe can be assembled in under 15 minutes, demonstrating strong potential for rapid deployment, low-cost logistics, and scalable field use.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://airlab.sutd.edu.sg/\">AIR Lab<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"hukrzo75_ww\">A $14,000 open-source data-collection system that includes beat-down capability.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://github.com/haraduka/mevion\">MEVION<\/a> ]<\/p><p>Thanks, Kento!<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"qzr0rmp2_5w\"><em>Together with Niantic Spatial and Nvidia, [we] can now scan a real deployment site with off-the-shelf hardware, reconstruct it into a photorealistic Gaussian splat, and run massively parallel RL [<a href=\"https://spectrum.ieee.org/ai-institute\" target=\"_blank\">reinforcement learning<\/a>] training. The policies trained in our Gym environment then transfer zero-shot to the real robot and environments they were trained for. This enables faster deployment of more capable and robust policies for the end user.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://flexion.ai/news/niantic-spatial-flexion-and-nvidia-closing-the-sim2real-gap-for-humanoids\">Flexion<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"w2bmy5cnhvs\">I don’t know why, but the version of Tron 2 with the stubby little legs is just adorable.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.limxdynamics.com/en/products/tron2\">LimX Dynamics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"vmgiim6g_fg\">Uh, get a real job already...?<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.pndbotics.com/\">PNDbotics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"xtggy9lrisw\">Well, I guess we can all stop asking what humanoid robots are good for.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://en.engineai.com.cn/\">EngineAI<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"143b_pm77ga\">I think the right thing to do here is only post the disclaimer included with this video: “This film is a conceptual creative production, and certain scenes are presented for demonstration purposes only and do not represent the actual in-store operating process. The final store environment, robot appearance, and functionality are subject to the actual deployment. During actual operations, the robot will autonomously perform only designated preparation steps for specified ice cream products, and its hands will be fitted with protective gloves that comply with applicable food safety requirements.”<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.sharpa.com/pages/north-at-work\">Sharpa<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"h_ztrvhjv8k\"><em><a href=\"https://spectrum.ieee.org/in-the-air-with-ziplines-medical-delivery-drones\" target=\"_blank\">Drone delivery<\/a> is now an essential part of the South West London Pathology (SWLP) modernization agenda. Since February 2026, our highly automated aircraft have been delivering urgent NHS samples across south west London, with service up to 85% faster than ground transport. We are thrilled to be part of this initiative, supporting clinicians in providing timely, effective care for patients and contributing to a greener, more resilient NHS.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://wing.com/news/elevating-healthcare-logistics-wing-apian-nhs-south-west-london-drone-deliveries\">Wing<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"tzpswti20e8\"><em>Take a closer look at what’s next for the Aurora Driver. Designed to move freight farther, faster, and more efficiently, this next generation of the Aurora Driver delivers greater performance, built to last one million miles and cut hardware cost in half. <\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://aurora.tech/newsroom/your-questions-about-our-latest-driverless-launch-answered\">Aurora<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"gj4p0pc6kwc\"><em>How does a robot learn to recognize an object it’s never encountered? In this case, a demo can be worth a thousand words. Short human demonstrations can be used to create fully automated training datasets, sidestepping the prompting limitations that hold back vision-language models. Rather than describing objects with language, the system tracks what a person touches and manipulates during a demo, follows those objects through time, and clusters detections to handle objects merging or splitting apart in the scene. This bypasses a core weakness of VLMs, which struggle to reliably detect unusual or novel objects even with repeated, carefully engineered prompts.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://rai-inst.com/resources/blog/show-dont-tell-detecting-novel-objects-by-watching-human-demonstrations/\">Robotics and AI Institute<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div>"}, {"title": "How time series databases unlock real-time data for robotics", "source": "Robotics Business Review", "date": "2026-07-24", "url": "https://www.therobotreport.com/how-time-series-databases-unlock-real-time-data-for-robotics/", "summary": "<p>Discover how time series databases help robotics teams manage high-volume sensor data, power AI insights, and keep systems running at scale.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/how-time-series-databases-unlock-real-time-data-for-robotics/\">How time series databases unlock real-time data for robotics<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Generalist’s GEN-1 foundation model now supports a range of robot end effectors", "source": "Robotics Business Review", "date": "2026-07-24", "url": "https://www.therobotreport.com/generalists-gen-1-foundation-model-now-supports-a-range-of-robot-end-effectors/", "summary": "<p>By training GEN-1 to work with new hands, Generalist said a single base model can learn sensorimotor policies on different robots.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/generalists-gen-1-foundation-model-now-supports-a-range-of-robot-end-effectors/\">Generalist&#8217;s GEN-1 foundation model now supports a range of robot end effectors<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "AMD unveils Kria module for real-time control, unified memory for robots", "source": "Robotics Business Review", "date": "2026-07-23", "url": "https://www.therobotreport.com/amd-unveils-kria-module-real-time-control-unified-memory-robots/", "summary": "<p>AMD has launched the Ryzen AI Embedded X100 and Kria AI SoM, bringing unified memory and real-time control to challenge NVIDIA in robotics.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/amd-unveils-kria-module-real-time-control-unified-memory-robots/\">AMD unveils Kria module for real-time control, unified memory for robots<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Ropedia raises $22M to scale data collection for training robots", "source": "Robotics Business Review", "date": "2026-07-23", "url": "https://www.therobotreport.com/ropedia-raises-22m-scale-data-collection-training-robots/", "summary": "<p>Ropdeia's HOMIE is a head-mounted device, equipped with a 360º camera view, that captures first-person data for training robots.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/ropedia-raises-22m-scale-data-collection-training-robots/\">Ropedia raises $22M to scale data collection for training robots<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Uber co-founder raises $1.7B for new robotics startup ATOMS", "source": "Robotics Business Review", "date": "2026-07-23", "url": "https://www.therobotreport.com/uber-co-founder-raises-1-7b-for-new-robotics-startup-atoms/", "summary": "<p>Travis Kalanick, the former CEO of Uber, said with ATOMS, he hopes to create physical automation to transform industry.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/uber-co-founder-raises-1-7b-for-new-robotics-startup-atoms/\">Uber co-founder raises $1.7B for new robotics startup ATOMS<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Holiday Robotics raises $105M for its FRIDAY wheeled humanoid", "source": "Robotics Business Review", "date": "2026-07-23", "url": "https://www.therobotreport.com/holiday-robotics-raises-105m-wheeled-humanoid-friday/", "summary": "<p>Holiday's robot features a wheel-based mobile base, an upper body for dexterous manipulation, and hot-swappable batteries.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/holiday-robotics-raises-105m-wheeled-humanoid-friday/\">Holiday Robotics raises $105M for its FRIDAY wheeled humanoid<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "NVIDIA Open Sources First GPU-Accelerated Medical Physics Simulation Framework", "source": "NVIDIA Robotics", "date": "2026-07-22", "url": "https://blogs.nvidia.com/blog/medical-physics-simulation-open-source/", "summary": "Before a healthcare robot can be useful in the real world, it has to learn how the physical world pushes back. Anatomy varies. Instruments bend, press, slip and interact with tissue. Imaging can be noisy or incomplete. And the rare, edge scenarios developers most need to understand don’t appear on schedule. That creates one of [&#8230;]"}, {"title": "Medtronic to launch AI compute platform for the operating room", "source": "The Robot Report", "date": "2026-07-22", "url": "https://www.therobotreport.com/medtronic-launch-ai-compute-platform-operating-room/", "summary": "<p>Touch Surgery bridges pre-operative planning and training, intra-operative tele-mentoring and tele-proctoring, and post-operative insights.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/medtronic-launch-ai-compute-platform-operating-room/\">Medtronic to launch AI compute platform for the operating room<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Report shares the state of physical AI and robotics", "source": "Robotics Business Review", "date": "2026-07-22", "url": "https://www.therobotreport.com/physical-ai-and-robotics/", "summary": "<p>A report looks at how physical AI is increasingly enabling autonomous systems to perceive their environments, make decisions, and act in the real world.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/physical-ai-and-robotics/\">Report shares the state of physical AI and robotics<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "MISUMI Americas releases reshoring report, supports manufacturing training bill", "source": "Robotics Business Review", "date": "2026-07-21", "url": "https://www.therobotreport.com/misumi-americas-releases-reshoring-report-supports-manufacturing-training-bill/", "summary": "<p>MISUMI Americas has examined reshoring of U.S. manufacturing and supported legislation to send workers overseas for training.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/misumi-americas-releases-reshoring-report-supports-manufacturing-training-bill/\">MISUMI Americas releases reshoring report, supports manufacturing training bill<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Friction is key to making better robot world models", "source": "Robotics Business Review", "date": "2026-07-21", "url": "https://www.therobotreport.com/friction-is-key-to-making-better-robot-world-models/", "summary": "<p>Deploying world models in real robotic systems requires a step that receives less attention than the models themselves: conditioning.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/friction-is-key-to-making-better-robot-world-models/\">Friction is key to making better robot world models<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Generative Bionics unveils humanoid robot with full-body tactile sensing", "source": "Robotics Business Review", "date": "2026-07-21", "url": "https://www.therobotreport.com/generative-bionics-unveils-humanoid-robot-with-full-body-tactile-sensing/", "summary": "<p>Generative Bionics said its Gene.01 humanoid is fully sensorized, helping it quickly anticipate human presence and respond.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/generative-bionics-unveils-humanoid-robot-with-full-body-tactile-sensing/\">Generative Bionics unveils humanoid robot with full-body tactile sensing<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Vicarious Surgical officially shutting down", "source": "Robotics Business Review", "date": "2026-07-21", "url": "https://www.therobotreport.com/vicarious-surgical-officially-shutting-down/", "summary": "<p>Vicarious Surgical raised about $300 million in total, most of that from a special purpose acquisition company (SPAC) merger in 2021.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/vicarious-surgical-officially-shutting-down/\">Vicarious Surgical officially shutting down<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "U.K.-based Humanoid secures $152M in Series A funding", "source": "Robotics Business Review", "date": "2026-07-21", "url": "https://www.therobotreport.com/uk-based-humanoid-secures-152m-in-series-a-funding/", "summary": "<p>Humanoid said it has reached a $1.35 billion valuation as it scales its AI-driven industrial robots and expands commercial deployments.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/uk-based-humanoid-secures-152m-in-series-a-funding/\">U.K.-based Humanoid secures $152M in Series A funding<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "AGIBOT unveils four embodied AI products for real-world operations at WAIC", "source": "Robotics Business Review", "date": "2026-07-20", "url": "https://www.therobotreport.com/agibot-unveils-four-embodied-ai-products-real-world-operations-waic/", "summary": "<p>AGIBOT said its demoes and industrial deployments show its progress in turning embodied AI capabilities into repeatable workflows.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/agibot-unveils-four-embodied-ai-products-real-world-operations-waic/\">AGIBOT unveils four embodied AI products for real-world operations at WAIC<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Building robots for unpredictable, infrastructure-free environments", "source": "Robotics Business Review", "date": "2026-07-20", "url": "https://www.therobotreport.com/building-robots-for-unpredictable-infrastructure-free-environments/", "summary": "<p>Real-world robotics success requires building infrastructure-free systems that thrive in unpredictable, harsh outdoor environments.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/building-robots-for-unpredictable-infrastructure-free-environments/\">Building robots for unpredictable, infrastructure-free environments<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "BrainCo demonstrates brain-controlled robot AI platform", "source": "Robotics Business Review", "date": "2026-07-20", "url": "https://www.therobotreport.com/brainco-demonstrates-brain-controlled-robot-ai-platform/", "summary": "<p>During BrainCo's demo, the mind-controlled robotic arm completed tasks that require precision, such as grasping a cup or picking up an apple.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/brainco-demonstrates-brain-controlled-robot-ai-platform/\">BrainCo demonstrates brain-controlled robot AI platform<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}], "embeddedNews": [{"title": "Historical Hack: Henri Griffard’s Steam Injectors", "source": "Hackaday", "date": "2026-08-19", "url": "https://hackaday.com/2026/08/19/historical-hack-henri-griffards-steam-injectors/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"450\" src=\"https://hackaday.com/wp-content/uploads/2026/08/steam-injector-feat.jpg?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>Here&#8217;s a historical hack for you: you have a big, rolling pressurized kettle, also known as a steam locomotive. It needs water to make up for the steam constantly chuff-chuff-chuffing <a class=\"read-more\" href=\"https://hackaday.com/2026/08/19/historical-hack-henri-griffards-steam-injectors/\">&#8230;read more<\/a>"}, {"title": "Smarting Up a Doorbell with Zigbee", "source": "Hackaday", "date": "2026-08-19", "url": "https://hackaday.com/2026/08/19/smarting-up-a-doorbell-with-zigbee/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"452\" src=\"https://hackaday.com/wp-content/uploads/2026/08/Klingelanlage-ESP32-H2-Zero-scaled-1-e1787037414977.webp?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>Once upon a time a doorbell was little more than a button, a transformer, and a bell tucked somewhere around the house. These days, they get a little bit fancier. <a class=\"read-more\" href=\"https://hackaday.com/2026/08/19/smarting-up-a-doorbell-with-zigbee/\">&#8230;read more<\/a>"}, {"title": "Hackaday Europe 2026: The 1-Bit CPU That Ran Factories", "source": "Hackaday", "date": "2026-08-19", "url": "https://hackaday.com/2026/08/19/hackaday-europe-2026-the-1-bit-cpu-that-ran-factories/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"533\" src=\"https://hackaday.com/wp-content/uploads/2026/08/DSC09964_featured.png?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>Powered machinery started the industrial revolution, and it was automation that kicked it up another notch in the 20th century. The ability for machines to make things by themselves spurred <a class=\"read-more\" href=\"https://hackaday.com/2026/08/19/hackaday-europe-2026-the-1-bit-cpu-that-ran-factories/\">&#8230;read more<\/a>"}, {"title": "Simple DIY STM32 Oscilloscope Project", "source": "Hackaday", "date": "2026-08-19", "url": "https://hackaday.com/2026/08/19/simple-diy-stm32-oscilloscope-project/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"494\" src=\"https://hackaday.com/wp-content/uploads/2026/08/stm32_oscilloscope_F207_nucleo_board_bttlab_youtube.jpg?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>In part one of what is intended to be a series on developing an STM32-based oscilloscope, [BTTLab] demonstrates a how to use the built-in ADC of an STM32F207 MCU to <a class=\"read-more\" href=\"https://hackaday.com/2026/08/19/simple-diy-stm32-oscilloscope-project/\">&#8230;read more<\/a>"}, {"title": "Building Custom Backyard Solar Lights", "source": "Hackaday", "date": "2026-08-19", "url": "https://hackaday.com/2026/08/19/building-custom-backyard-solar-lights/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"449\" src=\"https://hackaday.com/wp-content/uploads/2026/08/4-e1787036636172.jpg?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>In this modern age, if you want a truly swish garden that makes your friends sad when they visit, you need good lighting. [technocraftStudio] has been working on just such a <a class=\"read-more\" href=\"https://hackaday.com/2026/08/19/building-custom-backyard-solar-lights/\">&#8230;read more<\/a>"}, {"title": "Joy-Cons Plus WiiMotes Make for Switch 2 Wii-Cons", "source": "Hackaday", "date": "2026-08-19", "url": "https://hackaday.com/2026/08/18/joy-cons-plus-wiimotes-make-for-switch-2-wii-cons/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"460\" src=\"https://hackaday.com/wp-content/uploads/2026/08/wiimote_joycon_combo_kouzex_youtube.jpg?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>As popular as the Nintendo Switch and its sequel are, it&#8217;s hard to argue that its click-on Joy-Con controllers are ergonomic, barring you having very uniquely shaped hands. This thought <a class=\"read-more\" href=\"https://hackaday.com/2026/08/18/joy-cons-plus-wiimotes-make-for-switch-2-wii-cons/\">&#8230;read more<\/a>"}, {"title": "Compress Links For Optimal QR Codes", "source": "Hackaday", "date": "2026-08-19", "url": "https://hackaday.com/2026/08/18/compress-links-for-optimal-qr-codes/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"450\" src=\"https://hackaday.com/wp-content/uploads/2026/08/hammr-featured.jpg?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>Link shorteners have been a staple of the online world for over two decades now, but they&#8217;ve got some issues&#8211; for one thing, it&#8217;s totally non-transparent where the link actually <a class=\"read-more\" href=\"https://hackaday.com/2026/08/18/compress-links-for-optimal-qr-codes/\">&#8230;read more<\/a>"}, {"title": "Pine64 hits pause on Linux devices due to RAM and eMMC shortage/high prices", "source": "CNX Software", "date": "2026-08-19", "url": "https://www.cnx-software.com/2026/08/19/pine64-hits-pause-on-linux-devices-due-to-ram-and-emmc-shortage-high-prices/", "summary": "<div><img alt=\"Pine64 SBC pause\" class=\"attachment-medium size-medium wp-post-image\" height=\"463\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/08/Pine64-SBC-pause-720x463.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>While some companies keep increasing prices, the Pine64 community has now announced they don&#8217;t intend to manufacture Linux devices due to the current RAM and eMMC flash shortage and related high prices. Pine64 started with the launch of the Pine A64 development board in 2015, and since then they have launched more Arm and RISC-V Linux SBCs, Linux smartphones, and Linux tablets and e-Readers. We used to get several announcements per year, but this year so far, we only covered one: the Pine64 PineVoice. But it&#8217;s not a Linux device, and instead, a smart speaker based on a BL602 RISC-V microcontroller. Here&#8217;s the full (unedited) announcement published on Telegram, which you should also find on other Pine64 channels: Hi everyone! Just a quick reminder that due to the current DRAM/eMMC shortage, there isn&#8217;t any plans to continue producing more Linux devices in the near future. Whether production continues or not [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/08/19/pine64-hits-pause-on-linux-devices-due-to-ram-and-emmc-shortage-high-prices/\">Pine64 hits pause on Linux devices due to RAM and eMMC shortage/high prices<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "PwrBlock 323 – A USB-C PD programmable power supply for automated test fixtures (Crowdfunding)", "source": "CNX Software", "date": "2026-08-19", "url": "https://www.cnx-software.com/2026/08/19/pwrblock-323-usb-c-pd-programmable-power-supply-for-automated-test-fixtures/", "summary": "<div><img alt=\"Everypin PwrBlock 323 USB C PD programmable power supply for automated test fixtures\" class=\"attachment-medium size-medium wp-post-image\" height=\"480\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/08/Everypin-PwrBlock-323-USB-C-PD-programmable-power-supply-for-automated-test-fixtures-720x480.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Finland-based Everypin has introduced the PwrBlock 323, a programmable USB-C PD power supply designed specifically for automated test fixtures. It can provide 1 to 32V at up to 3A, with up to 92W output from a 100W USB-C PD source, and supports software-controlled power switching, voltage and current measurement, and power cycling for a device under test (DUT). The company highlights that the PwrBlock 323 can be mounted inside a test jig or stand using its mounting points and pin headers to control and power the DUT directly as part of the automated test sequence. It adds one more option to USB-C programmable lab power supplies such as Ampisu, PocketPD, and BenchVolt PD, PwrBlock 323 specifications: MCU – STMicro STM32G0C1CEU Arm Cortex-M0+ microcontroller USB 2x USB Type-C ports for power and control 10-pin IDC USB control connector (connects to a host computer or test controller over USB) Expansion – 40-pin [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/08/19/pwrblock-323-usb-c-pd-programmable-power-supply-for-automated-test-fixtures/\">PwrBlock 323 &#8211; A USB-C PD programmable power supply for automated test fixtures (Crowdfunding)<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Raspberry Pi Compute Module 5 gets an official programming jig", "source": "CNX Software", "date": "2026-08-19", "url": "https://www.cnx-software.com/2026/08/19/raspberry-pi-compute-module-5-gets-an-official-programming-jig/", "summary": "<div><img alt=\"Raspberry Pi Compute Module 5 Programming Jig\" class=\"attachment-medium size-medium wp-post-image\" height=\"480\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/08/Raspberry-Pi-Compute-Module-5-Programming-Jig-720x480.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>The Raspberry Pi Compute Module 5 Programming Jig is a single-head provisioning system designed to easily flash an OS to the Raspberry Pi CM5 without a carrier board. The jig connects to the provisioning network via Ethernet or Wi-Fi and also features a second Ethernet port for the Compute Module. The CM5 is kept in place by a mechanical clamping mechanism, and the jig relies on pogo pins to interface with the Compute Module. Specifications: Features Provisioning head Pogo pin interface Mechanical clamping mechanism Compatible with Raspberry Pi Compute Module 5 Connectivity JIG ETH &#8211; Gigabit Ethernet RJ45 jack for connecting the jig to the network; note DUT ETH &#8211; Gigabit Ethernet RJ45 jack for connecting the CM5 to the network WiFi with external antenna, as an alternative to JIG ETH USB-C boot connector to connect to the host Misc &#8211; LED status indicators Power &#8211; 12V/2A (24W) DC via power [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/08/19/raspberry-pi-compute-module-5-gets-an-official-programming-jig/\">Raspberry Pi Compute Module 5 gets an official programming jig<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "NXP MCX A5 Cortex-M33 MCU family supports 10BASE-T1S Single Pair Ethernet and Post-Quantum Cryptography", "source": "CNX Software", "date": "2026-08-19", "url": "https://www.cnx-software.com/2026/08/19/nxp-mcx-a5-cortex-m33-mcu-family-supports-10base-t1s-single-pair-ethernet-and-post-quantum-cryptography/", "summary": "<div><img alt=\"NXP MCX A5 Series Cortex M33 MCUs\" class=\"attachment-medium size-medium wp-post-image\" height=\"480\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/08/NXP-MCX-A5-Series-Cortex-M33-MCUs-720x480.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>NXP has introduced the MCX A5 family of Cortex-M33 MCUs, which features a 10/100Mbps Ethernet MAC and an integrated 10BASE-T1S Single Pair Ethernet digital PHY. It targets industrial and networking applications such as controllers, PLCs, remote I/O, building and energy management systems, and other connected edge devices. The MCUs run at up to 240 MHz and feature up to 2 MB dual-bank Flash and 640 KB SRAM, along with multiple communication interfaces and analog peripherals. Security features include an EdgeLock accelerator, secure boot with PQC hybrid support, secure firmware updates, lifecycle management, secure debug, external Flash encryption, and anti-tamper monitoring. NXP MCX A5 Series (MCXA577) specifications: MCU Core Arm Cortex-M33 core clocked at up to 240 MHz Includes FPU, DSP, MPU, and TrustZone support Integrated SmartDMA co-processor for efficient data handling Delivers 988.8 CoreMark (4.12 CoreMark/MHz) Memory and Storage Up to 2 MB dual-bank Flash with ECC and read-while-write support [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/08/19/nxp-mcx-a5-cortex-m33-mcu-family-supports-10base-t1s-single-pair-ethernet-and-post-quantum-cryptography/\">NXP MCX A5 Cortex-M33 MCU family supports 10BASE-T1S Single Pair Ethernet and Post-Quantum Cryptography<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Advanced RF Systems Power Next-Gen Mil-Aero Comms", "source": "Embedded.com", "date": "2026-08-19", "url": "https://www.embedded.com/advanced-rf-systems-power-next-gen-mil-aero-comms/", "summary": "<p>The radio-frequency (RF) industry, relying on established technologies for many years, is entering a significant phase of growth, driving the need for advanced solutions. Rising investment in defense and security systems and the expansion of the space economy are the two key drivers behind this growth. On the defense side, there is the demand for [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/advanced-rf-systems-power-next-gen-mil-aero-comms/\">Advanced RF Systems Power Next-Gen Mil-Aero Comms<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "Aetina Introduces Palm-Sized In-Vehicle Edge AI Platforms", "source": "Embedded.com", "date": "2026-08-19", "url": "https://www.embedded.com/aetina-introduces-palm-sized-in-vehicle-edge-ai-platforms/", "summary": "<p>Aetina Corporation introduced the DeviceEdge AIE-VN34/44 and AIE-VO24/34, its first palm-sized in-vehicle edge AI systems. Based on the Nvidia Jetson Orin NX and Jetson Orin Nano modules, the platforms provide up to 100 TOPS and 67 TOPS of AI performance, respectively, and support four GMSL2 camera connections. The systems target smart transportation, autonomous mobile robots [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/aetina-introduces-palm-sized-in-vehicle-edge-ai-platforms/\">Aetina Introduces Palm-Sized In-Vehicle Edge AI Platforms<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "UK Space Agency funds infrastructure projects using satellite comms", "source": "Electronics Weekly", "date": "2026-08-19", "url": "https://www.electronicsweekly.com/news/business/uk-space-agency-funds-infrastructure-projects-using-satellite-comms-2026-08/", "summary": "<p>The UK Space Agency is funding 16 projects through a £13 million government investment to improve the efficiency and use of satellite communications. It is looking to both boost connectivity [&#8230;]<\/p>\n<p>The post <a href=\"https://www.electronicsweekly.com/news/business/uk-space-agency-funds-infrastructure-projects-using-satellite-comms-2026-08/\">UK Space Agency funds infrastructure projects using satellite comms<\/a> appeared first on <a href=\"https://www.electronicsweekly.com\">Electronics Weekly<\/a>.<\/p>"}, {"title": "Starlink Keeps Expanding", "source": "Electronics Weekly", "date": "2026-08-19", "url": "https://www.electronicsweekly.com/blogs/mannerisms/telecoms/starlink-keeps-expanding-2026-08/", "summary": "<p>As of August 2026, Starlink covered almost all of South America and had launched official service in more than 25 African countries. Starlink recently launched in countries  Bolivia, the Democratic [&#8230;]<\/p>\n<p>The post <a href=\"https://www.electronicsweekly.com/blogs/mannerisms/telecoms/starlink-keeps-expanding-2026-08/\">Starlink Keeps Expanding<\/a> appeared first on <a href=\"https://www.electronicsweekly.com\">Electronics Weekly<\/a>.<\/p>"}, {"title": "How thermal constraints are changing the semiconductor design process", "source": "Electronics Weekly", "date": "2026-08-19", "url": "https://www.electronicsweekly.com/blogs/viewpoints/how-thermal-constraints-are-changing-the-semiconductor-design-process-2026-08/", "summary": "<p>Cooling is one of the clearest illustration of how semiconductor design teams need to work together. There is a running joke in engineering circles that the last time an electrical [&#8230;]<\/p>\n<p>The post <a href=\"https://www.electronicsweekly.com/blogs/viewpoints/how-thermal-constraints-are-changing-the-semiconductor-design-process-2026-08/\">How thermal constraints are changing the semiconductor design process<\/a> appeared first on <a href=\"https://www.electronicsweekly.com\">Electronics Weekly<\/a>.<\/p>"}, {"title": "Photonic integrated circuits: the next frontier of advanced optoelectronic devices", "source": "Electronics Weekly", "date": "2026-08-19", "url": "https://www.electronicsweekly.com/news/business/photonic-integrated-circuits-the-next-frontier-of-advanced-optoelectronic-devices-2026-08/", "summary": "<p>Design, simulation and manufacturing advances continue to push photonic integrated circuits (PICs) to smaller sizes, which provide greater capabilities per chip, writes Liam Critchley. Advanced optics and photonics where light [&#8230;]<\/p>\n<p>The post <a href=\"https://www.electronicsweekly.com/news/business/photonic-integrated-circuits-the-next-frontier-of-advanced-optoelectronic-devices-2026-08/\">Photonic integrated circuits: the next frontier of advanced optoelectronic devices<\/a> appeared first on <a href=\"https://www.electronicsweekly.com\">Electronics Weekly<\/a>.<\/p>"}, {"title": "Microchip advances PolarFire FPGA Ethernet Sensor Bridge with Rev 2.0", "source": "Electronics Weekly", "date": "2026-08-19", "url": "https://www.electronicsweekly.com/news/products/sensors-products/microchip-advances-polarfire-fpga-ethernet-sensor-bridge-with-rev-2-0-2026-08/", "summary": "<p>Microchip Technology has released Revision 2.0 of its PolarFire FPGA Ethernet Sensor Bridge. This is a smaller, production-ready board for sensor integration using NVIDIA HSB (Holoscan Sensor Bridge) technology. The [&#8230;]<\/p>\n<p>The post <a href=\"https://www.electronicsweekly.com/news/products/sensors-products/microchip-advances-polarfire-fpga-ethernet-sensor-bridge-with-rev-2-0-2026-08/\">Microchip advances PolarFire FPGA Ethernet Sensor Bridge with Rev 2.0<\/a> appeared first on <a href=\"https://www.electronicsweekly.com\">Electronics Weekly<\/a>.<\/p>"}, {"title": "New CEO for SIA", "source": "Electronics Weekly", "date": "2026-08-19", "url": "https://www.electronicsweekly.com/news/business/new-ceo-for-sia-2026-08/", "summary": "<p>The SIA has appointed Michael Robbins (pictured) to be its president and CEO as from 1 October. Robbins succeeds John Neuffer, who announced his departure in January following nearly 12 [&#8230;]<\/p>\n<p>The post <a href=\"https://www.electronicsweekly.com/news/business/new-ceo-for-sia-2026-08/\">New CEO for SIA<\/a> appeared first on <a href=\"https://www.electronicsweekly.com\">Electronics Weekly<\/a>.<\/p>"}, {"title": "Cerebras launches CS-4 rack", "source": "Electronics Weekly", "date": "2026-08-19", "url": "https://www.electronicsweekly.com/news/business/cerebras-launches-cs-4-rack-2026-08/", "summary": "<p>Yesterday Cerebras, the loss-making waferscale chip developer, launched a new rack-based system called CS-4 which increases the  performance of its existing silicon by running more power through it. Cerebras has [&#8230;]<\/p>\n<p>The post <a href=\"https://www.electronicsweekly.com/news/business/cerebras-launches-cs-4-rack-2026-08/\">Cerebras launches CS-4 rack<\/a> appeared first on <a href=\"https://www.electronicsweekly.com\">Electronics Weekly<\/a>.<\/p>"}, {"title": "Xiaomi’s Q2 profit halved", "source": "Electronics Weekly", "date": "2026-08-19", "url": "https://www.electronicsweekly.com/news/business/xiaomis-q2-profit-halved-2026-08/", "summary": "<p>Xiaomi’s Q2 profit of $923 million was nearly half that of Q2 2025, as the smartphone vendor and EV manufacturer was hit by the double whammy of rising component costs [&#8230;]<\/p>\n<p>The post <a href=\"https://www.electronicsweekly.com/news/business/xiaomis-q2-profit-halved-2026-08/\">Xiaomi’s Q2 profit halved<\/a> appeared first on <a href=\"https://www.electronicsweekly.com\">Electronics Weekly<\/a>.<\/p>"}, {"title": "Velaura AI hits $1bn valuation", "source": "Electronics Weekly", "date": "2026-08-19", "url": "https://www.electronicsweekly.com/news/business/velaura-ai-raises-2026-08/", "summary": "<p>Velaura AI, focused on energy-efficient computing infrastructure and physical AI, has raised $110 million in Series A financing, bringing its total valuation to more than $1 billion. Investors were Seligman [&#8230;]<\/p>\n<p>The post <a href=\"https://www.electronicsweekly.com/news/business/velaura-ai-raises-2026-08/\">Velaura AI hits $1bn valuation<\/a> appeared first on <a href=\"https://www.electronicsweekly.com\">Electronics Weekly<\/a>.<\/p>"}, {"title": "Q2 revenues of Top 5 NAND producers rose 77% QoQ", "source": "Electronics Weekly", "date": "2026-08-19", "url": "https://www.electronicsweekly.com/news/business/q2-revenues-of-top-5-nand-producers-rose-77-qoq-2026-08/", "summary": "<p>The Q2 revenues of the top five NAND producers rose 76% QoQ to $68.7 billion, reported TrendForce. Suppliers are generally prioritising capex  on DRAM and HBM, limiting new NAND Flash [&#8230;]<\/p>\n<p>The post <a href=\"https://www.electronicsweekly.com/news/business/q2-revenues-of-top-5-nand-producers-rose-77-qoq-2026-08/\">Q2 revenues of Top 5 NAND producers rose 77% QoQ<\/a> appeared first on <a href=\"https://www.electronicsweekly.com\">Electronics Weekly<\/a>.<\/p>"}, {"title": "Google Chrome web browser for 64-bit Arm Linux and tested on Pi 5", "source": "Adafruit", "date": "2026-08-19", "url": "https://blog.adafruit.com/2026/08/19/google-chrome-web-browser-for-64-bit-arm-linux-and-tested-on-pi-5/", "summary": "Google Chrome web browser is now available for 64-bit Arm Linux, and CNX quickly tested it with Raspberry Pi OS on a Raspberry Pi 5 2GB SBC. The open-source Google Chromium web browser has been available for Arm Linux for years, but it lacks some features such as account sync, out-of-the-box DRM support, and automatic [&#8230;]"}, {"title": "A true telnet BBS hosted on a Casio calculator", "source": "Adafruit", "date": "2026-08-19", "url": "https://blog.adafruit.com/2026/08/19/a-true-telnet-bbs-hosted-on-a-casio-calculator/", "summary": "Ian is seemingly doing the impossible: hosting a bulletin board service (BBS) on a Casio VX-4. About a eight weeks ago I had virtually no interest in calculators. Blank, dull, tedious-looking objects that remind me of long, arduous rainy afternoons in 1980’s/1990’s school maths classes. Fast forward to August 14th, 2026 and I now own [&#8230;]"}, {"title": "Unearthing a 31 year old Easter egg in Ecco the Dolphin", "source": "Adafruit", "date": "2026-08-19", "url": "https://blog.adafruit.com/2026/08/19/unearthing-a-31-year-old-easter-egg-in-ecco-the-dolphin/", "summary": "The Rings of Saturn blog examines the PC version of Ecco the Dolphin. This game is adapted from the 1993 Sega CD version of Ecco, which is an enhanced version of the 1992 Sega Genesis original. There’s a full-featured debug mode cheat for the console editions. Among other things, it lets you skip stages and [&#8230;]"}, {"title": "RISC-V: They should have known better", "source": "Adafruit", "date": "2026-08-19", "url": "https://blog.adafruit.com/2026/08/19/risc-v-they-should-have-known-better/", "summary": "Dmitry Grinberg on Dmitry.GR is often asked to explain a distaste for RISC-V. A recent post lays it all out on the table. I am often asked to explain my distaste for RISC-V and I often find myself explaining it piecewise. The reactions are often of the form &#8220;you just do not understand the brilliance [&#8230;]"}, {"title": "PicoCamera: An Arduino-compatible camera library for the RP2040 / RP2350", "source": "Adafruit", "date": "2026-08-19", "url": "https://blog.adafruit.com/2026/08/19/picocamera-an-arduino-compatible-camera-library-for-the-rp2040-rp2350/", "summary": "PicoCamera is an Arduino-compatible camera library for the RP2040 / RP2350, featuring an esp32-camera aligned API and broad sensor support, such as OV2640 OV3660 and OV7670. The API aligned with esp32-camera (esp_ prefix becomes pico_), and is based on PIO + DMA capture. For sensor controls (sensor-&#62;set_vflip etc.), OV2640 is fairly complete (vflip/hmirror/brightness/contrast/saturation/white balance/exposure/effects/quality&#8230;); OV3660 [&#8230;]"}, {"title": "Common Lisp for the Amiga (CL-Amiga)", "source": "Adafruit", "date": "2026-08-19", "url": "https://blog.adafruit.com/2026/08/19/common-lisp-for-the-amiga-cl-amiga/", "summary": "Manfred Bergmann has created CL-Amiga, or Clamiga for short. It is a Common Lisp implementation built for the Amiga family &#8212; classic AmigaOS 3 on 68k and MorphOS as a fully native PPC build, AROS and AmigaOS 4 may be to come &#8212; but it also runs on macOS and Linux. Common Lisp is one [&#8230;]"}, {"title": "Cyber Trace Pad", "source": "Adafruit", "date": "2026-08-19", "url": "https://blog.adafruit.com/2026/08/19/cyber-trace-pad/", "summary": "Cyber Trace Pad is a new product by SuiLab. This LED gadget features a grid of 144 LEDs. When you touch the touchpad area, the LEDs at the top will light up according to where you touched. Additionally, performing specific actions will activate special LED motions. There are a total of 9 special motions in [&#8230;]"}, {"title": "Tutorial: Glow Up Your Festival Coat with WLED", "source": "Adafruit", "date": "2026-08-19", "url": "https://blog.adafruit.com/2026/08/19/tutorial-glow-up-your-festival-coat-with-wled/", "summary": "Glow up your festival wardrobe with programmable LEDs! In this new tutorial from Erin St Blaine, learn how to add colorful, animated lighting to a faux fur coat using WLED. The fur trim and oversized cuffs become glowing canvases for colorful animations, sound-reactive effects, and custom patterns. Different sections of the coat can run their [&#8230;]"}, {"title": "Resources for designing user interfaces", "source": "Adafruit", "date": "2026-08-19", "url": "https://blog.adafruit.com/2026/08/19/resources-for-designing-user-interfaces/", "summary": "Unsung writes that developer Matt Sephton and others compiled many of Apple’s human interface guidelines, starting from 1980 through 2014, including some goodies like early drafts, NeXT, Newton, and so on. Additional design lists are presented &#8211; if you&#8217;d like some good links to compiled resources, see the post here."}, {"title": "An open-source emulator + analysis toolkit for Nokia DCT3 phones", "source": "Adafruit", "date": "2026-08-19", "url": "https://blog.adafruit.com/2026/08/19/an-open-source-emulator-analysis-toolkit-for-nokia-dct3-phones/", "summary": "&#160; Nokia DCT3 Emulator is an open-source emulator and architectural-analysis toolkit for Nokia DCT3-era phones — the 3310, 3210, 3410, 5210, 6210, 6250, 7110, 8210, 8250, 8810, 8850 and their siblings. It boots real firmware in the browser and in a native SDL GUI, faithfully modelling the MAD2 platform ASIC, the CCONT power controller, the [&#8230;]"}, {"title": "Unexpected Maker FeatherS31", "source": "Adafruit", "date": "2026-08-19", "url": "https://blog.adafruit.com/2026/08/19/unexpected-maker-feathers31/", "summary": "Unexpected Maker has previewed a working FeatherS31 board based on the new Espressif ESP32-S31. Unfortunately, there are a few holes in ESP-IDF S31 support right now &#8211; some will get filled, and some likely won&#8217;t 🙁 Biggest show stopper right now is this (ESP32-S31 missing USB (OTG) CDC Console support). See the post on X/Twitter."}, {"title": "Graft gives your coding agent a map of your codebase", "source": "Adafruit", "date": "2026-08-19", "url": "https://blog.adafruit.com/2026/08/19/graft-gives-your-coding-agent-a-map-of-your-codebase/", "summary": "Here&#8217;s something that may sound familiar if you&#8217;ve been coding with an AI assistant. Every time you start a new session, the agent begins blind. It greps for a term, opens a file, follows an import, backs out, and tries again, rebuilding a picture of a codebase it already mapped an hour ago and then [&#8230;]"}, {"title": "Waveshare PiRack-M6F 6-node rack unit for Raspberry Pi 4/5 brings all ports to the front", "source": "CNX Software", "date": "2026-08-18", "url": "https://www.cnx-software.com/2026/08/18/waveshare-pirack-m6f-6-node-rack-unit-for-raspberry-pi-4-5-brings-all-ports-to-the-front/", "summary": "<div><img alt=\"Waveshare PiRack M6F multi-node server cluster kit raspberry pi 4/5\" class=\"attachment-medium size-medium wp-post-image\" height=\"440\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/08/Waveshare-PiRack-M6F-multi-node-server-cluster-kit-raspberry-pi-4-5-720x440.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Waveshare PiRack-M6F is a multi-node server cluster kit for Raspberry Pi 4/5 designed for 10-inch 2U racks and supporting up to six Model B SBCs with all ports brought to the front panel. We wrote about rack mounts for Raspberry Pi SBCs before with products such as KKSB 10-inch and 19-inch rack panels and MyElectronics&#8217; 19-inch 2U &#38; 3U rack mounts, but those are mostly mechanical solutions. The PiRack-M6F adds some add-on boards to bring all Raspberry Pi ports to the front, add a debug connector (Pi 5 only), and a screw terminal at the back for 5V power. It also supports HAT and add-on boards, for instance, to add PoE support. Waveshare PiRack-M6F kit content and highlights: PiRack-M6F aluminum alloy rack with 2U height mounting space Designed for 6x Raspberry Pi 4/5 Dimensions &#8211; Fits in 254 x 88 x 85 mm volume 6x Pi 5 Connector Adapter (D) [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/08/18/waveshare-pirack-m6f-6-node-rack-unit-for-raspberry-pi-4-5-brings-all-ports-to-the-front/\">Waveshare PiRack-M6F 6-node rack unit for Raspberry Pi 4/5 brings all ports to the front<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "LILYGO T-Echo Lite Kit adds a keyboard shield to the nrRF52840-based ePaper LoRa and GPS development board", "source": "CNX Software", "date": "2026-08-18", "url": "https://www.cnx-software.com/2026/08/18/lilygo-t-echo-lite-kit-adds-a-keyboard-shield-to-the-nrrf52840-based-epaper-lora-and-gps-development-board/", "summary": "<div><img alt=\"LILYGO T-Echo Lite Kit\" class=\"attachment-medium size-medium wp-post-image\" height=\"540\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/08/LILYGO-T-Echo-Lit-Kit-720x540.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>LILYGO T-Echo Lite Kit is a Nordic nRF52840-based LoRa + GPS development kit with a built-in keyboard that enables direct off-grid communication without a smartphone. The kit is not entirely new since it&#8217;s based on the T-Echo Lite devkit introduced last year, to which the company has now added a keyboard shield with backlit alphanumeric keys, audio support via a 3.5mm audio jack and a built-in speaker, and a vibration motor. LILYGO T-Echo Lite Kit specifications: LILYGO T-Echo Lite Core module SoC – Nordic Semiconductor nRF52840 CPU – 32-bit Arm Cortex-M4F microcontroller @ 64 MHz Memory and storage – 1 MB Flash, 256 KB RAM Wireless – Bluetooth 5, Thread, ANT, Bluetooth Mesh, 802.15.4 (Zigbee), 2.4 GHz proprietary LoRa transceiver – Semtech SX1262 with global coverage support: 433 MHz, 868 MHz, 915 MHz, 923 MHz Power management circuitry Display – 1.22-inch SPI e-paper display with 192 x 176 resoltion (GDEM0122T61) [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/08/18/lilygo-t-echo-lite-kit-adds-a-keyboard-shield-to-the-nrrf52840-based-epaper-lora-and-gps-development-board/\">LILYGO T-Echo Lite Kit adds a keyboard shield to the nrRF52840-based ePaper LoRa and GPS development board<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "USBridge-KVM 2.0 – An open-source IP-KVM with BIOS access over SSH, OCR, and AI support (Crowdfunding)", "source": "CNX Software", "date": "2026-08-18", "url": "https://www.cnx-software.com/2026/08/18/usbridge-kvm-2-0-an-open-source-ip-kvm-with-bios-access-over-ssh-ocr-and-ai-support/", "summary": "<div><img alt=\"USBridge KVM 2.0 device only\" class=\"attachment-medium size-medium wp-post-image\" height=\"480\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/08/USBridge-KVM-2.0-device-only-720x480.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>USBridge-KVM 2.0 is a compact open-source AI-enabled IP-KVM designed for remote management and troubleshooting of servers and PCs, including systems that are unresponsive or have not yet booted. It provides out-of-band BIOS access, remote display and input control, virtual media mounting, and hardware power management. Built around a Radxa Zero 3W single board computer, it also features a 240×240 IPS display, Wi-Fi 6 connectivity, two USB Type-C ports, a Micro HDMI video output (loop), and a MicroSD card slot. It supports hardware UVC video capture up to 1080p and uses Moonlight streaming to achieve 25–50 ms low-latency remote access. One of the most notable features is the BIOS-in-Terminal, which uses offline OCR to convert BIOS and pre-boot screens into text accessible over SSH. USBridge-KVM 2.0 specifications: Main SBC &#8211; Radxa Zero 3W with Rockchip RK3566, 1-2GB LPDDR4X RAM, and MicroSD storage for the OS and Btrfs snapshots Display &#8211; 240&#215;240 IPS [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/08/18/usbridge-kvm-2-0-an-open-source-ip-kvm-with-bios-access-over-ssh-ocr-and-ai-support/\">USBridge-KVM 2.0 – An open-source IP-KVM with BIOS access over SSH, OCR, and AI support (Crowdfunding)<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "BrainChip, Orama.AOI Target AI-Based Industrial Defect Detection", "source": "Embedded.com", "date": "2026-08-18", "url": "https://www.embedded.com/brainchip-orama-aoi-target-ai-based-industrial-defect-detection/", "summary": "<p>BrainChip Inc. has partnered with Atlanta-based Orama.AOI to develop AI-based automated optical inspection solutions using BrainChip's Akida neuromorphic AI platform. Orama.AOI has retrained and optimized Akida models using its industrial inspection datasets, demonstrating the platform's application to production-oriented defect detection. Orama.AOI provides AI-powered automated optical inspection technology for industrial applications with current use cases including [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/brainchip-orama-aoi-target-ai-based-industrial-defect-detection/\">BrainChip, Orama.AOI Target AI-Based Industrial Defect Detection<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "Stackpole’s RNCQ Thin Film Resistors Target High-Frequency Communications Infrastructure", "source": "EE Journal", "date": "2026-08-18", "url": "https://www.eejournal.com/industry_news/stackpoles-rncq-thin-film-resistors-target-high-frequency-communications-infrastructure/", "summary": "Stackpole Electronics’ RNCQ high-frequency thin film chip resistors provide predictable performance for communications infrastructure operating above 1 GHz, where the parasitic effects of conventional resistors can significantly impact circuit performance. The RNCQ Series is designed for RF and microwave applications, with frequency capability up to 70 GHz for the 0201 size and 50 GHz for &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/stackpoles-rncq-thin-film-resistors-target-high-frequency-communications-infrastructure/\">Read More &#8594;<span class=\"screen-reader-text\"> \"Stackpole’s RNCQ Thin Film Resistors Target High-Frequency Communications Infrastructure\"<\/span><\/a>"}, {"title": "Rubicon Professional Services Surpasses One Gigawatt Of Battery Energy Storage Capacity As AI Accelerates Data Center Demand", "source": "EE Journal", "date": "2026-08-18", "url": "https://www.eejournal.com/industry_news/rubicon-professional-services-surpasses-one-gigawatt-of-battery-energy-storage-capacity-as-ai-accelerates-data-center-demand/", "summary": "As artificial intelligence (AI) fuels unprecedented demand for data centers and resilient electrical infrastructure, Rubicon Professional Services (RPS), a leading provider of engineering, procurement, and construction services for data centers and critical facilities, today announced it has surpassed one gigawatt (1 GW) of installed battery energy storage capacity across projects nationwide, reinforcing the company&#8217;s role as one &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/rubicon-professional-services-surpasses-one-gigawatt-of-battery-energy-storage-capacity-as-ai-accelerates-data-center-demand/\">Read More &#8594;<span class=\"screen-reader-text\"> \"Rubicon Professional Services Surpasses One Gigawatt Of Battery Energy Storage Capacity As AI Accelerates Data Center Demand\"<\/span><\/a>"}, {"title": "Panasonic Thick Film Current Sense Resistors Enable Potential Cost Savings Up to 50% as an Alternative to Metal Shunts", "source": "EE Journal", "date": "2026-08-18", "url": "https://www.eejournal.com/industry_news/panasonic-thick-film-current-sense-resistors-enable-potential-cost-savings-up-to-50-as-an-alternative-to-metal-shunts/", "summary": "As AI infrastructure, industrial robotics, battery management systems (BMS) and advanced power electronics drive increasing power density and efficiency requirements, accurate current sensing is becoming increasingly critical. According to market analyses, the global current-sense resistor market is projected to expand at a CAGR of approximately 6% through the coming years, reflecting growing demand across battery management, motor control and &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/panasonic-thick-film-current-sense-resistors-enable-potential-cost-savings-up-to-50-as-an-alternative-to-metal-shunts/\">Read More &#8594;<span class=\"screen-reader-text\"> \"Panasonic Thick Film Current Sense Resistors Enable Potential Cost Savings Up to 50% as an Alternative to Metal Shunts\"<\/span><\/a>"}, {"title": "Pixus Releases New MIL Rugged N310 Software Defined Radio With Extended Temperature Options", "source": "EE Journal", "date": "2026-08-18", "url": "https://www.eejournal.com/industry_news/pixus-releases-new-mil-rugged-n310-software-defined-radio-with-extended-temperature-options/", "summary": "Pixus Technologies, a provider of embedded computing and chassis solutions, has announced a MIL Ruggedized NI software defined radio (SDR) with extended temperature options. Now a part of Emerson, the NI SDR is based on the family of Ettus brand Universal Software Radio Peripherals (USRPs). Pixus ruggedizes various versions of NI SDRs in IP67 outdoor &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/pixus-releases-new-mil-rugged-n310-software-defined-radio-with-extended-temperature-options/\">Read More &#8594;<span class=\"screen-reader-text\"> \"Pixus Releases New MIL Rugged N310 Software Defined Radio With Extended Temperature Options\"<\/span><\/a>"}, {"title": "Self-Publishing a Book Is Easier (and Harder) Than You Think (Part 1)", "source": "EE Journal", "date": "2026-08-18", "url": "https://www.eejournal.com/article/self-publishing-a-book-is-easier-and-harder-than-you-think-part-1/", "summary": "<img alt=\"\" class=\"webfeedsFeaturedVisual wp-post-image\" height=\"300\" src=\"https://www.eejournal.com/wp-content/uploads/2026/08/max-0510-image-for-home-page-the-life-of-clive-300x300.jpg\" style=\"display: block; margin-bottom: 5px; clear: both;\" width=\"300\" />I have exciting news! Well, it’s exciting for me. As I pen these words, I’ve just self-published my first book: The Life of Clive. Now, this isn’t the first book I’ve had published (search for “Clive Maxfield” on Amazon if you want to see more), but it’s the first one I’ve published myself, a process &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/article/self-publishing-a-book-is-easier-and-harder-than-you-think-part-1/\">Read More &#8594;<span class=\"screen-reader-text\"> \"Self-Publishing a Book Is Easier (and Harder) Than You Think (Part 1)\"<\/span><\/a>"}, {"title": "SONOFF Hydro DUO review – A dual-zone BLE and Zigbee water valve tested with eWeLink and Home Assistant", "source": "CNX Software", "date": "2026-08-17", "url": "https://www.cnx-software.com/2026/08/17/sonoff-hydro-duo-review-a-dual-zone-ble-and-zigbee-water-valve-tested-with-ewelink-and-home-assistant/", "summary": "<div><img alt=\"SONOFF Hydro DUO review eWeLink Home Assistant\" class=\"attachment-medium size-medium wp-post-image\" height=\"481\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/08/SONOFF-Hydro-DUO-review-eWeLink-Home-Assistant-720x481.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>ITEAD has sent us a review sample of the SONOFF Hydro DUO (SWV-ZF2E) dual-channel Zigbee 3.0 and Bluetooth 5 LE smart water valve. The device supports up to 12 custom watering schedules, integrates a water flow meter, and features alert systems for leak risks, low battery, and insufficient water. The device has a maximum Zigbee communication range of 130 meters in open, unobstructed areas. It is primarily designed for the eWeLink app but also works with MQTT-compatible platforms such as Home Assistant. In this review, we will cover everything from unboxing, installation, and getting started with the SONOFF Hydro DUO via Bluetooth LE and Zigbee (through the SONOFF NSPanel Pro Gen2) using the eWeLink app, before switching to Home Assistant and creating an automation system leveraging moisture data from the XIAO Soil Moisture Sensor. SONOFF Hydro DUO unboxing We received the device in a retail package which clearly indicates we [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/08/17/sonoff-hydro-duo-review-a-dual-zone-ble-and-zigbee-water-valve-tested-with-ewelink-and-home-assistant/\">SONOFF Hydro DUO review &#8211; A dual-zone BLE and Zigbee water valve tested with eWeLink and Home Assistant<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Pi-Ener-lite – A compact 18650 UPS board for Raspberry Pi Zero with RTC and fuel gauge", "source": "CNX Software", "date": "2026-08-17", "url": "https://www.cnx-software.com/2026/08/17/pi-ener-lite-a-compact-18650-ups-board-for-raspberry-pi-zero-with-rtc-and-fuel-gauge/", "summary": "<div><img alt=\"Pi Ener lite with Raspberry PI Zero attached\" class=\"attachment-medium size-medium wp-post-image\" height=\"480\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/08/Pi-Ener-lite-with-Raspberry-PI-Zero-attached-720x480.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Designed by ACE Design Studio in China, the Pi-Ener-lite is a dedicated UPS board made specifically for the Raspberry Pi Zero series. It features a standard flat-top 18650 lithium-ion battery holder and switches to battery power when external power is lost, while supporting simultaneous charging and discharging. The Pi-Ener-lite connects to the bottom of the Raspberry Pi Zero via seven spring-loaded pogo pins that handle both power delivery and I2C data communication, leaving the top GPIO header free for other HATs or expansions. Pi-Ener-lite specifications: Compatibility – Raspberry Pi Zero series SBCs USB &#8211; 1x USB Type-C port for charging  Misc Power switch DS1307 real-time clock (RTC) chip with a CR1220 coin cell battery holder 7x spring pogo pins for power delivery and I2C data Power Management Battery Support – Standard flat-top 18650 lithium-ion cell; supports simultaneous charging and discharging Charging current &#8211; 1A @ 5V Output current &#8211; 2.5A [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/08/17/pi-ener-lite-a-compact-18650-ups-board-for-raspberry-pi-zero-with-rtc-and-fuel-gauge/\">Pi-Ener-lite &#8211; A compact 18650 UPS board for Raspberry Pi Zero with RTC and fuel gauge<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Luckfox Lyra PLC – A Linux-based Rockchip RK3506B industrial controller with RS232, RS422, RS485, CAN bus, and relays", "source": "CNX Software", "date": "2026-08-17", "url": "https://www.cnx-software.com/2026/08/17/luckfox-lyra-plc-a-linux-based-rockchip-rk3506b-industrial-controller-with-rs232-rs422-rs485-can-bus-and-relays/", "summary": "<div><img alt=\"Luckfox Lyra PLC\" class=\"attachment-medium size-medium wp-post-image\" height=\"604\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/08/Luckfox-Lyra-PLC-720x604.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Luckfox Lyra PLC is a Linux-based programmable logic controller powered by a Rockchip RK3506B tri-core Arm Cortex-A7 SoC, equipped with dual Ethernet, WiFi 6 and Bluetooth 5.2 wireless connectivity, a 1.9-inch touchscreen LCD, and a range of I/Os. The I/Os are mostly exposed through two 11-pole terminal blocks with one RS232, one shared RS422/RS485, one CAN Bus, and two relays, as well as smaller connectors for I2C, GPIO, and debugging. The system can be powered via USB-C  (5V only), terminal block pins supporting 7V-24V DC input, or an optional PoE module. &#160; Luckfox Lyra PLC specifications: SoC – Rockchip RK3506B CPU 3x Arm Cortex-A7 cores up to 1.2 GHz Arm Cortex-M0 real-time core GPU – 2D GPU only No VPU, no NPU System Memory – 512MB DDR3L Storage &#8211; 8GB eMMC flash Display &#8211; 1.9-inch touchscreen LCD with 320 x 170 resolution Networking 2x 10/100 Mbps Ethernet RJ45 ports 2.4 GHz [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/08/17/luckfox-lyra-plc-a-linux-based-rockchip-rk3506b-industrial-controller-with-rs232-rs422-rs485-can-bus-and-relays/\">Luckfox Lyra PLC &#8211; A Linux-based Rockchip RK3506B industrial controller with RS232, RS422, RS485, CAN bus, and relays<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Google Chrome is now available for Arm Linux. We tested it on a Raspberry Pi 5", "source": "CNX Software", "date": "2026-08-17", "url": "https://www.cnx-software.com/2026/08/17/google-chrome-is-now-available-for-arm-linux-we-tested-it-on-a-raspberry-pi-5/", "summary": "<div><img alt=\"Google Chrome Arm Linux Raspberry Pi OS\" class=\"attachment-medium size-medium wp-post-image\" height=\"415\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/08/Google-Chrome-Arm-Linux-Raspberry-Pi-OS-720x415.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Google Chrome web browser is now available for 64-bit Arm Linux, and we quickly tested it with Raspberry Pi OS on a Raspberry Pi 5 2GB SBC. The open-source Google Chromium web browser has been available for Arm Linux for years, but it lacks some features such as account sync, out-of-the-box DRM support, and automatic updates. Google wrote about working on a port last March, but hasn&#8217;t officially released it. However, users on Interfacing Linux have noticed that it can easily be installed by changing amd64 to arm64 in the download link. So we did that on a Raspberry Pi 5: [crayon-6a85e30fb5f55180698216/] Google Chrome now appears alongside Chromium and Firefox in the list of Internet applications. The screenshot below shows that some GPU features like WebGL and video acceleration are enabled. The latter is not especially useful on a Raspberry Pi 5 since the Broadcom BCM2712 only supports H.265 hardware [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/08/17/google-chrome-is-now-available-for-arm-linux-we-tested-it-on-a-raspberry-pi-5/\">Google Chrome is now available for Arm Linux. We tested it on a Raspberry Pi 5<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "SensiBel and Aizip Combine Optical MEMS and Edge AI Beamforming", "source": "Embedded.com", "date": "2026-08-17", "url": "https://www.embedded.com/sensibel-and-aizip-combine-optical-mems-and-edge-ai-beamforming/", "summary": "<p>SensiBel and Aizip are collaborating on a speech-processing solution that combines sensiBel's optical MEMS microphone technology with Aizip's edge AI beamforming algorithms. The companies aim to improve speech clarity and recognition in demanding acoustic environments, including smart glasses, true wireless stereo (TWS) earbuds, and industrial speech applications. Aizip's beamforming solution combines AI-based noise reduction, dereverberation [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/sensibel-and-aizip-combine-optical-mems-and-edge-ai-beamforming/\">SensiBel and Aizip Combine Optical MEMS and Edge AI Beamforming<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "56G MezzaWave Connectors and Cable Assemblies — TE Connectivity and Mouser Electronics", "source": "EE Journal", "date": "2026-08-17", "url": "https://www.eejournal.com/chalk_talks/56g-mezzawave-connectors-and-cable-assemblies-te-connectivity-and-mouser-electronics/", "summary": "&#160; In this episode of Chalk Talk, Christian Jacinto from TE Connectivity and I explore the benefits of 56G MezzaWave Connectors and Cable Assemblies family which include support for high-performance data rates up to 56Gbps PAM4, design flexibility, and reliable operation across a wide temperature range. We also discuss the common engineering questions surrounding these &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/chalk_talks/56g-mezzawave-connectors-and-cable-assemblies-te-connectivity-and-mouser-electronics/\">Read More &#8594;<span class=\"screen-reader-text\"> \"56G MezzaWave Connectors and Cable Assemblies &#8212; TE Connectivity and Mouser Electronics\"<\/span><\/a>"}, {"title": "From Prototype to Production: Building Connected Products with Particle – Digi and Mouser", "source": "EE Journal", "date": "2026-08-17", "url": "https://www.eejournal.com/chalk_talks/from-prototype-to-production-building-connected-products-with-particle-digi-and-mouser/", "summary": "&#160; In this episode of Chalk Talk, Erik Fasnacht from Digi and Amelia Dalton explore how Particle helps engineering teams streamline every stage of connected product development. They also investigate how Particle provides an integrated platform designed to simplify IoT development and accelerate time to market and examine how building with production in mind from &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/chalk_talks/from-prototype-to-production-building-connected-products-with-particle-digi-and-mouser/\">Read More &#8594;<span class=\"screen-reader-text\"> \"From Prototype to Production: Building Connected Products with Particle – Digi and Mouser\"<\/span><\/a>"}, {"title": "Highly rugged GAPS & HAPS aerospace proximity sensors from Honeywell now available through Powell Electronics", "source": "EE Journal", "date": "2026-08-17", "url": "https://www.eejournal.com/industry_news/highly-rugged-gaps-haps-aerospace-proximity-sensors-from-honeywell-now-available-through-powell-electronics/", "summary": "Now available through Powell Electronics, the supplier of connectors and more for high-rel applications including defence, aerospace and industrial, are the GAPS (General Aerospace Proximity Sensors) and HAPS (Harsh Application Proximity Sensors) proximity sensors from Honeywell. Both sensor series incorporate Honeywell’s patented integrated health monitoring functionality, however the products have some technical differences that allow them &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/highly-rugged-gaps-haps-aerospace-proximity-sensors-from-honeywell-now-available-through-powell-electronics/\">Read More &#8594;<span class=\"screen-reader-text\"> \"Highly rugged GAPS &#038; HAPS aerospace proximity sensors from Honeywell now available through Powell Electronics\"<\/span><\/a>"}, {"title": "sensiBel and Aizip Deliver Superior Physical AI to Speech Applications, Improving Clarity and Intelligibility", "source": "EE Journal", "date": "2026-08-17", "url": "https://www.eejournal.com/industry_news/sensibel-and-aizip-deliver-superior-physical-ai-to-speech-applications-improving-clarity-and-intelligibility/", "summary": "sensiBel, the leader in optical MEMS sensing, and Aizip, the pioneer in artificial intelligence (AI) applications for endpoint and edge devices, today announced a technology collaboration that combines sensiBel’s industry-leading optical MEMS microphone with Aizip’s edge AI beamforming solution — to deliver dramatic improvements in speech clarity and recognition, even in the noisiest environments. “The best &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/sensibel-and-aizip-deliver-superior-physical-ai-to-speech-applications-improving-clarity-and-intelligibility/\">Read More &#8594;<span class=\"screen-reader-text\"> \"sensiBel and Aizip Deliver Superior Physical AI to Speech Applications, Improving Clarity and Intelligibility\"<\/span><\/a>"}, {"title": "Peraso Targets Defense and UAV Markets with New PRM2145 Jam-Resistant Communications Module", "source": "EE Journal", "date": "2026-08-17", "url": "https://www.eejournal.com/industry_news/peraso-targets-defense-and-uav-markets-with-new-prm2145-jam-resistant-communications-module-2/", "summary": "Peraso Inc. (NASDAQ: PRSO) (&#8220;Peraso&#8221; or the &#8220;Company&#8221;), a pioneer in mmWave wireless technology solutions, today announced the introduction of the “PRM2145,” a new wireless communications module specifically designed to address the requirements of unmanned aerial vehicles (UAV), autonomous systems, and defense communications applications. The launch of the PRM2145 marks an important expansion of Peraso&#8217;s product &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/peraso-targets-defense-and-uav-markets-with-new-prm2145-jam-resistant-communications-module-2/\">Read More &#8594;<span class=\"screen-reader-text\"> \"Peraso Targets Defense and UAV Markets with New PRM2145 Jam-Resistant Communications Module\"<\/span><\/a>"}, {"title": "Using the Khadas Mind Graphics 2 (NVIDIA RTX 5060 Ti USB4 eGPU) on Ubuntu 26.04", "source": "CNX Software", "date": "2026-08-16", "url": "https://www.cnx-software.com/2026/08/16/using-the-khadas-mind-graphics-2-nvidia-rtx-5060-ti-usb4-egpu-on-ubuntu-26-04/", "summary": "<div><img alt=\"Khadas Mind Graphics 2 NVIDIA GeForce RTX 5060 Ti 16GB eGPU Ubuntu 26.04\" class=\"attachment-medium size-medium wp-post-image\" height=\"532\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/08/Khadas-Mind-Graphics-2-NVIDIA-GeForce-RTX-5060-Ti-16GB-eGPU-Ubuntu-26.04-720x532.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>When we used the NVIDIA GeForce RTX 5060 Ti 16GB-based Khadas Mind Graphics 2 dock with a mini PC running Ubuntu 26.04 last week, the USB4-connected eGPU was detected and enabled automatically, but we encountered two issues: very poor performance and the mini PC failed to boot when the dock was removed. The solution is partially documented as part of a long GEEKOM IT13 Max Ubuntu 26.04 review, but I thought it might be useful to document everything in a shorter article for people who own the Khadas Mind Graphics 2 or another NVIDIA Blackwell eGPU connected over USB4/Thunderbolt. Fixing Khadas Mind Graphics 2 performance issues on Ubuntu The Khadas Mind Graphics 2 and NVIDIA graphics card were automatically detected when I connected the dock to an Ubuntu 26.04 mini PC<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/08/16/using-the-khadas-mind-graphics-2-nvidia-rtx-5060-ti-usb4-egpu-on-ubuntu-26-04/\">Using the Khadas Mind Graphics 2 (NVIDIA RTX 5060 Ti USB4 eGPU) on Ubuntu 26.04<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Humanoid Robots, Simplifying Embedded System Design, Photonic IC Development: Embedded Week Insights", "source": "Embedded.com", "date": "2026-08-14", "url": "https://www.embedded.com/humanoid-robots-simplifying-embedded-system-design-photonic-ic-development-embedded-week-insights/", "summary": "<p>Here's a roundup of this week's must-read articles. We'll look into the latest developments on humanoid robots, simplifying embedded system design, photonic IC development, and more. Also, check News Archives - Embedded and Technical Articles Archives - Embedded for the complete list of news and articles from our website. NEWS OpenLight and Tower Accelerate Photonic IC Development The expanded [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/humanoid-robots-simplifying-embedded-system-design-photonic-ic-development-embedded-week-insights/\">Humanoid Robots, Simplifying Embedded System Design, Photonic IC Development: Embedded Week Insights<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "Altera Expands DDR5 and LPDDR5 Support Across Agilex FPGAs", "source": "Embedded.com", "date": "2026-08-14", "url": "https://www.embedded.com/altera-expands-ddr5-and-lpddr5-support-across-agilex-fpgas/", "summary": "<p>Altera Corp. has expanded memory support across its Agilex FPGA portfolio with Quartus Prime Pro Edition Software version 26.1.1. The release adds DDR5, LPDDR5, and LPDDR5X-compatible memory capabilities to additional Agilex devices, giving developers greater flexibility when optimizing system bandwidth, power consumption, PCB space, and component availability. For Agilex 7 M-Series devices, the latest software [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/altera-expands-ddr5-and-lpddr5-support-across-agilex-fpgas/\">Altera Expands DDR5 and LPDDR5 Support Across Agilex FPGAs<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "Humanoid Robots Need a Real-Time, Distributed Nervous System", "source": "Embedded.com", "date": "2026-08-13", "url": "https://www.embedded.com/humanoid-robots-need-a-real-time-distributed-nervous-system/", "summary": "<p>The emulation of the numerous types of movement produced by the human body in humanoid robots is arguably among the most complex challenges at the forefront of modern engineering. Designing robots to tackle everyday tasks such as assembly on a production line or cooking in a kitchen demands the coordination of multiple sub-tasks. The automation [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/humanoid-robots-need-a-real-time-distributed-nervous-system/\">Humanoid Robots Need a Real-Time, Distributed Nervous System<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "OpenLight and Tower Accelerate Photonic IC Development", "source": "Embedded.com", "date": "2026-08-13", "url": "https://www.embedded.com/openlight-and-tower-accelerate-photonic-ic-development/", "summary": "<p>OpenLight and Tower Semiconductor Ltd. have expanded the design ecosystem for Tower's PH18DA indium phosphide (InP)-on-silicon photonics platform. OpenLight's photonic process design kit (PDK) is now available within Cadence Design Systems' electronic design automation (EDA) tools, enabling developers to design photonic integrated circuits (PICs) using an established IC design environment. The PDK has been developed [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/openlight-and-tower-accelerate-photonic-ic-development/\">OpenLight and Tower Accelerate Photonic IC Development<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "TI Unveils CAN XL Transceiver", "source": "Embedded.com", "date": "2026-08-12", "url": "https://www.embedded.com/ti-unveils-can-xl-transceiver/", "summary": "<p>Texas Instruments (TI) has claimed the industry's first commercially-available controller area network (CAN) extended data-field length (XL) transceiver for industrial systems including humanoid robots, industrial robots, and HMI systems that require more data at faster speeds. The TCAN6062 CAN XL transceiver supports payloads up to 2,048 bytes per frame and data rates as high as [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/ti-unveils-can-xl-transceiver/\">TI Unveils CAN XL Transceiver<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "Microchip Upgrades PolarFire FPGA Ethernet Sensor Bridge", "source": "Embedded.com", "date": "2026-08-12", "url": "https://www.embedded.com/microchip-upgrades-polarfire-fpga-ethernet-sensor-bridge/", "summary": "<p>Microchip Technology Inc. has introduced Revision 2.0 PolarFire FPGA Ethernet Sensor Bridge for Ethernet-based AI inferencing at the edge. The smaller, production-ready board for standardized sensor integration, leveraging Nvidia
