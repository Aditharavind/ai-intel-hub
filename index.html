the summer of 2011 at Google’s campus in Kirkland, Wash., working on the company’s <a href=\"https://adwords.googleblog.com/2011/05/comparison-ads-now-part-of-new-google.html\" rel=\"noopener noreferrer\" target=\"_blank\">comparison ads project<\/a>.<\/p><p>When her internship ended, she joined the <a href=\"https://www.media.mit.edu\" rel=\"noopener noreferrer\" target=\"_blank\">MIT Media Lab<\/a> as a visiting student, working on the <a href=\"https://en.wikipedia.org/wiki/Open_Mind_Common_Sense\" rel=\"noopener noreferrer\" target=\"_blank\">Open Mind Common Sense project<\/a> with <a href=\"https://web.media.mit.edu/~lieber/\" rel=\"noopener noreferrer\" target=\"_blank\">Henry Lieberman<\/a>.<\/p><p>As she was considering pursuing a Ph.D., a call from Google changed her plans. The company offered her a full-time role as a software engineer.<\/p><p>“I viewed the job offer as a positive development,” she says. “I believe it can never hurt your future research career to get some real-world experience under your belt.”<\/p><p>She was hired in 2012 and helped build techniques that incorporate computer vision and natural language processing to improve the customer shopping search experience. She led the company’s <a href=\"https://techcrunch.com/2016/09/06/google-is-launching-shop-the-look-to-let-you-search-and-shop-by-outfit/\" rel=\"noopener noreferrer\" target=\"_blank\">Shop the Look initiative<\/a>, a predecessor to Google’s current <a href=\"https://blog.google/products-and-platforms/products/shopping/google-shopping-ai-mode-virtual-try-on-update/\" rel=\"noopener noreferrer\" target=\"_blank\">AI-powered shopping experience<\/a>. The project connected social media content with search results, something the company had struggled to do in the past.<\/p><p>Kuo and her team were tasked with building a connection between the natural language people use to describe an item and an image that matches the searcher’s intent. It was at a time when the <a href=\"https://spectrum.ieee.org/tag/neural-network\" target=\"_self\">neural network<\/a>—using deep learning models to power Google products—was gaining momentum at the company. Integrating neural network tools into her work was a requirement—which raised questions for Kuo.<\/p><p>“I was applying the neural network tools,” she says. “But I didn’t have 100 percent certainty about how they actually worked.”<\/p><p>She considered how she could become more knowledgeable about deep learning models. It was a full-circle moment. She decided that after nearly four years at Google, it was time to earn a Ph.D. in computer science. She returned to MIT in 2016.<\/p><h2>The question that changed everything<\/h2><p><a href=\"https://people.csail.mit.edu/boris/boris.html\" rel=\"noopener noreferrer\" target=\"_blank\">Boris Katz<\/a>, one of Kuo’s Ph.D. advisors, is a principal research scientist and the head of the MIT <a href=\"https://www.csail.mit.edu\" rel=\"noopener noreferrer\" target=\"_blank\">Computer Science and Artificial Intelligence Laboratory<\/a> (CSAIL)’s <a href=\"https://www.csail.mit.edu/research/infolab\" rel=\"noopener noreferrer\" target=\"_blank\">InfoLab<\/a>. He also led the creation of the <a href=\"https://start.csail.mit.edu/index.php\" rel=\"noopener noreferrer\" target=\"_blank\">START Natural Language System<\/a>, the world’s first Web-based question-answering system.<\/p><p>When the two met, Katz asked Kuo why she wanted to pursue a doctorate degree. She explained her interest in understanding how neural networks work and in using that knowledge to connect the physical world with human language.<\/p><p>He suggested she attend a <a href=\"https://bmm.mit.edu/\" rel=\"noopener noreferrer\" target=\"_blank\">summer course<\/a> at MIT’s <a href=\"https://cbmm.mit.edu\" rel=\"noopener noreferrer\" target=\"_blank\">Center for Brains, Minds, and Machines<\/a>, a research initiative that <a href=\"https://sqi.mit.edu/research/cbmm\" rel=\"noopener noreferrer\" target=\"_blank\">ran from 2013 through 2025<\/a>. CBMM’s objective was to bring together computer scientists, cognitive scientists, and neuroscientists to understand how human intelligence works. The goal was to use the resulting insights to establish an engineering practice to build artificial intelligence systems.<\/p><p>For Kuo, it was a chance to better understand human intelligence and identify ways it could be replicated in machines.<\/p><p>“It was an opportunity for me to interact with other scientists and gain insight into how people learn, understand, and figure things out in the world,” she says. “I saw it as a very useful and inspiring way to incorporate those ideas into my own research work.”<\/p><p>During her Ph.D. studies, she was a research assistant at CSAIL. The experience helped shape her doctoral research, which focused on building AI systems that apply past learning to new situations. She developed machine learning models to support the efforts, including language understanding and social interactions.<\/p><p>She completed her Ph.D. in computer science in 2022 with a minor in cognitive science.<\/p><p>After graduation, she continued her work and collaboration at CSAIL, particularly on projects that involved the “theory of mind” concept.<\/p><h2>Theory of mind spurs innovation<\/h2><p>Theory of mind isn’t new, having originated with <a href=\"https://www.cambridge.org/core/journals/behavioral-and-brain-sciences/article/does-the-chimpanzee-have-a-theory-of-mind/1E96B02CD9850016B7C93BC6D2FEF1D0\" rel=\"noopener noreferrer\" target=\"_blank\">primatologists studying chimpanzees<\/a> in the late 1970s. The theory recognizes that others have their own thoughts, beliefs, and perspectives. It’s a skill that allows humans to infer someone’s mental state and predict their behavior without verbal communication.<\/p><p>“It’s like when college roommates are moving into their dorm. They may not talk too much, but they work together naturally to coordinate their activities and accomplish goals,” Kuo says. “They can infer and mentally interpret each other’s behaviors and signals to make decisions and complete tasks without words.”<\/p><p>She brought her theory of mind research to the University of Virginia when she joined as an assistant professor in 2023.<\/p><p>Kuo conducts her research in UVA Engineering’s multidisciplinary cyberphysical <a href=\"https://engineering.virginia.edu/labs-groups/link-lab\" rel=\"noopener noreferrer\" target=\"_blank\">Link Lab<\/a>. Her broad focus is on developing computational models that help robots interpret both direct data and silent signals, from language and movements to a person’s gaze. If successful, it could give robots the same sort of physical and theory of mind reasoning capabilities that power physical and social interactions among humans.<\/p><p>“There are no computational frameworks yet available that will translate this kind of understanding into a robot efficiently,” she says.<\/p><p>She adds that the process to get there begins with improving how robots learn to perform tasks.<\/p><h2>The evolution of robot learning<\/h2><p>Historically, one way robots learned was to mimic humans. A researcher would manually guide a robot through a task, like cutting an apple, and it would repeat the movements. The robot was successful until the environment changed, such as when its hand was in a different position or the apple was at a different angle. The robot was then faced with a situation for which it hadn’t been trained. Without any data available to help it correct course, the robot would start making small errors that eventually led to a full system crash.<\/p><p class=\"shortcode-media shortcode-media-rebelmouse-image\"> <img alt=\"Diagram of a robotic gripper delicately holding a potato chip. Labels describe how the gripper\\u2019s visual perception and tactile sensing prevent the chip from breaking.\" class=\"rm-shortcode\" id=\"bfe1e\" src=\"https://spectrum.ieee.org/media-library/diagram-of-a-robotic-gripper-delicately-holding-a-potato-chip-labels-describe-how-the-gripper-u2019s-visual-perception-and-tact.jpg?id=66879111&amp;width=980\" /> <small class=\"image-media media-caption\">This diagram describes how the robotic gripper’s visual perception and tactile sensing prevents a potato chip from breaking.<\/small><small class=\"image-media media-photo-credit\"><a href=\"https://force-gripper.github.io/\" target=\"_blank\">Xuhui Kang, Yen-Ling Kuo, et al.<\/a><\/small><\/p><p>To solve the problem, researchers developed the dataset aggregation (DAgger) method. As a robot performed a task, a researcher was on standby to provide real-time corrections during unexpected scenarios. The correction data was continuously added to the robot’s model, teaching it how to recover from mistakes.<\/p><p>To reduce the human monitoring effort, robot-gated DAgger was created to enable bots to query humans when the machines became uncertain.<\/p><p>The most popular approach to make the query decision is to train multiple models to consider when determining a course of action. If the models all agree, the robot proceeds. If they don’t agree, the robot is likely to get stuck and ask for help.<\/p><p>Although the multiple model approach was widely adopted, it has limitations. Practically speaking, as models become more complex, it is hard or impossible to train multiple copies. A more fundamental issue is that disagreement among models doesn’t always imply uncertainty; it could just mean there are different ways to accomplish a task.<\/p><h2>The Diff-DAgger solution<\/h2><p>That is the gap Kuo’s research team closed with the novel Diff-DAgger research. The approach builds on diffusion policy, a technique that helps robots account for different ways a task can be performed.<\/p><p>The new method repurposes diffusion loss, the signal a robot uses to improve its model during training, as a real-time confidence check. During task execution, the robot computes the signal and compares it against values from its training data using a statistical test. The signal spikes when the robot faces an unfamiliar situation and is uncertain how to proceed. The signal stays silent when the robot’s current action is close to what it learned before.<\/p><p>The spike represents the robot’s ability to self-diagnose and predict an imminent failure. Human intervention is triggered only when the signal spikes. No spike means the robot can be left to complete its decision-making process on its own.<\/p><p>Kuo’s team achieved <a href=\"https://diffdagger.github.io\" target=\"_blank\">significant results<\/a>: Failure prediction rates were improved by 39 percent. Task completion rates were increased by 20 percent, and tasks were completed nearly eight times faster.<\/p><p>Her research at UVA gained attention from the <a href=\"https://www.nsf.gov\" rel=\"noopener noreferrer\" target=\"_blank\">National Science Foundation<\/a>, which honored her last year with a <a href=\"https://www.nsf.gov/funding/opportunities/career-faculty-early-career-development-program\" rel=\"noopener noreferrer\" target=\"_blank\">Career Award<\/a>, the foundation’s flagship grant for early-career researchers. The five-year US $665,000 grant supports her research that builds computational models for human-robot interactions through theory of mind reasoning.<\/p><p>She also received the Toyota Research Institute’s <a href=\"https://engineering.virginia.edu/news-events/news/uva-and-toyota-research-institute-aim-give-your-car-power-reason\" rel=\"noopener noreferrer\" target=\"_blank\">Young Faculty Researcher Award<\/a> to teach cars to reason about interactions on the road and with the driver.<\/p><p>As service robots and self-driving vehicles become more available, such works are likely to make interactions between humans and robots more intuitive and useful.<\/p><p>Kuo ultimately wants to build more robust robots that are able to integrate into a social space with humans by engaging with us through grounded interactions, she says.<\/p><h2>The impact of IEEE<\/h2><p>Like many IEEE members, Kuo was introduced to the organization as a student. In 2018 she submitted her first paper, “<a href=\"https://arxiv.org/abs/1810.00804\" rel=\"noopener noreferrer\" target=\"_blank\">Deep Sequential Models for Sampling-Based Planning<\/a>,” to the <a href=\"https://www.ieee-ras.org/conferences-workshops/financially-co-sponsored/iros/\" rel=\"noopener noreferrer\" target=\"_blank\">IEEE/Robotics Society of Japan International Conference on Intelligent Robots and Systems<\/a> while pursuing her Ph.D. at MIT. Her IEEE involvement grew alongside her professional career.<\/p><p>“It was a natural segue to transition from student to a full IEEE member,” she says. Today she is an active volunteer with the IEEE Robotics and Automation Society, a reviewer for submitted papers, and a presenter and panelist at conferences.<\/p><p>She says one of the best parts of attending conferences is having the opportunity to engage with students. She also enjoys participating as a panelist at luncheons, she says, because it gives her one-on-one time with student attendees. She can share her knowledge and offer insights as they prepare to embark on their career.<\/p><p>Her goal in the coming years, she says, is to broaden her involvement with IEEE initiatives and branch out to other technical committees. Sharing knowledge and learning from others is essential to anyone’s <a href=\"https://spectrum.ieee.org/influence-your-career\" target=\"_blank\">career growth<\/a>, she says, and “IEEE offers a great opportunity for both.”<\/p>"}, {"title": "Video Friday: Robotic Motion Discovery Reveals Unusual Behaviors", "source": "IEEE Spectrum Robotics", "date": "2026-06-12", "url": "https://spectrum.ieee.org/video-friday-humanoid-loco-manipulation", "summary": "<img src=\"https://spectrum.ieee.org/media-library/humanoid-robot-picks-up-a-box-and-climbs-onto-a-table-in-a-modern-lab-workspace.gif?id=66901035&amp;width=1245&amp;height=700&amp;coordinates=0%2C116%2C0%2C116\" /><br /><br /><p><span>Video Friday is your weekly selection of awesome robotics videos, collected by your friends at <\/span><em>IEEE Spectrum<\/em><span> robotics. We also post a weekly calendar of upcoming robotics events for the next few months. Please <\/span><a href=\"mailto:automaton@ieee.org?subject=Robotics%20event%20suggestion%20for%20Video%20Friday\">send us your events<\/a><span> for inclusion.<\/span><\/p><h5><a href=\"https://roboticsconference.org/\">RSS 2026<\/a>: 13–17 July 2026, SYDNEY<\/h5><h5><a href=\"https://mrs.fel.cvut.cz/summer-school-2026/\">Summer School on Multi-Robot Systems<\/a>: 29 July–4 August 2026, PRAGUE<\/h5><h5><a href=\"https://actuate.foxglove.dev/\">Actuate 2026<\/a>: 18–19 August 2026, SAN FRANCISCO<\/h5><p>Enjoy today’s videos!<\/p><div class=\"horizontal-rule\"><\/div><div><span style=\"display: none;\"> <\/span><\/div><blockquote class=\"rm-anchors\" id=\"dhivz34qylw\"><em>We present MotionDisco, a framework that discovers contact-rich, long-horizon humanoid <a href=\"https://spectrum.ieee.org/video-friday-locoman\" target=\"_blank\">loco-manipulation<\/a> motions from scratch, without relying on teleoperation or motion retargeting from human demonstrations.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>Some of the discovered behaviors are a little nutso:<\/p><p class=\"shortcode-media shortcode-media-youtube\"> <span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://atarilab.github.io/motiondisco.io/\">MotionDisco<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"_21bfsgtm0s\">Not sure I’d say any of this is ‘effortless’ but those <a href=\"https://spectrum.ieee.org/video-friday-mit-hermes-drone-claw-bb8-droid\" target=\"_blank\">claws<\/a> are pretty cute.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.deeprobotics.cn/en\">Deep Robotics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"std5wteoa50\"><em>It turns out running a workout class is a decent way to stress-test <a href=\"https://spectrum.ieee.org/video-humanoid-dancing\" target=\"_blank\">whole-body range of motion<\/a>. Coordinating fluid movement across every joint at once—timing, velocity, balance compensation—is one of the harder control problems in humanoid robotics.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.agilityrobotics.com/\">Agility<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"htrfgxjojrs\">Our very own Gwendolyn Rak made a robotic shoulder-friend at Computer Human Interaction in Barcelona.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>Here’s a bit more about it:<\/p><p class=\"shortcode-media shortcode-media-youtube\"> <span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.media.mit.edu/projects/the-stochastic-parrot/overview/\">MIT<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"v2txavmrsyo\"><em>At AIRoA, we’re bringing <a href=\"https://spectrum.ieee.org/domestic-humanoid-robot-safety-standards\" target=\"_blank\">robots into real homes<\/a>. Check out our exclusive first video to see how they work in our development hub and real-life household settings! The project aims to develop home robots that can assist people with everyday tasks and become long-term companions in daily life. In this video, we demonstrate Toyota’s Human Support Robot (HSR) deployed in real homes, where it assists residents with everyday tasks such as tidying rooms and fetching objects.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.airoa.org/\">AI Robot Association<\/a> ]<\/p><p>Thanks, Naoaki!<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"ntvtrlsyhji\"><em>MIDAS Hand is a fully open-source, tactile-sensor-integrated <a href=\"https://spectrum.ieee.org/video-friday-robotic-hand-dexterity\" target=\"_blank\">dexterous robotic hand<\/a> platform for manipulation, teleoperation, and robot learning research. MIDAS stands for Modular low-Impedance Direct-drive Anthropomorphic Sensing Hand.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://midas-hand.com/\">MIDAS Hand<\/a> ]<\/p><p>Thanks, Jun Kim!<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"vofmkd0asrq\"><em>This video presents a novel flight maneuver for a flying bipedal robot. During forward flight, the robot performs aerial braking by swinging its legs to adjust the orientation of foot-mounted thrusters.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.sciencedirect.com/science/article/abs/pii/S0921889026001983\">Paper<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"z5nf8nz_zyi\">Seems like a really good application for autonomy, to be honest.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.builtrobotics.com/\">Built Robotics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"t9ygyxgfxlm\"><em>In this time-lapse, controllers on the ground are repositioning <a href=\"https://spectrum.ieee.org/dextre-robot-repairs-iss-while-astronauts-sleep\" target=\"_blank\">Dextre<\/a>, our robotic handyman currently installed at the end of the Canadarm2. They used Dextre to unload equipment from the unpressurised Dragon trunk. Such a beautiful choreography to watch with Earth in the background!<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.esa.int/ESA_Multimedia/Images/2008/04/The_Canadian_Special_Purpose_Dextrous_Manipulator_Dextre_installed_on_exterior_of_ISS\">European Space Agency<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"nel2bmgcfjs\"><em>This video demonstrates how AI Sapiens learns and performs humanoid motions from video-based motion capture using only a smartphone camera, without professional motion capture equipment. ROBOTIS plans to release an open-source motion generation and learning pipeline for AI Sapiens, enabling users to generate humanoid motions from video and bring them to the real robot.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://ai.robotis.com/\">ROBOTIS<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"utwezllzulk\">NAO LIVES!<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://maxtronics.com/en/nao6/\">Maxtronics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"thfs0xlallu\"><em>Tumblenauts are a swarm of minimalist, bacteria-inspired robots designed for collaborative inspection of pressurized microgravity habitats such as the International Space Station. Unlike current intra-vehicular robots that rely on complex actuator-dense mechanisms for precise motion, the Tumblenauts use a stochastic run-and-tumble locomotion and collective cooperation inspired by bacterial colonies.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://ssr.princeton.edu/\">Self-Organizing Swarms and Robotics Lab<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"_xbeim3jfoc\"><em>LUMOS Robotics Founder and CEO Yu Chao officially introduces Project EDGE—inviting global builders, universities, robotics labs, and creative technologists to explore the future of humanoid robotics together. To supercharge the global developer community, we are providing 100 complimentary LUMOS NIX robots to selected global partners.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.lumosbot.tech/project-edge/index.html\">Lumos Robotics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"oishy9bus7m\"><em>How do you progress from early childhood computational thinking to advanced high school robotics? Sphero’s product offerings are intentionally scaffolded to scale for students by building critical skills and concepts at every grade level.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://sphero.com/\">Sphero<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div>"}], "embeddedNews": [{"title": "DIY Steam Controller Puck Offers Xbox, Switch, PlayStation Emulation Modes", "source": "Hackaday", "date": "2026-07-13", "url": "https://hackaday.com/2026/07/13/diy-steam-controller-puck-offers-xbox-switch-playstation-emulation-modes/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"267\" src=\"https://hackaday.com/wp-content/uploads/2026/07/OpenPuck-banner.png?w=475\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"475\" /><\/div>Valve recently released a new version of the Steam Controller, which features a wired USB puck that serves both as charger and dedicated, low-latency wireless receiver. The downside is they <a class=\"read-more\" href=\"https://hackaday.com/2026/07/13/diy-steam-controller-puck-offers-xbox-switch-playstation-emulation-modes/\">&#8230;read more<\/a>"}, {"title": "Newton’s Cradle Isn’t Really Perpetual", "source": "Hackaday", "date": "2026-07-13", "url": "https://hackaday.com/2026/07/13/newtons-cradle-isnt-really-perpetual/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"450\" src=\"https://hackaday.com/wp-content/uploads/2026/07/balls.png?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>If any astute Hackaday reader saw [dongvua90]&#8217;s Newton&#8217;s cradle go on without human intervention all day long, they&#8217;d probably suspect the truth: there&#8217;s a battery and a magnet involved. But <a class=\"read-more\" href=\"https://hackaday.com/2026/07/13/newtons-cradle-isnt-really-perpetual/\">&#8230;read more<\/a>"}, {"title": "CGI Motion Capture with only a Camera", "source": "Hackaday", "date": "2026-07-13", "url": "https://hackaday.com/2026/07/12/cgi-motion-capture-with-only-a-camera/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"486\" src=\"https://hackaday.com/wp-content/uploads/2026/07/I-Remade-a-LOST-VFX-Device-from-the-90s-0-1-screenshot-e1783916125804.png?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>Computer-generated imagery (CGI) has largely replaced physical models in major film productions these days, but the transition didn&#8217;t exactly happen overnight. For a time there was an effort to blend <a class=\"read-more\" href=\"https://hackaday.com/2026/07/12/cgi-motion-capture-with-only-a-camera/\">&#8230;read more<\/a>"}, {"title": "Musing on AI from 1964", "source": "Hackaday", "date": "2026-07-13", "url": "https://hackaday.com/2026/07/12/musing-on-ai-from-1964/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"484\" src=\"https://hackaday.com/wp-content/uploads/2020/12/AI.jpg?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>[Irving John Good] was at Trinity College, Oxford back in 1964. His paper, &#8220;Speculations Concerning the First Ultraintelligent Machine&#8221; could have been a topic for today, as we deal with <a class=\"read-more\" href=\"https://hackaday.com/2026/07/12/musing-on-ai-from-1964/\">&#8230;read more<\/a>"}, {"title": "Ambient Scientific GPX10 Pro MCU delivers years of always-on AI on a coin-cell battery", "source": "CNX Software", "date": "2026-07-13", "url": "https://www.cnx-software.com/2026/07/13/ambient-scientific-gpx10-pro-mcu-delivers-years-of-always-on-ai-on-a-coin-cell-battery/", "summary": "<div><img alt=\"Ambient Scientific GPX10 Pro Cortex M4 MCU always on embedded AI\" class=\"attachment-medium size-medium wp-post-image\" height=\"494\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/07/Ambient-Scientific-GPX10-Pro-Cortex-M4-MCU-always-on-embedded-AI-720x494.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Ambient Scientific GPX10 Pro is a processor/microcontroller for always-on embedded AI applications on power-constrained edge devices. With a consumption of under &#60;100μW, it can deliver years of always-on AI on one coin-cell battery. The SoC features ten software-programmable MX8 AI cores leveraging the company&#8217;s DigAn technology, ultra-low power ADC, an 8-bit DVO camera interface, 2048 KB SRAM, support for numerous peripherals, and an Arm Cortex-M4F core for non-AI workloads. GPX10 Pro key features and specifications: MCU core &#8211; Arm Cortex-M4F core clocked at 100 KHz to 100 MHz Memory 2048 KB system SRAM 64KB retention SRAM in “Always On” block Storage &#8211; External SPI or QSPI flash 10x MX8 programmable AI Cores for ultra-low power deep learning applications Based on the DigAn AI engine, which can change behavior between being a master and a slave. Up to 2,560 MAC operations per clock cycle (256 MAC per cycle per core) Peak [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/07/13/ambient-scientific-gpx10-pro-mcu-delivers-years-of-always-on-ai-on-a-coin-cell-battery/\">Ambient Scientific GPX10 Pro MCU delivers years of always-on AI on a coin-cell battery<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "WisMesh Station Review – Telemetry, MQTT, and Grafana tested on a Raspberry Pi 4-based Meshtastic gateway", "source": "CNX Software", "date": "2026-07-13", "url": "https://www.cnx-software.com/2026/07/13/wismesh-station-review-telemetry-mqtt-and-grafana-tested-on-a-raspberry-pi-4-based-meshtastic-gateway/", "summary": "<div><img alt=\"RAKwireless WisMesh Station Review\" class=\"attachment-medium size-medium wp-post-image\" height=\"540\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/07/RAKwireless-WisMesh-Station-Review-720x540.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>RAKwireless has sent us a sample of the WisMesh Station, a Meshtastic gateway and base station based on a Raspberry Pi 4 Model B, a WisMesh Pi HAT RAK6421 expansion board, a LoRa module, a GNSS module, all housed in a compact metal enclosure. It comes with meshtasticd preinstalled, making it ready to use right out of the box. Just unbox it, plug it in, and start using Meshtastic immediately. We&#8217;ll also use software packages for communication, data storage, and visualization, such as MQTT, Node-RED, InfluxDB, and Grafana, mostly following RAKwireless’s user guide WisMesh Station is available in 2 models according to transmit power: the standard RAK8622 model that uses the RAK13300 LoRa module (Semtech SX1262 with 22 dBm transmit power), suitable for urban networks where nodes are close to each other, and the high-power RAK8623 (HP) model that uses the RAK13302 module (SX1262 + SKY66122 amplifier circuit with 30 [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/07/13/wismesh-station-review-telemetry-mqtt-and-grafana-tested-on-a-raspberry-pi-4-based-meshtastic-gateway/\">WisMesh Station Review &#8211; Telemetry, MQTT, and Grafana tested on a Raspberry Pi 4-based Meshtastic gateway<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Raspberry Pi gets 10BASE-T1S/T1L Single Pair Ethernet (SPE) HAT+ board", "source": "CNX Software", "date": "2026-07-13", "url": "https://www.cnx-software.com/2026/07/13/raspberry-pi-gets-10base-t1s-t1l-single-pair-ethernet-spe-hat-board/", "summary": "<div><img alt=\"Raspberry Pi 10BASE T1S SPE HAT\" class=\"attachment-medium size-medium wp-post-image\" height=\"480\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/07/Raspberry-Pi-10BASE-T1S-SPE-HAT-720x480.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Germany-based Brechel Electronic has launched two new Single Pair Ethernet (SPE) expansion boards for Raspberry Pi platforms: the BE-IIS-HPP-T1S and the BE-IIS-HPP-T1L. Designed for technology evaluation, industrial network prototyping, and educational laboratory use, these boards add 10 Mbit/s Ethernet communication over a single twisted pair to standard Raspberry Pi SBCs. The BE-IIS-HPP-T1S is based on the Microchip LAN8651 10BASE-T1S MAC-PHY and supports IEEE 802.3cg Single Pair Ethernet over multidrop networks with up to 8 nodes, enabling distances up to 25 meters on a shared bus. For longer-reach point-to-point links, the company offers the BE-IIS-HPP-T1L, built around Analog Devices ADIN1110 MAC-PHY. Both boards are part of the BE-IIS HAT++ ecosystem, which allows multiple industrial communication HATs to be stacked on a single Raspberry Pi without running into SPI or GPIO resource conflicts. Brechel Electronic 10BASE-T1L and 10BASE-T1S specifications: Compatibility &#8211; Raspberry Pi HAT+ compliant T1L &#8211; Supports Pi 3, 4, 5, and Zero [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/07/13/raspberry-pi-gets-10base-t1s-t1l-single-pair-ethernet-spe-hat-board/\">Raspberry Pi gets 10BASE-T1S/T1L Single Pair Ethernet (SPE) HAT+ board<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "China’s Massive Battery Build Capacity", "source": "Electronics Weekly", "date": "2026-07-13", "url": "https://www.electronicsweekly.com/blogs/mannerisms/manuf/chinas-massive-battery-build-capacity-2026-07/", "summary": "<p>China’s grid-scale battery energy storage capacity surged from just 2.4 gigawatts in 2020 to more than 140 gigawatts in 2025 – far ahead of the United States, which reached roughly 57 ...<\/p>\n<p>The post <a href=\"https://www.electronicsweekly.com/blogs/mannerisms/manuf/chinas-massive-battery-build-capacity-2026-07/\">China’s Massive Battery Build Capacity<\/a> appeared first on <a href=\"https://www.electronicsweekly.com\">Electronics Weekly<\/a>.<\/p>"}, {"title": "Tesla A15 chip to be fabbed  at Samsung and TSMC", "source": "Electronics Weekly", "date": "2026-07-13", "url": "https://www.electronicsweekly.com/news/business/tesla-a15-chip-to-be-fabbed-at-samsung-and-tsmv-2026-07/", "summary": "<p>Tesla’s A15 chip is to be fabbed concurrently on the 2nm processes of TSMC in Taiwan and Samsung’s Taylor, Texas fab. TSMC’s Arizona fab site may be added to the ...<\/p>\n<p>The post <a href=\"https://www.electronicsweekly.com/news/business/tesla-a15-chip-to-be-fabbed-at-samsung-and-tsmv-2026-07/\">Tesla A15 chip to be fabbed  at Samsung and TSMC<\/a> appeared first on <a href=\"https://www.electronicsweekly.com\">Electronics Weekly<\/a>.<\/p>"}, {"title": "CP1000 probe features 1.5MHz bandwidth for measurements up to 1000A", "source": "Electronics Weekly", "date": "2026-07-13", "url": "https://www.electronicsweekly.com/news/products/test-measurement-products/cp1000-probe-features-1-5mhz-bandwidth-for-measurements-up-to-1000a-2026-07/", "summary": "<p>Teledyne LeCroy&#8217;s CP1000 current probe targets the precise measurement of modern high-power systems. It features a measurement capability up to 1000A RMS and 1400A peak current. Teledyne says it is ...<\/p>\n<p>The post <a href=\"https://www.electronicsweekly.com/news/products/test-measurement-products/cp1000-probe-features-1-5mhz-bandwidth-for-measurements-up-to-1000a-2026-07/\">CP1000 probe features 1.5MHz bandwidth for measurements up to 1000A<\/a> appeared first on <a href=\"https://www.electronicsweekly.com\">Electronics Weekly<\/a>.<\/p>"}, {"title": "TSMC Q2 revenue up 36% YoY", "source": "Electronics Weekly", "date": "2026-07-13", "url": "https://www.electronicsweekly.com/news/business/tsmc-q2-revenue-up-36-yoy-2026-07/", "summary": "<p>Earlier today  TSMC reported Q2 revenues up 36% YoY at $39.6 billion. For June, TSMC revenue rose 67.9% YoY and 6.2% MoM to  $13.8 billion. For H126, TSMC’s total revenue ...<\/p>\n<p>The post <a href=\"https://www.electronicsweekly.com/news/business/tsmc-q2-revenue-up-36-yoy-2026-07/\">TSMC Q2 revenue up 36% YoY<\/a> appeared first on <a href=\"https://www.electronicsweekly.com\">Electronics Weekly<\/a>.<\/p>"}, {"title": "Sheffield University spin-off raises £5.25m to productionise MicroLED manufacturing process", "source": "Electronics Weekly", "date": "2026-07-13", "url": "https://www.electronicsweekly.com/news/b "https://www.electronicsweekly.com/news/business/899811-2026-07/", "summary": "<p>PC shipments fell 4.9% year over year in Q2 2026 to 68.2 million units, according to IDC — the first decline after nine consecutive quarters of growth. A persistent memory ...<\/p>\n<p>The post <a href=\"https://www.electronicsweekly.com/news/business/899811-2026-07/\">Q2 PC shipments down 4.9% as memory stays short<\/a> appeared first on <a href=\"https://www.electronicsweekly.com\">Electronics Weekly<\/a>.<\/p>"}, {"title": "China gets space boost of landing reusable rocket", "source": "Electronics Weekly", "date": "2026-07-13", "url": "https://www.electronicsweekly.com/news/china-gets-space-boost-of-landing-reusable-rocket-2026-07/", "summary": "<p>In a major landmark for the Chinese space industry, the country has successfully landed a reusable rocket, the Long March 10B. The China Academy of Launch Vehicle Technology, a government ...<\/p>\n<p>The post <a href=\"https://www.electronicsweekly.com/news/china-gets-space-boost-of-landing-reusable-rocket-2026-07/\">China gets space boost of landing reusable rocket<\/a> appeared first on <a href=\"https://www.electronicsweekly.com\">Electronics Weekly<\/a>.<\/p>"}, {"title": "Automotive 1 MBd optocoupler in a SOP-5 package", "source": "Electronics Weekly", "date": "2026-07-13", "url": "https://www.electronicsweekly.com/news/business/899769-2026-07/", "summary": "<p>Vishay has brought out an automotive 1 MBd high speed optocoupler in a new SOP-5 package with a narrow width of 3.6 mm. Combining a comparative tracking index (CTI) of ...<\/p>\n<p>The post <a href=\"https://www.electronicsweekly.com/news/business/899769-2026-07/\">Automotive 1 MBd optocoupler in a SOP-5 package<\/a> appeared first on <a href=\"https://www.electronicsweekly.com\">Electronics Weekly<\/a>.<\/p>"}, {"title": "Next level motion detection: Panasonic Industry enhances its PIR sensor portfolio with PaPIRs+", "source": "EE Journal", "date": "2026-07-13", "url": "https://www.eejournal.com/industry_news/next-level-motion-detection-panasonic-industry-enhances-its-pir-sensor-portfolio-with-papirs/", "summary": "Panasonic Industry Europe announces the expansion of its proven PIR motion sensor portfolio with the introduction of PaPIRs+, the next evolution of its widely used PaPIRs technology. Designed to meet increasing demands in building automation and smart infrastructure, PaPIRs+ delivers significantly enhanced detection performance while maintaining the simplicity and reliability of conventional PIR solutions. Building &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/next-level-motion-detection-panasonic-industry-enhances-its-pir-sensor-portfolio-with-papirs/\">Read More &#8594;<span class=\"screen-reader-text\"> \"Next level motion detection: Panasonic Industry enhances its PIR sensor portfolio with PaPIRs+\"<\/span><\/a>"}, {"title": "IK Multimedia Launches ReSing Voices Brazilian Pack and New Singer Showcase", "source": "EE Journal", "date": "2026-07-13", "url": "https://www.eejournal.com/industry_news/ik-multimedia-launches-resing-voices-brazilian-pack-and-new-singer-showcase/", "summary": "IK Multimedia today announced the ReSing Voices Brazilian Pack, adding eight new Brazilian Portuguese voice models and unlocking Portuguese voice model creation for ReSing users. The company also introduced the new ReSing Singer Showcase, offering a new way to discover, purchase, and permanently own individual ReSing voice models. ReSing is a plug-in and standalone application that enables &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/ik-multimedia-launches-resing-voices-brazilian-pack-and-new-singer-showcase/\">Read More &#8594;<span class=\"screen-reader-text\"> \"IK Multimedia Launches ReSing Voices Brazilian Pack and New Singer Showcase\"<\/span><\/a>"}, {"title": "Research reveals how grassroots football could help tackle climate change", "source": "EE Journal", "date": "2026-07-13", "url": "https://www.eejournal.com/industry_news/research-reveals-how-grassroots-football-could-help-tackle-climate-change/", "summary": "With international football met with increasing criticism over its carbon footprint, University of Bath students are working with Bath City FC to show how community football could help tackle climate change. Using real data from the club, researchers identified practical, low-cost decarbonisation options, alongside longer-term investments that could transform how grassroots clubs use and produce &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/research-reveals-how-grassroots-football-could-help-tackle-climate-change/\">Read More &#8594;<span class=\"screen-reader-text\"> \"Research reveals how grassroots football could help tackle climate change\"<\/span><\/a>"}, {"title": "Adiuvo’s $50 Forgix Board Crams RP2354 Microcontroller and Trion T8 FPGA into a 28-pin Teensy Footprint", "source": "EE Journal", "date": "2026-07-13", "url": "https://www.eejournal.com/article/adiuvos-50-forgix-board-crams-rp2354-microcontroller-and-trion-t8-fpga-into-a-28-pin-teensy-footprint/", "summary": "<img alt=\"\" class=\"webfeedsFeaturedVisual wp-post-image\" height=\"287\" src=\"https://www.eejournal.com/wp-content/uploads/2026/07/Adiuvo-Forgix-Board-300x287.jpg\" style=\"display: block; margin-bottom: 5px; clear: both;\" width=\"300\" />Hot on the heels of Adiuvo’s introduction of the Explorer FPGA board (see “Need a low-cost FPGA dev board? Check out Adiuvo Engineering’s $99 Explorer board with an AMD Artix UltraScale+ FPGA”), the company has now introduced a $50 development board called Forgix, which combines a Raspberry Pi Pico RP2354 with Efinix Trion T8 FPGA, &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/article/adiuvos-50-forgix-board-crams-rp2354-microcontroller-and-trion-t8-fpga-into-a-28-pin-teensy-footprint/\">Read More &#8594;<span class=\"screen-reader-text\"> \"Adiuvo’s $50 Forgix Board Crams RP2354 Microcontroller and Trion T8 FPGA into a 28-pin Teensy Footprint\"<\/span><\/a>"}, {"title": "Hackaday Links: July 12, 2026", "source": "Hackaday", "date": "2026-07-12", "url": "https://hackaday.com/2026/07/12/hackaday-links-july-12-2026/", "summary": "<div><img alt=\"Hackaday Links Column Banner\" class=\"attachment-large size-large wp-post-image\" height=\"430\" src=\"https://hackaday.com/wp-content/uploads/2014/11/had-links-banner.jpg?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>Although we&#8217;d rather bring you news of clever modifications and repairs down on the farm, more often than not, the name &#8220;John Deere&#8221; has appeared on the pages of Hackaday <a class=\"read-more\" href=\"https://hackaday.com/2026/07/12/hackaday-links-july-12-2026/\">&#8230;read more<\/a>"}, {"title": "Porting the Nvidia GPU Driver to Haiku for 3D Acceleration", "source": "Hackaday", "date": "2026-07-12", "url": "https://hackaday.com/2026/07/12/porting-the-nvidia-gpu-driver-to-haiku-for-3d-acceleration/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"431\" src=\"https://hackaday.com/wp-content/uploads/2026/07/haiku_3d_accelerated_nvidia_gpu_action_retro_youtube.jpg?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>As good as a desktop OS may be, at some point it has to feature accelerated 3D graphics. This has been a bit of a sticking point for Haiku OS, <a class=\"read-more\" href=\"https://hackaday.com/2026/07/12/porting-the-nvidia-gpu-driver-to-haiku-for-3d-acceleration/\">&#8230;read more<\/a>"}, {"title": "Building a Better CNC Hot Wire Foam Cutter", "source": "Hackaday", "date": "2026-07-12", "url": "https://hackaday.com/2026/07/12/building-a-better-cnc-hot-wire-foam-cutter/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"433\" src=\"https://hackaday.com/wp-content/uploads/2026/07/hot_wire_foam_cutting_cnc_michael_rechtin_youtube.jpg?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>Cutting foam with a hot wire is a common technique to shape foam in a wide variety of shapes. If you want to cut something detailed and precise, like an <a class=\"read-more\" href=\"https://hackaday.com/2026/07/12/building-a-better-cnc-hot-wire-foam-cutter/\">&#8230;read more<\/a>"}, {"title": "Beelink EQi review – Part 2: An Intel Core 3 304 “Wildcat Lake” mini PC tested with Windows 11 Pro", "source": "CNX Software", "date": "2026-07-12", "url": "https://www.cnx-software.com/2026/07/12/beelink-eqi-review-intel-core-3-304-wildcat-lake-mini-pc-windows-11-pro/", "summary": "<div><img alt=\"Beelink EQi Wildcat Lake Core 3 304 Windows 11 mini PC review\" class=\"attachment-medium size-medium wp-post-image\" height=\"555\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/07/Beelink-EQi-Wildcat-Lake-Core-3-304-Windows-11-mini-PC-review-720x555.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>We&#8217;ve already checked out the specifications and hardware of the Beelink EQi Wildcat Lake mini PC in the first part of the review, with an unboxing and a teardown, before booting the mini PC into the pre-installed Windows 11 Pro for a first quick look. We’ve now had time to test the Intel Core 3 304 mini PC in more detail on Windows 11 Pro, so we’ll report our experience. The review includes feature testing, benchmark results, 4K and 8K YouTube video playback, 10GbE, 2.5GbE, and WiFi network performance evaluation, cooling performance, and measurement of fan noise and power consumption. Software Overview and Feature Testing After fully updating Windows 11 Pro and drivers to the latest version (excluding previews), I went to System &#62; About window again. We still have a 1.50 GHz (base frequency) Intel Core 3 304 processor with 16GB 6400MT/s memory, and 834GB of storage from the [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/07/12/beelink-eqi-review-intel-core-3-304-wildcat-lake-mini-pc-windows-11-pro/\">Beelink EQi review &#8211; Part 2: An Intel Core 3 304 &#8220;Wildcat Lake&#8221; mini PC tested with Windows 11 Pro<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Adafruit Weekly Editorial Round-Up: Adafruit Summer Sale! and more!", "source": "Adafruit", "date": "2026-07-12", "url": "https://blog.adafruit.com/2026/07/12/adafruit-weekly-editorial-round-up-adafruit-summer-sale-and-more/", "summary": "ADAFRUIT WEEKLY EDITORIAL ROUND-UP We’ve got so much happening here at Adafruit that it’s not always easy to keep up! Don’t fret, we’ve got you covered. Each week we’ll be posting a handy round-up of what we’ve been up to, ranging from learn guides to blog articles, videos, and more. SALE Use the code Gleam15 [&#8230;]"}, {"title": "Close Encounters Hat #AdafruitLearnSystem", "source": "Adafruit", "date": "2026-07-12", "url": "https://blog.adafruit.com/2026/07/12/close-encounters-hat-adafruitlearnsystem/", "summary": "Surpise your friends with a mother ship on your head, Spielberg style with this guide from the Adadfruit Learn System! The Close Encounters hat is a nod to the incredible movie &#8212; with lights and sounds that mimic the mother ship, all stowed under the brim. A photocell triggers the action for GEMMA, while the [&#8230;]"}, {"title": "Lua-programmable ELM11-Feather board puts Gowin GW1NR FPGA into Feather form factor (Crowdfunding)", "source": "CNX Software", "date": "2026-07-11", "url": "https://www.cnx-software.com/2026/07/11/lua-programmable-elm11-feather-board-puts-gowin-gw1nr-fpga-into-feather-form-factor/", "summary": "<div><img alt=\"ELM11-Feather FPGA board\" class=\"attachment-medium size-medium wp-post-image\" height=\"383\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/07/ELM11-Feather-FPGA-board-720x383.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>BrisbaneSilicon ELM11-Feather is a &#8220;microcontroller&#8221; board based on a Gowin GW1NR FPGA that is natively programmable in Lua, C, SystemVerilog, and VHDL. Compatible with the Adafruit Feather form factor, the board features GPIO headers, a built-in debugger, a USB-C port for power and programming, and a 2-pin header for a LiPo battery. The company calls it a microcontroller board because the FPGA runs a PicoRV32 MCU softcore at up to 75 MHz with 1MB RAM and 8MB flash, programmable with Lua, and the user can also customize hardware layers with RTL code using the remaining FPGA fabric. ELM11-Feather specifications: FPGA &#8211; Gowin GW1NR-LV9 FPGA from the GW1NR-9 family 8K LUTs 8,640 logical units (LUTs) 6,480 flip-flop 17,280 bits shadow SRAM (SSRAM) 486 Kbit block SRAM (BSRAM) 64 Mbit (8MB) PSRAM 608 Kbit user flash 2x PLL Up to 276x user I/O USB &#8211; 1x USB Type-C port for power and [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/07/11/lua-programmable-elm11-feather-board-puts-gowin-gw1nr-fpga-into-feather-form-factor/\">Lua-programmable ELM11-Feather board puts Gowin GW1NR FPGA into Feather form factor (Crowdfunding)<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Adafruit New Products 7/07/2026", "source": "Adafruit", "date": "2026-07-11", "url": "https://blog.adafruit.com/2026/07/11/adafruit-new-products-7-07-2026/", "summary": "We&#8217;ve got the New nEw NEW for you right here This week we debuted 5 New Products. Visit www.adafruit.com/new for more info. Want to get new products info beamed straight into your inbox? New nEw NEWs From Adafruit is an email newsletter sent once a week to subscribers only. It features new products, special offers, [&#8230;]"}, {"title": "The Python on Microcontrollers Newsletter: subscribe for free", "source": "Adafruit", "date": "2026-07-11", "url": "https://blog.adafruit.com/2026/07/11/the-python-on-microcontrollers-newsletter-subscribe-for-free-7-11/", "summary": "The Python for Microcontrollers Newsletter is the place for the latest news involving Python on hardware (microcontrollers AND single board computers like Raspberry Pi). This ad-free, spam-free weekly email is filled with CircuitPython, MicroPython, and Python information that you may have missed, all in one place! You get a summary of all the software, events, projects, and the latest hardware worldwide once a week, no [&#8230;]"}, {"title": "M5Stack Stamp-C5 – A Tiny ESP32-C5 USB-C board/module with up to 19 GPIO, 3.7V battery support", "source": "CNX Software", "date": "2026-07-10", "url": "https://www.cnx-software.com/2026/07/10/m5stack-stamp-c5-a-tiny-esp32-c5-usb-c-board-module-with-up-to-19-gpio-3-7v-battery-support/", "summary": "<div><img alt=\"M5Stack Stamp-C5\" class=\"attachment-medium size-medium wp-post-image\" height=\"405\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/07/M5Stack-Stamp-C5-720x405.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>M5Stack Stamp-C5, also known as the M5Stamp-C5, is a tiny wireless IoT USB-C board based on the Espressif ESP32-C5 RISC-V microcontroller with dual-band WiFi 6, Bluetooth LE, and 802.15.4 (Zigbee/Thread) connectivity. Despite its small size (19.1 x 17.6mm), the module exposes up to nineteen GPIO pins, eleven on standard 2.54mm pitch headers and castellated holes, and eight on an FPC extension connector. The board also supports battery charging and ships with an external IPEX antenna for wireless connectivity, since there&#8217;s no built-in antenna. M5Stack Stamp-C5 specifications: Wireless MCU –  Espressif Systems ESP32-C5HF4 CPU Single-core 32-bit RISC-V processor @ up to 240 MHz Low-power RISC-V core @ 48 MHz acting as the main processor for power-sensitive applications Memory – 384 KB SRAM on-chip Storage – 320 KB ROM, 4MB SPI flash Wireless Dual-band (2.4/5 GHz) 802.11ax WiFi 6, 802.11b/g/n WiFi 4 backward compatibility WiFi modes: Station mode, SoftAP mode, SoftAP + [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/07/10/m5stack-stamp-c5-a-tiny-esp32-c5-usb-c-board-module-with-up-to-19-gpio-3-7v-battery-support/\">M5Stack Stamp-C5 &#8211; A Tiny ESP32-C5 USB-C board/module with up to 19 GPIO, 3.7V battery support<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Open Book Touch – A DRM-free, WiFi-connected 4.26-inch open-source hardware e-reader (Crowdfunding)", "source": "CNX Software", "date": "2026-07-10", "url": "https://www.cnx-software.com/2026/07/10/open-book-touch-a-drm-free-wifi-connected-4-26-inch-open-source-hardware-e-reader/", "summary": "<div><img alt=\"Open Book Touch\" class=\"attachment-medium size-medium wp-post-image\" height=\"557\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/07/Open-Book-Touch-720x557.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Oddly Specific Objects has launched a crowdfunding campaign for the Open Book Touch, an ESP32-S3-based e-reader with a 4.26-inch e-paper display with 480 x 800 resolution and a capacitive touch screen. The open-source hardware device comes with 16 MB flash, 8MB PSRAM, a frontlight with warm and cool LEDs, a microSD card for storage, and an 800 mAh user-replaceable LiPo battery with everything housed in a 3D printed enclosure. Open Book Touch specifications: SoC &#8211; Espressif Systems ESP32-S3 dual-core MCU with Wi-Fi and Bluetooth LE connectivity Memory &#8211; 8 MB octal SPI PSRAM Storage 16 MB quad SPI flash MicroSD card slot Display 4.26-inch, 480 × 800 e-paper; 1-bit and 2-bit grayscale with dithering Capacitive touchscreen based on FT6336 low-power controller Frontlight &#8211; five warm + five cool LEDs, independently dimmable USB &#8211; USB Type-C for power/charging and programming Misc &#8211; 3D-printed plastic enclosure; snap-fit, with 3D-printable CAD for custom shells; [...]<\/p>\n ess to compiler optimization features and [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/microchip-offers-free-mplab-compiler-and-ai-tools/\">Microchip Offers Free MPLAB Compiler and AI Tools<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "John Park’s CircuitPython Parsec: Nested Display Groups", "source": "Adafruit", "date": "2026-07-10", "url": "https://blog.adafruit.com/2026/07/10/john-parks-circuitpython-parsec-nested-display-groups/", "summary": "#circuitpythonparsec Transform groups of groups with displayio inside of CircuitPython. code example To learn about CircuitPython: https://circuitpython.org &#160;"}, {"title": "The Python on Microcontrollers Newsletter: subscribe for free", "source": "Adafruit", "date": "2026-07-10", "url": "https://blog.adafruit.com/2026/07/10/the-python-on-microcontrollers-newsletter-subscribe-for-free-7-10/", "summary": "The Python for Microcontrollers Newsletter is the place for the latest news involving Python on hardware (microcontrollers AND single board computers like Raspberry Pi). This ad-free, spam-free weekly email is filled with CircuitPython, MicroPython, and Python information that you may have missed, all in one place! You get a summary of all the software, events, projects, and the latest hardware worldwide once a week, no [&#8230;]"}, {"title": "Filament Spool Dry Box – Pelican-Style Latching #3DPrinting #3DThursday", "source": "Adafruit", "date": "2026-07-10", "url": "https://blog.adafruit.com/2026/07/09/filament-spool-dry-box-pelican-style-latching-3dprinting-3dthursday/", "summary": "bcrooks shares: A Pelican-style latching dry box for a single 1kg filament spool. Robust latches with a TPU seal keep moisture out. Separate desiccant compartments hold beads in place, with an optional hygrometer install for humidity monitoring. Base needs tree support for the hygrometer variant. Ironed top surface for better sealing. By bcrooks download the [&#8230;]"}, {"title": "Inside NTT’s Photonics Breakthroughs: A Roadmap to Light-Based Computing", "source": "EE Journal", "date": "2026-07-10", "url": "https://www.eejournal.com/fish_fry/inside-ntts-photonics-breakthroughs-a-roadmap-to-light-based-computing/", "summary": "<img alt=\"\" class=\"webfeedsFeaturedVisual wp-post-image\" height=\"300\" src=\"https://www.eejournal.com/wp-content/uploads/2026/07/AD-071026-300x300.png\" style=\"display: block; margin-bottom: 5px; clear: both;\" width=\"300\" />Let’s talk about Photonics! My guests are esteemed scientists Tim McKenna and Ryo Yanagimoto, from the Physics &#38; Informatics Laboratories at NTT. Tim and I chat about balancing theoretical physics with real-world applications at NTT, his most exciting photonics projects, and the primary obstacles to replacing traditional electronics with photonic technologies. Ryo and I dig &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/fish_fry/inside-ntts-photonics-breakthroughs-a-roadmap-to-light-based-computing/\">Read More &#8594;<span class=\"screen-reader-text\"> \"Inside NTT’s Photonics Breakthroughs: A Roadmap to Light-Based Computing\"<\/span><\/a>"}, {"title": "Makerfabs MaUWB for Home Assistant – An ESP32-S3 UWB module with PoE and enclosure", "source": "CNX Software", "date": "2026-07-09", "url": "https://www.cnx-software.com/2026/07/09/makerfabs-mauwb-for-home-assistant-an-esp32-s3-uwb-module-with-poe-and-enclosure/", "summary": "<div><img alt=\"MaUWB for Home Assistant\" class=\"attachment-medium size-medium wp-post-image\" height=\"480\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/07/MaUWB-for-Home-Assistant-720x480.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Makerfabs MaUWB for Home Assistant is an ESP32-S3-based Ultra-Wideband (UWB) module designed for indoor positioning and Real-Time Location Systems (RTLS). It runs ESPHome for Home Assistant integration, enabling it to be used as part of a UWB-based positioning system to track tagged devices in homes, offices, and other indoor environments. The module combines an ESP32-S3 with a MaUWB UWB module based on the Qorvo DW3000, featuring a PA/LNA for long-range ranging. Compared to the earlier ESP32-S3 version, it drops the OLED and adds a WIZnet W5500 Ethernet controller that supports PoE. The module also supports Wi-Fi 4 and Bluetooth 5.0, and comes in an enclosure for fixed installations. Makerfabs MaUWB for Home Assistant specifications: Wireless Module – ESP32-S3-WROOM-1 SoC – Espressif Systems ESP32-S3 CPU – Dual-core Tensilica LX7 up to 240 MHz with vector extension for AI/ML workloads RAM – 512KB SRAM; 8MB PSRAM Wireless – WiFi 4 and Bluetooth LE 5 [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/07/09/makerfabs-mauwb-for-home-assistant-an-esp32-s3-uwb-module-with-poe-and-enclosure/\">Makerfabs MaUWB for Home Assistant – An ESP32-S3 UWB module with PoE and enclosure<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Norik Systems introduces nRF9151-based USB Dongle for DECT NR+ deployments", "source": "CNX Software", "date": "2026-07-09", "url": "https://www.cnx-software.com/2026/07/09/norik-systems-introduces-nrf9151-based-usb-dongle-for-dect-nr-deployments/", "summary": "<div><img alt=\"Norik DECT NR+ USB dongle\" class=\"attachment-medium size-medium wp-post-image\" height=\"377\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/07/Norik-DECT-NR-USB-dongle-720x377.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Norik Systems has developed a compact USB dongle based on Nordic Semiconductor’s nRF9151 SiP, mostly designed to work as a DECT NR+ child node or a USB-powered gateway. As a reminder, DECT NR+ is a non-cellular 5G standard for long-range low-power applications that works at 1.9 GHz and supports up to one million nodes through mesh, star, and point-to-point topologies. The Norik USB dongle enables developers to easily add DECT NR+ to gateways or child modes. Norik Systems DECT NR+ USB dongle specifications: Wireless System-in-Package – Nordic Semi nRF9151 CPU – Arm Cortex-M33 @ 64 MHz Memory – 256KB RAM Storage – 1MB flash Connectivity Multimode LTE-M/NB-IoT/NB-NTN modem with DECT NR+ support and GNSS. 700-2200 MHz LTE band support. Power Class 5 20 dBm Power Class 3 23 dBm 1.9 GHz and 915 MHz DECT NR+ band support (1, 2, 9, 22) Security – Arm TrustZone + Arm CryptoCell 310. [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/07/09/norik-systems-introduces-nrf9151-based-usb-dongle-for-dect-nr-deployments/\">Norik Systems introduces nRF9151-based USB Dongle for DECT NR+ deployments<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "eSOL Brings Game Engine Visualization to Industrial Embedded Development", "source": "Embedded.com", "date": "2026-07-09", "url": "https://www.embedded.com/esol-brings-game-engine-visualization-to-industrial-embedded-development/", "summary": "<p>The 3D engine demonstrates how visualization, simulation, HMI, and ROS-based workflows are converging with the embedded development stack.<\/p>\n<p>The post <a href=\"https://www.embedded.com/esol-brings-game-engine-visualization-to-industrial-embedded-development/\">eSOL Brings Game Engine Visualization to Industrial Embedded Development<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "Edge Intelligence Redefines What SDVs Can Do", "source": "Embedded.com", "date": "2026-07-09", "url": "https://www.embedded.com/edge-intelligence-redefines-what-sdvs-can-do/", "summary": "<p>Software-defined vehicles (SDVs) are increasing the need to process intelligence closer to the systems that are generating data. Modern vehicles produce large amounts of data from sensors, control units, and diagnostic systems, making it inefficient and costly to send all the raw data to the cloud
