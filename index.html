://spectrum.ieee.org/domestic-humanoid-robot-safety-standards", "summary": "<img src=\"https://spectrum.ieee.org/media-library/close-up-of-an-elderly-persons-fingers-touching-the-silicon-hand-of-a-humanoid-robot.jpg?id=66748937&amp;width=1245&amp;height=700&amp;coordinates=0%2C469%2C0%2C469\" /><br /><br /><p>The International Organization for Standardization (ISO) is updating its <a href=\"https://www.iso.org/standard/53820.html\" rel=\"noopener noreferrer\" target=\"_blank\">12-year-old safety requirements<\/a> for <a href=\"https://spectrum.ieee.org/stretch-4-home-robot\" target=\"_blank\">personal care robots<\/a>. A lot has happened since the last revision, both on the technology side and with researchers’ understanding of safety for humans collaborating with domestic robots. The proposed ISO update addresses hazard identification, risk assessment, and different use scenarios. It does not, however, set limits, propose testing methods, or have enforcement mechanisms that might address <a href=\"https://spectrum.ieee.org/humanoid-robot-scaling\" target=\"_blank\">the complexities of human-robot collaboration<\/a>. And that is a problem, argues technology policy researcher <a href=\"https://scholar.google.com/citations?user=KNzdhYYAAAAJ&amp;hl=ko\" rel=\"noopener noreferrer\" target=\"_blank\">Jae-Seong Lee<\/a> of the Electronics and Telecommunications Research Institute in Daejeon, South Korea.<\/p><p><strong>Why is the next revision of ISO 13482 a big deal?<\/strong><br /><strong>Jae-Seong Lee:<\/strong> The standard is moving into final approval at a moment when domestic humanoid robot makers are shifting from lab prototypes to products aimed at real homes, real caregivers, and real families. That matters because the standard does more than specify geometry and impact limits. It helps define what counts as acceptable robot behavior in the messy world of everyday life.<\/p><p><strong>What is the core engineering problem?<\/strong><br /><strong>Lee:<\/strong> It is not simply whether a robot can avoid collisions or detect people in its path. The harder problem is that human-robot interaction is bidirectional. The robot changes what the human does, and the human changes what the robot perceives and does next. In other words, safety is not a fixed property of the machine alone; it emerges from the relationship.<\/p><p><strong>Isn’t that already covered by current safety standards?<\/strong><br /><strong>Lee: <\/strong>Only partially. ISO 13482 addresses personal care robots through hazard identification, risk assessment, and intended use scenarios, and related guidance acknowledges noncontact hazards such as unpredictability and incorrect autonomous decisions. But it stops short of binding compliance criteria, test methods, or enforcement mechanisms for the hazards produced by the human-robot relationship.<\/p><p class=\"pull-quote\">The technical community understands bidirectional coupling, and the standards framework acknowledges relevant hazards, but no current standard fully converts that knowledge into enforceable rules for domestic autonomy.—Jae-Seong Lee<\/p><p><strong>Why can’t engineers just better define a robot’s operating envelope?<\/strong><br /><strong>Lee:<\/strong> Because the value proposition of a domestic humanoid depends on operating in uncontrolled environments. A robot that is safe only in standardized rooms, with healthy adults, under well-defined conditions is not really a domestic humanoid at all. <\/p><p>In industrial robotics, designers can usually bound the task, the workspace, and the population. In a home, the robot must adapt to elderly residents, children, visitors, pets, clutter, tight spaces, and fluctuating human behavior. Those aren’t edge cases. Those are the baseline. Tightening the domain to be more like that of factory robots would make the home robots less useful. <\/p><p><strong>The proposal mentions training data. Why does that matter?<\/strong><br /><strong>Lee:<\/strong> Because the data already reflect the diversity of domestic life. Companies building humanoid training datasets are reportedly sending paying contract workers around the world to record their chores in ordinary settings. That means the robots will be trained on real-world variability, not sanitized demonstrations. The safety problem is therefore in the composition of the entire human-robot system, not in any one component.<\/p><p><strong>What is the standards gap?<\/strong><br /><strong>Lee: <\/strong>The gap is governance. The technical community understands bidirectional coupling, and the standards framework acknowledges relevant hazards, but no current standard fully converts that knowledge into enforceable rules for domestic autonomy. What is missing is a way to specify safe behavior across the full range of human conditions the robot will actually encounter.<\/p><p>What’s also missing is a decision about who gets to decide whose behavior counts as normal. Whose gait sets the baseline? Whose is an acceptable risk threshold? Whose definition of safe judgment gets written into the requirement language? Those are value judgments, not purely engineering ones. A standards committee cannot avoid choosing a normative reference point; it can only decide whether that choice is explicit and inclusive.<\/p><p><strong>Who could help answer those questions?<\/strong><br /><strong>Lee: <\/strong>The proposal argues that the people most affected by domestic humanoids are not systematically represented in the working groups shaping the standard. It points especially to older adults, who are often the primary intended users of domestic care robots, yet whose movement patterns and cognitive states are not directly embedded in the standards process.<\/p><p>In other words, this revision acknowledges the hardest problems but pushes unresolved issues into advisory language, nonbinding guidance, or future revision scopes. That can be useful, but it also delays the real question: What counts as safe relational behavior in the home?<\/p><p><strong>What are the stakes?<\/strong><br /><strong>Lee: <\/strong>The risk is not only injury, though that is the obvious concern. The deeper risk is that safety assumptions get baked into products and standards before the market, regulators, and users have a chance to question them. Once deployment patterns harden, it becomes much harder to revise the baseline.<\/p><p><strong>What should the engineers on the standards bodies do about it?<\/strong><br /><strong>Lee: <\/strong>The engineers on the standards body should ask not just, “What are the robot’s outputs, and do they stay within safe thresholds?” but “What states does this robot engage with, and does that engagement remain safe across the full range of those states?” That shift sounds subtle, but it changes the design brief. It moves safety from machine-centric measurement toward system-level relational assurance.<\/p><p>Domestic humanoid safety cannot be solved by machine engineering alone. It requires a framework that treats the human not as background noise, but as part of the system, part of the definition of the safety envelope. <\/p>"}, {"title": "Into the Omniverse: Manufacturing’s Simulation-First Era Has Arrived", "source": "NVIDIA Robotics", "date": "2026-04-28", "url": "https://blogs.nvidia.com/blog/manufacturing-simulation-first/", "summary": "Manufacturing’s traditional design-build-test cycle rested on a single assumption: Real-world testing was the only reliable test environment."}, {"title": "NVIDIA and Partners Showcase the Future of AI-Driven Manufacturing at Hannover Messe 2026", "source": "NVIDIA Robotics", "date": "2026-04-20", "url": "https://blogs.nvidia.com/blog/ai-manufacturing-hannover-messe/", "summary": "Manufacturing is at an inflection point. Across every major industrial economy, the pressure to do more with less — due to faster design cycles, leaner operations and strain on skilled labor pools — is accelerating the shift to AI-driven production.  The question is no longer whether to adopt AI, but how fast and at what [&#8230;]"}, {"title": "National Robotics Week — Latest Physical AI Research, Breakthroughs and Resources", "source": "NVIDIA Robotics", "date": "2026-04-10", "url": "https://blogs.nvidia.com/blog/national-robotics-week-2026/", "summary": "This National Robotics Week, NVIDIA is highlighting the breakthroughs that are bringing AI into the physical world — as well as the growing wave of robots transforming industries, from agricultural and manufacturing to energy and beyond. Advancements in robot learning, simulation and foundation models are accelerating development, enabling robots to move from training in virtual [&#8230;]"}, {"title": "Into the Omniverse: NVIDIA GTC Showcases Virtual Worlds Powering the Physical AI Era", "source": "NVIDIA Robotics", "date": "2026-03-26", "url": "https://blogs.nvidia.com/blog/gtc-2026-virtual-worlds-physical-ai/", "summary": "Editor’s note: This post is part of Into the Omniverse, a series focused on how developers, 3D practitioners, and enterprises can transform their workflows using the latest advances in OpenUSD and NVIDIA Omniverse. NVIDIA GTC last week showcased a turning point in physical AI: Robots, vehicles and factories are scaling from single use cases and [&#8230;]"}], "embeddedNews": [{"title": "Raspberry Pi Locator Website to Shut Down in July", "source": "Hackaday", "date": "2026-06-24", "url": "https://hackaday.com/2026/06/24/raspberry-pi-locator-website-to-shut-down-in-july/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"533\" src=\"https://hackaday.com/wp-content/uploads/2023/09/ch01-raspberrypi5-rp1.png?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>As announced by [André] on Bluesky, next month the much loved Rpilocator.com website will cease displaying the stock status and pricing of Raspberry Pi computers from various online retailers. One <a class=\"read-more\" href=\"https://hackaday.com/2026/06/24/raspberry-pi-locator-website-to-shut-down-in-july/\">&#8230;read more<\/a>"}, {"title": "A T9 Keyboard For Your Smartphone", "source": "Hackaday", "date": "2026-06-24", "url": "https://hackaday.com/2026/06/24/a-t9-keyboard-for-your-smartphone/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"449\" src=\"https://hackaday.com/wp-content/uploads/2026/06/Screenshot-2026-06-24-144047-e1782276074714.png?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>These days, most of us are fortunate enough to use smartphones with decent touchscreen keyboard capabilities. However, once upon a time, if you wanted to type something on a phone, <a class=\"read-more\" href=\"https://hackaday.com/2026/06/24/a-t9-keyboard-for-your-smartphone/\">&#8230;read more<\/a>"}, {"title": "One Commodore, Five Displays", "source": "Hackaday", "date": "2026-06-24", "url": "https://hackaday.com/2026/06/23/one-commodore-five-displays/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"450\" src=\"https://hackaday.com/wp-content/uploads/2026/06/5monitorC128-feat.jpg?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>If you had one monitor back in the 8-bit era, instead of having to wait to use the family TV, you were already amongst the blessed. If you had five, <a class=\"read-more\" href=\"https://hackaday.com/2026/06/23/one-commodore-five-displays/\">&#8230;read more<\/a>"}, {"title": "EVs Always Beat Combustion Emissions Performance", "source": "Hackaday", "date": "2026-06-24", "url": "https://hackaday.com/2026/06/23/evs-always-beat-combustion-emissions-performance/", "summary": "<div><img alt=\"A heat map of the US showing the difference in emissions between an EV and ICE or EV and PHEV by county. Rural areas, particularly in Colorado in Wyoming seem close to no difference (in blue) whereas densely-populated areas on the coasts are colored on the red end of spectrum exceeding a 70% emissions reduction over ICE vehicles.\" class=\"attachment-large size-large wp-post-image\" height=\"592\" src=\"https://hackaday.com/wp-content/uploads/2026/06/EV-vs-PHEV-vs-Hybrid-vs-ICE-emissions.jpg?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>A pervasive story is that electric vehicles (EVs or BEVs) are actually dirtier than combustion vehicles if charged by a fossil fuel-based electricity grid. A new study reaffirms others that <a class=\"read-more\" href=\"https://hackaday.com/2026/06/23/evs-always-beat-combustion-emissions-performance/\">&#8230;read more<\/a>"}, {"title": "Graperain GR1126MB development board features solder-on 3 TOPS Rockchip RV1126B AI Vision module", "source": "CNX Software", "date": "2026-06-24", "url": "https://www.cnx-software.com/2026/06/24/graperain-gr1126mb-development-board-features-solder-on-3-tops-rockchip-rv1126b-ai-vision-module/", "summary": "<div><img alt=\"GrapeRain GR1126MB Ai VIsion development board\" class=\"attachment-medium size-medium wp-post-image\" height=\"556\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/06/GrapeRain-GR1126MB-Ai-VIsion-development-board-720x556.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Graperain GR1126MB development board is based on a 42x42mm GR1126B 160-pin stamp-hole system-on-module powered by a Rockchip RV1126B AI camera SoC with a 3 TOPS NPU designed for AI vision, machine vision, and edge AI applications. Graperain GR1126 AI Vision system-on-module GR1126 specifications: SoC – Rockchip RV1126B CPU – Quad-core Arm Cortex-A53 up to 1.6 GHz with 32KB L1 I-Cache and 32KB L1 D-Cache, unified 512KB L2 Cache GPU – 2D Graphics Engine VPU Video Decoder – H.265/H.264 up to 4K @ 30 FPS Video Encoder  – H.265, H.264, JPEG up to 4K @ 45 FPS JPEG Decoder ISP &#8211; Built-in 12M ISP and 8M AI-ISP AI accelerator – Rockchip NPU engine up to 3 TOPS (INT8); supports INT4, INT8, INT16, and FP16 models; TensorFlow, ONNX, PyTorch, and Caffe frameworks. System Memory – 1GB or 2GB DDR3 by default, customizable up to 4GB LPDDR4/LPDDR4x Storage – 8GB, 16GB, 32GB, 64GB, [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/06/24/graperain-gr1126mb-development-board-features-solder-on-3-tops-rockchip-rv1126b-ai-vision-module/\">Graperain GR1126MB development board features solder-on 3 TOPS Rockchip RV1126B AI Vision module<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "RP2350B bells&whistles development board features on-board RP2040 debugger, HDMI, and microSD card slot", "source": "CNX Software", "date": "2026-06-24", "url": "https://www.cnx-software.com/2026/06/24/rp2350b-bellswhistles-development-board-features-on-board-rp2040-debugger-hdmi-and-microsd-card-slot/", "summary": "<div><img alt=\"RP2350B bells&amp;whistles board\" class=\"attachment-medium size-medium wp-post-image\" height=\"480\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/06/RP2350B-bellswhistles-board-720x480.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>While searching Tindie for a new project, I found a new Raspberry Pi RP2350B-based development board called “Bells&#38;Whistles,” which is interesting because it also features an onboard RP2040-based debugger running Picoprobe firmware, removing the need for a separate debug probe. Other than that, it has an HDMI output, a MicroSD card slot for storage, an optional 8 MB of PSRAM, and since it uses the Raspberry Pi RP2350B variant, it supports up to 46 GPIO pins. The board also features two USB Type-C ports, one for the RP2350B and the other for the RP2040 debugger, and is especially useful for clutter-free rapid prototyping and development workflows. RP2350B bells&#38;whistles board specifications: SoC – Raspberry Pi RP2350B CPU Dual-core Arm Cortex-M33 @ 150 MHz with Arm TrustZone Dual-core RISC-V Hazard3 @ 150 MHz Only two cores can be used at any given time Memory – 520 KB on-chip SRAM Package – QFN-80 Memory – [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/06/24/rp2350b-bellswhistles-development-board-features-on-board-rp2040-debugger-hdmi-and-microsd-card-slot/\">RP2350B bells&#038;whistles development board features on-board RP2040 debugger, HDMI, and microSD card slot<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Visualize radio signals with Raspberry Pi 5-based QuadRF 4×4 MIMO software-defined radio tile (Crowdfunding)", "source": "CNX Software", "date": "2026-06-24", "url": "https://www.cnx-software.com/2026/06/24/visualize-radio-signals-with-raspberry-pi-5-based-quadrf-4x4-mimo-software-defined-radio-tile/", "summary": "<div><img alt=\"QuadRF real-time RF camera\" class=\"attachment-medium size-medium wp-post-image\" height=\"498\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/06/QuadRF-real-time-RF-camera-720x498.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>QuadRF is a 4&#215;4 MIMO software-defined radio (SDR) tile powered by a Raspberry Pi 5 SBC that functions as a real-time RF camera, allowing users to visualize radio signals in their environment using a phone or computer running an augmented reality app. QuadRF measures differences in signal arrival time using four coherent antennas and renders a live RF overlay directly on your phone or laptop at 30 FPS, letting you see RF signals from Wi-Fi devices, wireless cameras, smartphones, drones, beacons, and lab transmitters. QuadRF specifications: Compute &#38; Signal Processing Raspberry Pi 5 SBC for onboard computation and control. Lattice ECP5 FPGA (LFE5U-45F-7BG256I) for distributed DSP and beamforming. Analog Devices MAX2850 (Upconvert) &#38; MAX2851 (Downconvert) Mixers. 5.6 Gbit/sec MIPI data path between the RF FPGA and the Pi 5 Direct local processing on Pi 5 or network streaming for external processing. RF &#38; Wireless 4x Rx / 4x Tx full-duplex [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/06/24/visualize-radio-signals-with-raspberry-pi-5-based-quadrf-4x4-mimo-software-defined-radio-tile/\">Visualize radio signals with Raspberry Pi 5-based QuadRF 4&#215;4 MIMO software-defined radio tile (Crowdfunding)<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Aliro is a vendor-agnostic standard for digital access control working over NFC, Bluetooth LE, or UWB", "source": "CNX Software", "date": "2026-06-24", "url": "https://www.cnx-software.com/2026/06/24/aliro-is-a-vendor-agnostic-standard-for-digital-access-control-working-over-nfc-bluetooth-le-or-uwb/", "summary": "<div><img alt=\"Aliro\" class=\"attachment-medium size-medium wp-post-image\" height=\"404\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/06/Aliro-720x404.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Managed by the Connectivity Standards Alliance, Aliro is a smart lock/access control standard that works over NFC, Bluetooth LE, or UWB and is designed to be vendor-agnostic. While Matter is designed for Smart Home applications, Aliro specifically targets access control, and both aim to address market fragmentation. It was brought to my attention when we wrote about the Nordic nRF54L15 Tag, but we had already mentioned it for chips from other vendors such as STMicro (ST64UWB) and Qualcomm (FastConnect 8800), as well as earlier wireless MCUs from Nordic Semi such as the nRF54LM20A and nRF54LM20B. It appears to be adopted across the industry, so let&#8217;s have a closer look. Aliro 1.0 was first released in February 2026 with the following highlights: Leverages existing smartphones and wearables Framework utilizes asymmetric cryptography to ensure secure and trusted interactions between user devices and readers Integration with digital wallets from Apple, Google, Samsung, etc&#8230; [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/06/24/aliro-is-a-vendor-agnostic-standard-for-digital-access-control-working-over-nfc-bluetooth-le-or-uwb/\">Aliro is a vendor-agnostic standard for digital access control working over NFC, Bluetooth LE, or UWB<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "A Commodore Boombox: The 1350 as You’ve Never Heard it Before", "source": "Hackaday", "date": "2026-06-23", "url": "https://hackaday.com/2026/06/23/a-commodore-boombox-the-1350-as-youve-never-heard-it-before/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"533\" src=\"https://hackaday.com/wp-content/uploads/2026/06/datasette_boombox_battery_box.jpg?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>No, this isn&#8217;t another product from [PeriFractic]&#8217;s revived company, though we hope he&#8217;s taking notes. This is, in fact, a hack on the beloved 1530 Datasette, using the tape mechanism <a class=\"read-more\" href=\"https://hackaday.com/2026/06/23/a-commodore-boombox-the-1350-as-youve-never-heard-it-before/\">&#8230;read more<\/a>"}, {"title": "Reviving MSN Messenger’s i-Buddy USB Accessory", "source": "Hackaday", "date": "2026-06-23", "url": "https://hackaday.com/2026/06/23/reviving-msn-messengers-i-buddy-usb-accessory/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"512\" src=\"https://hackaday.com/wp-content/uploads/2026/06/i-buddy_msn_rayly_retro_youtube.jpg?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>Some of our esteemed readers were not yet out of diapers back in 2013 when Microsoft decided to put MSN Messenger out to pasture, but the memories that this instant <a class=\"read-more\" href=\"https://hackaday.com/2026/06/23/reviving-msn-messengers-i-buddy-usb-accessory/\">&#8230;read more<\/a>"}, {"title": "A BIOS For Your ESP32-C6", "source": "Hackaday", "date": "2026-06-23", "url": "https://hackaday.com/2026/06/23/a-bios-for-your-esp32-c6/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"450\" src=\"https://hackaday.com/wp-content/uploads/2026/06/c6-bios-featured.jpg?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>An old-style PC BIOS served the function of a bootloader in loading the operating system kernel, and of an API in providing a set of standard system calls through which <a class=\"read-more\" href=\"https://hackaday.com/2026/06/23/a-bios-for-your-esp32-c6/\">&#8230;read more<\/a>"}, {"title": "TerraMaster F4-425 Pro 4+3 Hybrid NAS gets Intel Core 3 N350 or Core i3-N305 octa-core CPU", "source": "CNX Software", "date": "2026-06-23", "url": "https://www.cnx-software.com/2026/06/23/terramaster-f4-425-pro-43-hybrid-nas-gets-intel-core-3-n350-or-core-i3-n305-octa-core-cpu/", "summary": "<div><img alt=\"TerraMaster F4-425 Pro Intel Core i3-N305 Core 3 N350\" class=\"attachment-medium size-medium wp-post-image\" height=\"420\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/06/TerraMaster-F4-425-Pro-Intel-Core-i3-N305-Core-3-N350-720x420.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>TerraMaster F4-425 Pro 4+3 Hybrid NAS  is an update of the F4-425 Plus Intel N150 NAS with a more powerful Intel Core 3 N350 &#8220;Twin Lake&#8221; octa-core processor or Core i3-N305 octa-core &#8220;Alder Lake-N&#8221; processor. Apart from the new processors, the new Pro model basically offers the same features with four SATA bays and three M.2 NVMe SSD sockets for storage (hence the 4+3 hybrid moniker), and dual 5GbE networking. It&#8217;s equipped with 8GB or 16GB DDR5 memory, and also adds four USB 3.2 ports for peripheral expansion, and an HDMI port for terminal access. TerraMaster F4-425 Pro specifications: SoC (one or the other) Intel Core i3-N305 octa-core Alder Lake-N processor @ up to 3.8 GHz (Turbo) with 6MB cache, 32U Intel HD graphics @ 1,250 MHz; TDP: 15W Intel Core 3 N350 octa-core Twin Lake processor @ up to 3.9 GHz (Turbo) with 6MB cache, 32U Intel HD graphics [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/06/23/terramaster-f4-425-pro-43-hybrid-nas-gets-intel-core-3-n350-or-core-i3-n305-octa-core-cpu/\">TerraMaster F4-425 Pro 4+3 Hybrid NAS gets Intel Core 3 N350 or Core i3-N305 octa-core CPU<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "MYiR MAC-B5760 fanless Edge AI industrial PC features Rockchip RK3576 SoC, optional RK1828 LLM/VLM module", "source": "CNX Software", "date": "2026-06-23", "url": "https://www.cnx-software.com/2026/06/23/myir-mac-b5760-fanless-edge-ai-industrial-pc-offers-rockchip-rk3576-soc-optional-rk1828-llm-vlm-module/", "summary": "<div><img alt=\"MYiR MAC-B5760\" class=\"attachment-medium size-medium wp-post-image\" height=\"336\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/06/MYiR-MAC-B5760-720x336.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>MYiR MAC-B5760 is a fanless Edge AI industrial box PC powered by a Rockchip RK3576 SoC with a built-in 6 TOPs NPU, and equipped with 8GB LPDDR5 and 64GB flash by default. The embedded system offers two Gigabit Ethernet ports, four USB 3.0 ports, HDMI and mini DP video outputs, a 3.5mm audio jack, a USB-C port for convenient serial console access, an optional WiFi 6 and Bluetooth 5.4 module, and expansion capability through an M.2 socket for NVMe SSD or AI accelerator, and a mini PCIe socket to add 4G LTE/5G cellular connectivity. MYiR MAC-B5760 specifications: SoC – Rockchip RK3576 CPU 4x Cortex-A72 cores @ 2.2GHz, four Cortex-A53 cores @ 1.8GHz Arm Cortex-M0 MCU at 400MHz GPU – ARM Mali-G52 MC3 GPU with support for OpenGL ES 1.1, 2.0 and 3.2, OpenCL up to 2.0 and Vulkan 1.1 NPU – 6 TOPS (INT8) AI accelerator with support for INT4, [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/06/23/myir-mac-b5760-fanless-edge-ai-industrial-pc-offers-rockchip-rk3576-soc-optional-rk1828-llm-vlm-module/\">MYiR MAC-B5760 fanless Edge AI industrial PC features Rockchip RK3576 SoC, optional RK1828 LLM/VLM module<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Coin-cell powered Nordic nRF54L15 Tag prototyping platform supports Bluetooth Channel Sounding, Matter, Edge AI", "source": "CNX Software", "date": "2026-06-23", "url": "https://www.cnx-software.com/2026/06/23/nordic-nrf54l15-tag-prototyping-platform-supports-bluetooth-channel-sounding-matter-edge-ai/", "summary": "<div><img alt=\"nRF54L15 Tag front side\" class=\"attachment-medium size-medium wp-post-image\" height=\"480\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/06/nRF54L15-Tag-front-side-720x480.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Nordic Semiconductor has launched the nRF54L15 Tag, a tiny coin-cell-powered prototyping platform designed to accelerate the development of ultra-low-power wireless IoT devices, including asset trackers compatible with the Apple Find My and Google Find Hub ecosystems. Built around the company’s nRF54L15 wireless SoC, the 33 mm-diameter tag uses a 2.4 GHz radio and includes two on-board antennas to improve distance-measurement reliability with Bluetooth Channel Sounding. The platform also integrates a 6-axis IMU and an environmental sensor, which can be used in tracking, sensing, and basic edge processing applications. Nordic nRF54L15 Tag specifications: Wireless MCU – Nordic Semi nRF54L15 wireless SoC CPU Arm Cortex-M33 @ up to 128 MHz RISC-V coprocessor for “software-defined peripheral” Memory – 256 KB SRAM Storage – 1.5MB Non-volatile Memory (NVM) Wireless Bluetooth LE 6.0 (includes Channel Sounding) Thread, Zigbee (I and updates easily. Download Grab the latest installer for your platform from the Releases page: 🪟 Windows (x64) [&#8230;]"}, {"title": "International Events Celebrating International Women in Engineering Day #EngineeringIntelligence @INWED1919  #INWED26", "source": "Adafruit", "date": "2026-06-23", "url": "https://blog.adafruit.com/2026/06/23/international-events-celebrating-international-women-in-engineering-day-engineeringintelligence-inwed1919-inwed26/", "summary": "image via WES &#160; Hey International friends, if you&#8217;re looking for a place to celebrate in person check out this map from WES to locate your closest INWED event"}, {"title": "A CircuitPython MCP server", "source": "Adafruit", "date": "2026-06-23", "url": "https://blog.adafruit.com/2026/06/23/a-circuitpython-mcp-server/", "summary": "CircuitPython MCP Server is a minimal MCP JSON-RPC server helpers for CircuitPython projects using adafruit_httpserver. This library lets a CircuitPython board run a real MCP server directly on the device. The host computer is only used for deployment, serial logs, and testing. Implemented HTTP endpoints: GET /: JSON status POST /mcp: MCP JSON-RPC over HTTP [&#8230;]"}, {"title": "Untold History of Women in STEM #EngineeringIntelligence @INWED1919  #INWED26", "source": "Adafruit", "date": "2026-06-23", "url": "https://blog.adafruit.com/2026/06/23/untold-history-of-women-in-stem-engineeringintelligence-inwed1919-inwed26/", "summary": "Found in the Obama White House Archives is a history of women pioneers in STEM, including some engineers, who changed the way our world is understood."}, {"title": "The Rooted Leader: Self-Leadership as a Strategic Advantage for Women in STEM #EngineeringIntelligence @INWED1919  #INWED26", "source": "Adafruit", "date": "2026-06-23", "url": "https://blog.adafruit.com/2026/06/23/the-rooted-leader-self-leadership-as-a-strategic-advantage-for-women-in-stem-engineeringintelligence-inwed1919-inwed26/", "summary": "Today we are celebrating International Women in Engineering Day! German Professor and Author Anna Frebel, PhD, who is currently working at MIT, has shared some great advice for women are leaders or are looking to become leaders in STEM fields, via The Society of Women Engineers: When you are encouraged to lean without a foundation, [&#8230;]"}, {"title": "Code like Hemingway", "source": "Adafruit", "date": "2026-06-23", "url": "https://blog.adafruit.com/2026/06/23/code-like-hemingway/", "summary": "Software developers are soon going to have to take a lesson from Hemingway. It’s not hard to be concise in code. You have to be, by design. Claude Code, Codex, Copilot, and the rest all love to be “spoken” to in Markdown. We used to define our code with unit tests and specifications written for humans. [&#8230;]"}, {"title": "Shaping the Edge AI Standard for IoT Compute – Synaptics and Mouser Electronics", "source": "EE Journal", "date": "2026-06-23", "url": "https://www.eejournal.com/chalk_talks/shaping-the-edge-ai-standard-for-iot-compute-synaptics-and-mouser/", "summary": "In this episode of Chalk Talk, Nebu Philips from Synaptics and Amelia Dalton explore Synaptics&#8217; vision for Edge AI, discuss the Astra Machina evaluation platform, examine the Torq Edge AI ecosystem, and look at how partnerships with companies like Google are helping build the next generation of intelligent IoT devices. Click here for more information &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/chalk_talks/shaping-the-edge-ai-standard-for-iot-compute-synaptics-and-mouser/\">Read More &#8594;<span class=\"screen-reader-text\"> \"Shaping the Edge AI Standard for IoT Compute – Synaptics and Mouser Electronics\"<\/span><\/a>"}, {"title": "Fish Fry Special Edition: 2026 International Women in Engineering Day", "source": "EE Journal", "date": "2026-06-23", "url": "https://www.eejournal.com/fish_fry/fish-fry-special-edition-2026-international-women-in-engineering-day/", "summary": "<img alt=\"\" class=\"webfeedsFeaturedVisual wp-post-image\" height=\"300\" src=\"https://www.eejournal.com/wp-content/uploads/2026/06/AD-062326.jpg\" style=\"display: block; margin-bottom: 5px; clear: both;\" width=\"300\" />Welcome to our third annual International Women in Engineering Day Fish Fry podcast! My special guests are Laura Mirkarimi from Adeia, Angelica Davila from Penguin Solutions, and Madison Ecklund from Texas Instruments. In this special episode of Fish Fry, we discuss their journeys into the world of high tech, examine how the EE landscape has &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/fish_fry/fish-fry-special-edition-2026-international-women-in-engineering-day/\">Read More &#8594;<span class=\"screen-reader-text\"> \"Fish Fry Special Edition: 2026 International Women in Engineering Day\"<\/span><\/a>"}, {"title": "STMicroelectronics unveils new compact direct Time-of-Flight 3D LiDAR module bringing high-resolution spatial awareness to compact edge AI systems with industry-leading resolution and performance", "source": "EE Journal", "date": "2026-06-23", "url": "https://www.eejournal.com/industry_news/stmicroelectronics-unveils-new-compact-direct-time-of-flight-3d-lidar-module-bringing-high-resolution-spatial-awareness-to-compact-edge-ai-systems-with-industry-leading-resolution-and-performance/", "summary": "VL53L9 is the first direct Time-of-Flight (dToF) 3D LiDAR all-in-one module in ST’s portfolio, offering a resolution of 2.3K zones, wide field of view, on-chip processing, 100 frames per second, and sensing range from 5 centimeters to 9 meters. Designed to meet the evolving needs of customers and partners across diverse industries, including robotics, industrial automation, smart buildings, AR/VR, and &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/stmicroelectronics-unveils-new-compact-direct-time-of-flight-3d-lidar-module-bringing-high-resolution-spatial-awareness-to-compact-edge-ai-systems-with-industry-leading-resolution-and-performance/\">Read More &#8594;<span class=\"screen-reader-text\"> \"STMicroelectronics unveils new compact direct Time-of-Flight 3D LiDAR module bringing high-resolution spatial awareness to compact edge AI systems with industry-leading resolution and performance\"<\/span><\/a>"}, {"title": "Infineon launches cloud-based virtual platform powered by AWS to accelerate automotive microcontroller evaluation", "source": "EE Journal", "date": "2026-06-23", "url": "https://www.eejournal.com/industry_news/infineon-launches-cloud-based-virtual-platform-powered-by-aws-to-accelerate-automotive-microcontroller-evaluation/", "summary": "Infineon Technologies AG (FSE: IFX / OTCQX: IFNNY) is collaborating with Amazon Web Services (AWS) to accelerate microcontroller (MCU) evaluation to shorten development cycles for automotive systems. As part of this collaboration, Infineon is launching a cloud-based platform for virtual evaluation of Infineon automotive MCUs, powered by AWS. The new platform removes dependency on physical &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/infineon-launches-cloud-based-virtual-platform-powered-by-aws-to-accelerate-automotive-microcontroller-evaluation/\">Read More &#8594;<span class=\"screen-reader-text\"> \"Infineon launches cloud-based virtual platform powered by AWS to accelerate automotive microcontroller evaluation\"<\/span><\/a>"}, {"title": "Eggtronic Introduces High-Efficiency 500W Microinverter Reference Platform with Renesas", "source": "EE Journal", "date": "2026-06-23", "url": "https://www.eejournal.com/industry_news/eggtronic-introduces-high-efficiency-500w-microinverter-reference-platform-with-renesas/", "summary": "Eggtronic, a semiconductor company innovating in high-performance IC controllers for power electronics, today announced the release of a jointly developed 500W solar microinverter reference platform with Renesas Electronics Corporation. The design combines Eggtronic’s EPIC™ mixed d Multiplayer Decision Intelligence, a new capability of Axonis Decision Intelligence built for an era of fragmented visibility, where the most consequential patterns span beyond organizational boundaries. Axonis Multiplayer enables enterprises, smart cities, government agencies, healthcare, and financial institutions to act on &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/axonis-introduces-multiplayer-decision-intelligence-when-intelligence-must-cross-boundaries/\">Read More &#8594;<span class=\"screen-reader-text\"> \"Axonis Introduces Multiplayer Decision Intelligence: When Intelligence Must Cross Boundaries\"<\/span><\/a>"}, {"title": "Is it a Bird? Is it a Drone? Neuromorphic Edge AI Knows", "source": "EE Journal", "date": "2026-06-23", "url": "https://www.eejournal.com/article/is-it-a-bird-is-it-a-drone-neuromorphic-edge-ai-knows/", "summary": "<img alt=\"\" class=\"webfeedsFeaturedVisual wp-post-image\" height=\"300\" src=\"https://www.eejournal.com/wp-content/uploads/2026/06/max-0494-image-for-home-page-brainchip-300x300.jpg\" style=\"display: block; margin-bottom: 5px; clear: both;\" width=\"300\" />Suppose you find yourself on a battlefield facing an incoming swarm of drones. Let&#8217;s assume you&#8217;re reasonably confident that most of them are decoys or spoofing drones, while only a select few are carrying payloads designed to introduce a brief but memorable period of excitement into your life. Unfortunately, your ability to shoot these little &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/article/is-it-a-bird-is-it-a-drone-neuromorphic-edge-ai-knows/\">Read More &#8594;<span class=\"screen-reader-text\"> \"Is it a Bird? Is it a Drone? Neuromorphic Edge AI Knows\"<\/span><\/a>"}, {"title": "Optocam Zero – A Raspberry Pi Zero 2 W-based DIY digital camera", "source": "CNX Software", "date": "2026-06-22", "url": "https://www.cnx-software.com/2026/06/22/optocam-zero-a-raspberry-pi-zero-2-w-based-diy-digital-camera/", "summary": "<div><img alt=\"Optocam Zero\" class=\"attachment-medium size-medium wp-post-image\" height=\"529\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/06/Optocam-Zero-720x529.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Inspired by Kodak Charmera and similar toy cameras, the Optocam Zero is a Raspberry Pi Zero 2 W-based DIY digital camera made of off-the-shelf components and 3D-printed parts. It connects the Pi Zero 2 W SBC with a Raspberry Pi Camera Module 3, a 1.3-inch LCD, a 14500 Li-Ion battery holder, and other components. The camera supports autofocus, eight photo filters, USB-C charging, and lasts 70 to 80 minutes on a charge. Optocam Zero camera key features: Based on Raspberry Pi Zero 2 W SBC Display 1.3-inch LCD with 240 x 240 resolution 15–20 FPS camera preview on the screen. Screen dimming when inactive to preserve battery Camera features 2592 x 2592 JPEG image capture. GIF recording and playback support. Autofocus support 8 photo filters included. Misc Image transfer through custom hotspot interface. Fully 3D printed case parts 3D printable TPU protective sleeve and lanyard design is available. 22-second boot [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/06/22/optocam-zero-a-raspberry-pi-zero-2-w-based-diy-digital-camera/\">Optocam Zero &#8211; A Raspberry Pi Zero 2 W-based DIY digital camera<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "ST VL53L9CX direct Time-of-Flight 3D LiDAR supports 5cm to 9m range, 2.3K zones resolution", "source": "CNX Software", "date": "2026-06-22", "url": "https://www.cnx-software.com/2026/06/22/st-vl53l9cx-direct-time-of-flight-3d-lidar-supports-5cm-to-9m-range-2-3k-zones-resolution/", "summary": "<div><img alt=\"ST VL53L9CX direct Time-of-Flight 3D LiDAR\" class=\"attachment-medium size-medium wp-post-image\" height=\"438\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/06/ST-VL53L9CX-direct-Time-of-Flight-3D-LiDAR-720x438.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>STMicroelectronics VL53L9CX, or VL53L9 for short, is the company&#8217;s first direct Time-of-Flight (dToF) 3D LiDAR all-in-one module. It offers a sensing range of  5 centimeters to 9 meters, a wide 72º field of view, a resolution of 2.3K zones, and up to 100 Hz frame rate. ST&#8217;s ToF sensors have gone a long way since we covered the VL53L0X sensor with a single zone and 2-meter range in 2017. Since then, the company has steadily improved its tiny ToF sensors with up to 64 zones and long range in recent sensors like the VL53L8CP. While the VL53L9CX is still tiny at 12.8 x 6.1 x 4.6 mm, it&#8217;s in a class of its own, acting like a mini 3D scanner with 2268 zones, and will be used for a range of applications in robotics, industrial automation, smart buildings, AR/VR, and healthcare. ST VL53L9CX 3D ToF camera module specifications: Multizone ranging [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/06/22/st-vl53l9cx-direct-time-of-flight-3d-lidar-supports-5cm-to-9m-range-2-3k-zones-resolution/\">ST VL53L9CX direct Time-of-Flight 3D LiDAR supports 5cm to 9m range, 2.3K zones resolution<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "GEEKOM A7 2026 Edition Review – Part 2: AMD Ryzen 5 7545U Mini PC tested with Windows 11 Pro", "source": "CNX Software", "date": "2026-06-22", "url": "https://www.cnx-software.com/2026/06/22/geekom-a7-2026-edition-review-part-2-amd-ryzen-5-7545u-mini-pc-tested-with-windows-11-pro/", "summary": "<div><img alt=\"GEEKOM A7 2026 Edition Windows 11 Pro review\" class=\"attachment-medium size-medium wp-post-image\" height=\"484\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/06/GEEKOM-A7-2026-Edition-Windows-11-Proreview-720x484.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>We have already checked out the GEEKOM A7 2026 Edition mini PC&#8217;s hardware with an unboxing and a teardown in the first part of the review, before quickly trying the pre-installed Windows 11 Pro. We&#8217;ve now had time to test the AMD Ryzen 5 7545U mini PC more thoroughly in Windows 11, and we&#8217;ll report our experience, including feature testing, benchmark results, 4K and 8K YouTube video playback, 2.5GbE and WiFi 6E network performance evaluation, and cooling performance, as well as fan noise and power consumption measurements. Software Overview and Feature Testing – GEEKOM A7 2026 Edition The System &#62; About window confirms we have an A7 computer equipped with a 3.2 GHz (base frequency) AMD Ryzen 5 7545U processor with Radeon 740M graphics, 16 GB of RAM, and 466 GB of storage preloaded with Windows 11 Pro 25H2. HWiNFO 64 provides additional details about the AMD Ryzen 5 7545U [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/06/22/geekom-a7-2026-edition-review-part-2-amd-ryzen-5-7545u-mini-pc-tested-with-windows-11-pro/\">GEEKOM A7 2026 Edition Review &#8211; Part 2: AMD Ryzen 5 7545U Mini PC tested with Windows 11 Pro<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "UTFS is a lightweight, zero-allocation file system for embedded devices", "source": "CNX Software", "date": "2026-06-22", "url": "https://www.cnx-software.com/2026/06/22/utfs-is-a-lightweight-zero-allocation-file-system-for-embedded-devices/", "summary": "<div><img alt=\"μTFS lightweight, zero allocation file system\" class=\"attachment-medium size-medium wp-post-image\" height=\"480\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/06/μTFS-lightweight-zero-allocation-file-system-720x480.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>CLI Systems has introduced UTFS (μTFS), a simple, lightweight embedded storage system designed for small MCUs. Unlike traditional file systems like FAT32 or EXT4, or even lighter options like LittleFS and SPIFFS used on boards like the ESP32, UTFS is much simpler. It does not use dynamic memory and avoids complex features like wear leveling, making it easier to use on low-resource devices. Designed for flat, byte-addressable memory like raw EEPROM, CPU flash pages, or external SPI/I²C flash, UTFS allows bare-metal firmware to store named data blobs (&#8220;files&#8221;) back-to-back. Each file is appended with a fixed 24-byte header containing metadata like identifiers, sizes, and application-defined signatures. UTFS specifications and features Footprint – Fixed 24-byte header per file; zero heap usage (no malloc) Format – TAR-inspired sequential layout; forward-compatible so files can be added later without breaking existing memory layouts Storage Agnostic – Requires porting only two functions to interface with [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/06/22/utfs-is-a-lightweight-zero-allocation-file-system-for-embedded-devices/\">UTFS is a lightweight, zero-allocation file system for embedded devices<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Partnerships to Drive WBG Semiconductor Innovations", "source": "Embedded.com", "date": "2026-06-22", "url": "https://www.embedded.com/partnerships-to-drive-wbg-semiconductor-innovations/", "summary": "<p>At PCIM Europe, several companies announced partnerships to accelerate SiC and GaN power device innovation.<\/p>\n<p>The post <a href=\"https://www.embedded.com/partnerships-to-drive-wbg-semiconductor-innovations/\">Partnerships to Drive WBG Semiconductor Innovations<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "SiLC Introduces Eyeonic Edge 4D Vision Sensor", "source": "Embedded.com", "date": "2026-06-22", "url": "https://www.embedded.com/silc-introduces-eyeonic-edge-4d-vision-sensor/", "summary": "<p>SiLC Technologies has expanded its machine vision portfolio with the introduction of Eyeonic Edge, a new 4D area scanner designed for high-precision inspection of large stationary objects. The system extends the capabilities of the company's Eyeonic Trace laser line scanner, which was developed for moving objects on conveyor systems, by delivering sub-millimeter measurement accuracy at [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/silc-introduces-eyeonic-edge-4d-vision-sensor/\">SiLC Introduces Eyeonic Edge 4D Vision Sensor<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "OnLogic Launches DNV Certified Computing Solutions for Global Maritime Operations", "source": "EE Journal", "date": "2026-06-22", "url": "https://www.eejournal.com/industry_news/onlogic-launches-dnv-certified-computing-solutions-for-global-maritime-operations/", "summary": "Industrial computing and edge solution specialists, OnLogic (www.onlogic.com), have launched a new range of DNV certified industrial computing solutions designed to solve the global maritime industry’s most persistent technical challenges. As maritime operations undergo rapid digital transformation, they face the dual challenge of meeting strict international standards while enduring the harsh environmental conditions of the high &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/onlogic-launches-dnv-certified-computing-solutions-for-global-maritime-operations/\">Read More &#8594;<span class=\"screen-reader-text\"> \"OnLogic Launches DNV Certified Computing Solutions for Global Maritime Operations\"<\/span><\/a>"}, {"title": "MacDermid Alpha Launches ATROX® CD 560-1: Zero PFAS Alternate Silver Filler Die Attach Paste Designed for Cost Stability and High-Speed Production", "source": "EE Journal", "date": "2026-06-22", "url": "https://www.eejournal.com/industry_news/macdermid-alpha-launches-atrox-cd-560-1-zero-pfas-alternate-silver-filler-die-attach-paste-designed-for-cost-stability-and-high-speed-production/", "summary": "With silver price volatility increasing and sustainability requirements accelerating across semiconductor assembly, MacDermid Alpha Electronics Solutions introduces ATROX® CD 560-1, a zero per- and polyfluoroalkyl substances (PFAS) alternate silver filler die attach paste designed for metal leadframe packages and high-speed automated dispensing in modern manufacturing environments. As silver prices continue to fluctuate sharply, semiconductor manufacturers face growing pressure on &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/macdermid-alpha-launches-atrox-cd-560-1-zero-pfas-alternate-silver-filler-die-attach-paste-designed-for-cost-stability-and-high-speed-production/\">Read More &#8594;<span class=\"screen-reader-text\"> \"MacDermid Alpha Launches ATROX® CD 560-1: Zero PFAS Alternate Silver Filler Die Attach Paste Designed for Cost Stability and High-Speed Production\"<\/span><\/a>"}, {"title": "Smart Robots, ChipStack AI Super Agent, Building Simulink Models with Agentic AI: Embedded Week Insights", "source": "Embedded.com", "date": "2026-06-19", "url": "https://www.embedded.com/smart-robots-chipstack-ai-super-agent-building-simulink-models-with-agentic-ai-embedded-week-insights/", "summary": "<p>Here's a roundup of this week's must-read articles. We'll look into the latest developments on smart robots, simplifying audio complexity, building Simulink models with agentic AI, and Cadence's ChipStack AI Super Agent. Also, check News Archives - Embedded and Technical Articles Archives - Embedded for the complete list of news and articles from our website. NEWS Synopsys Launches Multiphysics [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/smart-robots-chipstack-ai-super-agent-building-simulink-models-with-agentic-ai-embedded-week-insights/\">Smart Robots, ChipStack AI Super Agent, Building Simulink Models with Agentic AI: Embedded Week Insights<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "Microchip Upgrades its Synchronization Management Software", "source": "Embedded.com", "date": "2026-06-19", "url": "https://www.embedded.com/microchip-upgrades-its-synchronization-management-software/", "summary": "<p>Microchip Technology Inc. has introduced the TimePictra 12 platform, the latest generation of its synchronization management software designed to simplify the deployment and operation of precise timing architectures across critical infrastructure networks. The new release adds a redesigned graphical user interface (GUI), enhanced automation features, and support for emerging high-accuracy timing technologies, enabling operators to manage [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/microchip-upgrades-its-synchronization-management-software/\">Microchip Upgrades its Synchronization Management Software<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "What Level 5 Autonomy Could Mean for Chip Design Engineers", "source": "Embedded.com", "date": "2026-06-18", "url": "https://www.embedded.com/what-level-5-autonomy-could-mean-for-chip-design-engineers/", "summary": "<p>Cadence Design Systems Inc. introduced its Level 5 ChipStack AI Super Agent at Computex 2026. The company describes it as the industry's first fully autonomous virtual agentic AI design engineer for chip design. The release builds on the recent announcement of Level 4 autonomy in electronic design automation (EDA). Cadence said the rapid transition to [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/what-level-5-autonomy-could-mean-for-chip-design-engineers/\">What Level 5 Autonomy Could Mean for Chip Design Engineers<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "Synopsys Launches Multiphysics Fusion Solutions", "source": "Embedded.com", "date": "2026-06-18", "url": "https://www.embedded.com/synopsys-launches-multiphysics-fusion-solutions/", "summary": "<p>Synopsys Inc. has announced the availability of its first Multiphysics Fusion solutions, a new family of electronic design automation (EDA) tools that integrates multiphysics analysis directly into key semiconductor design workflows. The portfolio combines Synopsys' AI-enabled EDA technologies with signoff analysis technologies acquired through Ansys, addressing the growing design challenges associated with advanced process nodes, [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/synopsys-launches-multiphysics-fusion-solutions/\">Synopsys Launches Multiphysics Fusion Solutions<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "MIPI SWI3S: Simplifying Embedded Audio Complexity", "source": "Embedded.com", "date": "2026-06-17", "url": "https://www.embedded.com/mipi-swi3s-simplifying-embedded-audio-complexity/", "summary": "<p>MIPI SWI3S, supporting two PHY options, enables scalable audio architectures, while simplifying system design and optimizing power efficiency.<\/p>\n<p>The post <a href=\"https://www.embedded.com/mipi-swi3s-simplifying-embedded-audio-complexity/\">MIPI SWI3S: Simplifying Embedded Audio Complexity<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "Efinix Launches Titanium Edge FPGA Family", "source": "Embedded.com", "date": "2026-06-17", "url": "https://www.embedded.com/efinix-launches-titanium-edge-fpga-family/", "summary": "<p>Efinix has announced the Titanium Edge family of field-programmable gate arrays (FPGAs), a new product line developed specifically for edge artificial intelligence applications that require low power consumption, compact form factors, and high levels of reliability and security. Based on the company's Titanium architecture, the new devices are designed to address the increasing performance and [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/efinix-launches-titanium-edge-fpga-family/\">Efinix Launches Titanium Edge FPGA Family<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}], "papers": [{"title": "InSight: Self-Guided Skill Acquisition via Steerable VLAs", "authors": ["Maggie Wang", "Lars Osterberg", "Stephen Tian", "Ola Shorinwa", "Jiajun Wu", "Mac Schwager"], "published": "2026-06-23", "summary": "Vision-language-action (VLA) models can learn manipulation skills from demonstrations, but their capabilities are bounded by the skills in the training data. We present InSight, a framework that unlocks autonomous skill acquisition by rendering VLAs steerable at the primitive-action level (e.g., \"move gripper to the bowl\", \"lift upward\", \"pour the bottle\"). InSight consists of two primary stages: (1) an automated segmentation pipeline that partitions demonstrations into labeled primitives via VLM plan decomposition and end-effector poses to enable VLA primitive steerability, and (2) a VLM-guided data flywheel that identifies missing primitives required to accomplish a novel task, autonomously attempts demonstrations of the missing primitives with VLM-proposed low-level control, and automatically labels, stores, and integrates successful demonstrations into the VLA training set. We evaluate InSight across simulation and real-world manipulation tasks, including block flipping, drawer closing, sweeping, twisting, and pouring, without any human demonstrations of these target skills. Once learned, these primitives can be composed to execute novel, long-horizon tasks without additional human demonstrations. Our findings demonstrate that primitive steerability provides a practical foundation for continual skill acquisition in VLA policies. Project website: https://insight-vla.github.io.", "pdf_url": "https://arxiv.org/pdf/2606.24884v1"}, {"title": "World Models in Pieces: Structural Certification for General Agents", "authors": ["Yikai Lu", "Yifei Wu", "Xinyu Lu", "Tongxin Li"], "published": "2026-06-23", "summary": "In the big-world regime, agents cannot be universally capable and their ability is inevitably specialized across a world model in pieces. Consequently, standard uniform guarantees fail to distinguish between the understanding of critical bottlenecks and irrelevant failures. We first formalize this limitation by proving that general agents are not universal, rendering standard worst-case analysis uninformative. To overcome this, we introduce structural certification, a transition-local framework that maps bounded goal-conditioned performance to entry-wise guarantees on the agent's internal world model. Our main contribution is constructive. We provide algorithms that filter specific transitions using deep compositional goals and prove that a general agent on these goals has a structural world model with a $\\mathcal{O}(1/n) + \\mathcal{O}(δ)$ error bound. Conversely, this bound is tight in the small-$δ$ regime, whose existence is explicitly guaranteed by our certification. These results enable the certifiable deployment of general agents by localizing the specific transitions where long-horizon planning is reliable.", "pdf_url": "https://arxiv.org/pdf/2606.24842v1"}, {"title": "MANGO: Automated Multi-Agent Test Oracle Generation for Vision-Language-Action Models", "authors": ["Pablo Valle", "Shaukat Ali", "Aitor Arrieta", "Lionel Briand"], "published": "2026-06-23", "summary": "Vision-Language-Action (VLA) models are emerging robotic control systems that integrate perception, language understanding, and action generation in a unified architecture. Existing testing approaches for VLA-enabled robots rely on manually constructed symbolic test oracles that determine task success from final environment states. These oracles are costly to construct, require domain expertise, and are often tightly coupled to specific tasks and environments, limiting scalability and reuse. Furthermore, they provide only end-state assessments of task outcomes, offering limited insight into intermediate behavior and fault localization. To address these limitations, we introduce MANGO, a multi-agent framework that automatically generates fine-grained oracles from natural-language descriptions of robotic tasks. MANGO first generates a reusable library of atomic tasks, then generates simulator-grounded oracle definitions for each atomic task, and finally produces executable fine-grained oracles by decomposing complex instructions into ordered sequences of atomic actions and corresponding oracles. The framework uses collaborative Generator, Assessor, and Judge agents that iteratively refine generated artifacts through structured feedback. We evaluate MANGO on the LIBERO_10 and RoboCasa Humanoid Tabletop benchmarks. Results show that MANGO generates executable, fine-grained oracles that detect a similar number of failures as symbolic oracles while accurately localizing them and providing richer diagnostic information. Through ablation studies, we further analyzed component contributions and the effect of initial task set, while preserving oracle quality. Overall, the results show the feasibility and effectiveness of test oracle generation for VLA-enabled robots testing.", "pdf_url": "https://arxiv.org/pdf/2606.24815v1"}, {"title": "Vision-Language Model Reasoning for Contextual Semantic Mapping in Intralogistics", "authors": ["Marvin Rüdt", "Hao Pang", "Constantin Enke", "Zäzilia Seibold", "Kai Furmans"], "published": "2026-06-23", "summary": "Autonomous mobile robots operating in intralogistics environments rely on geometric maps for localization and navigation, but lack semantic understanding of objects and their contextual properties. We present a contextual semantic mapping pipeline that combines SLAM-based geometric mapping, SAM-based instance segmentation, instance clustering, and VLM multi-view reasoning to produce a contextual semantic map representation encoding geometric structure, object class, and object movability. By aggregating observations across multiple viewpoints and querying a VLM in a zero-shot, open-vocabulary setting, the pipeline infers contextual object properties--here demonstrated through movability--without requiring task-specific training or predefined object categories. We evaluate three VLMs under two prompting strategies and conduct a component-wise analysis of the pipeline. The proposed pipeline achieves 98.93 % mIoU for semantic classification and 89.17 % mAcc for object movability estimation. Component analysis identifies VLM reasoning as the primary bottleneck for contextual understanding and instance clustering as the main limitation for panoptic performance. The resulting semantic map supports context-aware filtering and robust navigation in dynamic intralogistics environments.", "pdf_url": "https://arxiv.org/pdf/2606.24814v1"}, {"title": "Pocket-SLAM: Rendering-Area-Aware Pruning for Memory-Efficient 3DGS-SLAM", "authors": ["Leshu Li", "Jie Peng", "Yang Zhao"], "published": "2026-06-23", "summary": "3D Gaussian Splatting (3DGS) has garnered significant attention in Simultaneous Localization and Mapping (SLAM) due to its advances in capturing fine-grained geometry features and synthesizing novel views. For SLAM in large-scale scenes, such as autonomous driving, 3DGS-SLAM faces a critical limitation: memory consumption increases continuously over time as Gaussian points accumulate, leading to poor memory efficiency and limiting its applicability. In this work, we propose a rendering-area-aware pruning strategy that selectively removes Gaussians based on their contribution to the effective rendering area, rather than solely relying on Gaussian-level heuristics such as opacity or gradient magnitude. This perspective directly targets the sources of memory redundancy, effectively reducing the peak memory footprint of 3DGS-SLAM during runtime. Evaluations on the EuRoC and KITTI datasets demonstrate that our method consistently outperforms existing pruning approaches in large-scale outdoor scenes, achieving over 60% memory reduction and more than 2 times FPS improvement while preserving localization and mapping accuracy. These results highlight rendering-area-aware pruning as a promising direction for scaling 3DGS-SLAM to real-world autonomous driving scenarios. Our code is publicly available at https://github.com/UMN-ZhaoLab/Pocket-SLAM.git.", "pdf_url": "https://arxiv.org/pdf/2606.24796v1"}, {"title": "Compact Object-Level Representations with Open-Vocabulary Understanding for Indoor Visual Relocalization", "authors": ["Zhaopeng Cui", "Jiarui Hu", "Jingbo Liu", "Boming Zhao", "Xiyue Guo", "Boyin Feng", "Haocheng Peng", "Yujun Shen", "Hujun Bao", "Guofeng Zhang"], "published": "2026-06-23", "summary": "Indoor visual relocalization plays a critical role in emerging spatial and embodied AI applications. However, prior research was predominantly devoted to low-level vision schemes, struggling to perceive scene semantics and compositions, which limits both interpretability and applicability. In this paper, we explore the issue of how to organize rich object information in a scene, including semantics, layout, and geometry, into a structured map representation, thereby utilizing object units exclusively to drive the camera relocalization task. To this end, we propose OpenReLoc, a camera relocalization system designed to provide scene understanding and accurate pose estimation capabilities. Leveraging recent foundation models, we first introduce a multi-modal mechanism to integrate open-vocabulary semantic knowledge for effective 2D-3D object matching. Additionally, we design object-oriented reference frames as position priors, paired with a reference frame selection strategy based on the Distance-IoU (DIOU), enabling extension to scalable scenes. Moreover, to ensure stable and accurate pose optimization, we also propose a dual-path 2D Iterative Closest Pixel loss guided by object shape. Experimental results demonstrate that OpenReLoc achieves superior relocalization recall and accuracy across various datasets. Our source code will be released upon acceptance.", "pdf_url": "https://arxiv.org/pdf/2606.24767v1"}, {"title": "World Value Models for Robotic Manipulation", "authors": ["Zhihao Wang", "Jianxiong Li", "Yu Cui", "Yuan Gao", "Xianyuan Zhan", "Junzhi Yu", "Xiao Ma"], "published": "2026-06-23", "summary": "Generalist value models play a pivotal role in scaling robotic policy learning from large-scale, mixed-quality data. Mathematically, accurate value estimation demands deep temporal understanding, requiring models to both ground the current belief using historical context and plan over future outcomes. However, most existing robotic value models are built on Vision-Language Model (VLM) backbones that are pretrained primarily on static or temporally sparse visual observations, lacking the requisite temporal modeling capabilities for value estimation. Unlike VLMs, world models naturally excel at temporal modeling and future planning, making them ideal foundations for learning generalizable value functions. Driven by this insight, we marry world models with value estimation to construct a new generalist robotic value model, World Value Model (WVM), that offers accurate task progressions to assess data quality. On standard benchmarks, WVM delivers state-of-the-art (SOTA) Value-Order Correlation (VOC) results. Complementing standard evaluation suites that contains only expert data, we further introduce Suboptimal-Value-Bench, a multi-embodiment benchmark consisting of 800 suboptimal trajectories with high-fidelity, human-labeled frame annotations. Our evaluations show that WVM maintains its SOTA performance on Suboptimal-Value-Bench, establishing its robustness in handling both expert and suboptimal data. When deployed for policy learning, WVM improves manipulation performance across various policy extraction approaches in both simulated and real-world deployment, providing robust guidance for learning from mixed-quality data.", "pdf_url": "https://arxiv.org/pdf/2606.24742v1"}, {"title": "TACTFUL: Tactile-Driven Exploration For Object Localization and Identification in Confined Environments", "authors": ["Shivani Kamtikar", "Chung Hee Kim", "Camilla Tabasso", "Tye Brady", "Joshua Migdal", "Taskin Padir"], "published": "2026-06-23", "summary": "Humans effortlessly locate and identify objects by touch alone, even without vision. In contrast, robotic systems rely heavily on vision and struggle with autonomous tactile exploration and object identification. We present TACTFUL, a vision-free tactile exploration framework that enables a multi-fingered robot to autonomously explore confined workspaces, discover objects through contact, and identify them via tactile reconstruction. Trained entirely on real hardware without simulation, our system learns a single policy that balances global workspace exploration with local surface refinement through a dynamic reward schedule. Our results demonstrate that tactile sensing, when paired with structured learning, can serve as an effective primary modality for object-level reasoning, achieving 77% success with 0.015 m average reconstruction error and outperforming baseline approaches on real-world objects.", "pdf_url": "https://arxiv.org/pdf/2606.24712v1"}, {"title": "LaGO: Latent Action Guidance for Online Reinforcement Learning", "authors": ["Kuan-Yen Liu", "Ren-Jyun Huang", "Ti-Rong Wu"], "published": "2026-06-23", "summary": "Large language models (LLMs) have shown strong potential for planning and sequential decision-making, but prior work often relies on using them as direct controllers, which requires precise action generation and can be unreliable in practice. This paper proposes Latent Action Guidance for Online Reinforcement Learning (LaGO), a framework that uses a pretrained LLM as a latent action prior to softly guide online policy optimization, rather than treating the LLM as an explicit planner or controller. Experiments on both a discrete-control benchmark, CLEVR-Robot, and a continuous-control benchmark, Meta-World, demonstrate that LaGO consistently improves both reward and success rate over Vanilla PPO. In particular, LaGO increases the average success rate from 15.1% to 27.2% on CLEVR-Robot and from 2.7% to 15.2% on Meta-World. Our analysis further shows that stronger pretrained LLMs provide more effective guidance, suggesting that LLM knowledge can improve planning and online decision-making.", "pdf_url": "https://arxiv.org/pdf/2606.24669v1"}, {"title": "Suboptimal and Reduced-Order MPC via Timescale Separation", "authors": ["Stefano Di Gregorio", "Guido Carnevale", "Giuseppe Notarstefano"], "published": "2026-06-23", "summary": "In this paper, we propose a generalized framework for the design and analysis of suboptimal and reduced-order nonlinear Model Predictive Control (MPC) architectures. The proposed framework manages real-time operation of MPC schemes by (i) computing the control action suboptimally, i.e., by running a generic optimal control algorithm for a finite number of iterations, and (ii) relying on a reduced-order model that neglects part of the plant dynamics (accounting for, e.g., unmodeled dynamics or a low-level compensator). To rigorously handle the interplay between optimization error and model mismatch, we treat the sampling time as a tunable design parameter. We analyze the resulting closed-loop system, comprising the full-order physical plant interconnected with the iterative optimization algorithm (treated as a dynamical system), by leveraging tools from timescale separation. We prove that operating at a sufficiently fast sampling rate ensures that the closed-loop system maintains recursive feasibility and achieves an exponentially stable equilibrium point. The effectiveness of the proposed framework is validated on an underactuated two-link robotic arm through virtual experiments in the high-fidelity MuJoCo physics engine.", "pdf_url": "https://arxiv.org/pdf/2606.24641v1"}, {"title": "Beyond Monotonic Progress: Retry-Supervised Value Learning for Robot Imitation", "authors": ["Xinyao Qin", "Junjie Lu", "Kaixin Wang", "Chuheng Zhang", "Sinjae Kang", "Kimin Lee", "Min Xu", "Bin Liang", "Jun Yang", "Li Zhao"], "published": "2026-06-23", "summary": "Human demonstrations for robot imitation learning often contain mistakes and corrective behaviors, such as imprecise grasps, object misalignment, unstable contact, and repeated attempts. While these segments are commonly treated as noisy or suboptimal data, they provide valuable evidence about when execution deviates from a desirable path and how task feasibility can be restored. However, existing reward and value models often rely on monotonic progress assumptions, which capture coarse task advancement but may overlook local execution errors and corrective behaviors in imperfect demonstrations. In this work, we propose ReTVL (ReTry-Supervised Value Learning), a framework for learning mistake-sensitive value functions from mixed-quality robot demonstrations by leveraging retry events as sparse supervision. ReTVL captures the local degradation-and-recovery structure around mistakes by combining global progress calibration with local pairwise preference learning induced by sparsely annotated retry keypoints. The learned value model is then used to reweight demonstration chunks for downstream behavior cloning, reducing the influence of harmful execution errors while preserving useful corrective behaviors. Experiments on real-robot manipulation tasks show that ReTVL produces more fine-grained value estimates than progress-based baselines and improves imitation learning from imperfect demonstrations.", "pdf_url": "https://arxiv.org/pdf/2606.24633v1"}, {"title": "Parallel Dynamic Programming for Conic Linear Quadratic Control", "authors": ["Luyao Zhang", "Gabriel Bravo-Palacios", "Brian Plancher", "Sergio Grammatico"], "published": "2026-06-23", "summary": "Linear Quadratic (LQ) control problems are at the heart of linear control theory and Model Predictive Control (MPC). While performant, standard approaches to solving such problems are inherently serial, limiting real-time scalability despite the parallel computing power available on modern multi-core CPUs. Contributing to addressing this challenge and motivated by ``divide and conquer'' strategies, we present a parallel-in-time approach that solves computationally demanding conic optimal control problems through the use of the alternating direction method of multipliers (ADMM). In particular, we formulate the inner primal update of ADMM as an LQ problem and split the reformulated problem along the time horizon. This enables us to derive a variant of the Riccati recursion using dynamic programming to solve each subproblem in parallel. Numerical benchmarks on two real-world applications demonstrate as much as a 5x speedup compared to existing related approaches on multi-core CPU hardware.", "pdf_url": "https://arxiv.org/pdf/2606.24632v1"}, {"title": "Optimization-based Safe Trajectory Planning for Autonomous Ground Vehicle in Multi-Floor Scenarios", "authors": ["Zishang Xiang", "Runda Zhang", "Runqi Chai", "Kaiyuan Chen", "Senchun Chai", "Yuanqing Xia"], "published": "2026-06-23", "summary": "The development of trajectory planning strategies for autonomous ground vehicles (AGVs) represents a prevailing research interest within the domain of intelligent transportation systems. This paper introduces a trajectory planning framework tailored for multi-floor scenarios. The framework consists of two main modules: the task planning module and the trajectory planning module. The task planning module involves a strategic selection phase, where a task planning strategy based on generalized voronoi diagrams (GVD) and multi-objective algorithms is proposed to select the floor exits for each floor. The trajectory planning module utilizes optimization-based methods to generate high-quality trajectories, and a warm-started hierarchical planning framework is designed to ensure rapid convergence. Additionally, for handling complex obstacle constraints, a correlation constraint calculation method is designed for reducing obstacle constraints in trajectory planning. Finally, the feasibility and effectiveness of the proposed framework are verified through simulations.", "pdf_url": "https://arxiv.org/pdf/2606.24631v1"}, {"title": "Human-Robot Shared Control for Humanized End-Effector Teleoperation", "authors": ["Batool Ibrahim", "Imad H. Elhajj", "Daniel Asmar", "Rawan El Hakim"], "published": "2026-06-23", "summary": "Recent advances in robotics have enabled robots to operate in shared human environments, emphasizing the importance of effective human robot interaction HRI. Prior studies indicate that anthropomorphism, defined as the incorporation of human like features into robotic systems, facilitates more natural interaction and enhances both task performance and user experience. In robotic arm teleoperation, however, user controlled motions often deviate from human like kinematic characteristics due to intrinsic limitations of teleoperation systems. In this work, we propose a real time framework that generates human like end effector trajectories based on the two thirds power law of voluntary human hand movements, while preserving the operators intended control inputs. The proposed approach is validated through real world experiments conducted on a 6 degree of freedom Dobot CR10 robotic arm. Quantitative analysis demonstrates that the generated trajectories exhibit significantly stronger adherence to human like kinematic profiles compared to conventional teleoperation, with the estimated beta coefficient moving 39.7% closer on average to the theoretical value of 1/3. Furthermore, the method achieves an approximate 34% improvement in motion smoothness, measured by RMS torque rate reduction, with 80% of evaluated motion patterns showing statistically significant improvements while maintaining comparable task completion times.", "pdf_url": "https://arxiv.org/pdf/2606.24629v1"}, {"title": "ArtiTwinSplat: Interactable Digital Twin Reconstruction via Gaussian Splatting from RGB-D videos", "authors": ["Pranjal Mishra", "René Zurbrügg", "Max Wilder-Smith", "Marco Hutter", "Marc Pollefeys", "Zuria Bauer", "Hermann Blum"], "published": "2026-06-23", "summary": "Deploying robots in unstructured real-world environments needs accurate, interactive models of the objects. Constructing these models at scale remains a critical bottleneck for robotic system integration. We present ArtiTwinSplat, a framework that automatically constructs articulated, photo-realistic digital twins of objects directly from RGB-D videos, requiring no CAD models, simulation assets, or manual annotations. Our method is built on 3D Gaussian Splatting that preserve geometric fidelity and photometric realism, coupled with an unsupervised articulation discovery pipeline that recovers part structure and joint kinematics from observed motion alone. With tracking and optimization stages our method provides stable, queryable digital twins that support real-time rendering, viewpoint control, and interactive manipulation. Unlike prior methods confined to simulation, ArtiTwinSplat operates directly on real-world observations and produces twins that are immediately usable by downstream robot planning and learning systems. This method offers a practical, scalable pathway toward digital twin construction, lowering the integration barrier for articulated object manipulation in embodied AI and human-robot collaboration contexts.", "pdf_url": "https://arxiv.org/pdf/2606.24628v1"}, {"title": "Qwen-AgentWorld: Language World Models for General Agents", "authors": ["Yuxin Zuo", "Zikai Xiao", "Li Sheng", "Fei Huang", "Jianhong Tu", "Yuxuan Liu", "Tianyi Tang", "Xiaomeng Hu", "Yang Su", "Qingfeng Lan", "Yantao Liu", "Qin Zhu", "Yinger Zhang", "Bowen Yu", "Haiquan Zhao", "Haiyang Xu", "Jianxin Yang", "Jiayang Cheng", "Junyang Wang", "Lianghao Deng", "Mingfeng Xue", "Tianyi Bai", "Yang Fan", "Yubo Ma", "Yucheng Li", "Zeyu Cui", "Zhihai Wang", "Zhihui Xie", "Zhuorui Ye", "An Yang", "Dayiheng Liu", "Jingren Zhou", "Ning Ding"], "published": "2026-06-23", "summary": "A world model predicts environment dynamics based on current observations and actions, serving as a core cognitive mechanism for reasoning and planning. In this work, we investigate how world modeling based on language models can further push the boundaries of general agents. (i) We first focus on building foundation models for agentic environment simulation. We introduce Qwen-AgentWorld-35B-A3B and Qwen-AgentWorld-397B-A17B, the first language world models capable of simulating agentic environments covering 7 domains via long chain-of-thought reasoning. Leveraging more than 10M environment interaction trajectories of 7 domains in real-world environments, we develop Qwen-AgentWorld through a three-stage training pipeline: CPT injects general-purpose world modeling capabilities from the state transition dynamics and augmented professional corpora, SFT activates next-state-prediction reasoning, and RL sharpens simulation fidelity through a tailored framework with hybrid rubric-and-rule rewards. To evaluate language world models, we present AgentWorldBench, a comprehensive benchmark constructed from real-world interactions of 5 frontier models on 9 established benchmarks. Empirical results demonstrate that Qwen-AgentWorld significantly outperforms existing frontier models. (ii) Beyond foundation models, we further investigate two complementary paradigms through which world modeling enhances general agents. First, as a decoupled environment simulator, Qwen-AgentWorld supports scalable and controllable simulation of thousands of real-world environments for agentic RL, yielding gains that surpass real-environment training alone. Second, as a unified agent foundation model, world-model
