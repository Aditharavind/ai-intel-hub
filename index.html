changing-regulatory-landscape-help-farmers/\">How drone developers are navigating changing regulatory landscapes to help farmers<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Video Friday: Humanoid Robot Takes On Monkey Bars", "source": "IEEE Spectrum Robotics", "date": "2026-09-11", "url": "https://spectrum.ieee.org/video-friday-disaster-response-robots", "summary": "<img src=\"https://spectrum.ieee.org/media-library/humanoid-robot-moves-across-scaffolding-rigged-as-playground-monkey-bars-in-a-lab-while-trying-to-keep-its-balance.gif?id=67756707&amp;width=1245&amp;height=700&amp;coordinates=0%2C105%2C0%2C106\" /><br /><br /><p><span>Video Friday is your weekly selection of awesome robotics videos, collected by your friends at <\/span><em>IEEE Spectrum<\/em><span> robotics. We also post a weekly calendar of upcoming robotics events for the next few months. Please <\/span><a href=\"mailto:automaton@ieee.org?subject=Robotics%20event%20suggestion%20for%20Video%20Friday\">send us your events<\/a><span> for inclusion.<\/span><\/p><h5><a href=\"https://humanoidssummit.com/\">Humanoids Summit Seoul<\/a>: 22–23 September 2026, SEOUL<\/h5><h5><a href=\"https://2026.ieee-iros.org/\">IROS 2026<\/a>: 27 September–1 October 2026, PITTSBURGH<\/h5><h5><a href=\"https://www.corl.org/\">CoRL 2026<\/a>: 9–12 November 2026, AUSTIN<\/h5><p>Enjoy today’s videos!<\/p><div class=\"horizontal-rule\"><\/div><div><span style=\"display: none;\"> <\/span><\/div><blockquote class=\"rm-anchors\" id=\"ky2mqam4lq8\"><em>Traversing sparse 3D structures requires humanoid robots to perceive thin, overhanging geometry while executing agile, accurate whole-body motions. We study this problem through monkey-bar traversal, where the robot must jump to the structure, traverse it through sparse bar interactions, and land safely.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>The list of obstacles that you can traverse to escape a robot is getting shorter.<\/p><p>[ <a href=\"https://nemantor.github.io/sparse-3d-traversal-website/\">ETH Zurich Robotic Systems Lab<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"tkmazhql58o\">YES GIVE ROBOTS TWO HEADS I LOVE IT!<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://generalroboticslab.com/DukeHumanoidv2\">General Robotics Lab<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"wpg0va81l7g\"><em>9/11 was the first documented use of <a href=\"https://spectrum.ieee.org/japan-earthquake-more-robots-to-the-rescue\" target=\"_blank\">robots for urban search and rescue<\/a> and helped create the field of disaster robotics. Personnel began assembling on the afternoon of September 11 and worked the pile from late on  September 11 through October 2, when the last available robot failed. The robots found no survivors, but they located remains and helped search for routes through the rubble toward basements and stairwells where trapped firefighters might have gone.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"http://crasar.org/\">CRASAR<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"ghysqmmria4\"><em>Unitree majorly fully open-sources the UnifoLM-WLA-1.0 embodied foundation model, achieving new SOTA results across multiple benchmarks among open-source models worldwide. A single model coordinates desktop and whole-body mobile manipulation, supporting cross-task and cross-end-effector generalization, driven by one model, whole-body coordination.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://unigen-x.github.io/unifolm-wla.github.io/\">Unitree<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"bsvwmcv60xo\"><em>Compliance is very important in physical interaction. In this work, we show how a multi-lined aerial robot uses its centroid and joint motion to achieve hybrid impedance—admittance control in contact-rich aerial manipulation tasks such as surface sliding. This work will be presented in IEEE IROS 2026.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.dragon.t.u-tokyo.ac.jp/\">DRAGON Lab<\/a> ]<\/p><p>Thanks, Moju!<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"xvuwficd5g0\">Remind me not to get too close to this.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://railab.kaist.ac.kr/\">RaiLab Kaist<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"ypkcijt_nuw\">Welcome to this edition of Things That Really Seem Like They Should Not Fly.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://avfl.engr.tamu.edu/\">Texas A&amp;M University Advanced Vertical Flight Lab<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"fna1crvtbls\"><em>Achieving agile and generalized <a href=\"https://spectrum.ieee.org/quadruped-robot-benchmark-barkour\" target=\"_blank\">legged locomotion<\/a> across terrains requires tight integration of perception and control, especially under occlusions and sparse footholds. Existing methods have demonstrated agility on parkour courses but often rely on end-to-end sensorimotor models with limited generalization and interpretability. By contrast, methods targeting generalized locomotion typically exhibit limited agility and struggle with visual occlusions. We introduce a unified reinforcement learning (RL) framework for agile and generalized locomotion that incorporates a novel attention-based map encoder in the control policy.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://sites.google.com/leggedrobotics.com/ame-2\">ETH Zurich Robotic Systems Lab<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"qkijeldgula\">Finally, the killer app for humanoid robots! But we probably shouldn’t call it that.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.unitree.com/\">Unitree<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"p3bftreqwks\">I suspect that this demo avoids many of the things that are actually difficult about doing dishes. Not just the water and the slippery soapiness, but also identifying when a dish is dirty as well as when it is actually clean.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.flexiv.com/\">Flexiv<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"broo89hfta4\">Sure, I guess I might want a robot to deliver a burrito to me while I’m hiking to the top of a mountain in the rain...?<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.deeprobotics.cn/en\">DEEP Robotics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"k9uhqymng9i\"><em>AI has transformed the digital world. It writes our code, generates our images, reasons in our language. But the physical world—the plants that make our power, our fuel, our steel, and chemicals—it has barely touched. ANYbotics CEO and co-founder Péter Fankhauser on the bet behind the company: Why legged robots turned out to be the way into the world’s most demanding industrial plants, what it took to certify one for explosive atmospheres after experts called it impossible, and where autonomous industrial work goes next.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.anybotics.com/\">ANYbotics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div>"}, {"title": "One brick at a time: How Monumental uses robotics to build walls", "source": "Robotics Business Review", "date": "2026-09-11", "url": "https://www.therobotreport.com/one-brick-at-a-time-how-monumental-uses-robotics-to-build-walls/", "summary": "<p>CEO Salar al Khafaji introduces podcast listeners to how Monumental is using robotics to build walls.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/one-brick-at-a-time-how-monumental-uses-robotics-to-build-walls/\">One brick at a time: How Monumental uses robotics to build walls<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Learn how AVs and robotics are laying the groundwork for field deployments at RoboBusiness", "source": "Robotics Business Review", "date": "2026-09-11", "url": "https://www.therobotreport.com/learn-how-avs-robotics-are-laying-groundwork-field-deployments-robobusiness/", "summary": "<p>ASI CEO Mel Torrie will explore why the intersection of autonomous vehicles and robotics will further revolutionize field deployments.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/learn-how-avs-robotics-are-laying-groundwork-field-deployments-robobusiness/\">Learn how AVs and robotics are laying the groundwork for field deployments at RoboBusiness<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Skild AI Taps NVIDIA Physical AI to Teach Robots New Tasks From a Single Video", "source": "NVIDIA Robotics", "date": "2026-09-10", "url": "https://blogs.nvidia.com/blog/skild-ai-s1-physical-ai/", "summary": "Manufacturing floors, warehouses and production lines rarely stay fixed — tasks change, layouts shift and new products arrive, and most robots can’t keep up without significant reprogramming. Skild AI’s new S1 robot foundation model helps address this, designed to learn previously unseen, long-horizon tasks from a single video demonstration. The model, launched last week, uses [&#8230;]"}, {"title": "Swarmer to acquire Ukrainian UGV maker Ratel Robotics for up to $224M", "source": "Robotics Business Review", "date": "2026-09-10", "url": "https://www.therobotreport.com/swarmer-to-acquire-ukrainian-ugv-maker-ratel-robotics-for-up-to-224m/", "summary": "<p>Swarmer, which has developed swarm software, plans to work with Ratel Robotics' unmanned ground vehicles in Ukraine.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/swarmer-to-acquire-ukrainian-ugv-maker-ratel-robotics-for-up-to-224m/\">Swarmer to acquire Ukrainian UGV maker Ratel Robotics for up to $224M<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Comau automates picking, handling, and palletizing for Decathlon", "source": "Robotics Business Review", "date": "2026-09-10", "url": "https://www.therobotreport.com/comau-automates-picking-handling-and-palletizing-for-decathlon/", "summary": "<p>Comau's system incorporates its MyCo cobot, ROS2 software architecture, AI-powered vision systems, and a modular gripper.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/comau-automates-picking-handling-and-palletizing-for-decathlon/\">Comau automates picking, handling, and palletizing for Decathlon<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Robots Are Learning to Feel", "source": "IEEE Spectrum Robotics", "date": "2026-09-10", "url": "https://spectrum.ieee.org/tactile-data-robots", "summary": "<img src=\"https://spectrum.ieee.org/media-library/image.jpg?id=67745231&amp;width=980\" /><br /><br /><p>Dexterous manipulation remains one of the biggest barriers keeping robots from successfully tackling a wide range of everyday tasks. A sense of touch could be the key, but a lack of quality data has held back progress. This is now starting to change as academic labs and startups race to build new tactile datasets and techniques to put them to use.<\/p><p>Over the last few years, <a href=\"https://spectrum.ieee.org/gemini-robotics\" target=\"_self\">vision-language-action (VLA) models<\/a> have significantly improved the ability of robots to carry out complex tasks involving objects and environments they’ve never encountered before. Pretrained on huge amounts of images, video, and text, and then fine-tuned on a smaller number of teleoperated robot demonstrations, these VLAs can guide robots through a growing range of everyday jobs—<a href=\"https://www.pi.website/blog/pistar06\" rel=\"noopener noreferrer\" target=\"_blank\">like folding laundry, tidying living rooms, and even operating kitchen gadgets<\/a>—using just a video feed and natural language instructions.<\/p><p>But robots still struggle with tasks that require fine-grained hand control, such as handling deformable materials or manipulating small objects—plugging in a USB cable or turning a key in a lock, for example. That’s partly because VLAs ignore one of the primary sources of information humans rely on in these situations: tactile feedback.<\/p><h2>Manipulating Like Humans<\/h2><p>“Most dexterous manipulation can be done by humans with their eyes closed,” says <a href=\"https://people.eecs.berkeley.edu/~trevor/\" rel=\"noopener noreferrer\" target=\"_blank\">Trevor Darrell<\/a>, professor of computer science at the University of California, Berkeley. “Understanding force, slip, and precise grasping is not something that can be done well with traditional vision sensors.”<\/p><p>However, making effective use of tactile sensors is difficult. Tactile sensor data has very different characteristics to the image data VLAs are normally trained on, and tactile datasets lag far behind the internet-scale of many vision and language datasets. To get around this, Darrell’s team devised a way to first pretrain a model on existing datasets before giving it a sense of touch by training a specialist submodel on <a href=\"https://arxiv.org/abs/2606.17055\" rel=\"noopener noreferrer\" target=\"_blank\">100 hours of specially collected, high-quality tactile data<\/a>, including demonstrations of common actions like wiping, grasping, twisting, or pouring using more than 200 different household objects.<\/p><h3><\/h3><br />\n<p class=\"caption\">Explore an interactive visualizer of a small portion of the T-Rex dataset. <span class=\"image-media media-photo-credit\"><a href=\"https://tactile-reactive-dexterous.github.io/#citation\" target=\"_blank\">T-Rex<\/a><\/span><\/p><p>Putting the tactile data to use was not straightforward. The goal was for a robot to be able to use the tactile signal to correct its grip in real time as it manipulated objects. But this requires reaction times faster than most vision-language models operate at. This mismatch is a significant challenge, Darrell says, so the team used separate submodels, known as “experts,” to handle high-level actions and low-level tactile control in a way that’s quick enough for the tactile feedback to be useful.<\/p><p>The action expert produces motion plans, while the tactile expert, which operates four times faster, uses tactile feedback to adjust the motion plan in real time based on what the robot is feeling as it goes. The model was then fine-tuned on about 100 teleoperated demonstrations of relatively complex manipulation tasks, such as screwing in a light bulb, applying toothpaste to a toothbrush, or transferring an egg between trays, where it averaged a success rate of 65 percent across 12 tasks—nearly double the best VLA model.<\/p><h2>Data Diversity<\/h2><p>One limitation, admits Darrell, is that his data comes from a single instance of robotic hardware. Robot hands range from fully articulated five-finger designs to simple pincer grippers, and tactile sensors can rely on fundamentally different physics, from measuring changes in resistance to recording images of a soft gel pad deforming. That makes most tactile AI research sensor-specific, says <a href=\"https://michaelyuancb.github.io/\" target=\"_blank\">Chengbo Yuan<\/a>, a master’s student at Tsinghua University in Beijing, and makes it hard to share data and transfer learnings between groups.<\/p><p>Yuan recently set out to tackle this problem by <a href=\"https://arxiv.org/pdf/2606.13102\" rel=\"noopener noreferrer\" target=\"_blank\">aggregating more than 3,000 hours<\/a> of tactile robotic data from publicly available datasets, covering 21 sensor types and a variety of robot embodiments. Yuan says they were inspired by efforts like the <a href=\"https://spectrum.ieee.org/global-robotic-brain\" target=\"_self\">Open X-Embodiment collaboration<\/a>, which pooled data from many robots and led to models that generalize to hardware not used in training. Yuan’s team then designed a hardware-agnostic model that can train on this diverse data by converting each sensor’s output into a shared format and mapping it onto labeled positions on a template of a human hand. This model was much more successful than a baseline model, even on hardware it had never encountered before. Yuan puts that down to it acquiring “some kind of common sense of tactile knowledge,” by training on such diverse setups.<\/p><h2>Chasing Scale<\/h2><p>Despite the promising results, Yuan thinks more tactile data is needed, and his group is now leading an 80-institution collaboration to collate a larger set of teleoperated demonstrations using a standardized approach to tactile data collection and processing. In the meantime, Fudan University in Shanghai and its spin-out <a href=\"https://baike.baidu.com/en/item/NeoteAI/1682418\" rel=\"noopener noreferrer\" target=\"_blank\">NeoteAI<\/a> have already produced <a href=\"https://research.neoteai.com/assets/n0-foundation-report.pdf\" rel=\"noopener noreferrer\" target=\"_blank\">a tactile dataset<\/a> an order of magnitude larger than previous efforts. Using <a href=\"https://neoteai.com/\" rel=\"noopener noreferrer\" target=\"_blank\">a proprietary sensor<\/a> attached to a variety of robotic arms and a handheld gripper operated by humans, they have collected more than 30,000 hours of demonstrations with synchronized visual and tactile data.<\/p><p>The researchers used this data to <a href=\"https://research.neoteai.com/n0-twam/\" rel=\"noopener noreferrer\" target=\"_blank\">train a model<\/a> that doesn’t just react to touch, but also proactively predicts what the robot should be feeling to help guide and assess actions, significantly improving performance. <a href=\"https://shunlinlu.github.io/\" rel=\"noopener noreferrer\" target=\"_blank\">Shunlin Lu<\/a>, a postdoc researcher at Fudan University and CTO of NeoteAI, says the results are clear evidence that access to large-scale and diverse tactile data leads to significant performance gains.<\/p><p class=\"shortcode-media shortcode-media-youtube\"> <span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><small class=\"image-media media-caption\">Robot manipulation policies with a tactile component offer improved performance on a variety of real-world tasks.<\/small><small class=\"image-media media-photo-credit\">NeoteAI<\/small><\/p><p>Another approach to scaling tactile data could be to piggyback on the vast quantities of visual robotics data already collected. Researchers at the University of Southern California, in Los Angeles, recently <a href=\"https://arxiv.org/pdf/2607.20683\" rel=\"noopener noreferrer\" target=\"_blank\">released a model<\/a> that learned to infer tactile information from visual data, by training it on more than 2,700 demonstrations of everyday manipulation using a handheld gripper that records both tactile data and images from a camera on the device. The model learned associations between images of the gripper coming into contact with objects and the amount of pressure felt by the tactile sensors at that moment, giving even robots without tactile sensors a rudimentary sense of touch that the researchers showed to be particularly useful for contact-rich manipulation tasks. But their broader ambition is to use the generator to add tactile data to existing vision datasets.<\/p><p>How much tactile data will be required for breakthroughs in dexterous tasks remains unclear. So far, tactile training’s main contribution has been to make robots more efficient learners at tasks already within reach like picking and placing objects, says Yuan, and he suspects new algorithms may be required to tackle problems truly impossible without touch.<\/p><p><a href=\"https://people.ucas.ac.cn/~chenglong?language=en\" rel=\"noopener noreferrer\" target=\"_blank\">Long Cheng<\/a> of the Chinese Academy of Sciences in Beijing also thinks raw data is no panacea. “Data is good,” he says. “But how to use them correctly is another issue.” The problem, he notes, is that vision provides a continuous, high-bandwidth stream of pixels, while tactile signals are sparse and intermittent, so models learn to ignore them. His solution, being presented at <a href=\"https://2026.ieee-iros.org/\" rel=\"noopener noreferrer\" target=\"_blank\">IROS 2026<\/a> later this month, is a model that predicts what a robot will feel from vision alone and then compares it against real tactile input. A large gap between the two means the sensor is detecting something the robot would otherwise miss, so these surprising signals are amplified while predictable ones are dampened. Across five contact-rich tasks, the approach averaged 62.8 percent success against 28.2 percent for the same model without touch.<\/p><p>Lu is more confident that data scaling could have similar benefits to those seen in areas like language and vision. He guesses closer to 100,000 hours, collected in varied, real-world settings rather than in the lab, could unlock new capabilities. Either way, the field now has some early signs that larger tactile datasets and smarter ways to use them can give robots a significant boost on some of the most challenging tasks. “I think tactile intelligence is actually the next step for physical AI,” Lu says.<\/p>"}, {"title": "Teradyne Robotics sues JAKA over 3 Universal Robots patents", "source": "Robotics Business Review", "date": "2026-09-10", "url": "https://www.therobotreport.com/teradyne-robotics-sues-jaka-over-3-universal-robots-patents/", "summary": "<p>New details reveal the lawsuit involves three Universal Robots patents about robot interfaces, safety brakes, and joints.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/teradyne-robotics-sues-jaka-over-3-universal-robots-patents/\">Teradyne Robotics sues JAKA over 3 Universal Robots patents<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "AGIBOT to explain how to scale humanoids from the lab to the real world at RoboBusiness", "source": "Robotics Business Review", "date": "2026-09-09", "url": "https://www.therobotreport.com/agibot-share-plans-scale-humanoids-from-lab-to-real-world-at-robobusiness/", "summary": "<p>AGIBOT plans to give attendees actionable insights on identifying high-value robotics use cases and building sustainable developer ecosystems.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/agibot-share-plans-scale-humanoids-from-lab-to-real-world-at-robobusiness/\">AGIBOT to explain how to scale humanoids from the lab to the real world at RoboBusiness<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Vention opens Physical AI Lab for manufacturing in Montreal", "source": "Robotics Business Review", "date": "2026-09-09", "url": "https://www.therobotreport.com/vention-opens-physical-ai-lab-manufacturing-montreal/", "summary": "<p>Vention's new Physical AI Lab will focus on advancing robotic manipulation from research to scalable production-line deployment.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/vention-opens-physical-ai-lab-manufacturing-montreal/\">Vention opens Physical AI Lab for manufacturing in Montreal<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Unitree shares down 53% from IPO debut", "source": "Robotics Business Review", "date": "2026-09-09", "url": "https://www.therobotreport.com/unitree-shares-down-53-from-ipo-debut/", "summary": "<p>The market is pulling back on Unitree's $66 billion valuation from its debut on the Shanghai Stock Exchange just last month.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/unitree-shares-down-53-from-ipo-debut/\">Unitree shares down 53% from IPO debut<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "What bricklaying has taught Monumental about robots in construction", "source": "Robotics Business Review", "date": "2026-09-09", "url": "https://www.therobotreport.com/what-bricklaying-has-taught-monumental-about-robots-construction/", "summary": "<p>The construction industry is rife with opportunity for robotics, but the technology hasn't broken in at scale yet. <\/p>\n<p>The post <a href=\"https://www.therobotreport.com/what-bricklaying-has-taught-monumental-about-robots-construction/\">What bricklaying has taught Monumental about robots in construction<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Why vision AI is the safety backbone of the automated job site", "source": "Robotics Business Review", "date": "2026-09-08", "url": "https://www.therobotreport.com/why-vision-ai-is-safety-backbone-of-automated-job-site/", "summary": "<p>Vision AI doesn't replace robots or human judgement; it provides the continuous perception that allows both to operate safely together.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/why-vision-ai-is-safety-backbone-of-automated-job-site/\">Why vision AI is the safety backbone of the automated job site<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Boston Dynamics veteran launches Dynamic Creatures to bring characters to life with robotics", "source": "Robotics Business Review", "date": "2026-09-08", "url": "https://www.therobotreport.com/boston-dynamics-veterans-launch-dynamic-creatures-to-bring-characters-to-life-with-robotics/", "summary": "<p>Dynamic Creatures plants to create its own line of characters, and to re-create characters for specific brands and environments.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/boston-dynamics-veterans-launch-dynamic-creatures-to-bring-characters-to-life-with-robotics/\">Boston Dynamics veteran launches Dynamic Creatures to bring characters to life with robotics<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "AI can’t outrun a humanoid’s hardware", "source": "Robotics Business Review", "date": "2026-09-08", "url": "https://www.therobotreport.com/ai-cant-outrun-a-humanoids-hardware/", "summary": "<p>The remarkable progress in AI has brought robotics closer to machines capable of determining what they should do. The next major advance may depend on whether their physical systems can execute those decisions efficiently, precisely and safely.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/ai-cant-outrun-a-humanoids-hardware/\">AI can’t outrun a humanoid&#8217;s hardware<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "This Robot Will Draw Your Blood Now", "source": "IEEE Spectrum Robotics", "date": "2026-09-07", "url": "https://spectrum.ieee.org/blood-draw-robot-vitestro-aletta", "summary": "<img src=\"https://spectrum.ieee.org/media-library/an-older-silver-haired-woman-seated-at-automated-medical-device-with-a-robotic-arm-drawing-blood.jpg?id=67726417&amp;width=1245&amp;height=700&amp;coordinates=0%2C187%2C0%2C188\" /><br /><br /><p>You sit down and put your arm in the cradle. You press a button. The machine takes it from there.<\/p><p>A <a href=\"https://spectrum.ieee.org/tag/near-infrared-light\" target=\"_self\">near-infrared light<\/a> sweeps your inner elbow, hunting for a vein. A puff of alcohol hits your skin. An <a href=\"https://spectrum.ieee.org/tag/ultrasound\" target=\"_self\">ultrasound<\/a> probe glides across your arm, mapping how deep the vessel runs and which way it bends. Doppler captures the direction of blood flow to rule out the artery.<\/p><p>The cuff tightens around your upper arm. The needle comes down and pierces the skin. Your blood flows into the collection tubes, each one tipped end over end nine times—no more, no less. The needle withdraws. You get a bandage. No human ever touched you.<\/p><p>This is what it’s like to have blood taken by <a href=\"https://vitestro.com/aletta/\" rel=\"noopener noreferrer\" target=\"_blank\">Aletta<\/a>, the first <a href=\"https://spectrum.ieee.org/profile-veebot\" target=\"_self\">autonomous blood-draw device<\/a> authorized for use in the United States. Developed by the Dutch medical robotics firm <a href=\"https://vitestro.com/\" rel=\"noopener noreferrer\" target=\"_blank\">Vitestro<\/a>, the system combines imaging technologies with advanced robotics and AI to do by algorithm what a human phlebotomist—a trained health care professional who finds veins and draws blood by hand—does by feel.<\/p><p>The U.S. Food and Drug Administration <a href=\"https://www.fda.gov/news-events/press-announcements/fda-authorizes-first-its-kind-robotic-blood-draw-device\" rel=\"noopener noreferrer\" target=\"_blank\">gave Aletta the go-ahead<\/a> on 19 August for use on adults in nonhospitalized settings. The decision follows the lead of European regulators, who <a href=\"https://www.prnewswire.com/news-releases/vitestro-achieves-ce-marking-for-autonomous-blood-drawing-device-302231939.html\" rel=\"noopener noreferrer\" target=\"_blank\">authorized the device two years earlier<\/a>.<\/p><p>“You have to tip your cap to them,” says <a href=\"https://www.linkedin.com/in/maxbalter/\" rel=\"noopener noreferrer\" target=\"_blank\">Max Balter<\/a>, a surgical-robotics specialist at Medtronic who <a href=\"https://ieeexplore.ieee.org/document/7169572\" rel=\"noopener noreferrer\" target=\"_blank\">worked<\/a> on <a href=\"https://ieeexplore.ieee.org/document/7457657\" rel=\"noopener noreferrer\" target=\"_blank\">autonomous<\/a> blood-draw <a href=\"https://www.worldscientific.com/doi/10.1142/S2339547819500067\" rel=\"noopener noreferrer\" target=\"_blank\">systems<\/a> during grad school in the mid-2010s. “The engineering that they have is incredible…and with their FDA clearance, it moves the whole industry forward.”<\/p><h2>Aletta Boosts Lab Capacity Amid Shortages<\/h2><p>In a clinical trial involving more than 1,600 people in the Netherlands, Aletta successfully drew blood on the first attempt in <a href=\"https://doi.org/10.1093/clinchem/hvag029\" rel=\"noopener noreferrer\" target=\"_blank\">94.5 percent of cases<\/a>, even among those with hard-to-access veins, people with obesity, and the elderly. When Aletta failed to identify a suitable vein, the patient was referred for conventional phlebotomy.<\/p><p>“It’s exceptional performance,” says <a href=\"https://medicine.yale.edu/profile/joe-el-khoury/\" rel=\"noopener noreferrer\" target=\"_blank\">Joe El-Khoury<\/a>, a clinical chemist at Yale who was not involved in the Dutch trial. “It’s definitely as good if not better” than a typical professional phlebotomist.<\/p><p>Complications were minimal, with multiple built-in safeguards to detect problems, such as sensors that track arm movement and needle position, and to halt the process should something go awry. And for those whose veins proved too challenging, a phlebotomist remains on hand to take over when needed.<\/p><p>Notably, because a single phlebotomist can supervise up to three Aletta machines, the system should go a long way toward “helping clinical labs address the critical operational challenges related to the staffing shortages of phlebotomists,” says <a href=\"https://www.linkedin.com/in/luuk-giesen/\" rel=\"noopener noreferrer\" target=\"_blank\">Luuk Giesen<\/a>, chief medical officer of Vitestro.<\/p><p>That’s no small challenge in a profession with a <a href=\"https://aplm.kglmeridian.com/doi/10.5858/arpa.2019-0140-CP\" rel=\"noopener noreferrer\" target=\"_blank\">median annual turnover rate of nearly 25 percent<\/a> and a <a href=\"https://academic.oup.com/ajcp/article/164/5/759/8267738\" rel=\"noopener noreferrer\" target=\"_blank\">vacancy rate of close to 10 percent<\/a>, according to surveys of medical laboratories that draw mostly from U.S. institutions. The resulting staffing shortages can limit labs’ capacity to meet demand for routine diagnostic testing of blood counts, cholesterol, metabolic markers, and more. Aletta could address that bottleneck.<\/p><h2>Addressing Skin Tone Bias in Blood Draw AI<\/h2><p>The promise of greater capacity, however, comes with a caveat: Aletta still fails in roughly one case out of 20. Who are those people?<\/p><p>Some may simply have elusive or unusually deep veins. But a more significant obstacle could be skin pigmentation. In particular, the melanin in darker skin can interfere with the near-infrared light Aletta uses to first map the veins near the skin’s surface and identify promising puncture sites. The technique relies on hemoglobin absorbing the light differently from surrounding tissue, and darker skin tones can absorb more of that light before it reaches the camera, thereby reducing the contrast.<\/p><p class=\"shortcode-media shortcode-media-rebelmouse-image\"> <img alt=\"A smiling dark skinned woman holds a bandaid onto her arm while sitting next to a large machine.\" class=\"rm-shortcode\" id=\"9138e\" src=\"https://spectrum.ieee.org/media-library/a-smiling-dark-skinned-woman-holds-a-bandaid-onto-her-arm-while-sitting-next-to-a-large-machine.jpg?id=67726420&amp;width=980\" /> <small class=\"image-media media-caption\">Some experts have raised concerns that Aletta’s infrared sensors will perform poorly for people with darker skin tones, but Vitestro says that its machine also includes an ultrasound sensor, in part to mitigate that risk.<\/small><small class=\"image-media media-photo-credit\">Vitestro<\/small><\/p><p>Giesen recognizes that the issue could affect first-pass imaging, but notes that the main determinant of vein selection and needle placement is the ultrasound system, which relies on sound rather than light and should not be affected by skin pigmentation in the same way. “Ultrasound is skin-tone agnostic,” he says, adding that Vitestro has unpublished data showing no effect of skin tone on the system’s performance.<\/p><p>The company thus <a href=\"https://vitestro.com/aletta/patients/\" target=\"_blank\">claims on its website<\/a> that the “technology works well for all skin tones,” an assertion <a href=\"https://www.fda.gov/news-events/press-announcements/fda-authorizes-first-its-kind-robotic-blood-draw-device\" rel=\"noopener noreferrer\" target=\"_blank\">echoed in the FDA press release<\/a> announcing the authorization of Vitestro’s device.<\/p><p>But given the history of racial disparities in medical devices—particularly optical technologies such as pulse oximeters, which can be <a href=\"https://spectrum.ieee.org/pulse-oximeters-encode-racial-bias-with-clear-consequences-for-covid-19-patients\" target=\"_self\">less accurate in people with darker skin<\/a> and went largely unrecognized as a problem for decades—such claims warrant evidence, says El-Khoury, who has <a href=\"https://academic.oup.com/clinchem/article-lookup/doi/10.1093/clinchem/hvag045\" rel=\"noopener noreferrer\" target=\"_blank\">written about the issue<\/a>.<\/p><p><a href=\"https://www.mayoclinic.org/biographies/katzman-brooke-m-ph-d/bio-20514695\" rel=\"noopener noreferrer\" target=\"_blank\">Brooke Katzman<\/a>, a clinical chemist at the Mayo Clinic who is collaborating with Vitestro, also wants more evidence that samples collected by the robot are as suitable for testing as those drawn by hand.<\/p><p>The Dutch trial reported little damage to red blood cells, but other measures of sample quality, including clotted tubes, insufficient blood, and proper tube filling, still need to be assessed, as do the results of routine laboratory tests themselves. Katzman plans to launch a U.S.-based trial next year to collect just that sort of data.<\/p><p>“We’re going to do our due diligence,” she says. “Like any instrument we would bring into the lab, we’re going to put it through its paces before using it clinically.”<\/p><h2>The Future of Automated Blood Testing<\/h2><p>Aletta takes its name from the 19th-century physician <a href=\"https://pmc.ncbi.nlm.nih.gov/articles/PMC11151697/\" rel=\"noopener noreferrer\" target=\"_blank\">Aletta Jacobs<\/a>, the first female doctor in the Netherlands and founder of what is widely considered the world’s first birth-control clinic.<\/p><p>That nod to history is fitting for a technology that builds on decades of research in robotic phlebotomy by groups in <a href=\"https://ieeexplore.ieee.org/document/826854/\" rel=\"noopener noreferrer\" target=\"_blank\">Europe<\/a>, the <a href=\"https://www.researchgate.net/publication/309480332_Robotic_Assistive_Device_for_Phlebotomy\" rel=\"noopener noreferrer\" target=\"_blank\">United States<\/a>, and <a href=\"https://haoyangli16.github.io/pdf/venibot.pdf\" rel=\"noopener noreferrer\" target=\"_blank\">China<\/a>, and <a href=\"https://doi.org/10.3389/fmed.2023.1251963\" rel=\"noopener noreferrer\" target=\"_blank\">MagicNurse<\/a>. Yet few pushed the concept as far as biomedical engineer <a href=\"https://bme.rutgers.edu/martin-l-yarmush\" rel=\"noopener noreferrer\" target=\"_blank\">Martin Yarmush<\/a> of Rutgers University in New Jersey, in whose lab Medtronic’s Balter completed his Ph.D.<\/p><p>In one version of their platform, the Rutgers team even <a href=\"https://ieeexplore.ieee.org/document/7759102/\" rel=\"noopener noreferrer\" target=\"_blank\">coupled their robot to a benchtop blood analyzer<\/a>, allowing it to draw samples and then measure levels of infection-fighting immune cells and oxygen-carrying red blood cells—all within minutes.<\/p><p>That all-in system never made it out of laboratory testing. And VascuLogic, the company spun out to commercialize the platform, is long defunct—though others, including <a href=\"https://rophai.net/\" rel=\"noopener noreferrer\" target=\"_blank\">ROPHAI<\/a>, <a href=\"https://bhealthcare.com/\" rel=\"noopener noreferrer\" target=\"_blank\">BHealthCare<\/a>, and <a href=\"https://doi.org/10.3389/fmed.2023.1251963\" rel=\"noopener noreferrer\" target=\"_blank\">MagicNurse<\/a>, continue to work in the space. But the Rutgers proof-of-concept demonstration points toward the tantalizing possibility of fully automated blood testing at the point of care, with robots handling everything from the needle stick to the analysis.<\/p><p>It is, in some ways, the promise that Theranos made—but built on conventional, validated laboratory technology rather than the <a href=\"https://www.goodreads.com/en/book/show/37976541-bad-blood\" rel=\"noopener noreferrer\" target=\"_blank\">dubious science and deception<\/a> that brought that particular company down.<\/p><p>“I have no doubt that is the future,” says <a href=\"https://www.feinberg.northwestern.edu/faculty-profiles/az/profile.html?xid=22300\" rel=\"noopener noreferrer\" target=\"_blank\">Gregory Retzinger<\/a>, a clinical pathologist at the Northwestern University Feinberg School of Medicine, in Chicago, who <a href=\"https://vitestro.com/news/northwestern-medicine-and-vitestro-collaborate-to-advance-autonomous-robotic-phlebotomy/\" rel=\"noopener noreferrer\" target=\"_blank\">collaborates with Vitestro<\/a> and has tried the Aletta device himself. (“It was painless, it was fast,” he says.)<\/p><p>For now, Giesen says Vitestro is keeping its ambitions—and its machine—focused on the blood-collection process itself, though he believes Aletta could ultimately do far more. The company plans to launch Aletta in Europe next year, with the U.S. market to follow. <\/p>"}, {"title": "Inbolt to discuss physical AI’s deployment problem at RoboBusiness", "source": "Robotics Business Review", "date": "2026-09-07", "url": "https://www.therobotreport.com/inbolt-ceo-to-discuss-physical-ais-deployment-problem-at-robobusiness/", "summary": "<p>Rudy Cohen, the co-founder and CEO of Inbolt, will reframe where physical AI pays off at RoboBusiness this fall.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/inbolt-ceo-to-discuss-physical-ais-deployment-problem-at-robobusiness/\">Inbolt to discuss physical AI&#8217;s deployment problem at RoboBusiness<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Agility Robotics reports $1.8M revenue ahead of humanoid SPAC", "source": "Robotics Business Review", "date": "2026-09-07", "url": "https://www.therobotreport.com/agility-robotics-reports-18m-revenue-ahead-of-humanoid-spac/", "summary": "<p>Agility Robotics’ S-4 filing reveals $1.8 million in 2025 revenue, a $140 million operating loss and plans to scale its Digit humanoid robot business.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/agility-robotics-reports-18m-revenue-ahead-of-humanoid-spac/\">Agility Robotics reports $1.8M revenue ahead of humanoid SPAC<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "MassRobotics shares member survey results around FCC restrictions", "source": "Robotics Business Review", "date": "2026-09-07", "url": "https://www.therobotreport.com/massrobotics-shares-member-survey-results-around-fcc-restrictions/", "summary": "<p>MassRobotics has found that companies were split on the FCC ban on new foreign-produced mobile robots.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/massrobotics-shares-member-survey-results-around-fcc-restrictions/\">MassRobotics shares member survey results around FCC restrictions<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Pressure sensors can help improve robotic gripping accuracy", "source": "Robotics Business Review", "date": "2026-09-06", "url": "https://www.therobotreport.com/pressure-sensors-can-help-improve-robotic-gripping-accuracy/", "summary": "<p>From first contact through surface deformation, load distribution, and final stable hold, pressure sensors can improve robotic bin picking.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/pressure-sensors-can-help-improve-robotic-gripping-accuracy/\">Pressure sensors can help improve robotic gripping accuracy<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Eric Sivertson discusses FPGAs and robot security", "source": "Robotics Business Review", "date": "2026-09-06", "url": "https://www.therobotreport.com/eric-sivertson-discusses-fpgas-robot-security/", "summary": "<p>An interview with Eric Sivertson of Lattice Semiconductor about FPGAs and how they can improve robot safety and security.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/eric-sivertson-discusses-fpgas-robot-security/\">Eric Sivertson discusses FPGAs and robot security<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Cyborg Roaches Can Stab You With Needles", "source": "IEEE Spectrum Robotics", "date": "2026-09-05", "url": "https://spectrum.ieee.org/cyborg-rescue-roach", "summary": "<img src=\"https://spectrum.ieee.org/media-library/large-brown-cockroach-fitted-with-an-electronic-device-and-wires-on-its-back.jpg?id=67724302&amp;width=1245&amp;height=700&amp;coordinates=0%2C62%2C0%2C63\" /><br /><br /><p>Imagine you are trapped under rubble after an earthquake and you see an electronics-covered cockroach with a spring-loaded needle on its back scuttling toward you. Although the sight might be unnerving, to say the least, this prototype paramedic cyborg, or “Paraborg,” might one day help deliver lifesaving aid to disaster victims who might be otherwise impossible to reach.<\/p><hr /><h3>The Hardest Problems in Robotics<\/h3><p>For decades, scientists have sought to develop cyborg insects as “a shortcut around some of the hardest problems in robotics,” says <a href=\"https://about.uq.edu.au/experts/42152\" rel=\"noopener noreferrer\" target=\"_blank\">T. Thang Vo-Doan<\/a>, director of the <a href=\"https://tthangvodoan.wordpress.com/\" rel=\"noopener noreferrer\" target=\"_blank\">University of Queensland’s Biorobotics Lab<\/a> in Brisbane, Australia, which just published a paper on the Paraborgs.<\/p><p class=\"shortcode-media shortcode-media-youtube\"> <span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span> <small class=\"image-media media-photo-credit\">The University of Queensland<\/small> <\/p><p>Building an insect-size robot “that can move reliably through rubble, climb over irregular surfaces, recover from falls, carry its own power, and still have room for useful sensors is extraordinarily difficult,” Vo-Doan says. An insect already comes with much of that mobility built in, so instead of trying to create artificial versions of every part of an insect’s body from scratch, researchers can graft an electronic interface onto an insect to make use of its existing capabilities.<\/p><p>Previously, scientists have shown they could steer cyborg insects such as <a href=\"https://spectrum.ieee.org/the-robot-insect-race\" target=\"_self\">beetles<\/a> and <a href=\"https://spectrum.ieee.org/cyborg-moth-gets-a-new-radio\" target=\"_self\">moths<\/a>. This prior work largely focused on controlling their movements to serve as passive sensor platforms.<\/p><p>In 2023, as Vo-Doan and fellow researcher <a href=\"https://www.unsw.edu.au/staff/thanh-nho-do\" rel=\"noopener noreferrer\" target=\"_blank\">Thanh Nho Do<\/a> were talking about search-and-rescue cyborg insects shortly before that year’s IEEE International Conference on Robotics and Automation (ICRA), they asked, “What happens after an insect finds a trapped victim?” Vo-Doan recalls. “Could it go beyond locating someone and actually provide some form of assistance while rescuers are still trying to reach them?”<\/p><h3>Giant Cockroaches to the Rescue<\/h3><p>To answer this question, the roboticists experimented with giant burrowing cockroaches (<a href=\"https://en.wikipedia.org/wiki/Giant_burrowing_cockroach\" rel=\"noopener noreferrer\" target=\"_blank\"><em><em>Macropanesthia rhinoceros<\/em><\/em><\/a>), which are native to Australia. The researchers needed an insect capable of carrying a large payload (over half its weight), and at roughly 40 grams in size, this species is <a href=\"https://www.guinnessworldrecords.com/world-records/106442-heaviest-cockroach\" rel=\"noopener noreferrer\" target=\"_blank\">the world’s heaviest species of roach<\/a>. A larger insect is also easier to operate on to implant cybernetic interfaces.<\/p><p>The cockroaches were saddled with lightweight electronics that included electrodes implanted into both their antennae and small tail-like appendages known as cerci. Wirelessly activating these electrodes with a handheld gaming controller could steer the roaches left or right, spur them forward, or stop them from moving.<\/p><p>The insects were also equipped with either a wireless camera or a remote-controlled injector, which used a spring to launch a drug-filled syringe at a nearby target. A chemical reaction inside the syringe then generated a puff of carbon dioxide, which exerted pressure within the syringe to inject its payload into a target.<\/p><p class=\"shortcode-media shortcode-media-rebelmouse-image\"> <img alt=\"Two large cockroaches each with a set of electronics and sensors on their carapace\" class=\"rm-shortcode\" id=\"1244e\" src=\"https://spectrum.ieee.org/media-library/two-large-cockroaches-each-with-a-set-of-electronics-and-sensors-on-their-carapace.jpg?id=67724308&amp;width=980\" /> <small class=\"image-media media-caption\">Paraborgs are designed to work in teams, with some carrying cameras and others carrying injectors with potentially lifesaving medications.<\/small><small class=\"image-media media-photo-credit\">The University of Queensland<\/small><\/p><p>The scientists decided not to load both a camera and an injector onto a single roach because the combined weight and bulk could impair their mobility on complex terrain. Having both sets of electronics would also increase energy demands, resulting in reduced operation time. Instead, the researchers envision a <a href=\"https://spectrum.ieee.org/swarm-of-cyborg-cockroaches\" target=\"_self\">swarm<\/a> approach with the Paraborgs, with different specialized cyborgs performing complementary roles.<\/p><p>In proof-of-concept tests, the scientists were able to successfully navigate the Paraborgs over a 2.5-meter course past three checkpoints before launching their needles at an 8-by-10-centimeter silicone target. In 25 trials, the cockroaches completed the course every single time and succeeded at injecting the target 72 percent of the time. “The long-term goal is to combine the insect’s advanced locomotion with sensing and intervention capabilities so we can reach and help more people, more quickly,” Vo-Doan says.<\/p><p class=\"shortcode-media shortcode-media-rebelmouse-image\"> <img alt=\"Two large cockroaches with backpack electronics navigate around rocks and over sand.\" class=\"rm-shortcode\" id=\"e3858\" src=\"https://spectrum.ieee.org/media-library/two-large-cockroaches-with-backpack-electronics-navigate-around-rocks-and-over-sand.jpg?id=67724312&amp;width=980\" /> <small class=\"image-media media-caption\">While the Paraborgs can be steered remotely, the cockroaches themselves are still very much alive and able to use their skills as bugs to navigate through complex terrain.<\/small><small class=\"image-media media-photo-credit\">The University of Queensland<\/small><\/p><p>The researchers acknowledge that “for someone who is already trapped or injured, seeing a cyborg insect approaching could understandably be a little surprising or unsettling at first,” Vo-Doan says. Ways to make it clear these insects were part of rescue efforts might include flashing lights, recognizable emergency markings, “or perhaps a tiny speaker delivering a simple message such as, ‘Help is on the way,’ ” Vo-Doan adds. “Making people feel comfortable with the technology is just as important as making it work.”<\/p><h3>Practical Paraborgs<\/h3><p>In the future, Vo-Doan and his colleagues aim to address practical issues with the Paraborg. These include compensating for the movements of victims, establishing reliable wireless communications inside collapsed structures, and guiding the cyborgs as they climb over and squeeze through complex environments filled with rubble and dust. Autonomy will become increasingly important for these insects, particularly if the scientists want to operate multiple cyborgs at the same time, he says.<\/p><p>In addition, a fundamental challenge when it comes to working with cyborg insects is that they are living creatures with minds of their own. “We are not piloting them like conventional wheeled robots,” Vo-Doan says. “Electrical stimulation influences their direction, but the insect still generates and controls much of its own locomotion.” To deal with this unreliability, the Paraborgs will need better onboard systems to pinpoint their positions and monitor their actions so researchers can recognize when an insect has deviated from its course or become less responsive.<\/p><p>“We are not suggesting that this is a medical device ready to be used on people today,” Vo-Doan says. “Real disaster sites are full of unstable debris, narrow gaps, and communication difficulties, so we need to understand how the insect, electronics, and injector all perform under those conditions. There are also important questions around drug choice and dosage, sterility, needle safety, reliability, and regulation.”<\/p><p>Ultimately, such research into cyborg cockroaches may help inform robot design, explains Vo-Doan. These insects “can give us useful capabilities sooner while, at the same time, helping us develop the fully artificial systems of the future.”<\/p><p>The scientists detailed <a href=\"https://advanced.onlinelibrary.wiley.com/doi/10.1002/advs.76973\" target=\"_blank\">their findings<\/a> last month in the journal <em><em>Advanced Science<\/em><\/em>.<\/p>"}, {"title": "Enovis to acquire surgical tech provider eCential Robotics for $180M", "source": "Robotics Business Review", "date": "2026-09-05", "url": "https://www.therobotreport.com/enovis-to-acquire-ecential-robotics-for-180m/", "summary": "<p>Enovis said it plans to bring a robotic system targeting the knee within the next two years, followed by a system focusing on the shoulder.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/enovis-to-acquire-ecential-robotics-for-180m/\">Enovis to acquire surgical tech provider eCential Robotics for $180M<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "ARM Institute gets $90M for 10 projects to modernize military manufacturing", "source": "The Robot Report", "date": "2026-09-05", "url": "https://www.therobotreport.com/arm-institute-gets-90m-for-10-projects-to-modernize-military-manufacturing/", "summary": "<p>Fifteen member organizations will deliver viable working solutions within a two-year timeframe, the ARM Institute said.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/arm-institute-gets-90m-for-10-projects-to-modernize-military-manufacturing/\">ARM Institute gets $90M for 10 projects to modernize military manufacturing<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Lyte raises $165M to help robots better sense their surroundings", "source": "Robotics Business Review", "date": "2026-09-04", "url": "https://www.therobotreport.com/lyte-raises-165m-help-robots-better-sense-their-surroundings/", "summary": "<p>Lyte AI plans to use its second round of funding this year to scale production of its AI and perception capabilities.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/lyte-raises-165m-help-robots-better-sense-their-surroundings/\">Lyte raises $165M to help robots better sense their surroundings<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Robot.com partners with Sodexo to roll out more sidewalk delivery robots", "source": "Robotics Business Review", "date": "2026-09-04", "url": "https://www.therobotreport.com/robot-com-partners-sodexo-rolls-out-more-sidewalk-delivery-robots/", "summary": "<p>Robot.com says college campuses will continue to be an important part of its strategy as it scales sidewalk delivery robots.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/robot-com-partners-sodexo-rolls-out-more-sidewalk-delivery-robots/\">Robot.com partners with Sodexo to roll out more sidewalk delivery robots<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "How FPGAs become the gatekeepers of physical AI security", "source": "Robotics Business Review", "date": "2026-09-04", "url": "https://www.therobotreport.com/how-fpgas-become-the-gatekeepers-of-physical-ai-security/", "summary": "<p>Eric Sivertson, vice president of security business at Lattice Semiconductor, explains how FPGAs can act as deterministic guardrails for robotic systems.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/how-fpgas-become-the-gatekeepers-of-physical-ai-security/\">How FPGAs become the gatekeepers of physical AI security<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}], "embeddedNews": [{"title": "Is This The Smallest Internet Radio?", "source": "Hackaday", "date": "2026-10-03", "url": "https://hackaday.com/2026/10/02/is-this-the-smallest-internet-radio/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"450\" src=\"https://hackaday.com/wp-content/uploads/2026/10/tiny-internet-radio-featured.jpg?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>Internet radios have been a thing in some form for the last quarter century, and the advent of cheap networked microcontrollers has made them easier than ever to build. But <a class=\"read-more\" href=\"https://hackaday.com/2026/10/02/is-this-the-smallest-internet-radio/\">&#8230;read more<\/a>"}, {"title": "2026 Retrocomputing Challenge: Lunar Lander on the PDP-1", "source": "Hackaday", "date": "2026-10-03", "url": "https://hackaday.com/2026/10/02/2026-retrocomputing-challenge-lunar-lander-on-the-pdp-1/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"504\" src=\"https://hackaday.com/wp-content/uploads/2026/10/PDP-1-lunar-lander.png?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>A lot of the retrocomputing world is focused on the 1980s, and for good reason&#8211; the home computer revolution was in full swing in that decade, and there is a <a class=\"read-more\" href=\"https://hackaday.com/2026/10/02/2026-retrocomputing-challenge-lunar-lander-on-the-pdp-1/\">&#8230;read more<\/a>"}, {"title": "UUNA TEK iAuto review – A professional handwriting and drawing machine", "source": "CNX Software", "date": "2026-10-03", "url": "https://www.cnx-software.com/2026/10/03/uuna-tek-iauto-review-a-professional-handwriting-and-drawing-machine/", "summary": "<div><img alt=\"uuna tek iauto review\" class=\"attachment-medium size-medium wp-post-image\" height=\"405\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/09/uunatekiauto_00_coveri_mage-720x405.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Hello, today I am going to review the UUNA TEK iAuto, an automatic handwriting machine designed to reproduce physical handwriting using a real pen on real paper. It also supports wireless connectivity, spreadsheet-based mail merge, custom fonts, and font variation features that can make the writing look more natural. The machine can handle paper sizes up to A3 and supports pens with a diameter of up to 18 mm. The UUNA TEK iAuto works with the manufacturer’s free iAuto software, which is available for Windows on both x64 and Arm-based systems, as well as for macOS on Apple M1, M2, M3, and Intel-based Macs. Most of the following review focuses on the machine’s writing capabilities, including tests with text, SVG graphics, different writing speeds, various pens, and different paper types. Unboxing The parcel was shipped from China by land transportation and took around six days to arrive at my office [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/10/03/uuna-tek-iauto-review-a-professional-handwriting-and-drawing-machine/\">UUNA TEK iAuto review &#8211; A professional handwriting and drawing machine<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Electronic Busy Board is Fun for Kids and Hackers", "source": "Hackaday", "date": "2026-10-02", "url": "https://hackaday.com/2026/10/02/electronic-busy-board-is-fun-for-kids-and-hackers/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"577\" src=\"https://hackaday.com/wp-content/uploads/2026/10/busyboard_feat.jpg?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>While you may not be familiar with the term &#8220;busy board&#8221;, you&#8217;ve almost certainly seen one. It&#8217;s the sort of toy with a bunch of buttons, switches, and of course <a class=\"read-more\" href=\"https://hackaday.com/2026/10/02/electronic-busy-board-is-fun-for-kids-and-hackers/\">&#8230;read more<\/a>"}, {"title": "2026 Retrocomputing Challenge: A Homebrew Computer In Only Three ICs", "source": "Hackaday", "date": "2026-10-02", "url": "https://hackaday.com/2026/10/02/2026-retrocomputing-challenge-a-homebrew-computer-in-only-three-ics2026-retrocomputing-challenge-a-homebrew-computer-in-only-3-ics/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"450\" src=\"https://hackaday.com/wp-content/uploads/2026/10/68k-MBC-feat.jpg?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>Homebrew computers don&#8217;t have to be retrocomputers, but [Just4Fun]&#8217;s all-through-hole, 68008-based &#8220;68k-MBC&#8221; certainly qualifies, so it is a worthy entry in our ongoing contest. While there are both &#8220;full&#8221; and <a class=\"read-more\" href=\"https://hackaday.com/2026/10/02/2026-retrocomputing-challenge-a-homebrew-computer-in-only-three-ics2026-retrocomputing-challenge-a-homebrew-computer-in-only-3-ics/\">&#8230;read more<\/a>"}, {"title": "Hackaday Podcast Episode 389:  Spinning Lightfield Displays, and Jenny Visits a Blast Furnace", "source": "Hackaday", "date": "2026-10-02", "url": "https://hackaday.com/2026/10/02/hackaday-podcast-episode-389-spinning-lightfield-displays-and-jenny-visits-a-blast-furnace/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"484\" src=\"https://hackaday.com/wp-content/uploads/2016/05/microphone.jpg?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>Another all-European podcast for you this week, as Elliot Williams is joined by Jenny List for an evening looking at the past week in Hackaday. And this week there is <a class=\"read-more\" href=\"https://hackaday.com/2026/10/02/hackaday-podcast-episode-389-spinning-lightfield-displays-and-jenny-visits-a-blast-furnace/\">&#8230;read more<\/a>"}, {"title": "Using Vibration to Make Stuff Stick Contact-Free to Ceilings", "source": "Hackaday", "date": "2026-10-02", "url": "https://hackaday.com/2026/10/02/using-vibration-to-make-stuff-stick-contact-free-to-ceilings/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"440\" src=\"https://hackaday.com/wp-content/uploads/2026/10/vibrational_suction_playing_card_steve_mould_youtube.jpg?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>Generally making stuff stick to something like a ceiling requires resorting to suction cups, glue or something much more permanent, but [Steve Mould] starts his video featuring a playing card <a class=\"read-more\" href=\"https://hackaday.com/2026/10/02/using-vibration-to-make-stuff-stick-contact-free-to-ceilings/\">&#8230;read more<\/a>"}, {"title": "This Week in Security: ShinyHunters Won’t Dox the FBI, Pentagon Data Stolen, and OBS Vulnerable", "source": "Hackaday", "date": "2026-10-02", "url": "https://hackaday.com/2026/10/02/this-week-in-security-shinyhunters-wont-dox-the-fbi-pentagon-data-stolen-and-obs-vulnerable/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"484\" src=\"https://hackaday.com/wp-content/uploads/2016/01/darkarts.jpg?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>404 Media reports that the ShinyHunters group who stole multiple terabytes of FBI employee data say they do not plan to release the data. Known for ransomware and extortion of <a class=\"read-more\" href=\"https://hackaday.com/2026/10/02/this-week-in-security-shinyhunters-wont-dox-the-fbi-pentagon-data-stolen-and-obs-vulnerable/\">&#8230;read more<\/a>"}, {"title": "UP Xtreme PTL Edge Air Panther Lake Mini PC gets AirJet solid-state active cooling solution", "source": "CNX Software", "date": "2026-10-02", "url": "https://www.cnx-software.com/2026/10/02/up-xtreme-ptl-edge-air-panther-lake-mini-pc-gets-airjet-solid-state-active-cooling-solution/", "summary": "<div><img alt=\"UP Xtreme PTL Edge Air\" class=\"attachment-medium size-medium wp-post-image\" height=\"374\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/10/UP-Xtreme-PTL-Edge-Air-720x374.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>AAEON has introduced a new version of its UP Xtreme PTL Edge Panther Lake mini PC with the &#8220;Air&#8221; variant featuring Frore Systems AirJet solid-state active cooling solution. The company says the AirJet passive cooling technology makes the Panther Lake mini PC 35% thinner, 43% lighter, and capable of operating silently at under 21 dBA. This is mostly achieved by removing the thick (and heavy) heatsink found on the original design. The mini PC still benefits from up to an Intel Core Ultra X7 358H with 180 TOPS of AI performance, a 40-pin GPIO header, two RS-232/422/485 COM ports, and a wide 19 to 36V DC input range. UP Xtreme PTL Edge Air specifications: Intel Core Ultra Series 3 Panther Lake SoC (one or the other) Intel Core Ultra X7 Processor 358H CPU &#8211; 16-core (4P + 8E + 4LPE) @ 1.9/1.5/1.5 GHz Base frequency, 4.8/3.5/3.5 GHz Turbo frequency Cache [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/10/02/up-xtreme-ptl-edge-air-panther-lake-mini-pc-gets-airjet-solid-state-active-cooling-solution/\">UP Xtreme PTL Edge Air Panther Lake Mini PC gets AirJet solid-state active cooling solution<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Avaota F2 – Allwinner V861 RISC-V SBC targets AI cameras with PTZ and audio support", "source": "CNX Software", "date": "2026-10-02", "url": "https://www.cnx-software.com/2026/10/02/avaota-f2-allwinner-v861-risc-v-sbc-targets-ai-cameras-with-ptz-and-audio-support/", "summary": "<div><img alt=\"Avaota F2 SBC\" class=\"attachment-medium size-medium wp-post-image\" height=\"572\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/03/Avaota-F2-SBC-720x572.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Avaota F2 is the first SBC based on an Allwinner V861 dual-core 64-bit RISC-V SoC with 128MB on-chip DDR3 memory, support for 4K cameras, H.265 video codec, and a 1 TOPS AI accelerator. It&#8217;s an update to the earlier Avaota F1 camera board based on an Allwinner V821 SoC. The new open-source hardware F2 SBC offers several benefits, including support for both Full HD and 4K camera sensors, motor control for the PTZ (Pan-Tilt-Zoom) feature, and improved audio support through speaker (one) and microphone (two) connectors. However, the F1 also included WiFi, which the Avaota F2 lacks. Avaota F2 specifications: SoC – Allwinner V861M2-XXX CPU Dual-Core RISC-V XuanTie C907 (RV64GCBV/RV32GGCBV) clocked up to 1.4GHz with RVV 1.0 extensions Single-core RISC-V XuanTie E907 (RV32IMAFC) clocked up to 800MHz VPU Video Encoder H.264/H.265 up to  4K @ 25fps (M)JPEG post <a href=\"https://www.cnx-software.com/2026/10/02/asrock-industrial-nuc-300-series-intel-core-3-304-core-5-320-mini-pcs-and-motherboards/\">ASRock Industrial NUC 300 series &#8211; Intel Core 3 304/Core 5 320 mini PCs and motherboards<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "EU CRA for Embedded Developers: Secure-by-Design, Redesign Vs. Bolt-On Security, and Compliance Evidence: Embedded Week Insights", "source": "Embedded.com", "date": "2026-10-02", "url": "https://www.embedded.com/eu-cra-for-embedded-developers-secure-by-design-redesign-vs-bolt-on-security-and-compliance-evidence-embedded-week-insights/", "summary": "<p>Here's a roundup of this week's must-read articles. We dive deep into the latest on the EU Cyber Resilience Act for embedded developers: secure-by-design, redesign versus bolt-on security, and compliance evidence. We also look into the latest developments in edge AI systems for robotics, advances in MATLAB and Simulink software environments, and more. Also, check News [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/eu-cra-for-embedded-developers-secure-by-design-redesign-vs-bolt-on-security-and-compliance-evidence-embedded-week-insights/\">EU CRA for Embedded Developers: Secure-by-Design, Redesign Vs. Bolt-On Security, and Compliance Evidence: Embedded Week Insights<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "Local PCB Prototyping Cuts Delays and Speeds Iterations", "source": "Embedded.com", "date": "2026-10-02", "url": "https://www.embedded.com/local-pcb-prototyping-cuts-delays-and-speeds-iterations/", "summary": "<p>Local partners make it easier to align on requirements fast, handle revisions quickly, and validate complex boards with real-time collaboration.<\/p>\n<p>The post <a href=\"https://www.embedded.com/local-pcb-prototyping-cuts-delays-and-speeds-iterations/\">Local PCB Prototyping Cuts Delays and Speeds Iterations<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "Most Read – VersaBeam Mini, Micron booming, TSMC fabs", "source": "Electronics Weekly", "date": "2026-10-02", "url": "https://www.electronicsweekly.com/blogs/electro-ramblings/latest-news/most-read-versabeam-mini-micron-booming-tsmc-fabs-2026-10/", "summary": "<p>The most popular ones on the site include Micron having a $54bn revenue quarter, Anthropic revealing the biggest pre-IPO loss in history and TSMC looking to build six fabs in Texas...<\/p>\n<p>The post <a href=\"https://www.electronicsweekly.com/blogs/electro-ramblings/latest-news/most-read-versabeam-mini-micron-booming-tsmc-fabs-2026-10/\">Most Read &#8211; VersaBeam Mini, Micron booming, TSMC fabs<\/a> appeared first on <a href=\"https://www.electronicsweekly.com\">Electronics Weekly<\/a>.<\/p>"}, {"title": "TDK DC-link film capacitors rated for up to +135 °C", "source": "Electronics Weekly", "date": "2026-10-02", "url": "https://www.electronicsweekly.com/news/products/passives/dc-link-film-capacitors-rated-for-up-to-135-c-2026-10/", "summary": "<p>TDK is introducing its B3272*A/G/T series of DC-link film capacitors that are qualified for continuous operation at case temperatures of up to +135 °C, with no derating required up to [&#8230;]<\/p>\n<p>The post <a href=\"https://www.electronicsweekly.com/news/products/passives/dc-link-film-capacitors-rated-for-up-to-135-c-2026-10/\">TDK DC-link film capacitors rated for up to +135 °C<\/a> appeared first on <a href=\"https://www.electronicsweekly.com\">Electronics Weekly<\/a>.<\/p>"}, {"title": "US Chip Dominance Will Disappear", "source": "Electronics Weekly", "date": "2026-10-02", "url": "https://www.electronicsweekly.com/blogs/mannerisms/yarns/us-chip-dominance-will-disappear-2026-10/", "summary": "<p>The renowned UK semiconductor expert, Dr Ian Mackintosh, argued in his keynote address at the 1978 International Solid State Circuits Conference in San Francisco, that much of America’s dominance in [&#8230;]<\/p>\n<p>The post <a href=\"https://www.electronicsweekly.com/blogs/mannerisms/yarns/us-chip-dominance-will-disappear-2026-10/\">US Chip Dominance Will Disappear<\/a> appeared first on <a href=\"https://www.electronicsweekly.com\">Electronics Weekly<\/a>.<\/p>"}, {"title": "SLG46801 ultra-Compact GreenPAK IC offers multi-time programmability", "source": "Electronics Weekly", "date": "2026-10-02", "url": "https://www.electronicsweekly.com/news/products/analogue-linear-mixed-signal-ics/slg46801-ultra-compact-greenpak-ic-offers-multi-time-programmability-2026-10/", "summary": "<p>Renesas Electronics is sampling the SLG46801, its smallest GreenPAK configurable mixed-signal device. The 9-ball device combines an ultra-small footprint with multi-time programmability, highlights Renesas. It is aimed at compact products [&#8230;]<\/p>\n<p>The post <a href=\"https://www.electronicsweekly.com/news/products/analogue-linear-mixed-signal-ics/slg46801-ultra-compact-greenpak-ic-offers-multi-time-programmability-2026-10/\">SLG46801 ultra-Compact GreenPAK IC offers multi-time programmability<\/a> appeared first on <a href=\"https://www.electronicsweekly.com\">Electronics Weekly<\/a>.<\/p>"}, {"title": "OpenWorks eyes US market for AI-powered autonomous vision systems", "source": "Electronics Weekly", "date": "2026-10-02", "url": "https://www.electronicsweekly.com/news/business/openworks-eyes-us-market-for-ai-powered-autonomous-vision-systems-2026-10/", "summary": "<p>Northumberland’s OpenWorks Engineering, a UK defence technology company, has announced its expansion into the US market. Specifically it is opening a US regional headquarters in Ashburn, Virginia. And future plans [&#8230;]<\/p>\n<p>The post <a href=\"https://www.electronicsweekly.com/news/business/openworks-eyes-us-market-for-ai-powered-autonomous-vision-systems-2026-10/\">OpenWorks eyes US market for AI-powered autonomous vision systems<\/a> appeared first on <a href=\"https://www.electronicsweekly.com\">Electronics Weekly<\/a>.<\/p>"}, {"title": "Synopsys and OpenAI to teach AI models to use EDA tools", "source": "Electronics Weekly", "date": "2026-10-02", "url": "https://www.electronicsweekly.com/news/business/synopsis-and-openai-to-automate-chip-design-2026-10/", "summary": "<p>Synopsys and OpenAI are to jointly develop GPT-Synopsys, a specialised model, optimised to use Synopsys EDA tools to perform semiconductor design workflows. The agreement includes a revenue sharing arrangement and [&#8230;]<\/p>\n<p>The post <a href=\"https://www.electronicsweekly.com/news/business/synopsis-and-openai-to-automate-chip-design-2026-10/\">Synopsys and OpenAI to teach AI models to use EDA tools<\/a> appeared first on <a href=\"https://www.electronicsweekly.com\">Electronics Weekly<\/a>.<\/p>"}, {"title": "NeuroIGNITOR enables design and test stimulation paradigms in living tissue", "source": "Electronics Weekly", "date": "2026-10-02", "url": "https://www.electronicsweekly.com/news/business/neuroignitor-enables-researchers-to-design-and-test-stimulation-paradigms-in-living-tissue-2026-10/", "summary": "<p>Imec’a NeuroIGNITOR platform enables neuromodulation researchers and device developers to design and test stimulation paradigms directly in living tissue. It is a selective, bidirectional system that drastically reduces off-target effects [&#8230;]<\/p>\n<p>The post <a href=\"https://www.electronicsweekly.com/news/business/neuroignitor-enables-researchers-to-design-and-test-stimulation-paradigms-in-living-tissue-2026-10/\">NeuroIGNITOR enables design and test stimulation paradigms in living tissue<\/a> appeared first on <a href=\"https://www.electronicsweekly.com\">Electronics Weekly<\/a>.<\/p>"}, {"title": "H1 sales of petrol cars less than 50% of market for first time", "source": "Electronics Weekly", "date": "2026-10-02", "url": "https://www.electronicsweekly.com/news/business/h1-sales-of-petrol-cars-less-than-50-of-market-for-first-time-2026-10/", "summary": "<p>In H1, for the first time, petrol cars took  less than 50% of global new-vehicle sales, says Mobility Global. Sales of petrol-engine vehicles fell 10% on the year to 20.25 [&#8230;]<\/p>\n<p>The post <a href=\"https://www.electronicsweekly.com/news/business/h1-sales-of-petrol-cars-less-than-50-of-market-for-first-time-2026-10/\">H1 sales of petrol cars less than 50% of market for first time<\/a> appeared first on <a href=\"https://www.electronicsweekly.com\">Electronics Weekly<\/a>.<\/p>"}, {"title": "SpaceX gives Filtronic its largest-ever order", "source": "Electronics Weekly", "date": "2026-10-02", "url": "https://www.electronicsweekly.com/news/filtronic-gets-largest-ever-order-2026-10/", "summary": "<p>Filtronic has secured its largest ever single order -worth $68.1 million &#8211; to supply parts for Starlink. The order is for Filtronic’s Cerus, E-Band GaN Solid State Power Amplifier (SSPA) [&#8230;]<\/p>\n<p>The post <a href=\"https://www.electronicsweekly.com/news/filtronic-gets-largest-ever-order-2026-10/\">SpaceX gives Filtronic its largest-ever order<\/a> appeared first on <a href=\"https://www.electronicsweekly.com\">Electronics Weekly<\/a>.<\/p>"}, {"title": "Mini-D RF interconnects for board-to-board RF applications", "source": "Electronics Weekly", "date": "2026-10-02", "url": "https://www.electronicsweekly.com/news/products/rf-microwave-optoelectronics/smpm-mini-d-rf-interconnects-for-board-to-board-rf-applications-2026-10/", "summary": "<p>SV Microwave has introduced SMPM Mini-D RF Interconnects for board-to-board RF applications. The space-saving D-sub form factor delivers RF performance in a compact  package. The Interconnects have an  SMPM interface, [&#8230;]<\/p>\n<p>The post <a href=\"https://www.electronicsweekly.com/news/products/rf-microwave-optoelectronics/smpm-mini-d-rf-interconnects-for-board-to-board-rf-applications-2026-10/\">Mini-D RF interconnects for board-to-board RF applications<\/a> appeared first on <a href=\"https://www.electronicsweekly.com\">Electronics Weekly<\/a>.<\/p>"}, {"title": "HalloWing M4 Tombstone", "source": "Adafruit", "date": "2026-10-02", "url": "https://blog.adafruit.com/2026/10/02/hallowing-m4-tombstone-2/", "summary": "Build a 3D printed light up tombstone with an animated eye! Use the HalloWing M4 and NeoPixels to make a backlit sign with a custom message or spooky face! Check out the guide from the Ruiz Brothers and build your own this #ElectronicHalloween!"}, {"title": "NEW GUIDE: CircuitPython Turbo Sushi Conveyor Belt #AdafruitLearningSystem @Adafruit", "source": "Adafruit", "date": "2026-10-02", "url": "https://blog.adafruit.com/2026/10/02/new-guide-circuitpython-turbo-sushi-conveyor-belt-adafruitlearningsystem-adafruit/", "summary": "Back when the Qualia S3 was first released I wanted to run the sushi conveyor belt animation on one of the long bar displays. I tried the project in CircuitPython, but it was way too slow so I had to use Arduino with PlatformIO. Much like Jiro, I never stopped dreaming of sushi and hoped [&#8230;]"}, {"title": "FltCast: LED Matrix Flight Tracker with RTL-SDR and Antenna #piday #raspberrypi", "source": "Adafruit", "date": "2026-10-02", "url": "https://blog.adafruit.com/2026/10/02/fltcast-led-matrix-flight-tracker-with-rtl-sdr-and-antenna-piday-raspberrypi/", "summary": "&#160; A lot of the Raspberry Pi flight trackers we see rely on an API like OpenSky, but this tracker from bytecadia gets the data directly from passing aircraft. They use an RTL-SDR and Antenna and house it all in a 3D Printed case, the flights are then displayed on a 64&#215;32 LED matrix. More [&#8230;]"}, {"title": "The Python on Microcontrollers Newsletter: subscribe for free", "source": "Adafruit", "date": "2026-10-02", "url": "https://blog.adafruit.com/2026/10/02/the-python-on-microcontrollers-newsletter-subscribe-for-free-10-2/", "summary": "The Python for Microcontrollers Newsletter is the place for the latest news in
