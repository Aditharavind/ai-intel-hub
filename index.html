ity that any other connected node can.<\/p><p class=\"pull-quote\">The history of computing is a history of interface revolutions. The next transition is not about a new screen or a new microphone — it is about treating the human body itself as a participant in the computing network.<\/p><p>This path is not a competitor to the work being done on humanoid robots, foundation models for embodied AI, and dexterous manipulation. It is the missing complement to that work. The hardest open problem for humanoid systems is the data: every natural interaction between a human and the physical world is a potential training signal, and most of those interactions are currently invisible to any computing system. As more humans become first-class nodes in the loop, those interactions become observable, structured, and ultimately useful for training the next generation of embodied AI, including the humanoid robots being developed today.<\/p><p>In other words: putting the human back into the computing loop is not just about better interfaces for individual users. It is about generating the kind of grounded, in-the-wild human-machine interaction data that the broader Physical AI ecosystem will need to keep advancing. The robot side and the human side of the loop are not two competing futures. They are two halves of the same one.<\/p><p>That is what Wetour Robotics means when it says: <em>Your body is the interface.<\/em><\/p><p>Learn more at <a href=\"https://wetourrobotics.com/\" target=\"_blank\">wetourrobotics.com<\/a>.<\/p>"}, {"title": "Will Robotics Have a ChatGPT Moment?", "source": "IEEE Spectrum Robotics", "date": "2026-05-20", "url": "https://spectrum.ieee.org/robotics-ai-breakthrough", "summary": "<img src=\"https://spectrum.ieee.org/media-library/a-collection-of-5-robots-against-colored-backgrounds.jpg?id=66734221&amp;width=1245&amp;height=700&amp;coordinates=0%2C88%2C0%2C88\" /><br /><br /><p>Over the next few decades, billions of autonomous, AI-powered robots will work alongside people in factories, perform tedious tasks in warehouses, care for the elderly, <a href=\"https://spectrum.ieee.org/collections/darpa-subterranean-challenge/\" target=\"_blank\">assist in unsafe disaster areas<\/a>, deliver packages and food to our doorsteps, and eventually help out in our homes. Some will look like us, and many won’t. What is certain is that regardless of form factor, robots will all rely heavily on AI in order to deliver real-world value.<\/p><div class=\"rm-embed embed-media\"><\/div><p><span>In 2025, total investments in robotics companies reached <\/span><a href=\"https://www.cbinsights.com/research/report/venture-trends-2025/\" target=\"_blank\">a record US $40.7 billion, accounting for 9 percent of all venture funding<\/a><span>. The multibillion dollar question therefore is this: What will it take for AI-powered robots to begin to have a serious economic impact? Many of today’s robotics and AI companies are making bold claims, such as that humanoid robots will <\/span><a href=\"https://www.1x.tech/\" target=\"_blank\">soon be coming into our homes<\/a><span>, but there’s still a big gap between promise and reality.<\/span><\/p><p><span><\/span><span>The promise of robots that live and work alongside us has been the stuff of science fiction for a very long time. And while many programmers have tried to make that promise a reality, the physical world is just too complicated for traditional computer programs to handle the endless complexity it presents. Thanks to AI, robots are no longer being programmed—instead, they learn to operate in the real world. With enough practice, they can learn to perceive and understand the world around them, reason about that world, and use that reason and understanding to perform tasks that are useful, reliable, and safe.<\/span><\/p><p>The two of us have worked at the forefront of AI and robotics for the last decade, as a <a href=\"https://engineering.oregonstate.edu/people/jonathan-hurst\" target=\"_blank\">Professor in Robotics at Oregon State University<\/a> and <a href=\"https://www.agilityrobotics.com/about/leadership\" target=\"_blank\">Co-Founder of Agility Robotics<\/a>, and as <a href=\"https://www.linkedin.com/in/hanspeter/\" rel=\"noopener noreferrer\" target=\"_blank\">former CEO<\/a> of the <a href=\"https://everydayrobots.ai/\" rel=\"noopener noreferrer\" target=\"_blank\">Everyday Robots moonshot at Google X<\/a>. Our experience deploying AI-powered robots in real-world settings has given us a perspective on where AI can be used to great benefit in complex robotic systems in the near term and where we are still on the frontier of science fiction. We believe AI will enable an inflection point in robotics advances, but that it will be through the well-engineered application of coordinated systems of different AI tools rather than a single ChatGPT-style breakthrough.<\/p><p>As the excitement around AI is matched only by the uncertainty of what will be possible, here are five hard truths that will define AI in robotics.<\/p><h2>1. The YouTube-to-Reality Gap Is Real<\/h2><p>For years, we have been seeing videos on YouTube with humanoid robots performing amazing moves on everything from a dance floor to an obstacle course. The inside knowledge in robotics is to “never trust a YouTube robot video.” The gap between real robots that can perform real work in unstructured human environments and carefully scripted and edited robot performances remains significant. The latest performance to get a lot of attention was a <a href=\"https://www.youtube.com/watch?v=mUmlv814aJo\" rel=\"noopener noreferrer\" target=\"_blank\">martial arts show<\/a> featuring Unitree humanoid robots performing with children at the Chinese 2026 Spring Festival Gala. While impressive, this falls into a long lineage of tightly scripted robotic performances, where everything has been carefully choreographed and planned in advance. The low-level controls, synchronization, and choreography were stunning, yet the Spring Gala robot performance showed a level of autonomy and intelligence much closer to industrial robots building cars in a factory than something that will show up in your living room any time soon. <\/p><p class=\"shortcode-media shortcode-media-youtube\"> <span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span> <\/p><p><span>Seeing these kinds of demos nevertheless raises questions about where robotics really is. If robots can perform kung fu moves and do backflips and dance, why aren’t they also showing up on factory floors yet? And why can’t they do the dishes in my home after dinner? The simple answer is this: Making AI-powered robots capable of performing general tasks in varied human environments is still <\/span><em><em>really<\/em><\/em><span> hard. While impressive technological feats like those at the Spring Festival may make it look like we could be very close, the use of AI in these demos is only for low-level motor control (to keep the robots from falling over) and therefore is only a small part of the solution for robots to be general purpose in the real, unstructured spaces where we humans live and work.<\/span><\/p><h2>2. Data Is An Unsolved Challenge<\/h2><p>Large Language Models (LLMs) like OpenAI’s ChatGPT and Anthropic’s Claude were initially trained on an internet-scale database of text. The world woke up one day in late 2022 to ChatGPT demonstrating that AI computers could suddenly “speak” to us in prose or verse and about seemingly any topic. LLMs have turned out to generalize well and are now able to take multimodal input (text, images, video) and produce multimodal output. Importantly, the corpus of training data was both enormous and human-generated, which are characteristics that form the gold standard for AI training.<\/p><p class=\"shortcode-media shortcode-media-rebelmouse-image rm-float-left rm-resized-container rm-resized-container-25\" style=\"float: left;\"> <img alt=\"A series of four images, including robots working in a contained factory space, in an open indoor factory, outdoors in the real world delivering a package, and working with a human to move a couch in an apartment.\" class=\"rm-shortcode\" id=\"a0903\" src=\"https://spectrum.ieee.org/media-library/a-series-of-four-images-including-robots-working-in-a-contained-factory-space-in-an-open-indoor-factory-outdoors-in-the-real.jpg?id=66734272&amp;width=980\" /> <small class=\"image-media media-caption\">The fastest path to robots as part of everyday life may emerge through a range of robot forms performing increasingly sophisticated applications and employing a range of AI tools.<\/small><small class=\"image-media media-photo-credit\">Agility Robotics<\/small><\/p><p>Giving AI a body (in the form of a robot), so that it can engage with people in the physical world, continues to be a very difficult and broadly unsolved problem. AI models for general-purpose robotics must simultaneously satisfy multiple, often conflicting, physical, geometric, and temporal limitations while operating in unstructured, dynamic environments. In order to generalize, robot models need to be trained on data gathered in a high-dimensional configuration space, where “dimensions” represent text, lighting conditions, degrees of freedom, joint limits, velocities, force, and safety boundaries, just to mention a few. Importantly, this must be <em><em>good<\/em><\/em> data—it must contain many examples from what amounts to an infinite number of possible configurations in the physical world.<\/p><p>Since there are very few existing sources of data like this, approaches like teleoperation, video analysis, motion capture of humans, and self-exploration in simulation and in the real world are all seen as important ways to collect data. It’s a herculean task. For example, at Everyday Robots at Google X, we ran 240 million robot instances in our simulator over the course of 2022 to collect training data, mostly to train a trash-sorting model. Similar amounts of data will be needed for every skill to get to a similar level of capability, which is not yet human level.<\/p><h2>3. There Will Be No Single Robot AI<\/h2><p>We are far away from a moment where a single AI model might allow general-purpose robots to live and work alongside us. <\/p><p>General-purpose robots can have wheels or legs. They can have one, two, three, or more arms. Some have propellers and can fly, while others may be designed to operate under water. Some will drive on busy roads. The physical world is infinitely varied and complex. And then there are all the people and other animals that will be surrounding the robots. How do you train a model to operate a robot safely and reliably in all of these settings? The simple answer is: You don’t. At least not for quite some time.<\/p><p>We believe the winning AI architecture leading to the next big breakthroughs in general-purpose robotics will be “agentic AI” for robots, which are high-level coordinating models that can reason, plan, use tools, and learn from outcomes to execute complex tasks with limited supervision. Agentic, high-level models running on robots will invoke a system of specialized ones for different types of tasks. We will likely soon see multiple robots collaborating and coordinating with each other through their onboard agentic AI models.<\/p><p>AI tools are unlocking new and powerful capabilities in robotics, which in turn will enable new solutions and new markets. It’s encouraging to see these new models being made broadly available, some even as open-source solutions. This availability is akin to what happened with the internet: Real progress occurred when it became ubiquitous. We anticipate an inevitable democratization of complex behaviors in robotics with wide access to these AI tools and technologies.<\/p><h2>4. Hardware Is Still Very Hard<\/h2><p>Robots are complex systems with many parts that all need to work together with great precision. For a robot to be useful and safe, every part of it must be coordinated, from its perception systems to the computer controlling it, all the way down to its individual actuators.<\/p><p>Actuators—that is, the motors and gears—are a good example of an important part of the robot where what got us here won’t get us there. The actuators used at scale by most industrial robots will not work for robots that will operate in human environments. If these robots accidentally collide with an obstacle, the resulting impacts are harsh, forces are high, and things break. Humans don’t move in this way. We are far more compliant in how we interact with the world, and we’re constantly making contact with our environment and using that contact to help us accomplish things. <\/p><p>Consider the challenge of inserting a key in a lock: Humans typically don’t do this by aligning the key perfectly with the keyhole. Instead, we just feel for the edge of the keyhole and jiggle the key in. Robots need to be able to operate in novel ways to achieve comparable capabilities by using a new class of actuators that are sensitive to force and able to have a compliant interaction with the environment. While these kinds of actuators do exist, they are not yet generally available at scale for robot systems designed to operate around people.<\/p><h2>5. Real Value Comes From “Easy” Tasks<\/h2><p>There’s a big difference between tasks that look impressive and real-world tasks that provide value. Robotics is a perfect example of <a href=\"https://en.wikipedia.org/wiki/Moravec%27s_paradox\" target=\"_blank\">Moravec’s paradox<\/a>, which states that tasks that are hard for humans are easy for computers (like multiplying two big numbers), and tasks easy for humans (like a toddler’s movements) are extremely difficult for computers and robots.<\/p><p>Serving customers is an unforgiving reality check, because customers only care about solving the real problems they have. If we are to deploy AI-based robot solutions, they must outperform the way things are currently done while demonstrating reliable performance metrics and safety. Agility Robotics’ early work to deploy our humanoid robot Digit in customer locations led to the realization that our first obstacle was safety: Robots that balance and manipulate objects in human spaces bring new types of risk to the workplace. In the first <a href=\"https://www.youtube.com/watch?v=AJpTpUqjgrY\" target=\"_blank\">humanoid deployments<\/a>, physical barriers were necessary, and Agility kicked off a multi-year engineering effort to solve the safety challenge, touching nearly every aspect of robot design and relying heavily on new AI-based approaches to human detection and behavior control.<\/p><p class=\"shortcode-media shortcode-media-youtube\"> <span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span> <\/p><p><a href=\"https://everydayrobots.ai/vision\" target=\"_blank\">Everyday Robots<\/a> at Google deployed robots in 2019 that worked autonomously in office buildings doing chores like cleaning cafe tables and sorting trash. We quickly learned how “messy” and difficult the real world is for a robot. This experience informed the architecture and deployment of our AI systems while also gathering real-world data that could be combined with simulation data for training and improving models.<\/p><p>This focus on creating a product to meet specific customer needs and deploying robots in real-world settings is the only way to inform the structure of the AI tools and infrastructure for near-term utility on a path towards long-term broader capability and generality. There will be no “aha” moment, no silver bullet algorithm, and no volume of data sufficient to produce a general-purpose robot without extensive real-world experience. <\/p><h2>AI Robots Are Coming, One Step at a Time<\/h2>As we look to the future, there is no doubt that the world is bringing AI into the physical world through robots. We are at the beginning of a “<a href=\"https://spectrum.ieee.org/is-a-cambrian-explosion-coming-for-robotics\" target=\"_self\">Cambrian explosion<\/a>“ of useful, intelligent machines. We believe AI is not one tool, but a huge frontier of technical approaches that is unlocking new capabilities so powerful, they will define our economy moving forward. This will happen not in one single definitive moment, but as an ongoing set of small and large breakthroughs, where AI-driven robots begin to provide real value in a few tasks, and then a few more, with impacts unfolding across numerous $100 billion-plus markets that will dramatically improve the quality of our lives."}], "roboticsNews": [{"title": "Agility and GXO Logistics plan expanded deployment of Digit humanoid", "source": "Robotics Business Review", "date": "2026-10-26", "url": "https://www.therobotreport.com/agility-gxo-logistics-plan-expanded-deployment-digit-humanoid/", "summary": "<p>GXO Logistics, which has tested humanoid robots from multiple companies, will deploy Agility's Digit at two more sites.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/agility-gxo-logistics-plan-expanded-deployment-digit-humanoid/\">Agility and GXO Logistics plan expanded deployment of Digit humanoid<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Bedrock Robotics nears $1B in total funding as demand for autonomous heavy equipment surges", "source": "Robotics Business Review", "date": "2026-10-26", "url": "https://www.therobotreport.com/bedrock-robotics-nears-1b-in-total-funding-as-demand-for-autonomous-heavy-equipment-surges/", "summary": "<p>Bedrock Robotics has secured $600 million to scale autonomous heavy equipment and combat construction labor shortages.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/bedrock-robotics-nears-1b-in-total-funding-as-demand-for-autonomous-heavy-equipment-surges/\">Bedrock Robotics nears $1B in total funding as demand for autonomous heavy equipment surges<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "OMRON to acquire OnLogic to address edge AI applications", "source": "Robotics Business Review", "date": "2026-10-26", "url": "https://www.therobotreport.com/omron-acquires-onlogic-address-edge-ai-applications/", "summary": "<p>OMRON will add industrial computing from OnLogic to its industrial automation expertise to serve data- and AI-intensive applications.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/omron-acquires-onlogic-address-edge-ai-applications/\">OMRON to acquire OnLogic to address edge AI applications<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Teradyne Robotics partners with Sereact to scale physical AI in retail and logistics", "source": "Robotics Business Review", "date": "2026-10-25", "url": "https://www.therobotreport.com/teradyne-robotics-partners-sereact-scale-physical-ai-retail-logistics/", "summary": "<p>Sereact and Teradyne have already shipped hundreds of UR robots in dual-arm systems to live customer sites across Europe.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/teradyne-robotics-partners-sereact-scale-physical-ai-retail-logistics/\">Teradyne Robotics partners with Sereact to scale physical AI in retail and logistics<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Eka Robotics raises $150M to scale its vision-force-action model for robots", "source": "Robotics Business Review", "date": "2026-10-24", "url": "https://www.therobotreport.com/eka-robotics-raises-150m-scale-vision-force-action-model-robots/", "summary": "<p>Eka Robotics is building a vision-force-action, or VFA, model to develop an intuition of physics through reinforcement learning at scale.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/eka-robotics-raises-150m-scale-vision-force-action-model-robots/\">Eka Robotics raises $150M to scale its vision-force-action model for robots<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Video Friday: Quadruped Robot Solves Giant Rubik’s Cube by Itself", "source": "IEEE Spectrum Robotics", "date": "2026-10-23", "url": "https://spectrum.ieee.org/video-friday-rubiks-cube-robot", "summary": "<img src=\"https://spectrum.ieee.org/media-library/red-quadruped-robot-facing-a-large-rubik-s-cube-on-an-outdoor-tiled-surface.png?id=68512950&amp;width=1200&amp;height=800&amp;coordinates=150%2C0%2C150%2C0\" /><br /><br /><p><span>Video Friday is your weekly selection of awesome robotics videos, collected by your friends at <\/span><em>IEEE Spectrum<\/em><span> robotics. We also post a weekly calendar of upcoming robotics events for the next few months. Please <\/span><a href=\"mailto:automaton@ieee.org?subject=Robotics%20event%20suggestion%20for%20Video%20Friday\">send us your events<\/a><span> for inclusion.<\/span><\/p><h5><a href=\"https://www.corl.org/\">CoRL 2026<\/a>: 9–12 November 2026, AUSTIN<\/h5><h5><a href=\"https://2026.ieee-humanoids.org/\">Humanoids 2026<\/a>: 6–9 December 2026, SANTA CLARA, CA<\/h5><p>Enjoy today’s videos!<\/p><div class=\"horizontal-rule\"><\/div><div><span style=\"display: none;\"> <\/span><\/div><blockquote class=\"rm-anchors\" id=\"hfdrsfie68c\"><em>A quadruped robot autonomously solves a giant Rubik’s Cube using only its feet.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://leggedrobotics.github.io/rubik-skills/\">ETH Zurich Robotics Systems Lab<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"eg3pd8lgngo\"><em>Humans effortlessly react to the world; they adeptly return a tennis shot, catch a falling cup, step aside from a passing cart, or pass a box tossed during truck unloading. These everyday actions require anticipating a moving target and reflexively responding with the whole body within about a second. Such visual reactive whole-body control remains challenging for humanoids. We present Reflex, a three-stage framework that learns these capabilities stage by stage while connecting them through a compact representation of object dynamics.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://toberj.github.io/reflex/\">Reflex<\/a> ]<\/p><p>Thanks, Weikai!<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"joxrxmlyryo\">I have long advocated for exactly this in the context of <a href=\"https://spectrum.ieee.org/is-there-a-future-for-laundry-folding-robots\" target=\"_blank\">robotic laundry folding<\/a>, or more broadly, other robot recognition and manipulation tasks. Why not make it easy when we can make it easy?<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://programs.sigchi.org/uist/2026/program/content/262871\">ACM SIGCHI<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"zpann8yrli8\">We first wrote about <a href=\"https://spectrum.ieee.org/parallel-systems-autonomous-trains\" target=\"_blank\">Parallel Systems in 2022<\/a>. Nice to see them still rolling.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.moveparallel.com/\">Parallel Systems<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"hbfz2a0dj9s\">I’ll be honest with you: The end of this video is freaking me out a little bit for some reason.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><blockquote><em>This video showcases the whole-body loco-manipulation capabilities of KAIST Humanoid v0.9, developed at the DRCD Lab in collaboration with RAILAB, which developed the robot’s arms. Using onboard visual feedback, the humanoid demonstrates pushing objects weighing up to 35 kilograms and lifting objects up to 20 kg to arrange the letters “KAIST.”<\/em><\/blockquote><p>[ <a href=\"https://www.dynamicrobot.kaist.ac.kr/\">KAIST DRCD Lab<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"ch0divlg64w\">When you don’t spend any money on sensors for your robots, you can afford much bigger wheels.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://railab.kaist.ac.kr/\">RaiLab Kaist<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"uatutxaksa0\">Those robots with wires have gotten somewhat weirder.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://shin0805.github.io/twinx_multi_floating_link/\">JSK Robotics Laboratory<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"pcjjjsxfrba\"><em>The AthenaZero has two, three-fingered robot hands driven by tendons. This design allows the fingers to interdigitate to hold objects of different sizes, such as an egg or a hammer. Each finger is powered by a motor located in the robot’s torso to keep the hand light, transmitting force through flexible cables. This hand is both fast (closing in about 80 milliseconds) and strong.  With the addition of highly accurate barometric pressure sensors, it can also be gentle.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://rai-inst.com/\">Robotics and AI Institute<\/a> ] via [ <a href=\"https://www.science.org/doi/10.1126/scirobotics.aee1868\" target=\"_blank\">Science Robotics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"uwv-5cdqlgg\"><em>A biohybrid robot combines living tissue with engineered materials—here, lab-grown skeletal muscle paired with a soft, 3D-printed scaffold that turns the muscle’s contraction into movement. What if you designed the living muscle and the soft scaffold together, instead of growing the muscle and then building a skeleton around it? In this work from the Soft Robotics Lab at ETH Zurich, we adapted a soft-body simulation framework to co-optimize both at once—and the resulting centimeter-scale bioactuators achieve up to 11x more range of motion than previous systems of comparable tissue volume. Strong enough to jump, swim, walk, and grasp.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://ethz.ch/en/news-and-events/eth-news/news/2026/10/one-small-leap-for-a-muscle-one-giant-step-for-robotics.html\">ETH Zurich Soft Robotics Lab<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"y3zb4o47yqa\">Oh yes, this is definitely the use case that will scale humanoid robots.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.unitree.com/\">Unitree<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"dx8midegpbs\">Here are a couple more teasers from the upcoming ACM Symposium on User Interface Software and Technology (UIST).<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p class=\"shortcode-media shortcode-media-youtube\"> <span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p class=\"shortcode-media shortcode-media-youtube\"> <span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://programs.sigchi.org/uist/2026/program/all\">ACM Symposium on User Interface Software and Technology<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"ibh_mosnele\"><em>In three hours, on a single GPU, SuperMimic surpasses the return of a state-of-the-art motion tracker baseline trained for seven days on 128 GPUs. It reduces GPU-hours by more than 1,000× and fails on only 25 of 129,514 benchmark motions, versus 179 failures for the baseline. After 9.8 hours on two GPUs, SuperMimic achieves zero failures.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://supermimic.github.io/\">Hybrid Robotics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"abq0_jdzfpk\">This is getting out of hand! Now there are two of them!<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><blockquote><em>Introducing the Grain Weevil dual robot attachment. Two robots linked into one larger machine, run by a single operator, doing the work of up to three robots.<\/em><\/blockquote><p>[ <a href=\"https://grainweevil.com/?utm_source=youtube&amp;utm_medium=video&amp;utm_campaign=dual-robot-launch\">Grain Weevil<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"aundvj8lw00\"><em>Today [21 October 2026] <\/em><em>at CES Unveiled Milan, Generative Bionics announced its plan to build Europe’s largest Physical AI Data Factory, with AMD as its AI infrastructure partner.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://news.gbionics.ai/?article=data-factory&amp;lang=en\">Generative Bionics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"zezt6esg9we\"><em>From robotic rovers exploring the rugged lunar landscape to lunar terrain vehicles carrying Artemis astronauts across the surface, mobility will play a crucial role in establishing an enduring human presence on the moon. During the early phases of Moon Base development, these vehicles will help NASA investigate the lunar South Pole region, conduct scientific research, test new technologies, and gather the information that will inform future missions. In this Moon Base update, get a closer look at some of the lunar terrain vehicles and robotic rovers helping to pave the way for humanity’s first lunar outpost. <\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.nasa.gov/missions/moon-base/nasa-provides-progress-update-on-moon-base-rovers/\">NASA<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"ndftcft6xhu\">I appreciate the designer of this single motor drone crediting previous research, which included some cool <a href=\"https://spectrum.ieee.org/flying-robots-stay-stable-with-just-one-motor\" target=\"_blank\">drones from UPenn<\/a> that we wrote about in 2014.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.youtube.com/watch?v=Ndftcft6XhU\">Joshua Bird<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"rsg0vj5agmu\"><em>Why choose a bipedal, human-form robot over specialized wheels, gantry arms, or quadruped platforms? Speaking at the Humanoids Summit Seoul 2026, Michael Perry from Persona AI tackles the single most debated question in the industry and delivers the definitive business and engineering justification for the humanoid form factor.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://humanoidssummit.com/\">Humanoids Summit<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div>"}, {"title": "Webinar to discuss how the FCC robotics ruling affects automation buyers", "source": "Robotics Business Review", "date": "2026-10-23", "url": "https://www.therobotreport.com/webinar-discuss-how-fcc-robotics-ruling-affects-automation-buyers/", "summary": "<p>Industry leaders will discuss what robotics buyers should know about the recent FCC restriction on certain connected systems.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/webinar-discuss-how-fcc-robotics-ruling-affects-automation-buyers/\">Webinar to discuss how the FCC robotics ruling affects automation buyers<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Generative Bionics to launch Physical AI Data Factory in Italy", "source": "Robotics Business Review", "date": "2026-10-23", "url": "https://www.therobotreport.com/generative-bionics-to-launch-physical-ai-data-factory-in-italy/", "summary": "<p>Generative Bionics says it hopes to advance European robotics sovereignty by ensuring that humanoid data is are generated on the continent. <\/p>\n<p>The post <a href=\"https://www.therobotreport.com/generative-bionics-to-launch-physical-ai-data-factory-in-italy/\">Generative Bionics to launch Physical AI Data Factory in Italy<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Dream Labs raises $90M and launches Dream API", "source": "Robotics Business Review", "date": "2026-10-22", "url": "https://www.therobotreport.com/dream-labs-raises-90m-and-launches-dream-api/", "summary": "<p>Dream Labs says its Dream-1 AI model works across robots from different manufacturers and will allow robots to transfer their learning.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/dream-labs-raises-90m-and-launches-dream-api/\">Dream Labs raises $90M and launches Dream API<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "AGCO to deploy Agility Digit humanoid in Kansas factory", "source": "Robotics Business Review", "date": "2026-10-21", "url": "https://www.therobotreport.com/agco-to-deploy-agility-digit-humanoid-in-kansas-factory/", "summary": "<p>The Agility pilot, which is expected to begin in 2027, will begin at an AGCO production facility for agricultural equipment.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/agco-to-deploy-agility-digit-humanoid-in-kansas-factory/\">AGCO to deploy Agility Digit humanoid in Kansas factory<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "A guide to Day 2 of RoboBusiness 2026", "source": "Robotics Business Review", "date": "2026-10-21", "url": "https://www.therobotreport.com/a-guide-to-day-2-of-robobusiness-2026/", "summary": "<p>Day 2 of RoboBusiness 2026, the 20th anniversary of the event, will include interesting keynotes around humanoids and social robots.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/a-guide-to-day-2-of-robobusiness-2026/\">A guide to Day 2 of RoboBusiness 2026<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Avenda Health expands Unfold AI platform to support intraoperative prostate cancer care", "source": "Robotics Business Review", "date": "2026-10-20", "url": "https://www.therobotreport.com/avenda-health-expands-unfold-ai-platform-support-intraoperative-prostate-cancer-care/", "summary": "<p>Surgery Mode in Unfold AI brings patient-specific 3D maps to give an enhanced view of cancer anatomy during robotic prostate procedures.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/avenda-health-expands-unfold-ai-platform-support-intraoperative-prostate-cancer-care/\">Avenda Health expands Unfold AI platform to support intraoperative prostate cancer care<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "A guide to Day 1 of RoboBusiness 2026", "source": "Robotics Business Review", "date": "2026-10-20", "url": "https://www.therobotreport.com/a-guide-to-day-1-of-robobusiness-2026/", "summary": "<p>We've compiled a schedule for everything happening on the first day of RoboBusiness 2026 in Santa Clara, Calif.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/a-guide-to-day-1-of-robobusiness-2026/\">A guide to Day 1 of RoboBusiness 2026<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Gecko Robotics secures $300M contract with the U.S. Navy", "source": "Robotics Business Review", "date": "2026-10-20", "url": "https://www.therobotreport.com/gecko-robotics-earns-300m-contract-with-the-u-s-navy/", "summary": "<p>Gecko claimed this signals the Pentagon’s confidence that it is a core military capability that is delivering results.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/gecko-robotics-earns-300m-contract-with-the-u-s-navy/\">Gecko Robotics secures $300M contract with the U.S. Navy<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "RoboBusiness rebrands as Robotics Summit & Expo West", "source": "Robotics Business Review", "date": "2026-10-20", "url": "https://www.therobotreport.com/robobusiness-rebrands-as-robotics-summit-expo-west/", "summary": "<p>Robotics Summit &#038; Expo West sharpens focus on deploying robotics and AI in the real world, complementing the East Coast flagship event.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/robobusiness-rebrands-as-robotics-summit-expo-west/\">RoboBusiness rebrands as Robotics Summit &#038; Expo West<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "2027 TRR50 Robotics Innovation Awards open nominations", "source": "Robotics Business Review", "date": "2026-10-20", "url": "https://www.therobotreport.com/2027-trr50-robotics-innovation-awards-open-nominations/", "summary": "<p>The TRR50 winners will be celebrated at an awards gala during the Robotics Summit &#038; Expo, which will be held on June 2-3, 2027 in Boston.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/2027-trr50-robotics-innovation-awards-open-nominations/\">2027 TRR50 Robotics Innovation Awards open nominations<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Reservoir launches new agricultural robotics incubator for Washington growers", "source": "Robotics Business Review", "date": "2026-10-20", "url": "https://www.therobotreport.com/reservoir-launches-new-agricultural-robotics-incubator-for-washington-growers/", "summary": "<p>Reservoir hopes to put agricultural robotics startups to work in the orchards, vineyards and berry fields alongside researchers and growers.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/reservoir-launches-new-agricultural-robotics-incubator-for-washington-growers/\">Reservoir launches new agricultural robotics incubator for Washington growers<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "The Robot I Didn’t Expect to Build", "source": "IEEE Spectrum Robotics", "date": "2026-10-19", "url": "https://spectrum.ieee.org/agility-robotics-digit-5-redesign", "summary": "<img src=\"https://spectrum.ieee.org/media-library/author-jonathan-hurst-a-tall-slim-white-man-wearing-a-black-long-sleeve-shirt-and-dark-jeans-stands-next-to-his-digit-5-humano.jpg?id=68441166&amp;width=1200&amp;height=800&amp;coordinates=0%2C1230%2C0%2C1230\" /><br /><br /><p><strong><a href=\"https://www.agilityrobotics.com/\" rel=\"noopener noreferrer\" target=\"_blank\"><span>Agility Robotics<\/span><\/a>, the <\/strong>company I cofounded out of <a href=\"https://mime.engineering.oregonstate.edu/research/drl/\" target=\"_blank\">my robotics lab at Oregon State University<\/a> in 2015, has just launched <a href=\"https://spectrum.ieee.org/humanoid-robot-safety\" target=\"_self\">Digit 5<\/a>. It’s designed to be the first humanoid robot that can safely and economically do useful work at scale, allowing us to bring tens of thousands of humanoid workers into the real world. Engineered to lift 23-kilogram bins onto high shelves and with a battery that can run for 90 minutes on a 9-minute charge, Digit 5’s goal is to handle heavy warehouse tasks shift after shift, filling the need for labor in jobs that are too physically stressful or too dull for humans to want to do.<\/p><div class=\"rm-embed embed-media\"><\/div><p><span>Digit 5 is what Agility has been working toward for over a decade. But the robot is heavy and bulky, lacking the graceful natural motion of its predecessors, and it’s farther than I thought possible from the robot I dreamed of building when I started this company. To deliver a useful commercial product, Agility has taken a path that is very different from what I first imagined.<\/span><\/p><h2>From ATRIAS to Digit<\/h2><p>My dream has always been to build robots that combine locomotion and manipulation to move through the world and interact with it as people do. I seek a mastery of motion, achieved through devices designed to navigate the constraints of physics with elegance. When I started the <a href=\"https://mime.engineering.oregonstate.edu/research/drl/\" target=\"_blank\">Dynamic Robotics Laboratory<\/a> at Oregon State in 2008, we began with a theory derived from decades of work in biomechanics: that a simple “spring-mass” model (a body supported by legs that act like springs) should be able to reproduce every known walking and running gait found in animals.<\/p><p>We put theory into practice by building the bipedal robot <a href=\"https://spectrum.ieee.org/atrias-robot-dodgeball-barrage\" target=\"_self\">ATRIAS<\/a>—short for “Assume The Robot Is A Sphere,” a <a href=\"https://en.wikipedia.org/wiki/Spherical_cow\" target=\"_blank\">joke among physicists<\/a> about reducing a complex system to its simplest possible form. ATRIAS looked like a large microwave on stilts because it was only intended to demonstrate the physics of human walking and running. This was the first glimmer of achieving my dream; even though ATRIAS wasn’t designed to look like us, it still seemed natural, and even somehow alive, when it settled into a walking gait.<\/p><p>With the success of ATRIAS, the barriers to progress shifted from scientific to engineering and organizational, and a startup company seemed like the way to bridge the gap from a one-off research concept to an actual robotic product. I felt confident of two things: that I would be able to build robots that could go where people go, and that this capability would be incredibly useful. This combination of ambition and naivete is necessary for anyone to found a new company—how hard could it be?<\/p><p class=\"shortcode-media shortcode-media-youtube\"> <span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>Good advice for starting a company is to understand a customer problem, and then find a way to solve it using your unique capabilities. My cofounders, <a href=\"https://www.linkedin.com/in/damion-shelton/\" target=\"_blank\">Damion Shelton<\/a> and <a href=\"https://www.linkedin.com/in/mikhail-jones-5674a22b/\" rel=\"noopener noreferrer\" target=\"_blank\">Mikhail Jones<\/a>, and I did not do this. We relied on our belief that this technology would enable new possibilities and trusted ourselves to figure out the business as we went. So we simply focused on building our first product: the bipedal robot <a href=\"https://robotsguide.com/robots/cassie\" rel=\"noopener noreferrer\" target=\"_blank\">Cassie<\/a>.<\/p><p>Cassie was the first dynamic bipedal robot that researchers could buy, able to maintain its balance through active, fluid motion rather than careful, rigid steps. It had ostrichlike legs, not because we were imitating ground-running birds, but as a result of engineering strictly for performance. It was not intended to be commercially useful, and had no torso, arms, or head. We sold Cassie robots to Harvard, Caltech, the University of Michigan, the University of California, Berkeley, and a handful of other research institutions, ultimately saturating the market for US $250,000 bipedal research robots after having sold a total of 10 of them.<\/p><p class=\"shortcode-media shortcode-media-rebelmouse-image\"> <img alt=\"Three bipedal robots lined up in a warehouse, showing their evolving designs.\" class=\"rm-shortcode\" id=\"f749f\" src=\"https://spectrum.ieee.org/media-library/three-bipedal-robots-lined-up-in-a-warehouse-showing-their-evolving-designs.jpg?id=68441028&amp;width=980\" /><small class=\"image-media media-caption\">ATRIAS, Cassie, and Digit 4 EVT [left to right] are on display at Agility Robotics’ RoboFab in Salem, Ore. The 70,000-square-foot facility has the capacity to produce more than 10,000 Digit 5 robots per year.<\/small><small class=\"image-media media-photo-credit\">Agility Robotics<\/small><\/p><p>Because Cassie’s hardware enabled research into the physics of walking and running, the legged-robot research frontier shifted to control software. Traditionally, engineers controlled legged robots with detailed mathematical models that determined how the machines should move. With Cassie, researchers pioneered the new approach of reinforcement learning for bipedal legged locomotion: A simulated robot learns through trial and error, and the resulting neural network controls the physical machine. This approach is what enables virtually all of the dynamic behaviors that you see on legged robots today, and Cassie looked alive as it recovered from stumbles while climbing stairs, ran 5 kilometers across the Oregon State campus, and <a href=\"https://news.oregonstate.edu/news/bipedal-robot-developed-oregon-state-achieves-guinness-world-record-100-meters\" target=\"_blank\">broke the robot world record<\/a> for a 100-meter dash.<\/p><p>Cassie got us closer to being able to move through the world with confidence and grace, but to make it useful, we needed manipulation. After exhaustively exploring different configurations, we found that an upright torso helped the robot balance, while two arms mounted near the top of the torso allowed it to pick up large objects and to catch itself when it fell. <a href=\"https://robotsguide.com/robots/digit\" target=\"_blank\">Digit 1<\/a>, which added a torso and arms to the Cassie legs, was our first mobile manipulation robot, and another step on the path toward a product that could do useful work for commercial customers.<\/p><h2>Why Digit Began With Warehouse Bins<\/h2><p>As we explored the first applications for Digit, potential customers kept asking us: Why legs? And why a humanoid? These were tough questions for me to answer, because they exposed a core business reality: It didn’t matter to Agility Robotics if we solved a cool science problem in a beautiful way. What mattered to the business was solving real problems for customers.<\/p><p class=\"shortcode-media shortcode-media-youtube\"> <span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>After years of engagement with industry partners, we found one answer in warehouses and manufacturing facilities: moving <a href=\"https://spectrum.ieee.org/agility-robotics-digit\" target=\"_self\">bins<\/a>. Bin handling is a clearly defined task where two arms are needed to lift large bins up high and legs are the best way to balance and move in narrow spaces. Because the task can vary widely from one deployment to another, it hasn’t been broadly addressed by single-purpose automation. Yet it was constrained enough to give Digit an economically viable first job while it developed a broader set of skills.<\/p><p>In 2019, Digit began demonstrating its capabilities to do real work. <a href=\"https://spectrum.ieee.org/ford-self-driving-vans-will-use-legged-robots-to-make-deliveries\" target=\"_self\">With Ford Motor Company<\/a>, we showed how Digit 1 could carry packages from an autonomous vehicle to a front porch. We developed Digit 2 and 3 while working with a certain global package delivery company on moving and sorting cardboard boxes. <a href=\"https://spectrum.ieee.org/humanoid-robots\" target=\"_self\">Amazon<\/a> tested Digit 4 on moving and stacking bins, and it became the world’s first commercially deployed humanoid <a href=\"https://www.agilityrobotics.com/content/digit-moves-over-100k-totes\" target=\"_blank\">at the logistics provider GXO<\/a>. In 2024, Digit appeared on the cover of <em><em>Time<\/em><\/em> magazine.<\/p><p class=\"shortcode-media shortcode-media-youtube\"> <span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>Despite Digit’s apparent success, we began to run into conflicts between my dream and the needs of actual customers. We were no longer working with relatively patient university research labs. Agility has to sell robots to survive, and customers will only purchase robots that provide value. If bins weren’t moving, our customers were losing money. We spent a huge amount of time and effort keeping our first deployments operational, which arguably eliminated any profit we made. Yet this also kept our company learning and alive the way no lab demo ever could.<\/p><p>I had no idea how hard it would be, or that running a company would involve so many things that have nothing to do with solving technical problems: deployments across the country; shipping, service, and customer support; fundraising and investor relations; more fundraising; human resources and IT; developing fleet-management software; managing a supply chain; and even more fundraising. I had no experience with any of these things. My career had focused on solving the technical challenges of robots interacting with the world, and it turned out that was only a tiny piece of building a successful robotics company. But Agility was the only path I saw to continuing the technical work and having an impact.<\/p><h2>Turning Digit Into a Product<\/h2><p>I knew that Agility needed to focus more on robots as a product, but I didn’t know how to make that happen. Hiring the people we needed to run the company meant giving up an immense amount of control, but we had no other choice. We recruited a new executive team with the experience required to commercialize this new technology, and they quickly made changes that were both painful and necessary.<\/p><p class=\"shortcode-media shortcode-media-rebelmouse-image\"> <img alt=\"A series of images showing three headless humanoid robots with each one getting somewhat bulkier and less graceful.\" class=\"rm-shortcode\" id=\"1db2c\" src=\"https://spectrum.ieee.org/media-library/a-series-of-images-showing-three-headless-humanoid-robots-with-each-one-getting-somewhat-bulkier-and-less-graceful.jpg?id=68441280&amp;width=980\" /><small class=\"image-media media-caption\">Digit versions 1, 2, and 3 [left to right] show the evolution of the robot from a dynamic walking platform into a useful mobile manipulator. <\/small><small class=\"image-media media-photo-credit\">Agility<\/small><\/p><p>We had intended the next revision of Digit, <a href=\"https://www.youtube.com/watch?v=6x28vlbfA-k\" target=\"_blank\">Digit 4 EVT<\/a> (Engineering Validation and Test), to be a relatively minor upgrade. But Agility’s new leadership insisted that the robot was missing key features that were essential if Digit was going to become a real product. So Digit 4 EVT instead incorporated a series of major changes in a highly compressed timeline, such as larger batteries and system-wide upgrades for safety and regulatory compliance, which added enough mass to dramatically alter the robot’s appearance and capabilities.<\/p><p class=\"shortcode-media shortcode-media-rebelmouse-image rm-float-left rm-resized-container rm-resized-container-25\" style=\"float: left;\"> <img alt=\"A relatively bulky humanoid robot worker with a white head, simple grippers, and reversed legs stands for a portrait looking directly at the camera.\" class=\"rm-shortcode\" id=\"e15b4\" src=\"https://spectrum.ieee.org/media-library/a-relatively-bulky-humanoid-robot-worker-with-a-white-head-simple-grippers-and-reversed-legs-stands-for-a-portrait-looking-dir.jpg?id=68441369&amp;width=980\" /><small class=\"image-media media-caption\">While early Digits were headless, Agility Robotics was able to justify a head for Digit 4 to optimize antenna and camera placement, and it turned out to be surprisingly useful for human-robot interaction.<\/small><small class=\"image-media media-photo-credit\">Christie Hemm Klok<\/small><\/p><p> I could only watch as others brought their own talents to bear to make Digit into a successful product, in gut-wrenching ways that didn’t always align with my vision. There were some especially difficult times when I felt like there were compromises made that didn’t seem necessary, but making those decisions was no longer my sole responsibility. I had to accept that Digit had grown far beyond me, and look for ways of influencing decisions rather than directing them. In the moment, it was incredibly frustrating, as Digit 4 EVT took a few steps backward from my vision of how humanoids should look and move.<\/p><p>Agility is in our name because agility is core to the future of the company. I want Digit to be lithe and graceful. When people see Digit, I want them to like the robot, to understand what it can do at a glance, and to feel that it’s there to help. But with Digit 4 EVT, all of that was sacrificed to functionality, because of course it had to be—the customer just needs the robot to do the work. The design process became a ruthless triage, with aesthetics and elegance of movement being delayed over and over again in favor of brutal functionality. For an engineer whose mind lives more in the future than in the present, it has been hard for me to accept this trajectory. And yet, through Digit 4 EVT’s commercial deployments, we began to really understand specific applications and what they required. We mapped the first 10 use cases Digit would perform, and then began designing Digit 5 from scratch based on everything we had learned.<\/p><h2>Digit 5<\/h2><p>Digit 5 will be Agility’s first real step toward a general-purpose robot. It marks our transition from imagining what a future humanoid robot should be to designing a product around the realities of customer deployments. These realities include things like European CE regulatory compliance, North American UL electrical-safety certifications, and Federal Communications Commission limits for electromagnetic radiation—all of which felt tangential to my dream for Digit, but were absolute requirements.<\/p><p class=\"shortcode-media shortcode-media-rebelmouse-image rm-float-left rm-resized-container rm-resized-container-25\" style=\"float: left;\"> <img alt=\"A strong and bulky humanoid robot with a teal torso and legs, silver arms, and a black head stands with its arms upraised.\" class=\"rm-shortcode\" id=\"6b948\" src=\"https://spectrum.ieee.org/media-library/a-strong-and-bulky-humanoid-robot-with-a-teal-torso-and-legs-silver-arms-and-a-black-head-stands-with-its-arms-upraised.jpg?id=68441384&amp;width=980\" /><small class=\"image-media media-caption\">Digit 5 is designed to be the first humanoid robot that can operate safely next to human coworkers while working 20 hours a day and lifting more than a human can.<\/small><small class=\"image-media media-photo-credit\">Christie Hemm Klok<\/small><\/p><p>Customer requirements helped us realize that safety in particular was one of the most critical barriers to scaling. In Digit 4’s commercial deployments, the robots had to work behind physical barriers, separated from humans at all times, to meet insurance and regulatory demands. This seemed silly to me, because I’ve never felt that our robots were dangerous, but we have to <em><em>prove<\/em><\/em> that they’re safe. And since keeping the robots in safety cages severely limited their usefulness, enabling Digit 5 to operate safely around people became a primary design goal. We spent two years on this challenge.<\/p><p>Digit 5 is designed to be the first humanoid robot that can operate safely next to human coworkers. It will rely on an array of sensors to locate nearby people in a manner that’s certifiably safe, and then take actions based on that information. As a person approaches, Digit 5 is programmed to stop what it’s doing, set down its payload, sit on the floor, and cut power to its motors before the person gets close enough to touch the robot. This conservative approach reduces the risk to nearby people in a verifiable way, and we believe it’s the only approach that makes sense as a first step toward working alongside humans.<\/p><p class=\"shortcode-media shortcode-media-youtube\"> <span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>Yet this strategy also feels like a massive slowdown on the path toward robots becoming part of everyday life. Enabling coexistence with humans has influenced almost every aspect of Digit 5’s design: the shape of the legs and the body, the safety-rated sensors within protective housings, the isolated computers dedicated to safety, and more. All of these features increase the robot’s complexity, power consumption, mass, and physical size.<\/p><p class=\"shortcode-media shortcode-media-rebelmouse-image rm-float-left rm-resized-container rm-resized-container-25\" style=\"float: left;\"> <img alt=\"Turquoise humanoid robot with labeled safety, battery, cooling, and mobility features\" class=\"rm-shortcode\" id=\"62692\" src=\"https://spectrum.ieee.org/media-library/turquoise-humanoid-robot-with-labeled-safety-battery-cooling-and-mobility-features.png?id=68441430&amp;width=980\" /> <small class=\"image-media media-caption\">Digit 5 is Agility’s largest, heaviest, strongest, and most capable humanoid robot worker.<\/small><\/p><p class=\"shortcode-media shortcode-media-rebelmouse-image rm-float-left rm-resized-container rm-resized-container-25\" style=\"float: left;\"> <img alt=\"Turquoise humanoid robot with cameras, swappable grippers, and lifting-optimized legs\" class=\"rm-shortcode\" id=\"ca796\" src=\"https://spectrum.ieee.org/media-library/turquoise-humanoid-robot-with-cameras-swappable-grippers-and-lifting-optimized-legs.png?id=68441429&amp;width=980\" /> <small class=\"image-media media-caption\">The robot’s design was driven by safety, with integrated protection for the robot and for the humans it will work around.<\/small><small class=\"image-media media-photo-credit\">Agility Robotics<\/small><\/p><p>Weighing over 120 kg, Digit 5 is a <em><em>huge<\/em><\/em> robot. It needed to achieve the lifting limits recommended under the U.S. National Institute for Occupational Safety and Health guidelines for human workers, which include repeatedly lifting 23-kg bins and reaching shelves 1.75 meters high. Digit is designed to perform tasks like these for 20 hours a day—something no human can do. This requires motors with enough power and torque to lift the load, but also enough precision to delicately control the force Digit applies when it makes contact with the world. To power those motors, we needed a large battery and a dock for rapid autonomous charging. The dock will deliver 240 amperes at 48 volts, which is enough current to make its thick charging cables visibly wiggle under the induced magnetic forces, while powerful fans blow air through cooling channels in the robot’s torso to keep the battery from overheating. The battery and cooling system takes up about 75 percent of Digit’s torso, but it will allow the robot to operate for 90 minutes and fully recharge during a 9-minute break, enabling near-continuous work.<\/p><p>All of this extra bulk means that Digit 5 can no longer run or jump the way previous generations could, and the svelte form I imagined has become physically impossible. In some ways, Digit 5 feels more like a forklift than the graceful humanoid I set out to build. But looking at the situation rationally, I believe this trade-off is necessary for any company that claims its humanoid can do this kind of work today: If you see a robot that looks like a human working in a factory or warehouse, it either can’t lift the required weight or can’t make it through the whole shift. And if it’s not covered with sensors, it’s likely not safe to stand next to.<\/p><p>The most visible change with Digit 5 is that humanlike legs replace the ostrichlike legs of our earlier versions. While the “backward” leg configuration was <a href=\"https://spectrum.ieee.org/building-robots-that-can-go-where-we-go\" target=\"_self\">optimized for walking and running<\/a>, we discovered that it created <a href=\"https://youtu.be/OBRppKPXKuU?t=79\" rel=\"noopener noreferrer\" target=\"_blank\">problems<\/a> with squatting because the ankle will strike the ground. Digit 5 will spend a lot of time lifting heavy objects from near the floor, so we used a humanoid leg configuration with knee and hip motors that both contribute torque to help the robot stand up again.<\/p><p class=\"shortcode-media shortcode-media-rebelmouse-image rm-float-left rm-resized-container rm-resized-container-25\" style=\"float: left;\"> <img alt=\"Small teal robot sitting on factory floor as a worker walks past in the background\" class=\"rm-shortcode\" id=\"889db\" src=\"https://spectrum.ieee.org/media-library/small-teal-robot-sitting-on-factory-floor-as-a-worker-walks-past-in-the-background.jpg?id=68441553&amp;width=980\" /> <small class=\"image-media media-caption\">When Digit detects an approaching human, the robot will lower itself to the floor and cut power to its motors. Agility believes this is the only near-term approach to verifiably reduce risk when the robot is working near people.<\/small><small class=\"image-media media-photo-credit\">Agility Robotics<\/small><\/p><p>Other companies building humanoid robots have copied the human form without ever understanding its purpose. It’s very frustrating that, to an outside observer, it now looks like we discarded Agility’s distinctive leg design and simply did what everyone else was doing. Yet I know that we arrived at this shape based purely on functional engineering choices. Making a robot look like a human is the easy part—without the function to match, and the understanding of the physics underlying that function, the whole point of the human form may be lost.<\/p><p>With the power, battery life, and safety features that we are designing into Digit 5, we will have a truly useful robot. But it also compromises on some things that are core to my vision and mission. I understand why we made the choices we did and can justify them all, but together they leave me unsatisfied. It’s the curse of the engineer.<\/p><h2>What Comes After Digit 5<\/h2><p>I believe Digit 5 will be the scaling moment for Agility Robotics, the inflection point where we can begin deploying robots in large numbers. While the robot will continue carrying bins, our road map includes many more tasks, from picking individual items and tending machines, to preparing parts for assembly and shipping, and eventually doing assembly work itself. Its interchangeable tool interfaces and modular design will enable us to gradually upgrade its subsystems. It will be a platform for improvement, a source of data for future behavior training, and a viable product all at the same time.<\/p><p class=\"shortcode-media shortcode-media-rebelmouse-image\"> <img alt=\"Author Jonathan Hurst, a tall slim white man wearing a black long sleeve shirt and dark jeans, stands in between a smaller slimmer humanoid robot with a white head and a larger bulkier humanoid robot with a black head.\" class=\"rm-shortcode\" id=\"f53db\" src=\"https://spectrum.ieee.org/media-library/author-jonathan-hurst-a-tall-slim-white-man-wearing-a-black-long-sleeve-shirt-and-dark-jeans-stands-in-between-a-smaller-slimm.jpg?id=68441550&amp;width=980\" /> <small class=\"image-media media-caption\">Hurst stands between the previous version of Digit, Digit 4 EVT [left], and Digit 5.<\/small><small class=\"image-media media-photo-credit\">Christie Hemm Klok<\/small><\/p><p>But I cannot love Digit 5. It’s the largest, heaviest, most <a href=\"https://spectrum.ieee.org/humanoid-robot-safety\" target=\"_self\">expensive<\/a> robot Agility will ever build, full of design compromises that enable it to be exactly the robot it needs to be right now rather than the robot I dreamed of. In the beginning, I envisioned steady progress on agility and dexterity, with each version becoming more dynamically capable. Instead, developing Digit 5 has required large detours to incorporate requirements that seemed unrelated to my original vision. However, I now recognize that tackling these challenges was always necessary. Customers and product requirements didn’t ruin my vision; they revealed what my vision was missing. This is how robots will achieve commercial success and make a real-world impact, which will bring me closer to my scientific dream as well.<\/p><p>We won’t have a humanoid that matches the capabilities of humans until it achieves that mastery of motion that inspired me to found Agility over a decade ago. I saw glimmers of it with the spring-mass locomotion of ATRIAS, and more glimmers with Cassie’s running gait.<\/p><p>I know that such mastery is physically possible with the tools and hardware that we have right now, and despite all of its compromises, Digit 5 will give us a practical foundation for pursuing that dream. I want every future version of Digit to be lighter and more graceful, to interact more naturally with humans, and to be better at manipulating objects and moving through the world, enabling robots to enter aspects of our lives that they haven’t been able to help with before. By the time I’m old enough to need assistance at home, I expect Digit will be up to the task.<\/p><p>With Digit 5, Agility has built a robot that will be useful in our world. Now I’m getting back to work to make it beautiful, too. <span class=\"ieee-end-mark\"><\/span><\/p><p><em>This article appears in the November 2026 print issue.<\/em><\/p>"}, {"title": "A guide to everything happening at RoboBusiness 2026", "source": "Robotics Business Review", "date": "2026-10-19", "url": "https://www.therobotreport.com/a-guide-to-everything-happening-at-robobusiness-2026/", "summary": "<p>RoboBusiness 2026 will start tomorrow, so we're putting together an overview of everything happening at the show over the next two days.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/a-guide-to-everything-happening-at-robobusiness-2026/\">A guide to everything happening at RoboBusiness 2026<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Unleash AI Innovation: The Power of NVIDIA RTX PRO 6000 Blackwell Workstation Edition Fueled by PNY-Supplied GPUs", "source": "Robotics Business Review", "date": "2026-10-19", "url": "https://www.therobotreport.com/unleash-ai-innovation-the-power-of-nvidia-rtx-pro-6000-blackwell-workstation-edition-fueled-by-pny-supplied-gpus/", "summary": "<p>As robotics systems grow more capable — faster, more precise, and increasingly reliant on AI-driven vision and control — the humble interconnect is being asked to do more than ever.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/unleash-ai-innovation-the-power-of-nvidia-rtx-pro-6000-blackwell-workstation-edition-fueled-by-pny-supplied-gpus/\">Unleash AI Innovation: The Power of NVIDIA RTX PRO 6000 Blackwell Workstation Edition Fueled by PNY-Supplied GPUs<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Daimon Robotics building the infrastructure layer for tactile intelligence", "source": "Robotics Business Review", "date": "2026-10-19", "url": "https://www.therobotreport.com/daimon-robotics-building-the-infrastructure-layer-for-tactile-intelligence/", "summary": "<p>The company is connecting tactile sensing, real-world data collection, simulation, and AI models to help robots perform physical tasks more reliably.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/daimon-robotics-building-the-infrastructure-layer-for-tactile-intelligence/\">Daimon Robotics building the infrastructure layer for tactile intelligence <\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Kodama raises $7M to bring robotics to forestry", "source": "Robotics Business Review", "date": "2026-10-19", "url": "https://www.therobotreport.com/kodama-raises-7m-bring-robotics-forestry/", "summary": "<p>Kodama is working on automating forestry and logging equipment, starting with teleoperation and collecting valuable data on the way.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/kodama-raises-7m-bring-robotics-forestry/\">Kodama raises $7M to bring robotics to forestry<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "How to choose a BLDC motor for robotic arms and mobile robots", "source": "Robotics Business Review", "date": "2026-10-18", "url": "https://www.therobotreport.com/how-to-choose-bldc-motor-robotic-arms-mobile-robots/", "summary": "<p>Several factors, from sensors to safety and robotic arms or mobile platforms, help determine the selection of a brushless DC or BLDC motor.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/how-to-choose-bldc-motor-robotic-arms-mobile-robots/\">How to choose a BLDC motor for robotic arms and mobile robots<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "The rise of the machines is canceled: Why humanoids with AI are helpers, not enemies", "source": "Robotics Business Review", "date": "2026-10-17", "url": "https://www.therobotreport.com/rise-machines-canceled-why-humanoids-ai-are-helpers-not-enemies/", "summary": "<p>Humans play a key role in developing humanoid robots and training AI models, so we can maintain control, writes a columnist.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/rise-machines-canceled-why-humanoids-ai-are-helpers-not-enemies/\">The rise of the machines is canceled: Why humanoids with AI are helpers, not enemies<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "ADI explains the race to make AI physical", "source": "Robotics Business Review", "date": "2026-10-17", "url": "https://www.therobotreport.com/adi-explains-the-race-to-make-ai-physical/", "summary": "<p>A new ADI whitepaper examines the challenges and opportunities in moving physical AI out of labs into production machinery.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/adi-explains-the-race-to-make-ai-physical/\">ADI explains the race to make AI physical<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Video Friday: When Two Robots Become One", "source": "IEEE Spectrum Robotics", "date": "2026-10-16", "url": "https://spectrum.ieee.org/video-friday-reconfigurable-robots", "summary": "<img src=\"https://spectrum.ieee.org/media-library/two-small-robots-with-long-limbs-and-bodies-linked-by-a-wire-join-connect-to-form-one-four-wheeled-robot-on-a-paved-pathway.gif?id=68443843&amp;width=1200&amp;height=800&amp;coordinates=52%2C0%2C52%2C0\" /><br /><br /><p><span>Video Friday is your weekly selection of awesome robotics videos, collected by your friends at <\/span><em>IEEE Spectrum<\/em><span> robotics. We also post a weekly calendar of upcoming robotics events for the next few months. Please <\/span><a href=\"mailto:automaton@ieee.org?subject=Robotics%20event%20suggestion%20for%20Video%20Friday\">send us your events<\/a><span> for inclusion.<\/span><\/p><h5><a href=\"https://www.corl.org/\">CoRL 2026<\/a>: 9–12 November 2026, AUSTIN<\/h5><h5><a href=\"https://2026.ieee-humanoids.org/\">Humanoids 2026<\/a>: 6–9 December 2026, SANTA CLARA, CA<\/h5><p>Enjoy today’s videos!<\/p><div class=\"horizontal-rule\"><\/div><div><span style=\"display: none;\"> <\/span><\/div><p class=\"rm-anchors\" id=\"45-ypqogpiu\">When one robot loves another robot very much, and they’re connected by a wire, they can get together and make a brand new robot! SFW.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://shin0805.github.io/twinx-bridging/\">JSK Lab<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"zssoymcggpu\"><em>What happens when Microducks meet? They start to sing together. Each Microduck syncs with its neighbors over Bluetooth, then they compose a song on the fly, in harmony and in perfect time. There’s no score and no conductor. Two, three, or four ducks are enough for a choir to break out.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>If Pollen isn’t selling <a href=\"https://spectrum.ieee.org/video-friday-microduck-robot\" target=\"_blank\">Microducks<\/a> in four packs for this exact reason, WHAT ARE THEY EVEN DOING!?<\/p><p>[ <a href=\"https://pollen-robotics.com/microduck/\">Pollen<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"9picemtfpwu\"><em>In an internal test, Google DeepMind robotics researchers instructed Gemini 4 Argon to watch a video of a human playing cornhole. Using its video understanding and advanced reasoning capabilities, Gemini 4 built a virtual simulation in MuJoCo and accurately calculated the physics and whole-body control required for Apptronik’s Apollo 2 humanoid to sink seven consecutive shots in the real world. This Video-to-Sim-to-Real pipeline compresses weeks of manual modeling into a few hours, transforming ordinary videos into an infinite training ground for physical AI.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://blog.google/innovation-and-ai/models-and-research/gemini-models/introducing-gemini-4-argon/\">Google DeepMind<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"xaxuv6tsib4\"><em>As of 11 October 2026, NASA’s Perseverance rover has driven 28.10 miles (45.22 kilometers), becoming the new off-world record-holder for total distance driven by any vehicle on the surface of another world. The previous record of 28.06 miles (45.16 kilometers) was held by NASA’s Opportunity rover. Perseverance reached that mark on the 2,006th Martian day, or sol, of its mission, covering in five and a half years a distance that took Opportunity almost 15.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.jpl.nasa.gov/missions/mars-2020-perseverance-rover/\">JPL<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"afotkkjjbky\">Let’s not argue about whether these are robots or not and just agree that they’re cool.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://daehwakim.com/oat/\">OATs<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"j9kfpi-hjx4\">If one cute little robot can clean up one block, how many blocks can 40 cute little robots clean up? Science has the answers!<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://arxiv.org/abs/2610.05677\">Paper<\/a> ]<\/p><p>Thanks, Keisuke!<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"ry5caexgbk0\"><em>Before <a href=\"https://spectrum.ieee.org/4-missions-will-search-the-martian-atmosphere-and-soil-for-signs-of-life\" target=\"_blank\">Rosalind Franklin<\/a> can explore Mars, it has to get off its lander. Engineers are rehearsing that first journey on Earth, using a full-size rover model and Mars-like terrain. The test recreates some of the challenges Rosalind Franklin will face on the Red Planet, from reduced gravity and a 20-degree incline to uneven ground and obstacles beneath its ramps.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.esa.int/Science_Exploration/Human_and_Robotic_Exploration/ExoMars_rover_twin_rehearses_first_drive\">European Space Agency<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"dp_i7hrvgpe\"><em>From custom part to running robot, the Atlas shop floor is built on precision, rapid assembly, and real-time collaboration. By machining parts in-house and streamlining assembly and repair under one roof, we are driving the manufacturing velocity needed to turn complex designs into walking hardware at scale.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://bostondynamics.com/\">Boston Dynamics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"jp79jzwmo4k\"><em>What can a quadruped robot do beyond the lab? Deep in China’s Ailao Mountains, DEEP Robotics Lynx M20S joined a team of researchers on a biodiversity field expedition—navigating rugged terrain, scouting routes ahead, carrying research equipment, and capturing wildlife in areas that are difficult to access on foot.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.deeprobotics.us/\">DEEP Robotics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"_eyarcc8d9y\"><em>The Kamino simulation software is a GPU-accelerated physics solver designed for accurate simulation of complex mechanical systems with kinematic loops, such as parallel manipulators, planar and spatial linkages, and multi-limbed robots with coupled joints, without requiring simplified approximations.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://disneyresearch.github.io/kamino-site/\">Disney Research<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"3h4mk2zcm3w\">The original Kawasaki <a href=\"https://spectrum.ieee.org/unimation-robot\" target=\"_blank\">UNIMATE<\/a> robot as featured in (remember this show?) <em>The MacNeil/Lehrer Report<\/em> in 1982.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span clas
