startups with Analog Garage and participating in events including RoboBusiness.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/analog-devices-returns-strategic-sponsor-aid-massrobotics-startups/\">Analog Devices returns as strategic sponsor to aid MassRobotics startups<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Experts look ahead at the next 20 years of robotics at RoboBusiness", "source": "Robotics Business Review", "date": "2026-08-08", "url": "https://www.therobotreport.com/experts-look-ahead-at-the-next-20-years-of-robotics-at-robobusiness/", "summary": "<p>At Robobusiness, leaders in robotics will explore the technologies, opportunities, and challenges that will shape the next twenty years.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/experts-look-ahead-at-the-next-20-years-of-robotics-at-robobusiness/\">Experts look ahead at the next 20 years of robotics at RoboBusiness<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Video Friday: Drones Go Heavy in DARPA Lift Challenge", "source": "IEEE Spectrum Robotics", "date": "2026-08-07", "url": "https://spectrum.ieee.org/video-friday-heavy-lift-drone", "summary": "<img src=\"https://spectrum.ieee.org/media-library/engineers-watch-a-slender-experimental-drone-fly-near-a-large-hangar.jpg?id=67585216&amp;width=1200&amp;height=800&amp;coordinates=0%2C0%2C0%2C0\" /><br /><br /><p><span>Video Friday is your weekly selection of awesome robotics videos, collected by your friends at <\/span><em>IEEE Spectrum<\/em><span> robotics. We also post a weekly calendar of upcoming robotics events for the next few months. Please <\/span><a href=\"mailto:automaton@ieee.org?subject=Robotics%20event%20suggestion%20for%20Video%20Friday\">send us your events<\/a><span> for inclusion.<\/span><\/p><h5><a href=\"https://actuate.foxglove.dev/\">Actuate 2026<\/a>: 18–19 August 2026, SAN FRANCISCO<\/h5><h5><a href=\"https://2026.ieee-iros.org/\">IROS 2026<\/a>: 27 September–1 October 2026, PITTSBURGH<\/h5><h5><a href=\"https://humanoidssummit.com/\">Humanoids Summit Seoul<\/a>: 22–23 September 2026, SEOUL<\/h5><p>Enjoy today’s videos!<\/p><div class=\"horizontal-rule\"><\/div><div><span style=\"display: none;\"> <\/span><\/div><p class=\"rm-anchors\" id=\"tbw6a0-w1pe\">The <a href=\"https://spectrum.ieee.org/video-friday-heavy-lift-drones\" target=\"_blank\">DARPA Lift Challenge<\/a> is taking place through this weekend. There are a couple of very brief overview videos from the past couple of days, which are only really interesting because they give you a quick look at some utterly bizarre heavy-lift drone designs. If you like what you see, DARPA has recorded livestreams of the entire event so far. We’ve posted one of those at the end of this section, and if you want to be impressed by some super-weird drones, check out <a href=\"https://youtu.be/QFo0JRPsuxE?t=7780\" target=\"_blank\">this<\/a> and <a href=\"https://youtu.be/QFo0JRPsuxE?t=9865\" target=\"_blank\">this<\/a>.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p class=\"shortcode-media shortcode-media-youtube\"> <span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p class=\"shortcode-media shortcode-media-youtube\"> <span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p class=\"shortcode-media shortcode-media-youtube\"> <span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.darpaliftchallenge.com/\">DARPA Lift Challenge<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"gc084vusvby\"><em>When NASA’s <a href=\"https://spectrum.ieee.org/video-friday-skyfall-mars-helicopter\" target=\"_blank\">SkyFall helicopters<\/a> take to the Martian skies, one of their tasks will be to hunt for frozen water—a critical resource for future astronauts—using ground-penetrating radar. For that radar to work, the rotorcraft will carry a flexible, fabric-based antenna that extends below the aircraft without interfering with landings or breaking at touchdown.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://science.nasa.gov/mission/skyfall/\">NASA<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"i_ujhsjdxpy\">Why would you even want a five-fingered humanoid hand when you could have something so much better?<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.flexiv.com/product/grav\">Flexiv<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"mc8xcyqhtl4\"><em>We’ve improved how GEN-1 learns to adapt to new actuators and new robots at the lowest level, with up to 10-20x gains on internal benchmarks. This significantly boosts performance on high-precision tasks like disassembling parts from a NIST board.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://generalistai.com/blog/gen-1\">Generalist<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"cw2aofqerdm\">This is certainly one of the best-looking humanoid robots out there.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://gbionics.ai/\">Generative Bionics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"g98ynwovr_0\">A little on the technical side, but the concept here is important, I think: being able to control an assistive robot through touch.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://sites.google.com/view/tac-nav/home\">Tac-Nav<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"gvpqvwdgku4\"><em>We present SonicFly, a passive aeroacoustic perception framework that enables one unmanned aerial vehicle (UAV) to estimate and follow another using only the leader’s intrinsic flight sound.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://generalroboticslab.com/SonicFly\">General Robotics Lab<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"rssl4e2mwoi\">Okay, but... Get a job?<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.robotis.com/en/product/ecosystem-aisapiens.php\">ROBOTIS<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div>"}, {"title": "Avatar Robotics raises seed round to address industrial labor constraints", "source": "Robotics Business Review", "date": "2026-08-07", "url": "https://www.therobotreport.com/avatar-robotics-raises-6-5-m-seed-round-address-industrial-labor-constraints/", "summary": "<p>Avatar Robotics raised $6.5 million in funding to scale humanoid robots and remote teleoperation across industrial supply chains.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/avatar-robotics-raises-6-5-m-seed-round-address-industrial-labor-constraints/\">Avatar Robotics raises seed round to address industrial labor constraints<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Building robots that survive the warehouse", "source": "Robotics Business Review", "date": "2026-08-07", "url": "https://www.therobotreport.com/building-robots-that-survive-warehouse/", "summary": "<p>Nomagic says its real moat is production data, because the messiness of real warehouses is where robots either prove themselves or fail.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/building-robots-that-survive-warehouse/\">Building robots that survive the warehouse<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Tacta Systems takes aim at high-skilled manufacturing work with TactaBot", "source": "Robotics Business Review", "date": "2026-08-07", "url": "https://www.therobotreport.com/tacta-systems-takes-aim-high-skilled-manufacturing-work-tactabot/", "summary": "<p>Tacta Systems unveiled a three-part system, including its robotic hand, that enables users to teach its robot new dexterous skills.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/tacta-systems-takes-aim-high-skilled-manufacturing-work-tactabot/\">Tacta Systems takes aim at high-skilled manufacturing work with TactaBot<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "HII signs up to $900M agreement with Path Robotics, GrayMatter Robotics", "source": "Robotics Business Review", "date": "2026-08-06", "url": "https://www.therobotreport.com/hii-signs-up-to-900m-agreement-with-path-robotics-graymatter-robotics/", "summary": "<p>The latest agreement expands HII's HYPER Program, which Path Robotics and GrayMatter Robotics joined earlier this year.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/hii-signs-up-to-900m-agreement-with-path-robotics-graymatter-robotics/\">HII signs up to $900M agreement with Path Robotics, GrayMatter Robotics<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Report looks at advances in autonomous mobile robots", "source": "Robotics Business Review", "date": "2026-08-06", "url": "https://www.therobotreport.com/report-looks-at-advances-in-autonomous-mobile-robots/", "summary": "<p>A download looks at examples of advances in autonomous mobile robots in material handling and automated storage applications.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/report-looks-at-advances-in-autonomous-mobile-robots/\">Report looks at advances in autonomous mobile robots<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "How Robin, the robotic companion, keeps patients calm during hospital visits", "source": "Robotics Business Review", "date": "2026-08-06", "url": "https://www.therobotreport.com/how-robin-robotic-companion-keeps-patients-calm-during-hospital-visits/", "summary": "<p>Robin is deployed across 30 different health systems, and Expper has plans to deploy 10 more in different states. <\/p>\n<p>The post <a href=\"https://www.therobotreport.com/how-robin-robotic-companion-keeps-patients-calm-during-hospital-visits/\">How Robin, the robotic companion, keeps patients calm during hospital visits<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Into the Omniverse: How Open World Models Push the Frontier of Physical AI", "source": "NVIDIA Robotics", "date": "2026-08-06", "url": "https://blogs.nvidia.com/blog/open-world-models-physical-ai/", "summary": "In July, NVIDIA joined more than 200 companies and organizations in signing “Open Weights and American AI Leadership,” an open letter arguing that AI leadership will be measured not by any single frontier model but by whether an open ecosystem reaches every sector."}, {"title": "Moove raises $250M to build infrastructure for autonomous vehicles", "source": "Robotics Business Review", "date": "2026-08-05", "url": "https://www.therobotreport.com/moove-raises-250m-to-build-infrastructure-for-autonomous-vehicles/", "summary": "<p>The funding will support Moove's expansion of its autonomous fleet ownership and robotics-first depot infrastructure “Nests.”<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/moove-raises-250m-to-build-infrastructure-for-autonomous-vehicles/\">Moove raises $250M to build infrastructure for autonomous vehicles<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Why perception is the key to scaling industrial autonomy", "source": "Robotics Business Review", "date": "2026-08-05", "url": "https://www.therobotreport.com/why-perception-is-the-key-to-scaling-industrial-autonomy/", "summary": "<p>Autonomy is no longer just about robotic motor skills. It encompasses machine awareness, dynamic decision-making, multi-vehicle coordination, and spatial precision at a large scale. <\/p>\n<p>The post <a href=\"https://www.therobotreport.com/why-perception-is-the-key-to-scaling-industrial-autonomy/\">Why perception is the key to scaling industrial autonomy<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "University of Florida opens new robotics lab dedicated to industrialized construction", "source": "Robotics Business Review", "date": "2026-08-05", "url": "https://www.therobotreport.com/university-of-florida-opens-new-robotics-lab-dedicated-to-industrialized-construction/", "summary": "<p>Fueled by Autodesk, UF opened a robotics lab for industrialized construction to fight housing shortages and labor declines.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/university-of-florida-opens-new-robotics-lab-dedicated-to-industrialized-construction/\">University of Florida opens new robotics lab dedicated to industrialized construction<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Avnet and Weston Robot partner to launch edge AI inspection platform", "source": "Robotics Business Review", "date": "2026-08-05", "url": "https://www.therobotreport.com/avnet-and-weston-robot-partner-to-launch-edge-ai-inspection-platform/", "summary": "<p>Avnet and Weston Robot have partnered to launch an AI-powered autonomous inspection platform for complex industrial environments.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/avnet-and-weston-robot-partner-to-launch-edge-ai-inspection-platform/\">Avnet and Weston Robot partner to launch edge AI inspection platform<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "GAM Enterprises to produce Schaeffler’s PSC gear reducers", "source": "Robotics Business Review", "date": "2026-08-05", "url": "https://www.therobotreport.com/gam-enterprises-to-produce-schaefflers-psc-gear-reducers/", "summary": "<p>Acquiring the IP from this core supplier allows GAM to vertically integrate its supply chain and expand its manufacturing capabilities.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/gam-enterprises-to-produce-schaefflers-psc-gear-reducers/\">GAM Enterprises to produce Schaeffler&#8217;s PSC gear reducers<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "What Robotics Companies Think About the U.S. Foreign Robot Ban", "source": "IEEE Spectrum Robotics", "date": "2026-08-04", "url": "https://spectrum.ieee.org/fcc-covered-list-mobile-robots", "summary": "<img src=\"https://spectrum.ieee.org/media-library/photo-collage-of-humanoid-quadruped-and-unmanned-ground-vehicle-robots.jpg?id=67563239&amp;width=1200&amp;height=800&amp;coordinates=0%2C208%2C0%2C209\" /><br /><br /><p>The U.S. Federal Communications Commission (FCC) “Covered List,” originally published in 2021, identifies communications equipment and services that it says pose a threat to national security. <span>On 28 July, the FCC added <\/span><a href=\"https://www.fcc.gov/document/fcc-adds-foreign-produced-power-inverters-and-robots-covered-list-0\" target=\"_blank\">mobile, communicating robots weighing more than 2 kilograms and power inverters<\/a><span> commonly used in solar panels to the list, meaning that new products from any foreign country in these categories are no longer eligible for import.<\/span><\/p><p>The move is a Department of Defense–driven expansion of scattered federal efforts to <a href=\"https://spectrum.ieee.org/chinese-robots-us-ban\" target=\"_self\">further limit U.S. exposure<\/a> to potentially sensitive Chinese technology, but it may impose major changes on the robotics industry in allied countries, too. <\/p><p>The FCC’s <a href=\"https://www.fcc.gov/sites/default/files/robots-nsd.pdf\" target=\"_blank\">announcement<\/a> says:<\/p><blockquote>All foreign-produced advanced robotic devices pose an unacceptable risk to the national security of the United States and to the safety and security of U.S. persons…unless the [Department of Defense determines that] a given foreign-produced advanced robotic device, or a class of such devices, does not pose such risks.<\/blockquote><p>There are two <a href=\"https://docs.fcc.gov/public/attachments/DA-26-786A1.pdf\" target=\"_blank\">important definitions<\/a> here. The first is what an “advanced robotic device” is, and the second is what “unacceptable risk” means. Drones already went through their own round of this sort of regulation, so they’re exempt from this particular restriction, as are connected vehicles and medical devices. As far as the FCC is concerned, “advanced robotic devices” are <em><em>mobile<\/em><\/em> systems that incorporate on-board sensing and communications and have some amount of autonomy. There are a couple of loopholes, including systems weighing under 2 kilograms and any system that communicates at less than 200 kilobits per second, which opens up some creative possibilities. It’s important to note that this applies to <em><em>new<\/em><\/em> devices; those already certified are not restricted for sale or use.<\/p><p>As to the risks, the U.S. government says that foreign advanced robotic devices represent “a cybersecurity risk that threatens the security of critical infrastructure and thus the safety and security of U.S. persons.” There seem to be two main points to the justification, <a href=\"https://docs.fcc.gov/public/attachments/DA-26-786A1.pdf\" target=\"_blank\">found in Appendix C<\/a>. The first is that mobile robots are important to both the economy and the military, so the United States needs its own supply chain and industrial base rather than relying on foreign manufacturers. And second, mobile robots monitor critical infrastructure in sensitive locations, making them a security risk.<\/p><h2>The Country That Must Not Be Named<\/h2><p>As part of <a href=\"https://www.fcc.gov/sites/default/files/robots-nsd.pdf\" rel=\"noopener noreferrer\" target=\"_blank\">its justification<\/a> for why foreign robots are a security risk, the DOD cites <a href=\"https://spectrum.ieee.org/unitree-robot-exploit\" target=\"_self\"><em><em>IEEE Spectrum’s<\/em><\/em> article on a critical vulnerability in robots from Unitree<\/a>, based in Hangzhou, China, along with several other news articles and reports about Chinese robotics. And despite the FCC <a href=\"https://www.fcc.gov/covered-list-faqs-robots-inverters\" rel=\"noopener noreferrer\" target=\"_blank\">swearing<\/a> up and down that this action is “country neutral” and “not targeted at any country or countries,” U.S. national security sources told <em><em>Spectrum<\/em><\/em> that the perceived threat is obviously China. That’s how China feels about it, too, per a Chinese Ministry of Commerce 29 July <a href=\"https://za.china-embassy.gov.cn/eng/fyrth/202607/t20260729_11994715.htm\" rel=\"noopener noreferrer\" target=\"_blank\">press conference<\/a> (<a href=\"https://sinocism.notion.site/MOFCOM-Spokesperson-Answers-Reporters-Questions-on-the-US-FCC-Adding-Foreign-Power-Inverters-and-Ad-3ad84ece41d781ca8e46d4ec2a45c96c\" rel=\"noopener noreferrer\" target=\"_blank\">translation of the first quote here<\/a>):<\/p><blockquote>On the surface, the FCC’s measures fly the banner of “non-discrimination,” but in substance they discriminate against and suppress Chinese enterprises and products…<br /><br />China firmly opposes the U.S. overstretching the concept of national security and going after Chinese companies. Protectionism does not make the U.S. more competitive and will only hurt the interests of U.S. companies and consumers. China will continue to do what is necessary to firmly defend the legitimate and lawful rights and interests of Chinese companies.<\/blockquote><p>It’s unclear what China is going to do about this—but how about the rest of the world? How can foreign companies that make advanced robotic devices get them cleared for FCC authorization? Among <a href=\"https://www.fcc.gov/sites/default/files/robots-ca.pdf\" rel=\"noopener noreferrer\" target=\"_blank\">many, many other things<\/a>, you’ll need to provide “a detailed, time-bound plan to establish or expand manufacturing in the United States for the advanced robotic device.” <\/p><p>Because China also produces a large fraction of robot components, even for robots assembled in the United States, it will have strong leverage in any related negotiations until U.S. robotics companies further diversify their supply chains.<\/p><p class=\"ieee-inbody-related\">RELATED: <a href=\"https://spectrum.ieee.org/chinese-robots-us-ban\" target=\"_self\">Proposed Chinese Robot Ban Is Latest U.S. Tech Sovereignty Move<\/a><\/p><p>Applicants must also submit their applications to the DOD and FCC by 1 January 2028, which is unfortunate for anyone who wants to develop an advanced robotic device after that point. <\/p><h2>Robotics Industry Reactions<\/h2><p>This is all very new, and reactions from the robotics community have been mixed. <\/p><p>Some American robotics companies may benefit in the local market from the newfound lack of competition in the commercial market. <a href=\"https://www.linkedin.com/in/brendanschulman/\" rel=\"noopener noreferrer\" target=\"_blank\">Brendan Schulman,<\/a> <a href=\"https://bostondynamics.com/\" rel=\"noopener noreferrer\" target=\"_blank\">Boston Dynamics<\/a>’ vice president of policy, wrote an enthusiastic <a href=\"https://www.linkedin.com/posts/brendanschulman_after-months-of-increasing-calls-from-industry-activity-7488070496488435712-8LE-?utm_source=share&amp;utm_medium=member_desktop&amp;rcm=ACoAAADzTX0B_X82L2FL9GS1Qib6fNoMXJQlPzA\" rel=\"noopener noreferrer\" target=\"_blank\">endorsement of the ban on LinkedIn<\/a>: “I sense that this is just the first round in a series of policies that will define the success and growth of the industry for decades to come.” On the other hand, third-country buyers <a href=\"https://www.linkedin.com/feed/update/urn:li:activity:7488293386664292355/\" rel=\"noopener noreferrer\" target=\"_blank\">may just stick to Chinese products<\/a>, as they generally have for drones and electric cars. <\/p><p>But not all companies expect major changes from the new regulation. American customers “need to know they can audit the technology, get support quickly, and keep the system operating without depending on a fragile overseas supply chain,” <a href=\"https://www.linkedin.com/in/nicolaus-radford/\" rel=\"noopener noreferrer\" target=\"_blank\">Nic Radford<\/a>, the CEO of the U.S. humanoid robotics company <a href=\"https://spectrum.ieee.org/persona-ai-radford-pratt/\" target=\"_self\">Persona<\/a>, tells <em><em>IEEE Spectrum<\/em><\/em>. In other words, he figures some customers wouldn’t have wanted Chinese humanoids anyway.<\/p><p><a href=\"https://www.linkedin.com/in/phfrey/\" rel=\"noopener noreferrer\" target=\"_blank\">Philipp Frey<\/a>, vice president of strategy for the Swiss quadruped company <a href=\"https://www.anybotics.com/\" rel=\"noopener noreferrer\" target=\"_blank\">ANYbotics<\/a>, agrees. He says their enterprise customers in the United States “increasingly evaluate robots on long-term reliability, cybersecurity, software capability, safety certification, serviceability, and ecosystem integration, not on hardware cost alone.” <\/p><p>ANYbotics also plans to apply for conditional approval of future products, Frey says. That will involve a national-security review by the DOD or the Department of Homeland Security, disclosing company beneficial ownership, supply-chain risks, and declaring a plan for establishing a significant manufacturing presence in the United States.<\/p><p><a href=\"https://www.linkedin.com/in/gavin-kenneally-321a3833/\" target=\"_blank\">Gavin Kenneally<\/a>, CEO of the U.S. quadruped company <a href=\"https://www.ghostrobotics.io/\" target=\"_blank\">Ghost Robotics<\/a>, is more explicit about the risks that Chinese robot strategy poses to the United States. “Active and purposeful spyware is deployed inside the U.S. on Chinese robots. Examples of predatory pricing abound. And this isn’t just a competition between U.S. and Chinese robotics companies; it’s between private U.S. companies and China’s coordinated national strategy,” Kenneally tells <em><em>Spectrum<\/em><\/em>. “If today’s announcement encourages stronger cybersecurity and a more level competitive environment, that’s good for customers and good for the robotics industry.”<\/p><p>So is an industry-wide ban the best way to guard against threats? American approaches to Chinese technology security risks have been “ad hoc and fragmented,” wrote the Brookings Institution sociologist <a href=\"https://www.brookings.edu/people/kyle-chan/\" rel=\"noopener noreferrer\" target=\"_blank\">Kyle Chan<\/a> in a <a href=\"https://www.brookings.edu/articles/a-new-risk-framework-for-chinese-technology-products-and-investments/\" rel=\"noopener noreferrer\" target=\"_blank\">report<\/a> published 9 July. Chan called for the Bureau of Industry and Security, part of the Department of Commerce, to centralize federal information gathering and decision-making on how to handle risky foreign devices. He also called for better public input mechanisms for these issues, and a continuous, proportionate process that tightened or relaxed targeted import restrictions in response to well-defined risks. <\/p><p>That would allow American industry to continue benefiting from partnerships with Chinese manufacturers in less sensitive links of the supply chain, Chan argues. Those links will evolve over time, requiring continued assessment, but without those partnerships, crude bans “could make it more difficult for American startups and researchers to develop new software and end up slowing innovation across the U.S. robotics ecosystem,” he writes.<\/p>"}, {"title": "Humanoids won’t scale on factory floors until costs drop", "source": "Robotics Business Review", "date": "2026-08-04", "url": "https://www.therobotreport.com/humanoids-wont-scale-on-factory-floors-until-costs-drop/", "summary": "<p>The race to commercialize humanoids is on. What’s left to prove is that humanoid robots can beat the economics of the automation manufacturers are already running.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/humanoids-wont-scale-on-factory-floors-until-costs-drop/\">Humanoids won’t scale on factory floors until costs drop<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Zoox unveils production-ready robotaxi for U.S. expansion", "source": "Robotics Business Review", "date": "2026-08-04", "url": "https://www.therobotreport.com/zoox-unveils-production-ready-robotaxi-for-u-s-expansion/", "summary": "<p>Amazon subsidiary Zoox unveiled its final production-ready robotaxi design and expanded testing following a subtle redesign to improve rider comfort.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/zoox-unveils-production-ready-robotaxi-for-u-s-expansion/\">Zoox unveils production-ready robotaxi for U.S. expansion<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "U.S. Navy picks Blue Water Autonomy to use autonomous vessels for deep ocean surveys", "source": "Robotics Business Review", "date": "2026-08-04", "url": "https://www.therobotreport.com/u-s-navy-picks-blue-water-autonomy-to-use-autonomous-vessels-for-deep-ocean-surveys/", "summary": "<p>Blue Water Autonomy creates unmanned ships that can operate autonomously on the open ocean for months a time.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/u-s-navy-picks-blue-water-autonomy-to-use-autonomous-vessels-for-deep-ocean-surveys/\">U.S. Navy picks Blue Water Autonomy to use autonomous vessels for deep ocean surveys<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Reimagine Robotics emerges from stealth with robots that ‘learn on the job’", "source": "Robotics Business Review", "date": "2026-08-03", "url": "https://www.therobotreport.com/reimagine-robotics-emerges-stealth-with-robotslearn-on-the-job/", "summary": "<p>Reimagine Robotics, founded by former Google DeepMind Applied Robotics leaders, is developing systems that do not require specialized programmers.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/reimagine-robotics-emerges-stealth-with-robotslearn-on-the-job/\">Reimagine Robotics emerges from stealth with robots that &#8216;learn on the job&#8217;<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Walden Robotics Partners With Toyota on Practical Humanoids", "source": "IEEE Spectrum Robotics", "date": "2026-08-03", "url": "https://spectrum.ieee.org/humanoid-robots-walden-robotics-toyota", "summary": "<img src=\"https://spectrum.ieee.org/media-library/humanoid-orange-and-white-robot-using-two-finger-gripper-hands-to-work-with-metal-tool-components.jpg?id=67568024&amp;width=1200&amp;height=800&amp;coordinates=62%2C0%2C63%2C0\" /><br /><br /><p>For a while there, it seemed as though robotics as a whole was stuck in a <a href=\"https://spectrum.ieee.org/top-robotics-stories-2024\" target=\"_self\">mad rush<\/a> towards building <a href=\"https://spectrum.ieee.org/topic/robotics/humanoid-robots/\" target=\"_self\">humanoid robots<\/a> mostly because it was very possible (and very lucrative) to do so, even without near-term goals that were necessarily realistic. Some of the magic of those first couple of years of the humanoid explosion has stuck around, but there’s also been an industry-wide sobering leading to <a href=\"https://spectrum.ieee.org/humanoid-robot-scaling\" target=\"_self\">pointed questions about practicality and value<\/a>. In other words, starting a commercial humanoid company <em><em>now<\/em><\/em> is a much different proposition than it would have been just a few years ago. <\/p><p>On 15 July, <a href=\"https://www.waldenrobotics.com/news/walden-robotics-launches-from-stealth\" rel=\"noopener noreferrer\" target=\"_blank\">Walden Robotics emerged from stealth<\/a> with US $300 million in funding at a valuation of $1.1 billion. Walden is a spinout of <a href=\"https://spectrum.ieee.org/toyota-to-invest-1-billion-in-ai-and-robotics-rd\" target=\"_self\">Toyota Research Institute<\/a> (TRI), and it’s spent the last 10 or so years working on hard problems in robotics with the goal of transitioning from research to real-world applications. That seems like the amount of time and experience that it might reasonably take to develop a <a href=\"https://spectrum.ieee.org/humanoid-robot-scaling\" target=\"_self\">practical and value-driven approach<\/a> to deploying general-purpose humanoid robots, and Walden has chosen an excellent starting point by skipping the legs.<\/p><p>“It’s ironic,” says Walden cofounder and CEO <a href=\"https://www.linkedin.com/in/russ-tedrake-88648a4a/\" rel=\"noopener noreferrer\" target=\"_blank\">Russ Tedrake<\/a>. “I thought about legs for 20 years; that’s the class I teach at MIT. There are many reasons to build a robot with legs. But the question is, what’s the addressable market? And what percentage of it is covered by a wheeled base?” It’s this focused, practical thinking that sets Walden somewhat apart from many (if not most) of the other companies in this space. Rather than <a href=\"https://spectrum.ieee.org/boston-dynamics-spot-robot-dog-now-available\" target=\"_self\">developing a robot first and searching for a viable commercial use case second<\/a>, Walden instead identified applications where robots can provide value now, and designed a robot that could safely and efficiently meet those needs.<\/p><p class=\"shortcode-media shortcode-media-youtube\"> <span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span> <small class=\"image-media media-photo-credit\">Walden Robotics<\/small> <\/p><h2>Walden Robotics’ Manufacturing Focus<\/h2><p class=\"shortcode-media shortcode-media-rebelmouse-image rm-float-left rm-resized-container rm-resized-container-25\" style=\"float: left;\"> <img alt=\"A smiling man in a blue shirt\" class=\"rm-shortcode\" id=\"f545c\" src=\"https://spectrum.ieee.org/media-library/a-smiling-man-in-a-blue-shirt.jpg?id=67568051&amp;width=980\" /> <small class=\"image-media media-caption\">Russ Tedrake is the CEO and cofounder of Walden Robotics.<\/small><small class=\"image-media media-photo-credit\">Walden Robotics<\/small><\/p><p>Tedrake is light on the details about what specific applications Walden is targeting at this point (citing confidentiality with current commercial partners). Manufacturing and logistics environments where there are a lot of <a href=\"https://www.youtube.com/watch?v=F_7IPm7f1vI\" target=\"_blank\">relatively simple<\/a> and <a href=\"https://www.youtube.com/watch?v=tv90GFM9RAo\" target=\"_blank\">repetitive tasks<\/a> that aren’t friendly to conveyor belts and preprogrammed robot arms are a good bet. Even in these environments, however, robots still have to find a useful niche because they’re going up against human workers who are more flexible while also cheaper to employ. So the question is: How do you make an argument to a customer that a robot is actually a better solution than their existing human workers?<\/p><p>“You need to find applications with high utilization—where the robot is used 24 hours a day, 7 days a week,” says Tedrake. “Manufacturing is a global imperative right now, and it makes the economics work.” Economic viability is a necessary condition, but it’s not a sufficient one for Walden, or for their partnership with Toyota. People are a big part of Walden’s plan, too.<\/p><p>One of Walden’s major strengths is the company’s partnership with Toyota, which is not all that surprising given that Walden is a spinout from TRI, which is <a href=\"https://spectrum.ieee.org/toyota-to-invest-1-billion-in-ai-and-robotics-rd\" target=\"_self\">Toyota’s Silicon Valley–based R&amp;D arm<\/a>. “Toyota was very proud of the work we had done at TRI, and was ready to go big in this space,” says Tedrake. “Part of the excitement of having Toyota as a partner is that their culture is deeply people-first. When talking to Toyota’s leadership, I was never asked how much money this is going to make, but I was asked how it will improve the quality of life for all people.”<\/p><p class=\"shortcode-media shortcode-media-rebelmouse-image\"> <img alt=\"A white and orange humanoid robot manipulates an object in its two-finger grippers.\" class=\"rm-shortcode\" id=\"209d4\" src=\"https://spectrum.ieee.org/media-library/a-white-and-orange-humanoid-robot-manipulates-an-object-in-its-two-finger-grippers.jpg?id=67568030&amp;width=980\" /> <small class=\"image-media media-caption\">The robot’s chonky design allows it to meet the high-payload requirements of useful manufacturing work.<\/small><small class=\"image-media media-photo-credit\">Walden Robotics<\/small><\/p><p>In this context, at least in the short term, Walden’s approach to improving the quality of life for people is to take over those aforementioned repetitive manufacturing tasks with robots. Tedrake hopes that this will lead to workplaces where skilled craftspeople are able to do even more with their hard-earned expertise, increasing their efficiency, productivity, and happiness all at the same time—a noble goal, although there’s only so much Walden itself can do to make this happen, and not all customers will share Toyota’s priorities.<\/p><h2>Wheeled Humanoid Robots in Factories<\/h2><p>Many other <a href=\"https://www.agilityrobotics.com/\" target=\"_blank\">humanoid<\/a> <a href=\"https://www.figure.ai/\" target=\"_blank\">robotics<\/a> <a href=\"https://apptronik.com/\" target=\"_blank\">companies<\/a> are also targeting these logistics and manufacturing spaces with general-purpose robots, and they’re doing so by making robots that are as humanlike as possible. The theory is that a humanoid form factor is necessary when operating in human environments. And there are certainly arguments in favor of a humanoid with legs—stairs exist, for one, and legged robots have a smaller footprint compared with ones that have wheels.<\/p><p>But a large wheeled base offers some significant advantages, as Tedrake points out. You’re incentivized to cram the base full of batteries, since more weight near the floor keeps the robot stable, which also solves the problem of running out of power during the middle of the workday. More importantly, a statically stable robot that moves around on a wheeled base can bypass the <a href=\"https://spectrum.ieee.org/humanoid-robot-scaling\" target=\"_self\">safety challenges<\/a> that are currently keeping legged humanoids physically separated from real humans—most prominently, the fact that legged robots can fall over. “Factories already have autonomous mobile [wheeled] robots,” explains Tedrake. “They already have safety cases built around AMRs. You can piggyback on that with a wheeled base.”<\/p><p class=\"shortcode-media shortcode-media-rebelmouse-image\"> <img alt=\"A close-up of a robotic gripper grasping a metallic object in a vise.\" class=\"rm-shortcode\" id=\"f600c\" src=\"https://spectrum.ieee.org/media-library/a-close-up-of-a-robotic-gripper-grasping-a-metallic-object-in-a-vise.jpg?id=67568022&amp;width=980\" /> <small class=\"image-media media-caption\">Simple, rugged grippers make the robot suitable for commercial deployment.<\/small><small class=\"image-media media-photo-credit\">Walden Robotics<\/small><\/p><p>Walden’s perspective on manipulation is similar. Many humanoid companies are using five-fingered hands that are highly dexterous but also highly complex, which Tedrake believes is not a pragmatic approach in the context of commercial deployments. “There’s a question of what you need to do the tasks, but the real question is just durability,” Tedrake says. “We have been deployed in a Toyota factory, and at the end of the week, the hands take a beating, so we built hands that can take that. I have not seen a more dexterous hand that could have done the work our hand has done.”<\/p><p>Walden’s long-term plan is to build “general-purpose robots.” It’s not always clear what a general-purpose robot is, because (I would argue) nobody is quite sure what “general purpose” means. It’s certainly not referring to robots that can do <em><em>everything<\/em><\/em>; I think the closest we can get are robots that can be taught to do a useful number of different skills, which is why I prefer the term “multipurpose.” It’s a little pedantic, I know, but I think the distinction is important because it moderates expectations in the near term.<\/p><p>Part of where Walden’s optimism towards general purposeness comes from is TRI’s earlier research on <a href=\"https://medium.com/toyotaresearch/tris-robots-learn-new-skills-in-an-afternoon-here-s-how-2c30b1a8c573\" target=\"_blank\">diffusion policy<\/a>, which helps robots learn new skills more quickly by leveraging previously learned skills as a foundation. “Fundamentally, multitasking is a way to get to a general-purpose robot,” Tedrake says. “I believe there is a single platform that can do a lot of tasks that are of high value for real customers. That will give us the experience we need to give birth to this deployed general-purpose capability.”<\/p>"}, {"title": "HEBI Robotics earns NASA SBIR grant to fast track miniaturized actuators", "source": "The Robot Report", "date": "2026-08-03", "url": "https://www.therobotreport.com/hebi-robotics-earns-nasa-sbir-grant-fast-track-miniaturized-actuators/", "summary": "<p>This Phase I award is only part of HEBI Robotics' roadmap. The company also plans to continue developing its existing actuation hardware.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/hebi-robotics-earns-nasa-sbir-grant-fast-track-miniaturized-actuators/\">HEBI Robotics earns NASA SBIR grant to fast track miniaturized actuators<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "igus launches energy chain with 600-degree rotation for industrial robots", "source": "Robotics Business Review", "date": "2026-08-03", "url": "https://www.therobotreport.com/igus-launches-energy-chain-600-degree-rotation-industrial-robots/", "summary": "<p>igus says its new twisterchain energy chain provides cable management for challenging industrial robotics applications such as palletizing.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/igus-launches-energy-chain-600-degree-rotation-industrial-robots/\">igus launches energy chain with 600-degree rotation for industrial robots<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Google DeepMind says Gemini Robotics 2 enables full body control", "source": "Robotics Business Review", "date": "2026-08-02", "url": "https://www.therobotreport.com/google-deepmind-says-gemini-robotics-2-enables-full-body-control/", "summary": "<p>Gemini Robotics 2 enables robots to reason through every movement, unlocking a broad range of tasks, DeepMind said. <\/p>\n<p>The post <a href=\"https://www.therobotreport.com/google-deepmind-says-gemini-robotics-2-enables-full-body-control/\">Google DeepMind says Gemini Robotics 2 enables full body control<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Top 10 robotics stories of July 2026", "source": "Robotics Business Review", "date": "2026-08-01", "url": "https://www.therobotreport.com/top-10-robotics-stories-july-2026/", "summary": "<p>In July, large funding rounds, new approaches to robot training, and new robot models drew our readers attention.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/top-10-robotics-stories-july-2026/\">Top 10 robotics stories of July 2026<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}], "embeddedNews": [{"title": "How Gold Plastic Syndrome is Killing Toys and Game Consoles", "source": "Hackaday", "date": "2026-09-01", "url": "https://hackaday.com/2026/09/01/how-gold-plastic-syndrome-is-killing-toys-and-game-consoles/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"413\" src=\"https://hackaday.com/wp-content/uploads/2026/08/brittle_plastic_nintendo_ds_sqwerks_youtube.jpg?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>In a recent video [Sqwerks] does a deep-dive into the problem of disintegrating plastic enclosures of Nintendo DS consoles. These original NDS handheld consoles have a metallic-like coating that appears <a class=\"read-more\" href=\"https://hackaday.com/2026/09/01/how-gold-plastic-syndrome-is-killing-toys-and-game-consoles/\">&#8230;read more<\/a>"}, {"title": "Reactive Heat and Wind Come to VR, Thanks to Smart Plugs", "source": "Hackaday", "date": "2026-09-01", "url": "https://hackaday.com/2026/09/01/reactive-heat-and-wind-come-to-vr-thanks-to-smart-plugs/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"450\" src=\"https://hackaday.com/wp-content/uploads/2026/08/Fallout-VR-Heat-and-Wind.png?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>Want to feel the heat of nearby fire, explosions, or radiation? Or even just the gentle warmth and breeze of a sunny day in the wasteland? If you said yes, <a class=\"read-more\" href=\"https://hackaday.com/2026/09/01/reactive-heat-and-wind-come-to-vr-thanks-to-smart-plugs/\">&#8230;read more<\/a>"}, {"title": "Hackaday Europe 2026: Playstation 4 to Psychometer", "source": "Hackaday", "date": "2026-09-01", "url": "https://hackaday.com/2026/09/01/hackaday-europe-2026-playstation-4-to-psychometer/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"480\" src=\"https://hackaday.com/wp-content/uploads/2026/09/DSCF6838_featured.png?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>There are many ways to detect stress in an individual. You can use self-reporting checklists, you could try and measure various vital signs like respiratory rate and pulse and infer <a class=\"read-more\" href=\"https://hackaday.com/2026/09/01/hackaday-europe-2026-playstation-4-to-psychometer/\">&#8230;read more<\/a>"}, {"title": "It’s Teletext, But On The Radio", "source": "Hackaday", "date": "2026-09-01", "url": "https://hackaday.com/2026/09/01/its-teletext-but-on-the-radio/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"450\" src=\"https://hackaday.com/wp-content/uploads/2026/08/ceefax-featured.jpg?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>Old-school teletext with its pixelated text and block graphics may now be largely a thing of the past, but that doesn&#8217;t mean it&#8217;s without enthusiasts or there&#8217;s no more life <a class=\"read-more\" href=\"https://hackaday.com/2026/09/01/its-teletext-but-on-the-radio/\">&#8230;read more<\/a>"}, {"title": "PETG: the PLA Filament Alternative that Just Works", "source": "Hackaday", "date": "2026-09-01", "url": "https://hackaday.com/2026/09/01/petg-the-pla-filament-alternative-that-just-works/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"450\" src=\"https://hackaday.com/wp-content/uploads/2020/02/3D-Printing-New.jpg?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>A typical response to the previous article on why PLA filament is so darn brittle. This has led some people to not use PLA filament at all, while others promote <a class=\"read-more\" href=\"https://hackaday.com/2026/09/01/petg-the-pla-filament-alternative-that-just-works/\">&#8230;read more<\/a>"}, {"title": "Crowdsourcing An Investigation Into Coil Whine", "source": "Hackaday", "date": "2026-09-01", "url": "https://hackaday.com/2026/09/01/crowdsourcing-an-investigation-into-coil-whine/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"450\" src=\"https://hackaday.com/wp-content/uploads/2026/08/A6E797DF-0199-45A3-AA62-7E6691E9569dddd3.png?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>If you&#8217;ve heard the high-pitched whine or buzz from an electronic device when a current-carrying inductor is vibrating, you&#8217;ll know how unpleasant it can be. It&#8217;s common in all kinds <a class=\"read-more\" href=\"https://hackaday.com/2026/09/01/crowdsourcing-an-investigation-into-coil-whine/\">&#8230;read more<\/a>"}, {"title": "Sliding Into Perfection: The Open Task Light", "source": "Hackaday", "date": "2026-09-01", "url": "https://hackaday.com/2026/09/01/sliding-into-perfection-the-open-task-light/", "summary": "<div><img alt=\"open task light\" class=\"attachment-large size-large wp-post-image\" height=\"450\" src=\"https://hackaday.com/wp-content/uploads/2026/08/Screenshot-2026-08-31-7.57.49-PM-16-9.png?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>A few years ago Dyson released a desk lamp that could slide up and down, in and out, balancing itself at every position. [Steven Bennett] saw that lamp and wanted <a class=\"read-more\" href=\"https://hackaday.com/2026/09/01/sliding-into-perfection-the-open-task-light/\">&#8230;read more<\/a>"}, {"title": "Qualcomm introduces Dragonwing Q-2390 and IQ-2390 for consumer and industrial AIoT applications", "source": "CNX Software", "date": "2026-09-01", "url": "https://www.cnx-software.com/2026/09/01/qualcomm-introduces-dragonwing-q-2390-and-iq-2390-for-consumer-and-industrial-aiot-applications/", "summary": "<div><img alt=\"Qualcomm Dragonwing IQ2 Q2\" class=\"attachment-medium size-medium wp-post-image\" height=\"405\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/09/Qualcomm-Dragonwing-IQ2-Q2-720x405.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Qualcomm has announced the Qualcomm Dragonwing Q-2390 and IQ-2390 quad-core Cortex-A78/A55 processors for AIoT consumer, commercial and industrial applications. The Dragonwing Q-2390 processor is designed for commercial and consumer devices, notably for applications such as retail and smart home products, as well as smart displays and enterprise edge devices, while the Dragonwing IQ-2390 processor is the SKU from the Dragonwing IQ2 Series designed for industrial automation, machine vision, building management and energy systems. Qualcomm IQ-2390 and Q-2390 specifications: CPU 1x Arm Cortex-A78 core up to 1.5 or 1.9 GHz depending on SKU 3x Arm Cortex-A55 cores up to 1.5 or 1.9 GHz depending on SKU Optional SiFive E61 RISC-V real-time core up to 600MHz with 768kB memory Cache &#8211; 512 KB L3 cache GPU &#8211; Qualcomm Adreno 704 up to 1.1 GHz Audio DSP &#8211; Qualcomm Hexagon V66  up to 1.1 GHz NPU &#8211; Qualcomm Hexagon up to 1.1 TOPS DPU [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/09/01/qualcomm-introduces-dragonwing-q-2390-and-iq-2390-for-consumer-and-industrial-aiot-applications/\">Qualcomm introduces Dragonwing Q-2390 and IQ-2390 for consumer and industrial AIoT applications<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Makera Z1 Desktop CNC Review – Smart milling, 4-axis module, and 5W laser engraving", "source": "CNX Software", "date": "2026-09-01", "url": "https://www.cnx-software.com/2026/09/01/makera-z1-desktop-cnc-review-smart-milling-4-axis-module-and-5w-laser-engraving/", "summary": "<div><img alt=\"makera z1 desktop cnc cyclone dust collector lite\" class=\"attachment-medium size-medium wp-post-image\" height=\"540\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/09/makera-z1-desktop-cnc-cyclone-dust-collector-lite-720x540.png\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>The Makera Z1 Desktop CNC is a desktop CNC machine designed for milling and engraving work that requires precision. The fully enclosed machine features an aluminum structure, offers a 200 × 200 × 100 mm work volume, and is suitable for wood, plastic, acrylic, PCB boards, carbon fiber, as well as non-ferrous metals such as aluminum, brass, and copper. The standout feature of this model is its fairly complete set of assistive functions, including a quick tool change system for swapping milling bits, auto probing &#38; leveling for detecting position and leveling the workpiece, the AeroDust system for blowing and managing chips/dust, and a built-in camera for monitoring operation. In addition, optional accessories such as a 4th-axis rotary module, a 5W laser head, a workholding kit, and a 3D probe can also be installed. This model relies on a linear rail system featuring Acme lead screws and NEMA 17 stepper [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/09/01/makera-z1-desktop-cnc-review-smart-milling-4-axis-module-and-5w-laser-engraving/\">Makera Z1 Desktop CNC Review &#8211; Smart milling, 4-axis module, and 5W laser engraving<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "ArmSoM Sige6 Allwinner A733 SBC features up to 128GB soldered-on eMMC flash, 16GB LPDDR5", "source": "CNX Software", "date": "2026-09-01", "url": "https://www.cnx-software.com/2026/09/01/armsom-sige6-allwinner-a733-sbc-features-up-to-128gb-soldered-on-emmc-flash-16gb-lpddr5/", "summary": "<div><img alt=\"ArmSom Sige6 SBC\" class=\"attachment-medium size-medium wp-post-image\" height=\"470\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/09/ArmSom-Sige6-SBC-720x470.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>ArmSoM Sige6 is yet another SBC powered by the Allwinner A733 octa-core SoC, offered in a credit card form factor with up to 128GB soldered-on eMMC flash and up to 16GB LPDDR5. The single board computer features a microSD card slot and an M.2 M-key PCIe 3.0 x2 slot for storage, Gigabit Ethernet (with optional PoE), WiFi 6, and Bluetooth 5.4 connectivity, HDMI 2.0 and MIPI DSI display interfaces, a MIPI CSI camera interface, USB 3.0/2.0 ports, a 3.5mm audio jack, a 40-pin GPIO header, and more. ArmSom Sige6 specifications: SoC – Allwinner A733-HN3 CPU Dual-core Arm Cortex-A76 @ up to 2.00 GHz Hexa-core Arm Cortex-A55 @ up to 1.80 GHz Single-core RISC-V E902 real-time core GPU – Imagination Technologies BXM-4-64 MC1 GPU with support for OpenGL ES 3.2, Vulkan 1.3, and OpenCL 3.0 VPU 4Kp60/8Kp24 H.265/VP9/AVS2 decoding, 4Kp30 H.264  decoding 4Kp30 H.265/H.264 encoding AI accelerator – 3 TOPS NPU Process [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/09/01/armsom-sige6-allwinner-a733-sbc-features-up-to-128gb-soldered-on-emmc-flash-16gb-lpddr5/\">ArmSoM Sige6 Allwinner A733 SBC features up to 128GB soldered-on eMMC flash, 16GB LPDDR5<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Achronix Adds JESD204C IP Core for Speedster7t FPGAs", "source": "Embedded.com", "date": "2026-09-01", "url": "https://www.embedded.com/achronix-adds-jesd204c-ip-core-for-speedster7t-fpgas/", "summary": "<p>Achronix Semiconductor Corp. has introduced a high-performance JESD204C IP core for its family of Speedster7t FPGAs. The IP core is designed to connect advanced analog-to-digital converters and digital-to-analog converters to programmable logic. Each core supports data rates of up to 32 Gbits/s per lane and up to eight lanes per link, which translates into an [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/achronix-adds-jesd204c-ip-core-for-speedster7t-fpgas/\">Achronix Adds JESD204C IP Core for Speedster7t FPGAs<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "Pixel Art Robot draws one flipped squisk at a time", "source": "Electronics Weekly", "date": "2026-09-01", "url": "https://www.electronicsweekly.com/blogs/gadget-master/displayscreen/pixel-art-robot-offers-one-flipped-squisk-at-a-time-2026-09/", "summary": "<p>There's so much to learn. In my case, what exactly is a flip-squisk?! I learnt this one when reading about an Arduino-based flip-squisk display, to be precise.<\/p>\n<p>The post <a href=\"https://www.electronicsweekly.com/blogs/gadget-master/displayscreen/pixel-art-robot-offers-one-flipped-squisk-at-a-time-2026-09/\">Pixel Art Robot draws one flipped squisk at a time<\/a> appeared first on <a href=\"https://www.electronicsweekly.com\">Electronics Weekly<\/a>.<\/p>"}, {"title": "SpaceWERX backs 11 companies for space innovation", "source": "Electronics Weekly", "date": "2026-09-01", "url": "https://www.electronicsweekly.com/news/business/finance/spacewerx-backs-11-companies-for-space-innovation-2026-09/", "summary": "<p>SpaceWERX, the U.S. Air Force space technology accelerator programme, will be investing in another 11 companies to develop innovative space technologies. Specifically, the funding will be via its Program Year [&#8230;]<\/p>\n<p>The post <a href=\"https://www.electronicsweekly.com/news/business/finance/spacewerx-backs-11-companies-for-space-innovation-2026-09/\">SpaceWERX backs 11 companies for space innovation<\/a> appeared first on <a href=\"https://www.electronicsweekly.com\">Electronics Weekly<\/a>.<\/p>"}, {"title": "Tendeg showcases NewTen two-axis steerable reflector antenna", "source": "Electronics Weekly", "date": "2026-09-01", "url": "https://www.electronicsweekly.com/news/products/rf-microwave-optoelectronics/tendeg-showcases-newten-two-axis-steerable-reflector-antenna-2026-09/", "summary": "<p>Tendeg, the antenna specialist, has released NewTEN, its two-axis steerable reflector antenna for small spacecraft. It was showcased at the 40th Annual Small Satellite Conference in Salt Lake City. Reflector [&#8230;]<\/p>\n<p>The post <a href=\"https://www.electronicsweekly.com/news/products/rf-microwave-optoelectronics/tendeg-showcases-newten-two-axis-steerable-reflector-antenna-2026-09/\">Tendeg showcases NewTen two-axis steerable reflector antenna<\/a> appeared first on <a href=\"https://www.electronicsweekly.com\">Electronics Weekly<\/a>.<\/p>"}, {"title": "To Pay Or Not To Pay", "source": "Electronics Weekly", "date": "2026-09-01", "url": "https://www.electronicsweekly.com/blogs/mannerisms/markets/to-pay-or-not-to-pay-2026-09/", "summary": "<p>Much of the AI economy still looks suspiciously circular. Hyperscalers are  investing hundreds of billions of dollars to build AI data center using Nvidia’s chips. Nvidia partially invests its billions [&#8230;]<\/p>\n<p>The post <a href=\"https://www.electronicsweekly.com/blogs/mannerisms/markets/to-pay-or-not-to-pay-2026-09/\">To Pay Or Not To Pay<\/a> appeared first on <a href=\"https://www.electronicsweekly.com\">Electronics Weekly<\/a>.<\/p>"}, {"title": "Get the Gadget Master newsletter!", "source": "Electronics Weekly", "date": "2026-09-01", "url": "https://www.electronicsweekly.com/blogs/gadget-master/general/sign-up-for-the-newsletter-2-2026-09/", "summary": "<p>Ensure you receive the latest and greatest Gadget Master posts, hot and fresh, straight into your inbox!<\/p>\n<p>The post <a href=\"https://www.electronicsweekly.com/blogs/gadget-master/general/sign-up-for-the-newsletter-2-2026-09/\">Get the Gadget Master newsletter!<\/a> appeared first on <a href=\"https://www.electronicsweekly.com\">Electronics Weekly<\/a>.<\/p>"}, {"title": "New GaN-on-Si transistor withstands nearly 4kV before breakdown", "source": "Electronics Weekly", "date": "2026-09-01", "url": "https://www.electronicsweekly.com/news/business/new-transistor-withstands-nearly-4kv-before-breakdown-2026-09/", "summary": "<p>A new kind of transistor &#8211; the  Intrinsic Polarisation Super Junction ( iPSJ) has been invented to deal with the propensity of GaN transistors to fail at very high voltages. [&#8230;]<\/p>\n<p>The post <a href=\"https://www.electronicsweekly.com/news/business/new-transistor-withstands-nearly-4kv-before-breakdown-2026-09/\">New GaN-on-Si transistor withstands nearly 4kV before breakdown<\/a> appeared first on <a href=\"https://www.electronicsweekly.com\">Electronics Weekly<\/a>.<\/p>"}, {"title": "Nvidia puts $3.5bn into MediaTek", "source": "Electronics Weekly", "date": "2026-09-01", "url": "https://www.electronicsweekly.com/news/business/nvidia-2-2026-09/", "summary": "<p>Nvidia is buying $3.5 billion of MediaTek’s convertible bonds in a deal by which they commit to use each other’s products. “Nvidia’s networking ecosystem is now part of MediaTek’s supply [&#8230;]<\/p>\n<p>The post <a href=\"https://www.electronicsweekly.com/news/business/nvidia-2-2026-09/\">Nvidia puts $3.5bn into MediaTek<\/a> appeared first on <a href=\"https://www.electronicsweekly.com\">Electronics Weekly<\/a>.<\/p>"}, {"title": "Superconducting transistor startup raises €2.6m", "source": "Electronics Weekly", "date": "2026-09-01", "url": "https://www.electronicsweekly.com/news/business/superconducting-transistors-startup-raises-e2-6m-2026-09/", "summary": "<p>Finnish startup S-Transistors, a spin-out from VTT Technical Research Centre of Finland, has raised €2.6 million in pre-seed funding to pioneer a fundamentally new class of  ICs based on superconducting [&#8230;]<\/p>\n<p>The post <a href=\"https://www.electronicsweekly.com/news/business/superconducting-transistors-startup-raises-e2-6m-2026-09/\">Superconducting transistor startup raises €2.6m<\/a> appeared first on <a href=\"https://www.electronicsweekly.com\">Electronics Weekly<\/a>.<\/p>"}, {"title": "Nexeon completes £100m funding round", "source": "Electronics Weekly", "date": "2026-09-01", "url": "https://www.electronicsweekly.com/news/business/nexeon-completes-100m-funding-round-2026-09/", "summary": "<p>Nexeon, the UK developer of silicon-based battery materials, has been awarded  £52.6 million from the National Wealth Fund. Nexeon has now completed a £100 million funding round with other new [&#8230;]<\/p>\n<p>The post <a href=\"https://www.electronicsweekly.com/news/business/nexeon-completes-100m-funding-round-2026-09/\">Nexeon completes £100m funding round<\/a> appeared first on <a href=\"https://www.electronicsweekly.com\">Electronics Weekly<\/a>.<\/p>"}, {"title": "Tim Cook’s farewell memo", "source": "Electronics Weekly", "date": "2026-09-01", "url": "https://www.electronicsweekly.com/news/tim-cooks-farewell-memo-2026-09/", "summary": "<p>Here is Tim Cook’s final memo to Apple employees: Team, Today is my last day as CEO of Apple. This is a moment I always knew would come one day, [&#8230;]<\/p>\n<p>The post <a href=\"https://www.electronicsweekly.com/news/tim-cooks-farewell-memo-2026-09/\">Tim Cook’s farewell memo<\/a> appeared first on <a href=\"https://www.electronicsweekly.com\">Electronics Weekly<\/a>.<\/p>"}, {"title": "Discover the Rare First Printed Don Quixote Illustrations", "source": "Adafruit", "date": "2026-09-01", "url": "https://blog.adafruit.com/2026/09/01/discover-the-rare-first-printed-don-quixote-illustrations/", "summary": "I&#8217;m not sure if Don Quixote is still required reading in high school but I&#8217;m certain it is still one of the most influential works of literature to this day. The The Laredo Center for the Arts will be presenting The Quest to Dream III: A Rare Collection of the First Printed Don Quixote Illustrations [&#8230;]"}, {"title": "A flip disc display that does it slow and steady", "source": "Adafruit", "date": "2026-09-01", "url": "https://blog.adafruit.com/2026/09/01/a-flip-disc-display-that-does-it-slow-and-steady/", "summary": "Zoe Skyforest writing at Hackaday covered a flip disc display by Zimm that throws out the usual electromagnet per pixel. The array is 37 by 18 square discs, black on one side and blue on the other, with no actuator behind any of them. Instead, a CNC machine does the flipping. A tool head scans [&#8230;]"}, {"title": "Linux was first announced August 25, 1991", "source": "Adafruit", "date": "2026-09-01", "url": "https://blog.adafruit.com/2026/09/01/linux-was-first-announced-august-25-1991/", "summary": "Dave Farquhar looks back at the Usenet post that started Linux, writing on The Silicon Underground. On August 25, 1991, Linus Torvalds posted to comp.os.minix to describe a free hobby operating system for 386 and 486 PCs. He had been working on it since April. He had the bash shell and the gcc compiler running [&#8230;]"}, {"title": "Cobalt: apps and an SDK for Kobo e-readers", "source": "Adafruit", "date": "2026-09-01", "url": "https://blog.adafruit.com/2026/09/01/cobalt-apps-and-an-sdk-for-kobo-e-readers/", "summary": "Cobalt is an open source application platform for Kobo e-readers, published at bandarlabs.github.io. It includes a launcher, a signed app store, a Rust SDK, and a runtime that keeps each app in its own unprivileged process. Install it once over USB, then install, update, and remove apps on the reader itself over WiFi. A reboot [&#8230;]"}, {"title": "CrossPoint e-reader firmware for ESP32-based ePaper devices", "source": "Adafruit", "date": "2026-09-01", "url": "https://blog.adafruit.com/2026/09/01/crosspoint-e-reader-firmware-for-esp32-based-epaper-devices/", "summary": "LWN published a look at CrossPoint Reader, replacement firmware for the small ESP32-based e-readers that have been showing up from Chinese vendors over the past year. Dave Allie released the first version soon after the Xteink 4 went global. The MIT-licensed project now has more than 200 contributors and supports six devices built around the [&#8230;]"}, {"title": "Microsoft’s WinUI becomes fully open-source", "source": "Adafruit", "date": "2026-09-01", "url": "https://blog.adafruit.com/2026/09/01/microsofts-winui-becomes-fully-open-source/", "summary": "Ananthu Ashok, writing at Open Source For You, reports that Microsoft has finished moving WinUI to open source. WinUI is the native user interface framework behind Windows 11 applications. Mainline development now happens publicly on GitHub, where branches, pull requests and code reviews can be followed by anyone. The switch completes a four phase migration [&#8230;]"}, {"title": "The Most Efficient Origami Donut", "source": "Adafruit", "date": "2026-09-01", "url": "https://blog.adafruit.com/2026/09/01/the-most-efficient-origami-donut/", "summary": "A non-paper torus via Wikimedia commons by Dave Crosby &#160; Mathematicians are always up to something. Richard Schwartz of Brown University wasn&#8217;t satisfied with simply making an origami donut from a sheet of paper; he wanted to make sure it was the most efficient folded donut possible. The donut shape is called a torus. Schwartz [&#8230;]"}, {"title": "RL training environments for Microduck", "source": "Adafruit", "date": "2026-09-01", "url": "https://blog.adafruit.com/2026/09/01/rl-training-environments-for-microduck/", "summary": "Pollen Robotics has published microduck_rl on GitHub, a set of reinforcement learning training environments for Microduck, a bipedal robot about 25 cm tall weighing roughly 800 g. The environments are built on mjlab (MuJoCo Warp) and use PPO. Policies train at 50 Hz, export to ONNX, and run on the real robot through the separate [&#8230;]"}, {"title": "A Spotify Connect client for headless systems", "source": "Adafruit", "date": "2026-09-01", "url": "https://blog.adafruit.com/2026/09/01/a-spotify-connect-client-for-headless-systems/", "summary": "Raspotify is a Debian package from dtcooper, published on GitHub, that turns a headless Linux box into a Spotify Connect target. It wraps the librespot library by Paul Lietar and others as a systemd daemon. It targets Debian Stable, currently Debian 13 &#8220;Trixie&#8221;, and other Debian based systems. A premium Spotify account is required. The [&#8230;]"}, {"title": "JP’s Product Pick of the Week — New Earlier Time!! 3pm Eastern TODAY 9/1/26 and Beyond! @adafruit #adafruit #newproductpick", "source": "Adafruit", "date": "2026-09-01", "url": "https://blog.adafruit.com/2026/09/01/jps-product-pick-of-the-week-new-earlier-time-3pm-eastern-today-9-1-26-and-beyond-adafruit-adafruit-newproductpick/", "summary": "Product Picks come earlier now! One hour earlier in fact. Come on by for JP&#8217;s Product Pick of The Week ! A new product pick will be revealed. The show airs at 3pm ET / 12pm PT We&#8217;re making changes to some show schedules at Adafruit, so this will be the new time slot for [&#8230;]"}, {"title": "Boot a virtual iPhone on a Mac", "source": "Adafruit", "date": "2026-09-01", "url": "https://blog.adafruit.com/2026/09/01/boot-a-virtual-iphone-on-a-mac/", "summary": "Lakr233 has published vphone-cli, a command line tool that boots a virtual iPhone on a Mac using Apple&#8217;s Virtualization.framework and the Private Cloud Compute research VM infrastructure. A single command, vphone-cli vm create, runs the whole pipeline: download, patch, DFU restore, custom firmware install, and first boot. The individual stages can also be run by [&#8230;]"}, {"title": "Shipping Alert: Labor Day 2026 Monday, September 7", "source": "Adafruit", "date": "2026-09-01", "url": "https://blog.adafruit.com/2026/09/01/shipping-alert-labor-day-2026-monday-september-7/", "summary": "Monday, September 7, is Labor Day. This is a federal Holiday as well as a holiday for the Adafruit team. While some of the team will be shipping orders there will be no carrier pickups. Expedited orders placed after 11am EST Friday, September 4, will not go out until Tuesday, September 2. Please allow extra [&#8230;]"}, {"title": "ARK Just A Pi – A tiny NDAA-compliant Raspberry Pi CM5 carrier board for drones and robots", "source": "CNX Software", "date": "2026-08-31", "url": "https://www.cnx-software.com/2026/08/31/ark-just-a-pi-a-tiny-ndaa-compliant-raspberry-pi-cm5-carrier-board-for-drones-and-robots/", "summary": "<div><img alt=\"ARK Just A Pi\" class=\"attachment-medium size-medium wp-post-image\" height=\"443\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/08/ARK-Just-A-Pi-720x443.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>ARK Just A Pi is a tiny NDAA-compliant carrier board for the Raspberry Pi CM5 designed for drones, robots, or other space-constrained embedded applications that&#8217;s about the size of the Compute Module itself. This follows ARK Electronics&#8217; NDAA-compliant ARK Jetson Orin NX/Nano bundles introduced in 2024. The new &#8220;Just A Pi&#8221; is much smaller and lighter, features a built-in 100 Mbps Ethernet switch with two JST-GH Ethernet ports, a micro HDMI port, two MIPI CSI camera connectors, a microSD card slot, a PCIe FFC connector, a USB 3.0 Type-C dual role connector, and a range of small connectors for UART, SPI, PWM, GPIO, and fan. It also features a power connector for the company&#8217;s PAB power modules. ARK Just A Pi specifications: Supported SoM Raspberry Pi Compute Module 5 &#8211; Full support Raspberry Pi Compute Module 4 &#8211; The following interfaces are not supported: CSI1/CAM1, UART2, USB-C, PCIe, and fan [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/08/31/ark-just-a-pi-a-tiny-ndaa-compliant-raspberry-pi-cm5-carrier-board-for-drones-and-robots/\">ARK Just A Pi &#8211; A tiny NDAA-compliant Raspberry Pi CM5 carrier board for drones and robots<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "D-Robotics RDK S100P – A 128 TOPS alternative to NVIDIA Jetson Orin NX 16GB with Cortex-A78AE/R52+ cores", "source": "CNX Software", "date": "2026-08-31", "url": "https://www.cnx-software.com/2026/08/31/d-robotics-rdk-s100p-a-128-tops-alternative-to-nvidia-jetson-orin-nx-16gb-with-cortex-a78ae-r52-cores/", "summary": "<div><img alt=\"RDK S100P Development Kit\" class=\"attachment-medium size-medium wp-post-image\" height=\"480\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/08/RDK-S100P-Development-Kit-720x480.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>D-Robotics RDK S100P development kit is a robotics SBC built around an S100P-based module providing an alternative to NVIDIA Jetson Orin NX 16GB with a 6-core Cortex-A78AE application cluster, a 4-core Cortex-R52+ MCU domain, a Nash BPU rated at 128 TOPS INT8, a Mali-G78AE GPU, and 24 GB of LPDDR5. The four R52+ cores can be configured for reliable real-time control: two cores run in lockstep for safety, and the other two support split-lock operation. In practice, the A78AE CPU and BPU can handle Linux and vision processing, while the MCU handles time-critical tasks such as motor and sensor I/O. This can reduce the need for a separate real-time controller, although whether it eliminates one depends on the robot and its requirements. RDK S100P specifications: SoC – D-Robotics S100P CPU – 6x Arm Cortex-A78AE @ 2.0 GHz (safety-capable AE cores) MCU – 4x Arm Cortex-R52+ @ 1.2 GHz (1x DCLS [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/08/31/d-robotics-rdk-s100p-a-128-tops-alternative-to-nvidia-jetson-orin-nx-16gb-with-cortex-a78ae-r52-cores/\">D-Robotics RDK S100P &#8211; A 128 TOPS alternative to NVIDIA Jetson Orin NX 16GB with Cortex-A78AE/R52+ cores<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Orange Pi Zero 4 – Compact Allwinner A733 SBC offers HDMI, USB-C DP, GbE, WiFI 6, PCIe FFC connector for $26.5 and up", "source": "CNX Software", "date": "2026-08-31", "url": "https://www.cnx-software.com/2026/08/31/orange-pi-zero-4-allwinner-a733-sbc-offers-hdmi-usb-c-dp-gbe-wifi-6-pcie-ffc-connector/", "summary": "<div><img alt=\"Orange Pi Zero 4\" class=\"attachment-medium size-medium wp-post-image\" height=\"498\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/08/Orange-Pi-Zero-4-720x498.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Orange Pi Zero 4 is an affordable yet feature-rich Allwinner A733 single board computer (SBC) with up to 8GB RAM, eMMC/UFS storage footprint, a microSD card slot, and plenty of I/Os. The board packs mini HDMI and USB-C DisplayPort, Gigabit Ethernet, WiFi 6 and Bluetooth 5.4, two MIPI CSI camera connectors, a Raspberry Pi-style PCIe FFC connector, and two GPIO headers into a compact 55x50mm form factor. Orange Pi Zero 4 specifications: SoC – Allwinner A733 CPU Dual-core Arm Cortex-A76 @ up to 2.00 GHz Hexa-core Arm Cortex-A55 @ up to 1.79 GHz Single-core RISC-V E902 real-time core up to 200 MHz GPU – Imagination Technologies BXM-4-64 MC1 GPU with support for OpenGL ES 3.2, Vulkan 1.3, OpenCL 3.0 VPU 8Kp24 H.265/VP9/AVS2 decoding 4Kp30 H.265/H.264 encoding AI accelerator – 3 TOPS NPU System Memory – 1GB, 2GB, 4GB, 6GB, or 8GB LPDDR5/LPDDR4/LPDDR4x; note: 16GB is also listed in the specs, [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/08/31/orange-pi-zero-4-allwinner-a733-sbc-offers-hdmi-usb-c-dp-gbe-wifi-6-pcie-ffc-connector/\">Orange Pi Zero 4 &#8211; Compact Allwinner A733 SBC offers HDMI, USB-C DP, GbE, WiFI 6, PCIe FFC connector for $26.5 and up<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "SensiBel Launches 84-dBA SNR Optical MEMS Microphone", "source": "Embedded.com", "date": "2026-08-31", "url": "https://www.embedded.com/sensibel-launches-84-dba-snr-optical-mems-microphone/", "summary": "<p>SensiBel has introduced the SBM140B, an optical MEMS microphone designed to provide high-fidelity audio capture across a wide acoustic range. The company claims it is the first MEMS microphone to combine an 84-dBA signal-to-noise ratio (SNR) with a 146-dB sound pressure level (SPL) acoustic overload point (AOP), resulting in a specified dynamic range of 136 [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/sensibel-launches-84-dba-snr-optical-mems-microphone/\">SensiBel Launches 84-dBA SNR Optical MEMS Microphone<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "Building an Upgrade Path for Safety-Critical Aerospace Computing", "source": "Embedded.com", "date": "2026-08-31", "url": "https://www.embedded.com/building-an-upgrade-path-for-safety-critical-aerospace-computing/", "summary": "<p>Avionic systems are expected to operate for decades. But the processors inside them have much shorter lifecycles. This creates an expensive problem for avionics engineers because replacing the processor may also force changes to the surrounding computing hardware and software. For instance, advanced drones and autonomous aerial systems need more computing power for perception, sensor [...]<\/p>\n<p>The post <a href=\"https://www.embedded.com/building-an-upgrade-path-for-safety-critical-aerospace-computing/\">Building an Upgrade Path for Safety-Critical Aerospace Computing<\/a> appeared first on <a href=\"https://www.embedded.com\">Embedded<\/a>.<\/p>"}, {"title": "Fujitsu establishes cyber defense lifecycle strategy for AI era", "source": "EE Journal", "date": "2026-08-31", "url": "https://www.eejournal.com/industry_news/fujitsu-establishes-cyber-defense-lifecycle-strategy-for-ai-era/", "summary": "Fujitsu Limited today announced the establishment of a cybersecurity strategy to continuously evolve corporate cyber defense capabilities in response to the advancement of generative AI and the increasing complexity of enterprise systems. This strategy implements cybersecurity not merely as an operational measure after IT system construction, but as a cyber defense lifecycle that encompasses strategic &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/fujitsu-establishes-cyber-defense-lifecycle-strategy-for-ai-era/\">Read More &#8594;<span class=\"screen-reader-text\"> \"Fujitsu establishes cyber defense lifecycle strategy for AI era\"<\/span><\/a>"}, {"title": "Syslogic Announces New AI-Enabled Embedded Computers", "source": "EE Journal", "date": "2026-08-31", "url": "https://www.eejournal.com/industry_news/syslogic-announces-new-ai-enabled-embedded-computers/", "summary": "With the Jetson Orin Nano 2, NVIDIA is introducing the second generation of its compact edge AI module. The new SoM (system-on-module) delivers twice the inference performance of its predecessor while consuming 40 percent less power at the same performance level. Embedded computing specialist Syslogic is announcing several rugged embedded computers based on the Jetson &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/syslogic-announces-new-ai-enabled-embedded-computers/\">Read More &#8594;<span class=\"screen-reader-text\"> \"Syslogic Announces New AI-Enabled Embedded Computers\"<\/span><\/a>"}, {"title": "Aetina Launches MegaEdge AIP-RQ87 2U Edge AI System for Private LLMs, AI Agents and Intelligent Automation", "source": "EE Journal", "date": "2026-08-31", "url": "https://www.eejournal.com/industry_news/aetina-launches-megaedge-aip-rq87-2u-edge-ai-system-for-private-llms-ai-agents-and-intelligent-automation/", "summary": "Aetina Corporation, a leading provider of edge AI solutions and accelerator of edge AI infrastructure, today announced the launch of MegaEdge AIP-RQ87, a ready-to-deploy 2U edge agentic AI system designed to help enterprises and system integrators (SIs) rapidly implement AI agent, private LLM, RAG application, multimodal AI, and AI-driven intelligent automation. Powered by Intel® Core™ &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/aetina-launches-megaedge-aip-rq87-2u-edge-ai-system-for-private-llms-ai-agents-and-intelligent-automation/\">Read More &#8594;<span class=\"screen-reader-text\"> \"Aetina Launches MegaEdge AIP-RQ87 2U Edge AI System for Private LLMs, AI Agents and Intelligent Automation\"<\/span><\/a>"}, {"title": "Renesas Establishes Physical AI & Robotics Lab in Beijing to Accelerate Next-Generation Robotics Innovation", "source": "EE Journal", "date": "2026-08-31", "url": "https://www.eejournal.com/industry_news/renesas-establishes-physical-ai-robotics-lab-in-beijing-to-accelerate-next-generation-robotics-innovation/", "summary": "Renesas Electronics Corporation (TSE: 6723), a premier supplier of advanced semiconductor solutions, today announced the official opening of its Physical AI &#38; Robotics Lab in Beijing, China. The new dedicated facility will enable customers to demonstrate, validate and jointly develop next-generation robotic systems and serve as a hub for executing Renesas’ physical AI strategy from proof-of-concept to deployment at scale. &#8230; <a class=\"more-link\" href=\"https://www.eejournal.com/industry_news/renesas-establishes-physical-ai-robotics-lab-in-beijing-to-accelerate-next-generation-robotics-innovation/\">Read More &#8594;<span class=\"screen
