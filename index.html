end us your events<\/a> for inclusion.<\/p><h5><a href=\"https://2026.ieee-icra.org/\">ICRA 2026<\/a>: 1–5 June 2026, VIENNA<\/h5><h5><a href=\"https://roboticsconference.org/\">RSS 2026<\/a>: 13–17 July 2026, SYDNEY<\/h5><h5><a href=\"https://mrs.fel.cvut.cz/summer-school-2026/\">Summer School on Multi-Robot Systems<\/a>: 29 July–4 August 2026, PRAGUE<\/h5><h5><a href=\"https://actuate.foxglove.dev/\">Actuate 2026<\/a>: 18–19 August 2026, SAN FRANCISCO<\/h5><p>Enjoy today’s videos!<\/p><div class=\"horizontal-rule\"><\/div><div><span style=\"display: none;\"> <\/span><\/div><p class=\"rm-anchors\" id=\"nd-i4ynqeuy\">What is the right number of legs for a robot? Two? Four? No, the answer is obviously all of them. All of the legs.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://generalroboticslab.com/Argus\">Argus<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"mccv90sunby\">Sigh, yet another skill that I as a soccer-playing human should have but a robot has instead: the rabona.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://bostondynamics.com/products/atlas/\">Boston Dynamics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"p5lywik6oba\"><em>Robots are rapidly becoming part of our everyday lives, from drones and industrial machines to home assistants and humanoid robots. As their presence continues to grow, an important question arises: How can we choose the right robot—not only in terms of performance and cost but also in terms of sustainability? <\/em><em>This video introduces the Eco‑Score for Robots, a new approach to evaluating the environmental impact of robotic systems. Just as eco-labels help consumers make informed choices in other industries, the Robotics Eco‑Label provides a clear and transparent way to assess how sustainable a robot truly is.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://roboticsecolabel.com/\">Robotics EcoLabel<\/a> ]<\/p><p>Thanks, Bram!<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"w5iw60q526k\">Uh oh, <a href=\"https://spectrum.ieee.org/yale-variable-friction-robot-fingers\" target=\"_blank\">five-fingered hands<\/a>.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.agilityrobotics.com/\">Agility<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"tapvn-tqpx0\"><em>Robotic manipulation has come a long way since the 1990s. We’ve gone from the two-ball paddle <a href=\"https://spectrum.ieee.org/juggling-robots-get-fancier\" target=\"_blank\">juggling robot <\/a>to AthenaZero, who can juggle barehanded using onboard vision feedback. By moving away from task-specific passive end-effectors such as cups or paddles and using multifingered hands, it can transition between a wide range of patterns including cascade, half-shower, tennis, shower, and box.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>There needs to be a robot circus show already.<\/p><p>[ <a href=\"https://rai-inst.com/resources/blog/bimanual-robot-for-dynamic-manipulation/\">Robotics and AI Institute<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"qvdgu1-ykxy\">Zero legs. One hat. $13K.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.astribot.com/en\">Astribot<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"-lgo5xqgvko\"><em>From its elegant design to the advanced technology powering every step, Luna is more than a machine—it’s a leap into the future.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://limxdynamics.com/en/products/luna\">LimX Dynamics<\/a> ]<\/p><p>Thanks, Jinyan!<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"g3pvccv00um\">You got a quadrotor in my quadruped! No, you got a quadruped in my quadrotor!<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://engineering.ontariotechu.ca/mars/index.php\">MARS Laboratory<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"tmi_h-ct5pk\"><em>A human hand, a robot’s arm—together tracing circles of trust and precision. No missteps. No hesitation. Just pure, algorithmic grace.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.ubtrobot.com/en/humanoid/products/walker-c\">UBTECH<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"qlsj3p87a4a\">Low-gravity planetary exploration with a quadruped just looks like fun.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.autonomousrobotslab.com/\">Autonomous Robots Lab<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"xwjssgdd5no\">Here it is, that robot Kool-Aid that everyone seems to be drinking. Including me!<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://generalistai.com/\">Generalist<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"6-prnhfdyfw\">Don’t shoot Mini Pupper!<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://mangdang.store/products/mp2\">MangDang<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"ofnlnztcwm4\"><em>We show here the ARISTO (Anthropomorphic, Robotic, Integrated-Sensing, Tendon-Operated) Hand. Developed in collaboration with Sony Group Corporation, this research platform is engineered to address the complex requirements of manipulating small, thin, and fragile objects.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://sites.utexas.edu/hcrl/\">University of Texas Human Centered Robotics Lab<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"3vbk_jzmagu\">Okay, but did you really have to call it the T800?<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://en.engineai.com.cn/product-t800\">EngineAI<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"p15of1ktjt4\"><em>Moby shows what useful mobile manipulation looks like in the real world: picking up, carrying, and placing adaptable payloads. The video shows payload handling across increasing crate loads, including a 50.3-pound load, while maintaining balance, control, and mobility. This is the kind of capability that matters outside the lab—moving real objects, in real spaces, with practical reliability.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.noblemachines.ai/\">Noble Machines<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"dqyojl69xdk\"><em>What does it take to make a robot look human? Harvard SEAS students Hailey Block, Henry Tavistock, and Evan Crowley created “Hollow Minds,” a pair of animatronic heads capable of speaking, blinking, tracking movement, and displaying lifelike facial expressions.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://seas.harvard.edu/electrical-engineering/courses\">Harvard University<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"jeejj42tkqu\">The longevity here is impressive, but the obvious question here is why the heck you’d ever do this task with a bipedal humanoid robot. It also doesn’t seem to have any error recovery, which is obviously fixable, but highlights the fact that real humans are versatile and humanoid robots are not.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.figure.ai/\">Figure<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"ydf1vzbzrgy\"><em>Kacper Nowicki, CEO and cofounder of Nomagic, recently sat down for a deep dive into the “humanoid vs. purpose-built” debate during a panel discussion at the Web Summit in Vancouver 2026.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://nomagic.ai/\">Nomagic<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div>"}, {"title": "Video Friday: Atlas Versus a Fridge", "source": "IEEE Spectrum Robotics", "date": "2026-05-22", "url": "https://spectrum.ieee.org/video-friday-humanoid-robot-learning", "summary": "<img src=\"https://spectrum.ieee.org/media-library/bipedal-humanoid-robot-does-one-legged-spinning-kick-in-a-brightly-lit-industrial-workshop.gif?id=66779183&amp;width=1200&amp;height=400&amp;coordinates=0%2C92%2C0%2C92\" /><br /><br /><p><span>Video Friday is your weekly selection of awesome robotics videos, collected by your friends at <\/span><em>IEEE Spectrum<\/em><span> robotics. We also post a weekly calendar of upcoming robotics events for the next few months. Please <\/span><a href=\"mailto:automaton@ieee.org?subject=Robotics%20event%20suggestion%20for%20Video%20Friday\">send us your events<\/a><span> for inclusion.<\/span><\/p><h5><a href=\"https://2026.ieee-icra.org/\">ICRA 2026<\/a>: 1–5 June 2026, VIENNA<\/h5><h5><a href=\"https://roboticsconference.org/\">RSS 2026<\/a>: 13–17 July 2026, SYDNEY<\/h5><h5><a href=\"https://mrs.fel.cvut.cz/summer-school-2026/\">Summer School on Multi-Robot Systems<\/a>: 29 July–4 August 2026, PRAGUE<\/h5><h5><a href=\"https://actuate.foxglove.dev/\">Actuate 2026<\/a>: 18–19 August 2026, SAN FRANCISCO<\/h5><p>Enjoy today’s videos!<\/p><div class=\"horizontal-rule\"><\/div><div><span style=\"display: none;\"> <\/span><\/div><blockquote class=\"rm-anchors\" id=\"xkk5ze3fukq\"><em>Just months after its debut, Atlas is proving why it is the world’s most capable and dynamic humanoid robot, ready for real work. Lifting a mini-fridge is a feat of strength, but the true breakthrough is in the underlying reinforcement learning and controls systems. The robot is learning to navigate real world adaptability: handling heavy objects by bracing and accounting for the mass and inertia; using whole-body control, not just hands to maneuver; and demonstrating superhuman range of motion and balance. This marks a critical shift in robotics where humanoids move beyond the lab and into dynamic industrial settings.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>Watching Atlas move a fridge may be less impressive than whatever the heck it does at 4:10.<\/p><p>[ <a href=\"https://bostondynamics.com/blog/training-a-humanoid-robot-for-hard-work/\">Boston Dynamics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"p0okuedzdg0\"><em>SpikerBot is a robot you teach by wiring neurons, not writing code. Drag spiking neurons in the app, connect them to sensors and motors, then press play. It moves, reacts, and changes behavior based on the brain you built.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>Already funded on Kickstarter with a robot kit starting at US $219.<\/p><p>[ <a href=\"https://www.kickstarter.com/projects/backyardbrains/spikerbot-build-a-brain-create-a-creature\">Kickstarter<\/a> ] via [ <a href=\"https://backyardbrains.com/\">Backyard Brains<\/a> ]<\/p><p>Thanks, Greg!<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"32qhuslr0gm\"><em>Wheeled-legged robots, which have wheels at their feet and achieve high mobility by coordinating wheel drive and leg drive, have been developed. In this paper, we address the problem of how to draw out the potential task-execution capability of the legs by freeing them from the roles of locomotion through external body support.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://shin0805.github.io/wixus/\">WiXus<\/a> ] from [ <a href=\"http://www.jsk.t.u-tokyo.ac.jp/\" target=\"_blank\">JSK Robotics Laboratory<\/a> ] via [ <a href=\"https://2026.ieee-icra.org/\" target=\"_blank\">ICRA 2026<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"olpxfcg2ibs\">A very clever idea for electronics-free, multi-dimensional touch sensing.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.nature.com/articles/s41467-026-72497-3\">Nature Communications<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"b-a8tb8ttii\"><em>Using external voice commands, G1 is directly controlled to generate a wide range of actions in real time. This video was recorded in a single take, with on‑site audio recording.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://shop.unitree.com/products/unitree-g1\">Unitree<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"5kdmlpvqvhk\"><em>Hummingbirds are impressive flyers, and advancements in high-speed photography, instrumentation, and measurement techniques have revealed much about their aerodynamics, flight behaviors, and wing and body kinematics. However, comparatively less is known about their natural flight dynamics, which is the relationship among a bird’s flight velocities, the control actions of its wings, and the acceleration of the bird in flight. To investigate this, at the <a href=\"https://spectrum.ieee.org/fly-like-a-fly\" target=\"_blank\">Advanced Vertical Flight Laboratory<\/a> we have designed, built, and flight tested a biomimetic robotic hummingbird on which is implemented the same techniques for flight control as observed in hummingbirds.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://avfl.engr.tamu.edu/\">Advanced Vertical Flight Laboratory<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"k115trhcuby\">I guess if you’re going to make a <a href=\"https://spectrum.ieee.org/quadruped-robot-benchmark-barkour\" target=\"_blank\">robot dog<\/a>, it’s only fair to give it the ability to frolic in the water.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.magiclab.top/en/\">MagicLab<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"e7ojml_wo_u\"><em>The original automated layout robot—the one that showed up when the construction industry was pretty sure robots were lame and then proved otherwise. It has printed millions of square feet of layout across thousands of projects. It built an entire category of construction technology. The category of: Stuff That Actually Does Helpful Work on Real Jobsites. But FieldPrinter 2 is here. It’s faster, tougher, smaller, and smarter. So for FieldPrinter 1, it’s time. Time for a quiet retirement. A mug. Maybe a plaque... But nay, good knight! Thou shalt expire in a blaze of thunderous glory!!<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.dustyrobotics.com/\">Dusty Robotics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"cyx8fbk9jeg\">Here’s an interesting idea for an inflatable <a href=\"https://spectrum.ieee.org/foldable-monocopter-drone\" target=\"_blank\">monocopter drone<\/a>.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://airlab.sutd.edu.sg/\">AIRLAB<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"6hrgihba3ro\"><em>Meet the Lynx S10—a compact all-terrain robot built to deliver industry-grade performance in a lightweight form factor under 20kg.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.deeprobotics.cn/en\">DE Robotics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"amovyq3hfpm\"><em>Noble Machines builds general-purpose robots for heavy industry, supporting people with the most hazardous and physically demanding tasks. Attendees at <a href=\"https://spectrum.ieee.org/nvidia-groq-3\" target=\"_blank\">NVIDIA GTC 2026 <\/a>witnessed the power of autonomous industrial work with Noble Machines Moby.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.noblemachines.ai/\">Noble Machines<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"_ulzzrpmlok\">I’m sorry, but Lego bricks should be for humans only.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.limxdynamics.com/en/products/tron2\">LimX Dynamics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"l_yqaxoi_bs\">Need a robot that can go places? Huskies were around way before legged humanoids, and I bet they’ll be around way after, too.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://clearpathrobotics.com/husky-a300-unmanned-ground-vehicle-robot/\">Clearpath Robotics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"8mflnicbyve\">I know this little dude is just a research platform at Disney, but I still want one to be my friend.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://arxiv.org/abs/2605.15122\">Paper<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"l8owjwnnxug\"><em>In March 1982, General Motors announced a rapid and aggressive conversion to robotics. By 1990, GM wanted 14,000 robots in their factories doing everything from painting to welding to assembly. Nowadays, we dream of robots in the factories, doing everything end to end. In the dark. Lights out. Guess what? GM dreamed the same 40 years ago, and they spent an estimated US $60 billion to try to make it reality. In today’s video, we look at General Motors and their dreams of the automated, all-robot factory.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://asianometry.passport.online/\">Asianometry <\/a> ]<\/p><div class=\"horizontal-rule\"><\/div>"}, {"title": "Open-Source Software Is Starting to Help Robots Think", "source": "IEEE Spectrum Robotics", "date": "2026-05-21", "url": "https://spectrum.ieee.org/open-source-robot-ai-platforms", "summary": "<img src=\"https://spectrum.ieee.org/media-library/a-smiling-emoji-with-red-eyes-and-a-grey-face-resembling-a-robot.jpg?id=66750560&amp;width=1245&amp;height=700&amp;coordinates=0%2C187%2C0%2C188\" /><br /><br /><p>When a group of academics <a href=\"https://spectrum.ieee.org/open-source-robotics-hardware-research-and-innovation\" target=\"_self\">started making open-source robotics hardware<\/a>, a generation of roboticists got years of their lives back. Now, the bigger challenge is getting robots to think—and that’s starting to be open sourced too.<\/p><p>The shift is still early, but companies including Hugging Face, Nvidia, and Alibaba have all made significant bets on open-source robotics in the last two years, releasing tools and models aimed at the higher-level work of getting robots to reason, decide, and act. <\/p><p><span>The open source movement that accelerated other AI applications is now being applied to the problem of making robots smarter. <\/span> If these attempts to bring AI to robotics with open-source platforms succeed, the barrier to building a capable robot could fall as fast as the barrier to building an AI application did.<\/p><h2>The world ROS built<\/h2><p>Open-source robotics software has been around since the mid-1990s, with early projects like Carnegie Mellon University’s <a href=\"https://www.ri.cmu.edu/project/inter-process-communication-package/\" target=\"_blank\">Inter-Process Communication package<\/a> and the <a href=\"https://playerstage.sourceforge.net/\" target=\"_blank\">Player Project<\/a> in the early 2000s laying the groundwork. But these were often tied to specific research groups, and the field remained fragmented. <\/p><p>The Robot Operating System, ROS, <a href=\"https://spectrum.ieee.org/the-origin-story-of-ros-the-linux-of-robotics\" target=\"_self\">changed that when it made its debut<\/a> in 2007. By bundling tools and attracting more users, it became the de facto standard. The story of open-source robotics, in many ways, starts there. <\/p><p>Despite its name, ROS is not actually an operating system. Rather, it is a software framework that sits on top of Linux and handles robotic fundamentals like moving data between components, talking to hardware, building maps, planning paths, and supporting developer tools, such as data logging and visualization. Before ROS, every robotics team wrote that infrastructure themselves. It often took a year or two before a lab could get to the research it actually cared about. <\/p><p><a href=\"https://brian.gerkey.org/\" rel=\"noopener noreferrer\" target=\"_blank\">Brian Gerkey<\/a>, who helped build ROS in the mid-2000s, says he was drawn to the project because of how much open source had already changed the world, pointing out that nearly the entire internet <a href=\"https://www.hbs.edu/ris/Publication%20Files/24-038_51f8444f-502c-4139-8bf2-56eb4b65c58a.pdf\" rel=\"noopener noreferrer\" target=\"_blank\">is built on it<\/a>. <\/p><p>“I’m a tool builder, and I like to share everything as openly as I possibly can, because I think that’s where we get the most impact out of what we build,” says Gerkey, board chair of Open Robotics and now CTO at <a href=\"https://www.intrinsic.ai/\" rel=\"noopener noreferrer\" target=\"_blank\">Intrinsic<\/a>, a robotics and AI unit of Google.<\/p><p>As it was developing, the AI community largely took the same approach, sharing research, models, and data openly, and the field accelerated faster than almost anyone predicted. Now some of those same advancements are arriving in robotics.<\/p><h2>Open-source AI for robotics<\/h2><p>Computer vision, once a hard problem, has advanced dramatically in just a few years, says <a href=\"https://www.linkedin.com/in/spencermhuang/\" rel=\"noopener noreferrer\" target=\"_blank\">Spencer Huang<\/a>, Nvidia’s director of product for robotics. What once required significant expertise can now be done in a few lines of code. Simulation tools have become accurate enough to be useful for training, and access to the tooling that once required a specialized lab is now widely available, much of it open source.<\/p><p>“To get into robotics, you no longer need a Ph.D.,” he says. The result is a much larger pool of people who can contribute, and the field is starting to look less like a specialized discipline and more like a platform that anyone can build on.<\/p><p>Nvidia has built out an open-source robotics stack that covers the full development pipeline. Its <a href=\"https://www.nvidia.com/en-us/ai/cosmos/\" rel=\"noopener noreferrer\" target=\"_blank\">Cosmos world models<\/a> generate synthetic training data and simulate physical environments. Its <a href=\"https://huggingface.co/blog/nvidia/gr00t-n1-7\" rel=\"noopener noreferrer\" target=\"_blank\">GR00T models<\/a> give robots the ability to reason through and execute complex tasks. And its <a href=\"https://developer.nvidia.com/isaac\" rel=\"noopener noreferrer\" target=\"_blank\">Isaac frameworks<\/a> handle the orchestration that ties training, simulation, and deployment together. Not everyone needs to train the robots from scratch, Huang says, and most people probably shouldn’t.<\/p><p>“If you gate pre-training, the field just never grows,” he says. “We should be able to provide a high-quality, state-of-the-art pre-trained model that anyone can go and take and fine tune for their own purposes.”<\/p><p>All of Nvidia’s open-source models live on Hugging Face, the open-source AI platform that has become the default place to share models and datasets. <a href=\"https://huggingface.co/lerobot\" rel=\"noopener noreferrer\" target=\"_blank\">Hugging Face launched LeRobot<\/a>, a community platform for robotics AI, in May 2024. Since its launch, the number of robotics datasets on the platform grew from 1,145 at the end of 2024 to more than 58,000 today, making it the single largest dataset category on the hub.<\/p><p>Hugging Face has also moved into hardware, acquiring robotics company <a href=\"https://www.pollen-robotics.com/\" rel=\"noopener noreferrer\" target=\"_blank\">Pollen Robotics<\/a>. The acquisition came from a realization that software alone was not enough, according to <a href=\"https://www.linkedin.com/in/clementdelangue/\" rel=\"noopener noreferrer\" target=\"_blank\">Clement Delangue<\/a>, Hugging Face’s CEO. The goal, as with the software, was to bring more people in.<\/p><p>The contributors to LeRobot include the biggest names in the industry, academic labs, and hobbyists building robots in their spare time. For instance, earlier this year, Alibaba <a href=\"https://arxiv.org/abs/2602.14979v1\" rel=\"noopener noreferrer\" target=\"_blank\">released RynnBrain<\/a>, an open-source foundation model for physical AI that the company claims outperforms comparable offerings from Google and Nvidia on benchmarks. That diversity of projects, Delangue says, is important. <\/p><p>“It is not just one model or one dataset or one hardware,” he says. “It is a lot of small contributions that everyone can be part of.”<\/p><h2>Commercial incentives muddle the field<\/h2><p>The stakes, Delangue says, go beyond convenience. A world where only a few proprietary systems control the robots in people’s homes is a concerning one. “Having robots at home that you don’t really understand, that you don’t really control, that a few people in Silicon Valley control is a scary thought,” he says. “Open source gives an alternative path.”<\/p><p>But getting there is not straightforward. The open sourcing happening now looks different from what produced ROS, which emerged largely from academics pooling their work with no commercial stake in the outcome. The biggest contributors today are companies with clear business reasons to want more people building on their platforms. That’s not necessarily a bad thing, says <a href=\"https://engineering.oregonstate.edu/people/bill-smart\" rel=\"noopener noreferrer\" target=\"_blank\">Bill Smart<\/a>, a professor at Oregon State University, in Corvallis, who was part of the early open-source robotics community. But the incentives are worth being aware of.<\/p><p>He also worries that the lowered barrier to entry has a downside. Researchers coming from AI without a robotics background are sometimes solving problems the field already solved. A newcomer might spend a week training a neural network to move a robot’s hand from one point to another, unaware that the same task can be accomplished with a few lines of code using decades-old techniques. The incentives are not always pointing in the same direction as the progress.<\/p><p>Smart is not without hope though. Whatever the motives behind the open sourcing, he says, the effect is real. More people are in the field than ever before, the tools are genuinely easier to use, and the community is bigger and more diverse than anything that existed when ROS was getting started. <\/p><p>“Anyone can make a robot move now,” he says. “As an old tech guy, that makes me happy and sad, because I’m no longer special.”<\/p>"}, {"title": "The Future of Physical AI Isn’t Smarter Robots, It’s Smarter Interfaces", "source": "IEEE Spectrum Robotics", "date": "2026-05-21", "url": "https://spectrum.ieee.org/wetour-robotics-physical-ai-human-interfaces", "summary": "<img src=\"https://spectrum.ieee.org/media-library/hands-controlling-speaker-light-bulb-and-drone-against-minimalist-white-walls.jpg?id=66718902&amp;width=1245&amp;height=700&amp;coordinates=160%2C0%2C160%2C0\" /><br /><br /><p><em>This sponsored article is brought to you by <a href=\"https://wetourrobotics.com/\" target=\"_blank\">Wetour Robotics<\/a>.<\/em><\/p><p>A field technician on a wind turbine, harness clipped, both hands on a wrench, needs to send a command to the diagnostic device hanging at her belt. A logistics worker on a loading dock, gloves on, eyes on the pallet, needs to redirect a connected lift. A person using an assistive mobility device on a crowded street wants to nudge it forward without taking out a phone or speaking aloud. None of these moments call for a smarter robot. They call for a smarter way to be heard by the machines that already exist.<\/p><h2>The industry has been building from one side<\/h2><p>The past three years of Physical AI have been a story of remarkable progress on the robot side of the loop. Companies like Boston Dynamics, Figure, and Unitree have advanced actuators, locomotion, and dexterity to a level that would have seemed implausible a decade ago. Google DeepMind’s Gemini Robotics has redefined what vision-language-action models can do in unstructured settings. The trajectory of the hardware and the foundation models is real, and it is accelerating.<\/p><p>But there is another side to this loop, and it has been treated as a solved problem for too long. The interface between humans and machines has defaulted, for 40 years, to three input modalities: screens, buttons, and voice. Each of those assumes the user can stop, look down, and translate intent into structured commands. That assumption breaks the moment the work moves into a real environment. On a turbine. On a dock. On a sidewalk. In any setting where hands are occupied, eyes are committed, or speaking is impractical, the conventional interface stack quietly fails.<\/p><p class=\"pull-quote\">Spatial Intent Fusion is the simultaneous processing of three streams of human-centered information, namely spatial position, visual context, and gestural intent: Your body is the interface.<br /><\/p><p>The bottleneck on the human side of the loop is becoming as important as the one on the machine side. And solving it requires a different question. Not how do we make the robot more capable, but how do we let the human participate in the computing system as naturally as the robot already does.<\/p><h2>Wetour Robotics’ bet: put the human back into the computing loop<\/h2><p><a href=\"https://wetourrobotics.com/\" target=\"_blank\">Wetour Robotics<\/a> is betting that the next architectural leap in Physical AI is not about making the robot more capable. It is about making the human a first-class node in the computing network, with the same kind of low-latency, high-fidelity participation that connected devices already enjoy.<\/p><p>Wetour Robotics’ engineers frame the problem this way: a wristband that recognizes a gesture is not enough. A camera that recognizes a scene is not enough. The information a human carries about what they are about to do is distributed across multiple channels, including where their body is in space, what their eyes are attending to, and what their muscles are preparing to do, and any single channel observed in isolation is ambiguous. Reconstructing intent reliably means fusing those channels at the operating system level, with latency low enough that the loop feels closed rather than mediated.<\/p><p>This approach has a name. Wetour Robotics calls it Spatial Intent Fusion: the simultaneous processing of three streams of human-centered information, namely spatial position, visual context, and gestural intent, fused into a single real-time command for any connected physical device. It is the technical implementation behind a simpler positioning statement the company uses externally: your body is the interface.<\/p><p class=\"shortcode-media shortcode-media-rebelmouse-image\"> <img alt=\"Sleek silver rectangular electronic device labeled \\u201cORCHESTRA\\u201d on a light gray background.\" class=\"rm-shortcode\" id=\"1af08\" src=\"https://spectrum.ieee.org/media-library/sleek-silver-rectangular-electronic-device-labeled-u201corchestra-u201d-on-a-light-gray-background.png?id=66718892&amp;width=980\" /> <small class=\"image-media media-caption\">Orchestra is a portable intelligent hub running the operating system that handles sensor fusion, intent inference, command translation, and safety arbitration. The reference compute platform is NVIDIA Jetson Orin Nano Super, which provides enough on-device inference capacity to keep the entire control loop at the edge, with no cloud dependency on the critical path. <\/small><small class=\"image-media media-photo-credit\">Wetour Robotics<\/small><\/p><h2>The architecture: three layers, four engines, one loop<\/h2><p>Orchestra is not a single device but a layered platform, designed from the start to be sensor-flexible and actuator-agnostic. The architecture decomposes into three perception layers and four coordination engines.<\/p><p><strong>Orchestra<\/strong> itself is the local compute and orchestration core: a portable intelligent hub running the operating system that handles sensor fusion, intent inference, command translation, and safety arbitration. The reference compute platform is NVIDIA Jetson Orin Nano Super, which provides enough on-device inference capacity to keep the entire control loop at the edge, with no cloud dependency on the critical path. Edge inference is non-negotiable for this application. Full-chain latency from biosignal acquisition to actuator command is held under 100 milliseconds, the envelope inside which closed-loop control feels natural rather than laggy.<\/p><p><strong>VisionLink<\/strong> handles visual and spatial perception. Cameras feed into vision models that identify objects, estimate distances, and track environmental context. VisionLink is designed not as a passive recognition layer but as a real-time command generator: its outputs feed directly into Orchestra OS to be fused with biosignal data.<\/p><p><strong>Conductor<\/strong> is the biosignal pipeline. It ingests raw surface electromyographic (sEMG) data from a wrist-worn device, classifies temporal patterns into discrete gestures or continuous control signals, and outputs actuator commands. The technically interesting property of sEMG for this use case is that the signal precedes visible motion. Motor unit action potentials appear at the skin surface roughly 50 to 80 milliseconds before a finger completes the corresponding gesture. Wetour Robotics calls this property pre-motion intent sensing, and it is what allows Orchestra to anticipate user intent rather than react to it.<\/p><p>On top of the three perception layers, Orchestra OS runs four coordination engines. The <strong>Perception Engine<\/strong> ingests and normalizes raw sensor streams. The <strong>Intent Engine <\/strong>performs Spatial Intent Fusion across modalities, resolving what the user is trying to do given where they are, what they are looking at, and what their hand is signaling. The <strong>Orchestration Engine<\/strong> translates intent into device-specific command sequences for any connected actuator. The <strong>Safety Engine<\/strong> arbitrates conflicting commands, enforces operational envelopes, and gates execution against runtime safety conditions.<\/p><p class=\"shortcode-media shortcode-media-youtube\"> <span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><h2>The trade-offs we’re honest about<\/h2><p>No system that bridges the human body and the digital world is finished. Three engineering challenges remain open, and the company addresses each with a deliberate trade-off rather than a claim of having fully solved it.<\/p><p><strong>Baseline stability of sEMG under motion.<\/strong> In a stationary user, continuous gesture recognition from sEMG is reliable. Once the user is walking, climbing, or otherwise moving, motion artifacts and electrode drift degrade the signal in ways that are difficult to fully compensate for. Rather than overpromise on continuous control in dynamic settings, Orchestra defaults to a smaller set of robust discrete gestures in complex operating environments, and reserves continuous control modes for contexts where the signal-to-noise ratio supports them.<\/p><p><strong>Miniaturization of edge AI compute.<\/strong> Running the Orchestra control loop entirely at the edge requires real on-device inference, which has historically meant trading off between compute capacity, battery life, and form factor. Wetour Robotics’ approach has been a compact carrier board paired with a thermal design and a battery module sized for all-day wearability. The result is a hub that travels with the user rather than tethering them to a desk, and that performs the full perception-to-actuation loop without offloading to the cloud.<\/p><p><strong>Heterogeneity of third-party device protocols.<\/strong> The actuator side of the loop is a fragmented landscape. Different manufacturers expose different command interfaces, different communication stacks, and different safety conventions, and a Physical AI operating system has to integrate with all of them. Wetour Robotics uses an AI-agent layer to negotiate connection and protocol translation adaptively, so that Orchestra OS can ingest data from a wide range of devices, run them through neural network models that infer human intent, and emit the right command on the right protocol for the device on the other end.<\/p><h2>Why this matters, and why it helps the rest of the field<\/h2><p>The history of computing is a history of interface revolutions. Command lines gave way to graphical user interfaces, which gave way to touch, which gave way to voice. Each transition expanded who could participate in the system and what they could do with it. The next transition is not about a new screen or a new microphone. It is about treating the human body itself as a participant in the computing network, capable of contributing intent at the same speed and fidelity that any other connected node can.<\/p><p class=\"pull-quote\">The history of computing is a history of interface revolutions. The next transition is not about a new screen or a new microphone — it is about treating the human body itself as a participant in the computing network.<\/p><p>This path is not a competitor to the work being done on humanoid robots, foundation models for embodied AI, and dexterous manipulation. It is the missing complement to that work. The hardest open problem for humanoid systems is the data: every natural interaction between a human and the physical world is a potential training signal, and most of those interactions are currently invisible to any computing system. As more humans become first-class nodes in the loop, those interactions become observable, structured, and ultimately useful for training the next generation of embodied AI, including the humanoid robots being developed today.<\/p><p>In other words: putting the human back into the computing loop is not just about better interfaces for individual users. It is about generating the kind of grounded, in-the-wild human-machine interaction data that the broader Physical AI ecosystem will need to keep advancing. The robot side and the human side of the loop are not two competing futures. They are two halves of the same one.<\/p><p>That is what Wetour Robotics means when it says: <em>Your body is the interface.<\/em><\/p><p>Learn more at <a href=\"https://wetourrobotics.com/\" target=\"_blank\">wetourrobotics.com<\/a>.<\/p>"}, {"title": "Will Robotics Have a ChatGPT Moment?", "source": "IEEE Spectrum Robotics", "date": "2026-05-20", "url": "https://spectrum.ieee.org/robotics-ai-breakthrough", "summary": "<img src=\"https://spectrum.ieee.org/media-library/a-collection-of-5-robots-against-colored-backgrounds.jpg?id=66734221&amp;width=1245&amp;height=700&amp;coordinates=0%2C88%2C0%2C88\" /><br /><br /><p>Over the next few decades, billions of autonomous, AI-powered robots will work alongside people in factories, perform tedious tasks in warehouses, care for the elderly, <a href=\"https://spectrum.ieee.org/collections/darpa-subterranean-challenge/\" target=\"_blank\">assist in unsafe disaster areas<\/a>, deliver packages and food to our doorsteps, and eventually help out in our homes. Some will look like us, and many won’t. What is certain is that regardless of form factor, robots will all rely heavily on AI in order to deliver real-world value.<\/p><div class=\"rm-embed embed-media\"><\/div><p><span>In 2025, total investments in robotics companies reached <\/span><a href=\"https://www.cbinsights.com/research/report/venture-trends-2025/\" target=\"_blank\">a record US $40.7 billion, accounting for 9 percent of all venture funding<\/a><span>. The multibillion dollar question therefore is this: What will it take for AI-powered robots to begin to have a serious economic impact? Many of today’s robotics and AI companies are making bold claims, such as that humanoid robots will <\/span><a href=\"https://www.1x.tech/\" target=\"_blank\">soon be coming into our homes<\/a><span>, but there’s still a big gap between promise and reality.<\/span><\/p><p><span><\/span><span>The promise of robots that live and work alongside us has been the stuff of science fiction for a very long time. And while many programmers have tried to make that promise a reality, the physical world is just too complicated for traditional computer programs to handle the endless complexity it presents. Thanks to AI, robots are no longer being programmed—instead, they learn to operate in the real world. With enough practice, they can learn to perceive and understand the world around them, reason about that world, and use that reason and understanding to perform tasks that are useful, reliable, and safe.<\/span><\/p><p>The two of us have worked at the forefront of AI and robotics for the last decade, as a <a href=\"https://engineering.oregonstate.edu/people/jonathan-hurst\" target=\"_blank\">Professor in Robotics at Oregon State University<\/a> and <a href=\"https://www.agilityrobotics.com/about/leadership\" target=\"_blank\">Co-Founder of Agility Robotics<\/a>, and as <a href=\"https://www.linkedin.com/in/hanspeter/\" rel=\"noopener noreferrer\" target=\"_blank\">former CEO<\/a> of the <a href=\"https://everydayrobots.ai/\" rel=\"noopener noreferrer\" target=\"_blank\">Everyday Robots moonshot at Google X<\/a>. Our experience deploying AI-powered robots in real-world settings has given us a perspective on where AI can be used to great benefit in complex robotic systems in the near term and where we are still on the frontier of science fiction. We believe AI will enable an inflection point in robotics advances, but that it will be through the well-engineered application of coordinated systems of different AI tools rather than a single ChatGPT-style breakthrough.<\/p><p>As the excitement around AI is matched only by the uncertainty of what will be possible, here are five hard truths that will define AI in robotics.<\/p><h2>1. The YouTube-to-Reality Gap Is Real<\/h2><p>For years, we have been seeing videos on YouTube with humanoid robots performing amazing moves on everything from a dance floor to an obstacle course. The inside knowledge in robotics is to “never trust a YouTube robot video.” The gap between real robots that can perform real work in unstructured human environments and carefully scripted and edited robot performances remains significant. The latest performance to get a lot of attention was a <a href=\"https://www.youtube.com/watch?v=mUmlv814aJo\" rel=\"noopener noreferrer\" target=\"_blank\">martial arts show<\/a> featuring Unitree humanoid robots performing with children at the Chinese 2026 Spring Festival Gala. While impressive, this falls into a long lineage of tightly scripted robotic performances, where everything has been carefully choreographed and planned in advance. The low-level controls, synchronization, and choreography were stunning, yet the Spring Gala robot performance showed a level of autonomy and intelligence much closer to industrial robots building cars in a factory than something that will show up in your living room any time soon. <\/p><p class=\"shortcode-media shortcode-media-youtube\"> <span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span> <\/p><p><span>Seeing these kinds of demos nevertheless raises questions about where robotics really is. If robots can perform kung fu moves and do backflips and dance, why aren’t they also showing up on factory floors yet? And why can’t they do the dishes in my home after dinner? The simple answer is this: Making AI-powered robots capable of performing general tasks in varied human environments is still <\/span><em><em>really<\/em><\/em><span> hard. While impressive technological feats like those at the Spring Festival may make it look like we could be very close, the use of AI in these demos is only for low-level motor control (to keep the robots from falling over) and therefore is only a small part of the solution for robots to be general purpose in the real, unstructured spaces where we humans live and work.<\/span><\/p><h2>2. Data Is An Unsolved Challenge<\/h2><p>Large Language Models (LLMs) like OpenAI’s ChatGPT and Anthropic’s Claude were initially trained on an internet-scale database of text. The world woke up one day in late 2022 to ChatGPT demonstrating that AI computers could suddenly “speak” to us in prose or verse and about seemingly any topic. LLMs have turned out to generalize well and are now able to take multimodal input (text, images, video) and produce multimodal output. Importantly, the corpus of training data was both enormous and human-generated, which are characteristics that form the gold standard for AI training.<\/p><p class=\"shortcode-media shortcode-media-rebelmouse-image rm-float-left rm-resized-container rm-resized-container-25\" style=\"float: left;\"> <img alt=\"A series of four images, including robots working in a contained factory space, in an open indoor factory, outdoors in the real world delivering a package, and working with a human to move a couch in an apartment.\" class=\"rm-shortcode\" id=\"a0903\" src=\"https://spectrum.ieee.org/media-library/a-series-of-four-images-including-robots-working-in-a-contained-factory-space-in-an-open-indoor-factory-outdoors-in-the-real.jpg?id=66734272&amp;width=980\" /> <small class=\"image-media media-caption\">The fastest path to robots as part of everyday life may emerge through a range of robot forms performing increasingly sophisticated applications and employing a range of AI tools.<\/small><small class=\"image-media media-photo-credit\">Agility Robotics<\/small><\/p><p>Giving AI a body (in the form of a robot), so that it can engage with people in the physical world, continues to be a very difficult and broadly unsolved problem. AI models for general-purpose robotics must simultaneously satisfy multiple, often conflicting, physical, geometric, and temporal limitations while operating in unstructured, dynamic environments. In order to generalize, robot models need to be trained on data gathered in a high-dimensional configuration space, where “dimensions” represent text, lighting conditions, degrees of freedom, joint limits, velocities, force, and safety boundaries, just to mention a few. Importantly, this must be <em><em>good<\/em><\/em> data—it must contain many examples from what amounts to an infinite number of possible configurations in the physical world.<\/p><p>Since there are very few existing sources of data like this, approaches like teleoperation, video analysis, motion capture of humans, and self-exploration in simulation and in the real world are all seen as important ways to collect data. It’s a herculean task. For example, at Everyday Robots at Google X, we ran 240 million robot instances in our simulator over the course of 2022 to collect training data, mostly to train a trash-sorting model. Similar amounts of data will be needed for every skill to get to a similar level of capability, which is not yet human level.<\/p><h2>3. There Will Be No Single Robot AI<\/h2><p>We are far away from a moment where a single AI model might allow general-purpose robots to live and work alongside us. <\/p><p>General-purpose robots can have wheels or legs. They can have one, two, three, or more arms. Some have propellers and can fly, while others may be designed to operate under water. Some will drive on busy roads. The physical world is infinitely varied and complex. And then there are all the people and other animals that will be surrounding the robots. How do you train a model to operate a robot safely and reliably in all of these settings? The simple answer is: You don’t. At least not for quite some time.<\/p><p>We believe the winning AI architecture leading to the next big breakthroughs in general-purpose robotics will be “agentic AI” for robots, which are high-level coordinating models that can reason, plan, use tools, and learn from outcomes to execute complex tasks with limited supervision. Agentic, high-level models running on robots will invoke a system of specialized ones for different types of tasks. We will likely soon see multiple robots collaborating and coordinating with each other through their onboard agentic AI models.<\/p><p>AI tools are unlocking new and powerful capabilities in robotics, which in turn will enable new solutions and new markets. It’s encouraging to see these new models being made broadly available, some even as open-source solutions. This availability is akin to what happened with the internet: Real progress occurred when it became ubiquitous. We anticipate an inevitable democratization of complex behaviors in robotics with wide access to these AI tools and technologies.<\/p><h2>4. Hardware Is Still Very Hard<\/h2><p>Robots are complex systems with many parts that all need to work together with great precision. For a robot to be useful and safe, every part of it must be coordinated, from its perception systems to the computer controlling it, all the way down to its individual actuators.<\/p><p>Actuators—that is, the motors and gears—are a good example of an important part of the robot where what got us here won’t get us there. The actuators used at scale by most industrial robots will not work for robots that will operate in human environments. If these robots accidentally collide with an obstacle, the resulting impacts are harsh, forces are high, and things break. Humans don’t move in this way. We are far more compliant in how we interact with the world, and we’re constantly making contact with our environment and using that contact to help us accomplish things. <\/p><p>Consider the challenge of inserting a key in a lock: Humans typically don’t do this by aligning the key perfectly with the keyhole. Instead, we just feel for the edge of the keyhole and jiggle the key in. Robots need to be able to operate in novel ways to achieve comparable capabilities by using a new class of actuators that are sensitive to force and able to have a compliant interaction with the environment. While these kinds of actuators do exist, they are not yet generally available at scale for robot systems designed to operate around people.<\/p><h2>5. Real Value Comes From “Easy” Tasks<\/h2><p>There’s a big difference between tasks that look impressive and real-world tasks that provide value. Robotics is a perfect example of <a href=\"https://en.wikipedia.org/wiki/Moravec%27s_paradox\" target=\"_blank\">Moravec’s paradox<\/a>, which states that tasks that are hard for humans are easy for computers (like multiplying two big numbers), and tasks easy for humans (like a toddler’s movements) are extremely difficult for computers and robots.<\/p><p>Serving customers is an unforgiving reality check, because customers only care about solving the real problems they have. If we are to deploy AI-based robot solutions, they must outperform the way things are currently done while demonstrating reliable performance metrics and safety. Agility Robotics’ early work to deploy our humanoid robot Digit in customer locations led to the realization that our first obstacle was safety: Robots that balance and manipulate objects in human spaces bring new types of risk to the workplace. In the first <a href=\"https://www.youtube.com/watch?v=AJpTpUqjgrY\" target=\"_blank\">humanoid deployments<\/a>, physical barriers were necessary, and Agility kicked off a multi-year engineering effort to solve the safety challenge, touching nearly every aspect of robot design and relying heavily on new AI-based approaches to human detection and behavior control.<\/p><p class=\"shortcode-media shortcode-media-youtube\"> <span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span> <\/p><p><a href=\"https://everydayrobots.ai/vision\" target=\"_blank\">Everyday Robots<\/a> at Google deployed robots in 2019 that worked autonomously in office buildings doing chores like cleaning cafe tables and sorting trash. We quickly learned how “messy” and difficult the real world is for a robot. This experience informed the architecture and deployment of our AI systems while also gathering real-world data that could be combined with simulation data for training and improving models.<\/p><p>This focus on creating a product to meet specific customer needs and deploying robots in real-world settings is the only way to inform the structure of the AI tools and infrastructure for near-term utility on a path towards long-term broader capability and generality. There will be no “aha” moment, no silver bullet algorithm, and no volume of data sufficient to produce a general-purpose robot without extensive real-world experience. <\/p><h2>AI Robots Are Coming, One Step at a Time<\/h2>As we look to the future, there is no doubt that the world is bringing AI into the physical world through robots. We are at the beginning of a “<a href=\"https://spectrum.ieee.org/is-a-cambrian-explosion-coming-for-robotics\" target=\"_self\">Cambrian explosion<\/a>“ of useful, intelligent machines. We believe AI is not one tool, but a huge frontier of technical approaches that is unlocking new capabilities so powerful, they will define our economy moving forward. This will happen not in one single definitive moment, but as an ongoing set of small and large breakthroughs, where AI-driven robots begin to provide real value in a few tasks, and then a few more, with impacts unfolding across numerous $100 billion-plus markets that will dramatically improve the quality of our lives."}], "roboticsNews": [{"title": "AGIBOT to explain how to scale humanoids from the lab to the real world at RoboBusiness", "source": "Robotics Business Review", "date": "2026-09-09", "url": "https://www.therobotreport.com/agibot-share-plans-scale-humanoids-from-lab-to-real-world-at-robobusiness/", "summary": "<p>AGIBOT plans to give attendees actionable insights on identifying high-value robotics use cases and building sustainable developer ecosystems.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/agibot-share-plans-scale-humanoids-from-lab-to-real-world-at-robobusiness/\">AGIBOT to explain how to scale humanoids from the lab to the real world at RoboBusiness<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Vention opens Physical AI Lab for manufacturing in Montreal", "source": "Robotics Business Review", "date": "2026-09-09", "url": "https://www.therobotreport.com/vention-opens-physical-ai-lab-manufacturing-montreal/", "summary": "<p>Vention's new Physical AI Lab will focus on advancing robotic manipulation from research to scalable production-line deployment.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/vention-opens-physical-ai-lab-manufacturing-montreal/\">Vention opens Physical AI Lab for manufacturing in Montreal<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Unitree shares down 53% from IPO debut", "source": "Robotics Business Review", "date": "2026-09-09", "url": "https://www.therobotreport.com/unitree-shares-down-53-from-ipo-debut/", "summary": "<p>The market is pulling back on Unitree's $66 billion valuation from its debut on the Shanghai Stock Exchange just last month.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/unitree-shares-down-53-from-ipo-debut/\">Unitree shares down 53% from IPO debut<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "What bricklaying has taught Monumental about robots in construction", "source": "Robotics Business Review", "date": "2026-09-09", "url": "https://www.therobotreport.com/what-bricklaying-has-taught-monumental-about-robots-construction/", "summary": "<p>The construction industry is rife with opportunity for robotics, but the technology hasn't broken in at scale yet. <\/p>\n<p>The post <a href=\"https://www.therobotreport.com/what-bricklaying-has-taught-monumental-about-robots-construction/\">What bricklaying has taught Monumental about robots in construction<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Why vision AI is the safety backbone of the automated job site", "source": "Robotics Business Review", "date": "2026-09-08", "url": "https://www.therobotreport.com/why-vision-ai-is-safety-backbone-of-automated-job-site/", "summary": "<p>Vision AI doesn't replace robots or human judgement; it provides the continuous perception that allows both to operate safely together.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/why-vision-ai-is-safety-backbone-of-automated-job-site/\">Why vision AI is the safety backbone of the automated job site<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Boston Dynamics veteran launches Dynamic Creatures to bring characters to life with robotics", "source": "Robotics Business Review", "date": "2026-09-08", "url": "https://www.therobotreport.com/boston-dynamics-veterans-launch-dynamic-creatures-to-bring-characters-to-life-with-robotics/", "summary": "<p>Dynamic Creatures plants to create its own line of characters, and to re-create characters for specific brands and environments.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/boston-dynamics-veterans-launch-dynamic-creatures-to-bring-characters-to-life-with-robotics/\">Boston Dynamics veteran launches Dynamic Creatures to bring characters to life with robotics<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "AI can’t outrun a humanoid’s hardware", "source": "Robotics Business Review", "date": "2026-09-08", "url": "https://www.therobotreport.com/ai-cant-outrun-a-humanoids-hardware/", "summary": "<p>The remarkable progress in AI has brought robotics closer to machines capable of determining what they should do. The next major advance may depend on whether their physical systems can execute those decisions efficiently, precisely and safely.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/ai-cant-outrun-a-humanoids-hardware/\">AI can’t outrun a humanoid&#8217;s hardware<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "This Robot Will Draw Your Blood Now", "source": "IEEE Spectrum Robotics", "date": "2026-09-07", "url": "https://spectrum.ieee.org/blood-draw-robot-vitestro-aletta", "summary": "<img src=\"https://spectrum.ieee.org/media-library/an-older-silver-haired-woman-seated-at-automated-medical-device-with-a-robotic-arm-drawing-blood.jpg?id=67726417&amp;width=1245&amp;height=700&amp;coordinates=0%2C187%2C0%2C188\" /><br /><br /><p>You sit down and put your arm in the cradle. You press a button. The machine takes it from there.<\/p><p>A <a href=\"https://spectrum.ieee.org/tag/near-infrared-light\" target=\"_self\">near-infrared light<\/a> sweeps your inner elbow, hunting for a vein. A puff of alcohol hits your skin. An <a href=\"https://spectrum.ieee.org/tag/ultrasound\" target=\"_self\">ultrasound<\/a> probe glides across your arm, mapping how deep the vessel runs and which way it bends. Doppler captures the direction of blood flow to rule out the artery.<\/p><p>The cuff tightens around your upper arm. The needle comes down and pierces the skin. Your blood flows into the collection tubes, each one tipped end over end nine times—no more, no less. The needle withdraws. You get a bandage. No human ever touched you.<\/p><p>This is what it’s like to have blood taken by <a href=\"https://vitestro.com/aletta/\" rel=\"noopener noreferrer\" target=\"_blank\">Aletta<\/a>, the first <a href=\"https://spectrum.ieee.org/profile-veebot\" target=\"_self\">autonomous blood-draw device<\/a> authorized for use in the United States. Developed by the Dutch medical robotics firm <a href=\"https://vitestro.com/\" rel=\"noopener noreferrer\" target=\"_blank\">Vitestro<\/a>, the system combines imaging technologies with advanced robotics and AI to do by algorithm what a human phlebotomist—a trained health care professional who finds veins and draws blood by hand—does by feel.<\/p><p>The U.S. Food and Drug Administration <a href=\"https://www.fda.gov/news-events/press-announcements/fda-authorizes-first-its-kind-robotic-blood-draw-device\" rel=\"noopener noreferrer\" target=\"_blank\">gave Aletta the go-ahead<\/a> on 19 August for use on adults in nonhospitalized settings. The decision follows the lead of European regulators, who <a href=\"https://www.prnewswire.com/news-releases/vitestro-achieves-ce-marking-for-autonomous-blood-drawing-device-302231939.html\" rel=\"noopener noreferrer\" target=\"_blank\">authorized the device two years earlier<\/a>.<\/p><p>“You have to tip your cap to them,” says <a href=\"https://www.linkedin.com/in/maxbalter/\" rel=\"noopener noreferrer\" target=\"_blank\">Max Balter<\/a>, a surgical-robotics specialist at Medtronic who <a href=\"https://ieeexplore.ieee.org/document/7169572\" rel=\"noopener noreferrer\" target=\"_blank\">worked<\/a> on <a href=\"https://ieeexplore.ieee.org/document/7457657\" rel=\"noopener noreferrer\" target=\"_blank\">autonomous<\/a> blood-draw <a href=\"https://www.worldscientific.com/doi/10.1142/S2339547819500067\" rel=\"noopener noreferrer\" target=\"_blank\">systems<\/a> during grad school in the mid-2010s. “The engineering that they have is incredible…and with their FDA clearance, it moves the whole industry forward.”<\/p><h2>Aletta Boosts Lab Capacity Amid Shortages<\/h2><p>In a clinical trial involving more than 1,600 people in the Netherlands, Aletta successfully drew blood on the first attempt in <a href=\"https://doi.org/10.1093/clinchem/hvag029\" rel=\"noopener noreferrer\" target=\"_blank\">94.5 percent of cases<\/a>, even among those with hard-to-access veins, people with obesity, and the elderly. When Aletta failed to identify a suitable vein, the patient was referred for conventional phlebotomy.<\/p><p>“It’s exceptional performance,” says <a href=\"https://medicine.yale.edu/profile/joe-el-khoury/\" rel=\"noopener noreferrer\" target=\"_blank\">Joe El-Khoury<\/a>, a clinical chemist at Yale who was not involved in the Dutch trial. “It’s definitely as good if not better” than a typical professional phlebotomist.<\/p><p>Complications were minimal, with multiple built-in safeguards to detect problems, such as sensors that track arm movement and needle position, and to halt the process should something go awry. And for those whose veins proved too challenging, a phlebotomist remains on hand to take over when needed.<\/p><p>Notably, because a single phlebotomist can supervise up to three Aletta machines, the system should go a long way toward “helping clinical labs address the critical operational challenges related to the staffing shortages of phlebotomists,” says <a href=\"https://www.linkedin.com/in/luuk-giesen/\" rel=\"noopener noreferrer\" target=\"_blank\">Luuk Giesen<\/a>, chief medical officer of Vitestro.<\/p><p>That’s no small challenge in a profession with a <a href=\"https://aplm.kglmeridian.com/doi/10.5858/arpa.2019-0140-CP\" rel=\"noopener noreferrer\" target=\"_blank\">median annual turnover rate of nearly 25 percent<\/a> and a <a href=\"https://academic.oup.com/ajcp/article/164/5/759/8267738\" rel=\"noopener noreferrer\" target=\"_blank\">vacancy rate of close to 10 percent<\/a>, according to surveys of medical laboratories that draw mostly from U.S. institutions. The resulting staffing shortages can limit labs’ capacity to meet demand for routine diagnostic testing of blood counts, cholesterol, metabolic markers, and more. Aletta could address that bottleneck.<\/p><h2>Addressing Skin Tone Bias in Blood Draw AI<\/h2><p>The promise of greater capacity, however, comes with a caveat: Aletta still fails in roughly one case out of 20. Who are those people?<\/p><p>Some may simply have elusive or unusually deep veins. But a more significant obstacle could be skin pigmentation. In particular, the melanin in darker skin can interfere with the near-infrared light Aletta uses to first map the veins near the skin’s surface and identify promising puncture sites. The technique relies on hemoglobin absorbing the light differently from surrounding tissue, and darker skin tones can absorb more of that light before it reaches the camera, thereby reducing the contrast.<\/p><p class=\"shortcode-media shortcode-media-rebelmouse-image\"> <img alt=\"A smiling dark skinned woman holds a bandaid onto her arm while sitting next to a large machine.\" class=\"rm-shortcode\" id=\"9138e\" src=\"https://spectrum.ieee.org/media-library/a-smiling-dark-skinned-woman-holds-a-bandaid-onto-her-arm-while-sitting-next-to-a-large-machine.jpg?id=67726420&amp;width=980\" /> <small class=\"image-media media-caption\">Some experts have raised concerns that Aletta’s infrared sensors will perform poorly for people with darker skin tones, but Vitestro says that its machine also includes an ultrasound sensor, in part to mitigate that risk.<\/small><small class=\"image-media media-photo-credit\">Vitestro<\/small><\/p><p>Giesen recognizes that the issue could affect first-pass imaging, but notes that the main determinant of vein selection and needle placement is the ultrasound system, which relies on sound rather than light and should not be affected by skin pigmentation in the same way. “Ultrasound is skin-tone agnostic,” he says, adding that Vitestro has unpublished data showing no effect of skin tone on the system’s performance.<\/p><p>The company thus <a href=\"https://vitestro.com/aletta/patients/\" target=\"_blank\">claims on its website<\/a> that the “technology works well for all skin tones,” an assertion <a href=\"https://www.fda.gov/news-events/press-announcements/fda-authorizes-first-its-kind-robotic-blood-draw-device\" rel=\"noopener noreferrer\" target=\"_blank\">echoed in the FDA press release<\/a> announcing the authorization of Vitestro’s device.<\/p><p>But given the history of racial disparities in medical devices—particularly optical technologies such as pulse oximeters, which can be <a href=\"https://spectrum.ieee.org/pulse-oximeters-encode-racial-bias-with-clear-consequences-for-covid-19-patients\" target=\"_self\">less accurate in people with darker skin<\/a> and went largely unrecognized as a problem for decades—such claims warrant evidence, says El-Khoury, who has <a href=\"https://academic.oup.com/clinchem/article-lookup/doi/10.1093/clinchem/hvag045\" rel=\"noopener noreferrer\" target=\"_blank\">written about the issue<\/a>.<\/p><p><a href=\"https://www.mayoclinic.org/biographies/katzman-brooke-m-ph-d/bio-20514695\" rel=\"noopener noreferrer\" target=\"_blank\">Brooke Katzman<\/a>, a clinical chemist at the Mayo Clinic who is collaborating with Vitestro, also wants more evidence that samples collected by the robot are as suitable for testing as those drawn by hand.<\/p><p>The Dutch trial reported little damage to red blood cells, but other measures of sample quality, including clotted tubes, insufficient blood, and proper tube filling, still need to be assessed, as do the results of routine laboratory tests themselves. Katzman plans to launch a U.S.-based trial next year to collect just that sort of data.<\/p><p>“We’re going to do our due diligence,” she says. “Like any instrument we would bring into the lab, we’re going to put it through its paces before using it clinically.”<\/p><h2>The Future of Automated Blood Testing<\/h2><p>Aletta takes its name from the 19th-century physician <a href=\"https://pmc.ncbi.nlm.nih.gov/articles/PMC11151697/\" rel=\"noopener noreferrer\" target=\"_blank\">Aletta Jacobs<\/a>, the first female doctor in the Netherlands and founder of what is widely considered the world’s first birth-control clinic.<\/p><p>That nod to history is fitting for a technology that builds on decades of research in robotic phlebotomy by groups in <a href=\"https://ieeexplore.ieee.org/document/826854/\" rel=\"noopener noreferrer\" target=\"_blank\">Europe<\/a>, the <a href=\"https://www.researchgate.net/publication/309480332_Robotic_Assistive_Device_for_Phlebotomy\" rel=\"noopener noreferrer\" target=\"_blank\">United States<\/a>, and <a href=\"https://haoyangli16.github.io/pdf/venibot.pdf\" rel=\"noopener noreferrer\" target=\"_blank\">China<\/a>, and <a href=\"https://doi.org/10.3389/fmed.2023.1251963\" rel=\"noopener noreferrer\" target=\"_blank\">MagicNurse<\/a>. Yet few pushed the concept as far as biomedical engineer <a href=\"https://bme.rutgers.edu/martin-l-yarmush\" rel=\"noopener noreferrer\" target=\"_blank\">Martin Yarmush<\/a> of Rutgers University in New Jersey, in whose lab Medtronic’s Balter completed his Ph.D.<\/p><p>In one version of their platform, the Rutgers team even <a href=\"https://ieeexplore.ieee.org/document/7759102/\" rel=\"noopener noreferrer\" target=\"_blank\">coupled their robot to a benchtop blood analyzer<\/a>, allowing it to draw samples and then measure levels of infection-fighting immune cells and oxygen-carrying red blood cells—all within minutes.<\/p><p>That all-in system never made it out of laboratory testing. And VascuLogic, the company spun out to commercialize the platform, is long defunct—though others, including <a href=\"https://rophai.net/\" rel=\"noopener noreferrer\" target=\"_blank\">ROPHAI<\/a>, <a href=\"https://bhealthcare.com/\" rel=\"noopener noreferrer\" target=\"_blank\">BHealthCare<\/a>, and <a href=\"https://doi.org/10.3389/fmed.2023.1251963\" rel=\"noopener noreferrer\" target=\"_blank\">MagicNurse<\/a>, continue to work in the space. But the Rutgers proof-of-concept demonstration points toward the tantalizing possibility of fully automated blood testing at the point of care, with robots handling everything from the needle stick to the analysis.<\/p><p>It is, in some ways, the promise that Theranos made—but built on conventional, validated laboratory technology rather than the <a href=\"https://www.goodreads.com/en/book/show/37976541-bad-blood\" rel=\"noopener noreferrer\" target=\"_blank\">dubious science and deception<\/a> that brought that particular company down.<\/p><p>“I have no doubt that is the future,” says <a href=\"https://www.feinberg.northwestern.edu/faculty-profiles/az/profile.html?xid=22300\" rel=\"noopener noreferrer\" target=\"_blank\">Gregory Retzinger<\/a>, a clinical pathologist at the Northwestern University Feinberg School of Medicine, in Chicago, who <a href=\"https://vitestro.com/news/northwestern-medicine-and-vitestro-collaborate-to-advance-autonomous-robotic-phlebotomy/\" rel=\"noopener noreferrer\" target=\"_blank\">collaborates with Vitestro<\/a> and has tried the Aletta device himself. (“It was painless, it was fast,” he says.)<\/p><p>For now, Giesen says Vitestro is keeping its ambitions—and its machine—focused on the blood-collection process itself, though he believes Aletta could ultimately do far more. The company plans to launch Aletta in Europe next year, with the U.S. market to follow. <\/p>"}, {"title": "Inbolt to discuss physical AI’s deployment problem at RoboBusiness", "source": "Robotics Business Review", "date": "2026-09-07", "url": "https://www.therobotreport.com/inbolt-ceo-to-discuss-physical-ais-deployment-problem-at-robobusiness/", "summary": "<p>Rudy Cohen, the co-founder and CEO of Inbolt, will reframe where physical AI pays off at RoboBusiness this fall.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/inbolt-ceo-to-discuss-physical-ais-deployment-problem-at-robobusiness/\">Inbolt to discuss physical AI&#8217;s deployment problem at RoboBusiness<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Agility Robotics reports $1.8M revenue ahead of humanoid SPAC", "source": "Robotics Business Review", "date": "2026-09-07", "url": "https://www.therobotreport.com/agility-robotics-reports-18m-revenue-ahead-of-humanoid-spac/", "summary": "<p>Agility Robotics’ S-4 filing reveals $1.8 million in 2025 revenue, a $140 million operating loss and plans to scale its Digit humanoid robot business.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/agility-robotics-reports-18m-revenue-ahead-of-humanoid-spac/\">Agility Robotics reports $1.8M revenue ahead of humanoid SPAC<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "MassRobotics shares member survey results around FCC restrictions", "source": "Robotics Business Review", "date": "2026-09-07", "url": "https://www.therobotreport.com/massrobotics-shares-member-survey-results-around-fcc-restrictions/", "summary": "<p>MassRobotics has found that companies were split on the FCC ban on new foreign-produced mobile robots.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/massrobotics-shares-member-survey-results-around-fcc-restrictions/\">MassRobotics shares member survey results around FCC restrictions<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Pressure sensors can help improve robotic gripping accuracy", "source": "Robotics Business Review", "date": "2026-09-06", "url": "https://www.therobotreport.com/pressure-sensors-can-help-improve-robotic-gripping-accuracy/", "summary": "<p>From first contact through surface deformation, load distribution, and final stable hold, pressure sensors can improve robotic bin picking.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/pressure-sensors-can-help-improve-robotic-gripping-accuracy/\">Pressure sensors can help improve robotic gripping accuracy<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Eric Sivertson discusses FPGAs and robot security", "source": "Robotics Business Review", "date": "2026-09-06", "url": "https://www.therobotreport.com/eric-sivertson-discusses-fpgas-robot-security/", "summary": "<p>An interview with Eric Sivertson of Lattice Semiconductor about FPGAs and how they can improve robot safety and security.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/eric-sivertson-discusses-fpgas-robot-security/\">Eric Sivertson discusses FPGAs and robot security<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Cyborg Roaches Can Stab You With Needles", "source": "IEEE Spectrum Robotics", "date": "2026-09-05", "url": "https://spectrum.ieee.org/cyborg-rescue-roach", "summary": "<img src=\"https://spectrum.ieee.org/media-library/large-brown-cockroach-fitted-with-an-electronic-device-and-wires-on-its-back.jpg?id=67724302&amp;width=1245&amp;height=700&amp;coordinates=0%2C62%2C0%2C63\" /><br /><br /><p>Imagine you are trapped under rubble after an earthquake and you see an electronics-covered cockroach with a spring-loaded needle on its back scuttling toward you. Although the sight might be unnerving, to say the least, this prototype paramedic cyborg, or “Paraborg,” might one day help deliver lifesaving aid to disaster victims who might be otherwise impossible to reach.<\/p><hr /><h3>The Hardest Problems in Robotics<\/h3><p>For decades, scientists have sought to develop cyborg insects as “a shortcut around some of the hardest problems in robotics,” says <a href=\"https://about.uq.edu.au/experts/42152\" rel=\"noopener noreferrer\" target=\"_blank\">T. Thang Vo-Doan<\/a>, director of the <a href=\"https://tthangvodoan.wordpress.com/\" rel=\"noopener noreferrer\" target=\"_blank\">University of Queensland’s Biorobotics Lab<\/a> in Brisbane, Australia, which just published a paper on the Paraborgs.<\/p><p class=\"shortcode-media shortcode-media-youtube\"> <span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span> <small class=\"image-media media-photo-credit\">The University of Queensland<\/small> <\/p><p>Building an insect-size robot “that can move reliably through rubble, climb over irregular surfaces, recover from falls, c
