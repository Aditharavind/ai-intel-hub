tle": "BMW Group deploys Figure 03 humanoid after tests with previous version", "source": "Robotics Business Review", "date": "2026-06-29", "url": "https://www.therobotreport.com/bmw-group-deploys-figure-03-humanoid-after-tests-previous-version/", "summary": "<p>The Figure 02 robot supported the production of more than 30,000 BMW X3 vehicles over 11 months in South Carolina.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/bmw-group-deploys-figure-03-humanoid-after-tests-previous-version/\">BMW Group deploys Figure 03 humanoid after tests with previous version<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Firefly Aerospace Operates NVIDIA Jetson in Lunar Orbit for the First Time", "source": "NVIDIA Robotics", "date": "2026-06-29", "url": "https://blogs.nvidia.com/blog/firefly-aerospace-nvidia-jetson-lunar-orbit/", "summary": ""}, {"title": "Insights behind Kinisi’s acquisition by Bear Robotics", "source": "Robotics Business Review", "date": "2026-06-29", "url": "https://www.therobotreport.com/insights-behind-kinisi-acquisition-by-bear-robotics/", "summary": "<p>Brennand Pierce, founder and CEO of Kinisi Robotics, discusses the company's approach to physical AI and its acquisition by Bear Robotics.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/insights-behind-kinisi-acquisition-by-bear-robotics/\">Insights behind Kinisi’s acquisition by Bear Robotics<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "AGIBOT produces 15,000th robot, marking a milestone in embodied AI deployment", "source": "Robotics Business Review", "date": "2026-06-28", "url": "https://www.therobotreport.com/agibot-produces-15000th-robot-marking-milestone-embodied-ai-deployment/", "summary": "<p>AGIBOT has rolled out 15,000 wheeled semi-humanoid robots as it moves from embodied AI from development and production to deployment.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/agibot-produces-15000th-robot-marking-milestone-embodied-ai-deployment/\">AGIBOT produces 15,000th robot, marking a milestone in embodied AI deployment<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "We know how to build smarter robots. Now, we need to learn smarter ways to test them", "source": "Robotics Business Review", "date": "2026-06-27", "url": "https://www.therobotreport.com/we-know-how-to-build-smarter-robots-now-we-need-to-learn-smarter-ways-to-test-them/", "summary": "<p>Atharv Kolhar, a staff test automation engineer at Figure AI, says the robotics industry needs a testing philosophy that scales alongside autonomy. <\/p>\n<p>The post <a href=\"https://www.therobotreport.com/we-know-how-to-build-smarter-robots-now-we-need-to-learn-smarter-ways-to-test-them/\">We know how to build smarter robots. Now, we need to learn smarter ways to test them<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "How compact cobot integration enhances autonomous mobile robot applications", "source": "The Robot Report", "date": "2026-06-27", "url": "https://www.therobotreport.com/how-compact-cobot-integration-enhances-autonomous-mobile-robot-applications/", "summary": "<p>Cobots are quickly shaping the future of warehousing, with their use rising 10-fold from 2018 to 2025, Kassow said.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/how-compact-cobot-integration-enhances-autonomous-mobile-robot-applications/\">How compact cobot integration enhances autonomous mobile robot applications<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Orbbec shows AI-powered vision systems at Automate 2026", "source": "Robotics Business Review", "date": "2026-06-26", "url": "https://www.therobotreport.com/orbbec-shows-ai-powered-vision-systems-automate-2026/", "summary": "<p>Orbbec presented industrial-grade 3D cameras for challenging automation scenarios, as well as AI integration for enhanced robotic perception.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/orbbec-shows-ai-powered-vision-systems-automate-2026/\">Orbbec shows AI-powered vision systems at Automate 2026<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Video Friday: Give Robots a Hand", "source": "IEEE Spectrum Robotics", "date": "2026-06-26", "url": "https://spectrum.ieee.org/video-friday-robot-grippers", "summary": "<img src=\"https://spectrum.ieee.org/media-library/three-fingered-robotic-gripper-arm-crawls-upright-on-a-white-table.gif?id=67036633&amp;width=1245&amp;height=700&amp;coordinates=0%2C0%2C0%2C0\" /><br /><br /><p><span>Video Friday is your weekly selection of awesome robotics videos, collected by your friends at <\/span><em>IEEE Spectrum<\/em><span> robotics. We also post a weekly calendar of upcoming robotics events for the next few months. Please <\/span><a href=\"mailto:automaton@ieee.org?subject=Robotics%20event%20suggestion%20for%20Video%20Friday\">send us your events<\/a><span> for inclusion.<\/span><\/p><h5><a href=\"https://roboticsconference.org/\">RSS 2026<\/a>: 13–17 July 2026, SYDNEY<\/h5><h5><a href=\"https://mrs.fel.cvut.cz/summer-school-2026/\">Summer School on Multi-Robot Systems<\/a>: 29 July–4 August 2026, PRAGUE<\/h5><h5><a href=\"https://actuate.foxglove.dev/\">Actuate 2026<\/a>: 18–19 August 2026, SAN FRANCISCO<\/h5><h5><a href=\"https://2026.ieee-iros.org/\">IROS 2026<\/a>: 27 September–1 October 2026, PITTSBURGH<\/h5><p>Enjoy today’s videos!<\/p><div class=\"horizontal-rule\"><\/div><div><span style=\"display: none;\"> <\/span><\/div><p class=\"rm-anchors\" id=\"yfjuag9w2hg\">The best way of introducing a new <a href=\"https://spectrum.ieee.org/dlr-super-robust-robot-hand\" target=\"_blank\">robot hand<\/a> is to have a disembodied one crawling across a table.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.tangentrobotics.ai/\">Tangent Robotics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"auamgssnyqm\"><em>MIT CSAIL’s Improbable AI Lab Director Pulkit Agrawal explains his “SoftMimic” approach to making robots safer around humans.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://arxiv.org/abs/2510.17792\">SoftMimic<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"uskdotwb0k4\">I now have absolutely no interest in a humanoid robot for my home unless it can do this.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.pndbotics.com/\">PNDbotics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"ueon0tm0jzs\"><em>The <a href=\"https://spectrum.ieee.org/video-friday-heavy-lift-drones\" target=\"_blank\">DARPA Lift Challenge<\/a> is open to the public August 6-9, 2026, at the National Museum of the US Air Force.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.darpa.mil/research/challenges/lift\">DARPA<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"76cusj01dn8\"><em>Getting Digit to step and shuffle around an obstacle on the floor is a real test of reactive footstep planning. Digit has to spot something small and moving, recalculate where to place each foot, and keep working—all without breaking stride or losing balance. That’s the same dynamic footwork Digit uses to navigate clutter and foot traffic on a real warehouse floor.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.agilityrobotics.com/\">Agility Robotics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"9lgujrgb_kq\">This is the most aggressive <a href=\"https://spectrum.ieee.org/firefighting-robot-snake-flies-on-jets-of-water\" target=\"_blank\">firefighting robot<\/a> I’ve ever seen.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.deeprobotics.cn/en\">DEEP Robotics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"rio7kurb53o\">Wait a sec, Dusty can print things on floors besides construction layouts? How is this not in every city, making sidewalks exciting and fun everywhere?!<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.dustyrobotics.com/\">Dusty<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"mtmyfvd4zcw\">I am the first to admit that for US $4,900, the performance of the Unitree R1 is very impressive. But what is it going to do out in the world such that it will give you some sort of return on that investment?<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.unitree.com/R1\">Unitree R1<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"ij93ftr3hqe\">Event cameras are extraordinarily powerful because they can see motion, but what if everything is moving because your camera is moving? Oh no!<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://rpg.ifi.uzh.ch/\">University of Zurich Robotics & Perception Group<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"hleaklk4ixm\"><em>Can we understand whale behavior and language? Harvard SEAS Professor Stephanie Gil explains the possibility of understanding animal language and behavior using AI-driven robots and machine learning.  With ongoing whale research and advancements in artificial intelligence, the potential for animal communication with whales could become a tangible reality.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://react.seas.harvard.edu/\">Harvard SEAS<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"upxxhr8r7-a\"><em>Rodney Brooks, founder and chief technology officer of Robust.AI, sits down with Forbes Assistant Managing Editor Kerry Dolan to discuss how he came up with the idea of the Roomba vacuum cleaner and the future of robotics.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.linkedin.com/posts/rodney-brooks-1a137517_how-ants-inspired-this-founder-to-build-a-activity-7475766254587387904-ZsL9/\">LinkedIn<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"h_dtuu5jl3g\">Here are a couple of interesting presentations from UIST 2025, including everyday objects that move around your home with a mind of their own and a project featuring teamwork between helium balloons and ground robots called Buoyancé.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p class=\"shortcode-media shortcode-media-youtube\"> <span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://programs.sigchi.org/uist/2025\">UIST 2025<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div>"}, {"title": "General Intuition raises $320M to use video game data to train robots", "source": "Robotics Business Review", "date": "2026-06-26", "url": "https://www.therobotreport.com/general-intuition-raises-320m-uses-video-game-data-train-robots/", "summary": "<p>General Intuition is using video game clips with embedded action labels to speed up AI training for robotics. <\/p>\n<p>The post <a href=\"https://www.therobotreport.com/general-intuition-raises-320m-uses-video-game-data-train-robots/\">General Intuition raises $320M to use video game data to train robots<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "ARM Institute expands RoboticsCareer.org into physical AI", "source": "Robotics Business Review", "date": "2026-06-25", "url": "https://www.therobotreport.com/arm-institute-launches-physical-ai-focused-expansion-roboticscareer-org/", "summary": "<p>RoboticsCareer.org now lists the growing job opportunities in physical AI and enables employers to connect to qualified talent.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/arm-institute-launches-physical-ai-focused-expansion-roboticscareer-org/\">ARM Institute expands RoboticsCareer.org into physical AI<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Hirebotics offers no-code, explosion-proof cobot for painting", "source": "Robotics Business Review", "date": "2026-06-25", "url": "https://www.therobotreport.com/hirebotics-offers-no-code-explosion-proof-cobot-for-painting/", "summary": "<p>Hirebotics' Cobot Painter supports stationary painting, with parts placed in a paint booth where robots perform all spraying operations.<\/p>\n<p>The post <a href=\"https://www.th botreport.com/reservoir-acquires-contain-to-scale-agtech-startups/\">Reservoir acquires Contain to scale agtech startups<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Why physical AI 2.0 needs a reality check", "source": "Robotics Business Review", "date": "2026-06-23", "url": "https://www.therobotreport.com/why-physical-ai-2-0-needs-reality-check/", "summary": "<p>While vision and language are key parts of physical AI, physical state recovery will enable robots to interact with the world, says a columnist.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/why-physical-ai-2-0-needs-reality-check/\">Why physical AI 2.0 needs a reality check<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "CreateMe partners with Avalo and Laguna Fabrics to bring resilience to apparel supply chains", "source": "Robotics Business Review", "date": "2026-06-23", "url": "https://www.therobotreport.com/createme-partners-with-avalo-and-laguna-fabrics-to-bring-resilience-to-apparel-supply-chains/", "summary": "<p>CreateMe said the partnership aims to demonstrate how apparel can be produced faster, more locally, and with greater supply chain resilience.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/createme-partners-with-avalo-and-laguna-fabrics-to-bring-resilience-to-apparel-supply-chains/\">CreateMe partners with Avalo and Laguna Fabrics to bring resilience to apparel supply chains<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Vention collaborates with FANUC and Universal Robots on software-defined automation", "source": "Robotics Business Review", "date": "2026-06-23", "url": "https://www.therobotreport.com/vention-collaborates-with-fanuc-universal-robots-software-defined-automation/", "summary": "<p>Vention is working with partners to make design and deployment of industrial and collaborative robots easier for manufacturers.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/vention-collaborates-with-fanuc-universal-robots-software-defined-automation/\">Vention collaborates with FANUC and Universal Robots on software-defined automation<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "ExRobotics launches UL-certified inspection robot for hazardous environments", "source": "Robotics Business Review", "date": "2026-06-23", "url": "https://www.therobotreport.com/exrobotics-launches-ul-certified-inspection-robot-for-hazardous-environments/", "summary": "<p>ExRobotics says its ExR-2.5 inspection robot is certified for safe operations in explosive environments in North America.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/exrobotics-launches-ul-certified-inspection-robot-for-hazardous-environments/\">ExRobotics launches UL-certified inspection robot for hazardous environments<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "NVIDIA releases Halos, a full-stack safety system for robotics", "source": "Robotics Business Review", "date": "2026-06-22", "url": "https://www.therobotreport.com/nvidia-releases-halos-a-full-stack-safety-system-for-robotics/", "summary": "<p>NVIDIA said Halos connects AI compute, system software, sensor data, safety applications, and inspection for robotic systems.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/nvidia-releases-halos-a-full-stack-safety-system-for-robotics/\">NVIDIA releases Halos, a full-stack safety system for robotics<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Cobot’s Proxie Gen 2 robot adds autotasking, mobile manipulation", "source": "Robotics Business Review", "date": "2026-06-22", "url": "https://www.therobotreport.com/cobots-proxie-gen-2-robot-adds-autotasking-mobile-manipulation/", "summary": "<p>Cobot founder and CEO Brad Porter said Proxie Gen 2 can determine when materials are ready to move, identify destinations, and create tasks without human intervention.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/cobots-proxie-gen-2-robot-adds-autotasking-mobile-manipulation/\">Cobot&#8217;s Proxie Gen 2 robot adds autotasking, mobile manipulation<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "How Intrinsic eliminates manual robot coding", "source": "Robotics Business Review", "date": "2026-06-22", "url": "https://www.therobotreport.com/how-intrinsic-eliminates-manual-robot-coding/", "summary": "<p>Alphabet’s Intrinsic has debuted its AI-powered \"Intelligence Cell\" to simplify factory automation and eliminate complex robot programming.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/how-intrinsic-eliminates-manual-robot-coding/\">How Intrinsic eliminates manual robot coding<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Bear Robotics acquires Kinisi Robotics to boost its physical AI capabilities", "source": "Robotics Business Review", "date": "2026-06-22", "url": "https://www.therobotreport.com/bear-robotics-acquires-kinisi-robotics-to-boost-its-physical-ai-capabilities/", "summary": "<p>Kinisi's KR1 humanoid robot, its Bristol-based engineering team, and its physical AI capabilities will be integrated into Bear Robotics.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/bear-robotics-acquires-kinisi-robotics-to-boost-its-physical-ai-capabilities/\">Bear Robotics acquires Kinisi Robotics to boost its physical AI capabilities<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Eclipse Automation launches RealitySync simulation platform", "source": "Robotics Business Review", "date": "2026-06-22", "url": "https://www.therobotreport.com/eclipse-automation-launches-realitysync-simulation-platform/", "summary": "<p>Eclipse said its new RealitySync platform allows manufacturers to step into their future factory before it’s built.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/eclipse-automation-launches-realitysync-simulation-platform/\">Eclipse Automation launches RealitySync simulation platform<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "FORT and NVIDIA launch AI-driven Outside-In Safety blueprint", "source": "Robotics Business Review", "date": "2026-06-22", "url": "https://www.therobotreport.com/fort-and-nvidia-launch-ai-driven-outside-in-safety-blueprint/", "summary": "<p>FORT Robotics and NVIDIA launch Outside-In Safety, using external sensors to improve autonomous robot productivity and worker safety.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/fort-and-nvidia-launch-ai-driven-outside-in-safety-blueprint/\">FORT and NVIDIA launch AI-driven Outside-In Safety blueprint<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Güdel to show grinding beyond stationary robots with vertical, horizontal motion at Automate 2026", "source": "Robotics Business Review", "date": "2026-06-21", "url": "https://www.therobotreport.com/gudel-to-showcase-grinding-beyond-stationary-robots-integrated-vertical-horizontal-motion-automate/", "summary": "<p>Güdel has added two degrees of freedom to heavy-duty robotic grinding applications through its TMV and TMF systems.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/gudel-to-showcase-grinding-beyond-stationary-robots-integrated-vertical-horizontal-motion-automate/\">Güdel to show grinding beyond stationary robots with vertical, horizontal motion at Automate 2026<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Defense manufacturing readiness hinges on autonomous finishing, says GrayMatter Robotics", "source": "Robotics Business Review", "date": "2026-06-20", "url": "https://www.therobotreport.com/defense-manufacturing-readiness-hinges-autonomous-surface-prep-says-graymatter/", "summary": "<p>The Navy's industrial base review identified a projected need for 174,000 new workers. GrayMatter says robotics can fill this gap.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/defense-manufacturing-readiness-hinges-autonomous-surface-prep-says-graymatter/\">Defense manufacturing readiness hinges on autonomous finishing, says GrayMatter Robotics<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "What Amazon’s Astro Taught Me About Giving Robots a Soul", "source": "IEEE Spectrum Robotics", "date": "2026-06-19", "url": "https://spectrum.ieee.org/amazon-astro-robot-sound", "summary": "<img src=\"https://spectrum.ieee.org/media-library/cute-wheeled-home-robot-with-a-tablet-face-set-against-a-blue-heart-patterned-background.jpg?id=66906422&amp;width=1245&amp;height=700&amp;coordinates=0%2C187%2C0%2C188\" /><br /><br /><p>In 2018, Amazon brought me in as the lead UX Sound Designer for <a href=\"https://spectrum.ieee.org/amazon-astro-robot\" target=\"_blank\">Astro, its first consumer home robot<\/a>. Astro used cameras and other sensors to map and navigate your <a href=\"https://spectrum.ieee.org/ai-robots\" target=\"_blank\">home and workplace<\/a>, and could proactively patrol, check up on loved ones, and transport small items using its built-in cargo bin. While there was a well-defined feature set and form factor, initially there was no character direction. In fact, even before <a href=\"https://www.amazon.com/Introducing-Amazon-Astro/dp/B078NSDFSB\" target=\"_blank\">Astro<\/a> had a name, there were two main questions—was it simply Alexa on wheels, or was it a robot with its own character?<\/p><p>The Astro team was divided. One option was to focus on Alexa, and treat the mobile robot simply as an added utility. Along with the majority of the UX team, I argued for Astro to not focus on Alexa. Our belief was that a thing that moves through your home and turns toward you with intent can never be just an appliance. People would ascribe character to it whether we wanted them to or not, and so the only question was whether we shaped that character or let it happen by accident.<\/p><p>Ultimately, <a href=\"https://www.aboutamazon.com/news/devices/meet-astro-a-home-robot-unlike-any-other\" target=\"_blank\">Astro became Astro rather than Alexa<\/a>, and user testing backed up our decision. People <em><em>didn’t<\/em><\/em> see the robot as Alexa. They saw it as its own character, and that’s what they wanted it to be. Alexa on the device felt somewhat strange and creepy, but building Astro its own voice was too slow and expensive in 2018. So, we settled on Alexa as a supporting character that handled any actual talking, while Astro was the main character, communicating as much as it could without words, through sound, motion, and facial expressions.<\/p><p>I had been brought on to the Astro team to define the robot’s sound design language and voice. But there was no one to flesh out the robot’s actual character. You cannot make a single real decision about a character without defining it first. Every choice about how Astro moved, sounded, paused, or reacted was a character choice, and those choices required all disciplines working together. As sound lead, I was weaving together sound, motion, and character, and how they played together inside each story moment. The animators, who programmed Astro’s motion and facial expressions, were extraordinary at what they did, but the emotional arc they were animating came from the sound (and therefore character) work first. So I stepped into that role, which is where my real work started. What I learned about building character for robots applies to nearly everything being built in embodied AI right now.<\/p><h2>Character Is a Design System<\/h2><p>Developing a character for Astro meant answering questions that had never been asked about a product at Amazon: What is the emotional range of this robot’s baseline state? How does this robot communicate uncertainty without eroding trust? Where is the line between being expressive and annoying? What are the vulnerabilities of this device’s character?<\/p><p>These are design questions. They have real answers, and every team working on the product has to build from them. For example, Astro’s emotional range was designed to be relatively small at first. We never wanted Astro to get too sad or too angry. It could play sad, but would snap out of it quickly and end the reaction on a high note to keep things positive.<\/p><p class=\"shortcode-media shortcode-media-youtube\"> <span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>Character leaks out of every seam and can create a disjointed experience if not defined correctly. Even if it’s just animation timing that’s slightly off, or a response that’s technically correct but contextually tone-deaf, users feel every one of these inconsistencies, even if they can’t name them. Watch what happens at the beginning and end of this Sing sequence:<\/p><p class=\"shortcode-media shortcode-media-youtube\"> <span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>Astro goes from nothing, into the emotional moment, and then lands back on nothing. No buildup, no cooldown, no sense that the feeling came from somewhere or had anywhere to go. I pushed hard for better character stitching, the transitions in and out of expressive moments that make a performance feel continuous rather than assembled, but it never got implemented. The moment itself works. But without the stitching, it reads as a clip playing on a robot rather than coming from within the robot character itself.<\/p><h2>Story and Sound at the Beginning<\/h2><p>We had decided that Astro would have no spoken dialogue, but it had something that functioned the same way: a vocabulary of sounds, tones, and rhythms that acted as its voice. This vocabulary became the leading output of the character’s personality. The robot’s motion and facial expressions were built around it.<\/p><p>Astro’s wake-up sequence is a great example. Waking wasn’t just a boot animation on the screen; it was an entire performance. Slow and humble at first, the robot oriented itself quietly, then stretched its screen, checked its wheels, and finally, with an upward gesture toward its telescoping mast, it popped it up slightly, and did a little dance of joy. Sound, motion, and eyes hit every beat<em> <\/em>together in full choreography.<\/p><p class=\"shortcode-media shortcode-media-youtube\"> <span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>The character’s output in that sequence was first written as a story. Astro is waking up in its new home for the first time. Its main aspiration is to be part of a family, so this is the moment it has been waiting for, this is its purpose. Being the responsible character that it is, it wants to make sure everything is good to go before it introduces itself and starts learning its new home.<\/p><p>This narrative came first because it drove every other decision that we made. After the story was written, sound gave that story a metaphorical voice: the excited tones, the pacing as it checked its wheels, and the bright melodic phrase as Astro looked up at its new family for the first time and introduced itself. Once the sound was laid down, the animation team did their thing with motion and facial expressions, taking cues from the emotional arc the sound had established. Motion didn’t lead—it followed the feeling of the story and the sounds, the same way an animator follows a recorded vocal take.<\/p><p>That wake-up sequence became one of the most-discussed moments in early user testing. People described it as “alive.” What they were responding to wasn’t any single element. It was all three channels (sound, motion, and facial expressions) expressing the same defined character in harmony.<\/p><h2>Context Is Where Character Becomes Real<\/h2><p>The most compelling characters are defined not by a fixed disposition but by how they respond to their environments and the people in them. They’re still recognizably themselves even as they adapt. This is what I call contextual character. A robot living in a home doesn’t occupy a single emotional state. It moves through rooms with different energy, encounters people in different moods, operates at different times of day, and responds to an endless range of social situations it was never explicitly designed for.<\/p><p>We got close to a contextual character output with Astro’s sound. When a specific piece of environmental context was fed in, the system adapted beautifully, and Astro felt completely alive. But every state like this was still a prediction we made by hand—a situation we had to imagine in advance and design a response for. A random home throws more situations at a robot than anyone can possibly predict, so there was always a longer tail of moments the system was never prepared for.<\/p><p>The difference between a product people describe as “smart” and one they describe as “aware” often comes down to this. Smartness is capability. Awareness is context. Presence is character. And character is always in reaction to the people around it, to its environment, to its own evolving state. That’s what makes it feel like something is emotionally present with you.<\/p><p>This is where AI changes the game for character design in ways that go well beyond what was possible with Astro. AI-driven adaptation doesn’t require the contextual predictions that we relied on. It learns the specific rhythms, preferences, and emotional context of the people it lives and works with. The character doesn’t just respond to context. It <em><em>grows<\/em><\/em> into it.<\/p><h2>What Industry Is Missing<\/h2><p>The character and soul of the impending wave of embodied AI products appears to almost always be an afterthought. And character defined late is character defined by default. It becomes the sum of a thousand small decisions made by different people thinking about anything but character. People project character onto devices whether you plan for it or not, especially if those devices move—a robot that moves is <em><em>already<\/em><\/em> a character. If nobody has designed this character, the result will be products that feel like nothing, or worse, feel confusing and not trustworthy. Technically impressive, but lifeless.<\/p><p>We did not get this fully right with Astro. So many things were moving in parallel that character was rarely treated as a utility, and it made sense why. When you are building a first-of-its-kind product, the things that are the loudest are the ones that break, the deadlines, the costs, the features a customer can point to on a box. Character is quieter than all of that. It’s easy to assume it can come later. On a team as large as the Amazon Astro team, it’s lucky to get any idea onto the road map when it is competing with a hundred others that all feel more urgent in the moment. None of this came from people not caring. It came from character being the kind of thing that is hard to prioritize until you see what its absence costs you.<\/p><h2>My Asks to Product Leaders<\/h2><p>If you are building a product that will share physical or conversational space with people, three things are worth considering:<\/p><p><strong>Define character before you define interactions.<\/strong> You need a defensible character with enough emotional logic to answer hard questions consistently. Find answers to character questions early, and have every discipline build from the same foundation.<\/p><p><strong>Build story and sound into the character pipeline, not the production pipeline.<\/strong> Story and sound developed alongside character definition has the chance to inform motion, expression, and interaction logic. This requires a different kind of collaboration, and a different kind of hire.<\/p><p><strong>Design for adaptation, not just consistency.<\/strong> A consistent character is necessary, but the products that will matter most in people’s lives are the ones that deepen through use. The infrastructure to support that is more and more accessible, but the design thinking to take advantage of it is still rare.<\/p><div class=\"horizontal-rule\"><\/div><p><em><em>An expanded version of this story is available on <a href=\"https://medium.com/@mikeforstmusic/what-amazons-astro-taught-me-about-giving-ai-a-soul-989fcd9c45f4\" target=\"_blank\">Medium<\/a>.<\/em><\/em><\/p>"}, {"title": "U.S. robotics industry saw double-digit growth in 2025, says IFR", "source": "Robotics Business Review", "date": "2026-06-19", "url": "https://www.therobotreport.com/u-s-robotics-industry-saw-double-digit-growth-in-2025-says-ifr/", "summary": "<p>The IFR said robust growth in the food industry and other non-manufacturing sectors drove this recovery in the U.S. robotics industry.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/u-s-robotics-industry-saw-double-digit-growth-in-2025-says-ifr/\">U.S. robotics industry saw double-digit growth in 2025, says IFR<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Elmo releases new motion controller and servo drives for industrial applications", "source": "Robotics Business Review", "date": "2026-06-19", "url": "https://www.therobotreport.com/elmo-releases-new-motion-controller-servo-drives-industrial-applications/", "summary": "<p>Elmo said its latest products set new benchmarks for power density, expand its existing Platinum line, and introduce the Titanium line.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/elmo-releases-new-motion-controller-servo-drives-industrial-applications/\">Elmo releases new motion controller and servo drives for industrial applications<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Video Friday: Do Robots Even Need Legs?", "source": "IEEE Spectrum Robotics", "date": "2026-06-19", "url": "https://spectrum.ieee.org/video-friday-agentic-ai-robot", "summary": "<img src=\"https://spectrum.ieee.org/media-library/white-service-robot-on-a-square-mobile-base-working-at-a-countertop-in-a-modern-wooden-kitchen.png?id=66959675&amp;width=1245&amp;height=700&amp;coordinates=0%2C0%2C0%2C0\" /><br /><br /><p><span>Video Friday is your weekly selection of awesome robotics videos, collected by your friends at <\/span><em>IEEE Spectrum<\/em><span> robotics. We also post a weekly calendar of upcoming robotics events for the next few months. Please <\/span><a href=\"mailto:automaton@ieee.org?subject=Robotics%20event%20suggestion%20for%20Video%20Friday\">send us your events<\/a><span> for inclusion.<\/span><\/p><h5><a href=\"https://roboticsconference.org/\">RSS 2026<\/a>: 13–17 July 2026, SYDNEY<\/h5><h5><a href=\"https://mrs.fel.cvut.cz/summer-school-2026/\">Summer School on Multi-Robot Systems<\/a>: 29 July–4 August 2026, PRAGUE<\/h5><h5><a href=\"https://actuate.foxglove.dev/\">Actuate 2026<\/a>: 18–19 August 2026, SAN FRANCISCO<\/h5><h5><a href=\"https://2026.ieee-iros.org/\">IROS 2026<\/a>: 27 September–1 October 2026, PITTSBURGH<\/h5><p>Enjoy today’s videos!<\/p><div class=\"horizontal-rule\"><\/div><div><span style=\"display: none;\"> <\/span><\/div><blockquote class=\"rm-anchors\" id=\"zab62_u-a5u\"><em>Eno is our first agentic robot: an AI agent and a general-purpose robot working as one system. It reasons, plans, and acts in the real world. Human in capability, not in form. Every detail with a purpose, reduced to what matters. Designed not to resemble us, but to extend us. Eno is built end to end at Genesis.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.genesis.ai/\">Genesis<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"rhhqoyxvade\"><em>Engineers from NASA’s Jet Propulsion Laboratory are field-testing advanced capabilities for potential future Moon and Mars rovers. In the Colorado Desert near Plaster City, California, teams used a prototype rover called ERNEST (Exploration Rover for Navigating Extreme Sloped Terrain) to test software for a potential <a href=\"https://spectrum.ieee.org/lunar-base-3d-printing\" target=\"_blank\">future long-range lunar mission<\/a>. The software enables the rover, developed at JPL, to operate autonomously and travel extreme distances with minimal intervention from human operators. <\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>ERNEST is a lot more capable than it may look; here’s some recent research showing the kinds of terrain it can handle:<\/p><p class=\"shortcode-media shortcode-media-youtube\"> <span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.jpl.nasa.gov/news/nasa-testing-advanced-capabilities-for-moon-mars-rovers/\">NASA's Jet Propulsion Lab<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"6mzafau1puq\"><em>Table tennis can produce moments that are difficult even for experienced players to anticipate…like when the ball clips the net and suddenly changes direction. For the Ace research project at Sony AI, these events were a key test of the system’s ability to operate reliably in unpredictable real-world conditions. Ace addresses this uncertainty by simulating counterfactual ball trajectories in real time. In the video, the green overlays show these alternative paths the system considers while planning its response.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>And check out some of these rallies that the robot has with Miyuu Khiara.<\/p><p class=\"shortcode-media shortcode-media-youtube\"> <span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://ace.ai.sony/\">Sony AI<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"oilpnumvgve\">This video of an ANYmal deployment in a concrete plant is worth watching because it makes explicit how quadrupeds make money in <a href=\"https://spectrum.ieee.org/north-sea-deployment-shows-how-quadruped-robots-can-be-commercially-useful\" target=\"_blank\">inspection contexts<\/a>: Among other things, “a cracked crusher foundation [was] caught before a week-long shutdown, avoiding roughly $630,000 in lost production.” That pays for a lot of robots.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.anybotics.com/\">ANYbotics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"xcqgxr7efdo\">A lot of interesting footage here from GITAI’s prep for a robotic satellite servicing demo mission. The thruster test-firing isn’t a robot, exactly, but it may be the coolest part.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.prnewswire.com/news-releases/gitai-completes-flight-model-of-s3-robotic-satellite-for-on-orbit-servicing-demonstration-mission-302801614.html\">GITAI<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"ko1cqdbsr_o\">Anyone who’s tried to take a half decent photo underwater knows that it’s basically impossible, so let’s try and teach robots to cope.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://mertcookimg.github.io/bi-aqua/\">Bi-AQUA<\/a> ]<\/p><p>Thanks, Masato!<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"y41op9mupqa\"><em>Handling delicate, irregular or unpredictable objects is one of the hardest problems left in automation, and one of the most important. It’s what’s holding back the next wave of robots from doing more in the real world. That’s why we’re working with PSYONIC on a new approach. Their Ability Hand, worn by hundreds of people every day, captures real-world data on touch, pressure and grip. Our GoFa cobot brings the industrial-grade accuracy and repeatability to turn that human data into reliable robotic performance.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.abb.com/global/en/news/136690/prsrl-abb-robotics-and-psyonic-use-human-generated-data-to-advance-robotic-dexterity\">ABB Robotics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"oiyl5neg4rc\"><em>Sanctuary AI has achieved world-class performance on a complex wire-plugging production task with a global Tier 1 automotive supplier. In this demonstration, Sanctuary AI’s Physical AI successfully performs a high-speed wire-plug insertion task, achieving a validated task success rate of over 99.5% with a cycle time of just 2.54 seconds, meeting live production benchmarks established by the customer.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>WHY IS THIS STRESSING ME OUT SO MUCH?<\/p><p>[ <a href=\"https://sanctuary.ai/\">Sanctuary<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"-kqaschiady\">This video is quite obviously fake, but I suppose maybe there’s a market for extra beefy quadrupeds? Maybe?<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.gotokepler.com/home\">Kepler<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"vypbeg6i6og\">I cannot overstate how much I do not want any robot to look at what I’m wearing and then attempt to sell me things based on what it thinks it can guess about my personality or interests.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.magiclab.top/en/\">MagicLab<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"ylopovulwi8\">I am here for fed-up robots learning how to move boxes by just kicking them.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.ce.cit.tum.de/en/aipd/home/\">ATARI Lab<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"cbwsags8al8\">Ah, yes, very useful and very important robots that make me very uncomfortable.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://ieeexplore.ieee.org/document/11112617\">Paper<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"s67z2aekbri\"><em>I built GrowBot ( a ~6”, two-servo bipedal robot) that runs entirely on a $15 Raspberry Pi Zero 2 W, ~$100 in parts. An LLM drives it directly: it reads the raw IMU stream with no translation layer and narrates its own motion (“rocked side to side like a baby”), riding on a 50-Hz reinforcement-learning walk policy trained in sim and transferred to the real body.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>The idea here is to build an open course around this project, Brit says, “so everyone can experience physical AI right now in a low-risk way.”<\/p><p>[ <a href=\"https://artoftheproblem.com/pages/growbot\">GrowBot<\/a> ]<\/p><p>Thanks, Brit!<\/p><div class=\"horizontal-rule\"><\/div>"}, {"title": "RealSense unveils AI-native D585 Pro depth camera for robots", "source": "Robotics Business Review", "date": "2026-06-18", "url": "https://www.therobotreport.com/realsense-unveils-ai-native-d585-pro-depth-camera-for-robots/", "summary": "<p>The D585 Pro is powered by a proprietary Gen 5 system-on-chip and delivers more than 2x better depth quality than the previous generation of RealSense cameras.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/realsense-unveils-ai-native-d585-pro-depth-camera-for-robots/\">RealSense unveils AI-native D585 Pro depth camera for robots<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Kinova launches KIMA medical robotic arm", "source": "Robotics Business Review", "date": "2026-06-18", "url": "https://www.therobotreport.com/kinova-launches-kima-medical-robotic-arm/", "summary": "<p>Instead of adapting the robot from industrial technology, Kinova said it designed KIMA from the ground up for clinical use.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/kinova-launches-kima-medical-robotic-arm/\">Kinova launches KIMA medical robotic arm<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Microbot Medical to expand veteran access to robotic surgery with LIBERTY", "source": "Robotics Business Review", "date": "2026-06-18", "url": "https://www.therobotreport.com/microbot-medical-expands-veteran-access-robotic-surgery-liberty/", "summary": "<p>Lovell Government Services will become Microbot's service-disabled veteran-owned small business vendor to supply federal programs.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/microbot-medical-expands-veteran-access-robotic-surgery-liberty/\">Microbot Medical to expand veteran access to robotic surgery with LIBERTY<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Richtech Robotics launches livestream for ADAM AI-powered humanoid", "source": "Robotics Business Review", "date": "2026-06-18", "url": "https://www.therobotreport.com/richtech-robotics-launches-livestream-adam-ai-powered-humanoid/", "summary": "<p>Online users will be able to engage with service robot ADAM, which uses NVIDIA technology, says Richtech Robotics.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/richtech-robotics-launches-livestream-adam-ai-powered-humanoid/\">Richtech Robotics launches livestream for ADAM AI-powered humanoid<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "The Secret to Marathon-Winning Humanoid Robots", "source": "IEEE Spectrum Robotics", "date": "2026-06-17", "url": "https://spectrum.ieee.org/china-humanoid-robot-marathon", "summary": "<img src=\"https://spectrum.ieee.org/media-library/a-red-and-black-humanoid-runs-alone-through-a-marathon-course.jpg?id=66940897&amp;width=1245&amp;height=700&amp;coordinates=0%2C66%2C0%2C66\" /><br /><br /><p>On 19 April 2026, the <a href=\"https://www.cnn.com/2026/04/19/china/china-robot-half-marathon-intl-hnk\" rel=\"noopener noreferrer\" target=\"_blank\">Honor Lightning humanoid robot ran a half-marathon in 50 minutes and 26 seconds<\/a>, beating the human world record by 7 minutes and the best robot time from 2025 by almost 2 hours.<\/p><p>How did Honor do it? Is there some magical technology or technique that unlocked this performance? How did the company beat the significantly better-known Unitree (which reportedly had to supply its robot with an ice backpack to try and complete the race without overheating)? My doctoral thesis involved <a href=\"https://www.avikde.me/p/phd-defense\" rel=\"noopener noreferrer\" target=\"_blank\">building and controlling hopping and running robots<\/a>, and <a href=\"https://www.avikde.me/p/ghost-robotics-minitaur\" rel=\"noopener noreferrer\" target=\"_blank\">since then I’ve tried to design and build efficient commercial legged robots<\/a>, giving me a decent idea of the constraints involved. In this article, we take a look at the fundamental underlying constraints to try and answer these questions.<\/p><h3>The Physics of Running<\/h3><p><a href=\"https://spectrum.ieee.org/ai-institute\" target=\"_blank\">Running<\/a> consists of alternating phases of a leg pushing against the ground (“stance phase”) and the body flying through the air (“aerial phase”). In the aerial phase, the body falls due to gravity, losing vertical momentum. The leg in stance phase pushes against the ground to redirect the vertical momentum upward, while the other leg swings forward to reposition for the next foothold.<\/p><p><a href=\"https://spectrum.ieee.org/ev-motor\" target=\"_blank\">Electric motors<\/a> use energy to produce torque—the higher the torque, the more energy is lost as heat. Adding a gear train after the motor amplifies its torque and reduces its speed. A large reduction helps with torque production, but since the rotor of the motor itself has to spin faster, it becomes very sluggish at accelerating its output. This is obviously bad for the swing phase described above. These competing effects mean that for a particular motor, there is usually a sweet spot for the gear ratio:<\/p><p class=\"shortcode-media shortcode-media-rebelmouse-image\"> <img alt=\"A graph showing the relationship between gearing and motor efficiency, with an optimal gearing ratio in the relationship between stance and swing.\" class=\"rm-shortcode\" id=\"10bd7\" src=\"https://spectrum.ieee.org/media-library/a-graph-showing-the-relationship-between-gearing-and-motor-efficiency-with-an-optimal-gearing-ratio-in-the-relationship-between.jpg?id=66940901&amp;width=980\" /> <small class=\"image-media media-caption\">The power consumed by a robot leg is minimized at an optimal gear ratio (30:1 in this example).<\/small><small class=\"image-media media-photo-credit\">Avik De/Datawrapper<\/small><\/p><h3>How Honor Did It<\/h3><p>While the Lightning’s motor specifications are not published, the hip and knee motors roughly have a 110-to-150-millimeter outer diameter. For an approximate set of motor parameters, I looked to the <a href=\"https://www.tq-group.com/en/products/tq-robodrive/servo-kits/ilm115x25/\" target=\"_blank\">ILM115x25 motor<\/a> due to its relevant size and detailed specifications.<\/p><p>We can use a simple physics model to estimate the power consumption for running at 7 meters per second (the Lightning’s average half-marathon speed) as gear ratio varies:<\/p><p class=\"shortcode-media shortcode-media-rebelmouse-image\"> <img alt=\"A graph showing that optimal gearing for a robot\\u2019s motor dissipates the amount of heat that the motor generates.\" class=\"rm-shortcode\" id=\"185f3\" src=\"https://spectrum.ieee.org/media-library/a-graph-showing-that-optimal-gearing-for-a-robot-u2019s-motor-dissipates-the-amount-of-heat-that-the-motor-generates.jpg?id=66940912&amp;width=980\" /><small class=\"image-media media-caption\">The light blue curve shows how to pick the optimal gearing (45:1). The dark blue curve shows how much heat will be produced in the knee motor, ~150W for the optimal gearing.<\/small><small class=\"image-media media-photo-credit\">Avik De/Datawrapper<\/small><\/p><p>We see that the drivetrain is not magical: with a gear ratio <em><em>chosen for this task<\/em><\/em> (we’ll return to this below), the approximate robot power consumption would be a very reasonable 400 watts.<\/p><p>However, the dissipated knee power ( typically the main thermal limiting factor) is approximately 150 W. This is almost an unavoidable consequence—running at human speeds with a humanoid-size robot will inevitably generate this amount of heat! Over a prolonged period, keeping the motor from overheating would be a challenge, but the Lightning has a <a href=\"https://eu.36kr.com/en/p/3775418378027520\" target=\"_blank\">trick up its sleeve<\/a>:<\/p><blockquote>According to Honor, the liquid-cooling pipes penetrate deep into the motors like capillaries. The high-power liquid pump has a heat-exchange flow rate of more than 4 liters per minute. Each of the four drive motors in the lower limbs is equipped with an independent liquid-cooling circuit.<\/blockquote><p>Liquid cooling is not new, but it’s definitely not a commodity. It has shown up in research periodically, and on the commercial side <a href=\"https://apptronik.com/news-collection/apptronik-readies-its-humanoid-robot-for-a-summer-unveil\" target=\"_blank\">Apptronik tried it for a few of its prototypes<\/a> but (to my knowledge) does not use it on its main <a href=\"https://apptronik.com/apollo\" target=\"_blank\">Apollo<\/a> platform. Basic air-convection-based cooling would not continuously be able to extract 150 W out of the knee motor, and so the cooling technology is a key enabler of this type of performance.<\/p><h3>Why Others Couldn’t Compete<\/h3><p>Why did Honor’s competitors, including more <a href=\"https://www.forbes.com/sites/johnkoetsier/2026/01/09/top-10-humanoid-robot-companies-by-shipments-revealed/\" target=\"_blank\">established and widely shipped humanoids<\/a> such as from <a href=\"https://www.unitree.com/g1\" target=\"_blank\">Unitree<\/a> or <a href=\"https://www.agibot.com/\" target=\"_blank\">Agibot<\/a>, not compete as well?<\/p><p>We can use the same model to generate an equivalent energetics plot for walking at 1.5 m/s, a much more modest but potentially more common activity for a commercial humanoid robot:<\/p><p class=\"shortcode-media shortcode-media-rebelmouse-image\"> <img alt=\"A graph showing that robots with gear ratios optimized for running or walking are inefficient when walking or running respectively.\" class=\"rm-shortcode\" id=\"616f5\" src=\"https://spectrum.ieee.org/media-library/a-graph-showing-that-robots-with-gear-ratios-optimized-for-running-or-walking-are-inefficient-when-walking-or-running-respective.jpg?id=66940939&amp;width=980\" /> <small class=\"image-media media-caption\">The solid and dashed light blue lines show a running-optimized design, while green lines show a walking-optimized design. The optimal ratio for walking is much lower (30:1 vs. 45:1). However, the power dissipated in the knee motor while running [dark blue] is much higher at 30:1 vs. 45:1—the price to pay for running with a walking-optimized design.<\/small><small class=\"image-media media-photo-credit\">Avik De/Datawrapper<\/small><\/p><p>The plot adds a new green curve for the walking power, and the optimal gearing is significantly different!<\/p><p>Let’s say you design your robot to excel at the normal walking task and choose the green design with 30:1 gearing. The knee motor power to run a half marathon is over 300 W (red arrow), more than two times what we had with the running-optimized design. It wouldn’t be so surprising to need ice packs!<\/p><p>Conversely, visually following the green curve shows that the running-optimized robot wastes more power for walking. Using larger motors sized for running increases the weight of the robot and wastes power when it is standing or walking. The larger motors also pose practical issues like bumping into objects while operating in homes or factories.<\/p><h3>Closing Thoughts<\/h3><p>Honor’s half-marathon performance was an impressive engineering effort and result. It didn’t need any magical leaps in technology, but the deployment of the capillary motor cooling solution is a notable advance without which this running pace would have been unsustainable. The cooling, weight optimization, and robustness advances may well be useful for more practical purposes like carrying heavy payloads down the line.<\/p><p class=\"shortcode-media shortcode-media-rebelmouse-image\"> <img alt=\"A comparison showing two similar humanoid robots, but one has significantly smaller motors on its hips.\" class=\"rm-shortcode\" id=\"19121\" src=\"https://spectrum.ieee.org/media-library/a-comparison-showing-two-similar-humanoid-robots-but-one-has-significantly-smaller-motors-on-its-hips.jpg?id=66941011&amp;width=980\" /> <small class=\"image-media media-caption\">The Honor Lighting robot [right] has much larger motors driving its legs than the Unitree H1 robot, making it a more efficient runner but a less efficient walker.<\/small><small class=\"image-media media-photo-credit\">Left: Wei Zhiyang/Zhejiang Daily Press Group/VCG/Getty Images; Right: VCG/Getty Images<\/small><\/p><p>However, the Lightning is not as well-suited to other tasks as a robot designed for greater versatility. Engineering is always characterized by trade-offs, and making the correct ones separates good products from great ones. With consistently improving AI language models, this very human skill is becoming the most valuable one an engineer can have.<\/p><p>The news coverage seemed to overly focus on the fact that the human half-marathon record had been broken by a robot. Machines and humans have very different capabilities and constraints, so why should we ever have expected the half-marathon time for a robot and human to be related? As in <a href=\"https://en.wikipedia.org/wiki/Deep_Blue_versus_Garry_Kasparov\" target=\"_blank\">Deep Blue’s 1997 defeat of Garry Kasparov in chess<\/a>, where it couldn’t physically move the pieces, the Honor robot’s capabilities are much narrower than a human running elbow to elbow with other runners while visually navigating the course without GPS. Comparing the robot runner to a human runner is just an apples-to-oranges comparison, which only risks diminishing Honor’s engineering achievement on one hand and human athletic achievement on the other.<\/p>"}, {"title": "Sanctuary AI validates physical AI performance at Tier 1 automotive supplier", "source": "Robotics Business Review", "date": "2026-06-17", "url": "https://www.therobotreport.com/sanctuary-ai-validates-physical-ai-performance-tier-1-automotive-supplier/", "summary": "<p>Sanctuary AI is not waiting for humanoid robots; it's applying physical AI to demonstrate production-ready performance.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/sanctuary-ai-validates-physical-ai-performance-tier-1-automotive-supplier/\">Sanctuary AI validates physical AI performance at Tier 1 automotive supplier<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Evaluating humanoids for surface finishing applications", "source": "Robotics Business Review", "date": "2026-06-17", "url": "https://www.therobotreport.com/evaluating-humanoids-for-surface-finishing-applications/", "summary": "<p>Most manufacturing applications aim to reduce cycle time to improve throughput. Using general-purpose industrial robots that transcend human constraints is often an attractive option.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/evaluating-humanoids-for-surface-finishing-applications/\">Evaluating humanoids for surface finishing applications<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Fennec Engineering earns T2 qualification for Advanced Safety Acceleration Platform", "source": "Robotics Business Review", "date": "2026-06-17", "url": "https://www.therobotreport.com/fennec-engineering-earns-t2-qualification-advanced-safety-acceleration-platform/", "summary": "<p>Fennec Engineering has obtained certification confirming that its automated traceability platform meets strict safety standards.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/fennec-engineering-earns-t2-qualification-advanced-safety-acceleration-platform/\">Fennec Engineering earns T2 qualification for Advanced Safety Acceleration Platform<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Autonomique deploys semi-humanoid robots and AI at Canadian Tier 1", "source": "Robotics Business Review", "date": "2026-06-17", "url": "https://www.therobotreport.com/autonomique-deploys-semi-humanoid-robots-canadian-tier-1/", "summary": "<p>Autonomique has moved its AI-powered robots from pilot to production at F&#038;P Mfg., with plans for deployment across F-tech's global network.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/autonomique-deploys-semi-humanoid-robots-canadian-tier-1/\">Autonomique deploys semi-humanoid robots and AI at Canadian Tier 1<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "PSYONIC partners with ABB Robotics to apply human touch to robot dexterity", "source": "Robotics Business Review", "date": "2026-06-16", "url": "https://www.therobotreport.com/psyonic-abb-robotics-partner-apply-human-touch-data-robot-dexterity/", "summary": "<p>PSYONIC is combining its Ability Hand with ABB Robotics' GoFa cobot arm to apply data from prosthetics users to robotic grasping.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/psyonic-abb-robotics-partner-apply-human-touch-data-robot-dexterity/\">PSYONIC partners with ABB Robotics to apply human touch to robot dexterity<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Built Robotics, Penn xLAB to develop physical AI for construction", "source": "Robotics Business Review", "date": "2026-06-16", "url": "https://www.therobotreport.com/xlab-and-built-robotics-partner-to-advance-construction/", "summary": "<p>xLAB and Built Robotics partner to capture additional data, advancing AI models to improve construction site safety.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/xlab-and-built-robotics-partner-to-advance-construction/\">Built Robotics, Penn xLAB to develop physical AI for construction<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Kawasaki Robotics to debut RL030N physical AI platform at Automate", "source": "Robotics Business Review", "date": "2026-06-16", "url": "https://www.therobotreport.com/kawasaki-robotics-debut-rl030n-physical-ai-platform-automate/", "summary": "<p>Kawasaki Robotics says its 8-DoF robot, Pulseboard inspection tech, and other systems will show its vision for intelligent automation.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/kawasaki-robotics-debut-rl030n-physical-ai-platform-automate/\">Kawasaki Robotics to debut RL030N physical AI platform at Automate<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Genesis AI launches Eno general-purpose robot", "source": "Robotics Business Review", "date": "2026-06-16", "url": "https://www.therobotreport.com/genesis-ai-launches-eno-general-purpose-robot/", "summary": "<p>Genesis plans to begin Eno’s production and targeted customer deployments by the end of 2026, with home deployments coming later. <\/p>\n<p>The post <a href=\"https://www.therobotreport.com/genesis-ai-launches-eno-general-purpose-robot/\">Genesis AI launches Eno general-purpose robot<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Pegasus Tech Ventures launches $60M fund for physical AI startups", "source": "Robotics Business Review", "date": "2026-06-16", "url": "https://www.therobotreport.com/pegasus-tech-ventures-launches-60m-fund-physical-ai-startups/", "summary": "<p>Pegasus and CYBERDYNE will invest in startups developing robotics, physical AI, healthcare, automation, and intelligent systems.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/pegasus-tech-ventures-launches-60m-fund-physical-ai-startups/\">Pegasus Tech Ventures launches $60M fund for physical AI startups<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Burro introduces Grande 44 with proven outdoor autonomy built for heavy industry", "source": "Robotics Business Review", "date": "2026-06-15", "url": "https://www.therobotreport.com/burro-introduces-grande-44-with-proven-outdoor-autonomy-built-for-heavy-industry/", "summary": "<p>The 44 hp Burro Grande brings more than 1 million hours of real-world experience to industrial towing, site logistics, and facilities operations.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/burro-introduces-grande-44-with-proven-outdoor-autonomy-built-for-heavy-industry/\">Burro introduces Grande 44 with proven outdoor autonomy built for heavy industry<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Autonomous freight developer Einride goes public via SPAC", "source": "Robotics Business Review", "date": "2026-06-15", "url": "https://www.therobotreport.com/autonomous-freight-developer-einride-goes-public-via-spac/", "summary": "<p>Stockholm-based Einride operates a fleet of heavy-duty electric trucks servicing Global Fortune 500 companies across the U.S. and Europe.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/autonomous-freight-developer-einride-goes-public-via-spac/\">Autonomous freight developer Einride goes public via SPAC<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Modernizing the global economy with industrial robotics is needed but not inevitable", "source": "Robotics Business Review", "date": "2026-06-14", "url": "https://www.therobotreport.com/modernizing-global-economy-industrial-robotics-needed-not-inevitable/", "summary": "<p>While service robotics adoption grows, industrial automation faces greater demand and bigger obstacles, notes a columnist.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/modernizing-global-economy-industrial-robotics-needed-not-inevitable/\">Modernizing the global economy with industrial robotics is needed but not inevitable<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Visual Language Models Train Robots to Read Human Emotions", "source": "IEEE Spectrum Robotics", "date": "2026-06-13", "url": "https://spectrum.ieee.org/robot-emotions-visual-language-models", "summary": "<img src=\"https://spectrum.ieee.org/media-library/illustration-of-a-shoulders-up-human-silhouette-with-facial-attributes-vaguely-outlined-by-recognition-points.jpg?id=66888123&amp;width=1245&amp;height=700&amp;coordinates=0%2C187%2C0%2C188\" /><br /><br /><p>\n<em>This article is part of our exclusive <a href=\"https://spectrum.ieee.org/collections/journal-watch/\" target=\"_blank\">IEEE Journal Watch series<\/a> in partnership with IEEE Xplore.<\/em>\n<\/p><p>As robots advance in terms of <a href=\"https://spectrum.ieee.org/gemini-robotics\" target=\"_blank\">dexterity and other physical capabilities<\/a>, it becomes more likely that humans may find themselves working alongside them. If that happens, how will robots’ emotional capabilities need to advance for them to successfully work with people?<\/p><p>In a recent study, researchers trained <a href=\"https://spectrum.ieee.org/rethink-robotics-pioneer-of-collaborative-robots-shuts-down\" target=\"_blank\">collaborative robots<\/a> to read human emotions by not only accounting for facial expressions, but also contextual factors in the interactions as well. Through experiments with 40 volunteers, the researchers then evaluated how a robot’s ability to read human emotions and adjust its behavior in turn impacted a human’s perception of the robot and its capabilities as the two collaborated on tasks. The <a href=\"https://ieeexplore.ieee.org/document/11523497\" rel=\"noopener noreferrer\" target=\"_blank\">results<\/a>—which show that the emotional capabilities of robots only go so far with humans—were published 18 May in<a href=\"https://ieeexplore.ieee.org/xpl/RecentIssue.jsp?punumber=7083369\" rel=\"noopener noreferrer\" target=\"_blank\"> <em><em>IEEE Robotics and Automation Letters<\/em><\/em><\/a>.<\/p><p><a href=\"https://ieeexplore.ieee.org/author/771486883095543\" rel=\"noopener noreferrer\" target=\"_blank\">Seung Chan Hong<\/a> led the study as part of his undergraduate thesis while studying at Monash University, in Melbourne, Australia. He notes that, while there has been a lot of hype in the advancing physical abilities of robots, this is only one piece of the puzzle. “We need to also innovate when it comes to them actually interacting with humans, not just their physical capabilities,” he says.<\/p><p>This prompted him to dig deeper into the emotional aspects of human-robot interactions. First, Hong and his co-authors decided to train a robot to read human emotions using a vision language model (VLM), which is similar to large language models (LLMs) such as ChatGPT, but which can also take visual inputs.<\/p><h2>Training VLMs for Human Emotion Recognition<\/h2><p>To evaluate their VLM, which used Gemini 2.5, the researchers had volunteers watch videos of robots handing over objects to humans—with varying degrees of success—and describe the emotions the humans were expressing. Importantly, the volunteers labeling these videos were able to take into account more context in these interactions, rather than reporting solely on the facial expressions of the humans in the video. For example, a person pausing to think with a furrowed brow may simply be concentrating on their task at hand and not necessarily be angry. Contextual factors such as drumming their fingers, pursing their lips, or other behaviors can point to the real cause of a person’s furrowed brow.<\/p><p>The researchers then compared their VLM to a conventional AI system that relies on standard facial analysis and object tracking that is used in human-robot interactions. They found that the VLM outperformed the traditional approach. On a scale from 0 (no similarity in meaning to the emotion identified by the human volunteers) to 1 (a perfect match in meaning), the conventional AI system achieved a score of 0.77. In comparison, the VLM achieved a score of 0.86.<\/p><p>Hong says, “I think [the VLM] was able to align with what human observers were seeing a lot better, because it wasn’t just looking at the person’s face for a brief amount of time, but seeing the whole scene—where the person was and what they were doing, and how they were interacting with the robot.”<\/p><p>In a second experiment, the research team asked 40 volunteers to interact with a robot using their VLM—but purposefully programmed the robot to make an error. The robot then had to offer either an emotionally adaptive apology that accounted for the human’s perceived response to the mistake or a pre-scripted spoken apology.<\/p><p>Participants overwhelmingly preferred the emotionally adaptive response, with 31 out of 40 people favoring this approach over a boilerplate apology.<\/p><p>However, their survey responses underscored how this emotional adaptivity was far less important than the robot’s functionality. After collaborating with a robot that failed in its task, many participants ranked their trust in the robot as lower, regardless of how it apologized for its mistake. “A personalized apology acts as a social lubricant, but it cannot repair the trust lost by the robot failing its physical task,” Hong says.<\/p><p>Interestingly, the VLM classified the emotions of its human partners similarly to human volunteers who observed an interaction from a third-party perspective. But when the VLM’s assessments were measured against humans’ self-reported emotions during the second experiment—the most accurate descriptions of their true emotions—its ability to accurately predict emotions dropped significantly.<\/p><p>“While the VLM is a good observer of outward social cues, it isn’t a mind reader,” Hong says. “It matched third-person human observers well, but it didn’t always align with the users‘ internal, self-reported feelings.”<\/p><p>Together, these results show that robots are not perfect at reading human emotions. So while people might appreciate their efforts, they still ultimately will want competent co-workers.<\/p><p><em>This story was updated on 15 June 2026 to correct where the research was conducted and clarify that the researchers evaluated the performance of a pre-trained model. <\/em><br /><\/p>"}, {"title": "Windows for robots: Edge AI expands usability", "source": "Robotics Business Review", "date": "2026-06-13", "url": "https://www.therobotreport.com/computers-software-windows-utility-robots/", "summary": "<p>Before Windows, only engineers and computer scientists could work with computers. Edge AI is causing a similar accessibility shift for robotics.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/computers-software-windows-utility-robots/\">Windows for robots: Edge AI expands usability<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Example: Robotics deployment update", "source": "Example Robotics", "date": "2026-06-12", "url": "https://example.com/robotics-news", "summary": "Example robotics seed item."}, {"title": "Award-Winning Researcher Trains Robots to Make Educated Guesses", "source": "IEEE Spectrum Robotics", "date": "2026-06-12", "url": "https://spectrum.ieee.org/researcher-trains-robots-to-guess", "summary": "<img src=\"https://spectrum.ieee.org/media-library/a-young-asian-professor-monitors-her-student-as-they-control-a-robotic-gripper.jpg?id=66879067&amp;width=1245&amp;height=700&amp;coordinates=0%2C469%2C0%2C469\" /><br /><br /><p><a href=\"https://yenlingkuo.com\" rel=\"noopener noreferrer\" target=\"_blank\">Yen-Ling Kuo<\/a> always wanted to understand how things worked. When she was growing up in Taiwan, reading the story of <a href=\"https://ethw.org/Michael_Faraday\" rel=\"noopener noreferrer\" target=\"_blank\">Michael Faraday<\/a> in elementary school piqued her curiosity about the natural world. During that time, she was introduced to <a href=\"https://en.wikipedia.org/wiki/Logo_(programming_language)\" rel=\"noopener noreferrer\" target=\"_blank\">Logo<\/a>, a computer program with a turtle cursor to help children learn basic coding through hands-on experimentation.<\/p><p>It was Kuo’s introduction to programming logic.<\/p><h3>Yen-Ling Kuo<\/h3><br /><p><strong>Employer<\/strong><\/p><p>University of Virginia in Charlottesville<\/p><p><strong>Title<\/strong><\/p><p>Assistant professor of computer science <\/p><p><strong>Member grade<\/strong><\/p><p>Member<\/p><p><strong>Alma maters<\/strong><\/p><p>National Taiwan University; MIT<\/p><p>In high school she learned the capacity computers held. She could write programs that completed tasks independently, she realized.<\/p><p>“Once I discovered how powerful computers could be,” she says, “I knew I wanted to focus on using them to solve real-world problems.”<\/p><p>Kuo, an IEEE member, never lost her interest in the “how” behind processes and tools. Her curiosity, combined with a stint working at a Silicon Valley company, led her to focus on innovations that live at the intersection of cognitive and computer sciences. <\/p><p>Kuo, now an <a href=\"https://engineering.virginia.edu/faculty/yen-ling-kuo\" rel=\"noopener noreferrer\" target=\"_blank\">assistant professor<\/a> of computer science at the <a href=\"https://www.virginia.edu/\" rel=\"noopener noreferrer\" target=\"_blank\">University of Virginia<\/a> in Charlottesville, last year received the <a href=\"https://www.ieee-ras.org\" rel=\"noopener noreferrer\" target=\"_blank\">IEEE Robotics and Automation Society<\/a>’s inaugural <a href=\"https://engineering.virginia.edu/news-events/news/more-honors-computer-scientist-wins-2025-wira-early-career-contribution-award\" rel=\"noopener noreferrer\" target=\"_blank\">Outstanding Women in Robotics and Automation Early Career Contribution Award<\/a>. The award is part of the <a href=\"https://www.ieee-ras.org/wira-paper-awards-icra25/\" rel=\"noopener noreferrer\" target=\"_blank\">IEEE-RAS Women in Engineering’s Outstanding Women in Robotics and Automation (WiRA) Paper Awards<\/a>, which promote excellence and recognize the impact that female researchers have on robotics and automation fields at different stages in their academic careers.<\/p><p>Kuo’s winning paper, “<a href=\"https://diffdagger.github.io/\" rel=\"noopener noreferrer\" target=\"_blank\">Diff-DAgger: Uncertainty Estimation with Diffusion Policy for Robotic Manipulation<\/a>,” demonstrates a novel method to help robots better identify and estimate uncertainty when faced with scenarios on which they’ve not been trained. The method reduces the amount of human supervision, improves a robot’s rate of successful task completion, and opens up a path to introduce more complex models with bigger data demands into interactive robot learning.<\/p><p>She says her research will help people working in the robotics and automation fields more efficiently collect the data needed for effective model training.<\/p><h2>Silicon Valley’s impact<\/h2><p>Kuo earned bachelor’s and master’s degrees in computer science at the <a href=\"https://www.ntu.edu.tw/english/\" rel=\"noopener noreferrer\" target=\"_blank\">National Taiwan University<\/a>, in Taipei, in 2009 and 2012. As she was nearing completion of her master’s degree, she did what many computer science graduates do: She pursued a summer internship at a tech company.<\/p><p>She spent
