"source": "Robotics Business Review", "date": "2026-09-01", "url": "https://www.therobotreport.com/learn-how-physical-ai-is-being-used-to-do-real-work-at-robobusiness/", "summary": "<p>Leaders at Amazon Robotics, Teradyne Robotics, and Cobot will discuss how they're applying physical AI to robots operating in customer environments.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/learn-how-physical-ai-is-being-used-to-do-real-work-at-robobusiness/\">Learn how physical AI is being used to do real work at RoboBusiness<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Visko launches Orbis live model and closes pre-seed funding round", "source": "Robotics Business Review", "date": "2026-09-01", "url": "https://www.therobotreport.com/visko-launches-orbis-live-model-closes-pre-seed-funding-round/", "summary": "<p>Visko says Orbis streams 4K video at 24 frames per second, responds to user intervention, and sustains hour-scale generation without drift.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/visko-launches-orbis-live-model-closes-pre-seed-funding-round/\">Visko launches Orbis live model and closes pre-seed funding round<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Top 10 robotics stories of August 2026", "source": "Robotics Business Review", "date": "2026-09-01", "url": "https://www.therobotreport.com/top-10-robotics-stories-of-august-2026/", "summary": "<p>August 2026's top 10 stories included large funding rounds, updates in the humanoid robot industry, and the latest physical AI models. <\/p>\n<p>The post <a href=\"https://www.therobotreport.com/top-10-robotics-stories-of-august-2026/\">Top 10 robotics stories of August 2026<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Early bird pricing for RoboBusiness 2026 ends August 31", "source": "Robotics Business Review", "date": "2026-08-31", "url": "https://www.therobotreport.com/early-bird-pricing-for-robobusiness-2026-ends-august-31/", "summary": "<p>Early bird pricing for RoboBusiness 2026, which saves attendees $200 on full conference passes, will end Aug. 31.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/early-bird-pricing-for-robobusiness-2026-ends-august-31/\">Early bird pricing for RoboBusiness 2026 ends August 31<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Skild AI unveils S1 flagship robot foundation model", "source": "Robotics Business Review", "date": "2026-08-31", "url": "https://www.therobotreport.com/skild-ai-unveils-s1-flagship-robot-foundation-model/", "summary": "<p>Skild AI says its S1 robot foundation model enables robots to learn new tasks just by seeing a video of it being performed.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/skild-ai-unveils-s1-flagship-robot-foundation-model/\">Skild AI unveils S1 flagship robot foundation model<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "How better grippers can unlock physical AI", "source": "Robotics Business Review", "date": "2026-08-31", "url": "https://www.therobotreport.com/how-better-grippers-can-unlock-physical-ai/", "summary": "<p>Physical AI depends on smarter grippers to give robots the dexterity, sensing and adaptability needed to handle real-world tasks.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/how-better-grippers-can-unlock-physical-ai/\">How better grippers can unlock physical AI<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Reframe Systems raises $40M to scale its robotic microfactories for home building", "source": "Robotics Business Review", "date": "2026-08-31", "url": "https://www.therobotreport.com/reframe-systems-raises-40m-scale-robotic-microfactories-home-building/", "summary": "<p>Reframe Systems aims to build a network of automated microfactories near communities where homes are needed.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/reframe-systems-raises-40m-scale-robotic-microfactories-home-building/\">Reframe Systems raises $40M to scale its robotic microfactories for home building<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "The edge AI wall: Why embodied AI requires new mathematics", "source": "Robotics Business Review", "date": "2026-08-30", "url": "https://www.therobotreport.com/edge-ai-wall-why-embodied-ai-requires-new-mathematics/", "summary": "<p>Computational overload is not a bug of a specific planner, but an edge AI wall limiting physical and embodied AI.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/edge-ai-wall-why-embodied-ai-requires-new-mathematics/\">The edge AI wall: Why embodied AI requires new mathematics<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "The differences between decentralized and centralized power in swarm robotics", "source": "Robotics Business Review", "date": "2026-08-29", "url": "https://www.therobotreport.com/differences-between-decentralized-centralized-power-swarm-robotics/", "summary": "<p>A robotic swarm typically relies on centralized or decentralized power management, but a hybrid approach could offer the best of both.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/differences-between-decentralized-centralized-power-swarm-robotics/\">The differences between decentralized and centralized power in swarm robotics<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Video Friday: Meet Microduck", "source": "IEEE Spectrum Robotics", "date": "2026-08-28", "url": "https://spectrum.ieee.org/video-friday-microduck-robot", "summary": "<img src=\"https://spectrum.ieee.org/media-library/colorful-desk-robots-posed-among-books-beside-an-open-laptop-in-an-office.png?id=67687638&amp;width=1200&amp;height=800&amp;coordinates=241%2C0%2C242%2C0\" /><br /><br /><p><span>Video Friday is your weekly selection of awesome robotics videos, collected by your friends at <\/span><em>IEEE Spectrum<\/em><span> robotics. We also post a weekly calendar of upcoming robotics events for the next few months. Please <\/span><a href=\"mailto:automaton@ieee.org?subject=Robotics%20event%20suggestion%20for%20Video%20Friday\">send us your events<\/a><span> for inclusion.<\/span><\/p><h5><a href=\"https://humanoidssummit.com/\">Humanoids Summit Seoul<\/a>: 22–23 September 2026, SEOUL<\/h5><h5><a href=\"https://2026.ieee-iros.org/\">IROS 2026<\/a>: 27 September–1 October 2026, PITTSBURGH<\/h5><h5><a href=\"https://www.corl.org/\">CoRL 2026<\/a>: 9–12 November 2026, AUSTIN, TEXAS<\/h5><p>Enjoy today’s videos!<\/p><div class=\"horizontal-rule\"><\/div><div><span style=\"display: none;\"> <\/span><\/div><p class=\"rm-anchors\" id=\"ratzeygbgfu\">Nvidia just paid US $12.9 billion for the company that acquired Pollen Robotics, and this must be why.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><blockquote>Meet Microduck. 🦆 The 25-centimeter, 780-gram robot that waddles, falls, gets back up, and learns new tricks.<br /><br />Packed inside: 15 degrees of freedom, a front camera, an 8x8 lidar, two IMUs, mics, a speaker, NFC, Wi-Fi, and Bluetooth.<br /><br />Out of the box, Microduck already walks, sits, crouches, roller skates, picks up objects with its articulated beak, and recovers from falls on its own. Drive it with a game controller, plug-in accessories, and NFC tagged objects, run autonomous behaviors, or gather several Microducks for races and football. <br /><br />Software fully open source. Ready for whatever you throw at it.<\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"> <span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p><span>On pre-order for an astonishingly low $399, and ships before Christmas.<\/span><\/p><p>[ <a href=\"https://pollen-robotics.com/microduck/\">Microduck<\/a> ]<\/p><p>Thanks, Matthieu!<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"tbgy6brdxqu\">If you’ve chosen to ignore all the earlier <a href=\"https://spectrum.ieee.org/video-friday-darpa-heavy-lift-challenge\" target=\"_blank\">DARPA Lift Challenge<\/a> videos that we’ve posted, now you can get all caught up in about five minutes.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.darpa.mil/research/challenges/lift\">DARPA<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"uzv-96uhiqc\">You had me at “54-gram robot that out-jumps a kangaroo.”<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://ieeexplore.ieee.org/document/11553415\"><em>IEEE Transactions on Robotics<\/em><\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"vwen7knkzk4\">Sometimes, you just need a video like this.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><blockquote><em>Most fish-inspired robots are built for one size and one job, so scaling them up or down usually means starting from scratch. A team of engineers says it has found a way to solve that problem. They’ve unveiled ScaFi, a robot modeled on fish like cod and mackerel.<\/em><\/blockquote><p>[ <a href=\"https://engineering.nyu.edu/news/robot-grows-fish-not-machine\">New York University<\/a> ]<\/p><p>Thanks, Leah!<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"8qlvfdpz4qq\">Martin writes, “We’re a small robotics team in Czechia, Europe, building practical hardware around the <a href=\"https://spectrum.ieee.org/unitree-g1\" target=\"_blank\">Unitree G1<\/a>. Here’s a short demo of our lightweight gripper picking up a strawberry; the gripper weighs under 200 grams and is designed for simple, sensitive manipulation without adding a complex multifinger hand.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://sentiorobotix.com/gripper\">Sentio Robotix<\/a> ]<\/p><p>Thanks, Martin!<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"3kzjnb42dnm\">Hybrid visual markers that are useful for both cameras and lidar is a neat idea.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://binitshah.github.io/blog/stretch-4-autodocking/\">Hello Robot<\/a> ]<\/p><p>Thanks, Binit!<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"j_rrgxeaxfc\"><em>EmoLo brings emotion-inspired expressive locomotion to Open Duck Mini V2, a low-cost, open-source bipedal robot inspired by Disney’s BDX droids. With a single reinforcement learning policy, the robot can generate distinct walking styles associated with different emotional expressions, showing how characterful and expressive whole-body motion can be achieved on an accessible robotic platform.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://mertcookimg.github.io/emolo/\">EmoLo<\/a> ]<\/p><p>Thanks, Masato!<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"3c2s1zhuvum\">If it’s possible for a robot with a completely immobile face to look frustrated, this robot absolutely does, starting at three minutes into this video.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://elib.dlr.de/218609/\">DLR RM<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"zvumtotghu0\"><em>Noble Machines deployed its first general-purpose robots to a Fortune Global 500 industrial customer within 18 months of the company’s launch and met its first delivery milestone, made possible by its AI-driven whole-body control and industry-leading end-to-end autonomy.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.businesswire.com/news/home/20260303533339/en/Noble-Machines-Emerges-from-Stealth-Ships-and-Deploys-General-Purpose-Robots-for-Industrys-Toughest-Jobs\">Noble Machines<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"u3hru7dacvy\"><em>We’ve reduced the time it takes to go from physical prompt → robot behavior. The faster anyone can teach a robot to do something new, the easier it becomes to scale physical work.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://generalistai.com/blog/gen-1.5\">Generalist<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"3hrjrztzkni\">I know this video is mostly a gimmick, but I would totally rent a moderately heavy lift quadruped for a couple of days to help with a move.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.deeprobotics.cn/en\">DEEP Robotics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"4u52yao8g3a\">Is taking two minutes to excellently fold a shirt too long, or do we even care how long it takes, as long as it’s a robot doing it?<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://robotics.tokyo/\">Tokyo Robotics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"npovvg-8yoe\"><em>TRON 2 × Wuji Hand 2 handles TCM pharmacy work: picking, weighing, grinding, and packaging. The omnidirectional base frees the hands, while precise gripping and dual-arm force control enable midair operations.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.limxdynamics.com/en\">LimX Dynamics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"forsxxxit4i\">Person who genuinely knows things about robots, Christian Hubicki, explains everything about robots smashing into walls.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.christianhubicki.com/\">Christian Hubicki<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div>"}, {"title": "EXL acquires physical AI model developer iMerit", "source": "Robotics Business Review", "date": "2026-08-28", "url": "https://www.therobotreport.com/exl-acquires-physical-ai-model-developer-imerit/", "summary": "<p>The EXL and iMerit executives explain how their companies' combined expertise and platforms will help developers with reliable physical AI.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/exl-acquires-physical-ai-model-developer-imerit/\">EXL acquires physical AI model developer iMerit<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "How Locus Robotics is getting a grasp on one of robotics biggest challenges: manipulation", "source": "Robotics Business Review", "date": "2026-08-28", "url": "https://www.therobotreport.com/locus-getting-grasp-one-robotics-biggest-challenges-manipulation/", "summary": "<p>Locus Robotics recently acquired Nexera Robotics, which create unique soft picking technology, bolstering its manipulation capabilities.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/locus-getting-grasp-one-robotics-biggest-challenges-manipulation/\">How Locus Robotics is getting a grasp on one of robotics biggest challenges: manipulation<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "From teach and repeat to SelfPath AI: The next robotics leap", "source": "Robotics Business Review", "date": "2026-08-28", "url": "https://www.therobotreport.com/from-teach-repeat-to-selfpath-ai-next-robotics-leap/", "summary": "<p>John Black, chief technology officer at Brian Corp, shares insights on how to build trust for robotics fleets and AI.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/from-teach-repeat-to-selfpath-ai-next-robotics-leap/\">From teach and repeat to SelfPath AI: The next robotics leap<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Deere faces headwinds in Q3 update and announces Reservoir R&D partnership", "source": "Robotics Business Review", "date": "2026-08-28", "url": "https://www.therobotreport.com/deere-faces-headwinds-in-q3-update-and-announces-10m-reservoir-rd-partnership/", "summary": "<p>Deere beats Q3 expectations, raises guidance, and partners with Reservoir on a $10 million agtech AI initiative.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/deere-faces-headwinds-in-q3-update-and-announces-10m-reservoir-rd-partnership/\">Deere faces headwinds in Q3 update and announces Reservoir R&#038;D partnership<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Teradyne Robotics ramps up fight against cobot copycats", "source": "Robotics Business Review", "date": "2026-08-27", "url": "https://www.therobotreport.com/teradyne-robotics-sues-another-chinese-cobot-maker/", "summary": "<p>Teradyne Robotics sued cobot maker JAKA over alleged patent infringement, marking its second battle with a Chinese cobot company in 2026.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/teradyne-robotics-sues-another-chinese-cobot-maker/\">Teradyne Robotics ramps up fight against cobot copycats<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "NSF to invest $90M into three new technology centers, including one focused on robotics", "source": "Robotics Business Review", "date": "2026-08-27", "url": "https://www.therobotreport.com/nsf-invests-90m-three-new-technology-centers-including-one-focused-robotics/", "summary": "<p>One of the new NSF funded centers will be the Center for Human and Robot Co-Adaptation, led by The University of Texas at Austin.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/nsf-invests-90m-three-new-technology-centers-including-one-focused-robotics/\">NSF to invest $90M into three new technology centers, including one focused on robotics<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Carbon Robotics partners with iMerit to power instant in-field AI customization", "source": "Robotics Business Review", "date": "2026-08-27", "url": "https://www.therobotreport.com/carbon-robotics-partners-with-imerit-to-power-instant-in-field-ai-customization/", "summary": "<p>Carbon Robotics introduced a plant foundation AI model and tractor kit, enabling farmers to customize laser weeding.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/carbon-robotics-partners-with-imerit-to-power-instant-in-field-ai-customization/\">Carbon Robotics partners with iMerit to power instant in-field AI customization<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Bedrock Robotics’ first operator-free excavator deployments take off", "source": "Robotics Business Review", "date": "2026-08-26", "url": "https://www.therobotreport.com/bedrock-robotics-first-operator-free-excavator-deployments-take-off/", "summary": "<p>Bedrock Robotics deploys autonomous excavators to active job sites, tackling construction labor shortages with AI-powered heavy machinery.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/bedrock-robotics-first-operator-free-excavator-deployments-take-off/\">Bedrock Robotics&#8217; first operator-free excavator deployments take off<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "IDS Imaging adds Nion ToF sensor to its portfolio of 3D cameras", "source": "Robotics Business Review", "date": "2026-08-26", "url": "https://www.therobotreport.com/ids-imaging-adds-nion-tof-camera-portfolio-3d-cameras/", "summary": "<p>IDS said Nion is suitable for applications where precise 3D data is required at real-world process speeds, such as logistics and robotics. <\/p>\n<p>The post <a href=\"https://www.therobotreport.com/ids-imaging-adds-nion-tof-camera-portfolio-3d-cameras/\">IDS Imaging adds Nion ToF sensor to its portfolio of 3D cameras<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Gatik brings in $200M to continue expanding autonomous trucking operations", "source": "Robotics Business Review", "date": "2026-08-26", "url": "https://www.therobotreport.com/gatik-brings-in-200m-to-continue-expanding-autonomous-trucking-operations/", "summary": "<p>Gatik said the funding will help it expand its model built around high-frequency regional routes connecting distribution centers and stores.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/gatik-brings-in-200m-to-continue-expanding-autonomous-trucking-operations/\">Gatik brings in $200M to continue expanding autonomous trucking operations<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "AI Companion Robots Are Closing the Human Connection in Modern Homes", "source": "IEEE Spectrum Robotics", "date": "2026-08-25", "url": "https://spectrum.ieee.org/ollobot-ai-companion-robot", "summary": "<img src=\"https://spectrum.ieee.org/media-library/cute-home-robot-on-carpet-in-cozy-living-room-with-beige-sofa-and-warm-lighting.jpg?id=67154308&amp;width=1200&amp;height=800&amp;coordinates=0%2C0%2C0%2C0\" /><br /><br /><p><em>This article is brought to you by <a href=\"https://ollobot.com/\" target=\"_blank\">Ollobot<\/a>.<\/em><\/p><p>From about 2017, individuals began to truly connect with the initial wave of companion robots. These devices had personality, moved around, joked, and answered when you spoke to them. Most early companion robots, however, were still limited by simple voice-command interactions and narrow functionality. Once the novelty wore off, many ended up sitting unused on shelves. As some of those companies went out of business and turned off their servers, many owners likened it to losing a pet.<\/p><p>What Ollobot describes as “gentle intelligence” is a useful way to think about where the serious work in this category is going. Not toward more powerful assistants, but toward more present ones.<\/p><h2><a target=\"_blank\"><\/a>The problem companion robots were trying to solve<strong><\/strong><\/h2><p>Loneliness is not a niche issue. According to one <a href=\"https://pmc.ncbi.nlm.nih.gov/articles/PMC9957792/\" target=\"_blank\">study<\/a>, nearly one out of three elderly adults resides alone, meaning they do not have daily companions. <a href=\"https://pubmed.ncbi.nlm.nih.gov/20533912/\" target=\"_blank\">Research<\/a> also shows that children whose parents have migrated for work, leaving them in the care of relatives, were 2.5 times more likely to experience loneliness than children whose parents remain with them. Among working adults living alone in urban environments, similar <a href=\"https://pmc.ncbi.nlm.nih.gov/articles/PMC6530780/\" target=\"_blank\">patterns<\/a> of social isolation emerge, even if they are less visible.<\/p><p>Over the years, technology has time and again attempted to solve this problem via video calls, smart speakers, and messaging apps without much success. Those tools are geared towards communication between people that already have relationships. They do not create presence. They schedule it. That is the gap that a new generation of AI companion robots is being engineered to fill.<\/p><h2><a target=\"_blank\"><\/a>Today’s AI robots are different<strong><\/strong><\/h2><p>Today’s companion robots are not just cute and cuddly. They are designed with psychological research, clinical insight and long-term interaction models to be truly useful in real homes.<\/p><p>Three fundamental shifts define the current generation:<\/p><ol><li><strong>From reactive to proactive response. <\/strong>Older robots relied on you speaking to them, but modern robots monitor a room with cameras, microphones, and surroundings sensors to initiate interactions without your input, and they can pick up on your emotions.<\/li><li><strong>From function-oriented to emotion-oriented design.<\/strong> The original pitch for companion robots was about what they could do. The question driving the serious work now is how they make you feel, which is a harder engineering problem and a more honest framing of what the product is actually for.<\/li><li><strong>From standalone hardware to connected ecosystems.<\/strong> Leading brands are creating platforms rather than devices with software included as a built-in layer and remote access from the beginning.<\/li><\/ol><p>The <a href=\"https://www.grandviewresearch.com/industry-analysis/ai-companion-market-report?__cf_chl_f_tk=xJq0xhwCGb6n830sK3lMN.cyk2m73bms6.RauBufPho-1783406928-1.0.1.1-TsUMt2nxUgZ5nDX79zhxxVYkTv9xk2r_.E2rbXRHByA\" target=\"_blank\">global AI companion market<\/a> size was valued at US $36.8 billion in 2025 and is projected to grow from $48 billion in 2026 to $318 billion by 2033, at a compound annual growth rate of 31 percent from 2026 to 2033.<em><span><br /><\/span><\/em><\/p><h2><a target=\"_blank\"><\/a>Three household scenarios and interaction models<strong><\/strong><\/h2><p>Ollobot’s advanced AI family companion robot <a href=\"https://ollobot.com/\" target=\"_blank\"><span>OlloNi SS1<\/span><\/a> addresses a number of gaps in what existing technology offers.<\/p><p><strong>Elderly individuals living alone.<\/strong> The combination of proactive interaction, fall detection, and persistent presence addresses both safety and companionship without the social overhead of asking family members to check in more frequently.<\/p><p><strong>Children in households where parents work far from home.<\/strong> The SS1 functions as a consistent companion that already knows a child, their preferences, their moods, and their routines. The remote connection features allow parents to stay present without requiring a scheduled call, and the life recording system gives them a passive window into their child’s days that feels less clinical than a monitoring camera.<\/p><p><strong>Single professionals living alone in cities.<\/strong> The SS1 adapts to daily routines, builds up a preference model over time, and provides ambient social presence without demands.<\/p><p class=\"shortcode-media shortcode-media-rebelmouse-image\"> <img alt=\"Cute home robot with a purple cover and cartoon face displayed on its screen.\" class=\"rm-shortcode\" id=\"8d48b\" src=\"https://spectrum.ieee.org/media-library/cute-home-robot-with-a-purple-cover-and-cartoon-face-displayed-on-its-screen.jpg?id=67154351&amp;width=980\" /> <small class=\"image-media media-caption\">OlloNi SS1 adapts to daily routines over time.<\/small><small class=\"image-media media-photo-credit\">Ollobot<\/small><\/p><h2>What OlloNi SS1 is doing differently?<\/h2><p>Ollobot’s goal in building intelligent companion robots is to address the gaps in technology and capability, using innovation not to automate tasks but to fill emotional voids.<\/p><p>Much of the robotics industry has historically pursued human imitation — machines that speak, look, or behave like people. The SS1 is instead designed around familiarity and long-term coexistence rather than realism.<\/p><p>The system integrates multiple subsystems operating in parallel, including visual perception, audio processing, mobility control, and interaction management. It is equipped with a multi-chip AI 4K vision module capable of facial recognition and motion tracking. One small but revealing detail is the inclusion of a physical privacy cover for the camera — a mechanical solution to concerns that software settings alone may not fully resolve.<\/p><p class=\"shortcode-media shortcode-media-rebelmouse-image\"> <img alt=\"Person playing with a red plush robot toy that has a glowing digital face and eyes\" class=\"rm-shortcode\" id=\"daa03\" src=\"https://spectrum.ieee.org/media-library/person-playing-with-a-red-plush-robot-toy-that-has-a-glowing-digital-face-and-eyes.jpg?id=67154349&amp;width=980\" /> <small class=\"image-media media-caption\">OlloNi SS1 can actively integrate into family activities, and it can autonomously move closer to capture memorable moments or reposition itself to remain engaged in ongoing interactions.<\/small><small class=\"image-media media-photo-credit\">Ollobot<\/small><\/p><p><span>The robot supports advanced mobility across multiple indoor surfaces, including wooden floors, ceramic tiles, and low-pile carpets, with slope climbing capability up to 3.5 degrees. Rather than remaining in a fixed location, it can move naturally throughout the home to stay close to household members as daily activities unfold. <\/span><\/p><p><span>For example, the OlloNi SS1 may greet family members when they arrive home, follow an older adult from the living room to the kitchen while continuing a conversation, remind a child to take a study break after a prolonged period of inactivity, or notice that someone appears unusually quiet and gently check in. During family activities, it can autonomously move closer to capture memorable moments or reposition itself to remain engaged in ongoing interactions.<\/span><\/p><p class=\"pull-quote\">The robot continues to evolve over time, with over-the-air updates that deliver new features, performance improvements, and AI enhancements<\/p><p>It also incorporates fall detection with optimized accuracy for safety monitoring scenarios. A 6-microphone array enables omnidirectional voice pickup with an effective voice capture range of up to 5 meters, supporting reliable wake-word detection and far-field interaction.<\/p><p>To support continuous companionship, much of the robot’s AI processing takes place directly on the device through its “heart module” architecture, with 16 GB of memory and 64 GB of local storage. This enables the system to retain household memories, recognize familiar faces, and respond with lower latency, making interactions feel more natural even during everyday routines.<\/p><p>Because companion robots are expected to remain available throughout the day rather than only during brief interactions, the SS1 is designed for extended operation, offering up to 12 hours of standby time and around 5 hours of active interaction on a single charge. This allows it to accompany users through meals, conversations, playtime, and other daily activities without frequent interruptions.<\/p><p class=\"shortcode-media shortcode-media-rebelmouse-image\"> <img alt=\"Close-up of toy robot with glowing red heart and purple fur on a beige body.\" class=\"rm-shortcode\" id=\"0261b\" src=\"https://spectrum.ieee.org/media-library/close-up-of-toy-robot-with-glowing-red-heart-and-purple-fur-on-a-beige-body.jpg?id=67154317&amp;width=980\" /> <small class=\"image-media media-caption\">To support engaging interactions, much of the robot’s AI processing takes place directly on the device through its “heart module” architecture.<\/small><small class=\"image-media media-photo-credit\">Ollobot<\/small><\/p><p><span>Like the relationships it is designed to build, the robot continues to evolve over time. Running on Android OS with over-the-air (OTA) updates, the system continuously receives new features, performance improvements, and AI enhancements, allowing its capabilities to grow alongside the household it serves.<\/span><\/p><p>The robot’s behavioral model also improves over time. Rather than reacting to isolated commands, it attempts to establish a baseline understanding of household routines and individuals. Changes in behavior — prolonged quietness, unusual inactivity, or emotional cues — become triggers for interaction.<\/p><h2>Presence instead of utility<\/h2><p>Several features in the OlloNi SS1 illustrate this emphasis on presence and continuity in its interactions.<\/p><p>The system can identify different household members, including pets, and adapt responses accordingly. Remote communication features allow family members to connect through the device without treating every interaction like a scheduled call. Environmental sensors support contextual reminders tied to weather or room conditions.<\/p><p>Its “2+1” multi-display configuration is also designed around emotional communication. Two circular side displays function as expressive “emotional eyes,” while a separate primary display handles information and structured interaction. The separation allows emotional signaling and functional communication to operate independently, creating more intuitive nonverbal interaction even when no dialogue is taking place.<\/p><p class=\"shortcode-media shortcode-media-rebelmouse-image\"> <img alt=\"Cute red robot pet in checkered shirt sits on rug in cozy, warmly lit living room\" class=\"rm-shortcode\" id=\"5f2a7\" src=\"https://spectrum.ieee.org/media-library/cute-red-robot-pet-in-checkered-shirt-sits-on-rug-in-cozy-warmly-lit-living-room.jpg?id=67154312&amp;width=980\" /> <small class=\"image-media media-caption\">The robot’s behavioral model improves over time. Rather than reacting to isolated commands, it attempts to establish a baseline understanding of household routines and individuals.<\/small><small class=\"image-media media-photo-credit\">Ollobot<\/small><\/p><p>The SS1 also includes an automated life-recording system built on facial recognition and behavioral-event detection that can capture moments such as laughter, physical closeness, or group interaction automatically. An integrated AI vlog engine can then organize those moments into edited short-form videos with automated sequencing and soundtrack generation. The design intent is to preserve spontaneous domestic moments without requiring active documentation behavior from users.<\/p><p class=\"pull-quote\">An integrated AI vlog engine can<span> organize recorded<\/span><span> moments into edited short-form videos with automated sequencing and soundtrack generation<\/span><\/p><p>Visual data is processed primarily on the device through the SS1’s on-device AI architecture, with household memories stored locally and managed within Ollobot’s proprietary ecosystem instead of being shared with third-party smart home platforms. Access to recordings and live feeds is restricted to authorized users through the companion app, while encrypted communication helps protect data during remote access. Users also retain direct control over recording preferences, and the physical camera privacy cover provides an additional hardware-level safeguard whenever visual monitoring is not desired.<\/p><div class=\"ieee-sidebar-small\"><p class=\"shortcode-media shortcode-media-rebelmouse-image rm-float-left rm-resized-container rm-resized-container-25\" style=\"float: left;\"> <img alt=\"Ollobot logo with circular icon and bold lowercase text on light background\" class=\"rm-shortcode\" id=\"8eca7\" src=\"https://spectrum.ieee.org/media-library/ollobot-logo-with-circular-icon-and-bold-lowercase-text-on-light-background.png?id=67154360&amp;width=980\" /><\/p><p>Learn more at <a href=\"https://ollobot.com/\" target=\"_blank\">ollobot.com<\/a>.<\/p><\/div><p>Remote communication is similarly structured around persistence rather than transaction. Traditional video calls are episodic and screen-bound; the SS1 instead acts as a continuously present interface embedded inside the household environment. Through autonomous mobility, environmental awareness, and persistent household memory, remote family members interact with an ongoing domestic context.<\/p><h2><a target=\"_blank\"><\/a>The larger shift to “gentle intelligence”<\/h2><p>Ultimately, gentle intelligence is not about making robots behave more like humans — it is about helping them fit more naturally into human lives. Each OlloNi SS1 unit develops a unique behavioral profile based on its household. Two units running in different homes for a year will have become meaningfully different from each other, shaped by the specific people, habits, and rhythms of where they live.<\/p><p>That kind of long-term personalization is what early companion robots never had. It is also what makes the difference between a product that ends up on a shelf and one that actually earns its place in a home.<\/p><p>Learn more at <a href=\"https://ollobot.com\" target=\"_blank\">ollobot.com<\/a>.<\/p>"}, {"title": "Humans in the loop are still needed for robotaxi fleet safety, says Guident", "source": "Robotics Business Review", "date": "2026-08-25", "url": "https://www.therobotreport.com/humans-loop-are-still-needed-robotaxi-fleet-safety-says-guident/", "summary": "<p>As fleets of autonomous vehicles scale, AI and human oversight remain critical for safety, explains Guident's CEO.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/humans-loop-are-still-needed-robotaxi-fleet-safety-says-guident/\">Humans in the loop are still needed for robotaxi fleet safety, says Guident<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Jetson Orin Nano 2 doubles inference performance for robotics on the edge, says NVIDIA", "source": "Robotics Business Review", "date": "2026-08-25", "url": "https://www.therobotreport.com/jetson-orin-nano-2-doubles-inference-performance-robotics-edge-says-nvidia/", "summary": "<p>With Jetson Orin Nano 2, NVIDIA says that frontier intelligence has reached the edge and can now run in real time.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/jetson-orin-nano-2-doubles-inference-performance-robotics-edge-says-nvidia/\">Jetson Orin Nano 2 doubles inference performance for robotics on the edge, says NVIDIA<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "XPeng Motors humanoid robot unit Dogotix raises $900M", "source": "Robotics Business Review", "date": "2026-08-24", "url": "https://www.therobotreport.com/xpeng-motors-humanoid-robot-unit-dogotix-raises-900m/", "summary": "<p>Dogotix, the humanoid unit of XPeng Motors, has attained a valuation of $6.3 billion as it plans to produce robots at scale.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/xpeng-motors-humanoid-robot-unit-dogotix-raises-900m/\">XPeng Motors humanoid robot unit Dogotix raises $900M<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "The next big AI play isn’t apps or humanoids; it’s machines with brains and brawn", "source": "Robotics Business Review", "date": "2026-08-24", "url": "https://www.therobotreport.com/the-next-big-ai-play-isnt-apps-or-humanoids-its-machines-with-brains-and-brawn/", "summary": "<p>For agricultural and construction equipment makers to stay relevant as workforces dwindle, they need to add AI, says Agtonomy's founder.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/the-next-big-ai-play-isnt-apps-or-humanoids-its-machines-with-brains-and-brawn/\">The next big AI play isn&#8217;t apps or humanoids; it&#8217;s machines with brains and brawn<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Use a digital twin to explore automation before committing capital", "source": "Robotics Business Review", "date": "2026-08-23", "url": "https://www.therobotreport.com/use-digital-twin-explore-automation-before-committing-capital/", "summary": "<p>While a digital twin does not necessarily replace a systems integrator, it can help manufacturers evaluate robots and plan applications, says RoboDK.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/use-digital-twin-explore-automation-before-committing-capital/\">Use a digital twin to explore automation before committing capital<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "How software-defined manufacturing fits into real factory operations", "source": "Robotics Business Review", "date": "2026-08-22", "url": "https://www.therobotreport.com/how-software-defined-manufacturing-fits-into-real-factory-operations/", "summary": "<p>Roby Lynn explains how R2 Labs bridges PLCs, robots, and AI to unify fragmented manufacturing systems.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/how-software-defined-manufacturing-fits-into-real-factory-operations/\">How software-defined manufacturing fits into real factory operations<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "The technology that could bring robot mowers to one in two American lawns", "source": "Robotics Business Review", "date": "2026-08-22", "url": "https://www.therobotreport.com/technology-could-bring-robot-mowers-one-half-american-lawns/", "summary": "<p>Improvements in AI, satellite navigation, and machine vision are helping robotic lawn mowers spread in the U.S., writes Sunseeker's founder.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/technology-could-bring-robot-mowers-one-half-american-lawns/\">The technology that could bring robot mowers to one in two American lawns<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Robots don’t run themselves: The workforce powering physical AI", "source": "Robotics Business Review", "date": "2026-08-22", "url": "https://www.therobotreport.com/robots-dont-run-themselves-workforce-powering-physical-ai/", "summary": "<p>The addition of physical AI to the workforce requires more key performance indicators than throughput, according to the president of HireArt.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/robots-dont-run-themselves-workforce-powering-physical-ai/\">Robots don&#8217;t run themselves: The workforce powering physical AI<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Schaeffler plans to mass produce gearboxes for humanoid robots in 2027", "source": "Robotics Business Review", "date": "2026-08-21", "url": "https://www.therobotreport.com/schaeffler-plans-to-mass-manufacture-gearboxes-for-humanoids-in-2027/", "summary": "<p>Schaeffler is creating its strain wave gearboxes with a forming technology that will enable mass production of the components. <\/p>\n<p>The post <a href=\"https://www.therobotreport.com/schaeffler-plans-to-mass-manufacture-gearboxes-for-humanoids-in-2027/\">Schaeffler plans to mass produce gearboxes for humanoid robots in 2027<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Amazon’s Bhavana Chandrashekhar to speak at RoboBusiness’ Women in Robotics Lunch", "source": "Robotics Business Review", "date": "2026-08-21", "url": "https://www.therobotreport.com/amazons-bhavana-chandrashekhar-speaks-robobusiness-women-in-robotics-lunch/", "summary": "<p>The Women in Robotics Lunch at RoboBusiness is an opportunity to form new connections and deepen relationships.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/amazons-bhavana-chandrashekhar-speaks-robobusiness-women-in-robotics-lunch/\">Amazon&#8217;s Bhavana Chandrashekhar to speak at RoboBusiness&#8217; Women in Robotics Lunch<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Video Friday: Do We Need Superhuman Humanoid Robots?", "source": "IEEE Spectrum Robotics", "date": "2026-08-21", "url": "https://spectrum.ieee.org/video-friday-unitree-superhuman", "summary": "<img src=\"https://spectrum.ieee.org/media-library/humanoid-robot-leaps-over-200-centimeter-height-board-beside-person-in-warehouse.png?id=67655329&amp;width=1200&amp;height=800&amp;coordinates=150%2C0%2C150%2C0\" /><br /><br /><p><span>Video Friday is your weekly selection of awesome robotics videos, collected by your friends at <\/span><em>IEEE Spectrum<\/em><span> robotics. We also post a weekly calendar of upcoming robotics events for the next few months. Please <\/span><a href=\"mailto:automaton@ieee.org?subject=Robotics%20event%20suggestion%20for%20Video%20Friday\">send us your events<\/a><span> for inclusion.<\/span><\/p><h5><a href=\"https://humanoidssummit.com/\">Humanoids Summit Seoul<\/a>: 22–23 September 2026, SEOUL<\/h5><h5><a href=\"https://2026.ieee-iros.org/\">IROS 2026<\/a>: 27 September–1 October 2026, PITTSBURGH<\/h5><h5><a href=\"https://www.corl.org/\">CoRL 2026<\/a>: 9–12 November 2026, AUSTIN<\/h5><p>Enjoy today’s videos!<\/p><div class=\"horizontal-rule\"><\/div><div><span style=\"display: none;\"> <\/span><\/div><p class=\"rm-anchors\" id=\"o7okizfils4\">This is very, very cool. But I’m trying to think of what the commercial use case will be, you know? I guess, high speed, incredibly dangerous package delivery to second-floor windows or something...?<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.unitree.com/\">Unitree<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"1cllcvk-9lo\"><em>Humans have a remarkable ability to perform new physical skills from only one or a few examples. Our latest robot foundation model, GEN-1.5, exhibits the beginnings of that same ability: It can learn a new task in seconds, from a single example, without gradient updates or fine-tuning. It displays broad capabilities across one-shot and few-shots learning from demonstration, as well as zero-shot physical generalization. Although the tasks are simple and short-horizon, this is the first model we know for which one-shot and few-shots learning of physical skills have emerged at scale. We view these results as a significant step toward our mission of building general intelligence for the physical world.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>I will make the cautionary point that for many of these “the model figured it out” tasks, the blog post can only say that there was no relevant pretraining data “to the best of our knowledge.”<\/p><p>[ <a href=\"https://generalistai.com/blog/gen-1.5\">Generalist<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"hwpuyegnujs\">BeanBot is a robot inspired by Mexican jumping beans, and I need say no more.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://bsr.iit.it/\">IIT<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"rcbpit1--0w\">As a professional bagpiper who definitely pays very close attention to whatever that annoying tapping noise is coming from the back of the band, I can attest to this group of <a href=\"https://spectrum.ieee.org/cybernetic-third-arm-makes-drummers-even-more-annoying\" target=\"_blank\">robot drummers<\/a> being absolutely top-notch.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://global.agilex.ai/\">AgileX Robotics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"1zzj64jxb1m\"><em>What does it take for an aerial robot to move through a sequence of arbitrary poses—fast, precisely, and continuously? Rather than teaching the robot a behavior from data, we asked how far a first-principles analytical model could take us. Through a collaboration between the AIMS Group at the Hong Kong Polytechnic University and DRAGON Lab at the University of Tokyo, we developed the first sequential-convex-programming-based trajectory-optimization framework for generalized <a href=\"https://spectrum.ieee.org/caltech-and-jpl-firing-quadrotors-out-of-cannons\" target=\"_blank\">multirotors<\/a>, covering both conventional and omnidirectional platforms.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.dragon.t.u-tokyo.ac.jp/\">DRAGON Lab<\/a> ]<\/p><p>Thanks, Moju!<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"tqx_y8ehahc\">This is a nifty idea that adapts a kind of interface frequently used for robot training and uses it for human training instead.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://news.mit.edu/2026/mit-engineers-design-better-controller-operating-construction-diggers-0820\">MIT<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"gc54o6bzcgw\"><em>Gravis Robotics brings robotic intelligence to heavy construction machines. Our retrofit kit, the Gravis Rack, turns off-the-shelf hydraulic machines into robots. Cameras, lidar, and onboard compute lets your machine see and understand its surroundings, and learning-based control lets it work close to its limits, moving more dirt with full, fast cycles.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.gravisrobotics.com/\">Gravis Robotics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"kczc9sjylno\"><em>Robust brachiation requires precise hand movements to grasp and release bars together with highly coordinated whole-body motion. To address this challenge, we propose a learning-based framework centered on waypoint-guided reinforcement learning (WGRL). WGRL guides the end effector through waypoints while allowing RL to explore and generate dynamic whole-body behaviors. With this approach, the learned policy demonstrated robust brachiation across diverse courses with different bar heights, spacings, and orientations in sim-to-sim experiments. In the real world, our life-size dual-arm robot successfully traversed four consecutive bars.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.eva.ai.u-tokyo.ac.jp/team/\">EVARL<\/a> ]<\/p><p>Thanks, Ayumu!<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"qulo_xmvsw4\">Well, here’s a different approach to <a href=\"https://spectrum.ieee.org/persona-ai-humanoid-robot-welding\" target=\"_blank\">welding in shipyards with robots<\/a>.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://kawasakirobotics.com/applications/arc-welding/\">Kawasaki<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"p55r7gn8xi8\">We should have a lot more robots in agriculture, if only they’d lettuce.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.flexiv.com/\">Flexiv<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"ghfcvlu_iku\">We’ve all had refs like these.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.phybot.tech/en/home\">PHYBOT<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"roxyluaqabq\">I got stuck after the first 15 seconds of this video trying to imagine what any of these home humanoids would usefully do if they dropped a glass.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://en.zhejianglab.com/institutescenters/researchunits/interdisciplinaryresearchcenters/researchcenterforintelligentrobot/\">Zhejiang Humanoid<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"4oggdyyo45i\"><a href=\"https://spectrum.ieee.org/sri-shakey-robot-honored-as-ieee-milestone\" target=\"_blank\">Shakey the Robot<\/a> doesn’t get enough love.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.sri.com/\">SRI<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"qtd7zwk3mq4\"><em>This work introduces a novel approach to physical human-robot interaction (pHRI) by leveraging the joint torque sensors of standard collaborative robots. By mounting a passive, uninstrumented plexiglass touchpad to the robot’s flange, we transform the robot into a handwriting-based input interface.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://ts-robotics.github.io/pHRI-CHAR-TACT/\">TS-Robotics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div>"}, {"title": "Agtonomy releases new autonomous multi-point turning features", "source": "The Robot Report", "date": "2026-08-20", "url": "https://www.therobotreport.com/agtonomy-releases-new-autonomous-multi-point-turning-features/", "summary": "<p>Agtonomy has added autonomous multi-point turning and enhanced field data collection to its commercial off-road platform.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/agtonomy-releases-new-autonomous-multi-point-turning-features/\">Agtonomy releases new autonomous multi-point turning features<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "ATDev gives update on its journey building autonomous wheelchairs", "source": "Robotics Business Review", "date": "2026-08-20", "url": "https://www.therobotreport.com/atdev-gives-update-journey-building-autonomous-wheelchairs/", "summary": "<p>ATDev is developing a modern power wheelchair with a coordinated robotic arm that can take on reaching and lifting tasks for the user. <\/p>\n<p>The post <a href=\"https://www.therobotreport.com/atdev-gives-update-journey-building-autonomous-wheelchairs/\">ATDev gives update on its journey building autonomous wheelchairs<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Amazon plans to expand Prime Air to nearly 500 cities by the end of 2026", "source": "Robotics Business Review", "date": "2026-08-20", "url": "https://www.therobotreport.com/amazon-plans-expand-prime-air-nearly-500-cities-by-end-2026/", "summary": "<p>Amazon said its Prime Air drones can deliver nearly all items 5 lb. or less that can fit in a large shoebox.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/amazon-plans-expand-prime-air-nearly-500-cities-by-end-2026/\">Amazon plans to expand Prime Air to nearly 500 cities by the end of 2026<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Pudu Robotics launches new MP2000 autonomous forklift", "source": "Robotics Business Review", "date": "2026-08-19", "url": "https://www.therobotreport.com/pudu-robotics-launches-new-mp2000-autonomous-forklift/", "summary": "<p>Pudu Robotics has launched the MP2000, an AI-native autonomous robot designed to transport 2,000 kg loads across complex warehouse environments.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/pudu-robotics-launches-new-mp2000-autonomous-forklift/\">Pudu Robotics launches new MP2000 autonomous forklift<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Serve Robotics to deploy its autonomous delivery robots with Grubhub", "source": "Robotics Business Review", "date": "2026-08-19", "url": "https://www.therobotreport.com/serve-robotics-deploys-autonomous-delivery-robots-grubhub/", "summary": "<p>Serve's robot delivery will be available from more than 100 participating Grubhub merchants in Chicago and nearly 200 in Los Angeles.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/serve-robotics-deploys-autonomous-delivery-robots-grubhub/\">Serve Robotics to deploy its autonomous delivery robots with Grubhub<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "What does Unitree Robotics’ IPO mean for the humanoid industry?", "source": "Robotics Business Review", "date": "2026-08-19", "url": "https://www.therobotreport.com/what-does-unitree-robotics-ipo-mean-for-humanoid-industry/", "summary": "<p>Now that Unitree Robotics has made its IPO, which humanoid robotics companies will follow in its footsteps?<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/what-does-unitree-robotics-ipo-mean-for-humanoid-industry/\">What does Unitree Robotics&#8217; IPO mean for the humanoid industry?<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Kollmorgen to give a joint-by-joint guide to humanoid motion at RoboBusiness", "source": "The Robot Report", "date": "2026-08-19", "url": "https://www.therobotreport.com/kollmorgen-give-joint-by-joint-guide-humanoid-motion-robobusiness/", "summary": "<p>The talk at RoboBusiness will outline the unique demands of each body zone and the challenges of scaling for production.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/kollmorgen-give-joint-by-joint-guide-humanoid-motion-robobusiness/\">Kollmorgen to give a joint-by-joint guide to humanoid motion at RoboBusiness<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Unichem acquires Loomia to accelerate entry into the humanoid ‘skin’ market", "source": "Robotics Business Review", "date": "2026-08-18", "url": "https://www.therobotreport.com/unichem-acquires-loomia-accelerate-entry-humanoid-skin-market/", "summary": "<p>Automotive suppliers Unichem and R&#038;Y are working with Loomia to develop tactile sensors for automotive and robotics applications.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/unichem-acquires-loomia-accelerate-entry-humanoid-skin-market/\">Unichem acquires Loomia to accelerate entry into the humanoid &#8216;skin&#8217; market<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Drones With Claws Perch on Arctic Icebergs", "source": "IEEE Spectrum Robotics", "date": "2026-08-18", "url": "https://spectrum.ieee.org/arctic-iceberg-drones", "summary": "<img src=\"https://spectrum.ieee.org/media-library/a-drone-firmly-planted-on-the-steep-slope-of-an-iceberg-after-a-successful-landing.jpg?id=67573301&amp;width=1200&amp;height=800&amp;coordinates=0%2C83%2C0%2C84\" /><br /><br /><p><em><em>This article is part of our exclusive <\/em><\/em><a href=\"https://spectrum.ieee.org/collections/journal-watch/\" target=\"_self\"><em><em>IEEE Journal Watch series<\/em><\/em><\/a><em><em> in partnership with IEEE Xplore.<\/em><\/em><\/p><p>Microspines are one of many ways to enable robots to latch onto surfaces like <a href=\"https://spectrum.ieee.org/microspines-make-it-easy-for-drones-to-perch-on-walls-and-ceilings\" target=\"_self\">walls and ceilings<\/a>. Now roboticists in Canada are using the mini spikes to get drones to land on a more challenging, remote surface: icebergs.<\/p><p>Like a spider, the Ice Dart can land on and latch onto steep, slippery surfaces such as icebergs and glaciers—an increasingly useful capability as activity in the Arctic increases. The drone can grip onto icy slopes of nearly 60 degrees, which is way beyond what most humans could manage without special equipment. <\/p><p>In a recent study, researchers explained how they developed the Ice Dart drone with a special landing gear that absorbs the impact of a hard landing while holding the drone in place with tiny spines that penetrate and grip the ice.<\/p><hr /><p class=\"shortcode-media shortcode-media-youtube\"> <span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span> <\/p><p>Published in <a href=\"https://ieeexplore.ieee.org/abstract/document/11554347\" rel=\"noopener noreferrer\" target=\"_blank\"><em><em>IEEE Transactions on Field Robotics<\/em><\/em><\/a>, the study describes how the Ice Dart was able to land on icebergs and a glacier in southeast Iceland. Tests took place amid persistent winds and temperatures of 0 to 10 °C along the ruggedly breathtaking Fjallsjökull (pronounced “FYATLS-yuh-kuutl”) glacier, which empties into a lagoon filled with icebergs. The drone was able to successfully perch at speeds of up to 3 meters per second and slopes of up to 58 degrees, with a success rate of 100 percent even in wind speeds of 30 km/h<span>.<\/span><\/p><p>The researchers were motivated by a desire to allow drones to land almost anywhere in the world, since the availability of safe landing sites is one of the primary limitations on where and how drones can operate. The researchers already have a history of developing drones that can land on <a href=\"https://onlinelibrary.wiley.com/doi/full/10.1002/rob.70069\" target=\"_blank\">fast-moving trucks<\/a> as well as <a href=\"https://ieeexplore.ieee.org/abstract/document/9779538\" target=\"_blank\">trailers, boats, and steep roofs<\/a>. <\/p><h4>Ice Perching<\/h4><p>“The ability to land rather than hover can fundamentally change how drones are used in the field,” says <a href=\"https://alexislussierdesbiens.github.io/\" rel=\"noopener noreferrer\" target=\"_blank\">Alexis Lussier Desbiens<\/a>, a professor of engineering at  <a href=\"https://www.createk.co/\" rel=\"noopener noreferrer\" target=\"_blank\">Université de Sherbrooke<\/a>, in Sherbrooke, Quebec, Canada, who coauthored the study. “Once a drone has landed, energy consumption drops dramatically, allowing much longer observation periods with a small aircraft. The drone also becomes completely silent and can even reduce or eliminate its thermal and RF signature by shutting down major onboard systems.”<\/p><p>Landing on icebergs specifically allows drones to monitor them for days or months, producing more detailed observation than a quick aerial surveillance mission. This could simplify iceberg tracking compared to methods such as helicopter deployment, dropped instruments, or dart-like tracking devices, and provide another data layer to satellite and ship-based iceberg detection, according to the researchers. It could also provide a means of monitoring icebergs that are otherwise untrackable.<\/p><p>With its carbon-fiber construction, the Ice Dart drone weighs just 2.65 kg and has four legs arranged in an X shape, attached to its body with a pivot joint. Used in the group’s <a href=\"https://www.youtube.com/watch?v=tTUVr1Ogag0\" rel=\"noopener noreferrer\" target=\"_blank\">previous drone research<\/a>, this landing gear disperses energy to reduce impact and overcomes multiple engineering challenges. The friction shock absorbers consist of 38 disks that generate friction torque as the legs move up and down upon impact. This lowers the UAV’s center of mass and helps spread out the kinetic energy of landing, but the real trick comes in the form of two retractable spines on each foot—one for uphill and one for downhill grip. The larger spine engages on the more heavily loaded downhill feet, and the smaller, thinner spine engages more easily on the uphill feet, even under very low loads on steep slopes. The spines only penetrate the ice as the suspension compresses, generating grip and protecting them from high-impact forces. <\/p><p>“The inspiration for the retractable spines in the feet came from looking at a cat’s claws and their ability to deploy only when needed,” says <a href=\"https://www.linkedin.com/in/isaac-tunney-10094912a/\" rel=\"noopener noreferrer\" target=\"_blank\">Isaac Tunney<\/a>, a Université de Sherbrooke postdoc in mechanical and robotics engineering who was lead author of the paper. “I wanted to create feet that would naturally and passively engage their spines in the ice at the right moment, regardless of the drone’s orientation, the surface geometry, or the ice conditions.”<\/p><h4>Arctic Surveillance<\/h4><p><a href=\"https://www.abdn.ac.uk/people/william.harcourt\" rel=\"noopener noreferrer\" target=\"_blank\">William D. Harcourt<\/a> is a researcher at the University of Aberdeen, in Aberdeen, Scotland, focused on Arctic glaciers, snow, and sea ice, as well as the use of remote sensing and machine learning techniques. Harcourt was not involved in the study, but he sees several potentially interesting applications of the technology. <\/p><p>“Near the front of tidewater glaciers, these systems could enable measurement of <a href=\"https://www.antarcticglaciers.org/glacier-processes/glacier-flow-2/glacier-flow-ii-stress-and-strain/\" rel=\"noopener noreferrer\" target=\"_blank\">stress and strain<\/a> and help us understand <a href=\"https://en.wikipedia.org/wiki/Ice_calving\" rel=\"noopener noreferrer\" target=\"_blank\">calving processes<\/a>,” Harcourt says. “Drones can be used as a mobile GPS, literally acting as a receiver on the ice, but the system would need to solve tilting issues as 3D change measurements usually required the antenna to be horizontal. However, if these problems can be solved, it could be used to track iceberg movements.”<\/p><p>The researchers want to continue developing the Ice Dart technology for real-world applications, including autonomous landing site selection and an emergency takeoff capability to be used if an iceberg rolls over or breaks apart. This August, the drone will be deployed during a Canadian Arctic mission to land on icebergs, collect data, and help validate ship-based iceberg-detection systems.<\/p>"}, {"title": "FORT Robotics to take safety stack public via SPAC merger", "source": "Robotics Business Review", "date": "2026-08-18", "url": "https://www.therobotreport.com/fort-robotics-takes-safety-stack-public-via-spac-merger/", "summary": "<p>FORT Robotics said it expects valuation of more than $500 million as it lists on Nasdaq with plans to accelerate safety software development.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/fort-robotics-takes-safety-stack-public-via-spac-merger/\">FORT Robotics to take safety stack public via SPAC merger<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "How to achieve high voltage in industrial systems without high complexity", "source": "Robotics Business Review", "date": "2026-08-18", "url": "https://www.therobotreport.com/how-achieve-high-voltage-industrial-systems-without-high-complexity/", "summary": "<p>Kollmorgen discusses the importance of fitting voltage systems closely to the application while still making the best use of infrastructure.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/how-achieve-high-voltage-industrial-systems-without-high-complexity/\">How to achieve high voltage in industrial systems without high complexity<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Gravis Robotics raises $200M for autonomous construction", "source": "Robotics Business Review", "date": "2026-08-17", "url": "https://www.therobotreport.com/gravis-robotics-raises-200m-autonomous-construction/", "summary": "<p>Gravis Robotics has designed autonomy AI and hardware for a wide range of excavators and construction equipment and plans to scale globally.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/gravis-robotics-raises-200m-autonomous-construction/\">Gravis Robotics raises $200M for autonomous construction<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Is Shipyard Welding the Right First Job for Humanoid Robots?", "source": "IEEE Spectrum Robotics", "date": "2026-08-17", "url": "https://spectrum.ieee.org/persona-ai-humanoid-robot-welding", "summary": "<img src=\"https://spectrum.ieee.org/media-library/two-men-supervise-a-humanoid-robot-as-it-completes-a-welding-task-in-an-industrial-warehouse.jpg?id=67626093&amp;width=1200&amp;height=800&amp;coordinates=0%2C83%2C0%2C84\" /><br /><br /><p>Humanoids desperately need to stop making YouTube videos and get a job already, and <a href=\"https://persona.ai/\" rel=\"noopener noreferrer\" target=\"_blank\">Persona AI<\/a> is one of the few humanoid companies that seems to be entirely focused on making that happen. Persona AI’s approach has been to carefully select a job that is economically viable for robots right now, and they’ve found one that was also the job of <a href=\"https://spectrum.ieee.org/unimation-robot\" target=\"_self\">one of the very first industrial robots ever sold<\/a>: welding.<\/p><p><em><em>IEEE Spectrum<\/em><\/em> first spoke with Persona <a href=\"https://spectrum.ieee.org/persona-ai-radford-pratt\" target=\"_self\">two years ago<\/a>, shortly after it was founded by <a href=\"https://www.linkedin.com/in/nicolaus-radford/\" rel=\"noopener noreferrer\" target=\"_blank\">Nicolaus Radford<\/a> and <a href=\"https://www.linkedin.com/in/jerry-pratt/\" rel=\"noopener noreferrer\" target=\"_blank\">Jerry Pratt<\/a>. Radford led <a href=\"https://spectrum.ieee.org/meet-valkyrie-nasas-superhero-robot\" target=\"_self\">the Valkyrie program at NASA’s Johnson Space Center<\/a> back in the day and was also the founder of Nauticus Robotics, while Pratt led <a href=\"https://www.ihmc.us/research/human-machine-teamwork/\" rel=\"noopener noreferrer\" target=\"_blank\">IHMC’s<\/a> <a href=\"https://spectrum.ieee.org/darpa-robotics-challenge-amazing-moments-lessons-learned-whats-next\" target=\"_self\">DARPA Robotics Challenge<\/a> team before spending a couple of years as CTO of <a href=\"https://www.figure.ai/\" rel=\"noopener noreferrer\" target=\"_blank\">Figure<\/a>. <\/p><h2>The Challenge of Humanoids<\/h2><p>As of <a href=\"https://spectrum.ieee.org/persona-ai-radford-pratt\" target=\"_self\">our first conversation in 2024<\/a>, Persona had committed to building an economically viable humanoid, but they hadn’t yet figured out where their focus was going to be. “We were all over the place,” Radford says. “Warehousing, automotive, we probably even mentioned the home.” These are the same environments with the same sorts of potential applications that basically every other humanoid robotics company is attempting to make economically viable, and despite an ever more exhaustive number of demonstrations, so far none have succeeded at any sort of useful scale. <\/p><p>The challenge for Persona, and really for every robotics company, is that it’s not enough that you have a robot that is simply capable of doing a task. It’s <em><em>also<\/em><\/em> not enough that your robot can do that task in a way that is <a href=\"https://spectrum.ieee.org/humanoid-robot-scaling\" target=\"_self\">efficient, reliable, and safe<\/a>. What’s required is that your robot can make money for both you and your customer. Most humanoid companies seek to achieve this by targeting baseline “unskilled” human labor.<\/p><p>Persona did not see economic viability in the unskilled labor approach, Radford says. “We started forming this thesis around skilled trades and tool usage.” Persona is targeting much more expensive <em><em>skilled<\/em><\/em> labor with its robots, and the reason why this is feasible is because their entry point focuses on the kind of skills that robots are especially good at. “I like to call it ‘last-mover advantage.’ We’ve seen everything that everybody’s doing, and we’ve decided that there’s a different way.”<\/p><p class=\"shortcode-media shortcode-media-youtube\"> <span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span> <small class=\"image-media media-photo-credit\"><a href=\"https://www.youtube.com/watch?v=lDNrnmCj2DM\" target=\"_blank\">Persona AI/YouTube<\/a><\/small> <\/p><h2>A Humanoid for Shipyard Welding<\/h2><p>The first task that Persona’s humanoid is focusing on is welding—using a handheld tool to connect one piece of metal to another. “Tool use is pretty difficult,” Pratt says. “And we want to use the same tools that humans do, which makes it more difficult.” That difficulty is offset somewhat by the fact that Persona’s humanoid will first focus on making long, linear welds that are relatively uncomplicated. “This is not the hardest style of weld,” Radford says, “but in shipbuilding you need a lot of them—hundreds of kilometers of linear welds per ship.”<\/p><p>Currently, Persona has two public partnerships: one with <a href=\"https://www.hd.com/en/business/shipbuilding/hhi/contents\" rel=\"noopener noreferrer\" target=\"_blank\">HD Hyundai<\/a>, which is the world’s largest shipbuilder, and the other with <a href=\"https://www.posco.com/\" rel=\"noopener noreferrer\" target=\"_blank\">POSCO<\/a>, one of the largest steel producers in the world, both in Korea. Persona declined to get into detail, but Radford says that broadly speaking, the company is interested in customers who can support ‘hundreds’ of robots per location.<\/p><p>Shipyard welding is an enticing application for Persona because there is a deficit of skilled (and highly paid) workers, it’s taxing physical labor, and it’s a comparatively easy skill for a humanoid to learn.<\/p><p>The welding process is skilled in a very robot-friendly way. Because you can only weld as fast as metal melts, the top speed for the task is an easily manageable centimeter per second. And making a high quality weld involves millimeter-scale repeated motions, which robots excel at, especially over long periods of time—whereas humans tend to get tired or bored. Pratt expects that for these uncomplicated welds, performing on par with humans—if not eventually better—will be achievable soon.<\/p><p>Shipyards make a compelling case for a humanoid with legs, as opposed to a <a href=\"https://spectrum.ieee.org/humanoid-robots-walden-robotics-toyota\" target=\"_self\">more stable wheeled base<\/a>. “These open-air shipyards are a couple hundred meters long, with horizontal and vertical spars that you have to step over all the time,” Radford says. “You’ve got to work on the ground, overhead, and through portholes.” Persona considered other form factors, like four legs (or even more), but determined a two-legged robot would be the least disruptive to existing shipyard rhythms.<\/p><h2>The Economic Viability of Humanoids<\/h2><p>Deploying their robots in shipyards specifically brings additional advantages for Persona. The safety concerns that come with bipedal robots—such as potentially falling over on a human worker—are lessened because a shipyard environment is staffed with workers who are trained to work around potentially dangerous industrial equipment. The company is also less sensitive to competitive pricing because no other company is pursuing the use case. “We’re now in an industry where the value added by our robot can be high enough that we don’t have to cut corners on quality and features in order to reduce the price,” Pratt says. “With a robot for the home, for example, there would be a lot of competition and a ton of price pressure.”<\/p><p>The added value for shipbuilders, Radford explains, doesn’t come from replacing humans with robots. “Our current partnerships are running at a significant backlog, and they’re labor-constrained. So we want to help our customers’ top line, not necessarily their bottom line.” In other words, rather than trying to argue that their robots will lower shipbuilding costs, Persona is instead arguing that their robots will allow more ships to be built. “Even if our robot was more expensive than a human, that would still be valuable to these companies, because it could unlock additional revenue,” Radford says. And when the additional skilled labor does not exist, Persona’s robots could be the next-best option for shipbuilders who need to scale.<\/p><p class=\"shortcode-media shortcode-media-rebelmouse-image\"> <img alt=\"Several workers on scaffolding as they weld a large vessel in an industrial shipyard.\" class=\"rm-shortcode\" id=\"54539\" src=\"https://spectrum.ieee.org/media-library/several-workers-on-scaffolding-as-they-weld-a-large-vessel-in-an-industrial-shipyard.jpg?id=67626098&amp;width=980\" /> <small class=\"image-media media-caption\">Shipyards are environments where legs are necessary for a robot to be useful.<\/small><small class=\"image-media media-photo-credit\">CFOTO/Future Publishing/Getty Images<\/small><\/p><h2>Persona’s Multipurpose Future<\/h2><p>In the current commercial humanoid climate, where the emphasis seems to be on developing a “general purpose” robot (whatever that means) that will somehow justify itself through some undefined scale in some equally undefined and perpetually receding future, Persona stands out with their focus on a seemingly viable, near-term, and very specific business case. It hasn’t been easy, though. “It hurts us a little bit,” Radford says. “We’ve been told that we’re not thinking big enough.” <\/p><p>But a tool-using heavy industrial humanoid has plenty of future applications, many of which can be expanded from the welding skill even within shipyards. “Shipbuilding is a great beachhead,” Pratt says. “There are tons of adjacent markets, like grinding, painting, and other kinds of fabrication.” Persona’s ambition, Radford adds, is to be “the largest repository of industrial skills.” <\/p><p>It’s going to take time to get there. That time will be needed to collect tens of thousands of hours of expert demonstration data, create high-fidelity simulations, and conduct real-world testing. And however promising Persona’s approach may seem, the company still has to prove that its idea for an economically viable robotics company can be realized. It’s the same challenge that every humanoid robot company is facing. “A lot of the technical problems are the same no matter whether you’re in a house or a shipyard,” Pratt says. “Everybody’s got a great team and smart people, and we’re all knocking these problems out together.”<\/p>"}, {"title": "How Generalist uses human demonstration data for robot learning", "source": "Robotics Business Review", "date": "2026-08-17", "url": "https://www.therobotreport.com/how-general
