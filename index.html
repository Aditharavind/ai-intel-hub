ntenance on pipelines and cables.<\/p><p>Fukuda retired from the university in 2013 and was named professor emeritus.<\/p><p>He didn’t stay retired for long, though. He next held a teaching appointment at <a href=\"https://www.meijo-u.ac.jp/english/\" rel=\"noopener noreferrer\" target=\"_blank\">Meijo University<\/a>, in Nagoya, until he left in 2022 to join the Egypt-Japan University.<\/p><h2>A prominent volunteer<\/h2><p>He joined IEEE in 1980 at the encouragement of one of his research advisors, Professor <a href=\"https://ethw.org/Fumio_Harashima\" rel=\"noopener noreferrer\" target=\"_blank\">Fumio Harashima<\/a>, now an IEEE Life Fellow. After attending conferences and reading the organization’s publications, Fukuda says, he looked forward to becoming more involved.<\/p><p>“I wanted to know how to organize a conference and how to edit a paper for one of its <em><em>Transactions<\/em><\/em>,” he says. “I wanted to know what was going on from inside the organization, not just the outside.”<\/p><p>In 1988 he was the founding chair and organizer of IROS, in Tokyo. The conference had 330 attendees that year, and was supported by Harashima. Today it is one of the largest and most prestigious conferences on the topic, attracting more than 9,000 people annually. Out of 120,000 conferences, it was the only conference in the <a href=\"https://www.nature.com/nature-index/faq\" rel=\"noopener noreferrer\" target=\"_blank\">Nature Index<\/a> database for this year, Fukuda says.<\/p><p>In 1996 he and other members launched <a href=\"https://ieeexplore.ieee.org/xpl/RecentIssue.jsp?punumber=3516\" rel=\"noopener noreferrer\" target=\"_blank\"><em><em>IEEE Transactions on Mechatronics<\/em><\/em><\/a>.<\/p><p>He was the founding president of the <a href=\"https://ieeenano.org/\" rel=\"noopener noreferrer\" target=\"_blank\">IEEE Nanotechnology Council<\/a>, which was established in 2002. He is considered a pioneer in nanotechnology research, particularly regarding how it relates to robotics.<\/p><p>Over the years, he has held numerous volunteer positions on IEEE editorial boards and committees.<\/p><p>He was the 1998–1999 president of the <a href=\"https://www.ieee-ras.org/\" rel=\"noopener noreferrer\" target=\"_blank\">IEEE Robotics and Automation Society<\/a>, becoming the first non-U.S. member to hold the title.<\/p><p>He was director of <a href=\"https://ta.ieee.org/society-council-resources/society-and-council-operations/divisions-society-groupings\" rel=\"noopener noreferrer\" target=\"_blank\">IEEE Division X<\/a> (2001–2002 and 2017–2018), which covers intelligent systems, biological engineering, robotics, control systems, and photonic technologies. He served as the 2013–2014 director of <a href=\"https://www.ieeer10.org/\" rel=\"noopener noreferrer\" target=\"_blank\">IEEE Region 10<\/a> (Asia-Pacific).<\/p><p>As the 2020 IEEE president, Fukuda saw the organization through the early part of the <a href=\"https://spectrum.ieee.org/ieee-presidents-column-strength-and-solidarity-in-responding-to-the-challenges-of-covid19\" target=\"_self\">COVID-19 pandemic<\/a>. Because of travel restrictions, he realized IEEE should change how it offered its in-person services, specifically educational programs. He encouraged <a href=\"https://ea.ieee.org/ea-programs\" rel=\"noopener noreferrer\" target=\"_blank\">IEEE Educational Activities<\/a> to develop an online learning platform. The <a href=\"https://spectrum.ieee.org/ieee-president-lets-focus-on-continuing-education\" target=\"_self\">IEEE Learning Network<\/a> started with just three courses and now offers nearly 2,000 courses, webinars, and learning materials.<\/p><h2>An award-winning member<\/h2><p>The Emberson Award joins a slew of other recognitions Fukuda has received from IEEE. They include several from the IEEE Robotics and Automation Society: a 2004 <a href=\"https://www.ieee-ras.org/awards-recognition/society-awards/pioneer-in-robotics-and-automation-award/\" rel=\"noopener noreferrer\" target=\"_blank\">Pioneer Award<\/a>, a 2009 <a href=\"https://www.ieee-ras.org/2026-ieee-ras-award-recipients-announced/\" rel=\"noopener noreferrer\" target=\"_blank\">Saridis Leadership Award<\/a>, and the 2011 <a href=\"https://www.ieee-ras.org/awards-recognition/conference-awards/iros-harashima-award-for-innovative-technologies/\" rel=\"noopener noreferrer\" target=\"_blank\">Harashima Award for Innovative Technologies<\/a>. He is also a recipient of the Board-level 2010 IEEE Robotics and Automation <a href=\"https://www.ieee-ras.org/awards-recognition/ieee-awards/ieee-robotics-and-automation-technical-field-award-tfa/\" rel=\"noopener noreferrer\" target=\"_blank\">Technical Field Award<\/a>.<\/p><p>He says he feels strongly that IEEE should be a diverse organization that is welcoming to all. As IEEE president, he led efforts to devise a <a href=\"https://spectrum.ieee.org/ieee-diversity-and-inclusion-efforts\" target=\"_self\">diversity, equity, and inclusion program<\/a>. Several policies, procedures, and bylaws were revised to give members a safe, inclusive place for discourse.<\/p><p>“It’s important for IEEE to make everyone feel comfortable,” he says. “DEI programs are important. All people should be equal. IEEE doesn’t care who you are, what you do, what country you are from, or whether you are male or female. IEEE accepts people who have energy and passion.<\/p><p>“It accepted me, from the Far East. That’s why I like it.”<\/p><p>You can learn more about Fukuda and his career from the <a href=\"https://ethw.org/Oral-History:Toshio_Fukuda\" rel=\"noopener noreferrer\" target=\"_blank\">oral history<\/a> conducted by the <a href=\"https://www.ieee.org/about/history-center\" rel=\"noopener noreferrer\" target=\"_blank\">IEEE History Center<\/a>.<\/p>"}, {"title": "RoboBusiness 2026 call for speakers closes soon", "source": "Robotics Business Review", "date": "2026-07-06", "url": "https://www.therobotreport.com/robobusiness-2026-opens-call-for-speakers/", "summary": "<p>RoboBusiness 2026, the premier event for developers of commercial robotics and those building robotics businesses, is seeking expert speakers.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/robobusiness-2026-opens-call-for-speakers/\">RoboBusiness 2026 call for speakers closes soon<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Quantum Systems raises $1.2B to expand drone production and deployments", "source": "Robotics Business Review", "date": "2026-07-06", "url": "https://www.therobotreport.com/quantum-systems-raises-1-2b-expand-drone-production-deployments/", "summary": "<p>Quantum plans to use the proceeds to expand production capacity, strengthen supply chain resilience, and more.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/quantum-systems-raises-1-2b-expand-drone-production-deployments/\">Quantum Systems raises $1.2B to expand drone production and deployments<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Kraken Robotics acquires Covelya Group for $615M", "source": "Robotics Business Review", "date": "2026-07-06", "url": "https://www.therobotreport.com/kraken-robotics-acquires-covelya-group-for-615m/", "summary": "<p>Covelya Group expands Kraken Robotics' product offerings and total addressable market in subsea technology.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/kraken-robotics-acquires-covelya-group-for-615m/\">Kraken Robotics acquires Covelya Group for $615M<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Boston Dynamics brings its legged robots to the FIFA World Cup", "source": "Robotics Business Review", "date": "2026-07-06", "url": "https://www.therobotreport.com/boston-dynamics-brings-its-legged-robots-to-the-fifa-world-cup/", "summary": "<p>Around the 2026 FIFA World Cup, Hyundai and Boston Dynamics have taught footwork to the Atlas humanoid, while the Spot robot is on patrol.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/boston-dynamics-brings-its-legged-robots-to-the-fifa-world-cup/\">Boston Dynamics brings its legged robots to the FIFA World Cup<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Humanoid says KinetIQ Ascend reinforcement learning approaches human-level dexterity", "source": "Robotics Business Review", "date": "2026-07-05", "url": "https://www.therobotreport.com/humanoid-announces-kinetiq-ascend-reinforcement-learning-approach/", "summary": "<p>Humanoid says its KinetIQ Ascend approach can reach 99.9% manipulation reliability at human speed and beyond for industrial tasks. <\/p>\n<p>The post <a href=\"https://www.therobotreport.com/humanoid-announces-kinetiq-ascend-reinforcement-learning-approach/\">Humanoid says KinetIQ Ascend reinforcement learning approaches human-level dexterity<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Context is king: How Avride uses cloud VLMs as a safety net for delivery robots", "source": "Robotics Business Review", "date": "2026-07-04", "url": "https://www.therobotreport.com/how-avride-uses-cloud-vlms-safety-net-delivery-robots/", "summary": "<p>Avride uses vision-language models, or VLMs, to improve the environmental awareness of its delivery robots.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/how-avride-uses-cloud-vlms-safety-net-delivery-robots/\">Context is king: How Avride uses cloud VLMs as a safety net for delivery robots<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Japan Pioneered Humanoid Robots—Can It Now Catch China?", "source": "IEEE Spectrum Robotics", "date": "2026-07-04", "url": "https://spectrum.ieee.org/humanoid-robots-japan", "summary": "<img src=\"https://spectrum.ieee.org/media-library/a-middle-aged-asian-man-seated-next-to-an-uncannily-similar-humanoid-robot-with-the-same-hairstyle-glasses-and-clothing.jpg?id=67080305&amp;width=1200&amp;height=800&amp;coordinates=0%2C83%2C0%2C84\" /><br /><br /><p>“In the future, the relationship between humans and robots will deepen, and the distinction between them will probably disappear.” This prediction, from one of the attendees at the recent <a href=\"https://humanoidssummit.com/agenda-2\" rel=\"noopener noreferrer\" target=\"_blank\">Humanoids Summit in Tokyo<\/a>, might have been unremarkable had it not come directly from an android that was first introduced to the world 20 years ago. <\/p><p><a href=\"https://eng.irl.sys.es.osaka-u.ac.jp/robot\" rel=\"noopener noreferrer\" target=\"_blank\">Geminoid HI-6<\/a> is the sixth-generation of a robot originally designed in 2006. The mechanical twin of Osaka University professor <a href=\"https://spectrum.ieee.org/the-amazing-androids-of-hiroshi-ishiguro\" target=\"_self\">Hiroshi Ishiguro<\/a>, Geminoid HI-6 is now equipped with a large language model trained on Ishiguro’s own writings and interviews. It has advanced conversational skills and can even have a chat with its creator, an eerie spectacle. But at the Humanoids Summit, Geminoid was one of the few humanoid robots from Japan, the country that pioneered the form factor.<\/p><p>While the event in Tokyo had only about 40 robots on display, Chinese systems outnumbered Japanese by roughly three to one. Some Japanese robotics firms were even using Chinese robots in their own technology demonstrations, something that would have been unthinkable in the recent past—one Japanese engineer described the situation as “sad.” The conference was a stark reminder of how Japan has ceded its early lead in humanoid robot development to overseas competitors, and the challenge it now faces to secure a place in an ecosystem increasingly dominated by general-purpose robots powered by AI. <\/p><p>Twenty-five years ago, Japan was turning out <a href=\"https://www.youtube.com/watch?v=ESLc26fNAe8\" target=\"_blank\">groundbreaking humanoids that were showstopping in their abilities<\/a>, but they were not commercialized as <a href=\"https://spectrum.ieee.org/japan-earthquake-more-robots-to-the-rescue\" target=\"_blank\">practical machines<\/a> in any meaningful way. Heavily influenced by science fiction and lacking practical applications, they were mostly expensive technology demonstrations that were eventually mothballed. What Japan retains, however, is robotics design and know-how, which it must leverage to be a key player in the rapidly evolving humanoid ecosystem. <\/p><h3>Learning to Walk—Then Standing Still<\/h3><p>To anyone who has seen recent videos of Chinese humanoids doing <a href=\"https://www.youtube.com/watch?v=R6T-Ea5CfRE\" rel=\"noopener noreferrer\" target=\"_blank\">kung-fu and synchronized acrobatics<\/a>, as well as<a href=\"https://www.bbc.com/news/videos/cz0e54yrppno\" rel=\"noopener noreferrer\" target=\"_blank\"> half-marathon races<\/a>, China’s remarkable progress in the field is nothing new. At the Humanoids Summit, Toyota showed a video of its <a href=\"http://toyotatimes.jp/en/newscast/188.html\" target=\"_blank\">latest basketball-playing robot<\/a>, and Honda exhibited its <a href=\"https://global.honda/jp/RandD/field/hgrx/honda-multi-fingered-hand/\" target=\"_blank\">latest robot hand<\/a>, but the full-scale humanoids on the floor were mostly Chinese–the kid-size <a href=\"https://www.booster.tech/booster-k1/\" rel=\"noopener noreferrer\" target=\"_blank\">K1 machines from Booster Robotics<\/a> of Beijing were dancing to Michael Jackson tunes. The full-scale <a href=\"https://robotsguide.com/robots/unitree-g1\" rel=\"noopener noreferrer\" target=\"_blank\">G1 humanoid from Unitree Robotics<\/a> of Hangzhou was also doing demos. <\/p><p>“You cannot sell these bipedal systems in Japan for safety and compliance reasons,” says Shuichi Nagao, a frequent visitor to China as CTO of <a href=\"https://www.omakase.ai/robotics\" rel=\"noopener noreferrer\" target=\"_blank\">Omakase Robotics<\/a>, a division of Zeals, a Japanese humanoid robot developer. Omakase was exhibiting a G1 modified with an external PC controller, a dextrous hand, a suction-cup manipulator and a sensor “hat” with an extra speaker, mic, and camera. <\/p><p>“In China, the government is pushing humanoid development. They didn’t have an industry 20 years ago. The people pushing it are young, in their 20s and 30s. It’s a really different mentality out there,” says Nagao. “Big players in Japan are still looking for use cases for humanoids. In China, they’re already doing mass production and reducing the cost, so other countries can’t compete with them anymore.”<\/p><p>Another Japanese company showing off G1 bots was summit sponsor GMO AI & Robotics, a subsidiary of Japanese internet company <a href=\"https://en.wikipedia.org/wiki/GMO_Internet\" rel=\"noopener noreferrer\" target=\"_blank\">GMO<\/a>. It’s using the robots in partnership with Japan Airlines to <a href=\"https://group.gmo/en/news/article/850/\" rel=\"noopener noreferrer\" target=\"_blank\">load and unload cargo containers<\/a> at Tokyo’s Haneda airport. The cargo project is a trial—like <a href=\"https://www.tokyoweekender.com/entertainment/tech-trends/ai-powered-robot-monk-buddharoid/\" rel=\"noopener noreferrer\" target=\"_blank\">many other humanoid experiments<\/a>—but the fact that Chinese machines have penetrated so far into Japan’s ecosystem <a href=\"https://www.amazon.com/dp/B001SARCOI?lv=shuf&amp;channelId=500&amp;plpRedirect=mhFallback\" rel=\"noopener noreferrer\" target=\"_blank\">upends a long history<\/a>. <\/p><p>In 1973, scientists at Waseda University in Tokyo built <a href=\"https://www.humanoid.waseda.ac.jp/booklet/kato_2.html\" rel=\"noopener noreferrer\" target=\"_blank\">WABOT-1<\/a>, considered the first full-scale humanoid robot, which was capable of slow bipedal locomotion, grasping objects, and simple communication. It inspired Honda’s groundbreaking Asimo humanoid, but Asimo was never commercialized. It was eventually retired in 2022, the year ChatGPT was released. Two years later, Unitree’s G1 went on sale for US $16,000.<\/p><p class=\"shortcode-media shortcode-media-rebelmouse-image\"> <img alt=\"A 65 centimeter tall bipedal robot, its design features the head of an anime-style girl with legs directly underneath.\" class=\"rm-shortcode\" id=\"706b9\" src=\"https://spectrum.ieee.org/media-library/a-65-centimeter-tall-bipedal-robot-its-design-features-the-head-of-an-anime-style-girl-with-legs-directly-underneath.jpg?id=67080329&amp;width=980\" /> <small class=\"image-media media-caption\">China’s High Torque Technology Co. showed off its Mini Pi biped, customized with an anime-inspired head, at Humanoids Summit in Tokyo. The regular version is priced at $3,500. <\/small><small class=\"image-media media-photo-credit\">Tim Hornyak<\/small><\/p><h3>Supply and Demand<\/h3><p>Japan’s development of humanoids happened before practical applications or widespread demand were in place, but bad timing is only part of the story—Japan also has a history of developing technologies that might appeal to domestic consumers but not necessarily those overseas. For example, decades after its highly engineered multifunction toilets first appeared, they have only recently found a <a href=\"https://www.nytimes.com/2025/05/29/business/toto-toilet-japan-bidet.html\" target=\"_blank\">following abroad<\/a>. <\/p><p>Japan’s humanoid prowess was partly built on the back of its legendary industrial automation, yet even that stronghold has eroded. Ani Kelkar, a partner from McKinsey & Company in Boston who produces analytical reports about the robotics industry, told the summit audience that while Japan occupied the top spot in the world in manufacturing robot density (the number of multipurpose industrial robots in operation per 10,000 employees) from at least 1994 to 2009, it then slipped to second in 2014, third in 2019, and fifth in 2024. In that year, South Korea was at the top of the leaderboard with a robot density of 1,220 compared to Japan’s 446. <\/p><p>The International Federation of Robotics <a href=\"https://ifr.org/ifr-press-releases/news/robot-density-surges-in-europe-asia-and-americas\" target=\"_blank\">estimates<\/a> China now has the most operational industrial robots in the world, with around 2 million total units, approximately 4.5 times more than Japan. “The annual installation numbers are impressive too: 54 percent of all robots installed worldwide in 2024 were deployed in China,” the IFR said in a release in April 2026. <\/p><p>“I think the loss of Japanese leadership is more to do with the rise of China as a manufacturing powerhouse including for sectors that Japan had high export levels,” Kelkar said in an email interview. “The recovery has not yet happened as Japan “missed” the rapid acceleration in AI for robotics and is now playing catch-up.”<\/p><h3>How Japan Can Adapt <\/h3><p>Kelkar believes Japan has a $100 billion opportunity in general-purpose robotics, which are machines that can perform a wide variety of tasks, and it cannot rely on the slower-growing industrial robot market, which is centered on factory machines that do one simple and predictable task like welding car parts. He points to a McKinsey <a href=\"https://www.mckinsey.com/industries/industrials/our-insights/japans-100-billion-opportunity-in-general-purpose-robotics#/\" target=\"_blank\">white paper<\/a> suggesting that while Japan has much of the hardware and technology experience needed to support general-purpose robot development, it must change its strategy to capture a larger share in AI, software, data collection, and robotics platforms.<\/p><p><a href=\"https://ogata-lab.jp/member/ogata.html\" target=\"_blank\">Tetsuya Ogata<\/a> is a professor of engineering and director of the Institute for AI and Robotics at Waseda University, the birthplace of humanoids in Japan. He briefed the summit on how a nonprofit he chairs, the AI Robot Association (<a href=\"https://www.airoa.org/\" rel=\"noopener noreferrer\" target=\"_blank\">AIRoA<\/a>), is working with Toyota and other members to develop foundational technologies for collaborative use. <\/p><p>For instance, AIRoA has collected some 80,000 hours of data on remote operation of mobile manipulators, which Ogata believes is the largest dataset of its kind. Using the data, it built and verified vision-language-action (VLA) models, and it has also started data collection for dual-arm mobile manipulation. In an interview, Ogata acknowledged Japan’s struggle to find its place in the changing landscape. <\/p><p>“The world of AI is inherently a game of scale,” says Ogata. “Therefore, Japan’s absolute prerequisite is to secure a competitive baseline of scale—in data, computing resources, and talent. Beyond that, what I consider most critical is a mind-set shift: Rather than trying to hoard scale within a single nation or company, we must grow stronger by collaborating with a diverse ecosystem of domestic and international players.” <\/p><p>Specifically, this means creating a “collaborative domain” to address data—the single biggest bottleneck—through industry-wide cooperation rather than data siloing. By collectively nurturing a precompetitive, shared data infrastructure and foundation model, individual companies can then compete on top of it with their own applications. “By offering this open ‘data ecosystem’ to the world, we can engage global players and establish a ‘third pole’ alongside the U.S. and China,” says Ogata. “I believe this is how Japan can reclaim its global presence.”<\/p><p>In 1999, Japan introduced the <a href=\"https://www.eurotechnology.com/2015/02/22/i-mode-mobile-internet-docomo/\" rel=\"noopener noreferrer\" target=\"_blank\">world’s first mobile internet services platform<\/a>. But being first didn’t turn Japan into a smartphone manufacturing or design center—it’s now merely a supplier of parts to other countries that are leading the smartphone industry. If Japan can avoid a repeat of that experience and successfully deregulate, diversity, and commercialize its original humanoid dreams, it stands a better chance of influencing the direction of the industry and reaping billions in value. As automobiles and electronics were pillars of Japan’s industrial strategy in the last century, Japan could make humanoid robots one of its key value generators in the 21st century, an approach that would not only deliver economic benefits but give Japan greater clout in how the industry will evolve. Just like Japanese cars, electronics, and even toilets, Japanese humanoids could stand for craftsmanship and reliability. It’s a legacy that Japan can’t afford to give up. <\/p>"}, {"title": "Quarterhill discusses transport modernization as U.S. marks 70 years of federal highways", "source": "The Robot Report", "date": "2026-07-03", "url": "https://www.therobotreport.com/quarterhill-discusses-transport-modernization-u-s-marks-70-years-federal-highways/", "summary": "<p>At the U.S. celebrates 250 years of independence and 70 years of its highway system, an expert looks at the future of autonomous transport. <\/p>\n<p>The post <a href=\"https://www.therobotreport.com/quarterhill-discusses-transport-modernization-u-s-marks-70-years-federal-highways/\">Quarterhill discusses transport modernization as U.S. marks 70 years of federal highways<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Video Friday: An Earthbound Mars Rover for the Moon", "source": "IEEE Spectrum Robotics", "date": "2026-07-03", "url": "https://spectrum.ieee.org/video-friday-nasa-lunar-rover", "summary": "<img src=\"https://spectrum.ieee.org/media-library/mars-style-rover-prototype-on-rugged-ground-under-a-clear-sky-with-the-moon-visible.png?id=67083121&amp;width=1200&amp;height=800&amp;coordinates=150%2C0%2C150%2C0\" /><br /><br /><p><span><a href=\"https://spectrum.ieee.org/tag/video-friday\" target=\"_blank\">Video Friday<\/a> is your weekly selection of awesome robotics videos, collected by your friends at <\/span><em>IEEE Spectrum<\/em><span> robotics. We also post a weekly calendar of upcoming robotics events for the next few months. Please <\/span><a href=\"mailto:automaton@ieee.org?subject=Robotics%20event%20suggestion%20for%20Video%20Friday\">send us your events<\/a><span> for inclusion.<\/span><\/p><h5><a href=\"https://roboticsconference.org/\">RSS 2026<\/a>: 13–17 July 2026, SYDNEY<\/h5><h5><a href=\"https://mrs.fel.cvut.cz/summer-school-2026/\">Summer School on Multi-Robot Systems<\/a>: 29 July–4 August 2026, PRAGUE<\/h5><h5><a href=\"https://actuate.foxglove.dev/\">Actuate 2026<\/a>: 18–19 August 2026, SAN FRANCISCO<\/h5><h5><a href=\"https://2026.ieee-iros.org/\">IROS 2026<\/a>: 27 September–1 October 2026, PITTSBURGH<\/h5><p>Enjoy today’s videos!<\/p><div class=\"horizontal-rule\"><\/div><div><span style=\"display: none;\"> <\/span><\/div><blockquote class=\"rm-anchors\" id=\"fmxmym6bj-y\"><em>NASA is considering a mission concept for an advanced, nuclear-powered rover to be deployed to the Moon’s South Pole as part of the agency’s Moon Base plans. The PROMISE (Polar Rover for Observation, Mapping, and In-Situ Exploration) mission concept relies on the <\/em><em>Curiosity<\/em><em> Mars rover mission’s testbed rover. Some elements of the Perseverance Mars testbed rover shown in this video could be used as well. As exact duplicates of Curiosity and Perseverance, the testbed rovers are equipped with flight-proven engineering systems capable of carrying technology as well as science instruments that would advance Moon Base efforts.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>A Mars rover for the Moon? That’s some <a href=\"https://science.nasa.gov/resource/improved-optimism/\" target=\"_blank\">OPTIMISM<\/a> right there.<\/p><p>[ <a href=\"https://science.nasa.gov/resource/improved-optimism/\">JPL<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"6qrzc1kf7kc\">This is the absolute best thing since <a href=\"https://spectrum.ieee.org/festos-fantastical-flying-robots\" target=\"_blank\">Festo’s AirPenguin<\/a>.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><blockquote><em>The project explores soft, lightweight robots that can gently float around people in indoor environments and invite playful, affectionate, and everyday interactions. Unlike conventional drones, our robot is designed to be quiet, soft, touch-safe, and socially approachable. Through this work, we ask what future indoor companion robots might feel like if they were not rigid machines, but gentle floating beings that share space with us.<\/em><\/blockquote><p>[ <a href=\"https://dl.acm.org/doi/10.1145/3800645.3813051\">Paper<\/a> ]<\/p><p>Thanks, Mingyang!<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"m7pzr90bqw4\"><em>Today, we’re launching our home robot, Isaac 1. Deliveries will begin this fall.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>US $500 per month, with some basic task autonomy, plus teleoperation.<\/p><p>[ <a href=\"https://www.weaverobotics.com/isaac-1\">Weave Robotics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"tv90gfm9rao\">A couple of things from this new Figure video: Thing one is that the cart-pulling is a good illustration of how clumsy humanoid robots still are at basic tasks relative to humans. Thing two is that there are absolutely no humans anywhere near these robots. You can see one guy at 0:19, which I can only assume is an accident, because these robots are not safe to be around from an industrial safety perspective.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.figure.ai/news/f-03-at-bmw\">Figure<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"5mhop2g4e4u\">Our very own Kohava Mendelsohn met some robots at ICRA in Vienna, and only one of them was murderous.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://2026.ieee-icra.org/\">ICRA 2026<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"ipyxwelid9q\"><em>Welcome to Robot Park, where we’re building the future with Apollo 2. Robot Park is where Apollo learns today, getting the experience needed to make a difference tomorrow. Today we’re announcing Robot Park, our nearly 90,000-square-foot facility where Apollo 2 is collecting real-world training data needed to advance autonomous humanoid robots. <\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://apptronik.com/news-collection/welcome-to-robot-park-where-apptroniks-apollo-goes-to-work\">Apptronik<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"mrlbqt5tkh4\"><em>UBTech Robotics, the world’s first publicly traded humanoid robot-maker, has launched a humanlike robot that features lifelike silicone skin and “emotional AI,” as Chinese tech firms increasingly transition robots from the factory floor to the family living room.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.scmp.com/tech/tech-trends/article/3358884/ubtechs-lifelike-humanoid-robots-built-companionship-arriving-homes-across-china\">SCMP<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"xdq8yzehviy\"><em>Spherephones are redefining how we experience sound. Created at Georgia Tech, this wearable uses spatial audio to alert users to movement from every direction—including behind and below. Built for safer human-robot collaboration, the technology is expanding into gaming and accessibility applications. See how music is becoming a new language for awareness and interaction.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://research.gatech.edu/feature/spherephones\">Georgia Tech<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"6dme3jyj3hg\"><em>Humanoid robots are meant to carry out long-horizon autonomous missions in a world built for humans. This is hard. These missions consist of many steps, each of which requires them to perceive, navigate, and interact with the environment. This is exactly Flexion’s goal: building the general-purpose intelligence that turns any robot into a useful helper.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://flexion.ai/news/flexion-reflect-v1.0\">Flexion<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"lttnht-y47m\"><em>We’re introducing KinetIQ Ascend—our reinforcement-learning approach designed to reach 99.9 percent manipulation reliability at human speed and beyond.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://thehumanoid.ai/technology/kinetiq-ascend/\">Humanoid<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"hsmj7__elk0\"><em>Dr. Sebastian “Basti” Scherer has worked in field robotics since the first DARPA Grand Challenge in 2004. He runs the AirLab at Carnegie Mellon’s Robotics Institute and is the director of safe embodied AI at FieldAI. While much of the industry is focused on local skills like tabletop manipulation, Dr. Scherer sees the greatest value in solving dirty, dull, and dangerous tasks that require operating in uncertain environments where the robot needs to “just work.” When robots “just work,” they become less like robots and more like tools. “That’s the big challenge that we have to overcome,” he says. “And that’s the challenge that FieldAI is really primed to solve.”<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.fieldai.com/\">FieldAI<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"omzfvmtwsjc\">Look, I really appreciate how valuable robots like ElliQ can be, and robots that do good work and offer a financial benefit are incredibly important, especially in the context of family care. But in my opinion, you really shouldn’t suggest that a robot with FaceTime or whatever is an equal replacement for in-person human companionship, nor should you suggest that AI can replace a human wellness coach. If you can’t afford those things, then sure, ElliQ can offer some of those capabilities in a very limited way, but that’s all.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://elliq.com/\">ElliQ<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"gz4frehicfe\">Very cool moves! Now get a job!<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.deeprobotics.cn/en\">DEEP Robotics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"r6f8bztjqfg\"><em>Drawing inspiration from restaurant waiters in Morocco and Turkey, among other places, we equip a robot with a hanging tray to transport objects from one location to another without dropping them or spilling their contents. We incorporate this approach into an interactive robot waiter demonstration, which uses computer vision and visual servoing to steer toward a person with a raised hand to serve them.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://arxiv.org/abs/2606.10039\">Paper<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"qfsmncdh9lu\">If you’re going to make robots wear skirts or shorts or pants, you have to give them butts, or it’s just not going to work. That is all.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://techshare.co.jp/product/unitree/g1/\">TechShare<\/a> ] via [ <a href=\"https://www.youtube.com/@KazumichiMoriyama\">Kazumichi Moriyama<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"kfy7d-qiyjw\"><em>It’s Los Alamos, so of course we have robots. Some work inside gloveboxes, while others probe unexploded ordnance in the field and aid with repetitive lifting, Doc Ock–style. Legend has it there’s a fro-yo robot in the cafeteria.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.lanl.gov/media/publications/national-security-science/1224-sniffing-out-radiation\">LANL<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"8aiznj4cciu\">Here are a couple of talks from the recent Humanoids Summit in Japan, from Ali Agha of FieldAI as well as Hiroshi Ishiguro.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p class=\"shortcode-media shortcode-media-youtube\"> <span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span> <\/p><p>[ <a href=\"https://humanoidssummit.com/agenda-2\">Humanoids Summit<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div>"}, {"title": "Blattner awards Built Robotics $75M contract for physical AI to help meet energy demand", "source": "Robotics Business Review", "date": "2026-07-02", "url": "https://www.therobotreport.com/blattner-awards-built-robotics-75m-contract-meet-energy-demands/", "summary": "<p>Blattner has expanded its partnership with Built Robotics to scale autonomous systems for solar construction.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/blattner-awards-built-robotics-75m-contract-meet-energy-demands/\">Blattner awards Built Robotics $75M contract for physical AI to help meet energy demand<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Why you should combine robot dexterity with mechanical positioning for complex assembly operations", "source": "Robotics Business Review", "date": "2026-07-02", "url": "https://www.therobotreport.com/why-you-should-combine-robot-dexterity-with-mechanical-positioning-for-complex-assembly-operations/", "summary": "<p>Experts are recognizing the importance of mechanical positioning and its impact on the machine’s mobility, range and speed.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/why-you-should-combine-robot-dexterity-with-mechanical-positioning-for-complex-assembly-operations/\">Why you should combine robot dexterity with mechanical positioning for complex assembly operations<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Luxonis closes Series A round to scale physical AI perception layer", "source": "Robotics Business Review", "date": "2026-07-02", "url": "https://www.therobotreport.com/luxonis-closes-series-a-round-to-scale-physical-ai-perception-layer/", "summary": "<p>Luxonis said it plans to scale production of its OAK camera and refine its platform to support robotics and industrial automation. <\/p>\n<p>The post <a href=\"https://www.therobotreport.com/luxonis-closes-series-a-round-to-scale-physical-ai-perception-layer/\">Luxonis closes Series A round to scale physical AI perception layer<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Automate 2026 show recap", "source": "Robotics Business Review", "date": "2026-07-02", "url": "https://www.therobotreport.com/automate-2026-show-recap/", "summary": "<p>Editors Steve Crowe, Mike Oitzman, and Sarah Wynn review Automate 2026, analyzing key trends in physical AI, humanoids, and software orchestration.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/automate-2026-show-recap/\">Automate 2026 show recap<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Apptronik unveils Apollo 2 and a flagship data collection and training facility", "source": "Robotics Business Review", "date": "2026-07-01", "url": "https://www.therobotreport.com/apptronik-unveils-apollo-2-flagship-data-collection-training-facility/", "summary": "<p>Built as a data collection and training platform, Apollo 2 enables continuous learning through deployment, Apptronik said.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/apptronik-unveils-apollo-2-flagship-data-collection-training-facility/\">Apptronik unveils Apollo 2 and a flagship data collection and training facility<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Top 10 robotics developments of June 2026", "source": "Robotics Business Review", "date": "2026-07-01", "url": "https://www.therobotreport.com/top-10-robotic-stories-june-2026/", "summary": "<p>Humanoid robots made many headlines in June 2026, whether it be for companies going public, new deployments, or hitting production milestones.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/top-10-robotic-stories-june-2026/\">Top 10 robotics developments of June 2026<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "In Robotics, Ruggedization Is No Longer Optional", "source": "Robotics Business Review", "date": "2026-07-01", "url": "https://www.therobotreport.com/in-robotics-ruggedization-is-no-longer-optional/", "summary": "<p>As autonomy moves beyond controlled environments, ruggedized design is becoming a prerequisite for reliable robotic operations.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/in-robotics-ruggedization-is-no-longer-optional/\">In Robotics, Ruggedization Is No Longer Optional<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Sonair ADAR One 3D ultrasonic sensor is now safety-certified", "source": "Robotics Business Review", "date": "2026-06-30", "url": "https://www.therobotreport.com/sonair-3d-ultrasonic-sensor-is-now-safety-certified/", "summary": "<p>Sonair says ADAR One was assessed as a human detection sensor according to the IEC 61496 standard for electrosensitive protection devices.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/sonair-3d-ultrasonic-sensor-is-now-safety-certified/\">Sonair ADAR One 3D ultrasonic sensor is now safety-certified<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Queue raises funding to build fully autonomous pharmacy", "source": "Robotics Business Review", "date": "2026-06-30", "url": "https://www.therobotreport.com/queue-raises-funding-fully-autonomous-pharmacy/", "summary": "<p>Queue is developing automated pharmacies to expand access to prescriptions in hospitals, retail sites, and underserved communities.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/queue-raises-funding-fully-autonomous-pharmacy/\">Queue raises funding to build fully autonomous pharmacy<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Soft, robotic cells from morph embed physical AI into hardware", "source": "Robotics Business Review", "date": "2026-06-30", "url": "https://www.therobotreport.com/soft-robotic-cells-from-morph-embed-physical-ai-into-hardware/", "summary": "<p>morph launched a physically intelligent soft robotics platform that designs and manufactures what it calls “soft robotic cells.” <\/p>\n<p>The post <a href=\"https://www.therobotreport.com/soft-robotic-cells-from-morph-embed-physical-ai-into-hardware/\">Soft, robotic cells from morph embed physical AI into hardware<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "How Jaiveer Singh Is Helping Robots — and Developers — Move Faster", "source": "NVIDIA Robotics", "date": "2026-06-30", "url": "https://blogs.nvidia.com/blog/nvidia-life-jaiveer-singh/", "summary": "When Jaiveer Singh talks about robots, he doesn’t begin with spectacle. He begins with infrastructure: the boards inside machines, the software that lets developers see through a robot&#8217;s cameras and the engineering required before a robot can leave a demo floor to do something useful. As a robotics software engineer who leads the team behind [&#8230;]"}, {"title": "Into the Omniverse: Three Workflows for Improving Vision AI Agent Accuracy With Synthetic Data and Fine-Tuning", "source": "NVIDIA Robotics", "date": "2026-06-30", "url": "https://blogs.nvidia.com/blog/vision-ai-agent-skills-omniverse-metropolis/", "summary": "Editor’s note: This post is part of Into the Omniverse, a series focused on how developers, 3D practitioners, and enterprises can transform their workflows using the latest advances in OpenUSD and NVIDIA Omniverse. Vision AI agents are becoming a practical way to automatically turn video data from the physical world into operational intelligence in factories, [&#8230;]"}, {"title": "X Square Robot brings its valuation to $2.8B with four consecutive funding rounds", "source": "Robotics Business Review", "date": "2026-06-30", "url": "https://www.therobotreport.com/x-square-robot-brings-valuation-2-8b-four-consecutive-funding-rounds/", "summary": "<p>X Square Robots' system combines foundation models, robotics hardware, a data pipeline system, and real-world deployments.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/x-square-robot-brings-valuation-2-8b-four-consecutive-funding-rounds/\">X Square Robot brings its valuation to $2.8B with four consecutive funding rounds<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "MBody AI expands service robotics operations to eleven states and Canada", "source": "Robotics Business Review", "date": "2026-06-29", "url": "https://www.therobotreport.com/mbody-ai-expands-service-robotics-operations-eleven-states-canada/", "summary": "<p>MBody AI has deployed its hardware-agnostic Orchestrator platform to Florida and California, with a pilot in Ontario.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/mbody-ai-expands-service-robotics-operations-eleven-states-canada/\">MBody AI expands service robotics operations to eleven states and Canada<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "Advantages of hypoid gearing over worm, bevel and bevel-planetary", "source": "Robotics Business Review", "date": "2026-06-29", "url": "https://www.therobotreport.com/advantages-of-hypoid-gearing-over-worm-bevel-and-bevel-planetary/", "summary": "<p>Right-angle gearing often requires engineers to compromise between torque capacity and mechanical efficiency. Hypoid gearing offers a balance of mechanical efficiency, load-carrying capability, and single-stage ratio range.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/advantages-of-hypoid-gearing-over-worm-bevel-and-bevel-planetary/\">Advantages of hypoid gearing over worm, bevel and bevel-planetary<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}, {"title": "BMW Group deploys Figure 03 humanoid after tests with previous version", "source": "Robotics Business Review", "date": "2026-06-29", "url": "https://www.therobotreport.com/bmw-group-deploys-figure-03-humanoid-after-tests-previous-version/", "summary": "<p>The Figure 02 robot supported the production of more than 30,000 BMW X3 vehicles over 11 months in South Carolina.<\/p>\n<p>The post <a href=\"https://www.therobotreport.com/bmw-group-deploys-figure-03-humanoid-after-tests-previous-version/\">BMW Group deploys Figure 03 humanoid after tests with previous version<\/a> appeared first on <a href=\"https://www.therobotreport.com\">The Robot Report<\/a>.<\/p>"}], "embeddedNews": [{"title": "A Capable KVM Built With The ESP32", "source": "Hackaday", "date": "2026-07-30", "url": "https://hackaday.com/2026/07/30/a-capable-kvm-built-with-the-esp32/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"244\" src=\"https://hackaday.com/wp-content/uploads/2026/07/espkvm_feat.png?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>[Evgenij Spitsyn] spotted a KVM build on these very pages some time ago. That inspired their own build, leveraging the versatility of the ESP32-P4 microcontroller. The concept is straightforward. Named <a class=\"read-more\" href=\"https://hackaday.com/2026/07/30/a-capable-kvm-built-with-the-esp32/\">&#8230;read more<\/a>"}, {"title": "Use Your Head While Trimming Trees", "source": "Hackaday", "date": "2026-07-30", "url": "https://hackaday.com/2026/07/29/use-your-head-while-trimming-trees/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"450\" src=\"https://hackaday.com/wp-content/uploads/2026/07/string-trimmer-main.png?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>[Attoparsec] occasionally rides a bicycle for transportation, but with the major downside of doing this in North America, a place where bicycle infrastructure is generally neglected. From snow removal, maintenance, <a class=\"read-more\" href=\"https://hackaday.com/2026/07/29/use-your-head-while-trimming-trees/\">&#8230;read more<\/a>"}, {"title": "Keyboard Lights As An Airgap Attack Vector", "source": "Hackaday", "date": "2026-07-30", "url": "https://hackaday.com/2026/07/29/keyboard-lights-as-an-airgap-attack-vector/", "summary": "<div><img alt=\"\" class=\"attachment-large size-large wp-post-image\" height=\"450\" src=\"https://hackaday.com/wp-content/uploads/2026/07/facing_photoresistors-e1785300673576.jpg?w=800\" style=\"margin: 0 auto; margin-bottom: 15px;\" width=\"800\" /><\/div>What do you do when you need to get data into an airgapped machine? Well, you might find yourself limited to basic input devices to interact with the computer in <a class=\"read-more\" href=\"https://hackaday.com/2026/07/29/keyboard-lights-as-an-airgap-attack-vector/\">&#8230;read more<\/a>"}, {"title": "NightRun UEFI application boots a local LLM on Raspberry Pi 5 and x86 PCs without an OS", "source": "CNX Software", "date": "2026-07-30", "url": "https://www.cnx-software.com/2026/07/30/nightrun-uefi-application-boots-a-local-llm-on-raspberry-pi-5-and-x86-pcs-without-an-os/", "summary": "<div><img alt=\"NightRun runs LLMs without OS\" class=\"attachment-medium size-medium wp-post-image\" height=\"480\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/07/NightRun-runs-LLMs-without-OS-720x480.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Running LLMs locally on an SBC or mini PC is a good way to keep your data private, but they typically require a conventional operating system, which uses a good portion of system memory. NightRun is an experimental open-source project that addresses this issue by booting a machine directly into a local LLM from a USB drive or microSD card, without loading a conventional OS. By removing the operating system, NightRun makes more RAM and memory bandwidth available for AI inference. The runtime is written in Rust, and during boot it loads a quantized model (1.3 GB to 2.4 GB) directly into RAM while verifying its CRC-32 checksums. After the model is loaded, storage is &#8220;sealed,&#8221; meaning any later attempt to read from the disk will trigger a hard fault. NightRun key features: Hardware support &#8211; Supports 64-bit x86_64 UEFI PCs (Secure Boot disabled) and Raspberry Pi 5 via USB [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/07/30/nightrun-uefi-application-boots-a-local-llm-on-raspberry-pi-5-and-x86-pcs-without-an-os/\">NightRun UEFI application boots a local LLM on Raspberry Pi 5 and x86 PCs without an OS<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Luxonis M8 Controller Box adds industrial I/Os, CAN Bus, and relay control to OAK4 AI vision cameras", "source": "CNX Software", "date": "2026-07-30", "url": "https://www.cnx-software.com/2026/07/30/luxonis-m8-controller-box-adds-industrial-i-os-can-bus-and-relay-control-to-oak4-ai-vision-cameras/", "summary": "<div><img alt=\"OAK4 AI camera M8 Controller Box\" class=\"attachment-medium size-medium wp-post-image\" height=\"589\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/07/OAK4-AI-camera-M8-Controller-Box-720x589.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>Luxonis has introduced a prototype of the M8 Controller Box, an industrial I/O expansion module for OAK4 AI vision edge AI cameras powered by a Qualcomm DragonWing QCS8550. Connected through the camera&#8217;s M8 interface, it adds GPIO, relay, CAN, serial, and USB connectivity, allowing OAK4-based systems to interface directly with sensors, actuators, PLCs, motors, and other industrial equipment for machine vision and automation applications. The prototype module features 16 GPIOs, four 16A relays, CAN 2.0, RS232, two USB 2.0 Type-A ports, an isolated strobe output, onboard audio, three buttons, and three status LEDs. It is powered directly from the OAK4 M8 connector, and supports DIN rail and VESA mounting. Luxonis M8 Controller Box specifications: MCU – Raspberry Pi RP2040 dual-core Arm Cortex M0+ @ 133 MHz with 264KB SRAM Host interface M8 connector for connecting Luxonis OAK4 cameras (standalone mode only) M8 passthrough port Audio 3.5mm headphone/AUX jack with mic input Onboard [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/07/30/luxonis-m8-controller-box-adds-industrial-i-os-can-bus-and-relay-control-to-oak4-ai-vision-cameras/\">Luxonis M8 Controller Box adds industrial I/Os, CAN Bus, and relay control to OAK4 AI vision cameras<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "Credit card-sized Edge AI single board computers are powered by TI AM62A (2 TOPS) or AM68A (8 TOPS) SoC", "source": "CNX Software", "date": "2026-07-30", "url": "https://www.cnx-software.com/2026/07/30/credit-card-sized-edge-ai-sbc-texas-instruments-am62a-2-tops-am68a-8-tops-soc/", "summary": "<div><img alt=\"InHand Mo 62A SBC\" class=\"attachment-medium size-medium wp-post-image\" height=\"500\" src=\"https://www.cnx-software.com/wp-content/uploads/2026/07/InHand-Mo-62A-SBC-720x500.jpg\" style=\"margin-bottom: 10px;\" width=\"720\" /><\/div>\n<p>InHand Mo 62A and Mo 68A are two credit card-sized Edge AI single board computers (SBCs) powered by Texas Instruments AM62A and AM68A processors, delivering respectively 2 TOPS and 8 TOPS of AI performance. Designed for AI Vision applications, the Mo 62A and Mo 68A SBCs support MIPI CSI camera input, Raspberry Pi HAT expansion boards, integrate 7th-generation ISP image processing capabilities, and handle H.264 / H.265 video encoding and decoding. However, they offer a different range of ports, as you&#8217;ll see in the specifications below. Target applications include industrial equipment, access control systems, robots, smart cameras, and visual inspection terminals. InHand Mo 62A Mo 62A specifications: SoC – Texas Instruments AM62A74 SoC Application processor – Up to four Arm Cortex- A53 cores @ 1.4GHz Real-time cores 1x Cortex-R5F @ 800MHz (MPU Channel with FFI) 1x Cortex-R5F @ 800MHz to support Device Management 3D GPU &#8211; None VPU &#8211; 4Kp30 [...]<\/p>\n<p>The post <a href=\"https://www.cnx-software.com/2026/07/30/credit-card-sized-edge-ai-sbc-texas-instruments-am62a-2-tops-am68a-8-tops-soc/\">Credit card-sized Edge AI single board computers are powered by TI AM62A (2 TOPS) or AM68A (8 TOPS) SoC<\/a> appeared first on <a href=\"https://www.cnx-software.com\">CNX Software - Embedded Systems News<\/a>.<\/p>"}, {"title": "US FCC bans Chinese robots", "source": "Electronics Weekly", "date": "2026-07-30", "url": "https://www.electronicsweekly.com/news/business/us-fcc-bans-chinese-robots-2026-07/", "summary": "<p>The US FCC has banned the import of hunanoid robots from China. “Advanced robotic devices collect data that could be leveraged by malign actors to surveil Americans, enhance the capabilities [&#8230;]<\/p>\n<p>The post <a href=\"https://www.electronicsweekly.com/news/business/us-fcc-bans-chinese-robots-2026-07/\">US FCC bans Chinese robots<\/a> appeared first on <a href=\"https://www.electronicsweekly.com\">Electronics Weekly<\/a>.<\/p>"}, {"title": "Arm Q1 revenues up 22% YoY", "source": "Electronics Weekly", "date": "2026-07-30", "url": "https://www.electronicsweekly.com/news/business/arm-q1-revenues-up-22-yoy-2026-07/", "summary": "<p>Arm’s fiscal Q1 (calendar Q2) revenue was $1.29 billion, up 22% YoY for a profit of $531 million at a margin of 41.2%. It forecast Q2 revenue of  $1.38 billion. [&#8230;]<\/p>\n<p>The post <a href=\"https://www.electronicsweekly.com/news/business/arm-q1-revenues-up-22-yoy-2026-07/\">Arm Q1 revenues up 22% YoY<\/a> appeared first on <a href=\"https://www.electronicsweekly.com\">Electronics Weekly<\/a>.<\/p>"}, {"title": "GloFo gets $300m for  SiPho", "source": "Electronics Weekly", "date": "2026-07-30", "url": "https://www.electronicsweekly.com/news/business/glofo-gets-300m-for-sipho-2026-07/", "summary": "<p>The U.S. DoC  intends to advance $300 million to Globalfoundries to accelerate R&#38;D  of next-generation silicon photonics. The work will cover optical materials, wafer technologies and advanced packaging to accelerate [&#8230;]<\/p>\n<p>The post <a href=\"https://www.electronicsweekly.com/news/business/glofo-gets-300m-for-sipho-2026-07/\">GloFo gets $300m for  SiPho<\/a> appeared first on <a href=\"https://www.electronicsweekly.com\">Electronics Weekly<\/a>.<\/p>"}, {"title": "Cambridge Tech Week Startup Finalists", "source": "Electronics Weekly", "date": "2026-07-30", "url": "https://www.electronicsweekly.com/news/business/cambridge-tech-week-startup-finalists-2026-07/", "summary": "<p>The five startups competing in the live Cambridge Tech Week Pitching Competition this September are: HotHouse Therapeutics – Spun out of Professor Anne Osbourn’s laboratory at the John Innes Centre, [&#8230;]<\/p>\n<p>The post <a href=\"https://www.electronicsweekly.com/news/business/cambridge-tech-week-startup-finalists-2026-07/\">Cambridge Tech Week Startup Finalists<\/a> appeared first on <a href=\"https://ww
