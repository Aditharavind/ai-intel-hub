rget=\"_blank\">Global E-Waste Monitor<\/a> report in 2024. The report estimated that current e-waste management captures less than a third of the recoverable metal value contained in discarded electronics. <\/p><p>For recyclers, much of that lost value is a consequence of what happens before a circuit board ever reaches a smelter or shredder. Boards contain a mixture of components such as memory chips, processors, magnets, and capacitors, as well as valuable raw materials such as copper, aluminum, tantalum, and precious metals. Conventional recycling often mixes everything into bulk streams and destroys components that might otherwise be reused.<\/p><p><a href=\"https://www.tuurny.com/\" target=\"_blank\">Tuurny<\/a>, a startup based in San Francisco, is developing an automated system to remove and separate reusable chips from circuit boards before the remaining material is shredded. In April, the company <a href=\"https://finance.yahoo.com/sectors/technology/articles/tuurny-deploys-physical-ai-address-235700358.html\" rel=\"noopener noreferrer\" target=\"_blank\">announced<\/a> it had designed a robotic system, called Nantul, to identify and extract RAM integrated circuits, claiming each machine can recover 300 intact RAM ICs per hour. <\/p><p><a href=\"https://www.linkedin.com/in/sinaghashghaei\" rel=\"noopener noreferrer\" target=\"_blank\">Sina Ghashghaei<\/a>, Tuurny’s founder, says the company is preparing its first field deployment with dozens of machines through a six-figure deal with Areera, a television recycler in the United Kingdom, which processes 1,500 tonnes of televisions per month. The deployment is planned for early 2027. <\/p><p>Tuurny’s first target is recovering RAM ICs and other chips used in legacy systems where replacement components can be difficult to source. Ghashghaei says the company is talking with a few legacy chip suppliers and pursuing potential agreements to supply aluminum and copper recovered from circuit boards to smelters and refiners. He declined to identify the companies involved. <\/p><h2>Robots for Automated RAM Recovery<\/h2><p>Traditional electronics recycling often begins by shredding boards and sorting the mixed output afterward. Tuurny aims to do the opposite: Identify and remove components first, sort them by model or material, then reroute the recovered items to testing labs for potential reuse as new chips or to refiners and smelters for further processing. <\/p><p>Nantul comprises three robotic systems in one. The first is an arm to continuously feed the component-removal robots, paired with two tabletop machines similar to 3D printers or computer numerical control (CNC) machines. A neural network identifies and catalogs components, then searches the internet for manufacturers’ thermal-profile specifications. Nantul uses those specifications to employ a combination of suction, controlled heat, computer vision, and robotic controls to remove chips while minimizing damage. Recovered items are then sorted by model number in material-specific groups. <\/p><p>“We’re creating a new supply chain from old feedstock that didn’t exist before,” Ghashghaei says, adding that manual recovery is expensive and difficult to scale. <\/p><p class=\"shortcode-media shortcode-media-rebelmouse-image\"> <img alt=\"A circuit board layout displayed on a computer screen as a software program isolates its RAM components.\" class=\"rm-shortcode\" id=\"d6831\" src=\"https://spectrum.ieee.org/media-library/a-circuit-board-layout-displayed-on-a-computer-screen-as-a-software-program-isolates-its-ram-components.jpg?id=66763748&amp;width=980\" /> <small class=\"image-media media-caption\">Tuurny’s recovery system includes a computer vision system that identifies specific RAM components to assess them for recovery.<\/small><small class=\"image-media media-photo-credit\">Tuurny<\/small><\/p><p><a href=\"https://engineering.tamu.edu/mechanical/profiles/zheng-minghui.html\" target=\"_blank\">Minghui Zheng<\/a>, an associate professor of mechanical engineering at Texas A&amp;M University, in College Station, who studies robotic disassembly and electronics recycling systems, says Tuurny’s approach appears technically feasible, especially when focused on the narrow, valuable target of recovering RAM from more controlled e-waste streams. <\/p><p>“RAM is a good starting point because it has relatively high reuse value and is more standardized than many other electronic parts,” Zheng says. The harder challenge, however, is removing chips “without heat, mechanical, or electrical damage, and making sure it still works reliably afterward.”<\/p><p>Used circuit boards can vary by layout, markings, age, contamination, solder condition, or prior damage. A robot has to identify the correct component, choose a removal strategy, apply heat locally, lift the part cleanly, and preserve enough information about the part for downstream testing and resale.<\/p><h2>E-Waste Recycling Strategies<\/h2><p>Ghashghaei says Tuurny is building small modular machines using off-the-shelf parts, custom controls, and <a href=\"https://developer.nvidia.com/embedded/jetson-nano\" target=\"_blank\">Nvidia Jetson Nano<\/a> hardware. The company is trying to keep costs down by reducing hardware complexity to arrive at a price point far below centralized industrial equipment used at large facilities. He says the biggest challenge from an engineering perspective has been developing the autonomous computer vision and robotic control. <\/p><p>Last year, the four-person startup received a <a href=\"https://finance.yahoo.com/news/tuurny-announces-breakthrough-ai-powered-140800548.html\" target=\"_blank\">NASA-funded grant<\/a> to support an AI-powered repair assistant for printed circuit boards that used computer vision and a custom large language model (LLM) to guide technicians. <\/p><p>Ghashghaei says Tuurny pivoted from board repair to e-waste processing after concluding that discarded electronics represented a larger market amid growing interest in the U.S. around <a href=\"https://spectrum.ieee.org/rare-earth-elements-2666461932\" target=\"_self\">on-shoring capacity for critical minerals and rare earths<\/a>. The pivot also positions Tuurny to potentially address supply chain concerns around legacy chips for systems in telecom, aerospace, defense, and other industries where equipment remains in service long after chips leave mainstream production.<\/p><p>In practice, Zheng says the main challenge in making robotic disassembly of electronics commercially viable is ensuring it’s adaptable enough to handle the large variability in e-waste while keeping costs reasonable. <\/p><p>“Every electronic product is different, and used boards may be damaged, dirty, or arranged differently. The robot must be able to find the right parts, remove them carefully, and avoid damaging them in real time, which creates major challenges for robotic perception, decision-making, planning, and manipulation,” Zheng says. “Economically, the recovered parts should be valuable enough to justify the costs of the robot, sensing, testing, maintenance, labor, and scaling up the process.” <\/p><p>For smelters and refiners, the question may be whether Tuurny can supply predictable material streams at commercial volumes. Ghashghaei acknowledged that Tuurny’s scaling efforts could run into its own supply chain constraints in trying to acquire enough components to build more robots. <\/p><p>Zheng called Tuurny’s approach promising but still early. “For now, it is more realistic as a targeted recovery strategy for valuable components like RAM,” Zheng says. “The key question is whether the robotic disassembly technology can work reliably, affordably, and at scale.” <\/p>"}, {"title": "Home Robot Safety Is All About Relationships", "source": "IEEE Spectrum Robotics", "date": "2026-05-19", "url": "https://spectrum.ieee.org/domestic-humanoid-robot-safety-standards", "summary": "<img src=\"https://spectrum.ieee.org/media-library/close-up-of-an-elderly-persons-fingers-touching-the-silicon-hand-of-a-humanoid-robot.jpg?id=66748937&amp;width=1245&amp;height=700&amp;coordinates=0%2C469%2C0%2C469\" /><br /><br /><p>The International Organization for Standardization (ISO) is updating its <a href=\"https://www.iso.org/standard/53820.html\" rel=\"noopener noreferrer\" target=\"_blank\">12-year-old safety requirements<\/a> for <a href=\"https://spectrum.ieee.org/stretch-4-home-robot\" target=\"_blank\">personal care robots<\/a>. A lot has happened since the last revision, both on the technology side and with researchers’ understanding of safety for humans collaborating with domestic robots. The proposed ISO update addresses hazard identification, risk assessment, and different use scenarios. It does not, however, set limits, propose testing methods, or have enforcement mechanisms that might address <a href=\"https://spectrum.ieee.org/humanoid-robot-scaling\" target=\"_blank\">the complexities of human-robot collaboration<\/a>. And that is a problem, argues technology policy researcher <a href=\"https://scholar.google.com/citations?user=KNzdhYYAAAAJ&amp;hl=ko\" rel=\"noopener noreferrer\" target=\"_blank\">Jae-Seong Lee<\/a> of the Electronics and Telecommunications Research Institute in Daejeon, South Korea.<\/p><p><strong>Why is the next revision of ISO 13482 a big deal?<\/strong><br /><strong>Jae-Seong Lee:<\/strong> The standard is moving into final approval at a moment when domestic humanoid robot makers are shifting from lab prototypes to products aimed at real homes, real caregivers, and real families. That matters because the standard does more than specify geometry and impact limits. It helps define what counts as acceptable robot behavior in the messy world of everyday life.<\/p><p><strong>What is the core engineering problem?<\/strong><br /><strong>Lee:<\/strong> It is not simply whether a robot can avoid collisions or detect people in its path. The harder problem is that human-robot interaction is bidirectional. The robot changes what the human does, and the human changes what the robot perceives and does next. In other words, safety is not a fixed property of the machine alone; it emerges from the relationship.<\/p><p><strong>Isn’t that already covered by current safety standards?<\/strong><br /><strong>Lee: <\/strong>Only partially. ISO 13482 addresses personal care robots through hazard identification, risk assessment, and intended use scenarios, and related guidance acknowledges noncontact hazards such as unpredictability and incorrect autonomous decisions. But it stops short of binding compliance criteria, test methods, or enforcement mechanisms for the hazards produced by the human-robot relationship.<\/p><p class=\"pull-quote\">The technical community understands bidirectional coupling, and the standards framework acknowledges relevant hazards, but no current standard fully converts that knowledge into enforceable rules for domestic autonomy.—Jae-Seong Lee<\/p><p><strong>Why can’t engineers just better define a robot’s operating envelope?<\/strong><br /><strong>Lee:<\/strong> Because the value proposition of a domestic humanoid depends on operating in uncontrolled environments. A robot that is safe only in standardized rooms, with healthy adults, under well-defined conditions is not really a domestic humanoid at all. <\/p><p>In industrial robotics, designers can usually bound the task, the workspace, and the population. In a home, the robot must adapt to elderly residents, children, visitors, pets, clutter, tight spaces, and fluctuating human behavior. Those aren’t edge cases. Those are the baseline. Tightening the domain to be more like that of factory robots would make the home robots less useful. <\/p><p><strong>The proposal mentions training data. Why does that matter?<\/strong><br /><strong>Lee:<\/strong> Because the data already reflect the diversity of domestic life. Companies building humanoid training datasets are reportedly sending paying contract workers around the world to record their chores in ordinary settings. That means the robots will be trained on real-world variability, not sanitized demonstrations. The safety problem is therefore in the composition of the entire human-robot system, not in any one component.<\/p><p><strong>What is the standards gap?<\/strong><br /><strong>Lee: <\/strong>The gap is governance. The technical community understands bidirectional coupling, and the standards framework acknowledges relevant hazards, but no current standard fully converts that knowledge into enforceable rules for domestic autonomy. What is missing is a way to specify safe behavior across the full range of human conditions the robot will actually encounter.<\/p><p>What’s also missing is a decision about who gets to decide whose behavior counts as normal. Whose gait sets the baseline? Whose is an acceptable risk threshold? Whose definition of safe judgment gets written into the requirement language? Those are value judgments, not purely engineering ones. A standards committee cannot avoid choosing a normative reference point; it can only decide whether that choice is explicit and inclusive.<\/p><p><strong>Who could help answer those questions?<\/strong><br /><strong>Lee: <\/strong>The proposal argues that the people most affected by domestic humanoids are not systematically represented in the working groups shaping the standard. It points especially to older adults, who are often the primary intended users of domestic care robots, yet whose movement patterns and cognitive states are not directly embedded in the standards process.<\/p><p>In other words, this revision acknowledges the hardest problems but pushes unresolved issues into advisory language, nonbinding guidance, or future revision scopes. That can be useful, but it also delays the real question: What counts as safe relational behavior in the home?<\/p><p><strong>What are the stakes?<\/strong><br /><strong>Lee: <\/strong>The risk is not only injury, though that is the obvious concern. The deeper risk is that safety assumptions get baked into products and standards before the market, regulators, and users have a chance to question them. Once deployment patterns harden, it becomes much harder to revise the baseline.<\/p><p><strong>What should the engineers on the standards bodies do about it?<\/strong><br /><strong>Lee: <\/strong>The engineers on the standards body should ask not just, “What are the robot’s outputs, and do they stay within safe thresholds?” but “What states does this robot engage with, and does that engagement remain safe across the full range of those states?” That shift sounds subtle, but it changes the design brief. It moves safety from machine-centric measurement toward system-level relational assurance.<\/p><p>Domestic humanoid safety cannot be solved by machine engineering alone. It requires a framework that treats the human not as background noise, but as part of the system, part of the definition of the safety envelope. <\/p>"}, {"title": "Into the Omniverse: Manufacturing’s Simulation-First Era Has Arrived", "source": "NVIDIA Robotics", "date": "2026-04-28", "url": "https://blogs.nvidia.com/blog/manufacturing-simulation-first/", "summary": "Manufacturing’s traditional design-build-test cycle rested on a single assumption: Real-world testing was the only reliable test environment."}, {"title": "NVIDIA and Partners Showcase the Future of AI-Driven Manufacturing at Hannover Messe 2026", "source": "NVIDIA Robotics", "date": "2026-04-20", "url": "https://blogs.nvidia.com/blog/ai-manufacturing-hannover-messe/", "summary": "Manufacturing is at an inflection point. Across every major industrial economy, the pressure to do more with less — due to faster design cycles, leaner operations and strain on skilled labor pools — is accelerating the shift to AI-driven production.  The question is no longer whether to adopt AI, but how fast and at what [&#8230;]"}, {"title": "National Robotics Week — Latest Physical AI Research, Breakthroughs and Resources", "source": "NVIDIA Robotics", "date": "2026-04-10", "url": "https://blogs.nvidia.com/blog/national-robotics-week-2026/", "summary": "This National Robotics Week, NVIDIA is highlighting the breakthroughs that are bringing AI into the physical world — as well as the growing wave of robots transforming industries, from agricultural and manufacturing to energy and beyond. Advancements in robot learning, simulation and foundation models are accelerating development, enabling robots to move from training in virtual [&#8230;]"}], "papers": [{"title": "Example Embodied AI Paper", "authors": ["Example Author"], "published": "2026-06-12", "summary": "Example paper seed item.", "pdf_url": "https://example.com/paper.pdf"}, {"title": "Mana: Dexterous Manipulation of Articulated Tools", "authors": ["Zhao-Heng Yin", "Guanya Shi", "Pieter Abbeel", "C. Karen Liu"], "published": "2026-06-11", "summary": "Articulated tool manipulation remains a major challenge in dexterous robotics due to the need to coordinate internal degrees of freedom and contact-rich interactions. While prior work has largely focused on rigid objects, articulated tool use remains underexplored because of its physical complexity and the difficulty of learning functional grasping and manipulation policies. We present Mana (Manipulation Animator), a general sim-to-real framework that reinterprets dexterous manipulation as an animation problem. Inspired by computer animation, Mana employs a coarse-to-fine pipeline that transforms procedurally-generated grasp keyframes into manipulation trajectories through motion planning and reinforcement learning. The data generation process is largely automatic, requiring only a few mouse clicks to specify functional affordances (<1 minute per tool). Across four articulated tools spanning different scales and joint types, Mana achieves zero-shot sim-to-real transfer for both grasping and in-hand manipulation, demonstrating a scalable approach to dexterous articulated tool use.", "pdf_url": "https://arxiv.org/pdf/2606.13677v1"}, {"title": "Improving Robotic Generalist Policies via Flow Reversal Steering", "authors": ["Andy Tang", "William Chen", "Andrew Wagenmaker", "Chelsea Finn", "Sergey Levine"], "published": "2026-06-11", "summary": "Generalist policies can learn a wide range of skills from diverse robot datasets. In order to solve or improve on challenging news tasks, we need a way to infer and invoke the appropriate actions from the policy's rich behavioral prior, especially when directly commanding the policy fails. We focus on flow matching generalists and propose Flow Reversal Steering (FRS): a method that takes suboptimal but ``reasonable'' actions, finds their latent noises by passing them through the flow policy in reverse, and maps them to nearby generalist action modes. We evaluate FRS across many simulated and real-world manipulation settings. First, FRS can turn coarse semantic guidance from humans or vision-language models (VLMs) into corresponding good robot actions, improving zero-shot control. These gains can be distilled with behavioral cloning by training an auxiliary policy to output noises that the generalist maps to good actions -- showing up to 95% absolute task success rate boosts in under a minute of training. Finally, FRS enables policy improvement by bootstrapping reinforcement learning with semantic knowledge, improving on several tasks that standard RL fails to improve on.", "pdf_url": "https://arxiv.org/pdf/2606.13675v1"}, {"title": "RepWAM: World Action Modeling with Representation Visual-Action Tokenizers", "authors": ["Junke Wang", "Qihang Zhang", "Shuai Yang", "Yiming Luo", "Yujun Shen", "Zuxuan Wu", "Yu-Gang Jiang", "Yinghao Xu"], "published": "2026-06-11", "summary": "This work presents RepWAM, a representation-centric world action model (WAM) built on representation visual-action tokenizers. Existing WAMs typically inherit reconstruction-oriented video tokenizers from pretrained video generation models. Although these tokenizers preserve visual fidelity, pixel reconstruction alone provides limited guidance for learning instruction-following dynamics that connect future prediction with robot control. To address this, we explore a semantic visual-action latent space for representation-centric world action modeling. Specifically, we train a representation visual-action tokenizer that maps visual inputs into aligned visual and latent action tokens. We then pretrain our WAM to jointly model future visual states and the latent actions that connect them under language instructions, followed by adaptation to real robot trajectories for closed-loop manipulation. Experiments on real-world manipulation tasks and simulation benchmarks show that RepWAM delivers strong performance across diverse manipulation settings, while ablations highlight the value of semantic visual-action tokenization over reconstruction-oriented alternatives. These results establish representation visual-action tokenization as a promising foundation for world action models and a step toward generalist robot policies. Code and weights will be available at https://github.com/wdrink/RepWAM.", "pdf_url": "https://arxiv.org/pdf/2606.13674v1"}, {"title": "$\\texttt{WEAVER}$, Better, Faster, Longer: An Effective World Model for Robotic Manipulation", "authors": ["Arnav Kumar Jain", "Yilin Wu", "Jesse Farebrother", "Gokul Swamy", "Andrea Bajcsy"], "published": "2026-06-11", "summary": "The potential impacts of world models (WMs, i.e., learned simulators) on robotics are far-reaching -- policy evaluation, policy improvement, and test-time planning -- all with limited real-world interaction. To unlock these downstream capabilities, a WM needs to jointly satisfy three desiderata: $\\textit{(i)}$ fidelity (i.e., producing simulated trajectories that correlate with reality), $\\textit{(ii)}$ consistency (i.e., producing simulated trajectories that are coherent over long horizons), and $\\textit{(iii)}$ efficiency (i.e., producing simulated trajectories quickly). We propose $\\texttt{WEAVER}$ (World Estimation Across Views for Embodied Reasoning): a WM architecture that simultaneously achieves all three desiderata, providing state-of-the-art results on robotic manipulation tasks. $\\texttt{WEAVER}$ is a multi-view WM trained to predict future latents and reward values via a flow-matching loss. We distill the key design decisions across model architecture, memory, and prediction objectives required to unlock the kinds of long-horizon dynamic manipulation tasks that have confounded prior world modeling approaches. We apply $\\texttt{WEAVER}$ in robotic hardware, demonstrating its effectiveness at policy evaluation ($ρ$=0.870 correlation with real-world success rate), policy improvement (real-world success rate improvement of $38\\%$ on top of the $π_{0.5}$ robot foundation model), and test-time planning (real-world success rate improvement of $14\\%$ with a $5-10\\times$ speedup over prior WMs). $\\texttt{WEAVER}$ also demonstrates better performance than prior WMs when evaluated on out-of-distribution scenarios. Code, models, and videos at: https://arnavkj1995.github.io/WEAVER/ .", "pdf_url": "https://arxiv.org/pdf/2606.13672v1"}, {"title": "Search for High-Frequency Gravitational Waves via Geomagnetic Conversion with Radio Telescopes", "authors": ["Hongliang Tian", "Lei Wu", "Xiaolong Yang", "Qiang Yuan", "Bin Zhu"], "published": "2026-06-11", "summary": "The detection of high-frequency gravitational waves (HFGWs) above 10 kHz provides a crucial probe of exotic astrophysical phenomena and new physics. We report the first search for HFGWs via their conversion to electromagnetic radiation through the inverse Gertsenshtein effect in Earth's magnetic field, utilizing radio telescopes including the Very Large Array (VLA) and the Atacama Large Millimeter/submillimeter Array (ALMA). Since no statistically significant signal is observed, we obtain new upper limits on the characteristic strain across the 1 GHz -- 1 THz band, with the most stringent constraint reaching $h_c \\lesssim 10^{-18}$, improving upon existing bounds by up to three orders of magnitude. These results significantly advance the exploration of uncharted parameter space for exotic gravitational-wave sources, paving the way for future discoveries with next-generation facilities such as the Square Kilometre Array (SKA).", "pdf_url": "https://arxiv.org/pdf/2606.13642v1"}, {"title": "Beyond Uniform Tokens: Adaptive Compression for Time Series Language Models", "authors": ["Jialin Gan", "Xin Qiu", "Guangzhe Chen", "Xue Wang"], "published": "2026-06-11", "summary": "Large language models (LLMs) have enabled time series (TS) analysis by jointly modeling numerical observations and textual context through a shared token interface. However, TS tokens and prompt tokens exhibit fundamentally different information structures, making uniform token processing inefficient. In this paper, we study token efficiency in TS language modeling from an asymmetric-token perspective. We show that TS tokens have highly uneven spectral contributions, where many tokens share redundant frequency patterns while a small subset preserves critical temporal evidence. We also observe that prompt-token influence attenuates with model depth, suggesting that full prompt retention across all layers is unnecessary. Based on these findings, we develop an adaptive token budgeting framework that compresses TS tokens via frequency-domain structure and progressively reduces prompt tokens across layers. Experiments across forecasting, classification, imputation, and anomaly detection demonstrate up to \\textit{\\textbf{7.68$\\times$}} inference acceleration and performance gains in \\textit{\\textbf{78\\%}} of evaluated settings, showing the effectiveness of asymmetric token compression for scalable TS foundation models.", "pdf_url": "https://arxiv.org/pdf/2606.13624v1"}, {"title": "Reasoning as Pattern Matching: Shared Mechanisms in Human and LLM Everyday Reasoning", "authors": ["Zach Studdiford", "Gary Lupyan"], "published": "2026-06-11", "summary": "When large language models (LLMs) fail to generalize or make haphazard errors in reasoning, it is often taken as evidence that LLMs are not truly reasoning, but rather performing a kind of pattern matching. The implication is that people's behavior does not exhibit the same types of failures because human reasoning uses principled and abstract world models. We evaluate human participants and 25 LLMs on their ability to engage in common-sense reasoning about a variety of everyday situations and observe similar patterns of errors in both people and models. We then identify the set of attention heads driving LLM responses and find that these heads implement a form of pattern-matching. These attention heads allow us to predict seemingly inexplicable reasoning errors in people caused by ostensibly irrelevant prompt details. Taken together, our results suggest that everyday causal reasoning in people and LLMs is more consistent with a form of pattern-matching than with abstract world models.", "pdf_url": "https://arxiv.org/pdf/2606.13607v1"}, {"title": "MCR-Bionic Hand: Anatomical Structural Priors for Dexterous Manipulation", "authors": ["Haosen Yang", "Guowu Wei"], "published": "2026-06-11", "summary": "Dexterous robotic hands are usually formulated as high dimensional active control systems governed by degrees of freedom, actuation, and algorithms. Human hand dexterity, however, is partly encoded in the physical architecture of bones, ligaments, tendons, aponeuroses, and intrinsic muscles. This work describes that contribution as two linked forms of structural intelligence: structural prior generation, in which wrist to finger tenodesis, FDS/FDP routing, and the dorsal extensor hood transform low dimensional posture inputs into default grasp configurations and PIP to DIP coordination; and muscle mediated modulation, in which extrinsic muscles, lumbricals, and interossei regulate MCP posture, distal stability, fingertip force paths, and contact states around that default state. Based on this framework, MCR-Bionic Hand is developed as a 1:1 musculoskeletal biomimetic hand integrating a two row eight bone wrist, cross wrist tendons, anatomical flexor routing, volar plate and collateral ligament constraints, the dorsal extensor hood, and intrinsic muscle pathways within one body. Functional demonstrations and geometric mechanical models show that wrist posture induces multi joint pre shaping, the extensor hood maps PIP posture to a coupled DIP response, and intrinsic plus pathways modulate distal stability and fingertip action direction after grasp formation. Contact rich tasks, including coin rotation, pen transfer, dorsal coin flipping, and cube manipulation, show that MCR-Bionic links low dimensional state generation with fine post contact modulation. These results suggest that anatomical biomimetics is valuable not for visual similarity, but for identifying human hand structures that perform part of control.", "pdf_url": "https://arxiv.org/pdf/2606.13601v1"}, {"title": "LabVLA: Grounding Vision-Language-Action Models in Scientific Laboratories", "authors": ["Baochang Ren", "Xinjie Liu", "Xi Chen", "Yanshuo Liu", "Chenxi Li", "Daqi Gao", "Zeqin Su", "Jintao Xing", "Zirui Xue", "Rui Li", "Xiangyu Zhao", "Shuofei Qiao", "Minting Pan", "Wangmeng Zuo", "Lei Bai", "Dongzhan Zhou", "Ningyu Zhang", "Huajun Chen"], "published": "2026-06-11", "summary": "Scientific laboratories increasingly rely on AI systems to reason about experiments, but the physical act of doing science remains largely outside their reach. AI can help read literature, generate hypotheses, and plan protocols, yet the execution of those protocols at the bench still requires a human operator. Vision-Language-Action (VLA) models provide one possible interface between written protocols and robot execution, but existing policies are trained mostly on household and tabletop demonstrations and rarely encounter the instruments, transparent liquids, or fixed protocol workflows found in scientific laboratories. Closing this gap requires both laboratory-specific supervision and a unified learning framework that can accommodate the diverse robot embodiments used to execute experimental protocols. We therefore identify data and embodiment as central bottlenecks alongside model design. To address the data side, we build RoboGenesis, a simulation-based workflow and data engine that composes configured laboratory workflows from atomic skills, validates and filters rollouts, and exports structured demonstrations across supported robot profiles. On the policy side, we present LabVLA, trained with a two-stage recipe: FAST action token pretraining first makes the Qwen3-VL-4B-Instruct backbone action aware before any continuous control is learned, and flow matching posttraining then attaches a DiT action expert under knowledge insulation. On the LabUtopia benchmark, LabVLA achieves the highest average success rate among all evaluated baselines under both in-distribution and out-of-distribution settings.", "pdf_url": "https://arxiv.org/pdf/2606.13578v1"}, {"title": "MaskWAM: Unifying Mask Prompting and Prediction for World-Action Models", "authors": ["Hanyang Yu", "Haitao Lin", "Jingbo Zhang", "Wenyao Zhang", "Chenghao Gu", "Heng Li", "Ping Tan"], "published": "2026-06-11", "summary": "World Action Models (WAMs) present a promising paradigm for robotic control via video prediction. However, current WAMs suffer from fundamental spatial bottlenecks: standard text inputs introduce referential ambiguity in cluttered scenes, while unstructured RGB predictions lack semantic grounding and remain biased by task-irrelevant backgrounds. To overcome these limitations, we introduce MaskWAM, an object-centric world-action model. By jointly integrating masks as both explicit inputs and predictions via a unified Mixture of Transformers (MoT), MaskWAM unlocks robust policy generalization. This design provides two key benefits: (1) predicting future masks yields object-centric semantic supervision that suppresses visual noise, significantly enhancing even standard text-conditioned WAMs; and (2) coupling this predictive supervision with first-frame visual prompts, such as target object masks, establishes a precise spatial anchor that substantially reduces language ambiguity. Crucially, as WAMs are inherently vision-driven architectures, direct mask conditioning yields substantially stronger guidance than text alone, establishing a precise and robust paradigm for manipulating unseen objects. Evaluations on LIBERO, RoboTwin, and real-world tasks demonstrate that MaskWAM significantly outperforms baselines in both language-clear and language-ambiguous tasks.", "pdf_url": "https://arxiv.org/pdf/2606.13515v1"}, {"title": "CloudCons: A Comprehensive End-to-End Benchmark for Cloud Resource Consolidation", "authors": ["Xiaobin Zhang", "Lefei Shen", "Mouxiang Chen", "Zhuo Li", "Hongkai Li", "Han Fu", "Jianling Sun", "Xiaoxue Ren", "Chenghao Liu"], "published": "2026-06-11", "summary": "Driven by conservative over-provisioning to guarantee service reliability, resource utilization in cloud data centers remains at low levels. To mitigate this, the forecast-then-optimize paradigm has emerged to optimize consolidation by anticipating future demands. While emerging time series foundation models promise to enhance this paradigm through zero-shot generalization, existing benchmarks focus solely on prediction error metrics. The actual decision utility of these advanced models remains unverified, rendering their practical value for downstream tasks uncertain. To bridge this gap, we propose CloudCons, a comprehensive end-to-end benchmark designed to evaluate forecasting models within the specific context of cloud resource consolidation. We build high-quality datasets that cover diverse workloads from Huawei Cloud, Microsoft Azure, and Google Borg, capturing distinct service characteristics ranging from synchronized diurnal rhythms to stochastic, pulse-like bursts and high-frequency noise. We conduct an extensive evaluation of statistical, deep learning, and foundation models. Our experiments reveal a pivotal finding: while foundation models demonstrate superior zero-shot forecasting accuracy, this advantage does not inherently translate into better decision utility. Of practical significance, we systematically analyze how the selection of predictive quantiles acts as a critical lever. We provide actionable guidelines for calibrating these selections to balance the trade-off between resource efficiency and service reliability, offering vital insights for real-world deployment decisions.", "pdf_url": "https://arxiv.org/pdf/2606.13513v1"}, {"title": "Heterogeneous LiDAR Early Fusion and Learned Re-Ranking Strategy for Robust Long-Term Place Recognition in Unstructured Environments", "authors": ["Judith Vilella-Cantos", "Juan José Cabrera", "Mónica Ballesta", "David Valiente", "Luis Payá"], "published": "2026-06-11", "summary": "Robust localization in unstructured environments, such as agricultural fields, is a critical challenge for autonomous systems. LiDAR sensors provide detailed 3D information about the environment and are invariant to lighting conditions. For this reason, LiDAR-based place recognition methods have gained significant attention. In this paper, we propose MinkUNeXt-VINE++, a novel approach that combines early fusion of heterogeneous LiDAR data from two sensors (Livox Mid-360 and Velodyne VLP-16) and a learned re-ranking strategy in inference time. This fusion leverages the strengths of each sensor to provide a more comprehensive representation of the environment. Additionally, the re-ranking approach is particularly important in repetitive environments, such as vineyards, as finding true positives is a major challenge. We evaluated our approach using the TEMPO-VINE dataset, which provides heterogeneous LiDAR data in vineyard environments across different phenological stages. Our results demonstrate that MinkUNeXt-VINE++ significantly improves place recognition performance compared to single-sensor approaches and state-of-the-art methods. MinkUNeXt-VINE++ achieves a 20% improvement in the Recall@1 metric compared to single-sensor approaches, and +30% including re-ranking. The code of our method is publicly available for reproduction.", "pdf_url": "https://arxiv.org/pdf/2606.13503v1"}, {"title": "SPARC: Reliable Spatial Annotations from Robot Demonstrations at Scale", "authors": ["Nils Blank", "Paul Mattes", "Maximilian Xiling Li", "Jakub Suliga", "Thomas Roth", "Moritz Reuss", "Pankhuri Vanjani", "Rudolf Lioutikov"], "published": "2026-06-11", "summary": "This work introduces Spatial Annotations from Robot Demonstrations with Reliability Calibration (SPARC), a risk-aware framework that automatically labels robot demonstrations with structured spatial annotations and assigns each annotation a reliability score. Structured spatial annotations, such as bounding boxes, object trajectories, and manipulation phase labels, benefit a broad range of robotics applications from training grounded robot policies and embodied foundation models to motion planning and hierarchical task composition. Existing automated pipelines generate such annotations at scale but provide no reliable quality signal: detector confidence is poorly calibrated for annotation correctness, forcing a choice between accepting noisy labels or discarding useful samples. In contrast to existing automated pipelines, SPARC leverages the spatio-temporal structure inherent to robot tasks to generate a reliability signal, reducing noisy labels and retaining more useful samples. We further introduce Interaction-Aware Bench (IA-Bench), a benchmark that measures model accuracy in grounding the locations of interacted objects in robot demonstrations. On 1.7k human-annotated demonstrations spanning diverse embodiments and scenarios, SPARC significantly outperforms detection-only baselines in localization accuracy while retaining three times more samples at high-precision operating points. Our experiments demonstrate that models finetuned on our annotations achieve state-of-the-art results on object-grounding and pointing benchmarks among similarly sized models, while remaining competitive on broader spatial-reasoning suites without manually verified or annotated training data. Furthermore, policies trained on SPARC-generated annotations outperform baselines in cluttered, visually ambiguous real-world scenes. Code, data, and models are available at intuitive-robots.github.io/sparc-labeling.", "pdf_url": "https://arxiv.org/pdf/2606.13497v1"}, {"title": "NavWAM: A Navigation World Action Model for Goal-Conditioned Visual Navigation", "authors": ["Daichi Azuma", "Taiki Miyanishi", "Koya Sakamoto", "Shuhei Kurita", "Yaonan Zhu", "Petr Khrapchenkov", "Motoaki Kawanabe", "Yusuke Iwasawa", "Yutaka Matsuo"], "published": "2026-06-11", "summary": "Goal-conditioned visual navigation requires a robot to act under partial observability by anticipating how its motion will change the future egocentric view and whether that change brings it closer to the goal. Navigation world models provide such visual foresight, but they remain prediction modules that require an external planner to convert predicted futures into closed-loop control. We propose Navigation World Action Model (NavWAM), a diffusion-transformer policy that turns navigation world-model prediction into executable action by representing future observations, goal-progress values, and action chunks in a shared latent sequence. By learning future prediction jointly with the action and value targets that determine closed-loop behavior, NavWAM makes visual foresight directly usable for robot control. We build NavWAM through simulation pretraining and real-robot adaptation, and evaluate it on image-goal navigation against planning-based world models and a representative direct navigation policy. Across offline benchmarks and closed-loop real-robot deployment, NavWAM improves over planning-based world-model baselines in our evaluations while using the default policy mode without CEM-style action search. Project page: https://dachii-azm.github.io/navwam/", "pdf_url": "https://arxiv.org/pdf/2606.13494v1"}, {"title": "Point-Wise Geometry-Aware Transformer for Partial-to-Full Point Cloud Registration in Computer-Assisted Surgery", "authors": ["Siyu Zhou", "Zhongliang Jiang"], "published": "2026-06-11", "summary": "Partial-to-full registration remains challenging due to varying overlap ratios, fluctuating point densities, and the presence of noise. While transformers have shown strong potential for point cloud processing, prior methods typically confine them to global context aggregation, overlooking fine-grained local geometry crucial for accurate correspondence. We propose \\emph{GAPR-Net}, a learning-based point cloud registration framework with a coarse-to-fine architecture that combines convolution and transformer modules, in which local and global information is fused between the partial and full point clouds using a cross-attention mechanism. To achieve this, a transformation-invariant point-wise geometric feature representation is proposed, which can robustly capture relative geometric features for individual points with respect to their neighboring points. To evaluate the effectiveness of the proposed approach, experiments are conducted on four geometrically distinct bones, including the tibia, femur, pelvis, and thoracic cartilage. The overall registration recall reaches 94.2\\%, the method results in a low RMSE of 1.992 mm and $R^2$ values of 0.908 and 0.974 for rotation and translation, respectively. The results demonstrate that the proposed method effectively addresses the partial-to-full point cloud registration problem. The proposed method enables highly accurate 3D point cloud registration using partial observation, providing a critical foundation for precise surgical navigation and robotic interventions in computer-assisted surgery. The code will be accessed after the double-blind review process.", "pdf_url": "https://arxiv.org/pdf/2606.13488v1"}, {"title": "VISA: VLM-Guided Instance Semantic Auditing for 3D Occupancy World Models", "authors": ["Ruiqi Xian", "Yuehan Xian", "Jing Liang", "Xuewei Qi", "Dinesh Manocha"], "published": "2026-06-11", "summary": "Semantic 3D occupancy provides a voxelized world state for autonomous driving and robot decision making, but object and rare-class errors can affect free-space interpretation, collision checking, and temporal state propagation. We show that a common VLM strategy, aligning 3D voxel or object features with crop-caption embeddings, improves text-space similarity without reliably improving closed-set occupancy mIoU. Motivated by this mismatch, we propose VISA, a training-time semantic auditing approach for existing occupancy world models. VISA queries an offline VLM on a representative crop of each physical object instance, obtains a structured audit with class hypotheses, plausible confusions, reliability, attributes, and evidence, and propagates it along the object track. The audit is grounded to matched 3D object voxels and distilled into semantic logits through reliability-weighted taxonomy, attribute-factor, and scene-level audit graph losses, while inference remains unchanged and requires no VLM. On nuScenes, averaged across three runs, VISA improves OccWorld from 19.06 to 20.05 mIoU and GaussianWorld from 21.36 to 21.91 mIoU; on GaussianWorld, object mIoU improves from 18.18 to 19.16 and rare-class mIoU from 15.60 to 16.79. These results suggest that VLMs are better suited to closed-set occupancy as reliability-aware semantic auditors than as generic caption-embedding targets.", "pdf_url": "https://arxiv.org/pdf/2606.13460v1"}, {"title": "From Traditional Automation to Embodied Wireless Intelligence: Vision-Language-Action Empowered Physics-Aware Communication Networks", "authors": ["Genze Jiang", "Kezhi Wang", "Xiaomin Chen", "Yizhou Huang"], "published": "2026-06-11", "summary": "Wireless network automation has progressed from rule-based self-organising networks (SON) to data-driven optimisation, yet existing systems remain fundamentally disembodied, optimising performance indicators without perceiving the physical environment that governs radio propagation. We propose the embodied intelligent empowered base station (eBS), a paradigm that adopts a Vision-Language-Action (VLA) pipeline to transform base stations into autonomous agents capable of situated perception, causal physical reasoning, and physics-aware action generation. The eBS employs a two-tier asynchronous architecture: a Semantic Planner powered by a frontier Vision-Language Model (VLM) generates structured action directives on human timescales, whilst a Tactical Controller executes real-time adaptation. Case studies demonstrate that a single VLA pipeline, without task-specific training, can perform zero-shot material reasoning, generalise across viewpoints, and predict dynamic events before signal degradation occurs, illustrating a paradigm shift from traditional rule-following network automation to embodied intelligence empowered future wireless networks.", "pdf_url": "https://arxiv.org/pdf/2606.13458v1"}, {"title": "GIVE: Grounding Human Gestures in Vision-Language-Action Models", "authors": ["Pengfei Liu", "Gen Li", "Junqiao Fan", "Boyu Ma", "Jindou Jia", "Yang Xiao", "Jianfei Yang"], "published": "2026-06-11", "summary": "Human communication is inherently multimodal, where language is often accompanied by non-verbal cues such as gestures to convey intentions. However, current Vision-Language-Action (VLA) models treat robotic manipulation as a pure text-driven task, overlooking the important role of gestures in Human-Robot Interaction (HRI). This often leads to inaccurate intent grounding and unreliable manipulation when language instructions are ambiguous or underspecified. To address this challenge, we propose GIVE (Gesture Intent via Visual-Semantic Enhancement), an effective approach that enhances pre-trained VLA models with human gesture understanding without architectural modifications. Specifically, GIVE incorporates gesture information through two complementary pathways: a visual pathway that overlays hand skeletons and fingertip rays onto robot observations for explicit object grounding, and a semantic pathway that generates high-level descriptions of human gestures and task instructions for robust intent grounding. By jointly leveraging visual and semantic guidance, GIVE enables VLA policies to better associate gestures with manipulation behaviors and adapt to dynamic interaction intents. In real-world HRI experiments, GIVE substantially outperforms the baseline, improving target object recognition accuracy by 40% and overall task success rate by 80%, while demonstrating strong robustness and generalization to unseen spatial layouts and diverse participants.", "pdf_url": "https://arxiv.org/pdf/2606.13435v1"}, {"title": "PolyFlow: Safe and Efficient Polytope-Constrained Flow Matching with Constraint Embedding and Projection-free Update", "authors": ["Jianming Ma", "Qiyue Yang", "Yang Zhang", "Liyun Yan", "Zhanxiang Cao", "Yazhou Zhang", "Yue Gao"], "published": "2026-06-11", "summary": "While flow-based generative models have demonstrated strong performance across a wide range of domains, deploying them in safety-critical physical systems remains challenging due to strict constraint requirements. Existing approaches typically enforce safety through post-hoc corrections, which incur substantial computational overhead and may distort the learned distribution. We propose PolyFlow, a polytope-constrained flow matching framework that embeds constraints directly into the model and flow dynamics. PolyFlow introduces a discrete-time flow formulation and a projection-free architecture, which eliminate the discretization error and guarantee strict satisfaction of arbitrary polyhedral constraints, without the need for expensive iterative solvers. Experimental results show that PolyFlow achieves zero constraint violation while maintaining high distributional fidelity across a range of planning and control tasks. Compared to state-of-the-art constrained generation baselines, PolyFlow significantly reduces inference latency and demonstrates a favorable trade-off between safety, efficiency, and generative quality. Code is available on https://github.com/MJianM/PolyFlow.", "pdf_url": "https://arxiv.org/pdf/2606.13400v1"}, {"title": "GeoHAT: Geometry-Adaptive Hybrid Action Transformer for Mobile Manipulation", "authors": ["Xiangyu Zhu", "Renjun Wu", "Luzhou Ge", "Jinyan Liu", "Xuesong Li"], "published": "2026-06-11", "summary": "Whole-body mobile manipulation requires coordinating mobile base and manipulator under shifting viewpoints, posing challenges in geometric perception and action generation. Current policies either rely on 2D features or sparse 3D representations that lack dense spatial structure, and typically encode arm and base within one action vector that ignores their distinct control demands. Moreover, existing dense fusion strategies risk corrupting pretrained representations under noisy depth while incurring heavy computational overhead. We present GeoHAT, an end-to-end diffusion-based framework built on a simple principle: geometry should be injected only where reliable and attended to only where needed. GeoHAT employs a lightweight Fourier spatial encoder that maps dense per-pixel 3D coordinates into geometric tokens without an additional 3D vision backbone. These tokens are then selectively injected into vision foundation model features through per-token gated fusion modulated by depth validity, preserving the semantic prior while enriching spatial understanding. For action generation, a Hybrid Whole-Body Action Decoder decomposes arm and base into distinct subspaces and lets each action modality attend to its task-relevant visual context through sparse cross-attention, while causal temporal modeling captures intra-timestep coordination and inter-timestep dependencies. Experiments on the ManiSkill-HAB simulation benchmark demonstrate that GeoHAT achieves a 79.3% mean success rate, surpassing the strongest baseline by 23.7%. Furthermore, real-world experiments on diverse tasks also confirm consistent improvements over all baselines.", "pdf_url": "https://arxiv.org/pdf/2606.13394v1"}, {"title": "Direct detection of cool molecular gas in a star-forming galaxy at $z=7.31$", "authors": ["Karin Cescon", "Jacqueline A. Hodge", "Leindert A. Boogaard", "Hiddo S. B. Algera", "Lucie E. Rowland", "Dominik A. Riechers", "Renske Smit", "Ilse De Looze", "Rychard Bouwens", "Paul van der Werf", "Manuel Aravena", "Elisabete da Cunha", "Pratika Dayal", "Andrea Ferrara", "Rebecca Fisher", "Hanae Inami", "Pavel E. Mancera Piña", "Pascal A. Oesch", "Andrea Pallottini", "Matus Rybak", "Sander Schouws", "Laura Sommovigo", "Mauro Stefanon", "Livia Vallini"], "published": "2026-06-11", "summary": "We investigate the molecular gas content and interstellar medium (ISM) conditions of REBELS-25, a massive, star-forming galaxy at $z=7.31$. Deep VLA Q-band and ALMA Band 3 observations reveal CO(3-2) and CO(7-6) emission (both at $\\sim3.5σ$), and provide an upper limit on [C I](2-1). From the CMB-corrected CO(3-2) flux-representing the highest-redshift detection of a low-$J$ CO transition to date-we derive a molecular gas mass of $M_{\\rm mol}=(1.0\\pm0.4)\\times10^{11}\\,(α_{\\rm CO}/(3\\,$M$_{\\odot}$(K$\\,$\\kms$\\,$pc$^2)^{-1}))\\,$M$_{\\odot}$, directly confirming the presence of a very massive gas reservoir only $\\simeq700\\,$Myr after the Big Bang. This implies an extreme gas fraction of $f_{\\rm gas}\\simeq0.95$, a gas-to-dust ratio of $δ_{\\rm GDR}\\simeq6\\times10^2$, and a depletion timescale of $τ_{\\rm dep}\\simeq1.2\\,$Gyr, broadly consistent with extrapolated scaling relations for main-sequence galaxies at lower redshift. Using the radiative transfer code TUNER, we self-consistently model CO and dust continuum emission in the context of the significant CMB background, constraining ISM properties and recovering $M_{\\rm mol}= (1.8^{+1.0}_{-0.9})\\times10^{11}\\,$M$_{\\odot}$, independent of assumptions about $r_{31}$ and $α_{\\rm CO}$. We further discuss the use of alternative molecular gas tracers at early epochs. Combining CO and [C II] measurements, we infer an empirical [C II]-to-H$_2$ conversion factor of $α_{\\rm [C II]}=(60\\pm25)\\,$M$_{\\odot}$/L$_{\\odot}$, suggesting [C II] remains a viable molecular gas tracer in the Epoch of Reionization. These results demonstrate the detectability of low-$J$ CO emission even at $z>7$, paving the way for next-generation facilities, and provide critical insights into the rapid mass assembly of galaxies during the first billion years of cosmic history.", "pdf_url": "https://arxiv.org/pdf/2606.13393v1"}, {"title": "MoVerse: Real-Time Video World Modeling with Panoramic Gaussian Scaffold", "authors": ["Yang Zhou", "Ziheng Wang", "Yuqin Lu", "Haofeng Liu", "Jun Liang", "Shengfeng He", "Jing Li"], "published": "2026-06-11", "summary": "We present MoVerse, a real-time video world model that creates an interactively navigable scene from a single narrow-field-of-view image. This setting is challenging because the input observes only a small fraction of the environment, while interactive roaming requires a complete surrounding world, persistent geometry, controllable camera motion, and temporally coherent high-fidelity observations. MoVerse addresses this problem by separating world construction from observation rendering. It first expands the input into a gravity-aligned 360$^\\circ$ panorama with topology-aware diffusion, closing the missing field of view before 3D reasoning. It then lifts the panorama into a persistent 3D Gaussian scaffold using panoramic geometry-aware residual prediction, yielding a dense and directly renderable spatial memory. Finally, a Gaussian-conditioned video renderer translates scaffold renderings along user-specified camera trajectories into photorealistic video. To make this renderer practical for interaction, we train a bidirectional diffusion teacher for high-quality conditional rendering and distill it into a causal autoregressive student for bounded-latency streaming. This design combines the controllability and long-range consistency of explicit 3D representations with the perceptual quality of generative video models. MoVerse supports real-time scene roaming at 8~FPS on a single NVIDIA RTX~4090 GPU, demonstrating a practical path toward single-image world creation with interactive video output.", "pdf_url": "https://arxiv.org/pdf/2606.13376v1"}, {"title": "Real-Time Execution with Autoregressive Policies", "authors": ["Sangkyu Lee", "Seohyeon Park", "Tackgeun You", "Avi Caciularu", "Idan Szpektor", "Hwasup Lim", "Youngjae Yu"], "published": "2026-06-11", "summary": "Real-time execution, enabled by asynchronous inference that ensures both smooth action trajectories and fast reactivity, is critical for realistic deployments of large-scale Vision-Language-Action models. However, recent work on real-time execution primarily focuses on variants of diffusion policies, even though it is more critical for autoregressive policies given their slower rollout speed in synchronous inference. In contrast, we demonstrate that autoregressive policies can achieve real-time execution by adjusting the tokenization horizon and applying constrained decoding, thereby guaranteeing strict latency bounds that enable multi-trajectory decoding to maximize performance. Across simulated and real-world environments, we find that the autoregressive policy consistently outperforms its equivalent-level flow-matching policy counterpart while achieving significantly improved task completion speeds from synchronous inference. Coupled with the inherent advantages of autoregressive policies, such as faster convergence and better generalizability in instruction-following, these results confirm that autoregressive policies can remain a competitive policy type supporting real-time execution.", "pdf_url": "https://arxiv.org/pdf/2606.13355v1"}, {"title": "Low cost, easily manufactured, highly flexible strain and touch sensitive fiber for robotics applications", "authors": ["Christian Diaz Herrera", "Srushti Raste", "Simin Liu", "Miles Modeste", "Jiyang", "Yin", "Katelyn McCall", "Yuxing Jared Yao", "Roopkamal Chahal", "Simon Chidley", "Trung Ha", "T. David Westmoreland", "Sonia Roberts"], "published": "2026-06-11", "summary": "Existing stretch and touch sensors for robots are generally expensive with respect to at least one of material costs, required manufacturing equipment, or manufacturing time. We present and experimentally characterize a conductive fiber made using only inexpensive commercial off-the-shelf parts (conductive thread at $0.07/ft, silicone tubing at $0.94/ft) and tools (loop-style needle threader at $2), which can be manufactured quickly (20 cm length in 2 minutes.) We demonstrate its use as a resistive strain sensor with three applications: Triggering a grasp in a pneumatically actuated assistive finger, sensing the pose of a pneumatically actuated robotic strap, and estimating the pose of a flexible solid. We also demonstrate that it can be used as a capacitive sensor with two applications: First, as a touch sensor which triggers a commercial robot arm to move, and second, as a near-field sensor enabling the robot arm to follow a moving hand. The capacitive sensors are knitted, showcasing the high flexibility of the fiber. We discuss methods for improving manufacturing scalability and their cost trade-offs. Finally, we demonstrate a method for repairing a cut fiber.", "pdf_url": "https://arxiv.org/pdf/2606.13352v1"}, {"title": "EMG-Based Adaptation of Anisotropic Virtual Fixtures for Robot-Assisted Surgical Resection and Dissection", "authors": ["Dario Onfiani", "Michael Dyck", "Luigi Biagiotti", "Julian Klodmann"], "published": "2026-06-11", "summary": "In this paper, we address the development of an adaptive assistance system for robot-assisted laparoscopic surgery, specifically for delicate tasks such as Resection and Dissection. Even if Virtual Fixtures offer significant advantages for guiding a surgeon's movements, conventional Virtual Fixtures are often defined by fixed geometries, lacking the flexibility to adapt to the surgical workflow or the surgeon's immediate intent. To address these limitations, we propose a novel framework for an adaptive and anisotropic virtual fixture. In addition, we introduce an intuitive control interface that modulates the fixture's geometry in real-time based on the surgeon's intent, inferred from EMG signals. This approach allows the surgeon to dynamically expand or disengage the constraint by contracting their forearm muscles, enabling seamless transitions between precise guided motion and free repositioning of the tool. Experimental results from a pilot user study, based on a standardized surgical training task, demonstrate the effectiveness of the proposed method. The system showed significant improvements in task accuracy and movement consistency, alongside a reduction in perceived cognitive load, effort, and frustration.", "pdf_url": "https://arxiv.org/pdf/2606.13340v1"}, {"title": "Masked and Predictive Self-Supervised Foundation Models for 3D Brain MRI", "authors": ["Esra Ergün", "Hersh Chandarana", "Dan Sodickson", "Gözde Ünal"], "published": "2026-06-11", "summary": "Self-supervised foundation models have shown strong promise in medical imaging. However, existing MRI foundation-model studies have primarily emphasized segmentation and dense prediction tasks, while systematic investigation of self-supervised foundation models for MRI-based disease detection remains limited. In this work, we investigate two major self-supervised pretraining paradigms for MRI-based disease detection: reconstruction-based learning via Masked Autoencoders (MAE) and predictive representation learning via Joint Embedding Predictive Architectures (JEPA). We study the role of auxiliary objectives by introducing a novel spectral-domain reconstruction loss for MAE to enhance sensitivity to fine-grained anatomical structure, and by integrating variance--covariance regularization (VCR) within our JEPA framework to encourage decorrelated latent representations. Our models are pretrained on heterogeneous single-contrast MRI volumes in a contrast-agnostic setting, without modality concatenation. Across five downstream disease detection tasks, our results highlight the importance of self-supervised objective design for medical foundation model pretraining, demonstrating that the downstream benefit of each objective is determined by its relevance to the task's structure. Specifically, spectral regularization yields the largest improvements when the downstream discriminative signal is characterized by strong high-frequency anatomical structures, while covariance regularization is most beneficial when discriminative information spans multiple decorrelated feature dimensions. MAE with spectral-domain supervision consistently achieves superior downstream performance for MRI-based disease detection. These findings suggest that self-supervised objectives in medical imaging encode specific biases, and their downstream benefit is fundamentally conditioned on the task's structure.", "pdf_url": "https://arxiv.org/pdf/2606.13315v1"}, {"title": "See Selectively, Act Adaptively: Dual-Level Structural Decomposition for Bimanual Robot Manipulation", "authors": ["Yoon-Ji Choi", "Young-Chae Son", "Soo-Chul Lim"], "published": "2026-06-11", "summary": "In bimanual robotic manipulation, task-relevant visual information varies with the task stage and context, while the interaction of the two arms shifts between independent and coordinated modes, making policy learning challenging. However, existing monolithic Vision-Language-Action (VLA) policies process diverse visual inputs and interaction patterns through a single shared representation and action generation pathway, often failing to separately account for visual relevance and bimanual interaction structure. To address this issue, we propose a bimanual manipulation VLA framework based on Dual-Level Structural Decomposition. The View-Selective Visual Router dynamically adjusts wrist-view contributions to emphasize relevant visual cues, while the Interaction-Aware Action Mixture-of-Experts (MoE) decomposes action generation into coordinated and arm-wise pathways to adapt to varying bimanual interaction modes. We evaluate the proposed method on six simulated bimanual manipulation tasks in RoboTwin 2.0 and three long-horizon real-world tasks. Our model improves the overall average success rate over a monolithic baseline by 27.7% in simulation and 43.3% in real-world evaluation, while consistently outperforming single-module variants across both settings. These results demonstrate that jointly considering selective visual processing and explicit decomposition of bimanual interaction structures provides an effective inductive bias for robust bimanual manipulation.", "pdf_url": "https://arxiv.org/pdf/2606.13279v1"}, {"title": "TimeLens: On-Device Artifact Recognition with Retrieval-Augmented Question Answering for the Grand Egyptian Museum", "authors": ["Rawan Hesham", "Ali Ashraf", "Amr Ahmed", "Malak Alaa", "Omar Ahmed", "Omar Wagih"], "published": "2026-06-11", "summary": "TimeLens is an AI-powered bilingual mobile guide for the Grand Egyptian Museum (GEM). Pointing a phone at an exhibit, a visitor sees the artifact recognized in real time and can ask follow-up questions answered in English or Arabic. The work addresses three problems specific to in-gallery deployment: fine-grained visual similarity among 51 catalogued artifacts (many near-identical Ramesside statues), the gap between curated training data and handheld camera conditions, and the risk of an AI guide stating unsupported historical facts. Two engineering contributions are reported. First, an on-device artifact detector was developed through a data-quality-driven iteration study -- from foundation-model auto-annotation (YOLO-World), through spatial label-cleaning rules, to a fully hand-annotated dataset -- isolating label quality as the decisive factor: the final YOLOv8n model resolves every previously failing class while remaining a 5.97 MB TensorFlow Lite asset that runs in real time on a mid-range phone (mAP@0.5 = 0.995, mAP@0.5:0.95 = 0.924). Second, a bilingual Retrieval-Augmented Generation (RAG) guide, grounded in a 108-record ChromaDB knowledge base, was benchmarked across seven candidate language models, with Gemma 4 E2B (Q4 K M) selected; ten targeted optimizations reduce end-to-end latency from over 30 s to approximately 10 s. Both subsystems are integrated in a production Flutter application with bilingual interface, museum location gating, and text-to-speech support.", "pdf_url": "https://arxiv.org/pdf/2606.13267v1"}, {"title": "Humor Style Drives Laughter, Topic Shapes Acceptability: Evaluating Bilingual Personal and Political Robot-Delivered AI Jokes", "authors": ["Anna-Maria Velentza", "Anne-Gwenn Bosser"], "published": "2026-06-11", "summary": "Humor plays a central role in human social relationships, and recent advances in computational humor create new opportunities for integrating humor into human-robot interaction (HRI). While large language models (LLMs) can generate diverse forms of humor, it remains unclear how humor style, joke content, and language preference shape perceptions of robot-delivered humor in group settings. In this exploratory study, we employed a mixed factorial design in which participants evaluated AI-generated jokes delivered by a robot in a university classroom. We examined the effects of humor type (Affiliative, Self-Enhancing, Aggressive, Self-Defeating) and joke content (person-related vs. political) on perceived funniness and appropriateness, as well as preferred language. Results show that humor type significantly influences funniness, with Aggressive and Affiliative humor rated higher, while joke content primarily affects appropriateness, with person-related jokes preferred over political ones. Language preference was shaped by both joke content and participants' self-reported fluency and humor practices.", "pdf_url": "https://arxiv.org/pdf/2606.13256v1"}, {"title": "WT-UMI: Tactile-based Whole-Body Manipulation via Force-Supervised Contact-Aware Planning", "authors": ["Jaehwi Jang", "Zhaoyuan Gu", "Alfred Cueva", "Zimeng Chai", "Junjie Sheng", "Thong Nguyen", "Himank Galundia", "Yifan Wu", "Huishu Xue", "Isaac Legene", "Ojas Mediratta", "Davin Doan", "Andrew Collins", "Sarah Sadegh", "KyoungMok Kim", "Rishita Dhalbisoi", "Zun Chen", "Ye Zhao"], "published": "2026-06-11", "summary": "Whole-body humanoid manipulation of bulky, deformable, and shared-load objects requires distributed contact sensing and explicit force regulation, yet most imitation policies treat contact force only implicitly. On the other hand, different demonstration sources provide complementary modalities with inherent trade-offs: human demonstrations capture natural contact forces but not robot-executable actions, while teleoperation directly records robot actions but with less natural force regulation. This paper presents \\textbf{WT-UMI}, a wearable whole-body tactile interface worn by human operators or mounted on humanoids, providing accurate observations of tactile images, contact forces, and end-effector poses across both human demonstration and humanoid teleoperation modes. We introduce a force-conditioned target-pose correction module that converts measured human poses into contact-aware robot targets by learning corrections from teleoperation data. To leverage the natural force interaction in human data, we propose a force-supervised planner that predicts end-effector pose chunks and contact-force trajectories. The predicted contact force serves as the reference for a tactile-based admittance controller. Across five contact-rich tasks spanning deformable objects, bulky rigid objects, and human--humanoid collaboration, WT-UMI improves success rate and reduces contact-position tracking error over four policy baselines. Our project page is available at https://wt-umi.github.io/WTUMI/.", "pdf_url": "https://arxiv.org/pdf/2606.13232v1"}, {"title": "Proprioceptive-visual correspondence enables self-other distinction in humanoid robots", "authors": ["Yurun Chen", "Tianyuan Gao", "Yizhong Ge", "Shikun Ban", "Yizhou Wang", "Hongkai Xiong", "Wenjun Zeng", "Wentao Zhu"], "published": "2026-06-11", "summary": "Distinguishing self from others is a prerequisite for social intelligence, yet humanoid robots that increasingly share workspaces with humans still lack this ability. Here we show that a humanoid robot can learn self-other distinction from proprioceptive-visual correspondence, without any identity labels or kinematic models. Once established, this distinction bootstraps a predictive self-model that maps joint configurations to three-dimensional body occupancy, capturing how the robot's body changes with action. In multi-agent scenes involving humans or morphologically identical robots, the system reliably identifies itself, learns a 3D self-model, and supports downstream tasks including target reaching, collision-aware motion planning, and human-to-robot motion retargeting. Together, these results outline a route toward bodily self-representation in robots that act and coordinate alongside others in shared physical environments. Project page: https://euron-zc.github.io/humanoid-self-model/.", "pdf_url": "https://arxiv.org/pdf/2606.13222v1"}, {"title": "Hallucination in Medical Imaging AI: A Cross-Modality Analytical Framework for Taxonomy, Detection, and Mitigation under Regulatory Constraints", "authors": ["Omar Alshahrani", "Muzammil Behzad"], "published": "2026-06-11", "summary": "AI systems are being deployed across medical imaging faster than their failure modes are understood. At this point in time, the failure of greatest clinical concern is hallucination: clinically plausible but factually incorrect outputs, including fabricated anatomical structures, missed findings, incorrect laterality, and invented measurements in generated reports, with direct consequences, for example, for biopsy decisions, staging, and treatment planning. This structured narrative synthesizes peer-reviewed studies, benchmark datasets, and FDA regulatory guidance across five imaging modalities to produce a cross-modality analysis of hallucination taxonomy, etiology, detection, and mitigation. Specifically, we address three questions in this study: (1) how can existing taxonomies be unified across modalities?, (2) how do medical-specialized foundation models hallucinate less than general-purpose ones?, and (3) which mitigation strategies are effective and compatible with FDA lifecycle oversight? We note that three taxonomic frameworks together cover the imaging pipeline in a way no single framework does alone. We also highlight that general-purpose foundation models outperform medical-specialized models on hallucination-specific benchmarks, indicating that narrow domain fine-tuning can introduce overfitting-induced confabulation. At the same time, the oversight of radiologists remains essential; for instance, a very high percentage of of AI-generated flags required expert correction before clinical use. Physics-informed architectural constraints, Chain-of-Thought prompting, and human-in-the-loop safeguards each address different failure modes and is effective when combined. All findings are mapped to the FDA's Total Product Lifecycle and Predetermined Change Control Plan frameworks, which treat hallucination management as a lifecycle obligation rather than a pre-deployment checklist.", "pdf_url": "https://arxiv.org/pdf/2606.13211v1"}, {"title": "Visual Place Recognition in Forests with Depth-Aware Distillation", "authors": ["Walter Nedov", "Saimunur Rahman", "Kavindie Katuwandeniya", "David Hall", "Kaushik Roy", "Peyman Moghadam"], "published": "2026-06-11", "summary": "Visual place recognition in natural forest environments remains challenging due to repetitive vegetation, weak structural cues, and significant appearance variation across traversals. To address this limitation, this paper proposes a lightweight depth-aware distillation framework that injects geometric cues into a DINOv2-based place recognition model, while maintaining its pre-trained descriptor space. Evaluated on the recent WildCross benchmark, the proposed approach yields gains over an appearance-only counterpart, providing robustness to appearance variations. These results demonstrate the importance of depth as a strong complementary modality for place recognition in natural environments and identify depth-aware distillation as a promising direction for more robust forest perception.", "pdf_url": "https://arxiv.org/pdf/2606.13206v1"}, {"title": "Embedding ISO 10218 Safety Compliance in Robots via Control Barrier Functions for Human-Robot Collaboration", "authors": ["Federico Parma", "Cesare Tonola", "Nicola Pedrocchi", "Manuel Beschi"], "published": "2026-06-11", "summary": "Human-Robot Collaboration (HRC) requires strict adherence to safety standards, such as ISO 10218, to prevent harmful interactions. Standard Speed and Separation Monitoring (SSM) filters calculate safe robotic speeds based on conservative assumptions, such as constant human velocity, which prevents accurate predictions of minimum separation distances and causes unnecessary operational halts. This paper proposes a Control Barrier Function (CBF) that explicitly incorporates human acceleration data to analytically forward-predict the minimum human-robot separation distance during a worst-case robotic stopping trajectory. To guarantee safety at the control level, this predictive CBF is integrated as an inequality constraint within a Sequential Quadratic Programming (SQP) framework. Specifically, two methods are proposed: Method I, a CBF-constrained PD safety filter; and Method II, a task-scaling SQP controller that enforces a spatial tube constraint. Simulated and real-world experiments on a UR10e robot evaluate the two proposed methods against a standard industrial SSM module baseline. Results demonstrate that Method II dynamically modulates execution speed and confines spatial deviations. Compared to Method I, Method II achieves a 63\\% reduction in mean trajectory error and avoids excessive evasive manoeuvres, ensuring high task throughput while complying with ISO 10218 SSM guidelines.", "pdf_url": "https://arxiv.org/pdf/2606.13203v1"}, {"title": "Under What Conditions Can a Machine Become Genuinely Creative?", "authors": ["Yong Zeng"], "published": "2026-06-11", "summary": "Recent AI systems can generate texts, software architectures, hypotheses, designs, and scientific workflows that appear creative. This paper asks under what conditions a machine can become genuinely creative, and how human agency can be preserved within shared cognitive and creative environments. It develops a requirement framework derived from Designics, the science of meaning-bearing intentional change. The paper argues that genuine machine creativity should not be defined by output novelty, current performance, or transient architecture alone. Instead, creativity is understood as the structural transformation of incomplete situations through recursive intervention dynamics. On this view, it depends on ten requirements: environment representation, scoped perception, conflict identification, intervention capability, consequence observation, knowledge and environment update, rescoping, local-to-global unfolding, value-based scoping, and human-AI co-living. These are organized through the three laws of Designics: perception, conflict, and capability. The paper illustrates the computational tractability of these requirements through selected cyber-physical and cyber-biological studies, including recursive element extraction, autonomous mesh generation, and neurophysiological and workload analysis. It then treats open-ended systems, automated discovery frameworks, self-modifying agents, foundation models, and agentic workflows as pressure cases: they demonstrate powerful generative means but do not by themselves establish genuine machine creativity. Finally, the paper argues that proactive AI ethics is internal to genuine machine creativity rather than an after-the-fact filter. Value-based scoping and human-AI co-living must shape how creative machines perceive environments, identify conflicts, select interventions, observe consequences, update knowledge, and rescope future action.", "pdf_url": "https://arxiv.org/pdf/2606.13196v1"}, {"title": "Reasoning for Mobile User Experience with Multimodal LLMs: Task, Benchmark, and Approach", "authors": ["Ruichao Mao", "Zhou Fang", "Teng Guo", "Hao Yang", "Yaping Li", "Shaohua Peng", "Maji Huang", "Xiaoyu Lin", "Shuoyang Liu", "Xuepeng Li", "Yuyu Zhang", "Hai Rao"], "published": "2026-06-11", "summary": "User experience (UX) centered on usability, perceived consistency, and functional clarity is fundamental to real-world user interfaces (UI). The application of multimodal large language models (MLLMs) in the field of user interfaces is evolving rapidly, such as visual element grounding, graphical user interface (GUI) agents, and design-to-code generation. However, research efforts on evaluating UX based on UI screenshots are still immature. To address this, we propose UXBench, a novel multimodal benchmark consisting of 2,000 VQA data samples designed to assess MLLMs' ability to perform UI-based reasoning. UXBench includes 8 tasks based on real-world UI screenshots that require fine-grained diagnosis of UX issues across layout relationships, visual hierarchy, and content consistency. Our extensive evaluation of mainstream MLLMs shows that they remain fundamentally limited in their capacity for UI-based reasoning. The results underscore the need for further advancements in this area. To bridge this gap, we propose UI-UX, an MLLM based on Qwen3-VL-4B-Thinking foundation model and enhanced via reinforcement learning with two key innovations: a reward routing mechanism that dynamically balances perceptual understanding and logical reasoning during inference, and an asymmetric transition reward that suppresses redundant or insufficient reasoning steps. Experiments demonstrate that UI-UX achieves state-of-the-art (SOTA) performance on UXBench, attaining an accuracy of 0.7963 -- surpassing Claude-4.5-Sonnet's 0.6550 -- while exhibiting strong generalization across diverse UI tasks and maintaining low inference latency.", "pdf_url": "https://arxiv.org/pdf/2606.13192v1"}], "repos": [{"repo": "wadeKeith/Awesome-Embodied-AI", "stars": 215, "language": "Python", "description": "Curated embodied AI list: surveys, VLA models, datasets, simulators, humanoids, robot learning, and safety resources.", "url": "https://github.com/wadeKeith/Awesome-Embodied-AI", "date": "2026-06-13", "topic": "robot-learning", "score": 86.1}, {"repo": "commaai/openpilot", "stars": 61354, "language": "Python", "description": "openpilot is an operating system for robotics. Currently, it upgrades the driver assistance system on 300+ supported cars.", "url": "https://github.com/commaai/openpilot", "date": "2026-06-13", "topic": "robotics", "score": 24541.7}, {"repo": "ArduPilot/ardupilot", "stars": 15272, "language": "C++", "description": "ArduPlane,
