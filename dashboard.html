<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Physical AI Intelligence Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
  /* ═══════════════ VARIABLES ═══════════════ */
  :root {
    --bg:#06090f; --glass:rgba(12,17,28,.58); --glass2:rgba(10,15,24,.72);
    --glass3:rgba(8,12,20,.88); --gb:rgba(255,255,255,.055);
    --gb2:rgba(255,255,255,.09); --blur:blur(22px) saturate(1.6);
    --blur2:blur(28px) saturate(1.4);
    --text:#e8f0fa; --t2:#9ab5cc; --t3:#5a7d96; --muted:#304d62;
    --sb:rgba(4,7,14,.92); --sb-text:#7aa0be; --sb-muted:#2e4a60;
    --sb-hover:rgba(255,255,255,.04); --sb-active:rgba(124,58,237,.14);
    --sb-active-t:#c4b5fd;
    --acc:#818cf8; --acc2:#6366f1; --acc3:#7c3aed;
    --apale:rgba(129,140,248,.12); --apale2:rgba(129,140,248,.2);
    --sh:0 4px 24px rgba(0,0,0,.4),0 1px 3px rgba(0,0,0,.3);
    --sh-md:0 8px 40px rgba(0,0,0,.5),0 2px 6px rgba(0,0,0,.35);
    --sh-lg:0 16px 60px rgba(0,0,0,.6),0 4px 12px rgba(0,0,0,.4);
    --r:14px; --rsm:9px; --rxs:7px;
    --c-all:#818cf8; --c-aiNews:#38bdf8; --c-physicalAiNews:#a78bfa;
    --c-roboticsNews:#fbbf24; --c-papers:#34d399; --c-repos:#60a5fa;
    --c-models:#fb923c; --c-funding:#a3e635; --c-companies:#f472b6; --c-jobs:#2dd4bf;
    --c-vla:#818cf8; --c-wam:#a78bfa; --c-robotPolicy:#2dd4bf;
    --c-rlPolicy:#fbbf24; --c-simulation:#60a5fa;
  }
  [data-theme="light"] {
    --bg:#f0f4f8; --glass:rgba(255,255,255,.92); --glass2:rgba(248,250,252,.96);
    --glass3:rgba(255,255,255,.98); --gb:rgba(0,0,0,.07); --gb2:rgba(0,0,0,.1);
    --blur:none; --blur2:none;
    --text:#0f172a; --t2:#334155; --t3:#64748b; --muted:#94a3b8;
    --sb:rgba(10,18,32,.96); --sb-text:#8ba5c4; --sb-muted:#2e4a60;
    --sh:0 1px 4px rgba(0,0,0,.07),0 2px 8px rgba(0,0,0,.05);
    --sh-md:0 4px 16px rgba(0,0,0,.1); --sh-lg:0 8px 32px rgba(0,0,0,.13);
    --acc:#6366f1; --acc2:#4f46e5; --acc3:#7c3aed;
    --apale:rgba(99,102,241,.08); --apale2:rgba(99,102,241,.16);
    --c-all:#6366f1; --c-aiNews:#0284c7; --c-physicalAiNews:#7c3aed;
    --c-roboticsNews:#d97706; --c-papers:#059669; --c-repos:#2563eb;
    --c-models:#ea580c; --c-funding:#65a30d; --c-companies:#db2777; --c-jobs:#0d9488;
    --c-vla:#6366f1; --c-wam:#7c3aed; --c-robotPolicy:#0d9488;
    --c-rlPolicy:#d97706; --c-simulation:#2563eb;
  }

  /* ═══════════════ RESET ═══════════════ */
  *,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
  html { scroll-behavior:smooth; }
  body {
    font-family:'Inter',ui-sans-serif,system-ui,sans-serif;
    background:var(--bg); color:var(--text); line-height:1.5; min-height:100vh;
    overflow-x:hidden;
  }
  a { color:inherit; text-decoration:none; }

  /* ═══════════════ BACKGROUND ═══════════════ */
  #bgCanvas {
    position:fixed; inset:0; z-index:0; pointer-events:none;
    width:100%; height:100%;
  }
  [data-theme="light"] #bgCanvas { opacity:.18; }

  .orb {
    position:fixed; border-radius:50%;
    pointer-events:none; z-index:0;
    filter:blur(90px); opacity:.22;
    animation:floatOrb 22s ease-in-out infinite;
  }
  .orb1 {
    width:600px; height:600px; top:-180px; left:-150px;
    background:radial-gradient(circle,#7c3aed 0%,transparent 70%);
    animation-duration:22s;
  }
  .orb2 {
    width:500px; height:500px; bottom:-100px; right:-120px;
    background:radial-gradient(circle,#0ea5e9 0%,transparent 70%);
    animation-duration:28s; animation-direction:reverse;
  }
  .orb3 {
    width:360px; height:360px; top:45%; left:55%;
    background:radial-gradient(circle,#6366f1 0%,transparent 70%);
    animation-duration:18s; opacity:.12;
  }
  [data-theme="light"] .orb { opacity:.04; }

  @keyframes floatOrb {
    0%,100% { transform:translate(0,0) scale(1); }
    25%      { transform:translate(40px,-30px) scale(1.05); }
    50%      { transform:translate(-25px,50px) scale(.96); }
    75%      { transform:translate(30px,20px) scale(1.03); }
  }

  /* ═══════════════ LAYOUT ═══════════════ */
  .layout {
    display:grid; grid-template-columns:268px minmax(0,1fr);
    min-height:100vh; position:relative; z-index:2;
  }

  /* ═══════════════ SIDEBAR ═══════════════ */
  .sidebar {
    background:var(--sb); backdrop-filter:var(--blur2);
    -webkit-backdrop-filter:var(--blur2);
    position:sticky; top:0; height:100vh;
    display:flex; flex-direction:column; overflow:hidden;
    border-right:1px solid var(--gb2);
    box-shadow:4px 0 40px rgba(0,0,0,.4);
    z-index:20;
  }
  .brand {
    padding:22px 18px 16px; flex-shrink:0;
    background:linear-gradient(180deg,rgba(124,58,237,.18) 0%,transparent 100%);
    border-bottom:1px solid rgba(124,58,237,.2);
  }
  .brand-row { display:flex; align-items:center; gap:12px; }
  .brand-logo {
    width:44px; height:44px; border-radius:12px; flex-shrink:0;
    background:linear-gradient(135deg,#7c3aed 0%,#4f46e5 100%);
    display:flex; align-items:center; justify-content:center; font-size:22px;
    box-shadow:0 0 24px rgba(124,58,237,.55),0 4px 14px rgba(0,0,0,.4);
  }
  .brand-name { font-size:14.5px; font-weight:800; color:#f0f6fc; letter-spacing:-.015em; }
  .brand-sub  { font-size:11px; color:var(--sb-text); margin-top:2px; }

  .nav-scroll { flex:1; overflow-y:auto; padding:8px 8px; }
  .nav-scroll::-webkit-scrollbar { width:0; }
  .nav-sec {
    font-size:9.5px; font-weight:700; letter-spacing:.09em; text-transform:uppercase;
    color:var(--sb-muted); padding:10px 10px 3px;
  }
  .nav-btn {
    display:flex; align-items:center; gap:9px; width:100%;
    border:none; background:transparent; color:var(--sb-text);
    font:inherit; font-size:13.5px; font-weight:500;
    padding:8px 10px; border-radius:9px; cursor:pointer;
    text-align:left; transition:all .15s; margin-bottom:2px;
    position:relative;
  }
  .nav-btn::before {
    content:''; position:absolute; left:0; top:50%;
    transform:translateY(-50%) scaleY(0);
    width:3px; height:65%; border-radius:0 3px 3px 0;
    background:var(--acc); transition:transform .2s cubic-bezier(.34,1.56,.64,1);
  }
  .nav-btn:hover { background:var(--sb-hover); color:#d0e4f4; }
  .nav-btn.active {
    background:var(--sb-active); color:var(--sb-active-t); font-weight:600;
    box-shadow:inset 0 0 0 1px rgba(129,140,248,.15);
    text-shadow:0 0 20px rgba(196,181,253,.4);
  }
  .nav-btn.active::before { transform:translateY(-50%) scaleY(1); }
  .nav-ico { font-size:15px; width:20px; text-align:center; flex-shrink:0; }
  .nav-lbl { flex:1; }
  .nav-cnt {
    font-size:10.5px; font-weight:700; padding:1px 7px;
    border-radius:999px; background:rgba(255,255,255,.05); color:var(--sb-muted);
  }
  .nav-btn.active .nav-cnt {
    background:rgba(129,140,248,.18); color:var(--sb-active-t);
  }

  .sb-foot {
    padding:12px 18px 14px; border-top:1px solid var(--gb);
    font-size:11px; color:var(--sb-muted); flex-shrink:0;
    display:flex; flex-direction:column; gap:3px;
  }
  .sb-foot strong { color:var(--t3); font-weight:600; }
  .refresh-bar {
    margin-top:8px; height:2px; border-radius:1px;
    background:rgba(255,255,255,.06); overflow:hidden;
  }
  .refresh-prog {
    height:100%; border-radius:1px;
    background:linear-gradient(90deg,var(--acc3),var(--acc));
    transition:width .5s ease;
  }

  /* ═══════════════ MAIN ═══════════════ */
  .main { min-width:0; display:flex; flex-direction:column; }

  /* ═══════════════ TOPBAR ═══════════════ */
  .topbar {
    background:var(--glass2); backdrop-filter:var(--blur);
    -webkit-backdrop-filter:var(--blur);
    border-bottom:1px solid var(--gb);
    padding:0 28px; height:64px;
    display:flex; align-items:center; justify-content:space-between; gap:14px;
    position:sticky; top:0; z-index:25;
    box-shadow:0 2px 20px rgba(0,0,0,.3);
  }
  .topbar::after {
    content:''; position:absolute; bottom:0; left:0; right:0; height:1px;
    background:linear-gradient(90deg,#7c3aed,#6366f1 35%,#0ea5e9 70%,transparent);
    opacity:.8;
  }
  .topbar-l { display:flex; align-items:center; gap:13px; min-width:0; }
  .pg-title {
    font-size:18px; font-weight:900; letter-spacing:-.025em;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    background:linear-gradient(135deg,var(--text),var(--acc));
    -webkit-background-clip:text; -webkit-text-fill-color:transparent;
    background-clip:text;
  }
  [data-theme="light"] .pg-title {
    background:linear-gradient(135deg,#0f172a,#6366f1);
    -webkit-background-clip:text; background-clip:text;
  }
  .upd-badge {
    font-size:11px; color:var(--muted); background:var(--glass);
    border:1px solid var(--gb); border-radius:999px;
    padding:3px 10px; flex-shrink:0; white-space:nowrap;
  }
  .topbar-r { display:flex; align-items:center; gap:7px; flex-shrink:0; }
  .btn {
    display:inline-flex; align-items:center; gap:5px;
    height:36px; padding:0 14px;
    border:1px solid var(--gb2); border-radius:var(--rsm);
    background:var(--glass); backdrop-filter:var(--blur);
    color:var(--t2); font:inherit; font-size:13px; font-weight:600;
    cursor:pointer; text-decoration:none; transition:all .15s; white-space:nowrap;
  }
  .btn:hover { background:var(--glass2); border-color:var(--acc); color:var(--text); box-shadow:0 0 12px rgba(129,140,248,.15); }
  .btn-acc {
    background:linear-gradient(135deg,var(--acc3),var(--acc2));
    border-color:transparent; color:#fff;
    box-shadow:0 2px 12px rgba(124,58,237,.4),0 0 0 1px rgba(129,140,248,.2);
  }
  .btn-acc:hover {
    background:linear-gradient(135deg,#6d28d9,var(--acc3));
    box-shadow:0 4px 20px rgba(124,58,237,.5); color:#fff;
    border-color:transparent;
  }
  .ico-btn { width:36px; padding:0; justify-content:center; font-size:16px; }

  /* ═══════════════ CONTENT ═══════════════ */
  .content { padding:22px 28px 52px; flex:1; }

  /* ═══════════════ STATS ═══════════════ */
  .stats {
    display:grid; grid-template-columns:repeat(4,minmax(0,1fr));
    gap:12px; margin-bottom:20px;
  }
  .stat {
    background:var(--glass); backdrop-filter:var(--blur);
    -webkit-backdrop-filter:var(--blur);
    border:1px solid var(--gb); border-radius:var(--r);
    padding:18px 20px 15px; position:relative; overflow:hidden;
    box-shadow:var(--sh);
    transition:transform .3s ease,box-shadow .3s ease;
    cursor:default; transform-style:preserve-3d;
  }
  .stat::before {
    content:''; position:absolute; top:0; left:0; right:0;
    height:2px; background:var(--sc,var(--acc));
    box-shadow:0 0 12px var(--sc,var(--acc));
  }
  .stat::after {
    content:''; position:absolute; inset:0;
    background:radial-gradient(ellipse at top left, rgba(var(--sc-rgb,129,140,248),.06), transparent 60%);
    pointer-events:none;
  }
  .stat-ico { font-size:24px; line-height:1; margin-bottom:10px; display:block;
               filter:drop-shadow(0 0 8px rgba(255,255,255,.2)); }
  .stat-lbl {
    font-size:10.5px; font-weight:700; letter-spacing:.06em;
    text-transform:uppercase; color:var(--t3);
  }
  .stat-num {
    font-size:28px; font-weight:900; letter-spacing:-.04em;
    color:var(--text); line-height:1; margin-top:5px;
  }

  /* ═══════════════ PANEL ═══════════════ */
  .panel {
    background:var(--glass); backdrop-filter:var(--blur);
    -webkit-backdrop-filter:var(--blur);
    border:1px solid var(--gb); border-radius:var(--r);
    box-shadow:var(--sh); overflow:hidden;
  }

  /* ═══════════════ TOOLBAR ═══════════════ */
  .toolbar {
    display:flex; align-items:center; gap:8px; flex-wrap:wrap;
    padding:12px 14px; border-bottom:1px solid var(--gb);
    background:var(--glass2);
  }
  .srch-wrap { position:relative; flex:1; min-width:200px; }
  .srch-ico {
    position:absolute; left:12px; top:50%; transform:translateY(-50%);
    font-size:13px; color:var(--muted); pointer-events:none;
  }
  .srch-inp {
    width:100%; height:38px;
    border:1px solid var(--gb2); border-radius:var(--rsm);
    padding:0 12px 0 34px; background:var(--glass);
    backdrop-filter:var(--blur); color:var(--text);
    font:inherit; font-size:13.5px;
    transition:border-color .15s,box-shadow .15s;
  }
  .srch-inp::placeholder { color:var(--muted); }
  .srch-inp:focus {
    outline:none; border-color:var(--acc);
    box-shadow:0 0 0 3px rgba(129,140,248,.15),0 0 12px rgba(129,140,248,.1);
  }
  .ctrl {
    height:38px; border:1px solid var(--gb2); border-radius:var(--rsm);
    padding:0 10px; background:var(--glass);
    backdrop-filter:var(--blur); color:var(--text);
    font:inherit; font-size:13px; cursor:pointer; flex-shrink:0;
    transition:border-color .15s;
  }
  .ctrl:focus { outline:none; border-color:var(--acc); }
  .vt { display:flex; border:1px solid var(--gb2); border-radius:var(--rsm); overflow:hidden; flex-shrink:0; }
  .vt-b {
    width:36px; height:38px; border:none;
    background:var(--glass); color:var(--muted); font-size:15px;
    cursor:pointer; display:flex; align-items:center; justify-content:center;
    transition:all .13s;
  }
  .vt-b:not(:last-child) { border-right:1px solid var(--gb2); }
  .vt-b.on { background:var(--acc3); color:#fff; box-shadow:inset 0 0 10px rgba(0,0,0,.2); }

  /* ═══════════════ RESULTS BAR ═══════════════ */
  .res-bar {
    display:flex; align-items:center; justify-content:space-between;
    padding:9px 16px; font-size:12.5px; color:var(--muted);
    border-bottom:1px solid var(--gb); background:var(--glass2);
  }
  .res-n { font-weight:700; color:var(--t2); }

  /* ═══════════════ FEED — GRID ═══════════════ */
  .feed.grid-v {
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
    gap:14px; padding:16px;
  }
  .feed.grid-v .fi {
    background:var(--glass); backdrop-filter:var(--blur);
    -webkit-backdrop-filter:var(--blur);
    border:1px solid var(--gb); border-top:2px solid var(--ic,var(--acc));
    border-radius:var(--r); padding:18px;
    box-shadow:var(--sh); cursor:pointer;
    transform-style:preserve-3d; will-change:transform;
    transition:transform .3s ease,box-shadow .3s ease;
    position:relative; overflow:hidden;
  }
  .feed.grid-v .fi::before {
    content:''; position:absolute; top:0; left:0; right:0; height:80px;
    background:linear-gradient(180deg,rgba(var(--ic-r,129,140,248),.06) 0%,transparent 100%);
    pointer-events:none;
  }
  .feed.grid-v .fi-stripe { display:none; }
  .feed.grid-v .fi-body { display:flex; flex-direction:column; height:100%; }
  .feed.grid-v .fi-hdr { margin-bottom:10px; }

  /* ═══════════════ FEED — LIST ═══════════════ */
  .feed.list-v .fi {
    padding:16px 20px; border-bottom:1px solid var(--gb);
    transition:background .12s; position:relative;
  }
  .feed.list-v .fi:last-child { border-bottom:none; }
  .feed.list-v .fi:hover { background:var(--glass2); }
  .feed.list-v .fi-wrap { display:flex; gap:14px; align-items:flex-start; }
  .feed.list-v .fi-stripe {
    width:3px; border-radius:3px; flex-shrink:0;
    align-self:stretch; min-height:40px;
    background:var(--ic,var(--acc));
    box-shadow:0 0 8px var(--ic,var(--acc));
    transition:width .15s;
  }
  .feed.list-v .fi:hover .fi-stripe { width:4px; }
  .feed.list-v .fi-body { flex:1; min-width:0; }
  .feed.list-v .fi-hdr {
    display:flex; align-items:flex-start;
    justify-content:space-between; gap:10px;
  }

  /* ═══════════════ ITEM SHARED ═══════════════ */
  .i-cat {
    display:inline-flex; align-items:center; gap:5px;
    font-size:10.5px; font-weight:700; padding:3px 9px;
    border-radius:999px; color:#fff; margin-bottom:8px;
    letter-spacing:.02em;
    box-shadow:0 2px 8px rgba(0,0,0,.3);
  }
  .i-title {
    font-size:14.5px; font-weight:700; line-height:1.42;
    color:var(--text); display:block; transition:color .13s;
  }
  .i-title:hover { color:var(--acc); }
  .i-score { flex-shrink:0; text-align:right; padding-top:2px; }
  .sc-val {
    font-size:19px; font-weight:900; letter-spacing:-.03em;
    color:var(--acc); line-height:1; display:block;
    text-shadow:0 0 20px rgba(129,140,248,.4);
  }
  .sc-lbl { font-size:10px; color:var(--muted); margin-top:2px; white-space:nowrap; }
  .i-authors {
    display:flex; flex-wrap:wrap; gap:4px;
    margin:6px 0 8px;
  }
  .au { font-size:11px; padding:2px 7px; border-radius:5px;
          background:rgba(255,255,255,.05); border:1px solid var(--gb2);
          color:var(--t3); font-weight:500; }
  [data-theme="light"] .au { background:var(--glass2); }
  .i-sum {
    font-size:13px; color:var(--t2); line-height:1.65;
    margin:6px 0 10px;
  }
  .i-tags {
    display:flex; flex-wrap:wrap; gap:5px; align-items:center;
    margin-top:auto; padding-top:10px;
  }
  .tag {
    display:inline-flex; align-items:center; font-size:11px; font-weight:600;
    padding:2px 9px; border-radius:999px; white-space:nowrap;
  }
  .t-d,.t-s {
    background:rgba(255,255,255,.05); border:1px solid var(--gb2); color:var(--t3);
  }
  [data-theme="light"] .t-d,[data-theme="light"] .t-s {
    background:var(--glass2); border-color:rgba(0,0,0,.09);
  }
  .i-acts { display:flex; gap:6px; margin-top:10px; flex-wrap:wrap; }
  .act {
    display:inline-flex; align-items:center; gap:4px;
    font-size:12px; font-weight:600; padding:5px 12px;
    border-radius:var(--rxs); border:1px solid var(--gb2);
    background:rgba(255,255,255,.04); color:var(--t2);
    text-decoration:none; cursor:pointer; transition:all .13s;
    backdrop-filter:var(--blur);
  }
  .act:hover { background:var(--glass2); color:var(--text); border-color:var(--muted); }
  .act-p {
    background:var(--apale); border-color:rgba(129,140,248,.25); color:var(--acc);
  }
  .act-p:hover {
    background:var(--acc2); border-color:var(--acc2); color:#fff;
    box-shadow:0 2px 12px rgba(99,102,241,.4);
  }

  /* ═══════════════ ENTRY ANIMATIONS ═══════════════ */
  @keyframes card3dIn {
    from { opacity:0; transform:perspective(800px) rotateX(-15deg) translateY(18px) scale(.97); }
    to   { opacity:1; transform:perspective(800px) rotateX(0deg) translateY(0) scale(1); }
  }
  .fi { animation:card3dIn .35s cubic-bezier(.22,1,.36,1) both; }
  .fi:nth-child(2)  { animation-delay:35ms; }
  .fi:nth-child(3)  { animation-delay:65ms; }
  .fi:nth-child(4)  { animation-delay:90ms; }
  .fi:nth-child(5)  { animation-delay:112ms; }
  .fi:nth-child(6)  { animation-delay:130ms; }
  .fi:nth-child(7)  { animation-delay:146ms; }
  .fi:nth-child(8)  { animation-delay:160ms; }
  .fi:nth-child(n+9) { animation-delay:172ms; }

  /* ═══════════════ EMPTY ═══════════════ */
  .empty {
    min-height:300px; display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    gap:14px; color:var(--muted); text-align:center; padding:40px 24px;
  }
  .empty-ico { font-size:56px; filter:drop-shadow(0 0 20px rgba(129,140,248,.3)); }

 /><p>Video Friday is your weekly selection of awesome robotics videos, collected by your friends at <em>IEEE Spectrum<\/em> robotics. We also post a weekly calendar of upcoming robotics events for the next few months. Please <a href=\"mailto:automaton@ieee.org?subject=Robotics%20event%20suggestion%20for%20Video%20Friday\">send us your events<\/a> for inclusion.<\/p><h5><a href=\"https://roboticsconference.org/\">RSS 2026<\/a>: 13–17 July 2026, SYDNEY<\/h5><h5><a href=\"https://mrs.fel.cvut.cz/summer-school-2026/\">Summer School on Multi-Robot Systems<\/a>: 29 July–4 August 2026, PRAGUE<\/h5><h5><a href=\"https://actuate.foxglove.dev/\">Actuate 2026<\/a>: 18–19 August 2026, SAN FRANCISCO<\/h5><p>Enjoy today’s videos!<\/p><div class=\"horizontal-rule\"><\/div><div><span style=\"display: none;\"> <\/span><\/div><p class=\"rm-anchors\" id=\"sqlsazqkgak\">It’s been a while since a humanoid robot video actually impressed me, but the beginning of this does. <\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>Hard to know how much of that recovery was luck, though.<\/p><p>[ <a href=\"https://www.deeprobotics.cn/en\">Deep Robotics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"24itn9kfhfs\"><em>When you’re very confident in your MPC-based balance controller...<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>I feel you, buddy. And thanks for posting this. We’ve all been there, in one way or another.<\/p><p>[ <a href=\"https://groups.cs.umass.edu/daros/sample-home-page/\">DARoS Lab<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"acfgwbab5ei\"><em>GENE01 designed from scratch and sent to batch production. Two scalable lower bodies. Physical AI deployed for motor control and world-action modeling. All in three months. Generative Bionics is running.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://gbionics.ai/\">Generative Bionics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"1o8te5fjsd0\"><em>Alex, the newest humanoid robot built entirely by ‪IHMCRobotics‬, takes its first steps outdoors! This was a significant milestone for our team, especially because Alex is the first humanoid robot developed entirely by IHMC Robotics to venture outside the lab. These outdoor trials were conducted in preparation for a demonstration in Maryland, where Alex later successfully walked completely untethered.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.ihmc.us/news20251119/\">IHMC<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"oxtcmmw63t4\"><em>Built on the Enlight platform, Flexiv Mico is a compact dual-arm system engineered for safe, seamless collaboration in any workspace.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://flexiv.com/product/robot-system\">Flexiv Robotics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"gvbyvkp6k5s\">Is it weird that I’m jealous that robots can have feet that are swappable?<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://bostondynamics.com/products/atlas/\">Boston Dynamics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"w4daoeu3aas\"><em>Midweek at ICRA 2026. Cable-climbing robots that work as a squad: CCRobot-S is a team of robots with reconfigurable cable-driven manipulation that collaboratively inspect and maintain long-span bridge stay cables. Parallel operation for speed, morphological reconfiguration for reach.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://ieeexplore.ieee.org/document/11196028/\">IEEE Transactions on Robotics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"2xajzq8v9p8\">I would love to know the story behind this odd choice of hat.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://github.com/ROBOTIS-GIT\" target=\"_blank\">Robotis <\/a>]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"qyy-bwbpxbi\"><em>How did Atlas learn football—and why? Go behind the scenes of <a href=\"https://spectrum.ieee.org/the-evolution-of-robot-soccer\" target=\"_blank\">School of Football<\/a> and discover a glimpse of the Next of robotics.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>What I really want to know is, what kinds of things is it possible to do in football (<a href=\"https://spectrum.ieee.org/video-friday-rabona-soccer\" target=\"_blank\">soccer<\/a>) when your robot’s joints are not constrained by biology?<\/p><p>[ <a href=\"https://bostondynamics.com/blog/can-football-teach-a-robot-to-move/\">Boston Dynamics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div>"}, {"title": "Video Friday: Extreme Omnidirectional Robot", "source": "IEEE Spectrum Robotics", "date": "2026-05-29", "url": "https://spectrum.ieee.org/video-friday-rabona-soccer", "summary": "<img src=\"https://spectrum.ieee.org/media-library/spherical-multi-legged-robot-walking-along-a-forest-trail.gif?id=66834857&amp;width=1245&amp;height=700&amp;coordinates=0%2C0%2C0%2C0\" /><br /><br /><p>Video Friday is your weekly selection of awesome robotics videos, collected by your friends at <em>IEEE Spectrum<\/em> robotics. We also post a weekly calendar of upcoming robotics events for the next few months. Please <a href=\"mailto:automaton@ieee.org?subject=Robotics%20event%20suggestion%20for%20Video%20Friday\">send us your events<\/a> for inclusion.<\/p><h5><a href=\"https://2026.ieee-icra.org/\">ICRA 2026<\/a>: 1–5 June 2026, VIENNA<\/h5><h5><a href=\"https://roboticsconference.org/\">RSS 2026<\/a>: 13–17 July 2026, SYDNEY<\/h5><h5><a href=\"https://mrs.fel.cvut.cz/summer-school-2026/\">Summer School on Multi-Robot Systems<\/a>: 29 July–4 August 2026, PRAGUE<\/h5><h5><a href=\"https://actuate.foxglove.dev/\">Actuate 2026<\/a>: 18–19 August 2026, SAN FRANCISCO<\/h5><p>Enjoy today’s videos!<\/p><div class=\"horizontal-rule\"><\/div><div><span style=\"display: none;\"> <\/span><\/div><p class=\"rm-anchors\" id=\"nd-i4ynqeuy\">What is the right number of legs for a robot? Two? Four? No, the answer is obviously all of them. All of the legs.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://generalroboticslab.com/Argus\">Argus<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"mccv90sunby\">Sigh, yet another skill that I as a soccer-playing human should have but a robot has instead: the rabona.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://bostondynamics.com/products/atlas/\">Boston Dynamics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"p5lywik6oba\"><em>Robots are rapidly becoming part of our everyday lives, from drones and industrial machines to home assistants and humanoid robots. As their presence continues to grow, an important question arises: How can we choose the right robot—not only in terms of performance and cost but also in terms of sustainability? <\/em><em>This video introduces the Eco‑Score for Robots, a new approach to evaluating the environmental impact of robotic systems. Just as eco-labels help consumers make informed choices in other industries, the Robotics Eco‑Label provides a clear and transparent way to assess how sustainable a robot truly is.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://roboticsecolabel.com/\">Robotics EcoLabel<\/a> ]<\/p><p>Thanks, Bram!<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"w5iw60q526k\">Uh oh, <a href=\"https://spectrum.ieee.org/yale-variable-friction-robot-fingers\" target=\"_blank\">five-fingered hands<\/a>.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.agilityrobotics.com/\">Agility<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"tapvn-tqpx0\"><em>Robotic manipulation has come a long way since the 1990s. We’ve gone from the two-ball paddle <a href=\"https://spectrum.ieee.org/juggling-robots-get-fancier\" target=\"_blank\">juggling robot <\/a>to AthenaZero, who can juggle barehanded using onboard vision feedback. By moving away from task-specific passive end-effectors such as cups or paddles and using multifingered hands, it can transition between a wide range of patterns including cascade, half-shower, tennis, shower, and box.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>There needs to be a robot circus show already.<\/p><p>[ <a href=\"https://rai-inst.com/resources/blog/bimanual-robot-for-dynamic-manipulation/\">Robotics and AI Institute<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"qvdgu1-ykxy\">Zero legs. One hat. $13K.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.astribot.com/en\">Astribot<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"-lgo5xqgvko\"><em>From its elegant design to the advanced technology powering every step, Luna is more than a machine—it’s a leap into the future.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://limxdynamics.com/en/products/luna\">LimX Dynamics<\/a> ]<\/p><p>Thanks, Jinyan!<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"g3pvccv00um\">You got a quadrotor in my quadruped! No, you got a quadruped in my quadrotor!<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://engineering.ontariotechu.ca/mars/index.php\">MARS Laboratory<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"tmi_h-ct5pk\"><em>A human hand, a robot’s arm—together tracing circles of trust and precision. No missteps. No hesitation. Just pure, algorithmic grace.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.ubtrobot.com/en/humanoid/products/walker-c\">UBTECH<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"qlsj3p87a4a\">Low-gravity planetary exploration with a quadruped just looks like fun.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.autonomousrobotslab.com/\">Autonomous Robots Lab<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"xwjssgdd5no\">Here it is, that robot Kool-Aid that everyone seems to be drinking. Including me!<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://generalistai.com/\">Generalist<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"6-prnhfdyfw\">Don’t shoot Mini Pupper!<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://mangdang.store/products/mp2\">MangDang<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"ofnlnztcwm4\"><em>We show here the ARISTO (Anthropomorphic, Robotic, Integrated-Sensing, Tendon-Operated) Hand. Developed in collaboration with Sony Group Corporation, this research platform is engineered to address the complex requirements of manipulating small, thin, and fragile objects.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://sites.utexas.edu/hcrl/\">University of Texas Human Centered Robotics Lab<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"3vbk_jzmagu\">Okay, but did you really have to call it the T800?<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://en.engineai.com.cn/product-t800\">EngineAI<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"p15of1ktjt4\"><em>Moby shows what useful mobile manipulation looks like in the real world: picking up, carrying, and placing adaptable payloads. The video shows payload handling across increasing crate loads, including a 50.3-pound load, while maintaining balance, control, and mobility. This is the kind of capability that matters outside the lab—moving real objects, in real spaces, with practical reliability.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.noblemachines.ai/\">Noble Machines<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"dqyojl69xdk\"><em>What does it take to make a robot look human? Harvard SEAS students Hailey Block, Henry Tavistock, and Evan Crowley created “Hollow Minds,” a pair of animatronic heads capable of speaking, blinking, tracking movement, and displaying lifelike facial expressions.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://seas.harvard.edu/electrical-engineering/courses\">Harvard University<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"jeejj42tkqu\">The longevity here is impressive, but the obvious question here is why the heck you’d ever do this task with a bipedal humanoid robot. It also doesn’t seem to have any error recovery, which is obviously fixable, but highlights the fact that real humans are versatile and humanoid robots are not.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.figure.ai/\">Figure<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"ydf1vzbzrgy\"><em>Kacper Nowicki, CEO and cofounder of Nomagic, recently sat down for a deep dive into the “humanoid vs. purpose-built” debate during a panel discussion at the Web Summit in Vancouver 2026.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://nomagic.ai/\">Nomagic<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div>"}, {"title": "Video Friday: Atlas Versus a Fridge", "source": "IEEE Spectrum Robotics", "date": "2026-05-22", "url": "https://spectrum.ieee.org/video-friday-humanoid-robot-learning", "summary": "<img src=\"https://spectrum.ieee.org/media-library/bipedal-humanoid-robot-does-one-legged-spinning-kick-in-a-brightly-lit-industrial-workshop.gif?id=66779183&amp;width=1245&amp;height=700&amp;coordinates=0%2C0%2C0%2C0\" /><br /><br /><p><span>Video Friday is your weekly selection of awesome robotics videos, collected by your friends at <\/span><em>IEEE Spectrum<\/em><span> robotics. We also post a weekly calendar of upcoming robotics events for the next few months. Please <\/span><a href=\"mailto:automaton@ieee.org?subject=Robotics%20event%20suggestion%20for%20Video%20Friday\">send us your events<\/a><span> for inclusion.<\/span><\/p><h5><a href=\"https://2026.ieee-icra.org/\">ICRA 2026<\/a>: 1–5 June 2026, VIENNA<\/h5><h5><a href=\"https://roboticsconference.org/\">RSS 2026<\/a>: 13–17 July 2026, SYDNEY<\/h5><h5><a href=\"https://mrs.fel.cvut.cz/summer-school-2026/\">Summer School on Multi-Robot Systems<\/a>: 29 July–4 August 2026, PRAGUE<\/h5><h5><a href=\"https://actuate.foxglove.dev/\">Actuate 2026<\/a>: 18–19 August 2026, SAN FRANCISCO<\/h5><p>Enjoy today’s videos!<\/p><div class=\"horizontal-rule\"><\/div><div><span style=\"display: none;\"> <\/span><\/div><blockquote class=\"rm-anchors\" id=\"xkk5ze3fukq\"><em>Just months after its debut, Atlas is proving why it is the world’s most capable and dynamic humanoid robot, ready for real work. Lifting a mini-fridge is a feat of strength, but the true breakthrough is in the underlying reinforcement learning and controls systems. The robot is learning to navigate real world adaptability: handling heavy objects by bracing and accounting for the mass and inertia; using whole-body control, not just hands to maneuver; and demonstrating superhuman range of motion and balance. This marks a critical shift in robotics where humanoids move beyond the lab and into dynamic industrial settings.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>Watching Atlas move a fridge may be less impressive than whatever the heck it does at 4:10.<\/p><p>[ <a href=\"https://bostondynamics.com/blog/training-a-humanoid-robot-for-hard-work/\">Boston Dynamics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"p0okuedzdg0\"><em>SpikerBot is a robot you teach by wiring neurons, not writing code. Drag spiking neurons in the app, connect them to sensors and motors, then press play. It moves, reacts, and changes behavior based on the brain you built.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>Already funded on Kickstarter with a robot kit starting at US $219.<\/p><p>[ <a href=\"https://www.kickstarter.com/projects/backyardbrains/spikerbot-build-a-brain-create-a-creature\">Kickstarter<\/a> ] via [ <a href=\"https://backyardbrains.com/\">Backyard Brains<\/a> ]<\/p><p>Thanks, Greg!<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"32qhuslr0gm\"><em>Wheeled-legged robots, which have wheels at their feet and achieve high mobility by coordinating wheel drive and leg drive, have been developed. In this paper, we address the problem of how to draw out the potential task-execution capability of the legs by freeing them from the roles of locomotion through external body support.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://shin0805.github.io/wixus/\">WiXus<\/a> ] from [ <a href=\"http://www.jsk.t.u-tokyo.ac.jp/\" target=\"_blank\">JSK Robotics Laboratory<\/a> ] via [ <a href=\"https://2026.ieee-icra.org/\" target=\"_blank\">ICRA 2026<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"olpxfcg2ibs\">A very clever idea for electronics-free, multi-dimensional touch sensing.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.nature.com/articles/s41467-026-72497-3\">Nature Communications<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"b-a8tb8ttii\"><em>Using external voice commands, G1 is directly controlled to generate a wide range of actions in real time. This video was recorded in a single take, with on‑site audio recording.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://shop.unitree.com/products/unitree-g1\">Unitree<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"5kdmlpvqvhk\"><em>Hummingbirds are impressive flyers, and advancements in high-speed photography, instrumentation, and measurement techniques have revealed much about their aerodynamics, flight behaviors, and wing and body kinematics. However, comparatively less is known about their natural flight dynamics, which is the relationship among a bird’s flight velocities, the control actions of its wings, and the acceleration of the bird in flight. To investigate this, at the <a href=\"https://spectrum.ieee.org/fly-like-a-fly\" target=\"_blank\">Advanced Vertical Flight Laboratory<\/a> we have designed, built, and flight tested a biomimetic robotic hummingbird on which is implemented the same techniques for flight control as observed in hummingbirds.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://avfl.engr.tamu.edu/\">Advanced Vertical Flight Laboratory<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"k115trhcuby\">I guess if you’re going to make a <a href=\"https://spectrum.ieee.org/quadruped-robot-benchmark-barkour\" target=\"_blank\">robot dog<\/a>, it’s only fair to give it the ability to frolic in the water.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.magiclab.top/en/\">MagicLab<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"e7ojml_wo_u\"><em>The original automated layout robot—the one that showed up when the construction industry was pretty sure robots were lame and then proved otherwise. It has printed millions of square feet of layout across thousands of projects. It built an entire category of construction technology. The category of: Stuff That Actually Does Helpful Work on Real Jobsites. But FieldPrinter 2 is here. It’s faster, tougher, smaller, and smarter. So for FieldPrinter 1, it’s time. Time for a quiet retirement. A mug. Maybe a plaque... But nay, good knight! Thou shalt expire in a blaze of thunderous glory!!<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.dustyrobotics.com/\">Dusty Robotics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"cyx8fbk9jeg\">Here’s an interesting idea for an inflatable <a href=\"https://spectrum.ieee.org/foldable-monocopter-drone\" target=\"_blank\">monocopter drone<\/a>.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://airlab.sutd.edu.sg/\">AIRLAB<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"6hrgihba3ro\"><em>Meet the Lynx S10—a compact all-terrain robot built to deliver industry-grade performance in a lightweight form factor under 20kg.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.deeprobotics.cn/en\">DE Robotics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"amovyq3hfpm\"><em>Noble Machines builds general-purpose robots for heavy industry, supporting people with the most hazardous and physically demanding tasks. Attendees at <a href=\"https://spectrum.ieee.org/nvidia-groq-3\" target=\"_blank\">NVIDIA GTC 2026 <\/a>witnessed the power of autonomous industrial work with Noble Machines Moby.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.noblemachines.ai/\">Noble Machines<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"_ulzzrpmlok\">I’m sorry, but Lego bricks should be for humans only.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://www.limxdynamics.com/en/products/tron2\">LimX Dynamics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"l_yqaxoi_bs\">Need a robot that can go places? Huskies were around way before legged humanoids, and I bet they’ll be around way after, too.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://clearpathrobotics.com/husky-a300-unmanned-ground-vehicle-robot/\">Clearpath Robotics<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><p class=\"rm-anchors\" id=\"8mflnicbyve\">I know this little dude is just a research platform at Disney, but I still want one to be my friend.<\/p><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://arxiv.org/abs/2605.15122\">Paper<\/a> ]<\/p><div class=\"horizontal-rule\"><\/div><blockquote class=\"rm-anchors\" id=\"l8owjwnnxug\"><em>In March 1982, General Motors announced a rapid and aggressive conversion to robotics. By 1990, GM wanted 14,000 robots in their factories doing everything from painting to welding to assembly. Nowadays, we dream of robots in the factories, doing everything end to end. In the dark. Lights out. Guess what? GM dreamed the same 40 years ago, and they spent an estimated US $60 billion to try to make it reality. In today’s video, we look at General Motors and their dreams of the automated, all-robot factory.<\/em><\/blockquote><p class=\"shortcode-media shortcode-media-youtube\"><span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><p>[ <a href=\"https://asianometry.passport.online/\">Asianometry <\/a> ]<\/p><div class=\"horizontal-rule\"><\/div>"}, {"title": "Open-Source Software Is Starting to Help Robots Think", "source": "IEEE Spectrum Robotics", "date": "2026-05-21", "url": "https://spectrum.ieee.org/open-source-robot-ai-platforms", "summary": "<img src=\"https://spectrum.ieee.org/media-library/a-smiling-emoji-with-red-eyes-and-a-grey-face-resembling-a-robot.jpg?id=66750560&amp;width=1245&amp;height=700&amp;coordinates=0%2C187%2C0%2C188\" /><br /><br /><p>When a group of academics <a href=\"https://spectrum.ieee.org/open-source-robotics-hardware-research-and-innovation\" target=\"_self\">started making open-source robotics hardware<\/a>, a generation of roboticists got years of their lives back. Now, the bigger challenge is getting robots to think—and that’s starting to be open sourced too.<\/p><p>The shift is still early, but companies including Hugging Face, Nvidia, and Alibaba have all made significant bets on open-source robotics in the last two years, releasing tools and models aimed at the higher-level work of getting robots to reason, decide, and act. <\/p><p><span>The open source movement that accelerated other AI applications is now being applied to the problem of making robots smarter. <\/span> If these attempts to bring AI to robotics with open-source platforms succeed, the barrier to building a capable robot could fall as fast as the barrier to building an AI application did.<\/p><h2>The world ROS built<\/h2><p>Open-source robotics software has been around since the mid-1990s, with early projects like Carnegie Mellon University’s <a href=\"https://www.ri.cmu.edu/project/inter-process-communication-package/\" target=\"_blank\">Inter-Process Communication package<\/a> and the <a href=\"https://playerstage.sourceforge.net/\" target=\"_blank\">Player Project<\/a> in the early 2000s laying the groundwork. But these were often tied to specific research groups, and the field remained fragmented. <\/p><p>The Robot Operating System, ROS, <a href=\"https://spectrum.ieee.org/the-origin-story-of-ros-the-linux-of-robotics\" target=\"_self\">changed that when it made its debut<\/a> in 2007. By bundling tools and attracting more users, it became the de facto standard. The story of open-source robotics, in many ways, starts there. <\/p><p>Despite its name, ROS is not actually an operating system. Rather, it is a software framework that sits on top of Linux and handles robotic fundamentals like moving data between components, talking to hardware, building maps, planning paths, and supporting developer tools, such as data logging and visualization. Before ROS, every robotics team wrote that infrastructure themselves. It often took a year or two before a lab could get to the research it actually cared about. <\/p><p><a href=\"https://brian.gerkey.org/\" rel=\"noopener noreferrer\" target=\"_blank\">Brian Gerkey<\/a>, who helped build ROS in the mid-2000s, says he was drawn to the project because of how much open source had already changed the world, pointing out that nearly the entire internet <a href=\"https://www.hbs.edu/ris/Publication%20Files/24-038_51f8444f-502c-4139-8bf2-56eb4b65c58a.pdf\" rel=\"noopener noreferrer\" target=\"_blank\">is built on it<\/a>. <\/p><p>“I’m a tool builder, and I like to share everything as openly as I possibly can, because I think that’s where we get the most impact out of what we build,” says Gerkey, board chair of Open Robotics and now CTO at <a href=\"https://www.intrinsic.ai/\" rel=\"noopener noreferrer\" target=\"_blank\">Intrinsic<\/a>, a robotics and AI unit of Google.<\/p><p>As it was developing, the AI community largely took the same approach, sharing research, models, and data openly, and the field accelerated faster than almost anyone predicted. Now some of those same advancements are arriving in robotics.<\/p><h2>Open-source AI for robotics<\/h2><p>Computer vision, once a hard problem, has advanced dramatically in just a few years, says <a href=\"https://www.linkedin.com/in/spencermhuang/\" rel=\"noopener noreferrer\" target=\"_blank\">Spencer Huang<\/a>, Nvidia’s director of product for robotics. What once required significant expertise can now be done in a few lines of code. Simulation tools have become accurate enough to be useful for training, and access to the tooling that once required a specialized lab is now widely available, much of it open source.<\/p><p>“To get into robotics, you no longer need a Ph.D.,” he says. The result is a much larger pool of people who can contribute, and the field is starting to look less like a specialized discipline and more like a platform that anyone can build on.<\/p><p>Nvidia has built out an open-source robotics stack that covers the full development pipeline. Its <a href=\"https://www.nvidia.com/en-us/ai/cosmos/\" rel=\"noopener noreferrer\" target=\"_blank\">Cosmos world models<\/a> generate synthetic training data and simulate physical environments. Its <a href=\"https://huggingface.co/blog/nvidia/gr00t-n1-7\" rel=\"noopener noreferrer\" target=\"_blank\">GR00T models<\/a> give robots the ability to reason through and execute complex tasks. And its <a href=\"https://developer.nvidia.com/isaac\" rel=\"noopener noreferrer\" target=\"_blank\">Isaac frameworks<\/a> handle the orchestration that ties training, simulation, and deployment together. Not everyone needs to train the robots from scratch, Huang says, and most people probably shouldn’t.<\/p><p>“If you gate pre-training, the field just never grows,” he says. “We should be able to provide a high-quality, state-of-the-art pre-trained model that anyone can go and take and fine tune for their own purposes.”<\/p><p>All of Nvidia’s open-source models live on Hugging Face, the open-source AI platform that has become the default place to share models and datasets. <a href=\"https://huggingface.co/lerobot\" rel=\"noopener noreferrer\" target=\"_blank\">Hugging Face launched LeRobot<\/a>, a community platform for robotics AI, in May 2024. Since its launch, the number of robotics datasets on the platform grew from 1,145 at the end of 2024 to more than 58,000 today, making it the single largest dataset category on the hub.<\/p><p>Hugging Face has also moved into hardware, acquiring robotics company <a href=\"https://www.pollen-robotics.com/\" rel=\"noopener noreferrer\" target=\"_blank\">Pollen Robotics<\/a>. The acquisition came from a realization that software alone was not enough, according to <a href=\"https://www.linkedin.com/in/clementdelangue/\" rel=\"noopener noreferrer\" target=\"_blank\">Clement Delangue<\/a>, Hugging Face’s CEO. The goal, as with the software, was to bring more people in.<\/p><p>The contributors to LeRobot include the biggest names in the industry, academic labs, and hobbyists building robots in their spare time. For instance, earlier this year, Alibaba <a href=\"https://arxiv.org/abs/2602.14979v1\" rel=\"noopener noreferrer\" target=\"_blank\">released RynnBrain<\/a>, an open-source foundation model for physical AI that the company claims outperforms comparable offerings from Google and Nvidia on benchmarks. That diversity of projects, Delangue says, is important. <\/p><p>“It is not just one model or one dataset or one hardware,” he says. “It is a lot of small contributions that everyone can be part of.”<\/p><h2>Commercial incentives muddle the field<\/h2><p>The stakes, Delangue says, go beyond convenience. A world where only a few proprietary systems control the robots in people’s homes is a concerning one. “Having robots at home that you don’t really understand, that you don’t really control, that a few people in Silicon Valley control is a scary thought,” he says. “Open source gives an alternative path.”<\/p><p>But getting there is not straightforward. The open sourcing happening now looks different from what produced ROS, which emerged largely from academics pooling their work with no commercial stake in the outcome. The biggest contributors today are companies with clear business reasons to want more people building on their platforms. That’s not necessarily a bad thing, says <a href=\"https://engineering.oregonstate.edu/people/bill-smart\" rel=\"noopener noreferrer\" target=\"_blank\">Bill Smart<\/a>, a professor at Oregon State University, in Corvallis, who was part of the early open-source robotics community. But the incentives are worth being aware of.<\/p><p>He also worries that the lowered barrier to entry has a downside. Researchers coming from AI without a robotics background are sometimes solving problems the field already solved. A newcomer might spend a week training a neural network to move a robot’s hand from one point to another, unaware that the same task can be accomplished with a few lines of code using decades-old techniques. The incentives are not always pointing in the same direction as the progress.<\/p><p>Smart is not without hope though. Whatever the motives behind the open sourcing, he says, the effect is real. More people are in the field than ever before, the tools are genuinely easier to use, and the community is bigger and more diverse than anything that existed when ROS was getting started. <\/p><p>“Anyone can make a robot move now,” he says. “As an old tech guy, that makes me happy and sad, because I’m no longer special.”<\/p>"}, {"title": "The Future of Physical AI Isn’t Smarter Robots, It’s Smarter Interfaces", "source": "IEEE Spectrum Robotics", "date": "2026-05-21", "url": "https://spectrum.ieee.org/wetour-robotics-physical-ai-human-interfaces", "summary": "<img src=\"https://spectrum.ieee.org/media-library/hands-controlling-speaker-light-bulb-and-drone-against-minimalist-white-walls.jpg?id=66718902&amp;width=1245&amp;height=700&amp;coordinates=160%2C0%2C160%2C0\" /><br /><br /><p><em>This sponsored article is brought to you by <a href=\"https://wetourrobotics.com/\" target=\"_blank\">Wetour Robotics<\/a>.<\/em><\/p><p>A field technician on a wind turbine, harness clipped, both hands on a wrench, needs to send a command to the diagnostic device hanging at her belt. A logistics worker on a loading dock, gloves on, eyes on the pallet, needs to redirect a connected lift. A person using an assistive mobility device on a crowded street wants to nudge it forward without taking out a phone or speaking aloud. None of these moments call for a smarter robot. They call for a smarter way to be heard by the machines that already exist.<\/p><h2>The industry has been building from one side<\/h2><p>The past three years of Physical AI have been a story of remarkable progress on the robot side of the loop. Companies like Boston Dynamics, Figure, and Unitree have advanced actuators, locomotion, and dexterity to a level that would have seemed implausible a decade ago. Google DeepMind’s Gemini Robotics has redefined what vision-language-action models can do in unstructured settings. The trajectory of the hardware and the foundation models is real, and it is accelerating.<\/p><p>But there is another side to this loop, and it has been treated as a solved problem for too long. The interface between humans and machines has defaulted, for 40 years, to three input modalities: screens, buttons, and voice. Each of those assumes the user can stop, look down, and translate intent into structured commands. That assumption breaks the moment the work moves into a real environment. On a turbine. On a dock. On a sidewalk. In any setting where hands are occupied, eyes are committed, or speaking is impractical, the conventional interface stack quietly fails.<\/p><p class=\"pull-quote\">Spatial Intent Fusion is the simultaneous processing of three streams of human-centered information, namely spatial position, visual context, and gestural intent: Your body is the interface.<br /><\/p><p>The bottleneck on the human side of the loop is becoming as important as the one on the machine side. And solving it requires a different question. Not how do we make the robot more capable, but how do we let the human participate in the computing system as naturally as the robot already does.<\/p><h2>Wetour Robotics’ bet: put the human back into the computing loop<\/h2><p><a href=\"https://wetourrobotics.com/\" target=\"_blank\">Wetour Robotics<\/a> is betting that the next architectural leap in Physical AI is not about making the robot more capable. It is about making the human a first-class node in the computing network, with the same kind of low-latency, high-fidelity participation that connected devices already enjoy.<\/p><p>Wetour Robotics’ engineers frame the problem this way: a wristband that recognizes a gesture is not enough. A camera that recognizes a scene is not enough. The information a human carries about what they are about to do is distributed across multiple channels, including where their body is in space, what their eyes are attending to, and what their muscles are preparing to do, and any single channel observed in isolation is ambiguous. Reconstructing intent reliably means fusing those channels at the operating system level, with latency low enough that the loop feels closed rather than mediated.<\/p><p>This approach has a name. Wetour Robotics calls it Spatial Intent Fusion: the simultaneous processing of three streams of human-centered information, namely spatial position, visual context, and gestural intent, fused into a single real-time command for any connected physical device. It is the technical implementation behind a simpler positioning statement the company uses externally: your body is the interface.<\/p><p class=\"shortcode-media shortcode-media-rebelmouse-image\"> <img alt=\"Sleek silver rectangular electronic device labeled \\u201cORCHESTRA\\u201d on a light gray background.\" class=\"rm-shortcode\" id=\"1af08\" src=\"https://spectrum.ieee.org/media-library/sleek-silver-rectangular-electronic-device-labeled-u201corchestra-u201d-on-a-light-gray-background.png?id=66718892&amp;width=980\" /> <small class=\"image-media media-caption\">Orchestra is a portable intelligent hub running the operating system that handles sensor fusion, intent inference, command translation, and safety arbitration. The reference compute platform is NVIDIA Jetson Orin Nano Super, which provides enough on-device inference capacity to keep the entire control loop at the edge, with no cloud dependency on the critical path. <\/small><small class=\"image-media media-photo-credit\">Wetour Robotics<\/small><\/p><h2>The architecture: three layers, four engines, one loop<\/h2><p>Orchestra is not a single device but a layered platform, designed from the start to be sensor-flexible and actuator-agnostic. The architecture decomposes into three perception layers and four coordination engines.<\/p><p><strong>Orchestra<\/strong> itself is the local compute and orchestration core: a portable intelligent hub running the operating system that handles sensor fusion, intent inference, command translation, and safety arbitration. The reference compute platform is NVIDIA Jetson Orin Nano Super, which provides enough on-device inference capacity to keep the entire control loop at the edge, with no cloud dependency on the critical path. Edge inference is non-negotiable for this application. Full-chain latency from biosignal acquisition to actuator command is held under 100 milliseconds, the envelope inside which closed-loop control feels natural rather than laggy.<\/p><p><strong>VisionLink<\/strong> handles visual and spatial perception. Cameras feed into vision models that identify objects, estimate distances, and track environmental context. VisionLink is designed not as a passive recognition layer but as a real-time command generator: its outputs feed directly into Orchestra OS to be fused with biosignal data.<\/p><p><strong>Conductor<\/strong> is the biosignal pipeline. It ingests raw surface electromyographic (sEMG) data from a wrist-worn device, classifies temporal patterns into discrete gestures or continuous control signals, and outputs actuator commands. The technically interesting property of sEMG for this use case is that the signal precedes visible motion. Motor unit action potentials appear at the skin surface roughly 50 to 80 milliseconds before a finger completes the corresponding gesture. Wetour Robotics calls this property pre-motion intent sensing, and it is what allows Orchestra to anticipate user intent rather than react to it.<\/p><p>On top of the three perception layers, Orchestra OS runs four coordination engines. The <strong>Perception Engine<\/strong> ingests and normalizes raw sensor streams. The <strong>Intent Engine <\/strong>performs Spatial Intent Fusion across modalities, resolving what the user is trying to do given where they are, what they are looking at, and what their hand is signaling. The <strong>Orchestration Engine<\/strong> translates intent into device-specific command sequences for any connected actuator. The <strong>Safety Engine<\/strong> arbitrates conflicting commands, enforces operational envelopes, and gates execution against runtime safety conditions.<\/p><p class=\"shortcode-media shortcode-media-youtube\"> <span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span><\/p><h2>The trade-offs we’re honest about<\/h2><p>No system that bridges the human body and the digital world is finished. Three engineering challenges remain open, and the company addresses each with a deliberate trade-off rather than a claim of having fully solved it.<\/p><p><strong>Baseline stability of sEMG under motion.<\/strong> In a stationary user, continuous gesture recognition from sEMG is reliable. Once the user is walking, climbing, or otherwise moving, motion artifacts and electrode drift degrade the signal in ways that are difficult to fully compensate for. Rather than overpromise on continuous control in dynamic settings, Orchestra defaults to a smaller set of robust discrete gestures in complex operating environments, and reserves continuous control modes for contexts where the signal-to-noise ratio supports them.<\/p><p><strong>Miniaturization of edge AI compute.<\/strong> Running the Orchestra control loop entirely at the edge requires real on-device inference, which has historically meant trading off between compute capacity, battery life, and form factor. Wetour Robotics’ approach has been a compact carrier board paired with a thermal design and a battery module sized for all-day wearability. The result is a hub that travels with the user rather than tethering them to a desk, and that performs the full perception-to-actuation loop without offloading to the cloud.<\/p><p><strong>Heterogeneity of third-party device protocols.<\/strong> The actuator side of the loop is a fragmented landscape. Different manufacturers expose different command interfaces, different communication stacks, and different safety conventions, and a Physical AI operating system has to integrate with all of them. Wetour Robotics uses an AI-agent layer to negotiate connection and protocol translation adaptively, so that Orchestra OS can ingest data from a wide range of devices, run them through neural network models that infer human intent, and emit the right command on the right protocol for the device on the other end.<\/p><h2>Why this matters, and why it helps the rest of the field<\/h2><p>The history of computing is a history of interface revolutions. Command lines gave way to graphical user interfaces, which gave way to touch, which gave way to voice. Each transition expanded who could participate in the system and what they could do with it. The next transition is not about a new screen or a new microphone. It is about treating the human body itself as a participant in the computing network, capable of contributing intent at the same speed and fidelity that any other connected node can.<\/p><p class=\"pull-quote\">The history of computing is a history of interface revolutions. The next transition is not about a new screen or a new microphone — it is about treating the human body itself as a participant in the computing network.<\/p><p>This path is not a competitor to the work being done on humanoid robots, foundation models for embodied AI, and dexterous manipulation. It is the missing complement to that work. The hardest open problem for humanoid systems is the data: every natural interaction between a human and the physical world is a potential training signal, and most of those interactions are currently invisible to any computing system. As more humans become first-class nodes in the loop, those interactions become observable, structured, and ultimately useful for training the next generation of embodied AI, including the humanoid robots being developed today.<\/p><p>In other words: putting the human back into the computing loop is not just about better interfaces for individual users. It is about generating the kind of grounded, in-the-wild human-machine interaction data that the broader Physical AI ecosystem will need to keep advancing. The robot side and the human side of the loop are not two competing futures. They are two halves of the same one.<\/p><p>That is what Wetour Robotics means when it says: <em>Your body is the interface.<\/em><\/p><p>Learn more at <a href=\"https://wetourrobotics.com/\" target=\"_blank\">wetourrobotics.com<\/a>.<\/p>"}, {"title": "Will Robotics Have a ChatGPT Moment?", "source": "IEEE Spectrum Robotics", "date": "2026-05-20", "url": "https://spectrum.ieee.org/robotics-ai-breakthrough", "summary": "<img src=\"https://spectrum.ieee.org/media-library/a-collection-of-5-robots-against-colored-backgrounds.jpg?id=66734221&amp;width=1245&amp;height=700&amp;coordinates=0%2C88%2C0%2C88\" /><br /><br /><p>Over the next few decades, billions of autonomous, AI-powered robots will work alongside people in factories, perform tedious tasks in warehouses, care for the elderly, <a href=\"https://spectrum.ieee.org/collections/darpa-subterranean-challenge/\" target=\"_blank\">assist in unsafe disaster areas<\/a>, deliver packages and food to our doorsteps, and eventually help out in our homes. Some will look like us, and many won’t. What is certain is that regardless of form factor, robots will all rely heavily on AI in order to deliver real-world value.<\/p><div class=\"rm-embed embed-media\"><\/div><p><span>In 2025, total investments in robotics companies reached <\/span><a href=\"https://www.cbinsights.com/research/report/venture-trends-2025/\" target=\"_blank\">a record US $40.7 billion, accounting for 9 percent of all venture funding<\/a><span>. The multibillion dollar question therefore is this: What will it take for AI-powered robots to begin to have a serious economic impact? Many of today’s robotics and AI companies are making bold claims, such as that humanoid robots will <\/span><a href=\"https://www.1x.tech/\" target=\"_blank\">soon be coming into our homes<\/a><span>, but there’s still a big gap between promise and reality.<\/span><\/p><p><span><\/span><span>The promise of robots that live and work alongside us has been the stuff of science fiction for a very long time. And while many programmers have tried to make that promise a reality, the physical world is just too complicated for traditional computer programs to handle the endless complexity it presents. Thanks to AI, robots are no longer being programmed—instead, they learn to operate in the real world. With enough practice, they can learn to perceive and understand the world around them, reason about that world, and use that reason and understanding to perform tasks that are useful, reliable, and safe.<\/span><\/p><p>The two of us have worked at the forefront of AI and robotics for the last decade, as a <a href=\"https://engineering.oregonstate.edu/people/jonathan-hurst\" target=\"_blank\">Professor in Robotics at Oregon State University<\/a> and <a href=\"https://www.agilityrobotics.com/about/leadership\" target=\"_blank\">Co-Founder of Agility Robotics<\/a>, and as <a href=\"https://www.linkedin.com/in/hanspeter/\" rel=\"noopener noreferrer\" target=\"_blank\">former CEO<\/a> of the <a href=\"https://everydayrobots.ai/\" rel=\"noopener noreferrer\" target=\"_blank\">Everyday Robots moonshot at Google X<\/a>. Our experience deploying AI-powered robots in real-world settings has given us a perspective on where AI can be used to great benefit in complex robotic systems in the near term and where we are still on the frontier of science fiction. We believe AI will enable an inflection point in robotics advances, but that it will be through the well-engineered application of coordinated systems of different AI tools rather than a single ChatGPT-style breakthrough.<\/p><p>As the excitement around AI is matched only by the uncertainty of what will be possible, here are five hard truths that will define AI in robotics.<\/p><h2>1. The YouTube-to-Reality Gap Is Real<\/h2><p>For years, we have been seeing videos on YouTube with humanoid robots performing amazing moves on everything from a dance floor to an obstacle course. The inside knowledge in robotics is to “never trust a YouTube robot video.” The gap between real robots that can perform real work in unstructured human environments and carefully scripted and edited robot performances remains significant. The latest performance to get a lot of attention was a <a href=\"https://www.youtube.com/watch?v=mUmlv814aJo\" rel=\"noopener noreferrer\" target=\"_blank\">martial arts show<\/a> featuring Unitree humanoid robots performing with children at the Chinese 2026 Spring Festival Gala. While impressive, this falls into a long lineage of tightly scripted robotic performances, where everything has been carefully choreographed and planned in advance. The low-level controls, synchronization, and choreography were stunning, yet the Spring Gala robot performance showed a level of autonomy and intelligence much closer to industrial robots building cars in a factory than something that will show up in your living room any time soon. <\/p><p class=\"shortcode-media shortcode-media-youtube\"> <span class=\"rm-shortcode\" style=\"display: block; padding-top: 56.25%;\"><\/span> <\/p><p><span>Seeing these kinds of demos nevertheless raises questions about where robotics really is. If robots can perform kung fu moves and do backflips and dance, why aren’t they also showing up on factory floors yet? And why can’t they do the dishes in my home after dinner? The simple answer is this: Making AI-powered robots capable of performing general tasks in varied human environments is still <\/span><em><em>really<\/em><\/em><span> hard. While impressive technological feats like those at the Spring Festival may make it look like we could be very close, the use of AI in these demos is only for low-level motor control (to keep the robots from falling over) and therefore is only a small part of the solution for robots to be general purpose in the real, unstructured spaces where we humans live and work.<\/span><\/p><h2>2. Data Is An Unsolved Challenge<\/h2><p>Large Language Models (LLMs) like OpenAI’s ChatGPT and Anthropic’s Claude were initially trained on an internet-scale database of text. The world woke up one day in late 2022 to ChatGPT demonstrating that AI computers could suddenly “speak” to us in prose or verse and about seemingly any topic. LLMs have turned out to generalize well and are now able to take multimodal input (text, images, video) and produce multimodal output. Importantly, the corpus of training data was both enormous and human-generated, which are characteristics that form the gold standard for AI training.<\/p><p class=\"shortcode-media shortcode-media-rebelmouse-image rm-float-left rm-resized-container rm-resized-container-25\" style=\"float: left;\"> <img alt=\"A series of four images, including robots working in a contained factory space, in an open indoor factory, outdoors in the real world delivering a package, and working with a human to move a couch in an apartment.\" class=\"rm-shortcode\" id=\"a0903\" src=\"https://spectrum.ieee.org/media-library/a-series-of-four-images-including-robots-working-in-a-contained-factory-space-in-an-open-indoor-factory-outdoors-in-the-real.jpg?id=66734272&amp;width=980\" /> <small class=\"image-media media-caption\">The fastest path to robots as part of everyday life may emerge through a range of robot forms performing increasingly sophisticated applications and employing a range of AI tools.<\/small><small class=\"image-media media-photo-credit\">Agility Robotics<\/small><\/p><p>Giving AI a body (in the form of a robot), so that it can engage with people in the physical world, continues to be a very difficult and broadly unsolved problem. AI models for general-purpose robotics must simultaneously satisfy multiple, often conflicting, physical, geometric, and temporal limitations while operating in unstructured, dynamic environments. In order to generalize, robot models need to be trained on data gathered in a high-dimensional configuration space, where “dimensions” represent text, lighting conditions, degrees of freedom, joint limits, velocities, force, and safety boundaries, just to mention a few. Importantly, this must be <em><em>good<\/em><\/em> data—it must contain many examples from what amounts to an infinite number of possible configurations in the physical world.<\/p><p>Since there are very few existing sources of data like this, approaches like teleoperation, video analysis, motion capture of humans, and self-exploration in simulation and in the real world are all seen as important ways to collect data. It’s a herculean task. For example, at Everyday Robots at Google X, we ran 240 million robot instances in our simulator over the course of 2022 to collect training data, mostly to train a trash-sorting model. Similar amounts of data will be needed for every skill to get to a similar level of capability, which is not yet human level.<\/p><h2>3. There Will Be No Single Robot AI<\/h2><p>We are far away from a moment where a single AI model might allow general-purpose robots to live and work alongside us. <\/p><p>General-purpose robots can have wheels or legs. They can have one, two, three, or more arms. Some have propellers and can fly, while others may be designed to operate under water. Some will drive on busy roads. The physical world is infinitely varied and complex. And then there are all the people and other animals that will be surrounding the robots. How do you train a model to operate a robot safely and reliably in all of these settings? The simple answer is: You don’t. At least not for quite some time.<\/p><p>We believe the winning AI architecture leading to the next big breakthroughs in general-purpose robotics will be “agentic AI” for robots, which are high-level coordinating models that can reason, plan, use tools, and learn from outcomes to execute complex tasks with limited supervision. Agentic, high-level models running on robots will invoke a system of specialized ones for different types of tasks. We will likely soon see multiple robots collaborating and coordinating with each other through their onboard agentic AI models.<\/p><p>AI tools are unlocking new and powerful capabilities in robotics, which in turn will enable new solutions and new markets. It’s encouraging to see these new models being made broadly available, some even as open-source solutions. This availability is akin to what happened with the internet: Real progress occurred when it became ubiquitous. We anticipate an inevitable democratization of complex behaviors in robotics with wide access to these AI tools and technologies.<\/p><h2>4. Hardware Is Still Very Hard<\/h2><p>Robots are complex systems with many parts that all need to work together with great precision. For a robot to be useful and safe, every part of it must be coordinated, from its perception systems to the computer controlling it, all the way down to its individual actuators.<\/p><p>Actuators—that is, the motors and gears—are a good example of an important part of the robot where what got us here won’t get us there. The actuators used at scale by most industrial robots will not work for robots that will operate in human environments. If these robots accidentally collide with an obstacle, the resulting impacts are harsh, forces are high, and things break. Humans don’t move in this way. We are far more compliant in how we interact with the world, and we’re constantly making contact with our environment an
